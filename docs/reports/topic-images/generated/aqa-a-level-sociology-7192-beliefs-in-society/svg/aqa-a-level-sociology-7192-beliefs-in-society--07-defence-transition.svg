<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 690" width="900" height="690" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="690" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Ethnicity and religiosity</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">why many minority ethnic groups show higher religiosity</text>
<text x="30" y="150" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Cultural defence (Bruce)</text><rect x="30" y="164" width="395" height="64" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="227.5" y="196.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">A community under threat</text><line x1="429" y1="196" x2="471" y2="196" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="475" y="164" width="395" height="64" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="672.5" y="196.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Religion unites it</text><text x="30" y="262" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Cultural transition (Bruce; Herberg on US immigrants)</text><rect x="30" y="276" width="246.66666666666666" height="151" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="153.33333333333331" y="341.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Migrants arrive</text><text x="153.33333333333331" y="371.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">newcomers need support</text><line x1="280.66666666666663" y1="351.5" x2="322.66666666666663" y2="351.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="326.66666666666663" y="276" width="246.66666666666666" height="151" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="449.99999999999994" y="308.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Religion helps them</text><text x="449.99999999999994" y="332.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">adjust</text><text x="449.99999999999994" y="362.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">a mosque, gurdwara or</text><text x="449.99999999999994" y="383.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Pentecostal church gives</text><text x="449.99999999999994" y="404.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">support and contacts</text><line x1="577.3333333333333" y1="351.5" x2="619.3333333333333" y2="351.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="623.3333333333333" y="276" width="246.66666666666666" height="151" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="746.6666666666666" y="341.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Religion declines</text><text x="746.6666666666666" y="371.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">as the group integrates</text><rect x="30" y="449" width="840" height="215" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="485" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Evaluation</text><circle cx="61" cy="508.39" r="4.5" fill="#8a6d0d"/><text x="74" y="514" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Pryce (1979):</tspan> Pentecostalism helped African-Caribbeans in Bristol cope with and adapt to</text><text x="74" y="536" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">life in Britain</text><circle cx="61" cy="560.39" r="4.5" fill="#8a6d0d"/><text x="74" y="566" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Modood et al. (1997):</tspan> later generations were generally less religious, which fits</text><text x="74" y="588" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">transition</text><circle cx="61" cy="612.39" r="4.5" fill="#8a6d0d"/><text x="74" y="618" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">O’Beirne (2004):</tspan> religion was central to many minority groups’ identity, so its role may</text><text x="74" y="640" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">shift rather than fade</text>
</svg>