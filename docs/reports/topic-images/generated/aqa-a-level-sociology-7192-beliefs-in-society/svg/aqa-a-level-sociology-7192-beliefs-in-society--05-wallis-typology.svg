<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 683" width="900" height="683" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="683" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Churches, denominations, sects and cults</text>

<text x="542" y="112" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">How the organisation sees itself</text><rect x="220" y="128" width="316" height="36" rx="10" fill="#b5d3cf"/><text x="378" y="152" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Uniquely legitimate</text><rect x="548" y="128" width="316" height="36" rx="10" fill="#b5d3cf"/><text x="706" y="152" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">One of many legitimate routes</text><text transform="translate(58,348) rotate(-90)" text-anchor="middle" font-size="19" font-weight="700" fill="#8a6d0d">How society sees it</text><rect x="78" y="172" width="134" height="170" rx="10" fill="#f2e7b8"/><text x="145" y="264" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Respectable</text><rect x="78" y="354" width="134" height="170" rx="10" fill="#f2e7b8"/><text x="145" y="446" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Deviant</text><rect x="220" y="172" width="316" height="170" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="238" y="210" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="start">Church</text><text x="238" y="242" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Large, bureaucratic, monopoly of</text><text x="238" y="263" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">truth, often linked to the state,</text><text x="238" y="284" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">recruits from all classes</text><rect x="548" y="172" width="316" height="170" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="566" y="210" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="start">Denomination</text><text x="566" y="242" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Niebuhr’s middle type, e.g.</text><text x="566" y="263" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Methodism; mainly accepts society,</text><text x="566" y="284" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">lighter demands</text><rect x="220" y="354" width="316" height="170" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="238" y="392" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="start">Sect</text><text x="238" y="424" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Small, exclusive, monopoly of</text><text x="238" y="445" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">truth, often hostile to society,</text><text x="238" y="466" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">high commitment, charismatic</text><text x="238" y="487" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">leader</text><rect x="548" y="354" width="316" height="170" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="566" y="392" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="start">Cult</text><text x="566" y="424" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Loose, individualistic, tolerant</text><text x="566" y="445" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">of other beliefs; members act more</text><text x="566" y="466" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">like customers</text><rect x="30" y="546" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="582" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Troeltsch and Niebuhr</text><text x="56" y="611" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The classic types describe each organisation’s features; Wallis adds how each sees itself</text><text x="56" y="633" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">and how society sees it.</text>
</svg>