<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 770" width="900" height="770" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="770" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">One situation, six different problems</text>

<rect x="30" y="120" width="280" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="154" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Identities and</text><text x="48" y="176" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">relationships</text><text x="48" y="210" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">friends split up by queue</text><text x="48" y="232" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and seating</text><line x1="320" y1="360" x2="314" y2="205" stroke="#4a5568" stroke-width="2.5"/><rect x="590" y="120" width="280" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="608" y="154" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Orientation in space and</text><text x="608" y="176" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">time</text><text x="608" y="210" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">queue and exit cross at one</text><text x="608" y="232" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">door in a 40-minute break</text><line x1="580" y1="360" x2="586" y2="205" stroke="#4a5568" stroke-width="2.5"/><rect x="30" y="320" width="280" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="354" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Personal and cultural</text><text x="48" y="376" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">expression</text><text x="48" y="410" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">food cultures missing from</text><text x="48" y="432" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the menu display</text><line x1="320" y1="420" x2="314" y2="405" stroke="#4a5568" stroke-width="2.5"/><rect x="590" y="320" width="280" height="170" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="608" y="354" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="start">Scientific and technical</text><text x="608" y="376" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="start">innovation</text><text x="608" y="410" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">slow ordering: the top</text><text x="608" y="432" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">complaint</text><line x1="580" y1="420" x2="586" y2="405" stroke="#8a6d0d" stroke-width="4"/><rect x="30" y="520" width="280" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="554" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Globalization and</text><text x="48" y="576" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">sustainability</text><text x="48" y="610" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">plate waste</text><line x1="320" y1="480" x2="314" y2="605" stroke="#4a5568" stroke-width="2.5"/><rect x="590" y="520" width="280" height="170" rx="14" fill="#fbeee6" stroke="#b5602e" stroke-width="2.5"/><text x="608" y="554" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Fairness and development</text><text x="608" y="610" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">counter too high for</text><text x="608" y="632" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">wheelchair users</text><line x1="580" y1="480" x2="586" y2="605" stroke="#4a5568" stroke-width="2.5"/><rect x="320" y="300" width="260" height="240" rx="18" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="342" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Design situation</text><text x="450" y="380" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Kestrel Hill canteen:</text><text x="450" y="402" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">crowded at lunch, long</text><text x="450" y="424" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">queues, food thrown</text><text x="450" y="446" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">away, lunch the worst</text><text x="450" y="468" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">part of the day</text><text x="450" y="745" font-size="15.5" font-weight="600" fill="#b5602e" text-anchor="middle">Chosen lens highlighted. The access problem needs new evidence: the survey never asked about it.</text>
</svg>