<rect width="900" height="680" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">One situation, six different problems</text>

<rect x="30" y="120" width="270" height="145" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="154" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Identities and</text><text x="48" y="176" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">relationships</text><text x="48" y="210" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">friends split up by queue</text><text x="48" y="232" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and seating</text><line x1="338" y1="275" x2="304" y2="192" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="600" y="120" width="270" height="145" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="618" y="154" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Orientation in space and</text><text x="618" y="176" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">time</text><text x="618" y="210" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">queue and exit cross at one</text><text x="618" y="232" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">door in a 40-minute break</text><line x1="562" y1="275" x2="596" y2="192" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="30" y="290" width="270" height="145" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="324" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Personal and cultural</text><text x="48" y="346" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">expression</text><text x="48" y="380" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">food cultures missing from</text><text x="48" y="402" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the menu display</text><line x1="338" y1="375" x2="304" y2="362" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="600" y="290" width="270" height="145" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="618" y="324" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="start">Scientific and technical</text><text x="618" y="346" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="start">innovation</text><text x="618" y="380" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">slow ordering: the top</text><text x="618" y="402" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">complaint</text><line x1="562" y1="375" x2="596" y2="362" stroke="#8a6d0d" stroke-width="4" marker-end="url(#ahO)"/><rect x="30" y="460" width="270" height="145" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="494" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Globalization and</text><text x="48" y="516" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">sustainability</text><text x="48" y="550" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">plate waste</text><line x1="338" y1="475" x2="304" y2="532" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="600" y="460" width="270" height="145" rx="14" fill="#fbeee6" stroke="#b5602e" stroke-width="2.5"/><text x="618" y="494" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Fairness and development</text><text x="618" y="550" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">counter too high for</text><text x="618" y="572" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">wheelchair users</text><line x1="562" y1="475" x2="596" y2="532" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="340" y="255" width="220" height="240" rx="18" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="297" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Design situation</text><text x="450" y="335" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Kestrel Hill</text><text x="450" y="357" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">canteen: crowded</text><text x="450" y="379" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">at lunch, long</text><text x="450" y="401" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">queues, food</text><text x="450" y="423" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">thrown away</text><text x="450" y="655" font-size="15.5" font-weight="600" fill="#b5602e" text-anchor="middle">Chosen lens highlighted. The access problem needs new evidence: the survey never asked about it.</text>
</svg>