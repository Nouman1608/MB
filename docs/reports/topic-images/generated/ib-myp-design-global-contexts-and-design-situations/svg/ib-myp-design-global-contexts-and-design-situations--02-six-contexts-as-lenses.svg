<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 745" width="900" height="745" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="745" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Six global contexts as design lenses</text>

<rect x="30" y="110" width="415" height="182" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="62" cy="144" r="18" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="62" y="150.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="92" y="151" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Identities and relationships</text><text x="52" y="192" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Who is the user? How does it affect how</text><text x="52" y="214" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">they see themselves or connect?</text><line x1="52" y1="238" x2="423" y2="238" stroke="#c9d6d4" stroke-width="2"/><text x="52" y="266" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start">evidence: interviews, user profiles</text><rect x="455" y="110" width="415" height="182" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="487" cy="144" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="487" y="150.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="517" y="151" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Orientation in space and time</text><text x="477" y="192" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">How do people move through a place</text><text x="477" y="214" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">or process? How has the need changed?</text><line x1="477" y1="238" x2="848" y2="238" stroke="#c9d6d4" stroke-width="2"/><text x="477" y="266" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start">evidence: route maps, timings, history</text><rect x="30" y="306" width="415" height="182" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="62" cy="340" r="18" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="62" y="346.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="92" y="347" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Personal and cultural expression</text><text x="52" y="388" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">What does it say about its user or</text><text x="52" y="410" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">community? Whose style does it carry?</text><line x1="52" y1="434" x2="423" y2="434" stroke="#c9d6d4" stroke-width="2"/><text x="52" y="462" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start">evidence: product aesthetics, feedback</text><rect x="455" y="306" width="415" height="182" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="487" cy="340" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="487" y="346.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="517" y="347" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Scientific and technical innovation</text><text x="477" y="388" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">What technology or material could</text><text x="477" y="410" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">solve this better than now?</text><line x1="477" y1="434" x2="848" y2="434" stroke="#c9d6d4" stroke-width="2"/><text x="477" y="462" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start">evidence: materials and software research</text><rect x="30" y="502" width="415" height="182" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="62" cy="536" r="18" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="62" y="542.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="92" y="543" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Globalization and sustainability</text><text x="52" y="584" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">What does it use and waste across its</text><text x="52" y="606" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">life? Who else in the world is affected?</text><line x1="52" y1="630" x2="423" y2="630" stroke="#c9d6d4" stroke-width="2"/><text x="52" y="658" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start">evidence: sources, energy, waste data</text><rect x="455" y="502" width="415" height="182" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="487" cy="536" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="487" y="542.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">6</text><text x="517" y="543" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Fairness and development</text><text x="477" y="584" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Who is excluded by current solutions?</text><text x="477" y="606" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Who can afford or access it?</text><line x1="477" y1="630" x2="848" y2="630" stroke="#c9d6d4" stroke-width="2"/><text x="477" y="658" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start">evidence: accessibility tests, cost comparisons</text><text x="450" y="720" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Marlbridge’s plain-English summary; the brief lists the contexts but does not define them.</text>
</svg>