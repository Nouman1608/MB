<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 655" width="900" height="655" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="655" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four checks for a context that does real work</text>

<rect x="30" y="110" width="840" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="54" y="135" width="40" height="40" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="74" y="165" font-size="26" font-weight="700" fill="#2e6b62" text-anchor="middle">✓</text><text x="118" y="150" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Does it change who I research?</text><text x="118" y="178" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">e.g. excluded users, or groups of friends rather than individuals</text><rect x="30" y="214" width="840" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="54" y="239" width="40" height="40" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="74" y="269" font-size="26" font-weight="700" fill="#2e6b62" text-anchor="middle">✓</text><text x="118" y="254" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Does it change what I will test?</text><text x="118" y="282" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">if not, it is a label, not a lens</text><rect x="30" y="318" width="840" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="54" y="343" width="40" height="40" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="74" y="373" font-size="26" font-weight="700" fill="#2e6b62" text-anchor="middle">✓</text><text x="118" y="358" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Can I get the evidence in time?</text><text x="118" y="386" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">full life-cycle data for imported parts may be too big: narrow it</text><rect x="30" y="422" width="840" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="54" y="447" width="40" height="40" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="74" y="477" font-size="26" font-weight="700" fill="#2e6b62" text-anchor="middle">✓</text><text x="118" y="462" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Is it at the heart of the need?</text><text x="118" y="490" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">pick what the evidence points to, not a context added at the end</text><rect x="30" y="530" width="410" height="100" rx="14" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.5"/><text x="52" y="566" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">✓ Two contexts fit?</text><text x="52" y="594" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">one main lens; mention</text><text x="52" y="616" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the other briefly</text><rect x="460" y="530" width="410" height="100" rx="14" fill="#fbeee6" stroke="#b5602e" stroke-width="2.5"/><text x="482" y="566" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">✗ All six at once</text><text x="482" y="596" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">spreads research too thin</text>
</svg>