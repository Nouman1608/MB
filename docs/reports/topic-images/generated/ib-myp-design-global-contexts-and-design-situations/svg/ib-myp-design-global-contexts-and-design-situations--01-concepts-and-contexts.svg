/><text x="83" y="508.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="111" y="509" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">Personal and cultural expression</text><rect x="455" y="478" width="390" height="50" rx="10" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><circle cx="483" cy="503" r="16" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="483" y="508.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="511" y="509" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">Scientific and technical innovation</text><rect x="55" y="540" width="390" height="50" rx="10" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><circle cx="83" cy="565" r="16" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="83" y="570.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="111" y="571" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">Globalization and sustainability</text><rect x="455" y="540" width="390" height="50" rx="10" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><circle cx="483" cy="565" r="16" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="483" y="570.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">6</text><text x="511" y="571" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">Fairness and development</text><rect x="30" y="630" width="840" height="76" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="664" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">The context is a lens, not a cover-page label: it picks the problem,</text><text x="450" y="688" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">who you research, and what success means when you test.</text>
