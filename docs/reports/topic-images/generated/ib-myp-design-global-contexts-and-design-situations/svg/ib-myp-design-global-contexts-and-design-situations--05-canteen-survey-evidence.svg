<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 675" width="900" height="675" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="675" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Kestrel Hill canteen: the first evidence</text>

<rect x="30" y="110" width="840" height="430" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="55" y="146" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Biggest lunchtime problem (120 students surveyed)</text><text x="285" y="196" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="end">Queue time</text><rect x="300" y="176" width="450" height="36" rx="4" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="760" y="201" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">54 (45%)</text><text x="300" y="234" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start">→ Scientific and technical innovation</text><text x="285" y="278" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="end">Food waste</text><rect x="300" y="258" width="250" height="36" rx="4" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="560" y="283" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">30 (25%)</text><text x="300" y="316" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start">→ Globalization and sustainability</text><text x="285" y="360" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="end">Nowhere to sit</text><text x="285" y="380" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="end">with friends</text><rect x="300" y="340" width="200" height="36" rx="4" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="510" y="365" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">24 (20%)</text><text x="300" y="398" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start">→ Identities and relationships</text><text x="285" y="442" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="end">Menu does not</text><text x="285" y="462" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="end">reflect my food</text><rect x="300" y="422" width="100" height="36" rx="4" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="410" y="447" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">12 (10%)</text><text x="300" y="480" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start">→ Personal and cultural expression</text><text x="450" y="520" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">percentage = students ÷ 120 × 100, e.g. 54 ÷ 120 × 100 = 45%</text><rect x="30" y="560" width="840" height="90" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="55" y="596" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Choice: queue time is the top complaint,</text><text x="55" y="624" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">so the main lens is Scientific and technical innovation.</text>
</svg>