<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 800" width="900" height="800" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="800" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">From design situation to problem statement</text>

<rect x="30" y="110" width="410" height="120" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="52" y="146" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="start">Design situation</text><text x="52" y="176" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">open and wide: a setting and a</text><text x="52" y="198" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">difficulty, not what to make</text><line x1="445" y1="170" x2="485" y2="170" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="490" y="110" width="380" height="120" rx="14" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.5"/><text x="512" y="146" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Problem statement</text><text x="512" y="176" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">narrow: one need, with evidence;</text><text x="512" y="198" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">never names the solution</text><rect x="30" y="255" width="230" height="90" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="145" y="295" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Who</text><text x="145" y="321" font-size="14.5" font-weight="400" fill="#1e2a44" text-anchor="middle">client or target audience</text><rect x="275" y="255" width="595" height="90" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="297" y="307" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">Students at Kestrel Hill School</text><rect x="30" y="359" width="230" height="90" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="145" y="399" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Need</text><text x="145" y="425" font-size="14.5" font-weight="400" fill="#1e2a44" text-anchor="middle">what they cannot do well</text><rect x="275" y="359" width="595" height="90" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="297" y="411" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">need a way to get their lunch faster,</text><rect x="30" y="463" width="230" height="90" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="145" y="503" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Evidence</text><text x="145" y="529" font-size="14.5" font-weight="400" fill="#1e2a44" text-anchor="middle">why it is real</text><rect x="275" y="463" width="595" height="90" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="297" y="501" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">because 45% of 120 students surveyed named queue time as</text><text x="297" y="525" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">the biggest problem,</text><rect x="30" y="567" width="230" height="90" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="145" y="607" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Constraints</text><text x="145" y="633" font-size="14.5" font-weight="400" fill="#1e2a44" text-anchor="middle">limits already known</text><rect x="275" y="567" width="595" height="90" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="297" y="619" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">within a budget the school sets and without extra staff.</text><rect x="30" y="680" width="840" height="96" rx="14" fill="#fbeee6" stroke="#b5602e" stroke-width="2.5"/><text x="52" y="716" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">✗ Not a problem statement</text><text x="52" y="746" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“Design an app for the canteen.” It names the solution and skips inquiry.</text>
</svg>