<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 655" width="900" height="655" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="655" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The context decides the questions and the tests</text>

<rect x="30" y="110" width="410" height="520" rx="14" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.5"/><text x="235" y="146" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">Scientific and</text><text x="235" y="170" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">technical innovation</text><rect x="460" y="110" width="410" height="520" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="665" y="146" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="middle">Other lenses,</text><text x="665" y="170" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="middle">same canteen</text><text x="55" y="210" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">RESEARCH QUESTIONS</text><text x="55" y="238" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">• ordering technologies elsewhere and</text><text x="55" y="260" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">  time per student (secondary)</text><text x="55" y="282" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">• time each queue stage: choose, pay,</text><text x="55" y="304" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">  collect; 30 students (primary)</text><text x="55" y="326" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">• what can technology change within</text><text x="55" y="348" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">  budget? (canteen manager interview)</text><text x="485" y="210" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">FAIRNESS AND DEVELOPMENT: RESEARCH</text><text x="485" y="238" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">• what counter height suits a</text><text x="485" y="260" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">  wheelchair user?</text><text x="485" y="282" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">• who cannot use a phone-based</text><text x="485" y="304" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">  system?</text><line x1="55" y1="390" x2="415" y2="390" stroke="#2e6b62" stroke-width="2"/><line x1="485" y1="390" x2="845" y2="390" stroke="#8a6d0d" stroke-width="2"/><text x="55" y="420" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">SUCCESS CRITERION AND TEST</text><text x="55" y="448" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">At least 90% of 30 testers served</text><text x="55" y="470" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">within 4 minutes (= 27 testers)</text><rect x="55" y="500" width="360" height="110" rx="10" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="235" y="532" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">average wait 11 → 7 min</text><text x="235" y="562" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="middle">4 ÷ 11 × 100 = 36.4% shorter</text><text x="235" y="590" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">report target and result</text><text x="485" y="420" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">GLOBALIZATION AND SUSTAINABILITY: TEST</text><text x="485" y="448" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">measure plate waste before and</text><text x="485" y="470" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">after, not waiting time</text><rect x="485" y="530" width="360" height="80" rx="10" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.2"/><text x="665" y="563" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">same situation, different context,</text><text x="665" y="585" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">different test</text>
</svg>