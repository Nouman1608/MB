<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" width="900" height="660" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="660" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked problem: Kemi’s repair shop</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Mixed area of shops and flats</text>
<rect x="30" y="124" width="840" height="240" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="60" y="174" width="300" height="140" rx="8" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.5"/><text x="210" y="164" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Kemi’s shop and yard</text><ellipse cx="250" cy="284" rx="14" ry="20" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><ellipse cx="284" cy="284" rx="14" ry="20" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><ellipse cx="318" cy="284" rx="14" ry="20" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="284" y="256" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">thinner drums</text><rect x="80" y="194" width="120" height="50" rx="6" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="140" y="225" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">compressors</text><line x1="450" y1="164" x2="450" y2="334" stroke="#1e2a44" stroke-width="4" stroke-dasharray="10 7"/><text x="450" y="154" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">fence</text><rect x="540" y="174" width="300" height="100" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="690" y="164" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Leo’s flat</text><text x="690" y="216" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Leo (owner)</text><text x="690" y="244" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Ana (lodger)</text><rect x="540" y="284" width="300" height="34" fill="#d8e3c6"/><text x="690" y="307" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">garden plants</text><path d="M370,204 a12,18 0 0 1 0,36" fill="none" stroke="#b5602e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><path d="M392,204 a20,26 0 0 1 0,52" fill="none" stroke="#b5602e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><path d="M414,204 a28,34 0 0 1 0,68" fill="none" stroke="#b5602e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="405" y="280" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">noise to</text><text x="405" y="298" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">midnight</text><path d="M330,306 Q450,329 560,302" fill="none" stroke="#8a6d0d" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="4 7"/><text x="450" y="350" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">leak seeps under the fence</text><rect x="30" y="382" width="413" height="117" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="45" y="409" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">NUISANCE: LEO ✓</text><text x="45" y="440" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Owner, so can sue. Noise to midnight near flats,</text><text x="45" y="460" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">continuing: likely unreasonable (<tspan font-style="italic">Halsey</tspan>). Running a</text><text x="45" y="480" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">trade is no defence</text><rect x="457" y="382" width="413" height="117" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="472" y="409" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">NUISANCE: ANA ✗</text><text x="472" y="440" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">A lodger has no proprietary interest: cannot sue</text><text x="472" y="460" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">(<tspan font-style="italic">Hunter</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Canary</tspan> <tspan font-style="italic">Wharf</tspan>)</text><rect x="30" y="511" width="413" height="117" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="45" y="538" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">RYLANDS: LEO ✓</text><text x="45" y="569" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Thinner accumulated; mischief if it escapes; bulk</text><text x="45" y="589" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">chemicals arguably non-natural (<tspan font-style="italic">Cambridge</tspan> <tspan font-style="italic">Water</tspan>;</text><text x="45" y="609" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Transco</tspan>); escape; plant damage foreseeable</text><rect x="457" y="511" width="413" height="117" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="472" y="538" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">REMEDIES</text><text x="472" y="569" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Damages for the plants; injunction limiting hours of</text><text x="472" y="589" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">noisy work</text>
</svg>