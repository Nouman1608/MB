<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 541" width="900" height="541" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="541" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Who can sue, and who can be sued?</text>

<rect x="30" y="140" width="380" height="103" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="168" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CAN SUE</text><text x="46" y="194.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">A proprietary interest in the land</text><text x="46" y="222.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">An owner or tenant</text><rect x="30" y="255" width="380" height="166" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="46" y="283" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">CANNOT SUE</text><text x="46" y="309.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">No interest in the land</text><text x="46" y="337.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Hunter</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Canary</tspan> <tspan font-style="italic">Wharf</tspan> (1997): family</text><text x="46" y="358.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">members of the owner could not sue; TV</text><text x="46" y="379.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">interference by a building’s presence not</text><text x="46" y="400.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">actionable</text><rect x="490" y="140" width="380" height="80" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="506" y="168" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">THE CREATOR</text><text x="506" y="199.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Whether or not they still occupy the land</text><rect x="490" y="232" width="380" height="164" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="506" y="260" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">THE OCCUPIER</text><text x="506" y="291.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Even for a trespasser’s or natural nuisance, if</text><text x="506" y="312.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">they know or ought to know and fail to act.</text><text x="506" y="333.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Sedleigh-Denfield</tspan> (1940): “adopted and</text><text x="506" y="354.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">continued” a trespasser’s pipe. <tspan font-style="italic">Leakey</tspan> <tspan font-style="italic">v</tspan></text><text x="506" y="375.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">National</tspan> <tspan font-style="italic">Trust</tspan> (1980): natural mound</text><rect x="490" y="408" width="380" height="101" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="506" y="436" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">A LANDLORD</text><text x="506" y="467.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Who authorised it, e.g. by letting for a</text><text x="506" y="488.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">purpose bound to cause it</text><text x="220" y="124" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">CLAIMANT</text><text x="680" y="124" font-size="19" font-weight="700" fill="#b5602e" text-anchor="middle">DEFENDANT</text><line x1="450" y1="100" x2="450" y2="509" stroke="#1e2a44" stroke-width="3" stroke-dasharray="10 8"/>
</svg>