<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">What is reasonable for ordinary people living in that locality</text>
<rect x="30" y="124" width="413" height="97" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="45" y="151" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">LOCALITY</text><text x="45" y="182" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Sturges</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Bridgman</tspan> (1879): confectioner’s machinery</text><text x="45" y="202" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">disturbing a doctor in a medical area</text><rect x="457" y="124" width="413" height="97" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="472" y="151" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DURATION AND TIMING</text><text x="472" y="182" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Halsey</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Esso</tspan> <tspan font-style="italic">Petroleum</tspan> (1961): acid smuts, smell</text><text x="472" y="202" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">and night-time lorry noise in a residential area</text><rect x="30" y="233" width="413" height="117" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="45" y="260" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">SENSITIVITY</text><text x="45" y="291" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Robinson</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Kilvert</tspan> (1889): unusually sensitive paper.</text><text x="45" y="311" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Now foreseeability: <tspan font-style="italic">Network</tspan> <tspan font-style="italic">Rail</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Morris</tspan> (2004),</text><text x="45" y="331" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">recording studio</text><rect x="457" y="233" width="413" height="117" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="472" y="260" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">MALICE</text><text x="472" y="291" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Christie</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Davey</tspan> (1893): banging to disrupt music</text><text x="472" y="311" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">lessons. <tspan font-style="italic">Hollywood</tspan> <tspan font-style="italic">Silver</tspan> <tspan font-style="italic">Fox</tspan> <tspan font-style="italic">Farm</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Emmett</tspan> (1936):</text><text x="472" y="331" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">guns fired near vixens</text><rect x="30" y="362" width="413" height="97" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="45" y="389" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">NEW FORMS</text><text x="45" y="420" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Fearn</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Tate</tspan> <tspan font-style="italic">Gallery</tspan> (2023): constant viewing into</text><text x="45" y="440" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">flats from a public platform</text><rect x="457" y="362" width="413" height="97" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="472" y="389" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">NOT AN ANSWER</text><text x="472" y="420" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Taking care: liability turns on the <tspan font-weight="700" fill="#1e2a44">result</tspan> for the</text><text x="472" y="440" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">neighbour, not careless conduct</text>
