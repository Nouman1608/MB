ap="round" /><text x="735" y="154" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Comfort and enjoyment</text><rect x="30" y="366" width="270" height="64" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="392" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Roots or branches crossing the</text><text x="44" y="412" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">boundary: usually straightforward</text><rect x="315" y="366" width="270" height="64" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="329" y="392" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Locality <tspan font-weight="700" fill="#1e2a44">not</tspan> <tspan font-weight="700" fill="#1e2a44">relevant</tspan> (<tspan font-style="italic">St</tspan> <tspan font-style="italic">Helen’s</tspan></text><text x="329" y="412" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Smelting</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Tipping</tspan>, 1865)</text><rect x="600" y="366" width="270" height="64" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="614" y="392" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Noise, smells, vibration, dust: the</text><text x="614" y="412" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">balancing</tspan> <tspan font-weight="700" fill="#1e2a44">factors</tspan> decide</text><text x="450" y="452" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">D: defendant’s land    ·    C: claimant’s land</text>
