<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 729" width="900" height="729" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="729" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Rylands v Fletcher (1868): five elements</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Strict liability: the defendants were not personally at fault</text>
<line x1="62" y1="144" x2="62" y2="541" stroke="#c9d6d4" stroke-width="4"/><rect x="110" y="124" width="400" height="74" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="123" y="152.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Brought onto land and accumulated</text><text x="123" y="179" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Not naturally occurring</text><rect x="526" y="124" width="344" height="74" rx="14" fill="#f8faf9" stroke="#c9d6d4" stroke-width="2.5"/><text x="539" y="155" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">✗ <tspan font-style="italic">Giles</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Walker</tspan> (1890): thistles grew</text><text x="539" y="175" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">naturally</text><circle cx="62" cy="161" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="168.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="110" y="207" width="400" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="123" y="233.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Likely to do mischief if it escapes</text><text x="123" y="260" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">High risk on escape, not necessarily dangerous in</text><text x="123" y="280" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">itself</text><rect x="526" y="207" width="344" height="90" rx="14" fill="#f8faf9" stroke="#c9d6d4" stroke-width="2.5"/><text x="539" y="246" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">✗ <tspan font-style="italic">Transco</tspan> (2003): council water pipe to</text><text x="539" y="266" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">flats</text><circle cx="62" cy="252" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="259.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="110" y="306" width="400" height="90" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="123" y="332.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Non-natural use</text><text x="123" y="359" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Extraordinary and unusual, exceptionally high risk</text><text x="123" y="379" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">(<tspan font-style="italic">Transco</tspan>)</text><rect x="526" y="306" width="344" height="90" rx="14" fill="#f8faf9" stroke="#c9d6d4" stroke-width="2.5"/><text x="539" y="345" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">✗ <tspan font-style="italic">Rickards</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Lothian</tspan> (1913): domestic water.</text><text x="539" y="365" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">✓ <tspan font-style="italic">Cambridge</tspan> <tspan font-style="italic">Water</tspan>: industrial chemicals</text><circle cx="62" cy="351" r="22" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="62" y="358.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="110" y="405" width="400" height="74" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="123" y="433.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Escape</text><text x="123" y="460" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">From land the defendant controls to land outside it</text><rect x="526" y="405" width="344" height="74" rx="14" fill="#f8faf9" stroke="#c9d6d4" stroke-width="2.5"/><text x="539" y="436" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">✗ <tspan font-style="italic">Read</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">J</tspan> <tspan font-style="italic">Lyons</tspan> (1947): shell exploded</text><text x="539" y="456" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">inside the factory</text><circle cx="62" cy="442" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="449.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="110" y="488" width="400" height="74" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="123" y="516.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Damage of a foreseeable type</text><text x="123" y="543" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">To land or property; no personal injury</text><rect x="526" y="488" width="344" height="74" rx="14" fill="#f8faf9" stroke="#c9d6d4" stroke-width="2.5"/><text x="539" y="519" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">✗ <tspan font-style="italic">Cambridge</tspan> <tspan font-style="italic">Water</tspan> (1994): borehole</text><text x="539" y="539" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">contamination not foreseeable</text><circle cx="62" cy="525" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="532.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><rect x="30" y="580" width="412" height="117" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="45" y="607" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">AFTER TRANSCO</text><text x="45" y="638" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">A sub-species of private nuisance: claimant needs an</text><text x="45" y="658" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">interest in land; no personal injury</text><rect x="458" y="580" width="412" height="117" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="473" y="607" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">STANNARD v GORE (2012)</text><text x="473" y="638" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Fire spread from a tyre business: tyres not</text><text x="473" y="658" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">exceptionally dangerous, and the fire, not the tyres,</text><text x="473" y="678" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">escaped</text>
</svg>