<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 525" width="900" height="525" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="525" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Planning permission and the locality</text>

<rect x="170" y="100" width="560" height="52" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="130.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Did the permission change the character of the locality?</text><line x1="330" y1="156" x2="230" y2="192" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="570" y1="156" x2="670" y2="192" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="214" y="186" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="end">yes</text><text x="686" y="186" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">no</text><rect x="30" y="210" width="405" height="150" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="240" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">GILLINGHAM v MEDWAY DOCK (1993)</text><text x="48" y="266.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">No nuisance</text><text x="48" y="295.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Naval dockyard became a commercial port:</text><text x="48" y="316.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">night-time lorry noise acceptable in the new</text><text x="48" y="337.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">locality</text><rect x="465" y="210" width="405" height="150" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="483" y="240" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">WHEELER v JJ SAUNDERS (1996)</text><text x="483" y="266.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Nuisance</text><text x="483" y="295.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Pig units did not change the locality: the smell</text><text x="483" y="316.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">was a nuisance</text><rect x="30" y="382" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="416.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Coventry v Lawrence (2014)</text><text x="50" y="446.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Planning permission is generally of <tspan font-weight="700" fill="#1e2a44">limited</tspan> <tspan font-weight="700" fill="#1e2a44">relevance</tspan> <tspan font-weight="700" fill="#1e2a44">to</tspan> <tspan font-weight="700" fill="#1e2a44">liability</tspan>, though it can matter to the</text><text x="50" y="468.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">remedy</tspan>.</text>
</svg>