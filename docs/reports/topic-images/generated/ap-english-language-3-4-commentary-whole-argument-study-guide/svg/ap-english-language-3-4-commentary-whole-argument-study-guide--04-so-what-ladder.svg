<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 671" width="900" height="671" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="671" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Ask “So what?” until you reach the thesis</text>

<rect x="30" y="96" width="560" height="94" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5" /><text x="44" y="124.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Evidence</text><text x="44" y="151.35999999999999" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">118 of 200 teenagers said the library was the only quiet place they</text><text x="44" y="172.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">could work.</text><path d="M594,143 C640,143 650,220 630,212" fill="none" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="100" y="206" width="560" height="72.88" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5" /><text x="114" y="234.4" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start" xml:space="preserve">So what?</text><text x="114" y="261.36" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">A quiet room is the condition of doing homework at all.</text><path d="M664,242.44 C710,242.44 720,308.88 700,300.88" fill="none" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="170" y="294.88" width="560" height="72.88" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5" /><text x="184" y="323.28" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start" xml:space="preserve">So what?</text><text x="184" y="350.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">Every hour the doors are shut is an hour of study taken from them.</text><path d="M734,331.32 C780,331.32 790,397.76 770,389.76" fill="none" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="240" y="383.76" width="560" height="72.88" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5" /><text x="254" y="412.15999999999997" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start" xml:space="preserve">So what?</text><text x="254" y="439.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">The library’s hours decide whether some pupils can keep up.</text><path d="M804,420.2 C850,420.2 860,486.64 840,478.64" fill="none" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="310" y="472.64" width="560" height="94" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="3" /><text x="324" y="501.03999999999996" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start" xml:space="preserve">Thesis reached</text><text x="324" y="528" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">The library is the one public place where people without money can</text><text x="324" y="549.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">belong.</text><rect x="30" y="586.64" width="840" height="74.24000000000001" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="450" y="618.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Rule of thumb for analytical writing: commentary should usually be <tspan font-weight="700">at</tspan> <tspan font-weight="700">least</tspan> <tspan font-weight="700">as</tspan> <tspan font-weight="700">long</tspan> as the evidence it</text><text x="450" y="639.36" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">explains.</text>
</svg>