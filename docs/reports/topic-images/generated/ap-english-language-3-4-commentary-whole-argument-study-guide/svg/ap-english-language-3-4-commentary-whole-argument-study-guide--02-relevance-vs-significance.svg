<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 622" width="900" height="622" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="622" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Relevance and significance</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Thesis: libraries are essential public places</text>
<rect x="30" y="242" width="260" height="120" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3" /><text x="160" y="282.36" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Evidence</text><text x="160" y="311.21" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">a count of evening visits</text><text x="160" y="333.65" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">by teenagers</text><rect x="470" y="122" width="400" height="100" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5" /><text x="670" y="163.57999999999998" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Paragraph claim</text><text x="670" y="192.42999999999998" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">young people rely on evening hours</text><rect x="470" y="382" width="400" height="100" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="670" y="423.58000000000004" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Thesis</text><text x="670" y="452.43" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">libraries are essential public places</text><path d="M292,282 C380,262 380,182 462,174" fill="none" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><path d="M292,322 C380,342 380,422 462,430" fill="none" stroke="#8a6d0d" stroke-width="4" marker-end="url(#ahO)"/><rect x="300" y="186" width="150" height="95.19999999999999" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5" /><text x="310" y="208.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700">Relevance</tspan></text><text x="310" y="228.55" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“Does it bear</text><text x="310" y="248.35" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">directly on the</text><text x="310" y="268.15" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">point?”</text><rect x="300" y="344" width="150" height="75.39999999999998" rx="14" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5" /><text x="310" y="366.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700">Significance</tspan></text><text x="310" y="386.55" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“So what for the</text><text x="310" y="406.35" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">thesis?”</text><rect x="30" y="512" width="840" height="95.36000000000001" rx="14" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5" /><text x="48" y="543.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">The count matters because it shows the library serves people who have <tspan font-weight="700">nowhere</tspan> <tspan font-weight="700">else</tspan> <tspan font-weight="700">to</tspan> <tspan font-weight="700">go</tspan>: the</text><text x="48" y="564.72" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">thesis’s central idea. Evidence can be relevant yet insignificant; choose evidence that is both, and <tspan font-weight="700">say</tspan></text><text x="48" y="585.84" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700">so</tspan>.</text>
</svg>