  <img src="https://img.marlbridge.com/ap-english-language-3-4-commentary-whole-argument-study-guide--01-three-questions-rings.webp" width="900" height="612" alt="Three nested rings: evidence at the centre, the paragraph’s claim around it, and the thesis and next step on the outside. Three questions match the rings: what does it show (explain), how does it support this paragraph’s claim (relevance), and why does it matter for the thesis (significance)." loading="lazy">

<!-- place after: ## Relevance and significance -->
<figure class="topic-figure">
  <img src="https://img.marlbridge.com/ap-english-language-3-4-commentary-whole-argument-study-guide--02-relevance-vs-significance.webp" width="900" height="622" alt="A count of teenagers’ evening visits connects by one arrow to the paragraph claim that young people rely on evening hours (relevance) and by another to the thesis that libraries are essential public places (significance), because it shows the library serves people with nowhere else to go." loading="lazy">
  <figcaption>Relevance links evidence to the paragraph; significance links it to the thesis.</figcaption>
</figure>

<!-- place after: ## Levels of commentary within an argument -->
<figure class="topic-figure">
  <img src="https://img.marlbridge.com/ap-english-language-3-4-commentary-whole-argument-study-guide--03-four-levels-of-commentary.webp" width="900" height="652" alt="A schematic essay of two body paragraphs and a conclusion, with commentary lines colour-coded and linked to four levels: evidence-level commentary right after the evidence, paragraph-level at the end of a paragraph, bridge-level linking to the next paragraph, and thesis-level in the conclusion. Each has the lesson’s example." loading="lazy">

<!-- place after: ## Techniques for keeping an argument connected -->
<figure class="topic-figure">
  <img src="https://img.marlbridge.com/ap-english-language-3-4-commentary-whole-argument-study-guide--04-so-what-ladder.webp" width="900" height="671" alt="A descending ladder starts from the survey figure (118 of 200 teenagers) and asks “So what?” three times: a quiet room is the condition of homework; shut hours take study away; the hours decide whether pupils keep up. It ends at the thesis that the library is the one place where people without money can belong." loading="lazy">

</figure>

  <img src="https://img.marlbridge.com/ap-english-language-3-4-commentary-whole-argument-study-guide--05-douglass-yours-mine.webp" width="900" height="623" alt="Two columns split Douglass’s sentences between the audience and the speaker: “yours” and “not mine”, “you may rejoice” and “I must mourn”, an inheritance “shared by you, not by me”, and sunlight bringing “life and healing” to them but “stripes and death” to him. Below, how the contrast serves relevance, significance and the speech’s driving question." loading="lazy">
