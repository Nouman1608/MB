<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 690" width="900" height="690" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="690" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Learning English as an additional language</text>

<rect x="30" y="120" width="210" height="90" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="135" y="160" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">First</text><text x="135" y="186" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">language</text><line x1="244" y1="165" x2="300" y2="165" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="306" y="112" width="288" height="106" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="148" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Interlanguage</text><text x="450" y="174" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">the learner’s developing</text><text x="450" y="196" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">system, with its own rules</text><line x1="598" y1="165" x2="654" y2="165" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="660" y="120" width="210" height="90" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="765" y="160" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Target:</text><text x="765" y="186" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">English</text><text x="450" y="100" font-size="16" font-weight="600" fill="#4a5568" text-anchor="middle">Selinker (1972)</text><path d="M135,214 Q135,270 300,262" fill="none" stroke="#8a6d0d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><line x1="300" y1="262" x2="340" y2="222" stroke="#8a6d0d" stroke-width="3" marker-end="url(#ahO)"/><text x="135" y="290" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">Transfer: articles, word order,</text><text x="135" y="310" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">sounds; can also help</text><rect x="560" y="250" width="310" height="66" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="580" y="278" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Overgeneralisation too:</text><text x="580" y="302" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">“He goed home” (adult learner)</text><rect x="30" y="340" width="270" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="376" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Krashen</text><text x="50" y="400" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">comprehensible input</text><rect x="60" y="520" width="90" height="40" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="105" y="546" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">current</text><rect x="160" y="480" width="110" height="80" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="215" y="515" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">slightly</text><text x="215" y="534" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">beyond</text><text x="50" y="432" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">input understandable but</text><text x="50" y="452" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">slightly beyond the level;</text><text x="50" y="472" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">silent period common</text><rect x="315" y="340" width="270" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="335" y="376" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Cummins</text><text x="335" y="400" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">two kinds of proficiency</text><text x="335" y="440" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">BICS: conversation</text><rect x="335" y="450" width="80" height="22" rx="4" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="425" y="467" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">a couple of years</text><text x="335" y="508" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">CALP: academic language</text><rect x="335" y="518" width="230" height="22" rx="4" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="335" y="566" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">considerably longer</text><rect x="600" y="340" width="270" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="620" y="376" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Code-switching</text><text x="620" y="400" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">a skilled resource, for</text><rect x="620" y="420" width="220" height="38" rx="19" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="730" y="444.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">identity</text><rect x="620" y="470" width="220" height="38" rx="19" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="730" y="494.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">emphasis</text><rect x="620" y="520" width="220" height="38" rx="19" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="730" y="544.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">a word that fits better</text><rect x="30" y="608" width="840" height="58" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="644" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">Avoid a deficit framing: describe what the learner can do and what is developing.</text>
</svg>