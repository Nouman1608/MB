<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Section A: Learning language</text>

<rect x="30" y="110" width="840" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="55" y="146" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Unit 3 exam</text><text x="845" y="146" font-size="18" font-weight="600" fill="#4a5568" text-anchor="end">2 hours · 50 marks · 30% of the A-level</text><rect x="55" y="166" width="395" height="70" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="252" y="198" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Section A: Learning language</text><text x="252" y="222" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">25 marks</text><rect x="450" y="166" width="395" height="70" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="647" y="208" font-size="18" font-weight="600" fill="#4a5568" text-anchor="middle">Section B</text><text x="450" y="300" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Choose one question from two: read both questions and their data first</text><rect x="120" y="318" width="300" height="64" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="270" y="357" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Question 1 + data</text><rect x="480" y="318" width="300" height="64" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="630" y="357" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Question 2 + data</text><text x="450" y="357" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="middle">or</text><rect x="30" y="404" width="410" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="55" y="440" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Data can be</text><rect x="55" y="458" width="115" height="38" rx="19" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="112.5" y="482.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">speech</text><rect x="180" y="458" width="115" height="38" rx="19" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="237.5" y="482.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">writing</text><rect x="305" y="458" width="115" height="38" rx="19" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="362.5" y="482.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">multimodal</text><text x="55" y="532" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">from native speakers or</text><text x="55" y="556" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">speakers of English as an additional language</text><rect x="460" y="404" width="410" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="485" y="440" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">You must show</text><circle cx="502" cy="474" r="15" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="502" y="479.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="528" y="480" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">knowledge of theories and approaches</text><circle cx="502" cy="510" r="15" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="502" y="515.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="528" y="516" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">skills in data analysis</text><circle cx="502" cy="546" r="15" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="502" y="551.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="528" y="552" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">academic argument and evaluation</text>
