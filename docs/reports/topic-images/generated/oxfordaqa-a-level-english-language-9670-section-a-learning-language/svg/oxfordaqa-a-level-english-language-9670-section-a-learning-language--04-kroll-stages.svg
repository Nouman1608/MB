<rect width="900" height="665" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four stages of writing development</text>

<rect x="30" y="440" width="200" height="120" rx="10" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><circle cx="60" cy="476" r="17" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="60" y="482.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="85" y="482" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Preparation</text><text x="46" y="522" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">letter formation and</text><text x="46" y="543" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">basic spelling</text><rect x="242" y="345" width="200" height="215" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><circle cx="272" cy="381" r="17" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="272" y="387.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="297" y="387" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Consolidation</text><text x="258" y="427" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">writing much as they</text><text x="258" y="448" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">speak: “and then”</text><text x="258" y="469" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">chains</text><rect x="454" y="250" width="200" height="310" rx="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="484" cy="286" r="17" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="484" y="292.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="509" y="292" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Differentiation</text><text x="470" y="332" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">writing differs from</text><text x="470" y="353" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">speech; genres and</text><text x="470" y="374" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">audiences</text><rect x="666" y="155" width="200" height="405" rx="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="696" cy="191" r="17" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="696" y="197.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="721" y="197" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Integration</text><text x="682" y="237" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">a personal voice</text><text x="682" y="258" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">across forms and</text><text x="682" y="279" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">purposes</text><text x="45" y="140" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Barry Kroll (1981)</text><text x="45" y="168" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Children’s writing has its own developmental path.</text><rect x="30" y="582" width="840" height="58" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="618" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">A model, not a rigid rule: test it against the data.</text>
</svg>