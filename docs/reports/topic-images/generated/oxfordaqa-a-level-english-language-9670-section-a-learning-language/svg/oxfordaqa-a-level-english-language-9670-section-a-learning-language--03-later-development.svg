<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 830" width="900" height="830" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="830" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Later development in children and teenagers</text>

<rect x="30" y="110" width="410" height="300" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="30" y="110" width="410" height="50" rx="14" fill="#b5d3cf" stroke="#c9d6d4" stroke-width="2.5"/><text x="235" y="143" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Grammar</text><text x="54" y="196" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">passives</text><text x="54" y="218" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">“the window was broken by the ball”</text><text x="54" y="254" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">embedded and relative clauses</text><text x="54" y="276" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">“the girl who won the race”</text><text x="54" y="312" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">nominalisation</text><text x="54" y="334" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">“the reduction of waste”</text><text x="54" y="370" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">cohesive devices</text><text x="54" y="392" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">“however”, “as a result”</text><rect x="460" y="110" width="410" height="300" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="460" y="110" width="410" height="50" rx="14" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2.5"/><text x="665" y="143" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Vocabulary</text><text x="484" y="196" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">abstract and subject-specific</text><text x="484" y="218" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">learned through reading and school</text><text x="484" y="296" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">polysemy and figurative meaning</text><text x="484" y="318" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">idioms, sarcasm, irony</text><rect x="30" y="428" width="410" height="300" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="30" y="428" width="410" height="50" rx="14" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2.5"/><text x="235" y="461" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Pragmatics</text><text x="54" y="514" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">adjusting register</text><text x="54" y="536" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">for different audiences</text><text x="54" y="588" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">politeness strategies</text><text x="54" y="610" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">e.g. indirect requests</text><text x="54" y="662" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">conversational repair</text><text x="54" y="684" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">and topic shifts</text><rect x="460" y="428" width="410" height="300" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="460" y="428" width="410" height="50" rx="14" fill="#d4b02e" stroke="#c9d6d4" stroke-width="2.5"/><text x="665" y="461" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Adolescent identity</text><text x="484" y="514" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">slang, discourse markers</text><text x="484" y="536" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">“like”, “innit”</text><text x="484" y="588" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Eckert (1989), Detroit-area school</text><text x="484" y="610" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">variation linked to adolescent social categories</text><text x="484" y="662" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Multicultural London English</text><text x="484" y="684" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">Cheshire, Kerswill and colleagues</text><rect x="30" y="742" width="840" height="60" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="779" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Treat teenage variation as systematic and social, not as deterioration.</text>
</svg>