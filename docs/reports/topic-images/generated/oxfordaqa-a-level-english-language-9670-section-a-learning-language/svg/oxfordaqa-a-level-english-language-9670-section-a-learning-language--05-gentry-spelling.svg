<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" width="900" height="720" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="720" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Stages of spelling development</text>

<text x="450" y="118" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">J. Richard Gentry (1982)</text><rect x="30" y="140" width="840" height="82" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="181" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="188.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="118" y="176" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Pre-communicative</text><text x="118" y="202" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">random letters</text><line x1="76" y1="206" x2="76" y2="234" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="30" y="236" width="840" height="82" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="277" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="284.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="118" y="272" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Semi-phonetic</text><text x="118" y="298" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">some letters for sounds</text><rect x="600" y="254" width="246" height="46" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="723" y="284" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">“dg” for “dog”</text><line x1="76" y1="302" x2="76" y2="330" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="30" y="332" width="840" height="82" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="373" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="380.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="118" y="368" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Phonetic</text><text x="118" y="394" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">every sound represented</text><rect x="600" y="350" width="246" height="46" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="723" y="380" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">“sed” for “said”</text><line x1="76" y1="398" x2="76" y2="426" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="30" y="428" width="840" height="82" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="469" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="476.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="118" y="464" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Transitional</text><text x="118" y="490" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">spelling patterns appear</text><rect x="600" y="446" width="246" height="46" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="723" y="476" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">“tode” for “toad”</text><line x1="76" y1="494" x2="76" y2="522" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="30" y="524" width="840" height="82" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><circle cx="76" cy="565" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="572.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="118" y="560" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Correct</text><text x="118" y="586" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">standard spelling</text><rect x="30" y="632" width="840" height="60" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="669" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Phonetic spellings are evidence of phonological awareness, not carelessness.</text>
</svg>