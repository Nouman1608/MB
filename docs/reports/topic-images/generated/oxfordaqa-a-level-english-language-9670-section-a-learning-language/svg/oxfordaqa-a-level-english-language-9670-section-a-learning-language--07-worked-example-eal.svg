<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 710" width="900" height="710" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="710" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: an EAL science report</text>

<rect x="30" y="108" width="840" height="112" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="138" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">14-year-old EAL learner, two years in an English-medium school: science report</text><text x="50" y="170" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“The results was showing that plant growth more fast in light. Therefore, we can</text><text x="50" y="198" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">conclude light is a factor which affecting growth.”</text><rect x="30" y="240" width="410" height="330" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><rect x="30" y="240" width="410" height="54" rx="14" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><text x="235" y="275" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Emerging CALP (Cummins)</text><rect x="52" y="316" width="366" height="64" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="70" y="344" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" font-style="italic">“Therefore”</text><text x="70" y="368" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">discourse marker</text><rect x="52" y="394" width="366" height="64" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="70" y="422" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" font-style="italic">“we can conclude”</text><text x="70" y="446" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">formulaic academic phrase</text><rect x="52" y="472" width="366" height="64" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="70" y="500" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" font-style="italic">“which…”</text><text x="70" y="524" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">relative clause</text><rect x="460" y="240" width="410" height="330" rx="14" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><rect x="460" y="240" width="410" height="54" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="665" y="275" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Developing interlanguage</text><rect x="482" y="316" width="366" height="64" rx="12" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="500" y="344" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" font-style="italic">“results was”</text><text x="500" y="368" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">subject-verb agreement developing</text><rect x="482" y="388" width="366" height="88" rx="12" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="500" y="416" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" font-style="italic">“was showing”, “affecting”</text><text x="500" y="440" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">progressive for a completed finding:</text><text x="500" y="462" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">tense and aspect still developing</text><rect x="482" y="488" width="366" height="64" rx="12" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="500" y="516" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" font-style="italic">“more fast”</text><text x="500" y="540" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">analytic comparative overgeneralised</text><rect x="30" y="590" width="840" height="92" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="626" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Systematic, not random: supports Selinker’s rule-governed learner system.</text><text x="450" y="656" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">Academic register is acquired alongside, not after, grammatical accuracy.</text>
</svg>