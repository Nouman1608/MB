text><text x="636" y="458" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">identity</text><text x="450" y="530" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">A continuum, not a set of toddler stages: the specification includes teenagers.</text>
</svg>