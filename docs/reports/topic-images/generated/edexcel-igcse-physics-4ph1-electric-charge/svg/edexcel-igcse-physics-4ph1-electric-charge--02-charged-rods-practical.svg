 x1="386.05" y1="236" x2="395.95" y2="236" stroke="#2e6b62" stroke-width="2.5" stroke-linecap="round"/><text x="375" y="282" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">second</text><text x="375" y="301" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">polythene rod</text><path d="M295,208 Q265,175 225,180" fill="none" stroke="#b5602e" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahR)"/><text x="175" y="180" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">paper stirrup</text><text x="175" y="198" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">on a thread</text><text x="60" y="330" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The charged end swings away from the</text><text x="60" y="351" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">second rod.</text><text x="60" y="410" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">Turns away: REPULSION</text><rect x="460" y="110" width="410" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><line x1="615" y1="150" x2="615" y2="206" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><line x1="490" y1="148" x2="840" y2="148" stroke="#1e2a44" stroke-width="5" stroke-linecap="round"/><path d="M599,236 L599,206 L631,206 L631,236" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="495" y="219" width="240" height="34" rx="17" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" /><text x="615" y="242" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle"></text><text x="545" y="242" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">polythene</text><circle cx="683" cy="236" r="9" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><line x1="678.05" y1="236" x2="687.95" y2="236" stroke="#2e6b62" stroke-width="2.5" stroke-linecap="round"/><circle cx="703" cy="236" r="9" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><line x1="698.05" y1="236" x2="707.95" y2="236" stroke="#2e6b62" stroke-width="2.5" stroke-linecap="round"/><circle cx="723" cy="236" r="9" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><line x1="718.05" y1="236" x2="727.95" y2="236" stroke="#2e6b62" stroke-width="2.5" stroke-linecap="round"/><rect x="760" y="219" width="90" height="34" rx="17" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5" /><text x="805" y="242" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle"></text><circle cx="777" cy="236" r="9" fill="#f2e7b8" stroke="#b5602e" stroke-width="2"/><line x1="772.05" y1="236" x2="781.95" y2="236" stroke="#b5602e" stroke-width="2.5" stroke-linecap="round"/><line x1="777" y1="231.05" x2="777" y2="240.95" stroke="#b5602e" stroke-width="2.5" stroke-linecap="round"/><circle cx="799" cy="236" r="9" fill="#f2e7b8" stroke="#b5602e" stroke-width="2"/><line x1="794.05" y1="236" x2="803.95" y2="236" stroke="#b5602e" stroke-width="2.5" stroke-linecap="round"/><line x1="799" y1="231.05" x2="799" y2="240.95" stroke="#b5602e" stroke-width="2.5" stroke-linecap="round"/><circle cx="821" cy="236" r="9" fill="#f2e7b8" stroke="#b5602e" stroke-width="2"/><line x1="816.05" y1="236" x2="825.95" y2="236" stroke="#b5602e" stroke-width="2.5" stroke-linecap="round"/><line x1="821" y1="231.05" x2="821" y2="240.95" stroke="#b5602e" stroke-width="2.5" stroke-linecap="round"/><text x="805" y="282" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">rubbed</text><text x="805" y="301" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">acetate rod</text><path d="M685,195 Q720,170 750,198" fill="none" stroke="#2e6b62" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahT)"/><text x="605" y="180" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">paper stirrup</text><text x="605" y="198" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">on a thread</text><text x="490" y="330" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The charged end swings towards the</text><text x="490" y="351" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">acetate rod.</text><text x="490" y="410" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Turns towards: ATTRACTION</text><rect x="30" y="460" width="840" height="120" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="55" y="496" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Conclusion: the two materials gain opposite charges;</text><text x="55" y="522" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">like charges repel and unlike charges attract.</text><text x="55" y="556" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Use dry materials; hold the rod by one end and do not touch the rubbed area.</text>
