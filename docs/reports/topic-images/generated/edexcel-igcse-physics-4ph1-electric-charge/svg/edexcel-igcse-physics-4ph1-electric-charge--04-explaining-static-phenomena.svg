<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 695" width="900" height="695" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="695" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Explaining static in three steps</text>

<text x="328.5" y="140" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">1  Rubbing</text><text x="545.5" y="140" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="middle">2  Charge</text><text x="762.5" y="140" font-size="19" font-weight="700" fill="#b5602e" text-anchor="middle">3  Result</text><rect x="30" y="160" width="840" height="148" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="200" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Hair after</text><text x="50" y="223" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">brushing</text><rect x="225" y="172" width="207" height="124" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2" /><text x="237" y="200" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Electrons transfer</text><text x="237" y="219" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">between hair and</text><text x="237" y="238" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">plastic brush</text><line x1="433" y1="234" x2="441" y2="234" stroke="#1e2a44" stroke-width="2" marker-end="url(#ah)"/><rect x="442" y="172" width="207" height="124" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2" /><text x="454" y="200" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">All strands gain the</text><text x="454" y="219" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">same charge</text><line x1="650" y1="234" x2="658" y2="234" stroke="#1e2a44" stroke-width="2" marker-end="url(#ah)"/><rect x="659" y="172" width="207" height="124" rx="10" fill="#f6e3d6" stroke="#b5602e" stroke-width="2" /><text x="671" y="200" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Strands repel each</text><text x="671" y="219" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">other and stand up</text><rect x="30" y="320" width="840" height="148" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="360" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Shock from</text><text x="50" y="383" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">a door handle</text><rect x="225" y="332" width="207" height="124" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2" /><text x="237" y="360" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Shoes rub on nylon</text><text x="237" y="379" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">carpet: electrons</text><text x="237" y="398" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">transfer</text><line x1="433" y1="394" x2="441" y2="394" stroke="#1e2a44" stroke-width="2" marker-end="url(#ah)"/><rect x="442" y="332" width="207" height="124" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2" /><text x="454" y="360" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">The person becomes</text><text x="454" y="379" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">charged</text><line x1="650" y1="394" x2="658" y2="394" stroke="#1e2a44" stroke-width="2" marker-end="url(#ah)"/><rect x="659" y="332" width="207" height="124" rx="10" fill="#f6e3d6" stroke="#b5602e" stroke-width="2" /><text x="671" y="360" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Touching the metal</text><text x="671" y="379" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">handle: electrons flow</text><text x="671" y="398" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">suddenly to or from</text><text x="671" y="417" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">earth (shock, spark)</text><rect x="30" y="480" width="840" height="148" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="520" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Clothes in</text><text x="50" y="543" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">a dryer</text><rect x="225" y="492" width="207" height="124" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2" /><text x="237" y="520" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Different fabrics rub:</text><text x="237" y="539" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">electrons transfer</text><line x1="433" y1="554" x2="441" y2="554" stroke="#1e2a44" stroke-width="2" marker-end="url(#ah)"/><rect x="442" y="492" width="207" height="124" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2" /><text x="454" y="520" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Items gain opposite</text><text x="454" y="539" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">charges</text><line x1="650" y1="554" x2="658" y2="554" stroke="#1e2a44" stroke-width="2" marker-end="url(#ah)"/><rect x="659" y="492" width="207" height="124" rx="10" fill="#f6e3d6" stroke="#b5602e" stroke-width="2" /><text x="671" y="520" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Oppositely charged</text><text x="671" y="539" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">items attract and</text><text x="671" y="558" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">cling</text><text x="450" y="670" font-size="17" font-weight="600" fill="#4a5568" text-anchor="middle">Every explanation names electrons and which way they move.</text>
</svg>