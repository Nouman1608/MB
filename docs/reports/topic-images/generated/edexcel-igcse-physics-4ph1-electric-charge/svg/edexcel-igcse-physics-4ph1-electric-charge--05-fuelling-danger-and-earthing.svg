<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="560" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Static danger when fuelling aircraft</text>

<rect x="30" y="110" width="410" height="430" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="235" y="146" font-size="20" font-weight="700" fill="#b5602e" text-anchor="middle">Danger: charge builds up</text><path d="M90,230 L350,230 Q390,248 350,266 L90,266 L70,212 L102,212 Z" fill="#ffffff" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><path d="M190,248 L250,248 L210,310 L180,310 Z" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><circle cx="150" cy="282" r="9" fill="#1e2a44" stroke="#1e2a44" stroke-width="0"/><circle cx="320" cy="282" r="9" fill="#1e2a44" stroke="#1e2a44" stroke-width="0"/><rect x="60" y="320" width="110" height="55" rx="6" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5" /><rect x="170" y="335" width="35" height="40" rx="4" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" /><circle cx="85" cy="382" r="9" fill="#1e2a44" stroke="#1e2a44" stroke-width="0"/><circle cx="175" cy="382" r="9" fill="#1e2a44" stroke="#1e2a44" stroke-width="0"/><text x="115" y="354" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">fuel</text><path d="M200,345 Q260,320 300,270" fill="none" stroke="#8a6d0d" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="140" cy="248" r="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><line x1="134.5" y1="248" x2="145.5" y2="248" stroke="#2e6b62" stroke-width="2.5" stroke-linecap="round"/><circle cx="182" cy="248" r="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><line x1="176.5" y1="248" x2="187.5" y2="248" stroke="#2e6b62" stroke-width="2.5" stroke-linecap="round"/><circle cx="224" cy="248" r="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><line x1="218.5" y1="248" x2="229.5" y2="248" stroke="#2e6b62" stroke-width="2.5" stroke-linecap="round"/><circle cx="266" cy="248" r="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><line x1="260.5" y1="248" x2="271.5" y2="248" stroke="#2e6b62" stroke-width="2.5" stroke-linecap="round"/><circle cx="308" cy="248" r="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><line x1="302.5" y1="248" x2="313.5" y2="248" stroke="#2e6b62" stroke-width="2.5" stroke-linecap="round"/><line x1="40" y1="400" x2="430" y2="400" stroke="#1e2a44" stroke-width="3" stroke-linecap="round"/><path d="M330,310 l-12,20 l14,0 l-14,26 l10,0 l-16,30" fill="none" stroke="#d4b02e" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><text x="345" y="345" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="start">spark</text><text x="55" y="440" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Fast-flowing fuel rubs the pipe and</text><text x="55" y="461" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">transfers electrons. A spark near fuel</text><text x="55" y="482" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">vapour can ignite it: explosion or fire.</text><rect x="460" y="110" width="410" height="430" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="665" y="146" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle">Safe: connect to earth first</text><path d="M520,230 L780,230 Q820,248 780,266 L520,266 L500,212 L532,212 Z" fill="#ffffff" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><path d="M620,248 L680,248 L640,310 L610,310 Z" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><circle cx="580" cy="282" r="9" fill="#1e2a44" stroke="#1e2a44" stroke-width="0"/><circle cx="750" cy="282" r="9" fill="#1e2a44" stroke="#1e2a44" stroke-width="0"/><rect x="490" y="320" width="110" height="55" rx="6" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5" /><rect x="600" y="335" width="35" height="40" rx="4" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" /><circle cx="515" cy="382" r="9" fill="#1e2a44" stroke="#1e2a44" stroke-width="0"/><circle cx="605" cy="382" r="9" fill="#1e2a44" stroke="#1e2a44" stroke-width="0"/><text x="545" y="354" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">fuel</text><path d="M630,345 Q690,320 730,270" fill="none" stroke="#8a6d0d" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><polyline points="760,285 800,330 800,400" fill="none" stroke="#2e6b62" stroke-width="4" stroke-linejoin="round"/><line x1="780" y1="400" x2="820" y2="400" stroke="#2e6b62" stroke-width="4" stroke-linecap="round"/><line x1="786" y1="408" x2="814" y2="408" stroke="#2e6b62" stroke-width="3" stroke-linecap="round"/><line x1="793" y1="416" x2="807" y2="416" stroke="#2e6b62" stroke-width="2.5" stroke-linecap="round"/><circle cx="812" cy="318" r="9" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><line x1="807.05" y1="318" x2="816.95" y2="318" stroke="#2e6b62" stroke-width="2.5" stroke-linecap="round"/><line x1="822" y1="330" x2="822" y2="372" stroke="#2e6b62" stroke-width="2.5" marker-end="url(#ahT)"/><text x="835" y="355" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">e⁻</text><text x="760" y="430" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="end">earthing cable</text><line x1="470" y1="400" x2="860" y2="400" stroke="#1e2a44" stroke-width="3" stroke-linecap="round"/><text x="485" y="455" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Electrons flow continuously to or from</text><text x="485" y="476" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">earth, and conducting hoses are used, so</text><text x="485" y="497" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the charge never gets big enough to spark.</text>
</svg>