<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Catch per unit effort tells the real story</text>

<rect x="30" y="110" width="270" height="470" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="165" y="150" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Catch</text><rect x="80" y="239.60000000000002" width="72" height="230.39999999999998" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="116" y="229.60000000000002" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">48,000</text><text x="116" y="494" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">2016</text><rect x="180" y="254" width="72" height="216" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="216" y="244" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">45,000</text><text x="216" y="494" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">2024</text><line x1="66" y1="470" x2="266" y2="470" stroke="#1e2a44" stroke-width="2.5"/><text x="165" y="186" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">tonnes</text><text x="165" y="534.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">−6.25%</text><text x="165" y="556.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">only a small fall</text><rect x="315" y="110" width="270" height="470" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="150" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Effort</text><rect x="365" y="326" width="72" height="144" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="401" y="316" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">12,000</text><text x="401" y="494" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">2016</text><rect x="465" y="254" width="72" height="216" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="501" y="244" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">18,000</text><text x="501" y="494" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">2024</text><line x1="351" y1="470" x2="551" y2="470" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="186" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">boat-days</text><text x="450" y="534.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">12 000 → 18 000</text><text x="450" y="556.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">much more effort</text><rect x="600" y="110" width="270" height="470" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="735" y="150" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">CPUE</text><rect x="650" y="256.6666666666667" width="72" height="213.33333333333331" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="686" y="246.66666666666669" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">4.0</text><text x="686" y="494" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">2016</text><rect x="750" y="336.66666666666663" width="72" height="133.33333333333334" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><text x="786" y="326.66666666666663" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">2.5</text><text x="786" y="494" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">2024</text><line x1="636" y1="470" x2="836" y2="470" stroke="#1e2a44" stroke-width="2.5"/><text x="735" y="186" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">t per boat-day</text><text x="735" y="534.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">−37.5%</text><text x="735" y="556.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">stock very likely shrinking</text><rect x="30" y="600" width="840" height="70" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="643" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">CPUE = catch ÷ effort: 48 000 ÷ 12 000 = 4.0 → 45 000 ÷ 18 000 = 2.5</text>
