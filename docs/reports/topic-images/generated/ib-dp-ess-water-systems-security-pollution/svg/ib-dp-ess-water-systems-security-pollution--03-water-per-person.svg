<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 675" width="900" height="675" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="675" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: water stress in Veloria</text>

<rect x="30" y="110" width="840" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="148" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Renewable freshwater per person (m³ a year)</text><rect x="70" y="250" width="185" height="70" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><text x="162.5" y="280" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">absolute</text><text x="162.5" y="302" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">scarcity</text><rect x="255" y="250" width="185" height="70" fill="#efdfa8" stroke="#1e2a44" stroke-width="2"/><text x="347.5" y="280" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">water</text><text x="347.5" y="302" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">scarcity</text><rect x="440" y="250" width="259" height="70" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="569.5" y="280" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">water</text><text x="569.5" y="302" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">stress</text><rect x="699" y="250" width="148" height="70" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="773" y="280" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">no</text><text x="773" y="302" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">stress</text><text x="70" y="344" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">0</text><text x="255" y="344" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">500</text><text x="440" y="344" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">1,000</text><text x="699" y="344" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">1,700</text><line x1="717.5" y1="196" x2="717.5" y2="250" stroke="#2e6b62" stroke-width="4"/><circle cx="717.5" cy="196" r="8" fill="#2e6b62"/><text x="717.5" y="182" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">now: 1750</text><line x1="588" y1="320" x2="588" y2="380" stroke="#b5602e" stroke-width="4"/><circle cx="588" cy="380" r="8" fill="#b5602e"/><text x="588" y="408" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">2040: 1400</text><rect x="30" y="460" width="410" height="160" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="494" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Now</text><text x="54" y="524" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">42 × 10⁹ m³ ÷ 24 × 10⁶ people</text><text x="54" y="551" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">= 1750 m³ per person</text><text x="54" y="578" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">→ no stress</text><rect x="460" y="460" width="410" height="160" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="484" y="494" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">2040</text><text x="484" y="524" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">42 × 10⁹ m³ ÷ 30 × 10⁶ people</text><text x="484" y="551" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">= 1400 m³ per person</text><text x="484" y="578" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">→ water stress</text><text x="450" y="652" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Convert km³ to m³ (× 10⁹) first. The indicator ignores quality, seasons and access.</text>
</svg>