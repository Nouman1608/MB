<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 690" width="900" height="690" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="690" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How urbanisation changes river flow</text>

<rect x="30" y="110" width="840" height="560" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><line x1="110" y1="560" x2="840" y2="560" stroke="#1e2a44" stroke-width="3"/><line x1="110" y1="560" x2="110" y2="160" stroke="#1e2a44" stroke-width="3"/><text x="840" y="590" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="end">time (hours) →</text><text x="72" y="360" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle" transform="rotate(-90 72 360)">river discharge</text><rect x="170" y="160" width="26" height="40" fill="#2b5a9a" opacity="0.8"/><rect x="200" y="160" width="26" height="70" fill="#2b5a9a" opacity="0.8"/><rect x="230" y="160" width="26" height="55" fill="#2b5a9a" opacity="0.8"/><rect x="260" y="160" width="26" height="25" fill="#2b5a9a" opacity="0.8"/><text x="170" y="150" font-size="15" font-weight="700" fill="#2b5a9a" text-anchor="start">rainfall</text><path d="M110,520 C300,518 360,470 420,380 C470,320 520,330 580,400 C640,470 720,505 840,512" fill="none" stroke="#2e6b62" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><path d="M110,520 C220,518 250,420 290,250 C310,190 340,190 370,280 C420,420 520,500 840,515" fill="none" stroke="#b5602e" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><text x="470" y="300" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">rural</text><text x="345" y="205" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">urban</text><line x1="215" y1="230" x2="215" y2="560" stroke="#2b5a9a" stroke-width="2" stroke-dasharray="6 5"/><line x1="320" y1="205" x2="320" y2="560" stroke="#b5602e" stroke-width="2" stroke-dasharray="6 5"/><line x1="475" y1="325" x2="475" y2="560" stroke="#2e6b62" stroke-width="2" stroke-dasharray="6 5"/><line x1="215" y1="590" x2="320" y2="590" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)" marker-start="url(#ahR)"/><text x="267" y="615" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">short lag</text><line x1="215" y1="635" x2="475" y2="635" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)" marker-start="url(#ahT)"/><text x="345" y="657" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">longer lag</text><rect x="560" y="140" width="290" height="160" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="580" y="175" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Impermeable surfaces cut</text><text x="580" y="197" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">infiltration, so more fast</text><text x="580" y="219" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">runoff is piped to rivers:</text><text x="580" y="241" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">lag time shortens, peak</text><text x="580" y="263" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">discharge rises, flood risk up.</text>
</svg>