<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 690" width="900" height="690" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="690" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Biomagnification up a food chain</text>

<rect x="30" y="110" width="840" height="560" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="70" y="536" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Zooplankton</text><rect x="270" y="508" width="132.2471989593555" height="44" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="412.2471989593555" y="538" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">0.04 ppm</text><line x1="170" y1="502" x2="170" y2="456" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="70" y="431" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Small fish</text><rect x="270" y="403" width="237.25455056635948" height="44" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="517.2545505663595" y="433" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">0.3 ppm</text><line x1="170" y1="397" x2="170" y2="351" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="70" y="326" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Large fish</text><rect x="270" y="298" width="345.6253490053927" height="44" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="625.6253490053928" y="328" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">2.4 ppm</text><line x1="170" y1="292" x2="170" y2="246" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="70" y="221" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Fish-eating birds</text><rect x="270" y="193" width="450.6327006123967" height="44" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><text x="730.6327006123968" y="223" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">18 ppm</text><text x="270" y="160" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">concentration of pesticide (bars on a log scale)</text><rect x="560" y="450" width="280" height="120" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="700" y="490" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">zooplankton → birds</text><text x="700" y="528" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">18 ÷ 0.04 = 450×</text><text x="700" y="556" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">more concentrated</text><text x="60" y="615" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Persistent, fat-soluble pollutants build up in tissues (bioaccumulation)</text><text x="60" y="637" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and concentrate at each higher trophic level (biomagnification).</text>
</svg>