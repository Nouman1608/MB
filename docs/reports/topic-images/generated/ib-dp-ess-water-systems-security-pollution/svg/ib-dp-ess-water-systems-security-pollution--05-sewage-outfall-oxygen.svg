<rect width="900" height="690" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Below a sewage outfall</text>

<rect x="30" y="110" width="840" height="560" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="110" y="160" width="730" height="26" fill="#b5d3cf"/><text x="116" y="152" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">river flow →</text><rect x="250" y="132" width="20" height="40" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><text x="260" y="124" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">sewage outfall</text><line x1="110" y1="470" x2="840" y2="470" stroke="#1e2a44" stroke-width="3"/><line x1="110" y1="470" x2="110" y2="200" stroke="#1e2a44" stroke-width="3"/><text x="840" y="496" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="end">distance downstream →</text><line x1="260" y1="200" x2="260" y2="470" stroke="#4a5568" stroke-width="2" stroke-dasharray="6 5"/><path d="M110,240 L260,240 C320,240 340,420 420,425 C500,430 560,300 680,250 L840,242" fill="none" stroke="#2b5a9a" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><path d="M110,440 L260,440 C300,440 320,260 380,258 C460,256 520,400 640,432 L840,440" fill="none" stroke="#b5602e" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="11 6"/><text x="150" y="230" font-size="16" font-weight="700" fill="#2b5a9a" text-anchor="start">dissolved oxygen</text><text x="150" y="430" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">BOD</text><text x="430" y="456" font-size="15" font-weight="700" fill="#2b5a9a" text-anchor="middle">O₂ used by bacteria</text><text x="690" y="236" font-size="15" font-weight="700" fill="#2b5a9a" text-anchor="start">recovers</text><rect x="110" y="520" width="150" height="80" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.5"/><text x="185" y="553" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">stonefly, mayfly</text><text x="185" y="577" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">clean, oxygen-rich</text><rect x="260" y="520" width="300" height="80" fill="#efdfa8" stroke="#1e2a44" stroke-width="1.5"/><text x="410" y="553" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">sludge worms</text><text x="410" y="577" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">tolerate low oxygen</text><rect x="560" y="520" width="280" height="80" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.5"/><text x="700" y="553" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">stonefly, mayfly</text><text x="700" y="577" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">return as O₂ recovers</text><text x="450" y="630" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Indicator species reflect weeks or months; direct readings are a snapshot.</text>
</svg>