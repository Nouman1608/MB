<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The hydrological cycle as a system</text>

<rect x="30" y="110" width="840" height="640" rx="14" fill="#eef4f6" stroke="#c9d6d4" stroke-width="2.5"/><path d="M32,560 L130,270 L250,450 L380,486 L560,516 L560,748 L32,748 Z" fill="#cbbf9f"/><path d="M32,600 L560,600 L560,690 L32,690 Z" fill="#b5d3cf" opacity="0.75"/><text x="60" y="660" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Groundwater: largest store of liquid freshwater</text><path d="M32,560 L130,270 L250,450 L380,486 L560,516 L560,556 L380,526 L250,490 L130,310 L32,600 Z" fill="#efdfa8"/><path d="M32,560 L130,270 L250,450 L380,486 L560,516" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="404" y="514" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">soil</text><rect x="560" y="516" width="308" height="232" fill="#b5d3cf"/><line x1="560" y1="516" x2="868" y2="516" stroke="#2e6b62" stroke-width="3"/><text x="740" y="700" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Oceans: about 97%</text><text x="740" y="722" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">of all water (salt)</text><path d="M100,358 L130,270 L165,323 Q130,340 100,358 Z" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="40" y="250" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Ice caps and glaciers:</text><text x="40" y="268" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">most freshwater</text><path d="M170,360 Q210,420 260,452 Q330,474 380,486 Q470,500 560,516" fill="none" stroke="#2b5a9a" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><text x="555" y="500" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="end">river flow</text><rect x="424" y="436" width="10" height="50" fill="#9c8f6e"/><circle cx="429" cy="420" r="28" fill="#6f9a52" stroke="#1e2a44" stroke-width="2"/><path d="M280,190 a22,22 0 0 1 24,-26 a30,30 0 0 1 54,-4 a22,22 0 0 1 24,30 z" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><path d="M710,190 a22,22 0 0 1 24,-26 a30,30 0 0 1 54,-4 a22,22 0 0 1 24,30 z" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="340" y="138" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Atmosphere: small store</text><line x1="290" y1="205" x2="282" y2="250" stroke="#2b5a9a" stroke-width="2.5"/><line x1="312" y1="205" x2="304" y2="250" stroke="#2b5a9a" stroke-width="2.5"/><line x1="334" y1="205" x2="326" y2="250" stroke="#2b5a9a" stroke-width="2.5"/><line x1="356" y1="205" x2="348" y2="250" stroke="#2b5a9a" stroke-width="2.5"/><line x1="378" y1="205" x2="370" y2="250" stroke="#2b5a9a" stroke-width="2.5"/><line x1="400" y1="205" x2="392" y2="250" stroke="#2b5a9a" stroke-width="2.5"/><text x="420" y="236" font-size="15" font-weight="700" fill="#2b5a9a" text-anchor="start">rain, snow</text><path d="M820,510 Q830.0,506.1 820.0,502.1 Q810.0,498.2 820.0,494.2 Q830.0,490.3 820.0,486.4 Q810.0,482.4 820.0,478.5 Q830.0,474.5 820.0,470.6 Q810.0,466.6 820.0,462.7 Q830.0,458.8 820.0,454.8 Q810.0,450.9 820.0,446.9 Q830.0,443.0 820.0,439.1 Q810.0,435.1 820.0,431.2 Q830.0,427.2 820.0,423.3 Q810.0,419.4 820.0,415.4 Q830.0,411.5 820.0,407.5 Q810.0,403.6 820.0,399.6 Q830.0,395.7 820.0,391.8 Q810.0,387.8 820.0,383.9 Q830.0,379.9 820.0,376.0 Q810.0,372.1 820.0,368.1 Q830.0,364.2 820.0,360.2 Q810.0,356.3 820.0,352.4 Q830.0,348.4 820.0,344.5 Q810.0,340.5 820.0,336.6 Q830.0,332.6 820.0,328.7 Q810.0,324.8 820.0,320.8 Q830.0,316.9 820.0,312.9 Q810.0,309.0 820.0,305.1 Q830.0,301.1 820.0,297.2 Q810.0,293.2 820.0,289.3 Q830.0,285.4 820.0,281.4 Q810.0,277.5 820.0,273.5 Q830.0,269.6 820.0,265.6 Q810.0,261.7 820.0,257.8 Q830.0,253.8 820.0,249.9 Q810.0,245.9 820.0,242.0 L820,220" fill="none" stroke="#b5602e" stroke-width="3.5" stroke-linecap="round" marker-end="url(#ahR)"/><text x="808" y="400" font-size="15" font-weight="700" fill="#b5602e" text-anchor="end">evaporation</text><text x="806" y="240" font-size="15" font-weight="700" 