" stroke-width="3.5" marker-end="url(#ahT)"/><text x="610" y="636" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">groundwater flow</text><line x1="580" y1="270" x2="620" y2="270" stroke="#b5602e" stroke-width="4"/><text x="628" y="276" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">transformation</text><text x="628" y="294" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">(changes state)</text><line x1="580" y1="320" x2="620" y2="320" stroke="#2e6b62" stroke-width="4"/><text x="628" y="326" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">transfer</text><text x="628" y="344" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">(same state)</text>
