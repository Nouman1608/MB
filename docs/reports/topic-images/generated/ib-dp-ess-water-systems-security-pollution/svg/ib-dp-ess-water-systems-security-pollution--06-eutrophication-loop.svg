<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 755" width="900" height="755" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="755" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Eutrophication: a positive feedback loop</text>

<rect x="40" y="140" width="250" height="92" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="165" y="182.19000000000003" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Nitrates and phosphates</text><text x="165" y="202.23000000000002" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">enter a lake or coastal water</text><circle cx="46" cy="146" r="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="46" y="152.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="450" y="140" width="250" height="92" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="575" y="182.19000000000003" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Algal bloom</text><text x="575" y="202.23000000000002" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">algae and plants grow fast</text><circle cx="456" cy="146" r="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="456" y="152.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="610" y="340" width="250" height="92" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="735" y="382.18999999999994" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Plants below shaded</text><text x="735" y="402.22999999999996" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">and die</text><circle cx="616" cy="346" r="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="616" y="352.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="450" y="540" width="250" height="92" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="575" y="582.19" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Decomposers</text><text x="575" y="602.23" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">use up dissolved oxygen</text><circle cx="456" cy="546" r="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="456" y="552.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="150" y="340" width="250" height="92" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="275" y="382.18999999999994" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Fish and invertebrates die</text><text x="275" y="402.22999999999996" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">decay releases more nutrients</text><circle cx="156" cy="346" r="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="156" y="352.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><line x1="292" y1="186" x2="446" y2="186" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><path d="M700,234 C730,270 740,300 735,336" fill="none" stroke="#b5602e" stroke-width="4" stroke-linecap="round" marker-end="url(#ahR)"/><path d="M735,434 C735,490 700,520 660,536" fill="none" stroke="#b5602e" stroke-width="4" stroke-linecap="round" marker-end="url(#ahR)"/><path d="M446,586 C300,586 275,500 275,436" fill="none" stroke="#b5602e" stroke-width="4" stroke-linecap="round" marker-end="url(#ahR)"/><path d="M275,336 C290,240 400,210 446,200" fill="none" stroke="#b5602e" stroke-width="5" stroke-linecap="round" marker-end="url(#ahR)"/><circle cx="500" cy="386" r="26" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="500" y="395.36" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">+</text><text x="500" y="438" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">positive</text><text x="500" y="458" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">feedback</text><rect x="30" y="660" width="840" height="74" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="692" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Severe cases produce dead zones with almost no oxygen.</text><text x="450" y="718" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Decomposers, not algae, cause the oxygen crash.</text>
</svg>