<text x="154.66666666666669" y="124" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Local issue</text><text x="450.00000000000006" y="124" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Action</text><text x="745.3333333333334" y="124" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Measure of success</text><rect x="30" y="140" width="249.33333333333334" height="91" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="168.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Older residents miss</text><text x="46" y="189.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">council news posted only</text><text x="46" y="210.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">online</text><line x1="285.33333333333337" y1="185.5" x2="319.33333333333337" y2="185.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="325.33333333333337" y="140" width="249.33333333333334" height="91" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="341.33333333333337" y="168.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A printed monthly notice</text><text x="341.33333333333337" y="189.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">sheet at the library and</text><text x="341.33333333333337" y="210.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">pharmacy</text><line x1="580.6666666666667" y1="185.5" x2="614.6666666666667" y2="185.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="620.6666666666667" y="140" width="249.33333333333334" height="91" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="636.6666666666667" y="168.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Before-and-after survey of</text><text x="636.6666666666667" y="189.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">who knew about key</text><text x="636.6666666666667" y="210.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">decisions</text><rect x="30" y="245" width="249.33333333333334" height="91" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="273.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Families speaking another</text><text x="46" y="294.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">language miss school</text><text x="46" y="315.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">messages</text><line x1="285.33333333333337" y1="290.5" x2="319.33333333333337" y2="290.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="325.33333333333337" y="245" width="249.33333333333334" height="91" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="341.33333333333337" y="284.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A translated message board</text><text x="341.33333333333337" y="305.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">with volunteer translators</text><line x1="580.6666666666667" y1="290.5" x2="614.6666666666667" y2="290.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="620.6666666666667" y="245" width="249.33333333333334" height="91" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="636.6666666666667" y="284.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Replies to school events</text><text x="636.6666666666667" y="305.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">before and after</text><rect x="30" y="350" width="249.33333333333334" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="378.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Rumours spread in a</text><text x="46" y="399.8" font-size="16" font-we