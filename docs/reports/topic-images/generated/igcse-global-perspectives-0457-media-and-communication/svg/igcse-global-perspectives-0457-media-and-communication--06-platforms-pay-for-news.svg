<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 678" width="900" height="678" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="678" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Making platforms pay for news</text>

<text x="235" y="130" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle">Australia</text><rect x="30" y="150" width="410" height="156" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="183" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">2021</text><text x="50" y="208.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Australia: News Media Bargaining</text><text x="50" y="232.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Code</text><text x="50" y="260.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Feb 2021: Facebook briefly blocks news in</text><text x="50" y="281.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Australia, then signs deals</text><line x1="235" y1="310" x2="235" y2="336" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="340" width="410" height="108" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="373" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">2024</text><text x="50" y="398.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Meta says it will not renew the</text><text x="50" y="422.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Australian deals</text><text x="665" y="130" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="middle">Canada</text><rect x="460" y="150" width="410" height="132" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="480" y="183" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">22 June 2023</text><text x="480" y="208.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Canada: Online News Act</text><text x="480" y="236.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Aug 2023: Meta ends news on its platforms in</text><text x="480" y="257.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Canada</text><line x1="665" y1="286" x2="665" y2="312" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="460" y="316" width="410" height="108" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="480" y="350.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Google: C$100 million a year</text><text x="480" y="378.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">indexed to inflation, for Canadian news</text><text x="480" y="399.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">businesses</text><rect x="30" y="468" width="408" height="108" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="501" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">RESULT</text><text x="50" y="526.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">New money for some news</text><text x="50" y="550.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">organisations</text><rect x="462" y="468" width="408" height="108" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="482" y="501" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">RESULT</text><text x="482" y="526.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">One platform’s response cut access</text><text x="482" y="550.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">to news on its service</text><rect x="30" y="594" width="840" height="58" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="627.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Supporters and critics still disagree on whether the approach works.</text>
</svg>