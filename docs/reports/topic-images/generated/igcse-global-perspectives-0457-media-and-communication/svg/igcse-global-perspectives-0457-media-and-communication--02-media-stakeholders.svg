<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 728" width="900" height="728" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="728" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Who gains, who loses, who decides?</text>

<line x1="315" y1="154" x2="373.5" y2="265.15" stroke="#1e2a44" stroke-width="2.5"/><line x1="315" y1="268" x2="373.5" y2="305.05" stroke="#1e2a44" stroke-width="2.5"/><line x1="315" y1="382" x2="373.5" y2="344.95" stroke="#1e2a44" stroke-width="2.5"/><line x1="315" y1="496" x2="373.5" y2="384.85" stroke="#1e2a44" stroke-width="2.5"/><line x1="585" y1="188.5" x2="526.5" y2="277.225" stroke="#1e2a44" stroke-width="2.5"/><line x1="585" y1="323.5" x2="526.5" y2="324.475" stroke="#1e2a44" stroke-width="2.5"/><line x1="585" y1="460" x2="526.5" y2="372.25" stroke="#1e2a44" stroke-width="2.5"/><circle cx="450" cy="325" r="90" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="319.5" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">A media</text><text x="450" y="344.5" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">issue</text><g transform="translate(0,0)"><rect x="30" y="104" width="285" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="134.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Journalists and editors</text><text x="46" y="162.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Independence, safety, income:</text><text x="46" y="183.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">their jobs depend on it.</text><rect x="30" y="218" width="285" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="248.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Media owners</text><text x="46" y="276.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Profit and audience size: they</text><text x="46" y="297.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">run businesses.</text><rect x="30" y="332" width="285" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="362.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Governments</text><text x="46" y="390.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Public order, security, trust;</text><text x="46" y="411.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">may also be reported on.</text><rect x="30" y="446" width="285" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="476.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Advertisers</text><text x="46" y="504.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Reaching audiences cheaply:</text><text x="46" y="525.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">money follows audiences.</text></g><g transform="translate(0,24)"><rect x="585" y="104" width="285" height="121" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="601" y="134.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Technology platforms</text><text x="601" y="162.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Freedom to run services, low</text><text x="601" y="183.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">costs: laws affect their</text><text x="601" y="204.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">model.</text><rect x="585" y="239" width="285" height="121" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="601" y="269.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Audiences</text><text x="601" y="297.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Accurate, affordable,</text><text x="601" y="318.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">accessible news to make</text><text x="601" y="339.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">decisions.</text><rect x="585" y="374" width="285" height="124" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="601" y="404.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Minority-language</text><text x="601" y="428.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">communities</text><text x="601" y="456.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Being informed and</text><text x="601" y="477.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">represented, not left out.</text></g><rect x="30" y="564" width="840" height="134" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="600" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">One source, two perspectives</text><text x="50" y="629.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Article 19 (UDHR, 1948): the right “to seek, receive and impart information and ideas</text><text x="50" y="651.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">through any media and regardless of frontiers”. It is used to argue both for less</text><text x="50" y="673.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">regulation and for more support for independent media.</text>
</svg>