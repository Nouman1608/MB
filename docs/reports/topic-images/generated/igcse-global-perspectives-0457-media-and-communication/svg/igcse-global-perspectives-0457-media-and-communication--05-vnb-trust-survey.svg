<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 716" width="900" height="716" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="716" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">“9 in 10 viewers trust VNB News”</text>

<rect x="30" y="104" width="840" height="110" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="50" y="137" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FICTIONAL BROADCASTER VNB, OWN ANNUAL REPORT</text><text x="50" y="163.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">“9 in 10 viewers trust VNB News. Our survey of viewers proves we are the</text><text x="50" y="188.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">country’s most trusted source.”</text><rect x="30" y="232" width="330" height="120" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="270" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">WHAT THE EVIDENCE COVERS</text><text x="50" y="296.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">9 in 10 of VNB’s own</text><text x="50" y="321.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">viewers</text><rect x="540" y="232" width="330" height="120" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="560" y="270" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">WHAT THE CLAIM SAYS</text><text x="560" y="296.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The country’s most trusted</text><text x="560" y="321.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">source</text><line x1="368" y1="292" x2="532" y2="292" stroke="#b5602e" stroke-width="4" marker-end="url(#ahR)" stroke-dasharray="10 7"/><text x="450" y="278" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">a jump</text><text x="450" y="320" font-size="15" font-weight="400" fill="#b5602e" text-anchor="middle">no comparison with</text><text x="450" y="338" font-size="15" font-weight="400" fill="#b5602e" text-anchor="middle">other broadcasters</text><rect x="30" y="370" width="170" height="70" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="115" y="412" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Knowledge</text><rect x="214" y="370" width="656" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="230" y="398.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">VNB has a vested interest: the survey is about its own reputation, and it</text><text x="230" y="419.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">published the result itself.</text><rect x="30" y="452" width="170" height="70" rx="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="115" y="494" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Application</text><rect x="214" y="452" width="656" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="230" y="480.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">It surveyed people who already choose to watch VNB, so the sample is likely</text><text x="230" y="501.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">to favour it.</text><rect x="30" y="534" width="170" height="70" rx="14" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="115" y="576" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Analysis</text><rect x="214" y="534" width="656" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="230" y="562.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“Proves” overstates what one survey can show, and the national claim needs</text><text x="230" y="583.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">a comparison.</text><rect x="30" y="616" width="170" height="70" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="115" y="658" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Evaluation</text><rect x="214" y="616" width="656" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="230" y="644.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Weak for the national claim. A random national sample asked about several</text><text x="230" y="665.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">broadcasters would be more reliable.</text>
</svg>