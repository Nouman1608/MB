<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 473" width="900" height="473" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="473" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why local news declines, and what follows</text>

<rect x="30" y="104" width="180" height="90" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="120" y="131.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Advertising</text><text x="120" y="153.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">money moves</text><text x="120" y="175.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">online</text><line x1="216" y1="149" x2="244" y2="149" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="250" y="104" width="180" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="340" y="142.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Papers have</text><text x="340" y="164.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">less income</text><line x1="436" y1="149" x2="464" y2="149" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="470" y="104" width="180" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="560" y="142.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Reporters are</text><text x="560" y="164.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">cut</text><line x1="656" y1="149" x2="684" y2="149" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="690" y="104" width="180" height="90" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="780" y="131.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Fewer council</text><text x="780" y="153.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">meetings and</text><text x="780" y="175.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">courts reported</text><rect x="30" y="212" width="408" height="155" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="245" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">OTHER CAUSES</text><text x="50" y="274.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="274.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Fewer people buy printed papers</text><text x="50" y="300.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="300.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Owners merge titles to cut costs</text><rect x="462" y="212" width="408" height="155" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="482" y="245" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FURTHER CONSEQUENCES</text><text x="482" y="274.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="497.2" y="274.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Some argue local decisions are less</text><text x="497.2" y="295.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">checked</text><text x="482" y="321.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="497.2" y="321.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Residents may rely more on unverified</text><text x="497.2" y="342.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">posts</text><rect x="30" y="385" width="840" height="58" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="418.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Joining the steps with “so” is analysis; a list of unconnected points is not.</text>
</svg>