<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 590" width="900" height="590" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="590" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Weighing four more courses of action</text>

<rect x="30" y="104" width="260" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="42" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Action</text><rect x="290" y="104" width="300" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="302" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Strength</text><rect x="590" y="104" width="280" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="602" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Weakness</text><rect x="30" y="150" width="260" height="64" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="175.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Media literacy teaching</text><rect x="290" y="150" width="300" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="302" y="175.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Builds lasting skills; does not</text><text x="302" y="196.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">depend on removing content</text><rect x="590" y="150" width="280" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="602" y="175.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Slow; adults outside school are</text><text x="602" y="196.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">harder to reach</text><rect x="30" y="214" width="260" height="85" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="239.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Independent fact-checking</text><rect x="290" y="214" width="300" height="85" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="302" y="239.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Corrects false claims quickly</text><rect x="590" y="214" width="280" height="85" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="602" y="239.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Corrections may reach fewer</text><text x="602" y="260.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">people; some distrust</text><text x="602" y="281.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">fact-checkers</text><rect x="30" y="299" width="260" height="64" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="324.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Public funding for public</text><text x="42" y="345.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">service or local media</text><rect x="290" y="299" width="300" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="302" y="324.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Keeps reporting going where the</text><text x="302" y="345.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">market will not pay</text><rect x="590" y="299" width="280" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="602" y="324.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">May weaken independence from</text><text x="602" y="345.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">government; costs taxpayers</text><rect x="30" y="363" width="260" height="85" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="388.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Community action</text><rect x="290" y="363" width="300" height="85" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="302" y="388.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Cheap and local: newsletters,</text><text x="302" y="409.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">community radio, translated</text><text x="302" y="430.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">notices</text><rect x="590" y="363" width="280" height="85" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="602" y="388.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Depends on volunteers; may not</text><text x="602" y="409.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">last</text><rect x="78.80000000000001" y="466" width="245.6" height="42" rx="21" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="201.60000000000002" y="492.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">How well would it work?</text><rect x="336.40000000000003" y="466" width="208.79999999999998" height="42" rx="21" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="440.8" y="492.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">What would it cost?</text><rect x="557.2" y="466" width="126" height="42" rx="21" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="620.2" y="492.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Who gains?</text><rect x="695.2" y="466" width="126" height="42" rx="21" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="758.2" y="492.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Who loses?</text><rect x="354.8" y="518" width="190.39999999999998" height="42" rx="21" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="544.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Could it be done?</text>
</svg>