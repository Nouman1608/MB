<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 642" width="900" height="642" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="642" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Agenda-setting: does coverage shape priorities?</text>

<rect x="30" y="114" width="840" height="110" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="50" y="147" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">MCCOMBS AND SHAW (1972)</text><text x="50" y="173.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Undecided voters in Chapel Hill, North Carolina, 1968 US presidential</text><text x="50" y="198.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">campaign</text><rect x="80" y="252" width="300" height="90" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="230" y="289.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Issues the media</text><text x="230" y="314.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">covered most</text><rect x="520" y="252" width="300" height="90" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="670" y="289.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Issues voters rated</text><text x="670" y="314.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">most important</text><line x1="384" y1="297" x2="516" y2="297" stroke="#1e2a44" stroke-width="4" stroke-dasharray="10 7"/><text x="450" y="286" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">closely</text><text x="450" y="324" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">matched</text><text x="450" y="382" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">A link is not proof that the media caused the voters’ views</text><rect x="30" y="404" width="268" height="108" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="449" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">LIMITATION</text><text x="50" y="474.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Correlation, not cause</text><rect x="316" y="404" width="268" height="108" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="336" y="449" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">LIMITATION</text><text x="336" y="474.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">One town only</text><rect x="602" y="404" width="268" height="108" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="622" y="437" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">LIMITATION</text><text x="622" y="462.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Long before online</text><text x="622" y="486.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">news</text><rect x="30" y="530" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="563.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Use it as a reason why media coverage matters, not as proof. Newer evidence is needed</text><text x="50" y="585.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">before applying it today.</text>
</svg>