<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 677" width="900" height="677" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="677" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Media issues at three levels</text>

<circle cx="205" cy="303.5" r="175" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="205" cy="303.5" r="116.66666666666667" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><circle cx="205" cy="303.5" r="58.333333333333336" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="205" y="309.5" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Local</text><text x="205" y="397" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">National</text><text x="205" y="455.33333333333337" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Global</text><path d="M236,304.5 C328,304.5 328,166.5 416,166.5" fill="none" stroke="#1e2a44" stroke-width="2" stroke-dasharray="5 5"/><circle cx="236" cy="304.5" r="4" fill="#1e2a44"/><path d="M249.8,392 C334.9,392 334.9,303.5 416,303.5" fill="none" stroke="#1e2a44" stroke-width="2" stroke-dasharray="5 5"/><circle cx="249.8" cy="392" r="4" fill="#1e2a44"/><path d="M240.6,450.33333333333337 C330.3,450.33333333333337 330.3,440.5 416,440.5" fill="none" stroke="#1e2a44" stroke-width="2" stroke-dasharray="5 5"/><circle cx="240.6" cy="450.33333333333337" r="4" fill="#1e2a44"/><rect x="420" y="104" width="450" height="125" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="436" y="135.2" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="start">Local</text><text x="436" y="164.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Local papers closing, so fewer reporters attend</text><text x="436" y="186.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">council meetings or courts; rumours in</text><text x="436" y="208.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">community messaging groups.</text><rect x="420" y="241" width="450" height="125" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="436" y="272.2" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="start">National</text><text x="436" y="301.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">How public service broadcasters are funded,</text><text x="436" y="323.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">such as the BBC licence fee; minority languages</text><text x="436" y="345.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">on national radio and TV.</text><rect x="420" y="378" width="450" height="125" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="436" y="409.2" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Global</text><text x="436" y="438.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">False information crossing borders faster than</text><text x="436" y="460.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">it can be checked; the safety and freedom of</text><text x="436" y="482.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">journalists.</text><rect x="30" y="521" width="268" height="126" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="565" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">MISINFORMATION</text><text x="50" y="589.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">False, shared by</text><text x="50" y="611.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">someone who believes it</text><rect x="316" y="521" width="268" height="126" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="336" y="565" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">DISINFORMATION</text><text x="336" y="589.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">False, shared on</text><text x="336" y="611.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">purpose to mislead</text><rect x="602" y="521" width="268" height="126" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="622" y="554" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">MEDIA LITERACY</text><text x="622" y="578.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">The ability to find,</text><text x="622" y="600.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">judge and create media</text><text x="622" y="622.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">messages</text>
</svg>