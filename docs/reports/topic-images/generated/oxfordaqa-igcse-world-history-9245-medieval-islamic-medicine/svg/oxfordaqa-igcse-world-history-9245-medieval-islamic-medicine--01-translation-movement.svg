<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 645" width="900" height="645" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="645" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The Translation Movement</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Eighth to tenth centuries</text>
<rect x="30" y="124" width="290" height="110" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="45" y="151" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">GREEK</text><text x="45" y="182.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Hippocrates, Galen; Dioscorides</text><text x="45" y="203.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">on medicinal plants</text><rect x="30" y="248" width="290" height="110" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="45" y="275" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">PERSIAN</text><text x="45" y="306.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Medical learning linked to the</text><text x="45" y="327.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">academy at Gundishapur</text><rect x="30" y="372" width="290" height="110" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="45" y="399" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">INDIAN</text><text x="45" y="430.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Medical texts, including Ayurvedic</text><text x="45" y="451.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">works</text><line x1="326" y1="179" x2="374" y2="260.5" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="326" y1="303" x2="374" y2="291.5" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="326" y1="427" x2="374" y2="322.5" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="380" y="194" width="220" height="195" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="490" y="230.38" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Baghdad</text><text x="490" y="259.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">House of Wisdom</text><text x="490" y="280.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">(Caliph al-Ma'mun,</text><text x="490" y="301.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">813-833). Translated</text><text x="490" y="322.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">into <tspan font-weight="700" fill="#1e2a44">Arabic</tspan>, e.g.</text><text x="490" y="343.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Hunayn ibn Ishaq on</text><text x="490" y="364.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Galen</text><rect x="660" y="124" width="210" height="117" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="674" y="152.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Preserved</text><text x="674" y="180.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Ancient knowledge that</text><text x="674" y="201.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">might otherwise have</text><text x="674" y="222.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">been lost</text><line x1="606" y1="291.5" x2="654" y2="179" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><rect x="660" y="248" width="210" height="110" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="674" y="276.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Combined</text><text x="674" y="304.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Traditions from three</text><text x="674" y="325.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">continents</text><line x1="606" y1="291.5" x2="654" y2="303" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><rect x="660" y="372" width="210" height="117" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="674" y="400.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Tested and added to</text><text x="674" y="428.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Physicians criticised</text><text x="674" y="449.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">and improved what</text><text x="674" y="470.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">they read</text><line x1="606" y1="291.5" x2="654" y2="427" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><rect x="30" y="504" width="840" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="538.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Why it could happen</text><text x="50" y="567.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Trade routes linked the Islamic world with Byzantium, Persia, India and China; paper, learned from China</text><text x="50" y="588.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">in the eighth century, made books far cheaper than parchment.</text>
</svg>