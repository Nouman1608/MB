y</text><rect x="255" y="325" width="190" height="100" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="350" y="381" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Library</text><rect x="455" y="325" width="190" height="100" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="550" y="381" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Kitchen</text><rect x="655" y="325" width="190" height="100" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="750" y="371" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Teaching</text><text x="750" y="393" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">medical students</text><text x="450" y="462" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Records kept of patients and treatments · free treatment, paid for by charitable endowments</text><text x="855" y="490" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">Illustrative layout, not a real plan</text><rect x="30" y="522" width="493.2" height="133" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="554" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">BIMARISTAN</text><text x="50" y="580.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">"Place of the sick"</text><text x="50" y="609.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Medical treatment and learning: Baghdad (Adudi, 982),</text><text x="50" y="630.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Damascus (Nur al-Din, 1154), Cairo (Mansuri, 1284).</text><rect x="541.2" y="522" width="328.8" height="133" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="561.2" y="564.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">MOST EUROPEAN RELIGIOUS HOSPITALS</text><text x="561.2" y="591.32" 