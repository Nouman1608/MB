<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 649" width="900" height="649" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="649" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Passing knowledge on</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">From the Islamic world to Europe and Asia</text>
<rect x="225" y="124" width="450" height="89" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="159.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Arabic medical texts</text><text x="450" y="188.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">e.g. Ibn Sina's <tspan font-style="italic">Canon</tspan>; Al-Zahrawi's surgery</text><rect x="30" y="263" width="405" height="73" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="45" y="290" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">WEST TO EUROPE</text><text x="45" y="316.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Via Spain, Sicily and southern Italy</text><line x1="232.5" y1="341" x2="232.5" y2="365" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="370" width="405" height="115" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="45" y="397.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="60.2" y="397.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">11th century: <tspan font-weight="700" fill="#1e2a44">Constantine</tspan> <tspan font-weight="700" fill="#1e2a44">the</tspan> <tspan font-weight="700" fill="#1e2a44">African</tspan></text><text x="60.2" y="418.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">translates Arabic works into Latin in Italy</text><text x="45" y="444.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="60.2" y="444.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">12th century: <tspan font-weight="700" fill="#1e2a44">Gerard</tspan> <tspan font-weight="700" fill="#1e2a44">of</tspan> <tspan font-weight="700" fill="#1e2a44">Cremona</tspan> in Toledo</text><text x="60.2" y="465.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">translates the <tspan font-style="italic">Canon</tspan> and Al-Zahrawi's surgery</text><line x1="232.5" y1="490" x2="232.5" y2="514" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="519" width="405" height="98" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="45" y="548.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Salerno and Montpellier</text><text x="45" y="576.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Medical schools used these texts; the <tspan font-style="italic">Canon</tspan> was</text><text x="45" y="597.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">taught into the 17th century.</text><rect x="465" y="263" width="405" height="101" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="480" y="290" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">EAST TO ASIA</text><text x="480" y="316.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Persia, Central Asia and India</text><text x="480" y="344.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Spread with scholars and rulers.</text><line x1="667.5" y1="369" x2="667.5" y2="393" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="465" y="398" width="405" height="98" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="480" y="427.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Unani medicine</text><text x="480" y="455.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">("Greek" medicine) still practised in South Asia</text><text x="480" y="476.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">today.</text><line x1="330" y1="217" x2="232" y2="257" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><line x1="570" y1="217" x2="668" y2="257" stroke="#8a6d0d" stroke-width="3.5" marker-end="url(#ahO)"/>
</svg>