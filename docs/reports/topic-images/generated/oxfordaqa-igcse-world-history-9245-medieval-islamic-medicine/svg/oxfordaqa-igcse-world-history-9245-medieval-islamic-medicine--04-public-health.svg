<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 422" width="900" height="422" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="422" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Public health in Islamic cities</text>

<rect x="30" y="100" width="411" height="136" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">WASHING</text><text x="50" y="159.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Cleanliness</text><text x="50" y="189.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Ritual washing before prayer; public baths</text><text x="50" y="211.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">(hammams) common in cities.</text><rect x="459" y="100" width="411" height="136" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="479" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">WATER SUPPLY</text><text x="479" y="159.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Clean water</text><text x="479" y="189.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Aqueducts, underground channels (qanats),</text><text x="479" y="211.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">wells and public fountains.</text><rect x="30" y="254" width="411" height="136" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="286" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SANITATION</text><text x="50" y="313.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Removing waste</text><text x="50" y="343.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Some cities had drains and systems for</text><text x="50" y="365.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">removing waste.</text><rect x="459" y="254" width="411" height="136" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="479" y="286" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">REGULATION</text><text x="479" y="313.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Market inspectors</text><text x="479" y="343.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">The muhtasib checked market cleanliness,</text><text x="479" y="365.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">food quality and honest trading.</text>
</svg>