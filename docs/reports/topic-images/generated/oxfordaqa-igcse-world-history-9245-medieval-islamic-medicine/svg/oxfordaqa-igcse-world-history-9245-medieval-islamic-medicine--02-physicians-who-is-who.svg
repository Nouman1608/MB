<rect width="900" height="732" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Islamic physicians and scholars</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Lifespans on a common scale, 800-1300</text>
<line x1="470" y1="148" x2="470" y2="706" stroke="#c9d6d4" stroke-width="1.5"/><text x="470" y="140" font-size="15" font-weight="600" fill="#4a5568" text-anchor="middle">800</text><line x1="548" y1="148" x2="548" y2="706" stroke="#c9d6d4" stroke-width="1.5"/><text x="548" y="140" font-size="15" font-weight="600" fill="#4a5568" text-anchor="middle">900</text><line x1="626" y1="148" x2="626" y2="706" stroke="#c9d6d4" stroke-width="1.5"/><text x="626" y="140" font-size="15" font-weight="600" fill="#4a5568" text-anchor="middle">1000</text><line x1="704" y1="148" x2="704" y2="706" stroke="#c9d6d4" stroke-width="1.5"/><text x="704" y="140" font-size="15" font-weight="600" fill="#4a5568" text-anchor="middle">1100</text><line x1="782" y1="148" x2="782" y2="706" stroke="#c9d6d4" stroke-width="1.5"/><text x="782" y="140" font-size="15" font-weight="600" fill="#4a5568" text-anchor="middle">1200</text><line x1="860" y1="148" x2="860" y2="706" stroke="#c9d6d4" stroke-width="1.5"/><text x="860" y="140" font-size="15" font-weight="600" fill="#4a5568" text-anchor="middle">1300</text><rect x="30" y="158" width="840" height="82" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="188" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Al-Kindi</text><text x="48" y="212" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Baghdad. Pharmacology: maths to calculate the</text><text x="48" y="231" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">strength of compound drugs; a formulary.</text><rect x="470.78" y="188" width="56.16000000000008" height="22" rx="6" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><text x="534.94" y="205" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">c801-c873</text><rect x="30" y="250" width="840" height="82" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="280" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Hunayn ibn Ishaq</text><text x="48" y="304" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Christian physician; translated many of Galen's works,</text><text x="48" y="323" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">comparing manuscripts.</text><circle cx="526.94" cy="291" r="9" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><text x="540.94" y="297" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">died 873</text><rect x="30" y="342" width="840" height="82" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="372" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Al-Razi (Rhazes)</text><text x="48" y="396" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Observation and case records; smallpox and measles</text><text x="48" y="415" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">distinguished; <tspan font-style="italic">Doubts</tspan> <tspan font-style="italic">about</tspan> <tspan font-style="italic">Galen</tspan>.</text><rect x="512.12" y="372" width="55.379999999999995" height="22" rx="6" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><text x="575.5" y="389" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">c854-c925</text><rect x="30" y="434" width="840" height="82" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="464" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Al-Zahrawi (Albucasis)</text><text x="48" y="488" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Córdoba. Surgery volume of <tspan font-style="italic">Kitab</tspan> <tspan font-style="italic">al-Tasrif</tspan>: about 200</text><text x="48" y="507" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">instruments drawn; catgut stitches.</text><rect x="576.08" y="464" width="60.059999999999945" height="22" rx="6" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><text x="644.14" y="481" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">c936-c1013</text><rect x="30" y="526" width="840" height="82" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="556" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Ibn Sina (Avicenna)</text><text x="48" y="580" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Canon</tspan> <tspan font-style="italic">of</tspan> <tspan font-style="italic">Medicine</tspan> (c1025): five books; contagion; rules</text><text x="48" y="599" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">for testing drugs.</text><rect x="610.4" y="556" width="44.460000000000036" height="22" rx="6" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><text x="662.86" y="573" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">980-1037</text><rect x="30" y="618" width="840" height="82" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="648" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Ibn al-Baytar</text><text x="48" y="672" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Compendium</tspan> <tspan font-style="italic">on</tspan> <tspan font-style="italic">Simple</tspan> <tspan font-style="italic">Medicaments</tspan> <tspan font-style="italic">and</tspan> <tspan font-style="italic">Foods</tspan>: about</text><text x="48" y="691" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">1,400 substances.</text><circle cx="819.44" cy="659" r="9" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><text x="805.44" y="665" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="end">died 1248</text>
</svg>