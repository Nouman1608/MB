<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 735" width="900" height="735" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="735" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Designing a nature reserve</text>

<rect x="30" y="110" width="410" height="270" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="148" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">One large vs several small</text><circle cx="130" cy="230" r="62" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><circle cx="130" cy="230" r="38" fill="#b5d3cf"/><circle cx="270" cy="200" r="30" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><circle cx="270" cy="200" r="6" fill="#b5d3cf"/><circle cx="345" cy="210" r="26" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><circle cx="345" cy="210" r="2" fill="#b5d3cf"/><circle cx="285" cy="268" r="28" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><circle cx="285" cy="268" r="4" fill="#b5d3cf"/><circle cx="360" cy="275" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="130" y="312" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">more core</text><text x="315" y="312" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">mostly edge</text><text x="235" y="362" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Small ones can spread risk of fire or disease</text><rect x="460" y="110" width="410" height="270" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="484" y="148" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Compact vs long and thin</text><rect x="510" y="160" width="140" height="140" rx="6" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><rect x="534" y="184" width="92" height="92" fill="#b5d3cf"/><rect x="680" y="160" width="40" height="140" rx="4" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><rect x="740" y="160" width="40" height="140" rx="4" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><rect x="800" y="160" width="40" height="140" rx="4" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><rect x="695" y="175" width="10" height="110" fill="#b5d3cf"/><rect x="755" y="175" width="10" height="110" fill="#b5d3cf"/><rect x="815" y="175" width="10" height="110" fill="#b5d3cf"/><text x="580" y="322" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">less edge per area</text><text x="760" y="322" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">mostly edge</text><text x="665" y="362" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Near-circular or square shapes keep more core</text><rect x="30" y="400" width="410" height="270" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="438" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Wildlife corridors</text><circle cx="110" cy="520" r="50" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><circle cx="110" cy="520" r="32" fill="#b5d3cf"/><circle cx="310" cy="520" r="50" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><circle cx="310" cy="520" r="32" fill="#b5d3cf"/><rect x="160" y="508" width="100" height="24" fill="#a9c48f" stroke="#6f9a52" stroke-width="2.5"/><path d="M180,488 Q210,470 240,488" fill="none" stroke="#2e6b62" stroke-width="3" stroke-linecap="round" marker-end="url(#ahT)"/><ellipse cx="210" cy="520" rx="9" ry="6.75" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="219" cy="518" r="3.6" fill="#1e2a44"/><text x="210" y="470" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">gene flow</text><text x="235" y="652" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Link fragments so animals can move and find mates</text><rect x="460" y="400" width="410" height="270" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="484" y="438" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Buffer zone</text><circle cx="665" cy="525" r="88" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" stroke-dasharray="8 6"/><circle cx="665" cy="525" r="52" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="665" y="531" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">core</text><text x="665" y="461" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">buffer</text><text x="665" y="652" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Surrounds the core with limited human use</text><circle cx="248" cy="707" r="9" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="265" y="713" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">edge effects: light, wind, drying, noise, predators, invasives</text><circle cx="755" cy="707" r="9" fill="#b5d3cf"/><text x="772" y="713" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">core</text>
</svg>