<rect width="900" height="718" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How a new species forms</text>

<rect x="30" y="110" width="840" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="46" y="124" width="300" height="104" rx="10" fill="#e6efd9"/><circle cx="217.0" cy="176.0" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="166.1" cy="189.7" r="9" fill="#8a6d0d" stroke="#1e2a44" stroke-width="2"/><circle cx="201.2" cy="146.1" r="9" fill="#efdfa8" stroke="#1e2a44" stroke-width="2"/><circle cx="208.8" cy="184.3" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="156.1" cy="172.5" r="9" fill="#8a6d0d" stroke="#1e2a44" stroke-width="2"/><circle cx="246.6" cy="159.9" r="9" fill="#efdfa8" stroke="#1e2a44" stroke-width="2"/><circle cx="190.5" cy="186.1" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="177.3" cy="158.0" r="9" fill="#8a6d0d" stroke="#1e2a44" stroke-width="2"/><circle cx="252.4" cy="186.3" r="9" fill="#efdfa8" stroke="#1e2a44" stroke-width="2"/><path d="M150,142 Q196,126 242,142" fill="none" stroke="#2e6b62" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ahT)"/><path d="M242,210 Q196,226 150,210" fill="none" stroke="#2e6b62" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ahT)"/><circle cx="395" cy="176" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="395" y="184.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="440" y="154" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="start">One population</text><text x="440" y="184" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Individuals vary and interbreed freely, so</text><text x="440" y="206" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">genes flow through the whole population.</text><rect x="30" y="254" width="840" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="46" y="268" width="300" height="104" rx="10" fill="#e6efd9"/><path d="M190,268 Q205,300 188,320 Q172,345 196,372 L216,372 Q192,345 208,320 Q225,300 210,268 Z" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><circle cx="133.4" cy="325.0" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="75.7" cy="324.8" r="9" fill="#8a6d0d" stroke="#1e2a44" stroke-width="2"/><circle cx="148.3" cy="295.0" r="9" fill="#efdfa8" stroke="#1e2a44" stroke-width="2"/><circle cx="118.2" cy="330.4" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="83.4" cy="307.3" r="9" fill="#8a6d0d" stroke="#1e2a44" stroke-width="2"/><circle cx="174.9" cy="318.0" r="9" fill="#efdfa8" stroke="#1e2a44" stroke-width="2"/><circle cx="100.5" cy="327.6" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="115.9" cy="299.8" r="9" fill="#8a6d0d" stroke="#1e2a44" stroke-width="2"/><circle cx="154.6" cy="342.5" r="9" fill="#efdfa8" stroke="#1e2a44" stroke-width="2"/><circle cx="290.6" cy="330.1" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="250.7" cy="309.3" r="9" fill="#8a6d0d" stroke="#1e2a44" stroke-width="2"/><circle cx="344.0" cy="314.5" r="9" fill="#efdfa8" stroke="#1e2a44" stroke-width="2"/><circle cx="272.4" cy="328.4" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="281.1" cy="299.8" r="9" fill="#8a6d0d" stroke="#1e2a44" stroke-width="2"/><circle cx="329.6" cy="340.1" r="9" fill="#efdfa8" stroke="#1e2a44" stroke-width="2"/><circle cx="264.0" cy="320.1" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="314.6" cy="306.2" r="9" fill="#8a6d0d" stroke="#1e2a44" stroke-width="2"/><circle cx="280.2" cy="349.9" r="9" fill="#efdfa8" stroke="#1e2a44" stroke-width="2"/><text x="224" y="286" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">barrier</text><circle cx="395" cy="320" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="395" y="328.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="440" y="298" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="start">Isolation</text><text x="440" y="328" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">A barrier such as a sea, mountain range or</text><text x="440" y="350" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">river splits the population. Gene flow stops.</text><rect x="30" y="398" width="840" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="46" y="412" width="300" height="104" rx="10" fill="#e6efd9"/><path d="M190,412 Q205,444 188,464 Q172,489 196,516 L216,516 Q192,489 208,464 Q225,444 210,412 Z" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><circle cx="133.4" cy="469.0" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="75.7" cy="468.8" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="148.3" cy="439.0" r="9" fill="#efdfa8" stroke="#1e2a44" stroke-width="2"/><circle cx="118.2" cy="474.4" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="83.4" cy="451.3" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="174.9" cy="462.0" r="9" fill="#efdfa8" stroke="#1e2a44" stroke-width="2"/><circle cx="100.5" cy="471.6" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="115.9" cy="443.8" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="154.6" cy="486.5" r="9" fill="#efdfa8" stroke="#1e2a44" stroke-width="2"/><circle cx="290.6" cy="474.1" r="9" fill="#8a6d0d" stroke="#1e2a44" stroke-width="2"/><circle cx="250.7" cy="453.3" r="9" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><circle cx="344.0" cy="458.5" r="9" fill="#8a6d0d" stroke="#1e2a44" stroke-width="2"/><circle cx="272.4" cy="472.4" r="9" fill="#8a6d0d" stroke="#1e2a44" stroke-width="2"/><circle cx="281.1" cy="443.8" r="9" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><circle cx="329.6" cy="484.1" r="9" fill="#8a6d0d" stroke="#1e2a44" stroke-width="2"/><circle cx="264.0" cy="464.1" r="9" fill="#8a6d0d" stroke="#1e2a44" stroke-width="2"/><circle cx="314.6" cy="450.2" r="9" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><circle cx="280.2" cy="493.9" r="9" fill="#8a6d0d" stroke="#1e2a44" stroke-width="2"/><circle cx="395" cy="464" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="395" y="472.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="440" y="442" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="start">Divergence</text><text x="440" y="472" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Each side faces different selection pressures</text><text x="440" y="494" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">and random changes; allele frequencies change</text><text x="440" y="516" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">differently.</text><rect x="30" y="542" width="840" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="46" y="556" width="300" height="104" rx="10" fill="#e6efd9"/><path d="M190,556 Q205,588 188,608 Q172,633 196,660 L216,660 Q192,633 208,608 Q225,588 210,556 Z" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><circle cx="133.4" cy="613.0" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="75.7" cy="612.8" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="148.3" cy="583.0" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="118.2" cy="618.4" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="83.4" cy="595.3" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="174.9" cy="606.0" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="100.5" cy="615.6" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="115.9" cy="587.8" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="154.6" cy="630.5" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="290.6" cy="618.1" r="9" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><circle cx="250.7" cy="597.3" r="9" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><circle cx="344.0" cy="602.5" r="9" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><circle cx="272.4" cy="616.4" r="9" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><circle cx="281.1" cy="587.8" r="9" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><circle cx="329.6" cy="628.1" r="9" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><circle cx="264.0" cy="608.1" r="9" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><circle cx="314.6" cy="594.2" r="9" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><circle cx="280.2" cy="637.9" r="9" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><circle cx="395" cy="608" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="395" y="616.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="440" y="586" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="start">Two species</text><text x="440" y="616" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">In time they are so different they can no</text><text x="440" y="638" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">longer interbreed to produce fertile</text><text x="440" y="660" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">offspring.</text><text x="450" y="708" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Reproductive isolation can also split populations in the same area, e.g. breeding at different times.</text>
</svg>