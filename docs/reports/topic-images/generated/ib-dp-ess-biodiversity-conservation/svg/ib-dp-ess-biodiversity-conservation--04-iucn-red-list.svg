<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Judging threat: the IUCN Red List</text>

<text x="450" y="140" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">risk of extinction increases →</text><rect x="30" y="160" width="112" height="130" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="86" y="210" font-size="30" font-weight="700" fill="#1e2a44" text-anchor="middle">LC</text><text x="86" y="246" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">Least</text><text x="86" y="266" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">Concern</text><rect x="151" y="160" width="112" height="130" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="207" y="210" font-size="30" font-weight="700" fill="#1e2a44" text-anchor="middle">NT</text><text x="207" y="246" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">Near</text><text x="207" y="266" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">Threatened</text><rect x="272" y="160" width="112" height="130" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="328" y="210" font-size="30" font-weight="700" fill="#1e2a44" text-anchor="middle">VU</text><text x="328" y="246" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">Vulnerable</text><text x="328" y="266" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle"></text><rect x="393" y="160" width="112" height="130" rx="12" fill="#efdfa8" stroke="#1e2a44" stroke-width="2.5"/><text x="449" y="210" font-size="30" font-weight="700" fill="#1e2a44" text-anchor="middle">EN</text><text x="449" y="246" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">Endangered</text><text x="449" y="266" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle"></text><rect x="514" y="160" width="112" height="130" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="570" y="210" font-size="30" font-weight="700" fill="#1e2a44" text-anchor="middle">CR</text><text x="570" y="246" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">Critically</text><text x="570" y="266" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">Endangered</text><rect x="635" y="160" width="112" height="130" rx="12" fill="#b5602e" stroke="#1e2a44" stroke-width="2.5"/><text x="691" y="210" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">EW</text><text x="691" y="246" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">Extinct in</text><text x="691" y="266" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">the Wild</text><rect x="756" y="160" width="112" height="130" rx="12" fill="#1e2a44" stroke="#1e2a44" stroke-width="2.5"/><text x="812" y="210" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">EX</text><text x="812" y="246" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">Extinct</text><text x="812" y="266" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle"></text><rect x="30" y="310" width="840" height="46" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" stroke-dasharray="7 6"/><text x="450" y="340" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">Data Deficient (DD): not enough information to assess</text><rect x="30" y="380" width="840" height="260" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="420" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Criteria used in the assessment</text><rect x="60" y="440" width="180" height="90" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="150" y="480.21000000000004" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Population size</text><text x="150" y="500.97" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">and rate of decline</text><rect x="260" y="440" width="180" height="90" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="350" y="480.21000000000004" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Geographical range</text><text x="350" y="500.97" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">size and fragmentation</text><rect x="460" y="440" width="180" height="90" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="550" y="480.21000000000004" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Number of mature</text><text x="550" y="500.97" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">individuals</text><rect x="660" y="440" width="180" height="90" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="750" y="480.21000000000004" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Probability of</text><text x="750" y="500.97" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">extinction in the wild</text><path d="M120.0,613.0 L736.6,613.0 L736.6,624.7 L760.0,600.0 L736.6,575.3 L736.6,587.0 L120.0,587.0 Z" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" stroke-linejoin="round"/><text x="440" y="607" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">steep decline or tiny range → higher-threat category</text>
