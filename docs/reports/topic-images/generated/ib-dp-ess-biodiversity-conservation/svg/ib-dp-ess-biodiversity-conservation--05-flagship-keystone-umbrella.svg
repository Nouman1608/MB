4" stroke-width="2.5"/><path d="M513.1,329.6 L549.1,312.3 A110,110 0 0 1 560.0,360.0 L520.0,360.0 A70,70 0 0 0 513.1,329.6 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.5"/><line x1="330" y1="360" x2="570" y2="360" stroke="#1e2a44" stroke-width="3"/><text x="450" y="228" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">keystone</text><text x="450" y="412.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">effect on its ecosystem far</text><text x="450" y="434.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">larger than its numbers suggest</text><rect x="600" y="110" width="270" height="360" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="735" y="150" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Umbrella</text><path d="M630,270 Q735,170 840,270 Q813,258 787,270 Q761,258 735,270 Q709,258 683,270 Q657,258 630,270 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><line x1="735" y1="270" x2="735" y2="352" stroke="#1e2a44" stroke-width="4"/><path d="M735,352 q0,12 -12,12 q-10,0 -10,-10" fill="none" stroke="#1e2a44" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><ellipse cx="665" cy="340" rx="10" ry="7.5" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="675" cy="338" r="4" fill="#1e2a44"/><line x1="695" y1="305" x2="695" y2="327" stroke="#6f9a52" stroke-width="3"/><circle cx="702" cy="305" r="6" fill="#b5602e" stroke="#1e2a44" stroke-width="1.5"/><circle cx="697.1631189606246" cy="311.65739561406605" r="6" fill="#b5602e" stroke="#1e2a44" stroke-width="1.5"/><circle cx="689.3368810393754" cy="309.1144967660473" r="6" fill="#b5602e" stroke="#1e2a44" stroke-width="1.5"/><circle cx="689.3368810393754" cy="300.8855032339527" r="6" fill="#b5602e" stroke="#1e2a44" stroke-width="1.5"/><circle cx="697.1631189606246" cy="298.3426043859339" r="6" fill="#b5602e" stroke="#1e2a44" stroke-width="1.5"/><circle cx="695" cy="305" r="4" fill="#d4b02e"/><ellipse cx="790" cy="345" rx="10" ry="7.5" fill="#8a6d0d" stroke="#1e2a44" stroke-width="2"/><circle cx="800" cy="343" r="4" fill="#1e2a44"/><line x1="815" y1="300" x2="815" y2="322" stroke="#6f9a52" stroke-width="3"/><circle cx="822" cy="300" r="6" fill="#ffffff" stroke="#1e2a44" stroke-width="1.5"/><circle cx="817.1631189606246" cy="306.65739561406605" r="6" fill="#ffffff" stroke="#1e2a44" stroke-width="1.5"/><circle cx="809.3368810393754" cy="304.1144967660473" r="6" fill="#ffffff" stroke="#1e2a44" stroke-width="1.5"/><circle cx="809.3368810393754" cy="295.8855032339527" r="6" fill="#ffffff" stroke="#1e2a44" stroke-width="1.5"/><circle cx="817.1631189606246" cy="293.3426043859339" r="6" fill="#ffffff" stroke="#1e2a44" stroke-width="1.5"/><circle cx="815" cy="300" r="4" fill="#d4b02e"/><rect x="757.9" y="335.8" width="4.199999999999999" height="11.2" fill="#9c8f6e"/><circle cx="760" cy="328.8" r="9.799999999999999" fill="#6f9a52" stroke="#1e2a44" stroke-width="2"/><text x="735" y="412.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">needs a large area, so protecting</text><text x="735" y="434.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">it protects many other species</text><rect x="30" y="490" width="840" height="110" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="60" y="526" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Weakness of species-based conservation</text><text x="60" y="554" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A species returned to a damaged habitat will decline again,</text><text x="60" y="578" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">and small captive populations can lose genetic diversity.</text>
