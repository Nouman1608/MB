<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Core area: one large or four small?</text>

<rect x="30" y="110" width="410" height="560" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="235" y="150" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">One large reserve</text><rect x="125" y="180" width="220" height="220" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><rect x="152.5" y="207.5" width="165" height="165" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2" stroke-dasharray="6 4"/><text x="235" y="298" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">core</text><text x="235" y="426" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">4 km × 4 km</text><text x="70" y="470" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Total area = 16 km²</text><text x="70" y="497" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Core side = 4 − 2(0.5) = 3 km</text><text x="70" y="524" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Core area = 3 × 3 = 9 km²</text><rect x="70" y="570" width="330" height="70" rx="12" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><text x="235" y="614" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">Core share 56.25%</text><rect x="460" y="110" width="410" height="560" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="665" y="150" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Four small reserves</text><rect x="548" y="180" width="110" height="110" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><rect x="575.5" y="207.5" width="55" height="55" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2" stroke-dasharray="6 4"/><rect x="673" y="180" width="110" height="110" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><rect x="700.5" y="207.5" width="55" height="55" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2" stroke-dasharray="6 4"/><rect x="548" y="305" width="110" height="110" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><rect x="575.5" y="332.5" width="55" height="55" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2" stroke-dasharray="6 4"/><rect x="673" y="305" width="110" height="110" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><rect x="700.5" y="332.5" width="55" height="55" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2" stroke-dasharray="6 4"/><text x="665" y="442" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">each 2 km × 2 km</text><text x="500" y="470" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Total area = 4 × (2 × 2) = 16 km²</text><text x="500" y="497" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Core side = 2 − 2(0.5) = 1 km</text><text x="500" y="524" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Core area = 4 × (1 × 1) = 4 km²</text><rect x="500" y="570" width="330" height="70" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="665" y="614" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">Core share 25%</text><rect x="200" y="692" width="30" height="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="240" y="710" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">edge zone (0.5 km)</text><rect x="470" y="692" width="30" height="22" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><text x="510" y="710" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">core area</text>
