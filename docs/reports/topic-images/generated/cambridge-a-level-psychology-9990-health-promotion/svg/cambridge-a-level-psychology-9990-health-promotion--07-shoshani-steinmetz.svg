<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 850" width="900" height="850" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="850" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Key study: Shoshani and Steinmetz (2014)</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">A school-based positive psychology programme in Israel</text>
<rect x="30" y="124" width="840" height="52" rx="14" fill="#2e6b62"/><rect x="30" y="154" width="840" height="22" fill="#2e6b62"/><text x="50" y="158" font-size="21" font-weight="700" fill="#ffffff" text-anchor="start">Middle-school students: intervention vs control</text><text x="850" y="158" font-size="16" font-weight="600" fill="#ffffff" text-anchor="end">field intervention</text><rect x="30" y="176" width="280" height="164" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="204" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">AIM</text><text x="46" y="235.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">To evaluate a school</text><text x="46" y="256.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">programme to promote</text><text x="46" y="277.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">adolescents' mental health and</text><text x="46" y="298.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">well-being.</text><rect x="310" y="176" width="280" height="164" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="326" y="204" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DESIGN</text><text x="326" y="235.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Intervention classes got the</text><text x="326" y="256.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">programme; a control group did</text><text x="326" y="277.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">not. Whole classes or schools</text><text x="326" y="298.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">took part, so <tspan font-weight="700" fill="#1e2a44">no</tspan> <tspan font-weight="700" fill="#1e2a44">individual</tspan></text><text x="326" y="319.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">random</tspan> <tspan font-weight="700" fill="#1e2a44">allocation</tspan>.</text><rect x="590" y="176" width="280" height="164" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="606" y="204" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">MEASURES</text><text x="606" y="235.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Questionnaires before and after:</text><text x="606" y="256.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">psychological distress,</text><text x="606" y="277.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">self-esteem, optimism.</text><rect x="30" y="362" width="413" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="394" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">RESULTS</text><text x="50" y="425.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Intervention group: <tspan font-weight="700" fill="#1e2a44">reduced</tspan> distress (anxiety,</text><text x="50" y="446.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">depression) and <tspan font-weight="700" fill="#1e2a44">gains</tspan> in self-esteem and</text><text x="50" y="467.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">optimism, which the control group did not show.</text><rect x="457" y="362" width="413" height="130" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="477" y="394" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CONCLUSION</text><text x="477" y="425.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Positive psychology can be applied in schools to</text><text x="477" y="446.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">improve students' mental health.</text><clipPath id="tc514"><rect x="30" y="514" width="840" height="304" rx="14"/></clipPath><g clip-path="url(#tc514)"><rect x="30" y="514" width="182.970297029703" height="48" fill="#b5d3cf"/><text x="44" y="541.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Issue</text><rect x="212.970297029703" y="514" width="565.5445544554456" height="48" fill="#b5d3cf"/><text x="226.970297029703" y="541.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Point</text><rect x="778.5148514851486" y="514" width="91.4851485148515" height="48" fill="#b5d3cf"/><text x="792.5148514851486" y="541.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">+/−</text><rect x="30" y="562" width="182.970297029703" height="47" fill="#dce9e7"/><text x="44" y="588.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Application</text><rect x="212.970297029703" y="562" width="565.5445544554456" height="47" fill="#ffffff"/><text x="226.970297029703" y="588.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Inexpensive; delivered in ordinary classes.</text><rect x="778.5148514851486" y="562" width="91.4851485148515" height="47" fill="#dce9e7"/><text x="792.5148514851486" y="588.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">+</tspan></text><line x1="30" y1="609" x2="870" y2="609" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="609" width="182.970297029703" height="47" fill="#dce9e7"/><text x="44" y="635.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Psychometrics</text><rect x="212.970297029703" y="609" width="565.5445544554456" height="47" fill="#f8faf9"/><text x="226.970297029703" y="635.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Quantitative data, but self-report open to social desirability.</text><rect x="778.5148514851486" y="609" width="91.4851485148515" height="47" fill="#f2e7b8"/><text x="792.5148514851486" y="635.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">±</tspan></text><line x1="30" y1="656" x2="870" y2="656" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="656" width="182.970297029703" height="68" fill="#dce9e7"/><text x="44" y="682.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Confounds</text><rect x="212.970297029703" y="656" width="565.5445544554456" height="68" fill="#ffffff"/><text x="226.970297029703" y="682.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Not randomly allocated individuals: school or class differences could</text><text x="226.970297029703" y="703.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">explain results.</text><rect x="778.5148514851486" y="656" width="91.4851485148515" height="68" fill="#f6e3d8"/><text x="792.5148514851486" y="682.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">−</tspan></text><line x1="30" y1="724" x2="870" y2="724" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="724" width="182.970297029703" height="47" fill="#dce9e7"/><text x="44" y="750.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Culture</text><rect x="212.970297029703" y="724" width="565.5445544554456" height="47" fill="#f8faf9"/><text x="226.970297029703" y="750.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">May not transfer to cultures with different ideas about happiness.</text><rect x="778.5148514851486" y="724" width="91.4851485148515" height="47" fill="#f6e3d8"/><text x="792.5148514851486" y="750.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">−</tspan></text><line x1="30" y1="771" x2="870" y2="771" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="771" width="182.970297029703" height="47" fill="#dce9e7"/><text x="44" y="797.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Nomothetic</text><rect x="212.970297029703" y="771" width="565.5445544554456" height="47" fill="#ffffff"/><text x="226.970297029703" y="797.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Group averages may hide students who did not benefit.</text><rect x="778.5148514851486" y="771" width="91.4851485148515" height="47" fill="#f6e3d8"/><text x="792.5148514851486" y="797.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">−</tspan></text></g><line x1="212.970297029703" y1="514" x2="212.970297029703" y2="818" stroke="#c9d6d4" stroke-width="1.5"/><line x1="778.5148514851486" y1="514" x2="778.5148514851486" y2="818" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="514" width="840" height="304" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/>
</svg>