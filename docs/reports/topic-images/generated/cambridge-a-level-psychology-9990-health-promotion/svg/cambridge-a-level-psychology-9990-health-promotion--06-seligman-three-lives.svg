<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 395" width="900" height="395" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="395" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Positive psychology: three focuses</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Seligman (2004): strengths, well-being and flourishing, not only illness</text>
<rect x="30" y="124" width="270.6666666666667" height="159" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">1</text><text x="50" y="184.38" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">The pleasant life</text><text x="50" y="214.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Experiencing positive</text><text x="50" y="236.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">emotions about the past,</text><text x="50" y="258.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">present and future.</text><rect x="314.6666666666667" y="124" width="270.6666666666667" height="159" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="334.6666666666667" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">2</text><text x="334.6666666666667" y="184.38" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">The good life</text><text x="334.6666666666667" y="214.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The engaged life: using</text><text x="334.6666666666667" y="236.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">one's strengths in absorbing</text><text x="334.6666666666667" y="258.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">activities.</text><rect x="599.3333333333334" y="124" width="270.6666666666667" height="159" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="619.3333333333334" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">3</text><text x="619.3333333333334" y="184.38" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">The meaningful life</text><text x="619.3333333333334" y="214.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Using strengths in the</text><text x="619.3333333333334" y="236.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">service of something larger</text><text x="619.3333333333334" y="258.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">than oneself.</text><rect x="30" y="305" width="840" height="58" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="450" y="338.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Do not confuse the <tspan font-weight="700" fill="#1e2a44">good</tspan> <tspan font-weight="700" fill="#1e2a44">life</tspan> (engagement) with the <tspan font-weight="700" fill="#1e2a44">pleasant</tspan> <tspan font-weight="700" fill="#1e2a44">life</tspan> (positive emotion).</text>
</svg>