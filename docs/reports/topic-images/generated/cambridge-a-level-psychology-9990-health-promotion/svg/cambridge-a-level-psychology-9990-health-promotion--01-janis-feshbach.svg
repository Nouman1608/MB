<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 709" width="900" height="709" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="709" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Janis and Feshbach (1953): fear appeals</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">High-school students heard a talk on dental hygiene</text>
<rect x="30" y="124" width="840" height="270" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CHANGE IN REPORTED DENTAL BEHAVIOUR A WEEK LATER (rank order)</text><text x="230" y="206" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">Minimal fear</text><rect x="250" y="184" width="420" height="34" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="682" y="207" font-size="16" font-weight="600" fill="#4a5568" text-anchor="start">most change</text><text x="230" y="258" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">Moderate fear</text><rect x="250" y="236" width="280" height="34" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="542" y="259" font-size="16" font-weight="600" fill="#4a5568" text-anchor="start"></text><text x="230" y="310" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">Strong fear</text><rect x="250" y="288" width="140" height="34" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="402" y="311" font-size="16" font-weight="600" fill="#4a5568" text-anchor="start">least change</text><text x="230" y="362" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">Control</text><text x="254" y="363" font-size="16" font-weight="600" fill="#4a5568" text-anchor="start">talk on another topic</text><text x="850" y="384" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">bar lengths show order only: the lesson gives no sizes</text><rect x="30" y="416" width="508.3076923076923" height="130" rx="14" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="448" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">WHY STRONG FEAR CAN BACKFIRE</text><text x="50" y="479.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A very frightening message with <tspan font-weight="700" fill="#1e2a44">no</tspan> <tspan font-weight="700" fill="#1e2a44">clear</tspan> <tspan font-weight="700" fill="#1e2a44">way</tspan> <tspan font-weight="700" fill="#1e2a44">to</tspan> <tspan font-weight="700" fill="#1e2a44">cope</tspan> →</text><text x="50" y="500.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">people reduce anxiety by <tspan font-weight="700" fill="#1e2a44">avoiding</tspan> <tspan font-weight="700" fill="#1e2a44">or</tspan> <tspan font-weight="700" fill="#1e2a44">dismissing</tspan> the</text><text x="50" y="521.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">message instead of changing.</text><rect x="552.3076923076924" y="416" width="317.6923076923077" height="130" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="572.3076923076924" y="448" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">WHAT HELPS</text><text x="572.3076923076924" y="479.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Pair the fear appeal with <tspan font-weight="700" fill="#1e2a44">specific,</tspan></text><text x="572.3076923076924" y="500.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">achievable</tspan> <tspan font-weight="700" fill="#1e2a44">advice</tspan>.</text><rect x="30" y="568" width="295" height="109" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="600" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">+ STRENGTHS</text><text x="50" y="631.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Control group; standardised</text><text x="50" y="652.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">talks.</text><rect x="339" y="568" width="531" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="359" y="600" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">− WEAKNESSES</text><text x="359" y="631.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Self-reported behaviour after only a week; ethics of deliberately</text><text x="359" y="652.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">frightening young people.</text>
</svg>