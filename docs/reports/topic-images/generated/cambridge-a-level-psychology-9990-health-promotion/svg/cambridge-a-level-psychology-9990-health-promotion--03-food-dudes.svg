<rect width="900" height="726" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Food Dudes: Tapper et al. (2003)</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Healthy eating in primary schools</text>
<rect x="30" y="124" width="410" height="155" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">MODELLING</text><text x="50" y="183.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Video heroes</text><text x="50" y="212.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Admired peer characters enjoy fruit and</text><text x="50" y="233.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">vegetables and battle villains who want to stop</text><text x="50" y="254.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">them. Children imitate them.</text><rect x="460" y="124" width="410" height="155" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="480" y="156" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">POSITIVE REINFORCEMENT</text><text x="480" y="183.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Small rewards</text><text x="480" y="212.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Children who eat the target foods receive</text><text x="480" y="233.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">rewards such as stickers.</text><line x1="233" y1="285" x2="380" y2="327" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="667" y1="285" x2="520" y2="327" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="200" y="347" width="500" height="89" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="382.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Fruit and vegetable consumption rose</text><text x="450" y="411.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">at school and, in some measures, at home</text><clipPath id="tc458"><rect x="30" y="458" width="840" height="236" rx="14"/></clipPath><g clip-path="url(#tc458)"><rect x="30" y="458" width="182.970297029703" height="48" fill="#b5d3cf"/><text x="44" y="485.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Issue</text><rect x="212.970297029703" y="458" width="565.5445544554456" height="48" fill="#b5d3cf"/><text x="226.970297029703" y="485.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Point</text><rect x="778.5148514851486" y="458" width="91.4851485148515" height="48" fill="#b5d3cf"/><text x="792.5148514851486" y="485.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">+/−</text><rect x="30" y="506" width="182.970297029703" height="47" fill="#dce9e7"/><text x="44" y="532.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Objective data</text><rect x="212.970297029703" y="506" width="565.5445544554456" height="47" fill="#ffffff"/><text x="226.970297029703" y="532.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Measuring what children actually eat, rather than asking them.</text><rect x="778.5148514851486" y="506" width="91.4851485148515" height="47" fill="#dce9e7"/><text x="792.5148514851486" y="532.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">+</tspan></text><line x1="30" y1="553" x2="870" y2="553" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="553" width="182.970297029703" height="47" fill="#dce9e7"/><text x="44" y="579.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Confounds</text><rect x="212.970297029703" y="553" width="565.5445544554456" height="47" fill="#f8faf9"/><text x="226.970297029703" y="579.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Schools vary, so differences between schools may confound results.</text><rect x="778.5148514851486" y="553" width="91.4851485148515" height="47" fill="#f6e3d8"/><text x="792.5148514851486" y="579.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">−</tspan></text><line x1="30" y1="600" x2="870" y2="600" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="600" width="182.970297029703" height="47" fill="#dce9e7"/><text x="44" y="626.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Children</text><rect x="212.970297029703" y="600" width="565.5445544554456" height="47" fill="#ffffff"/><text x="226.970297029703" y="626.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Parental consent needed; care not to create pressure around eating.</text><rect x="778.5148514851486" y="600" width="91.4851485148515" height="47" fill="#f6e3d8"/><text x="792.5148514851486" y="626.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">−</tspan></text><line x1="30" y1="647" x2="870" y2="647" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="647" width="182.970297029703" height="47" fill="#dce9e7"/><text x="44" y="673.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Long term</text><rect x="212.970297029703" y="647" width="565.5445544554456" height="47" fill="#f8faf9"/><text x="226.970297029703" y="673.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Do habits persist once rewards stop?</text><rect x="778.5148514851486" y="647" width="91.4851485148515" height="47" fill="#f2e7b8"/><text x="792.5148514851486" y="673.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">?</tspan></text></g><line x1="212.970297029703" y1="458" x2="212.970297029703" y2="694" stroke="#c9d6d4" stroke-width="1.5"/><line x1="778.5148514851486" y1="458" x2="778.5148514851486" y2="694" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="458" width="840" height="236" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/>
</svg>