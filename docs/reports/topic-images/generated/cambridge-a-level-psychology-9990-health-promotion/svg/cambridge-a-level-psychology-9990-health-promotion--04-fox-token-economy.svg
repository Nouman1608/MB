<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 604" width="900" height="604" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="604" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A token economy for safety: Fox et al. (1987)</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Two open-pit mines in the USA with high accident rates</text>
<rect x="30" y="124" width="329.875" height="138" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EARN TRADING STAMPS FOR</text><text x="50" y="187.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="187.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">working without lost-time accidents</text><text x="50" y="212.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="212.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">following safety rules</text><text x="50" y="237.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="237.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">safety suggestions</text><rect x="373.875" y="124" width="279.125" height="138" rx="14" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5"/><text x="393.875" y="156" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">LOSE STAMPS IF</text><text x="393.875" y="187.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="409.075" y="187.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">they had an accident</text><text x="393.875" y="212.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="409.075" y="212.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">their team had an accident</text><rect x="667" y="124" width="203" height="138" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="687" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EXCHANGE</text><text x="687" y="187.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">stamps for goods</text><line x1="450" y1="268" x2="450" y2="324" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="332" width="410" height="88" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="235" y="366.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Days lost to accidents fell sharply</text><text x="235" y="395.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">and stayed low over the following years</text><rect x="460" y="332" width="410" height="88" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="665" y="366.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Cost of accidents fell</text><text x="665" y="395.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">by more than the cost of the stamps</text><rect x="30" y="442" width="413" height="130" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="474" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">+ STRENGTH</text><text x="50" y="505.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Long period: a longitudinal field study with high</text><text x="50" y="526.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">ecological validity.</text><rect x="457" y="442" width="413" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="474" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">− WEAKNESSES</text><text x="477" y="505.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Rewarding <tspan font-weight="700" fill="#1e2a44">reported</tspan> accident-free periods may</text><text x="477" y="526.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">encourage under-reporting of minor injuries; no</text><text x="477" y="547.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">randomised control group.</text>
</svg>