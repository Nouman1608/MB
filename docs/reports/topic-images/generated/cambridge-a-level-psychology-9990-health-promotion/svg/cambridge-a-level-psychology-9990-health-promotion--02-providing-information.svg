<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 693" width="900" height="693" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="693" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Providing information</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Lewin et al. (1992): heart attack patients</text>
<rect x="30" y="124" width="410" height="112" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="235" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">HEART MANUAL GROUP</text><text x="235" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Self-help rehabilitation</text><text x="235" y="211.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">information, exercise and relaxation guidance</text><rect x="460" y="124" width="410" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="665" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">COMPARISON GROUP</text><text x="665" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Standard information</text><text x="665" y="211.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">and informal counselling</text><line x1="233" y1="242" x2="380" y2="284" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="667" y1="242" x2="520" y2="284" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="304" width="840" height="113" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="336" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">FOLLOW-UP OVER MONTHS: THE HEART MANUAL GROUP SHOWED</text><text x="50" y="367.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="367.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">better psychological adjustment, such as less anxiety and depression</text><text x="50" y="392.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="392.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">less use of health services</text><rect x="30" y="439" width="840" height="111" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="473.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Knowing is not doing</text><text x="50" y="503.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Many smokers know smoking is harmful. Information works best when it is <tspan font-weight="700" fill="#1e2a44">specific</tspan>, from a</text><text x="50" y="525.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">credible</tspan> <tspan font-weight="700" fill="#1e2a44">source</tspan>, and tells people <tspan font-weight="700" fill="#1e2a44">how</tspan> to change.</text><rect x="30" y="572" width="270.6666666666667" height="89" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="165.33333333333334" y="604" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">FEAR AROUSAL</text><text x="165.33333333333334" y="636.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">works through <tspan font-weight="700" fill="#1e2a44">emotion</tspan></text><rect x="314.6666666666667" y="572" width="270.6666666666667" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="604" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">BOTH</text><text x="450" y="636.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">aim to change health beliefs</text><rect x="599.3333333333334" y="572" width="270.6666666666667" height="89" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="734.6666666666667" y="604" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">PROVIDING INFORMATION</text><text x="734.6666666666667" y="636.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">works through <tspan font-weight="700" fill="#1e2a44">knowledge</tspan></text>
</svg>