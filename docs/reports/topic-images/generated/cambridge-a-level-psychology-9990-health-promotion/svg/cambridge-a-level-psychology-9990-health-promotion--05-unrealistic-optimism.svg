<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 561" width="900" height="561" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="561" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Unrealistic optimism: Weinstein (1980)</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">College students compared their own chances with other students of the same sex</text>
<rect x="30" y="124" width="840" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><line x1="120" y1="244" x2="780" y2="244" stroke="#1e2a44" stroke-width="3"/><line x1="450" y1="184" x2="450" y2="304" stroke="#1e2a44" stroke-width="3" stroke-dasharray="7 6"/><text x="450" y="174" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">average student</text><text x="120" y="280" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">less likely than average</text><text x="780" y="280" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end">more likely than average</text><circle cx="280" cy="244" r="16" fill="#f6e3d8" stroke="#b5602e" stroke-width="3"/><text x="280" y="334" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">negative events</text><text x="280" y="356" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">e.g. heart attack, drinking problem</text><circle cx="620" cy="244" r="16" fill="#dce9e7" stroke="#2e6b62" stroke-width="3"/><text x="620" y="334" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">positive events</text><line x1="442" y1="216" x2="300" y2="216" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><line x1="458" y1="216" x2="600" y2="216" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><text x="850" y="154" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">positions illustrative</text><rect x="30" y="396" width="840" height="133" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="430.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">A group-level error</text><text x="50" y="460.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The average person cannot be below average. If people think <tspan font-weight="700" fill="#1e2a44">"it</tspan> <tspan font-weight="700" fill="#1e2a44">won't</tspan> <tspan font-weight="700" fill="#1e2a44">happen</tspan> <tspan font-weight="700" fill="#1e2a44">to</tspan> <tspan font-weight="700" fill="#1e2a44">me"</tspan>, they</text><text x="50" y="482.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">disregard advice on screening, safe driving or diet. Campaigns can show that people <tspan font-weight="700" fill="#1e2a44">like</tspan> <tspan font-weight="700" fill="#1e2a44">the</tspan></text><text x="50" y="504.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">audience</tspan> are affected.</text>
</svg>