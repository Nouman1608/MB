text x="212.00000000000003" y="267.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The first Israel-Arab peace treaty has</text><text x="212.00000000000003" y="288.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">lasted</text><rect x="534.0000000000001" y="241" width="336.00000000000006" height="68" fill="#f8faf9"/><text x="548.0000000000001" y="267.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Real achievements, but inflation over 13</text><text x="548.0000000000001" y="288.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">per cent</text><line x1="30" y1="309" x2="870" y2="309" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="309" width="168.00000000000003" height="68" fill="#dce9e7"/><text x="44" y="335.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Political standing</text><rect x="198.00000000000003" y="309" width="336.00000000000006" height="68" fill="#ffffff"/><text x="212.00000000000003" y="335.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Hostage crisis, failed rescue, end of</text><text x="212.00000000000003" y="356.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">détente: looked weak in 1980</text><rect x="534.0000000000001" y="309" width="336.00000000000006" height="68" fill="#ffffff"/><text x="548.0000000000001" y="335.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Poor relations with a Democratic</text><text x="548.0000000000001" y="356.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Congress; Kennedy's challenge</text></g><line x1="198.00000000000003" y1="124" x2="198.00000000000003" y2="377" stroke="#c9d6d4" stroke-width="1.5"/><line x1="534.0000000000001" y1="124" x2="534.0000000000001" y2="377" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="124" width="840" height="253" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="399" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="433.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Why it works</text><text x="450" y="463.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Each side is measured against the <tspan font-weight="700" fill="#1e2a44">same</tspan> <tspan font-weight="700" fill="#1e2a44">criteria</tspan>, so the final judgement compares like with like.</text>
