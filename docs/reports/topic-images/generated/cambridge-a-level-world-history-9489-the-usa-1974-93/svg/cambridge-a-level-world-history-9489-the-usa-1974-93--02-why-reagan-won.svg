<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 531" width="900" height="531" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="531" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why Reagan won in 1980</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Four reasons for a landslide</text>
<rect x="30" y="124" width="198" height="137" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="153.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Reagan's appeal</text><text x="46" y="180.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Optimism and</text><text x="46" y="200.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">television skill: "Are</text><text x="46" y="220.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">you better off than you</text><text x="46" y="240.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">were four years ago?"</text><rect x="244" y="124" width="198" height="137" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="260" y="153.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Supply-side</text><text x="260" y="174.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">promise</text><text x="260" y="201" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Tax cuts would</text><text x="260" y="221" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">increase growth and</text><text x="260" y="241" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">revenue</text><rect x="458" y="124" width="198" height="137" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="474" y="163.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Carter's failures</text><text x="474" y="190.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">At home: inflation,</text><text x="474" y="210.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">energy. Abroad: Iran,</text><text x="474" y="230.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Afghanistan</text><rect x="672" y="124" width="198" height="137" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="688" y="163.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">The New Right</text><text x="688" y="190.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Moral Majority (1979);</text><text x="688" y="210.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Proposition 13 (1978);</text><text x="688" y="230.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">free-market think tanks</text><rect x="150" y="325" width="600" height="86" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="357" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">ELECTORAL COLLEGE, 1980</text><text x="450" y="385.38" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Reagan 489, Carter 49</text><line x1="129" y1="267" x2="300" y2="319" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="343" y1="267" x2="400" y2="319" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="557" y1="267" x2="500" y2="319" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="771" y1="267" x2="600" y2="319" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="433" width="763.4944237918215" height="66" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="411.74721189591077" y="462" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Reagan</text><text x="411.74721189591077" y="486" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">489</text><rect x="793.4944237918215" y="433" width="76.50557620817844" height="66" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="831.7472118959107" y="462" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Carter</text><text x="831.7472118959107" y="486" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">49</text>
</svg>