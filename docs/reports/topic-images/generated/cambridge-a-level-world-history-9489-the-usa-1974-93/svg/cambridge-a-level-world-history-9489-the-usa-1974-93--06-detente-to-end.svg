ill="#1e2a44" text-anchor="middle">Iran-Contra</text><circle cx="70" cy="264" r="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><circle cx="236.25" cy="264" r="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><circle cx="446.04166666667027" cy="264" r="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><circle cx="592.5" cy="264" r="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><circle cx="687.5" cy="264" r="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><circle cx="735" cy="264" r="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><circle cx="782.5" cy="264" r="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><rect x="30" y="498" width="411" height="155" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="541.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">REAGAN DOCTRINE: ROLLBACK</text><text x="50" y="567.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Arm anti-communist insurgents</text><text x="50" y="596.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Contras in Nicaragua; mujahideen in Afghanistan</text><text x="50" y="617.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">(Stingers from 1986); UNITA in Angola</text><rect x="459" y="498" width="411" height="155" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="479" y="530" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">THE DEBATE</text><text x="479" y="556.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Reagan's pressure or Gorbachev's</text><text x="479" y="579.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">reforms?</text><text x="479" y="607.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Weigh both, and note Reagan's own shift from</text><text x="479" y="628.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">confrontation to negotiation</text>
