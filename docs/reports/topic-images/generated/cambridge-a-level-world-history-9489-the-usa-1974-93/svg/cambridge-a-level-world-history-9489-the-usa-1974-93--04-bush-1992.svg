<rect width="900" height="484" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why Bush lost in 1992</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Five pressures on an incumbent</text>
<line x1="310" y1="184.5" x2="407" y2="256.95" stroke="#1e2a44" stroke-width="2.5"/><line x1="310" y1="288" x2="407" y2="288" stroke="#1e2a44" stroke-width="2.5"/><line x1="310" y1="391.5" x2="407" y2="319.05" stroke="#1e2a44" stroke-width="2.5"/><line x1="590" y1="174" x2="493" y2="253.8" stroke="#1e2a44" stroke-width="2.5"/><line x1="590" y1="288" x2="493" y2="288" stroke="#1e2a44" stroke-width="2.5"/><line x1="590" y1="402" x2="493" y2="322.2" stroke="#1e2a44" stroke-width="2.5"/><circle cx="450" cy="288" r="86" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="450" y="282.54" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Bush</text><text x="450" y="308.16" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">defeated</text><rect x="30" y="145" width="280" height="79" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="175.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Recession</text><text x="46" y="203.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The economy dominated</text><rect x="30" y="238" width="280" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="268.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Broken promise</text><text x="46" y="296.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">"Read my lips: no new taxes";</text><text x="46" y="317.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the 1990 budget deal</text><rect x="30" y="352" width="280" height="79" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="382.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Doubts about Quayle</text><text x="46" y="410.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The Vice-President</text><rect x="590" y="124" width="280" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="606" y="154.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Ross Perot</text><text x="606" y="182.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Independent: about 19 per cent</text><text x="606" y="203.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">of the vote</text><rect x="590" y="238" width="280" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="606" y="268.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Bill Clinton</text><text x="606" y="296.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A centrist "New Democrat"</text><text x="606" y="317.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">focused on the economy</text><rect x="590" y="352" width="280" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="606" y="382.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">His record</text><text x="606" y="410.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">ADA and Clean Air Act (1990),</text><text x="606" y="431.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">but many vetoes</text>
</svg>