<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="540" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Carter's foreign policy</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">One lasting success, one damaging crisis</text>
<rect x="30" y="124" width="410" height="209" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SUCCESS</text><text x="50" y="183.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Camp David</text><text x="50" y="212.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="212.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Sadat visits Jerusalem (November 1977)</text><text x="50" y="237.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="237.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Thirteen days of talks with Sadat and Begin</text><text x="65.2" y="258.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">(September 1978)</text><text x="50" y="283.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="283.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Egyptian-Israeli peace treaty (March 1979)</text><text x="50" y="308.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="308.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">But: Palestinian question unresolved</text><rect x="460" y="124" width="410" height="230" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="480" y="156" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">CRISIS</text><text x="480" y="183.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Iran hostages</text><text x="480" y="212.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="495.2" y="212.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Embassy seized (November 1979)</text><text x="480" y="237.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="495.2" y="237.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">52 Americans held for 444 days</text><text x="480" y="262.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="495.2" y="262.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Rescue mission fails (April 1980): eight dead;</text><text x="495.2" y="283.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Vance resigns</text><text x="480" y="308.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="495.2" y="308.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Released minutes after Reagan's inauguration</text><text x="495.2" y="329.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">(January 1981)</text><rect x="30" y="376" width="840" height="132" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="408" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">HUMAN RIGHTS</text><text x="50" y="434.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">A principle hard to apply consistently</text><text x="50" y="462.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Aid cut to Argentina and Pinochet's Chile; support withdrawn from Somoza (fell to the Sandinistas, 1979);</text><text x="50" y="483.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">allies such as Iran and the USSR were harder cases</text>
</svg>