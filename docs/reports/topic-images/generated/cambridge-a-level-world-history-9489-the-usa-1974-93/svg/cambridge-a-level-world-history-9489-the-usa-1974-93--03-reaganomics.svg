<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 693" width="900" height="693" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="693" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Reaganomics: theory and practice</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Taxes fell; spending did not</text>
<text x="210" y="140" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">THEORY</text><text x="690" y="140" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">PRACTICE</text><line x1="450" y1="154" x2="450" y2="550" stroke="#1e2a44" stroke-width="3"/><rect x="30" y="154" width="360" height="90" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="43" y="190.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Cut taxes</text><text x="43" y="217" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Growth would follow</text><line x1="390" y1="199" x2="394" y2="199" stroke="#1e2a44" stroke-width="2"/><rect x="510" y="154" width="360" height="90" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="523" y="180.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Done</text><text x="523" y="207" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">ERTA (1981): top rate 70 to 50%; Tax Reform</text><text x="523" y="227" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Act (1986): 28%</text><line x1="506" y1="199" x2="510" y2="199" stroke="#1e2a44" stroke-width="2"/><rect x="394" y="182" width="112" height="34" rx="17" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="205" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Taxes</text><rect x="30" y="256" width="360" height="90" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="43" y="305.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Cut domestic spending</text><line x1="390" y1="301" x2="394" y2="301" stroke="#1e2a44" stroke-width="2"/><rect x="510" y="256" width="360" height="90" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="523" y="282.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Total did not fall</text><text x="523" y="309" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Housing and welfare cut, but defence soared</text><text x="523" y="329" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">and Social Security protected</text><line x1="506" y1="301" x2="510" y2="301" stroke="#1e2a44" stroke-width="2"/><rect x="394" y="284" width="112" height="34" rx="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="307" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Spending</text><rect x="30" y="358" width="360" height="90" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="43" y="407.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Deregulate</text><line x1="390" y1="403" x2="394" y2="403" stroke="#1e2a44" stroke-width="2"/><rect x="510" y="358" width="360" height="90" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="523" y="384.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Airlines, banking, savings and loans</text><text x="523" y="411" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Contributed to the later savings-and-loan</text><text x="523" y="431" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">crisis</text><line x1="506" y1="403" x2="510" y2="403" stroke="#1e2a44" stroke-width="2"/><rect x="394" y="386" width="112" height="34" rx="17" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="409" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Regulation</text><rect x="30" y="460" width="360" height="90" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="43" y="496.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Tight money</text><text x="43" y="523" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Curb inflation</text><line x1="390" y1="505" x2="394" y2="505" stroke="#1e2a44" stroke-width="2"/><rect x="510" y="460" width="360" height="90" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="523" y="486.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Recession, then growth</text><text x="523" y="513" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Unemployment above 10% (1981-82); strong</text><text x="523" y="533" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">growth from 1983</text><line x1="506" y1="505" x2="510" y2="505" stroke="#1e2a44" stroke-width="2"/><rect x="394" y="488" width="112" height="34" rx="17" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="511" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Money</text><rect x="30" y="572" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="606.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Result</text><text x="450" y="636.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Deficits grew and the national debt roughly <tspan font-weight="700" fill="#1e2a44">tripled</tspan>; the richest gained most.</text>
</svg>