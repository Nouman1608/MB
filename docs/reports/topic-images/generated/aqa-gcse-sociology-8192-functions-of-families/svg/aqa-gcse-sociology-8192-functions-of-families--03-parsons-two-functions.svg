<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 825" width="900" height="825" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="825" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Parsons: what the family keeps</text>

<rect x="30" y="124" width="230" height="76" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2" stroke-dasharray="7 5"/><text x="145" y="170" font-size="18" font-weight="700" fill="#4a5568" text-anchor="middle">Production</text><line x1="266" y1="162" x2="600" y2="162" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><rect x="606" y="124" width="264" height="76" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="620" y="167.15" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">factories and offices</text><rect x="30" y="220" width="230" height="76" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2" stroke-dasharray="7 5"/><text x="145" y="266" font-size="18" font-weight="700" fill="#4a5568" text-anchor="middle">Education</text><line x1="266" y1="258" x2="600" y2="258" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><rect x="606" y="220" width="264" height="76" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="620" y="263.15" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">schools</text><rect x="30" y="316" width="230" height="76" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2" stroke-dasharray="7 5"/><text x="145" y="362" font-size="18" font-weight="700" fill="#4a5568" text-anchor="middle">Health care</text><line x1="266" y1="354" x2="600" y2="354" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><rect x="606" y="316" width="264" height="76" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="620" y="348.15" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">hospitals, later the</text><text x="620" y="370.15" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">welfare state</text><text x="433" y="116" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle" font-style="italic">passed to specialist institutions</text><text x="450" y="430" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">What is left: two basic and irreducible functions</text><rect x="30" y="448" width="412" height="194" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,520 L31.25,462.25 Q31.25,449.25 44.25,449.25 L427.75,449.25 Q440.75,449.25 440.75,462.25 L440.75,520 Z" fill="#d4b02e"/><line x1="31.25" y1="520" x2="440.75" y2="520" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="489.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">1. Primary socialisation</text><text x="44" y="552.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Children, born without culture, internalise</text><text x="44" y="574.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">society’s shared norms and values, so a value</text><text x="44" y="596.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">consensus passes from one generation to the</text><text x="44" y="618.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">next</text><rect x="458" y="448" width="412" height="194" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,520 L459.25,462.25 Q459.25,449.25 472.25,449.25 L855.75,449.25 Q868.75,449.25 868.75,462.25 L868.75,520 Z" fill="#d4b02e"/><line x1="459.25" y1="520" x2="868.75" y2="520" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="477.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">2. Stabilisation of adult</text><text x="664" y="502.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">personalities</text><text x="472" y="552.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Adults under pressure at work “give and</text><text x="472" y="574.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">receive emotional support” at home, which</text><text x="472" y="596.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">keeps them stable in their adult roles</text><rect x="30" y="660" width="840" height="141" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="696" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The isolated nuclear family</text><circle cx="61" cy="719.39" r="4.5" fill="#8a6d0d"/><text x="74" y="725" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Smaller and more specialised; suited industry because it could move to where the jobs were</text><circle cx="61" cy="749.39" r="4.5" fill="#8a6d0d"/><text x="74" y="755" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Two roles: husband <tspan font-weight="700">instrumental</tspan> (earning, providing); wife <tspan font-weight="700">expressive</tspan> (care, emotional</text><text x="74" y="777" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">support)</text>
</svg>