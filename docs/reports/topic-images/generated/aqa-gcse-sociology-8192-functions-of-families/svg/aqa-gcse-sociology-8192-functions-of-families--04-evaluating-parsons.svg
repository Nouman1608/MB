<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 569" width="900" height="569" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="569" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Evaluating Parsons</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">He described the American family of the 1950s</text>
<rect x="30" y="122" width="412" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,172 L31.25,136.25 Q31.25,123.25 44.25,123.25 L427.75,123.25 Q440.75,123.25 440.75,136.25 L440.75,172 Z" fill="#f2e7b8"/><line x1="31.25" y1="172" x2="440.75" y2="172" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="152.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Idealised and middle-class</text><text x="44" y="204.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Later authors said he presented an idealised</text><text x="44" y="226.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">picture centred on middle-class experience</text><rect x="458" y="122" width="412" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,172 L459.25,136.25 Q459.25,123.25 472.25,123.25 L855.75,123.25 Q868.75,123.25 868.75,136.25 L868.75,172 Z" fill="#f2e7b8"/><line x1="459.25" y1="172" x2="868.75" y2="172" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="152.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Ignores diversity</text><text x="472" y="204.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Lone parent, reconstituted and same-sex</text><text x="472" y="226.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">families also socialise children and give</text><text x="472" y="248.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">support</text><rect x="30" y="288" width="412" height="128" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,338 L31.25,302.25 Q31.25,289.25 44.25,289.25 L427.75,289.25 Q440.75,289.25 440.75,302.25 L440.75,338 Z" fill="#f2e7b8"/><line x1="31.25" y1="338" x2="440.75" y2="338" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="318.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Ignores the dark side</text><text x="44" y="370.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Domestic abuse destabilises rather than</text><text x="44" y="392.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">stabilises personalities</text><rect x="458" y="288" width="412" height="128" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,338 L459.25,302.25 Q459.25,289.25 472.25,289.25 L855.75,289.25 Q868.75,289.25 868.75,302.25 L868.75,338 Z" fill="#f2e7b8"/><line x1="459.25" y1="338" x2="868.75" y2="338" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="318.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Children are not passive</text><text x="472" y="370.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">They negotiate and resist what parents teach</text><text x="472" y="392.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">them</text><rect x="30" y="434" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="470" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Feminist point</text><text x="56" y="499" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Feminists use Parsons’ instrumental and expressive roles as evidence that functionalism</text><text x="56" y="521" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">treats a gender division of labour as natural.</text>
</svg>