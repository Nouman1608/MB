<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 719" width="900" height="719" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="719" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three perspectives on family functions</text>

<rect x="30" y="150" width="268" height="394" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="74" y="124" width="180" height="52" rx="26" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="164" y="157" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Society</text><text x="164" y="226" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle" font-style="italic">Functionalist</text><circle cx="51" cy="256.72" r="4.5" fill="#2e6b62"/><text x="64" y="262" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Murdock:</tspan> four functions</text><text x="64" y="283" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">found across 250 societies</text><circle cx="51" cy="306.72" r="4.5" fill="#2e6b62"/><text x="64" y="312" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Parsons:</tspan> primary</text><text x="64" y="333" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">socialisation and</text><text x="64" y="354" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">stabilisation benefit every</text><text x="64" y="375" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">member</text><rect x="316" y="150" width="268" height="394" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="360" y="124" width="180" height="52" rx="26" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><text x="450" y="157" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Capitalism</text><text x="450" y="226" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle" font-style="italic">Marxist</text><circle cx="337" cy="256.72" r="4.5" fill="#2e6b62"/><text x="350" y="262" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Engels (1884):</tspan> monogamy</text><text x="350" y="283" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">lets men pass property to</text><text x="350" y="304" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">their own children</text><circle cx="337" cy="327.72" r="4.5" fill="#2e6b62"/><text x="350" y="333" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Reproduces labour power</text><text x="350" y="354" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">through women’s unpaid work</text><circle cx="337" cy="377.72" r="4.5" fill="#2e6b62"/><text x="350" y="383" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A unit of consumption</text><circle cx="337" cy="406.72" r="4.5" fill="#2e6b62"/><text x="350" y="412" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Zaretsky (1976):</tspan> the</text><text x="350" y="433" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">private refuge is an</text><text x="350" y="454" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">illusion that props up the</text><text x="350" y="475" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">system</text><rect x="602" y="150" width="268" height="394" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="646" y="124" width="180" height="52" rx="26" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="736" y="157" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Men</text><text x="736" y="226" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle" font-style="italic">Feminist</text><circle cx="623" cy="256.72" r="4.5" fill="#2e6b62"/><text x="636" y="262" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Oakley:</tspan> canalisation steers</text><text x="636" y="283" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">children to “suitable” toys</text><circle cx="623" cy="306.72" r="4.5" fill="#2e6b62"/><text x="636" y="312" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Delphy and Leonard (1992):</tspan></text><text x="636" y="333" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">men exploit women’s work</text><circle cx="623" cy="356.72" r="4.5" fill="#2e6b62"/><text x="636" y="362" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Stabilisation is one-sided:</text><text x="636" y="383" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">women give more support</text><text x="636" y="404" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">than they get</text><text x="450" y="92" font-size="20" font-weight="400" fill="#4a5568" text-anchor="middle">Whom does the family really serve?</text><rect x="30" y="562" width="840" height="133" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="598" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Compare and contrast</text><text x="56" y="627" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Marxists and feminists both see families as exploitative; they differ over who gains. The</text><text x="56" y="649" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">same economic function is “providing for members” to functionalists and “consumption that</text><text x="56" y="671" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">profits capitalists” to Marxists.</text>
</svg>