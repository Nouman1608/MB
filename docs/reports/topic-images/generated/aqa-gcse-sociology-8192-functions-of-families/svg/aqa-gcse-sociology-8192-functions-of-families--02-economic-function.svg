<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 585" width="900" height="585" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="585" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How the economic function changed</text>

<rect x="30" y="108" width="380" height="220" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,158 L31.25,122.25 Q31.25,109.25 44.25,109.25 L395.75,109.25 Q408.75,109.25 408.75,122.25 L408.75,158 Z" fill="#f2e7b8"/><line x1="31.25" y1="158" x2="408.75" y2="158" stroke="#c9d6d4" stroke-width="2"/><text x="220" y="139" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Pre-industrial Britain</text><rect x="490" y="108" width="380" height="220" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M491.25,158 L491.25,122.25 Q491.25,109.25 504.25,109.25 L855.75,109.25 Q868.75,109.25 868.75,122.25 L868.75,158 Z" fill="#b5d3cf"/><line x1="491.25" y1="158" x2="868.75" y2="158" stroke="#c9d6d4" stroke-width="2"/><text x="680" y="139" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Since industrialisation</text><text x="220" y="196" font-size="21" font-weight="700" fill="#8a6d0d" text-anchor="middle">Unit of PRODUCTION</text><circle cx="57" cy="234.39" r="4.5" fill="#2e6b62"/><text x="70" y="240" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Members worked together</text><circle cx="57" cy="264.39" r="4.5" fill="#2e6b62"/><text x="70" y="270" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">On a farm or in a cottage industry</text><text x="680" y="196" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="middle">Unit of CONSUMPTION</text><circle cx="517" cy="234.39" r="4.5" fill="#2e6b62"/><text x="530" y="240" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Most work happens outside the home</text><circle cx="517" cy="264.39" r="4.5" fill="#2e6b62"/><text x="530" y="270" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Pools income to buy food, housing and</text><text x="530" y="292" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">goods</text><line x1="414" y1="273" x2="486" y2="273" stroke="#8a6d0d" stroke-width="5" marker-end="url(#ahO)"/><rect x="30" y="350" width="840" height="80" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="384" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Kept throughout: providing for dependent members</text><text x="450" y="412" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">children and older relatives</text><path d="M220,328 L220,346" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><path d="M680,328 L680,346" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><rect x="30" y="450" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="486" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Common mistake</text><text x="56" y="515" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Families have not lost the economic function. They have mainly lost production, not</text><text x="56" y="537" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">consumption or provision for dependants.</text>
</svg>