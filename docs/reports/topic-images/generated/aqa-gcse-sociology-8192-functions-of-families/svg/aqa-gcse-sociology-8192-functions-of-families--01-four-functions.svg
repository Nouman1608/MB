<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 622" width="900" height="622" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="622" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The four functions of families</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">From the specification, matching Murdock’s study of 250 societies (1949)</text>
<rect x="30" y="120" width="412" height="228" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,170 L31.25,134.25 Q31.25,121.25 44.25,121.25 L427.75,121.25 Q440.75,121.25 440.75,134.25 L440.75,170 Z" fill="#b5d3cf"/><line x1="31.25" y1="170" x2="440.75" y2="170" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="150.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Sexual</text><circle cx="64" cy="145" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="64" y="151.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><circle cx="51" cy="197.92" r="4.5" fill="#2e6b62"/><text x="64" y="203.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Gives sex an approved place, usually marriage</text><text x="64" y="224.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">or a long-term partnership</text><circle cx="51" cy="247.92" r="4.5" fill="#2e6b62"/><text x="64" y="253.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Limits conflict over partners; links sex to</text><text x="64" y="274.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">raising children</text><circle cx="51" cy="297.92" r="4.5" fill="#2e6b62"/><text x="64" y="303.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Today:</tspan> weaker; cohabitation and sex outside</text><text x="64" y="324.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">marriage carry far less stigma</text><rect x="458" y="120" width="412" height="228" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,170 L459.25,134.25 Q459.25,121.25 472.25,121.25 L855.75,121.25 Q868.75,121.25 868.75,134.25 L868.75,170 Z" fill="#dce9e7"/><line x1="459.25" y1="170" x2="868.75" y2="170" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="150.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Reproductive</text><circle cx="492" cy="145" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="492" y="151.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><circle cx="479" cy="197.92" r="4.5" fill="#2e6b62"/><text x="492" y="203.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Produces the next generation, replacing</text><text x="492" y="224.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">members who die</text><circle cx="479" cy="247.92" r="4.5" fill="#2e6b62"/><text x="492" y="253.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Reproduction is social: families decide when</text><text x="492" y="274.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and whether to have children</text><circle cx="479" cy="297.92" r="4.5" fill="#2e6b62"/><text x="492" y="303.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Who counts as a parent? Step-, adoptive and</text><text x="492" y="324.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">same-sex parents</text><rect x="30" y="364" width="412" height="228" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,414 L31.25,378.25 Q31.25,365.25 44.25,365.25 L427.75,365.25 Q440.75,365.25 440.75,378.25 L440.75,414 Z" fill="#f2e7b8"/><line x1="31.25" y1="414" x2="440.75" y2="414" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="394.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Economic</text><circle cx="64" cy="389" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="64" y="395.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><circle cx="51" cy="441.92" r="4.5" fill="#2e6b62"/><text x="64" y="447.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Once a <tspan font-weight="700">unit of production</tspan>; now mainly a <tspan font-weight="700">unit</tspan></text><text x="64" y="468.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">of consumption</tspan></text><circle cx="51" cy="491.92" r="4.5" fill="#2e6b62"/><text x="64" y="497.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Pools income for food, housing and goods</text><circle cx="51" cy="520.9200000000001" r="4.5" fill="#2e6b62"/><text x="64" y="526.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Still provides for <tspan font-weight="700">dependent members</tspan></text><rect x="458" y="364" width="412" height="228" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,414 L459.25,378.25 Q459.25,365.25 472.25,365.25 L855.75,365.25 Q868.75,365.25 868.75,378.25 L868.75,414 Z" fill="#dce9e7"/><line x1="459.25" y1="414" x2="868.75" y2="414" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="394.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Educational</text><circle cx="492" cy="389" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="492" y="395.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><circle cx="479" cy="441.92" r="4.5" fill="#2e6b62"/><text x="492" y="447.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Primary socialisation:</tspan> norms, values,</text><text x="492" y="468.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">language and skills</text><circle cx="479" cy="491.92" r="4.5" fill="#2e6b62"/><text x="492" y="497.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Schools later take over formal teaching</text><text x="492" y="518.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(secondary socialisation)</text><circle cx="479" cy="541.9200000000001" r="4.5" fill="#2e6b62"/><text x="492" y="547.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Family attitudes to learning still shape</text><text x="492" y="568.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">school success</text>
</svg>