<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 523" width="900" height="523" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="523" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four types of socialisation</text>

<line x1="60" y1="250" x2="850" y2="250" stroke="#1e2a44" stroke-width="5" marker-end="url(#ah)"/><text x="60" y="282" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">early life</text><text x="840" y="282" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end">later life</text><rect x="70" y="220" width="230" height="22" rx="6" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><rect x="230" y="192" width="610" height="22" rx="6" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="80" y="210" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start"></text><text x="185" y="180" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start"></text><polygon points="684,242 700,220 716,242" fill="#b5602e"/><text x="576" y="178" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start"></text><text x="185" y="150" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Primary</text><path d="M185,158 L185,218" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="4 4"/><text x="450" y="150" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Secondary</text><path d="M450,158 L450,190" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="4 4"/><text x="700" y="150" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">Re-socialisation</text><path d="M700,184 L700,188" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="4 4"/><text x="700" y="174" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">after a major life change</text><rect x="30" y="310" width="201" height="189" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,360 L31.25,324.25 Q31.25,311.25 44.25,311.25 L216.75,311.25 Q229.75,311.25 229.75,324.25 L229.75,360 Z" fill="#d4b02e"/><line x1="31.25" y1="360" x2="229.75" y2="360" stroke="#c9d6d4" stroke-width="2"/><text x="130.5" y="340.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Primary</text><text x="44" y="391.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Early learning of</text><text x="44" y="412.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">norms and values,</text><text x="44" y="433.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">mainly within the</text><text x="44" y="454.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">family</text><rect x="243" y="310" width="201" height="189" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M244.25,360 L244.25,324.25 Q244.25,311.25 257.25,311.25 L429.75,311.25 Q442.75,311.25 442.75,324.25 L442.75,360 Z" fill="#b5d3cf"/><line x1="244.25" y1="360" x2="442.75" y2="360" stroke="#c9d6d4" stroke-width="2"/><text x="343.5" y="340.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Secondary</text><text x="257" y="391.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Later, through</text><text x="257" y="412.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">schools, peers, media</text><text x="257" y="433.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and the workplace</text><rect x="456" y="310" width="201" height="189" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M457.25,360 L457.25,324.25 Q457.25,311.25 470.25,311.25 L642.75,311.25 Q655.75,311.25 655.75,324.25 L655.75,360 Z" fill="#efdfa8"/><line x1="457.25" y1="360" x2="655.75" y2="360" stroke="#c9d6d4" stroke-width="2"/><text x="556.5" y="340.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Re-socialisation</text><text x="470" y="391.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Learning new norms</text><text x="470" y="412.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and values that</text><text x="470" y="433.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">replace old ones,</text><text x="470" y="454.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">often after a major</text><text x="470" y="475.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">life change</text><rect x="669" y="310" width="201" height="189" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M670.25,360 L670.25,324.25 Q670.25,311.25 683.25,311.25 L855.75,311.25 Q868.75,311.25 868.75,324.25 L868.75,360 Z" fill="#ffffff"/><line x1="670.25" y1="360" x2="868.75" y2="360" stroke="#c9d6d4" stroke-width="2"/><text x="769.5" y="340.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Inadequate</text><text x="683" y="391.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Has failed to instil</text><text x="683" y="412.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">shared norms and</text><text x="683" y="433.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">values; some link it</text><text x="683" y="454.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">to later deviance</text>
</svg>