<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 644" width="900" height="644" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="644" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four perspectives on socialisation</text>

<text x="240" y="116" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">Structural views</text><text x="240" y="138" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">socialisation shapes people</text><rect x="30" y="156" width="420" height="144" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="50" y="192" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Functionalist</text><text x="50" y="222" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Necessary for social order and value</text><text x="50" y="244" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">consensus</text><rect x="30" y="316" width="420" height="144" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="50" y="352" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Marxist</text><text x="50" y="382" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Ruling class reproduces its dominance and</text><text x="50" y="404" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">controls the workforce</text><rect x="30" y="476" width="420" height="144" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="50" y="512" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Feminist</text><text x="50" y="542" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Reproduces gender roles: family and media</text><text x="50" y="564" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">model different expectations for boys and</text><text x="50" y="586" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">girls</text><text x="670" y="116" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="middle">Social action view</text><text x="670" y="138" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">people shape their socialisation</text><rect x="480" y="156" width="390" height="464" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="500" y="192" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Social action /</text><text x="500" y="220" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">interactionist</text><text x="500" y="258" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Individuals are not passive recipients.</text><text x="500" y="280" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">They actively:</text><rect x="520" y="320" width="310" height="48" rx="24" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="675" y="351" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">interpret</text><rect x="520" y="384" width="310" height="48" rx="24" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="675" y="415" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">negotiate</text><rect x="520" y="448" width="310" height="48" rx="24" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="675" y="479" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">sometimes resist</text><text x="500" y="540" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">the norms that agencies present to them</text>
</svg>