<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 493" width="900" height="493" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="493" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Keep these terms apart</text>

<rect x="30" y="108" width="404" height="230" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="50" y="126" width="364" height="80" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="232" y="158" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Values</text><text x="232" y="186" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">broad beliefs about what is important</text><line x1="232" y1="210" x2="232" y2="236" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="80" y="242" width="304" height="80" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="232" y="274" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Norms</text><text x="232" y="302" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">specific unwritten rules</text><rect x="466" y="108" width="404" height="230" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="486" y="126" width="364" height="80" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="668" y="158" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Agency</text><text x="668" y="186" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">who socialises: family, school, media</text><line x1="668" y1="210" x2="668" y2="236" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="516" y="242" width="304" height="80" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="668" y="274" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Process</text><text x="668" y="302" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">how: e.g. role modelling</text><rect x="30" y="358" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="394" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Social construction of identity</text><text x="56" y="423" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A person’s sense of who they are is not fixed or natural, but built up over time through</text><text x="56" y="445" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">interactions with socialising agencies.</text>
</svg>