<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Socialisation and social control: four parts</text>

<text x="250" y="124" font-size="17" font-weight="700" fill="#4a5568" text-anchor="middle">Printed title</text><text x="670" y="124" font-size="17" font-weight="700" fill="#4a5568" text-anchor="middle">What it actually covers</text><rect x="30" y="140" width="440" height="96" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="50" y="176" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">3.2.2.1</text><text x="50" y="204" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Individuals and Society</text><line x1="476" y1="188" x2="506" y2="188" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="512" y="140" width="358" height="96" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="528" y="192.7" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Culture; the sociological imagination</text><rect x="30" y="248" width="440" height="96" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="50" y="284" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">3.2.2.2</text><text x="50" y="312" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Socialisation</text><line x1="476" y1="296" x2="506" y2="296" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="512" y="248" width="358" height="96" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="528" y="290.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Types, agencies and perspectives on</text><text x="528" y="311.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">socialisation</text><rect x="30" y="356" width="440" height="96" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="50" y="392" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">3.2.2.3</text><text x="50" y="420" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">“Social Identities and Social Change”</text><line x1="476" y1="404" x2="506" y2="404" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="512" y="356" width="358" height="96" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="528" y="387.7" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Formal and informal social control,</text><text x="528" y="408.7" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">sanctions, agencies of control,</text><text x="528" y="429.7" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">punishment, crime prevention</text><rect x="40" y="426" width="110" height="20" rx="10" fill="#efdfa8"/><text x="95" y="441" font-size="13" font-weight="700" fill="#b5602e" text-anchor="middle">title swapped</text><rect x="30" y="464" width="440" height="96" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="50" y="500" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">3.2.2.4</text><text x="50" y="528" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">“Social Control”</text><line x1="476" y1="512" x2="506" y2="512" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="512" y="464" width="358" height="96" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="528" y="495.7" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Crime and deviance: social construction</text><text x="528" y="516.7" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">of crime, types of crime, measuring</text><text x="528" y="537.7" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">crime, patterns of offending</text><rect x="40" y="534" width="110" height="20" rx="10" fill="#efdfa8"/><text x="95" y="549" font-size="13" font-weight="700" fill="#b5602e" text-anchor="middle">title swapped</text><rect x="30" y="578" width="840" height="82" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="614" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">This guide covers 3.2.2.2 only. Cite part numbers and contents, not titles alone; revise the</text><text x="56" y="636" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">other three parts from the specification and your textbook.</text>
