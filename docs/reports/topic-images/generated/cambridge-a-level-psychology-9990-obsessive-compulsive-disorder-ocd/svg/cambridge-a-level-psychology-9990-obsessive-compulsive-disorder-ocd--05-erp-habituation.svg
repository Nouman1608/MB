<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 668" width="900" height="668" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="668" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Exposure and response prevention</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">What happens to anxiety after facing a trigger (illustrative)</text>
<rect x="30" y="124" width="840" height="360" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><line x1="130" y1="424" x2="830" y2="424" stroke="#1e2a44" stroke-width="3"/><line x1="130" y1="424" x2="130" y2="164" stroke="#1e2a44" stroke-width="3"/><text x="480" y="458" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">time after exposure to the trigger</text><text x="108" y="294" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle" transform="rotate(-90 108 294)">anxiety</text><text x="830" y="156" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">illustrative: no data in the lesson</text><line x1="160" y1="385" x2="160" y2="333" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="170" y="372" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">trigger</text><path d="M160,320 C200,268 230,203 270,200.4 L300,200.4 C310,268 320,346 360,359" fill="none" stroke="#b5602e" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="10 7"/><text x="372" y="365" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">compulsion: quick relief</text><path d="M160,320 C220,255 260,184.79999999999998 340,184.79999999999998 C480,184.79999999999998 560,346 820,372" fill="none" stroke="#2e6b62" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><text x="620" y="221.2" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">response prevented: anxiety</text><text x="620" y="241.2" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">rises, then falls on its own</text><text x="620" y="261.2" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">(habituation)</text><rect x="30" y="506" width="413" height="130" rx="14" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="538" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">WITH THE COMPULSION</text><text x="50" y="569.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Relief <tspan font-weight="700" fill="#1e2a44">negatively</tspan> <tspan font-weight="700" fill="#1e2a44">reinforces</tspan> the compulsion, and</text><text x="50" y="590.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the person never discovers the feared outcome</text><text x="50" y="611.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">would not have happened.</text><rect x="457" y="506" width="413" height="130" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="477" y="538" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">WITH ERP</text><text x="477" y="569.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Work up a hierarchy of triggers while the</text><text x="477" y="590.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">compulsion is prevented: the person learns the</text><text x="477" y="611.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">feared outcome does <tspan font-weight="700" fill="#1e2a44">not</tspan> occur.</text>
</svg>