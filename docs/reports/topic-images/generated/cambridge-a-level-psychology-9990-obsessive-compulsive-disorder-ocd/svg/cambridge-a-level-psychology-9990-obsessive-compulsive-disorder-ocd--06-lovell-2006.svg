<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 864" width="900" height="864" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="864" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Key study: Lovell et al. (2006)</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Is telephone CBT as effective as face-to-face CBT?</text>
<rect x="170" y="124" width="560" height="110" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="159.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">72 patients with OCD</text><text x="450" y="188.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">two UK outpatient departments · randomised controlled</text><text x="450" y="209.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">non-inferiority trial</text><line x1="370" y1="240" x2="240" y2="282" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="530" y1="240" x2="660" y2="282" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="450" y="272" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">random allocation</text><rect x="30" y="302" width="360" height="112" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="210" y="334" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">TELEPHONE</text><text x="210" y="360.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">10 weekly sessions</text><text x="210" y="389.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">ERP-based CBT</text><rect x="510" y="302" width="360" height="112" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="690" y="334" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">FACE TO FACE</text><text x="690" y="360.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">10 weekly sessions</text><text x="690" y="389.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">ERP-based CBT</text><line x1="240" y1="420" x2="240" y2="472" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="660" y1="420" x2="660" y2="472" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="480" width="840" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="512" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">MEASURES</text><text x="450" y="543.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Y-BOCS (main outcome) · Beck Depression Inventory · client satisfaction questionnaire</text><rect x="30" y="590" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="624.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Result at six months</text><text x="450" y="654.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Y-BOCS scores in the two groups were <tspan font-weight="700" fill="#1e2a44">almost</tspan> <tspan font-weight="700" fill="#1e2a44">identical</tspan>, and both groups were highly satisfied:</text><text x="450" y="676.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">telephone CBT is as effective, and more accessible.</text><rect x="30" y="723" width="413" height="109" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="755" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">+ STRENGTHS</text><text x="50" y="786.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Random allocation and standard measures:</text><text x="50" y="807.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">strong internal validity.</text><rect x="457" y="723" width="413" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="755" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">− WEAKNESSES</text><text x="477" y="786.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">No blinding to delivery mode; patients already</text><text x="477" y="807.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">referred to clinics in one country.</text>
</svg>