<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 716" width="900" height="716" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="716" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Obsessions and the compulsions they drive</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">ICD-11: obsessions, compulsions, or usually both</text>
<rect x="30" y="124" width="395" height="133" rx="14" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">OBSESSIONS</text><text x="50" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Thoughts, images or urges</text><text x="50" y="211.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">repetitive, intrusive, unwanted; usually cause</text><text x="50" y="232.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">anxiety</text><line x1="431" y1="190.5" x2="469" y2="190.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="475" y="124" width="395" height="133" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="495" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">COMPULSIONS</text><text x="495" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Behaviours or mental acts</text><text x="495" y="211.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">performed in response to an obsession, by</text><text x="495" y="232.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">rigid rules, or for "completeness"</text><rect x="30" y="269" width="395" height="60" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="303.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Contamination by germs or dirt</text><rect x="475" y="269" width="395" height="60" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="495" y="303.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Washing, cleaning, avoiding touching things</text><line x1="431" y1="299" x2="469" y2="299" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="341" width="395" height="60" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="375.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Harm: an accident, fire or injury</text><rect x="475" y="341" width="395" height="60" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="495" y="375.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Checking locks, switches, the route driven</text><line x1="431" y1="371" x2="469" y2="371" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="413" width="395" height="60" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="447.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Symmetry and exactness</text><rect x="475" y="413" width="395" height="60" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="495" y="447.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Ordering, arranging, repeating until "just right"</text><line x1="431" y1="443" x2="469" y2="443" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="485" width="395" height="78" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="517.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Unwanted aggressive, sexual or religious</text><text x="50" y="538.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">thoughts</text><rect x="475" y="485" width="395" height="78" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="495" y="528.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Mental rituals, praying, seeking reassurance</text><line x1="431" y1="524" x2="469" y2="524" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="575" width="413" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="607" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SEVERITY</text><text x="50" y="638.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Time-consuming (e.g. more than an hour a day),</text><text x="50" y="659.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">or significant distress or impairment.</text><rect x="457" y="575" width="413" height="109" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="477" y="607" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">INSIGHT</text><text x="477" y="638.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Fair</tspan> <tspan font-weight="700" fill="#1e2a44">to</tspan> <tspan font-weight="700" fill="#1e2a44">good</tspan>: recognises beliefs may not be true.</text><text x="477" y="659.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Poor</tspan> <tspan font-weight="700" fill="#1e2a44">to</tspan> <tspan font-weight="700" fill="#1e2a44">absent</tspan>: convinced they are.</text>
</svg>