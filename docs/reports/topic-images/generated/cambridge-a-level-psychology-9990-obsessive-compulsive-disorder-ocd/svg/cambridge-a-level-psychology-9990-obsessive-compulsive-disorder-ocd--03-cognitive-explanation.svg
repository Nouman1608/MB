<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 722" width="900" height="722" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="722" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The cognitive explanation of OCD</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Why a normal intrusive thought becomes an obsession</text>
<rect x="170" y="124" width="560" height="89" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="159.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">An intrusive thought</text><text x="450" y="188.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">most people experience these occasionally</text><line x1="450" y1="219" x2="450" y2="271" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="170" y="279" width="560" height="61" rx="14" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5"/><text x="450" y="314.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Interpreted as meaningful and dangerous</text><rect x="30" y="362" width="270.6666666666667" height="109" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="394" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">INFLATED RESPONSIBILITY</text><text x="50" y="425.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">"If I don't check, any fire will</text><text x="50" y="446.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">be my fault."</text><rect x="314.6666666666667" y="362" width="270.6666666666667" height="109" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="334.6666666666667" y="394" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">OVERESTIMATION OF THREAT</text><text x="334.6666666666667" y="425.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the danger is judged far</text><text x="334.6666666666667" y="446.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">greater than it is</text><rect x="599.3333333333334" y="362" width="270.6666666666667" height="109" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="619.3333333333334" y="394" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">THOUGHT-ACTION FUSION</text><text x="619.3333333333334" y="425.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">thinking it makes it more</text><text x="619.3333333333334" y="446.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">likely, or is as bad as doing it</text><line x1="450" y1="477" x2="450" y2="529" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="170" y="537" width="560" height="89" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="572.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Compulsion</text><text x="450" y="601.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">an attempt to prevent harm and reduce responsibility</text><text x="450" y="660.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Evaluation: explains why normal intrusions become distressing and supports CBT, but faulty thinking may</text><text x="450" y="681.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">be a <tspan font-weight="700">consequence</tspan> of anxiety rather than its cause.</text>
</svg>