<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Two measures of OCD</text>

<rect x="30" y="100" width="410" height="236" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SELF-REPORT</text><text x="50" y="161.16" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">MOCI</text><text x="50" y="191.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="191.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Maudsley Obsessive-Compulsive Inventory</text><text x="50" y="217.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="217.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">30</tspan> <tspan font-weight="700" fill="#1e2a44">true/false</tspan> items</text><text x="50" y="243.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="243.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">subscales: checking, cleaning, slowness,</text><text x="65.2" y="264.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">doubting</text><rect x="460" y="100" width="410" height="236" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="480" y="132" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">CLINICIAN-RATED</text><text x="480" y="161.16" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Y-BOCS</text><text x="480" y="191.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="495.2" y="191.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Yale-Brown Obsessive-Compulsive Scale</text><text x="480" y="217.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="495.2" y="217.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">semi-structured interview: <tspan font-weight="700" fill="#1e2a44">10</tspan> <tspan font-weight="700" fill="#1e2a44">items</tspan>, 5</text><text x="495.2" y="238.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">obsessions + 5 compulsions</text><text x="480" y="264.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="495.2" y="264.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">each 0–4: time, interference, distress,</text><text x="495.2" y="285.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">resistance, control</text><text x="480" y="311.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="495.2" y="311.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">total <tspan font-weight="700" fill="#1e2a44">0–40</tspan>; higher = more severe</text><rect x="30" y="358" width="32" height="24" rx="4" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="46" y="375" font-size="11" font-weight="400" fill="#2e6b62" text-anchor="middle">T/F</text><rect x="69" y="358" width="32" height="24" rx="4" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="85" y="375" font-size="11" font-weight="400" fill="#2e6b62" text-anchor="middle">T/F</text><rect x="108" y="358" width="32" height="24" rx="4" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="124" y="375" font-size="11" font-weight="400" fill="#2e6b62" text-anchor="middle">T/F</text><rect x="147" y="358" width="32" height="24" rx="4" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="163" y="375" font-size="11" font-weight="400" fill="#2e6b62" text-anchor="middle">T/F</text><rect x="186" y="358" width="32" height="24" rx="4" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="202" y="375" font-size="11" font-weight="400" fill="#2e6b62" text-anchor="middle">T/F</text><rect x="225" y="358" width="32" height="24" rx="4" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text 