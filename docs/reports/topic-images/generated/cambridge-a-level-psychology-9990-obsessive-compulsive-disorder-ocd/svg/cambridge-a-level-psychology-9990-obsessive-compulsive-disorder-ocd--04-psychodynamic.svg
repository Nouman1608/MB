<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="900" height="650" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="650" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The psychodynamic explanation (Freud)</text>

<rect x="30" y="100" width="375" height="84" rx="14" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5"/><text x="217.5" y="132" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">ID</text><text x="217.5" y="158.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Unacceptable impulses</text><rect x="495" y="100" width="375" height="84" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="682.5" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">EGO</text><text x="682.5" y="158.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Attempts to control them</text><text x="450" y="172" font-size="30" font-weight="700" fill="#1e2a44" text-anchor="middle">⟷</text><text x="450" y="196" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">conflict</text><rect x="30" y="228" width="840" height="88" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="262.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Anal-stage fixation</text><text x="450" y="291.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">e.g. through very strict toilet training, producing a preoccupation with <tspan font-weight="700" fill="#1e2a44">order</tspan> <tspan font-weight="700" fill="#1e2a44">and</tspan> <tspan font-weight="700" fill="#1e2a44">cleanliness</tspan>.</text><text x="450" y="352" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">DEFENCE MECHANISMS</text><rect x="30" y="378" width="270.6666666666667" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="412.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Undoing</text><text x="50" y="441.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">a compulsion symbolically</text><text x="50" y="462.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">cancels an unacceptable</text><text x="50" y="483.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">thought</text><rect x="314.6666666666667" y="378" width="270.6666666666667" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="334.6666666666667" y="412.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Isolation</text><text x="334.6666666666667" y="441.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">a thought is separated from</text><text x="334.6666666666667" y="462.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">its emotion</text><rect x="599.3333333333334" y="378" width="270.6666666666667" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="619.3333333333334" y="412.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Reaction formation</text><text x="619.3333333333334" y="441.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">acting in the opposite way to</text><text x="619.3333333333334" y="462.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">an unacceptable impulse</text><rect x="30" y="530" width="413" height="88" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="562" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">+ STRENGTH</text><text x="50" y="593.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Considers the meaning of symptoms.</text><rect x="457" y="530" width="413" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="562" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">− WEAKNESSES</text><text x="477" y="593.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Unfalsifiable; little empirical support.</text>
</svg>