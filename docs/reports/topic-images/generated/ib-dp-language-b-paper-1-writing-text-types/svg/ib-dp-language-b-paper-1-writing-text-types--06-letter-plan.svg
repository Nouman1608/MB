<rect width="900" height="746" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Planning a formal letter to the library manager</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Offer to volunteer for a weekend reading club</text>
<rect x="30" y="124" width="270.6666666666667" height="98" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="163.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ROLE</text><text x="46" y="189.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">A student volunteering</text><rect x="314.6666666666667" y="124" width="270.6666666666667" height="98" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="330.6666666666667" y="152" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">READER</text><text x="330.6666666666667" y="178.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The library manager:</text><text x="330.6666666666667" y="201.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">formal</text><rect x="599.3333333333334" y="124" width="270.6666666666667" height="98" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="615.3333333333334" y="152" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PURPOSE</text><text x="615.3333333333334" y="178.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Offer help, persuade,</text><text x="615.3333333333334" y="201.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">request information</text><rect x="60" y="244" width="330" height="470" rx="6" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="84" y="288" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">Dear Ms Varga,</text><line x1="84" y1="316" x2="366" y2="316" stroke="#c9d6d4" stroke-width="6" stroke-linecap="round"/><line x1="84" y1="336" x2="366" y2="336" stroke="#c9d6d4" stroke-width="6" stroke-linecap="round"/><line x1="84" y1="356" x2="286" y2="356" stroke="#c9d6d4" stroke-width="6" stroke-linecap="round"/><line x1="84" y1="406" x2="366" y2="406" stroke="#c9d6d4" stroke-width="6" stroke-linecap="round"/><line x1="84" y1="426" x2="366" y2="426" stroke="#c9d6d4" stroke-width="6" stroke-linecap="round"/><line x1="84" y1="446" x2="366" y2="446" stroke="#c9d6d4" stroke-width="6" stroke-linecap="round"/><line x1="84" y1="466" x2="286" y2="466" stroke="#c9d6d4" stroke-width="6" stroke-linecap="round"/><line x1="84" y1="501" x2="366" y2="501" stroke="#c9d6d4" stroke-width="6" stroke-linecap="round"/><line x1="84" y1="521" x2="286" y2="521" stroke="#c9d6d4" stroke-width="6" stroke-linecap="round"/><line x1="84" y1="561" x2="366" y2="561" stroke="#c9d6d4" stroke-width="6" stroke-linecap="round"/><line x1="84" y1="581" x2="366" y2="581" stroke="#c9d6d4" stroke-width="6" stroke-linecap="round"/><line x1="84" y1="601" x2="286" y2="601" stroke="#c9d6d4" stroke-width="6" stroke-linecap="round"/><text x="84" y="656" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">Yours sincerely,</text><text x="84" y="680" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">Daniel Okafor</text><path d="M398,278 q8,0 8,8 L406,366 q0,8 -8,8" fill="none" stroke="#8a6d0d" stroke-width="2.5"/><path d="M406,324 C430,324 430,285 466,285" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="470" y="244" width="400" height="82" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="484" y="275.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">1. Salutation and purpose</text><text x="484" y="304.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Why you are writing; where you saw the notice</text><path d="M398,408 q8,0 8,8 L406,471 q0,8 -8,8" fill="none" stroke="#8a6d0d" stroke-width="2.5"/><path d="M406,441.5 C430,441.5 430,379 466,379" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="470" y="338" width="400" height="82" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="484" y="369.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">2. What you bring</text><text x="484" y="398.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Two strengths, each with an example</text><path d="M398,503 q8,0 8,8 L406,531 q0,8 -8,8" fill="none" stroke="#8a6d0d" stroke-width="2.5"/><path d="M406,519 C430,519 430,473 466,473" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="470" y="432" width="400" height="82" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="484" y="463.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">3. An idea for the club</text><text x="484" y="492.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Shows initiative</text><path d="M398,563 q8,0 8,8 L406,616 q0,8 -8,8" fill="none" stroke="#8a6d0d" stroke-width="2.5"/><path d="M406,591.5 C430,591.5 430,567 466,567" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="470" y="526" width="400" height="82" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="484" y="557.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">4. Practical questions</text><text x="484" y="586.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Hours, training, whether a reference is needed</text><path d="M398,648 q8,0 8,8 L406,681 q0,8 -8,8" fill="none" stroke="#8a6d0d" stroke-width="2.5"/><path d="M406,666.5 C430,666.5 430,661 466,661" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="470" y="620" width="400" height="82" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="484" y="651.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">5. Closing</text><text x="484" y="680.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Availability, thanks, formal formula, name</text>
</svg>