<rect width="900" height="833" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Register is a scale, not a switch</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">One message: the quiz night has moved from Friday to Monday</text>
<line x1="150" y1="154" x2="750" y2="154" stroke="#1e2a44" stroke-width="5" stroke-linecap="round"/><circle cx="150" cy="154" r="16" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="150" y="198" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Informal</text><circle cx="450" cy="154" r="16" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><text x="450" y="198" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Neutral</text><circle cx="750" cy="154" r="16" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="750" y="198" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Formal</text><rect x="30" y="230" width="270.6666666666667" height="227" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="258" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">MESSAGE TO A FRIEND</text><text x="46" y="289.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">"<tspan font-weight="700" fill="#1e2a44">Hey!</tspan> Bad news, the quiz</text><text x="46" y="310.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">night's <tspan font-weight="700" fill="#1e2a44">moved</tspan> to Monday. <tspan font-weight="700" fill="#1e2a44">Still</tspan></text><text x="46" y="331.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">up</tspan> <tspan font-weight="700" fill="#1e2a44">for</tspan> <tspan font-weight="700" fill="#1e2a44">it?</tspan> <tspan font-weight="700" fill="#1e2a44">Let</tspan> <tspan font-weight="700" fill="#1e2a44">me</tspan> <tspan font-weight="700" fill="#1e2a44">know!</tspan>"</text><rect x="314.6666666666667" y="230" width="270.6666666666667" height="227" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="330.6666666666667" y="258" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">SCHOOL NEWSLETTER</text><text x="330.6666666666667" y="289.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">"<tspan font-weight="700" fill="#1e2a44">Please</tspan> <tspan font-weight="700" fill="#1e2a44">note</tspan> that this term's</text><text x="330.6666666666667" y="310.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">quiz night <tspan font-weight="700" fill="#1e2a44">will</tspan> <tspan font-weight="700" fill="#1e2a44">now</tspan> <tspan font-weight="700" fill="#1e2a44">take</tspan> <tspan font-weight="700" fill="#1e2a44">place</tspan></text><text x="330.6666666666667" y="331.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">on Monday rather than Friday.</text><text x="330.6666666666667" y="352.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Tickets already bought remain</text><text x="330.6666666666667" y="373.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">valid."</text><rect x="599.3333333333334" y="230" width="270.6666666666667" height="227" rx="14" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><text x="615.3333333333334" y="258" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">LETTER TO A GUEST SPEAKER</text><text x="615.3333333333334" y="289.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">"<tspan font-weight="700" fill="#1e2a44">I</tspan> <tspan font-weight="700" fill="#1e2a44">am</tspan> <tspan font-weight="700" fill="#1e2a44">writing</tspan> <tspan font-weight="700" fill="#1e2a44">to</tspan> <tspan font-weight="700" fill="#1e2a44">inform</tspan> <tspan font-weight="700" fill="#1e2a44">you</tspan></text><text x="615.3333333333334" y="310.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">that the quiz night <tspan font-weight="700" fill="#1e2a44">has</tspan> <tspan font-weight="700" fill="#1e2a44">been</tspan></text><text x="615.3333333333334" y="331.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">rescheduled</tspan> to Monday. I</text><text x="615.3333333333334" y="352.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">apologise for any</text><text x="615.3333333333334" y="373.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">inconvenience and <tspan font-weight="700" fill="#1e2a44">would</tspan> <tspan font-weight="700" fill="#1e2a44">be</tspan></text><text x="615.3333333333334" y="394.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">grateful</tspan> <tspan font-weight="700" fill="#1e2a44">if</tspan> <tspan font-weight="700" fill="#1e2a44">you</tspan> <tspan font-weight="700" fill="#1e2a44">could</tspan> <tspan font-weight="700" fill="#1e2a44">confirm</tspan></text><text x="615.3333333333334" y="415.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">whether you are still able to</text><text x="615.3333333333334" y="436.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">attend."</text><clipPath id="tc479"><rect x="30" y="479" width="840" height="278" rx="14"/></clipPath><g clip-path="url(#tc479)"><rect x="30" y="479" width="184.39024390243904" height="48" fill="#b5d3cf"/><text x="44" y="506.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">What changes</text><rect x="214.39024390243904" y="479" width="204.87804878048783" height="48" fill="#b5d3cf"/><text x="228.39024390243904" y="506.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Informal</text><rect x="419.26829268292687" y="479" width="204.87804878048783" height="48" fill="#b5d3cf"/><text x="433.26829268292687" y="506.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Neutral</text><rect x="624.1463414634147" y="479" width="245.85365853658539" height="48" fill="#b5d3cf"/><text x="638.1463414634147" y="506.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Formal</text><rect x="30" y="527" width="184.39024390243904" height="47" fill="#dce9e7"/><text x="44" y="553.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Opening</text><rect x="214.39024390243904" y="527" width="204.87804878048783" height="47" fill="#ffffff"/><text x="228.39024390243904" y="553.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">"Hey!"</text><rect x="419.26829268292687" y="527" width="204.87804878048783" height="47" fill="#ffffff"/><text x="433.26829268292687" y="553.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">"Please note"</text><rect x="624.1463414634147" y="527" width="245.85365853658539" height="47" fill="#ffffff"/><text x="638.1463414634147" y="553.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">"I am writing to inform you"</text><line x1="30" y1="574" x2="870" y2="574" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="574" width="184.39024390243904" height="47" fill="#dce9e7"/><text x="44" y="600.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Vocabulary</text><rect x="214.39024390243904" y="574" width="204.87804878048783" height="47" fill="#f8faf9"/><text x="228.39024390243904" y="600.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">"moved"</text><rect x="419.26829268292687" y="574" width="204.87804878048783" height="47" fill="#f8faf9"/><text x="433.26829268292687" y="600.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">"will now take place"</text><rect x="624.1463414634147" y="574" width="245.85365853658539" height="47" fill="#f8faf9"/><text x="638.1463414634147" y="600.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">"has been rescheduled"</text><line x1="30" y1="621" x2="870" y2="621" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="621" width="184.39024390243904" height="68" fill="#dce9e7"/><text x="44" y="647.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Structure</text><rect x="214.39024390243904" y="621" width="204.87804878048783" height="68" fill="#ffffff"/><text x="228.39024390243904" y="647.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Fragments</text><rect x="419.26829268292687" y="621" width="204.87804878048783" height="68" fill="#ffffff"/><text x="433.26829268292687" y="647.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Full sentences</text><rect x="624.1463414634147" y="621" width="245.85365853658539" height="68" fill="#ffffff"/><text x="638.1463414634147" y="647.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Full sentences and a</text><text x="638.1463414634147" y="668.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">passive</text><line x1="30" y1="689" x2="870" y2="689" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="689" width="184.39024390243904" height="68" fill="#dce9e7"/><text x="44" y="715.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Request</text><rect x="214.39024390243904" y="689" width="204.87804878048783" height="68" fill="#f8faf9"/><text x="228.39024390243904" y="715.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">"Let me know!"</text><rect x="419.26829268292687" y="689" width="204.87804878048783" height="68" fill="#f8faf9"/><text x="433.26829268292687" y="715.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">—</text><rect x="624.1463414634147" y="689" width="245.85365853658539" height="68" fill="#f8faf9"/><text x="638.1463414634147" y="715.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">"would be grateful if you</text><text x="638.1463414634147" y="736.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">could confirm"</text></g><line x1="214.39024390243904" y1="479" x2="214.39024390243904" y2="757" stroke="#c9d6d4" stroke-width="1.5"/><line x1="419.26829268292687" y1="479" x2="419.26829268292687" y2="757" stroke="#c9d6d4" stroke-width="1.5"/><line x1="624.1463414634147" y1="479" x2="624.1463414634147" y2="757" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="479" width="840" height="278" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="792.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Once you choose a form of address (<tspan font-style="italic">tu/vous</tspan>, <tspan font-style="italic">du/Sie</tspan>, <tspan font-style="italic">tú/usted</tspan>), keep it for the whole text.</text>
