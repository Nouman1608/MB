<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="560" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Choosing one task from three</text>

<line x1="60" y1="120" x2="60" y2="508" stroke="#c9d6d4" stroke-width="4"/><rect x="104" y="100" width="766" height="79" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="119" y="129.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Read all three to the end</text><text x="119" y="159.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">The text type and audience are often in the last line.</text><circle cx="60" cy="139.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="148.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="104" y="189" width="766" height="79" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="119" y="218.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Underline five things in each</text><text x="119" y="248.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Your role · the reader · the purpose · the text type · the content points</text><circle cx="60" cy="228.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="237.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="104" y="278" width="766" height="101" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="119" y="307.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Ask two questions</text><text x="119" y="337.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Do I control this text type's conventions? Do I have the topic vocabulary in my target</text><text x="119" y="359.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">language?</text><circle cx="60" cy="328.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="337.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="104" y="389" width="766" height="50" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="119" y="418.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Choose the task where both answers are yes</text><circle cx="60" cy="414" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="422.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="104" y="449" width="766" height="79" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="119" y="478.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Commit</text><text x="119" y="508.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Changing task halfway wastes time.</text><circle cx="60" cy="488.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="497.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text>
</svg>