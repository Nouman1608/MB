 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="735" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Paper 1 at a glance</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Productive skills · externally assessed · 25% · 30 marks</text>
<rect x="60" y="138" width="120" height="150" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="120" y="172" font-size="18" font-weight="700" fill="#4a5568" text-anchor="middle">Task A</text><line x1="78" y1="194" x2="162" y2="194" stroke="#c9d6d4" stroke-width="4" stroke-linecap="round"/><line x1="78" y1="216" x2="162" y2="216" stroke="#c9d6d4" stroke-width="4" stroke-linecap="round"/><line x1="78" y1="238" x2="162" y2="238" stroke="#c9d6d4" stroke-width="4" stroke-linecap="round"/><line x1="78" y1="260" x2="162" y2="260" stroke="#c9d6d4" stroke-width="4" stroke-linecap="round"/><rect x="210" y="124" width="120" height="150" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="3.5"/><text x="270" y="158" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Task B</text><line x1="228" y1="180" x2="312" y2="180" stroke="#8a6d0d" stroke-width="4" stroke-linecap="round"/><line x1="228" y1="202" x2="312" y2="202" stroke="#8a6d0d" stroke-width="4" stroke-linecap="round"/><line x1="228" y1="224" x2="312" y2="224" stroke="#8a6d0d" stroke-width="4" stroke-linecap="round"/><line x1="228" y1="246" x2="312" y2="246" stroke="#8a6d0d" stroke-width="4" stroke-linecap="round"/><rect x="360" y="138" width="120" height="150" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="420" y="172" font-size="18" font-weight="700" fill="#4a5568" text-anchor="middle">Task C</text><line x1="378" y1="194" x2="462" y2="194" stroke="#c9d6d4" stroke-width="4" stroke-linecap="round"/><line x1="378" y1="216" x2="462" y2="216" stroke="#c9d6d4" stroke-width="4" stroke-linecap="round"/><line x1="378" y1="238" x2="462" y2="238" stroke="#c9d6d4" stroke-width="4" stroke-linecap="round"/><line x1="378" y1="260" x2="462" y2="260" stroke="#c9d6d4" stroke-width="4" stroke-linecap="round"/><circle cx="270" cy="274" r="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="270" y="281.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">✓</text><text x="255" y="334" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Choose one writing task from three</text><line x1="500" y1="209" x2="556" y2="209" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="570" y="124" width="300" height="178" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="590" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ONE TEXT</text><text x="590" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Right type, register and</text><text x="590" y="206.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">conventions</text><text x="590" y="235.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Rewards language that fits the</text><text x="590" y="256.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">context and audience, not only</text><text x="590" y="277.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">language that is correct.</text><text x="30" y="382" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">WORD RANGE (set by the full subject guide)</text><line x1="60" y1="516" x2="840" y2="516" stroke="#1e2a44" stroke-width="2.5"/><line x1="60" y1="511" x2="60" y2="521" stroke="#1e2a44" stroke-width="2"/><text x="60" y="542" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">0</text><line x1="190" y1="511" x2="190" y2="521" stroke="#1e2a44" stroke-width="2"/><text x="190" y="542" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">100</text><line x1="320" y1="511" x2="320" y2="521" stroke="#1e2a44" stroke-width="2"/><text x="320" y="542" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">200</text><line x1="450" y1="511" x2="450" y2="521" stroke="#1e2a44" stroke-width="2"/><text x="450" y="542" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">300</text><line x1="580" y1="511" x2="580" y2="521" stroke="#1e2a44" stroke-width="2"/><text x="580" y="542" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">400</text><line x1="710" y1="511" x2="710" y2="521" stroke="#1e2a44" stroke-width="2"/><text x="710" y="542" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">500</text><line x1="840" y1="511" x2="840" y2="521" stroke="#1e2a44" stroke-width="2"/><text x="840" y="542" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">600</text><rect x="385" y="402" width="195" height="40" rx="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="482.49999999999994" y="429" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">SL 250–400</text><rect x="645" y="454" width="195" height="40" rx="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="742.5" y="481" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">HL 450–600</text><text x="840" y="566" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">words</text><rect x="30" y="592" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="626.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Same outline at SL and HL</text><text x="50" y="656.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">At HL the tasks "require more complex language and structures and demand higher-order thinking</text><text x="50" y="678.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">skills", with a higher word range.</text>
</svg>