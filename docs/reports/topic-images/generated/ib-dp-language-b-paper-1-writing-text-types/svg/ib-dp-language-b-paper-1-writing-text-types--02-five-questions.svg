<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 594" width="900" height="594" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="594" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Five questions before you write</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Answer each one in your plan</text>
<rect x="30" y="124" width="840" height="78" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="72" cy="163" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="72" y="170.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="112" y="158" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Context</text><text x="112" y="184" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Where and why does this text exist?</text><rect x="713.816" y="146" width="141.184" height="30" rx="15" fill="#d4b02e" stroke="#8a6d0d" stroke-width="2"/><text x="784.408" y="166.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">sets the format</text><rect x="30" y="214" width="840" height="78" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="72" cy="253" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="72" y="260.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="112" y="248" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Audience</text><text x="112" y="274" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Who reads it? What is your relationship?</text><rect x="705.1279999999999" y="236" width="149.872" height="30" rx="15" fill="#d4b02e" stroke="#8a6d0d" stroke-width="2"/><text x="780.064" y="256.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">sets the register</text><rect x="30" y="304" width="840" height="78" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="72" cy="343" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="72" y="350.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="112" y="338" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Purpose</text><text x="112" y="364" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Inform, persuade, request, complain, advise, reflect?</text><rect x="629.4" y="326" width="225.6" height="30" rx="15" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="742.1999999999999" y="346.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">look for a second purpose</text><rect x="30" y="394" width="840" height="78" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="72" cy="433" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="72" y="440.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="112" y="428" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Meaning</text><text x="112" y="454" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">What single message should the reader take away?</text><rect x="662.968" y="416" width="192.032" height="30" rx="15" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="758.9839999999999" y="436.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">say it in one sentence</text><rect x="30" y="484" width="840" height="78" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="72" cy="523" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="72" y="530.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="112" y="518" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Variation</text><text x="112" y="544" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Which form of the language suits this reader?</text><rect x="605.032" y="506" width="249.968" height="30" rx="15" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="730.0160000000001" y="526.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">choose it and stay consistent</text>
</svg>