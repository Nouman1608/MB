<rect x="30" y="124" width="269.3333333333333" height="249" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PERSONAL</text><text x="50" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">For yourself or someone</text><text x="50" y="206.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">you know</text><text x="50" y="236.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="236.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Diary or journal entry</text><text x="50" y="264.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="264.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Personal email or letter</text><text x="50" y="292.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="292.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Blog post (personal)</text><rect x="315.3333333333333" y="124" width="269.3333333333333" height="249" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="335.3333333333333" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PROFESSIONAL</text><text x="335.3333333333333" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">To an organisation or in</text><text x="335.3333333333333" y="206.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">a working role</text><text x="335.3333333333333" y="236.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="351.4833333333333" y="236.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Formal letter</text><text x="335.3333333333333" y="264.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="351.4833333333333" y="264.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Formal email</text><text x="335.3333333333333" y="292.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="351.4833333333333" y="292.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Report</text><text x="335.3333333333333" y="320.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="351.4833333333333" y="320.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Proposal</text><rect x="600.6666666666666" y="124" width="269.3333333333333" height="249" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="620.6666666666666" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">MASS MEDIA</text><text x="620.6666666666666" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">For a wide public</text><text x="620.6666666666666" y="206.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">audience</text><text x="620.6666666666666" y="236.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="636.8166666666666" y="236.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Article (news or feature)</text><text x="620.6666666666666" y="264.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="636.8166666666666" y="264.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Opinion piece or editorial</text><text x="620.6666666666666" y="292.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="636.8166666666666" y="292.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Speech</text><text x="620.6666666666666" y="320.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="636.8166666666666" y="320.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Leaflet or brochure</text><text x="620.6666666666666" y="348.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="636.8166666666666" y="348.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Review</text><rect x="30" y="395" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="429.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Conventions decide whether a text looks like the type it claims to be</text><text x="50" y="459.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Layout and opening · register · typical moves · closing. Learn the list your teacher shares from the</text><text x="50" y="481.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">full guide.</text>
