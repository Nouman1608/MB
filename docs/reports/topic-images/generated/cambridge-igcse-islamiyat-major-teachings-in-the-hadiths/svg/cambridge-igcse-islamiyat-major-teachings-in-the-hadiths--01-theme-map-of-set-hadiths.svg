<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 742" width="900" height="742" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="742" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The twenty set Hadiths by theme</text>

<rect x="30" y="110" width="410" height="60" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="3"/><text x="235" y="148" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Individual conduct</text><rect x="30" y="184" width="410" height="42" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="58" y="211" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">1</text><text x="80" y="211" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Religion is sincerity</text><rect x="30" y="234" width="410" height="42" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="58" y="261" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">2</text><text x="80" y="261" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Obligations kept: enough for paradise</text><rect x="30" y="284" width="410" height="42" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="58" y="311" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">3</text><text x="80" y="311" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Every joint must perform a charity</text><rect x="30" y="334" width="410" height="42" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="58" y="361" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">4</text><text x="80" y="361" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Eating from the work of one's hand</text><rect x="30" y="384" width="410" height="42" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="58" y="411" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">5</text><text x="80" y="411" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Studying the Qur'an: tethered camels</text><rect x="30" y="434" width="410" height="42" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="58" y="461" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">6</text><text x="80" y="461" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Modesty produces nothing but good</text><rect x="30" y="484" width="410" height="42" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="58" y="511" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">7</text><text x="80" y="511" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Faith and pride "as small as a mustard seed"</text><rect x="30" y="534" width="410" height="42" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="58" y="561" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">8</text><text x="80" y="561" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The world is the believer's prison</text><rect x="30" y="584" width="410" height="42" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="58" y="611" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">9</text><text x="80" y="611" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Allah looks at hearts and deeds</text><rect x="460" y="110" width="410" height="60" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="3"/><text x="665" y="148" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Life in the community</text><rect x="460" y="184" width="410" height="42" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="488" y="211" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">10</text><text x="510" y="211" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Want for your brother what you want for yourself</text><rect x="460" y="234" width="410" height="42" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="488" y="261" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">11</text><text x="510" y="261" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Speak good or keep silent; neighbour and guest</text><rect x="460" y="284" width="410" height="42" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="488" y="311" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">12</text><text x="510" y="311" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Change an evil: hand, tongue, heart</text><rect x="460" y="334" width="410" height="42" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="488" y="361" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">13</text><text x="510" y="361" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Striving with person and property</text><rect x="460" y="384" width="410" height="42" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="488" y="411" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">14</text><text x="510" y="411" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The many kinds of martyr</text><rect x="460" y="434" width="410" height="42" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="488" y="461" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">15</text><text x="510" y="461" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Caring for the widow and the poor</text><rect x="460" y="484" width="410" height="42" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="488" y="511" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">16</text><text x="510" y="511" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Bringing up an orphan</text><rect x="460" y="534" width="410" height="42" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="488" y="561" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">17</text><text x="510" y="561" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Be gentle, do not be hard</text><rect x="460" y="584" width="410" height="42" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="488" y="611" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">18</text><text x="510" y="611" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Kindly in selling, buying and repayment</text><rect x="460" y="634" width="410" height="42" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="488" y="661" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">19</text><text x="510" y="661" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">No mercy for one who shows no mercy</text><rect x="460" y="684" width="410" height="42" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="488" y="711" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">20</text><text x="510" y="711" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The believers are like a single man</text><rect x="30" y="650" width="410" height="82" rx="12" fill="#f4f6f6" stroke="#c9d6d4" stroke-width="0"/><text x="46" y="676" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">All twenty are recorded by al-Bukhari or</text><text x="46" y="697" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Muslim. Four are printed in the exam; you</text><text x="46" y="718" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">answer two.</text>
</svg>