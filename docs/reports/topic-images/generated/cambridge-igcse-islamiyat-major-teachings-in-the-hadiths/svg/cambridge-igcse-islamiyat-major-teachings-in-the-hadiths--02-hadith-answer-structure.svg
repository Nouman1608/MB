<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="700" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Answering a Hadith question</text>

<rect x="30" y="110" width="260" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="76" y="170" font-size="44" font-weight="700" fill="#2e6b62" text-anchor="middle">4</text><text x="116" y="150" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">passages printed</text><text x="116" y="176" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">in Arabic and English</text><line x1="292" y1="156" x2="316" y2="156" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="320" y="110" width="260" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="366" y="170" font-size="44" font-weight="700" fill="#2e6b62" text-anchor="middle">2</text><text x="406" y="150" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">you choose</text><text x="406" y="176" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">and answer</text><line x1="582" y1="156" x2="606" y2="156" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="610" y="110" width="260" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="656" y="170" font-size="44" font-weight="700" fill="#2e6b62" text-anchor="middle">2</text><text x="696" y="150" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">paragraphs</text><text x="696" y="176" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">for each Hadith</text><rect x="30" y="226" width="840" height="150" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="3"/><circle cx="76" cy="270" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="76" y="278.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="116" y="278" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="start">Teaching</text><text x="240" y="278" font-size="18" font-weight="400" fill="#4a5568" text-anchor="start">what it means</text><text x="116" y="318" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">• Explain the Hadith in your own words.</text><text x="116" y="348" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">• Refer to its key phrase.</text><line x1="450" y1="378" x2="450" y2="402" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="30" y="406" width="840" height="150" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="3"/><circle cx="76" cy="450" r="24" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="76" y="458.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="116" y="458" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="start">Application</text><text x="272" y="458" font-size="18" font-weight="400" fill="#4a5568" text-anchor="start">how to act on it today</text><text x="116" y="498" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">• Give a concrete example of a Muslim putting it into practice.</text><text x="116" y="528" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">• Support it with a related verse of the Qur'an or another Hadith.</text><rect x="30" y="580" width="840" height="96" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="56" y="616" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Specificity test</text><text x="56" y="648" font-size="18" font-weight="400" fill="#4a5568" text-anchor="start">Could your example only apply to this Hadith? If so, it is specific enough.</text>
</svg>