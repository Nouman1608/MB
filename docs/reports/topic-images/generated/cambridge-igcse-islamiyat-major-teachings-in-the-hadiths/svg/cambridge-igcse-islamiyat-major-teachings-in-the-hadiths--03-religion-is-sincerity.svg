<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" width="900" height="680" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="680" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Religion is sincerity: to whom?</text>

<line x1="450" y1="400" x2="450" y2="180" stroke="#2e6b62" stroke-width="3.5"/><line x1="450" y1="400" x2="735" y2="330" stroke="#2e6b62" stroke-width="3.5"/><line x1="450" y1="400" x2="640" y2="590" stroke="#2e6b62" stroke-width="3.5"/><line x1="450" y1="400" x2="260" y2="590" stroke="#2e6b62" stroke-width="3.5"/><line x1="450" y1="400" x2="165" y2="330" stroke="#2e6b62" stroke-width="3.5"/><circle cx="450" cy="400" r="98" fill="#f2e7b8" stroke="#d4b02e" stroke-width="3.5"/><text x="450" y="392" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">Religion</text><text x="450" y="422" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">is sincerity</text><rect x="325" y="130" width="250" height="100" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="166" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">to Allah</text><text x="450" y="197.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Worship Him alone with pure</text><text x="450" y="217.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">intention</text><rect x="610" y="280" width="250" height="100" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="735" y="316" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">to His Book</text><text x="735" y="357.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Read and follow the Qur'an</text><rect x="515" y="540" width="250" height="100" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="640" y="576" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">to His Messenger</text><text x="640" y="617.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Follow the Sunnah</text><rect x="135" y="540" width="250" height="100" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="260" y="576" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">to the leaders</text><text x="260" y="607.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Give honest advice and</text><text x="260" y="627.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">support</text><rect x="40" y="280" width="250" height="100" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="165" y="316" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">to the common people</text><text x="165" y="347.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Wish them well and treat</text><text x="165" y="367.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">them honestly</text>
</svg>