<text x="450" y="132" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle" font-style="italic">"Whoever sees an evil, let him change it with his..."</text><rect x="30" y="160" width="840" height="108" rx="14" fill="#b5d3cf" stroke="#2e6b62" stroke-width="3"/><circle cx="80" cy="214" r="26" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="80" y="223.36" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="128" y="206" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="start">Hand</text><text x="128" y="238" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Act to change it, if able</text><text x="850" y="293" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">if not able</text><rect x="120" y="306" width="660" height="108" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="3"/><circle cx="170" cy="360" r="26" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="170" y="369.36" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="218" y="352" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="start">Tongue</text><text x="218" y="384" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Speak out against it, if not able to act</text><text x="760" y="439" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">if not able</text><rect x="210" y="452" width="480" height="118" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="3"/><circle cx="260" cy="511" r="26" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="260" y="520.36" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="308" y="498" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="start">Heart</text><text x="308" y="530" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">At least hate the wrong inwardly: the</text><text x="30