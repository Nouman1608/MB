<rect width="900" height="478" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Even a mustard seed matters</text>

<rect x="30" y="110" width="410" height="250" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="3"/><circle cx="235" cy="170" r="9" fill="#8a6d0d" stroke="#1e2a44" stroke-width="2"/><text x="235" y="222" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">Faith</text><text x="235" y="252" font-size="18" font-weight="400" fill="#4a5568" text-anchor="middle">as small as a mustard seed</text><line x1="235" y1="268" x2="235" y2="300" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="235" y="334" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="middle">saves from hell</text><rect x="460" y="110" width="410" height="250" rx="14" fill="#f3dccd" stroke="#b5602e" stroke-width="3"/><circle cx="665" cy="170" r="9" fill="#8a6d0d" stroke="#1e2a44" stroke-width="2"/><text x="665" y="222" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">Pride</text><text x="665" y="252" font-size="18" font-weight="400" fill="#4a5568" text-anchor="middle">as small as a mustard seed</text><line x1="665" y1="268" x2="665" y2="300" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="665" y="334" font-size="21" font-weight="700" fill="#b5602e" text-anchor="middle">blocks paradise</text><rect x="30" y="384" width="840" height="70" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="450" y="426" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">So be humble and never look down on others.</text>
</svg>