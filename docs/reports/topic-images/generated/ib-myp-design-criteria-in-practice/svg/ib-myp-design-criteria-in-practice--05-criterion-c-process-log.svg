<rect width="900" height="660" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Criterion C: build to a plan, log the changes</text>

<rect x="30" y="110" width="840" height="360" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="55" y="148" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Logically sequenced plan, followed and logged</text><rect x="60" y="175" width="130" height="70" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.2"/><text x="125" y="207" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Step 1</text><text x="125" y="231" font-size="15" font-weight="600" fill="#4a5568" text-anchor="middle">logged</text><line x1="192" y1="210" x2="222" y2="210" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="225" y="175" width="130" height="70" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.2"/><text x="290" y="207" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Step 2</text><text x="290" y="231" font-size="15" font-weight="600" fill="#4a5568" text-anchor="middle">logged</text><line x1="357" y1="210" x2="387" y2="210" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="390" y="175" width="130" height="70" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="3"/><text x="455" y="207" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Step 3</text><text x="455" y="231" font-size="15" font-weight="600" fill="#8a6d0d" text-anchor="middle">changed</text><line x1="522" y1="210" x2="552" y2="210" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="555" y="175" width="130" height="70" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.2"/><text x="620" y="207" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Step 4</text><text x="620" y="231" font-size="15" font-weight="600" fill="#4a5568" text-anchor="middle">logged</text><line x1="687" y1="210" x2="717" y2="210" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="720" y="175" width="130" height="70" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.2"/><text x="785" y="207" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Step 5</text><text x="785" y="231" font-size="15" font-weight="600" fill="#4a5568" text-anchor="middle">logged</text><line x1="455" y1="248" x2="455" y2="282" stroke="#8a6d0d" stroke-width="3" marker-end="url(#ahO)"/><rect x="165" y="288" width="580" height="112" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="185" y="322" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Log entry: material substitution (availability)</text><text x="185" y="352" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">• why the change was made</text><text x="185" y="378" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">• how it affected the following steps</text><path d="M745,358 C800,358 812,300 787,250" fill="none" stroke="#8a6d0d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 6" marker-end="url(#ahO)"/><text x="450" y="440" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="middle">Also recorded: how time, resources and risks were managed</text><rect x="30" y="490" width="410" height="140" rx="14" fill="#fbeee6" stroke="#b5602e" stroke-width="2.5"/><text x="52" y="526" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">✗ Lower band</text><text x="52" y="556" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Finished prototype only;</text><text x="52" y="578" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">no record of the process</text><text x="52" y="600" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">followed to reach it.</text><rect x="460" y="490" width="410" height="140" rx="14" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.5"/><text x="482" y="526" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">✓ Top band</text><text x="482" y="556" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Prototype good enough to test</text><text x="482" y="578" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">plus the sequence followed and</text><text x="482" y="600" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">every justified change.</text>
</svg>