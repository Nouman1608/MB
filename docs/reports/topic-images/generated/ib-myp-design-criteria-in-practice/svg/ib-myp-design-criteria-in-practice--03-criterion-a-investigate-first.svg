roke="#1e2a44" stroke-width="2.2"/><text x="450" y="442" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Observe</text><text x="450" y="470" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">canteen practices</text><line x1="450" y1="518" x2="450" y2="552" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="590" y="405" width="250" height="110" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2.2"/><text x="715" y="442" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Research</text><text x="715" y="470" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">existing solutions</text><text x="715" y="492" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">used elsewhere</text><line x1="715" y1="518" x2="510" y2="552" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="160" y="560" width="580" height="60" rx="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.2"/><text x="450" y="597" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Evidenced analysis of the target audience’s need</text><line x1="450" y1="622" x2="450" y2="646" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="250" y="652" width="400" height="52" rx="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.2"/><text x="450" y="685" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Design brief grounded in it</text>
