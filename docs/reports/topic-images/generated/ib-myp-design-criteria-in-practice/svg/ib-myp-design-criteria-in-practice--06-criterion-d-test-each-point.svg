<rect x="30" y="110" width="840" height="80" rx="14" fill="#fbeee6" stroke="#b5602e" stroke-width="2.5"/><text x="55" y="158" font-size="20" font-weight="700" fill="#b5602e" text-anchor="start">✗ “The prototype was successful.”</text><text x="845" y="158" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">general, untested</text><rect x="30" y="210" width="840" height="470" rx="14" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.5"/><text x="55" y="248" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">✓ For each specification point, separately:</text><rect x="55" y="268" width="180" height="46" rx="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.2"/><text x="145" y="296.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Specification point</text><line x1="237" y1="291" x2="256" y2="291" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="260" y="268" width="180" height="46" rx="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.2"/><text x="350" y="296.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Measurable test</text><line x1="442" y1="291" x2="461" y2="291" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="465" y="268" width="180" height="46" rx="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.2"/><text x="555" y="296.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Actual result</text><line x1="647" y1="291" x2="666" y2="291" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="670" y="268" width="180" height="46" rx="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.2"/><text x="760" y="296.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Improvement</text><rect x="55" y="330" width="180" height="110" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="145" y="368" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Reduce food waste</text><text x="145" y="390" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">by a target amount</text><rect x="260" y="330" width="180" height="110" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="350" y="368" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Measure waste over</text><text x="350" y="390" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">a trial period</text><rect x="465" y="330" width="180" height="110" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="555" y="368" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Report it honestly,</text><text x="555" y="390" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">even if it falls short</text><rect x="670" y="330" width="180" height="110" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="760" y="368" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Specific and</text><text x="760" y="390" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">actionable, from</text><text x="760" y="412" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">the evidence</text><rect x="55" y="456" width="180" height="44" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="145" y="484" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">point 2</text><rect x="260" y="456" width="180" height="44" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="350" y="484" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">…</text><rect x="465" y="456" width="180" height="44" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="555" y="484" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">…</text><rect x="670" y="456" width="180" height="44" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="760" y="484" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">…</text><rect x="55" y="514" width="180" height="44" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="145" y="542" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">point 3</text><rect x="260" y="514" width="180" height="44" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="350" y="542" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">…</text><rect x="465" y="514" width="180" height="44" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="555" y="542" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">…</text><rect x="670" y="514" width="180" height="44" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="760" y="542" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">…</text><rect x="55" y="580" width="795" height="80" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="452" y="614" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Then: the solution’s real impact on its client or target audience</text><text x="452" y="642" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">canteen example: did the solution cut measured food waste?</text>
