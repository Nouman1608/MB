iddle">equally weighted</text><rect x="30" y="310" width="840" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="350" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Each criterion is scored on the same 0–8 scale</text><rect x="100" y="385" width="70" height="70" rx="10" fill="#e6e8ea" stroke="#4a5568" stroke-width="2.2"/><text x="135" y="431" font-size="26" font-weight="700" fill="#4a5568" text-anchor="middle">0</text><rect x="190" y="385" width="74" height="70" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.2"/><text x="227" y="431" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="270" y="385" width="74" height="70" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.2"/><text x="307" y="431" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="350" y="385" width="74" height="70" rx="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.2"/><text x="387" y="431" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="430" y="385" width="74" height="70" rx="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.2"/><text x="467" y="431" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="510" y="385" width="74" height="70" rx="10" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.2"/><text x="547" y="431" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><rect x="590" y="385" width="74" height="70" rx="10" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.2"/><text x="627" y="431" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">6</text><rect x="670" y="385" width="74" height="70" rx="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.2"/><text x="707" y="431" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">7</text><rect x="750" y="385" width="74" height="70" rx="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.2"/><text x="787" y="431" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">8</text><path d="M190,469 L190,479 L344,479 L344,469" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><text x="267" y="505" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">band 1</text><path d="M350,469 L350,479 L504,479 L504,469" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><text x="427" y="505" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">band 2</text><path d="M510,469 L510,479 L664,479 L664,469" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><text x="587" y="505" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">band 3</text><path d="M670,469 L670,479 L824,479 L824,469" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><text x="747" y="505" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">band 4</text><text x="135" y="497" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">below</text><text x="135" y="516" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">level 1</text><text x="450" y="545" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Levels 1–8 sit in four descriptor bands; level 0 is work that does not reach level 1.</text><rect x="30" y="580" width="840" height="90" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="617" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Assessed through an ePortfolio: a design project</text><text x="450" y="645" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">presented as a complete design folder</text>
