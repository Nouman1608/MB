<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Criterion B: compare ideas, then choose</text>

<rect x="30" y="110" width="840" height="92" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="55" y="146" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Detailed, testable design specification</text><text x="55" y="176" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">testable criteria such as cost, materials, target-audience appeal</text><rect x="30" y="222" width="840" height="340" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="55" y="262" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Evaluate every idea</text><text x="55" y="286" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">against each criterion</text><rect x="330" y="240" width="160" height="52" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.2"/><text x="410" y="271.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Idea 1</text><rect x="510" y="240" width="160" height="52" rx="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.2"/><text x="590" y="271.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Idea 2</text><rect x="690" y="240" width="160" height="52" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.2"/><text x="770" y="271.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Idea 3</text><rect x="504" y="234" width="172" height="314" rx="14" fill="none" stroke="#8a6d0d" stroke-width="3"/><line x1="55" y1="306" x2="850" y2="306" stroke="#c9d6d4" stroke-width="2"/><text x="55" y="350" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start">Cost</text><text x="410" y="356" font-size="30" font-weight="700" fill="#2e6b62" text-anchor="middle">✓</text><text x="590" y="356" font-size="30" font-weight="700" fill="#2e6b62" text-anchor="middle">✓</text><text x="770" y="356" font-size="30" font-weight="700" fill="#b5602e" text-anchor="middle">✗</text><line x1="55" y1="380" x2="850" y2="380" stroke="#c9d6d4" stroke-width="2"/><text x="55" y="424" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start">Materials</text><text x="410" y="430" font-size="30" font-weight="700" fill="#b5602e" text-anchor="middle">✗</text><text x="590" y="430" font-size="30" font-weight="700" fill="#2e6b62" text-anchor="middle">✓</text><text x="770" y="430" font-size="30" font-weight="700" fill="#2e6b62" text-anchor="middle">✓</text><line x1="55" y1="454" x2="850" y2="454" stroke="#c9d6d4" stroke-width="2"/><text x="55" y="498" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start">Audience appeal</text><text x="410" y="504" font-size="30" font-weight="700" fill="#2e6b62" text-anchor="middle">✓</text><text x="590" y="504" font-size="30" font-weight="700" fill="#2e6b62" text-anchor="middle">✓</text><text x="770" y="504" font-size="30" font-weight="700" fill="#b5602e" text-anchor="middle">✗</text><line x1="590" y1="552" x2="590" y2="592" stroke="#8a6d0d" stroke-width="3.5" marker-end="url(#ahO)"/><rect x="30" y="600" width="840" height="100" rx="14" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.5"/><text x="55" y="638" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">✓ Chosen design + justification</text><text x="55" y="668" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">why it meets the specification better than the rejected alternatives</text><rect x="30" y="720" width="840" height="70" rx="14" fill="#fbeee6" stroke="#b5602e" stroke-width="2.5"/><text x="55" y="762" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">✗ Only one idea: no comparison is possible, so no top band</text>
