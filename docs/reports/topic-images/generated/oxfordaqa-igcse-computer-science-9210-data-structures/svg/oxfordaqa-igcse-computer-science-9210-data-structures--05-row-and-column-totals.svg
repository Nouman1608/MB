-size="24" font-weight="700" fill="#8a6d0d" text-anchor="middle">14</text><text x="152" y="418" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="end">dayTotal</text><circle cx="686" cy="411" r="40" fill="#1e2a44"/><text x="686" y="420" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">59</text><text x="686" y="472" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">both ways</text><rect x="30" y="498" width="520" height="222" rx="12" fill="#1e2a44"/><text x="48" y="528" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="16" font-weight="400" fill="#e8eef0" text-anchor="start">FOR shop ← 0 TO 2</text><text x="67.2" y="556" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="16" font-weight="700" fill="#d4b02e" text-anchor="start">shopTotal ← 0</text><text x="67.2" y="584" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="16" font-weight="400" fill="#e8eef0" text-anchor="start">FOR day ← 0 TO 3</text><text x="86.4" y="612" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="16" font-weight="400" fill="#e8eef0" text-anchor="start">shopTotal ← shopTotal + sales[shop][day]</text><text x="67.2" y="640" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="16" font-weight="400" fill="#e8eef0" text-anchor="start">ENDFOR</text><text x="67.2" y="668" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="16" font-weight="400" fill="#e8eef0" text-anchor="start">OUTPUT shopTotal</text><text x="48" y="696" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="16" font-weight="400" fill="#e8eef0" text-anchor="start">ENDFOR</text><rect x="570" y="498" width="300" height="222" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="592" y="534" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">Outer loop selects a row; inner</text><text x="592" y="556" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">loop walks along it.</text><text x="592" y="602" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="start">shopTotal ← 0 inside the outer</text><text x="592" y="623" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="start">loop: each shop starts from zero.</text><text x="592" y="668" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Swap the loops (day outer) for</text><text x="592" y="689" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the column totals.</text>
