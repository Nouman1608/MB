<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 644" width="900" height="644" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="644" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Choosing a data structure</text>

<rect x="260" y="110" width="380" height="60" rx="30" fill="#1e2a44"/><text x="450" y="146" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">Data about one item, or many?</text><path d="M330,170 L230,230" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><text x="250" y="190" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">one item</text><path d="M570,170 L670,230" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><text x="660" y="190" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">many items</text><rect x="65" y="232" width="330" height="60" rx="30" fill="#1e2a44"/><text x="230" y="268" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">Several fields, mixed types?</text><rect x="505" y="232" width="330" height="60" rx="30" fill="#1e2a44"/><text x="670" y="268" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">Each item has mixed fields?</text><line x1="160" y1="292" x2="140" y2="360" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="118" y="332" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">yes</text><line x1="760" y1="292" x2="762" y2="360" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="786" y="332" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">yes</text><line x1="610" y1="292" x2="560" y2="360" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="560" y="332" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">no</text><rect x="42" y="368" width="196" height="122" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="140" y="402" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Record</text><text x="56" y="432" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">One customer’s name,</text><text x="56" y="452" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">phone, balance and VIP</text><text x="56" y="472" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">status</text><rect x="300" y="362" width="300" height="60" rx="30" fill="#1e2a44"/><text x="450" y="398" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">A list, or a grid?</text><rect x="664" y="368" width="196" height="122" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="762" y="402" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Array of records</text><text x="678" y="432" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Every customer of a</text><text x="678" y="452" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">shop</text><line x1="380" y1="422" x2="345" y2="486" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="340" y="456" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">list</text><line x1="520" y1="422" x2="555" y2="486" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="564" y="456" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">grid</text><rect x="247" y="492" width="196" height="122" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="345" y="526" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">1D array</text><text x="261" y="556" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">12 monthly rainfall</text><text x="261" y="576" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">totals (reals)</text><rect x="457" y="492" width="196" height="122" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="555" y="526" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">2D array</text><text x="471" y="556" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Chessboard 8 × 8;</text><text x="471" y="576" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">marks for 25 pupils in 6</text><text x="471" y="596" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">tests</text>
</svg>