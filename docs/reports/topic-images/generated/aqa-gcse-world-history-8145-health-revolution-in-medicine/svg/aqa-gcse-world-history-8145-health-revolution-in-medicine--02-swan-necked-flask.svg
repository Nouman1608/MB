<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 858" width="900" height="858" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="858" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Pasteur's swan-necked flask</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">How germ theory disproved spontaneous generation</text>
<g transform="translate(80,4)"><clipPath id="bulb"><circle cx="230" cy="520" r="115"/></clipPath><circle cx="230" cy="520" r="115" fill="#ffffff"/><rect x="115" y="510" width="230" height="135" fill="#dce9e7" clip-path="url(#bulb)"/><line x1="123" y1="510" x2="337" y2="510" stroke="#2e6b62" stroke-width="2.5"/><path d="M230,410 L230,330 C230,250 330,250 340,320 C348,380 420,385 440,300 L455,230" fill="none" stroke="#1e2a44" stroke-width="30" stroke-linejoin="round" stroke-linecap="round" /><path d="M230,410 L230,330 C230,250 330,250 340,320 C348,380 420,385 440,300 L455,230" fill="none" stroke="#ffffff" stroke-width="22" stroke-linejoin="round" stroke-linecap="round" /><circle cx="230" cy="520" r="115" fill="none" stroke="#1e2a44" stroke-width="4"/><rect x="218" y="401" width="24" height="14" fill="#ffffff"/><circle cx="470" cy="175" r="5" fill="#8a6d0d" stroke="#1e2a44" stroke-width="1.5"/><circle cx="500" cy="205" r="5" fill="#8a6d0d" stroke="#1e2a44" stroke-width="1.5"/><circle cx="430" cy="160" r="5" fill="#8a6d0d" stroke="#1e2a44" stroke-width="1.5"/><circle cx="520" cy="160" r="5" fill="#8a6d0d" stroke="#1e2a44" stroke-width="1.5"/><circle cx="480" cy="135" r="5" fill="#8a6d0d" stroke="#1e2a44" stroke-width="1.5"/><circle cx="378" cy="368" r="5" fill="#8a6d0d" stroke="#1e2a44" stroke-width="1.5"/><circle cx="392" cy="371" r="5" fill="#8a6d0d" stroke="#1e2a44" stroke-width="1.5"/><circle cx="405" cy="367" r="5" fill="#8a6d0d" stroke="#1e2a44" stroke-width="1.5"/><text x="230" y="570" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">broth stays sterile</text><text x="540" y="150" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">microbes in the air</text><path d="M420,410 L398,382" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><text x="390" y="432" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">microbes caught</text><text x="390" y="453" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">in the curved neck</text><line x1="520" y1="240" x2="470" y2="290" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)" stroke-dasharray="7 6"/></g><rect x="30" y="668" width="397" height="158" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="711" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">OLD IDEA</text><text x="50" y="738.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Spontaneous generation</text><text x="50" y="768.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Decay produces microbes. (Miasma:</text><text x="50" y="790.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">disease spreads through bad air.)</text><line x1="433" y1="747" x2="467" y2="747" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="473" y="668" width="397" height="158" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="493" y="700" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PASTEUR, 1861</text><text x="493" y="727.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Germ theory</text><text x="493" y="757.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Microbes in the air cause decay. Liquids</text><text x="493" y="779.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">stay sterile when microbes cannot reach</text><text x="493" y="801.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">them.</text>
</svg>