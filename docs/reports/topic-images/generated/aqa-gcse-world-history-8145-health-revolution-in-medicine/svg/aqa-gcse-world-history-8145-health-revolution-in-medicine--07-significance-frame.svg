<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 499" width="900" height="499" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="499" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Explaining significance</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Question 2: the significance of Lister's work for surgery</text>
<rect x="30" y="124" width="395" height="261" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">AT THE TIME</text><text x="50" y="183.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Tackled infection</text><text x="50" y="213.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="213.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Used Pasteur's germ theory; carbolic acid</text><text x="66.15" y="235.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">from 1865</text><text x="50" y="262.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="262.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Published 1867: far fewer patients died</text><text x="50" y="289.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="289.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Began to end the "black period"</text><text x="50" y="316.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="316.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">But: limited at first, as many surgeons</text><text x="66.15" y="338.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">disliked the spray and doubted germ</text><text x="66.15" y="360.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">theory</text><line x1="431" y1="254.5" x2="469" y2="254.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="475" y="124" width="395" height="261" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="495" y="156" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">OVER TIME</text><text x="495" y="183.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Changed surgeons' thinking</text><text x="495" y="213.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="511.15" y="213.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Once germs were accepted as the cause</text><text x="511.15" y="235.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">of infection, surgeons moved to aseptic</text><text x="511.15" y="257.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">methods</text><text x="495" y="284.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="511.15" y="284.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Sterilised instruments, gowns and gloves</text><text x="495" y="311.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="511.15" y="311.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">With anaesthetics, made safe internal</text><text x="511.15" y="333.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">surgery possible</text><rect x="30" y="407" width="840" height="60" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="441.4" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">Significance means judging impact <tspan font-weight="700" fill="#1e2a44">at</tspan> <tspan font-weight="700" fill="#1e2a44">the</tspan> <tspan font-weight="700" fill="#1e2a44">time</tspan> and <tspan font-weight="700" fill="#1e2a44">over</tspan> <tspan font-weight="700" fill="#1e2a44">time</tspan>.</text>
</svg>