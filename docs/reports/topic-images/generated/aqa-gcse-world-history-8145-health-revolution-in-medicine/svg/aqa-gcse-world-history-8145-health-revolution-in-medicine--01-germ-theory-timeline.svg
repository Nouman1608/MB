<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 766" width="900" height="766" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="766" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The microbe hunters, 1861-1909</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">France and Germany competed after the war of 1870-71</text>
<line x1="150" y1="132" x2="150" y2="680" stroke="#1e2a44" stroke-width="4"/><rect x="190" y="124" width="680" height="90" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="203" y="151.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Pasteur publishes germ theory</text><text x="203" y="175.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Microbes in the air cause decay; swan-necked flasks disprove spontaneous</text><text x="203" y="196.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">generation.</text><circle cx="150" cy="169" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="130" y="175" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1861</text><rect x="190" y="224" width="680" height="69" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="203" y="251.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Koch identifies the anthrax bacterium</text><text x="203" y="275.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Specific microbes cause specific diseases.</text><circle cx="150" cy="258.5" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="130" y="264.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1876</text><rect x="190" y="303" width="680" height="69" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="203" y="330.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Chamberland's forgotten culture</text><text x="203" y="354.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Weakened chicken cholera germs protect chickens.</text><circle cx="150" cy="337.5" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="130" y="343.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1879</text><rect x="190" y="382" width="680" height="69" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="203" y="409.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Pasteur's anthrax vaccine demonstrated</text><text x="203" y="433.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Named a vaccine in honour of Edward Jenner.</text><circle cx="150" cy="416.5" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="130" y="422.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1881</text><rect x="190" y="461" width="680" height="69" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="203" y="488.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Koch: tuberculosis, then cholera</text><text x="203" y="512.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Staining with dyes and growing bacteria on solid nutrients.</text><circle cx="150" cy="495.5" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="130" y="501.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1882 · 1883</text><rect x="190" y="540" width="680" height="69" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="203" y="567.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Rabies vaccine</text><text x="203" y="591.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">First used on a boy, Joseph Meister.</text><circle cx="150" cy="574.5" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="130" y="580.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1885</text><rect x="190" y="619" width="680" height="69" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="203" y="646.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Ehrlich's team: Salvarsan (compound 606)</text><text x="203" y="670.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Cures syphilis: the first chemical cure, a "magic bullet".</text><circle cx="150" cy="653.5" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="130" y="659.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1909</text><rect x="30" y="704" width="211.936" height="30" rx="15" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="135.96800000000002" y="724.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Pasteur's team (France)</text><rect x="253.936" y="704" width="209.568" height="30" rx="15" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="358.72" y="724.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Koch's team (Germany)</text><rect x="475.504" y="704" width="298.528" height="30" rx="15" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><text x="624.768" y="724.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Ehrlich, who had worked with Koch</text>
</svg>