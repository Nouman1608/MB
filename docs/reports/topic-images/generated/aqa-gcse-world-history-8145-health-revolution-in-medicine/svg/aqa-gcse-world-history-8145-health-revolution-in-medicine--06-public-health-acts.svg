<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="500" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Public Health Acts: 1848 and 1875</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">From permissive to compulsory</text>
<clipPath id="tc124"><rect x="30" y="124" width="840" height="344" rx="14"/></clipPath><g clip-path="url(#tc124)"><rect x="30" y="124" width="158.2608695652174" height="51" fill="#b5d3cf"/><rect x="188.2608695652174" y="124" width="340.8695652173913" height="51" fill="#f2e7b8"/><text x="202.2608695652174" y="153.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">1848 Act</text><rect x="529.1304347826087" y="124" width="340.8695652173913" height="51" fill="#b5d3cf"/><text x="543.1304347826087" y="153.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">1875 Act</text><rect x="30" y="175" width="158.2608695652174" height="47" fill="#dce9e7"/><text x="44" y="201.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Nature</text><rect x="188.2608695652174" y="175" width="340.8695652173913" height="47" fill="#ffffff"/><text x="202.2608695652174" y="201.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Permissive:</tspan> towns <tspan font-style="italic">could</tspan> act</text><rect x="529.1304347826087" y="175" width="340.8695652173913" height="47" fill="#ffffff"/><text x="543.1304347826087" y="201.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Compulsory:</tspan> councils <tspan font-style="italic">had</tspan> to act</text><line x1="30" y1="222" x2="870" y2="222" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="222" width="158.2608695652174" height="110" fill="#dce9e7"/><text x="44" y="248.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Main terms</text><rect x="188.2608695652174" y="222" width="340.8695652173913" height="110" fill="#f8faf9"/><text x="202.2608695652174" y="248.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">General Board of Health; towns could set</text><text x="202.2608695652174" y="269.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">up local boards of health; compulsory</text><text x="202.2608695652174" y="290.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">only where the death rate exceeded 23</text><text x="202.2608695652174" y="311.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">per 1,000</text><rect x="529.1304347826087" y="222" width="340.8695652173913" height="110" fill="#f8faf9"/><text x="543.1304347826087" y="248.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Councils had to provide clean water,</text><text x="543.1304347826087" y="269.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">drainage and sewage disposal, and</text><text x="543.1304347826087" y="290.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">appoint a Medical Officer of Health</text><line x1="30" y1="332" x2="870" y2="332" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="332" width="158.2608695652174" height="68" fill="#dce9e7"/><text x="44" y="358.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Context</text><rect x="188.2608695652174" y="332" width="340.8695652173913" height="68" fill="#ffffff"/><text x="202.2608695652174" y="358.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Cholera of 1848; Chadwick's report</text><text x="202.2608695652174" y="379.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(1842); belief in <tspan font-style="italic">laissez-faire</tspan></text><rect x="529.1304347826087" y="332" width="340.8695652173913" height="68" fill="#ffffff"/><text x="543.1304347826087" y="358.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Snow's findings, germ theory, the Great</text><text x="543.1304347826087" y="379.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Stink (1858), and the 1867 Reform Act</text><line x1="30" y1="400" x2="870" y2="400" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="400" width="158.2608695652174" height="68" fill="#dce9e7"/><text x="44" y="426.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Limits</text><rect x="188.2608695652174" y="400" width="340.8695652173913" height="68" fill="#f8faf9"/><text x="202.2608695652174" y="426.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Many towns did nothing; the General</text><text x="202.2608695652174" y="447.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Board was abolished in 1854</text><rect x="529.1304347826087" y="400" width="340.8695652173913" height="68" fill="#f8faf9"/><text x="543.1304347826087" y="426.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Enforcement varied, but it set national</text><text x="543.1304347826087" y="447.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">standards</text></g><line x1="188.2608695652174" y1="124" x2="188.2608695652174" y2="468" stroke="#c9d6d4" stroke-width="1.5"/><line x1="529.1304347826087" y1="124" x2="529.1304347826087" y2="468" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="124" width="840" height="344" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/>
</svg>