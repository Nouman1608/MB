68" text-anchor="start">Soho.</text><circle cx="550" cy="172" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="550" y="180.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="594" y="230" width="276" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="608" y="258.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Spot the cluster</text><text x="608" y="286.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Deaths clustered round the</text><text x="608" y="307.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Broad Street pump.</text><circle cx="550" cy="278" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="550" y="286.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="594" y="336" width="276" height="75" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="608" y="364.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Remove the handle</text><text x="608" y="392.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Cases fell.</text><circle cx="550" cy="373.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="550" y="382.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="594" y="421" width="276" height="117" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="608" y="449.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Conclusion</text><text x="608" y="477.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Cholera spread through water,</text><text x="608" y="498.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">not air. He could not identify the</text><text x="608" y="519.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">germ.</text><circle cx="550" cy="479.5" 