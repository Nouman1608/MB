<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 642" width="900" height="642" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="642" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">From the "black period" to aseptic surgery</text>

<rect x="30" y="100" width="180" height="166" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="45" y="138.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">1840s-50s</text><text x="45" y="164.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Anaesthetics</text><text x="45" y="193.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Longer, more</text><text x="45" y="214.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">complex operations</text><text x="45" y="235.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">possible.</text><line x1="216" y1="183" x2="244" y2="183" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="250" y="100" width="180" height="166" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="265" y="138.5" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">BLACK PERIOD</text><text x="265" y="164.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">More infection</text><text x="265" y="193.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Infection not yet</text><text x="265" y="214.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">understood, so</text><text x="265" y="235.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">more patients died.</text><line x1="436" y1="183" x2="464" y2="183" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="470" y="100" width="180" height="166" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="485" y="127" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">1865-67</text><text x="485" y="153.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Lister's</text><text x="485" y="176.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">antiseptics</text><text x="485" y="204.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Deaths among his</text><text x="485" y="225.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">amputation patients</text><text x="485" y="246.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">fell sharply.</text><line x1="656" y1="183" x2="684" y2="183" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="690" y="100" width="180" height="166" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="705" y="149" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FROM 1880s</text><text x="705" y="175.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Aseptic surgery</text><text x="705" y="203.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Safe surgery inside</text><text x="705" y="224.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the body.</text><rect x="30" y="288" width="411" height="189" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="320" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">ANTISEPTIC</text><text x="50" y="346.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Kill germs during the operation</text><text x="50" y="376.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="376.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Carbolic acid on bandages</text><text x="50" y="403.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="403.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Carbolic spray in the theatre</text><rect x="459" y="288" width="411" height="189" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="479" y="320" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ASEPTIC</text><text x="479" y="346.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Keep germs out altogether</text><text x="479" y="376.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="495.15" y="376.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Instruments sterilised with steam</text><text x="479" y="403.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="495.15" y="403.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Theatres scrubbed</text><text x="479" y="430.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="495.15" y="430.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Gowns and masks; rubber gloves from the</text><text x="495.15" y="452.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">1890s</text><rect x="30" y="499" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="533.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">1902</text><text x="50" y="563.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Edward VII's coronation was postponed for an operation on his appendix abscess: a sign of how</text><text x="50" y="585.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">routine such surgery had become.</text>
</svg>