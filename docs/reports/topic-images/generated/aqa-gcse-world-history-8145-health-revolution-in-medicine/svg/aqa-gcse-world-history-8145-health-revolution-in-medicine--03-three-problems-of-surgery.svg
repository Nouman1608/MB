<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 556" width="900" height="556" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="556" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three problems facing surgeons</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">And how the nineteenth century tackled them</text>
<clipPath id="tc124"><rect x="30" y="124" width="840" height="400" rx="14"/></clipPath><g clip-path="url(#tc124)"><rect x="30" y="124" width="158.9189189189189" height="49" fill="#b5d3cf"/><text x="44" y="152.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Problem</text><rect x="188.9189189189189" y="124" width="408.64864864864865" height="49" fill="#b5d3cf"/><text x="202.9189189189189" y="152.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Solution and key individual</text><rect x="597.5675675675675" y="124" width="272.4324324324324" height="49" fill="#f2e7b8"/><text x="611.5675675675675" y="152.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Difficulties</text><rect x="30" y="173" width="158.9189189189189" height="131" fill="#dce9e7"/><text x="44" y="199.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Pain</text><rect x="188.9189189189189" y="173" width="408.64864864864865" height="131" fill="#ffffff"/><text x="202.9189189189189" y="199.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Anaesthetics.</tspan> Liston used ether in London</text><text x="202.9189189189189" y="220.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(1846); <tspan font-weight="700">Simpson</tspan> found chloroform's effects by</text><text x="202.9189189189189" y="241.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">testing it on himself and friends (1847).</text><rect x="597.5675675675675" y="173" width="272.4324324324324" height="131" fill="#ffffff"/><text x="611.5675675675675" y="199.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Dosage hard to judge: Hannah</text><text x="611.5675675675675" y="220.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Greener died (1848). Some said</text><text x="611.5675675675675" y="241.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">pain was God-given.</text><text x="611.5675675675675" y="262.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Acceptance grew after Queen</text><text x="611.5675675675675" y="283.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Victoria used it (1853).</text><line x1="30" y1="304" x2="870" y2="304" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="304" width="158.9189189189189" height="110" fill="#dce9e7"/><text x="44" y="330.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Infection</text><rect x="188.9189189189189" y="304" width="408.64864864864865" height="110" fill="#f8faf9"/><text x="202.9189189189189" y="330.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Antiseptics.</tspan> <tspan font-weight="700">Lister</tspan> used carbolic acid on a</text><text x="202.9189189189189" y="351.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">compound fracture (1865) and a spray in theatre;</text><text x="202.9189189189189" y="372.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">published 1867. <tspan font-weight="700">Aseptic</tspan> methods from the 1880s.</text><rect x="597.5675675675675" y="304" width="272.4324324324324" height="110" fill="#f8faf9"/><text x="611.5675675675675" y="330.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The spray was unpleasant,</text><text x="611.5675675675675" y="351.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">irritated hands and slowed</text><text x="611.5675675675675" y="372.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">operations; many still doubted</text><text x="611.5675675675675" y="393.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">germ theory.</text><line x1="30" y1="414" x2="870" y2="414" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="414" width="158.9189189189189" height="110" fill="#dce9e7"/><text x="44" y="440.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Blood loss</text><rect x="188.9189189189189" y="414" width="408.64864864864865" height="110" fill="#f6f3ea"/><text x="202.9189189189189" y="440.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Not solved in this period.</text><rect x="597.5675675675675" y="414" width="272.4324324324324" height="110" fill="#f6f3ea"/><text x="611.5675675675675" y="440.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Remained a problem until blood</text><text x="611.5675675675675" y="461.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">groups and storage were</text><text x="611.5675675675675" y="482.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">developed in the twentieth</text><text x="611.5675675675675" y="503.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">century.</text></g><line x1="188.9189189189189" y1="124" x2="188.9189189189189" y2="524" stroke="#c9d6d4" stroke-width="1.5"/><line x1="597.5675675675675" y1="124" x2="597.5675675675675" y2="524" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="124" width="840" height="400" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/>
</svg>