<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How a Paper 1 Section B question is built</text>

<rect x="30" y="120" width="170" height="96" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="115" y="174" font-size="40" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="115" y="200" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">marks</text><rect x="220" y="120" width="650" height="96" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="238" y="154.7" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Knowledge</text><text x="238" y="186.3" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">One short paragraph of accurate facts: dates, names, events.</text><rect x="30" y="232" width="170" height="96" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="115" y="286" font-size="40" font-weight="700" fill="#1e2a44" text-anchor="middle">7</text><text x="115" y="312" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">marks</text><rect x="220" y="232" width="650" height="96" rx="12" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2.5"/><text x="238" y="266.7" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Explanation</text><text x="238" y="298.3" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">At least two developed paragraphs explaining why.</text><rect x="30" y="344" width="170" height="114" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="115" y="407" font-size="40" font-weight="700" fill="#1e2a44" text-anchor="middle">14</text><text x="115" y="433" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">marks</text><rect x="220" y="344" width="650" height="114" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="238" y="378.7" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Evaluation</text><text x="238" y="410.3" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">An essay of about two pages ending in a balanced judgement: how far,</text><text x="238" y="434.3" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">how successful.</text><rect x="30" y="480" width="840" height="84" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="48" y="512.15" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Section A</text><text x="48" y="541.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">A compulsory source-based question.</text>
