<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1126" width="900" height="1126" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="1126" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">KQ6: Muslim politics, 1905–1927</text>

<line x1="100" y1="130" x2="100" y2="991" stroke="#1e2a44" stroke-width="4"/><rect x="192" y="120" width="678" height="82" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="210" y="151.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Partition of Bengal</text><text x="210" y="179.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Curzon creates Muslim-majority East Bengal and Assam; Muslims welcome it.</text><rect x="192" y="212" width="678" height="82" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="210" y="243.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Simla Deputation</text><text x="210" y="271.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Led by the Aga Khan; asks Viceroy Minto for separate electorates and weightage.</text><rect x="192" y="304" width="678" height="103" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="210" y="335.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">All-India Muslim League founded at Dhaka</text><text x="210" y="363.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">To protect Muslim political rights, promote loyalty to the British and avoid hostility to</text><text x="210" y="384.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">other communities.</text><rect x="192" y="417" width="678" height="82" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="210" y="448.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Morley–Minto Reforms</text><text x="210" y="476.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Separate electorates granted: a major early success.</text><rect x="192" y="509" width="678" height="82" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="210" y="540.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Partition of Bengal reversed</text><text x="210" y="568.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">After Hindu-led agitation. Many Muslims conclude they need their own political voice.</text><rect x="192" y="601" width="678" height="82" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="210" y="632.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Lucknow Pact</text><text x="210" y="660.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Congress accepts separate electorates and one-third of central seats for Muslims.</text><rect x="192" y="693" width="678" height="103" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="210" y="724.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Rowlatt Act, Amritsar, Montagu–Chelmsford</text><text x="210" y="752.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Detention without trial; troops fire at Jallianwala Bagh; dyarchy disappoints both</text><text x="210" y="773.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">parties.</text><rect x="192" y="806" width="678" height="82" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="210" y="837.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Divisions widen</text><text x="210" y="865.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Communal riots, shuddhi and sangathan, splits in Congress.</text><rect x="192" y="898" width="678" height="103" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="210" y="929.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Delhi Proposals</text><text x="210" y="957.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Muslims offer to accept joint electorates in return for one-third of central seats and</text><text x="210" y="978.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">other demands.</text><rect x="30" y="134" width="140" height="40" rx="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="100" y="161" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">1905</text><line x1="170" y1="154" x2="192" y2="154" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="226" width="140" height="40" rx="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="100" y="253" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Oct 1906</text><line x1="170" y1="246" x2="192" y2="246" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="318" width="140" height="40" rx="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="100" y="345" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Dec 1906</text><line x1="170" y1="338" x2="192" y2="338" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="431" width="140" height="40" rx="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="100" y="458" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">1909</text><line x1="170" y1="451" x2="192" y2="451" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="523" width="140" height="40" rx="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="100" y="550" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">1911</text><line x1="170" y1="543" x2="192" y2="543" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="615" width="140" height="40" rx="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="100" y="642" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">1916</text><line x1="170" y1="635" x2="192" y2="635" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="707" width="140" height="40" rx="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="100" y="734" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">1919</text><line x1="170" y1="727" x2="192" y2="727" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="820" width="140" height="40" rx="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="100" y="847" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">mid-1920s</text><line x1="170" y1="840" x2="192" y2="840" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="912" width="140" height="40" rx="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="100" y="939" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">1927</text><line x1="170" y1="932" x2="192" y2="932" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="1021" width="840" height="75" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="1051.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Judgement: by 1927 the League had won separate electorates but was still small and divided, so the</text><text x="48" y="1073.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">movement had developed only partly.</text>
</svg>