<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 633" width="900" height="633" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="633" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">KQ10: three contributions compared</text>

<rect x="30" y="112" width="270" height="307" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="146.7" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Jinnah</text><text x="48" y="171.75" font-size="15" font-weight="600" fill="#4a5568" text-anchor="start">Leader and negotiator</text><text x="48" y="198.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="198.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Began as an “ambassador of</text><text x="64" y="219.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Hindu–Muslim unity” in</text><text x="64" y="240.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Congress and the Lucknow</text><text x="64" y="261.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Pact</text><text x="48" y="285.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="285.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Led the League from the</text><text x="64" y="306.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">1930s</text><text x="48" y="330.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="330.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Negotiated with the British</text><text x="64" y="351.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and Congress</text><text x="48" y="375.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="375.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Turned the 1940 Resolution</text><text x="64" y="396.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">into a state</text><rect x="315" y="112" width="270" height="307" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="333" y="146.7" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Allama Iqbal</text><text x="333" y="171.75" font-size="15" font-weight="600" fill="#4a5568" text-anchor="start">Thinker</text><text x="333" y="198.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="349" y="198.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Gave Muslim nationhood its</text><text x="349" y="219.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">philosophical basis</text><text x="333" y="243.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="349" y="243.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">1930 Allahabad address: a</text><text x="349" y="264.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">North-Western Indian</text><text x="349" y="285.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Muslim state</text><text x="333" y="309.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="349" y="309.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Encouraged Jinnah to lead</text><text x="349" y="330.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the League</text><rect x="600" y="112" width="270" height="307" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="618" y="146.7" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Rahmat Ali</text><text x="618" y="171.75" font-size="15" font-weight="600" fill="#4a5568" text-anchor="start">Name-giver</text><text x="618" y="198.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="634" y="198.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">1933 pamphlet Now or</text><text x="634" y="219.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Never proposed the name</text><text x="634" y="240.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“Pakstan”</text><text x="618" y="264.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="634" y="264.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Campaigned from Britain</text><text x="618" y="288.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="634" y="288.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Demanded complete</text><text x="634" y="309.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">separation</text><rect x="30" y="433" width="270" height="73" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="48" y="462.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Most historians see his</text><text x="48" y="483.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">leadership as decisive.</text><rect x="315" y="433" width="270" height="73" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="333" y="462.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Died in 1938, before the 1940</text><text x="333" y="483.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Resolution.</text><rect x="600" y="433" width="270" height="73" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="618" y="462.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Had little influence on League</text><text x="618" y="483.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">policy.</text><rect x="30" y="528" width="840" height="75" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="558.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Iqbal vs Rahmat Ali: Iqbal wanted a Muslim state within a framework of the subcontinent; Rahmat Ali</text><text x="48" y="580.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">demanded complete separation.</text>
</svg>