<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 544" width="900" height="544" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="544" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">From the Simon Commission to the 14 Points</text>

<rect x="30" y="112" width="250" height="127" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="145" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Simon Commission</text><text x="48" y="168.75" font-size="15" font-weight="600" fill="#8a6d0d" text-anchor="start">1927</text><text x="48" y="195.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">All-British; boycotted by</text><text x="48" y="216.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">most Indian leaders</text><line x1="286" y1="175.5" x2="317" y2="175.5" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="325" y="112" width="250" height="127" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="343" y="145" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Nehru Report</text><text x="343" y="168.75" font-size="15" font-weight="600" fill="#8a6d0d" text-anchor="start">1928</text><text x="343" y="195.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Rejected key Muslim</text><text x="343" y="216.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">safeguards</text><line x1="581" y1="175.5" x2="612" y2="175.5" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="620" y="112" width="250" height="127" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="638" y="145" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Jinnah’s 14 Points</text><text x="638" y="168.75" font-size="15" font-weight="600" fill="#8a6d0d" text-anchor="start">1929</text><text x="638" y="195.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The League’s reply</text><rect x="30" y="269" width="840" height="150" rx="12" fill="#ffffff"/><path d="M30,313 L30,281 Q30,269 42,269 L858,269 Q870,269 870,281 L870,313 Z" fill="#b5d3cf"/><rect x="30" y="313" width="840" height="42" fill="#ffffff"/><text x="42" y="339.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Separate electorates</text><text x="282" y="339.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Rejected</text><text x="582" y="339.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Demanded</text><line x1="30" y1="313" x2="870" y2="313" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="355" width="840" height="64" fill="#dce9e7"/><text x="42" y="381.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Muslim share of central</text><text x="42" y="403.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">seats</text><text x="282" y="381.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">One-third rejected</text><text x="582" y="381.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">One-third demanded</text><line x1="30" y1="355" x2="870" y2="355" stroke="#c9d6d4" stroke-width="1.5"/><line x1="270" y1="269" x2="270" y2="419" stroke="#c9d6d4" stroke-width="1.5"/><line x1="570" y1="269" x2="570" y2="419" stroke="#c9d6d4" stroke-width="1.5"/><text x="42" y="298.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Issue</text><text x="282" y="298.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Nehru Report (1928)</text><text x="582" y="298.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">14 Points (1929)</text><rect x="30" y="269" width="840" height="150" rx="12" fill="none" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="439" width="840" height="75" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="469.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The 14 Points also asked for a federal constitution and provincial autonomy. Many Muslims,</text><text x="48" y="491.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">including Jinnah, saw the Nehru Report as evidence that Congress would not protect them.</text>
</svg>