<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 669" width="900" height="669" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="669" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Congress rule, 1937–39: from defeat to a demand</text>

<rect x="30" y="112" width="840" height="85" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="145" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">1937 elections</text><text x="48" y="174.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Congress wins most provinces; the League does poorly, even in Muslim-majority areas.</text><line x1="450" y1="201" x2="450" y2="227" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="30" y="233" width="840" height="164" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="267" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Congress rule, 1937–39: what alienated Muslims</text><rect x="48" y="285" width="252" height="94" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="66" y="314.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Singing of Bande Mataram</text><rect x="322" y="285" width="252" height="94" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="340" y="314.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Wardha and Vidya Mandir</text><text x="340" y="335.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">education schemes</text><rect x="596" y="285" width="252" height="94" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="614" y="314.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Refusal to share power with</text><text x="614" y="335.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the League in the United</text><text x="614" y="356.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Provinces</text><line x1="450" y1="401" x2="450" y2="427" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="30" y="433" width="840" height="85" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="466" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">1939: Congress ministries resign</text><text x="48" y="495.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Jinnah calls for a Day of Deliverance on 22 December 1939.</text><line x1="450" y1="522" x2="450" y2="548" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="30" y="554" width="840" height="85" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="587" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Result</text><text x="48" y="616.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Many Muslims are convinced they need a separate homeland.</text>
</svg>