<rect width="900" height="1010" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">KQ9: from resolution to independence, 1940–47</text>

<line x1="105" y1="130" x2="105" y2="970" stroke="#1e2a44" stroke-width="4"/><rect x="202" y="120" width="668" height="82" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="220" y="151.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Lahore (Pakistan) Resolution</text><text x="220" y="179.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Demands independent states in the Muslim-majority north-west and east.</text><rect x="202" y="212" width="668" height="82" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="220" y="243.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Cripps Mission rejected; Quit India (Aug)</text><text x="220" y="271.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Congress leaders imprisoned while the League strengthens.</text><rect x="202" y="304" width="668" height="82" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="220" y="335.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Gandhi–Jinnah talks fail</text><text x="220" y="363.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Gandhi saw India as one nation.</text><rect x="202" y="396" width="668" height="82" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="220" y="427.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Simla Conference collapses</text><text x="220" y="455.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Congress rejects the League’s claim to nominate all Muslim members.</text><rect x="202" y="488" width="668" height="103" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="220" y="519.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Elections</text><text x="220" y="547.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">League wins every Muslim seat in the central assembly and most Muslim provincial</text><text x="220" y="568.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">seats.</text><rect x="202" y="601" width="668" height="82" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="220" y="632.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Cabinet Mission Plan</text><text x="220" y="660.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">League accepts the loose federation, then withdraws after Nehru’s statements.</text><rect x="202" y="693" width="668" height="82" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="220" y="724.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Direct Action Day</text><text x="220" y="752.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Followed by severe rioting in Calcutta.</text><rect x="202" y="785" width="668" height="82" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="220" y="816.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">3 June Plan</text><text x="220" y="844.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Mountbatten’s plan provides for partition.</text><rect x="202" y="877" width="668" height="103" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="220" y="908.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Indian Independence Act</text><text x="220" y="936.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Two dominions created on 14–15 August; the Radcliffe Award is announced after</text><text x="220" y="957.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">independence.</text><rect x="30" y="134" width="150" height="40" rx="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="105" y="161" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">23 Mar 1940</text><line x1="180" y1="154" x2="202" y2="154" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="226" width="150" height="40" rx="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="105" y="253" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">1942</text><line x1="180" y1="246" x2="202" y2="246" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="318" width="150" height="40" rx="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="105" y="345" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">1944</text><line x1="180" y1="338" x2="202" y2="338" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="410" width="150" height="40" rx="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="105" y="437" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">1945</text><line x1="180" y1="430" x2="202" y2="430" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="502" width="150" height="40" rx="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="105" y="529" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">1945–46</text><line x1="180" y1="522" x2="202" y2="522" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="615" width="150" height="40" rx="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="105" y="642" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">1946</text><line x1="180" y1="635" x2="202" y2="635" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="707" width="150" height="40" rx="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="105" y="734" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">16 Aug 1946</text><line x1="180" y1="727" x2="202" y2="727" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="799" width="150" height="40" rx="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="105" y="826" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">3 Jun 1947</text><line x1="180" y1="819" x2="202" y2="819" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="891" width="150" height="40" rx="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="105" y="918" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Jul 1947</text><line x1="180" y1="911" x2="202" y2="911" stroke="#1e2a44" stroke-width="2.5"/>
</svg>