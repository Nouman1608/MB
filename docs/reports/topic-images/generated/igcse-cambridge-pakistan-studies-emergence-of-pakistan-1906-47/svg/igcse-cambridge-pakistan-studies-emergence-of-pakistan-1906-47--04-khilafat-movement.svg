<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 779" width="900" height="779" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="779" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The Khilafat Movement: aim, failure, impact</text>

<rect x="30" y="112" width="840" height="107" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="145" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Aim</text><text x="48" y="174.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Stop the Allies breaking up the Ottoman Empire and removing the Sultan as caliph, guardian of the</text><text x="48" y="196.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">holy places. Led by the Ali brothers, Muhammad Ali Jauhar and Shaukat Ali.</text><line x1="450" y1="223" x2="450" y2="257" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="30" y="263" width="266" height="146" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="295.15" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">1920</text><text x="48" y="323.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Delegations to Britain fail to</text><text x="48" y="344.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">change policy</text><rect x="317" y="263" width="266" height="146" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="335" y="295.15" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">1920</text><text x="335" y="323.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Hijrat: many migrate to</text><text x="335" y="344.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Afghanistan; the border is</text><text x="335" y="365.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">closed and many return</text><text x="335" y="386.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">impoverished</text><rect x="604" y="263" width="266" height="146" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="622" y="295.15" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Non-Cooperation</text><text x="622" y="323.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Gandhi links it to the Khilafat</text><text x="622" y="344.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">cause: a brief high point of</text><text x="622" y="365.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Hindu–Muslim unity</text><text x="30" y="249" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">WHAT HAPPENED</text><text x="30" y="449" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">WHY IT FAILED</text><line x1="450" y1="415" x2="450" y2="457" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="30" y="463" width="266" height="125" rx="12" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="48" y="495.15" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">1921</text><text x="48" y="523.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Moplah uprising damages</text><text x="48" y="544.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Hindu–Muslim trust</text><rect x="317" y="463" width="266" height="125" rx="12" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="335" y="495.15" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">1922</text><text x="335" y="523.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Gandhi calls off</text><text x="335" y="544.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Non-Cooperation after Chauri</text><text x="335" y="565.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Chaura</text><rect x="604" y="463" width="266" height="125" rx="12" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="622" y="495.15" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">1924</text><text x="622" y="523.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The Turks, under Mustafa</text><text x="622" y="544.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Kemal, abolish the caliphate</text><line x1="450" y1="594" x2="450" y2="636" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><text x="30" y="628" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="start">IMPACT ON MUSLIMS</text><rect x="30" y="642" width="410" height="107" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="675" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Loss</text><text x="48" y="704.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Muslims lost faith in Congress leadership.</text><rect x="460" y="642" width="410" height="107" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="478" y="675" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Gain</text><text x="478" y="704.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Ordinary Muslims were mobilised politically</text><text x="478" y="726.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">and a generation of leaders was trained.</text>
</svg>