<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 586" width="900" height="586" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="586" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Endings that come from the story</text>

<text x="240" y="130" font-size="19" font-weight="700" fill="#b5602e" text-anchor="middle">Avoid: endings from outside the story</text><rect x="30" y="150" width="420" height="102" rx="12" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="56" y="188" font-size="22" font-weight="700" fill="#b5602e" text-anchor="start">✗</text><text x="86" y="188" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">“It was all a dream”</text><text x="86" y="218" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">cancels everything before it</text><rect x="30" y="266" width="420" height="102" rx="12" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="56" y="304" font-size="22" font-weight="700" fill="#b5602e" text-anchor="start">✗</text><text x="86" y="304" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">Sudden rescue</text><text x="86" y="334" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">by a character or event never</text><text x="86" y="355" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">mentioned before</text><rect x="30" y="382" width="420" height="102" rx="12" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="56" y="420" font-size="22" font-weight="700" fill="#b5602e" text-anchor="start">✗</text><text x="86" y="420" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">A moral stated outright</text><text x="86" y="450" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“I learned never to lie again”</text><text x="665" y="130" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">Better: show what has changed</text><rect x="470" y="150" width="400" height="102" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><rect x="494" y="166" width="44" height="66" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><path d="M494,166 L520,176 L520,240 L494,232 Z" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><text x="580" y="196" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">A closed door now open</text><rect x="470" y="266" width="400" height="102" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><path d="M494,294 h58 v40 h-58 z M494,294 l29,22 l29,-22" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M540,348 l18,-12" fill="none" stroke="#2e6b62" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahT)"/><text x="580" y="312" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">A message finally sent</text><rect x="470" y="382" width="400" height="102" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><path d="M494,432 q29,-30 58,0 q-29,30 -58,0 z" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="523" cy="432" r="10" fill="#2e6b62"/><text x="580" y="416" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">The narrator noticing</text><text x="580" y="438" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">something they ignored at</text><text x="580" y="460" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">the start</text><rect x="30" y="506" width="840" height="56" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="541" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">The ending should come from the story, not from outside it.</text>
</svg>