<rect width="900" height="742" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Shrink the story to fit</text>

<rect x="30" y="110" width="840" height="118" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="55" y="146" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">In 350–450 words, the most successful stories have:</text><rect x="55" y="166" width="185" height="42" rx="21" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="147.5" y="192.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">one main character</text><rect x="260" y="166" width="170" height="42" rx="21" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="345" y="192.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">one setting or two</text><rect x="450" y="166" width="190" height="42" rx="21" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="545" y="192.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">a short span of time</text><rect x="660" y="166" width="185" height="42" rx="21" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="752.5" y="192.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">one central problem</text><text x="260" y="270" font-size="21" font-weight="700" fill="#b5602e" text-anchor="middle">Too big</text><text x="680" y="270" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="middle">Right size</text><rect x="30" y="290" width="420" height="70" rx="12" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="240" y="332" font-size="18" font-weight="600" fill="#b5602e" text-anchor="middle">a whole holiday</text><path d="M455,296 L505,312 L505,338 L455,354 Z" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="510" y="298" width="360" height="54" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="690" y="331" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="middle">the hour the ferry was delayed</text><rect x="30" y="374" width="420" height="70" rx="12" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="240" y="416" font-size="18" font-weight="600" fill="#b5602e" text-anchor="middle">a war</text><path d="M455,380 L505,396 L505,422 L455,438 Z" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="510" y="382" width="360" height="54" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="690" y="415" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="middle">one evening when a letter arrived</text><rect x="30" y="458" width="420" height="70" rx="12" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="240" y="500" font-size="18" font-weight="600" fill="#b5602e" text-anchor="middle">a life story</text><path d="M455,464 L505,480 L505,506 L455,522 Z" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="510" y="466" width="360" height="54" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="690" y="499" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="middle">the day a grandmother taught you to bake</text><rect x="30" y="542" width="420" height="70" rx="12" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="240" y="584" font-size="18" font-weight="600" fill="#b5602e" text-anchor="middle">a heist with six characters</text><path d="M455,548 L505,564 L505,590 L455,606 Z" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="510" y="550" width="360" height="54" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="690" y="583" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="middle">two friends and one locked door</text><rect x="30" y="638" width="840" height="80" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="450" y="670" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Years, many characters or several dramatic events become summaries,</text><text x="450" y="696" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">and summaries cannot show feeling.</text>
</svg>