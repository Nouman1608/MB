<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 665" width="900" height="665" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="665" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How the model opening works</text>

<rect x="30" y="110" width="440" height="128" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="52" y="142" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“The phone rang at 2.14 … and I did not move.</text><text x="52" y="165" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">Nobody calls at 2.14 with good news.”</text><line x1="474" y1="174" x2="506" y2="174" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="510" y="110" width="360" height="128" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="530" y="142" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">In the middle of the situation:</text><text x="530" y="164" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">tension from the first line. The</text><text x="530" y="186" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">precise time and the narrator’s</text><text x="530" y="208" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">stillness slow the moment down.</text><rect x="30" y="254" width="440" height="109" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="52" y="286" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“… my mother was in the doorway … She just</text><text x="52" y="309" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">held out her hand, as if I could pass her the</text><text x="52" y="332" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">sound.”</text><line x1="474" y1="308.5" x2="506" y2="308.5" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="510" y="254" width="360" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="530" y="286" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Her silent gesture shows fear</text><text x="530" y="308" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">without stating it.</text><rect x="30" y="379" width="440" height="84" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="411" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">I picked it up. “Hello?”</text><line x1="474" y1="421" x2="506" y2="421" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="510" y="379" width="360" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="530" y="411" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A short line of dialogue,</text><text x="530" y="433" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">punctuated correctly.</text><rect x="30" y="479" width="440" height="86" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="52" y="511" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“Then a voice I had not heard for six years</text><text x="52" y="534" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">said my name.”</text><line x1="474" y1="522" x2="506" y2="522" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="510" y="479" width="360" height="86" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="530" y="511" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A complication that connects to a</text><text x="530" y="533" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">past the story can now explore.</text><rect x="30" y="585" width="840" height="56" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="620" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Tension, character and a complication, all in under 100 words.</text>
</svg>