<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="640" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Openings that work</text>

<rect x="30" y="110" width="840" height="120" rx="12" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="55" y="146" font-size="20" font-weight="700" fill="#b5602e" text-anchor="start">Avoid</text><text x="55" y="180" font-size="17" font-weight="600" fill="#b5602e" text-anchor="start">✗  waking up</text><text x="55" y="210" font-size="17" font-weight="600" fill="#b5602e" text-anchor="start">✗  a summary: “This is the story of the worst day of my life”</text><rect x="30" y="250" width="410" height="166" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="30" y="250" width="410" height="52" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="52" y="284" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">In the middle of action</text><text x="52" y="336" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“The rope slipped through my fingers</text><text x="52" y="360" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">before I understood it was moving.”</text><rect x="460" y="250" width="410" height="166" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="460" y="250" width="410" height="52" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="482" y="284" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">A line of dialogue</text><text x="482" y="336" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“‘Don’t open it,’ my sister said, which</text><text x="482" y="360" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">was, of course, the moment I did.”</text><rect x="30" y="432" width="410" height="166" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="30" y="432" width="410" height="52" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="52" y="466" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">A precise setting with a hint of unease</text><text x="52" y="518" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“The bus stop was empty, which was</text><text x="52" y="542" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">strange for a Monday.”</text><rect x="460" y="432" width="410" height="166" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="460" y="432" width="410" height="52" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="482" y="466" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">A character’s thought</text><text x="482" y="518" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“I had been lying for three weeks, and</text><text x="482" y="542" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">today it was going to catch up with me.”</text>
</svg>