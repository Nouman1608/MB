<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A simple shape in five stages</text>

<rect x="30" y="110" width="840" height="420" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><line x1="70" y1="470" x2="850" y2="470" stroke="#c9d6d4" stroke-width="2.5"/><text x="70" y="150" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">tension</text><line x1="62" y1="456" x2="62" y2="162" stroke="#c9d6d4" stroke-width="2.5" marker-end="url(#ah)"/><path d="M110,405 L270,360 L450,270 L620,170 L790,330" fill="none" stroke="#b5602e" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="110" cy="405" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="110" y="412.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="110" y="457" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Opening</text><circle cx="270" cy="360" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="270" y="367.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="270" y="412" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Complication</text><circle cx="450" cy="270" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="450" y="277.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="450" y="322" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Rising tension</text><circle cx="620" cy="170" r="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="620" y="177.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="620" y="136" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Turning point</text><circle cx="790" cy="330" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="790" y="337.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="790" y="382" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Resolution</text><rect x="30" y="548" width="160" height="162" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="56" cy="576" r="15" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="56" y="581.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="44" y="618" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">a character in a</text><text x="44" y="637" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">situation, with a</text><text x="44" y="656" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">hint of what is at</text><text x="44" y="675" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">stake</text><rect x="200" y="548" width="160" height="162" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="226" cy="576" r="15" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="226" y="581.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="214" y="618" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">something goes</text><text x="214" y="637" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">wrong, changes, or</text><text x="214" y="656" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">is discovered</text><rect x="370" y="548" width="160" height="162" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="396" cy="576" r="15" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="396" y="581.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="384" y="618" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">the problem</text><text x="384" y="637" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">deepens; choices</text><text x="384" y="656" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">are made</text><rect x="540" y="548" width="160" height="162" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="566" cy="576" r="15" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="566" y="581.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="554" y="618" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">the moment of</text><text x="554" y="637" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">decision,</text><text x="554" y="656" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">revelation or</text><text x="554" y="675" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">crisis</text><rect x="710" y="548" width="160" height="162" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="736" cy="576" r="15" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="736" y="581.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="724" y="618" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">answers the</text><text x="724" y="637" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">problem, or leaves</text><text x="724" y="656" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">a deliberate,</text><text x="724" y="675" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">meaningful</text><text x="724" y="694" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">question</text><text x="450" y="754" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">You do not have to tell events in order</text><rect x="30" y="774" width="410" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="806" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Flashback</text><text x="52" y="830" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">start at the turning point, then go back</text><rect x="60" y="852" width="46" height="46" rx="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="83" y="882" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><path d="M110,875 L150,875" fill="none" stroke="#1e2a44" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><rect x="160" y="852" width="46" height="46" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="183" y="882" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="214" y="852" width="46" height="46" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="237" y="882" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="268" y="852" width="46" height="46" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="291" y="882" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="460" y="774" width="410" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="482" y="806" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Frame</text><text x="482" y="830" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">a present-day scene around the story</text><rect x="482" y="848" width="366" height="58" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="564" y="882" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="middle">present</text><text x="766" y="882" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="middle">present</text><rect x="612" y="856" width="106" height="42" rx="6" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="665" y="883" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">story</text><text x="450" y="954" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="middle">W2 can reward either choice, provided the reader can follow.</text>
</svg>