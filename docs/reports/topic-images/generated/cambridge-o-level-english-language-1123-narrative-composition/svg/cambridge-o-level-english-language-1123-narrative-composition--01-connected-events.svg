<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 762" width="900" height="762" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="762" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Connected events make a story</text>

<rect x="30" y="110" width="840" height="230" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="55" y="146" font-size="21" font-weight="700" fill="#b5602e" text-anchor="start">A sequence, but not a story</text><rect x="55" y="172" width="196" height="56" rx="10" fill="#f4f6f6" stroke="#c9d6d4" stroke-width="2.5"/><text x="153" y="206" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">We went to the beach.</text><text x="269" y="207" font-size="28" font-weight="700" fill="#4a5568" text-anchor="middle">·</text><rect x="287" y="172" width="120" height="56" rx="10" fill="#f4f6f6" stroke="#c9d6d4" stroke-width="2.5"/><text x="347" y="206" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">We swam.</text><text x="425" y="207" font-size="28" font-weight="700" fill="#4a5568" text-anchor="middle">·</text><rect x="443" y="172" width="150" height="56" rx="10" fill="#f4f6f6" stroke="#c9d6d4" stroke-width="2.5"/><text x="518" y="206" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">We had lunch.</text><text x="611" y="207" font-size="28" font-weight="700" fill="#4a5568" text-anchor="middle">·</text><rect x="629" y="172" width="160" height="56" rx="10" fill="#f4f6f6" stroke="#c9d6d4" stroke-width="2.5"/><text x="709" y="206" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">We went home.</text><text x="55" y="270" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Events sit side by side: nothing causes, complicates or changes the next.</text><text x="55" y="304" font-size="17" font-weight="600" fill="#b5602e" text-anchor="start" font-style="italic">Reads as “and then … and then …”</text><rect x="30" y="362" width="840" height="300" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="55" y="398" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="start">Connected: each event leads into the next</text><rect x="55" y="424" width="240" height="96" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="175" y="464" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">We went to the beach</text><line x1="299" y1="472" x2="325" y2="472" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><rect x="330" y="424" width="240" height="96" rx="10" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="464" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">my brother swam out</text><text x="450" y="486" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">too far</text><line x1="574" y1="472" x2="600" y2="472" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><rect x="605" y="424" width="240" height="96" rx="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="725" y="464" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">the lifeguard was</text><text x="725" y="486" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">looking the other way</text><path d="M70,620 C300,615 520,590 830,548" fill="none" stroke="#b5602e" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahR)"/><text x="70" y="600" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">tension</text><text x="845" y="590" font-size="16" font-weight="400" fill="#b5602e" text-anchor="end" font-style="italic">appears at once</text><rect x="30" y="682" width="840" height="56" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="717" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">The key word in the definition is “connected”.</text>
</svg>