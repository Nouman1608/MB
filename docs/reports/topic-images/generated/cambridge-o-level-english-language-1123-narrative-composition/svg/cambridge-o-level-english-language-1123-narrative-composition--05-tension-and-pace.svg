<rect width="900" height="714" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Tension and pace</text>

<rect x="30" y="110" width="840" height="340" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="55" y="146" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Story time against words on the page</text><text x="55" y="186" font-size="16" font-weight="600" fill="#4a5568" text-anchor="start">in the story</text><text x="55" y="386" font-size="16" font-weight="600" fill="#4a5568" text-anchor="start">on the page</text><path d="M180,200 L180,366 L228,366 L680,200 Z" fill="#dce9e7" opacity="0.55"/><path d="M680,200 L702,200 L702,366 L228,366 Z" fill="#f2e7b8" opacity="0.8"/><rect x="180" y="166" width="500" height="34" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="430" y="189" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">the journey</text><rect x="680" y="166" width="22" height="34" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="714" y="189" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="start">a few seconds</text><rect x="180" y="366" width="48" height="34" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><rect x="228" y="366" width="474" height="34" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="465" y="389" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">the key moment</text><text x="200" y="424" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="middle">one sentence</text><text x="465" y="428" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="middle">a paragraph, with detail and thought</text><text x="310" y="300" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">speed up</text><text x="590" y="300" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="middle">slow down</text><rect x="30" y="470" width="410" height="220" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="506" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Sentence length</text><text x="52" y="540" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">build-up: longer sentences</text><rect x="52" y="554" width="300" height="10" rx="5" fill="#b5d3cf"/><rect x="52" y="572" width="340" height="10" rx="5" fill="#b5d3cf"/><rect x="52" y="590" width="280" height="10" rx="5" fill="#b5d3cf"/><text x="52" y="632" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">shock: short sentences</text><rect x="52" y="648" width="70" height="10" rx="5" fill="#b5602e"/><rect x="136" y="648" width="50" height="10" rx="5" fill="#b5602e"/><rect x="200" y="648" width="90" height="10" rx="5" fill="#b5602e"/><rect x="460" y="470" width="410" height="220" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="482" y="506" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Withhold information</text><text x="482" y="540" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Let the reader know something is</text><text x="482" y="562" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">wrong before they know what.</text><rect x="482" y="602" width="170" height="64" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="567" y="640" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">something is wrong</text><line x1="656" y1="634" x2="686" y2="634" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="690" y="602" width="160" height="64" rx="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="770" y="640" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">what it is</text>
</svg>