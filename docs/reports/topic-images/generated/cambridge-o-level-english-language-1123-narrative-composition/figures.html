<!-- place after: ## What "connected events" means -->
<figure class="topic-figure">
  <img src="https://img.marlbridge.com/cambridge-o-level-english-language-1123-narrative-composition--01-connected-events.webp" width="900" height="762" alt="Four unlinked events at the beach form a sequence but not a story. Three connected events (we went to the beach, my brother swam out too far, the lifeguard was looking the other way) each lead into the next, and tension appears at once." loading="lazy">
  <figcaption>A story is events that cause, complicate or change each other, not a list.</figcaption>
</figure>

<!-- place after: ## Small is better -->
<figure class="topic-figure">
  <img src="https://img.marlbridge.com/cambridge-o-level-english-language-1123-narrative-composition--02-small-is-better.webp" width="900" height="742" alt="The best stories in 350 to 450 words have one main character, one or two settings, a short span of time and one central problem. Four big ideas shrink to right-sized ones: a whole holiday becomes the hour the ferry was delayed, a war one evening when a letter arrived, a life story the day a grandmother taught you to bake, and a heist with six characters two friends and one locked door." loading="lazy">
  <figcaption>Narrow the story to one problem in a short span, so there is room to show feeling.</figcaption>
</figure>

<!-- place after: ## A simple shape -->
<figure class="topic-figure">
  <img src="https://img.marlbridge.com/cambridge-o-level-english-language-1123-narrative-composition--03-story-shape.webp" width="900" height="980" alt="A tension line rises through opening, complication and rising tension to a peak at the turning point, then falls to the resolution, with a short description of each stage. Below, two ways to tell events out of order: a flashback that starts at the turning point and goes back, and a frame of present-day scenes around the story." loading="lazy">
  <figcaption>Plan four or five stages; telling them out of order is a structural choice W2 can reward.</figcaption>
</figure>

<!-- place after: ## Openings that work -->
<figure class="topic-figure">
  <img src="https://img.marlbridge.com/cambridge-o-level-english-language-1123-narrative-composition--04-openings.webp" width="900" height="640" alt="Openings to avoid, waking up or a summary of the story, set against four that work: starting in the middle of action, a line of dialogue, a precise setting with a hint of unease, and a character’s thought, each with an example line." loading="lazy">
  <figcaption>Start inside the story, not before it.</figcaption>
</figure>

<!-- place after: ## Tension and pace -->
<figure class="topic-figure">
  <img src="https://img.marlbridge.com/cambridge-o-level-english-language-1123-narrative-composition--05-tension-and-pace.webp" width="900" height="714" alt="A long journey in story time takes one sentence on the page, while a few seconds at the key moment stretch to a paragraph with detail and thought. Longer sentences build up, short ones mark shock, and the reader learns that something is wrong before learning what." loading="lazy">
  <figcaption>Spend words on the key moment and race through the rest.</figcaption>
</figure>

<!-- place after: ## Endings -->
<figure class="topic-figure">
  <img src="https://img.marlbridge.com/cambridge-o-level-english-language-1123-narrative-composition--06-endings.webp" width="900" height="586" alt="Three endings to avoid: it was all a dream, a sudden rescue by something never mentioned, and a moral stated outright. Better endings show change through an action or image: a closed door now open, a message finally sent, or the narrator noticing something ignored at the start." loading="lazy">
  <figcaption>End on an action or image that shows what has changed.</figcaption>
</figure>

<!-- place after: ## Model opening -->
<figure class="topic-figure">
  <img src="https://img.marlbridge.com/cambridge-o-level-english-language-1123-narrative-composition--07-model-opening.webp" width="900" height="665" alt="Four parts of the model opening matched to the commentary: the phone ringing at 2.14 starts in the middle of the situation and slows the moment, the mother’s silent gesture shows fear, a short line of dialogue is punctuated correctly, and a voice not heard for six years adds a complication." loading="lazy">
  <figcaption>Every line of the opening does a job: tension, character, dialogue, complication.</figcaption>
