<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 502" width="900" height="502" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="502" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Bigger transitions</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">A sentence or paragraph that looks back and looks forward</text>
<rect x="30" y="122" width="220" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="140" y="174.85" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">last paragraph: money</text><rect x="650" y="122" width="220" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="760" y="164.95" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">next paragraph:</text><text x="760" y="184.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">something else</text><rect x="280" y="122" width="340" height="96" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="450" y="175.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">“Cost is only half the story.”</text><line x1="276" y1="170" x2="254" y2="170" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><line x1="624" y1="170" x2="646" y2="170" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><rect x="30" y="232" width="220" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="140" y="274.95" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">the case so far: what the</text><text x="140" y="294.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">shops gain</text><rect x="650" y="232" width="220" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="760" y="284.85" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">what the town loses</text><rect x="280" y="232" width="340" height="96" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="450" y="263.92" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">“So far, the case has rested on what</text><text x="450" y="285.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">the shops gain. The next question is</text><text x="450" y="306.16" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">what the town loses.”</text><line x1="276" y1="280" x2="254" y2="280" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><line x1="624" y1="280" x2="646" y2="280" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><rect x="30" y="342" width="220" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="140" y="394.85" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">what the lane costs</text><rect x="650" y="342" width="220" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="760" y="394.85" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">what it saves</text><rect x="280" y="342" width="340" height="96" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="450" y="384.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">“Having seen what the lane costs, we</text><text x="450" y="405.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">must ask what it saves.”</text><line x1="276" y1="390" x2="254" y2="390" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><line x1="624" y1="390" x2="646" y2="390" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><text x="140" y="464" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">← looks back</text><text x="760" y="464" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">looks forward →</text>
</svg>