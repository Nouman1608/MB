<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" width="900" height="660" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="660" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A transition is a promise</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Each family tells the reader what comes next</text>
<rect x="30" y="122" width="412" height="92" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><rect x="40" y="132" width="64" height="72" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2" /><text x="72" y="177" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">→</text><text x="118" y="152" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Addition</text><text x="118" y="176" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="start" font-style="italic" xml:space="preserve">also, in addition, moreover, furthermore</text><text x="118" y="199" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" xml:space="preserve">expect: a further point of the same kind</text><rect x="458" y="122" width="412" height="92" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><rect x="468" y="132" width="64" height="72" rx="10" fill="#f6e3d8" stroke="#1e2a44" stroke-width="2" /><text x="500" y="177" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">↩</text><text x="546" y="152" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Contrast</text><text x="546" y="176" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="start" font-style="italic" xml:space="preserve">but, however, in contrast, yet</text><text x="546" y="199" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" xml:space="preserve">expect: an idea that pulls the other way</text><rect x="30" y="226" width="412" height="92" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><rect x="40" y="236" width="64" height="72" rx="10" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2" /><text x="72" y="281" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">⤳</text><text x="118" y="256" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Concession</text><text x="118" y="280" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="start" font-style="italic" xml:space="preserve">although, admittedly, granted</text><text x="118" y="303" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" xml:space="preserve">expect: a concession, then the claim again</text><rect x="458" y="226" width="412" height="92" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><rect x="468" y="236" width="64" height="72" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2" /><text x="500" y="281" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">⇒</text><text x="546" y="256" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Cause or result</text><text x="546" y="280" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="start" font-style="italic" xml:space="preserve">because, therefore, consequently</text><text x="546" y="303" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" xml:space="preserve">expect: an explanation or consequence</text><rect x="30" y="330" width="412" height="92" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><rect x="40" y="340" width="64" height="72" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2" /><text x="72" y="385" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">↓</text><text x="118" y="360" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Example</text><text x="118" y="384" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="start" font-style="italic" xml:space="preserve">for instance, such as, to illustrate</text><text x="118" y="407" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" xml:space="preserve">expect: a specific case</text><rect x="458" y="330" width="412" height="92" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><rect x="468" y="340" width="64" height="72" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2" /><text x="500" y="385" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">1·2·3</text><text x="546" y="360" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Sequence</text><text x="546" y="384" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="start" font-style="italic" xml:space="preserve">first, next, then, finally</text><text x="546" y="407" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" xml:space="preserve">expect: a later step in an order</text><rect x="30" y="434" width="412" height="92" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><rect x="40" y="444" width="64" height="72" rx="10" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2" /><text x="72" y="489" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">↑</text><text x="118" y="464" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Emphasis</text><text x="118" y="488" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="start" font-style="italic" xml:space="preserve">indeed, in fact, above all</text><text x="118" y="511" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" xml:space="preserve">expect: a stronger point</text><rect x="458" y="434" width="412" height="92" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><rect x="468" y="444" width="64" height="72" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2" /><text x="500" y="489" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">=</text><text x="546" y="464" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Similarity</text><text x="546" y="488" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="start" font-style="italic" xml:space="preserve">similarly, likewise</text><text x="546" y="511" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" xml:space="preserve">expect: a parallel idea</text><rect x="30" y="538" width="412" height="92" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><rect x="40" y="548" width="64" height="72" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2" /><text x="72" y="593" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">∑</text><text x="118" y="568" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Summary</text><text x="118" y="592" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="start" font-style="italic" xml:space="preserve">in short, in sum, to conclude</text><text x="118" y="615" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" xml:space="preserve">expect: a short restatement</text><rect x="458" y="538" width="412" height="92" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><rect x="468" y="548" width="64" height="72" rx="10" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2" /><text x="500" y="593" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">⊂</text><text x="546" y="568" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Qualification</text><text x="546" y="592" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="start" font-style="italic" xml:space="preserve">at least, in part, unless</text><text x="546" y="615" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" xml:space="preserve">expect: a limit on the claim</text>
</svg>