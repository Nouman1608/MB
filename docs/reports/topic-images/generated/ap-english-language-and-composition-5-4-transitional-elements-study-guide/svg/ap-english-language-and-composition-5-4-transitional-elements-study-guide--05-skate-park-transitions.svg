<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 649" width="900" height="649" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="649" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Placed side by side, or linked</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Weak and strong versions of the skate-park paragraph</text>
<text x="30" y="134" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start" xml:space="preserve">Weak: the reader must guess</text><rect x="30" y="150" width="235.44304000000002" height="34" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2" /><text x="147.72152" y="172.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">The town built a skate park.</text><rect x="287.44304" y="150" width="414.25104" height="34" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2" /><text x="494.56856" y="172.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Teenagers have somewhere to go in the evenings.</text><rect x="723.69408" y="150" width="99.31824" height="34" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2" /><text x="773.3532" y="172.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Crime fell.</text><rect x="30" y="196" width="298.49552" height="34" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2" /><text x="179.24776" y="218.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">People complained about the noise.</text><rect x="350.49552" y="196" width="266.83744" height="34" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2" /><text x="483.91424" y="218.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">The council kept the park open.</text><text x="30" y="260" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start" xml:space="preserve">Strong: each relationship named</text><rect x="30" y="276" width="269.16112" height="34" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2" /><text x="164.58056" y="298.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">The town built a skate park, and</text><rect x="305.16112" y="276" width="100.10928" height="34" rx="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2" /><text x="355.21576" y="298.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">as a result</text><text x="355.21576" y="331.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">cause</text><rect x="411.2704" y="276" width="408.99392" height="34" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2" /><text x="615.76736" y="298.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">teenagers have somewhere to go in the evenings.</text><rect x="30" y="360.3" width="226.0824" height="34" rx="8" fill="#dce9e7" stroke="#1e2a44" stroke-width="2" /><text x="143.0412" y="382.90000000000003" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">In the year after it opened,</text><text x="143.0412" y="415.8" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">frames evidence</text><rect x="262.0824" y="360.3" width="96.69792" height="34" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2" /><text x="310.43136" y="382.90000000000003" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">crime fell,</text><rect x="364.78032" y="360.3" width="142.0344" height="34" rx="8" fill="#dce9e7" stroke="#1e2a44" stroke-width="2" /><text x="435.79752" y="382.90000000000003" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">which suggests</text><text x="435.79752" y="415.8" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">frames evidence</text><rect x="30" y="444.6" width="636.9288" height="34" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2" /><text x="348.4644" y="467.20000000000005" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">that the park may have drawn young people away from less supervised places.</text><rect x="672.9288" y="444.6" width="145.9072" height="34" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2" /><text x="745.8824" y="467.20000000000005" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Some residents,</text><rect x="30" y="500.6" width="92.52848" height="34" rx="8" fill="#f6e3d8" stroke="#1e2a44" stroke-width="2" /><text x="76.26424" y="523.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">however,</text><text x="76.26424" y="556.1" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">contrast</text><rect x="128.52848" y="500.6" width="240.15632" height="34" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2" /><text x="248.60664" y="523.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">complained about the noise.</text><rect x="374.6848" y="500.6" width="86.48031999999999" height="34" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2" /><text x="417.92496" y="523.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Even so,</text><text x="417.92496" y="556.1" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">concession</text><rect x="467.16512" y="500.6" width="261.58032000000003" height="34" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2" /><text x="597.95528" y="523.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">the council kept the park open,</text><rect x="734.74544" y="500.6" width="61.4472" height="34" rx="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2" /><text x="765.4690400000001" y="523.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">since</text><text x="765.4690400000001" y="556.1" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">reasoning</text><rect x="30" y="584.9" width="384.66944" height="34" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2" /><text x="222.33472" y="607.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">the benefits seemed to outweigh the nuisance.</text>
</svg>