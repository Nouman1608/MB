<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 596" width="900" height="596" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="596" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Transitions that frame evidence</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">They tell the reader what kind of evidence comes next and how to weigh it</text>
<rect x="30" y="122" width="470" height="54" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="44" y="154.23" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“For instance,”</text><line x1="506" y1="149" x2="546" y2="149" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="556" y="155" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">an example of the claim</text><rect x="30" y="186" width="470" height="54" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="44" y="218.23" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“According to a recent survey,”</text><line x1="506" y1="213" x2="546" y2="213" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="556" y="219" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">a source: consider its reliability</text><rect x="30" y="250" width="470" height="54" rx="14" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2.5" /><text x="44" y="282.22999999999996" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“A second case supports this:”</text><line x1="506" y1="277" x2="546" y2="277" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="556" y="283" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">more of the same kind</text><rect x="30" y="314" width="470" height="54" rx="14" fill="#f6e3d8" stroke="#c9d6d4" stroke-width="2.5" /><text x="44" y="346.22999999999996" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“In contrast, a study from another region shows...”</text><line x1="506" y1="341" x2="546" y2="341" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="556" y="347" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">evidence that complicates the first</text><rect x="30" y="378" width="470" height="54" rx="14" fill="#b5d3cf" stroke="#c9d6d4" stroke-width="2.5" /><text x="44" y="410.22999999999996" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“More telling still,”</text><line x1="506" y1="405" x2="546" y2="405" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="556" y="411" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">stronger than the last</text><rect x="30" y="442" width="470" height="54" rx="14" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2.5" /><text x="44" y="474.22999999999996" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“Even so,”</text><line x1="506" y1="469" x2="546" y2="469" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="556" y="475" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">evidence that survives a challenge</text><rect x="30" y="512" width="840" height="53.120000000000005" rx="14" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5" stroke-dasharray="7 5"/><text x="450" y="543.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Without signals, a string of facts leaves the reader unsure which matters most or how they fit.</text>
</svg>