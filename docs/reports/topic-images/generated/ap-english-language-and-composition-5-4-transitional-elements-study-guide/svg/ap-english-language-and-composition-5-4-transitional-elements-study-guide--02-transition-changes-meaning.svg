<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The wrong word reverses the meaning</text>

<rect x="30" y="96" width="260" height="60" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="160" y="131.23" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">The council cut bus fares.</text><rect x="310" y="104" width="170" height="44" rx="22" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5" /><text x="395" y="133" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">As a result,</text><line x1="292" y1="126" x2="306" y2="126" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><line x1="482" y1="126" x2="496" y2="126" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="500" y="96" width="200" height="60" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="600" y="131.23" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">ridership rose.</text><text x="720" y="122" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" xml:space="preserve">a consequence</text><rect x="30" y="172" width="260" height="60" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="160" y="207.23" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">The council cut bus fares.</text><rect x="310" y="180" width="170" height="44" rx="22" fill="#f6e3d8" stroke="#1e2a44" stroke-width="2.5" /><text x="395" y="209" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">However,</text><line x1="292" y1="202" x2="306" y2="202" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><line x1="482" y1="202" x2="496" y2="202" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="500" y="172" width="200" height="60" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="600" y="207.23" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">ridership fell.</text><text x="720" y="198" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" xml:space="preserve">against expectation</text><text x="30" y="266" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start" xml:space="preserve">A transition is wrong if the relationship does not exist</text><rect x="30" y="282" width="192.62594" height="36" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2" /><text x="126.31297" y="306.3" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">The shop sells fruit.</text><rect x="230.62594" y="282" width="120" height="36" rx="8" fill="#f6e3d8" stroke="#1e2a44" stroke-width="2" /><text x="290.62594" y="306.3" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Therefore,</text><text x="290.62594" y="339.5" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle" xml:space="preserve">promises a</text><text x="290.62594" y="357.8" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle" xml:space="preserve">result</text><rect x="358.62594" y="282" width="177.33044" height="36" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2" /><text x="447.29116" y="306.3" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">it is on Park Road.</text><rect x="30" y="384.6" width="198" height="102" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="129" y="418.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">“moreover”</text><text x="129" y="445.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">adds a point of the</text><text x="129" y="465.55" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">same kind</text><rect x="244" y="384.6" width="198" height="102" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="343" y="418.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">“however”</text><text x="343" y="445.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">reverses direction</text><rect x="458" y="384.6" width="198" height="102" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="557" y="418.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">“in fact”</text><text x="557" y="445.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">intensifies</text><rect x="672" y="384.6" width="198" height="102" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="771" y="418.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">“for example”</text><text x="771" y="445.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">narrows to a case</text>
