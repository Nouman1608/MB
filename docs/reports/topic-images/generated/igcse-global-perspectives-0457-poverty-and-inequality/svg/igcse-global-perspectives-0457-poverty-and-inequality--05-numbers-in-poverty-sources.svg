<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 652" width="900" height="652" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="652" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Five questions for poverty numbers</text>

<rect x="30" y="120" width="410" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="154" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Average or median?</text><rect x="70" y="290" width="40" height="30" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><rect x="125" y="286" width="40" height="34" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><rect x="180" y="282" width="40" height="38" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><rect x="235" y="278" width="40" height="42" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><rect x="290" y="274" width="40" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><rect x="345" y="170" width="40" height="150" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><line x1="55" y1="263" x2="400" y2="263" stroke="#b5602e" stroke-width="3" stroke-dasharray="8 6"/><text x="400" y="256" font-size="15" font-weight="700" fill="#b5602e" text-anchor="end">mean</text><line x1="55" y1="280" x2="400" y2="280" stroke="#2e6b62" stroke-width="3"/><text x="400" y="294" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="end">median</text><text x="235" y="352" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">A few very high earners pull the mean up</text><rect x="460" y="120" width="410" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="480" y="154" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Share or amount?</text><circle cx="560" cy="245" r="50" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><path d="M560,245 L560,195 A50,50 0 0 1 607.5528258147576,229.54915028125262 Z" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="560" y="317" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">before</text><circle cx="760" cy="245" r="70" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><path d="M760,245 L760,175 A70,70 0 0 1 814.7673567403612,201.40485536583213 Z" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="760" y="337" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">economy grows</text><line x1="620" y1="245" x2="680" y2="245" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="665" y="352" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Poorest group’s slice: same size, smaller share</text><rect x="30" y="390" width="268" height="126" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="424.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Percentage or points?</text><text x="50" y="452" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">50% to 70% is +20 percentage</text><text x="50" y="472" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">points, but a 40% increase.</text><rect x="316" y="390" width="268" height="126" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="336" y="424.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Who was asked?</text><text x="336" y="452" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">People surveyed at a food</text><text x="336" y="472" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">bank are not a fair sample of</text><text x="336" y="492" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">a whole town.</text><rect x="602" y="390" width="268" height="126" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="622" y="424.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Which measure?</text><text x="622" y="452" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Absolute or relative? Income</text><text x="622" y="472" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">or wealth?</text><rect x="30" y="540" width="840" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="576" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Language</text><text x="50" y="605.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Loaded words such as “scroungers” or “struggling heroes” carry values: point to the word</text><text x="50" y="627.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">and explain its effect.</text>
</svg>