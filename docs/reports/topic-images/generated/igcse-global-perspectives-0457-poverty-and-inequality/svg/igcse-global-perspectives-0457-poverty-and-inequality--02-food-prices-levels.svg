<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Moving one issue up and down the levels</text>

<rect x="30" y="104" width="840" height="86" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="137" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">GLOBAL</text><text x="450" y="164" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">A global pattern of rising living costs</text><line x1="450" y1="194" x2="450" y2="224" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="110" y="228" width="680" height="86" rx="14" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="261" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">NATIONAL</text><text x="450" y="288" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">A national rise in food prices</text><line x1="450" y1="318" x2="450" y2="348" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="190" y="352" width="520" height="86" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="385" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">LOCAL</text><text x="450" y="412" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">More families in one town use a food bank</text><rect x="30" y="456" width="840" height="126" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="489" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">AN ISSUE AT EACH LEVEL</text><text x="50" y="513.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Global: SDG 1 “End poverty in all its forms everywhere”: how to measure progress?</text><text x="50" y="535.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">National: absolute or relative poverty line? Local: is a food bank a solution, or</text><text x="50" y="557.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">a sign that something else has failed?</text>
