<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 702" width="900" height="702" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="702" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Moving one issue up and down the levels</text>

<rect x="30" y="104" width="840" height="86" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="137" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">GLOBAL</text><text x="450" y="164" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">A global pattern of rising living costs</text><line x1="450" y1="194" x2="450" y2="224" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="110" y="228" width="680" height="86" rx="14" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="261" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">NATIONAL</text><text x="450" y="288" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">A national rise in food prices</text><line x1="450" y1="318" x2="450" y2="348" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="190" y="352" width="520" height="86" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="385" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">LOCAL</text><text x="450" y="412" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">More families in one town use a food bank</text><text x="450" y="476" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">An issue that divides opinion at each level</text><rect x="30" y="502" width="268" height="170" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="535" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">GLOBAL</text><text x="50" y="559.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">How should progress on</text><text x="50" y="581.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">SDG 1, “End poverty in</text><text x="50" y="603.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">all its forms</text><text x="50" y="625.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">everywhere”, be</text><text x="50" y="647.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">measured?</text><rect x="316" y="502" width="268" height="170" rx="14" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><text x="336" y="557" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">NATIONAL</text><text x="336" y="581.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Should the poverty line</text><text x="336" y="603.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">be absolute or</text><text x="336" y="625.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">relative?</text><rect x="602" y="502" width="268" height="170" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="622" y="546" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">LOCAL</text><text x="622" y="570.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Is a food bank a</text><text x="622" y="592.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">solution, or a sign</text><text x="622" y="614.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">that something else has</text><text x="622" y="636.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">failed?</text>
</svg>