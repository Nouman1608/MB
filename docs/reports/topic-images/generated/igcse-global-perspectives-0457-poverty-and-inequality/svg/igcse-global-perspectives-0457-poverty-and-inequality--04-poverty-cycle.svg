ght="700" fill="#1e2a44" text-anchor="middle">qualifications</text><rect x="153.66442431225812" y="489.8033988749895" width="240" height="72" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="273.6644243122581" y="518.2033988749895" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Finds only low-paid</text><text x="273.6644243122581" y="542.2033988749895" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">work as an adult</text><rect x="44.68304511145391" y="254.19660112501055" width="240" height="96" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="164.6830451114539" y="282.5966011250105" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Their own children</text><text x="164.6830451114539" y="306.5966011250105" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">face the same</text><text x="164.6830451114539" y="330.5966011250105" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">pressure</text></g><rect x="30" y="555.8033988749895" width="408" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="588.8033988749895" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">SHORT TERM</text><text x="50" y="614.2033988749895" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">A food bank meets hunger</text><text x="50" y="642.6033988749895" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">a consequence</text><rect x="462" y="555.8033988749895" width="408" height="111" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="482" y="588.8033988749895" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">LONG TERM</text><text x="482" y="614.2033988749895" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">It does not change low income</text><text x="482" y="642.6033988749895" font-size="16" font-weight="400" fill="#4