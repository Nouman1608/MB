<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 705" width="900" height="705" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="705" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Which poverty? Which measure?</text>

<rect x="30" y="120" width="408" height="158" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="153" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">ABSOLUTE POVERTY</text><text x="50" y="179.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Not enough to meet basic needs</text><text x="50" y="207.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Food, shelter, clean water.</text><rect x="462" y="120" width="408" height="158" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="482" y="153" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">RELATIVE POVERTY</text><text x="482" y="179.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Much less than most people in</text><text x="482" y="204.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">your society</text><text x="482" y="232.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">UK: commonly household income below 60% of</text><text x="482" y="253.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the median.</text><rect x="30" y="280" width="268" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="313" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">INCOME</text><text x="50" y="338.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Money coming in over</text><text x="50" y="362.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">time</text><text x="50" y="390" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">wages, benefits</text><rect x="316" y="280" width="268" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="336" y="313" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">WEALTH</text><text x="336" y="338.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">What you own</text><text x="336" y="366" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">savings, land, property</text><rect x="602" y="280" width="268" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="622" y="313" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">MULTIDIMENSIONAL</text><text x="622" y="338.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Several things at once</text><text x="622" y="366" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">schooling, health, living</text><text x="622" y="386" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">standards (UNDP and Oxford</text><text x="622" y="406" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">MPI)</text><text x="450" y="465" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Gini coefficient: income inequality in one number</text><defs><linearGradient id="gg" x1="0" x2="1"><stop offset="0" stop-color="#dce9e7"/><stop offset="1" stop-color="#d4b02e"/></linearGradient></defs><rect x="100" y="485" width="700" height="34" rx="8" fill="url(#gg)" stroke="#1e2a44" stroke-width="2.5"/><text x="100" y="545" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">0</text><text x="800" y="545" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="90" y="569" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">everyone has the same</text><text x="810" y="569" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end">one person has everything</text><rect x="30" y="593" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="626.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">World Bank international poverty line: $3.00 a day from June 2025 (2021 prices, adjusted</text><text x="50" y="648.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">for living costs). Sources using different measures can disagree and both be accurate.</text>
</svg>