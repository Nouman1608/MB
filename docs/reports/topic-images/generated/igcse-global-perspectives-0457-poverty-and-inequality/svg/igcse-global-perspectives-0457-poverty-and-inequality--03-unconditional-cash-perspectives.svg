<rect width="900" height="566" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Unconditional cash for low-income families?</text>

<rect x="30" y="104" width="268" height="130" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="164" y="138.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Values</text><text x="164" y="166" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">fairness and need, or reward</text><text x="164" y="186" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">for effort and responsibility</text><rect x="316" y="104" width="268" height="130" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="138.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Interests</text><text x="450" y="166" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">landlord, tenant, taxpayer</text><text x="450" y="186" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">and charity gain or lose</text><text x="450" y="206" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">differently</text><rect x="602" y="104" width="268" height="130" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="736" y="138.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Evidence and</text><text x="736" y="162.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">experience</text><text x="736" y="190" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">lived experience or national</text><text x="736" y="210" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">data: each sees part</text><text x="450" y="272" font-size="18" font-weight="700" fill="#4a5568" text-anchor="middle">Why perspectives differ, applied to one issue</text><line x1="320" y1="360" x2="371.8" y2="397.05" stroke="#1e2a44" stroke-width="2.5"/><line x1="320" y1="474" x2="371.8" y2="436.95" stroke="#1e2a44" stroke-width="2.5"/><line x1="580" y1="360" x2="528.2" y2="397.05" stroke="#1e2a44" stroke-width="2.5"/><line x1="580" y1="486" x2="528.2" y2="441.15" stroke="#1e2a44" stroke-width="2.5"/><circle cx="450" cy="417" r="92" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="412.75" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Give cash with</text><text x="450" y="435.25" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">no conditions?</text><g transform="translate(0,12)"><rect x="30" y="298" width="290" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="327" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">A FAMILY RECEIVING SUPPORT</text><text x="46" y="352.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Cash lets them choose</text><text x="46" y="376.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">what they most need</text><rect x="30" y="412" width="290" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="441" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">A TAXPAYERS’ GROUP</text><text x="46" y="466.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Wants proof public money</text><text x="46" y="490.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">is used well</text></g><g transform="translate(0,0)"><rect x="580" y="298" width="290" height="124" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="596" y="327" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">A CHARITY</text><text x="596" y="352.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">May support cash, or</text><text x="596" y="376.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">argue services matter</text><text x="596" y="400.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">more</text><rect x="580" y="436" width="290" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="596" y="465" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">INTERNATIONAL ORGANISATION</text><text x="596" y="490.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Compares programmes</text><text x="596" y="514.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">across countries</text></g>
</svg>