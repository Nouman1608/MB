<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 632" width="900" height="632" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="632" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Real actions on poverty, and their limits</text>

<rect x="30" y="104" width="290" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="42" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Action</text><rect x="320" y="104" width="280" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="332" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Strength</text><rect x="600" y="104" width="270" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="612" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Limitation</text><rect x="30" y="150" width="290" height="85" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="175.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Conditional cash: Bolsa</text><text x="42" y="196.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Família, Brazil (2003)</text><rect x="320" y="150" width="280" height="85" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="332" y="175.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Links short-term help to</text><text x="332" y="196.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">long-term causes such as low</text><text x="332" y="217.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">schooling</text><rect x="600" y="150" width="270" height="85" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="612" y="175.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Conditions can exclude</text><text x="612" y="196.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">families; cash does not</text><text x="612" y="217.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">improve school quality</text><rect x="30" y="235" width="290" height="85" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="260.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Unconditional cash: Benazir</text><text x="42" y="281.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Income Support Programme,</text><text x="42" y="302.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Pakistan (2008)</text><rect x="320" y="235" width="280" height="85" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="332" y="260.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Families choose; paying women</text><text x="332" y="281.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">may give them more say at home</text><rect x="600" y="235" width="270" height="85" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="612" y="260.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Depends on accurate data on</text><text x="612" y="281.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">who qualifies</text><rect x="30" y="320" width="290" height="85" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="345.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Basic income trial: Finland</text><text x="42" y="366.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">(2017–2018)</text><rect x="320" y="320" width="280" height="85" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="332" y="345.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Participants reported better</text><text x="332" y="366.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">wellbeing</text><rect x="600" y="320" width="270" height="85" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="612" y="345.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Small effects on employment;</text><text x="612" y="366.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">one group for two years may</text><text x="612" y="387.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">not scale</text><rect x="30" y="405" width="290" height="85" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="430.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Microfinance: Grameen Bank</text><text x="42" y="451.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">(Nobel Peace Prize 2006)</text><rect x="320" y="405" width="280" height="85" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="332" y="430.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Loans for people without access</text><text x="332" y="451.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">to banks</text><rect x="600" y="405" width="270" height="85" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="612" y="430.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Randomised evaluations</text><text x="612" y="451.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">generally find modest average</text><text x="612" y="472.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">income effects</text><rect x="78.80000000000007" y="508" width="300.79999999999995" height="42" rx="21" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="229.20000000000005" y="534.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Effective: reaches the cause?</text><rect x="391.6" y="508" width="135.2" height="42" rx="21" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="459.20000000000005" y="534.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Affordable?</text><rect x="538.8" y="508" width="282.4" height="42" rx="21" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="680" y="534.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Fair: who gains, who loses?</text><rect x="377.8" y="560" width="144.39999999999998" height="42" rx="21" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="586.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Sustainable?</text>
</svg>