<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 740" width="900" height="740" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="740" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How far does the evidence support the claim?</text>

<rect x="30" y="114" width="840" height="108" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="50" y="147" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">INVENTED SOURCE</text><text x="50" y="172.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">26 of 40 households asked at a community centre (65%) cut back on heating.</text><text x="50" y="196.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">“Most families in the town are in fuel poverty.”</text><circle cx="230" cy="390" r="150" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><text x="230" y="282" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">All households</text><text x="230" y="302" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">in the town</text><circle cx="230" cy="430" r="100" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="3"/><text x="230" y="378" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">Community</text><text x="230" y="397" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">centre users</text><circle cx="230" cy="472" r="38" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="230" y="479" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">40</text><rect x="410" y="232" width="460" height="84" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="430" y="265" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SUPPORTS</text><text x="430" y="290.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">A real problem for some households</text><rect x="410" y="328" width="460" height="130" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="430" y="361" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">WEAKNESS: SAMPLE</text><text x="430" y="386.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Only 40, at a community centre</text><text x="430" y="414" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Users may already be more likely to need help, so</text><text x="430" y="434" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">struggling families are over-represented.</text><rect x="410" y="470" width="460" height="110" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="430" y="503" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">WEAKNESS: DEFINITION</text><text x="430" y="528.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">“Cutting back” is not fuel poverty</text><text x="430" y="556" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">That needs data on income and energy costs.</text><rect x="30" y="598" width="840" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="634" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">How far? A judgement</text><text x="50" y="663.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Supports “some households struggle with fuel costs”, not “most families”. A random survey</text><text x="50" y="685.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">of homes across the town, with a clear definition, would test it better.</text>
</svg>