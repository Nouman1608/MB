<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 623" width="900" height="623" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="623" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">When to credit a source</text>

<rect x="30" y="96" width="330" height="58" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="46" y="130.23" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700">Direct</tspan> <tspan font-weight="700">quotation</tspan></text><line x1="366" y1="125" x2="420" y2="125" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="426" y="96" width="444" height="58" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="442" y="130.23" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">quotation marks + name the source</text><rect x="30" y="166" width="330" height="58" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="46" y="200.23" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700">Paraphrase</tspan> <tspan font-weight="700">or</tspan> <tspan font-weight="700">summary</tspan></text><line x1="366" y1="195" x2="420" y2="195" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="426" y="166" width="444" height="58" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="442" y="200.23" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">no quotation marks, but name the source</text><rect x="30" y="236" width="330" height="58" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="46" y="270.23" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700">An</tspan> <tspan font-weight="700">idea</tspan> <tspan font-weight="700">or</tspan> <tspan font-weight="700">statistic</tspan> <tspan font-weight="700">from</tspan> <tspan font-weight="700">a</tspan> <tspan font-weight="700">source</tspan></text><line x1="366" y1="265" x2="420" y2="265" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="426" y="236" width="444" height="58" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="442" y="270.23" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">credit it, even in your own words</text><rect x="30" y="306" width="330" height="58" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="46" y="340.22999999999996" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700">Common</tspan> <tspan font-weight="700">knowledge</tspan></text><line x1="366" y1="335" x2="420" y2="335" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="426" y="306" width="444" height="58" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="442" y="340.22999999999996" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">no citation needed: Paris is the capital of France</text><text x="450" y="392" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Keep your own sentence in charge</text><rect x="30" y="406" width="269.3333333333333" height="146.88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="48" y="440" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Signal phrase</text><text x="48" y="468" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“According to the Trust’s</text><text x="48" y="489.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">evaluation (Source A), ...”</text><rect x="315.3333333333333" y="406" width="269.3333333333333" height="146.88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="333.3333333333333" y="440" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Embedded</text><text x="333.3333333333333" y="468" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“Source B’s survey, in which</text><text x="333.3333333333333" y="489.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">58 percent of parents</text><text x="333.3333333333333" y="510.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">reported higher childcare</text><text x="333.3333333333333" y="531.36" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">costs, suggests...”</text><rect x="600.6666666666666" y="406" width="269.3333333333333" height="146.88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="618.6666666666666" y="440" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Parenthetical</text><text x="618.6666666666666" y="468" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“...unchanged test results</text><text x="618.6666666666666" y="489.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">(Source A).”</text><text x="450" y="580.88" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" xml:space="preserve">Credit is an ethical duty (no plagiarism) and a rhetorical advantage (ethos).</text>
</svg>