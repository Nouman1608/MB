<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 848" width="900" height="848" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="848" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Five explanations of global inequality</text>

<rect x="206" y="104" width="216" height="64" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="314" y="128.74" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Why are poor</text><text x="314" y="152.74" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">countries poor?</text><rect x="430" y="104" width="216" height="64" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="538" y="128.74" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Route to</text><text x="538" y="152.74" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">development</text><rect x="654" y="104" width="216" height="64" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="762" y="140.74" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Key criticism</text><rect x="30" y="176" width="168" height="93" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="216.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Modernisation</text><text x="42" y="238.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">(Rostow)</text><rect x="206" y="176" width="216" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="220" y="206.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">They lack the values</text><text x="220" y="227.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and investment needed</text><text x="220" y="248.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">for take-off.</text><rect x="430" y="176" width="216" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="444" y="206.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Western aid,</text><text x="444" y="227.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">investment and</text><text x="444" y="248.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">expertise.</text><rect x="654" y="176" width="216" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="668" y="206.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Ethnocentric; ignores</text><text x="668" y="227.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">colonialism.</text><rect x="30" y="277" width="168" height="114" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="328.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Dependency</text><text x="42" y="350.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">(Frank)</text><rect x="206" y="277" width="216" height="114" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="220" y="307.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Surplus is drained</text><text x="220" y="328.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">from satellite to</text><text x="220" y="349.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">metropolis.</text><rect x="430" y="277" width="216" height="114" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="444" y="307.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Break the exploitative</text><text x="444" y="328.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">relationship.</text><rect x="654" y="277" width="216" height="114" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="668" y="307.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Cannot explain South</text><text x="668" y="328.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Korea and Taiwan;</text><text x="668" y="349.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">isolation has not</text><text x="668" y="370.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">reliably worked.</text><rect x="30" y="399" width="168" height="93" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="439.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">World systems</text><text x="42" y="461.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">(Wallerstein)</text><rect x="206" y="399" width="216" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="220" y="429.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Position in a core,</text><text x="220" y="450.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">semi-periphery and</text><text x="220" y="471.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">periphery.</text><rect x="430" y="399" width="216" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="444" y="429.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Countries can move</text><text x="444" y="450.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">between zones.</text><rect x="654" y="399" width="216" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="668" y="429.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Little room for</text><text x="668" y="450.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">choices inside</text><text x="668" y="471.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">countries.</text><rect x="30" y="500" width="168" height="93" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="551.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Neoliberalism</text><rect x="206" y="500" width="216" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="220" y="530.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">State interference,</text><text x="220" y="551.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">corruption,</text><text x="220" y="572.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">protectionism.</text><rect x="430" y="500" width="216" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="444" y="530.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Free trade,</text><text x="444" y="551.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">privatisation,</text><text x="444" y="572.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">spending cuts.</text><rect x="654" y="500" width="216" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="668" y="530.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Cuts fell on health</text><text x="668" y="551.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and education, hitting</text><text x="668" y="572.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">women and the poor.</text><rect x="30" y="601" width="168" height="96" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="632.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">People-centred</text><text x="42" y="654.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">and</text><text x="42" y="676.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">post-development</text><rect x="206" y="601" width="216" height="96" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="220" y="631.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">"Development" is a</text><text x="220" y="652.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Western discourse</text><text x="220" y="673.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(Escobar).</text><rect x="430" y="601" width="216" height="96" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="444" y="631.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Small-scale,</text><text x="444" y="652.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">bottom-up, local</text><text x="444" y="673.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">change.</text><rect x="654" y="601" width="216" height="96" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="668" y="631.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Small projects may not</text><text x="668" y="652.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">reach national scale.</text><rect x="30" y="713" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="749" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Conflict and consensus</text><text x="56" y="778" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Modernisation theory is broadly consensus-based; dependency theory is conflict-based</text><text x="56" y="800" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">(Marxist).</text>
</svg>