<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 687" width="900" height="687" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="687" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">War, poverty and the conflict trap</text>

<path d="M375,190.0961894323342 A150,150 0 0 1 450,320" fill="none" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><path d="M375,449.9038105676658 A150,150 0 0 1 225.00000000000003,449.9038105676658" fill="none" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><path d="M150,320 A150,150 0 0 1 225.00000000000003,190.0961894323342" fill="none" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="205" y="140" width="190" height="60" rx="30" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="300" y="177" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">War and conflict</text><rect x="334.9038105676658" y="365" width="190" height="60" rx="30" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="429.9038105676658" y="402" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Damage</text><rect x="75.0961894323342" y="365" width="190" height="60" rx="30" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="170.0961894323342" y="402" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Poverty</text><text x="48" y="240" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start" font-style="italic">raises the</text><text x="48" y="260" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start" font-style="italic">risk of war</text><text x="300" y="326" font-size="17" font-weight="600" fill="#4a5568" text-anchor="middle">Collier’s</text><text x="300" y="348" font-size="17" font-weight="600" fill="#4a5568" text-anchor="middle">conflict trap</text><rect x="560" y="110" width="310" height="190" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M561.25,160 L561.25,124.25 Q561.25,111.25 574.25,111.25 L855.75,111.25 Q868.75,111.25 868.75,124.25 L868.75,160 Z" fill="#f2e7b8"/><line x1="561.25" y1="160" x2="868.75" y2="160" stroke="#c9d6d4" stroke-width="2"/><text x="715" y="140.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Conflict causes damage</text><circle cx="581" cy="184.72" r="4.5" fill="#2e6b62"/><text x="594" y="190" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Destroys infrastructure</text><circle cx="581" cy="213.72" r="4.5" fill="#2e6b62"/><text x="594" y="219" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Displaces people</text><circle cx="581" cy="242.72" r="4.5" fill="#2e6b62"/><text x="594" y="248" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Diverts spending to arms</text><rect x="560" y="320" width="310" height="210" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M561.25,370 L561.25,334.25 Q561.25,321.25 574.25,321.25 L855.75,321.25 Q868.75,321.25 868.75,334.25 L868.75,370 Z" fill="#b5d3cf"/><line x1="561.25" y1="370" x2="868.75" y2="370" stroke="#c9d6d4" stroke-width="2"/><text x="715" y="350.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Kaldor: "new wars"</text><text x="576" y="400" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Within states; non-state groups,</text><text x="576" y="421" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">identity politics, attacks on</text><text x="576" y="442" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">civilians, global financing.</text><text x="576" y="463" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Critics: civilians have long been</text><text x="576" y="484" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">targets.</text><rect x="30" y="550" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="586" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Dependency view</text><text x="56" y="615" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Global demand for minerals, and arms supplied by richer states, are also part of the</text><text x="56" y="637" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">cause.</text>
</svg>