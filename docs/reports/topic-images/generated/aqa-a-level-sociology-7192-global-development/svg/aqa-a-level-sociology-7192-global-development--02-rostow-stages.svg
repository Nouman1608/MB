<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Rostow’s five stages of growth (1960)</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">modernisation theory</text>
<rect x="30" y="376" width="164" height="124" rx="10" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><circle cx="112" cy="408" r="18" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="112" y="414.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="112" y="452" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Traditional</text><text x="112" y="474" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">society</text><rect x="199" y="318" width="164" height="182" rx="10" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><circle cx="281" cy="350" r="18" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="281" y="356.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="281" y="394" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Preconditions</text><text x="281" y="416" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">for take-off</text><rect x="368" y="260" width="164" height="240" rx="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="450" cy="292" r="18" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="450" y="298.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="450" y="336" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Take-off</text><rect x="537" y="202" width="164" height="298" rx="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="619" cy="234" r="18" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="619" y="240.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="619" y="278" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Drive to</text><text x="619" y="300" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">maturity</text><rect x="706" y="144" width="164" height="356" rx="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="788" cy="176" r="18" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="788" y="182.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="788" y="220" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Age of high</text><text x="788" y="242" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">mass</text><text x="788" y="264" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">consumption</text><text x="40" y="160" font-size="17" font-weight="600" fill="#8a6d0d" text-anchor="start">Western aid, investment and</text><text x="40" y="182" font-size="17" font-weight="600" fill="#8a6d0d" text-anchor="start">expertise fill the gap for take-off</text><line x1="300" y1="196" x2="372" y2="258" stroke="#8a6d0d" stroke-width="3.5" marker-end="url(#ahO)"/><rect x="30" y="522" width="840" height="119" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="558" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Evaluation</text><circle cx="61" cy="581.39" r="4.5" fill="#8a6d0d"/><text x="74" y="587" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Ethnocentric: treats Western history as the only path, and ignores colonialism</text><circle cx="61" cy="611.39" r="4.5" fill="#8a6d0d"/><text x="74" y="617" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">East Asian growth used heavy state planning, not a simple Western model</text>
</svg>