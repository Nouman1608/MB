<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 502" width="900" height="502" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="502" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How far has globalisation gone?</text>

<line x1="60" y1="120" x2="840" y2="120" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)" marker-start="url(#ah)"/><text x="60" y="106" font-size="16" font-weight="600" fill="#4a5568" text-anchor="start">globalisation is transforming everything</text><text x="840" y="106" font-size="16" font-weight="600" fill="#4a5568" text-anchor="end">globalisation is exaggerated</text><rect x="30" y="140" width="269.3333333333333" height="174" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,190 L31.25,154.25 Q31.25,141.25 44.25,141.25 L285.0833333333333,141.25 Q298.0833333333333,141.25 298.0833333333333,154.25 L298.0833333333333,190 Z" fill="#f2e7b8"/><line x1="31.25" y1="190" x2="298.0833333333333" y2="190" stroke="#c9d6d4" stroke-width="2"/><text x="164.66666666666666" y="170.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Hyperglobalists</text><text x="44" y="221.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Ohmae (1990)</text><text x="44" y="248.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The nation state is losing</text><text x="44" y="269.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">power to markets: "the</text><text x="44" y="290.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">borderless world".</text><rect x="315.3333333333333" y="140" width="269.3333333333333" height="174" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M316.5833333333333,190 L316.5833333333333,154.25 Q316.5833333333333,141.25 329.5833333333333,141.25 L570.4166666666666,141.25 Q583.4166666666666,141.25 583.4166666666666,154.25 L583.4166666666666,190 Z" fill="#d4b02e"/><line x1="316.5833333333333" y1="190" x2="583.4166666666666" y2="190" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="170.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Transformationalists</text><text x="329.3333333333333" y="221.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Held et al. (1999)</text><text x="329.3333333333333" y="248.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Real but uneven; states</text><text x="329.3333333333333" y="269.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">change role rather than</text><text x="329.3333333333333" y="290.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">disappear.</text><rect x="600.6666666666666" y="140" width="269.3333333333333" height="174" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.9166666666666,190 L601.9166666666666,154.25 Q601.9166666666666,141.25 614.9166666666666,141.25 L855.75,141.25 Q868.75,141.25 868.75,154.25 L868.75,190 Z" fill="#b5d3cf"/><line x1="601.9166666666666" y1="190" x2="868.75" y2="190" stroke="#c9d6d4" stroke-width="2"/><text x="735.3333333333333" y="170.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Sceptics</text><text x="614.6666666666666" y="221.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Hirst and Thompson (1996)</text><text x="614.6666666666666" y="248.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Most firms stay rooted in</text><text x="614.6666666666666" y="269.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">home countries; regulation</text><text x="614.6666666666666" y="290.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">is still possible.</text><text x="450" y="354" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Cultural relationships</text><rect x="30" y="370" width="385" height="106" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="222.5" y="402.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">McDonaldization (Ritzer, 1993)</text><text x="222.5" y="432.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">efficiency, calculability, predictability,</text><text x="222.5" y="453.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">control spread worldwide</text><rect x="485" y="370" width="385" height="106" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="677.5" y="402.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Critics of cultural imperialism</text><text x="677.5" y="432.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">glocalisation, and South-to-North flows</text><text x="677.5" y="453.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">such as Indian and Korean film and music</text><circle cx="450" cy="423" r="24" fill="#1e2a44"/><text x="450" y="430" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">vs</text>
</svg>