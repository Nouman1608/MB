<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 677" width="900" height="677" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="677" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Dependency and world systems</text>

<rect x="30" y="104" width="410" height="420" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="460" y="104" width="410" height="420" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="235" y="144" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Frank (1966): dependency</text><circle cx="235" cy="275" r="58" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="235" y="281" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Metropolis</text><circle cx="95" cy="197" r="38" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="95" y="202" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">Satellite</text><line x1="131.68985500392023" y1="217.44149064504126" x2="179.09164951783583" y2="243.85106187422284" stroke="#b5602e" stroke-width="4" marker-end="url(#ahR)"/><circle cx="375" cy="197" r="38" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="375" y="202" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">Satellite</text><line x1="338.31014499607977" y1="217.44149064504126" x2="290.90835048216417" y2="243.85106187422284" stroke="#b5602e" stroke-width="4" marker-end="url(#ahR)"/><circle cx="95" cy="353" r="38" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="95" y="358" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">Satellite</text><line x1="131.68985500392023" y1="332.55850935495874" x2="179.09164951783583" y2="306.1489381257772" stroke="#b5602e" stroke-width="4" marker-end="url(#ahR)"/><circle cx="375" cy="353" r="38" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="375" y="358" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">Satellite</text><line x1="338.31014499607977" y1="332.55850935495874" x2="290.90835048216417" y2="306.1489381257772" stroke="#b5602e" stroke-width="4" marker-end="url(#ahR)"/><text x="235" y="432" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">surplus flows to the metropolis</text><text x="235" y="462" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">first through colonialism, later through</text><text x="235" y="483" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">trade and debt (neo-colonialism)</text><text x="665" y="144" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Wallerstein (1974): world system</text><circle cx="665" cy="300" r="140" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><circle cx="665" cy="300" r="92" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><circle cx="665" cy="300" r="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="665" y="306" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Core</text><text x="665" y="238" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">Semi-periphery</text><text x="665" y="190" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">Periphery</text><line x1="725" y1="392" x2="695" y2="340" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)" marker-start="url(#ahT)"/><text x="665" y="470" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">countries can move between zones</text><text x="665" y="498" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">unit of analysis: the whole world economy</text><rect x="30" y="540" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="576" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Common error</text><text x="56" y="605" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Do not treat the two as identical: Wallerstein adds the semi-periphery and mobility</text><text x="56" y="627" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">between zones.</text>
</svg>