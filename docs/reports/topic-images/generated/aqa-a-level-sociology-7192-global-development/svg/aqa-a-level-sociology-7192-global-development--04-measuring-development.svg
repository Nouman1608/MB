<rect width="900" height="504" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Measuring development</text>

<rect x="30" y="104" width="253.33333333333334" height="304" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,176 L31.25,118.25 Q31.25,105.25 44.25,105.25 L269.08333333333337,105.25 Q282.08333333333337,105.25 282.08333333333337,118.25 L282.08333333333337,176 Z" fill="#f2e7b8"/><line x1="31.25" y1="176" x2="282.08333333333337" y2="176" stroke="#c9d6d4" stroke-width="2"/><text x="156.66666666666669" y="145.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">GNI / GDP per capita</text><circle cx="49" cy="201.92" r="4.5" fill="#2e6b62"/><text x="62" y="207.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Easy to compare</text><circle cx="49" cy="230.92" r="4.5" fill="#2e6b62"/><text x="62" y="236.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Hides inequality within</text><text x="62" y="257.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">a country</text><circle cx="49" cy="280.92" r="4.5" fill="#2e6b62"/><text x="62" y="286.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Ignores unpaid work</text><rect x="323.33333333333337" y="104" width="253.33333333333334" height="304" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M324.58333333333337,176 L324.58333333333337,118.25 Q324.58333333333337,105.25 337.58333333333337,105.25 L562.4166666666667,105.25 Q575.4166666666667,105.25 575.4166666666667,118.25 L575.4166666666667,176 Z" fill="#dce9e7"/><line x1="324.58333333333337" y1="176" x2="575.4166666666667" y2="176" stroke="#c9d6d4" stroke-width="2"/><text x="450.00000000000006" y="133.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Human Development</text><text x="450.00000000000006" y="158.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Index</text><text x="337.33333333333337" y="207.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">UNDP, 1990; Mahbub ul</text><text x="337.33333333333337" y="228.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Haq</text><circle cx="342.33333333333337" cy="249.92" r="4.5" fill="#2e6b62"/><text x="355.33333333333337" y="255.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Life expectancy at birth</text><circle cx="342.33333333333337" cy="278.92" r="4.5" fill="#2e6b62"/><text x="355.33333333333337" y="284.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Education: mean and</text><text x="355.33333333333337" y="305.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">expected years of</text><text x="355.33333333333337" y="326.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">schooling</text><circle cx="342.33333333333337" cy="349.92" r="4.5" fill="#2e6b62"/><text x="355.33333333333337" y="355.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">GNI per capita</text><circle cx="342.33333333333337" cy="378.92" r="4.5" fill="#2e6b62"/><text x="355.33333333333337" y="384.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Still an average</text><rect x="616.6666666666667" y="104" width="253.33333333333334" height="304" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M617.9166666666667,176 L617.9166666666667,118.25 Q617.9166666666667,105.25 630.9166666666667,105.25 L855.7500000000001,105.25 Q868.7500000000001,105.25 868.7500000000001,118.25 L868.7500000000001,176 Z" fill="#b5d3cf"/><line x1="617.9166666666667" y1="176" x2="868.7500000000001" y2="176" stroke="#c9d6d4" stroke-width="2"/><text x="743.3333333333334" y="145.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Sen (1999)</text><text x="630.6666666666667" y="207.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Development as Freedom</text><circle cx="635.6666666666667" cy="228.92" r="4.5" fill="#2e6b62"/><text x="648.6666666666667" y="234.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Judge development by the</text><text x="648.6666666666667" y="255.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">real freedoms people</text><text x="648.6666666666667" y="276.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">have</text><circle cx="635.6666666666667" cy="299.92" r="4.5" fill="#2e6b62"/><text x="648.6666666666667" y="305.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The capability approach</text><text x="648.6666666666667" y="326.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">behind the HDI</text><line x1="287.33333333333337" y1="256" x2="319.33333333333337" y2="256" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="580.6666666666667" y1="256" x2="612.6666666666667" y2="256" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="60" y1="436" x2="840" y2="436" stroke="#8a6d0d" stroke-width="4" marker-end="url(#ahO)"/><text x="450" y="468" font-size="17" font-weight="600" fill="#8a6d0d" text-anchor="middle">from a narrow economic measure to a wider view of development</text>
</svg>