<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 670" width="900" height="670" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="670" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Testing each link in a chain</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Worked example 2: the evening bus (invented data)</text>
<rect x="30" y="122" width="300" height="50" rx="25" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5" /><text x="180" y="154" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Evening bus cut in March</text><line x1="180" y1="174" x2="180" y2="198" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="202" width="300" height="50" rx="25" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" /><text x="180" y="234" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Pupils cannot get home safely</text><line x1="180" y1="254" x2="180" y2="278" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="282" width="300" height="50" rx="25" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" /><text x="180" y="314" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Homework club attendance falls</text><line x1="180" y1="334" x2="180" y2="358" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="362" width="300" height="50" rx="25" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" /><text x="180" y="394" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Coursework marks fall</text><line x1="180" y1="414" x2="180" y2="438" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="442" width="300" height="50" rx="25" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" /><text x="180" y="474" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Fewer qualify for sixth form</text><line x1="180" y1="494" x2="180" y2="518" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><rect x="30" y="522" width="300" height="50" rx="25" fill="#f6e3d8" stroke="#1e2a44" stroke-width="2.5" /><text x="180" y="554" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">“Cost the town far more”</text><rect x="380" y="246" width="490" height="54" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="390" y="277.85" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">Supported: a reason given, and data (48 → 19)</text><line x1="204" y1="273" x2="376" y2="273" stroke="#2e6b62" stroke-width="2" stroke-dasharray="4 4"/><rect x="380" y="326" width="490" height="54" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="390" y="348.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">Assumption: that the club improves marks; compare members</text><text x="390" y="368.55" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">with non-members</text><line x1="204" y1="353" x2="376" y2="353" stroke="#8a6d0d" stroke-width="2" stroke-dasharray="4 4"/><rect x="380" y="406" width="490" height="54" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="390" y="437.85" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">Plausible but not quantified: how many fewer qualify?</text><line x1="204" y1="433" x2="376" y2="433" stroke="#8a6d0d" stroke-width="2" stroke-dasharray="4 4"/><rect x="380" y="486" width="490" height="54" rx="14" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5" /><text x="390" y="517.85" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">Overstated: “far more” than £16,000, with no figure given</text><line x1="204" y1="513" x2="376" y2="513" stroke="#b5602e" stroke-width="2" stroke-dasharray="4 4"/><rect x="30" y="586" width="840" height="74.24000000000001" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" /><text x="450" y="617.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve"><tspan font-weight="700">Verdict:</tspan> plausible, first link well supported, later links assumed. Add evidence or soften to “may well</text><text x="450" y="638.72" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">cost”.</text>
</svg>