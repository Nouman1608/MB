<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 544" width="900" height="544" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="544" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Reform as a natural consequence</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Wollstonecraft, A Vindication of the Rights of Woman, 1792</text>
<rect x="30" y="122" width="840" height="88.80000000000001" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5" /><text x="450" y="159" font-size="20" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">“Strengthen the female mind by enlarging it, and there will be an end to blind</text><text x="450" y="185.4" font-size="20" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">obedience.”</text><rect x="30" y="232" width="330" height="110" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="195" y="268.68" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Cause</text><text x="195" y="296.68" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">strengthening and enlarging women’s</text><text x="195" y="317.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">minds (education)</text><line x1="366" y1="287" x2="534" y2="287" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><text x="450" y="276" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic" xml:space="preserve">“and there will be”</text><rect x="540" y="232" width="330" height="110" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" /><text x="705" y="279.24" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Effect</text><text x="705" y="307.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">an end to “blind obedience”</text><text x="450" y="372" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">A second causal claim</text><rect x="30" y="390" width="330" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="195" y="424.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">“blind obedience is ever sought for</text><text x="195" y="445.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">by power”</text><line x1="366" y1="430" x2="534" y2="430" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="540" y="390" width="330" height="80" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="705" y="421.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">those with power oppose education,</text><text x="705" y="442.72" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">because it would undermine</text><text x="705" y="463.84000000000003" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">obedience</text><text x="450" y="502" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" xml:space="preserve">Reform appears not as a favour but as the consequence of a cause readers can bring about.</text>
</svg>