<rect width="900" height="512" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Two methods, two promises</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Each needs both halves; half of either is incomplete</text>
<rect x="30" y="122" width="250" height="100" rx="14" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2.5" /><text x="155" y="156" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Story</text><text x="155" y="184" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">details about a real-life</text><text x="155" y="205.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">experience</text><text x="305" y="182" font-size="30" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">+</text><rect x="330" y="122" width="250" height="100" rx="14" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2.5" /><text x="455" y="156" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Significance</text><text x="455" y="184" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">reflection and insight on</text><text x="455" y="205.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">what it means</text><text x="605" y="182" font-size="30" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">=</text><rect x="630" y="122" width="240" height="100" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="3" /><text x="750" y="176.94" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Narration</text><text x="30" y="252" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700" fill="#b5602e">Only</tspan> <tspan font-weight="700" fill="#b5602e">half:</tspan> an anecdote the reader must interpret</text><text x="30" y="273.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">alone</text><text x="470" y="252" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700" fill="#b5602e">Only</tspan> <tspan font-weight="700" fill="#b5602e">half:</tspan> reflection with nothing to stand on</text><rect x="30" y="322" width="250" height="100" rx="14" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2.5" /><text x="155" y="356" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Links</text><text x="155" y="384" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">a cause and its effects, a</text><text x="155" y="405.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">chain, or several causes</text><text x="305" y="382" font-size="30" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">+</text><rect x="330" y="322" width="250" height="100" rx="14" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2.5" /><text x="455" y="356" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Reasoning</text><text x="455" y="384" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">evidence of how A leads to</text><text x="455" y="405.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">B</text><text x="605" y="382" font-size="30" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">=</text><rect x="630" y="322" width="240" height="100" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="3" /><text x="750" y="376.94" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Cause-effect</text><text x="30" y="452" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700" fill="#b5602e">Only</tspan> <tspan font-weight="700" fill="#b5602e">half:</tspan> asserted links a reader can doubt</text><text x="470" y="452" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700" fill="#b5602e">Only</tspan> <tspan font-weight="700" fill="#b5602e">half:</tspan> reasoning with no chain to explain</text>
</svg>