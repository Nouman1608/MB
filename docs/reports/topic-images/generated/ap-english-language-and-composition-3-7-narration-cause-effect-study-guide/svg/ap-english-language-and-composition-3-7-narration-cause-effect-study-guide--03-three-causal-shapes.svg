<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 814" width="900" height="814" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="814" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three shapes of cause-effect</text>

<rect x="30" y="96" width="840" height="230" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="50" y="128" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">1 A cause with asserted effects</text><rect x="60" y="196" width="170" height="62" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5" /><text x="145" y="231.85" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">bridge closure</text><line x1="234" y1="221" x2="330" y2="178" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="234" y1="236" x2="330" y2="268" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="336" y="148" width="190" height="62" rx="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5" /><text x="431" y="183.85" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">longer bus routes</text><rect x="336" y="238" width="190" height="62" rx="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5" /><text x="431" y="263.95" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">fewer weekday clinic</text><text x="431" y="283.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">visits</text><text x="560" y="206" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic" xml:space="preserve">“The closure of the bridge forced</text><text x="560" y="225.8" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic" xml:space="preserve">longer bus routes and reduced</text><text x="560" y="245.6" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic" xml:space="preserve">weekday visits to the clinic.”</text><rect x="30" y="340" width="840" height="200" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="50" y="372" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">2 A chain of consequences</text><rect x="50" y="400" width="170" height="62" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5" /><text x="135" y="435.85" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">later closing times</text><line x1="222" y1="431" x2="252" y2="431" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="255" y="400" width="170" height="62" rx="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5" /><text x="340" y="435.85" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">homework club falls</text><line x1="427" y1="431" x2="457" y2="431" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="460" y="400" width="170" height="62" rx="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5" /><text x="545" y="425.95" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">coursework marks</text><text x="545" y="445.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">fall</text><line x1="632" y1="431" x2="662" y2="431" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="665" y="400" width="170" height="62" rx="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5" /><text x="750" y="435.85" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">fewer qualify</text><text x="450" y="500" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic" xml:space="preserve">each effect becomes the cause of the next</text><rect x="30" y="554" width="840" height="230" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="50" y="586" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">3 A series of causes, one effect</text><rect x="60" y="600" width="190" height="50" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5" /><text x="155" y="629.85" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">rising rents</text><rect x="60" y="660" width="190" height="50" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5" /><text x="155" y="689.85" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">falling footfall</text><rect x="60" y="720" width="190" height="50" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5" /><text x="155" y="749.85" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">loss of the market</text><line x1="254" y1="624" x2="400" y2="679" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><line x1="254" y1="684" x2="400" y2="679" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><line x1="254" y1="744" x2="400" y2="679" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="406" y="648" width="200" height="62" rx="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5" /><text x="506" y="683.85" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">an empty high street</text><text x="640" y="664" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic" xml:space="preserve">“...together emptied the high</text><text x="640" y="683.8" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic" xml:space="preserve">street.”</text>
</svg>