<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Is the link convincing?</text>

<rect x="30" y="126" width="170" height="70" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5" /><text x="115" y="168" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">A</text><rect x="700" y="126" width="170" height="70" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5" /><text x="785" y="168" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">B</text><line x1="204" y1="161" x2="694" y2="161" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><circle cx="450" cy="161" r="26" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="170" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">?</text><rect x="30" y="226" width="201" height="128.28" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="42" y="251.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Evidence of the</text><text x="42" y="274.04" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">connection?</text><text x="42" y="299.63" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">a study, a pattern</text><text x="42" y="319.43" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">across cases, a</text><text x="42" y="339.23" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">mechanism</text><rect x="243" y="226" width="201" height="128.28" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="255" y="251.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Something else</text><text x="255" y="274.04" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">explain it?</text><text x="255" y="299.63" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">consider rival causes</text><rect x="456" y="226" width="201" height="128.28" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="468" y="251.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Proportionate?</text><text x="468" y="277.19" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">a small cause rarely</text><text x="468" y="296.99" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">explains a very large</text><text x="468" y="316.79" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">effect</text><rect x="669" y="226" width="201" height="128.28" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="681" y="251.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Clear about</text><text x="681" y="274.04" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">strength?</text><text x="681" y="299.63" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">match the words to the</text><text x="681" y="319.43" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">evidence</text><text x="450" y="394.28" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Degrees of certainty</text><rect x="30" y="414.28" width="270" height="52" rx="26" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" /><text x="165" y="447.28" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">“may have led to”</text><rect x="315" y="414.28" width="270" height="52" rx="26" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5" /><text x="450" y="447.28" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">“contributed to”</text><rect x="600" y="414.28" width="270" height="52" rx="26" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5" /><text x="735" y="447.28" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">“caused”</text><line x1="40" y1="490.28" x2="860" y2="490.28" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="450" y="516.28" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle" xml:space="preserve">stronger claim: needs stronger evidence</text>
