<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 442" width="900" height="442" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="442" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A story that shows a chain</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Narration and cause-effect together</text>
<rect x="30" y="122" width="195" height="80" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="127.5" y="167.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">the bus was late</text><line x1="227" y1="162" x2="243" y2="162" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="235" y="226" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic" xml:space="preserve">because</text><rect x="245" y="122" width="195" height="80" rx="14" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2.5" /><text x="342.5" y="167.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">I missed the interview</text><line x1="442" y1="162" x2="458" y2="162" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="450" y="226" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic" xml:space="preserve">because</text><rect x="460" y="122" width="195" height="80" rx="14" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2.5" /><text x="557.5" y="156.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">the job went to</text><text x="557.5" y="177.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">someone else</text><line x1="657" y1="162" x2="673" y2="162" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="675" y="122" width="195" height="80" rx="14" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2.5" /><text x="772.5" y="156.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">a timetable decided</text><text x="772.5" y="177.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">my year</text><line x1="30" y1="252" x2="870" y2="252" stroke="#c9d6d4" stroke-width="2" stroke-dasharray="6 6"/><text x="450" y="282" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">Reflection states the general claim</text><rect x="80" y="298" width="740" height="86.16000000000003" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="3" /><text x="450" y="334.15" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">“Unreliable buses do not only waste time; they change the course of</text><text x="450" y="359.22999999999996" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">people’s lives.”</text>
</svg>