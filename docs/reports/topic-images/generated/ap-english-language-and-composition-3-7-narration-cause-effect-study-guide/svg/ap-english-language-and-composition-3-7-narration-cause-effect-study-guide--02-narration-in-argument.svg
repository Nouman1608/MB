<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 654" width="900" height="654" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="654" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Narration in an argument</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Features that make it work, and where it works best</text>
<rect x="30" y="122" width="840" height="41.120000000000005" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><rect x="30" y="122" width="10" height="41.120000000000005" rx="5" fill="#d4b02e"/><text x="42" y="147.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700">Specific</tspan> <tspan font-weight="700">detail:</tspan> “On 14 January, a Tuesday, I waited forty minutes at the Harbour Road stop...”</text><rect x="30" y="171.12" width="840" height="41.120000000000005" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><rect x="30" y="171.12" width="10" height="41.120000000000005" rx="5" fill="#d4b02e"/><text x="42" y="196.72" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700">Selection:</tspan> the weather affects the wait, so it stays; the colour of the pushchair goes</text><rect x="30" y="220.24" width="840" height="41.120000000000005" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><rect x="30" y="220.24" width="10" height="41.120000000000005" rx="5" fill="#d4b02e"/><text x="42" y="245.84" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700">Sequence:</tspan> “First... then... by the time the bus came...”</text><rect x="30" y="269.36" width="840" height="41.120000000000005" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><rect x="30" y="269.36" width="10" height="41.120000000000005" rx="5" fill="#d4b02e"/><text x="42" y="294.96000000000004" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700">Perspective:</tspan> “I did not know then that...”</text><rect x="30" y="318.48" width="840" height="41.120000000000005" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><rect x="30" y="318.48" width="10" height="41.120000000000005" rx="5" fill="#2e6b62"/><text x="42" y="344.08000000000004" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700">Reflection:</tspan> “...a timetable is a promise, and ours is broken.”</text><text x="450" y="391.6" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Where narration works best in an argument</text><rect x="30" y="443.6" width="840" height="20" rx="10" fill="#c9d6d4" stroke="#c9d6d4" stroke-width="2.5" /><rect x="50" y="439.6" width="140" height="28" rx="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2" /><text x="120" y="495.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve"><tspan font-weight="700">Open</tspan></text><text x="120" y="517.6" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" xml:space="preserve">make an abstract issue</text><text x="120" y="537.4" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" xml:space="preserve">human</text><rect x="380" y="439.6" width="140" height="28" rx="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2" /><text x="450" y="495.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve"><tspan font-weight="700">Illustrate</tspan></text><text x="450" y="517.6" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" xml:space="preserve">a claim midway</text><rect x="710" y="439.6" width="140" height="28" rx="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2" /><text x="780" y="495.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve"><tspan font-weight="700">Close</tspan></text><text x="780" y="517.6" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" xml:space="preserve">return to the opening story</text><text x="780" y="537.4" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" xml:space="preserve">with new understanding</text><rect x="30" y="563.6" width="840" height="74.24000000000001" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="450" y="595.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Narration builds pathos and ethos (the writer was there) but should not replace evidence: a sceptical</text><text x="450" y="616.32" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">audience usually wants a story <tspan font-weight="700">and</tspan> data.</text>
</svg>