<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 669" width="900" height="669" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="669" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Two causes of drought</text>

<rect x="30" y="110" width="400" height="130" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="144.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Lack of rain</text><text x="48" y="177.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">rainfall well below normal for a long</text><text x="48" y="198.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">period: wet-season rains arrive late, end</text><text x="48" y="219.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">early or fail</text><rect x="470" y="110" width="400" height="56" rx="12" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.5"/><text x="670" y="143.1" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Climate change</text><rect x="470" y="190" width="190" height="130" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="482" y="225.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Higher global</text><text x="482" y="246.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">temperatures</text><text x="482" y="275.26" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">more evaporation and</text><text x="482" y="295.26" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">transpiration</text><rect x="680" y="190" width="190" height="130" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="692" y="215.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">More extreme</text><text x="692" y="236.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">weather events</text><text x="692" y="265.26" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">longer, more intense</text><text x="692" y="285.26" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">dry spells and</text><text x="692" y="305.26" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">heatwaves</text><line x1="565" y1="166" x2="565" y2="184" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="775" y1="166" x2="775" y2="184" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="230" y1="244" x2="330" y2="344" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><line x1="565" y1="324" x2="520" y2="344" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><line x1="775" y1="324" x2="580" y2="344" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="200" y="350" width="500" height="109" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="382.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Water stores not refilled or dry out</text><text x="450" y="406.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">faster</text><text x="450" y="438.82" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">rivers, soil moisture, reservoirs and ground water</text><line x1="450" y1="463" x2="450" y2="499" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="300" y="505" width="300" height="56" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="538.16" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Drought</text><rect x="30" y="585" width="840" height="53" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" stroke-dasharray="8 6"/><text x="450" y="615.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Human water use is not a named cause, but over-pumped aquifers make the impacts worse.</text>
</svg>