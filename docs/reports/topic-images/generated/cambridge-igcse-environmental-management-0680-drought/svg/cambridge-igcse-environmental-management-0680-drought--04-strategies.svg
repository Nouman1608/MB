"539" y2="236" stroke="#2b5a9a" stroke-width="3"/><line x1="580" y1="200" x2="574" y2="224" stroke="#2b5a9a" stroke-width="3"/><line x1="610" y1="212" x2="604" y2="236" stroke="#2b5a9a" stroke-width="3"/><text x="560" y="178" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">3 Rainwater harvesting</text><path d="M720,400 L868,400 L868,548 L700,548 Z" fill="#b5d3cf"/><line x1="720" y1="400" x2="868" y2="400" stroke="#2e6b62" stroke-width="2.5"/><text x="800" y="440" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="middle">sea</text><rect x="690" y="330" width="90" height="70" rx="0" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="735" y="370" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">plant</text><line x1="830" y1="420" x2="785" y2="370" stroke="#2b5a9a" stroke-width="3.5" marker-end="url(#ah)"/><line x1="686" y1="365" x2="650" y2="365" stroke="#2b5a9a" stroke-width="3" marker-end="url(#ah)"/><text x="780" y="280" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">4 Desalination</text><text x="780" y="301" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">removes salt</text><text x="858" y="540" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">Not to scale</text><text x="450" y="590" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">The other four strategies</text><rect x="30" y="606" width="201" height="130" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="42" y="631.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Monitoring and</text><text x="42" y="652.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">warning</text><text x="42" y="681.26" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">rainfall, rivers,</text><text x="42" y="701.26" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">reservoirs, soil</text><text x="42" y="721.26" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">moisture, satellites</text><rect x="243" y="606" width="201" height="130" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="255" y="651.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Emergency supplies</text><text x="255" y="680.76" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">tankers, bottled</text><text x="255" y="700.76" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">water, standpipes</text><rect x="456" y="606" width="201" height="130" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="468" y="641.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Water conservation</text><text x="468" y="670.76" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">bans, fixing leaks,</text><text x="468" y="690.76" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">drip irrigation,</text><text x="468" y="710.76" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">greywater</text><rect x="669" y="606" width="201" height="130" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="681" y="651.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">International aid</text><text x="681" y="680.76" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">food, water, money,</text><text x="681" y="700.76" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">medical help</text>
