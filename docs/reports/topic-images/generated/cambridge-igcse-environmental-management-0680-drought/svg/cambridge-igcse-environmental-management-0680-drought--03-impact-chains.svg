<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 725" width="900" height="725" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="725" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Impacts of drought as chains</text>

<rect x="330" y="110" width="240" height="58" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="143.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Lack of water</text><rect x="330" y="210" width="240" height="58" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="233.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Crops fail, livestock</text><text x="450" y="254.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">die</text><line x1="450" y1="176" x2="450" y2="206" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="330" y="302" width="240" height="58" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="325.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Food prices rise,</text><text x="450" y="346.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">stores run out</text><line x1="450" y1="268" x2="450" y2="298" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="330" y="394" width="240" height="58" rx="12" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="427.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Famine</text><line x1="450" y1="360" x2="450" y2="390" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="330" y="486" width="240" height="58" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="509.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Malnutrition and</text><text x="450" y="530.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">migration</text><line x1="450" y1="452" x2="450" y2="482" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><polyline points="330,137 140,137 140,204" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="30" y="210" width="220" height="58" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="140" y="243.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Dry, bare soil</text><line x1="140" y1="268" x2="140" y2="298" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="302" width="220" height="58" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="140" y="335.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Soil erosion</text><line x1="140" y1="360" x2="140" y2="390" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="394" width="220" height="58" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="140" y="427.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Desertification</text><polyline points="570,137 760,137 760,204" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="650" y="210" width="220" height="58" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="760" y="243.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Dry vegetation</text><line x1="760" y1="268" x2="760" y2="298" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="650" y="302" width="220" height="58" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="760" y="335.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Wildfires</text><line x1="760" y1="360" x2="760" y2="390" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="650" y="394" width="220" height="58" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="760" y="427.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Poorer air quality</text><line x1="760" y1="452" x2="760" y2="482" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="650" y="486" width="220" height="58" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="760" y="519.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Breathing problems</text><text x="140" y="492" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">dust from dry soil also</text><text x="140" y="512" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">lowers air quality</text><rect x="30" y="600" width="840" height="95" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="630.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Also: water sources dry up; loss of habitats and death of organisms; financial losses (farm</text><text x="48" y="651.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">income, food prices, hydro-electric output); health from dehydration, malnutrition and unsafe</text><text x="48" y="672.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">water.</text>
</svg>