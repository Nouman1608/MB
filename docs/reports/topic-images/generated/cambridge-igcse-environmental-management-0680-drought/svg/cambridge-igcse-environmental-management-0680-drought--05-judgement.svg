<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 676" width="900" height="676" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="676" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Building a judgement on drought strategies</text>

<rect x="30" y="110" width="840" height="130" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="54" y="148" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Cheap, and work everywhere</text><rect x="54" y="183" width="189.6" height="30" rx="15" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="148.8" y="203.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Water conservation</text><rect x="255.6" y="183" width="226.39999999999998" height="30" rx="15" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="368.79999999999995" y="203.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Monitoring and warning</text><rect x="30" y="260" width="840" height="130" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="54" y="298" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Cost more, but longer-term security</text><rect x="54" y="333" width="198.79999999999998" height="30" rx="15" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="153.39999999999998" y="353.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Dams and reservoirs</text><rect x="264.79999999999995" y="333" width="189.6" height="30" rx="15" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="359.59999999999997" y="353.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Aquifers and wells</text><rect x="466.4" y="333" width="134.39999999999998" height="30" rx="15" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="533.5999999999999" y="353.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Desalination</text><rect x="612.8" y="333" width="208" height="30" rx="15" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="716.8" y="353.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Rainwater harvesting</text><rect x="30" y="410" width="840" height="130" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="54" y="448" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Last resort when a drought becomes a famine</text><rect x="54" y="483" width="180.39999999999998" height="30" rx="15" fill="#ffffff" stroke="#8a6d0d" stroke-width="2"/><text x="144.2" y="503.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">International aid</text><rect x="30" y="570" width="840" height="76" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="601.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">No single strategy is enough. For each one, give a benefit, a limitation and the</text><text x="48" y="623.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">situation it suits: desalination, for example, only for wealthy coastal areas.</text>
</svg>