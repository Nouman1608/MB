<rect width="900" height="742" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Drought is measured against normal</text>

<rect x="30" y="110" width="410" height="470" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="235" y="148" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Desert</text><line x1="80" y1="450" x2="390" y2="450" stroke="#1e2a44" stroke-width="2.5"/><rect x="110" y="390" width="100" height="60" rx="0" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" stroke-dasharray="8 6"/><rect x="260" y="395" width="100" height="55" rx="0" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="160" y="478" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">normal</text><text x="310" y="478" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">this year</text><rect x="60" y="500" width="350" height="64" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="235" y="522.32" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Not a drought</text><text x="235" y="554.32" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">dry, but close to its normal</text><rect x="460" y="110" width="410" height="470" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="665" y="148" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Rainforest region</text><line x1="510" y1="450" x2="820" y2="450" stroke="#1e2a44" stroke-width="2.5"/><rect x="540" y="180" width="100" height="270" rx="0" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" stroke-dasharray="8 6"/><rect x="690" y="330" width="100" height="120" rx="0" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="590" y="478" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">normal</text><text x="740" y="478" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">this year</text><rect x="490" y="500" width="350" height="64" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="665" y="522.32" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Drought</text><text x="665" y="554.32" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">well below its own normal</text><line x1="520" y1="390" x2="800" y2="390" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="6 6"/><text x="806" y="386" font-size="15" font-weight="600" fill="#b5602e" text-anchor="start">desert’s</text><text x="806" y="404" font-size="15" font-weight="600" fill="#b5602e" text-anchor="start">normal</text><text x="450" y="612" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Bar heights are illustrative: rainfall in a year.</text><rect x="30" y="630" width="840" height="82" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="662.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Drought: a period of dry weather that is longer or more severe than</text><text x="450" y="687.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">normal.</text>
</svg>