<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 528" width="900" height="528" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="528" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Rainwater harvesting in numbers</text>

<rect x="30" y="120" width="196" height="190" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="156" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Rain on the roof</text><text x="128" y="210" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">0.6 m × 50 m²</text><text x="128" y="270" font-size="26" font-weight="700" fill="#2e6b62" text-anchor="middle">30 m³</text><line x1="227" y1="215" x2="242" y2="215" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="244" y="120" width="196" height="190" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="342" y="156" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Collected (80%)</text><text x="342" y="210" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">30 × 0.80</text><text x="342" y="270" font-size="26" font-weight="700" fill="#2e6b62" text-anchor="middle">24 m³</text><line x1="441" y1="215" x2="456" y2="215" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="458" y="120" width="196" height="190" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="556" y="156" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">In litres</text><text x="556" y="210" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">24 × 1,000</text><text x="556" y="270" font-size="26" font-weight="700" fill="#2e6b62" text-anchor="middle">24,000 L</text><line x1="655" y1="215" x2="670" y2="215" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="672" y="120" width="196" height="190" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="770" y="156" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Days it lasts</text><text x="770" y="210" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">24,000 ÷ 100</text><text x="770" y="270" font-size="26" font-weight="700" fill="#2e6b62" text-anchor="middle">240 days</text><text x="450" y="350" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Family of five × 20 litres each per day = 100 litres a day</text><rect x="30" y="380" width="840" height="108" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="412.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The limitation is in the numbers</text><text x="48" y="444.82" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">If the year’s rain falls to 300 mm, the store halves to 12,000 litres, just when it is</text><text x="48" y="466.82" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">needed most. Rainwater harvesting collects nothing during the drought itself.</text><text x="450" y="514" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Invented figures: roof 50 m², 600 mm of rain a year.</text>
</svg>