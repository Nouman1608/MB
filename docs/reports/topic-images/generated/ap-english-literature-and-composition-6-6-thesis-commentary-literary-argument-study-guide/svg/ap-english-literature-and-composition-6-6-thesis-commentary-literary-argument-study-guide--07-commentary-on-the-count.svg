<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 807" width="900" height="807" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="807" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: commentary on the count</text>

<rect x="30" y="110" width="840" height="115" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="143" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">EVIDENCE</text><text x="50" y="175.4" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">She "stood a long while counting on her fingers the panes that wanted glazing, and the</text><text x="50" y="199.4" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">desks that wanted mending, and the winter that was coming."</text><rect x="30" y="265" width="250" height="133" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="298" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">WEAK</text><text x="50" y="329.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"This shows that she is</text><text x="50" y="351.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">worried about the</text><text x="50" y="373.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">school."</text><text x="40" y="424" font-size="16" font-weight="400" fill="#b5602e" text-anchor="start">Restates the evidence in</text><text x="40" y="445" font-size="16" font-weight="400" fill="#b5602e" text-anchor="start">softer words; goes no further</text><line x1="155" y1="231" x2="155" y2="259" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)" stroke-dasharray="8 6"/><line x1="580" y1="231" x2="580" y2="259" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="310" y="265" width="560" height="89" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="330" y="298" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">1 INTERPRET</text><text x="330" y="329.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">She knows exactly what the school lacks</text><line x1="590" y1="358" x2="590" y2="378" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="310" y="384" width="560" height="111" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="330" y="417" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">2 EXPLAIN HOW</text><text x="330" y="448.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Specific items; two "that wanted" clauses build to "the</text><text x="330" y="470.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">winter that was coming"; "long" shows she does not hurry</text><line x1="590" y1="499" x2="590" y2="519" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="310" y="525" width="560" height="111" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="330" y="558" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">3 CONNECT TO THE CLAIM</text><text x="330" y="589.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Contrasts with the folded hands of her refusal: it costs</text><text x="330" y="611.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">her something she can count</text><line x1="590" y1="640" x2="590" y2="660" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="310" y="666" width="560" height="111" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="330" y="699" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">4 CONNECT TO THE THESIS</text><text x="330" y="730.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Refusing with full knowledge makes independence a</text><text x="330" y="752.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">sacrifice, not pride</text>
</svg>