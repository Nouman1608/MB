<rect width="900" height="610" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Self-assessment: from 1 to 3</text>

<rect x="274" y="110" width="192" height="44" rx="10" fill="#1e2a44"/><text x="370" y="139" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">1  not yet</text><rect x="474" y="110" width="192" height="44" rx="10" fill="#1e2a44"/><text x="570" y="139" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><rect x="674" y="110" width="192" height="44" rx="10" fill="#1e2a44"/><text x="770" y="139" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">3  secure</text><line x1="290" y1="172" x2="850" y2="172" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><text x="34" y="219" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Thesis makes an</text><text x="34" y="241" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">interpretive claim</text><rect x="274" y="188" width="192" height="64" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="370" y="225.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Summarises or lists</text><rect x="474" y="188" width="192" height="64" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="570" y="225.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">States a general idea</text><rect x="674" y="188" width="192" height="64" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="770" y="215" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Specific, defensible</text><text x="770" y="236" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">interpretation</text><text x="34" y="300.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Thesis responds to the</text><text x="34" y="322.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">question</text><rect x="274" y="260" width="192" height="83" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="370" y="307" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Repeats the prompt</text><rect x="474" y="260" width="192" height="83" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="570" y="307" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Partly responds</text><rect x="674" y="260" width="192" height="83" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="770" y="286" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Directly answers in a</text><text x="770" y="307" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">way the text can</text><text x="770" y="328" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">support</text><text x="34" y="382" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Claims form a line of</text><text x="34" y="404" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">reasoning</text><rect x="274" y="351" width="192" height="64" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="370" y="388.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">A list</text><rect x="474" y="351" width="192" height="64" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="570" y="388.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Some logic</text><rect x="674" y="351" width="192" height="64" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="770" y="378" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Each claim builds on</text><text x="770" y="399" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">the last</text><text x="34" y="454" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Evidence is specific and</text><text x="34" y="476" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">relevant</text><rect x="274" y="423" width="192" height="64" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="370" y="460.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">General references</text><rect x="474" y="423" width="192" height="64" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="570" y="450" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Quoted but loosely</text><text x="570" y="471" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">linked</text><rect x="674" y="423" width="192" height="64" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="770" y="450" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Precise and clearly</text><text x="770" y="471" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">linked</text><text x="34" y="535.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Commentary explains</text><text x="34" y="557.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">how</text><rect x="274" y="495" width="192" height="83" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="370" y="542" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Restates the evidence</text><rect x="474" y="495" width="192" height="83" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="570" y="531.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Interprets without</text><text x="570" y="552.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">explaining how</text><rect x="674" y="495" width="192" height="83" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="770" y="521" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Interprets, explains</text><text x="770" y="542" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">how, connects to the</text><text x="770" y="563" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">thesis</text>
</svg>