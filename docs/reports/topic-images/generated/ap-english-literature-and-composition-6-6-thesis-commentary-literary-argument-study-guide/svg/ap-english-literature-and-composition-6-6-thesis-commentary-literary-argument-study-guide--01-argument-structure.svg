<rect width="900" height="705" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How a literary argument is built</text>

<rect x="260" y="110" width="380" height="117" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="143" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">THESIS</text><text x="450" y="171.8" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">An interpretive claim that needs</text><text x="450" y="199.8" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">a defence</text><text x="30" y="140" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">line of reasoning:</text><text x="30" y="161" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">claims in a logical</text><text x="30" y="182" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">sequence</text><line x1="162" y1="289" x2="320.4" y2="235" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><rect x="30" y="297" width="264" height="120" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="330" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CLAIM 1</text><text x="50" y="358" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">A topic claim</text><text x="50" y="386.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">something that needs proof</text><line x1="298" y1="357" x2="314" y2="357" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="162" y1="479" x2="162" y2="425" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="174" y="455" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start" font-style="italic">commentary</text><rect x="30" y="487" width="264" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="520" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EVIDENCE</text><text x="50" y="550.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">details from the text</text><line x1="450" y1="289" x2="450" y2="235" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><rect x="318" y="297" width="264" height="120" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="338" y="330" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CLAIM 2</text><text x="338" y="358" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">A topic claim</text><text x="338" y="386.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">something that needs proof</text><line x1="586" y1="357" x2="602" y2="357" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="450" y1="479" x2="450" y2="425" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="462" y="455" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start" font-style="italic">commentary</text><rect x="318" y="487" width="264" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="338" y="520" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EVIDENCE</text><text x="338" y="550.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">details from the text</text><line x1="738" y1="289" x2="579.6" y2="235" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><rect x="606" y="297" width="264" height="120" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="626" y="330" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CLAIM 3</text><text x="626" y="358" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">A topic claim</text><text x="626" y="386.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">something that needs proof</text><line x1="738" y1="479" x2="738" y2="425" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="750" y="455" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start" font-style="italic">commentary</text><rect x="606" y="487" width="264" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="626" y="520" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EVIDENCE</text><text x="626" y="550.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">details from the text</text><rect x="30" y="597" width="840" height="78" rx="14" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="629" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="start">Commentary</text><text x="170" y="629" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">explains how the evidence supports each claim,</text><text x="50" y="655" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">and how the claims together support the thesis.</text>
</svg>