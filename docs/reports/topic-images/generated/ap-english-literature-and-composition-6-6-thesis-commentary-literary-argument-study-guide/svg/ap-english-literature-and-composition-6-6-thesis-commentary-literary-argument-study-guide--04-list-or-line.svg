<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 818" width="900" height="818" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="818" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A list of points or a line of reasoning?</text>

<rect x="30" y="110" width="840" height="200" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="146" font-size="21" font-weight="700" fill="#b5602e" text-anchor="start">A list</text><text x="140" y="146" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">could be reordered without changing anything</text><rect x="50" y="178" width="248" height="70" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="174" y="219.3" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">A soliloquy</text><text x="310" y="222" font-size="22" font-weight="700" fill="#b5602e" text-anchor="middle">⇄</text><rect x="322" y="178" width="248" height="70" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="446" y="207.3" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">A quotation about</text><text x="446" y="231.3" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">blood</text><text x="582" y="222" font-size="22" font-weight="700" fill="#b5602e" text-anchor="middle">⇄</text><rect x="594" y="178" width="248" height="70" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="718" y="219.3" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">Another scene</text><text x="450" y="288" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">First... Second... Third...</text><rect x="30" y="350" width="840" height="330" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="388" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="start">A line</text><text x="140" y="388" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">each claim builds on the one before</text><rect x="50" y="550" width="248" height="84" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="174" y="586.95" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Macbeth's conscience is</text><text x="174" y="608.95" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">established</text><path d="M174,550 L174,520 L318,520" fill="none" stroke="#2e6b62" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahT)"/><rect x="322" y="480" width="248" height="84" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="446" y="516.95" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">It is overruled by</text><text x="446" y="538.95" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">ambition</text><path d="M446,480 L446,450 L590,450" fill="none" stroke="#2e6b62" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahT)"/><rect x="594" y="410" width="248" height="84" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="718" y="446.95" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">The consequences show</text><text x="718" y="468.95" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">betrayal, not ignorance</text><rect x="30" y="704" width="840" height="84" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="738" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Test each claim:</text><text x="450" y="766" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">Why does it come here, and what does it add to the one before?</text>
</svg>