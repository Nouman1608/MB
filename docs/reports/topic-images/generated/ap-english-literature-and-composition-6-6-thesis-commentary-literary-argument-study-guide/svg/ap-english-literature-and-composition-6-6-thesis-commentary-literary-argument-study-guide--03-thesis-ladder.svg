<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 694" width="900" height="694" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="694" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Weak to strong: a thesis ladder</text>

<rect x="30" y="110" width="840" height="80" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="70" cy="150" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="70" y="157.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="110" y="140" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"In Macbeth, Macbeth kills Duncan against his own better</text><text x="110" y="162" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">judgement."</text><line x1="630" y1="124" x2="630" y2="176" stroke="#c9d6d4" stroke-width="2"/><text x="650" y="145" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">Fact about the plot;</text><text x="650" y="166" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">no interpretation</text><rect x="30" y="202" width="840" height="80" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="70" cy="242" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="70" y="249.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="110" y="232" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"Shakespeare uses soliloquy, imagery and the witches to</text><text x="110" y="254" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">show Macbeth's inconsistency."</text><line x1="630" y1="216" x2="630" y2="268" stroke="#c9d6d4" stroke-width="2"/><text x="650" y="237" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">Lists devices; no</text><text x="650" y="258" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">claim about meaning</text><rect x="30" y="294" width="840" height="80" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="70" cy="334" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="70" y="341.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="110" y="324" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"In Macbeth, Shakespeare shows that people can know what</text><text x="110" y="346" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">is right and still do wrong."</text><line x1="630" y1="308" x2="630" y2="360" stroke="#c9d6d4" stroke-width="2"/><text x="650" y="329" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">A claim, but general:</text><text x="650" y="350" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">fits many works</text><rect x="30" y="390" width="840" height="274" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><circle cx="70" cy="426" r="22" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="70" y="433.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="110" y="433" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Defensible, specific, previews a line of reasoning, says what it means</text><rect x="110" y="454" width="740" height="58" rx="10" fill="#ffffff" stroke="#2e6b62" stroke-width="1.5"/><text x="126" y="478" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"...gives the hero a conscience that argues clearly against</text><text x="126" y="500" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">his crime"</text><text x="668" y="479" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">CLAIM ABOUT THE</text><text x="668" y="499" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">WORK'S CHOICE</text><rect x="110" y="522" width="740" height="36" rx="10" fill="#ffffff" stroke="#2e6b62" stroke-width="1.5"/><text x="126" y="546" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"...and then lets ambition overrule it"</text><text x="668" y="545" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">DIRECTION</text><rect x="110" y="568" width="740" height="80" rx="10" fill="#ffffff" stroke="#2e6b62" stroke-width="1.5"/><text x="126" y="592" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"...presents evil not as ignorance of the good but as a</text><text x="126" y="614" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">betrayal of it, and so makes tragedy a matter of</text><text x="126" y="636" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">self-division."</text><text x="668" y="613" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">SIGNIFICANCE</text>
</svg>