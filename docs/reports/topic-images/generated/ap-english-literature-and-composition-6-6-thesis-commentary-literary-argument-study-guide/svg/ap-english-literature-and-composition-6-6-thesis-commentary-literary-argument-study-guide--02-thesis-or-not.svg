<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 576" width="900" height="576" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="576" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What a thesis is, and is not</text>

<rect x="30" y="110" width="405" height="400" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="465" y="110" width="405" height="400" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="232" y="150" font-size="22" font-weight="700" fill="#b5602e" text-anchor="middle">Not a thesis</text><text x="667" y="150" font-size="22" font-weight="700" fill="#2e6b62" text-anchor="middle">A strong thesis</text><circle cx="66" cy="198" r="15" fill="#ffffff" stroke="#b5602e" stroke-width="3"/><path d="M59,191 l14,14 M73,191 l-14,14" fill="none" stroke="#b5602e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="94" y="194" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Summary</text><text x="94" y="218" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">retells events</text><circle cx="66" cy="264" r="15" fill="#ffffff" stroke="#b5602e" stroke-width="3"/><path d="M59,257 l14,14 M73,257 l-14,14" fill="none" stroke="#b5602e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="94" y="260" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Fact</text><text x="94" y="284" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">not open to dispute</text><circle cx="66" cy="330" r="15" fill="#ffffff" stroke="#b5602e" stroke-width="3"/><path d="M59,323 l14,14 M73,323 l-14,14" fill="none" stroke="#b5602e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="94" y="326" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Topic</text><text x="94" y="350" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">no claim</text><circle cx="66" cy="396" r="15" fill="#ffffff" stroke="#b5602e" stroke-width="3"/><path d="M59,389 l14,14 M73,389 l-14,14" fill="none" stroke="#b5602e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="94" y="392" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">List of devices</text><text x="94" y="416" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">names tools, not what they do</text><circle cx="66" cy="462" r="15" fill="#ffffff" stroke="#b5602e" stroke-width="3"/><path d="M59,455 l14,14 M73,455 l-14,14" fill="none" stroke="#b5602e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="94" y="458" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Restating the prompt</text><text x="94" y="482" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">does not respond to the work</text><circle cx="501" cy="198" r="15" fill="#2e6b62"/><path d="M493,198 l6,6 l11,-12" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><text x="529" y="204" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">Makes a claim about meaning or</text><text x="529" y="226" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">function</text><circle cx="501" cy="264" r="15" fill="#2e6b62"/><path d="M493,264 l6,6 l11,-12" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><text x="529" y="270" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">Is defensible: a reader could</text><text x="529" y="292" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">disagree</text><circle cx="501" cy="330" r="15" fill="#2e6b62"/><path d="M493,330 l6,6 l11,-12" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><text x="529" y="336" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">Is specific to this work</text><circle cx="501" cy="396" r="15" fill="#2e6b62"/><path d="M493,396 l6,6 l11,-12" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><text x="529" y="402" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">Responds to the question asked</text><circle cx="501" cy="462" r="15" fill="#2e6b62"/><path d="M493,462 l6,6 l11,-12" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><text x="529" y="468" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">Says why it matters ("so what")</text><text x="450" y="550" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">A thesis may preview its line of reasoning; it need not list points, devices or evidence.</text>
</svg>