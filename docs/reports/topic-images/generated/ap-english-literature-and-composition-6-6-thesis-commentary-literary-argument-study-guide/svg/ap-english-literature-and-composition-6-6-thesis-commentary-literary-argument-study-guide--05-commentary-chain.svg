<rect width="900" height="732" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Commentary in four moves</text>

<text x="130" y="116" font-size="16" font-weight="700" fill="#4a5568" text-anchor="middle">EVIDENCE</text><line x1="130" y1="126" x2="130" y2="154" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="160" width="840" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="72" cy="208" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="72" y="216.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="116" y="200" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Interpret</text><text x="116" y="228" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Say what the evidence shows</text><line x1="530" y1="176" x2="530" y2="240" stroke="#c9d6d4" stroke-width="2"/><text x="552" y="198" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">signal words</text><text x="552" y="224" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"suggests", "reveals", "implies"</text><line x1="72" y1="260" x2="72" y2="282" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="286" width="840" height="114" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="72" cy="343" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="72" y="351.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="116" y="326" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Explain how</text><text x="116" y="354" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Point to the words or choices that produce</text><text x="116" y="376" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">the meaning</text><line x1="530" y1="302" x2="530" y2="384" stroke="#c9d6d4" stroke-width="2"/><text x="552" y="324" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">signal words</text><text x="552" y="350" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"the verb", "the repetition", "the</text><text x="552" y="372" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">placement"</text><line x1="72" y1="404" x2="72" y2="426" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="430" width="840" height="108" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="72" cy="484" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="72" y="492.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="116" y="470" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Connect to the claim</text><text x="116" y="498" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Show how this supports the topic claim</text><line x1="530" y1="446" x2="530" y2="522" stroke="#c9d6d4" stroke-width="2"/><text x="552" y="468" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">signal words</text><text x="552" y="494" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"so", "which supports", "this</text><text x="552" y="516" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">matters because"</text><line x1="72" y1="542" x2="72" y2="564" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="568" width="840" height="108" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><circle cx="72" cy="622" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="72" y="630.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="116" y="608" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Connect to the thesis</text><text x="116" y="636" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Say how it moves the whole argument forward</text><line x1="530" y1="584" x2="530" y2="660" stroke="#c9d6d4" stroke-width="2"/><text x="552" y="606" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">signal words</text><text x="552" y="632" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"this deepens", "thereby", "which</text><text x="552" y="654" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">shows that"</text><line x1="72" y1="680" x2="72" y2="702" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="100" y="702" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">THESIS</text>
</svg>