<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 723" width="900" height="723" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="723" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: four thesis drafts</text>

<rect x="30" y="110" width="840" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="151" font-size="18" font-weight="700" fill="#4a5568" text-anchor="start">Draft 1</text><text x="150" y="151" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"Miss Tarrant refuses the Squire's gift."</text><circle cx="640" cy="145" r="13" fill="#ffffff" stroke="#b5602e" stroke-width="3"/><path d="M634,139 l12,12 M646,139 l-12,12" fill="none" stroke="#b5602e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="664" y="140" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">Fact and plot: cannot be</text><text x="664" y="161" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">defended</text><rect x="30" y="192" width="840" height="78" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="237" font-size="18" font-weight="700" fill="#4a5568" text-anchor="start">Draft 2</text><text x="150" y="226" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"The author uses speech, gesture and counting to show</text><text x="150" y="248" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">Miss Tarrant's feelings."</text><circle cx="640" cy="231" r="13" fill="#ffffff" stroke="#b5602e" stroke-width="3"/><path d="M634,225 l12,12 M646,225 l-12,12" fill="none" stroke="#b5602e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="664" y="226" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">Lists devices; no claim</text><text x="664" y="247" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">about meaning</text><rect x="30" y="282" width="840" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="323" font-size="18" font-weight="700" fill="#4a5568" text-anchor="start">Draft 3</text><text x="150" y="323" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"Miss Tarrant is a hypocrite."</text><circle cx="640" cy="317" r="13" fill="#ffffff" stroke="#b5602e" stroke-width="3"/><path d="M634,311 l12,12 M646,311 l-12,12" fill="none" stroke="#b5602e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="664" y="312" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">A label; the evidence of</text><text x="664" y="333" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">cost resists it</text><rect x="30" y="384" width="840" height="139" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="417" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DRAFT 4 (STRONG)</text><text x="50" y="449.4" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"By setting Miss Tarrant's composed public refusal beside her private count of the school's</text><text x="50" y="473.4" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">needs, the narrator presents her principle as a decision made with open eyes and at real</text><text x="50" y="497.4" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">cost, and so makes independence in the novel a matter of sacrifice rather than pride."</text><text x="450" y="563" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">The line it previews</text><rect x="30" y="579" width="249.33333333333334" height="84" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="154.66666666666669" y="625.4" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">Public refusal</text><line x1="285.33333333333337" y1="621" x2="319.33333333333337" y2="621" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="325.33333333333337" y="579" width="249.33333333333334" height="84" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450.00000000000006" y="625.4" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">Private cost</text><line x1="580.6666666666667" y1="621" x2="614.6666666666667" y2="621" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="620.6666666666667" y="579" width="249.33333333333334" height="84" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="745.3333333333334" y="613.4" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">Independence as</text><text x="745.3333333333334" y="637.4" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">sacrifice</text><text x="450" y="697" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Defensible: a reader could argue she is simply proud</text>
</svg>