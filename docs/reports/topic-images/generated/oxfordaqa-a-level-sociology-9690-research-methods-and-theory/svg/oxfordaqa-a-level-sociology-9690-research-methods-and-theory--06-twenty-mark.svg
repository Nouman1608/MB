<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 996" width="900" height="996" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="996" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Writing the 20-mark extended response</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">“Evaluate the view that sociology can and should be value free”</text>
<rect x="30" y="120" width="840" height="118" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="67" cy="179" r="21" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="67" y="186.56" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="104" y="159.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Define</text><text x="104" y="189.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Value freedom: research free from the researcher’s personal, political or moral</text><text x="104" y="211.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">values.</text><line x1="450" y1="242" x2="450" y2="278" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="284" width="840" height="96" rx="14" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="67" cy="332" r="21" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="67" y="339.56" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="104" y="323.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Present the view</text><text x="104" y="353.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Positivism; Durkheim’s scientific method.</text><line x1="450" y1="384" x2="450" y2="420" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="426" width="840" height="96" rx="14" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="67" cy="474" r="21" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="67" y="481.56" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="104" y="465.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Develop alternatives</text><text x="104" y="495.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Weber’s middle position; Gouldner and Becker; feminist critiques; Burawoy.</text><line x1="450" y1="526" x2="450" y2="562" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="568" width="840" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="67" cy="616" r="21" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="67" y="623.56" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="104" y="607.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Apply</text><text x="104" y="637.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Research examples, including Unit 1 families research or your own society.</text><line x1="450" y1="668" x2="450" y2="704" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="710" width="840" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="67" cy="758" r="21" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="67" y="765.56" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="104" y="749.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Evaluate throughout</text><text x="104" y="779.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Not only at the end: "however", "this suggests".</text><line x1="450" y1="810" x2="450" y2="846" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="852" width="840" height="118" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="67" cy="911" r="21" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="67" y="918.56" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">6</text><text x="104" y="891.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Conclude</text><text x="104" y="921.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A judgement that follows from the argument: full value freedom is impossible, but</text><text x="104" y="943.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">transparent methods and Weber’s distinction protect objectivity.</text>
</svg>