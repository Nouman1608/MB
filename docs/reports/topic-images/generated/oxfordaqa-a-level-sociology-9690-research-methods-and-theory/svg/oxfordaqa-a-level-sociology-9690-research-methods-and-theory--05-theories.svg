<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1065" width="900" height="1065" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="1065" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The main theories in brief</text>

<rect x="206" y="104" width="216" height="60" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="314" y="138.81" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Core claim</text><rect x="430" y="104" width="216" height="60" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="538" y="127.81" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Neo- or later</text><text x="538" y="149.81" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">developments</text><rect x="654" y="104" width="216" height="60" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="762" y="138.81" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Typical methods</text><rect x="30" y="172" width="168" height="150" rx="10" fill="#b5d3cf" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="252.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Functionalism</text><rect x="206" y="172" width="216" height="150" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="220" y="201.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Interdependent parts</text><text x="220" y="221.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">based on value</text><text x="220" y="241.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">consensus (Durkheim,</text><text x="220" y="261.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Parsons)</text><rect x="430" y="172" width="216" height="150" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="444" y="201.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Merton: manifest and</text><text x="444" y="221.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">latent functions,</text><text x="444" y="241.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">dysfunctions;</text><text x="444" y="261.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">neo-functionalism</text><text x="444" y="281.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">(Alexander) accepts</text><text x="444" y="301.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">conflict and agency</text><rect x="654" y="172" width="216" height="150" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="668" y="201.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Comparative and</text><text x="668" y="221.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">statistical analysis</text><rect x="30" y="330" width="168" height="130" rx="10" fill="#b5d3cf" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="400.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Marxism</text><rect x="206" y="330" width="216" height="130" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="220" y="359.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Class conflict;</text><text x="220" y="379.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">ideology legitimises</text><text x="220" y="399.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">exploitation</text><rect x="430" y="330" width="216" height="130" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="444" y="359.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Gramsci’s hegemony;</text><text x="444" y="379.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Althusser; Frankfurt</text><text x="444" y="399.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">School; cultural</text><text x="444" y="419.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">studies on subcultural</text><text x="444" y="439.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">resistance</text><rect x="654" y="330" width="216" height="130" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="668" y="359.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Historical,</text><text x="668" y="379.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">documentary, critical;</text><text x="668" y="399.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">ethnography of</text><text x="668" y="419.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">resistance</text><rect x="30" y="468" width="168" height="150" rx="10" fill="#b5d3cf" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="548.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Feminisms</text><rect x="206" y="468" width="216" height="150" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="220" y="497.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Society structured by</text><text x="220" y="517.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">gender inequality</text><rect x="430" y="468" width="216" height="150" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="444" y="497.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Liberal, Marxist,</text><text x="444" y="517.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">radical, black and</text><text x="444" y="537.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">intersectional;</text><text x="444" y="557.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Crenshaw:</text><text x="444" y="577.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">intersectionality</text><text x="444" y="597.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">(1989)</text><rect x="654" y="468" width="216" height="150" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="668" y="497.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Often qualitative,</text><text x="668" y="517.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">participatory,</text><text x="668" y="537.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">reflexive</text><rect x="30" y="626" width="168" height="150" rx="10" fill="#b5d3cf" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="695.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Symbolic</text><text x="42" y="717.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">interactionism</text><rect x="206" y="626" width="216" height="150" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="220" y="655.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Created through</text><text x="220" y="675.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">interaction and shared</text><text x="220" y="695.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">meanings (Mead)</text><rect x="430" y="626" width="216" height="150" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="444" y="655.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Blumer’s three</text><text x="444" y="675.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">premises: meanings</text><text x="444" y="695.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">guide action, arise</text><text x="444" y="715.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">from interaction,</text><text x="444" y="735.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">change through</text><text x="444" y="755.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">interpretation</text><rect x="654" y="626" width="216" height="150" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="668" y="655.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Participant</text><text x="668" y="675.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">observation,</text><text x="668" y="695.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">unstructured interviews</text><rect x="30" y="784" width="168" height="130" rx="10" fill="#b5d3cf" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="854.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Postmodernism</text><rect x="206" y="784" width="216" height="130" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="220" y="813.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Metanarratives have</text><text x="220" y="833.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">lost credibility;</text><text x="220" y="853.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">fragmented,</text><text x="220" y="873.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">media-saturated society</text><rect x="430" y="784" width="216" height="130" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="444" y="813.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Lyotard (1979):</text><text x="444" y="833.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">"incredulity toward</text><text x="444" y="853.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">metanarratives";</text><text x="444" y="873.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Baudrillard:</text><text x="444" y="893.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">hyperreality</text><rect x="654" y="784" width="216" height="130" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="668" y="813.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Discourse and media</text><text x="668" y="833.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">analysis; sceptical of</text><text x="668" y="853.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">objective truth</text><rect x="30" y="930" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="966" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Postmodernity or late modernity?</text><text x="56" y="995" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Giddens and Beck accept major change but call it late or reflexive modernity, not a</text><text x="56" y="1017" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">break with modernity.</text>
</svg>