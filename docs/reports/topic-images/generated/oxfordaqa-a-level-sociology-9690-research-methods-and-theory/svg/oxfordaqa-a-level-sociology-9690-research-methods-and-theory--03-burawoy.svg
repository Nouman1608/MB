<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 598" width="900" height="598" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="598" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Burawoy (2004): four types of sociology</text>

<rect x="30" y="104" width="412" height="128" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,154 L31.25,118.25 Q31.25,105.25 44.25,105.25 L427.75,105.25 Q440.75,105.25 440.75,118.25 L440.75,154 Z" fill="#dce9e7"/><line x1="31.25" y1="154" x2="440.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="135" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Professional</text><circle cx="64" cy="129" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="64" y="135.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="46" y="187.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Academic research for other sociologists.</text><rect x="458" y="104" width="412" height="128" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,154 L459.25,118.25 Q459.25,105.25 472.25,105.25 L855.75,105.25 Q868.75,105.25 868.75,118.25 L868.75,154 Z" fill="#dce9e7"/><line x1="459.25" y1="154" x2="868.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="135" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Policy</text><circle cx="492" cy="129" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="492" y="135.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="474" y="187.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Research commissioned to solve problems for</text><text x="474" y="208.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">clients such as governments.</text><rect x="30" y="248" width="412" height="149" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,298 L31.25,262.25 Q31.25,249.25 44.25,249.25 L427.75,249.25 Q440.75,249.25 440.75,262.25 L440.75,298 Z" fill="#f2e7b8"/><line x1="31.25" y1="298" x2="440.75" y2="298" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="279" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Critical</text><circle cx="64" cy="273" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="64" y="279.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="46" y="331.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Questions the assumptions of professional</text><text x="46" y="352.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">sociology.</text><rect x="458" y="248" width="412" height="149" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,298 L459.25,262.25 Q459.25,249.25 472.25,249.25 L855.75,249.25 Q868.75,249.25 868.75,262.25 L868.75,298 Z" fill="#d4b02e"/><line x1="459.25" y1="298" x2="868.75" y2="298" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="279" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Public</text><circle cx="492" cy="273" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="492" y="279.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="474" y="331.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Engages directly with publics: communities,</text><text x="474" y="352.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">social movements, the media. Burawoy wants it</text><text x="474" y="373.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">strengthened to serve civil society.</text><rect x="30" y="413" width="840" height="171" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="449" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Should sociologists be activists?</text><circle cx="61" cy="472.39" r="4.5" fill="#8a6d0d"/><text x="74" y="478" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">For:</tspan> exposes injustice (Mills, feminist research, poverty and racism); participants</text><text x="74" y="500" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">may benefit</text><circle cx="61" cy="524.39" r="4.5" fill="#8a6d0d"/><text x="74" y="530" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Against:</tspan> may bias research, damage credibility, blur evidence and advocacy</text><circle cx="61" cy="554.39" r="4.5" fill="#8a6d0d"/><text x="74" y="560" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Middle path:</tspan> Weber, values choose topics but research stays objective</text>
</svg>