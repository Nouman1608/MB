<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 545" width="900" height="545" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="545" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What is society, and how can we know it?</text>

<rect x="188" y="104" width="337" height="44" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="356.5" y="131.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Positivism</text><rect x="533" y="104" width="337" height="44" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="701.5" y="131.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Interpretivism</text><rect x="30" y="156" width="150" height="74" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="198.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Society is…</text><rect x="188" y="156" width="337" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="202" y="187.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">An objective structure of "social</text><text x="202" y="209.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">facts" (Comte, Durkheim)</text><rect x="533" y="156" width="337" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="547" y="187.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Built from meanings</text><rect x="30" y="238" width="150" height="52" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="269.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">So favour…</text><rect x="188" y="238" width="337" height="52" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="202" y="269.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Quantitative methods</text><rect x="533" y="238" width="337" height="52" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="547" y="269.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Qualitative methods</text><rect x="30" y="298" width="150" height="118" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="362.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Suicide</text><rect x="188" y="298" width="337" height="118" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="202" y="329.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Durkheim (1897): official</text><text x="202" y="351.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">statistics show rates vary with</text><text x="202" y="373.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">integration and regulation</text><rect x="533" y="298" width="337" height="118" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="547" y="329.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Atkinson (1978): statistics are</text><text x="547" y="351.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">the product of coroners’</text><text x="547" y="373.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">interpretations; they show</text><text x="547" y="395.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">labelling, not "real" rates</text><rect x="30" y="432" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="468" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Realists and mixed-methods researchers</text><text x="56" y="497" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Both structures and meanings matter, which justifies triangulation.</text>
</svg>