<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 557" width="900" height="557" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="557" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Can sociology be value free?</text>

<line x1="60" y1="120" x2="840" y2="120" stroke="#8a6d0d" stroke-width="4" marker-start="url(#ahO)" marker-end="url(#ahO)"/><text x="60" y="106" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="start">objectivity possible</text><text x="840" y="106" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="end">take sides openly</text><rect x="30" y="144" width="269.3333333333333" height="236" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,214 L31.25,158.25 Q31.25,145.25 44.25,145.25 L285.0833333333333,145.25 Q298.0833333333333,145.25 298.0833333333333,158.25 L298.0833333333333,214 Z" fill="#b5d3cf"/><line x1="31.25" y1="214" x2="298.0833333333333" y2="214" stroke="#c9d6d4" stroke-width="2"/><text x="164.66666666666666" y="184.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Value-free science</text><text x="44" y="245.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Comte and Durkheim</text><text x="44" y="272.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Sociology can and should be</text><text x="44" y="293.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">as objective as natural</text><text x="44" y="314.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">science.</text><rect x="315.3333333333333" y="144" width="269.3333333333333" height="236" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M316.5833333333333,214 L316.5833333333333,158.25 Q316.5833333333333,145.25 329.5833333333333,145.25 L570.4166666666666,145.25 Q583.4166666666666,145.25 583.4166666666666,158.25 L583.4166666666666,214 Z" fill="#dce9e7"/><line x1="316.5833333333333" y1="214" x2="583.4166666666666" y2="214" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="172.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Value relevance,</text><text x="450" y="196.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">value-free method</text><text x="329.3333333333333" y="245.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Weber</text><text x="329.3333333333333" y="272.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Values shape which topics</text><text x="329.3333333333333" y="293.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">are chosen and how findings</text><text x="329.3333333333333" y="314.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">are used; data collection</text><text x="329.3333333333333" y="335.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and analysis should be as</text><text x="329.3333333333333" y="356.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">objective as possible.</text><rect x="600.6666666666666" y="144" width="269.3333333333333" height="236" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.9166666666666,214 L601.9166666666666,158.25 Q601.9166666666666,145.25 614.9166666666666,145.25 L855.75,145.25 Q868.75,145.25 868.75,158.25 L868.75,214 Z" fill="#f2e7b8"/><line x1="601.9166666666666" y1="214" x2="868.75" y2="214" stroke="#c9d6d4" stroke-width="2"/><text x="735.3333333333333" y="184.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Value commitment</text><text x="614.6666666666666" y="245.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Gouldner (1962); Becker</text><text x="614.6666666666666" y="266.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">(1967)</text><text x="614.6666666666666" y="293.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Value freedom is impossible</text><text x="614.6666666666666" y="314.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">or undesirable; say whose</text><text x="614.6666666666666" y="335.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">side you are on.</text><rect x="30" y="398" width="840" height="133" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="434" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Feminist critique</text><text x="56" y="463" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Supposedly neutral research often reflected male assumptions. Oakley (1981): a detached,</text><text x="56" y="485" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">hierarchical interview with women is neither possible nor ethical; favour a reciprocal</text><text x="56" y="507" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">relationship.</text>
</svg>