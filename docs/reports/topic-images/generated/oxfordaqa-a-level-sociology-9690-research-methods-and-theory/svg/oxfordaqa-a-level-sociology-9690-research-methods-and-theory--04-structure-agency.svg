<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 622" width="900" height="622" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="622" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Structure and agency</text>

<rect x="30" y="110" width="412" height="174" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,160 L31.25,124.25 Q31.25,111.25 44.25,111.25 L427.75,111.25 Q440.75,111.25 440.75,124.25 L440.75,160 Z" fill="#b5d3cf"/><line x1="31.25" y1="160" x2="440.75" y2="160" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="140.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Structure</text><text x="44" y="191.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">functionalism, Marxism, many feminisms</text><text x="44" y="218.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Social structures shape and constrain</text><text x="44" y="239.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">individuals. Leans to large-scale</text><text x="44" y="260.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">quantitative data.</text><rect x="458" y="110" width="412" height="174" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,160 L459.25,124.25 Q459.25,111.25 472.25,111.25 L855.75,111.25 Q868.75,111.25 868.75,124.25 L868.75,160 Z" fill="#f2e7b8"/><line x1="459.25" y1="160" x2="868.75" y2="160" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="140.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Agency</text><text x="472" y="191.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">symbolic interactionism</text><text x="472" y="218.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">People interpret situations and act</text><text x="472" y="239.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">creatively. Leans to small-scale qualitative</text><text x="472" y="260.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">studies.</text><text x="450" y="314" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Giddens (1984): structuration and the duality of structure</text><rect x="50" y="417" width="300" height="90" rx="14" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="200" y="456" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Structures</text><text x="200" y="482" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">e.g. language rules</text><rect x="550" y="417" width="300" height="90" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="700" y="456" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Action</text><text x="700" y="482" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">e.g. people speaking</text><path d="M260,412 Q450,342 640,412" fill="none" stroke="#2e6b62" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahT)"/><text x="450" y="366" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="middle">constrain</text><path d="M640,512 Q450,582 260,512" fill="none" stroke="#8a6d0d" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahO)"/><text x="450" y="574" font-size="17" font-weight="600" fill="#8a6d0d" text-anchor="middle">reproduce or change</text>
</svg>