<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 674" width="900" height="674" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="674" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Learning about a culture from its art</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">The blue fish on the potters' jars</text>
<line x1="60" y1="144" x2="60" y2="516" stroke="#c9d6d4" stroke-width="4"/><rect x="104" y="124" width="766" height="79" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="119" y="153.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Describe precisely</text><text x="119" y="183.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Jars, a blue fish, every spring; the fish must stay; young potters may add small details.</text><circle cx="60" cy="163.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="172.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="104" y="213" width="766" height="101" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="119" y="242.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Infer</text><text x="119" y="272.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">The community values continuity, and allows individual creativity inside the tradition. A link</text><text x="119" y="294.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">to water is only a guess: "perhaps".</text><circle cx="60" cy="263.5" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="272.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="104" y="324" width="766" height="101" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="119" y="353.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Answer the question</text><text x="119" y="383.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">A culture that balances tradition with personal expression: "it is just a jar" shows the shared</text><text x="119" y="405.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">symbol carries the value.</text><circle cx="60" cy="374.5" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="383.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="104" y="435" width="766" height="101" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="119" y="464.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Move it into your target language</text><text x="119" y="494.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Frames: "this suggests that" · "this shows that the community values" · "one possible</text><text x="119" y="516.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">reason is" · "however, the text does not say".</text><circle cx="60" cy="485.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="494.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="30" y="558" width="840" height="84" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="592.4" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">A weak answer stops at step 1. The question asks what we <tspan font-weight="700" fill="#1e2a44">learn</tspan>, so the marks sit in steps 2</text><text x="450" y="616.4" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">and 3.</text>
</svg>