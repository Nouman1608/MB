<rect width="900" height="434" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">One theme, every component</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">The brief does not tie any component to a single theme</text>
<text x="135" y="140" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">25%</text><text x="345" y="140" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">25%</text><text x="555" y="140" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">25%</text><text x="765" y="140" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">25%</text><rect x="30" y="152" width="210" height="74" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="135" y="185" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Paper 1</text><text x="135" y="209" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">writing · 30 marks</text><rect x="240" y="152" width="210" height="74" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="345" y="185" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Paper 2 listening</text><text x="345" y="209" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">25 marks</text><rect x="450" y="152" width="210" height="74" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="555" y="185" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Paper 2 reading</text><text x="555" y="209" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">40 marks</text><rect x="660" y="152" width="210" height="74" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="765" y="185" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Individual oral</text><text x="765" y="209" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">internal · 30 marks</text><rect x="30" y="248" width="269.3333333333333" height="154" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="280" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PAPER 1</text><text x="50" y="306.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">One task from three</text><text x="50" y="335.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">HL: more complex language,</text><text x="50" y="356.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">higher-order thinking, a</text><text x="50" y="377.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">higher word range.</text><rect x="315.3333333333333" y="248" width="269.3333333333333" height="154" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="335.3333333333333" y="280" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PAPER 2</text><text x="335.3333333333333" y="306.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Unseen texts</text><text x="335.3333333333333" y="335.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Separate listening and</text><text x="335.3333333333333" y="356.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">reading sections on any</text><text x="335.3333333333333" y="377.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">theme.</text><rect x="600.6666666666666" y="248" width="269.3333333333333" height="154" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="620.6666666666666" y="280" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ORAL</text><text x="620.6666666666666" y="306.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The stimulus</text><text x="620.6666666666666" y="335.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">SL: a visual image. HL: an</text><text x="620.6666666666666" y="356.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">excerpt from one of two</text><text x="620.6666666666666" y="377.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">literary works.</text>
</svg>