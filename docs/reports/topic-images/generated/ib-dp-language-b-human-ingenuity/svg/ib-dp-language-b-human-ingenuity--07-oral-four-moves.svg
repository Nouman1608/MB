<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 613" width="900" height="613" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="613" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four moves for an SL oral image</text>

<rect x="30" y="100" width="180" height="176" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="120" y="163.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">1</text><text x="120" y="191.1" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Describe</text><text x="120" y="220.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Who, what, where</text><line x1="216" y1="188" x2="244" y2="188" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="250" y="100" width="180" height="176" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="340" y="153" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">2</text><text x="340" y="180.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Interpret</text><text x="340" y="209.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Why it was made,</text><text x="340" y="230.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">what it shows</text><line x1="436" y1="188" x2="464" y2="188" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="470" y="100" width="180" height="176" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="560" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">3</text><text x="560" y="159.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Connect</text><text x="560" y="188.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">To the theme and</text><text x="560" y="209.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">a target-language</text><text x="560" y="230.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">culture you have</text><text x="560" y="251.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">studied</text><line x1="656" y1="188" x2="684" y2="188" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="690" y="100" width="180" height="176" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="780" y="153" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">4</text><text x="780" y="180.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Judge</text><text x="780" y="209.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Your view, with a</text><text x="780" y="230.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">reason</text><text x="450" y="311.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Images on this theme: a mural · a crowded cinema · a robot in a hospital · someone filming a concert on</text><text x="450" y="333.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">a phone</text><rect x="30" y="364" width="840" height="60" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="398.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Common error: listing what is in the image and never reaching an opinion.</text><rect x="30" y="446" width="840" height="135" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="478" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">HL</text><text x="50" y="504.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The stimulus is an excerpt from one of your two literary works</text><text x="50" y="534.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">If either work deals with invention, art, media or science, mark those passages now and build</text><text x="50" y="556.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">theme vocabulary around them.</text>
</svg>