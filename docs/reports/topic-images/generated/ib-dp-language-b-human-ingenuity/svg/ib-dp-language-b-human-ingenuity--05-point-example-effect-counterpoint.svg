<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 467" width="900" height="467" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="467" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Build the grid before you write</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">How do the media change the way we relate to each other?</text>
<rect x="30" y="124" width="183" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="150" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">POINT</text><text x="44" y="175.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Messaging keeps</text><text x="44" y="196.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">families in daily</text><text x="44" y="217.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">contact across</text><text x="44" y="238.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">countries</text><line x1="219" y1="190" x2="243" y2="190" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="249" y="124" width="183" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="263" y="150" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EXAMPLE</text><text x="263" y="175.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">A grandmother</text><text x="263" y="196.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">watches a school</text><text x="263" y="217.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">play on a video</text><text x="263" y="238.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">call</text><line x1="438" y1="190" x2="462" y2="190" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="468" y="124" width="183" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="482" y="171" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EFFECT</text><text x="482" y="196.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Closeness despite</text><text x="482" y="217.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">distance</text><line x1="657" y1="190" x2="681" y2="190" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="687" y="124" width="183" height="132" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="701" y="150" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">COUNTERPOINT</text><text x="701" y="175.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">A screen is not a</text><text x="701" y="196.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">visit; not every</text><text x="701" y="217.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">grandparent has a</text><text x="701" y="238.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">device or the skills</text><rect x="30" y="278" width="840" height="91" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="312.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">The paragraph's conclusion</text><text x="450" y="343.4" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">"The media have not simply brought us closer; they have changed what closeness means."</text><text x="450" y="404.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">Check your target-language connectors for contrast (<tspan font-style="italic">however,</tspan> <tspan font-style="italic">whereas,</tspan> <tspan font-style="italic">although</tspan>) and result (<tspan font-style="italic">so,</tspan> <tspan font-style="italic">as</tspan> <tspan font-style="italic">a</tspan></text><text x="450" y="426.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle"><tspan font-style="italic">result</tspan>).</text>
</svg>