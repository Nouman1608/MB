<rect x="30" y="100" width="248" height="158" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="154" y="143" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">1</text><text x="154" y="170.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">The idea</text><text x="154" y="200.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">Who thought of it, and</text><text x="154" y="222.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">why?</text><line x1="284" y1="179" x2="320" y2="179" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="326" y="100" width="248" height="158" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">2</text><text x="450" y="159.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">How it was made</text><text x="450" y="189.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">The process: "The</text><text x="450" y="211.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">statues were scanned,</text><text x="450" y="233.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">then printed."</text><line x1="580" y1="179" x2="616" y2="179" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="622" y="100" width="248" height="158" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="746" y="143" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">3</text><text x="746" y="170.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">What it changes</text><text x="746" y="200.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">Effects on people's lives,</text><text x="746" y="222.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">for better and for worse</text><text x="450" y="294.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">The topics overlap with other themes; the angle decides the theme.</text><clipPath id="tc326"><rect x="30" y="326" width="840" height="188" rx="14"/></clipPath><g clip-path="url(#tc326)"><rect x="30" y="326" width="215.3846153846154" height="48" fill="#b5d3cf"/><text x="44" y="353.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Text about…</text><rect x="245.3846153846154" y="326" width="280" height="48" fill="#b5d3cf"/><text x="259.38461538461536" y="353.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Also touches</text><rect x="525.3846153846154" y="326" width="344.61538461538464" height="48" fill="#f2e7b8"/><text x="539.3846153846154" y="353.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Under Human ingenuity, ask</text><rect x="30" y="374" width="215.3846153846154" height="70" fill="#dce9e7"/><text x="44" y="401.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">A new vaccine</text><rect x="245.3846153846154" y="374" width="280" height="70" fill="#ffffff"/><text x="259.38461538461536" y="401.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Health and well-being</text><text x="259.38461538461536" y="423.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">(Identities)</text><rect x="525.3846153846154" y="374" width="344.61538461538464" height="70" fill="#ffffff"/><text x="539.3846153846154" y="401.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Who benefits first, and who carries the</text><text x="539.3846153846154" y="423.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">risk?</text><line x1="30" y1="444" x2="870" y2="444" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="444" width="215.3846153846154" height="70" fill="#dce9e7"/><text x="44" y="471.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Solar power</text><rect x="245.3846153846154" y="444" width="280" height="70" fill="#f8faf9"/><text x="259.38461538461536" y="471.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The environment (Sharing the</text><text x="259.38461538461536" y="493.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">planet)</text><rect x="525.3846153846154" y="444" width="344.61538461538464" height="70" fill="#f8faf9"/><text x="539.3846153846154" y="471.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">What was invented, and what does it</text><text x="539.3846153846154" y="493.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">change?</text></g><line x1="245.3846153846154" y1="326" x2="245.3846153846154" y2="514" stroke="#c9d6d4" stroke-width="1.5"/><line x1="525.3846153846154" y1="326" x2="525.3846153846154" y2="514" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="326" width="840" height="188" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/>
