<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 493" width="900" height="493" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="493" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Contract: an obligation the parties choose</text>

<rect x="30" y="100" width="412" height="80" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="236" y="130" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">CONTRACT</text><text x="236" y="156.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Obligations chosen by the parties</text><rect x="458" y="100" width="412" height="80" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="664" y="130" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">TORT</text><text x="664" y="156.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Duties imposed by law</text><rect x="30" y="202" width="397" height="128" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="232" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FREEDOM OF CONTRACT</text><text x="48" y="258.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Before the contract</text><text x="48" y="286.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Free to decide whether to contract, with whom,</text><text x="48" y="307.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and on what terms</text><line x1="433" y1="266" x2="467" y2="266" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="473" y="202" width="397" height="128" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="491" y="232" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SANCTITY OF CONTRACT</text><text x="491" y="258.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">After the contract</text><text x="491" y="286.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Agreements must be kept; courts enforce them</text><text x="491" y="307.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">as made, not rewrite them</text><rect x="30" y="352" width="840" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="386.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Printing and Numerical Registering Co v Sampson (1875), Jessel MR</text><text x="450" y="415.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">People of full age and competent understanding shall have the utmost liberty of contracting, and</text><text x="450" y="436.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">contracts freely entered into shall be held sacred and enforced.</text>
</svg>