<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 582" width="900" height="582" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="582" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The postal rule and electronic communications</text>

<rect x="30" y="100" width="840" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="166" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">By post</text><text x="50" y="190" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Adams v Lindsell (1818)</text><line x1="330" y1="170" x2="840" y2="170" stroke="#1e2a44" stroke-width="3"/><circle cx="400" cy="170" r="9" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="400" y="202" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">sent</text><circle cx="780" cy="170" r="9" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="780" y="202" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">received</text><circle cx="400" cy="170" r="16" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="400" y="144" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">contract formed</text><text x="50" y="286" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Instantaneous</text><text x="50" y="310" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Entores (1955); Brinkibon (1983)</text><line x1="330" y1="290" x2="840" y2="290" stroke="#1e2a44" stroke-width="3"/><circle cx="400" cy="290" r="9" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="400" y="322" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">sent</text><circle cx="780" cy="290" r="9" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="780" y="322" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">received</text><circle cx="780" cy="290" r="16" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="780" y="264" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">contract formed</text><text x="590" y="228" font-size="15" font-weight="400" fill="#8a6d0d" text-anchor="middle" font-style="italic">even if lost: Household Fire Insurance v Grant (1879)</text><rect x="30" y="372" width="412" height="178" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="402" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">RATIONALE</text><text x="48" y="433.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="433.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Offeror chose the post, so bears the risk</text><text x="48" y="459.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="459.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Offeree gets certainty at a known moment</text><text x="48" y="485.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="485.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Offeror can require receipt: <tspan font-style="italic">Holwell</tspan> <tspan font-style="italic">Securities</tspan> <tspan font-style="italic">v</tspan></text><text x="63.2" y="506.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Hughes</tspan> (1974)</text><rect x="458" y="372" width="412" height="178" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="476" y="402" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EMAIL AND WEBSITES</text><text x="476" y="433.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="491.2" y="433.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Not truly instantaneous, but delivery can</text><text x="491.2" y="454.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">usually be checked</text><text x="476" y="480.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="491.2" y="480.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Most commentators: a receipt rule fits better</text><text x="476" y="506.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="491.2" y="506.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">No</tspan> <tspan font-weight="700" fill="#1e2a44">binding</tspan> <tspan font-weight="700" fill="#1e2a44">appellate</tspan> <tspan font-weight="700" fill="#1e2a44">decision</tspan> settles when</text><text x="491.2" y="527.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">email acceptance takes effect</text>
</svg>