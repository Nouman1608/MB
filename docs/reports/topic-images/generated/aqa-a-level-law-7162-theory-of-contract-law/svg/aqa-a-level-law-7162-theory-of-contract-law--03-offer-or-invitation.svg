<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 559" width="900" height="559" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="559" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Who has the power to conclude the contract?</text>

<rect x="30" y="100" width="840" height="200" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="50" y="130" width="220" height="64" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="160" y="158" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Display or advert</text><text x="160" y="180" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">invitation to treat</text><rect x="340" y="130" width="220" height="64" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="158" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Customer</text><text x="450" y="180" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">makes the offer</text><rect x="630" y="130" width="220" height="64" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="740" y="158" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Seller</text><text x="740" y="180" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">free to accept or not</text><line x1="274" y1="162" x2="336" y2="162" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="564" y1="162" x2="626" y2="162" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="450" y="230" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">If adverts were offers, a seller could receive more acceptances than they had stock (Lord Parker,</text><text x="450" y="251" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle"><tspan font-style="italic">Partridge</tspan>)</text><rect x="30" y="322" width="412" height="126" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="352" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">INVITATIONS TO TREAT</text><text x="48" y="383.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Pharmaceutical</tspan> <tspan font-style="italic">Society</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Boots</tspan> (1953); <tspan font-style="italic">Partridge</tspan></text><text x="48" y="404.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">v</tspan> <tspan font-style="italic">Crittenden</tspan> (1968): suits the realities of trade</text><rect x="458" y="322" width="412" height="126" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="476" y="352" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EXCEPTION: UNILATERAL OFFER</text><text x="476" y="383.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Carlill</tspan> (1893): payment promised, money</text><text x="476" y="404.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">deposited to show sincerity, only performance</text><text x="476" y="425.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">required. An offer to the world.</text><rect x="30" y="470" width="840" height="57" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="502.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Sensible but can look artificial: it depends on how clearly the advert shows an intention to be bound.</text>
</svg>