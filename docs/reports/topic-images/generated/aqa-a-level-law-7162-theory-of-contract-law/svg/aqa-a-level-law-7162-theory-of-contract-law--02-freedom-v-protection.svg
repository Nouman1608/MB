<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 653" width="900" height="653" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="653" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Freedom of contract or consumer protection?</text>

<rect x="30" y="100" width="412" height="178" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="130" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FOR FREEDOM</text><text x="48" y="161.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="161.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Respects autonomy; certainty for commerce</text><text x="48" y="187.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="187.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Businesses allocate and price risk</text><text x="48" y="213.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="213.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Photo</tspan> <tspan font-style="italic">Production</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Securicor</tspan> (1980): exclusion</text><text x="63.2" y="234.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">clause enforced between equals</text><rect x="458" y="100" width="412" height="178" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="476" y="130" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">AGAINST</text><text x="476" y="161.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="491.2" y="161.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Assumes equal bargaining power</text><text x="476" y="187.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="491.2" y="187.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Consumers sign standard terms they cannot</text><text x="491.2" y="208.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">negotiate or do not read</text><text x="476" y="234.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="491.2" y="234.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Atiyah (1979): the classical model declined as</text><text x="491.2" y="255.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the state regulated</text><rect x="30" y="300" width="840" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="332" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">WHERE THE LAW NOW DRAWS THE LINE</text><defs><linearGradient id="fp" x1="0" x2="1"><stop offset="0" stop-color="#b5d3cf"/><stop offset="1" stop-color="#f2e7b8"/></linearGradient></defs><rect x="60" y="350" width="780" height="44" rx="22" fill="url(#fp)" stroke="#1e2a44" stroke-width="2.5"/><text x="80" y="379" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Business to business: near-complete freedom</text><text x="820" y="379" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Consumers: strong protection</text><text x="70" y="422" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">UCTA 1977 reasonableness test</text><text x="830" y="422" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">CRA 2015: implied terms cannot be excluded</text><text x="830" y="443" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">(ss9–11, 31); fairness test (s62); no exclusion of</text><text x="830" y="464" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">death or injury by negligence (s65)</text><rect x="30" y="512" width="840" height="109" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="546.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Evaluation</text><text x="450" y="575.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Defensible, but more complex; small businesses can be as weak as consumers without the same</text><text x="450" y="596.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">protection.</text>
</svg>