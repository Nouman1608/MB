<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 696" width="900" height="696" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="696" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Controlling exemption clauses: three layers</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">An exemption clause allocates risk</text>
<line x1="60" y1="144" x2="60" y2="494" stroke="#c9d6d4" stroke-width="4"/><rect x="104" y="124" width="766" height="129" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="154" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">INCORPORATION</text><text x="122" y="180.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Was it part of the contract?</text><text x="122" y="209.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Olley</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Marlborough</tspan> <tspan font-style="italic">Court</tspan> (1949); <tspan font-style="italic">Thornton</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Shoe</tspan> <tspan font-style="italic">Lane</tspan> <tspan font-style="italic">Parking</tspan> (1971): the more unusual the</text><text x="122" y="230.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">clause, the clearer the notice</text><circle cx="60" cy="188.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="197.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="104" y="265" width="766" height="108" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="295" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CONSTRUCTION</text><text x="122" y="321.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Does it cover the breach?</text><text x="122" y="350.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Ambiguity read against the party relying on it</text><circle cx="60" cy="319" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="327.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="104" y="385" width="766" height="129" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="122" y="415" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STATUTE</text><text x="122" y="441.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Is it allowed?</text><text x="122" y="470.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">UCTA 1977 ss2–3; CRA 2015 ss31, 57, 65. Death or personal injury by negligence: ineffective</text><text x="122" y="491.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">(UCTA s2(1); CRA s65)</text><circle cx="60" cy="449.5" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="458.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="30" y="536" width="412" height="128" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="566" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EFFECTIVE</text><text x="48" y="592.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Between businesses</text><text x="48" y="620.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Often upheld if reasonable: efficient, the party</text><text x="48" y="641.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">best placed to insure takes the risk</text><rect x="458" y="536" width="412" height="128" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="476" y="566" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">WEAKNESS</text><text x="476" y="592.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Against consumers</text><text x="476" y="620.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">May not know their rights; deterred by a clause</text><text x="476" y="641.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">that is in fact unenforceable</text>
</svg>