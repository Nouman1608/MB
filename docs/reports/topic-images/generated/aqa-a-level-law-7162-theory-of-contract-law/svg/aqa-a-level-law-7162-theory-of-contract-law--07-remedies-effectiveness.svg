<rect width="900" height="712" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How effective are contract remedies?</text>

<rect x="30" y="100" width="840" height="178" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="130" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DAMAGES: THE NORMAL REMEDY</text><text x="48" y="156.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The position if the contract had been performed</text><text x="48" y="184.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="184.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Limits: remoteness (<tspan font-style="italic">Hadley</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Baxendale</tspan>, 1854); mitigation</text><text x="48" y="209.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="209.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">No damages for disappointment (<tspan font-style="italic">Addis</tspan>, 1909), except where the purpose is enjoyment (<tspan font-style="italic">Jarvis</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Swans</tspan></text><text x="63.2" y="230.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Tours</tspan>, 1973)</text><text x="48" y="255.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="255.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Ruxley</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Forsyth</tspan> (1996): a shallower pool of equal value: modest loss of amenity, not rebuilding cost</text><text x="450" y="316" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">CONSUMER RIGHTS ACT 2015: GOODS</text><rect x="30" y="330" width="249.33333333333334" height="94" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="154.66666666666669" y="367.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Short-term right to reject</text><text x="154.66666666666669" y="395.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">s20, within 30 days</text><line x1="285.33333333333337" y1="377" x2="319.33333333333337" y2="377" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="325.33333333333337" y="330" width="249.33333333333334" height="94" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450.00000000000006" y="367.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Repair or replacement</text><text x="450.00000000000006" y="395.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">s23</text><line x1="580.6666666666667" y1="377" x2="614.6666666666667" y2="377" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="620.6666666666667" y="330" width="249.33333333333334" height="94" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="745.3333333333334" y="357.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Price reduction or final</text><text x="745.3333333333334" y="378.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">right to reject</text><text x="745.3333333333334" y="405.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">s24</text><text x="450" y="462" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">SERVICES</text><rect x="180" y="476" width="247" height="73" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="303.5" y="503.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Repeat performance</text><text x="303.5" y="530.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">s55</text><line x1="433" y1="512.5" x2="467" y2="512.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="473" y="476" width="247" height="73" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="596.5" y="503.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Price reduction</text><text x="596.5" y="530.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">s56</text><rect x="30" y="571" width="840" height="109" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="605.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">More useful than court damages</text><text x="450" y="634.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Usable without litigation, but only if consumers know them and traders honour them. Equitable remedies:</text><text x="450" y="655.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">flexible but less certain.</text>
</svg>