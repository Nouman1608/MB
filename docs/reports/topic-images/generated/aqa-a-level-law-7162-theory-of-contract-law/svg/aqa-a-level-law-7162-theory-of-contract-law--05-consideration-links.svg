<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" width="900" height="580" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="580" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Consideration and its two neighbours</text>

<line x1="330" y1="171.5" x2="407" y2="226.45" stroke="#1e2a44" stroke-width="2.5"/><line x1="330" y1="328.5" x2="407" y2="273.55" stroke="#1e2a44" stroke-width="2.5"/><line x1="570" y1="182" x2="493" y2="229.6" stroke="#1e2a44" stroke-width="2.5"/><line x1="570" y1="328.5" x2="493" y2="273.55" stroke="#1e2a44" stroke-width="2.5"/><circle cx="450" cy="250" r="86" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="235.20999999999998" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Consideration</text><text x="450" y="255.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">the price of</text><text x="450" y="276.69" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">the promise</text><rect x="30" y="100" width="300" height="143" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="128" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PRIVITY</text><text x="46" y="153.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Only those who gave</text><text x="46" y="174.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">consideration can sue</text><text x="46" y="201.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Tweddle</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Atkinson</tspan> (1861); <tspan font-style="italic">Dunlop</tspan></text><text x="46" y="222.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">v</tspan> <tspan font-style="italic">Selfridge</tspan> (1915)</text><rect x="30" y="257" width="300" height="143" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="285" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">INJUSTICE AND REFORM</text><text x="46" y="310.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Beswick v Beswick (1968)</text><text x="46" y="337.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Widow could not sue in her own</text><text x="46" y="358.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">right. Now: Contracts (Rights of</text><text x="46" y="379.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Third Parties) Act 1999</text><rect x="570" y="110.5" width="300" height="143" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="586" y="138.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EXISTING DUTY</text><text x="586" y="163.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Stilk v Myrick (1809)</text><text x="586" y="191.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Not consideration for extra pay.</text><text x="586" y="212.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Williams</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Roffey</tspan> (1991): a practical</text><text x="586" y="233.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">benefit can be</text><rect x="570" y="267.5" width="300" height="122" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="586" y="295.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ECONOMIC DURESS</text><text x="586" y="320.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Atlas Express v Kafco (1989)</text><text x="586" y="348.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Promise to pay more, under threat</text><text x="586" y="369.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">not to deliver: unenforceable</text><rect x="30" y="422" width="412" height="126" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="452" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">WHY CONSIDERATION?</text><text x="48" y="483.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Separates bargains from gratuitous promises;</text><text x="48" y="504.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">evidence of intention. Sufficient, not adequate</text><text x="48" y="525.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(<tspan font-style="italic">Chappell</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Nestlé</tspan>, 1960)</text><rect x="458" y="422" width="412" height="126" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="476" y="452" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EVALUATION</text><text x="476" y="483.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Roffey</tspan> fits commercial renegotiation but weakens</text><text x="476" y="504.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the doctrine and sits awkwardly with <tspan font-style="italic">Foakes</tspan> <tspan font-style="italic">v</tspan></text><text x="476" y="525.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Beer</tspan> (1884)</text>
</svg>