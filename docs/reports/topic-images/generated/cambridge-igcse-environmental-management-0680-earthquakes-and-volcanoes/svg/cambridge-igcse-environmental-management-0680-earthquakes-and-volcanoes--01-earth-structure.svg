<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 950" width="900" height="950" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="950" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three layers of the Earth</text>

<rect x="30" y="110" width="840" height="610" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><clipPath id="half"><rect x="30" y="110" width="840" height="610"/></clipPath><g clip-path="url(#half)"><circle cx="275" cy="420" r="240" fill="#9c8f6e" stroke="#1e2a44" stroke-width="3"/><circle cx="275" cy="420" r="226" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><circle cx="275" cy="420" r="110.4" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/></g><text x="275" y="428" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">core</text><text x="275" y="245" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">mantle</text><line x1="438.20000000000005" y1="247.20000000000002" x2="520" y2="170" stroke="#1e2a44" stroke-width="2"/><circle cx="438.20000000000005" cy="247.20000000000002" r="5" fill="#1e2a44"/><text x="530" y="176" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Crust</text><text x="530" y="202" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the thin, rigid outer layer</text><line x1="450" y1="380" x2="520" y2="330" stroke="#1e2a44" stroke-width="2"/><circle cx="450" cy="380" r="5" fill="#1e2a44"/><text x="530" y="336" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Mantle</text><text x="530" y="362" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">thick layer of hot rock that moves</text><text x="530" y="383" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">very slowly</text><line x1="335" y1="480" x2="520" y2="480" stroke="#1e2a44" stroke-width="2"/><circle cx="335" cy="480" r="5" fill="#1e2a44"/><text x="530" y="486" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Core</text><text x="530" y="512" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">very hot, dense centre, mainly iron</text><text x="530" y="533" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">and nickel; its heat drives movement</text><text x="530" y="554" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">in the mantle</text><text x="50" y="700" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">Crust drawn thicker than it is.</text><rect x="30" y="750" width="410" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="460" y="750" width="410" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="60" y="800" width="350" height="26" rx="0" fill="#b5d3cf"/><rect x="60" y="826" width="350" height="22" rx="0" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><text x="235" y="818" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="middle">ocean</text><rect x="490" y="784" width="350" height="64" rx="0" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2"/><text x="54" y="880" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Oceanic crust</text><text x="54" y="904" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">thinner and denser</text><text x="484" y="880" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Continental crust</text><text x="484" y="904" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">thicker and less dense</text>
</svg>