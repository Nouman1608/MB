<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" width="900" height="720" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="720" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Focus, epicentre and magnitude</text>

<rect x="30" y="110" width="840" height="400" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="32" y="200" width="836" height="298" rx="0" fill="#cbbf9f"/><line x1="32" y1="200" x2="868" y2="200" stroke="#1e2a44" stroke-width="3"/><circle cx="330" cy="330" r="35" fill="none" stroke="#8a6d0d" stroke-width="2.5" stroke-dasharray="8 6"/><circle cx="330" cy="330" r="70" fill="none" stroke="#8a6d0d" stroke-width="2.5" stroke-dasharray="8 6"/><circle cx="330" cy="330" r="105" fill="none" stroke="#8a6d0d" stroke-width="2.5" stroke-dasharray="8 6"/><path d="M330,314 l5,11 12,1 -9,8 3,12 -11,-6 -11,6 3,-12 -9,-8 12,-1 z" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><line x1="330" y1="312" x2="330" y2="200" stroke="#1e2a44" stroke-width="2" stroke-dasharray="4 5"/><circle cx="330" cy="200" r="9" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><rect x="150" y="170" width="30" height="30" rx="0" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><path d="M146,170 L165,154 L184,170 Z" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><rect x="210" y="170" width="30" height="30" rx="0" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><path d="M206,170 L225,154 L244,170 Z" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><rect x="270" y="170" width="30" height="30" rx="0" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><path d="M266,170 L285,154 L304,170 Z" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><line x1="340" y1="196" x2="560" y2="134" stroke="#1e2a44" stroke-width="2"/><text x="570" y="140" font-size="20" font-weight="700" fill="#b5602e" text-anchor="start">Epicentre</text><text x="570" y="161" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">on the surface directly above the focus;</text><text x="570" y="179" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">shaking usually strongest</text><line x1="350" y1="330" x2="560" y2="380" stroke="#1e2a44" stroke-width="2"/><text x="570" y="372" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Focus</text><text x="570" y="396" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">the point underground where</text><text x="570" y="414" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">the rock slips</text><text x="570" y="268" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="start">Seismic waves</text><text x="570" y="292" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">stored energy released when</text><text x="570" y="310" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">locked rock suddenly slips</text><line x1="426" y1="290" x2="562" y2="276" stroke="#1e2a44" stroke-width="2"/><text x="54" y="488" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">A shallow focus usually does more damage: waves lose less energy before they arrive.</text><text x="450" y="560" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Moment Magnitude Scale: each whole step ≈ 32 times more energy</text><rect x="110" y="585" width="160" height="64" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="190" y="622.72" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">M 6.0</text><line x1="276" y1="617" x2="384" y2="617" stroke="#b5602e" stroke-width="4" marker-end="url(#ahR)"/><text x="330" y="605" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">×32</text><rect x="390" y="585" width="160" height="64" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="470" y="622.72" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">M 7.0</text><line x1="556" y1="617" x2="664" y2="617" stroke="#b5602e" stroke-width="4" marker-end="url(#ahR)"/><text x="610" y="605" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">×32</text><rect x="670" y="585" width="160" height="64" rx="12" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.5"/><text x="750" y="622.72" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">M 8.0</text><text x="450" y="690" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">32 × 32 = 1,024: one magnitude 8.0 ≈ the energy of a thousand magnitude 6.0 earthquakes</text><text x="858" y="498" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">Not to scale</text>
</svg>