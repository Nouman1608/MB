<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 766" width="900" height="766" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="766" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A hotspot builds a chain of volcanoes</text>

<rect x="30" y="110" width="840" height="450" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="32" y="370" width="836" height="188" rx="0" fill="#f2e7b8"/><rect x="32" y="330" width="836" height="40" rx="0" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2.5"/><rect x="32" y="270" width="836" height="60" rx="0" fill="#b5d3cf"/><text x="60" y="356" font-size="16" font-weight="700" fill="#ffffff" text-anchor="start">plate</text><text x="60" y="300" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">ocean</text><path d="M200,558 C190,480 170,420 210,370 L270,370 C310,420 290,480 280,558 Z" fill="#b5602e" opacity="0.85"/><text x="300" y="490" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">hot plume of mantle rock rises</text><text x="300" y="510" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">and melts through the plate</text><path d="M118.99999999999999,330 L228,220 L252,220 L361,330 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><path d="M240,330 L240,370" fill="none" stroke="#b5602e" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" /><path d="M230,220 q10,-26 20,0" fill="#b5602e"/><path d="M362,330 L438,250 L462,250 L538,330 Z" fill="#9c8f6e" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><path d="M559.5,330 L608,275 L632,275 L680.5,330 Z" fill="#9c8f6e" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><path d="M737,330 L758,300 L782,300 L803,330 Z" fill="#9c8f6e" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><text x="240" y="150" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">active volcano</text><text x="240" y="170" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">over the hotspot</text><text x="610" y="170" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">extinct volcanoes, older with distance</text><line x1="500" y1="236" x2="800" y2="236" stroke="#8a6d0d" stroke-width="4" marker-end="url(#ahO)"/><text x="650" y="260" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">older</text><line x1="520" y1="420" x2="760" y2="420" stroke="#1e2a44" stroke-width="6" marker-end="url(#ah)"/><text x="640" y="450" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">plate moves over the hotspot</text><text x="858" y="548" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">Not to scale</text><rect x="30" y="580" width="840" height="156" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="612.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Describing a distribution</text><text x="48" y="644.82" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Pattern: narrow linear belts along plate boundaries.</text><text x="48" y="669.82" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Named location: the Ring of Fire around the Pacific Ocean; a belt down the middle of the</text><text x="48" y="690.82" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Atlantic Ocean.</text><text x="48" y="715.82" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Exception: hotspot volcanoes far from any boundary, such as the Hawaiian Islands.</text>
</svg>