<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1008" width="900" height="1008" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="1008" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Convection currents and plate boundaries</text>

<rect x="30" y="110" width="840" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="32" y="160" width="836" height="28" rx="0" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><rect x="448" y="160" width="4" height="28" rx="0" fill="#b5602e"/><rect x="32" y="188" width="836" height="140" rx="0" fill="#f2e7b8"/><path d="M425,236 A165,34 0 0 0 95,236" fill="none" stroke="#b5602e" stroke-width="4" marker-end="url(#ahR)"/><path d="M95,236 A165,34 0 0 0 425,236" fill="none" stroke="#b5602e" stroke-width="4" marker-end="url(#ahR)"/><path d="M475,236 A165,34 0 0 1 805,236" fill="none" stroke="#b5602e" stroke-width="4" marker-end="url(#ahR)"/><path d="M805,236 A165,34 0 0 1 475,236" fill="none" stroke="#b5602e" stroke-width="4" marker-end="url(#ahR)"/><line x1="400" y1="148" x2="300" y2="148" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><line x1="500" y1="148" x2="600" y2="148" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><text x="450" y="140" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">plates dragged</text><text x="450" y="296" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">hot rock rises</text><text x="450" y="316" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">(less dense)</text><text x="60" y="296" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">cools and sinks</text><text x="840" y="296" font-size="16" font-weight="700" fill="#b5602e" text-anchor="end">cools and sinks</text><text x="450" y="350" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">heat from the core</text><text x="54" y="180" font-size="15" font-weight="700" fill="#ffffff" text-anchor="start">plate</text><rect x="30" y="380" width="840" height="190" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="50" y="450" width="300" height="70" rx="0" fill="#f2e7b8"/><rect x="50" y="450" width="135" height="30" rx="0" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><rect x="215" y="450" width="135" height="30" rx="0" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><path d="M185,520 L190,452 L210,452 L215,520 Z" fill="#b5602e"/><line x1="150" y1="430" x2="80" y2="430" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="250" y1="430" x2="320" y2="430" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="222" y="508" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">magma</text><text x="50" y="416" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Divergent (constructive)</text><text x="390" y="420" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Plates move apart; magma rises into the gap and forms</text><text x="390" y="441" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">new crust.</text><text x="390" y="476" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">Volcanic activity and earthquakes</text><text x="390" y="504" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">e.g. Mid-Atlantic Ridge, Iceland</text><rect x="30" y="584" width="840" height="190" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="50" y="680" width="300" height="80" rx="0" fill="#f2e7b8"/><rect x="50" y="690" width="300" height="0" rx="0" fill="#b5d3cf"/><path d="M50,680 L220,680 L300,750 L276,760 L205,702 L50,702 Z" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><path d="M225,680 L350,680 L350,716 L255,716 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2"/><path d="M270,680 L290,642 L302,642 L322,680 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.5"/><path d="M296,644 L286,740" fill="none" stroke="#b5602e" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><line x1="70" y1="660" x2="150" y2="660" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="90" y="732" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">oceanic</text><text x="340" y="708" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="end">continental</text><text x="50" y="620" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Convergent (destructive)</text><text x="390" y="624" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Plates move together; the denser oceanic plate is</text><text x="390" y="645" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">subducted beneath the other plate and melts.</text><text x="390" y="680" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">Earthquakes and a line of volcanoes</text><text x="390" y="708" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">e.g. Andes, Japan</text><rect x="30" y="788" width="840" height="190" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="50" y="838" width="300" height="50" rx="0" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2"/><rect x="50" y="888" width="300" height="50" rx="0" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><line x1="50" y1="888" x2="350" y2="888" stroke="#b5602e" stroke-width="4" stroke-dasharray="10 6"/><line x1="270" y1="863" x2="130" y2="863" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><line x1="130" y1="913" x2="270" y2="913" stroke="#ffffff" stroke-width="4" marker-end="url(#ah)"/><text x="350" y="958" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">seen from above</text><text x="50" y="824" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Conservative</text><text x="390" y="828" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Plates slide past each other; friction locks them</text><text x="390" y="849" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">until stress is suddenly released.</text><text x="390" y="884" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">Earthquakes only, no volcanoes</text><text x="390" y="912" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">e.g. San Andreas Fault, California</text>
</svg>