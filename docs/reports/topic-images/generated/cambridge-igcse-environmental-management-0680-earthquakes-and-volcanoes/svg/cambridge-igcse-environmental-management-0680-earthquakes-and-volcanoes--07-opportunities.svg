2" stroke="#1e2a44" stroke-width="3"/><text x="150" y="380" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start"></text><circle cx="225" cy="330" r="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="225" y="336.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="60" y="160" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start"></text><line x1="225" y1="347" x2="240" y2="400" stroke="#1e2a44" stroke-width="2"/><circle cx="590" cy="300" r="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="590" y="306.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><line x1="590" y1="317" x2="590" y2="358" stroke="#1e2a44" stroke-width="2"/><circle cx="690" cy="330" r="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="690" y="336.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><line x1="704" y1="340" x2="740" y2="430" stroke="#1e2a44" stroke-width="2"/><circle cx="510" cy="180" r="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="510" y="186.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><line x1="498" y1="190" x2="476" y2="206" stroke="#1e2a44" stroke-width="2"/><circle cx="330" cy="520" r="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="330" y="526.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><line x1="330" y1="503" x2="380" y2="450" stroke="#1e2a44" stroke-width="2"/><circle cx="385" cy="442" r="7" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="405" cy="430" r="6" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="858" y="140" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">Not to scale</text><circle cx="50" cy="636" r="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="50" y="642.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="78" y="634" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Fertile soils</text><text x="78" y="658" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">weathered ash and lava release minerals: high</text><text x="78" y="676" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">farm yields</text><circle cx="480" cy="636" r="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="480" y="642.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="508" y="634" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Minerals</text><text x="508" y="658" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">sulfur and some metal ores deposited near</text><text x="508" y="676" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">volcanoes</text><circle cx="50" cy="714" r="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="50" y="720.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="78" y="712" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Building materials</text><text x="78" y="736" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">rocks such as basalt quarried for construction</text><circle cx="480" cy="714" r="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="480" y="720.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="508" y="712" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Geothermal power</text><text x="508" y="736" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">steam from heated underground water turns</text><text x="508" y="754" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">turbines; Iceland uses it widely</text><circle cx="50" cy="792" r="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="50" y="798.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="78" y="790" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Tourism</text><text x="78" y="814" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">craters, hot springs and geysers bring</text><text x="78" y="832" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">visitors and jobs</text>
