<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 624" width="900" height="624" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="624" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What a strong comment adds</text>

<rect x="30" y="110" width="840" height="44" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2" stroke-dasharray="7 5"/><text x="50" y="139" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">WEAK</text><text x="110" y="140" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"The simile paints a picture of the sun."</text><line x1="80" y1="158" x2="80" y2="176" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="180" width="260" height="70" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="204" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PAIR</text><text x="46" y="232" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">sun + pasted wafer</text><text x="305" y="222" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">+</text><rect x="320" y="180" width="260" height="70" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="336" y="204" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">TRAIT</text><text x="336" y="232" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">flat, small, manufactured</text><text x="595" y="222" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">+</text><rect x="610" y="180" width="260" height="70" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="626" y="204" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">EFFECT OR ATTITUDE</text><text x="626" y="232" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">the scene loses its grandeur</text><rect x="30" y="278" width="840" height="44" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2" stroke-dasharray="7 5"/><text x="50" y="307" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">WEAK</text><text x="110" y="308" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"The house is personified."</text><line x1="80" y1="326" x2="80" y2="344" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="348" width="260" height="70" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="372" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PAIR</text><text x="46" y="400" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">house + a person</text><text x="305" y="390" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">+</text><rect x="320" y="348" width="260" height="70" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="336" y="372" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">TRAIT</text><text x="336" y="400" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">a stubborn will</text><text x="595" y="390" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">+</text><rect x="610" y="348" width="260" height="70" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="626" y="372" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">EFFECT OR ATTITUDE</text><text x="626" y="400" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">a wry, gloomy mood</text><rect x="30" y="446" width="840" height="44" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2" stroke-dasharray="7 5"/><text x="50" y="475" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">WEAK</text><text x="110" y="476" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"The narrator compares the clerk to a stamp, which shows he is a clerk."</text><line x1="80" y1="494" x2="80" y2="512" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="516" width="260" height="70" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="540" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PAIR</text><text x="46" y="568" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">clerk + rubber stamp</text><text x="305" y="558" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">+</text><rect x="320" y="516" width="260" height="70" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="336" y="540" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">TRAIT</text><text x="336" y="568" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">repetition, impersonality</text><text x="595" y="558" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">+</text><rect x="610" y="516" width="260" height="70" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="626" y="540" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">EFFECT OR ATTITUDE</text><text x="626" y="568" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">weary contempt for routine</text>
</svg>