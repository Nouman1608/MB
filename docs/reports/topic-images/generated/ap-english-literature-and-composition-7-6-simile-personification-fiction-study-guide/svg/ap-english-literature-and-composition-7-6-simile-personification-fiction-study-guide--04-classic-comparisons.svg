<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 483" width="900" height="483" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="483" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Comparisons in Crane and Dickens</text>

<rect x="30" y="110" width="840" height="50" rx="10" fill="#1e2a44"/><text x="44" y="141" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">Work</text><text x="194" y="141" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">Described</text><text x="374" y="141" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">Compared to</text><text x="604" y="141" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">Effect or attitude</text><rect x="30" y="160" width="840" height="68" fill="#f8faf9" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="187.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">The Red Badge</text><text x="44" y="208.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">of Courage</text><text x="194" y="187.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the red sun</text><line x1="180" y1="160" x2="180" y2="228" stroke="#c9d6d4" stroke-width="2"/><text x="374" y="187.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"pasted in the sky like a</text><text x="374" y="208.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">wafer"</text><line x1="360" y1="160" x2="360" y2="228" stroke="#c9d6d4" stroke-width="2"/><text x="604" y="187.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A world stripped of grandeur and</text><text x="604" y="208.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">glory; a detached view of war</text><line x1="590" y1="160" x2="590" y2="228" stroke="#c9d6d4" stroke-width="2"/><rect x="30" y="228" width="840" height="89" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="255.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Hard Times</text><text x="194" y="255.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the steam-engine's</text><text x="194" y="276.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">piston</text><line x1="180" y1="228" x2="180" y2="317" stroke="#c9d6d4" stroke-width="2"/><text x="374" y="255.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"the head of an elephant</text><text x="374" y="276.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">in a state of melancholy</text><text x="374" y="297.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">madness"</text><line x1="360" y1="228" x2="360" y2="317" stroke="#c9d6d4" stroke-width="2"/><text x="604" y="255.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Gives a machine an animal's</text><text x="604" y="276.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">sadness: a human cost in the</text><text x="604" y="297.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">industrial town</text><line x1="590" y1="228" x2="590" y2="317" stroke="#c9d6d4" stroke-width="2"/><rect x="30" y="317" width="840" height="68" fill="#f8faf9" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="344.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Hard Times</text><text x="194" y="344.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Mr Gradgrind</text><line x1="180" y1="317" x2="180" y2="385" stroke="#c9d6d4" stroke-width="2"/><text x="374" y="344.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"a kind of cannon loaded</text><text x="374" y="365.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">to the muzzle with facts"</text><line x1="360" y1="317" x2="360" y2="385" stroke="#c9d6d4" stroke-width="2"/><text x="604" y="344.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A person given the qualities of a</text><text x="604" y="365.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">weapon</text><line x1="590" y1="317" x2="590" y2="385" stroke="#c9d6d4" stroke-width="2"/><rect x="30" y="385" width="840" height="68" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="412.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Hard Times</text><text x="194" y="412.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the children</text><line x1="180" y1="385" x2="180" y2="453" stroke="#c9d6d4" stroke-width="2"/><text x="374" y="412.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"little vessels" ready to be</text><text x="374" y="433.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">filled</text><line x1="360" y1="385" x2="360" y2="453" stroke="#c9d6d4" stroke-width="2"/><text x="604" y="412.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Minds treated as containers: the</text><text x="604" y="433.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">narrator's attitude to the system</text><line x1="590" y1="385" x2="590" y2="453" stroke="#c9d6d4" stroke-width="2"/>
</svg>