<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 713" width="900" height="713" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="713" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: the cart and the stones</text>

<circle cx="158.5" cy="335" r="130" fill="#dce9e7" fill-opacity="0.85" stroke="#2e6b62" stroke-width="3"/><circle cx="301.5" cy="335" r="130" fill="#f2e7b8" fill-opacity="0.7" stroke="#8a6d0d" stroke-width="3"/><circle cx="158.5" cy="335" r="130" fill="none" stroke="#2e6b62" stroke-width="3"/><text x="103.9" y="280.4" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">DESCRIBED</text><text x="103.9" y="319.4" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Mr Fenn's</text><text x="103.9" y="340.4" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">voice</text><text x="356.1" y="280.4" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">COMPARED TO</text><text x="356.1" y="319.4" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">a cart on a</text><text x="356.1" y="340.4" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">gravel drive</text><text x="230" y="275.2" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">TRAIT</text><text x="230" y="311.6" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">steady, loud</text><text x="230" y="335.6" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">grinding</text><text x="230" y="359.6" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">slow, heavy</text><circle cx="598.5" cy="335" r="130" fill="#dce9e7" fill-opacity="0.85" stroke="#2e6b62" stroke-width="3"/><circle cx="741.5" cy="335" r="130" fill="#f2e7b8" fill-opacity="0.7" stroke="#8a6d0d" stroke-width="3"/><circle cx="598.5" cy="335" r="130" fill="none" stroke="#2e6b62" stroke-width="3"/><text x="543.9" y="280.4" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">DESCRIBED</text><text x="543.9" y="319.4" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">the</text><text x="543.9" y="340.4" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">congregation</text><text x="796.1" y="280.4" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">COMPARED TO</text><text x="796.1" y="319.4" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">stones in a</text><text x="796.1" y="340.4" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">field</text><text x="670" y="275.2" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">TRAIT</text><text x="670" y="311.6" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">inert, heavy</text><text x="670" y="335.6" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">passive</text><text x="670" y="359.6" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">scattered</text><rect x="55" y="116" width="370" height="64" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="240" y="143.25" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">twist: "always about to arrive": the sermon</text><text x="240" y="163.25" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">never reaches its point</text><rect x="475" y="116" width="370" height="64" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="660" y="153.25" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">aware of each other "only as a weight"</text><rect x="30" y="490" width="411" height="113" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="523" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ATTITUDE</text><text x="50" y="550.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Gently satirical and weary</text><text x="50" y="578.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">towards the preacher</text><rect x="459" y="490" width="411" height="113" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="479" y="523" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ATTITUDE</text><text x="479" y="550.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Unreceptive and isolated</text><text x="479" y="578.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">how the narrator regards the listeners</text><rect x="30" y="619" width="840" height="64" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="658" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Function: a service that is loud and lifeless: noise without progress, listeners who offer only mass</text>
</svg>