<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 672" width="900" height="672" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="672" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Personification works in two directions</text>

<rect x="30" y="110" width="360" height="320" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><rect x="510" y="110" width="360" height="320" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="210" y="146" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="middle">HUMAN</text><text x="690" y="146" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle">NON-HUMAN</text><text x="210" y="170" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">moods, will, feelings</text><text x="690" y="170" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">objects, animals, machines</text><line x1="450" y1="110" x2="450" y2="430" stroke="#1e2a44" stroke-width="3" stroke-dasharray="10 7"/><line x1="300" y1="228" x2="600" y2="228" stroke="#8a6d0d" stroke-width="5" marker-end="url(#ahO)"/><rect x="313.952" y="186" width="272.09599999999995" height="30" rx="15" fill="#ffffff" stroke="#8a6d0d" stroke-width="2"/><text x="450" y="206" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">human qualities given to things</text><rect x="530" y="252" width="320" height="73" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="544" y="279.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"The house sulked"</text><text x="544" y="306.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"the fog crept"</text><line x1="600" y1="390" x2="300" y2="390" stroke="#2e6b62" stroke-width="5" marker-end="url(#ahT)"/><rect x="293.24799999999993" y="348" width="313.5040000000001" height="30" rx="15" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="450" y="368" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">non-human qualities given to people</text><rect x="50" y="252" width="320" height="95" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="64" y="279.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">a man "loaded to the muzzle with</text><text x="64" y="301.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">facts"</text><text x="64" y="328.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">children as "little vessels"</text><rect x="30" y="470" width="411" height="138" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="503" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">EFFECT</text><text x="50" y="530.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Gives a thing a mood or will</text><text x="50" y="558.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">shapes atmosphere and the character's relation</text><text x="50" y="579.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">to it</text><rect x="459" y="470" width="411" height="138" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="479" y="503" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EFFECT</text><text x="479" y="530.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Communicates an attitude about the</text><text x="479" y="555.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">person</text><text x="479" y="583.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">dehumanising, mocking, admiring, pitying</text><text x="450" y="644" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Ask: what attitude does the writer reveal by crossing the line?</text>
</svg>