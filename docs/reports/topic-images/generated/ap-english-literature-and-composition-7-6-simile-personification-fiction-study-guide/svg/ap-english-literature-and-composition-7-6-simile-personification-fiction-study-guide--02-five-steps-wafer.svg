<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 708" width="900" height="708" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="708" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Analysing a simile in five steps</text>

<rect x="30" y="110" width="840" height="60" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="148" font-size="20" font-weight="600" fill="#1e2a44" text-anchor="middle" font-style="italic">"the red sun was pasted in the sky like a wafer"</text><rect x="30" y="196" width="840" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="66" cy="242" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="66" y="249.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="100" y="228" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Parts</text><text x="100" y="252" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">What is described, and what is it</text><text x="100" y="272" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">compared to?</text><line x1="380" y1="210" x2="380" y2="274" stroke="#c9d6d4" stroke-width="2"/><text x="400" y="248" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The sun, compared to a wafer</text><rect x="30" y="298" width="840" height="72" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="66" cy="334" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="66" y="341.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="100" y="330" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Trait</text><text x="100" y="354" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Which quality links them?</text><line x1="380" y1="312" x2="380" y2="356" stroke="#c9d6d4" stroke-width="2"/><text x="400" y="340" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Thinness, flatness, redness, being stuck on</text><rect x="30" y="380" width="840" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="66" cy="426" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="66" y="433.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="100" y="412" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Connotations</text><text x="100" y="436" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">What else does the comparison</text><text x="100" y="456" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">bring in?</text><line x1="380" y1="394" x2="380" y2="458" stroke="#c9d6d4" stroke-width="2"/><text x="400" y="421" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A small, mass-produced, bland object; something</text><text x="400" y="443" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">pressed or stuck</text><rect x="30" y="482" width="840" height="78" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="66" cy="521" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="66" y="528.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="100" y="514" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Attitude</text><text x="100" y="538" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">What tone or feeling results?</text><line x1="380" y1="496" x2="380" y2="546" stroke="#c9d6d4" stroke-width="2"/><text x="400" y="516" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A diminished, unimpressive sun; a detached, ironic</text><text x="400" y="538" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">view</text><rect x="30" y="570" width="840" height="78" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><circle cx="66" cy="609" r="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="66" y="616.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="100" y="602" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Function</text><text x="100" y="626" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">What does it do in this passage?</text><line x1="380" y1="584" x2="380" y2="634" stroke="#c9d6d4" stroke-width="2"/><text x="400" y="604" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Presents the world as if emptied of grandeur: chilling</text><text x="400" y="626" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">and strange</text><text x="450" y="680" font-size="16" font-weight="600" fill="#b5602e" text-anchor="middle" font-style="italic">Left out: a wafer is not hot or bright, and that absence is part of the effect</text>
</svg>