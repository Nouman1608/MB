<rect width="900" height="667" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What a simile chooses</text>

<circle cx="356.5" cy="350" r="170" fill="#dce9e7" fill-opacity="0.85" stroke="#2e6b62" stroke-width="3"/><circle cx="543.5" cy="350" r="170" fill="#f2e7b8" fill-opacity="0.7" stroke="#8a6d0d" stroke-width="3"/><circle cx="356.5" cy="350" r="170" fill="none" stroke="#2e6b62" stroke-width="3"/><text x="285.1" y="278.6" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">DESCRIBED</text><text x="285.1" y="329.6" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">a voice</text><text x="614.9" y="278.6" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">COMPARED TO</text><text x="614.9" y="329.6" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">a cart on a</text><text x="614.9" y="353.6" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">gravel drive</text><text x="450" y="271.8" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">TRAIT</text><text x="450" y="319.4" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">repetition</text><text x="450" y="343.4" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">grinding</text><text x="450" y="367.4" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">no arrival</text><rect x="70" y="110" width="260" height="52" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="200" y="141.95" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">"like" is only the hinge</text><rect x="570" y="110" width="260" height="52" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="700" y="141.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">the pair + the trait = effect</text><rect x="30" y="545" width="840" height="92" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="8 6"/><text x="50" y="579" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">WHAT IS LEFT OUT ALSO COUNTS</text><text x="50" y="607" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A comparison chooses what to emphasise and what to leave out. A plain statement says only that</text><text x="50" y="629" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">the voice is loud.</text>
</svg>