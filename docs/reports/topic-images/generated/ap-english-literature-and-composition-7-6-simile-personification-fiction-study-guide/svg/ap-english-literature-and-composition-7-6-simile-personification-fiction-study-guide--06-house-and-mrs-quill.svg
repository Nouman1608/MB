<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: a sulking house, a ticking woman</text>

<rect x="120" y="230" width="170" height="120" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3"/><path d="M108,230 L205,180 L302,230 Z" fill="#9c8f6e" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><path d="M160,266 l24,6 M226,272 l24,-6" fill="none" stroke="#1e2a44" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><path d="M180,308 q25,-14 50,0" fill="none" stroke="#1e2a44" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><rect x="80" y="326" width="250" height="34" rx="17" fill="#6f9a52" opacity="0.8"/><line x1="100" y1="160" x2="90" y2="190" stroke="#2b5a9a" stroke-width="2.5"/><line x1="145" y1="160" x2="135" y2="190" stroke="#2b5a9a" stroke-width="2.5"/><line x1="190" y1="160" x2="180" y2="190" stroke="#2b5a9a" stroke-width="2.5"/><line x1="235" y1="160" x2="225" y2="190" stroke="#2b5a9a" stroke-width="2.5"/><line x1="280" y1="160" x2="270" y2="190" stroke="#2b5a9a" stroke-width="2.5"/><line x1="325" y1="160" x2="315" y2="190" stroke="#2b5a9a" stroke-width="2.5"/><circle cx="660" cy="255" r="72" fill="#ffffff" stroke="#1e2a44" stroke-width="4"/><line x1="660" y1="195" x2="660" y2="187" stroke="#1e2a44" stroke-width="3"/><line x1="690" y1="203.03847577293368" x2="694" y2="196.11027254265815" stroke="#1e2a44" stroke-width="3"/><line x1="711.9615242270663" y1="225" x2="718.8897274573418" y2="221" stroke="#1e2a44" stroke-width="3"/><line x1="720" y1="255" x2="728" y2="255" stroke="#1e2a44" stroke-width="3"/><line x1="711.9615242270663" y1="285" x2="718.8897274573418" y2="289" stroke="#1e2a44" stroke-width="3"/><line x1="690" y1="306.9615242270663" x2="694" y2="313.88972745734185" stroke="#1e2a44" stroke-width="3"/><line x1="660" y1="315" x2="660" y2="323" stroke="#1e2a44" stroke-width="3"/><line x1="630" y1="306.9615242270663" x2="626" y2="313.88972745734185" stroke="#1e2a44" stroke-width="3"/><line x1="608.0384757729337" y1="285" x2="601.1102725426582" y2="289" stroke="#1e2a44" stroke-width="3"/><line x1="600" y1="255" x2="592" y2="255" stroke="#1e2a44" stroke-width="3"/><line x1="608.0384757729337" y1="225" x2="601.1102725426582" y2="221" stroke="#1e2a44" stroke-width="3"/><line x1="630" y1="203.03847577293368" x2="626" y2="196.1102725426582" stroke="#1e2a44" stroke-width="3"/><line x1="660" y1="255" x2="696" y2="267" stroke="#1e2a44" stroke-width="5" stroke-linecap="round"/><line x1="660" y1="255" x2="660" y2="307" stroke="#b5602e" stroke-width="4" stroke-linecap="round"/><circle cx="660" cy="255" r="6" fill="#1e2a44"/><text x="660" y="355" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">a quarter to six</text><text x="205" y="130" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">The house</text><text x="660" y="130" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Mrs Quill</text><rect x="30" y="380" width="411" height="153" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="413" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">THING → HUMAN QUALITIES</text><text x="50" y="438.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">"sulked behind its hedge and refused to</text><text x="50" y="460.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">notice the rain"</text><text x="50" y="487.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">a mood and a stubborn will: resentful isolation,</text><text x="50" y="508.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">faint comedy; wry affection mixed with gloom</text><rect x="459" y="380" width="411" height="153" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="479" y="413" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PERSON → CLOCK QUALITIES</text><text x="479" y="438.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">"a handsome clock in her day" who "ticked</text><text x="479" y="460.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">down the passage"</text><text x="479" y="487.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">regular, precise, rigid, a lost beauty: affectionate</text><text x="479" y="508.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">mockery with sympathy</text><rect x="30" y="549" width="840" height="64" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="588" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">An inverted household: objects have moods, people have mechanisms</text>
</svg>