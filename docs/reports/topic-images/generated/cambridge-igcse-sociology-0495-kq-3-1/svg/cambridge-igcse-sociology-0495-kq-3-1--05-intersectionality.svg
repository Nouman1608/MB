<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Intersectionality</text>

<rect x="30" y="110" width="840" height="500" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="375" cy="285" r="125" fill="#b5d3cf" fill-opacity="0.55" stroke="#1e2a44" stroke-width="2.5"/><circle cx="525" cy="285" r="125" fill="#f2e7b8" fill-opacity="0.55" stroke="#1e2a44" stroke-width="2.5"/><circle cx="375" cy="435" r="125" fill="#efdfa8" fill-opacity="0.55" stroke="#1e2a44" stroke-width="2.5"/><circle cx="525" cy="435" r="125" fill="#dce9e7" fill-opacity="0.55" stroke="#1e2a44" stroke-width="2.5"/><text x="170" y="180" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Social class</text><text x="730" y="180" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Gender</text><text x="170" y="555" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Ethnicity</text><text x="730" y="555" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Age</text><line x1="265.52943202668627" y1="224.65768692202707" x2="196.2729363135953" y2="186.4821551387135" stroke="#1e2a44" stroke-width="2"/><line x1="634.4705679733137" y1="224.65768692202707" x2="703.7270636864047" y2="186.4821551387135" stroke="#1e2a44" stroke-width="2"/><line x1="265.30397856070607" y1="494.93148488390693" x2="196.32704514543053" y2="532.6164436278623" stroke="#1e2a44" stroke-width="2"/><line x1="634.6960214392939" y1="494.93148488390693" x2="703.6729548545694" y2="532.6164436278623" stroke="#1e2a44" stroke-width="2"/><circle cx="450" cy="360" r="18" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><line x1="468" y1="360" x2="700" y2="360" stroke="#1e2a44" stroke-width="2"/><text x="708" y="366" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">one person</text><rect x="30" y="630" width="840" height="102" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="663.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Crenshaw (1989): inequalities overlap and interact, so an older, working-class minority</text><text x="50" y="685.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">woman faces disadvantages different from, not just the sum of, those of a middle-class</text><text x="50" y="707.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">minority man or a working-class white woman.</text>
