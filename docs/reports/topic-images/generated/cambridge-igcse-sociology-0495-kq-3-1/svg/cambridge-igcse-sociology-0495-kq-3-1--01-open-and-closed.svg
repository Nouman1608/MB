<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 766" width="900" height="766" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="766" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Closed and open societies</text>

<text x="235" y="134" font-size="23" font-weight="700" fill="#b5602e" text-anchor="middle">Closed society</text><rect x="30" y="152" width="410" height="92" rx="14" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="46" y="181" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">POSITION</text><text x="46" y="211.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Ascribed status: fixed at birth</text><rect x="30" y="254" width="410" height="92" rx="14" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="46" y="283" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">MOVEMENT</text><text x="46" y="313.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Very little or none</text><rect x="30" y="356" width="410" height="92" rx="14" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="46" y="385" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">JUSTIFIED BY</text><text x="46" y="415.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Religion, tradition, law</text><rect x="30" y="458" width="410" height="102" rx="14" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="46" y="487" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">EXAMPLES</text><text x="46" y="517.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Caste system; slavery; apartheid South</text><text x="46" y="539.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Africa (1948–1994)</text><text x="665" y="134" font-size="23" font-weight="700" fill="#2e6b62" text-anchor="middle">Open society</text><rect x="460" y="152" width="410" height="92" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="476" y="181" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">POSITION</text><text x="476" y="211.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Achieved status: earned</text><rect x="460" y="254" width="410" height="92" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="476" y="283" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">MOVEMENT</text><text x="476" y="313.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Possible, upwards and downwards</text><rect x="460" y="356" width="410" height="92" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="476" y="385" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">JUSTIFIED BY</text><text x="476" y="415.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Merit, effort, qualifications</text><rect x="460" y="458" width="410" height="92" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="476" y="487" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EXAMPLES</text><text x="476" y="517.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Modern class systems</text><line x1="70" y1="580" x2="830" y2="580" stroke="#1e2a44" stroke-width="4" marker-start="url(#ah)" marker-end="url(#ah)"/><text x="60" y="614" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">more closed</text><text x="840" y="614" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="end">more open</text><circle cx="590" cy="580" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="590" y="614" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">real class societies</text><rect x="30" y="636" width="840" height="102" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="669.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">No real society is perfectly open or closed: children of wealthy families are far more</text><text x="50" y="691.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">likely to stay wealthy, and caste remains influential in India although caste</text><text x="50" y="713.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">discrimination is illegal.</text>
</svg>