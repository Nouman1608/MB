<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Social mobility and meritocracy</text>

<rect x="30" y="110" width="410" height="360" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="460" y="110" width="410" height="360" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="235" y="148" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="middle">Intergenerational</text><text x="235" y="172" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">child’s position vs parents’</text><text x="665" y="148" font-size="21" font-weight="700" fill="#8a6d0d" text-anchor="middle">Intragenerational</text><text x="665" y="172" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">movement within one life</text><line x1="170" y1="200" x2="170" y2="440" stroke="#1e2a44" stroke-width="3"/><line x1="162" y1="210" x2="178" y2="210" stroke="#1e2a44" stroke-width="3"/><text x="156" y="215" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">higher strata</text><line x1="162" y1="280" x2="178" y2="280" stroke="#1e2a44" stroke-width="3"/><line x1="162" y1="350" x2="178" y2="350" stroke="#1e2a44" stroke-width="3"/><line x1="162" y1="420" x2="178" y2="420" stroke="#1e2a44" stroke-width="3"/><text x="156" y="425" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">lower strata</text><line x1="600" y1="200" x2="600" y2="440" stroke="#1e2a44" stroke-width="3"/><line x1="592" y1="210" x2="608" y2="210" stroke="#1e2a44" stroke-width="3"/><text x="586" y="215" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">higher strata</text><line x1="592" y1="280" x2="608" y2="280" stroke="#1e2a44" stroke-width="3"/><line x1="592" y1="350" x2="608" y2="350" stroke="#1e2a44" stroke-width="3"/><line x1="592" y1="420" x2="608" y2="420" stroke="#1e2a44" stroke-width="3"/><text x="586" y="425" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">lower strata</text><circle cx="230" cy="396" r="10" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><rect x="218" y="408" width="24" height="26" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="252" y="422" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">parent</text><circle cx="320" cy="256" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><rect x="308" y="268" width="24" height="26" rx="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="342" y="282" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">child</text><line x1="256" y1="400" x2="314" y2="306" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><circle cx="650" cy="396" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><rect x="638" y="408" width="24" height="26" rx="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="672" y="422" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">young</text><circle cx="740" cy="326" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><rect x="728" y="338" width="24" height="26" rx="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="762" y="352" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">middle age</text><circle cx="650" cy="256" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><rect x="638" y="268" width="24" height="26" rx="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="672" y="282" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">older</text><line x1="676" y1="398" x2="734" y2="376" stroke="#8a6d0d" stroke-width="4" marker-end="url(#ahO)"/><line x1="742" y1="326" x2="676" y2="290" stroke="#8a6d0d" stroke-width="4" marker-end="url(#ahO)"/><rect x="30" y="490" width="410" height="152" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="526" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Meritocracy</text><text x="50" y="554.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Position depends on talent and effort, not</text><text x="50" y="575.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">background. Davis and Moore (1945): higher</text><text x="50" y="596.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">rewards motivate the most able to train for</text><text x="50" y="617.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the most important jobs.</text><rect x="460" y="490" width="410" height="152" rx="14" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="480" y="526" font-size="20" font-weight="700" fill="#b5602e" text-anchor="start">Critics reply</text><text x="480" y="554.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Inherited wealth, unequal schooling,</text><text x="480" y="575.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">discrimination and social networks mean many</text><text x="480" y="596.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">positions are not earned; pay often reflects</text><text x="480" y="617.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">power.</text>
</svg>