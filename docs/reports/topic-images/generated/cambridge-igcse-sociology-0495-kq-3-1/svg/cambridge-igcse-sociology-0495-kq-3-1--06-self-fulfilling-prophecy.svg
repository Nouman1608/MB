="400" fill="#4a5568" text-anchor="middle">A powerful person predicts:</text><text x="450" y="193" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">“this pupil will spurt ahead”</text><rect x="590" y="267" width="260" height="94" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="720" y="295.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Treatment</text><text x="720" y="323" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Teachers act on the</text><text x="720" y="343" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">expectation</text><rect x="320" y="417" width="260" height="94" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="445.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Response</text><text x="450" y="473" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">The pupil responds to how they</text><text x="450" y="493" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">are treated</text><rect x="50" y="277" width="260" height="74" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="180" y="305.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Prophecy fulfilled</text><text x="180" y="333" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">The pupil makes greater gains</text></g><rect x="30" y="516" width="270.6666666666667" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="550.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Master status</text><text x="50" y="578.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A label that overrides all</text><text x="50" y="599.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">else (Becker, 1963), e.g.</text><text x="50" y="620.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">“unemployed”, “benefit</text><text x="50" y="641.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">claimant”</text><rect x="314.6666666666667" y="516" width="270.6666666666667" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="334.6666666666667" y="550.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Stereotypes</text><text x="334.6666666666667" y="578.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Simplified views, e.g. poor</text><text x="334.6666666666667" y="599.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">families as “lazy”, shape</text><text x="334.6666666666667" y="620.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">treatment</text><rect x="599.3333333333334" y="516" width="270.6666666666667" height="150" rx="14" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="619.3333333333334" y="550.4" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">Weakness</text><text x="619.3333333333334" y="578.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Can ignore structural</text><text x="619.3333333333334" y="599.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">causes: money, ownership,</text><text x="619.3333333333334" y="620.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">law</text>
