<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 625" width="900" height="625" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="625" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The traditional Hindu caste system</text>

<path d="M175,120 L325,120 L360,194 L140,194 Z" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="250" y="154" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Brahmins</text><text x="250" y="178" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">priests and scholars</text><path d="M140,194 L360,194 L395,268 L105,268 Z" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="250" y="228" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Kshatriyas</text><text x="250" y="252" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">rulers and warriors</text><path d="M105,268 L395,268 L430,342 L70,342 Z" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="250" y="302" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Vaishyas</text><text x="250" y="326" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">merchants and traders</text><path d="M70,342 L430,342 L465,416 L35,416 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="250" y="376" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Shudras</text><text x="250" y="400" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">labourers and servants</text><rect x="30" y="434" width="440" height="66" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="8 6"/><text x="250" y="462" font-size="19" font-weight="700" fill="#b5602e" text-anchor="middle">Dalits</text><text x="250" y="486" font-size="15" font-weight="400" fill="#b5602e" text-anchor="middle">placed outside and below the varnas</text><rect x="500" y="110" width="370" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="520" y="145.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Ascribed at birth</text><text x="520" y="173.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Justified by religious ideas of purity</text><text x="520" y="194.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">and pollution</text><rect x="500" y="229" width="370" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="520" y="264.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Kept closed</text><text x="520" y="292.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Linked to occupation; endogamy: marrying</text><text x="520" y="313.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">within one’s caste</text><rect x="500" y="348" width="370" height="130" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="520" y="383.2" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Change since 1950</text><text x="520" y="411.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Constitution abolished untouchability;</text><text x="520" y="432.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">reservations (quotas) in education and</text><text x="520" y="453.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">government jobs</text><rect x="500" y="488" width="370" height="109" rx="14" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="520" y="523.2" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">But still</text><text x="520" y="551.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Caste affects marriage, work and</text><text x="520" y="572.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">treatment in many places</text>
</svg>