<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 654" width="900" height="654" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="654" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Key ideas: wealth, poverty and power</text>

<text x="195" y="126" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="middle">Wealth</text><text x="705" y="126" font-size="21" font-weight="700" fill="#8a6d0d" text-anchor="middle">Income</text><rect x="30" y="144" width="330" height="68" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="195" y="171.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Value of what people own:</text><text x="195" y="193.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">property, land, savings, shares</text><rect x="540" y="144" width="330" height="68" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="705" y="171.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Money received over time: wages,</text><text x="705" y="193.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">benefits, investments</text><rect x="378" y="159" width="144" height="38" rx="19" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="184" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">What</text><line x1="360" y1="178" x2="378" y2="178" stroke="#1e2a44" stroke-width="2.5"/><line x1="522" y1="178" x2="540" y2="178" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="224" width="330" height="46" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="195" y="251.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Far more unequal; can be inherited</text><rect x="540" y="224" width="330" height="46" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="705" y="251.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Usually less unequal than wealth</text><rect x="378" y="228" width="144" height="38" rx="19" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="253" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Spread</text><line x1="360" y1="247" x2="378" y2="247" stroke="#1e2a44" stroke-width="2.5"/><line x1="522" y1="247" x2="540" y2="247" stroke="#1e2a44" stroke-width="2.5"/><text x="195" y="310" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="middle">Absolute poverty</text><text x="705" y="310" font-size="21" font-weight="700" fill="#8a6d0d" text-anchor="middle">Relative poverty</text><rect x="30" y="328" width="330" height="68" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="195" y="355.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Lacking basic needs for survival:</text><text x="195" y="377.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">food, shelter, clean water</text><rect x="540" y="328" width="330" height="68" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="705" y="355.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Below the standard of living</text><text x="705" y="377.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">normal in one’s society</text><rect x="378" y="343" width="144" height="38" rx="19" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="368" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Means</text><line x1="360" y1="362" x2="378" y2="362" stroke="#1e2a44" stroke-width="2.5"/><line x1="522" y1="362" x2="540" y2="362" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="408" width="330" height="90" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="195" y="446.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Rowntree, York, from 1899: minimum</text><text x="195" y="468.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">for physical efficiency</text><rect x="540" y="408" width="330" height="90" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="705" y="435.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Townsend (1979): unable to take</text><text x="705" y="457.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">part in activities most people</text><text x="705" y="479.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">take for granted</text><rect x="378" y="434" width="144" height="38" rx="19" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="459" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Study</text><line x1="360" y1="453" x2="378" y2="453" stroke="#1e2a44" stroke-width="2.5"/><line x1="522" y1="453" x2="540" y2="453" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="516" width="840" height="108" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="550.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Power (Weber): the ability to get one’s own way, even against resistance</text><text x="50" y="578.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Economic (owning companies), political (making laws) or social (influencing opinion). Wealth</text><text x="50" y="599.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">makes the others easier to gain.</text>
</svg>