<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 739" width="900" height="739" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="739" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Marxism: why inequality persists</text>

<rect x="250" y="110" width="400" height="90" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="146.6" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Bourgeoisie</text><text x="450" y="176.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">own the means of production</text><rect x="250" y="360" width="400" height="90" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="396.6" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Proletariat</text><text x="450" y="426.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">sell their labour</text><line x1="380" y1="356" x2="380" y2="206" stroke="#2e6b62" stroke-width="6" marker-end="url(#ahT)"/><text x="370" y="270" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="end">value of</text><text x="370" y="290" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="end">what they</text><text x="370" y="310" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="end">produce</text><line x1="520" y1="206" x2="520" y2="356" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><text x="530" y="270" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">wages: less</text><text x="530" y="290" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">than that</text><text x="530" y="310" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">value</text><text x="450" y="288" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="middle">profit</text><rect x="30" y="130" width="200" height="126" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="164.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Exploitation</text><text x="50" y="192" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">profit from paying</text><text x="50" y="212" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">workers less than</text><text x="50" y="232" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">they produce</text><rect x="670" y="130" width="200" height="190" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="690" y="164.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Ideological</text><text x="690" y="188.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">control</text><text x="690" y="216" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">education, religion,</text><text x="690" y="236" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">media make</text><text x="690" y="256" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">inequality seem</text><text x="690" y="276" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">fair: false class</text><text x="690" y="296" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">consciousness</text><rect x="30" y="480" width="410" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="515.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Poverty trap</text><text x="50" y="543.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Earning more means losing benefits and</text><text x="50" y="564.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">paying tax, so extra work gains little</text><rect x="460" y="480" width="410" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="480" y="515.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Reserve army of labour</text><text x="480" y="543.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Hired in booms, dismissed in slumps; keeps</text><text x="480" y="564.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">wages low and workers obedient</text><rect x="30" y="603" width="410" height="108" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="636" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STRENGTH</text><text x="50" y="665.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Links lasting wealth inequality to the</text><text x="50" y="686.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">economic system</text><rect x="460" y="603" width="410" height="108" rx="14" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="480" y="636" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">WEAKNESS</text><text x="480" y="665.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Less attention to gender, ethnicity, age;</text><text x="480" y="686.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">some workers have gained mobility</text>
</svg>