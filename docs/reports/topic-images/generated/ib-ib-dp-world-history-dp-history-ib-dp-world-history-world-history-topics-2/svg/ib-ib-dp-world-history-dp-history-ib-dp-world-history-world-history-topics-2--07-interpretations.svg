<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 554" width="900" height="554" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="554" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Two debates to use in essays</text>

<rect x="30" y="100" width="840" height="186" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="130" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">WHY DID PEOPLE CRUSADE?</text><rect x="90" y="174" width="720" height="22" rx="11" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><circle cx="140" cy="185" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><circle cx="760" cy="185" r="11" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="90" y="162" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Piety</text><text x="810" y="162" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">Land hunger and adventure</text><text x="60" y="226" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-weight="700">Riley-Smith</tspan>: most crusaders were driven by</text><text x="60" y="247" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">piety; crusading was ruinously expensive for</text><text x="60" y="268" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">families who sold or mortgaged land to go.</text><text x="480" y="226" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-weight="700">Older</tspan> <tspan font-weight="700">accounts</tspan>: stressed land hunger and</text><text x="480" y="247" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">adventure.</text><rect x="30" y="308" width="840" height="214" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="338" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DID TECHNOLOGY DECIDE THE HUNDRED YEARS' WAR?</text><rect x="60" y="364" width="360" height="96" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="74" y="392.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">"Infantry revolution"</text><text x="74" y="420.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Archers and dismounted men-at-arms</text><text x="74" y="441.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">defeat mounted knights</text><line x1="426" y1="412" x2="474" y2="412" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="480" y="364" width="360" height="96" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="494" y="402.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">"Artillery revolution"</text><text x="494" y="431.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Cannon make sieges faster</text><text x="60" y="492" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">Clifford Rogers's argument. Test it: why did England, the early innovator, still lose?</text>
</svg>