<rect width="900" height="738" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Tactics and the turning tide</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Hundred Years' War: from English to French victories</text>
<line x1="120" y1="132" x2="120" y2="580" stroke="#1e2a44" stroke-width="4"/><rect x="160" y="124" width="710" height="69" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="173" y="151.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Crécy: English victory</text><text x="173" y="175.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Dismounted men-at-arms with massed longbowmen</text><circle cx="120" cy="158.5" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="100" y="164.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1346</text><rect x="160" y="203" width="710" height="69" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="173" y="230.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Poitiers: English victory</text><text x="173" y="254.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The French king John II is captured</text><circle cx="120" cy="237.5" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="100" y="243.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1356</text><rect x="160" y="282" width="710" height="69" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="173" y="309.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Agincourt: English victory</text><text x="173" y="333.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The same combination of archers and men-at-arms</text><circle cx="120" cy="316.5" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="100" y="322.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1415</text><rect x="160" y="361" width="710" height="69" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="173" y="388.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Relief of Orléans; Charles VII crowned at Reims</text><text x="173" y="412.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Joan of Arc restores French morale and legitimacy</text><circle cx="120" cy="395.5" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="100" y="401.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1429</text><rect x="160" y="440" width="710" height="69" rx="14" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><text x="173" y="467.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Formigny: decisive French victory</text><text x="173" y="491.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">French artillery and better organisation</text><circle cx="120" cy="474.5" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="100" y="480.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1450</text><rect x="160" y="519" width="710" height="69" rx="14" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><text x="173" y="546.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Castillon: decisive French victory</text><text x="173" y="570.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Often cited as a battle won by field artillery</text><circle cx="120" cy="553.5" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="100" y="559.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1453</text><rect x="30" y="610" width="270.6666666666667" height="96" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="165.33333333333334" y="638.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">English wins</text><text x="165.33333333333334" y="666.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">longbowmen and dismounted</text><text x="165.33333333333334" y="687.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">men-at-arms</text><rect x="314.6666666666667" y="610" width="270.6666666666667" height="96" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="648.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">A critical moment</text><text x="450" y="677.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">leadership and morale</text><rect x="599.3333333333334" y="610" width="270.6666666666667" height="96" rx="14" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><text x="734.6666666666667" y="648.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">French wins</text><text x="734.6666666666667" y="677.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">artillery and organisation</text>
</svg>