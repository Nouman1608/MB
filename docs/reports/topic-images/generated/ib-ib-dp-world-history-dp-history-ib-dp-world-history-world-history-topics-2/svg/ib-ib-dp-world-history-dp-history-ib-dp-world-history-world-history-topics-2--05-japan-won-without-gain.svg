<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 634" width="900" height="634" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="634" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Japan: a victory without gain</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">The Mongol invasions of 1274 and 1281 and their consequences</text>
<text x="30" y="138" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">WHY THE INVASIONS FAILED</text><rect x="30" y="162" width="270.6666666666667" height="122" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="192.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Storms</text><text x="46" y="221.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Destroyed much of the fleet</text><text x="46" y="242.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">both times: the <tspan font-style="italic">kamikaze</tspan>,</text><text x="46" y="263.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">"divine winds"</text><rect x="314.6666666666667" y="162" width="270.6666666666667" height="122" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="330.6666666666667" y="192.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Defensive wall</text><text x="330.6666666666667" y="221.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Built along Hakata Bay after</text><text x="330.6666666666667" y="242.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">1274; warriors fought from</text><text x="330.6666666666667" y="263.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">behind it</text><rect x="599.3333333333334" y="162" width="270.6666666666667" height="122" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="615.3333333333334" y="203.32" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Ships and supply</text><text x="615.3333333333334" y="232.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Hastily built ships; hard to</text><text x="615.3333333333334" y="253.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">supply an army by sea</text><text x="30" y="326" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">WHAT FOLLOWED</text><rect x="30" y="350" width="183" height="119" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="378.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Invasions</text><text x="44" y="401.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">defeated</text><text x="44" y="429.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Japan's territory</text><text x="44" y="450.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">unchanged</text><line x1="219" y1="409.5" x2="243" y2="409.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="249" y="350" width="183" height="119" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="263" y="378.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">No conquered</text><text x="263" y="401.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">land</text><text x="263" y="429.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Nothing to reward</text><text x="263" y="450.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">warriors with</text><line x1="438" y1="409.5" x2="462" y2="409.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="468" y="350" width="183" height="119" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="482" y="378.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Shogunate loses</text><text x="482" y="401.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">support</text><text x="482" y="429.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Costly defence</text><text x="482" y="450.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">went on for years</text><line x1="657" y1="409.5" x2="681" y2="409.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="687" y="350" width="183" height="119" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="701" y="400.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Kamakura falls</text><text x="701" y="428.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">1333</text><rect x="30" y="491" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="525.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Medieval meaning of kamikaze</text><text x="50" y="555.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Explain it as the divine winds believed to protect Japan, which strengthened belief in divine</text><text x="50" y="577.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">protection; not its twentieth-century meaning.</text>
</svg>