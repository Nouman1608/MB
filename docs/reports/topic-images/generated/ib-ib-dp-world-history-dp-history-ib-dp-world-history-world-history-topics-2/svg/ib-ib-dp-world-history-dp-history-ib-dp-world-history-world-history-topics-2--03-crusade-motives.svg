<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 617" width="900" height="617" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="617" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The First Crusade: mixed motives</text>

<rect x="120" y="100" width="660" height="137" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="132" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">CLERMONT, NOVEMBER 1095</text><text x="450" y="160.38" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Pope Urban II's appeal</text><text x="450" y="190.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Answering a request from the Byzantine emperor Alexios I for help against</text><text x="450" y="212.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">the Seljuk Turks</text><line x1="450" y1="245" x2="190" y2="293" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="450" y1="245" x2="450" y2="293" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="450" y1="245" x2="710" y2="293" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="307" width="269.3333333333333" height="167" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="46" y="335" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">RELIGION</text><text x="46" y="361.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Spiritual rewards</text><text x="46" y="390.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Free Christians in the east;</text><text x="46" y="411.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">recover Jerusalem. Religion</text><text x="46" y="432.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">legitimised violence and</text><text x="46" y="453.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">mobilised Latin Christendom.</text><rect x="315.3333333333333" y="307" width="269.3333333333333" height="167" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="331.3333333333333" y="335" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">LAND AND TRADE</text><text x="331.3333333333333" y="361.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Material gain</text><text x="331.3333333333333" y="390.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Younger sons sought land;</text><text x="331.3333333333333" y="411.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Italian cities sought trade.</text><rect x="600.6666666666666" y="307" width="269.3333333333333" height="167" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="616.6666666666666" y="335" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">POWER</text><text x="616.6666666666666" y="361.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Papal leadership</text><text x="616.6666666666666" y="390.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The papacy sought leadership</text><text x="616.6666666666666" y="411.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">over Christendom.</text><rect x="30" y="496" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="530.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Weigh, do not list</text><text x="50" y="560.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">If you argue religion caused the crusade, show how you answer the material explanation.</text>
</svg>