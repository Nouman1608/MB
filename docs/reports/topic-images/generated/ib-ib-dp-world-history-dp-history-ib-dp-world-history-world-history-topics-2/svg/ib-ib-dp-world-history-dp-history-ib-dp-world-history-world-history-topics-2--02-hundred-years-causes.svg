<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 611" width="900" height="611" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="611" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How the Hundred Years' War began</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Long-term disputes, then a short-term trigger</text>
<text x="30" y="138" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">LONG-TERM: DYNASTIC AND TERRITORIAL</text><rect x="30" y="162" width="412" height="122" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="192.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Gascony</text><text x="46" y="221.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Edward III held it as a vassal of the French king: a</text><text x="46" y="242.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">constant source of friction.</text><rect x="458" y="162" width="412" height="122" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="474" y="192.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The succession, 1328</text><text x="474" y="221.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Charles IV died without a son. Edward claimed</text><text x="474" y="242.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">through his mother, Isabella; the French nobility</text><text x="474" y="263.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">chose Philip VI.</text><rect x="30" y="298" width="412" height="101" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="328.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Scotland</text><text x="46" y="357.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">French support for Scotland.</text><rect x="458" y="298" width="412" height="101" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="474" y="328.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Flanders</text><text x="474" y="357.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">English interests in Flanders, which depended on</text><text x="474" y="378.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">English wool.</text><line x1="450" y1="413" x2="450" y2="451" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="150" y="465" width="600" height="114" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="497" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">SHORT-TERM TRIGGER, 1337</text><text x="450" y="524.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Philip VI confiscates Gascony</text><text x="450" y="554.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Edward III responds by claiming the French crown.</text>
</svg>