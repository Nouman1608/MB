<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 631" width="900" height="631" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="631" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Comparing the effects of two wars</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Hundred Years' War (Europe) and Mongol invasions of Japan (Asia and Oceania)</text>
<clipPath id="tc124"><rect x="30" y="124" width="840" height="342" rx="14"/></clipPath><g clip-path="url(#tc124)"><rect x="30" y="124" width="202.02531645569618" height="49" fill="#b5d3cf"/><text x="44" y="152.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Theme</text><rect x="232.02531645569618" y="124" width="318.98734177215186" height="49" fill="#f2e7b8"/><text x="246.02531645569618" y="152.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Hundred Years' War</text><rect x="551.0126582278481" y="124" width="318.98734177215186" height="49" fill="#b5d3cf"/><text x="565.0126582278481" y="152.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Mongol invasions of Japan</text><rect x="30" y="173" width="202.02531645569618" height="89" fill="#dce9e7"/><text x="44" y="199.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Effect on government</text><rect x="232.02531645569618" y="173" width="318.98734177215186" height="89" fill="#ffffff"/><text x="246.02531645569618" y="199.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">French royal power grew: permanent</text><text x="246.02531645569618" y="220.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">taxation, companies of ordinance</text><text x="246.02531645569618" y="241.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(1445)</text><rect x="551.0126582278481" y="173" width="318.98734177215186" height="89" fill="#ffffff"/><text x="565.0126582278481" y="199.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Kamakura regime spent heavily,</text><text x="565.0126582278481" y="220.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">gained no land to reward warriors, fell</text><text x="565.0126582278481" y="241.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">in 1333</text><line x1="30" y1="262" x2="870" y2="262" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="262" width="202.02531645569618" height="68" fill="#dce9e7"/><text x="44" y="288.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Territory</text><rect x="232.02531645569618" y="262" width="318.98734177215186" height="68" fill="#ffffff"/><text x="246.02531645569618" y="288.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">England expelled from France except</text><text x="246.02531645569618" y="309.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Calais</text><rect x="551.0126582278481" y="262" width="318.98734177215186" height="68" fill="#ffffff"/><text x="565.0126582278481" y="288.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Unchanged, so no spoils</text><line x1="30" y1="330" x2="870" y2="330" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="330" width="202.02531645569618" height="68" fill="#dce9e7"/><text x="44" y="356.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Identity</text><rect x="232.02531645569618" y="330" width="318.98734177215186" height="68" fill="#ffffff"/><text x="246.02531645569618" y="356.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">French and English national feeling;</text><text x="246.02531645569618" y="377.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Joan of Arc as symbol</text><rect x="551.0126582278481" y="330" width="318.98734177215186" height="68" fill="#ffffff"/><text x="565.0126582278481" y="356.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">"Divine winds": a land protected by</text><text x="565.0126582278481" y="377.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the gods</text><line x1="30" y1="398" x2="870" y2="398" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="398" width="202.02531645569618" height="68" fill="#dce9e7"/><text x="44" y="424.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Economy and society</text><rect x="232.02531645569618" y="398" width="318.98734177215186" height="68" fill="#ffffff"/><text x="246.02531645569618" y="424.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Decades of devastation in France,</text><text x="246.02531645569618" y="445.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">then recovery</text><rect x="551.0126582278481" y="398" width="318.98734177215186" height="68" fill="#ffffff"/><text x="565.0126582278481" y="424.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Burden of defence on unrewarded</text><text x="565.0126582278481" y="445.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">warriors</text></g><line x1="232.02531645569618" y1="124" x2="232.02531645569618" y2="466" stroke="#c9d6d4" stroke-width="1.5"/><line x1="551.0126582278481" y1="124" x2="551.0126582278481" y2="466" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="124" width="840" height="342" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="488" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="522.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Judgement</text><text x="50" y="552.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Both wars strengthened identity against an outside enemy, but a <tspan font-weight="700" fill="#1e2a44">victorious</tspan> <tspan font-weight="700" fill="#1e2a44">monarchy</tspan> turned war</text><text x="50" y="574.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">into lasting institutions, while a regime that <tspan font-weight="700" fill="#1e2a44">won</tspan> <tspan font-weight="700" fill="#1e2a44">without</tspan> <tspan font-weight="700" fill="#1e2a44">gain</tspan> could not pay for its victory.</text>
</svg>