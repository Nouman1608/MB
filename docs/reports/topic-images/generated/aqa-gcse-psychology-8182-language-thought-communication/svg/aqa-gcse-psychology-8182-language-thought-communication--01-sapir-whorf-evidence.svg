<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 810" width="900" height="810" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="810" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Sapir-Whorf: strong or weak?</text>

<rect x="30" y="100" width="411" height="158" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="132" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">STRONG VERSION</text><text x="50" y="159.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Linguistic determinism</text><text x="50" y="189.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Language <tspan font-weight="700" fill="#1e2a44">determines</tspan> thought: you cannot</text><text x="50" y="211.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">think about something your language has no</text><text x="50" y="233.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">words for.</text><rect x="459" y="100" width="411" height="158" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="479" y="143" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">WEAK VERSION</text><text x="479" y="170.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Linguistic relativity</text><text x="479" y="200.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Language <tspan font-weight="700" fill="#1e2a44">influences</tspan> thought, making some</text><text x="479" y="222.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">ideas easier to notice and remember.</text><text x="30" y="296" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">EVIDENCE ON RECALL: CARMICHAEL AND COLLEAGUES (1932)</text><rect x="30" y="310" width="230" height="160" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="111" cy="390" r="22" fill="none" stroke="#1e2a44" stroke-width="4"/><circle cx="179" cy="390" r="22" fill="none" stroke="#1e2a44" stroke-width="4"/><line x1="133" y1="390" x2="157" y2="390" stroke="#1e2a44" stroke-width="4"/><text x="145" y="456" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">ambiguous drawing</text><rect x="330" y="310" width="250" height="72" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="345" y="352" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">label: "eyeglasses"</text><circle cx="520" cy="346" r="11" fill="none" stroke="#1e2a44" stroke-width="3"/><circle cx="556" cy="346" r="11" fill="none" stroke="#1e2a44" stroke-width="3"/><path d="M531,344 q7,-6 14,0" fill="none" stroke="#1e2a44" stroke-width="3"/><rect x="330" y="398" width="250" height="72" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="345" y="440" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">label: "dumbbells"</text><circle cx="520" cy="434" r="10" fill="#1e2a44"/><circle cx="556" cy="434" r="10" fill="#1e2a44"/><line x1="520" y1="434" x2="556" y2="434" stroke="#1e2a44" stroke-width="6"/><line x1="266" y1="370" x2="324" y2="346" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="266" y1="410" x2="324" y2="434" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="610" y="344" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Drawn from memory, the shape</text><text x="610" y="366" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">looked <tspan font-weight="700">more</tspan> <tspan font-weight="700">like</tspan> <tspan font-weight="700">the</tspan> <tspan font-weight="700">label</tspan></text><text x="610" y="388" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">given: words shaped what was</text><text x="610" y="410" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">remembered.</text><rect x="30" y="492" width="840" height="155" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="524" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EVIDENCE ON COLOUR: THE BERINMO OF PAPUA NEW GUINEA</text><text x="50" y="550.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Colours on either side of a boundary in your own language are easier to distinguish and</text><text x="50" y="573.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">remember</text><text x="50" y="601.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Berinmo speakers showed this for their colour boundaries; English speakers for English boundaries.</text><text x="50" y="622.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Supports the <tspan font-weight="700" fill="#1e2a44">weak</tspan> version.</text><rect x="30" y="669" width="840" height="109" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="703.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Evaluation</text><text x="50" y="732.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The strong version is generally rejected: we can see shades we cannot name, and new words are</text><text x="50" y="753.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">invented for new ideas. The weak version has more support.</text>
</svg>