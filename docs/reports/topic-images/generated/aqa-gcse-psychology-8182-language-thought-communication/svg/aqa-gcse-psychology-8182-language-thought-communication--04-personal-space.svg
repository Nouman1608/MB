<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 687" width="900" height="687" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="687" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Personal space</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">The area around us that we feel is ours</text>
<circle cx="250" cy="324" r="190" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><circle cx="250" cy="324" r="140" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><circle cx="250" cy="324" r="90" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><circle cx="250" cy="324" r="30" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="250" cy="314" r="11" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><rect x="238" y="326" width="24" height="22" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="250" y="266" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">intimate</text><text x="250" y="158" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">public</text><rect x="490" y="134" width="380" height="133" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="510" y="166" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">HALL'S ZONES</text><text x="510" y="192.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">From intimate to public distance</text><text x="510" y="221.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Intimate: close friends and family. Public:</text><text x="510" y="242.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">strangers, speakers.</text><rect x="490" y="281" width="380" height="154" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="510" y="313" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">VARIES WITH</text><text x="510" y="339.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Culture · status · gender</text><text x="510" y="368.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Some cultures stand closer when talking;</text><text x="510" y="389.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">people keep more distance from those of</text><text x="510" y="410.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">higher status.</text><rect x="30" y="546" width="840" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="580.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Applying it: Kai stands close; classmates step back</text><text x="50" y="609.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">In Kai's home culture the normal conversational distance is smaller, so his classmates feel their personal</text><text x="50" y="630.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">space has been invaded and step back.</text>
</svg>