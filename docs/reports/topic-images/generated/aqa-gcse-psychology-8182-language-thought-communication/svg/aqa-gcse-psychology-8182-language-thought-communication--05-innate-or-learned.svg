<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 762" width="900" height="762" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="762" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Non-verbal behaviour: innate or learned?</text>

<rect x="30" y="100" width="411" height="256" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DARWIN: EVOLVED AND INNATE</text><text x="50" y="158.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Expressions helped survival</text><text x="50" y="187.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="187.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A fear expression warns others; bared teeth</text><text x="65.2" y="208.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">signal threat</text><text x="50" y="235.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="235.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Babies show expressions very early</text><text x="50" y="262.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="262.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Children born blind produce similar</text><text x="65.2" y="283.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">expressions</text><text x="50" y="310.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="310.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Ekman: an isolated culture recognised the</text><text x="65.2" y="331.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">same basic expressions</text><rect x="459" y="100" width="411" height="256" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="479" y="132" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">LEARNED</text><text x="479" y="158.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Culture shapes signals</text><text x="479" y="187.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="494.2" y="187.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Yuki: Japanese and American readings of</text><text x="494.2" y="208.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">faces differ</text><text x="479" y="235.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="494.2" y="235.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Personal space differs between cultures</text><text x="479" y="262.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="494.2" y="262.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The same hand sign can be friendly in one</text><text x="494.2" y="283.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">country, offensive in another</text><text x="30" y="394" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">YUKI (2007): WHERE DO PEOPLE LOOK TO JUDGE HAPPY OR SAD?</text><circle cx="170" cy="488" r="62" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><rect x="120" y="452" width="100" height="34" rx="12" fill="none" stroke="#b5602e" stroke-width="3.5"/><path d="M136,474 q12,-12 24,0 M180,474 q12,-12 24,0" fill="none" stroke="#1e2a44" stroke-width="3.5" stroke-linecap="round"/><path d="M146,510 q24,14 48,0" fill="none" stroke="#1e2a44" stroke-width="3.5" stroke-linecap="round"/><circle cx="560" cy="488" r="62" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><rect x="520" y="494" width="80" height="38" rx="12" fill="none" stroke="#b5602e" stroke-width="3.5"/><path d="M526,474 q12,-12 24,0 M570,474 q12,-12 24,0" fill="none" stroke="#1e2a44" stroke-width="3.5" stroke-linecap="round"/><path d="M536,510 q24,14 48,0" fill="none" stroke="#1e2a44" stroke-width="3.5" stroke-linecap="round"/><text x="250" y="468" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Japanese</tspan> participants</text><text x="250" y="489" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">gave more weight to the</text><text x="250" y="510" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">eyes</tspan></text><text x="640" y="468" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">American</tspan> participants gave</text><text x="640" y="489" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">more weight to the <tspan font-weight="700">mouth</tspan></text><text x="450" y="588" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Yuki's link: in Japan, controlling emotional expression is valued, so people look to the eyes, which are</text><text x="450" y="609" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">harder to control.</text><rect x="30" y="650" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="683.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Balanced conclusion: some basic expressions are <tspan font-weight="700" fill="#1e2a44">innate</tspan>, but <tspan font-weight="700" fill="#1e2a44">culture</tspan> shapes how and when they</text><text x="450" y="705.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">are displayed and read.</text>
</svg>