<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 597" width="900" height="597" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="597" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Von Frisch: how bees show where food is</text>

<rect x="30" y="100" width="270" height="300" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="165" y="134" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Round dance</text><text x="165" y="158" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">food close to the hive</text><path d="M165,210 C235,210 235,330 165,330 C95,330 95,210 162,210" fill="none" stroke="#8a6d0d" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahO)"/><text x="165" y="372" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">search nearby</text><rect x="320" y="100" width="550" height="300" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="595" y="134" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Waggle dance: food further away</text><line x1="470" y1="160" x2="470" y2="380" stroke="#4a5568" stroke-width="2" stroke-dasharray="6 6"/><text x="470" y="392" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">vertical on the comb</text><path d="M433.36110624786727,313.6645332577817 L448.4937890169355,306.520170990179 L447.5395384805052,285.87726891915906 L468.0345323514063,283.2324199193621 L467.080281814976,262.5895178483421 L487.5752756858771,259.9446688485452 L486.6210251494468,239.30176677752516 L507.1160190203479,236.65691777772827 L506.16176848391757,216.01401570670825 L526.6567623548186,213.36916670691133 L525.7025118183884,192.7262646358913" fill="none" stroke="#b5602e" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M531.0648229202212,197.2257779036971 C601.0648229202212,207.2257779036971 493.36110624786727,353.6645332577817 433.36110624786727,313.6645332577817" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 5" marker-end="url(#ah)"/><path d="M470,210 A60,60 0 0 1 508.56725658119234,224.03733341286133" fill="none" stroke="#8a6d0d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="458" y="200" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="end">angle</text><text x="640" y="190" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Angle</tspan> of the waggle run</text><text x="640" y="211" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">from vertical = <tspan font-weight="700">direction</tspan> of</text><text x="640" y="232" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">food relative to the sun</text><text x="640" y="290" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Length</tspan> of the waggle =</text><text x="640" y="311" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">distance</tspan></text><rect x="30" y="422" width="272" height="143" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="450" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PROCEDURE</text><text x="46" y="481.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Marked individual bees;</text><text x="46" y="502.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">feeding stations at different</text><text x="46" y="523.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">distances and directions;</text><text x="46" y="544.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">observed returning bees.</text><rect x="314" y="422" width="272" height="143" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="330" y="450" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FINDING</text><text x="330" y="481.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Other bees then flew to the</text><text x="330" y="502.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">correct location.</text><rect x="598" y="422" width="272" height="143" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="614" y="450" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EVALUATION</text><text x="614" y="481.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Careful, repeated observation,</text><text x="614" y="502.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">later supported; but the dance</text><text x="614" y="523.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">only communicates where</text><text x="614" y="544.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">resources are.</text>
</svg>