<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 639" width="900" height="639" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="639" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Animal communication is limited to four functions</text>

<rect x="30" y="100" width="201" height="153" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="130.5" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">SURVIVAL</text><text x="130.5" y="158.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Vervet monkeys</text><text x="130.5" y="186.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">different alarm calls</text><text x="130.5" y="207.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">for different</text><text x="130.5" y="228.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">predators</text><rect x="243" y="100" width="201" height="153" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="343.5" y="153" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">REPRODUCTION</text><text x="343.5" y="179.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Courtship</text><text x="343.5" y="207.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">displays and calls</text><rect x="456" y="100" width="201" height="153" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="556.5" y="153" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">TERRITORY</text><text x="556.5" y="179.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Birdsong</text><text x="556.5" y="207.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">warns rivals away</text><rect x="669" y="100" width="201" height="153" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="769.5" y="153" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">FOOD</text><text x="769.5" y="179.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Honeybee dance</text><text x="769.5" y="207.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">where to find food</text><text x="450" y="289.4" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle"><tspan font-weight="700">Human</tspan> <tspan font-weight="700">language</tspan> goes further:</text><rect x="30" y="321" width="272" height="155" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="353" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DISPLACEMENT</text><text x="50" y="379.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Talk about what is not</text><text x="50" y="402.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">here</text><text x="50" y="430.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the past, the future, distant</text><text x="50" y="451.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">places, imaginary things</text><rect x="314" y="321" width="272" height="155" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="334" y="375" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CREATIVITY / PRODUCTIVITY</text><text x="334" y="401.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Unlimited new sentences</text><text x="334" y="429.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">from a limited set of words</text><rect x="598" y="321" width="272" height="155" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="618" y="389" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ABSTRACT IDEAS</text><text x="618" y="415.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Express ideas and plans</text><rect x="30" y="498" width="840" height="109" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="532.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The subtlety</text><text x="50" y="561.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The bee dance refers to food that is not present, so it shows a limited form of displacement, but only</text><text x="50" y="582.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">about one thing.</text>
</svg>