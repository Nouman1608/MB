<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 507" width="900" height="507" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="507" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The Religious Settlement of 1559</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Background to the period: a church most people could accept</text>
<rect x="30" y="124" width="268" height="199" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ACT OF SUPREMACY</text><text x="50" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Who leads the Church</text><text x="50" y="211.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Elizabeth becomes Supreme</text><text x="50" y="232.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Governor of the Church of</text><text x="50" y="253.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">England.</text><rect x="316" y="124" width="268" height="199" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="336" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ACT OF UNIFORMITY</text><text x="336" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Everyone attends</text><text x="336" y="206.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">church</text><text x="336" y="235.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Parish church and the Book</text><text x="336" y="256.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">of Common Prayer.</text><text x="336" y="277.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Recusants fined twelve pence</text><text x="336" y="298.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">for each absence.</text><rect x="602" y="124" width="268" height="199" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="622" y="156" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">TRADITION KEPT</text><text x="622" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Reassure Catholics</text><text x="622" y="211.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Some traditional features,</text><text x="622" y="232.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">such as clerical vestments</text><text x="622" y="253.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">and church ornaments, kept.</text><rect x="30" y="345" width="397" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="379.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">1560s: relative tolerance</text><text x="50" y="408.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Outward conformity was enough; many</text><text x="50" y="429.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Catholics, especially in the north, attended</text><text x="50" y="450.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">church and kept private beliefs.</text><line x1="433" y1="410" x2="467" y2="410" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="473" y="345" width="397" height="130" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="493" y="390.32" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">After 1568: loyalty and succession</text><text x="493" y="419.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The arrival of Mary Queen of Scots turned</text><text x="493" y="440.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">religion into a political question.</text>
</svg>