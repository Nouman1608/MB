<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 664" width="900" height="664" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="664" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The Northern Rebellion, 1569</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Causes, events and results</text>
<text x="30" y="138" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">CAUSES</text><rect x="30" y="158" width="411" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="192.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Lost influence</text><text x="50" y="221.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The Catholic Earls of Northumberland and</text><text x="50" y="242.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Westmorland resented new men such as Cecil</text><text x="50" y="263.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">and Protestant officials in the north.</text><rect x="459" y="158" width="411" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="479" y="203.32" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The Norfolk marriage plan</text><text x="479" y="232.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A plan to marry Mary to the Duke of Norfolk was</text><text x="479" y="253.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">linked to the rising.</text><line x1="450" y1="298" x2="450" y2="336" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="350" width="249.33333333333334" height="175" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="392.5" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">NOV 1569</text><text x="50" y="419.32" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Rising</text><text x="50" y="448.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Mass celebrated in Durham</text><text x="50" y="469.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Cathedral; march south to</text><text x="50" y="490.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">free Mary.</text><line x1="285.33333333333337" y1="437.5" x2="319.33333333333337" y2="437.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="325.33333333333337" y="350" width="249.33333333333334" height="175" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="345.33333333333337" y="403" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">COLLAPSE</text><text x="345.33333333333337" y="429.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Rising fails</text><text x="345.33333333333337" y="458.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The rising collapsed as</text><text x="345.33333333333337" y="479.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">royal forces approached.</text><line x1="580.6666666666667" y1="437.5" x2="614.6666666666667" y2="437.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="620.6666666666667" y="350" width="249.33333333333334" height="175" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="640.6666666666667" y="382" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">RESULTS</text><text x="640.6666666666667" y="408.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Punishment</text><text x="640.6666666666667" y="437.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Hundreds of rebels</text><text x="640.6666666666667" y="458.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">executed; Northumberland</text><text x="640.6666666666667" y="479.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">later executed;</text><text x="640.6666666666667" y="500.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Westmorland fled abroad.</text><rect x="30" y="543" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="577.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Significance</text><text x="450" y="607.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Mary could act as a focus for Catholic discontent.</text>
</svg>