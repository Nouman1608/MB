<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 790" width="900" height="790" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="790" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">From plots to execution, 1571-87</text>

<line x1="150" y1="108" x2="150" y2="698" stroke="#1e2a44" stroke-width="4"/><rect x="190" y="100" width="680" height="90" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="203" y="127.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Ridolfi Plot</text><text x="203" y="151.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Mary, Norfolk and a Spanish invasion. Norfolk executed (1572); Elizabeth refused</text><text x="203" y="172.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Parliament's demand to execute Mary.</text><circle cx="150" cy="145" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="130" y="151" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1571</text><rect x="190" y="200" width="680" height="90" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="203" y="227.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Throckmorton Plot</text><text x="203" y="251.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">French invasion backed by Spain and the pope. Throckmorton executed; Spanish</text><text x="203" y="272.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">ambassador expelled.</text><circle cx="150" cy="245" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="130" y="251" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1583</text><rect x="190" y="300" width="680" height="69" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="203" y="327.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Bond of Association</text><text x="203" y="351.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Signatories bound to kill anyone in whose name a plot was made.</text><circle cx="150" cy="334.5" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="130" y="340.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1584</text><rect x="190" y="379" width="680" height="69" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="203" y="406.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Act for trial</text><text x="203" y="430.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Anyone on whose behalf a plot was attempted could be tried.</text><circle cx="150" cy="413.5" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="130" y="419.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1585</text><rect x="190" y="458" width="680" height="90" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="203" y="485.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Babington Plot</text><text x="203" y="509.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Kill Elizabeth, free Mary, foreign invasion. Walsingham intercepts letters in beer</text><text x="203" y="530.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">barrels; Mary's approval proved.</text><circle cx="150" cy="503" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="130" y="509" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1586</text><rect x="190" y="558" width="680" height="69" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="203" y="585.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Trial at Fotheringhay</text><text x="203" y="609.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Mary found guilty.</text><circle cx="150" cy="592.5" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="130" y="598.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Oct 1586</text><rect x="190" y="637" width="680" height="69" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="203" y="664.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Mary executed</text><text x="203" y="688.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">After months of hesitation by Elizabeth.</text><circle cx="150" cy="671.5" r="10" fill="#b5602e" stroke="#1e2a44" stroke-width="3"/><text x="130" y="677.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">8 Feb 1587</text><rect x="30" y="728" width="54.08" height="30" rx="15" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="57.04" y="748.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">plot</text><rect x="96.08" y="728" width="138.768" height="30" rx="15" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="165.464" y="748.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">legal response</text>
</svg>