<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 541" width="900" height="541" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="541" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A middle way attacked from both sides</text>

<rect x="30" y="100" width="280.3030303030303" height="254" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="163.5" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">FROM ONE SIDE</text><text x="50" y="191.1" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Catholics</text><text x="50" y="220.3" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="220.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Mary's claim to the throne</text><text x="50" y="246.3" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="246.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Excommunication, 1570</text><text x="50" y="272.3" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="272.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Missionary priests</text><text x="50" y="298.3" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="298.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Plots: 1571, 1583, 1586</text><rect x="360.3030303030303" y="100" width="179.3939393939394" height="254" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="184.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">The 1559</text><text x="450" y="209.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">"middle way"</text><text x="450" y="238.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Elizabeth as</text><text x="450" y="259.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Supreme</text><text x="450" y="280.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Governor</text><rect x="589.6969696969697" y="100" width="280.3030303030303" height="254" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="609.6969696969697" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FROM THE OTHER SIDE</text><text x="609.6969696969697" y="159.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Puritans</text><text x="609.6969696969697" y="188.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="624.8969696969698" y="188.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Remove "popish" vestments</text><text x="624.8969696969698" y="209.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">and kneeling</text><text x="609.6969696969697" y="235.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="624.8969696969698" y="235.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Prophesyings: Grindal</text><text x="624.8969696969698" y="256.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">suspended, 1577</text><text x="609.6969696969697" y="282.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="624.8969696969698" y="282.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Whitgift enforces conformity</text><text x="624.8969696969698" y="303.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">from 1583</text><text x="609.6969696969697" y="329.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="624.8969696969698" y="329.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Separatists: Act of 1593</text><line x1="314.3030303030303" y1="227" x2="354.3030303030303" y2="227" stroke="#8a6d0d" stroke-width="4" marker-end="url(#ahO)"/><line x1="585.6969696969697" y1="227" x2="545.6969696969697" y2="227" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><rect x="30" y="376" width="840" height="133" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="410.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The links</text><text x="50" y="440.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Mary's claim made Catholic loyalty a danger; excommunication made Catholicism look treasonable;</text><text x="50" y="462.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">missionaries and plots led to harsher laws; Mary's execution reduced the threat but helped bring</text><text x="50" y="484.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">war with Spain.</text>
</svg>