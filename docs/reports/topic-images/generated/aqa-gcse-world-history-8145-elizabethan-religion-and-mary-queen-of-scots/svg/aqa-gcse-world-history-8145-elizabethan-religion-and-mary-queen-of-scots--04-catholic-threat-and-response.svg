<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 789" width="900" height="789" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="789" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Catholic challenge and government response</text>

<clipPath id="tc100"><rect x="30" y="100" width="840" height="546" rx="14"/></clipPath><g clip-path="url(#tc100)"><rect x="30" y="100" width="130.14084507042256" height="49" fill="#b5d3cf"/><text x="44" y="128.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Year</text><rect x="160.14084507042256" y="100" width="354.92957746478874" height="49" fill="#f2e7b8"/><text x="174.14084507042256" y="128.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Catholic challenge</text><rect x="515.0704225352113" y="100" width="354.92957746478874" height="49" fill="#b5d3cf"/><text x="529.0704225352113" y="128.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Government response</text><rect x="30" y="149" width="130.14084507042256" height="68" fill="#dce9e7"/><text x="44" y="175.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">1568</text><rect x="160.14084507042256" y="149" width="354.92957746478874" height="68" fill="#fbf7e6"/><text x="174.14084507042256" y="175.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">William Allen founds a college at Douai to</text><text x="174.14084507042256" y="196.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">train English priests</text><rect x="515.0704225352113" y="149" width="354.92957746478874" height="68" fill="#eef5f4"/><line x1="30" y1="217" x2="870" y2="217" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="217" width="130.14084507042256" height="89" fill="#dce9e7"/><text x="44" y="243.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">1570</text><rect x="160.14084507042256" y="217" width="354.92957746478874" height="89" fill="#fbf7e6"/><text x="174.14084507042256" y="243.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Pope Pius V excommunicates Elizabeth in</text><text x="174.14084507042256" y="264.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the bull <tspan font-style="italic">Regnans</tspan> <tspan font-style="italic">in</tspan> <tspan font-style="italic">Excelsis</tspan>; Catholics</text><text x="174.14084507042256" y="285.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">released from obedience</text><rect x="515.0704225352113" y="217" width="354.92957746478874" height="89" fill="#eef5f4"/><text x="529.0704225352113" y="243.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Catholicism begins to be seen as potential</text><text x="529.0704225352113" y="264.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">treason</text><line x1="30" y1="306" x2="870" y2="306" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="306" width="130.14084507042256" height="68" fill="#dce9e7"/><text x="44" y="332.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">1571</text><rect x="160.14084507042256" y="306" width="354.92957746478874" height="68" fill="#fbf7e6"/><rect x="515.0704225352113" y="306" width="354.92957746478874" height="68" fill="#eef5f4"/><text x="529.0704225352113" y="332.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Treason to deny that Elizabeth is the lawful</text><text x="529.0704225352113" y="353.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">queen</text><line x1="30" y1="374" x2="870" y2="374" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="374" width="130.14084507042256" height="47" fill="#dce9e7"/><text x="44" y="400.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">1574</text><rect x="160.14084507042256" y="374" width="354.92957746478874" height="47" fill="#fbf7e6"/><text x="174.14084507042256" y="400.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Seminary priests begin arriving</text><rect x="515.0704225352113" y="374" width="354.92957746478874" height="47" fill="#eef5f4"/><line x1="30" y1="421" x2="870" y2="421" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="421" width="130.14084507042256" height="68" fill="#dce9e7"/><text x="44" y="447.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">1580</text><rect x="160.14084507042256" y="421" width="354.92957746478874" height="68" fill="#fbf7e6"/><text x="174.14084507042256" y="447.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">First Jesuits arrive, including Edmund</text><text x="174.14084507042256" y="468.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Campion</text><rect x="515.0704225352113" y="421" width="354.92957746478874" height="68" fill="#eef5f4"/><line x1="30" y1="489" x2="870" y2="489" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="489" width="130.14084507042256" height="89" fill="#dce9e7"/><text x="44" y="515.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">1581</text><rect x="160.14084507042256" y="489" width="354.92957746478874" height="89" fill="#fbf7e6"/><rect x="515.0704225352113" y="489" width="354.92957746478874" height="89" fill="#eef5f4"/><text x="529.0704225352113" y="515.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Campion executed; recusancy fine rises to</text><text x="529.0704225352113" y="536.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">£20</tspan> <tspan font-weight="700">a</tspan> <tspan font-weight="700">month</tspan>; converting someone to</text><text x="529.0704225352113" y="557.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Catholicism becomes treason</text><line x1="30" y1="578" x2="870" y2="578" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="578" width="130.14084507042256" height="68" fill="#dce9e7"/><text x="44" y="604.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">1585</text><rect x="160.14084507042256" y="578" width="354.92957746478874" height="68" fill="#fbf7e6"/><rect x="515.0704225352113" y="578" width="354.92957746478874" height="68" fill="#eef5f4"/><text x="529.0704225352113" y="604.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Jesuits and seminary priests ordered to</text><text x="529.0704225352113" y="625.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">leave; remaining becomes treason</text></g><line x1="160.14084507042256" y1="100" x2="160.14084507042256" y2="646" stroke="#c9d6d4" stroke-width="1.5"/><line x1="515.0704225352113" y1="100" x2="515.0704225352113" y2="646" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="100" width="840" height="546" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="668" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="702.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Scale</text><text x="50" y="732.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">More than a hundred priests were executed during the reign.</text>
</svg>