<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 603" width="900" height="603" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="603" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What to do with Mary?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Elizabeth's dilemma after May 1568</text>
<rect x="30" y="124" width="411" height="159" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">OPTION</text><text x="50" y="184.38" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Free her</text><text x="50" y="214.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">A Catholic claimant might lead a rebellion, or</text><text x="50" y="236.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">return to Scotland against England's</text><text x="50" y="258.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Protestant allies.</text><rect x="459" y="124" width="411" height="159" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="479" y="167" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">OPTION</text><text x="479" y="195.38" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Send her to France</text><text x="479" y="225.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">France might support her claim to the English</text><text x="479" y="247.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">throne.</text><rect x="30" y="301" width="411" height="137" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="333" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">OPTION</text><text x="50" y="361.38" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Execute her</text><text x="50" y="391.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Killing an anointed queen might encourage</text><text x="50" y="413.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">others to kill monarchs, including Elizabeth.</text><rect x="459" y="301" width="411" height="137" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="479" y="333" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">CHOSEN</text><text x="479" y="361.38" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Keep her in custody</text><text x="479" y="391.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Nineteen years, moved between houses such</text><text x="479" y="413.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">as Tutbury, Sheffield and Chartley.</text><rect x="30" y="460" width="840" height="111" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="494.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Why Mary was a threat</text><text x="50" y="524.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Granddaughter of Henry VIII's elder sister Margaret, so a strong claim as heir. Many Catholics saw</text><text x="50" y="546.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Elizabeth as illegitimate and Mary as the rightful queen.</text>
</svg>