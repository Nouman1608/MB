<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 334" width="900" height="334" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="334" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Impact of Mary's execution, 1587</text>

<rect x="30" y="100" width="268" height="202" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SUCCESSION</text><text x="50" y="159.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Claimant removed</text><text x="50" y="189.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">The heir is now Mary's</text><text x="50" y="211.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Protestant son, James VI of</text><text x="50" y="233.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Scotland, who protested but</text><text x="50" y="255.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">accepted the execution.</text><rect x="316" y="100" width="268" height="202" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="336" y="132" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">SPAIN</text><text x="336" y="159.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Road to the Armada</text><text x="336" y="189.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Philip II no longer feared</text><text x="336" y="211.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">putting a French-influenced</text><text x="336" y="233.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">queen on the throne; one</text><text x="336" y="255.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">more reason for the Armada</text><text x="336" y="277.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">of 1588.</text><rect x="602" y="100" width="268" height="202" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="622" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">AT HOME</text><text x="622" y="159.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Threat reduced</text><text x="622" y="189.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">The Armada's defeat</text><text x="622" y="211.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">encouraged most Catholics</text><text x="622" y="233.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">to remain loyal.</text>
</svg>