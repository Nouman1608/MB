<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Same claim, different openings</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Claim: “Schools should start later in the morning.”</text>
<rect x="30" y="122" width="330" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="44" y="154.85999999999999" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">School board</text><text x="44" y="181.49" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-style="italic">worried</tspan> <tspan font-style="italic">about</tspan> <tspan font-style="italic">bus</tspan> <tspan font-style="italic">costs;</tspan> <tspan font-style="italic">decides</tspan> <tspan font-style="italic">by</tspan></text><text x="44" y="201.29000000000002" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-style="italic">practicalities</tspan></text><rect x="470" y="122" width="400" height="100" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="484" y="154.85999999999999" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start" xml:space="preserve">Context + statistic</text><text x="484" y="181.49" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">how many routes would change; what other</text><text x="484" y="201.29000000000002" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">districts did</text><line x1="366" y1="172" x2="464" y2="172" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="30" y="238" width="330" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="44" y="270.86" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Parents</text><text x="44" y="297.49" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-style="italic">at</tspan> <tspan font-style="italic">a</tspan> <tspan font-style="italic">community</tspan> <tspan font-style="italic">meeting;</tspan> <tspan font-style="italic">decide</tspan> <tspan font-style="italic">by</tspan></text><text x="44" y="317.29" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-style="italic">recognition</tspan></text><rect x="470" y="238" width="400" height="100" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="484" y="280.76" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start" xml:space="preserve">Scenario or anecdote</text><text x="484" y="307.39" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">a tired teenager at the kitchen table at 6:30 a.m.</text><line x1="366" y1="288" x2="464" y2="288" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="30" y="354" width="330" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="44" y="396.11999999999995" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Science-minded newspaper</text><text x="44" y="421.19999999999993" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">readers</text><rect x="470" y="354" width="400" height="100" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="484" y="396.76" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start" xml:space="preserve">Intriguing statement + thesis</text><text x="484" y="423.39" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">adolescent body clocks, then the claim</text><line x1="366" y1="404" x2="464" y2="404" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="30" y="474" width="840" height="55.75999999999999" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="450" y="507.3" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Ask: what does <tspan font-weight="700">this</tspan> reader need before they can listen to <tspan font-weight="700">this</tspan> claim?</text>
