<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 602" width="900" height="602" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="602" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">An introduction is a doorway</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">It frames what is inside and invites the reader through</text>
<rect x="310" y="122" width="280" height="380" rx="8" fill="#9c8f6e" stroke="#1e2a44" stroke-width="3"/><rect x="330" y="142" width="240" height="360" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><path d="M330,142 L420,172 L420,492 L330,502 Z" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><circle cx="408" cy="322" r="6" fill="#1e2a44" stroke="#1e2a44" stroke-width="2.5"/><text x="495" y="312" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">the argument</text><line x1="495" y1="542" x2="495" y2="342" stroke="#8a6d0d" stroke-width="3.5" marker-end="url(#ahO)"/><text x="495" y="566" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle" xml:space="preserve">the reader</text><rect x="30" y="152" width="250" height="133.60000000000002" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="44" y="182" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start" xml:space="preserve">Orient</text><text x="44" y="209.15" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">Introduce the subject and,</text><text x="44" y="228.95000000000002" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">where it helps, the writer:</text><text x="44" y="248.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">what is it about, what</text><text x="44" y="268.55" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">conversation is this?</text><line x1="282" y1="218.8" x2="306" y2="218.8" stroke="#2e6b62" stroke-width="2.5" stroke-dasharray="5 4"/><rect x="30" y="342" width="250" height="133.59999999999997" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="44" y="372" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start" xml:space="preserve">Engage</text><text x="44" y="399.15" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">Give a reason to keep</text><text x="44" y="418.95" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">reading: a surprise, a</text><text x="44" y="438.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">question, a vivid image, a fact</text><text x="44" y="458.54999999999995" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">that bears on the reader.</text><line x1="282" y1="408.79999999999995" x2="306" y2="408.79999999999995" stroke="#2e6b62" stroke-width="2.5" stroke-dasharray="5 4"/><rect x="620" y="242" width="250" height="133.59999999999997" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="634" y="272" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start" xml:space="preserve">Focus</text><text x="634" y="299.15" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">Point toward the argument:</text><text x="634" y="318.95" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">present the thesis, or leave</text><text x="634" y="338.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">the reader expecting the</text><text x="634" y="358.54999999999995" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">claim.</text><line x1="618" y1="308.79999999999995" x2="594" y2="308.79999999999995" stroke="#2e6b62" stroke-width="2.5" stroke-dasharray="5 4"/>
</svg>