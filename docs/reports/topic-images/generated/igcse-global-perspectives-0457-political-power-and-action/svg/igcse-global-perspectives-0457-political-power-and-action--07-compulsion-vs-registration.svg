<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 597" width="900" height="597" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="597" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Low youth turnout: match the action to the barrier</text>

<rect x="160" y="104" width="580" height="110" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="137" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">WHAT THE SOURCES SHOW</text><text x="450" y="163.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">The main barrier: young people do not know how to</text><text x="450" y="188.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">register</text><line x1="450" y1="220" x2="240" y2="254" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="450" y1="220" x2="660" y2="254" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="272" width="408" height="187" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="305" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">COMPULSORY VOTING</text><text x="50" y="330.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">More votes, not necessarily more</text><text x="50" y="354.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">interest</text><text x="50" y="382.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="382.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Addresses not voting directly</text><text x="50" y="408.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="408.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A fine may hit students with little income</text><text x="50" y="434.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="434.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Does not tackle the registration barrier</text><rect x="462" y="272" width="408" height="187" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="482" y="305" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EASIER REGISTRATION</text><text x="482" y="330.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Tackles the barrier the sources</text><text x="482" y="354.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">identify</text><text x="482" y="382.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="497.2" y="382.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Likely more effective and fairer</text><text x="482" y="408.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="497.2" y="408.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Raises turnout more slowly</text><rect x="30" y="477" width="840" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="513" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Team Project reminder</text><text x="50" y="542.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Keep Team Project action non-partisan: explain how to take part, not whom to support.</text>
</svg>