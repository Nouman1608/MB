<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 702" width="900" height="702" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="702" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Designing a test for a claim</text>

<rect x="30" y="104" width="840" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="137" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">CLAIM</text><text x="50" y="164" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">“Local residents trust decisions more when they vote on the budget</text><text x="50" y="190" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">themselves.”</text><rect x="30" y="234" width="200" height="60" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="130" y="271" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Method</text><rect x="244" y="234" width="626" height="60" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="264" y="271" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A before-and-after survey of residents</text><rect x="30" y="304" width="200" height="60" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="130" y="341" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Sample</text><rect x="244" y="304" width="626" height="60" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="264" y="341" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A large random sample, not just people at a council event</text><rect x="30" y="374" width="200" height="60" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="130" y="411" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Comparison</text><rect x="244" y="374" width="626" height="60" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="264" y="411" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A similar area without participatory budgeting</text><rect x="30" y="444" width="200" height="60" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="130" y="481" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Measure</text><rect x="244" y="444" width="626" height="60" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="264" y="481" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The same fixed trust question asked both times</text><rect x="30" y="514" width="200" height="60" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="130" y="551" font-size="19" font-weight="700" fill="#b5602e" text-anchor="middle">Limitation</text><rect x="244" y="514" width="626" height="60" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="264" y="551" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Other events between the surveys could change trust</text><rect x="30" y="592" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="625.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Official results are usually stronger evidence of turnout than a poll of intentions,</text><text x="50" y="647.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">because people often over-report that they will vote.</text>
</svg>