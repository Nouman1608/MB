<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 536" width="900" height="536" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="536" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Who decides? Issues at three levels</text>

<rect x="30" y="104" width="840" height="132" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="137" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">GLOBAL: UN SECURITY COUNCIL</text><text x="50" y="162.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Five permanent members each hold a veto</text><text x="50" y="190.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">China, France, Russia, the UK and the US. Some states want reform; others say the veto keeps</text><text x="50" y="211.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">major powers inside the system.</text><rect x="30" y="248" width="840" height="135" rx="14" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="281" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">NATIONAL: WHO MAY VOTE, AND MUST THEY?</text><text x="50" y="306.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Australia: compulsory federal voting (1924). Austria: votes at 16 nationally</text><text x="50" y="330.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">(2007).</text><text x="50" y="358.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Scotland lets 16-year-olds vote in Scottish Parliament and local elections.</text><rect x="30" y="395" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="428" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">LOCAL: RESIDENTS SHAPING DECISIONS</text><text x="50" y="453.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Porto Alegre, Brazil: participatory budgeting from 1989</text><text x="50" y="481.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Residents help decide how part of the city budget is spent.</text>
</svg>