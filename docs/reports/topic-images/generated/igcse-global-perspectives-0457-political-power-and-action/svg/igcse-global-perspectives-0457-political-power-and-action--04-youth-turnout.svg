<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="560" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Low youth turnout: possible causes and consequences</text>

<rect x="30" y="104" width="300" height="66" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="44" y="130.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Feeling ignored by</text><text x="44" y="151.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">politicians</text><rect x="30" y="180" width="300" height="66" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="44" y="206.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Moving home often, so</text><text x="44" y="227.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">registration lapses</text><rect x="30" y="256" width="300" height="66" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="44" y="282.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Little teaching on how voting</text><text x="44" y="303.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">works</text><rect x="30" y="332" width="300" height="45" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="44" y="358.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Distrust of parties</text><rect x="570" y="104" width="300" height="66" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="584" y="130.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Parties focus promises on</text><text x="584" y="151.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">older groups who vote more</text><rect x="570" y="180" width="300" height="66" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="584" y="206.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Young people’s priorities get</text><text x="584" y="227.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">less attention</text><rect x="570" y="256" width="300" height="66" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="584" y="282.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">The elected body may seem</text><text x="584" y="303.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">less legitimate</text><rect x="370" y="185.5" width="160" height="110" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="234.5" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Low youth</text><text x="450" y="258.5" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">turnout</text><line x1="334" y1="240.5" x2="364" y2="240.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="536" y1="240.5" x2="566" y2="240.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="180" y="94" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">POSSIBLE CAUSES</text><text x="720" y="94" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">POSSIBLE CONSEQUENCES</text><rect x="30" y="395" width="408" height="135" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="428" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">A CLAIM</text><text x="50" y="453.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Each causal link needs evidence</text><rect x="462" y="395" width="408" height="135" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="482" y="428" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">NOT AN EXPLANATION</text><text x="482" y="453.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">“Young people don’t vote because</text><text x="482" y="477.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">they are lazy”</text><text x="482" y="505.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A generalisation and an opinion.</text>
</svg>