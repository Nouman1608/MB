<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 644" width="900" height="644" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="644" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Five ways to change participation</text>

<rect x="30" y="104" width="250" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="42" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Action</text><rect x="280" y="104" width="320" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="292" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Strength</text><rect x="600" y="104" width="270" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="612" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Limitation</text><rect x="30" y="150" width="250" height="85" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="175.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Compulsory voting</text><text x="42" y="196.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">(Australia)</text><rect x="280" y="150" width="320" height="85" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="292" y="175.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Raises turnout</text><rect x="600" y="150" width="270" height="85" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="612" y="175.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Forces people who know little</text><text x="612" y="196.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">to vote; fines may hit poorer</text><text x="612" y="217.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">citizens hardest</text><rect x="30" y="235" width="250" height="64" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="260.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Lowering the voting age</text><text x="42" y="281.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">(Austria)</text><rect x="280" y="235" width="320" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="292" y="260.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Widens inclusion</text><rect x="600" y="235" width="270" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="612" y="260.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Whether it builds a lasting</text><text x="612" y="281.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">habit is debated</text><rect x="30" y="299" width="250" height="106" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="324.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Citizens’ initiatives</text><text x="42" y="345.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">and petitions</text><rect x="280" y="299" width="320" height="106" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="292" y="324.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Cheap and open: Switzerland 100,000</text><text x="292" y="345.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">signatures in 18 months; UK</text><text x="292" y="366.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">response at 10,000, debate</text><text x="292" y="387.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">considered at 100,000</text><rect x="600" y="299" width="270" height="106" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="612" y="324.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A debate is not a decision</text><rect x="30" y="405" width="250" height="85" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="430.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Participatory budgeting</text><text x="42" y="451.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">(Porto Alegre)</text><rect x="280" y="405" width="320" height="85" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="292" y="430.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Direct power over part of a budget</text><rect x="600" y="405" width="270" height="85" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="612" y="430.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Participation can be low; may</text><text x="612" y="451.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">favour people with more free</text><text x="612" y="472.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">time</text><rect x="30" y="490" width="250" height="64" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="515.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Citizens’ assemblies</text><text x="42" y="536.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">(Ireland)</text><rect x="280" y="490" width="320" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="292" y="515.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Randomly selected citizens allow</text><text x="292" y="536.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">deep discussion</text><rect x="600" y="490" width="270" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="612" y="515.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Members are not elected;</text><text x="612" y="536.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">advice is not binding</text><rect x="51.200000000000045" y="572" width="153.6" height="42" rx="21" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="128.00000000000006" y="598.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Effectiveness</text><rect x="216.80000000000004" y="572" width="70.8" height="42" rx="21" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="252.20000000000005" y="598.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Cost</text><rect x="299.6" y="572" width="107.6" height="42" rx="21" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="353.40000000000003" y="598.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Fairness</text><rect x="419.20000000000005" y="572" width="254.79999999999998" height="42" rx="21" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="546.6" y="598.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Who it helps or excludes</text><rect x="686" y="572" width="162.79999999999998" height="42" rx="21" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="767.4" y="598.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Sustainability</text>
</svg>