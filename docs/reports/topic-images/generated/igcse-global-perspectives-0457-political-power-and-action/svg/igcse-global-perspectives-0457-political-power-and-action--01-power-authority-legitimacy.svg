<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 678" width="900" height="678" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="678" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Power, authority and legitimacy</text>

<rect x="30" y="104" width="840" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="140.8" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Power</text><text x="450" y="171.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">The ability to make decisions or influence what others do</text><line x1="450" y1="200" x2="450" y2="226" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="466" y="220" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">when people accept it as rightful</text><rect x="100" y="230" width="700" height="114" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="266.8" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Authority</text><text x="450" y="297.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">Power people accept as rightful, for example because it was won in an</text><text x="450" y="319.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">election</text><rect x="170" y="358" width="560" height="114" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="394.8" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Legitimacy</text><text x="450" y="425.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">The belief that a government or decision has a right to be</text><text x="450" y="447.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">obeyed</text><text x="450" y="510" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Ways people take part or influence</text><rect x="30" y="536" width="201" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="563.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Participation</text><text x="44" y="590" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">voting, petitioning,</text><text x="44" y="610" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">protesting, joining a</text><text x="44" y="630" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">council</text><rect x="243" y="536" width="201" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="257" y="563.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Referendum</text><text x="257" y="590" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">citizens vote on one</text><text x="257" y="610" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">question</text><rect x="456" y="536" width="201" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="470" y="563.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Lobbying</text><text x="470" y="590" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">influencing</text><text x="470" y="610" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">decision-makers for a</text><text x="470" y="630" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">group</text><rect x="669" y="536" width="201" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="683" y="563.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Civil society</text><text x="683" y="590" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">charities, unions,</text><text x="683" y="610" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">campaign groups</text>
</svg>