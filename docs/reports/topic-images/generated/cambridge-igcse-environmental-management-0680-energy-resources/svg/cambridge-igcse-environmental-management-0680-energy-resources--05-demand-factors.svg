<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 606" width="900" height="606" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="606" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Eight factors affecting energy demand</text>

<rect x="30" y="110" width="405" height="71" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="42" y="136.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Transport</text><text x="42" y="167.04" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">more cars, lorries and flights need petroleum</text><rect x="465" y="110" width="405" height="71" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="136.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Wealth</text><text x="477" y="167.04" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">more appliances, heating, cooling and vehicles</text><rect x="30" y="193" width="405" height="91" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="42" y="219.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Climate</text><text x="42" y="250.04" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">cold winters need heating; hot summers need</text><text x="42" y="270.03999999999996" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">cooling</text><rect x="465" y="193" width="405" height="91" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="219.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Population size</text><text x="477" y="250.04" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">more people need more energy, even at the same</text><text x="477" y="270.03999999999996" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">use each</text><rect x="30" y="296" width="405" height="91" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="42" y="332.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Industry</text><text x="42" y="363.04" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">steel and cement use large amounts of energy</text><rect x="465" y="296" width="405" height="91" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="477" y="322.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Disruption to supply</text><text x="477" y="353.04" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">wars, disasters or strikes raise prices; people</text><text x="477" y="373.04" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">use less or switch</text><rect x="30" y="399" width="405" height="91" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="42" y="425.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Unreliable supply</text><text x="42" y="456.04" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">power cuts push people to generators or their</text><text x="42" y="476.04" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">own solar panels</text><rect x="465" y="399" width="405" height="91" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="477" y="435.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Scarcity</text><text x="477" y="466.04" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">price rises; demand shifts to alternatives</text><rect x="30" y="508" width="840" height="74" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" stroke-dasharray="8 6"/><text x="48" y="538.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">For each factor, say what changes and why it changes energy use. Cream: supply problems that</text><text x="48" y="559.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">force people to cut use or switch resources.</text>
</svg>