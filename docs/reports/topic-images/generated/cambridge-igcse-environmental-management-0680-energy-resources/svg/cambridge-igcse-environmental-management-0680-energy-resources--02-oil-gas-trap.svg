<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 610" width="900" height="610" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="610" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Where oil and gas collect</text>

<rect x="30" y="110" width="840" height="470" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M32,230 Q450,110 868,230 L868,310 Q450,190 32,310 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2"/><path d="M32,310 Q450,190 868,310 L868,400 Q450,280 32,400 Z" fill="#efdfa8" stroke="#1e2a44" stroke-width="2"/><path d="M32,400 Q450,280 868,400 L868,480 Q450,360 32,480 Z" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><rect x="32" y="480" width="836" height="98" rx="0" fill="#ffffff"/><clipPath id="res"><path d="M32,310 Q450,190 868,310 L868,400 Q450,280 32,400 Z"/></clipPath><g clip-path="url(#res)"><rect x="300" y="180" width="300" height="70" fill="#ffffff" opacity="0.85"/><rect x="250" y="250" width="400" height="44" fill="#1e2a44" opacity="0.75"/><rect x="32" y="294" width="836" height="140" fill="#b5d3cf" opacity="0.7"/></g><text x="450" y="232" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">natural gas</text><text x="450" y="280" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">oil</text><text x="450" y="330" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="middle">water</text><text x="858" y="255" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">impermeable cap rock</text><text x="858" y="335" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">permeable rock</text><text x="858" y="355" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">(e.g. sandstone)</text><text x="858" y="428" font-size="16" font-weight="700" fill="#ffffff" text-anchor="end">source rock, e.g. shale</text><line x1="560" y1="420" x2="530" y2="350" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><line x1="620" y1="430" x2="590" y2="360" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><line x1="340" y1="420" x2="370" y2="350" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><line x1="280" y1="430" x2="310" y2="360" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><text x="450" y="510" font-size="16" font-weight="600" fill="#b5602e" text-anchor="middle">Oil and gas are less dense than water, so they rise through permeable rock</text><text x="450" y="532" font-size="16" font-weight="600" fill="#b5602e" text-anchor="middle">until an impermeable layer stops them. Gas collects above the oil.</text><text x="858" y="566" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">Not to scale</text>
</svg>