<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 510" width="900" height="510" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="510" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How coal formed</text>

<rect x="30" y="110" width="201" height="340" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="32" y="260" width="197" height="66" rx="0" fill="#b5d3cf"/><rect x="32" y="290" width="197" height="36" rx="0" fill="#f2e7b8"/><rect x="66.4" y="244.2" width="7.2" height="19.8" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><circle cx="70" cy="229.8" r="19.8" fill="#6f9a52" stroke="#1e2a44" stroke-width="2.5"/><rect x="120.4" y="238.7" width="9.2" height="25.299999999999997" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><circle cx="125" cy="220.3" r="25.299999999999997" fill="#6f9a52" stroke="#1e2a44" stroke-width="2.5"/><rect x="176.4" y="244.2" width="7.2" height="19.8" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><circle cx="180" cy="229.8" r="19.8" fill="#6f9a52" stroke="#1e2a44" stroke-width="2.5"/><circle cx="56" cy="138" r="17" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="56" y="144.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="82" y="145" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Swamp forest</text><text x="46" y="358" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">large plants grow in</text><text x="46" y="378" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">warm, swampy forests</text><line x1="232" y1="300" x2="241" y2="300" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="243" y="110" width="201" height="340" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="245" y="260" width="197" height="30" rx="0" fill="#b5d3cf"/><rect x="245" y="290" width="197" height="36" rx="0" fill="#f2e7b8"/><rect x="253" y="272" width="181" height="22" rx="4" fill="#9c8f6e"/><path d="M273,276 l40,8 M333,282 l50,-6 M383,278 l30,10" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="343.5" y="246" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="middle">little oxygen</text><circle cx="269" cy="138" r="17" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="269" y="144.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="295" y="145" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Peat</text><text x="259" y="358" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">dead plants fall into</text><text x="259" y="378" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">waterlogged ground</text><text x="259" y="398" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">with little oxygen,</text><text x="259" y="418" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">so they only partly</text><text x="259" y="438" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">decay</text><line x1="445" y1="300" x2="454" y2="300" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="456" y="110" width="201" height="340" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="458" y="200" width="197" height="22" rx="0" fill="#efdfa8" stroke="#1e2a44" stroke-width="1.5"/><rect x="458" y="222" width="197" height="22" rx="0" fill="#cbbf9f" stroke="#1e2a44" stroke-width="1.5"/><rect x="458" y="244" width="197" height="22" rx="0" fill="#efdfa8" stroke="#1e2a44" stroke-width="1.5"/><rect x="458" y="266" width="197" height="18" rx="0" fill="#9c8f6e" stroke="#1e2a44" stroke-width="1.5"/><rect x="458" y="284" width="197" height="42" rx="0" fill="#f2e7b8"/><line x1="506" y1="164" x2="506" y2="194" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="606" y1="164" x2="606" y2="194" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="556.5" y="186" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">pressure</text><text x="556.5" y="316" font-size="15" font-weight="600" fill="#b5602e" text-anchor="middle">heat at depth</text><circle cx="482" cy="138" r="17" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="482" y="144.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="508" y="145" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Burial</text><text x="472" y="358" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">sediment piles on</text><text x="472" y="378" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">top; over millions of</text><text x="472" y="398" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">years pressure and</text><text x="472" y="418" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">heat drive out water</text><text x="472" y="438" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">and gases</text><line x1="658" y1="300" x2="667" y2="300" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="669" y="110" width="201" height="340" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="671" y="190" width="197" height="22" rx="0" fill="#efdfa8" stroke="#1e2a44" stroke-width="1.5"/><rect x="671" y="212" width="197" height="22" rx="0" fill="#cbbf9f" stroke="#1e2a44" stroke-width="1.5"/><rect x="671" y="234" width="197" height="22" rx="0" fill="#efdfa8" stroke="#1e2a44" stroke-width="1.5"/><rect x="671" y="256" width="197" height="22" rx="0" fill="#cbbf9f" stroke="#1e2a44" stroke-width="1.5"/><rect x="671" y="278" width="197" height="14" rx="0" fill="#1e2a44"/><rect x="671" y="292" width="197" height="34" rx="0" fill="#cbbf9f" stroke="#1e2a44" stroke-width="1.5"/><text x="860" y="274" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="end">coal</text><circle cx="695" cy="138" r="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="695" y="144.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="721" y="145" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Coal seam</text><text x="685" y="358" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">the carbon-rich layer</text><text x="685" y="378" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">lies between layers</text><text x="685" y="398" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">of sedimentary rock</text><text x="450" y="480" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">Key condition: buried before it could fully decay, because decay needs oxygen.</text>
</svg>