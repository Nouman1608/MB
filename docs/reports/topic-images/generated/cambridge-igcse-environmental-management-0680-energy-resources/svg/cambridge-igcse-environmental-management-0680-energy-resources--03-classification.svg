<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 570" width="900" height="570" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="570" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Renewable or non-renewable?</text>

<rect x="30" y="110" width="540" height="430" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="30" y="110" width="540" height="60" rx="14" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><text x="300" y="150" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Renewable (non-finite)</text><rect x="590" y="110" width="280" height="430" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="590" y="110" width="280" height="60" rx="14" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.5"/><text x="730" y="150" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Non-renewable (finite)</text><text x="54" y="206" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Biofuels</text><rect x="54" y="223" width="116" height="30" rx="15" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="112" y="243.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">bioethanol</text><rect x="178" y="223" width="88.39999999999999" height="30" rx="15" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="222.2" y="243.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">biomass</text><rect x="302" y="223" width="79.19999999999999" height="30" rx="15" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="341.6" y="243.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">biogas</text><rect x="426" y="223" width="60.8" height="30" rx="15" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="456.4" y="243.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">wood</text><rect x="54" y="284.5" width="180.39999999999998" height="31" rx="15.5" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="144.2" y="306.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">geothermal power</text><rect x="304" y="284.5" width="219.49999999999997" height="31" rx="15.5" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="413.75" y="306.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">hydro-electric power</text><rect x="54" y="332.5" width="131.52499999999998" height="31" rx="15.5" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="119.76249999999999" y="354.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">tidal power</text><rect x="304" y="332.5" width="121.74999999999999" height="31" rx="15.5" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="364.875" y="354.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">wave power</text><rect x="54" y="380.5" width="131.52499999999998" height="31" rx="15.5" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="119.76249999999999" y="402.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">solar power</text><rect x="304" y="380.5" width="121.74999999999999" height="31" rx="15.5" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="364.875" y="402.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">wind power</text><text x="614" y="206" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Fossil fuels</text><rect x="614" y="223" width="60.8" height="30" rx="15" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="644.4" y="243.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">coal</text><rect x="614" y="267" width="106.8" height="30" rx="15" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="667.4" y="287.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">petroleum</text><rect x="614" y="311" width="125.19999999999999" height="30" rx="15" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="676.6" y="331.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">natural gas</text><text x="614" y="400" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Nuclear power</text><rect x="614" y="417" width="88.39999999999999" height="30" rx="15" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="658.2" y="437.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">uranium</text><text x="54" y="470" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">Biofuels are renewable only if plants are replanted as</text><text x="54" y="491" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">fast as they are used.</text><text x="614" y="476" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">Uranium is a finite ore, even</text><text x="614" y="496" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">though nuclear is low-carbon.</text>
</svg>