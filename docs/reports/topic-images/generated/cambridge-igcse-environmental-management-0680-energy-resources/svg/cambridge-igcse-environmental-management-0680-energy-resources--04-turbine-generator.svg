<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 630" width="900" height="630" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="630" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">One final step: turbine then generator</text>

<rect x="30" y="110" width="470" height="148" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="140" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">Make steam</text><text x="50" y="168" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">• fossil fuels: burned in a boiler</text><text x="50" y="194" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">• biofuels: burned</text><text x="50" y="220" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">• nuclear: fission heats water</text><text x="50" y="246" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">• geothermal: steam from hot rocks</text><rect x="30" y="276" width="470" height="122" rx="12" fill="#ffffff" stroke="#2b5a9a" stroke-width="2.5"/><text x="50" y="306" font-size="19" font-weight="700" fill="#2b5a9a" text-anchor="start">Moving water</text><text x="50" y="334" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">• HEP: water falls from a reservoir</text><text x="50" y="360" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">• tidal: tide flows in and out</text><text x="50" y="386" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">• wave: up-and-down motion</text><rect x="30" y="416" width="470" height="70" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="446" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Moving air</text><text x="50" y="474" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">• wind turns the blades</text><rect x="590" y="190" width="130" height="80" rx="12" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.5"/><text x="655" y="235.1" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">turbine</text><rect x="590" y="330" width="130" height="80" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="655" y="375.1" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">generator</text><line x1="655" y1="274" x2="655" y2="324" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><text x="665" y="306" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">turns</text><line x1="504" y1="184" x2="584" y2="230" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="504" y1="337" x2="584" y2="230" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="504" y1="451" x2="584" y2="230" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="724" y1="370" x2="800" y2="370" stroke="#8a6d0d" stroke-width="5" marker-end="url(#ahO)"/><text x="812" y="365" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="start">elec-</text><text x="812" y="386" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="start">tricity</text><rect x="30" y="504" width="470" height="96" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="534" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="start">Solar photovoltaic cells</text><text x="50" y="562" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">convert light directly into electricity:</text><text x="50" y="584" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">no turbine at all</text><polyline points="504,552 840,552 840,400" fill="none" stroke="#8a6d0d" stroke-width="3.5" stroke-linejoin="round" marker-end="url(#ahO)" stroke-dasharray="10 6"/><text x="530" y="582" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">Solar thermal stations use mirrors</text><text x="530" y="601" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">to heat a fluid and make steam instead.</text>
</svg>