<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 642" width="900" height="642" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="642" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How laws move resources towards the poor</text>

<rect x="30" y="110" width="250" height="140" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="155" y="143" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">HIGHER INCOMES</text><text x="155" y="170" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Pay a larger share</text><text x="155" y="196" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">in tax</text><text x="155" y="225.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">progressive taxation</text><rect x="345" y="110" width="210" height="130" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="152" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">THE STATE</text><text x="450" y="179" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Collects and</text><text x="450" y="205" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">redistributes</text><line x1="286" y1="175" x2="338" y2="175" stroke="#1e2a44" stroke-width="5" marker-end="url(#ah)"/><rect x="620" y="110" width="250" height="86" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="745" y="143" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">SERVICES</text><text x="745" y="170" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">For everyone</text><rect x="620" y="260" width="250" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="745" y="293" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">BENEFITS</text><text x="745" y="320" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Cash to poorer</text><text x="745" y="346" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">households</text><line x1="560" y1="165" x2="613" y2="165" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><path d="M560,210 Q590,210 590,260 L590,300 L612,300" fill="none" stroke="#1e2a44" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><rect x="30" y="270" width="540" height="158" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="303" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">EXAMPLE OF BENEFITS</text><text x="50" y="328.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Benazir Income Support Programme, Pakistan</text><text x="50" y="352.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">(2008)</text><text x="50" y="381.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Cash payments to low-income families, paid to women in</text><text x="50" y="403.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">the household.</text><text x="450" y="462" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Other legal tools</text><rect x="30" y="480" width="269.3333333333333" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="514.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Minimum wage</text><text x="50" y="542.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A legal floor under pay</text><rect x="315.3333333333333" y="480" width="269.3333333333333" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="335.3333333333333" y="514.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Equal opportunities</text><text x="335.3333333333333" y="538.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">laws</text><text x="335.3333333333333" y="566.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Outlaw discrimination, e.g.</text><text x="335.3333333333333" y="587.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">UK Equal Pay Act (1970)</text><rect x="600.6666666666666" y="480" width="269.3333333333333" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="620.6666666666666" y="514.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Other measures</text><text x="620.6666666666666" y="542.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Quotas for disadvantaged</text><text x="620.6666666666666" y="563.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">groups; subsidies on basic</text><text x="620.6666666666666" y="584.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">foods</text>
</svg>