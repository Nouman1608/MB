<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 630" width="900" height="630" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="630" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">NGOs: what they do and where they fall short</text>

<rect x="30" y="104" width="410" height="133" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="137" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">REDUCING POVERTY</text><text x="50" y="163.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Edhi Foundation (1951)</text><text x="50" y="191.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Ambulances, shelters and orphanages for the</text><text x="50" y="212.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">poor, Pakistan</text><rect x="460" y="104" width="410" height="133" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="480" y="137" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PROMOTING BUSINESS</text><text x="480" y="163.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Akhuwat (2001)</text><text x="480" y="191.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Interest-free small loans so poor families</text><text x="480" y="212.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">can start businesses</text><rect x="30" y="255" width="410" height="133" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="288" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">MEDICAL ASSISTANCE</text><text x="50" y="314.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Clinics and vaccination</text><text x="50" y="342.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">International medical charities in crisis</text><text x="50" y="363.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">areas</text><rect x="460" y="255" width="410" height="133" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="480" y="288" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">IMPROVING EDUCATION</text><text x="480" y="314.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Schools and literacy</text><text x="480" y="342.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Low-cost schools, teacher training, literacy</text><text x="480" y="363.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">programmes, especially for girls</text><rect x="30" y="406" width="840" height="194" rx="14" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="439" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">CRITICISMS</text><text x="50" y="465.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">But NGOs may…</text><text x="50" y="494.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="494.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">depend on foreign donors and follow donors’ priorities</text><text x="50" y="521.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="521.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">lack accountability to local people</text><text x="50" y="548.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="548.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">duplicate state services</text><text x="50" y="575.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="575.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">be unable to tackle the structural causes of poverty</text>
</svg>