<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 591" width="900" height="591" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="591" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What a welfare state provides, and when</text>

<line x1="60" y1="180" x2="850" y2="180" stroke="#1e2a44" stroke-width="5" marker-end="url(#ah)"/><circle cx="153.6" cy="180" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="153.6" y="156" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Childhood</text><circle cx="450" cy="180" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="156" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Working age</text><circle cx="746.4" cy="180" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="746.4" y="156" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Old age</text><rect x="30" y="210" width="260" height="174" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="244.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Free / universal</text><text x="50" y="268.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">education</text><text x="50" y="296.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Routes to better jobs and</text><text x="50" y="317.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">mobility. Sri Lanka: free</text><text x="50" y="338.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">from kindergarten to</text><text x="50" y="359.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">university (1940s).</text><line x1="160" y1="190" x2="160" y2="210" stroke="#1e2a44" stroke-width="2.5"/><rect x="320" y="210" width="260" height="174" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="340" y="244.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Unemployment benefits</text><text x="340" y="272.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Prevent destitution</text><text x="340" y="293.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">between jobs. Common in</text><text x="340" y="314.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Europe; limited in many</text><text x="340" y="335.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">developing countries.</text><line x1="450" y1="190" x2="450" y2="210" stroke="#1e2a44" stroke-width="2.5"/><rect x="610" y="210" width="260" height="174" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="630" y="244.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Pensions</text><text x="630" y="272.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Income in old age, from</text><text x="630" y="293.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">state and employer</text><text x="630" y="314.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">schemes.</text><line x1="740" y1="190" x2="740" y2="210" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="416" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">Throughout life</text><rect x="30" y="432" width="269.3333333333333" height="129" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="466.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Free healthcare</text><text x="50" y="494.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Treatment regardless of</text><text x="50" y="515.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">income, e.g. Britain’s NHS</text><text x="50" y="536.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">(1948)</text><rect x="315.3333333333333" y="432" width="269.3333333333333" height="129" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="335.3333333333333" y="466.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Low-cost housing</text><text x="335.3333333333333" y="494.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Secure, affordable homes</text><text x="335.3333333333333" y="515.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">through public housing</text><rect x="600.6666666666666" y="432" width="269.3333333333333" height="129" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="620.6666666666666" y="466.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Universal basic income</text><text x="620.6666666666666" y="494.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Unconditional income for</text><text x="620.6666666666666" y="515.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">all: debated and trialled</text>
</svg>