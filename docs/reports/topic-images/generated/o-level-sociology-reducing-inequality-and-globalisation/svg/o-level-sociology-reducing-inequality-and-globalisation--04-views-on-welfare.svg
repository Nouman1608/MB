<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 643" width="900" height="643" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="643" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Has welfare worked? Critics from both sides</text>

<line x1="450" y1="144" x2="60" y2="144" stroke="#b5602e" stroke-width="4" marker-end="url(#ahR)"/><line x1="450" y1="144" x2="840" y2="144" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><rect x="350" y="122" width="200" height="44" rx="22" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="151" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Welfare state</text><text x="60" y="186" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">Does too much</text><text x="840" y="186" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="end">Does too little</text><rect x="30" y="214" width="410" height="185" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="247" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">NEW RIGHT</text><text x="50" y="274" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Creates an underclass</text><text x="50" y="303.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="303.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Too generous: people depend on benefits</text><text x="66.15" y="325.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">and lack work discipline (Charles</text><text x="66.15" y="347.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Murray, 1984 and 1990)</text><text x="50" y="374.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="374.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Want lower taxes and less state help</text><rect x="460" y="214" width="410" height="185" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="480" y="247" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">MARXISTS</text><text x="480" y="274" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">A “safety valve” for capitalism</text><text x="480" y="303.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="496.15" y="303.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Prevents unrest</text><text x="480" y="330.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="496.15" y="330.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Keeps workers fit for work</text><text x="480" y="357.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="496.15" y="357.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Leaves the ownership of wealth unchanged</text><rect x="30" y="417" width="410" height="196" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="450" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">CULTURE OF POVERTY / DEPENDENCY CULTURE</text><text x="50" y="476.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Blaming values</text><text x="50" y="504.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Oscar Lewis: the poor develop fatalistic</text><text x="50" y="525.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">values passed to their children. Dependency</text><text x="50" y="546.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">culture: benefits discourage self-reliance.</text><text x="50" y="567.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Critics: poverty comes from lack of</text><text x="50" y="588.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">opportunity, not values.</text><rect x="460" y="417" width="410" height="196" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="480" y="450" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">FEMINISTS</text><text x="480" y="476.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Equality laws are not enough</text><text x="480" y="504.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Women still earn less, do most unpaid work</text><text x="480" y="525.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">and are under-represented in power.</text>
</svg>