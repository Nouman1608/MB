<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="440" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Global ecological issues hit poorer societies hardest</text>

<rect x="30" y="104" width="410" height="156" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="137" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">TRANSNATIONAL COMPANIES</text><text x="50" y="162.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Factories move to lower wages and</text><text x="50" y="186.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">weaker safety rules</text><text x="50" y="214.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Rana Plaza, Bangladesh (2013): more than</text><text x="50" y="235.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">1,100 garment workers killed.</text><rect x="460" y="104" width="410" height="156" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="480" y="137" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">CLIMATE CHANGE</text><text x="480" y="162.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Poorer countries suffer most</text><text x="480" y="186.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">despite producing fewer emissions</text><text x="480" y="214.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Pakistan floods (2022) affected millions of</text><text x="480" y="235.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">people.</text><rect x="30" y="278" width="410" height="132" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="311" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">POLLUTION</text><text x="50" y="336.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Industrial waste and air pollution</text><text x="50" y="364.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Often worst in poorer communities.</text><rect x="460" y="278" width="410" height="132" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="480" y="311" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">URBANISATION</text><text x="480" y="336.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Rapid migration to cities</text><text x="480" y="364.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Karachi and Dhaka: large informal</text><text x="480" y="385.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">settlements with poor sanitation.</text>
</svg>