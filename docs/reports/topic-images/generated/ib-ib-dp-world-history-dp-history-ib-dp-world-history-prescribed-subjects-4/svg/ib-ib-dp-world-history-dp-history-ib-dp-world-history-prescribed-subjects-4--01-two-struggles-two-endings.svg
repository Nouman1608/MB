="840" y2="484" stroke="#c9d6d4" stroke-width="1.5"/><text x="840" y="138" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">1966</text><rect x="70" y="164" width="684.4444444444445" height="44" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="84" y="193" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">South Africa, 1948-1964</text><circle cx="155.55555555555554" cy="208" r="6" fill="#1e2a44"/><line x1="155.55555555555554" y1="208" x2="155.55555555555554" y2="226" stroke="#1e2a44" stroke-width="2"/><text x="155.55555555555554" y="244" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">1950 Acts</text><circle cx="241.11111111111111" cy="208" r="6" fill="#1e2a44"/><line x1="241.11111111111111" y1="208" x2="241.11111111111111" y2="250" stroke="#1e2a44" stroke-width="2"/><text x="241.11111111111111" y="268" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">Defiance</text><circle cx="369.44444444444446" cy="208" r="6" fill="#1e2a44"/><line x1="369.44444444444446" y1="208" x2="369.44444444444446" y2="226" stroke="#1e2a44" stroke-width="2"/><text x="369.44444444444446" y="244" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">Freedom Charter</text><circle cx="583.3333333333334" cy="208" r="6" fill="#1e2a44"/><line x1="583.3333333333334" y1="208" x2="583.3333333333334" y2="250" stroke="#1e2a44" stroke-width="2"/><text x="583.3333333333334" y="268" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">Sharpeville</text><rect x="326.6666666666667" y="324" width="470.5555555555555" height="44" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="340.6666666666667" y="353" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">United States, 1954-1965</text><circle cx="326.6666666666667" cy="368" r="6" fill="#1e2a44"/><line x1="326.6666666666667" y1="368" x2="326.6666666666667" y2="386" stroke="#1e2a44" stroke-width="2"/><text x="326.6666666666667" y="404" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">Brown</text><circle cx="390.8333333333333" cy="368" r="6" fill="#1e2a44"/><line x1="390.8333333333333" y1="368" x2="390.8333333333333" y2="410" stroke="#1e2a44" stroke-width="2"/><text x="390.8333333333333" y="428" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">Montgomery</text><circle cx="583.3333333333334" cy="368" r="6" fill="#1e2a44"/><line x1="583.3333333333334" y1="368" x2="583.3333333333334" y2="386" stroke="#1e2a44" stroke-width="2"/><text x="583.3333333333334" y="404" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">Sit-ins</text><circle cx="711.6666666666666" cy="368" r="6" fill="#1e2a44"/><line x1="711.6666666666666" y1="368" x2="711.6666666666666" y2="410" stroke="#1e2a44" stroke-width="2"/><text x="711.6666666666666" y="428" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">Birmingham</text><rect x="30" y="502" width="410" height="133" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="534" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">1963-1964</text><text x="50" y="560.82" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">Rivonia Trial</text><text x="50" y="589.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Leaders imprisoned for life; the state appeared</text><text x="50" y="610.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">to have won</text><rect x="460" y="502" width="410" height="133" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="480" y="534" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">1965</text><text x="480" y="560.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Voting Rights Act</text><text x="480" y="589.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A legislative success, after the Civil Rights Act</text><text x="480" y="610.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(1964)</text>
