<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Two struggles, two endings</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Shared time scale: one closes with new laws, the other with leaders imprisoned</text>
