<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 788" width="900" height="788" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="788" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">South Africa: protest and repression, 1952-1964</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">From mass action to armed struggle</text>
<text x="212.5" y="140" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">PROTEST</text><text x="687.5" y="140" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">STATE RESPONSE</text><line x1="450" y1="154" x2="450" y2="756" stroke="#1e2a44" stroke-width="3"/><rect x="30" y="154" width="365" height="90" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="43" y="180.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Defiance Campaign</text><text x="43" y="207" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Volunteers broke apartheid laws and accepted</text><text x="43" y="227" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">arrest; ANC membership grew</text><line x1="395" y1="199" x2="396" y2="199" stroke="#1e2a44" stroke-width="2"/><rect x="396" y="182" width="108" height="34" rx="17" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="205" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">1952</text><rect x="30" y="256" width="365" height="70" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="43" y="282.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Congress of the People</text><text x="43" y="309" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Freedom Charter</text><line x1="395" y1="291" x2="396" y2="291" stroke="#1e2a44" stroke-width="2"/><rect x="396" y="274" width="108" height="34" rx="17" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="297" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">1955</text><rect x="505" y="338" width="365" height="90" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="518" y="364.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Treason Trial</text><text x="518" y="391" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">156 charged; all acquitted, but leaders tied up</text><text x="518" y="411" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">for years</text><line x1="504" y1="383" x2="505" y2="383" stroke="#1e2a44" stroke-width="2"/><rect x="396" y="366" width="108" height="34" rx="17" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="389" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">1956-61</text><rect x="30" y="440" width="365" height="70" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="43" y="466.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Alexandra bus boycott</text><text x="43" y="493" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Against a fare rise; lasted months</text><line x1="395" y1="475" x2="396" y2="475" stroke="#1e2a44" stroke-width="2"/><rect x="396" y="458" width="108" height="34" rx="17" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="481" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">1957</text><rect x="30" y="522" width="365" height="70" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="43" y="548.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Sharpeville (a PAC protest)</text><text x="43" y="575" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Against pass laws</text><line x1="395" y1="557" x2="396" y2="557" stroke="#1e2a44" stroke-width="2"/><rect x="505" y="522" width="365" height="70" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="518" y="548.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">69 shot dead; state of emergency</text><text x="518" y="575" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">ANC and PAC banned</text><line x1="504" y1="557" x2="505" y2="557" stroke="#1e2a44" stroke-width="2"/><rect x="396" y="540" width="108" height="34" rx="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="563" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">21 Mar 1960</text><rect x="30" y="604" width="365" height="70" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="43" y="630.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Umkhonto we Sizwe</text><text x="43" y="657" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Sabotage begins</text><line x1="395" y1="639" x2="396" y2="639" stroke="#1e2a44" stroke-width="2"/><rect x="396" y="622" width="108" height="34" rx="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="645" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Dec 1961</text><rect x="505" y="686" width="365" height="70" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="518" y="712.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Rivonia Trial</text><text x="518" y="739" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Mandela and other leaders sentenced to life</text><line x1="504" y1="721" x2="505" y2="721" stroke="#1e2a44" stroke-width="2"/><rect x="396" y="704" width="108" height="34" rx="17" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="727" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">1963-64</text>
</svg>