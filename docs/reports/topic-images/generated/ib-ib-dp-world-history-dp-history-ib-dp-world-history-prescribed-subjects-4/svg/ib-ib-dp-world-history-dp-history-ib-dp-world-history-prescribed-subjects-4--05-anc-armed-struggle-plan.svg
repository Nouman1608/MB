<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 769" width="900" height="769" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="769" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Question 4 plan: why armed struggle in 1961?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">"Discuss the reasons why the ANC adopted armed struggle in 1961."</text>
<rect x="30" y="124" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="158.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Thesis</text><text x="450" y="188.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">The state <tspan font-weight="700" fill="#1e2a44">closed</tspan> <tspan font-weight="700" fill="#1e2a44">every</tspan> <tspan font-weight="700" fill="#1e2a44">legal</tspan> <tspan font-weight="700" fill="#1e2a44">route</tspan>; non-violence had not lost support in principle.</text><rect x="130" y="235" width="740" height="78" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="145" y="264.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The failure of non-violence</text><text x="145" y="293.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Defiance Campaign and Freedom Charter met repression, not reform; the Treason Trial</text><circle cx="62" cy="274" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="282.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="682.035" y="247" width="172.965" height="29" rx="14.5" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="768.5174999999999" y="266.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">source + knowledge</text><rect x="130" y="325" width="740" height="78" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="145" y="354.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Sharpeville and the bans</text><text x="145" y="383.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">State violence and the outlawing of the ANC in 1960 removed legal protest</text><circle cx="62" cy="364" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="372.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="736.725" y="337" width="118.275" height="29" rx="14.5" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="795.8625000000001" y="356.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">turning point</text><rect x="130" y="415" width="740" height="99" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="145" y="444.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Competition and pressure</text><text x="145" y="473.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">PAC rivalry; members' frustration; Mandela: violence would come anyway and should be</text><text x="145" y="494.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">directed</text><circle cx="62" cy="464.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="473.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="682.035" y="427" width="172.965" height="29" rx="14.5" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="768.5174999999999" y="446.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">source + knowledge</text><rect x="130" y="526" width="740" height="78" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="145" y="555.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Limits</text><text x="145" y="584.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Luthuli's commitment to non-violence; MK's first focus on sabotage shows restraint</text><circle cx="62" cy="565" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="573.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="695.625" y="538" width="159.375" height="29" rx="14.5" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="775.3125" y="557.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">counter-argument</text><rect x="30" y="626" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="660.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Judgement</text><text x="50" y="690.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Sharpeville was the turning point, but it accelerated a debate that the failure of the 1950s</text><text x="50" y="712.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">campaigns had already opened.</text>
</svg>