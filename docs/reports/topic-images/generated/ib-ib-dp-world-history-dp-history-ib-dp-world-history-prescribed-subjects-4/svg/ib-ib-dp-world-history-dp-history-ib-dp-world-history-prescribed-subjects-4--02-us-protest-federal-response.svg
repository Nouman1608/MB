<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" width="900" height="760" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="760" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">US protest and federal response, 1954-1965</text>

<text x="212.5" y="112" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">PROTEST</text><text x="687.5" y="112" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">FEDERAL RESPONSE</text><line x1="450" y1="126" x2="450" y2="728" stroke="#1e2a44" stroke-width="3"/><rect x="505" y="126" width="365" height="70" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="518" y="152.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Brown v. Board of Education</text><text x="518" y="179" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Segregated public schools unconstitutional</text><line x1="504" y1="161" x2="505" y2="161" stroke="#1e2a44" stroke-width="2"/><rect x="396" y="144" width="108" height="34" rx="17" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="167" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">1954</text><rect x="30" y="208" width="365" height="70" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="43" y="234.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Montgomery Bus Boycott</text><text x="43" y="261" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Over a year, after Rosa Parks's arrest</text><line x1="395" y1="243" x2="396" y2="243" stroke="#1e2a44" stroke-width="2"/><rect x="505" y="208" width="365" height="70" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="518" y="234.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Supreme Court</text><text x="518" y="261" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Bus segregation unconstitutional</text><line x1="504" y1="243" x2="505" y2="243" stroke="#1e2a44" stroke-width="2"/><rect x="396" y="226" width="108" height="34" rx="17" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="249" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">1955-56</text><rect x="30" y="290" width="365" height="70" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="43" y="316.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Little Rock: nine students</text><text x="43" y="343" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">enter Central High School</text><line x1="395" y1="325" x2="396" y2="325" stroke="#1e2a44" stroke-width="2"/><rect x="505" y="290" width="365" height="70" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="518" y="329.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Eisenhower sends federal troops</text><line x1="504" y1="325" x2="505" y2="325" stroke="#1e2a44" stroke-width="2"/><rect x="396" y="308" width="108" height="34" rx="17" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="331" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">1957</text><rect x="30" y="372" width="365" height="70" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="43" y="398.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Sit-ins; Freedom Rides</text><text x="43" y="425" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Greensboro; riders attacked in Alabama</text><line x1="395" y1="407" x2="396" y2="407" stroke="#1e2a44" stroke-width="2"/><rect x="396" y="390" width="108" height="34" rx="17" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="413" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">1960-61</text><rect x="30" y="454" width="365" height="70" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="43" y="480.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Birmingham; March on Washington</text><text x="43" y="507" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Dogs and fire hoses on television</text><line x1="395" y1="489" x2="396" y2="489" stroke="#1e2a44" stroke-width="2"/><rect x="505" y="454" width="365" height="70" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="518" y="493.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Kennedy proposes a civil rights bill</text><line x1="504" y1="489" x2="505" y2="489" stroke="#1e2a44" stroke-width="2"/><rect x="396" y="472" width="108" height="34" rx="17" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="495" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">1963</text><rect x="30" y="536" width="365" height="90" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="43" y="572.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Freedom Summer</text><text x="43" y="599" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Voter registration in Mississippi</text><line x1="395" y1="581" x2="396" y2="581" stroke="#1e2a44" stroke-width="2"/><rect x="505" y="536" width="365" height="90" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="518" y="562.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Civil Rights Act</text><text x="518" y="589" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Bans segregation in public places and job</text><text x="518" y="609" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">discrimination</text><line x1="504" y1="581" x2="505" y2="581" stroke="#1e2a44" stroke-width="2"/><rect x="396" y="564" width="108" height="34" rx="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="587" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">1964</text><rect x="30" y="638" width="365" height="90" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="43" y="664.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Selma</text><text x="43" y="691" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Marchers attacked at the Edmund Pettus</text><text x="43" y="711" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Bridge (March)</text><line x1="395" y1="683" x2="396" y2="683" stroke="#1e2a44" stroke-width="2"/><rect x="505" y="638" width="365" height="90" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="518" y="674.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Voting Rights Act</text><text x="518" y="701" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Literacy tests suspended; federal examiners</text><line x1="504" y1="683" x2="505" y2="683" stroke="#1e2a44" stroke-width="2"/><rect x="396" y="666" width="108" height="34" rx="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="689" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">1965</text>
</svg>