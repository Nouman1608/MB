<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 614" width="900" height="614" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="614" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How apartheid was built, 1949-1959</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Classification first; then laws for every part of life</text>
<rect x="250" y="124" width="400" height="112" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="156" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">1950</text><text x="450" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Population Registration Act</text><text x="450" y="211.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Every person classified by race</text><path d="M450,238 L450,264 L129.75,264 L129.75,290" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><polygon points="123.75,282 135.75,282 129.75,292" fill="#1e2a44"/><path d="M450,238 L450,264 L343.25,264 L343.25,290" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><polygon points="337.25,282 349.25,282 343.25,292" fill="#1e2a44"/><path d="M450,238 L450,264 L556.75,264 L556.75,290" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><polygon points="550.75,282 562.75,282 556.75,292" fill="#1e2a44"/><path d="M450,238 L450,264 L770.25,264 L770.25,290" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><polygon points="764.25,282 776.25,282 770.25,292" fill="#1e2a44"/><rect x="30" y="294" width="199.5" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="129.75" y="341.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Where to live</text><text x="129.75" y="368" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Group Areas Act (1950)</text><rect x="243.5" y="294" width="199.5" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="343.25" y="321.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Relationships</text><text x="343.25" y="348" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Mixed Marriages</text><text x="343.25" y="368" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">(1949); Immorality</text><text x="343.25" y="388" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Amendment (1950)</text><rect x="457" y="294" width="199.5" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="556.75" y="341.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Movement</text><text x="556.75" y="368" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Pass laws</text><rect x="670.5" y="294" width="199.5" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="770.25" y="331.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Schooling</text><text x="770.25" y="358" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Bantu Education Act</text><text x="770.25" y="378" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">(1953)</text><rect x="30" y="450" width="410" height="132" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="482" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PETTY APARTHEID</text><text x="50" y="508.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Everyday facilities segregated</text><text x="50" y="536.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Reservation of Separate Amenities Act (1953)</text><rect x="460" y="450" width="410" height="132" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="480" y="482" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">GRAND APARTHEID</text><text x="480" y="508.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Black Africans assigned to homelands</text><text x="480" y="536.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Bantu Authorities Act (1951); Promotion of Bantu</text><text x="480" y="557.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Self-Government Act (1959)</text>
</svg>