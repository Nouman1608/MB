ont-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">1998</text><rect x="747.6" y="208" width="52" height="312" rx="4" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2" /><text x="773.6" y="198" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">208</text><text x="773.6" y="546" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">2017</text><rect x="805.1999999999999" y="157.75" width="52" height="362" rx="4" fill="#d4b02e" stroke="#1e2a44" stroke-width="2" /><text x="831.1999999999999" y="147.75" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">241.5</text><text x="831.1999999999999" y="546" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">2023</text><text x="500" y="580" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Census year (bars placed on a true time scale)</text><rect x="150" y="160" width="360" height="84" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="170" y="194" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">2017–2023: about 2.55% a year</text><text x="170" y="222" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">one of the fastest rates in Asia</text><text x="140" y="612" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Source: Pakistan Bureau of Statistics censuses (approximate)</text>
