<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 772" width="900" height="772" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="772" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why Pakistan’s population keeps growing</text>

<circle cx="450" cy="330" r="92" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="324" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Continued</text><text x="450" y="350" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">growth</text><rect x="30" y="120" width="270" height="110" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="46" y="148" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Social</text><text x="46" y="174" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Early marriage; preference</text><text x="46" y="196.1" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">for sons; joint families</text><line x1="304" y1="175" x2="362.15160976171256" y2="282.22280530900156" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="600" y="120" width="270" height="110" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="616" y="148" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Educational</text><text x="616" y="174" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Low female literacy, earlier</text><text x="616" y="196.1" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">marriage, less family</text><text x="616" y="218.2" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">planning</text><line x1="596" y1="175" x2="537.8483902382874" y2="282.22280530900156" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="400" width="270" height="110" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="46" y="428" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Economic</text><text x="46" y="454" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Children work and support</text><text x="46" y="476.1" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">parents in old age; few</text><text x="46" y="498.2" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">pensions</text><line x1="304" y1="455" x2="358.4211791206051" y2="370.1661495085066" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="600" y="400" width="270" height="110" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="616" y="428" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Political</text><text x="616" y="454" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Inconsistent funding and</text><text x="616" y="476.1" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">priority for family planning</text><line x1="596" y1="455" x2="541.5788208793949" y2="370.1661495085066" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="315" y="470" width="270" height="110" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="331" y="498" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Medical</text><text x="331" y="524" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Infant and child deaths fall</text><text x="331" y="546.1" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">without an equal fall in</text><text x="331" y="568.2" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">births</text><line x1="450" y1="466" x2="450" y2="430" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="610" width="410" height="142" rx="12" fill="#f6e4d8" stroke="#b5602e" stroke-width="2.5" /><text x="46" y="638" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">Problems</text><text x="46" y="664" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Pressure on food, water and housing;</text><text x="46" y="686.1" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">overcrowded schools and hospitals; sprawl,</text><text x="46" y="708.2" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">traffic, pollution; too few jobs.</text><rect x="460" y="610" width="410" height="142" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="476" y="638" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="start">Solutions to evaluate</text><text x="476" y="664" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Girls’ education; family planning via lady</text><text x="476" y="686.1" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">health workers; child health; old-age</text><text x="476" y="708.2" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">security; religious leaders’ support for</text><text x="476" y="730.3" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">spacing.</text>
</svg>