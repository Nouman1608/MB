<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Reading Pakistan’s population pyramid</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Schematic shape, not census data</text>
<rect x="277" y="150" width="51" height="26" rx="3" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.5" /><rect x="332" y="150" width="49.47" height="26" rx="3" fill="#f2e7b8" stroke="#1e2a44" stroke-width="1.5" /><rect x="251.5" y="180" width="76.5" height="26" rx="3" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.5" /><rect x="332" y="180" width="74.205" height="26" rx="3" fill="#f2e7b8" stroke="#1e2a44" stroke-width="1.5" /><rect x="226" y="210" width="102" height="26" rx="3" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.5" /><rect x="332" y="210" width="98.94" height="26" rx="3" fill="#f2e7b8" stroke="#1e2a44" stroke-width="1.5" /><rect x="200.5" y="240" width="127.5" height="26" rx="3" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.5" /><rect x="332" y="240" width="123.675" height="26" rx="3" fill="#f2e7b8" stroke="#1e2a44" stroke-width="1.5" /><rect x="179.25" y="270" width="148.75" height="26" rx="3" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.5" /><rect x="332" y="270" width="144.2875" height="26" rx="3" fill="#f2e7b8" stroke="#1e2a44" stroke-width="1.5" /><rect x="153.75" y="300" width="174.25" height="26" rx="3" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.5" /><rect x="332" y="300" width="169.0225" height="26" rx="3" fill="#f2e7b8" stroke="#1e2a44" stroke-width="1.5" /><rect x="124" y="330" width="204" height="26" rx="3" fill="#b5d3cf" stroke="#1e2a44" stroke-width="1.5" /><rect x="332" y="330" width="197.88" height="26" rx="3" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.5" /><rect x="98.5" y="360" width="229.5" height="26" rx="3" fill="#b5d3cf" stroke="#1e2a44" stroke-width="1.5" /><rect x="332" y="360" width="222.61499999999998" height="26" rx="3" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.5" /><rect x="73" y="390" width="255" height="26" rx="3" fill="#b5d3cf" stroke="#1e2a44" stroke-width="1.5" /><rect x="332" y="390" width="247.35" height="26" rx="3" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.5" /><rect x="77.25" y="420" width="250.75" height="26" rx="3" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.5" /><rect x="332" y="420" width="243.2275" height="26" rx="3" fill="#f2e7b8" stroke="#1e2a44" stroke-width="1.5" /><rect x="81.5" y="450" width="246.5" height="26" rx="3" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.5" /><rect x="332" y="450" width="239.105" height="26" rx="3" fill="#f2e7b8" stroke="#1e2a44" stroke-width="1.5" /><text x="200" y="136" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Males</text><text x="460" y="136" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="middle">Females</text><text x="44" y="154" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">older</text><text x="44" y="494" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">younger</text><line x1="44" y1="470" x2="44" y2="170" stroke="#4a5568" stroke-width="2.5" marker-end="url(#ah)"/><line x1="389.47" y1="162" x2="650" y2="162" stroke="#1e2a44" stroke-width="2"/><circle cx="389.47" cy="162" r="4" fill="#1e2a44"/><text x="660" y="168" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Narrow top</text><text x="660" y="190" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">few over 65: lower life</text><text x="660" y="209" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">expectancy in the past</text><line x1="562.615" y1="372" x2="650" y2="372" stroke="#1e2a44" stroke-width="2"/><circle cx="562.615" cy="372" r="4" fill="#1e2a44"/><text x="660" y="378" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="start">15–29 bulge</text><text x="660" y="400" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">a very large youth population</text><text x="660" y="419" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">entering work</text><line x1="579.105" y1="462" x2="650" y2="462" stroke="#1e2a44" stroke-width="2"/><circle cx="579.105" cy="462" r="4" fill="#1e2a44"/><text x="660" y="468" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Broad base</text><text x="660" y="490" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">a third or more under 15</text><line x1="463.675" y1="252" x2="650" y2="252" stroke="#1e2a44" stroke-width="2"/><circle cx="463.675" cy="252" r="4" fill="#1e2a44"/><text x="660" y="258" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Slightly more males</text><text x="660" y="280" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">than females overall in</text><text x="660" y="299" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">census counts</text><text x="330" y="510" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Bottom bar slightly narrower: birth rates beginning to fall</text><rect x="30" y="550" width="410" height="140" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="46" y="578" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Effects now</text><text x="46" y="604" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Heavy demand for schools, vaccinations and</text><text x="46" y="626.1" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">child health; high dependency ratio;</text><text x="46" y="648.2" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">millions reach working age each year.</text><rect x="460" y="550" width="410" height="140" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="476" y="578" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Projected effects</text><text x="476" y="604" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">A “demographic dividend” if the young are</text><text x="476" y="626.1" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">educated and employed; unemployment and</text><text x="476" y="648.2" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">unrest if not. Later, more elderly needing</text><text x="476" y="670.3" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">pensions and care.</text>
</svg>