<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 710" width="900" height="710" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="710" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Rural–urban migration: push and pull</text>

<rect x="30" y="110" width="330" height="300" rx="14" fill="#eef3e6" stroke="#6f9a52" stroke-width="2.5"/><text x="195" y="148" font-size="22" font-weight="700" fill="#3d5f2a" text-anchor="middle">Countryside</text><text x="195" y="174" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">PUSH</text><circle cx="60" cy="208.39" r="5" fill="#b5602e"/><text x="76" y="214" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Landlessness, low farm wages</text><circle cx="60" cy="240.48999999999998" r="5" fill="#b5602e"/><text x="76" y="246.1" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Floods and drought</text><circle cx="60" cy="272.59" r="5" fill="#b5602e"/><text x="76" y="278.2" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Few schools or clinics</text><rect x="540" y="110" width="330" height="300" rx="14" fill="#dfe7f2" stroke="#2b5a9a" stroke-width="2.5"/><text x="705" y="148" font-size="22" font-weight="700" fill="#2b5a9a" text-anchor="middle">City</text><text x="705" y="174" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">PULL</text><circle cx="570" cy="208.39" r="5" fill="#2e6b62"/><text x="586" y="214" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Factory, construction and</text><text x="586" y="236.1" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">service jobs</text><circle cx="570" cy="262.59" r="5" fill="#2e6b62"/><text x="586" y="268.2" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Education</text><circle cx="570" cy="294.69" r="5" fill="#2e6b62"/><text x="586" y="300.3" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Health care</text><line x1="366" y1="230" x2="532" y2="230" stroke="#1e2a44" stroke-width="8" marker-end="url(#ah)"/><text x="450" y="214" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">migrants</text><text x="450" y="262" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">e.g. southern Punjab</text><text x="450" y="280" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">and interior Sindh to</text><text x="450" y="298" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Karachi and Lahore</text><line x1="532" y1="350" x2="366" y2="350" stroke="#8a6d0d" stroke-width="4" marker-end="url(#ahO)"/><text x="450" y="338" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">remittances</text><text x="450" y="376" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">houses, schooling,</text><text x="450" y="394" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">farm inputs</text><rect x="30" y="430" width="330" height="120" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="46" y="458" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Effects in the countryside</text><text x="46" y="484" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Loss of young men; more work for</text><text x="46" y="506.1" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">women and the elderly.</text><rect x="540" y="430" width="330" height="120" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="556" y="458" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Effects in the city</text><text x="556" y="484" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Katchi abadis without water,</text><text x="556" y="506.1" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">drainage, power or legal title;</text><text x="556" y="528.2" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">congestion and pollution.</text><rect x="30" y="570" width="840" height="120" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="54" y="604" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Measures and their limits</text><text x="54" y="632" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Self-help housing such as Khuda ki Basti near Hyderabad; regularising katchi abadis with</text><text x="54" y="654" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">standpipes, drains and electricity. But upgrading can attract more migrants.</text>
</svg>