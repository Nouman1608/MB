<rect width="900" height="694" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How Pakistan’s workforce is employed</text>

<text x="30" y="132" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">Share of employed people, Labour Force Survey 2020–21</text><rect x="30" y="150" width="314.16" height="90" rx="0" fill="#6f9a52" stroke="#1e2a44" stroke-width="2" /><text x="187.08" y="205" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">37.4%</text><text x="187.08" y="270" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Agriculture (primary)</text><text x="187.08" y="294" font-size="16" font-weight="600" fill="#b5602e" text-anchor="middle">falling slowly</text><rect x="344.16" y="150" width="213.36" height="90" rx="0" fill="#2b5a9a" stroke="#1e2a44" stroke-width="2" /><text x="450.84000000000003" y="205" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">25.4%</text><text x="450.84000000000003" y="270" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Industry (secondary)</text><rect x="557.52" y="150" width="312.48" height="90" rx="0" fill="#d4b02e" stroke="#1e2a44" stroke-width="2" /><text x="713.76" y="205" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">37.2%</text><text x="713.76" y="270" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Services (tertiary)</text><text x="713.76" y="294" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="middle">growing fastest</text><rect x="30" y="330" width="410" height="116" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="46" y="358" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Unemployment</text><text x="46" y="384" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">No work while seeking it.</text><rect x="460" y="330" width="410" height="116" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="476" y="358" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Underemployment</text><text x="476" y="384" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Working fewer hours or less productively</text><text x="476" y="406.1" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">than one could, e.g. a rickshaw driver with</text><text x="476" y="428.2" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">few fares.</text><rect x="30" y="466" width="410" height="96" rx="12" fill="#eef3e6" stroke="#6f9a52" stroke-width="2.5" /><text x="46" y="494" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Rural causes</text><text x="46" y="520" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Seasonal farm work, mechanisation, small</text><text x="46" y="542.1" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">holdings.</text><rect x="460" y="466" width="410" height="96" rx="12" fill="#dfe7f2" stroke="#2b5a9a" stroke-width="2.5" /><text x="476" y="494" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Urban causes</text><text x="476" y="520" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Too few factory jobs for migrants, power</text><text x="476" y="542.1" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">shortages, skills mismatch.</text><line x1="450" y1="568" x2="450" y2="598" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="170" y="604" width="560" height="70" rx="12" fill="#f6e4d8" stroke="#b5602e" stroke-width="2.5" /><text x="450" y="646" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Lower output and tax revenue: GNP and GDP fall short</text>
</svg>