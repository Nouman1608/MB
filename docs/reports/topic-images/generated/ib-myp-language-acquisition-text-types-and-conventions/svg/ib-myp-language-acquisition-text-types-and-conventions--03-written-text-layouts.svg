<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 810" width="900" height="810" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="810" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Layouts a reader recognises: four written types</text>

<rect x="30" y="110" width="410" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="144" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Email</text><text x="50" y="168" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">ask, thank, inform or complain to one reader</text><rect x="50" y="182" width="370" height="196" rx="6" fill="#fff" stroke="#1e2a44" stroke-width="2"/><rect x="64" y="194" width="342" height="26" rx="4" fill="#dce9e7" stroke="#2e6b62" stroke-width="1.5"/><text x="74" y="212" font-size="14.5" font-weight="700" fill="#2e6b62" text-anchor="start">Subject: states the point</text><text x="70" y="242" font-size="14.5" font-weight="700" fill="#1e2a44" text-anchor="start">Greeting</text><rect x="70" y="252" width="300" height="9" rx="4.5" fill="#c9d6d4"/><text x="70" y="278" font-size="14.5" font-weight="700" fill="#8a6d0d" text-anchor="start">why I am writing (1st sentence)</text><rect x="70" y="286" width="280" height="9" rx="4.5" fill="#c9d6d4"/><rect x="70" y="302" width="250" height="9" rx="4.5" fill="#c9d6d4"/><text x="70" y="332" font-size="14.5" font-weight="700" fill="#8a6d0d" text-anchor="start">clear request / next step</text><text x="70" y="360" font-size="14.5" font-weight="700" fill="#1e2a44" text-anchor="start">Closing formula, name, role</text><text x="50" y="410" font-size="15" font-weight="600" fill="#b5602e" text-anchor="start">✗ vague subject line; request hidden at the end</text><rect x="460" y="110" width="410" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="480" y="144" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Blog post</text><text x="480" y="168" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">share experience and opinion with online readers</text><rect x="480" y="182" width="370" height="196" rx="6" fill="#fff" stroke="#1e2a44" stroke-width="2"/><text x="500" y="212" font-size="14.5" font-weight="700" fill="#1e2a44" text-anchor="start">Catchy title</text><text x="720" y="212" font-size="14.5" font-weight="700" fill="#4a5568" text-anchor="start">date · author</text><text x="500" y="238" font-size="14.5" font-weight="700" fill="#8a6d0d" text-anchor="start">“Have you ever…?” direct address</text><rect x="500" y="248" width="300" height="9" rx="4.5" fill="#c9d6d4"/><text x="500" y="276" font-size="14.5" font-weight="700" fill="#1e2a44" text-anchor="start">Subheading</text><rect x="500" y="286" width="280" height="9" rx="4.5" fill="#c9d6d4"/><rect x="500" y="302" width="220" height="9" rx="4.5" fill="#c9d6d4"/><rect x="500" y="324" width="330" height="40" rx="6" fill="#dce9e7" stroke="#2e6b62" stroke-width="1.5"/><text x="512" y="349" font-size="14.5" font-weight="700" fill="#2e6b62" text-anchor="start">question / call for comments</text><text x="480" y="410" font-size="15" font-weight="600" fill="#b5602e" text-anchor="start">✗ a diary entry called a blog</text><rect x="30" y="456" width="410" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="490" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Article</text><text x="50" y="514" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">inform or persuade magazine or newspaper readers</text><rect x="50" y="528" width="370" height="196" rx="6" fill="#fff" stroke="#1e2a44" stroke-width="2"/><text x="70" y="560" font-size="14.5" font-weight="700" fill="#1e2a44" text-anchor="start">HEADLINE</text><text x="70" y="580" font-size="14.5" font-weight="700" fill="#4a5568" text-anchor="start">subheading · byline</text><text x="70" y="606" font-size="14.5" font-weight="700" fill="#8a6d0d" text-anchor="start">opening: hook + summary</text><rect x="70" y="616" width="310" height="9" rx="4.5" fill="#c9d6d4"/><rect x="70" y="638" width="150" height="9" rx="4.5" fill="#c9d6d4"/><rect x="240" y="638" width="150" height="9" rx="4.5" fill="#c9d6d4"/><rect x="70" y="654" width="150" height="9" rx="4.5" fill="#c9d6d4"/><rect x="240" y="654" width="150" height="9" rx="4.5" fill="#c9d6d4"/><text x="70" y="682" font-size="14.5" font-weight="700" fill="#2e6b62" text-anchor="start">facts, examples, quoted comments</text><text x="70" y="708" font-size="14.5" font-weight="700" fill="#8a6d0d" text-anchor="start">ending returns to the headline</text><text x="50" y="756" font-size="15" font-weight="600" fill="#b5602e" text-anchor="start">✗ no headline or byline</text><rect x="460" y="456" width="410" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="480" y="490" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Diary entry</text><text x="480" y="514" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">record and reflect, for the writer alone</text><rect x="480" y="528" width="370" height="196" rx="6" fill="#fff" stroke="#1e2a44" stroke-width="2"/><text x="500" y="558" font-size="14.5" font-weight="700" fill="#1e2a44" text-anchor="start">Date</text><text x="500" y="584" font-size="14.5" font-weight="700" fill="#4a5568" text-anchor="start">Dear Diary, (if your language uses it)</text><text x="500" y="612" font-size="14.5" font-weight="700" fill="#8a6d0d" text-anchor="start">I…: past tenses for events</text><rect x="500" y="622" width="290" height="9" rx="4.5" fill="#c9d6d4"/><text x="500" y="650" font-size="14.5" font-weight="700" fill="#8a6d0d" text-anchor="start">present for feelings; reflective</text><rect x="500" y="660" width="260" height="9" rx="4.5" fill="#c9d6d4"/><text x="500" y="696" font-size="14.5" font-weight="700" fill="#2e6b62" text-anchor="start">thoughts about what happens next</text><text x="480" y="756" font-size="15" font-weight="600" fill="#b5602e" text-anchor="start">✗ writing to an audience: “Hi, readers!”</text>
</svg>