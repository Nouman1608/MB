<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 695" width="900" height="695" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="695" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Conventions of a speech, a brochure and a review</text>

<rect x="30" y="110" width="270" height="560" rx="14" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="146" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="start">Speech</text><text x="50" y="172" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">persuade, inform or celebrate;</text><text x="50" y="191" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">heard only once</text><rect x="46" y="226" width="238" height="46" rx="8" fill="#fff" stroke="#c9d6d4" stroke-width="1.8"/><text x="60" y="245" font-size="14.5" font-weight="400" fill="#1e2a44" text-anchor="start">greet: “Good morning,</text><text x="60" y="262" font-size="14.5" font-weight="400" fill="#1e2a44" text-anchor="start">everyone”</text><rect x="46" y="282" width="238" height="46" rx="8" fill="#fff" stroke="#c9d6d4" stroke-width="1.8"/><text x="60" y="301" font-size="14.5" font-weight="400" fill="#1e2a44" text-anchor="start">introduce yourself and</text><text x="60" y="318" font-size="14.5" font-weight="400" fill="#1e2a44" text-anchor="start">your point</text><rect x="46" y="338" width="238" height="46" rx="8" fill="#fff" stroke="#c9d6d4" stroke-width="1.8"/><text x="60" y="357" font-size="14.5" font-weight="400" fill="#1e2a44" text-anchor="start">signposts: First… Next…</text><text x="60" y="374" font-size="14.5" font-weight="400" fill="#1e2a44" text-anchor="start">Finally…</text><rect x="46" y="394" width="238" height="46" rx="8" fill="#fff" stroke="#c9d6d4" stroke-width="1.8"/><text x="60" y="422" font-size="14.5" font-weight="400" fill="#1e2a44" text-anchor="start">rhetorical questions</text><rect x="46" y="450" width="238" height="46" rx="8" fill="#fff" stroke="#c9d6d4" stroke-width="1.8"/><text x="60" y="478" font-size="14.5" font-weight="400" fill="#1e2a44" text-anchor="start">repetition; lists of three</text><rect x="46" y="506" width="238" height="46" rx="8" fill="#fff" stroke="#c9d6d4" stroke-width="1.8"/><text x="60" y="534" font-size="14.5" font-weight="400" fill="#1e2a44" text-anchor="start">“you” and “we”</text><rect x="46" y="562" width="238" height="46" rx="8" fill="#fff" stroke="#c9d6d4" stroke-width="1.8"/><text x="60" y="581" font-size="14.5" font-weight="400" fill="#1e2a44" text-anchor="start">memorable last line and</text><text x="60" y="598" font-size="14.5" font-weight="400" fill="#1e2a44" text-anchor="start">thanks</text><text x="50" y="630" font-size="15" font-weight="600" fill="#b5602e" text-anchor="start">✗ an essay with a greeting on</text><text x="50" y="649" font-size="15" font-weight="600" fill="#b5602e" text-anchor="start">top</text><rect x="315" y="110" width="270" height="560" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="335" y="146" font-size="21" font-weight="700" fill="#8a6d0d" text-anchor="start">Brochure / leaflet</text><text x="335" y="172" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">inform and persuade the public</text><text x="335" y="191" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">about a place, service or</text><text x="335" y="210" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">event</text><rect x="331" y="226" width="238" height="46" rx="8" fill="#fff" stroke="#c9d6d4" stroke-width="1.8"/><text x="345" y="254" font-size="14.5" font-weight="400" fill="#1e2a44" text-anchor="start">title and slogan</text><rect x="331" y="282" width="238" height="46" rx="8" fill="#fff" stroke="#c9d6d4" stroke-width="1.8"/><text x="345" y="310" font-size="14.5" font-weight="400" fill="#1e2a44" text-anchor="start">headings, short sections</text><rect x="331" y="338" width="238" height="46" rx="8" fill="#fff" stroke="#c9d6d4" stroke-width="1.8"/><text x="345" y="366" font-size="14.5" font-weight="400" fill="#1e2a44" text-anchor="start">bullet points</text><rect x="331" y="394" width="238" height="46" rx="8" fill="#fff" stroke="#c9d6d4" stroke-width="1.8"/><text x="345" y="413" font-size="14.5" font-weight="400" fill="#1e2a44" text-anchor="start">imperatives: “Visit”,</text><text x="345" y="430" font-size="14.5" font-weight="400" fill="#1e2a44" text-anchor="start">“Book now”</text><rect x="331" y="450" width="238" height="46" rx="8" fill="#fff" stroke="#c9d6d4" stroke-width="1.8"/><text x="345" y="478" font-size="14.5" font-weight="400" fill="#1e2a44" text-anchor="start">times, prices, contact</text><rect x="331" y="506" width="238" height="46" rx="8" fill="#fff" stroke="#c9d6d4" stroke-width="1.8"/><text x="345" y="534" font-size="14.5" font-weight="400" fill="#1e2a44" text-anchor="start">space marked for images</text><rect x="331" y="562" width="238" height="46" rx="8" fill="#fff" stroke="#c9d6d4" stroke-width="1.8"/><text x="345" y="590" font-size="14.5" font-weight="400" fill="#1e2a44" text-anchor="start">call to action</text><text x="335" y="630" font-size="15" font-weight="600" fill="#b5602e" text-anchor="start">✗ long, unbroken paragraphs:</text><text x="335" y="649" font-size="15" font-weight="600" fill="#b5602e" text-anchor="start">it is scanned</text><rect x="600" y="110" width="270" height="560" rx="14" fill="#fbf6e0" stroke="#8a6d0d" stroke-width="2.5"/><text x="620" y="146" font-size="21" font-weight="700" fill="#8a6d0d" text-anchor="start">Review</text><text x="620" y="172" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">judge something and advise the</text><text x="620" y="191" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">reader</text><rect x="616" y="226" width="238" height="46" rx="8" fill="#fff" stroke="#c9d6d4" stroke-width="1.8"/><text x="630" y="245" font-size="14.5" font-weight="400" fill="#1e2a44" text-anchor="start">title naming what is</text><text x="630" y="262" font-size="14.5" font-weight="400" fill="#1e2a44" text-anchor="start">reviewed</text><rect x="616" y="282" width="238" height="46" rx="8" fill="#fff" stroke="#c9d6d4" stroke-width="1.8"/><text x="630" y="301" font-size="14.5" font-weight="400" fill="#1e2a44" text-anchor="start">key facts: what, where,</text><text x="630" y="318" font-size="14.5" font-weight="400" fill="#1e2a44" text-anchor="start">who</text><rect x="616" y="338" width="238" height="46" rx="8" fill="#fff" stroke="#c9d6d4" stroke-width="1.8"/><text x="630" y="357" font-size="14.5" font-weight="400" fill="#1e2a44" text-anchor="start">short description, no</text><text x="630" y="374" font-size="14.5" font-weight="400" fill="#1e2a44" text-anchor="start">spoilers</text><rect x="616" y="394" width="238" height="46" rx="8" fill="#fff" stroke="#c9d6d4" stroke-width="1.8"/><text x="630" y="422" font-size="14.5" font-weight="400" fill="#1e2a44" text-anchor="start">strengths with evidence</text><rect x="616" y="450" width="238" height="46" rx="8" fill="#fff" stroke="#c9d6d4" stroke-width="1.8"/><text x="630" y="478" font-size="14.5" font-weight="400" fill="#1e2a44" text-anchor="start">weaknesses with evidence</text><rect x="616" y="506" width="238" height="46" rx="8" fill="#fff" stroke="#c9d6d4" stroke-width="1.8"/><text x="630" y="534" font-size="14.5" font-weight="400" fill="#1e2a44" text-anchor="start">clear recommendation</text><rect x="616" y="562" width="238" height="46" rx="8" fill="#fff" stroke="#c9d6d4" stroke-width="1.8"/><text x="630" y="590" font-size="14.5" font-weight="400" fill="#1e2a44" text-anchor="start">often a rating</text><text x="620" y="630" font-size="15" font-weight="600" fill="#b5602e" text-anchor="start">✗ retelling the plot without</text><text x="620" y="649" font-size="15" font-weight="600" fill="#b5602e" text-anchor="start">judging it</text>
</svg>