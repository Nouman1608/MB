<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 732" width="900" height="732" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="732" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">One topic, three text types</text>

<rect x="150" y="110" width="600" height="56" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="145" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Same facts: Harwick Food Festival stall, 8 June</text><text x="30" y="270" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">Audience</text><text x="30" y="344" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">Purpose</text><text x="30" y="418" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">Register</text><text x="30" y="492" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">Opening</text><text x="30" y="566" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">Language</text><text x="30" y="640" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">Ending</text><line x1="390" y1="168" x2="248" y2="186" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="130" y="190" width="236" height="488" rx="14" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.5"/><text x="248" y="220" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">Formal email</text><rect x="140" y="232" width="216" height="64" rx="8" fill="#fff" stroke="#c9d6d4" stroke-width="1.5"/><text x="152" y="258" font-size="14.5" font-weight="400" fill="#1e2a44" text-anchor="start">Mr Brennan, Festival</text><text x="152" y="276" font-size="14.5" font-weight="400" fill="#1e2a44" text-anchor="start">Coordinator</text><rect x="140" y="306" width="216" height="64" rx="8" fill="#fff" stroke="#c9d6d4" stroke-width="1.5"/><text x="152" y="344" font-size="14.5" font-weight="400" fill="#1e2a44" text-anchor="start">ask for a stall</text><rect x="140" y="380" width="216" height="64" rx="8" fill="#fff" stroke="#c9d6d4" stroke-width="1.5"/><text x="152" y="418" font-size="14.5" font-weight="700" fill="#1e2a44" text-anchor="start">Formal</text><rect x="140" y="454" width="216" height="64" rx="8" fill="#fff" stroke="#c9d6d4" stroke-width="1.5"/><text x="152" y="492" font-size="14.5" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“Dear Mr Brennan,”</text><rect x="140" y="528" width="216" height="64" rx="8" fill="#fff" stroke="#c9d6d4" stroke-width="1.5"/><text x="152" y="554" font-size="14.5" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">no contractions; “We</text><text x="152" y="572" font-size="14.5" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">would be grateful if…”</text><rect x="140" y="602" width="216" height="64" rx="8" fill="#fff" stroke="#c9d6d4" stroke-width="1.5"/><text x="152" y="628" font-size="14.5" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“Yours sincerely,” +</text><text x="152" y="646" font-size="14.5" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">name and role</text><line x1="450" y1="168" x2="498" y2="186" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="380" y="190" width="236" height="488" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="498" y="220" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="middle">Blog post</text><rect x="390" y="232" width="216" height="64" rx="8" fill="#fff" stroke="#c9d6d4" stroke-width="1.5"/><text x="402" y="258" font-size="14.5" font-weight="400" fill="#1e2a44" text-anchor="start">readers of the student</text><text x="402" y="276" font-size="14.5" font-weight="400" fill="#1e2a44" text-anchor="start">blog</text><rect x="390" y="306" width="216" height="64" rx="8" fill="#fff" stroke="#c9d6d4" stroke-width="1.5"/><text x="402" y="332" font-size="14.5" font-weight="400" fill="#1e2a44" text-anchor="start">persuade students to</text><text x="402" y="350" font-size="14.5" font-weight="400" fill="#1e2a44" text-anchor="start">volunteer</text><rect x="390" y="380" width="216" height="64" rx="8" fill="#fff" stroke="#c9d6d4" stroke-width="1.5"/><text x="402" y="418" font-size="14.5" font-weight="700" fill="#1e2a44" text-anchor="start">Semi-formal</text><rect x="390" y="454" width="216" height="64" rx="8" fill="#fff" stroke="#c9d6d4" stroke-width="1.5"/><text x="402" y="480" font-size="14.5" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“Picture this: a sunny</text><text x="402" y="498" font-size="14.5" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">Saturday…”</text><rect x="390" y="528" width="216" height="64" rx="8" fill="#fff" stroke="#c9d6d4" stroke-width="1.5"/><text x="402" y="554" font-size="14.5" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">contractions; rhetorical</text><text x="402" y="572" font-size="14.5" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">questions; no slang</text><rect x="390" y="602" width="216" height="64" rx="8" fill="#fff" stroke="#c9d6d4" stroke-width="1.5"/><text x="402" y="628" font-size="14.5" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“Who’s in? Tell me in</text><text x="402" y="646" font-size="14.5" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">the comments.”</text><line x1="510" y1="168" x2="748" y2="186" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="630" y="190" width="236" height="488" rx="14" fill="#fbf6e0" stroke="#8a6d0d" stroke-width="2.5"/><text x="748" y="220" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="middle">Diary entry</text><rect x="640" y="232" width="216" height="64" rx="8" fill="#fff" stroke="#c9d6d4" stroke-width="1.5"/><text x="652" y="270" font-size="14.5" font-weight="400" fill="#1e2a44" text-anchor="start">yourself</text><rect x="640" y="306" width="216" height="64" rx="8" fill="#fff" stroke="#c9d6d4" stroke-width="1.5"/><text x="652" y="344" font-size="14.5" font-weight="400" fill="#1e2a44" text-anchor="start">reflect on your feelings</text><rect x="640" y="380" width="216" height="64" rx="8" fill="#fff" stroke="#c9d6d4" stroke-width="1.5"/><text x="652" y="418" font-size="14.5" font-weight="700" fill="#1e2a44" text-anchor="start">Informal</text><rect x="640" y="454" width="216" height="64" rx="8" fill="#fff" stroke="#c9d6d4" stroke-width="1.5"/><text x="652" y="480" font-size="14.5" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“Dear Diary, They said</text><text x="652" y="498" font-size="14.5" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">yes!”</text><rect x="640" y="528" width="216" height="64" rx="8" fill="#fff" stroke="#c9d6d4" stroke-width="1.5"/><text x="652" y="554" font-size="14.5" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">short, emotional;</text><text x="652" y="572" font-size="14.5" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">questions to yourself</text><rect x="640" y="602" width="216" height="64" rx="8" fill="#fff" stroke="#c9d6d4" stroke-width="1.5"/><text x="652" y="628" font-size="14.5" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">a private worry: “I just</text><text x="652" y="646" font-size="14.5" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">hope people sign up.”</text><text x="450" y="708" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">If two endings could be swapped unnoticed, your conventions are too weak.</text>
</svg>