<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 725" width="900" height="725" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="725" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Register: what changes</text>

<defs><linearGradient id="rg2" x1="0" x2="1"><stop offset="0" stop-color="#b5d3cf"/><stop offset="1" stop-color="#f2e7b8"/></linearGradient></defs><rect x="250" y="110" width="620" height="44" rx="10" fill="url(#rg2)" stroke="#1e2a44" stroke-width="2"/><text x="270" y="139" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Formal</text><text x="560" y="139" font-size="16" font-weight="600" fill="#4a5568" text-anchor="middle">semi-formal</text><text x="850" y="139" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">Informal</text><rect x="30" y="166" width="205" height="46" rx="8" fill="#ffffff" stroke="#c9d6d4" stroke-width="1.8"/><text x="46" y="196" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Address</text><rect x="250" y="166" width="300" height="46" rx="8" fill="#eaf3f1" stroke="#2e6b62" stroke-width="1.5"/><text x="264" y="196" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">title and surname, or a role</text><rect x="570" y="166" width="300" height="46" rx="8" fill="#fbf6e0" stroke="#8a6d0d" stroke-width="1.5"/><text x="584" y="196" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">first name or nickname</text><rect x="30" y="222" width="205" height="46" rx="8" fill="#ffffff" stroke="#c9d6d4" stroke-width="1.8"/><text x="46" y="252" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">“You”</text><rect x="250" y="222" width="300" height="46" rx="8" fill="#eaf3f1" stroke="#2e6b62" stroke-width="1.5"/><text x="264" y="252" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">polite form, where it exists</text><rect x="570" y="222" width="300" height="46" rx="8" fill="#fbf6e0" stroke="#8a6d0d" stroke-width="1.5"/><text x="584" y="252" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">familiar form</text><rect x="30" y="278" width="205" height="46" rx="8" fill="#ffffff" stroke="#c9d6d4" stroke-width="1.8"/><text x="46" y="308" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Contractions</text><rect x="250" y="278" width="300" height="46" rx="8" fill="#eaf3f1" stroke="#2e6b62" stroke-width="1.5"/><text x="264" y="308" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">avoided</text><rect x="570" y="278" width="300" height="46" rx="8" fill="#fbf6e0" stroke="#8a6d0d" stroke-width="1.5"/><text x="584" y="308" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">common (“I’m”, “can’t”)</text><rect x="30" y="334" width="205" height="46" rx="8" fill="#ffffff" stroke="#c9d6d4" stroke-width="1.8"/><text x="46" y="364" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Vocabulary</text><rect x="250" y="334" width="300" height="46" rx="8" fill="#eaf3f1" stroke="#2e6b62" stroke-width="1.5"/><text x="264" y="364" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">precise, neutral: inform, request</text><rect x="570" y="334" width="300" height="46" rx="8" fill="#fbf6e0" stroke="#8a6d0d" stroke-width="1.5"/><text x="584" y="364" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">everyday: tell, ask</text><rect x="30" y="390" width="205" height="46" rx="8" fill="#ffffff" stroke="#c9d6d4" stroke-width="1.8"/><text x="46" y="420" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Idiom and slang</text><rect x="250" y="390" width="300" height="46" rx="8" fill="#eaf3f1" stroke="#2e6b62" stroke-width="1.5"/><text x="264" y="420" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">rare</text><rect x="570" y="390" width="300" height="46" rx="8" fill="#fbf6e0" stroke="#8a6d0d" stroke-width="1.5"/><text x="584" y="420" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">welcome, if natural</text><rect x="30" y="446" width="205" height="46" rx="8" fill="#ffffff" stroke="#c9d6d4" stroke-width="1.8"/><text x="46" y="476" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Sentences</text><rect x="250" y="446" width="300" height="46" rx="8" fill="#eaf3f1" stroke="#2e6b62" stroke-width="1.5"/><text x="264" y="476" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">complete, often complex</text><rect x="570" y="446" width="300" height="46" rx="8" fill="#fbf6e0" stroke="#8a6d0d" stroke-width="1.5"/><text x="584" y="476" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">shorter; fragments allowed</text><rect x="30" y="502" width="205" height="46" rx="8" fill="#ffffff" stroke="#c9d6d4" stroke-width="1.8"/><text x="46" y="532" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Punctuation</text><rect x="250" y="502" width="300" height="46" rx="8" fill="#eaf3f1" stroke="#2e6b62" stroke-width="1.5"/><text x="264" y="532" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">restrained</text><rect x="570" y="502" width="300" height="46" rx="8" fill="#fbf6e0" stroke="#8a6d0d" stroke-width="1.5"/><text x="584" y="532" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">exclamation marks, dashes</text><rect x="30" y="558" width="205" height="46" rx="8" fill="#ffffff" stroke="#c9d6d4" stroke-width="1.8"/><text x="46" y="588" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Closing</text><rect x="250" y="558" width="300" height="46" rx="8" fill="#eaf3f1" stroke="#2e6b62" stroke-width="1.5"/><text x="264" y="588" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">fixed polite formula</text><rect x="570" y="558" width="300" height="46" rx="8" fill="#fbf6e0" stroke="#8a6d0d" stroke-width="1.5"/><text x="584" y="588" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">friendly sign-off</text><rect x="30" y="626" width="840" height="76" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="55" y="658" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="start">Semi-formal: a school blog post or a speech to your year group</text><text x="55" y="684" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">friendly but careful, with no slang</text>
</svg>