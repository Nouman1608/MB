<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 635" width="900" height="635" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="635" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four decisions before you write</text>

<rect x="30" y="110" width="270" height="130" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><circle cx="62" cy="146" r="18" fill="#fff" stroke="#1e2a44" stroke-width="3"/><text x="62" y="152.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="90" y="153" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Text type</text><text x="50" y="192" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">what form does the task ask</text><text x="50" y="212" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">for?</text><line x1="165" y1="244" x2="380" y2="290" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="315" y="110" width="270" height="130" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="347" cy="146" r="18" fill="#fff" stroke="#1e2a44" stroke-width="3"/><text x="347" y="152.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="375" y="153" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Audience</text><text x="335" y="192" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">who reads it?</text><line x1="450" y1="244" x2="450" y2="290" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="600" y="110" width="270" height="130" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><circle cx="632" cy="146" r="18" fill="#fff" stroke="#1e2a44" stroke-width="3"/><text x="632" y="152.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="660" y="153" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Purpose</text><text x="620" y="192" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">inform, persuade, describe,</text><text x="620" y="212" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">recount, advise, complain,</text><text x="620" y="232" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">thank?</text><line x1="735" y1="244" x2="520" y2="290" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="250" y="296" width="400" height="90" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><circle cx="290" cy="341" r="18" fill="#fff" stroke="#1e2a44" stroke-width="3"/><text x="290" y="347.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="470" y="334" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Register</text><text x="470" y="362" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="middle">follows from 1–3, not from the topic</text><line x1="450" y1="390" x2="450" y2="420" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="426" width="840" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="55" y="462" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Same topic, school uniform:</text><rect x="55" y="482" width="380" height="74" rx="10" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2"/><text x="75" y="512" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">email to the head teacher</text><text x="75" y="538" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">→ formal</text><rect x="465" y="482" width="380" height="74" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="485" y="512" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">message to a cousin</text><text x="485" y="538" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="start">→ informal</text><text x="450" y="608" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">Once you choose a register, hold it from the first line to the last.</text>
</svg>