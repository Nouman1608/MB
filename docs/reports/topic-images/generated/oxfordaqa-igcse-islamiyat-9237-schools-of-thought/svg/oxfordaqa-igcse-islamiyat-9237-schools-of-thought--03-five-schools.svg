<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The five schools at a glance</text>

<rect x="30" y="104" width="110" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="42" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">School</text><rect x="140" y="104" width="190" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="152" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Founder and city</text><rect x="330" y="104" width="250" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="342" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Distinctive method</text><rect x="580" y="104" width="110" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="592" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Key work</text><rect x="690" y="104" width="180" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="702" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Followed today in</text><rect x="30" y="150" width="110" height="82" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="174.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Hanafi</text><rect x="140" y="150" width="190" height="82" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="152" y="174.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Abu Hanifa, Kufa</text><text x="152" y="194.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">(earliest)</text><rect x="330" y="150" width="250" height="82" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="342" y="174.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Companions’ opinions, qiyas,</text><text x="342" y="194.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">ra’y, istihsan, ’urf</text><rect x="580" y="150" width="110" height="82" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="592" y="174.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">—</text><rect x="690" y="150" width="180" height="82" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="702" y="174.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">South Asia, Turkey,</text><text x="702" y="194.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Central Asia,</text><text x="702" y="214.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Balkans</text><rect x="30" y="232" width="110" height="82" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="256.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Maliki</text><rect x="140" y="232" width="190" height="82" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="152" y="256.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Malik ibn Anas,</text><text x="152" y="276.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Madinah</text><rect x="330" y="232" width="250" height="82" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="342" y="256.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Practice of the people of</text><text x="342" y="276.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Madinah; maslahah</text><rect x="580" y="232" width="110" height="82" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="592" y="256.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">al-Muwatta</text><rect x="690" y="232" width="180" height="82" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="702" y="256.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">North and West</text><text x="702" y="276.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Africa, parts of the</text><text x="702" y="296.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Gulf</text><rect x="30" y="314" width="110" height="82" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="338.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Shafi’i</text><rect x="140" y="314" width="190" height="82" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="152" y="338.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">al-Shafi’i, settled</text><text x="152" y="358.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">in Egypt</text><rect x="330" y="314" width="250" height="82" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="342" y="338.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Qur’an, Sunnah, Ijma, Qiyas</text><text x="342" y="358.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">in order; authentic Hadith</text><text x="342" y="378.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">over custom</text><rect x="580" y="314" width="110" height="82" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="592" y="338.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">al-Risala</text><rect x="690" y="314" width="180" height="82" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="702" y="338.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Egypt, East Africa,</text><text x="702" y="358.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Yemen, South-East</text><text x="702" y="378.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Asia</text><rect x="30" y="396" width="110" height="62" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="420.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Hanbali</text><rect x="140" y="396" width="190" height="62" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="152" y="420.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Ahmad ibn Hanbal,</text><text x="152" y="440.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Baghdad</text><rect x="330" y="396" width="250" height="62" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="342" y="420.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Hadith or a companion’s view</text><text x="342" y="440.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">before analogy</text><rect x="580" y="396" width="110" height="62" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="592" y="420.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">al-Musnad</text><rect x="690" y="396" width="180" height="62" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="702" y="420.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Saudi Arabia, Qatar</text><rect x="30" y="458" width="110" height="82" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="482.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Ja’fari</text><rect x="140" y="458" width="190" height="82" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="152" y="482.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Ja’far al-Sadiq,</text><text x="152" y="502.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Madinah</text><rect x="330" y="458" width="250" height="82" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="342" y="482.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Sunnah incl. the Imams of Ahl</text><text x="342" y="502.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">al-Bayt; reason (’aql), not</text><text x="342" y="522.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">qiyas</text><rect x="580" y="458" width="110" height="82" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="592" y="482.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">—</text><rect x="690" y="458" width="180" height="82" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="702" y="482.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Iran, Iraq, Bahrain,</text><text x="702" y="502.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Lebanon, Azerbaijan</text>
