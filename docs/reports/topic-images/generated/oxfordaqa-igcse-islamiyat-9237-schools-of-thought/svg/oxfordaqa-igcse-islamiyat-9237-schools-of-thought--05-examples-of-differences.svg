<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 587" width="900" height="587" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="587" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Differences in detail, not in fundamentals</text>

<rect x="30" y="104" width="200" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="42" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Issue</text><rect x="230" y="104" width="640" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="242" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Example of difference</text><rect x="30" y="150" width="200" height="43" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="175.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Hands in prayer</text><rect x="230" y="150" width="640" height="43" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="242" y="175.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Hanafis below the navel; Shafi’is above it; many Malikis at the sides</text><rect x="30" y="193" width="200" height="64" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="218.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Saying “Amin”</text><rect x="230" y="193" width="640" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="242" y="218.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Shafi’is and Hanbalis aloud after al-Fatiha in congregation; Hanafis</text><text x="242" y="239.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">quietly</text><rect x="30" y="257" width="200" height="64" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="282.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Breaking Wudu</text><rect x="230" y="257" width="640" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="242" y="282.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Hanafis: flowing blood; Shafi’is: touching the skin of a non-mahram of the</text><text x="242" y="303.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">opposite sex</text><rect x="30" y="321" width="200" height="43" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="346.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Combining prayers</text><rect x="230" y="321" width="640" height="43" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="242" y="346.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Ja’faris regularly combine; Hanafis only at Arafat and Muzdalifah</text><rect x="30" y="364" width="200" height="64" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="389.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Sources</text><rect x="230" y="364" width="640" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="242" y="389.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Malikis: practice of Madinah; Hanafis: istihsan; Ja’faris: reason in place</text><text x="242" y="410.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">of qiyas</text><rect x="30" y="446" width="840" height="111" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="481.2" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">Shared by every school</text><text x="450" y="510.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Tawhid · the authority of the Qur’an and Sunnah · five daily prayers · fasting in Ramadhan</text><text x="450" y="532.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">· Zakah · Hajj</text>
</svg>