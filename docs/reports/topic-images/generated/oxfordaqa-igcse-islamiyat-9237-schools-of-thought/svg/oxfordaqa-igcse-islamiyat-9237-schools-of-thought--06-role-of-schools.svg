<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 393" width="900" height="393" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="393" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The role of the schools</text>

<rect x="30" y="104" width="268" height="110" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="140" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Guidance</text><text x="50" y="168.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Make Shariah usable by</text><text x="50" y="189.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">ordinary Muslims</text><rect x="316" y="104" width="268" height="110" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="336" y="140" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Stability</text><text x="336" y="168.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A consistent body of law</text><text x="336" y="189.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">for courts and communities</text><rect x="602" y="104" width="268" height="110" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="622" y="140" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Flexibility</text><text x="622" y="168.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Different methods respond</text><text x="622" y="189.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">to new times and places</text><rect x="30" y="232" width="411" height="131" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="268" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Respect for scholarship</text><text x="50" y="296.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Protect the sources from careless</text><text x="50" y="317.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">interpretation</text><rect x="459" y="232" width="411" height="131" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="479" y="268" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="start">Unity in diversity</text><text x="479" y="296.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The Amman Message (2005) recognised the four</text><text x="479" y="317.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Sunni schools and the Ja’fari school, among</text><text x="479" y="338.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">others, as legitimate</text>
</svg>