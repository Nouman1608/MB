<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" width="900" height="660" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="660" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How the founders are linked</text>

<rect x="30" y="130" width="220" height="96" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="140" y="169.7" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Ja’far al-Sadiq</text><text x="140" y="197.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Madinah · Ja’fari</text><rect x="340" y="130" width="220" height="96" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="169.7" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Malik ibn Anas</text><text x="450" y="197.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Madinah · Maliki</text><rect x="30" y="340" width="220" height="96" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="140" y="379.7" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Abu Hanifa</text><text x="140" y="407.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Kufa · Hanafi</text><rect x="340" y="340" width="220" height="111" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="367.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">al-Shafi’i</text><text x="450" y="395" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Madinah, then Iraq</text><text x="450" y="415" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">(learned from Hanafi</text><text x="450" y="435" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">scholars), then Egypt</text><rect x="650" y="340" width="220" height="96" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="760" y="379.7" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Ahmad ibn Hanbal</text><text x="760" y="407.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Baghdad · Hanbali</text><rect x="30" y="530" width="220" height="116" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="140" y="557.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Abu Yusuf and</text><text x="140" y="582.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">al-Shaybani</text><text x="140" y="610" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">recorded Abu Hanifa’s</text><text x="140" y="630" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">teaching</text><line x1="254" y1="178" x2="334" y2="178" stroke="#8a6d0d" stroke-width="3.5" marker-end="url(#ahO)" stroke-dasharray="8 6"/><line x1="140" y1="230" x2="140" y2="334" stroke="#8a6d0d" stroke-width="3.5" marker-end="url(#ahO)" stroke-dasharray="8 6"/><line x1="450" y1="230" x2="450" y2="334" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="462" y="286" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">studied under Malik</text><line x1="564" y1="388" x2="644" y2="388" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="605" y="376" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">student</text><line x1="140" y1="440" x2="140" y2="524" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="340" y="510" width="530" height="129" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="360" y="543.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Key</text><text x="360" y="570" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Solid arrow: teacher to student, as the lesson states</text><text x="360" y="595" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Dashed arrow: traditions report that Abu Hanifa and Malik</text><text x="360" y="615" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">learned from Ja’far al-Sadiq</text>
</svg>