<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 442" width="900" height="442" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="442" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How a ruling reaches an ordinary Muslim</text>

<text x="450" y="124" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">The Hadith of Mu’adh ibn Jabal (RA), sent to Yemen as a judge (Abu Dawud)</text><rect x="30" y="150" width="246.66666666666666" height="86" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="153.33333333333331" y="183" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">FIRST</text><text x="153.33333333333331" y="210" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">The Book of Allah</text><line x1="282.66666666666663" y1="193" x2="320.66666666666663" y2="193" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="326.66666666666663" y="150" width="246.66666666666666" height="86" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="449.99999999999994" y="183" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">THEN</text><text x="449.99999999999994" y="210" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">The Sunnah</text><line x1="579.3333333333333" y1="193" x2="617.3333333333333" y2="193" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="623.3333333333333" y="150" width="246.66666666666666" height="86" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="746.6666666666666" y="183" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">THEN</text><text x="746.6666666666666" y="210" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">His own reasoning</text><rect x="30" y="254" width="253.33333333333334" height="158" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="287" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">QUALIFIED SCHOLAR</text><text x="50" y="313.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Ijtihad</text><text x="50" y="341.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Independent reasoning to</text><text x="50" y="362.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">work out a ruling from</text><text x="50" y="383.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the sources</text><line x1="289.33333333333337" y1="333" x2="317.33333333333337" y2="333" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="323.33333333333337" y="254" width="253.33333333333334" height="158" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="343.33333333333337" y="287" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">A SCHOOL (MADHHAB)</text><text x="343.33333333333337" y="313.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">A method and body</text><text x="343.33333333333337" y="338.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">of rulings</text><text x="343.33333333333337" y="366.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Agreed on fundamentals;</text><text x="343.33333333333337" y="387.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">differs on details</text><line x1="582.6666666666667" y1="333" x2="610.6666666666667" y2="333" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="616.6666666666667" y="254" width="253.33333333333334" height="158" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="636.6666666666667" y="287" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ORDINARY MUSLIM</text><text x="636.6666666666667" y="313.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Taqlid</text><text x="636.6666666666667" y="341.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Following the rulings of</text><text x="636.6666666666667" y="362.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">a qualified school or</text><text x="636.6666666666667" y="383.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">scholar</text>
</svg>