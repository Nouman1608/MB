<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" width="900" height="390" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="390" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why the schools developed</text>

<line x1="330" y1="175" x2="369.25" y2="212.05" stroke="#1e2a44" stroke-width="2.5"/><line x1="330" y1="299.5" x2="369.25" y2="255.625" stroke="#1e2a44" stroke-width="2.5"/><line x1="570" y1="164.5" x2="530.75" y2="208.375" stroke="#1e2a44" stroke-width="2.5"/><line x1="570" y1="299.5" x2="530.75" y2="255.625" stroke="#1e2a44" stroke-width="2.5"/><circle cx="450" cy="232" r="95" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="226.5" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Law schools</text><text x="450" y="251.5" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">form</text><g transform="translate(0,10.5)"><rect x="30" y="104" width="300" height="121" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="134.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Expansion</text><text x="46" y="162.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">From Spain to Central Asia: new</text><text x="46" y="183.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">questions on trade, land and</text><text x="46" y="204.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">government</text><rect x="30" y="239" width="300" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="269.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Scattered knowledge</text><text x="46" y="297.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Different Hadith known in</text><text x="46" y="318.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Madinah, Kufa or Damascus</text></g><g transform="translate(0,0)"><rect x="570" y="104" width="300" height="121" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="586" y="134.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Different methods</text><text x="586" y="162.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Some relied on Hadith and</text><text x="586" y="183.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Madinah’s practice; others used</text><text x="586" y="204.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">analogy more freely</text><rect x="570" y="239" width="300" height="121" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="586" y="269.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Need for order</text><text x="586" y="297.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Judges needed consistent</text><text x="586" y="318.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">rulings; students organised</text><text x="586" y="339.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">their teachers’ views</text></g>
</svg>