<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 655" width="900" height="655" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="655" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Adapting register</text>

<defs><linearGradient id="regGrad" x1="0" x2="1"><stop offset="0" stop-color="#b5d3cf"/><stop offset="1" stop-color="#f2e7b8"/></linearGradient></defs><rect x="30" y="112" width="840" height="34" rx="17" fill="url(#regGrad)" stroke="#1e2a44" stroke-width="2.5"/><text x="50" y="135" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">more formal</text><text x="850" y="135" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">more informal</text><rect x="30" y="166" width="268" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="30" y="166" width="268" height="52" rx="14" fill="#b5d3cf" stroke="#c9d6d4" stroke-width="2.5"/><text x="164" y="200" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Formal</text><circle cx="56" cy="250" r="5" fill="#2e6b62"/><text x="72" y="256" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">no contractions or slang</text><circle cx="56" cy="286" r="5" fill="#2e6b62"/><text x="72" y="292" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">precise vocabulary</text><circle cx="56" cy="322" r="5" fill="#2e6b62"/><text x="72" y="328" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">complex sentences</text><circle cx="56" cy="358" r="5" fill="#2e6b62"/><text x="72" y="364" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">polite tone</text><rect x="316" y="166" width="268" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="316" y="166" width="268" height="52" rx="14" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="200" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Semi-formal</text><circle cx="342" cy="250" r="5" fill="#2e6b62"/><text x="358" y="256" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">some contractions</text><circle cx="342" cy="286" r="5" fill="#2e6b62"/><text x="358" y="292" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">friendly but respectful</text><circle cx="342" cy="322" r="5" fill="#2e6b62"/><text x="358" y="328" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">rhetorical questions</text><rect x="602" y="166" width="268" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="602" y="166" width="268" height="52" rx="14" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2.5"/><text x="736" y="200" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Informal</text><circle cx="628" cy="250" r="5" fill="#2e6b62"/><text x="644" y="256" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">conversational phrases</text><circle cx="628" cy="286" r="5" fill="#2e6b62"/><text x="644" y="292" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">humour</text><circle cx="628" cy="322" r="5" fill="#2e6b62"/><text x="644" y="328" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">still accurate spelling</text><text x="644" y="352" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">and punctuation</text><rect x="30" y="436" width="840" height="190" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="55" y="474" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Mixed audiences</text><text x="55" y="506" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Choose the register for the reader with most authority,</text><text x="55" y="530" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">and keep it consistent. Address the others directly in places:</text><rect x="55" y="552" width="790" height="54" rx="12" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="586" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">“Parents may worry that…; students, I know you are thinking…”</text>
</svg>