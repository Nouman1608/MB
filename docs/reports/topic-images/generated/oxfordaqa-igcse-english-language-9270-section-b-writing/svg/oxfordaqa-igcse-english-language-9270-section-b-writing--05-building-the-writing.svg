<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Building the writing</text>

<rect x="30" y="112" width="840" height="102" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="163" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="171.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="120" y="152" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Opening</text><text x="120" y="184" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Establish purpose and engage the audience in the first two sentences.</text><line x1="76" y1="190" x2="76" y2="226" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="230" width="840" height="102" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="281" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="289.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="120" y="270" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Paragraph per idea</text><rect x="120" y="284" width="146.79999999999998" height="36" rx="18" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="193.39999999999998" y="307.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">topic sentence</text><rect x="276.79999999999995" y="284" width="122.19999999999999" height="36" rx="18" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="337.9" y="307.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">development</text><rect x="408.99999999999994" y="284" width="89.39999999999999" height="36" rx="18" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="453.69999999999993" y="307.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">example</text><rect x="508.3999999999999" y="284" width="155" height="36" rx="18" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="585.8999999999999" y="307.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">link to purpose</text><line x1="76" y1="308" x2="76" y2="344" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="348" width="840" height="102" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="399" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="407.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="120" y="388" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Counter-argument</text><text x="120" y="420" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">When persuading or arguing: acknowledge it, then answer it.</text><line x1="76" y1="426" x2="76" y2="462" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="466" width="840" height="102" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="76" cy="517" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="76" y="525.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="120" y="506" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Ending</text><text x="850" y="506" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="end">match it to the purpose</text><rect x="120" y="520" width="146.79999999999998" height="36" rx="18" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="193.39999999999998" y="543.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">call to action</text><rect x="276.79999999999995" y="520" width="146.79999999999998" height="36" rx="18" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="350.19999999999993" y="543.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">recommendation</text><rect x="433.5999999999999" y="520" width="89.39999999999999" height="36" rx="18" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="478.2999999999999" y="543.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">summary</text><rect x="532.9999999999999" y="520" width="196" height="36" rx="18" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="630.9999999999999" y="543.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">memorable final line</text><text x="450" y="618" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Techniques to choose from</text><rect x="30" y="636" width="146.79999999999998" height="38" rx="19" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="103.39999999999999" y="660.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">direct address</text><rect x="186.79999999999998" y="636" width="179.6" height="38" rx="19" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="276.59999999999997" y="660.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">inclusive pronouns</text><rect x="376.4" y="636" width="196" height="38" rx="19" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="474.4" y="660.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">rhetorical questions</text><rect x="582.4" y="636" width="171.39999999999998" height="38" rx="19" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="668.0999999999999" y="660.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">the rule of three</text><rect x="763.8" y="636" width="97.6" height="38" rx="19" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="812.5999999999999" y="660.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">anecdote</text><rect x="30" y="686" width="97.6" height="38" rx="19" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="78.8" y="710.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">contrast</text><rect x="137.6" y="686" width="384.59999999999997" height="38" rx="19" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="329.9" y="710.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">expert or eyewitness views from the sources</text><rect x="532.1999999999999" y="686" width="286.2" height="38" rx="19" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="675.3" y="710.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">imperatives in a call to action</text>
