<rect width="900" height="785" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: a plan for the cycle-lanes speech</text>

<rect x="30" y="110" width="840" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="72" cy="152" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="72" y="159.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="112" y="144" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Greeting + hook</text><text x="112" y="172" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">“Good evening. How long did it take you to get here tonight?”</text><rect x="30" y="206" width="840" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="72" cy="248" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="72" y="255.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="112" y="240" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Problem</text><text x="112" y="268" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Traffic queues and unsafe roads.</text><rect x="574" y="220" width="276" height="32" rx="16" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="712" y="241.4" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">idea from the poster, reworked</text><rect x="30" y="302" width="840" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="72" cy="344" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="72" y="351.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="112" y="336" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Benefit for residents</text><text x="112" y="364" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Safer journeys for children.</text><rect x="639.6" y="316" width="210.39999999999998" height="32" rx="16" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="744.8" y="337.4" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">example from the story</text><rect x="30" y="398" width="840" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="72" cy="440" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="72" y="447.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="112" y="432" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Address business owners</text><text x="112" y="460" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Acknowledge the parking worry; answer it.</text><rect x="697" y="412" width="153" height="32" rx="16" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="773.5" y="433.4" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">second audience</text><rect x="30" y="494" width="840" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="72" cy="536" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="72" y="543.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="112" y="528" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Counter-argument</text><text x="112" y="556" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Answer “no one cycles in the rain” with a realistic example.</text><rect x="30" y="590" width="840" height="84" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="72" cy="632" r="22" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="72" y="639.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">6</text><text x="112" y="624" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Close</text><text x="112" y="652" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">“Safer streets, healthier families, busier shops. Fill in the consultation. Say yes.”</text><rect x="574" y="604" width="276" height="32" rx="16" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="712" y="625.4" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">rule of three + call to action</text><rect x="30" y="694" width="840" height="64" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="733" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Both audiences named, sources transformed, form features planned.</text>
</svg>