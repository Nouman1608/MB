<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 625" width="900" height="625" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="625" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Use the sources without copying</text>

<rect x="30" y="115" width="186" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="123" y="160" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="middle">Take</text><text x="123" y="192" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">ideas, not</text><text x="123" y="213" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">sentences</text><line x1="220" y1="180" x2="244" y2="180" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="248" y="115" width="186" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="341" y="160" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="middle">Select</text><text x="341" y="192" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">only what serves</text><text x="341" y="213" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">your purpose</text><line x1="438" y1="180" x2="462" y2="180" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="466" y="115" width="186" height="130" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="559" y="160" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="middle">Transform</text><text x="559" y="192" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">rework for your</text><text x="559" y="213" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">form</text><line x1="656" y1="180" x2="680" y2="180" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="684" y="115" width="186" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="777" y="160" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="middle">Add</text><text x="777" y="192" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">your own examples</text><text x="777" y="213" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">and reasoning</text><text x="450" y="295" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Transforming in practice</text><rect x="30" y="318" width="330" height="86" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="195" y="356" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">A statistic</text><text x="195" y="382" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">in a report</text><line x1="366" y1="361" x2="524" y2="361" stroke="#8a6d0d" stroke-width="4" marker-end="url(#ahO)"/><text x="445" y="350" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">becomes</text><rect x="540" y="318" width="330" height="86" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="705" y="356" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">A vivid example</text><text x="705" y="382" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">in a speech</text><rect x="30" y="422" width="330" height="86" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="195" y="460" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">A complaint</text><text x="195" y="486" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">in a blog</text><line x1="366" y1="465" x2="524" y2="465" stroke="#8a6d0d" stroke-width="4" marker-end="url(#ahO)"/><text x="445" y="454" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">becomes</text><rect x="540" y="422" width="330" height="86" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="705" y="460" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">A counter-argument</text><text x="705" y="486" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">that you answer</text><rect x="30" y="535" width="840" height="64" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="450" y="574" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">Copying from the sources shows reading, not writing skill.</text>
</svg>