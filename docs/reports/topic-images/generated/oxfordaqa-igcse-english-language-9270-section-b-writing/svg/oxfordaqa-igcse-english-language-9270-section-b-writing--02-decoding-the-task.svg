<rect width="900" height="740" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Decode the task: audience, form, purpose, content</text>

<rect x="30" y="110" width="840" height="92" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="55" y="145" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“Write a speech for a public meeting in which you persuade both residents and local</text><text x="55" y="171" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">business owners to support new cycle lanes.”</text><rect x="30" y="228" width="140" height="88" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="100" y="279" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Form</text><rect x="180" y="228" width="690" height="88" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="200" y="264" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start" font-style="italic">“Write a speech for a public meeting”</text><text x="200" y="294" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Greet the audience, direct address, signposting, strong close.</text><rect x="30" y="332" width="140" height="88" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="100" y="383" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Audience</text><rect x="180" y="332" width="690" height="88" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="200" y="368" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start" font-style="italic">“both residents and local business owners”</text><text x="200" y="398" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Two groups: respectful, semi-formal; address both by name.</text><rect x="30" y="436" width="140" height="88" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="100" y="487" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Purpose</text><rect x="180" y="436" width="690" height="88" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="200" y="472" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start" font-style="italic">“persuade”</text><text x="200" y="502" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Persuade, and also reassure business owners.</text><rect x="30" y="540" width="140" height="88" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="100" y="591" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Content</text><rect x="180" y="540" width="690" height="88" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="200" y="576" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start" font-style="italic">“to support new cycle lanes”</text><text x="200" y="606" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">What must be covered; ideas from the source pack, reworked.</text><rect x="30" y="652" width="840" height="62" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="690" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">“Multiple and diverse”: name each audience and each purpose in your plan.</text>
</svg>