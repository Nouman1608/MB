<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 648" width="900" height="648" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="648" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Two openings compared</text>

<text x="450" y="126" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Task: a letter to your head teacher arguing that students should help plan the school day</text><rect x="30" y="148" width="840" height="190" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="55" y="184" font-size="21" font-weight="700" fill="#b5602e" text-anchor="start">Weak</text><text x="55" y="218" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“Hi, I think students should plan the school day because it would be</text><text x="55" y="242" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">good and we would like it.”</text><rect x="55" y="270" width="269.79999999999995" height="38" rx="19" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="189.89999999999998" y="294.76" font-size="16" font-weight="600" fill="#b5602e" text-anchor="middle">too informal for the audience</text><rect x="334.79999999999995" y="270" width="138.6" height="38" rx="19" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="404.09999999999997" y="294.76" font-size="16" font-weight="600" fill="#b5602e" text-anchor="middle">vague reasons</text><rect x="483.4" y="270" width="130.39999999999998" height="38" rx="19" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="548.5999999999999" y="294.76" font-size="16" font-weight="600" fill="#b5602e" text-anchor="middle">no structure</text><rect x="30" y="358" width="840" height="262" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="55" y="394" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="start">Strong</text><text x="55" y="428" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“Dear Mrs Okafor, I am writing on behalf of the Student Council to propose that</text><text x="55" y="452" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">students play a part in planning the school day. We believe this would improve</text><text x="55" y="476" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">attendance, motivation and the relationship between staff and students, and we would</text><text x="55" y="500" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">welcome the chance to discuss it with you.”</text><rect x="55" y="556" width="187.79999999999998" height="38" rx="19" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="148.89999999999998" y="580.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">correct letter form</text><rect x="252.79999999999998" y="556" width="155" height="38" rx="19" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="330.29999999999995" y="580.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">formal register</text><rect x="417.79999999999995" y="556" width="155" height="38" rx="19" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="495.29999999999995" y="580.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">a clear purpose</text><rect x="582.8" y="556" width="236.99999999999997" height="38" rx="19" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="701.3" y="580.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">a preview of three points</text>
</svg>