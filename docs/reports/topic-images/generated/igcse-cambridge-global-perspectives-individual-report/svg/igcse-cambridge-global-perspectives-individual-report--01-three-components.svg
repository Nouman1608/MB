<rect width="900" height="458" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Where the Individual Report fits</text>

<rect x="30" y="104" width="268" height="160" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="137" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">COMPONENT 1</text><text x="50" y="164.8" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Written Exam</text><text x="50" y="195.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Assesses research,</text><text x="50" y="217.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">analysis and evaluation</text><text x="50" y="239.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">only.</text><rect x="316" y="104" width="268" height="160" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="336" y="137" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">COMPONENT 2</text><text x="336" y="164.8" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Individual Report</text><text x="336" y="195.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Research, analysis,</text><text x="336" y="217.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">evaluation, reflection and</text><text x="336" y="239.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">communication.</text><rect x="602" y="104" width="268" height="160" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="622" y="137" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">COMPONENT 3</text><text x="622" y="164.8" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Team Project</text><text x="622" y="195.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Where collaboration is</text><text x="622" y="217.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">assessed.</text><text x="450" y="308" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="middle">Component 2 at a glance</text><rect x="30" y="328" width="199.5" height="100" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="129.75" y="358.8" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">30%</text><text x="129.75" y="388.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">of the qualification</text><rect x="243.5" y="328" width="199.5" height="100" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="343.25" y="358.8" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">60 marks</text><text x="343.25" y="388.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">level-based mark</text><text x="343.25" y="409.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">scheme</text><rect x="457" y="328" width="199.5" height="100" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="556.75" y="358.8" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">1500–2000</text><text x="556.75" y="388.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">words, excluding</text><text x="556.75" y="409.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">references</text><rect x="670.5" y="328" width="199.5" height="100" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="770.25" y="358.8" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Internally set</text><text x="770.25" y="388.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">externally marked by</text><text x="770.25" y="409.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Cambridge</text>
</svg>