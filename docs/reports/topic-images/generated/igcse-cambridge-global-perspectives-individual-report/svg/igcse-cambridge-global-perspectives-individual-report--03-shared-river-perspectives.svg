<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 806" width="900" height="806" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="806" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">One question, competing perspectives</text>

<rect x="30" y="104" width="840" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="137" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">RESEARCH QUESTION</text><text x="50" y="164" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">“Should upstream and downstream countries share responsibility</text><text x="50" y="190" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">equally for managing a shared river’s water supply?”</text><rect x="30" y="234" width="840" height="130" rx="14" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2.5"/><line x1="450" y1="240" x2="450" y2="358" stroke="#1e2a44" stroke-width="3" stroke-dasharray="10 7"/><text x="462" y="352" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">border</text><path d="M50,312 C200,284 300,334 450,310 S700,286 850,314" fill="none" stroke="#2b5a9a" stroke-width="14" stroke-linecap="round"/><text x="60" y="268" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">UPSTREAM COUNTRY</text><text x="840" y="268" font-size="18" font-weight="700" fill="#b5602e" text-anchor="end">DOWNSTREAM COUNTRY</text><line x1="150" y1="346" x2="290" y2="346" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="140" y="352" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="end">river flow</text><rect x="30" y="382" width="405" height="90" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="418" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Upstream government</text><text x="50" y="447.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Prioritises its own agriculture.</text><rect x="465" y="382" width="405" height="90" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="485" y="418" font-size="20" font-weight="700" fill="#b5602e" text-anchor="start">Downstream government</text><text x="485" y="447.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Faces water shortages.</text><rect x="30" y="490" width="840" height="86" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="525.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Research, compare and evaluate both perspectives, then propose one course</text><text x="450" y="550.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">of action</text><text x="450" y="610" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">Possible courses of action to weigh</text><rect x="30" y="632" width="405" height="60" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="232.5" y="666.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Joint water-sharing treaty</text><rect x="465" y="632" width="405" height="60" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="667.5" y="666.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Independent monitoring body</text><rect x="30" y="718" width="840" height="58" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="751.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Explain realistically what putting the chosen action in place would involve.</text>
</svg>