<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 756" width="900" height="756" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="756" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">From a topic to a research question</text>

<rect x="30" y="104" width="840" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="140" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Topic</text><text x="450" y="169.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">Choose one topic from the syllabus topic list.</text><line x1="450" y1="198" x2="450" y2="230" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="80" y="234" width="740" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="270" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Context</text><text x="450" y="299.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">Explore the background of the chosen topic.</text><line x1="450" y1="328" x2="450" y2="360" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="130" y="364" width="640" height="112" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="400" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Global issue</text><text x="450" y="429.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">Pick an issue with present-day impact: an ethical dilemma, conflict,</text><text x="450" y="451.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">damage, hardship, or a split in opinion.</text><line x1="450" y1="480" x2="450" y2="512" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="180" y="516" width="540" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="552" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Research question</text><text x="450" y="581.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">A global question with scope for a range of perspectives.</text><text x="450" y="603.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">It becomes the report title.</text><rect x="30" y="646" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="679.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The teacher can guide whether the question is feasible, but the candidate devises the</text><text x="50" y="701.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">question and title.</text>
</svg>