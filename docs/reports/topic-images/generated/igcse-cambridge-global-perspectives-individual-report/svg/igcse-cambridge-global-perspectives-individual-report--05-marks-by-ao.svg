<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Where the 60 marks come from</text>

<rect x="28" y="102" width="844" height="74" rx="6" fill="none" stroke="#1e2a44" stroke-width="3"/><rect x="30" y="104" width="560" height="70" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="310" y="147" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">AO1  40 marks</text><rect x="590" y="104" width="70" height="70" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><rect x="660" y="104" width="210" height="70" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="765" y="147" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">AO3  15</text><text x="625" y="196" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">AO2  5</text><rect x="30" y="220" width="520" height="197" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="255.2" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">AO1 (40 marks)</text><text x="50" y="284.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="284.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">The global issue</text><text x="50" y="311.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="311.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Causes and consequences</text><text x="50" y="338.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="338.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Perspectives</text><text x="50" y="365.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="365.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Courses of action</text><text x="50" y="392.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="392.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Evaluation of evidence and sources</text><rect x="570" y="220" width="300" height="89" rx="14" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="590" y="255.2" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="start">AO2 (5 marks)</text><text x="590" y="284.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="606.15" y="284.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Reflection</text><rect x="570" y="323" width="300" height="116" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="590" y="358.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">AO3 Communication (15)</text><text x="590" y="387.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="606.15" y="387.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Structure and clarity</text><text x="590" y="414.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="606.15" y="414.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Referencing</text><rect x="30" y="457" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="490.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Eight level-based tables in Cambridge’s specimen mark scheme. They are not printed in the</text><text x="50" y="512.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">syllabus.</text>
