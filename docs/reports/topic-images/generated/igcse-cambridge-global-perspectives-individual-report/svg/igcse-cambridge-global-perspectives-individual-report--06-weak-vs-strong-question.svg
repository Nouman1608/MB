<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="900" height="550" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="550" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A topic title is not a research question</text>

<rect x="30" y="104" width="410" height="160" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="137" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">TOO BROAD</text><text x="50" y="167.2" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="start">“Climate change”</text><text x="50" y="199.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">A topic on its own: no place, no issue, no</text><text x="50" y="221.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">built-in perspectives.</text><rect x="460" y="104" width="410" height="160" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="480" y="137" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">RESEARCHABLE</text><text x="480" y="163.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">“To what extent should [named</text><text x="480" y="188.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">country] restrict [named</text><text x="480" y="213.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">industry] to protect [named</text><text x="480" y="238.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">resource]?”</text><rect x="30" y="282" width="840" height="52" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="315" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">Names a specific place</text><path d="M79,297 l22,22 m0,-22 l-22,22" fill="none" stroke="#b5602e" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><path d="M797,308 l9,10 l17,-20" fill="none" stroke="#2e6b62" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><rect x="30" y="344" width="840" height="52" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="377" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">Names a specific issue</text><path d="M79,359 l22,22 m0,-22 l-22,22" fill="none" stroke="#b5602e" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><path d="M797,370 l9,10 l17,-20" fill="none" stroke="#2e6b62" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><rect x="30" y="406" width="840" height="52" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="439" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">Room for more than one perspective</text><path d="M79,421 l22,22 m0,-22 l-22,22" fill="none" stroke="#b5602e" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><path d="M797,432 l9,10 l17,-20" fill="none" stroke="#2e6b62" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><rect x="30" y="468" width="840" height="52" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="501" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">Enough structure for 1500–2000 words</text><path d="M79,483 l22,22 m0,-22 l-22,22" fill="none" stroke="#b5602e" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><path d="M797,494 l9,10 l17,-20" fill="none" stroke="#2e6b62" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" />
</svg>