<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 672" width="900" height="672" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="672" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Building the report in the recommended order</text>

<line x1="62" y1="124" x2="62" y2="524" stroke="#c9d6d4" stroke-width="4"/><rect x="108" y="104" width="762" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="140" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Explain the issue and its perspectives</text><text x="128" y="169.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Local and/or national perspectives alongside global ones, and why they differ.</text><circle cx="62" cy="149" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="157.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="108" y="206" width="762" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="242" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Analyse causes and consequences</text><text x="128" y="271.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Why people disagree, and what the issue leads to.</text><circle cx="62" cy="251" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="259.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="108" y="308" width="762" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="128" y="344" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Evaluate possible courses of action</text><text x="128" y="373.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Weigh several options, then propose and justify one, with how it could be</text><text x="128" y="395.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">implemented and its impact.</text><circle cx="62" cy="364" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="62" y="372.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="108" y="432" width="762" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="468" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Reflect and conclude</text><text x="128" y="497.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Give your own view, reflect on findings, learning and others’ perspectives, then</text><text x="128" y="519.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">answer the research question directly.</text><circle cx="62" cy="488" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="496.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="30" y="562" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="595.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">No exact order is required, but this sequence maps onto the marking criteria, and structure</text><text x="50" y="617.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">and clarity are marked in their own right.</text>
</svg>