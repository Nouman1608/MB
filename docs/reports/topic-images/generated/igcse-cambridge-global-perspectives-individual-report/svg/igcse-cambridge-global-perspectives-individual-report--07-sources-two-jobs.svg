<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 573" width="900" height="573" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="573" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Every source does two separate jobs</text>

<rect x="310" y="104" width="280" height="64" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="140.8" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">A source you use</text><path d="M450,168 L450,192 M450,192 L240,192 L240,220 M450,192 L660,192 L660,220" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><line x1="240" y1="206" x2="240" y2="224" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="660" y1="206" x2="660" y2="224" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="228" width="400" height="217" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="261" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">AO1 EVALUATION</text><text x="50" y="288" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Judge the source</text><text x="50" y="317.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="317.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Explain its value to the research.</text><text x="50" y="344.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="344.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Is it reliable?</text><text x="50" y="371.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="371.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Is it credible?</text><rect x="470" y="228" width="400" height="217" rx="14" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="490" y="261" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">AO3 COMMUNICATION</text><text x="490" y="288" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Reference the source</text><text x="490" y="317.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="506.15" y="317.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Cite every source used.</text><text x="490" y="344.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="506.15" y="344.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Complete and consistent.</text><text x="490" y="371.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="506.15" y="371.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Clearly linked to the text.</text><text x="490" y="398.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="506.15" y="398.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">No single required style: pick one and</text><text x="506.15" y="420.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">apply it consistently.</text><rect x="30" y="463" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="496.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Tip: keep a running reference list from the first source you read, rather than rebuilding</text><text x="50" y="518.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">it at the end.</text>
</svg>