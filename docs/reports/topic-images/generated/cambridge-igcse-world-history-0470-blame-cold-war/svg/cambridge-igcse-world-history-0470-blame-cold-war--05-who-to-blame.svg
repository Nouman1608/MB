<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 579" width="900" height="579" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="579" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Who was more to blame?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Evidence on both sides, and a way to judge</text>
<polygon points="450,164 416,234 484,234" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><line x1="210" y1="198" x2="690" y2="130" stroke="#1e2a44" stroke-width="7" stroke-linecap="round"/><circle cx="450" cy="164" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><line x1="210" y1="198" x2="210" y2="238" stroke="#1e2a44" stroke-width="3"/><rect x="30" y="238" width="360" height="176" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="46" y="268.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Case against the USSR</text><text x="46" y="297.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="61.2" y="297.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Broke the Yalta promise of free elections</text><text x="46" y="322.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="61.2" y="322.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Control by force, fraud and terror</text><text x="46" y="347.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="61.2" y="347.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Ideology of spreading revolution</text><text x="46" y="372.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="61.2" y="372.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Berlin Blockade: about two million</text><text x="61.2" y="393.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">civilians threatened</text><line x1="690" y1="130" x2="690" y2="170" stroke="#1e2a44" stroke-width="3"/><rect x="510" y="170" width="360" height="218" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="526" y="200.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Case against the USA</text><text x="526" y="229.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="541.2" y="229.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Atomic monopoly made Stalin feel</text><text x="541.2" y="250.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">threatened</text><text x="526" y="275.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="541.2" y="275.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Truman's hard line reversed Roosevelt's</text><text x="541.2" y="296.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">approach</text><text x="526" y="321.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="541.2" y="321.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Marshall Plan as economic pressure</text><text x="526" y="346.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="541.2" y="346.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Bizonia and currency reform broke</text><text x="541.2" y="367.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">four-power control</text><rect x="30" y="436" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="470.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Intentions or actions?</text><text x="50" y="500.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Stalin may have acted from <tspan font-weight="700" fill="#1e2a44">security</tspan> <tspan font-weight="700" fill="#1e2a44">fears</tspan>, but his <tspan font-weight="700" fill="#1e2a44">methods</tspan> in Eastern Europe convinced the West</text><text x="50" y="522.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">he intended expansion.</text>
</svg>