<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 579" width="900" height="579" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="579" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Yalta and Potsdam compared</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Changed leaders, growing disputes and a new weapon</text>
<clipPath id="tc124"><rect x="30" y="124" width="840" height="312" rx="14"/></clipPath><g clip-path="url(#tc124)"><rect x="30" y="124" width="168" height="48" fill="#b5d3cf"/><rect x="198" y="124" width="336" height="48" fill="#dce9e7"/><text x="212" y="151.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Yalta, February 1945</text><rect x="534" y="124" width="336" height="48" fill="#f2e7b8"/><text x="548" y="151.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Potsdam, July-August 1945</text><rect x="30" y="172" width="168" height="66" fill="#dce9e7"/><text x="44" y="198" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Leaders</text><rect x="198" y="172" width="336" height="66" fill="#ffffff"/><text x="212" y="198" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Roosevelt, Churchill, Stalin</text><rect x="534" y="172" width="336" height="66" fill="#ffffff"/><text x="548" y="198" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Truman (Roosevelt died in April), Attlee</text><text x="548" y="218" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">replaced Churchill, Stalin</text><line x1="30" y1="238" x2="870" y2="238" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="238" width="168" height="66" fill="#dce9e7"/><text x="44" y="264" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Agreed</text><rect x="198" y="238" width="336" height="66" fill="#f8faf9"/><text x="212" y="264" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Germany and Berlin in zones; USSR to fight</text><text x="212" y="284" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Japan; a United Nations</text><rect x="534" y="238" width="336" height="66" fill="#f8faf9"/><text x="548" y="264" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Four zones confirmed; demilitarise and</text><text x="548" y="284" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">denazify; Oder-Neisse line for now</text><line x1="30" y1="304" x2="870" y2="304" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="304" width="168" height="66" fill="#dce9e7"/><text x="44" y="330" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Poland</text><rect x="198" y="304" width="336" height="66" fill="#ffffff"/><text x="212" y="330" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Government broadened; free elections</text><text x="212" y="350" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">promised</text><rect x="534" y="304" width="336" height="66" fill="#ffffff"/><text x="548" y="330" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Lublin Poles already in control</text><line x1="30" y1="370" x2="870" y2="370" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="370" width="168" height="66" fill="#dce9e7"/><text x="44" y="396" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Disputed</text><rect x="198" y="370" width="336" height="66" fill="#f8ebe2"/><text x="212" y="396" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Vague Polish deal, read differently by each</text><text x="212" y="416" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">side</text><rect x="534" y="370" width="336" height="66" fill="#f8ebe2"/><text x="548" y="396" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Reparations: each power mainly from its</text><text x="548" y="416" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">own zone; Truman's new weapon</text></g><line x1="198" y1="124" x2="198" y2="436" stroke="#c9d6d4" stroke-width="1.5"/><line x1="534" y1="124" x2="534" y2="436" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="124" width="840" height="312" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="458" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="492.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Watch the names</text><text x="450" y="522.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Truman was <tspan font-weight="700" fill="#1e2a44">not</tspan> at Yalta; Roosevelt was <tspan font-weight="700" fill="#1e2a44">not</tspan> at Potsdam.</text>
</svg>