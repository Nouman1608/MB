<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 477" width="900" height="477" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="477" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Planning a (c) answer</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">"The USSR was more to blame than the USA." How far do you agree? [10]</text>
<rect x="130" y="124" width="740" height="99" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="145" y="153.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Agree</text><text x="145" y="182.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Soviet takeover broke the Declaration on Liberated Europe; the Czech coup (1948) and the</text><text x="145" y="203.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Berlin Blockade looked like aggression</text><circle cx="62" cy="173.5" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="62" y="182.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="746.205" y="136" width="108.795" height="29" rx="14.5" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="800.6025000000001" y="155.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">stated view</text><rect x="130" y="235" width="740" height="99" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="145" y="264.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Disagree</text><text x="145" y="293.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Truman Doctrine and Marshall Plan divided Europe; currency reform provoked the blockade;</text><text x="145" y="314.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">real Soviet security fears after two invasions</text><circle cx="62" cy="284.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="293.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="757.515" y="247" width="97.485" height="29" rx="14.5" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="806.2574999999999" y="266.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">other side</text><rect x="130" y="346" width="740" height="99" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="145" y="375.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Judgement</text><text x="145" y="404.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Both acted defensively, but Stalin's methods were the first concrete breach of wartime</text><text x="145" y="425.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">agreements: the USSR carries more blame for starting it</text><circle cx="62" cy="395.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="404.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="768.87" y="358" width="86.13" height="29" rx="14.5" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="811.935" y="377.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">criterion</text>
</svg>