<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 732" width="900" height="732" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="732" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How the USSR took Eastern Europe</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">The Red Army was already there; the method was gradual</text>
<line x1="60" y1="144" x2="60" y2="380" stroke="#c9d6d4" stroke-width="4"/><rect x="104" y="124" width="766" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="156.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Coalition governments</text><text x="122" y="185.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Communists hold the key ministries, especially the interior ministry that ran the police</text><circle cx="60" cy="166" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="174.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="104" y="220" width="766" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="252.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Remove opponents "slice by slice"</text><text x="122" y="281.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Arrests, show trials, intimidation: Rákosi's salami tactics</text><circle cx="60" cy="262" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="270.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="104" y="316" width="766" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="348.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Rigged elections; "unity" parties</text><text x="122" y="377.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Socialists merged into communist-led parties</text><circle cx="60" cy="358" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="366.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><clipPath id="tc422"><rect x="30" y="422" width="840" height="278" rx="14"/></clipPath><g clip-path="url(#tc422)"><rect x="30" y="422" width="217.77777777777777" height="48" fill="#b5d3cf"/><text x="44" y="449.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Country</text><rect x="247.77777777777777" y="422" width="622.2222222222222" height="48" fill="#b5d3cf"/><text x="261.77777777777777" y="449.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">How control was secured</text><rect x="30" y="470" width="217.77777777777777" height="46" fill="#dce9e7"/><text x="44" y="496" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Poland</text><rect x="247.77777777777777" y="470" width="622.2222222222222" height="46" fill="#ffffff"/><text x="261.77777777777777" y="496" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Lublin Poles dominate; January 1947 elections rigged; Mikołajczyk flees</text><line x1="30" y1="516" x2="870" y2="516" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="516" width="217.77777777777777" height="46" fill="#dce9e7"/><text x="44" y="542" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Hungary</text><rect x="247.77777777777777" y="516" width="622.2222222222222" height="46" fill="#f8faf9"/><text x="261.77777777777777" y="542" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Smallholders win in 1945; police and salami tactics, takeover by 1947-49</text><line x1="30" y1="562" x2="870" y2="562" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="562" width="217.77777777777777" height="46" fill="#dce9e7"/><text x="44" y="588" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Romania, Bulgaria</text><rect x="247.77777777777777" y="562" width="622.2222222222222" height="46" fill="#ffffff"/><text x="261.77777777777777" y="588" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Communist-led from 1945-46; Romanian king abdicates (December 1947)</text><line x1="30" y1="608" x2="870" y2="608" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="608" width="217.77777777777777" height="46" fill="#dce9e7"/><text x="44" y="634" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Czechoslovakia</text><rect x="247.77777777777777" y="608" width="622.2222222222222" height="46" fill="#f8faf9"/><text x="261.77777777777777" y="634" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Takeover February 1948; Masaryk found dead (March 1948)</text><line x1="30" y1="654" x2="870" y2="654" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="654" width="217.77777777777777" height="46" fill="#dce9e7"/><text x="44" y="680" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Yugoslavia</text><rect x="247.77777777777777" y="654" width="622.2222222222222" height="46" fill="#ffffff"/><text x="261.77777777777777" y="680" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Communist under Tito but independent; expelled from Cominform (1948)</text></g><line x1="247.77777777777777" y1="422" x2="247.77777777777777" y2="700" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="422" width="840" height="278" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/>
</svg>