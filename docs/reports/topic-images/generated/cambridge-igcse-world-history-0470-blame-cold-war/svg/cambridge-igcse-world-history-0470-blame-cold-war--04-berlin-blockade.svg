<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 614" width="900" height="614" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="614" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The Berlin Blockade: causes and consequences</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">June 1948 to May 1949</text>
<rect x="30" y="124" width="270.6666666666667" height="114" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="45" y="152.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Different aims</text><text x="45" y="179" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">USSR: reparations, a weak</text><text x="45" y="199" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Germany. West: German</text><text x="45" y="219" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">recovery</text><rect x="314.6666666666667" y="124" width="270.6666666666667" height="114" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="329.6666666666667" y="172.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Bizonia (1947)</text><text x="329.6666666666667" y="199" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">British and US zones merged</text><rect x="599.3333333333334" y="124" width="270.6666666666667" height="114" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="614.3333333333334" y="162.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Deutschmark (June 1948)</text><text x="614.3333333333334" y="189" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">New currency without Soviet</text><text x="614.3333333333334" y="209" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">agreement</text><line x1="165" y1="246" x2="364.5" y2="282" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="450" y1="246" x2="450" y2="282" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="735" y1="246" x2="535.5" y2="282" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="150" y="306" width="600" height="114" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="338" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">24 JUNE 1948 - 12 MAY 1949</text><text x="450" y="366.38" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Blockade and Airlift</text><text x="450" y="395.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Road, rail and canal links cut; food and fuel flown in for almost a year</text><line x1="364.5" y1="428" x2="165" y2="464" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="450" y1="428" x2="450" y2="464" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="535.5" y1="428" x2="735" y2="464" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="488" width="270.6666666666667" height="94" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="45" y="526.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Propaganda defeat for Stalin</text><text x="45" y="553" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">The USA would stay in Europe</text><rect x="314.6666666666667" y="488" width="270.6666666666667" height="94" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="329.6666666666667" y="516.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Two Germanys</text><text x="329.6666666666667" y="543" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">FRG (May 1949); GDR (October</text><text x="329.6666666666667" y="563" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">1949)</text><rect x="599.3333333333334" y="488" width="270.6666666666667" height="94" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="614.3333333333334" y="516.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">NATO (April 1949)</text><text x="614.3333333333334" y="543" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">An attack on one is an attack on</text><text x="614.3333333333334" y="563" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">all; Warsaw Pact followed in 1955</text>
</svg>