<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 698" width="900" height="698" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="698" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why use a named constant?</text>

<rect x="30" y="110" width="411" height="400" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="54" y="148" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">Literal values scattered through code</text><rect x="54" y="270" width="363" height="50" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="70" y="302" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">… price * 0.2 …</text><rect x="54" y="336" width="363" height="50" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="70" y="368" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">… cost * 0.2 …</text><rect x="54" y="402" width="363" height="50" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="70" y="434" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">… fee * 0.2 …</text><text x="235" y="488" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">What is 0.2? Change it in every place.</text><rect x="459" y="110" width="411" height="400" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="483" y="148" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">A named constant</text><rect x="483" y="168" width="363" height="56" rx="10" fill="#1e2a44" stroke="#1e2a44" stroke-width="2.5"/><text x="664" y="204" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="19" font-weight="700" fill="#d4b02e" text-anchor="middle">CONSTANT VatRate ← 0.2</text><rect x="483" y="270" width="363" height="50" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="499" y="302" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">… price * VatRate …</text><path d="M839,196 L855,196 L855,295 L848,295" fill="none" stroke="#2e6b62" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="483" y="336" width="363" height="50" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="499" y="368" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">… cost * VatRate …</text><path d="M839,196 L855,196 L855,361 L848,361" fill="none" stroke="#2e6b62" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="483" y="402" width="363" height="50" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="499" y="434" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">… fee * VatRate …</text><path d="M839,196 L855,196 L855,427 L848,427" fill="none" stroke="#2e6b62" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><text x="664" y="488" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">Edit one declaration; nothing missed.</text><rect x="30" y="534" width="268" height="134" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="567" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ONE CHANGE, EVERYWHERE</text><text x="50" y="594.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Edit one line</text><text x="50" y="622.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">no hunting for every 0.2</text><rect x="316" y="534" width="268" height="134" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="336" y="567" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">READABILITY</text><text x="336" y="594.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">price * VatRate</text><text x="336" y="622.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">explains what the number is</text><rect x="602" y="534" width="268" height="134" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="622" y="567" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SAFETY</text><text x="622" y="594.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Cannot be reassigned</text><text x="622" y="622.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">not changed by accident</text><text x="622" y="643.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">while running</text>
</svg>