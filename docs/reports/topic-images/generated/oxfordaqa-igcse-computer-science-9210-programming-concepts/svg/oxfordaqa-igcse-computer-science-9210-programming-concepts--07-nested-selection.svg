<rect width="900" height="687" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Nested selection</text>

<path d="M300,120 L410,170 L300,220 L190,170 Z" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><text x="300" y="176" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">age ≥ 18?</text><path d="M410,170 L600,170 L600,300" fill="none" stroke="#b5602e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahR)"/><text x="450" y="158" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">False</text><rect x="500" y="304" width="200" height="52" rx="10" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="600" y="336" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">OUTPUT "Too young"</text><line x1="300" y1="220" x2="300" y2="272" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><text x="330" y="252" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">True</text><path d="M300,280 L410,330 L300,380 L190,330 Z" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><text x="300" y="336" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">hasTicket?</text><text x="150" y="336" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="end">inner IF</text><path d="M190,330 L130,330" fill="none" stroke="#1e2a44" stroke-width="0" stroke-linejoin="round" stroke-linecap="round" /><line x1="240" y1="362" x2="180" y2="430" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><text x="188" y="392" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">True</text><line x1="360" y1="362" x2="420" y2="430" stroke="#b5602e" stroke-width="3.5" marker-end="url(#ahR)"/><text x="416" y="392" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">False</text><rect x="80" y="434" width="180" height="52" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="170" y="466" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">OUTPUT "Enter"</text><rect x="310" y="434" width="240" height="52" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="430" y="466" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">OUTPUT "Buy a ticket"</text><rect x="30" y="520" width="411" height="137" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="553" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">age ← 20, hasTicket ← False</text><text x="50" y="581.8" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Buy a ticket</text><text x="50" y="611.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">outer True, inner False</text><rect x="459" y="520" width="411" height="137" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="479" y="553" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">age ← 15, hasTicket ← True</text><text x="479" y="581.8" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Too young</text><text x="479" y="611.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">inner IF never reached, so the ticket does not</text><text x="479" y="632.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">matter</text>
</svg>