<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Where the condition sits matters</text>

<rect x="30" y="110" width="411" height="534" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="235" y="148" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Condition at the start</text><rect x="54" y="166" width="363" height="176" rx="12" fill="#1e2a44"/><text x="72" y="196" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="18" font-weight="400" fill="#e8eef0" text-anchor="start">n ← 10</text><text x="72" y="226" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="18" font-weight="400" fill="#e8eef0" text-anchor="start">WHILE n &lt; 5</text><text x="93.6" y="256" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="18" font-weight="400" fill="#e8eef0" text-anchor="start">n ← n + 1</text><text x="72" y="286" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="18" font-weight="400" fill="#e8eef0" text-anchor="start">ENDWHILE</text><text x="72" y="316" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="18" font-weight="400" fill="#e8eef0" text-anchor="start">OUTPUT n</text><circle cx="76" cy="384" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="389.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="104" y="380" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">n ← 10</text><text x="104" y="404" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">store 10</text><circle cx="76" cy="444" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="449.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="104" y="440" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">n &lt; 5 is False</text><text x="104" y="464" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">body skipped</text><circle cx="76" cy="504" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="509.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="104" y="500" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">OUTPUT n</text><text x="104" y="524" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">n is still 10</text><rect x="54" y="554" width="363" height="70" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="74" y="582" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">Output</text><text x="74" y="612" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="start">10</text><text x="397" y="606" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="end">body ran 0 times</text><rect x="459" y="110" width="411" height="534" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="664" y="148" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Condition at the end</text><rect x="483" y="166" width="363" height="176" rx="12" fill="#1e2a44"/><text x="501" y="196" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="18" font-weight="400" fill="#e8eef0" text-anchor="start">n ← 10</text><text x="501" y="226" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="18" font-weight="400" fill="#e8eef0" text-anchor="start">REPEAT</text><text x="522.6" y="256" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="18" font-weight="400" fill="#e8eef0" text-anchor="start">n ← n + 1</text><text x="501" y="286" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="18" font-weight="400" fill="#e8eef0" text-anchor="start">UNTIL n ≥ 5</text><text x="501" y="316" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="18" font-weight="400" fill="#e8eef0" text-anchor="start">OUTPUT n</text><circle cx="505" cy="384" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="505" y="389.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="533" y="380" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">n ← n + 1</text><text x="533" y="404" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">body runs first: n is 11</text><circle cx="505" cy="444" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="505" y="449.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="533" y="440" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">n ≥ 5 is True</text><text x="533" y="464" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">stop repeating</text><circle cx="505" cy="504" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="505" y="509.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="533" y="500" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">OUTPUT n</text><text x="533" y="524" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">n is 11</text><rect x="483" y="554" width="363" height="70" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="503" y="582" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">Output</text><text x="503" y="612" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="start">11</text><text x="826" y="606" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="end">body ran once</text><rect x="30" y="660" width="840" height="64" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="700" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">WHILE repeats while its condition is True; UNTIL repeats until its condition becomes True.</text>
</svg>