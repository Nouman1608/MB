<rect width="900" height="658" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Tracing nested loops</text>

<rect x="30" y="110" width="420" height="266" rx="12" fill="#1e2a44"/><text x="48" y="140" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="17" font-weight="400" fill="#e8eef0" text-anchor="start">CONSTANT MaxRows ← 3</text><text x="48" y="170" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="17" font-weight="400" fill="#e8eef0" text-anchor="start">FOR row ← 1 TO MaxRows</text><text x="68.4" y="200" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="17" font-weight="700" fill="#d4b02e" text-anchor="start">line ← ""</text><text x="68.4" y="230" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="17" font-weight="400" fill="#e8eef0" text-anchor="start">FOR col ← 1 TO row</text><text x="88.8" y="260" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="17" font-weight="400" fill="#e8eef0" text-anchor="start">line ← line + "*"</text><text x="68.4" y="290" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="17" font-weight="400" fill="#e8eef0" text-anchor="start">ENDFOR</text><text x="68.4" y="320" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="17" font-weight="400" fill="#e8eef0" text-anchor="start">OUTPUT line</text><text x="48" y="350" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="17" font-weight="400" fill="#e8eef0" text-anchor="start">ENDFOR</text><rect x="470" y="110" width="400" height="266" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="494" y="146" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">row</text><text x="560" y="146" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">inner loop: col</text><text x="770" y="146" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">output</text><text x="506" y="198" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="554" y="172" width="44" height="40" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="576" y="199" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="770" y="200" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="24" font-weight="700" fill="#8a6d0d" text-anchor="start">*</text><text x="506" y="256" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="554" y="230" width="44" height="40" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="576" y="257" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="606" y="230" width="44" height="40" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="628" y="257" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="770" y="258" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="24" font-weight="700" fill="#8a6d0d" text-anchor="start">**</text><text x="506" y="314" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="554" y="288" width="44" height="40" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="576" y="315" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="606" y="288" width="44" height="40" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="628" y="315" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="658" y="288" width="44" height="40" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="680" y="315" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="770" y="316" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="24" font-weight="700" fill="#8a6d0d" text-anchor="start">***</text><text x="494" y="362" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">inner loop runs 1 + 2 + 3 = 6 times</text><rect x="30" y="398" width="840" height="150" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="54" y="436" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">Bug: line ← "" moved above the outer loop</text><text x="54" y="464" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The line is never reset, so each row keeps the stars from before.</text><text x="720" y="446" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="24" font-weight="700" fill="#b5602e" text-anchor="start">*</text><text x="720" y="478" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="24" font-weight="700" fill="#b5602e" text-anchor="start">***</text><text x="720" y="510" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="24" font-weight="700" fill="#b5602e" text-anchor="start">******</text><text x="54" y="518" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Outputs * then *** then ******</text><rect x="30" y="568" width="840" height="60" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="606" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Change MaxRows to 5 and it draws five rows: no other line changes.</text>
</svg>