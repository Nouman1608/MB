<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="520" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Which loop?</text>

<rect x="30" y="110" width="268" height="300" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="30" y="110" width="268" height="90" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="164" y="152" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="22" font-weight="700" fill="#2e6b62" text-anchor="middle">FOR</text><text x="164" y="182" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">Definite</text><text x="50" y="236" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">The count is known when</text><text x="50" y="258" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">the loop starts</text><text x="50" y="320" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">e.g.</text><text x="50" y="344" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">process 30 students; run 10</text><text x="50" y="365" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">rounds</text><rect x="316" y="110" width="268" height="300" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="316" y="110" width="268" height="90" rx="14" fill="#dfe7f3" stroke="#2b5a9a" stroke-width="2.5"/><text x="450" y="152" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="22" font-weight="700" fill="#2b5a9a" text-anchor="middle">WHILE</text><text x="450" y="182" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">Indefinite, test at start</text><text x="336" y="236" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">The loop might not need to</text><text x="336" y="258" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">run at all</text><text x="336" y="320" font-size="15" font-weight="700" fill="#2b5a9a" text-anchor="start">e.g.</text><text x="336" y="344" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">keep reading while there is</text><text x="336" y="365" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">data</text><rect x="602" y="110" width="268" height="300" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="602" y="110" width="268" height="90" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="736" y="152" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="22" font-weight="700" fill="#8a6d0d" text-anchor="middle">REPEAT … UNTIL</text><text x="736" y="182" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">Indefinite, test at end</text><text x="622" y="236" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">The body must run once</text><text x="622" y="258" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">before you can test</text><text x="622" y="320" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">e.g.</text><text x="622" y="344" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">ask a question, then check</text><text x="622" y="365" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the answer</text><rect x="30" y="430" width="840" height="60" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="467" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Using FOR when the number of repetitions depends on user input is a common mistake.</text>
</svg>