<rect width="900" height="649" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Sequence, selection and iteration</text>

<rect x="30" y="110" width="268" height="380" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="164" y="148" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Sequence</text><text x="164" y="174" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">one statement after another</text><rect x="316" y="110" width="268" height="380" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="148" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Selection</text><text x="450" y="174" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">choose which block runs</text><rect x="602" y="110" width="268" height="380" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="736" y="148" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Iteration</text><text x="736" y="174" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">repeat a block</text><rect x="74" y="208" width="180" height="44" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="164" y="236" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">statement 1</text><line x1="164" y1="252" x2="164" y2="300" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="74" y="300" width="180" height="44" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="164" y="328" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">statement 2</text><line x1="164" y1="344" x2="164" y2="392" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="74" y="392" width="180" height="44" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="164" y="420" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">statement 3</text><path d="M450,195 L535,240 L450,285 L365,240 Z" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><text x="450" y="246" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">condition?</text><path d="M365,240 L366,240 L380,240 L380,320" fill="none" stroke="#2e6b62" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahT)"/><text x="358" y="230" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">True</text><path d="M535,240 L520,240 L520,320" fill="none" stroke="#b5602e" stroke-width="0" stroke-linejoin="round" stroke-linecap="round" /><path d="M535,240 L525,240" fill="none" stroke="#1e2a44" stroke-width="0" stroke-linejoin="round" stroke-linecap="round" /><path d="M520,262 L520,320" fill="none" stroke="#b5602e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahR)"/><text x="546" y="230" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">False</text><rect x="325" y="324" width="110" height="44" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="380" y="352" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">block A</text><rect x="465" y="324" width="110" height="44" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="520" y="352" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">block B</text><path d="M380,368 L380,400 L450,400 L450,426" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><path d="M520,368 L520,400 L450,400" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="450" y="454" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">then carry on</text><path d="M736,205 L821,250 L736,295 L651,250 Z" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><text x="736" y="256" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">repeat?</text><line x1="736" y1="295" x2="736" y2="340" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><text x="758" y="324" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">yes</text><rect x="661" y="344" width="150" height="44" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="736" y="372" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">loop body</text><path d="M661,366 L628,366 L628,198 L736,198 L736,202" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><path d="M821,250 L848,250 L848,440 L756,440" fill="none" stroke="#b5602e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahR)"/><text x="836" y="238" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">no</text><text x="706" y="446" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">carry on</text><rect x="30" y="510" width="268" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="543" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STORE</text><text x="50" y="569.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Declaration, constant,</text><text x="50" y="593.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">assignment</text><rect x="316" y="510" width="268" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="336" y="543" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CONTROL</text><text x="336" y="569.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Selection, iteration</text><rect x="602" y="510" width="268" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="622" y="543" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">REUSE</text><text x="622" y="569.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Subroutine call, e.g.</text><text x="622" y="593.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">ShowMenu()</text>
