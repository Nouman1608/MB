<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 519" width="900" height="519" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="519" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Chosen or embedded?</text>

<rect x="30" y="104" width="404" height="260" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,154 L31.25,118.25 Q31.25,105.25 44.25,105.25 L419.75,105.25 Q432.75,105.25 432.75,118.25 L432.75,154 Z" fill="#b5d3cf"/><line x1="31.25" y1="154" x2="432.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="232" y="134.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Individualisation</text><circle cx="53" cy="184.79" r="4.5" fill="#2e6b62"/><text x="66" y="190.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Ties of class, religion and kinship</text><text x="66" y="212.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">weaken; people design their own lives</text><circle cx="53" cy="236.79" r="4.5" fill="#2e6b62"/><text x="66" y="242.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Beck and Beck-Gernsheim (1995):</tspan></text><text x="66" y="264.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">relationships more chosen and more</text><text x="66" y="286.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">fragile</text><circle cx="53" cy="310.78999999999996" r="4.5" fill="#2e6b62"/><text x="66" y="316.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Giddens:</tspan> the pure relationship lasts</text><text x="66" y="338.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">while both find it satisfying</text><rect x="466" y="104" width="404" height="260" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M467.25,154 L467.25,118.25 Q467.25,105.25 480.25,105.25 L855.75,105.25 Q868.75,105.25 868.75,118.25 L868.75,154 Z" fill="#f2e7b8"/><line x1="467.25" y1="154" x2="868.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="668" y="134.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Smart (2007): personal life</text><circle cx="489" cy="184.79" r="4.5" fill="#8a6d0d"/><text x="502" y="190.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Overstates freedom: people stay</text><text x="502" y="212.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">embedded in relationships, memories and</text><text x="502" y="234.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">obligations</text><circle cx="489" cy="258.78999999999996" r="4.5" fill="#8a6d0d"/><text x="502" y="264.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Choices are made within histories and</text><text x="502" y="286.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">constraints</text><circle cx="489" cy="310.78999999999996" r="4.5" fill="#8a6d0d"/><text x="502" y="316.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Personal life covers friends,</text><text x="502" y="338.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">ex-partners, the dead and animals</text><circle cx="450" cy="234" r="24" fill="#1e2a44"/><text x="450" y="241" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">vs</text><rect x="30" y="382" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="418" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Stacey (1990): postmodern family</text><text x="56" y="447" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Silicon Valley women after divorce built new forms such as the divorce-extended family</text><text x="56" y="469" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">linking former in-laws: no single dominant form.</text>
</svg>