<rect width="900" height="511" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Families beyond the household</text>

<rect x="30" y="110" width="253.33333333333334" height="130" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="156.66666666666669" y="154.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Richer family abroad</text><text x="156.66666666666669" y="184.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">children cared for by the</text><text x="156.66666666666669" y="205.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">migrant woman</text><rect x="323.33333333333337" y="110" width="253.33333333333334" height="130" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450.00000000000006" y="154.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Migrant woman</text><text x="450.00000000000006" y="184.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">domestic or care work</text><text x="450.00000000000006" y="205.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">abroad; remittances home</text><rect x="616.6666666666667" y="110" width="253.33333333333334" height="130" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="743.3333333333334" y="142.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Her own children at</text><text x="743.3333333333334" y="166.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">home</text><text x="743.3333333333334" y="196.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">cared for by relatives or</text><text x="743.3333333333334" y="217.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">paid help</text><line x1="289" y1="175" x2="317" y2="175" stroke="#1e2a44" stroke-width="3.5" marker-start="url(#ah)"/><line x1="582" y1="175" x2="610" y2="175" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="450" y="268" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Hochschild: global care chains</text><rect x="30" y="290" width="412" height="195" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,340 L31.25,304.25 Q31.25,291.25 44.25,291.25 L427.75,291.25 Q440.75,291.25 440.75,304.25 L440.75,340 Z" fill="#dce9e7"/><line x1="31.25" y1="340" x2="440.75" y2="340" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="320.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Transnational families</text><text x="44" y="371.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Parreñas: Filipino mothers abroad</text><text x="44" y="398.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Family life across borders: shared decisions,</text><text x="44" y="419.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">money and care through calls, letters and</text><text x="44" y="440.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">remittances. Video calls help but do not</text><text x="44" y="461.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">remove emotional costs.</text><rect x="458" y="290" width="412" height="195" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,340 L459.25,304.25 Q459.25,291.25 472.25,291.25 L855.75,291.25 Q868.75,291.25 868.75,304.25 L868.75,340 Z" fill="#dce9e7"/><line x1="459.25" y1="340" x2="868.75" y2="340" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="320.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Friends and pets as family</text><text x="472" y="371.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Weeks; Pahl and Spencer (2006); Charles</text><text x="472" y="392.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">and Davies</text><text x="472" y="419.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Families of choice; personal communities</text><text x="472" y="440.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">blending friends and kin; pets described in</text><text x="472" y="461.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">kinship terms. Is "family" stretched too far?</text>
</svg>