<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 808" width="900" height="808" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="808" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Newer family types</text>

<rect x="218" y="104" width="322" height="44" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="379" y="131.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Definition</text><rect x="548" y="104" width="322" height="44" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="709" y="131.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Link to social change</text><rect x="30" y="156" width="180" height="96" rx="10" fill="#b5d3cf" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="187.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Pivot /</text><text x="42" y="209.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">sandwich</text><text x="42" y="231.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">generation</text><rect x="218" y="156" width="322" height="96" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="232" y="186.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Mid-life adults, often women,</text><text x="232" y="207.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">caring for children and ageing</text><text x="232" y="228.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">parents at once</text><rect x="548" y="156" width="322" height="96" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="562" y="186.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Ageing populations and later</text><text x="562" y="207.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">childbearing</text><rect x="30" y="260" width="180" height="74" rx="10" fill="#b5d3cf" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="291.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Reconstituted /</text><text x="42" y="313.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">blended</text><rect x="218" y="260" width="322" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="232" y="290.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">At least one partner has children</text><text x="232" y="311.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">from a previous relationship</text><rect x="548" y="260" width="322" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="562" y="290.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Divorce, separation and</text><text x="562" y="311.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">repartnering</text><rect x="30" y="342" width="180" height="93" rx="10" fill="#b5d3cf" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="382.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Living apart</text><text x="42" y="404.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">together</text><rect x="218" y="342" width="322" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="232" y="372.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Committed couple keeping separate</text><text x="232" y="393.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">homes, by choice or force</text><rect x="548" y="342" width="322" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="562" y="372.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Careers in different cities;</text><text x="562" y="393.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">independence; older couples keeping</text><text x="562" y="414.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">homes</text><rect x="30" y="443" width="180" height="74" rx="10" fill="#b5d3cf" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="474.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Child-free</text><text x="42" y="496.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">couples</text><rect x="218" y="443" width="322" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="232" y="473.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Choose not to have children (not</text><text x="232" y="494.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">involuntary childlessness)</text><rect x="548" y="443" width="322" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="562" y="473.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Women’s careers, cost of children,</text><text x="562" y="494.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">individualisation</text><rect x="30" y="525" width="180" height="72" rx="10" fill="#b5d3cf" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="566.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Beanpole family</text><rect x="218" y="525" width="322" height="72" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="232" y="555.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Several generations alive, few in</text><text x="232" y="576.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">each</text><rect x="548" y="525" width="322" height="72" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="562" y="555.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Falling fertility and rising life</text><text x="562" y="576.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">expectancy</text><rect x="30" y="613" width="840" height="171" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="649" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Laws and policies</text><circle cx="61" cy="672.39" r="4.5" fill="#8a6d0d"/><text x="74" y="678" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Divorce reform: more single-parent and reconstituted families</text><circle cx="61" cy="702.39" r="4.5" fill="#8a6d0d"/><text x="74" y="708" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">China’s one-child policy (1980, later relaxed): the "4-2-1" structure</text><circle cx="61" cy="732.39" r="4.5" fill="#8a6d0d"/><text x="74" y="738" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Welfare, housing and parental leave shape leaving home, lone parents’ work and elder</text><text x="74" y="760" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">care</text>
</svg>