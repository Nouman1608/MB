<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 508" width="900" height="508" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="508" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Families and industrialisation: three positions</text>

<rect x="30" y="104" width="269.3333333333333" height="241" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,154 L31.25,118.25 Q31.25,105.25 44.25,105.25 L285.0833333333333,105.25 Q298.0833333333333,105.25 298.0833333333333,118.25 L298.0833333333333,154 Z" fill="#b5d3cf"/><line x1="31.25" y1="154" x2="298.0833333333333" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="164.66666666666666" y="134.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Functionalist fit</text><circle cx="51" cy="181.92" r="4.5" fill="#2e6b62"/><text x="64" y="187.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Parsons:</tspan> industry needed</text><text x="64" y="208.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the mobile, isolated</text><text x="64" y="229.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">nuclear family</text><circle cx="51" cy="252.92" r="4.5" fill="#2e6b62"/><text x="64" y="258.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Goode (1963):</tspan> the conjugal</text><text x="64" y="279.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">family spreads worldwide</text><text x="64" y="300.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">with industrialisation and</text><text x="64" y="321.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">urbanisation</text><rect x="315.3333333333333" y="104" width="269.3333333333333" height="241" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M316.5833333333333,154 L316.5833333333333,118.25 Q316.5833333333333,105.25 329.5833333333333,105.25 L570.4166666666666,105.25 Q583.4166666666666,105.25 583.4166666666666,118.25 L583.4166666666666,154 Z" fill="#f2e7b8"/><line x1="316.5833333333333" y1="154" x2="583.4166666666666" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="134.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Historical challenge</text><circle cx="336.3333333333333" cy="181.92" r="4.5" fill="#2e6b62"/><text x="349.3333333333333" y="187.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Laslett:</tspan> nuclear</text><text x="349.3333333333333" y="208.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">households common before</text><text x="349.3333333333333" y="229.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">industry</text><circle cx="336.3333333333333" cy="252.92" r="4.5" fill="#2e6b62"/><text x="349.3333333333333" y="258.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Anderson (Preston):</tspan></text><text x="349.3333333333333" y="279.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">extended households grew</text><text x="349.3333333333333" y="300.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">in early industrial towns</text><text x="349.3333333333333" y="321.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">as kin pooled resources</text><rect x="600.6666666666666" y="104" width="269.3333333333333" height="241" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.9166666666666,154 L601.9166666666666,118.25 Q601.9166666666666,105.25 614.9166666666666,105.25 L855.75,105.25 Q868.75,105.25 868.75,118.25 L868.75,154 Z" fill="#dce9e7"/><line x1="601.9166666666666" y1="154" x2="868.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="735.3333333333333" y="134.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Stages of change</text><circle cx="621.6666666666666" cy="181.92" r="4.5" fill="#2e6b62"/><text x="634.6666666666666" y="187.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Young and Willmott (1973):</tspan></text><text x="634.6666666666666" y="208.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">unit of production, then</text><text x="634.6666666666666" y="229.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">early industrial extended</text><text x="634.6666666666666" y="250.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">mother-daughter ties, then</text><text x="634.6666666666666" y="271.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the home-centred</text><text x="634.6666666666666" y="292.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">symmetrical family</text><rect x="30" y="361" width="840" height="133" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="397" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Urbanisation matters separately</text><text x="56" y="426" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Smaller, costlier city housing, distance from rural kin and individual earners push</text><text x="56" y="448" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">towards smaller households, yet many urban families keep extended networks through</text><text x="56" y="470" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">visits, money and childcare.</text>
</svg>