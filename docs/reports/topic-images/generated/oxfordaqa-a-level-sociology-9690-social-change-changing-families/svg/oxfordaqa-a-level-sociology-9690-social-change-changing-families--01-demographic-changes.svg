<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 797" width="900" height="797" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="797" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Five demographic changes</text>

<rect x="208" y="104" width="327" height="44" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="371.5" y="131.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">What has happened</text><rect x="543" y="104" width="327" height="44" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="706.5" y="131.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Main explanations</text><rect x="30" y="156" width="170" height="114" rx="10" fill="#b5d3cf" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="218.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Family size</text><rect x="208" y="156" width="327" height="114" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="222" y="186.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Fewer children per woman</text><rect x="543" y="156" width="327" height="114" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="557" y="186.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Children become a cost once child</text><text x="557" y="207.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">labour is restricted and schooling</text><text x="557" y="228.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">extended; contraception; women’s</text><text x="557" y="249.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">education and work</text><rect x="30" y="278" width="170" height="72" rx="10" fill="#b5d3cf" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="319.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Birth rate</text><rect x="208" y="278" width="327" height="72" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="222" y="308.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Births per 1,000 fall</text><rect x="543" y="278" width="327" height="72" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="557" y="308.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">As above, plus later marriage and</text><text x="557" y="329.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">urbanisation</text><rect x="30" y="358" width="170" height="72" rx="10" fill="#b5d3cf" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="399.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Death rate</text><rect x="208" y="358" width="327" height="72" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="222" y="388.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Deaths per 1,000 fall</text><rect x="543" y="358" width="327" height="72" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="557" y="388.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Nutrition, clean water, sanitation,</text><text x="557" y="409.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">vaccination, medical care</text><rect x="30" y="438" width="170" height="96" rx="10" fill="#b5d3cf" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="469.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Infant and</text><text x="42" y="491.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">child</text><text x="42" y="513.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">mortality</text><rect x="208" y="438" width="327" height="96" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="222" y="468.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Far fewer babies and young children</text><text x="222" y="489.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">die</text><rect x="543" y="438" width="327" height="96" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="557" y="468.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Clean water, maternal care,</text><text x="557" y="489.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">immunisation; fewer births needed</text><rect x="30" y="542" width="170" height="74" rx="10" fill="#b5d3cf" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="573.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Ageing</text><text x="42" y="595.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">population</text><rect x="208" y="542" width="327" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="222" y="572.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Rising average age; more older</text><text x="222" y="593.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">people</text><rect x="543" y="542" width="327" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="557" y="572.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Falling birth rates plus longer</text><text x="557" y="593.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">life expectancy</text><rect x="30" y="632" width="840" height="141" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="668" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Migration</text><circle cx="61" cy="691.39" r="4.5" fill="#8a6d0d"/><text x="74" y="697" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Internal:</tspan> rural to urban moves split families; China’s "left-behind children" and</text><text x="74" y="719" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">skipped-generation households</text><circle cx="61" cy="743.39" r="4.5" fill="#8a6d0d"/><text x="74" y="749" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">International:</tspan> transnational families and diasporas</text>
</svg>