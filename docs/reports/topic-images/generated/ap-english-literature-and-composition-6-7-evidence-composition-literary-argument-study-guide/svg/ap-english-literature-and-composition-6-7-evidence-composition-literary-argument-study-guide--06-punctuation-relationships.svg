<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 684" width="900" height="684" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="684" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Punctuation shows relationships</text>

<rect x="30" y="110" width="840" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="46" y="124" width="170" height="64" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="131" y="164" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">, and</text><text x="240" y="148" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Two equal ideas</text><text x="240" y="176" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">Lydia reads the letter twice, and she folds it along its old creases.</text><rect x="30" y="214" width="840" height="110" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="46" y="228" width="170" height="82" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="131" y="283" font-size="40" font-weight="700" fill="#1e2a44" text-anchor="middle">;</text><text x="240" y="252" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Two closely related independent clauses</text><text x="240" y="280" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">She tells her sister it is a dull note; the lamp scene shows it is nothing of</text><text x="240" y="302" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">the kind.</text><rect x="30" y="336" width="840" height="110" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="46" y="350" width="170" height="82" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="131" y="405" font-size="40" font-weight="700" fill="#1e2a44" text-anchor="middle">:</text><text x="240" y="374" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">What follows explains or illustrates what came before</text><text x="240" y="402" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">The narrator reveals her distress through repetition: she reads the letter</text><text x="240" y="424" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">twice and returns it to the same place.</text><rect x="30" y="458" width="840" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="46" y="472" width="170" height="64" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="131" y="518" font-size="40" font-weight="700" fill="#1e2a44" text-anchor="middle">—</text><text x="240" y="496" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">A sharp pause or an emphatic addition</text><text x="240" y="524" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">The flame cannot change the words—and Lydia knows it.</text><rect x="30" y="562" width="840" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="46" y="576" width="170" height="64" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="131" y="616" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Although ... ,</text><text x="240" y="600" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">A dependent clause leading to the main idea</text><text x="240" y="628" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">Although Lydia appears calm, her hands shake.</text>
</svg>