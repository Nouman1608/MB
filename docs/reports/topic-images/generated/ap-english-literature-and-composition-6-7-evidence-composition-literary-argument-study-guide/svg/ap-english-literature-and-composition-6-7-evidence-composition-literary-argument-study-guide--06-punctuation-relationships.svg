<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 702" width="900" height="702" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="702" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Punctuation shows relationships</text>

<rect x="30" y="110" width="840" height="110" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="46" y="124" width="170" height="82" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="131" y="173" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">, and</text><text x="240" y="148" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Two equal ideas</text><text x="240" y="176" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">Lydia reads the letter twice, and she folds it along its old creases.</text><rect x="30" y="232" width="840" height="110" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="46" y="246" width="170" height="82" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="131" y="301" font-size="40" font-weight="700" fill="#1e2a44" text-anchor="middle">;</text><text x="240" y="270" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Two closely related independent clauses</text><text x="240" y="298" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">She tells her sister it is a dull note; the lamp scene shows it is</text><text x="240" y="320" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">nothing of the kind.</text><rect x="30" y="354" width="840" height="110" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="46" y="368" width="170" height="82" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="131" y="423" font-size="40" font-weight="700" fill="#1e2a44" text-anchor="middle">:</text><text x="240" y="392" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">What follows explains or illustrates what came before</text><text x="240" y="420" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">The narrator reveals her distress through repetition: she reads the</text><text x="240" y="442" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">letter twice and returns it to the same place.</text><rect x="30" y="476" width="840" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="46" y="490" width="170" height="64" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="131" y="536" font-size="40" font-weight="700" fill="#1e2a44" text-anchor="middle">—</text><text x="240" y="514" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">A sharp pause or an emphatic addition</text><text x="240" y="542" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">The flame cannot change the words—and Lydia knows it.</text><rect x="30" y="580" width="840" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="46" y="594" width="170" height="64" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="131" y="634" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Although ... ,</text><text x="240" y="618" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">A dependent clause leading to the main idea</text><text x="240" y="646" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">Although Lydia appears calm, her hands shake.</text>
</svg>