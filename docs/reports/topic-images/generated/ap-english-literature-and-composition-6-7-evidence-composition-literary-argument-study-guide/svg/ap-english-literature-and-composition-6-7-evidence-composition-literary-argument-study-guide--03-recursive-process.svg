<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="520" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Interpretation is recursive</text>

<rect x="60" y="160" width="300" height="140" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="210" y="221.1" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Gather evidence</text><text x="210" y="252.1" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">details from the text</text><rect x="540" y="160" width="300" height="140" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="690" y="221.1" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Form a line of reasoning</text><text x="690" y="252.1" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">claims in sequence</text><path d="M370,190 Q450,120 530,190" fill="none" stroke="#1e2a44" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><path d="M530,270 Q450,340 370,270" fill="none" stroke="#1e2a44" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><text x="450" y="138" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">sometimes this way</text><text x="450" y="338" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">sometimes this way</text><text x="450" y="236" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">often back</text><text x="450" y="256" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">and forth</text><rect x="150" y="380" width="600" height="115" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="413" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">IF THE EVIDENCE DOES NOT SUPPORT THE CLAIM</text><text x="450" y="441" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Revise the claim</text><text x="450" y="470.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">not only the quotation</text><path d="M690,302 L690,374" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)" stroke-dasharray="8 6"/>
</svg>