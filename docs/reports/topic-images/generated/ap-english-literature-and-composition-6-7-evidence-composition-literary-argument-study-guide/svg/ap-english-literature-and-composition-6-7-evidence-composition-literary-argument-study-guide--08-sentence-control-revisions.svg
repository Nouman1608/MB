<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 632" width="900" height="632" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="632" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: four revisions</text>

<text x="320" y="126" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">Draft</text><text x="680" y="126" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Revision</text><rect x="30" y="142" width="840" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="60" cy="176" r="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="182.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="86" y="182" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Subordination</text><text x="86" y="208" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">gives the calm</text><text x="86" y="228" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">less weight</text><rect x="190" y="154" width="268" height="72" rx="10" fill="#ffffff" stroke="#b5602e" stroke-width="2" stroke-dasharray="6 5"/><text x="204" y="194.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"Lydia is calm. She is</text><text x="204" y="215.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">anxious."</text><line x1="462" y1="190" x2="498" y2="190" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="502" y="154" width="354" height="72" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="516" y="184" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"Although Lydia appears calm, she is</text><text x="516" y="205" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">anxious."</text><rect x="30" y="250" width="840" height="136" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="60" cy="284" r="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="290.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="86" y="290" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Colon</text><text x="86" y="316" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">announces an</text><text x="86" y="336" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">explanation</text><rect x="190" y="262" width="268" height="112" rx="10" fill="#ffffff" stroke="#b5602e" stroke-width="2" stroke-dasharray="6 5"/><text x="204" y="301.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"She read the letter twice and</text><text x="204" y="322.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">folded it and put it under the</text><text x="204" y="343.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">sugar bowl"</text><line x1="462" y1="318" x2="498" y2="318" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="502" y="262" width="354" height="112" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="516" y="291" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"...through repetition: she reads the</text><text x="516" y="312" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">letter twice, folds it along its old</text><text x="516" y="333" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">creases and returns it to the same</text><text x="516" y="354" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">place."</text><rect x="30" y="398" width="840" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="60" cy="432" r="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="438.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="86" y="438" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Semicolon</text><text x="86" y="464" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">joins a</text><text x="86" y="484" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">statement and</text><text x="86" y="504" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">its</text><text x="86" y="524" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">contradiction</text><rect x="190" y="410" width="268" height="72" rx="10" fill="#ffffff" stroke="#b5602e" stroke-width="2" stroke-dasharray="6 5"/><text x="204" y="440" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"...and the lamp scene shows</text><text x="204" y="461" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">it is not a dull note."</text><line x1="462" y1="446" x2="498" y2="446" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="502" y="410" width="354" height="72" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="516" y="440" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"She tells her sister it is a dull note;</text><text x="516" y="461" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">the lamp scene..."</text><rect x="30" y="506" width="840" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="60" cy="540" r="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="546.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="86" y="546" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Precise verb</text><text x="86" y="572" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">names the</text><text x="86" y="592" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">relationship</text><text x="86" y="612" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">between words</text><text x="86" y="632" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">and gesture</text><rect x="190" y="518" width="268" height="72" rx="10" fill="#ffffff" stroke="#b5602e" stroke-width="2" stroke-dasharray="6 5"/><text x="204" y="558.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"shows"</text><line x1="462" y1="554" x2="498" y2="554" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="502" y="518" width="354" height="72" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="516" y="558.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"betrays"</text>
</svg>