<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 752" width="900" height="752" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="752" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: four revisions</text>

<text x="361" y="126" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">Draft</text><text x="693" y="126" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Revision</text><rect x="30" y="142" width="840" height="116" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="60" cy="176" r="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="182.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="86" y="182" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Subordination</text><text x="86" y="208" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">gives the calm less</text><text x="86" y="228" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">weight</text><rect x="236" y="154" width="250" height="92" rx="10" fill="#ffffff" stroke="#b5602e" stroke-width="2" stroke-dasharray="6 5"/><text x="250" y="194" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"Lydia is calm. She is</text><text x="250" y="215" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">anxious."</text><line x1="490" y1="200" x2="524" y2="200" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="530" y="154" width="326" height="92" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="544" y="194" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"Although Lydia appears calm, she is</text><text x="544" y="215" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">anxious."</text><rect x="30" y="270" width="840" height="136" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="60" cy="304" r="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="310.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="86" y="310" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Colon</text><text x="86" y="336" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">announces an</text><text x="86" y="356" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">explanation</text><rect x="236" y="282" width="250" height="112" rx="10" fill="#ffffff" stroke="#b5602e" stroke-width="2" stroke-dasharray="6 5"/><text x="250" y="321.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"She read the letter twice</text><text x="250" y="342.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">and folded it and put it under</text><text x="250" y="363.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">the sugar bowl"</text><line x1="490" y1="338" x2="524" y2="338" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="530" y="282" width="326" height="112" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="544" y="311" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"...through repetition: she reads the</text><text x="544" y="332" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">letter twice, folds it along its old</text><text x="544" y="353" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">creases and returns it to the same</text><text x="544" y="374" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">place."</text><rect x="30" y="418" width="840" height="136" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="60" cy="452" r="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="458.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="86" y="458" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Semicolon</text><text x="86" y="484" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">joins a statement</text><text x="86" y="504" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">and its</text><text x="86" y="524" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">contradiction</text><rect x="236" y="430" width="250" height="112" rx="10" fill="#ffffff" stroke="#b5602e" stroke-width="2" stroke-dasharray="6 5"/><text x="250" y="480" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"...and the lamp scene</text><text x="250" y="501" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">shows it is not a dull note."</text><line x1="490" y1="486" x2="524" y2="486" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="530" y="430" width="326" height="112" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="544" y="480" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"She tells her sister it is a dull note; the</text><text x="544" y="501" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">lamp scene..."</text><rect x="30" y="566" width="840" height="156" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="60" cy="600" r="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="606.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="86" y="606" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Precise verb</text><text x="86" y="632" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">names the</text><text x="86" y="652" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">relationship</text><text x="86" y="672" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">between words</text><text x="86" y="692" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">and gesture</text><rect x="236" y="578" width="250" height="132" rx="10" fill="#ffffff" stroke="#b5602e" stroke-width="2" stroke-dasharray="6 5"/><text x="250" y="648.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"shows"</text><line x1="490" y1="644" x2="524" y2="644" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="530" y="578" width="326" height="132" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="544" y="648.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"betrays"</text>
</svg>