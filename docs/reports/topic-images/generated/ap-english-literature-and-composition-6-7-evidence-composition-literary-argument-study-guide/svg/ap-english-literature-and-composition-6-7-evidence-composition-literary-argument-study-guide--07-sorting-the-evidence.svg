<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 762" width="900" height="762" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="762" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: sorting the evidence</text>

<rect x="30" y="110" width="840" height="87" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="143" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">CLAIM</text><text x="450" y="171" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">The narrator shows Lydia concealing her distress behind routine</text><line x1="300" y1="196" x2="250" y2="222" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="600" y1="196" x2="650" y2="222" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="230" width="411" height="240" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="264" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Concealment</text><text x="50" y="288" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">public behaviour</text><rect x="44" y="304" width="383" height="70" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="70" cy="339" r="15" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="70" y="344.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">a</text><text x="96" y="343.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"poured the tea"</text><text x="415" y="345" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="end">illustrates</text><rect x="44" y="384" width="383" height="70" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="70" cy="419" r="15" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="70" y="424.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">b</text><text x="96" y="423.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"A dull note from the agent"</text><text x="415" y="425" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="end">exemplifies</text><rect x="459" y="230" width="411" height="265" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="479" y="264" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Distress</text><text x="479" y="288" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">private behaviour</text><rect x="473" y="304" width="383" height="95" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="499" cy="351.5" r="15" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="499" y="356.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">c</text><text x="525" y="335" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"held it to the lamp, as if the</text><text x="525" y="356" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">flame might alter what was</text><text x="525" y="377" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">written"</text><text x="844" y="357.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="end">amplifies</text><rect x="473" y="409" width="383" height="70" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="499" cy="444" r="15" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="499" y="449.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">d</text><text x="525" y="448.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"exactly as before"</text><text x="844" y="450" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="end">qualifies</text><rect x="30" y="515" width="840" height="64" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2" stroke-dasharray="7 5"/><circle cx="70" cy="547" r="15" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="70" y="552.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">e</text><text x="100" y="553" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">"folded it along its old creases": clarifies, but only weakly relevant</text><rect x="30" y="599" width="840" height="133" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="632" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SUFFICIENT</text><text x="50" y="663.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Use (b) and (c), the two marked in gold, to cover both halves of the claim; add (a) as</text><text x="50" y="685.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">support and (d) as a complication. (a) alone would not show the distress beneath the</text><text x="50" y="707.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">routine.</text>
</svg>