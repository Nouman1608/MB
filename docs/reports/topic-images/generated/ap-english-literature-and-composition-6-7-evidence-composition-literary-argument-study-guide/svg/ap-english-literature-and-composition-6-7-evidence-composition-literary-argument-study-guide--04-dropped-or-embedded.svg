<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 656" width="900" height="656" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="656" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Dropping or embedding a quotation</text>

<rect x="30" y="110" width="840" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="148" font-size="22" font-weight="700" fill="#b5602e" text-anchor="start">Dropped</text><text x="160" y="148" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">the quotation stands apart; the comment is vague</text><text x="50" y="192" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Austen writes.</text><rect x="50" y="208" width="800" height="76" rx="8" fill="#ffffff" stroke="#b5602e" stroke-width="2" stroke-dasharray="7 5"/><text x="66" y="238" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"It is a truth universally acknowledged, that a single man in possession of a good fortune,</text><text x="66" y="262" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">must be in want of a wife."</text><text x="50" y="318" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">This shows irony.</text><text x="210" y="318" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">← what irony, and how?</text><text x="50" y="346" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">quotation not connected to the sentence</text><rect x="30" y="390" width="840" height="236" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="428" font-size="22" font-weight="700" fill="#2e6b62" text-anchor="start">Embedded</text><text x="178" y="428" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">only the words that carry the point, built into the sentence</text><text x="50" y="476" font-size="19" fill="#1e2a44">Austen's narrator announces as <tspan font-weight="700" font-style="italic" fill="#8a6d0d">"a truth universally acknowledged"</tspan> an idea</text><text x="50" y="508" font-size="19" fill="#1e2a44">that the opening chapters trace to one anxious mother, and the grand</text><text x="50" y="540" font-size="19" fill="#1e2a44">phrase becomes ironic.</text><rect x="50" y="562" width="800" height="46" rx="10" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="450" y="591" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Quote what you need: a verb, a simile, a repeated phrase. Then comment.</text>
</svg>