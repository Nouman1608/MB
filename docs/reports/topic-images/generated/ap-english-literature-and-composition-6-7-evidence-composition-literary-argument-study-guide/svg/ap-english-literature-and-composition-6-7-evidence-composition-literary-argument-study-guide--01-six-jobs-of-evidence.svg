<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="900" height="650" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="650" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Six jobs evidence can do</text>

<rect x="30" y="110" width="290" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="139" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ILLUSTRATE</text><text x="46" y="164.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">a concrete instance</text><text x="46" y="191.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">She "poured the tea" as if</text><text x="46" y="212.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">nothing had happened</text><line x1="324" y1="185" x2="352" y2="185" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><rect x="30" y="274" width="290" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="303" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CLARIFY</text><text x="46" y="328.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">makes an abstract claim</text><text x="46" y="350.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">visible</text><text x="46" y="377.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Folding and laying the letter</text><text x="46" y="398.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">down make "composure" visible</text><line x1="324" y1="349" x2="352" y2="349" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><rect x="30" y="438" width="290" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="467" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EXEMPLIFY</text><text x="46" y="492.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">one typical case of many</text><text x="46" y="519.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">"a dull note from the agent":</text><text x="46" y="540.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">one of several deflections</text><line x1="324" y1="513" x2="352" y2="513" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><rect x="580" y="110" width="290" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="596" y="139" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ASSOCIATE</text><text x="596" y="164.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">links two details</text><text x="596" y="191.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Letter under the sugar bowl:</text><text x="596" y="212.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">domestic routine meets hidden</text><text x="596" y="233.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">crisis</text><line x1="576" y1="185" x2="548" y2="185" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><rect x="580" y="274" width="290" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="596" y="303" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">AMPLIFY</text><text x="596" y="328.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">strengthens the claim</text><text x="596" y="355.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Held to the lamp "as if the</text><text x="596" y="376.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">flame might alter what was</text><text x="596" y="397.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">written"</text><line x1="576" y1="349" x2="548" y2="349" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><rect x="580" y="438" width="290" height="150" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="596" y="467" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">QUALIFY</text><text x="596" y="492.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">complicates or limits it</text><text x="596" y="519.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Put back "exactly as before":</text><text x="596" y="540.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the composure is partly real</text><line x1="576" y1="513" x2="548" y2="513" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><rect x="360" y="110" width="180" height="478" rx="16" fill="#dce9e7" stroke="#2e6b62" stroke-width="3"/><text x="450" y="291" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">CLAIM</text><text x="450" y="327" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Lydia</text><text x="450" y="357" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">hides her</text><text x="450" y="387" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">distress</text><text x="450" y="624" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Several jobs in one paragraph build a case rather than list proof</text>
</svg>