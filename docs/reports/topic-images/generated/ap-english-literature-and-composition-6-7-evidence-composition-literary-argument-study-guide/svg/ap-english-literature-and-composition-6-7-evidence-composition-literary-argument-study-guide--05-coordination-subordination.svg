<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" width="900" height="720" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="720" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Coordination or subordination?</text>

<rect x="30" y="110" width="840" height="280" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M245,330 L335,330 L290,214 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><line x1="135" y1="210" x2="445" y2="210" stroke="#1e2a44" stroke-width="6" stroke-linecap="round"/><circle cx="290" cy="210" r="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><line x1="135" y1="210" x2="135" y2="236" stroke="#1e2a44" stroke-width="2.5"/><rect x="40" y="236" width="190" height="76" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="135" y="264" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Lydia appears calm</text><text x="135" y="302" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">idea 1</text><line x1="445" y1="210" x2="445" y2="236" stroke="#1e2a44" stroke-width="2.5"/><rect x="350" y="236" width="190" height="76" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="445" y="264" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">her hands shake</text><text x="445" y="302" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">idea 2</text><text x="575" y="156" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="start">Coordination</text><text x="575" y="184" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="start">balance or equality</text><text x="575" y="250" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"Lydia appears calm, and her</text><text x="575" y="274" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">hands shake."</text><text x="575" y="332" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Joining everything with "and"</text><text x="575" y="353" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">makes everything equally important.</text><rect x="30" y="410" width="840" height="280" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><path d="M245,630 L335,630 L290,514 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><line x1="135" y1="476" x2="445" y2="544" stroke="#1e2a44" stroke-width="6" stroke-linecap="round"/><circle cx="290" cy="510" r="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><line x1="135" y1="476" x2="135" y2="502" stroke="#1e2a44" stroke-width="2.5"/><rect x="40" y="502" width="190" height="76" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="135" y="520" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Although Lydia</text><text x="135" y="541" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">appears calm</text><text x="135" y="568" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">subordinate clause</text><line x1="445" y1="544" x2="445" y2="570" stroke="#1e2a44" stroke-width="2.5"/><rect x="350" y="570" width="190" height="76" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="445" y="598" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">her hands shake</text><text x="445" y="636" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">main clause</text><text x="575" y="456" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="start">Subordination</text><text x="575" y="484" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="start">imbalance: emphasis on the main</text><text x="575" y="506" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="start">clause</text><text x="575" y="550" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"Although Lydia appears calm,</text><text x="575" y="574" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">her hands shake."</text><text x="575" y="632" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Use it if you read the calm as only a</text><text x="575" y="653" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">surface.</text>
</svg>