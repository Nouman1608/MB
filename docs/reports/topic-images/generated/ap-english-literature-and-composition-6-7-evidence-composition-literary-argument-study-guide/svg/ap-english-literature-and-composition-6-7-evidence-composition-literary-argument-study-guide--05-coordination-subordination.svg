<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" width="900" height="680" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="680" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Coordination or subordination?</text>

<rect x="30" y="110" width="411" height="540" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="459" y="110" width="411" height="540" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="235" y="148" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="middle">Coordination</text><text x="235" y="174" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="middle">balance or equality</text><text x="665" y="148" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="middle">Subordination</text><text x="665" y="174" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="middle">imbalance: emphasis on the main clause</text><g transform="translate(0,-40)"><path d="M195,430 L275,430 L235,304 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><line x1="85" y1="300" x2="385" y2="300" stroke="#1e2a44" stroke-width="6" stroke-linecap="round"/><circle cx="235" cy="300" r="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><line x1="85" y1="300" x2="85" y2="330" stroke="#1e2a44" stroke-width="2.5"/><rect x="-7" y="330" width="184" height="78" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="85" y="360" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Lydia appears calm</text><text x="85" y="396" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">idea 1</text><line x1="385" y1="300" x2="385" y2="330" stroke="#1e2a44" stroke-width="2.5"/><rect x="293" y="330" width="184" height="78" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="385" y="360" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">her hands shake</text><text x="385" y="396" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">idea 2</text></g><g transform="translate(0,-40)"><path d="M625,430 L705,430 L665,304 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><line x1="515" y1="264" x2="815" y2="336" stroke="#1e2a44" stroke-width="6" stroke-linecap="round"/><circle cx="665" cy="300" r="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><line x1="515" y1="264" x2="515" y2="294" stroke="#1e2a44" stroke-width="2.5"/><rect x="423" y="294" width="184" height="78" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="515" y="324" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Although Lydia</text><text x="515" y="345" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">appears calm</text><text x="515" y="360" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">subordinate</text><line x1="815" y1="336" x2="815" y2="366" stroke="#1e2a44" stroke-width="2.5"/><rect x="723" y="366" width="184" height="78" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="815" y="396" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">her hands shake</text><text x="815" y="432" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">main clause</text></g><text x="235" y="540" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">"Lydia appears calm, and her hands</text><text x="235" y="564" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">shake."</text><text x="665" y="540" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">"Although Lydia appears calm, her hands</text><text x="665" y="564" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">shake."</text><text x="235" y="616" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">joined by "and"</text><text x="665" y="616" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">use it if the calm is only a surface</text>
</svg>