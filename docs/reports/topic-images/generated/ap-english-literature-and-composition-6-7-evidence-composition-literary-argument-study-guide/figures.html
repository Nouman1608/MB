<!-- place after: ## Relevant, effective and sufficient -->
<figure class="topic-figure">
  <img src="https://img.marlbridge.com/ap-english-literature-and-composition-6-7-evidence-composition-literary-argument-study-guide--02-relevant-effective-sufficient.webp" width="900" height="474" alt="Three tests in sequence. Relevant: the evidence bears directly on the claim. Effective: commentary explains its link to the claim. Sufficient: its quantity and quality support the line of reasoning, so a larger claim needs evidence from more than one place." loading="lazy">
  <figcaption>Good evidence is relevant, explained by commentary and sufficient for the size of the claim.</figcaption>
</figure>

<!-- place after: ### Coordination and subordination -->
<figure class="topic-figure">
  <img src="https://img.marlbridge.com/ap-english-literature-and-composition-6-7-evidence-composition-literary-argument-study-guide--05-coordination-subordination.webp" width="900" height="680" alt="Two balance scales. Coordination: &quot;Lydia appears calm, and her hands shake&quot; keeps the two ideas level. Subordination: &quot;Although Lydia appears calm, her hands shake&quot; tips the scale towards the main clause, so the shaking hands carry the emphasis." loading="lazy">

<!-- place after: ### Punctuation that shows relationships -->
<figure class="topic-figure">
  <img src="https://img.marlbridge.com/ap-english-literature-and-composition-6-7-evidence-composition-literary-argument-study-guide--06-punctuation-relationships.webp" width="900" height="702" alt="Five marks and the relationships they signal, each with an example about Lydia: comma plus conjunction for two equal ideas, semicolon for closely related clauses, colon for an explanation, dash for an emphatic addition, and a comma after an introductory clause such as &quot;Although Lydia appears calm&quot;." loading="lazy">

<!-- place after: ## Worked example 1: choosing relevant and sufficient evidence -->
<figure class="topic-figure">
  <img src="https://img.marlbridge.com/ap-english-literature-and-composition-6-7-evidence-composition-literary-argument-study-guide--07-sorting-the-evidence.webp" width="900" height="762" alt="The claim that Lydia conceals distress behind routine splits into two halves. Concealment is supported by (a) &quot;poured the tea&quot; and (b) &quot;A dull note from the agent&quot;; distress by (c) holding the letter to the lamp and (d) &quot;exactly as before&quot;. Detail (e) is only weakly relevant. The best pair is (b) and (c)." loading="lazy">
  <figcaption>A two-part claim needs evidence for both parts: (b) for concealment, (c) for distress.</figcaption>
