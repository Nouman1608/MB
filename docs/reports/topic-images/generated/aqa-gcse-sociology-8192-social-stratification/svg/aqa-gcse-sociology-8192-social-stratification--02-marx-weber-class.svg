<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 634" width="900" height="634" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="634" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Marx and Weber on class</text>

<rect x="208" y="104" width="327" height="44" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="371.5" y="131.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Marx</text><rect x="543" y="104" width="327" height="44" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="706.5" y="131.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Weber</text><rect x="30" y="156" width="170" height="74" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="187.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">What makes a</text><text x="42" y="209.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">class?</text><rect x="208" y="156" width="327" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="222" y="187.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Relationship to the <tspan font-weight="700">means of</tspan></text><text x="222" y="209.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">production</tspan></text><rect x="543" y="156" width="327" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="557" y="187.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A shared <tspan font-weight="700">market situation</tspan>, giving</text><text x="557" y="209.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">similar life chances</text><rect x="30" y="238" width="170" height="96" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="291.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Main division</text><rect x="208" y="238" width="327" height="96" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="222" y="269.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Bourgeoisie</tspan> (owners) vs <tspan font-weight="700">proletariat</tspan></text><text x="222" y="291.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">(own only their labour)</text><rect x="543" y="238" width="327" height="96" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="557" y="269.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Owners vs non-owners too, but</text><text x="557" y="291.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">professionals earn more for skills</text><text x="557" y="313.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">in demand</text><rect x="30" y="342" width="170" height="74" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="384.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Future</text><rect x="208" y="342" width="327" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="222" y="373.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Polarisation</tspan>, then revolution and</text><text x="222" y="395.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">communism</text><rect x="543" y="342" width="327" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="557" y="373.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">No polarisation: the middle class</text><text x="557" y="395.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">expands; revolution not inevitable</text><rect x="30" y="424" width="170" height="74" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="455.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Why workers</text><text x="42" y="477.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">accept it</text><rect x="208" y="424" width="327" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="222" y="455.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Ruling class ideology</tspan> creates false</text><text x="222" y="477.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">class consciousness</text><rect x="543" y="424" width="327" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="557" y="455.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Not his focus: stresses other</text><text x="557" y="477.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">sources of inequality</text><rect x="30" y="506" width="170" height="96" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="548.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Other</text><text x="42" y="570.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">dimensions</text><rect x="208" y="506" width="327" height="96" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="222" y="537.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Political power comes from economic</text><text x="222" y="559.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">power</text><rect x="543" y="506" width="327" height="96" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="557" y="537.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Status</tspan> (prestige) and <tspan font-weight="700">party</tspan> (groups</text><text x="557" y="559.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">seeking power) are separate from</text><text x="557" y="581.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">class</text>
</svg>