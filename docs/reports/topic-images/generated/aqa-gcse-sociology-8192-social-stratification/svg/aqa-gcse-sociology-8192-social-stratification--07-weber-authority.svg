<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 766" width="900" height="766" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="766" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Weber: three types of authority</text>

<rect x="30" y="108" width="840" height="64" rx="12" fill="#1e2a44" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="148" font-size="21" font-weight="700" fill="#ffffff" text-anchor="middle">Authority = power that people accept as legitimate</text><rect x="30" y="196" width="268" height="300" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="164" cy="254" r="42" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><path d="M130,274 L130,242 L147,258 L164,234 L181,258 L198,242 L198,274 Z" fill="#d4b02e" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="164" y="332" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Traditional</text><text x="164" y="362" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Established customs and</text><text x="164" y="384" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">inherited status</text><text x="164" y="432" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">e.g.</text><text x="164" y="454" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="middle" font-style="italic">a monarchy</text><rect x="316" y="196" width="268" height="300" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="450" cy="254" r="42" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><path d="M450,224 L458.22899353209465,244.67376207875074 L480.4338085214449,246.11145618000168 L463.31479122813215,260.3262379212493 L468.80912807335915,281.8885438199983 L450,270 L431.19087192664085,281.8885438199983 L436.68520877186785,260.3262379212493 L419.5661914785551,246.11145618000168 L441.77100646790535,244.67376207875074 Z" fill="#d4b02e" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="450" y="332" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Charismatic</text><text x="450" y="362" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Devotion to a leader with</text><text x="450" y="384" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">exceptional qualities</text><text x="450" y="432" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">e.g.</text><text x="450" y="454" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="middle" font-style="italic">a religious or revolutionary</text><text x="450" y="475" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="middle" font-style="italic">leader</text><rect x="602" y="196" width="268" height="300" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="736" cy="254" r="42" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><rect x="706" y="232" width="60" height="46" rx="4" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><line x1="718" y1="244" x2="754" y2="244" stroke="#1e2a44" stroke-width="2.5"/><line x1="718" y1="254" x2="754" y2="254" stroke="#1e2a44" stroke-width="2.5"/><line x1="718" y1="264" x2="754" y2="264" stroke="#1e2a44" stroke-width="2.5"/><text x="736" y="332" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Rational-legal</text><text x="736" y="362" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Acceptance of shared</text><text x="736" y="384" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">impersonal rules</text><text x="736" y="432" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">e.g.</text><text x="736" y="454" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="middle" font-style="italic">a bureaucracy, the police, an</text><text x="736" y="475" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="middle" font-style="italic">elected government</text><rect x="30" y="516" width="412" height="128" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,566 L31.25,530.25 Q31.25,517.25 44.25,517.25 L427.75,517.25 Q440.75,517.25 440.75,530.25 L440.75,566 Z" fill="#b5d3cf"/><line x1="31.25" y1="566" x2="440.75" y2="566" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="546.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Formal sources of power</text><text x="44" y="598.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Official positions and laws, such as a Member</text><text x="44" y="620.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">of Parliament</text><rect x="458" y="516" width="412" height="128" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,566 L459.25,530.25 Q459.25,517.25 472.25,517.25 L855.75,517.25 Q868.75,517.25 868.75,530.25 L868.75,566 Z" fill="#f2e7b8"/><line x1="459.25" y1="566" x2="868.75" y2="566" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="546.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Informal sources of power</text><text x="472" y="598.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Personal influence, peer pressure or money</text><rect x="30" y="660" width="840" height="82" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="696" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Real leaders often mix the types: a prime minister holds rational-legal authority but may</text><text x="56" y="718" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">also rely on charisma.</text>
</svg>