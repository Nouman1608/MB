<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 667" width="900" height="667" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="667" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Davis and Moore: why stratification?</text>

<text x="450" y="128" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Every society needs roles to be…</text><rect x="30" y="146" width="198" height="64" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="129" y="183.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">filled</text><rect x="244" y="146" width="198" height="64" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="343" y="172.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">filled by those</text><text x="343" y="194.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">best able</text><rect x="458" y="146" width="198" height="64" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="557" y="183.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">trained for</text><rect x="672" y="146" width="198" height="64" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="771" y="172.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">performed</text><text x="771" y="194.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">conscientiously</text><path d="M129,214 L129,228 L771,228 L771,214" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><line x1="157" y1="228" x2="157" y2="254" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="260" width="253.33333333333334" height="127" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="156.66666666666669" y="292.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Unequal rewards</text><text x="156.66666666666669" y="322.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">High pay and prestige for</text><text x="156.66666666666669" y="343.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">the most functionally</text><text x="156.66666666666669" y="364.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">important roles</text><line x1="287.33333333333337" y1="323.5" x2="319.33333333333337" y2="323.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="323.33333333333337" y="260" width="253.33333333333334" height="127" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="450.00000000000006" y="302.8" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Competition</text><text x="450.00000000000006" y="332.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Ambitious people compete for</text><text x="450.00000000000006" y="353.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">these roles</text><line x1="580.6666666666667" y1="323.5" x2="612.6666666666667" y2="323.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="616.6666666666667" y="260" width="253.33333333333334" height="127" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="743.3333333333334" y="302.8" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">The most talented win</text><text x="743.3333333333334" y="332.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Effective role allocation</text><text x="743.3333333333334" y="353.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">and performance</text><rect x="30" y="409" width="412" height="234" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,459 L31.25,423.25 Q31.25,410.25 44.25,410.25 L427.75,410.25 Q440.75,410.25 440.75,423.25 L440.75,459 Z" fill="#ffffff"/><line x1="31.25" y1="459" x2="440.75" y2="459" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="439.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Evaluation</text><circle cx="49" cy="484.92" r="4.5" fill="#2e6b62"/><text x="62" y="490.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Lower-paid jobs such as nursing can be just as</text><text x="62" y="511.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">important</text><circle cx="49" cy="534.9200000000001" r="4.5" fill="#2e6b62"/><text x="62" y="540.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Pay may reflect power, not importance</text><circle cx="49" cy="563.9200000000001" r="4.5" fill="#2e6b62"/><text x="62" y="569.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">No agreed way to measure talent</text><circle cx="49" cy="592.9200000000001" r="4.5" fill="#2e6b62"/><text x="62" y="598.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Tumin (1953): unequal access to education</text><text x="62" y="619.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">stops many able people competing</text><rect x="458" y="409" width="412" height="234" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,459 L459.25,423.25 Q459.25,410.25 472.25,410.25 L855.75,410.25 Q868.75,410.25 868.75,423.25 L868.75,459 Z" fill="#ffffff"/><line x1="459.25" y1="459" x2="868.75" y2="459" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="439.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Other views</text><circle cx="477" cy="484.92" r="4.5" fill="#2e6b62"/><text x="490" y="490.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Marxist:</tspan> rewards reflect ownership and</text><text x="490" y="511.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">inheritance, so the competition is not fair</text><circle cx="477" cy="534.9200000000001" r="4.5" fill="#2e6b62"/><text x="490" y="540.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Feminist:</tspan> ignores unpaid work at home and</text><text x="490" y="561.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">caring; women are held in lower-paid jobs by</text><text x="490" y="582.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the glass ceiling</text>
</svg>