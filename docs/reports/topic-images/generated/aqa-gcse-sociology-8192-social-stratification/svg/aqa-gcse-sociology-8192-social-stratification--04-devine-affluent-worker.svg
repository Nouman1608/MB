<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 597" width="900" height="597" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="597" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Devine: the affluent worker revisited</text>

<rect x="30" y="108" width="404" height="336" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,178 L31.25,122.25 Q31.25,109.25 44.25,109.25 L419.75,109.25 Q432.75,109.25 432.75,122.25 L432.75,178 Z" fill="#f2e7b8"/><line x1="31.25" y1="178" x2="432.75" y2="178" stroke="#c9d6d4" stroke-width="2"/><text x="232" y="136.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Predicted (Goldthorpe and Lockwood,</text><text x="232" y="161.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">1960s)</text><circle cx="53" cy="202.39" r="4.5" fill="#8a6d0d"/><text x="66" y="208" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Privatised instrumentalism:</tspan> life centred</text><text x="66" y="230" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">on the home; work only a means to an end</text><circle cx="53" cy="254.39" r="4.5" fill="#8a6d0d"/><text x="66" y="260" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Affluent workers becoming middle class</text><text x="66" y="282" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">(<tspan font-weight="700">embourgeoisement</tspan>)</text><circle cx="53" cy="306.39" r="4.5" fill="#8a6d0d"/><text x="66" y="312" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A “new working class”</text><rect x="466" y="108" width="404" height="336" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M467.25,178 L467.25,122.25 Q467.25,109.25 480.25,109.25 L855.75,109.25 Q868.75,109.25 868.75,122.25 L868.75,178 Z" fill="#b5d3cf"/><line x1="467.25" y1="178" x2="868.75" y2="178" stroke="#c9d6d4" stroke-width="2"/><text x="668" y="148.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Found (Devine, Luton, late 1980s)</text><circle cx="489" cy="202.39" r="4.5" fill="#2e6b62"/><text x="502" y="208" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">No strong support: less communal than</text><text x="502" y="230" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">before, but not as home-centred as</text><text x="502" y="252" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">predicted</text><circle cx="489" cy="276.39" r="4.5" fill="#2e6b62"/><text x="502" y="282" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Did not accept capitalism uncritically;</text><text x="502" y="304" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">no embourgeoisement</text><circle cx="489" cy="328.39" r="4.5" fill="#2e6b62"/><text x="502" y="334" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Higher living standards, yet resented</text><text x="502" y="356" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">inherited wealth and extreme inequality</text><circle cx="489" cy="380.39" r="4.5" fill="#2e6b62"/><text x="502" y="386" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Kept working-class values; lost faith in</text><text x="502" y="408" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Labour</text><circle cx="450" cy="276" r="22" fill="#1e2a44"/><path d="M440,276 h18 m-7,-7 l7,7 l-7,7" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><rect x="30" y="462" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="498" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Evaluation</text><text x="56" y="527" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Interviews with male manual workers at the Vauxhall plant and their wives gave rich detail,</text><text x="56" y="549" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">but one workplace in one town limits generalisation.</text>
</svg>