<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 618" width="900" height="618" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="618" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why are people poor?</text>

<rect x="30" y="104" width="404" height="321" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,154 L31.25,118.25 Q31.25,105.25 44.25,105.25 L419.75,105.25 Q432.75,105.25 432.75,118.25 L432.75,154 Z" fill="#b5d3cf"/><line x1="31.25" y1="154" x2="432.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="232" y="134.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Cultural explanations</text><text x="48" y="190.4" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">The poor’s own values keep them poor</text><circle cx="53" cy="215.79" r="4.5" fill="#2e6b62"/><text x="66" y="221.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Culture of poverty</tspan> (Lewis): values such</text><text x="66" y="243.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">as fatalism are passed on: a cycle of</text><text x="66" y="265.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">deprivation</text><circle cx="53" cy="289.78999999999996" r="4.5" fill="#2e6b62"/><text x="66" y="295.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Murray’s underclass</tspan> (New Right): generous</text><text x="66" y="317.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">welfare creates a culture of dependency</text><circle cx="53" cy="341.78999999999996" r="4.5" fill="#2e6b62"/><text x="66" y="347.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Murray pointed to rising illegitimacy,</text><text x="66" y="369.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">rising crime and some young people’s</text><text x="66" y="391.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">unwillingness to work</text><rect x="466" y="104" width="404" height="321" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M467.25,154 L467.25,118.25 Q467.25,105.25 480.25,105.25 L855.75,105.25 Q868.75,105.25 868.75,118.25 L868.75,154 Z" fill="#f2e7b8"/><line x1="467.25" y1="154" x2="868.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="668" y="134.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Material explanations</text><text x="484" y="190.4" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">Lack of money and resources keeps them poor</text><circle cx="489" cy="215.79" r="4.5" fill="#8a6d0d"/><text x="502" y="221.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Material deprivation:</tspan> low wages,</text><text x="502" y="243.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">unemployment, poor housing</text><circle cx="489" cy="267.78999999999996" r="4.5" fill="#8a6d0d"/><text x="502" y="273.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Globalisation:</tspan> manufacturing jobs moved</text><text x="502" y="295.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">to lower-wage countries</text><circle cx="489" cy="319.78999999999996" r="4.5" fill="#8a6d0d"/><text x="502" y="325.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Poverty trap:</tspan> earning more means losing</text><text x="502" y="347.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">benefits</text><circle cx="489" cy="371.78999999999996" r="4.5" fill="#8a6d0d"/><text x="502" y="377.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Many labelled “underclass” hold</text><text x="502" y="399.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">conventional attitudes and want work</text><circle cx="450" cy="264.5" r="24" fill="#1e2a44"/><text x="450" y="271.5" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">vs</text><rect x="30" y="443" width="840" height="149" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="479" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Perspectives</text><circle cx="61" cy="502.39" r="4.5" fill="#8a6d0d"/><text x="74" y="508" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Functionalist</tspan> (Gans): poverty has functions for the better-off, e.g. filling low-paid jobs</text><circle cx="61" cy="532.39" r="4.5" fill="#8a6d0d"/><text x="74" y="538" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Marxist:</tspan> capitalism needs a pool of cheap labour</text><circle cx="61" cy="562.39" r="4.5" fill="#8a6d0d"/><text x="74" y="568" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Feminist:</tspan> lower pay, caring and lone parenthood raise women’s risk</text>
</svg>