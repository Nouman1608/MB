<rect width="900" height="636" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Townsend: three ways to measure poverty</text>

<text x="500" y="102" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">Population in poverty, 1968–69</text><rect x="30" y="120" width="440" height="96" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="48" y="150" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">State standard</text><text x="48" y="174" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Based on entitlement to benefits; arbitrary, set by</text><text x="48" y="195" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the government of the day</text><rect x="500" y="146" width="60" height="44" rx="6" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="570" y="175" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">just over 6%</text><rect x="30" y="228" width="440" height="96" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="48" y="258" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Relative income</text><text x="48" y="282" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Households below the average for similar</text><text x="48" y="303" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">households; also arbitrary</text><rect x="500" y="254" width="90" height="44" rx="6" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="600" y="283" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">a little over 9%</text><rect x="30" y="336" width="440" height="115" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="48" y="366" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Relative deprivation</text><text x="48" y="390" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Townsend’s preferred measure: lacking the diet,</text><text x="48" y="411" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">activities and living conditions widely available</text><text x="48" y="432" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">in society</text><rect x="500" y="371.5" width="220" height="44" rx="6" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="730" y="400.5" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">more than 22%</text><line x1="500" y1="112" x2="500" y2="459" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="471" width="840" height="141" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="507" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Method and criticism</text><circle cx="61" cy="530.39" r="4.5" fill="#8a6d0d"/><text x="74" y="536" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Questionnaires to over 2,000 households and more than 6,000 individuals; a deprivation</text><text x="74" y="558" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">index of diet, fuel, clothing, housing, work, health, education and social activities</text><circle cx="61" cy="582.39" r="4.5" fill="#8a6d0d"/><text x="74" y="588" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The index may measure choice: not eating fresh meat may mean being vegetarian, not poor</text>
</svg>