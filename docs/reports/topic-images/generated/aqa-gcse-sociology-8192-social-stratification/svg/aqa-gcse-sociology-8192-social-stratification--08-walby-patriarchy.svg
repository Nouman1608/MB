<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 610" width="900" height="610" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="610" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Walby: six structures of patriarchy</text>

<rect x="30" y="108" width="412" height="96" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="64" cy="156" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="64" y="163.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="100" y="142" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Paid work</text><text x="100" y="168" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Women disadvantaged in the labour market</text><text x="100" y="189" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">despite equality laws</text><rect x="458" y="108" width="412" height="96" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="492" cy="156" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="492" y="163.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="528" y="142" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Relations of production</text><text x="528" y="168" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Men benefit from women’s unpaid labour in</text><text x="528" y="189" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the home</text><rect x="30" y="216" width="412" height="96" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="64" cy="264" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="64" y="271.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="100" y="250" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Culture</text><text x="100" y="276" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Different expectations for men’s and</text><text x="100" y="297" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">women’s behaviour</text><rect x="458" y="216" width="412" height="96" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="492" cy="264" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="492" y="271.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="528" y="250" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Sexuality</text><text x="528" y="276" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Double standards: men admired, women</text><text x="528" y="297" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">condemned</text><rect x="30" y="324" width="412" height="96" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="64" cy="372" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="64" y="379.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="100" y="358" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Male violence</text><text x="100" y="384" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Its use or threat discourages women from</text><text x="100" y="405" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">challenging men</text><rect x="458" y="324" width="412" height="96" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="492" cy="372" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="492" y="379.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">6</text><text x="528" y="358" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The state</text><text x="528" y="384" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Less patriarchal than before, but does</text><text x="528" y="405" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">little to protect women</text><text x="450" y="456" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Walby: the form of patriarchy has changed</text><rect x="30" y="476" width="360" height="110" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="210" y="512" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Private patriarchy</text><text x="210" y="540" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Direct control by fathers or husbands</text><line x1="400" y1="531" x2="500" y2="531" stroke="#1e2a44" stroke-width="5" marker-end="url(#ah)"/><rect x="510" y="476" width="360" height="110" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="690" y="512" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Public patriarchy</text><text x="690" y="540" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Women in public life but segregated</text><text x="690" y="562" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">into low-paid, low-status jobs</text>
</svg>