<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What shapes life chances?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Chances of good health, a long life, education, a good job and housing</text>
<line x1="450" y1="418" x2="450" y2="173" stroke="#2e6b62" stroke-width="3"/><line x1="450" y1="418" x2="694.3223382712594" y2="265.2449985446103" stroke="#2e6b62" stroke-width="3"/><line x1="450" y1="418" x2="754.6649725568199" y2="472.51762881929704" stroke="#2e6b62" stroke-width="3"/><line x1="450" y1="418" x2="585.5886684742369" y2="638.7373726360927" stroke="#2e6b62" stroke-width="3"/><line x1="450" y1="418" x2="314.4113315257631" y2="638.7373726360927" stroke="#2e6b62" stroke-width="3"/><line x1="450" y1="418" x2="145.33502744318014" y2="472.51762881929704" stroke="#2e6b62" stroke-width="3"/><line x1="450" y1="418" x2="205.67766172874065" y2="265.2449985446103" stroke="#2e6b62" stroke-width="3"/><circle cx="450" cy="418" r="92" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="414" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">LIFE</text><text x="450" y="442" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">CHANCES</text><rect x="340" y="113.5" width="220" height="119" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="143.5" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Class</text><text x="450" y="167.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">income shapes diet,</text><text x="450" y="188.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">housing, schooling and</text><text x="450" y="209.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">health</text><rect x="584.3223382712594" y="216.24499854461033" width="220" height="98" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="694.3223382712594" y="246.24499854461033" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Gender</text><text x="694.3223382712594" y="270.2449985446103" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">more part-time work and</text><text x="694.3223382712594" y="291.2449985446103" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">unpaid caring for women</text><rect x="644.6649725568199" y="423.51762881929704" width="220" height="98" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="754.6649725568199" y="453.51762881929704" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Race and ethnicity</text><text x="754.6649725568199" y="477.51762881929704" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">discrimination and</text><text x="754.6649725568199" y="498.51762881929704" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">institutional racism</text><rect x="475.5886684742369" y="589.7373726360927" width="220" height="98" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="585.5886684742369" y="619.7373726360927" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Sexuality</text><text x="585.5886684742369" y="643.7373726360927" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">prejudice affects safety</text><text x="585.5886684742369" y="664.7373726360927" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">at work and school</text><rect x="204.4113315257631" y="589.7373726360927" width="220" height="98" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="314.4113315257631" y="619.7373726360927" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Age</text><text x="314.4113315257631" y="643.7373726360927" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">ageism affects young and</text><text x="314.4113315257631" y="664.7373726360927" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">older workers</text><rect x="35.33502744318014" y="423.51762881929704" width="220" height="98" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="145.33502744318014" y="453.51762881929704" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Disability</text><text x="145.33502744318014" y="477.51762881929704" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">physical barriers and</text><text x="145.33502744318014" y="498.51762881929704" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">employer attitudes</text><rect x="95.67766172874065" y="226.74499854461033" width="220" height="77" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="205.67766172874065" y="256.7449985446103" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Religion and belief</text><text x="205.67766172874065" y="280.7449985446103" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">discrimination in hiring</text>
