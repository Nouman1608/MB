<path d="M120,152 L560,152 L560,412 L120,412 Z" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><path d="M60,282 L410,156 L410,408 Z" fill="#f2e7b8" opacity="0.9"/><circle cx="60" cy="282" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="332" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">teacher</text><rect x="170" y="172" width="230" height="96" rx="14" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5" /><text x="285" y="205.05" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">“a phone on the desk</text><text x="285" y="224.85000000000002" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">costs ten minutes of</text><text x="285" y="244.65" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">attention”</text><rect x="170" y="290" width="230" height="96" rx="14" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5" /><text x="285" y="323.05" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">“students concentrate</text><text x="285" y="342.85" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">better when the</text><text x="285" y="362.65000000000003" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">temptation is out of sight”</text><rect x="420" y="192" width="130" height="50" rx="14" fill="#f4f6f6" stroke="#c9d6d4" stroke-width="2.5" stroke-dasharray="5 4"/><text x="485" y="222.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">translation</text><rect x="420" y="262" width="130" height="60" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" stroke-dasharray="5 4"/><text x="485" y="292.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">medical</text><text x="485" y="312.55" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">monitoring</text><rect x="420" y="342" width="130" height="50" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" stroke-dasharray="5 4"/><text x="485" y="372.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">home life</text><rect x="600" y="152" width="270" height="120" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="618" y="184.67999999999998" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">In the light</text><text x="618" y="210.26999999999998" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">classroom evidence: lesson</text><text x="618" y="230.07" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">time and concentration, what a</text><text x="618" y="249.86999999999998" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">teacher is best placed to see</text><rect x="600" y="292" width="270" height="120" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" stroke-dasharray="6 5"/><text x="618" y="334.58000000000004" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">In the dark</text><text x="618" y="360.17" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">practical and social uses raised</text><text x="618" y="379.97" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">by Sources F and E</text><rect x="30" y="434" width="840" height="74.24000000000001" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="450" y="465.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Persuasive about attention and lesson time, silent about the practical and social uses of phones that</text><text x="450" y="486.72" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">other perspectives raise.</text>
