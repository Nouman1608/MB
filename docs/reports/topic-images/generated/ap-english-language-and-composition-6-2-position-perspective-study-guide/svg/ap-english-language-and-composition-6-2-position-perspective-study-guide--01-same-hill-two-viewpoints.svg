<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 619" width="900" height="619" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="619" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Position and perspective</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Two people point at the same hill for different reasons</text>
<path d="M30,372 C200,342 330,182 450,182 C570,182 700,342 870,372 Z" fill="#cfe0bd" stroke="#1e2a44" stroke-width="3"/><rect x="30" y="372" width="840" height="10" fill="#cbbf9f"/><rect x="370" y="222" width="160" height="44" rx="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5" /><text x="450" y="251" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">the viewpoint</text><rect x="30" y="132" width="250" height="86" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="155" y="166" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Farmer</text><text x="155" y="194" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">sees the hill as grazing</text><text x="155" y="215.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">land</text><rect x="620" y="132" width="250" height="86" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="745" y="167.24" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Photographer</text><text x="745" y="195.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">sees the hill as a skyline</text><line x1="280" y1="182" x2="364" y2="238" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="620" y1="182" x2="536" y2="238" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="450" y="318" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">same POSITION: “That is the best viewpoint.”</text><rect x="30" y="402" width="840" height="41.8" fill="#dce9e7"/><text x="42" y="426.3" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve"></text><text x="252" y="426.3" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Position</text><text x="567" y="426.3" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Perspective</text><rect x="30" y="443.8" width="840" height="41.8" fill="#ffffff"/><text x="42" y="468.1" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Question</text><text x="252" y="468.1" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">What do you argue?</text><text x="567" y="468.1" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">From where do you argue?</text><line x1="30" y1="443.8" x2="870" y2="443.8" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="485.6" width="840" height="61.6" fill="#ffffff"/><text x="42" y="509.90000000000003" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Example</text><text x="252" y="509.90000000000003" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“Phones should be banned in class.”</text><text x="567" y="509.90000000000003" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“As a teacher who has watched</text><text x="567" y="529.7" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">attention drift for twenty years...”</text><line x1="30" y1="485.6" x2="870" y2="485.6" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="547.2" width="840" height="41.8" fill="#ffffff"/><text x="42" y="571.5" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Shaped by</text><text x="252" y="571.5" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">the claim</text><text x="567" y="571.5" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">background, interests, expertise</text><line x1="30" y1="547.2" x2="870" y2="547.2" stroke="#c9d6d4" stroke-width="1.5"/><line x1="240" y1="402" x2="240" y2="589" stroke="#c9d6d4" stroke-width="1.5"/><line x1="555" y1="402" x2="555" y2="589" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="402" width="840" height="187" rx="12" fill="none" stroke="#1e2a44" stroke-width="2.5" />
</svg>