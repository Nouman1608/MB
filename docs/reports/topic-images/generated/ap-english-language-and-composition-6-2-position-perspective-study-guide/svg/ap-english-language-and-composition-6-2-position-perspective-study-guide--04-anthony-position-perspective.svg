<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 542" width="900" height="542" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="542" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Position and perspective in one speech</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Susan B. Anthony, 1873</text>
<rect x="30" y="122" width="840" height="79.52000000000001" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="450" y="155.3" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">“It was we, the people; not we, the white male citizens; nor yet we, the male citizens; but</text><text x="450" y="179.06" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">we, the whole people, who formed the Union.”</text><rect x="30" y="232" width="405" height="110" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="232.5" y="278.58000000000004" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="middle" xml:space="preserve">Position</text><text x="232.5" y="307.43" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">the Constitution’s “people” includes women</text><rect x="465" y="232" width="405" height="110" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="667.5" y="267.36" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">Perspective</text><text x="667.5" y="296.21" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">a woman indicted for voting: personal</text><text x="667.5" y="318.65" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">exclusion and the principle of citizenship</text><text x="450" y="372" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">The “not we...” clauses show the perspective at work: she names the categories used to exclude her and</text><text x="450" y="393.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">rejects them one by one.</text><rect x="200" y="412" width="500" height="100" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" stroke-dasharray="7 5"/><text x="450" y="446" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Same position, other perspective</text><text x="450" y="474" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">a male lawyer arguing from constitutional law: different</text><text x="450" y="495.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">evidence and tone would follow</text>
</svg>