<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Same position, different perspectives</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Should schools ban phones during lessons? (fictional sources)</text>
<text x="365" y="136" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">FOR A BAN</text><text x="740" y="136" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle" xml:space="preserve">AGAINST A BLANKET BAN</text><rect x="250" y="148" width="230" height="420" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2" /><rect x="625" y="148" width="230" height="420" rx="14" fill="#f6e3d8" stroke="#b5602e" stroke-width="2" /><rect x="30" y="162" width="200" height="120" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="42" y="214.62" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Teacher</text><text x="42" y="240.73" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">classroom management</text><rect x="265" y="162" width="200" height="120" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" /><text x="365" y="204.72" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Source D</text><text x="365" y="230.82999999999998" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve"><tspan font-style="italic">lost</tspan> <tspan font-style="italic">attention</tspan> <tspan font-style="italic">and</tspan></text><text x="365" y="250.63" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve"><tspan font-style="italic">lesson</tspan> <tspan font-style="italic">time</tspan></text><line x1="232" y1="222" x2="263" y2="222" stroke="#c9d6d4" stroke-width="2" stroke-dasharray="5 4"/><rect x="30" y="298" width="200" height="120" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="42" y="340.71999999999997" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Parent</text><text x="42" y="366.83" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">wellbeing and social</text><text x="42" y="386.63" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">pressure</text><rect x="265" y="298" width="200" height="120" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" /><text x="365" y="350.62" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Source E</text><text x="365" y="376.73" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve"><tspan font-style="italic">group</tspan> <tspan font-style="italic">chats,</tspan> <tspan font-style="italic">arguments</tspan></text><line x1="232" y1="358" x2="263" y2="358" stroke="#c9d6d4" stroke-width="2" stroke-dasharray="5 4"/><rect x="30" y="434" width="200" height="120" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="42" y="476.71999999999997" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Student</text><text x="42" y="502.83" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">practical needs,</text><text x="42" y="522.63" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">accessibility</text><rect x="640" y="434" width="200" height="120" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" /><text x="740" y="476.71999999999997" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Source F</text><text x="740" y="502.83" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve"><tspan font-style="italic">translation,</tspan> <tspan font-style="italic">medical</tspan></text><text x="740" y="522.63" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve"><tspan font-style="italic">monitoring</tspan></text><line x1="232" y1="494" x2="638" y2="494" stroke="#c9d6d4" stroke-width="2" stroke-dasharray="5 4"/><rect x="30" y="588" width="840" height="95.36000000000001" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="48" y="619.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“Teachers and parents support the ban for different reasons... That two groups with different concerns</text><text x="48" y="640.72" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">reach the same conclusion strengthens the case, although neither speaks for students whose phones</text><text x="48" y="661.84" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">are tools.”</text>
</svg>