<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 598" width="900" height="598" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="598" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Tariffs on imports: moving the problem?</text>

<rect x="270" y="104" width="360" height="112" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="137" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">ACTION</text><text x="450" y="164" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Put tariffs on imported</text><text x="450" y="190" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">goods</text><path d="M450,216 L450,240 M165,240 L735,240" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><line x1="165" y1="240" x2="165" y2="266" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="450" y1="240" x2="450" y2="266" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="735" y1="240" x2="735" y2="266" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="282" width="268" height="156" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="315" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SHORT TERM</text><text x="50" y="340.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Some factory jobs</text><text x="50" y="364.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">protected</text><text x="50" y="392.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Imported goods become</text><text x="50" y="413.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">dearer.</text><rect x="316" y="282" width="268" height="156" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="336" y="315" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">CONSUMERS</text><text x="336" y="340.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Pay higher prices</text><text x="336" y="368.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Including the workers being</text><text x="336" y="389.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">protected.</text><rect x="602" y="282" width="268" height="156" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="622" y="315" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">OTHER COUNTRIES</text><text x="622" y="340.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">May reply with their</text><text x="622" y="364.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">own tariffs</text><text x="622" y="392.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Exporting firms could then</text><text x="622" y="413.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">lose jobs.</text><rect x="30" y="456" width="840" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="492" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Judgement</text><text x="50" y="521.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Tariffs may move the problem rather than solve it, unless they are temporary and linked to</text><text x="50" y="543.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">retraining.</text>
</svg>