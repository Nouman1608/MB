<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 546" width="900" height="546" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="546" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">One issue seen at three levels: supply chains</text>

<rect x="30" y="104" width="250.66666666666666" height="156" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="137" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">GLOBAL</text><text x="50" y="162.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Are supply chains</text><text x="50" y="186.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">across many</text><text x="50" y="210.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">countries worth the</text><text x="50" y="234.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">risk of disruption?</text><line x1="286.66666666666663" y1="182" x2="318.66666666666663" y2="182" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="324.66666666666663" y="104" width="250.66666666666666" height="156" rx="14" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><text x="344.66666666666663" y="149" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">NATIONAL</text><text x="344.66666666666663" y="174.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Should a country</text><text x="344.66666666666663" y="198.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">make more of its own</text><text x="344.66666666666663" y="222.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">essential goods?</text><line x1="581.3333333333333" y1="182" x2="613.3333333333333" y2="182" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="619.3333333333333" y="104" width="250.66666666666666" height="156" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="639.3333333333333" y="161" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">LOCAL</text><text x="639.3333333333333" y="186.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">A shop that cannot</text><text x="639.3333333333333" y="210.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">restock</text><rect x="30" y="278" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="311.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Linking the levels shows that one cause can have very different consequences for different</text><text x="50" y="333.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">people.</text><rect x="30" y="376" width="840" height="140" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="409" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">GLOCALISATION (ROLAND ROBERTSON, 1990s)</text><text x="50" y="435.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Global products and ideas adapted to local cultures</text><text x="50" y="464.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="464.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Strength: a reminder that globalisation is not only one-way.</text><text x="50" y="491.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="491.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Limitation: it can be used to dismiss real concerns about local businesses losing out.</text>
</svg>