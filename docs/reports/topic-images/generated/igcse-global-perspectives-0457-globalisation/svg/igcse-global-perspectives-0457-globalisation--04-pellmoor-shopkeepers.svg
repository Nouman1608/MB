roke="#1e2a44" stroke-width="2"/><circle cx="606" cy="288" r="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><circle cx="638" cy="288" r="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><circle cx="670" cy="288" r="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><circle cx="702" cy="288" r="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><circle cx="734" cy="288" r="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><circle cx="766" cy="288" r="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><circle cx="798" cy="288" r="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><circle cx="830" cy="288" r="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="450" y="332" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">31 of 50 (62%) said so: what people believe, not closures that were checked</text><rect x="30" y="356" width="408" height="185" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="389" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SOME VALUE</text><text x="50" y="415.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Direct experience</text><text x="50" y="443.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Shopkeepers have seen the high street change</text><text x="50" y="464.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">themselves.</text><rect x="462" y="356" width="408" height="185" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="482" y="389" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">WEAKNESSES</text><text x="482" y="415.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Small, interested, unchecked</text><text x="482" y="443.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="497.2" y="443.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">50 people in one town</text><text x="482" y="469.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="497.2" y="469.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Shopkeepers compete with the supermarket:</text><text x="497.2" y="490.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">a vested interest</text><text x="482" y="516.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="497.2" y="516.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Beliefs, not verified closures</text><rect x="30" y="570" width="840" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="606" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Judgement</text><text x="50" y="635.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">“Global chains destroy local business everywhere” is a generalisation the evidence cannot</text><text x="50" y="657.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">support.</text>
