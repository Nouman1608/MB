<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What 31 shopkeepers can and cannot prove</text>

<rect x="30" y="114" width="840" height="110" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="50" y="147" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FICTIONAL SOURCE: PELLMOOR</text><text x="50" y="173.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">“31 of 50 shopkeepers asked said a global supermarket had forced a</text><text x="50" y="198.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">neighbour to close, so global chains destroy local business.”</text><circle cx="62" cy="256" r="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="94" cy="256" r="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="126" cy="256" r="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="158" cy="256" r="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="190" cy="256" r="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="222" cy="256" r="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="254" cy="256" r="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="286" cy="256" r="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="318" cy="256" r="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="350" cy="256" r="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="382" cy="256" r="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="414" cy="256" r="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="446" cy="256" r="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="478" cy="256" r="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="510" cy="256" r="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="542" cy="256" r="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="574" cy="256" r="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="606" cy="256" r="12" fill="#