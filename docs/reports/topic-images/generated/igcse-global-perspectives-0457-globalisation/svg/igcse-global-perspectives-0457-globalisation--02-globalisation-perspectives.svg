<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 635" width="900" height="635" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="635" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Supportive, middle-ground and critical</text>

<rect x="30" y="104" width="268" height="253" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="137" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SUPPORTIVE</text><text x="50" y="163.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Opportunity</text><text x="50" y="191.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="191.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Cheaper goods for</text><text x="65.2" y="212.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">consumers</text><text x="50" y="238.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="238.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">New jobs in exporting</text><text x="65.2" y="259.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">countries</text><text x="50" y="285.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="285.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Spread of ideas and</text><text x="65.2" y="306.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">technology</text><text x="50" y="332.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="332.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Cultural exchange</text><rect x="316" y="104" width="268" height="253" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="336" y="137" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">MIDDLE GROUND</text><text x="336" y="163.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Managed trade</text><text x="336" y="191.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="351.2" y="191.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Accepts trade</text><text x="336" y="217.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="351.2" y="217.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Wants it managed: fair</text><text x="351.2" y="238.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">trade schemes, agreed</text><text x="351.2" y="259.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">labour standards</text><rect x="602" y="104" width="268" height="253" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="622" y="137" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">CRITICAL</text><text x="622" y="163.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Threat</text><text x="622" y="191.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="637.2" y="191.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Job losses in older</text><text x="637.2" y="212.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">industries</text><text x="622" y="238.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="637.2" y="238.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Pressure on wages and</text><text x="637.2" y="259.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">conditions</text><text x="622" y="285.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="637.2" y="285.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Environmental cost of</text><text x="637.2" y="306.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">transport</text><text x="622" y="332.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="637.2" y="332.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Loss of local culture</text><rect x="30" y="375" width="408" height="132" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="408" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">THOMAS FRIEDMAN (2005)</text><text x="50" y="433.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The World Is Flat</text><text x="50" y="461.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Technology was levelling the playing field</text><text x="50" y="482.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">for workers and firms.</text><rect x="462" y="375" width="408" height="132" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="482" y="408" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">JOSEPH STIGLITZ (2002)</text><text x="482" y="433.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Globalization and Its Discontents</text><text x="482" y="461.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Global rules were often managed in ways that</text><text x="482" y="482.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">harmed poorer countries.</text><rect x="30" y="525" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="558.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A factory owner selling abroad and a worker whose factory moved overseas see the same</text><text x="50" y="580.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">change differently, because of what each stands to gain or lose.</text>
</svg>