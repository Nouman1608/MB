<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 654" width="900" height="654" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="654" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What drove globalisation, and what it risks</text>

<line x1="50" y1="320" x2="860" y2="320" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><text x="50" y="128" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="start">CAUSES</text><text x="50" y="372" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">CONSEQUENCES</text><rect x="15" y="140" width="230" height="152" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="27" y="165" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">1956</text><text x="27" y="188.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">First container ship</text><text x="27" y="209.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">voyage</text><text x="27" y="236" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">McLean’s Ideal X: moving</text><text x="27" y="256" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">goods by sea got far</text><text x="27" y="276" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">cheaper</text><line x1="130" y1="290" x2="130" y2="310" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="130" cy="320" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><rect x="305" y="140" width="230" height="150" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="317" y="165" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">1995</text><text x="317" y="188.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">World Trade</text><text x="317" y="209.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Organization begins</text><text x="317" y="236" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Sets and oversees trade</text><text x="317" y="256" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">rules</text><line x1="420" y1="290" x2="420" y2="310" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="420" cy="320" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><rect x="585" y="140" width="230" height="150" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="597" y="165" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">INTERNET</text><text x="597" y="188.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Digital communication</text><text x="597" y="215" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Firms manage teams and</text><text x="597" y="235" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">suppliers in many</text><text x="597" y="255" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">countries at once</text><line x1="700" y1="290" x2="700" y2="310" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="700" cy="320" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><line x1="300" y1="330" x2="300" y2="390" stroke="#2e6b62" stroke-width="2.5"/><circle cx="300" cy="320" r="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><rect x="160" y="390" width="280" height="130" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="172" y="415" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">2020–2021</text><text x="172" y="439.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Worldwide chip shortage</text><text x="172" y="466" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Chips are made in few places; car</text><text x="172" y="486" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">makers cut production</text><line x1="640" y1="330" x2="640" y2="390" stroke="#2e6b62" stroke-width="2.5"/><circle cx="640" cy="320" r="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><rect x="500" y="390" width="280" height="134" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="512" y="415" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">MARCH 2021</text><text x="512" y="439.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Ever Given blocks Suez</text><text x="512" y="461.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Canal</text><text x="512" y="488" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Six days of delays for goods for</text><text x="512" y="508" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">many countries</text><rect x="30" y="542" width="840" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="578" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Evaluation point</text><text x="50" y="607.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">One dramatic event shows that a risk exists, not how often it happens. Use it as an</text><text x="50" y="629.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">example, not proof of a trend.</text>
</svg>