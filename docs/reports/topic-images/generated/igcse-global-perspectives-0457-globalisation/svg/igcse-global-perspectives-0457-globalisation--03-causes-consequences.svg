<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 894" width="900" height="894" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="894" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What drove globalisation, and what it risks</text>

<text x="450" y="124" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="middle">Causes</text><rect x="30" y="150" width="268" height="156" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="183" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">1956</text><text x="50" y="208.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Container shipping</text><text x="50" y="236.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">McLean’s Ideal X sails;</text><text x="50" y="257.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">moving goods across oceans</text><text x="50" y="278.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">gets far cheaper.</text><rect x="316" y="150" width="268" height="156" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="336" y="183" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">1 JANUARY 1995</text><text x="336" y="208.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">World Trade</text><text x="336" y="232.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Organization</text><text x="336" y="260.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Sets and oversees rules for</text><text x="336" y="281.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">trade between members.</text><rect x="602" y="150" width="268" height="156" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="622" y="183" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">THE INTERNET</text><text x="622" y="208.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Digital communication</text><text x="622" y="236.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Firms manage teams and</text><text x="622" y="257.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">suppliers in many countries</text><text x="622" y="278.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">at once.</text><line x1="165" y1="308" x2="450" y2="350" stroke="#1e2a44" stroke-width="3"/><line x1="450" y1="308" x2="450" y2="350" stroke="#1e2a44" stroke-width="3"/><line x1="735" y1="308" x2="450" y2="350" stroke="#1e2a44" stroke-width="3"/><line x1="450" y1="350" x2="450" y2="370" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="230" y="388" width="440" height="86" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="423.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Long supply chains across many</text><text x="450" y="448.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">countries</text><line x1="450" y1="478" x2="240" y2="514" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="450" y1="478" x2="660" y2="514" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="450" y="548" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">Consequences</text><rect x="30" y="570" width="408" height="156" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="603" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">2020–2021</text><text x="50" y="628.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Worldwide shortage of computer</text><text x="50" y="652.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">chips</text><text x="50" y="680.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Chips are made in a few places; many car</text><text x="50" y="701.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">makers cut production.</text><rect x="462" y="570" width="408" height="156" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="482" y="603" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">MARCH 2021</text><text x="482" y="628.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Ever Given blocks the Suez Canal</text><text x="482" y="656.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Six days, delaying goods for many countries.</text><rect x="30" y="744" width="840" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="780" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Evaluation point</text><text x="50" y="809.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">One dramatic event shows that a risk exists, not how often it happens. Use it as an</text><text x="50" y="831.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">example, not proof of a trend.</text>
</svg>