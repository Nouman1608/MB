<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 602" width="900" height="602" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="602" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Five actions on globalisation issues</text>

<rect x="30" y="104" width="250" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="42" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Action</text><rect x="280" y="104" width="320" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="292" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Possible benefit</text><rect x="600" y="104" width="270" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="612" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Possible drawback</text><rect x="30" y="150" width="250" height="64" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="175.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Fair trade labelling</text><rect x="280" y="150" width="320" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="292" y="175.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Consumers can choose to support</text><text x="292" y="196.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">better pay</text><rect x="600" y="150" width="270" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="612" y="175.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Covers only some products;</text><text x="612" y="196.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">costs more</text><rect x="30" y="214" width="250" height="106" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="239.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">International tax</text><text x="42" y="260.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">agreements</text><rect x="280" y="214" width="320" height="106" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="292" y="239.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">2021: over 130 countries agreed,</text><text x="292" y="260.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">through the OECD, a 15% global</text><text x="292" y="281.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">minimum tax for large</text><text x="292" y="302.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">multinationals</text><rect x="600" y="214" width="270" height="106" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="612" y="239.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Each country must put it into</text><text x="612" y="260.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">law; progress uneven</text><rect x="30" y="320" width="250" height="64" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="345.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Tariffs on imports</text><rect x="280" y="320" width="320" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="292" y="345.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">May protect home jobs</text><rect x="600" y="320" width="270" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="612" y="345.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Higher prices; other</text><text x="612" y="366.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">countries may respond</text><rect x="30" y="384" width="250" height="64" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="409.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">“Buy local” campaigns</text><rect x="280" y="384" width="320" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="292" y="409.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Supports local firms; cuts</text><text x="292" y="430.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">transport</text><rect x="600" y="384" width="270" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="612" y="409.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Local goods may cost more,</text><text x="612" y="430.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">hitting poorer households</text><rect x="30" y="448" width="250" height="64" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="473.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Spreading suppliers</text><text x="42" y="494.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">across countries</text><rect x="280" y="448" width="320" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="292" y="473.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Lowers supply-chain risk</text><rect x="600" y="448" width="270" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="612" y="473.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Higher cost for firms</text><rect x="134.28750000000002" y="530" width="161.075" height="42" rx="21" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="214.82500000000002" y="557.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Likely effect</text><rect x="307.3625" y="530" width="209.95" height="42" rx="21" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="412.3375" y="557.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Who carries it out</text><rect x="529.3125" y="530" width="73.1" height="42" rx="21" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="565.8625" y="557.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Cost</text><rect x="614.4125" y="530" width="151.29999999999998" height="42" rx="21" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="690.0625" y="557.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Side effects</text>
</svg>