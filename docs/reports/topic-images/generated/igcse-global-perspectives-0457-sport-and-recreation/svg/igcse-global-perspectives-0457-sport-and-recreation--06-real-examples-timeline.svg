font-weight="700" fill="#1e2a44" text-anchor="start">Asian Games, Hangzhou</text><circle cx="60" cy="590" r="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="90" y="597" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">2024</text><rect x="170" y="560" width="330" height="80" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="190" y="593.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Paris Olympics: equal athlete</text><text x="190" y="615.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">places for women and men</text><rect x="530" y="160" width="340" height="150" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="550" y="193" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">EVALUATION POINT</text><text x="550" y="218.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Enforcement</text><text x="550" y="246" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Critics debate how consistently</text><text x="550" y="266" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">anti-doping rules are enforced across</text><text x="550" y="286" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">countries and sports.</text><rect x="530" y="325" width="340" height="130" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="550" y="358" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">EVALUATION POINT</text><text x="550" y="383.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Elite is not local</text><text x="550" y="411" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Equal places at the Olympics do not</text><text x="550" y="431" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">show what happens in local clubs.</text><rect x="530" y="475" width="340" height="150" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="550" y="508" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">CONTESTED</text><text x="550" y="533.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Are esports sport?</text><text x="550" y="561" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Skill, teamwork, a huge audience; or</text><text x="550" y="581" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">no physical exertion and worries about</text><text x="550" y="601" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">screen time.</text>
