<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 721" width="900" height="721" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="721" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A city bids for a championship: whose interests first?</text>

<rect x="30" y="104" width="840" height="85" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="50" y="137" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FICTIONAL CITY OF DUNMERE</text><text x="50" y="163.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The council wants to bid for a continental athletics championship</text><line x1="215" y1="257" x2="685" y2="257" stroke="#1e2a44" stroke-width="7" stroke-linecap="round"/><path d="M450,257 L420,349 L480,349 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><circle cx="450" cy="257" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><line x1="215" y1="257" x2="160" y2="312" stroke="#1e2a44" stroke-width="2.5"/><line x1="215" y1="257" x2="270" y2="312" stroke="#1e2a44" stroke-width="2.5"/><path d="M140,312 L290,312 Q275,339 215,339 Q155,339 140,312 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><line x1="685" y1="257" x2="630" y2="312" stroke="#1e2a44" stroke-width="2.5"/><line x1="685" y1="257" x2="740" y2="312" stroke="#1e2a44" stroke-width="2.5"/><path d="M610,312 L760,312 Q745,339 685,339 Q625,339 610,312 Z" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="215" y="361" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">council</text><text x="685" y="361" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">residents</text><rect x="30" y="385" width="405" height="162" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="421" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">The council</text><text x="50" y="449.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="449.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Visitors and a better city image</text><text x="50" y="475.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="475.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Inspire young people to take up sport</text><text x="50" y="501.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="501.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Value: growth and national pride</text><rect x="465" y="385" width="405" height="162" rx="14" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="485" y="421" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="start">Residents near the stadium</text><text x="485" y="449.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="500.2" y="449.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Higher rents; loss of a park used every</text><text x="500.2" y="470.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">day</text><text x="485" y="496.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="500.2" y="496.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The event lasts only ten days</text><text x="485" y="522.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="500.2" y="522.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Value: local wellbeing over image</text><rect x="30" y="565" width="268" height="126" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="164" y="598.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Sponsors and</text><text x="164" y="620.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">broadcasters</text><text x="164" y="647" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">a vested interest: a</text><text x="164" y="667" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">financial stake</text><rect x="316" y="565" width="268" height="126" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="598.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Governing bodies</text><text x="450" y="625" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">set rules, award events, earn</text><text x="450" y="645" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">from them</text><rect x="602" y="565" width="268" height="126" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="736" y="598.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Taxpayers</text><text x="736" y="625" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">could the money do more</text><text x="736" y="645" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">elsewhere?</text>
</svg>