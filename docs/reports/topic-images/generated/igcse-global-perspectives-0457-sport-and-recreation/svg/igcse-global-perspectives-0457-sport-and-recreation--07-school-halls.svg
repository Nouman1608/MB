<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 583" width="900" height="583" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="583" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Assessing an action: open school halls in the evening</text>

<rect x="30" y="104" width="170" height="70" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="115" y="146" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Knowledge</text><rect x="214" y="104" width="656" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="230" y="132.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Opening school sports halls to the public in the evenings can raise</text><text x="230" y="153.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">participation.</text><rect x="30" y="186" width="170" height="70" rx="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="115" y="228" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Application</text><rect x="214" y="186" width="656" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="230" y="214.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Where families say no affordable facility is nearby, it uses existing</text><text x="230" y="235.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">buildings: the cost is mainly staff and cleaning.</text><rect x="30" y="268" width="170" height="70" rx="14" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="115" y="310" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Analysis</text><rect x="214" y="268" width="656" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="230" y="296.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">It tackles the cause, because the barrier is access, not interest, and</text><text x="230" y="317.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">reaches families who cannot pay for gyms.</text><rect x="30" y="350" width="170" height="91" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="115" y="402.5" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Evaluation</text><rect x="214" y="350" width="656" height="91" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="230" y="378.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">May miss people who work long hours or feel unwelcome at school, and</text><text x="230" y="399.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">supervision must be paid every year. A cost-effective first step, best</text><text x="230" y="420.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">alongside reduced club fees.</text><rect x="55.80000000000001" y="459" width="153.6" height="42" rx="21" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="132.60000000000002" y="485.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Effectiveness</text><rect x="221.4" y="459" width="172" height="42" rx="21" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="307.4" y="485.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Cost: who pays?</text><rect x="405.4" y="459" width="107.6" height="42" rx="21" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="459.2" y="485.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Fairness</text><rect x="525" y="459" width="144.39999999999998" height="42" rx="21" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="597.2" y="485.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Side effects</text><rect x="681.4" y="459" width="162.79999999999998" height="42" rx="21" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="762.8" y="485.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Sustainability</text><rect x="391.6" y="511" width="116.8" height="42" rx="21" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="537.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Who acts?</text>
</svg>