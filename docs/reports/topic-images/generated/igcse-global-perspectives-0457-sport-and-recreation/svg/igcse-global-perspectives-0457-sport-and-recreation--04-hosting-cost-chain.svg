<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 757" width="900" height="757" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="757" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The cost of hosting: one consequence causes the next</text>

<rect x="30" y="104" width="840" height="84" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="137" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">CAUSE</text><text x="50" y="162.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Bids made years ahead with optimistic budgets</text><line x1="450" y1="193" x2="450" y2="219" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="224" width="840" height="111" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="257" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CONSEQUENCE</text><text x="50" y="282.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Final costs can be far higher</text><text x="50" y="310.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Montreal 1976: Olympic Stadium debt not fully paid until 2006, about 30 years later.</text><line x1="450" y1="340" x2="450" y2="366" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="371" width="840" height="111" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="404" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CONSEQUENCE</text><text x="50" y="429.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Some regions decide the cost is not worth it</text><text x="50" y="457.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">July 2023: Victoria withdrew from the 2026 Commonwealth Games, citing an estimated A$6–7 billion.</text><line x1="450" y1="487" x2="450" y2="513" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="518" width="840" height="111" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="551" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CONSEQUENCE</text><text x="50" y="576.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Organisers look for cheaper models</text><text x="50" y="604.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">2026 Commonwealth Games move to Glasgow: 10 sports, existing venues, no athletes’ village.</text><rect x="30" y="647" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="680.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Say who is affected: Quebec taxpayers paid for the stadium for three decades, money not</text><text x="50" y="702.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">spent on other services.</text>
</svg>