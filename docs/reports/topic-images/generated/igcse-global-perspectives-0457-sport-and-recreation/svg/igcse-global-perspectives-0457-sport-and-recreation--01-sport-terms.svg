<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 707" width="900" height="707" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="707" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">From the park to the podium: key terms</text>

<rect x="240" y="104" width="420" height="95" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="133.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Mega-event</text><text x="450" y="161" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">A very large international event, such as the</text><text x="450" y="181" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">Olympic Games or a football World Cup</text><rect x="150" y="207" width="600" height="75" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="236.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Elite sport</text><text x="450" y="264" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">Top-level competition by professional or national-team athletes</text><rect x="70" y="290" width="760" height="75" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="319.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Grassroots sport</text><text x="450" y="347" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">Everyday participation in local clubs, schools and parks</text><rect x="30" y="373" width="840" height="75" rx="14" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="402.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Recreation</text><text x="450" y="430" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">Activity for enjoyment in free time: walking, cycling, swimming, using a park</text><rect x="30" y="466" width="840" height="113" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="499" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">LEGACY</text><text x="50" y="525.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The long-term effects an event leaves behind</text><text x="50" y="554.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Venues, transport, debt, or changes in participation.</text><rect x="30" y="597" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="630.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">UN 2030 Agenda (2015): “Sport is also an important enabler of sustainable development.” A</text><text x="50" y="652.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">value claim about what sport can do, not evidence that it has.</text>
</svg>