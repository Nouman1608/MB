<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 522" width="900" height="522" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="522" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How one decision travels down the levels</text>

<rect x="30" y="104" width="250.66666666666666" height="132" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="149" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">GLOBAL</text><text x="50" y="174.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">An international</text><text x="50" y="198.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">body awards an event</text><line x1="286.66666666666663" y1="170" x2="318.66666666666663" y2="170" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="324.66666666666663" y="104" width="250.66666666666666" height="132" rx="14" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><text x="344.66666666666663" y="149" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">NATIONAL</text><text x="344.66666666666663" y="174.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">A government spends</text><text x="344.66666666666663" y="198.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">public money</text><line x1="581.3333333333333" y1="170" x2="613.3333333333333" y2="170" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="619.3333333333333" y="104" width="250.66666666666666" height="132" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="639.3333333333333" y="137" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">LOCAL</text><text x="639.3333333333333" y="162.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">A new stadium, new</text><text x="639.3333333333333" y="186.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">transport, or the</text><text x="639.3333333333333" y="210.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">loss of a local park</text><rect x="30" y="254" width="160" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="42" y="284" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Level</text><rect x="190" y="254" width="680" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="202" y="284" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Example issues that divide opinion</text><rect x="30" y="300" width="160" height="64" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="325.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Global</text><rect x="190" y="300" width="680" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="202" y="325.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Cost and legacy of mega-events; doping; equal pay and coverage for women’s</text><text x="202" y="346.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">sport; whether esports count</text><rect x="30" y="364" width="160" height="64" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="389.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">National</text><rect x="190" y="364" width="680" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="202" y="389.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Elite medals or community sport; PE time in schools; gambling sponsorship;</text><text x="202" y="410.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">ticket prices</text><rect x="30" y="428" width="160" height="64" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="453.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Local</text><rect x="190" y="428" width="680" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="202" y="453.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Playing fields sold for housing; club fees; safe cycling routes; access for</text><text x="202" y="474.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">disabled people</text>
</svg>