<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 822" width="900" height="822" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="822" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Testing a “40,000 jobs” promise</text>

<rect x="30" y="114" width="840" height="112" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="50" y="147" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FICTIONAL DUNMERE BID COMMITTEE</text><text x="50" y="174" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">“Hosting the championship will create 40,000 jobs and inspire a</text><text x="50" y="200" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">generation.”</text><text x="30" y="260" font-size="17" font-weight="600" fill="#4a5568" text-anchor="start">If, say, the jobs broke down like this:</text><rect x="30" y="270" width="651" height="64" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><rect x="681" y="270" width="189" height="64" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="355.5" y="300" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">31,000 last only for the event</text><text x="355.5" y="322" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">(an illustration, not a real figure)</text><text x="775.5" y="300" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">9,000</text><text x="775.5" y="322" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">lasting</text><rect x="40" y="377.5" width="40" height="40" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><path d="M51,388.5 l18,18 m0,-18 l-18,18" fill="none" stroke="#b5602e" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><rect x="94" y="360" width="776" height="75" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="108" y="388.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Vested interest</text><text x="108" y="416.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The bid committee wants public support.</text><rect x="40" y="460.5" width="40" height="40" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><path d="M51,471.5 l18,18 m0,-18 l-18,18" fill="none" stroke="#b5602e" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><rect x="94" y="443" width="776" height="75" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="108" y="471.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">A prediction</text><text x="108" y="499.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">“Will create” cannot be checked yet.</text><rect x="40" y="543.5" width="40" height="40" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><path d="M51,554.5 l18,18 m0,-18 l-18,18" fill="none" stroke="#b5602e" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><rect x="94" y="526" width="776" height="75" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="108" y="554.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">What counts as a job?</text><text x="108" y="582.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The figure is not broken down; lasting jobs could be under a quarter.</text><rect x="40" y="626.5" width="40" height="40" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><path d="M51,637.5 l18,18 m0,-18 l-18,18" fill="none" stroke="#b5602e" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><rect x="94" y="609" width="776" height="75" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="108" y="637.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">“Inspire a generation”</text><text x="108" y="665.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">An emotive slogan with no measure of how it would be tested.</text><rect x="30" y="702" width="840" height="90" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="738" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Judgement</text><text x="50" y="767.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Weakly supported until independent figures are available.</text>
</svg>