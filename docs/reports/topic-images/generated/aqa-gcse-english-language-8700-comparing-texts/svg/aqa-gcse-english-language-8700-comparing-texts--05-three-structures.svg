<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 713" width="900" height="713" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="713" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three ways to organise a comparison</text>

<rect x="30" y="100" width="840" height="150" rx="14" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="54" y="138" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Integrated (point by point)</text><text x="846" y="138" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="end">comparison constant</text><rect x="54" y="172" width="62" height="38" rx="8" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><text x="85" y="197" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">A</text><rect x="120" y="172" width="62" height="38" rx="8" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="151" y="197" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">B</text><rect x="204" y="172" width="62" height="38" rx="8" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><text x="235" y="197" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">A</text><rect x="270" y="172" width="62" height="38" rx="8" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="301" y="197" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">B</text><rect x="354" y="172" width="62" height="38" rx="8" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><text x="385" y="197" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">A</text><rect x="420" y="172" width="62" height="38" rx="8" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="451" y="197" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">B</text><rect x="504" y="172" width="62" height="38" rx="8" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><text x="535" y="197" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">A</text><rect x="570" y="172" width="62" height="38" rx="8" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="601" y="197" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">B</text><text x="54" y="236" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Each paragraph takes one aspect and moves between both sources.</text><rect x="30" y="266" width="840" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="304" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Alternating blocks</text><text x="846" y="304" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="end">can work</text><rect x="54" y="338" width="62" height="38" rx="8" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><text x="85" y="363" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">A</text><rect x="138" y="338" width="62" height="38" rx="8" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="169" y="363" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">B</text><rect x="222" y="338" width="62" height="38" rx="8" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><text x="253" y="363" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">A</text><rect x="306" y="338" width="62" height="38" rx="8" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="337" y="363" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">B</text><path d="M169,336 C169,318 85,318 85,334" fill="none" stroke="#2e6b62" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahT)"/><path d="M337,336 C337,318 253,318 253,334" fill="none" stroke="#2e6b62" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahT)"/><text x="54" y="402" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Works only if every Source B paragraph refers back to Source A.</text><rect x="30" y="432" width="840" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="470" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Two separate essays</text><text x="846" y="470" font-size="17" font-weight="700" fill="#b5602e" text-anchor="end">tends to stay in lower levels</text><rect x="54" y="504" width="62" height="38" rx="8" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><text x="85" y="529" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">A</text><rect x="120" y="504" width="62" height="38" rx="8" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><text x="151" y="529" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">A</text><rect x="186" y="504" width="62" height="38" rx="8" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><text x="217" y="529" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">A</text><rect x="270" y="504" width="62" height="38" rx="8" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="301" y="529" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">B</text><rect x="336" y="504" width="62" height="38" rx="8" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="367" y="529" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">B</text><rect x="402" y="504" width="62" height="38" rx="8" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="433" y="529" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">B</text><rect x="486" y="504" width="62" height="38" rx="8" fill="#d4b02e" stroke="#8a6d0d" stroke-width="2"/><text x="517" y="529" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">A·B</text><text x="54" y="568" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Describes one source in full, then the other, and compares only at the end.</text><rect x="30" y="598" width="840" height="85" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="631.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Plan three or four aspects and give each a paragraph.</text><text x="48" y="660.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">For example: overall perspective, tone and voice, use of evidence, and endings.</text>
</svg>