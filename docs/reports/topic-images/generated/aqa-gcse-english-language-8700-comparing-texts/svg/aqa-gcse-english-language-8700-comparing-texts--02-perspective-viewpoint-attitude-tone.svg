<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 653" width="900" height="653" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="653" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Perspective, viewpoint, attitude, tone</text>

<rect x="30" y="100" width="350" height="210" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="133" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">THE WIDER WAY OF SEEING</text><text x="50" y="160" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Perspective</text><text x="50" y="189.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Shaped by experience, time and</text><text x="50" y="211.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">values</text><text x="50" y="238.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">“a scientist who has watched</text><text x="50" y="260.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">animals pace their cages”</text><rect x="520" y="100" width="350" height="210" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="540" y="133" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">THE POSITION TAKEN</text><text x="540" y="160" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Viewpoint</text><text x="540" y="189.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">The writer’s position on an issue</text><text x="540" y="216.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">“zoos should close”</text><rect x="30" y="336" width="350" height="180" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="369" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">THE FEELING</text><text x="50" y="396" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Attitude</text><text x="50" y="425.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">How the writer feels towards the</text><text x="50" y="447.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">subject</text><text x="50" y="474.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">admiring · scornful · anxious</text><rect x="520" y="336" width="350" height="180" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="540" y="369" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">HOW IT SOUNDS ON THE PAGE</text><text x="540" y="396" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Tone</text><text x="540" y="425.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">How the attitude sounds</text><text x="540" y="452.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">ironic · solemn · urgent · playful</text><line x1="390" y1="205" x2="510" y2="205" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="450" y="192" font-size="17" font-weight="600" fill="#4a5568" text-anchor="middle">produces</text><line x1="390" y1="426" x2="510" y2="426" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="450" y="413" font-size="17" font-weight="600" fill="#4a5568" text-anchor="middle">sounds as</text><rect x="30" y="538" width="840" height="85" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="571.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Same viewpoint, different perspective</text><text x="48" y="600.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Two writers both criticise a city’s poverty: one writes from pity, the other from anger.</text>
</svg>