<rect width="900" height="706" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What “methods” can mean</text>

<rect x="30" y="100" width="270" height="131" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="136" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Vocabulary</text><text x="50" y="164.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">emotive language, a</text><text x="50" y="185.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">semantic field, formal or</text><text x="50" y="206.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">informal register</text><rect x="315" y="100" width="270" height="131" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="335" y="136" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Grammar</text><text x="335" y="164.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">sentence lengths,</text><text x="335" y="185.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">questions, imperatives,</text><text x="335" y="206.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">“we” or “you”, modal verbs</text><rect x="600" y="100" width="270" height="131" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="620" y="136" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Form</text><text x="620" y="164.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">letter, diary, newspaper</text><text x="620" y="185.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">column, speech, travel</text><text x="620" y="206.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">writing</text><rect x="172.5" y="247" width="270" height="131" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="192.5" y="283" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Structure</text><text x="192.5" y="311.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">how each text opens, turns</text><text x="192.5" y="332.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">and ends; order of anecdote</text><text x="192.5" y="353.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">and argument</text><rect x="457.5" y="247" width="270" height="131" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477.5" y="283" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Evidence and voice</text><text x="477.5" y="311.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">personal experience,</text><text x="477.5" y="332.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">statistics, expert opinion,</text><text x="477.5" y="353.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">humour, irony</text><text x="450" y="422" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Compare like with like</text><text x="270" y="458" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Source A</text><text x="630" y="458" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="middle">Source B</text><rect x="155" y="476" width="230" height="33" rx="16.5" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="270" y="498.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">opening</text><rect x="515" y="476" width="230" height="33" rx="16.5" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="630" y="498.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">opening</text><line x1="392" y1="493" x2="508" y2="493" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="508" y1="493" x2="392" y2="493" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="155" y="534" width="230" height="33" rx="16.5" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="270" y="556.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">ending</text><rect x="515" y="534" width="230" height="33" rx="16.5" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="630" y="556.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">ending</text><line x1="392" y1="551" x2="508" y2="551" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="508" y1="551" x2="392" y2="551" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="155" y="592" width="230" height="33" rx="16.5" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="270" y="614.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">use of anecdote</text><rect x="515" y="592" width="230" height="33" rx="16.5" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="630" y="614.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">use of anecdote</text><line x1="392" y1="609" x2="508" y2="609" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="508" y1="609" x2="392" y2="609" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="450" y="668" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Pairing methods of the same kind makes a difference visible rather than asserted.</text>
</svg>