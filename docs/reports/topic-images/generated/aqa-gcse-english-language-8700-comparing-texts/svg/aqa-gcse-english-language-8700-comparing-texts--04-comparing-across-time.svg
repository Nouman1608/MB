<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 552" width="900" height="552" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="552" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Using the gap between centuries</text>

<rect x="30" y="100" width="200" height="47" fill="#1e2a44"/><rect x="230" y="100" width="320" height="47" fill="#1e2a44"/><text x="390" y="129.3" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">19th-century source</text><rect x="550" y="100" width="320" height="47" fill="#1e2a44"/><text x="710" y="129.3" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Modern source</text><rect x="30" y="147" width="200" height="74" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="186.76" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Audience</text><rect x="230" y="147" width="320" height="74" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="244" y="174.76" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">A letter may be written to one</text><text x="244" y="198.76" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">person</text><rect x="550" y="147" width="320" height="74" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="564" y="174.76" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">An article may be written to</text><text x="564" y="198.76" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">thousands of strangers</text><rect x="30" y="221" width="200" height="98" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="272.76" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Conventions</text><rect x="230" y="221" width="320" height="98" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="244" y="260.76" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Long, balanced sentences and</text><text x="244" y="284.76" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">formal address were normal</text><rect x="550" y="221" width="320" height="98" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2"/><text x="564" y="248.76" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">Treat the older style as</text><text x="564" y="272.76" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">choices that shape tone, not as</text><text x="564" y="296.76" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“old-fashioned language”</text><rect x="30" y="319" width="200" height="74" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="358.76" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Assumptions</text><rect x="230" y="319" width="320" height="74" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="244" y="346.76" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">What one writer takes for</text><text x="244" y="370.76" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">granted…</text><rect x="550" y="319" width="320" height="74" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="564" y="358.76" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">…the other may question</text><rect x="30" y="100" width="840" height="293" rx="4" fill="none" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="415" width="840" height="107" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="448.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Assumptions are often the clearest evidence of perspective.</text><text x="48" y="477.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Keep context brief and tied to the text: one clause explaining why a writer might think as</text><text x="48" y="499.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">they do is enough.</text>
</svg>