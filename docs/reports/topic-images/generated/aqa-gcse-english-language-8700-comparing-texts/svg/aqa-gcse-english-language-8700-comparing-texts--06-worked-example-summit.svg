<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 569" width="900" height="569" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="569" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: two writers at a summit</text>

<rect x="30" y="100" width="170" height="47" fill="#1e2a44"/><text x="115" y="129.3" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Aspect</text><rect x="200" y="100" width="335" height="47" fill="#2e6b62"/><text x="367.5" y="129.3" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Source A (19th-century letter)</text><rect x="535" y="100" width="335" height="47" fill="#8a6d0d"/><text x="702.5" y="129.3" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Source B (modern column)</text><rect x="30" y="147" width="170" height="48" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="173.94" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Perspective</text><rect x="200" y="147" width="335" height="48" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="214" y="173.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Reverent awe at the mountain</text><rect x="535" y="147" width="335" height="48" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="549" y="173.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Summit spoiled by the crowd</text><rect x="30" y="195" width="170" height="122" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="258.94" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Method</text><rect x="200" y="195" width="335" height="122" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="214" y="221.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Silence: “could not speak”</text><text x="214" y="251.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Simile: “like the folds of some</text><text x="214" y="273.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">vast garment” makes the landscape</text><text x="214" y="295.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">seem immense</text><rect x="535" y="195" width="335" height="122" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="549" y="221.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Short, deflating opening: “There</text><text x="549" y="243.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">was a queue at the summit”</text><text x="549" y="273.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Minor sentence “An actual queue”:</text><text x="549" y="295.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">exasperated disbelief</text><rect x="30" y="317" width="170" height="122" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="380.94" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Ending</text><rect x="200" y="317" width="335" height="122" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="214" y="343.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Looks upward to “the hand that made</text><text x="214" y="365.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">these heights”</text><text x="214" y="395.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A religious perspective many</text><text x="214" y="417.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">readers then shared</text><rect x="535" y="317" width="335" height="122" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="549" y="343.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A question: what “we had all come</text><text x="549" y="365.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">up here to find”</text><text x="549" y="395.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Unsure the experience has any</text><text x="549" y="417.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">meaning left</text><rect x="30" y="100" width="840" height="339" rx="4" fill="none" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="483" font-size="18" font-weight="400" fill="#4a5568" text-anchor="middle">Linked in the paragraph with</text><rect x="211" y="499" width="150" height="33" rx="16.5" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="286" y="521.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">whereas</text><rect x="375" y="499" width="150" height="33" rx="16.5" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="450" y="521.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">in contrast</text><rect x="539" y="499" width="150" height="33" rx="16.5" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="614" y="521.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">where</text>
</svg>