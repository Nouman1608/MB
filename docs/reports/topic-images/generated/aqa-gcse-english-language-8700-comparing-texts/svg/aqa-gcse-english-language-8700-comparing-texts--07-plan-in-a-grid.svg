<rect width="900" height="709" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Plan in a grid before you write</text>

<rect x="30" y="100" width="240" height="47" fill="#1e2a44"/><text x="150" y="129.3" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Aspect</text><rect x="270" y="100" width="300" height="47" fill="#2e6b62"/><text x="420" y="129.3" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Source A</text><rect x="570" y="100" width="300" height="47" fill="#8a6d0d"/><text x="720" y="129.3" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Source B</text><rect x="30" y="147" width="240" height="52" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="175.76" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Overall perspective</text><rect x="270" y="147" width="300" height="52" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><rect x="570" y="147" width="300" height="52" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><rect x="30" y="199" width="240" height="52" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="227.76" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Tone and voice</text><rect x="270" y="199" width="300" height="52" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><rect x="570" y="199" width="300" height="52" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><rect x="30" y="251" width="240" height="52" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="279.76" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Use of evidence</text><rect x="270" y="251" width="300" height="52" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><rect x="570" y="251" width="300" height="52" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><rect x="30" y="303" width="240" height="52" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="331.76" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Endings</text><rect x="270" y="303" width="300" height="52" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><rect x="570" y="303" width="300" height="52" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><rect x="30" y="100" width="840" height="255" rx="4" fill="none" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="377" width="410" height="168" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="410" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CHECKLIST</text><text x="50" y="437" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">The question’s three reminders</text><text x="50" y="466.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="466.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Compare perspectives</text><text x="50" y="493.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="493.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Compare methods</text><text x="50" y="520.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="520.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Refer to both texts</text><rect x="460" y="377" width="410" height="168" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="480" y="410" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EACH PARAGRAPH</text><text x="480" y="437" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Lead with perspective, follow</text><text x="480" y="463" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">with method</text><text x="480" y="492.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Open with a comparative judgement, then</text><text x="480" y="514.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">evidence it.</text><rect x="30" y="567" width="840" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="605" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">Weak links:</text><rect x="230" y="583" width="69" height="33" rx="16.5" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><text x="264.5" y="605.62" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">also</text><rect x="311" y="583" width="59" height="33" rx="16.5" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><text x="340.5" y="605.62" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">and</text><text x="54" y="655" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Comparing links:</text><rect x="230" y="633" width="98" height="33" rx="16.5" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="279" y="655.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">whereas</text><rect x="340" y="633" width="137" height="33" rx="16.5" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="408.5" y="655.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">in contrast</text><rect x="489" y="633" width="117" height="33" rx="16.5" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="547.5" y="655.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">similarly</text><rect x="618" y="633" width="88" height="33" rx="16.5" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="662" y="655.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">unlike</text>
</svg>