<rect width="900" height="543" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The (a) essay: from topic to argument</text>

<rect x="90" y="120" width="780" height="85" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="110" y="153" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">A TOPIC</text><text x="110" y="179.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">“Waugh presents the country house as a refuge”</text><circle cx="52" cy="162.5" r="18" fill="#b5602e"/><path d="M44.8,155.3 l14.4,14.4 m0,-14.4 l-14.4,14.4" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><line x1="450" y1="211" x2="450" y2="245" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="470" y="235" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">take a position</text><rect x="90" y="253" width="780" height="120" rx="14" fill="#f2e7b8" stroke="#2e6b62" stroke-width="2.5"/><text x="110" y="286" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">AN ARGUMENT</text><text x="110" y="312.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">“Waugh presents the country house as a refuge</text><circle cx="52" cy="313" r="18" fill="#2e6b62"/><path d="M43.9,313.36 l5.76,6.12 l10.799999999999999,-11.88" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="106" y="335" width="457.92499999999995" height="30" rx="5" fill="#d4b02e"/><text x="111" y="357" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">that its owner mistakes for a moral order”</text><rect x="30" y="395" width="270.6666666666667" height="124" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="437.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Moments across the text</text><text x="46" y="465.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Including the ending; say</text><text x="46" y="486.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">how the focus develops.</text><rect x="314.6666666666667" y="395" width="270.6666666666667" height="124" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="330.6666666666667" y="425.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Method in every</text><text x="330.6666666666667" y="449.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">paragraph</text><text x="330.6666666666667" y="477.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Voice, structure and</text><text x="330.6666666666667" y="498.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">language, not just events.</text><rect x="599.3333333333334" y="395" width="270.6666666666667" height="124" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="615.3333333333334" y="437.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Short quotations</text><text x="615.3333333333334" y="465.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Closed book: a bank of</text><text x="615.3333333333334" y="486.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">phrases learned in context.</text>
</svg>