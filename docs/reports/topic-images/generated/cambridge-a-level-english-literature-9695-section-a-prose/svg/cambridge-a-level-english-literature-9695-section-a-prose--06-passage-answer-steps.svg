<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 753" width="900" height="753" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="753" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The (b) passage answer: narration first</text>

<line x1="62" y1="140" x2="62" y2="601" stroke="#c9d6d4" stroke-width="4"/><rect x="108" y="120" width="762" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="155.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Locate the passage</text><text x="128" y="183.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">In a sentence: where it falls and what the reader already knows.</text><circle cx="62" cy="164" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="172.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="108" y="218" width="762" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="253.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">State its narrative function</text><text x="128" y="281.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">What it does to character, theme or the reader’s judgement. This is your thesis, in the</text><text x="128" y="302.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">question’s own words.</text><circle cx="62" cy="272.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="281.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="108" y="337" width="762" height="88" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="128" y="372.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Analyse the narration first</text><text x="128" y="400.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Who tells, who sees, and how close we are to a mind.</text><circle cx="62" cy="381" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="62" y="389.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="108" y="435" width="762" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="470.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Then language and structure</text><text x="128" y="498.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Sentence shape, imagery, dialogue, pace, the passage’s own turning point.</text><circle cx="62" cy="479" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="487.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="108" y="533" width="762" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="568.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Connect outward</text><text x="128" y="596.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Two or three times, to show knowledge of the whole text.</text><circle cx="62" cy="577" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="585.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><rect x="30" y="639" width="840" height="90" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="675" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Avoid</text><text x="50" y="704.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A (b) answer that drifts into a general essay leaves the printed passage behind.</text>
</svg>