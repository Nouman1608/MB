<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 588" width="900" height="588" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="588" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Short stories need a slightly different approach</text>

<text x="30" y="126" font-size="18" font-weight="700" fill="#4a5568" text-anchor="start">A novel</text><rect x="30" y="140" width="840" height="40" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="30" y="224" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">A short story is compressed</text><rect x="250" y="240" width="400" height="56" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><rect x="250" y="240" width="70" height="56" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><rect x="580" y="240" width="70" height="56" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5" stroke-dasharray="8 5"/><path d="M650,240 l26,0 M650,296 l26,0" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 5"/><path d="M450,248 L455.2900672706323,260.71884705062547 L469.0211303259031,261.819660112501 L458.55950864665635,270.78115294937453 L461.7557050458495,284.180339887499 L450,277 L438.2442949541505,284.180339887499 L441.44049135334365,270.78115294937453 L430.9788696740969,261.8196601125011 L444.7099327293677,260.71884705062547 Z" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><line x1="285" y1="298" x2="220" y2="350" stroke="#1e2a44" stroke-width="2"/><text x="212" y="355" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">the opening</text><text x="212" y="375" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">carries more weight</text><line x1="450" y1="298" x2="450" y2="344" stroke="#1e2a44" stroke-width="2"/><text x="450" y="364" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">a single image may</text><text x="450" y="384" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">hold the whole meaning</text><line x1="615" y1="298" x2="680" y2="350" stroke="#1e2a44" stroke-width="2"/><text x="688" y="355" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">endings are</text><text x="688" y="375" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">often open</text><text x="30" y="432" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">If an (a) question asks for a set number of stories</text><rect x="30" y="450" width="410" height="114" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="497.7" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Write about exactly that number</text><text x="50" y="527.1" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">No more and no fewer.</text><rect x="460" y="450" width="410" height="114" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="480" y="485.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Choose stories that build an</text><text x="480" y="510.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">argument</text><text x="480" y="539.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Not two that say the same thing.</text>
</svg>