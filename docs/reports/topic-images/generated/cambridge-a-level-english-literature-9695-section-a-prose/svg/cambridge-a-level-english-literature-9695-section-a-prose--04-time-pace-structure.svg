<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 796" width="900" height="796" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="796" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">When? Time, pace and order</text>

<text x="30" y="126" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Chronology</text><line x1="60" y1="224" x2="840" y2="224" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><text x="840" y="254" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">story time</text><circle cx="450" cy="224" r="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="260" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">the narrative “now”</text><path d="M440,210 Q330,144 200,212" fill="none" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><text x="300" y="162" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">analepsis (flashback)</text><path d="M460,210 Q580,144 710,212" fill="none" stroke="#b5602e" stroke-width="3.5" marker-end="url(#ahR)"/><text x="600" y="162" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">prolepsis (flash-forward)</text><text x="30" y="304" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Pace</text><text x="30" y="354" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">story time</text><text x="30" y="428" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">text</text><rect x="130" y="336" width="300" height="26" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><path d="M130,362 L250,410 L290,410 L430,362 Z" fill="#f2e7b8" opacity="0.6"/><rect x="250" y="410" width="40" height="26" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="280" y="328" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Summary: years</text><text x="270" y="462" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">in a sentence</text><rect x="620" y="336" width="30" height="26" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><path d="M620,362 L500,410 L840,410 L650,362 Z" fill="#d4b02e" opacity="0.6"/><rect x="500" y="410" width="340" height="26" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="635" y="328" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Scene: a moment</text><text x="670" y="462" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">moment-by-moment detail</text><text x="450" y="498" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">Where a writer slows down shows what matters.</text><text x="30" y="540" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Structure</text><rect x="30" y="558" width="132" height="62" rx="6" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="96" y="596" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">opening</text><rect x="170" y="558" width="132" height="62" rx="6" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="236" y="596" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">part</text><rect x="310" y="558" width="132" height="62" rx="6" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="376" y="596" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">part</text><rect x="450" y="558" width="132" height="62" rx="6" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="516" y="596" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">part</text><rect x="590" y="558" width="132" height="62" rx="6" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="656" y="596" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">part</text><rect x="730" y="558" width="132" height="62" rx="6" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="796" y="596" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">ending</text><path d="M34,630 q0,14 14,14 L852,644 q14,0 14,-14" fill="none" stroke="#2e6b62" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="450" y="670" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="middle">chapter and part divisions; the opening and ending frame the whole</text><rect x="30" y="692" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="725.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Whitehead’s novel is built from sections set in different states, so its episodic structure</text><text x="50" y="747.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">is part of its meaning.</text>
</svg>