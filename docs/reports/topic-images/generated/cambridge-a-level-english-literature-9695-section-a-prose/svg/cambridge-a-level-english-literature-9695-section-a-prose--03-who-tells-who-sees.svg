<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 902" width="900" height="902" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="902" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Who tells, and who sees?</text>

<text x="30" y="122" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Who tells? Narrative voice</text><circle cx="560" cy="116" r="13" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="560" y="122" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">N</text><text x="580" y="122" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">narrator</text><circle cx="680" cy="116" r="11" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="698" y="122" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">a character’s mind</text><rect x="30" y="138" width="840" height="116" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="140" cy="196" r="30" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="140" cy="196" r="30" fill="#b5d3cf" fill-opacity="0.5"/><text x="140" y="203" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">I</text><text x="260" y="176" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">First person</text><text x="260" y="204" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Intimacy, but limited knowledge. Raises reliability: does the</text><text x="260" y="226" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">narrator understand, or admit, everything?</text><rect x="30" y="266" width="840" height="116" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="140" cy="300" r="22" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="140" y="306" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">N</text><circle cx="80" cy="354" r="15" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><line x1="122" y1="320" x2="89" y2="338" stroke="#1e2a44" stroke-width="2"/><circle cx="140" cy="354" r="15" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><line x1="140" y1="320" x2="140" y2="338" stroke="#1e2a44" stroke-width="2"/><circle cx="200" cy="354" r="15" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><line x1="158" y1="320" x2="191" y2="338" stroke="#1e2a44" stroke-width="2"/><text x="260" y="304" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Third-person omniscient</text><text x="260" y="332" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Can move between minds and comment on events. Listen for judgement</text><text x="260" y="354" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">in the narrator’s own voice.</text><rect x="30" y="394" width="840" height="116" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="108" cy="452" r="22" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="108" y="458" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">N</text><circle cx="166" cy="452" r="22" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><line x1="131" y1="452" x2="143" y2="452" stroke="#1e2a44" stroke-width="2.5"/><circle cx="216" cy="476" r="11" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="260" y="432" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Third-person limited</text><text x="260" y="460" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Stays close to one character’s perceptions.</text><rect x="30" y="522" width="840" height="116" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="122" cy="580" r="30" fill="#d4b02e" fill-opacity="0.85" stroke="#1e2a44" stroke-width="2.5"/><circle cx="158" cy="580" r="30" fill="#b5d3cf" fill-opacity="0.75" stroke="#1e2a44" stroke-width="2.5"/><text x="110" y="586" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">N</text><text x="260" y="560" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Free indirect discourse</text><text x="260" y="588" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Third-person grammar, but the character’s vocabulary and attitude:</text><text x="260" y="610" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">thoughts presented with ironic distance.</text><text x="30" y="672" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Who sees? Focalisation</text><rect x="30" y="688" width="840" height="190" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><path d="M85.55,838 L89.8,793.8 Q100,785.3 110.2,793.8 L114.45,838 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><circle cx="100" cy="776.8" r="11.049999999999999" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><path d="M375.55,838 L379.8,793.8 Q390,785.3 400.2,793.8 L404.45,838 Z" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><circle cx="390" cy="776.8" r="11.049999999999999" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><path d="M245,734 L285,774 L245,814 L205,774 Z" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="245" y="780" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">theme</text><line x1="122" y1="774" x2="196" y2="774" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><line x1="368" y1="774" x2="294" y2="774" stroke="#8a6d0d" stroke-width="3" marker-end="url(#ahO)"/><text x="100" y="866" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">focaliser 1</text><text x="390" y="866" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">focaliser 2</text><text x="470" y="728" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The focaliser is the character whose</text><text x="470" y="750" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">perspective shapes a scene, and it may</text><text x="470" y="772" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">change between chapters.</text><text x="470" y="812" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Desai moves between characters and</text><text x="470" y="833" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">between India and New York: how does the</text><text x="470" y="854" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">same theme look from two positions?</text>
</svg>