<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 785" width="900" height="785" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="785" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How the narration judges Mrs Okafor</text>

<rect x="30" y="118" width="840" height="240" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="50" y="148" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">Original passage, written for the guide (shown sentence by sentence)</text><rect x="90" y="160" width="680.7099999999999" height="32" rx="4" fill="#f2e7b8"/><text x="94" y="184" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Mrs Okafor had always said the house would outlive them all, and she said</text><circle cx="62" cy="177" r="15" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="62" y="182.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="90" y="196" width="708.52" height="32" rx="4" fill="#f2e7b8"/><text x="94" y="220" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">it again now, to the estate agent, who was writing something on a clipboard.</text><rect x="90" y="232" width="448.96" height="32" rx="4" fill="#dce9e7"/><text x="94" y="256" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">The roof, the agent noted, would need attention.</text><circle cx="62" cy="249" r="15" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="62" y="254.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="90" y="268" width="689.98" height="32" rx="4" fill="#f6e3d6"/><text x="94" y="292" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Mrs Okafor said that the roof had always needed attention, and that it had</text><circle cx="62" cy="285" r="15" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="62" y="290.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="90" y="304" width="254.29" height="32" rx="4" fill="#f6e3d6"/><text x="94" y="328" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">never once let in the rain.</text><rect x="78" y="376" width="792" height="96" rx="14" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="92" y="404.4" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="start">Reported indirectly</text><text x="92" y="432.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Her certainty (“the house would outlive them all”) is held at a slight distance and begins</text><text x="92" y="453.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">to sound like a habit rather than a truth.</text><circle cx="46" cy="424" r="16" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="46" y="429.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="78" y="482" width="792" height="96" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="92" y="510.4" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Given equal weight</text><text x="92" y="538.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The agent’s brief, factual observation interrupts her, and the narrator quietly undermines</text><text x="92" y="559.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">her.</text><circle cx="46" cy="530" r="16" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="46" y="535.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="78" y="588" width="792" height="75" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="92" y="616.4" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">A contradiction left uncorrected</text><text x="92" y="644.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The roof “had always needed attention” but “never once let in the rain.”</text><circle cx="46" cy="625.5" r="16" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="46" y="631.26" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="30" y="681" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="714.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The irony is gentle: the reader sees her loyalty and her denial at once. The paragraph</text><text x="50" y="736.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">analyses how the story is told before what it is about.</text>
</svg>