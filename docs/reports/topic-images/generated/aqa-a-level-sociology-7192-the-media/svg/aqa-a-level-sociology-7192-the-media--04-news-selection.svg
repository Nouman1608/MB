<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1018" width="900" height="1018" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="1018" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">From events to the news agenda</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">news is a social product, not a mirror of events (Cohen and Young, 1973)</text>
<rect x="30" y="120" width="840" height="116" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="67" cy="178" r="21" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="67" y="185.56" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="104" y="159.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Gatekeeping</text><text x="104" y="188.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Deciding which stories get through. <tspan font-weight="700">White (1950):</tspan> one wire editor’s personal choices</text><text x="104" y="209.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">shaped what was printed.</text><line x1="450" y1="240" x2="450" y2="276" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="282" width="840" height="116" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="67" cy="340" r="21" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="67" y="347.56" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="104" y="321.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">News values</text><text x="104" y="350.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Galtung and Ruge (1965):</tspan> negativity, unexpectedness, elite nations and persons,</text><text x="104" y="371.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">personalisation. <tspan font-weight="700">Harcup and O’Neill:</tspan> celebrity, entertainment, shareability.</text><line x1="450" y1="402" x2="450" y2="438" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="444" width="840" height="95" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="67" cy="491.5" r="21" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="67" y="499.06" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="104" y="483.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Practical factors</text><text x="104" y="512.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Deadlines, cost and reliance on press releases: "churnalism" (Davies, 2008).</text><line x1="450" y1="543" x2="450" y2="579" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="585" width="840" height="116" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="67" cy="643" r="21" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="67" y="650.56" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="104" y="624.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Framing</text><text x="104" y="653.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Presenting a story from an angle, e.g. disputes framed to favour management (Glasgow</text><text x="104" y="674.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">University Media Group). Becker: the hierarchy of credibility.</text><line x1="450" y1="705" x2="450" y2="741" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="747" width="840" height="116" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="67" cy="805" r="21" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="67" y="812.56" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="104" y="786.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Agenda setting</text><text x="104" y="815.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">McCombs and Shaw (1972):</tspan> issues voters ranked important matched those the media</text><text x="104" y="836.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">emphasised.</text><rect x="30" y="881" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="917" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Who benefits?</text><text x="56" y="946" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Marxists see ideological bias; pluralists say news values reflect audience interest;</text><text x="56" y="968" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">postmodernists note audiences now pick from many sources.</text>
</svg>