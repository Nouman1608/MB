<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 709" width="900" height="709" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="709" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Who controls media content?</text>

<rect x="168" y="104" width="228.66666666666666" height="66" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="282.3333333333333" y="129.67000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Instrumentalist</text><text x="282.3333333333333" y="154.67000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Marxism</text><rect x="404.66666666666663" y="104" width="228.66666666666666" height="66" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="519" y="129.67000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Neo-Marxism</text><text x="519" y="154.67000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">(hegemonic)</text><rect x="641.3333333333333" y="104" width="228.66666666666666" height="66" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="755.6666666666666" y="142.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Pluralism</text><rect x="30" y="178" width="130" height="93" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="218.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Who</text><text x="42" y="240.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">controls</text><rect x="168" y="178" width="228.66666666666666" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="182" y="208.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Owners.</text><rect x="404.66666666666663" y="178" width="228.66666666666666" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="418.66666666666663" y="208.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Dominant ideas, through</text><text x="418.66666666666663" y="229.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">journalists’ shared</text><text x="418.66666666666663" y="250.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">outlook.</text><rect x="641.3333333333333" y="178" width="228.66666666666666" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="655.3333333333333" y="208.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Consumers, through</text><text x="655.3333333333333" y="229.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">market demand; the</text><text x="655.3333333333333" y="250.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">state regulates.</text><rect x="30" y="279" width="130" height="135" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="351.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">How</text><rect x="168" y="279" width="228.66666666666666" height="135" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="182" y="309.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Owners spread</text><text x="182" y="330.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">ruling-class ideology</text><text x="182" y="351.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and shape what is</text><text x="182" y="372.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">reported.</text><rect x="404.66666666666663" y="279" width="228.66666666666666" height="135" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="418.66666666666663" y="309.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Mostly middle-class</text><text x="418.66666666666663" y="330.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">journalists under</text><text x="418.66666666666663" y="351.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">commercial pressure</text><text x="418.66666666666663" y="372.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">reflect mainstream</text><text x="418.66666666666663" y="393.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">ideas without orders.</text><rect x="641.3333333333333" y="279" width="228.66666666666666" height="135" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="655.3333333333333" y="309.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Competing media must</text><text x="655.3333333333333" y="330.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">give audiences what</text><text x="655.3333333333333" y="351.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">they want. Ofcom</text><text x="655.3333333333333" y="372.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">regulates; the BBC must</text><text x="655.3333333333333" y="393.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">stay impartial.</text><rect x="30" y="422" width="130" height="114" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="484.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Evidence</text><rect x="168" y="422" width="228.66666666666666" height="114" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="182" y="452.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Miliband (1969)</tspan>; Harold</text><text x="182" y="473.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Evans leaving The Times</text><text x="182" y="494.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(1982) after Murdoch</text><text x="182" y="515.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">bought it.</text><rect x="404.66666666666663" y="422" width="228.66666666666666" height="114" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="418.66666666666663" y="452.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Glasgow University</tspan></text><text x="418.66666666666663" y="473.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Media Group</tspan>, Bad News</text><text x="418.66666666666663" y="494.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(1976).</text><rect x="641.3333333333333" y="422" width="228.66666666666666" height="114" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="655.3333333333333" y="452.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Readers who dislike</text><text x="655.3333333333333" y="473.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">coverage switch titles.</text><rect x="30" y="552" width="840" height="133" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="588" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Evaluation</text><text x="56" y="617" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Marxists reply that the market itself favours large firms and advertisers. The Leveson</text><text x="56" y="639" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Inquiry (2011 to 2012) showed public concern about press power, and tech platforms are</text><text x="56" y="661" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">themselves highly concentrated.</text>
</svg>