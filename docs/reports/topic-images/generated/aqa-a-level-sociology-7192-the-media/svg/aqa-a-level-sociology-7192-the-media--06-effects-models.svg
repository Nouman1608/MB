<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 687" width="900" height="687" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="687" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Models of media effects</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">the field has moved from passive to active views of the audience</text>
<line x1="60" y1="118" x2="840" y2="118" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><text x="60" y="104" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">passive audience</text><text x="840" y="104" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="end">active audience</text><rect x="30" y="140" width="269.3333333333333" height="168" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,190 L31.25,154.25 Q31.25,141.25 44.25,141.25 L285.0833333333333,141.25 Q298.0833333333333,141.25 298.0833333333333,154.25 L298.0833333333333,190 Z" fill="#f2e7b8"/><line x1="31.25" y1="190" x2="298.0833333333333" y2="190" stroke="#c9d6d4" stroke-width="2"/><text x="164.66666666666666" y="170.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Hypodermic syringe</text><text x="44" y="221.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Messages "injected" into a</text><text x="44" y="242.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">passive audience. Bandura’s</text><text x="44" y="263.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Bobo doll experiments (early</text><text x="44" y="284.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">1960s).</text><rect x="315.3333333333333" y="140" width="269.3333333333333" height="168" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M316.5833333333333,190 L316.5833333333333,154.25 Q316.5833333333333,141.25 329.5833333333333,141.25 L570.4166666666666,141.25 Q583.4166666666666,141.25 583.4166666666666,154.25 L583.4166666666666,190 Z" fill="#f2e7b8"/><line x1="316.5833333333333" y1="190" x2="583.4166666666666" y2="190" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="170.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Cultivation</text><text x="329.3333333333333" y="221.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Gerbner:</tspan> heavy TV viewing</text><text x="329.3333333333333" y="242.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">builds a "mean world" view.</text><rect x="600.6666666666666" y="140" width="269.3333333333333" height="168" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.9166666666666,190 L601.9166666666666,154.25 Q601.9166666666666,141.25 614.9166666666666,141.25 L855.75,141.25 Q868.75,141.25 868.75,154.25 L868.75,190 Z" fill="#dce9e7"/><line x1="601.9166666666666" y1="190" x2="868.75" y2="190" stroke="#c9d6d4" stroke-width="2"/><text x="735.3333333333333" y="170.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Cultural effects</text><text x="614.6666666666666" y="221.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Philo (1990):</tspan> people</text><text x="614.6666666666666" y="242.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">reproduced news themes about</text><text x="614.6666666666666" y="263.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the miners’ strike.</text><rect x="30" y="322" width="269.3333333333333" height="188" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,392 L31.25,336.25 Q31.25,323.25 44.25,323.25 L285.0833333333333,323.25 Q298.0833333333333,323.25 298.0833333333333,336.25 L298.0833333333333,392 Z" fill="#dce9e7"/><line x1="31.25" y1="392" x2="298.0833333333333" y2="392" stroke="#c9d6d4" stroke-width="2"/><text x="164.66666666666666" y="362.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Two-step flow</text><text x="44" y="423.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Katz and Lazarsfeld (1955):</tspan></text><text x="44" y="444.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">opinion leaders interpret</text><text x="44" y="465.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">messages for others.</text><rect x="315.3333333333333" y="322" width="269.3333333333333" height="188" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M316.5833333333333,392 L316.5833333333333,336.25 Q316.5833333333333,323.25 329.5833333333333,323.25 L570.4166666666666,323.25 Q583.4166666666666,323.25 583.4166666666666,336.25 L583.4166666666666,392 Z" fill="#b5d3cf"/><line x1="316.5833333333333" y1="392" x2="583.4166666666666" y2="392" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="362.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Uses and gratifications</text><text x="329.3333333333333" y="423.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">McQuail, Blumler and Brown</tspan></text><text x="329.3333333333333" y="444.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">(1972):</tspan> diversion,</text><text x="329.3333333333333" y="465.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">relationships, identity,</text><text x="329.3333333333333" y="486.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">surveillance.</text><rect x="600.6666666666666" y="322" width="269.3333333333333" height="188" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.9166666666666,392 L601.9166666666666,336.25 Q601.9166666666666,323.25 614.9166666666666,323.25 L855.75,323.25 Q868.75,323.25 868.75,336.25 L868.75,392 Z" fill="#b5d3cf"/><line x1="601.9166666666666" y1="392" x2="868.75" y2="392" stroke="#c9d6d4" stroke-width="2"/><text x="735.3333333333333" y="350.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Reception and</text><text x="735.3333333333333" y="374.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">postmodern</text><text x="614.6666666666666" y="423.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Hall (1973); Morley (1980):</tspan></text><text x="614.6666666666666" y="444.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">different decodings. <tspan font-weight="700">Fiske;</tspan></text><text x="614.6666666666666" y="465.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Baudrillard.</tspan></text><rect x="30" y="528" width="840" height="133" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="564" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Models and methods</text><text x="56" y="593" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Laboratory experiments lack ecological validity; focus groups and interviews give rich</text><text x="56" y="615" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">but less generalisable data. Cultural effects researchers argue long-term influence</text><text x="56" y="637" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">still exists.</text>
</svg>