<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="900" height="650" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="650" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Models of media effects</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">the field has moved from passive to active views of the audience</text>
<rect x="30" y="124" width="269.3333333333333" height="168" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,174 L31.25,138.25 Q31.25,125.25 44.25,125.25 L285.0833333333333,125.25 Q298.0833333333333,125.25 298.0833333333333,138.25 L298.0833333333333,174 Z" fill="#f2e7b8"/><line x1="31.25" y1="174" x2="298.0833333333333" y2="174" stroke="#c9d6d4" stroke-width="2"/><text x="164.66666666666666" y="154.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Hypodermic syringe</text><text x="44" y="205.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Messages "injected" into a</text><text x="44" y="226.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">passive audience. Bandura’s</text><text x="44" y="247.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Bobo doll experiments (early</text><text x="44" y="268.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">1960s).</text><rect x="315.3333333333333" y="124" width="269.3333333333333" height="168" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M316.5833333333333,174 L316.5833333333333,138.25 Q316.5833333333333,125.25 329.5833333333333,125.25 L570.4166666666666,125.25 Q583.4166666666666,125.25 583.4166666666666,138.25 L583.4166666666666,174 Z" fill="#f2e7b8"/><line x1="316.5833333333333" y1="174" x2="583.4166666666666" y2="174" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="154.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Two-step flow</text><text x="329.3333333333333" y="205.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Katz and Lazarsfeld (1955):</tspan></text><text x="329.3333333333333" y="226.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">opinion leaders interpret</text><text x="329.3333333333333" y="247.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">messages for others.</text><rect x="600.6666666666666" y="124" width="269.3333333333333" height="168" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.9166666666666,174 L601.9166666666666,138.25 Q601.9166666666666,125.25 614.9166666666666,125.25 L855.75,125.25 Q868.75,125.25 868.75,138.25 L868.75,174 Z" fill="#b5d3cf"/><line x1="601.9166666666666" y1="174" x2="868.75" y2="174" stroke="#c9d6d4" stroke-width="2"/><text x="735.3333333333333" y="154.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Uses and gratifications</text><text x="614.6666666666666" y="205.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">McQuail, Blumler and Brown</tspan></text><text x="614.6666666666666" y="226.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">(1972):</tspan> diversion,</text><text x="614.6666666666666" y="247.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">relationships, identity,</text><text x="614.6666666666666" y="268.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">surveillance.</text><rect x="30" y="306" width="269.3333333333333" height="167" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,376 L31.25,320.25 Q31.25,307.25 44.25,307.25 L285.0833333333333,307.25 Q298.0833333333333,307.25 298.0833333333333,320.25 L298.0833333333333,376 Z" fill="#dce9e7"/><line x1="31.25" y1="376" x2="298.0833333333333" y2="376" stroke="#c9d6d4" stroke-width="2"/><text x="164.66666666666666" y="346.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Cultivation</text><text x="44" y="407.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Gerbner:</tspan> heavy TV viewing</text><text x="44" y="428.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">builds a "mean world" view.</text><rect x="315.3333333333333" y="306" width="269.3333333333333" height="167" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M316.5833333333333,376 L316.5833333333333,320.25 Q316.5833333333333,307.25 329.5833333333333,307.25 L570.4166666666666,307.25 Q583.4166666666666,307.25 583.4166666666666,320.25 L583.4166666666666,376 Z" fill="#dce9e7"/><line x1="316.5833333333333" y1="376" x2="583.4166666666666" y2="376" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="346.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Cultural effects</text><text x="329.3333333333333" y="407.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Philo (1990):</tspan> people</text><text x="329.3333333333333" y="428.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">reproduced news themes about</text><text x="329.3333333333333" y="449.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the miners’ strike.</text><rect x="600.6666666666666" y="306" width="269.3333333333333" height="167" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.9166666666666,376 L601.9166666666666,320.25 Q601.9166666666666,307.25 614.9166666666666,307.25 L855.75,307.25 Q868.75,307.25 868.75,320.25 L868.75,376 Z" fill="#b5d3cf"/><line x1="601.9166666666666" y1="376" x2="868.75" y2="376" stroke="#c9d6d4" stroke-width="2"/><text x="735.3333333333333" y="334.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Reception and</text><text x="735.3333333333333" y="358.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">postmodern</text><text x="614.6666666666666" y="407.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Hall (1973); Morley (1980):</tspan></text><text x="614.6666666666666" y="428.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">different decodings. <tspan font-weight="700">Fiske;</tspan></text><text x="614.6666666666666" y="449.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Baudrillard.</tspan></text><rect x="30" y="491" width="840" height="133" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="527" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Models and methods</text><text x="56" y="556" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Laboratory experiments lack ecological validity; focus groups and interviews give rich</text><text x="56" y="578" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">but less generalisable data. Cultural effects researchers argue long-term influence</text><text x="56" y="600" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">still exists.</text>
</svg>