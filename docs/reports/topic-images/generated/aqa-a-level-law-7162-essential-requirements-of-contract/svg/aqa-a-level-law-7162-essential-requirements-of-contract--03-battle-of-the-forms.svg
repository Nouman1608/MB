<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 566" width="900" height="566" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="566" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Mirror image and the battle of the forms</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Butler Machine Tool v Ex-Cell-O (1979)</text>
<line x1="60" y1="144" x2="60" y2="383" stroke="#c9d6d4" stroke-width="4"/><rect x="104" y="124" width="766" height="85" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="156.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Buyer orders on its own terms</text><text x="122" y="186.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">New terms, so not acceptance: a <tspan font-weight="700" fill="#1e2a44">counter-offer</tspan>.</text><circle cx="60" cy="166.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="175.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="104" y="221" width="766" height="85" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="253.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Seller returns the buyer’s tear-off acknowledgment slip</text><text x="122" y="283.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">This <tspan font-weight="700" fill="#1e2a44">accepts</tspan> the counter-offer.</text><circle cx="60" cy="263.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="272.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="104" y="318" width="766" height="85" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="122" y="350.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The buyer’s terms govern</text><text x="122" y="380.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Acceptance must mirror the offer exactly.</text><circle cx="60" cy="360.5" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="369.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="30" y="425" width="840" height="109" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="459.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Acceptance by conduct</text><text x="50" y="488.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Brogden</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Metropolitan</tspan> <tspan font-style="italic">Railway</tspan> (1877): an unsigned draft agreement was accepted by ordering and</text><text x="50" y="509.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">supplying coal on its terms.</text>
</svg>