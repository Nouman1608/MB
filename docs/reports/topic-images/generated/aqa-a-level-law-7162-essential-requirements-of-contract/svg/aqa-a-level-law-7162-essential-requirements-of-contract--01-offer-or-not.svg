<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 588" width="900" height="588" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="588" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Is it an offer?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Terms the offeror will be bound by as soon as they are accepted</text>
<rect x="30" y="124" width="270.6666666666667" height="134" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">NOT AN OFFER</text><text x="50" y="182.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">“May be prepared to sell”</text><text x="50" y="210.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Gibson</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Manchester</tspan> <tspan font-style="italic">CC</tspan></text><text x="50" y="231.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">(1979)</text><rect x="314.6666666666667" y="124" width="270.6666666666667" height="134" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="334.6666666666667" y="156" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">NOT AN OFFER</text><text x="334.6666666666667" y="182.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Lowest price stated</text><text x="334.6666666666667" y="210.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Supply of information: <tspan font-style="italic">Harvey</tspan></text><text x="334.6666666666667" y="231.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">v</tspan> <tspan font-style="italic">Facey</tspan> (1893)</text><rect x="599.3333333333334" y="124" width="270.6666666666667" height="134" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="619.3333333333334" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">INVITATIONS TO TREAT</text><text x="619.3333333333334" y="182.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Goods on display, most</text><text x="619.3333333333334" y="205.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">adverts, website listings</text><text x="619.3333333333334" y="233.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">They invite offers</text><text x="450" y="296" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">At an auction (Payne v Cave, 1789)</text><rect x="30" y="322" width="250.66666666666666" height="134" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="155.33333333333331" y="378.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">REQUEST FOR BIDS</text><text x="155.33333333333331" y="406.1" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Invitation to treat</text><line x1="286.66666666666663" y1="389" x2="318.66666666666663" y2="389" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="324.66666666666663" y="322" width="250.66666666666666" height="134" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="449.99999999999994" y="354" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">EACH BID</text><text x="449.99999999999994" y="381.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Offer</text><text x="449.99999999999994" y="410.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Can be withdrawn before</text><text x="449.99999999999994" y="431.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">the hammer falls</text><line x1="581.3333333333333" y1="389" x2="613.3333333333333" y2="389" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="619.3333333333333" y="322" width="250.66666666666666" height="134" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="744.6666666666666" y="378.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">FALL OF THE HAMMER</text><text x="744.6666666666666" y="406.1" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Acceptance</text><rect x="30" y="478" width="840" height="78" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="510.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">An offer must be <tspan font-weight="700" fill="#1e2a44">communicated</tspan>: someone who does the act in a reward offer without knowing of it has</text><text x="450" y="531.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">generally not accepted.</text>
</svg>