<rect x="30" y="124" width="412" height="263" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SOCIAL AND DOMESTIC</text><text x="50" y="183.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Presumed NOT binding</text><text x="50" y="212.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="212.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Balfour</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Balfour</tspan> (1919): allowance to a wife</text><text x="50" y="241.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="241.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Jones</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Padavatton</tspan> (1969): mother supporting</text><text x="65.2" y="262.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">a daughter at the Bar</text><text x="50" y="291.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="291.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Rebutted:</tspan> <tspan font-style="italic">Merritt</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Merritt</tspan> (1970), separated</text><text x="65.2" y="312.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">couple, in writing</text><text x="50" y="341.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="341.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Rebutted:</tspan> <tspan font-style="italic">Simpkins</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Pays</tspan> (1955), shared</text><text x="65.2" y="362.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">competition entries</text><rect x="458" y="124" width="412" height="263" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="478" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">COMMERCIAL</text><text x="478" y="183.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Presumed binding</text><text x="478" y="212.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="493.2" y="212.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Edwards</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Skyways</tspan> (1964): “ex gratia”</text><text x="493.2" y="233.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">payment still binding</text><text x="478" y="262.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="493.2" y="262.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Rebutted:</tspan> <tspan font-style="italic">Rose</tspan> <tspan font-style="italic">&amp;</tspan> <tspan font-style="italic">Frank</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Crompton</tspan> (1925),</text><text x="493.2" y="283.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">honour clause</text><text x="478" y="312.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="493.2" y="312.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Rebutted:</tspan> <tspan font-style="italic">Kleinwort</tspan> <tspan font-style="italic">Benson</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Malaysia</tspan> <tspan font-style="i