<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 740" width="900" height="740" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="740" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Privity: who can enforce the contract?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Only the parties can enforce it or be bound by it</text>
<rect x="60" y="124" width="240" height="60" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="180" y="158.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Wholesaler</text><rect x="600" y="124" width="240" height="60" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="720" y="158.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Retailer</text><rect x="330" y="264" width="240" height="60" rx="14" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="450" y="298.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Manufacturer</text><line x1="304" y1="154" x2="596" y2="154" stroke="#2e6b62" stroke-width="5"/><text x="450" y="144" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">price agreement</text><line x1="450" y1="258" x2="450" y2="164" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)" stroke-dasharray="8 6"/><text x="462" y="220" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">cannot enforce</text><text x="450" y="352" font-size="17" font-weight="700" fill="#4a5568" text-anchor="middle">Dunlop v Selfridge (1915)</text><rect x="30" y="382" width="413" height="176" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="414" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STATUTE</text><text x="50" y="440.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Contracts (Rights of Third Parties) Act</text><text x="50" y="463.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">1999 s1</text><text x="50" y="491.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Contract expressly allows it, or the term purports</text><text x="50" y="512.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">to benefit them; identified by name, class or</text><text x="50" y="533.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">description (s1(3))</text><rect x="457" y="382" width="413" height="176" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="414" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">AGENCY</text><text x="477" y="440.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Principal enforces</text><text x="477" y="468.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A contract an agent made on their behalf</text><rect x="30" y="576" width="413" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="608" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">BENEFIT OF OTHERS</text><text x="50" y="634.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Jackson v Horizon Holidays (1975)</text><text x="50" y="662.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Father recovered for his family’s spoiled holiday</text><text x="50" y="683.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">too</text><rect x="457" y="576" width="413" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="608" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PERSONAL REPRESENTATIVE</text><text x="477" y="634.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Beswick v Beswick (1968)</text><text x="477" y="662.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Widow failed personally but won as</text><text x="477" y="683.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">administratrix</text>
</svg>