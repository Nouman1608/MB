<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 428" width="900" height="428" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="428" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Has the offer ended?</text>

<rect x="30" y="100" width="412" height="296" rx="14" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="132" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">ENDS THE OFFER</text><text x="50" y="163.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="163.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Revocation</tspan> <tspan font-weight="700" fill="#1e2a44">communicated</tspan> to the offeree</text><text x="65.2" y="184.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(<tspan font-style="italic">Byrne</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Van</tspan> <tspan font-style="italic">Tienhoven</tspan>, 1880)</text><text x="50" y="215.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="215.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Revocation</tspan> <tspan font-weight="700" fill="#1e2a44">via</tspan> <tspan font-weight="700" fill="#1e2a44">a</tspan> <tspan font-weight="700" fill="#1e2a44">reliable</tspan> <tspan font-weight="700" fill="#1e2a44">third</tspan> <tspan font-weight="700" fill="#1e2a44">party</tspan></text><text x="65.2" y="236.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(<tspan font-style="italic">Dickinson</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Dodds</tspan>, 1876)</text><text x="50" y="267.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="267.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Rejection</tspan> <tspan font-weight="700" fill="#1e2a44">or</tspan> <tspan font-weight="700" fill="#1e2a44">counter-offer</tspan> (<tspan font-style="italic">Hyde</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Wrench</tspan>,</text><text x="65.2" y="288.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">1840)</text><text x="50" y="319.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="319.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Lapse</tspan> after a stated or reasonable time</text><text x="65.2" y="340.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(<tspan font-style="italic">Ramsgate</tspan> <tspan font-style="italic">Victoria</tspan> <tspan font-style="italic">Hotel</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Montefiore</tspan>, 1866)</text><text x="50" y="371.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="371.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Death</tspan>: may end it, depending on the contract</text><rect x="458" y="100" width="412" height="296" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="478" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DOES NOT END IT</text><text x="478" y="163.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="493.2" y="163.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Posting</tspan> a revocation that has not reached the</text><text x="493.2" y="184.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">offeree (<tspan font-style="italic">Byrne</tspan>)</text><text x="478" y="215.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="493.2" y="215.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">A</tspan> <tspan font-weight="700" fill="#1e2a44">request</tspan> <tspan font-weight="700" fill="#1e2a44">for</tspan> <tspan font-weight="700" fill="#1e2a44">information</tspan> (<tspan font-style="italic">Stevenson</tspan> <tspan font-style="italic">v</tspan></text><text x="493.2" y="236.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">McLean</tspan>, 1880)</text><text x="478" y="267.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="493.2" y="267.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Revoking</tspan> <tspan font-weight="700" fill="#1e2a44">a</tspan> <tspan font-weight="700" fill="#1e2a44">unilateral</tspan> <tspan font-weight="700" fill="#1e2a44">offer</tspan> once performance</text><text x="493.2" y="288.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">has started (<tspan font-style="italic">Errington</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Errington</tspan>, 1952: paying</text><text x="493.2" y="309.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">off the mortgage)</text>
</svg>