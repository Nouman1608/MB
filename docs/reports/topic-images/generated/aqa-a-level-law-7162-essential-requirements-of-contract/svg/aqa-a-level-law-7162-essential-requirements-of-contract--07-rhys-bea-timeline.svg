<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 678" width="900" height="678" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="678" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked problem: Rhys’s drum kit</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Work through formation in strict time order</text>
<line x1="60" y1="144" x2="60" y2="626" stroke="#c9d6d4" stroke-width="4"/><rect x="104" y="124" width="766" height="108" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="157.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Monday: offer</text><text x="122" y="187.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Rhys emails: drum kit for £500, “offer open until Friday”. Definite terms, intention to be</text><text x="122" y="209.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">bound.</text><circle cx="60" cy="178" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="186.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">M</text><rect x="104" y="244" width="766" height="86" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="277.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Tuesday: “Would you take £400?”</text><text x="122" y="307.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">An inquiry (<tspan font-style="italic">Stevenson</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">McLean</tspan>) or a counter-offer that ends the offer (<tspan font-style="italic">Hyde</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Wrench</tspan>)?</text><circle cx="60" cy="287" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="295.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">T</text><rect x="104" y="342" width="766" height="108" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="375.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Wednesday: revocation</text><text x="122" y="405.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">A friend says Rhys sold to Cal: a reliable third party (<tspan font-style="italic">Dickinson</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Dodds</tspan>). Keeping it open</text><text x="122" y="427.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">to Friday was not binding without consideration.</text><circle cx="60" cy="396" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="404.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">W</text><rect x="104" y="462" width="766" height="86" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="495.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Thursday: “I accept”</text><text x="122" y="525.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Comes after revocation: too late.</text><circle cx="60" cy="505" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="513.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">T</text><rect x="104" y="560" width="766" height="86" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="122" y="593.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">No contract</text><text x="122" y="623.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Whichever view is taken of Tuesday’s email.</text><circle cx="60" cy="603" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="611.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">=</text>
</svg>