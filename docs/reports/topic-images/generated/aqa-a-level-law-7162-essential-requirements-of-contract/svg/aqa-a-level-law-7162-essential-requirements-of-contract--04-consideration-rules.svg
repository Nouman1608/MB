<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 746" width="900" height="746" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="746" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Is it good consideration?</text>

<rect x="30" y="100" width="840" height="111" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CURRIE v MISA (1875)</text><text x="50" y="164.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">“Some right, interest, profit or benefit accruing to the one party, or some forbearance, detriment,</text><text x="50" y="186.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">loss or responsibility given, suffered or undertaken by the other”</text><clipPath id="tc233"><rect x="30" y="233" width="840" height="481" rx="14"/></clipPath><g clip-path="url(#tc233)"><rect x="30" y="233" width="215.12195121951223" height="41" fill="#b5d3cf"/><text x="41" y="256.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Rule</text><rect x="245.12195121951223" y="233" width="297.07317073170736" height="41" fill="#f2e7b8"/><text x="256.1219512195122" y="256.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Not consideration</text><rect x="542.1951219512196" y="233" width="327.8048780487805" height="41" fill="#b5d3cf"/><text x="553.1951219512196" y="256.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">But it is / exception</text><rect x="30" y="274" width="215.12195121951223" height="40" fill="#dce9e7"/><text x="41" y="297" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Moves from the promisee</text><rect x="245.12195121951223" y="274" width="297.07317073170736" height="40" fill="#ffffff"/><text x="256.1219512195122" y="297" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Tweddle</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Atkinson</tspan> (1861)</text><rect x="542.1951219512196" y="274" width="327.8048780487805" height="40" fill="#ffffff"/><line x1="30" y1="314" x2="870" y2="314" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="314" width="215.12195121951223" height="60" fill="#dce9e7"/><text x="41" y="337" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Sufficient, need not be</text><text x="41" y="357" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">adequate</text><rect x="245.12195121951223" y="314" width="297.07317073170736" height="60" fill="#f8faf9"/><rect x="542.1951219512196" y="314" width="327.8048780487805" height="60" fill="#f8faf9"/><text x="553.1951219512196" y="337" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">£1 a year (<tspan font-style="italic">Thomas</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Thomas</tspan>); chocolate</text><text x="553.1951219512196" y="357" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">wrappers (<tspan font-style="italic">Chappell</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Nestlé</tspan>)</text><line x1="30" y1="374" x2="870" y2="374" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="374" width="215.12195121951223" height="40" fill="#dce9e7"/><text x="41" y="397" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Real, of some value</text><rect x="245.12195121951223" y="374" width="297.07317073170736" height="40" fill="#ffffff"/><text x="256.1219512195122" y="397" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Stop complaining (<tspan font-style="italic">White</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Bluett</tspan>)</text><rect x="542.1951219512196" y="374" width="327.8048780487805" height="40" fill="#ffffff"/><line x1="30" y1="414" x2="870" y2="414" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="414" width="215.12195121951223" height="80" fill="#dce9e7"/><text x="41" y="437" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Not past</text><rect x="245.12195121951223" y="414" width="297.07317073170736" height="80" fill="#f8faf9"/><text x="256.1219512195122" y="437" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Re</tspan> <tspan font-style="italic">McArdle</tspan> (1951)</text><rect x="542.1951219512196" y="414" width="327.8048780487805" height="80" fill="#f8faf9"/><text x="553.1951219512196" y="437" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">At the promisor’s request, payment</text><text x="553.1951219512196" y="457" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">understood and enforceable (<tspan font-style="italic">Lampleigh</tspan>;</text><text x="553.1951219512196" y="477" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Pao</tspan> <tspan font-style="italic">On</tspan>)</text><line x1="30" y1="494" x2="870" y2="494" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="494" width="215.12195121951223" height="60" fill="#dce9e7"/><text x="41" y="517" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Public duty</text><rect x="245.12195121951223" y="494" width="297.07317073170736" height="60" fill="#ffffff"/><text x="256.1219512195122" y="517" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Only what the law requires (<tspan font-style="italic">Collins</tspan> <tspan font-style="italic">v</tspan></text><text x="256.1219512195122" y="537" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Godefroy</tspan>)</text><rect x="542.1951219512196" y="494" width="327.8048780487805" height="60" fill="#ffffff"/><text x="553.1951219512196" y="517" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Going beyond it (<tspan font-style="italic">Glasbrook</tspan>: extra police)</text><line x1="30" y1="554" x2="870" y2="554" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="554" width="215.12195121951223" height="80" fill="#dce9e7"/><text x="41" y="577" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Contractual duty</text><rect x="245.12195121951223" y="554" width="297.07317073170736" height="80" fill="#f8faf9"/><text x="256.1219512195122" y="577" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Stilk</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Myrick</tspan> (1809)</text><rect x="542.1951219512196" y="554" width="327.8048780487805" height="80" fill="#f8faf9"/><text x="553.1951219512196" y="577" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">More than required (<tspan font-style="italic">Hartley</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Ponsonby</tspan>);</text><text x="553.1951219512196" y="597" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">practical benefit, no duress (<tspan font-style="italic">Williams</tspan> <tspan font-style="italic">v</tspan></text><text x="553.1951219512196" y="617" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Roffey</tspan>)</text><line x1="30" y1="634" x2="870" y2="634" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="634" width="215.12195121951223" height="80" fill="#dce9e7"/><text x="41" y="657" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Part payment of a debt</text><rect x="245.12195121951223" y="634" width="297.07317073170736" height="80" fill="#ffffff"/><text x="256.1219512195122" y="657" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Pinnel’s</tspan> <tspan font-style="italic">Case</tspan>; <tspan font-style="italic">Foakes</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Beer</tspan></text><rect x="542.1951219512196" y="634" width="327.8048780487805" height="80" fill="#ffffff"/><text x="553.1951219512196" y="657" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Something different, such as early</text><text x="553.1951219512196" y="677" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">payment; promissory estoppel (<tspan font-style="italic">High</tspan></text><text x="553.1951219512196" y="697" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Trees</tspan>, 1947)</text></g><line x1="245.12195121951223" y1="233" x2="245.12195121951223" y2="714" stroke="#c9d6d4" stroke-width="1.5"/><line x1="542.1951219512196" y1="233" x2="542.1951219512196" y2="714" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="233" width="840" height="481" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/>
</svg>