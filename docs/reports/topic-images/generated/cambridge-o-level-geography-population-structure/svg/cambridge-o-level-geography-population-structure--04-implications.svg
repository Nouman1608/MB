<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 630" width="900" height="630" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="630" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What a high dependent population means</text>

<rect x="30" y="115" width="410" height="290" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="150.85" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="start">Youthful population</text><text x="55" y="180" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="71" y="180" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">Demand for schools, teachers, maternal</text><text x="71" y="201" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">and child health care, vaccination</text><text x="55" y="234" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="71" y="234" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">Future need for jobs and housing;</text><text x="71" y="255" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">unemployment or emigration if the</text><text x="71" y="276" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">economy lags</text><text x="55" y="309" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="71" y="309" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">Population momentum: growth continues</text><text x="71" y="330" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">as many reach childbearing age</text><rect x="460" y="115" width="410" height="290" rx="14" fill="#f6e6dc" stroke="#b5602e" stroke-width="2.5"/><text x="478" y="150.85" font-size="21" font-weight="700" fill="#b5602e" text-anchor="start">Ageing population</text><text x="485" y="180" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="501" y="180" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">Rising costs of pensions, health and</text><text x="501" y="201" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">residential care, paid by a shrinking</text><text x="501" y="222" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">workforce</text><text x="485" y="255" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="501" y="255" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">Labour shortages, especially in care</text><text x="501" y="276" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">and manual work</text><text x="485" y="309" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="501" y="309" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">Fewer pupils: some schools close or</text><text x="501" y="330" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">merge</text><text x="485" y="363" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="501" y="363" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">But: older people give childcare,</text><text x="501" y="384" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">volunteer, and spend savings</text><text x="450" y="448" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Responses</text><rect x="30" y="468" width="410" height="140" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="501.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">For youth dependency</text><text x="48" y="526.875" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="start">Invest in education and family planning;</text><text x="48" y="548.655" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="start">create jobs for the young adults to come.</text><rect x="460" y="468" width="410" height="140" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="478" y="501.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">For ageing</text><text x="478" y="526.875" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="start">Raise retirement age; more women and older</text><text x="478" y="548.655" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="start">people in work; pro-natalist incentives;</text><text x="478" y="570.435" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="start">immigration; technology. Japan:</text><text x="478" y="592.215" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="start">skilled-worker visa (2019), care robots.</text>
</svg>