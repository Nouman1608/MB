<rect width="900" height="780" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Dependency ratio: who depends on whom?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Illustrative data from the worked example</text>
<rect x="30" y="110" width="840" height="100" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="148" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Dependency ratio = (0–14 + 65 and over) ÷ (15–64) × 100</text><text x="450" y="180" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="middle">Split it: youth = 0–14 ÷ 15–64 × 100 · old-age = 65+ ÷ 15–64 × 100</text><rect x="30" y="235" width="840" height="232" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="55" y="273" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Country A</text><text x="845" y="273" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="end">dependants: almost all children</text><rect x="120" y="295" width="301" height="50" fill="#2e6b62" stroke="#1e2a44" stroke-width="2"/><text x="270.5" y="327" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">43%</text><text x="270.5" y="365" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="middle">0–14</text><rect x="421" y="295" width="378" height="50" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="610" y="327" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">54%</text><text x="610" y="365" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="middle">15–64</text><rect x="799" y="295" width="21" height="50" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="828" y="327" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">3%</text><text x="809.5" y="365" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="middle">65+</text><rect x="55" y="385" width="250" height="64" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="180" y="410" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">Dependency ratio</text><text x="180" y="437" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">85.2</text><rect x="325" y="385" width="250" height="64" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="410" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">Youth</text><text x="450" y="437" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">79.6</text><rect x="595" y="385" width="250" height="64" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="720" y="410" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">Old-age</text><text x="720" y="437" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">5.6</text><rect x="30" y="485" width="840" height="232" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="55" y="523" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Country B</text><text x="845" y="523" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="end">dependants: mostly elderly</text><rect x="120" y="545" width="84" height="50" fill="#2e6b62" stroke="#1e2a44" stroke-width="2"/><text x="162" y="577" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">12%</text><text x="162" y="615" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="middle">0–14</text><rect x="204" y="545" width="413" height="50" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="410.5" y="577" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">59%</text><text x="410.5" y="615" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="middle">15–64</text><rect x="617" y="545" width="203" height="50" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="718.5" y="577" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">29%</text><text x="718.5" y="615" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="middle">65+</text><rect x="55" y="635" width="250" height="64" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="180" y="660" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">Dependency ratio</text><text x="180" y="687" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">69.5</text><rect x="325" y="635" width="250" height="64" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="660" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">Youth</text><text x="450" y="687" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">20.3</text><rect x="595" y="635" width="250" height="64" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="720" y="660" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">Old-age</text><text x="720" y="687" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">49.2</text><text x="450" y="755" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">Similar totals can hide opposite problems: always split the ratio.</text>
</svg>