<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="500" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The pyramid answer chain</text>

<rect x="30" y="115" width="260" height="50" rx="25" fill="#1e2a44" stroke="#1e2a44" stroke-width="2"/><text x="160" y="147" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Describe the shape</text><rect x="320" y="115" width="260" height="50" rx="25" fill="#2e6b62" stroke="#1e2a44" stroke-width="2"/><text x="450" y="147" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Explain it</text><rect x="610" y="115" width="260" height="50" rx="25" fill="#8a6d0d" stroke="#1e2a44" stroke-width="2"/><text x="740" y="147" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Say what it means</text><rect x="30" y="185" width="260" height="84" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="160" y="231" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="middle">Wide base</text><line x1="292" y1="227" x2="318" y2="227" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="320" y="185" width="260" height="84" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="231" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="middle">High birth rate</text><line x1="582" y1="227" x2="608" y2="227" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="610" y="185" width="260" height="84" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="740" y="220" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="middle">Demand for schools and</text><text x="740" y="242" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="middle">child health care</text><rect x="30" y="285" width="260" height="84" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="160" y="320" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="middle">Wide top, near-vertical</text><text x="160" y="342" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="middle">sides</text><line x1="292" y1="327" x2="318" y2="327" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="320" y="285" width="260" height="84" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="320" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="middle">Low birth rate, long life</text><text x="450" y="342" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="middle">expectancy</text><line x1="582" y1="327" x2="608" y2="327" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="610" y="285" width="260" height="84" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="740" y="320" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="middle">Pension and care costs;</text><text x="740" y="342" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="middle">labour shortages</text><rect x="30" y="385" width="260" height="84" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="160" y="420" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="middle">Bulge of young adults,</text><text x="160" y="442" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="middle">base narrowing</text><line x1="292" y1="427" x2="318" y2="427" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="320" y="385" width="260" height="84" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="420" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="middle">Births were high, now</text><text x="450" y="442" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="middle">falling</text><line x1="582" y1="427" x2="608" y2="427" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="610" y="385" width="260" height="84" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="740" y="420" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="middle">A demographic dividend, if</text><text x="740" y="442" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="middle">there are jobs</text>
</svg>