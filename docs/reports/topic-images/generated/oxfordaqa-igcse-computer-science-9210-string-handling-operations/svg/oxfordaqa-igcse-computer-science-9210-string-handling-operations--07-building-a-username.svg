<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: building a username</text>

<rect x="30" y="110" width="840" height="166" rx="12" fill="#1e2a44"/><text x="48" y="140" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="16" font-weight="400" fill="#e8eef0" text-anchor="start">surname ← "Okafor"</text><text x="48" y="168" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="16" font-weight="400" fill="#e8eef0" text-anchor="start">year ← 2009</text><text x="48" y="196" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="16" font-weight="400" fill="#e8eef0" text-anchor="start">yearText ← INT_TO_STRING(year)</text><text x="48" y="224" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="16" font-weight="400" fill="#e8eef0" text-anchor="start">username ← SUBSTRING(0, 2, surname) + SUBSTRING(2, 3, yearText)</text><text x="48" y="252" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="16" font-weight="400" fill="#e8eef0" text-anchor="start">OUTPUT username</text><rect x="60" y="340" width="52" height="54" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="86" y="375.64" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">O</text><text x="86" y="420" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">0</text><rect x="118" y="340" width="52" heigh