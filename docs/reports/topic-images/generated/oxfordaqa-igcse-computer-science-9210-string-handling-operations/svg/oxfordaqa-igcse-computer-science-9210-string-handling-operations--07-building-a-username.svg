eight="700" fill="#1e2a44" text-anchor="middle">o</text><text x="318" y="420" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">4</text><rect x="350" y="340" width="52" height="54" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="376" y="375.64" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">r</text><text x="376" y="420" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">5</text><path d="M58,336 L58,328 L226,328 L226,336" fill="none" stroke="#2e6b62" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="142" y="318" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">SUBSTRING(0, 2, surname)</text><rect x="500" y="340" width="52" height="54" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="526" y="375.64" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="526" y="420" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">0</text><rect x="558" y="340" width="52" height="54" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="584" y="375.64" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">0</text><text x="584" y="420" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">1</text><rect x="616" y="340" width="52" height="54" rx="8" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="642" y="375.64" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">0</text><text x="642" y="420" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">2</text><rect x="674" y="340" width="52" height="54" rx="8" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="700" y="375.64" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">9</text><text x="700" y="420" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">3</text><path d="M614,336 L614,328 L724,328 L724,336" fill="none" stroke="#8a6d0d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="669" y="318" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">SUBSTRING(2, 3, yearText)</text><text x="616" y="450" font-size="16" font-weight="700" fill="#4a5568" text-anchor="middle">yearText = "2009"</text><rect x="250" y="472" width="400" height="66" rx="14" fill="#1e2a44" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="515" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">"Oka" + "09" = "Oka09"</text><rect x="30" y="562" width="840" height="96" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="54" y="602" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">INT_TO_STRING(year MOD 100)</text><text x="400" y="601" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">gives "9": the leading zero is lost</text><text x="54" y="636" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">So convert the year to a string first, then take its last two characters.</text>
