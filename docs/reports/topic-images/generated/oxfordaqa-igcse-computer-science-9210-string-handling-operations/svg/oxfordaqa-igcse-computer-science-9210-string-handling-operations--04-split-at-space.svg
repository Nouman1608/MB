<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">POSITION finds where, SUBSTRING cuts</text>

<rect x="30" y="110" width="840" height="146" rx="12" fill="#1e2a44"/><text x="48" y="140" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="18" font-weight="400" fill="#e8eef0" text-anchor="start">fullName ← "Amara Diallo"</text><text x="48" y="170" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="18" font-weight="400" fill="#e8eef0" text-anchor="start">gap ← POSITION(fullName, " ")</text><text x="48" y="200" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="18" font-weight="400" fill="#e8eef0" text-anchor="start">first ← SUBSTRING(0, gap - 1, fullName)</text><text x="48" y="230" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="18" font-weight="400" fill="#e8eef0" text-anchor="start">last ← SUBSTRING(gap + 1, LEN(fullName) - 1, fullName)</text><rect x="50" y="326" width="62" height="58" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="81" y="364.36" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">A</text><text x="81" y="410" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">0</text><rect x="118" y="326" width="62" height="58" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="149" y="364.36" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">m</text><text x="149" y="410" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">1</text><rect x="186" y="326" width="62" height="58" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="217" y="364.36" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">a</text><text x="217" y="410" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">2</text><rect x="254" y="326" width="62" height="58" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="285" y="364.36" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">r</text><text x="285" y="410" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">3</text><rect x="322" y="326" width="62" height="58" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="353" y="364.36" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">a</text><text x="353" y="410" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-siz