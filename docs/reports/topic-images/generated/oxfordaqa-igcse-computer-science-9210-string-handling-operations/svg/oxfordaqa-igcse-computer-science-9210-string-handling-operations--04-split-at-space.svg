2a44" text-anchor="middle">o</text><text x="829" y="410" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">11</text><path d="M48,322 L48,314 L382,314 L382,322" fill="none" stroke="#2e6b62" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="215" y="304" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">first: 0 to gap − 1 = 4</text><path d="M456,322 L456,314 L858,314 L858,322" fill="none" stroke="#2b5a9a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="657" y="304" font-size="16" font-weight="700" fill="#2b5a9a" text-anchor="middle">last: gap + 1 = 6 to 11</text><text x="421" y="444" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">gap = 5</text><rect x="30" y="472" width="411" height="64" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="54" y="512" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">first = "Amara"</text><rect x="459" y="472" width="411" height="64" rx="12" fill="#dfe7f3" stroke="#2b5a9a" stroke-width="2.5"/><text x="483" y="512" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">last = "Diallo"</text><text x="450" y="568" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">The − 1 and + 1 leave out the space. The same pattern splits at "@" or ":".</text>
