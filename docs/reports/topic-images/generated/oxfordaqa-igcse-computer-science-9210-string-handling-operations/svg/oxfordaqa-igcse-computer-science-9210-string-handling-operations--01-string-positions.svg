 x="459" y="290" width="411" height="113" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="479" y="323" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">POSITION</text><text x="479" y="350.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">POSITION("Accra", "r") = 3</text><text x="479" y="378.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">where "r" first appears</text><rect x="30" y="419" width="840" height="96" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="54" y="455" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="start">Python counts slices differently</text><text x="54" y="491" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">"Accra"[1:4]</text><text x="230" y="490" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">also gives "ccr": the end position 4 is excluded. State your convention.</text>
