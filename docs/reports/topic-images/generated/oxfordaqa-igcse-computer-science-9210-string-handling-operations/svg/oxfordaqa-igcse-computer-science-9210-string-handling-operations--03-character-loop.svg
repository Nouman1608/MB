<rect x="30" y="110" width="840" height="269" rx="12" fill="#1e2a44"/><text x="48" y="140" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="15" font-weight="400" fill="#e8eef0" text-anchor="start">word ← "programming"</text><text x="48" y="167" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="15" font-weight="400" fill="#e8eef0" text-anchor="start">vowels ← 0</text><text x="48" y="194" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="15" font-weight="400" fill="#e8eef0" text-anchor="start">FOR i ← 0 TO LEN(word) - 1</text><text x="66" y="221" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="15" font-weight="700" fill="#d4b02e" text-anchor="start">letter ← SUBSTRING(i, i, word)</text><text x="66" y="248" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="15" font-weight="400" fill="#e8eef0" text-anchor="start">IF letter = "a" OR letter = "e" OR letter = "i" OR letter = "o" OR letter = "u" THEN</text><text x="84" y="275" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="15" font-weight="400" fill="#e8eef0" text-anchor="start">vowels ← vowels + 1</text><text x="66" y="302" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="15" font-weight="400" fill="#e8eef0" text-anchor="start">ENDIF</text><text x="48" y="329" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="15" font-weight="400" fill="#e8eef0" text-anchor="start">ENDFOR</text><text x="48" y="356" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="15" font-weight="400" fill="#e8eef0" text-anchor="start">OUTPUT vowels</text><rect x="70" y="439" width="64" height="56" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="102" y="476.36" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">p</text><text x="102" y="521" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">0</text><rect x="140" y="439" width="64" height="56" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="172" y="476.36" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">r</text><text x="172" y="521" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">1</text><rect x="210" y="439" width="64" height="56" rx="8" fill="#d4b02e" stroke="#8a6d0d" stroke-width="2.5"/><text x="242" y="476.36" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">o</text><text x="242" y="521" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="