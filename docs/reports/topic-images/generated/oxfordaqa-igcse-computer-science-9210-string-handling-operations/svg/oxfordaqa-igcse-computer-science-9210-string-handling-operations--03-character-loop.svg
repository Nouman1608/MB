 font-size="18" font-weight="400" fill="#4a5568" text-anchor="start">(o, a, i)</text><text x="846" y="621" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">same loop: reverse, count spaces, find a digit</text>
