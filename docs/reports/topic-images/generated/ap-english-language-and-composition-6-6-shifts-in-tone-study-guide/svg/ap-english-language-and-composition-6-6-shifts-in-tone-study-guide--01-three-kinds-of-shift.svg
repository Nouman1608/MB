<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What a shift can signal</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">A change in the writer’s attitude from one part of a text to another</text>
<rect x="30" y="122" width="270" height="270" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="165" y="156" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Qualification</text><path d="M55,212 L185,212 L215,252 L275,252" fill="none" stroke="#2e6b62" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><text x="185" y="200" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start" xml:space="preserve">but</text><text x="165" y="302" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve"><tspan font-weight="700">limits</tspan> <tspan font-weight="700">or</tspan> <tspan font-weight="700">adds</tspan> <tspan font-weight="700">a</tspan> <tspan font-weight="700">condition</tspan></text><text x="165" y="344" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" xml:space="preserve"><tspan font-style="italic">praise,</tspan> <tspan font-style="italic">then</tspan> <tspan font-style="italic">“but”</tspan> <tspan font-style="italic">a</tspan> <tspan font-style="italic">reservation</tspan></text><rect x="315" y="122" width="270" height="270" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="450" y="156" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Refinement</text><path d="M340,232 C400,232 440,202 460,232 S510,252 560,222" fill="none" stroke="#2e6b62" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><path d="M460,232 L560,232" fill="none" stroke="#8a6d0d" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" /><text x="450" y="302" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve"><tspan font-weight="700">sharpens</tspan> <tspan font-weight="700">or</tspan> <tspan font-weight="700">develops</tspan> <tspan font-weight="700">an</tspan> <tspan font-weight="700">idea</tspan></text><text x="450" y="344" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" xml:space="preserve"><tspan font-style="italic">general</tspan> <tspan font-style="italic">admiration,</tspan> <tspan font-style="italic">then</tspan></text><text x="450" y="363.8" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" xml:space="preserve"><tspan font-style="italic">specific,</tspan> <tspan font-style="italic">more</tspan> <tspan font-style="italic">critical</tspan> <tspan font-style="italic">analysis</tspan></text><rect x="600" y="122" width="270" height="270" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="735" y="156" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Reconsideration</text><path d="M625,202 L745,202 Q785,202 785,232 Q785,262 745,262 L685,262" fill="none" stroke="#b5602e" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><path d="M685,262 l14,-8 l0,16 z" fill="#b5602e"/><text x="735" y="302" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve"><tspan font-weight="700">rethinks</tspan> <tspan font-weight="700">or</tspan> <tspan font-weight="700">reverses</tspan> <tspan font-weight="700">a</tspan> <tspan font-weight="700">view</tspan></text><text x="735" y="344" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" xml:space="preserve"><tspan font-style="italic">confident</tspan> <tspan font-style="italic">claim,</tspan> <tspan font-style="italic">then</tspan> <tspan font-style="italic">doubt</tspan> <tspan font-style="italic">or</tspan> <tspan font-style="italic">a</tspan></text><text x="735" y="363.8" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" xml:space="preserve"><tspan font-style="italic">changed</tspan> <tspan font-style="italic">position</tspan></text><rect x="30" y="412" width="840" height="53.120000000000005" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="450" y="443.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">A shift often marks the argument’s <tspan font-weight="700">turning</tspan> <tspan font-weight="700">point</tspan>: find it to describe how the writer’s thought develops.</text>
