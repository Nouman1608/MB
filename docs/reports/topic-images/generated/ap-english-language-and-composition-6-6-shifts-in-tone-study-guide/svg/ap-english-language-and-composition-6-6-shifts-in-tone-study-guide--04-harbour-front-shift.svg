<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 498" width="900" height="498" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="498" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Locating a shift</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Worked example 1: the new harbour front</text>
<rect x="30" y="122" width="560" height="121.75999999999999" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="48" y="154.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“The new harbour front is, <tspan font-weight="700">I</tspan> <tspan font-weight="700">admit</tspan>, <tspan font-weight="700">beautiful</tspan>. The paving is the</text><text x="48" y="176.89" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">colour of <tspan font-weight="700">honey</tspan>, the lamps are shaped like old ship’s <tspan font-weight="700">lanterns</tspan>,</text><text x="48" y="199.32999999999998" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">and on a clear evening the whole bay seems to have been</text><text x="48" y="221.76999999999998" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">arranged for a <tspan font-weight="700">postcard</tspan>.”</text><rect x="620" y="122" width="250" height="121.75999999999999" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5" /><text x="638" y="155.70000000000002" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start" xml:space="preserve">Before</text><text x="638" y="181.81" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">admiring, appreciative:</text><text x="638" y="201.61" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">decorative adjectives, one</text><text x="638" y="221.41" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">long sentence</text><rect x="30" y="259.76" width="560" height="84" rx="12" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5" /><rect x="46" y="283.76" width="60" height="36" rx="18" fill="#d4b02e" stroke="#1e2a44" stroke-width="2" /><text x="76" y="307.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Yet</text><text x="120" y="308.76" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">I could not find a single place to sit down.</text><rect x="620" y="259.76" width="250" height="84" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" /><text x="638" y="292.15999999999997" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start" xml:space="preserve">After</text><text x="638" y="318.27" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">wry, mildly critical: short,</text><text x="638" y="338.07" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">plain, blunt</text><rect x="30" y="365.76" width="410" height="102" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="48" y="399.76" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Markers</text><text x="48" y="426.90999999999997" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">turning word “Yet”; long sentence → short;</text><text x="48" y="446.71" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">decorative → blunt</text><rect x="460" y="365.76" width="410" height="102" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="478" y="399.76" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Effect: qualifies the praise</text><text x="478" y="426.90999999999997" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">beauty fails the people who use it; “postcard”</text><text x="478" y="446.71" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">gains a second meaning</text>
</svg>