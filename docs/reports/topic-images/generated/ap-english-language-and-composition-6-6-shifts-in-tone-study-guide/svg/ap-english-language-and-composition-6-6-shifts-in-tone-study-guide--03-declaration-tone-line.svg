<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 562" width="900" height="562" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="562" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">From caution to resolve</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Declaration of Independence, 1776</text>
<rect x="30" y="122" width="380" height="190" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="220" y="154" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">Measured, cautious</text><text x="50" y="184" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“<tspan font-weight="700">Prudence</tspan>, indeed, will <tspan font-weight="700">dictate</tspan> that</text><text x="50" y="205.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">Governments <tspan font-weight="700">long</tspan> <tspan font-weight="700">established</tspan> should not</text><text x="50" y="226.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">be changed for <tspan font-weight="700">light</tspan> <tspan font-weight="700">and</tspan> <tspan font-weight="700">transient</tspan></text><text x="50" y="247.36" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700">causes</tspan>...”</text><rect x="490" y="122" width="380" height="190" rx="14" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5" /><text x="680" y="154" font-size="19" font-weight="700" fill="#b5602e" text-anchor="middle" xml:space="preserve">Resolute, accusatory</text><text x="510" y="184" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“...a long train of <tspan font-weight="700">abuses</tspan> <tspan font-weight="700">and</tspan></text><text x="510" y="205.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700">usurpations</tspan>... <tspan font-weight="700">absolute</tspan> <tspan font-weight="700">Despotism</tspan>, it is</text><text x="510" y="226.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">their <tspan font-weight="700">right</tspan>, it is their <tspan font-weight="700">duty</tspan>, to throw off such</text><text x="510" y="247.36" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">Government.”</text><circle cx="450" cy="217" r="30" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="224" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">But</text><line x1="40" y1="412" x2="860" y2="412" stroke="#c9d6d4" stroke-width="2"/><path d="M40,402 L430,402 C450,402 450,362 480,358 L860,358" fill="none" stroke="#1e2a44" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><text x="40" y="436" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start" xml:space="preserve">restraint</text><text x="860" y="436" font-size="15" font-weight="700" fill="#4a5568" text-anchor="end" xml:space="preserve">charged moral language; repetition escalates</text><rect x="30" y="456" width="840" height="74.24000000000001" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="450" y="487.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve"><tspan font-weight="700">Qualifies</tspan> the early caution: change should not be light, but it is justified when abuses are long and</text><text x="450" y="508.72" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">systematic. It prepares for the list of grievances.</text>
</svg>