<rect width="900" height="504" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Writing a shift on purpose</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Mark the turn and change the diction</text>
<text x="30" y="138" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Concession then claim</text><rect x="30" y="150" width="360" height="56" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="210" y="183.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">respectful: grant a point</text><rect x="410" y="160" width="80" height="36" rx="18" fill="#d4b02e" stroke="#1e2a44" stroke-width="2" /><text x="450" y="184" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">turn</text><line x1="392" y1="178" x2="406" y2="178" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><line x1="492" y1="178" x2="506" y2="178" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="510" y="150" width="360" height="56" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="690" y="183.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">firmer: assert your claim</text><text x="30" y="242" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Problem then hope</text><rect x="30" y="254" width="360" height="56" rx="14" fill="#f6e3d8" stroke="#c9d6d4" stroke-width="2.5" /><text x="210" y="287.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">grave: describe a difficulty</text><rect x="410" y="264" width="80" height="36" rx="18" fill="#d4b02e" stroke="#1e2a44" stroke-width="2" /><text x="450" y="288" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">turn</text><line x1="392" y1="282" x2="406" y2="282" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><line x1="492" y1="282" x2="506" y2="282" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="510" y="254" width="360" height="56" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="690" y="287.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">hopeful: introduce a solution</text><text x="30" y="346" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Humour then seriousness</text><rect x="30" y="358" width="360" height="56" rx="14" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2.5" /><text x="210" y="391.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">light: engage the audience</text><rect x="410" y="368" width="80" height="36" rx="18" fill="#d4b02e" stroke="#1e2a44" stroke-width="2" /><text x="450" y="392" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">turn</text><line x1="392" y1="386" x2="406" y2="386" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><line x1="492" y1="386" x2="506" y2="386" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="510" y="358" width="360" height="56" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5" /><text x="690" y="391.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">serious: show the stakes</text><text x="450" y="444" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" xml:space="preserve">Mark the turn with a transition, a short sentence or a paragraph break. Avoid accidental shifts, such as</text><text x="450" y="465.12" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" xml:space="preserve">drifting from formal to casual.</text>
</svg>