<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 556" width="900" height="556" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="556" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Markers of a shift</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">The best evidence is a cluster, not a single signal</text>
<rect x="30" y="122" width="412" height="76" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><rect x="30" y="122" width="10" height="76" rx="5" fill="#d4b02e"/><text x="44" y="152.48" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Turning transitions</text><text x="44" y="178.07" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">but, yet, however, still, nevertheless</text><rect x="458" y="122" width="412" height="76" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><rect x="458" y="122" width="10" height="76" rx="5" fill="#d4b02e"/><text x="472" y="152.48" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Change of diction</text><text x="472" y="178.07" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">formal to casual, gentle to harsh</text><rect x="30" y="210" width="412" height="76" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><rect x="30" y="210" width="10" height="76" rx="5" fill="#d4b02e"/><text x="44" y="240.48" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Change in connotation</text><text x="44" y="266.07" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">positive words give way to negative</text><rect x="458" y="210" width="412" height="76" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><rect x="458" y="210" width="10" height="76" rx="5" fill="#d4b02e"/><text x="472" y="240.48" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Change in sentence structure</text><text x="472" y="266.07" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">long and flowing to short and blunt</text><rect x="30" y="298" width="412" height="76" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><rect x="30" y="298" width="10" height="76" rx="5" fill="#d4b02e"/><text x="44" y="328.48" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Change in punctuation</text><text x="44" y="354.07" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">a dash, a colon or a question</text><rect x="458" y="298" width="412" height="76" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><rect x="458" y="298" width="10" height="76" rx="5" fill="#d4b02e"/><text x="472" y="328.48" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Change of address or pronoun</text><text x="472" y="354.07" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“they” to “we”, “I” to “you”</text><rect x="30" y="386" width="412" height="76" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><rect x="30" y="386" width="10" height="76" rx="5" fill="#d4b02e"/><text x="44" y="416.48" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">New imagery</text><text x="44" y="442.07" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">a different set of images or comparisons</text><rect x="458" y="386" width="412" height="76" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><rect x="458" y="386" width="10" height="76" rx="5" fill="#d4b02e"/><text x="472" y="416.48" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">A paragraph break</text><text x="472" y="442.07" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">a new paragraph, a new attitude</text><text x="30" y="508" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Describe it:</text><rect x="140" y="486" width="94.62734999999999" height="40" rx="20" fill="#ffffff" stroke="#1e2a44" stroke-width="2" /><text x="187.313675" y="511" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Locate it</text><line x1="236.62734999999998" y1="506" x2="248.62734999999998" y2="506" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="250.62734999999998" y="486" width="194.2644" height="40" rx="20" fill="#ffffff" stroke="#1e2a44" stroke-width="2" /><text x="347.75955" y="511" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Tone before and after</text><line x1="446.89175" y1="506" x2="458.89175" y2="506" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="460.89175" y="486" width="158.2041" height="40" rx="20" fill="#ffffff" stroke="#1e2a44" stroke-width="2" /><text x="539.9938" y="511" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Quote both sides</text><line x1="621.09585" y1="506" x2="633.09585" y2="506" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="635.09585" y="486" width="180.32850000000002" height="40" rx="20" fill="#dce9e7" stroke="#1e2a44" stroke-width="2" /><text x="725.2601000000001" y="511" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Explain what it does</text>
</svg>