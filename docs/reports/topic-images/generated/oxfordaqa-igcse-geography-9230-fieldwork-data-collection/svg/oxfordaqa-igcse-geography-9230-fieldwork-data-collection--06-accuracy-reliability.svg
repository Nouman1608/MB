<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 771" width="900" height="771" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="771" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Accuracy, reliability and fair tests</text>

<rect x="30" y="110" width="266" height="330" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="163" cy="220" r="70" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.5"/><circle cx="163" cy="220" r="50" fill="#ffffff" stroke="#1e2a44" stroke-width="1.5"/><circle cx="163" cy="220" r="30" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.5"/><circle cx="163" cy="220" r="12" fill="#ffffff" stroke="#1e2a44" stroke-width="1.5"/><circle cx="163" cy="220" r="4" fill="#b5602e"/><circle cx="159" cy="223" r="6" fill="#1e2a44"/><circle cx="166" cy="216" r="6" fill="#1e2a44"/><circle cx="168" cy="224" r="6" fill="#1e2a44"/><circle cx="160" cy="215" r="6" fill="#1e2a44"/><text x="163" y="326" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Accurate and reliable</text><text x="163" y="356" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">readings cluster on the true</text><text x="163" y="377.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">value</text><rect x="317" y="110" width="266" height="330" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><circle cx="450" cy="220" r="70" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.5"/><circle cx="450" cy="220" r="50" fill="#ffffff" stroke="#1e2a44" stroke-width="1.5"/><circle cx="450" cy="220" r="30" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.5"/><circle cx="450" cy="220" r="12" fill="#ffffff" stroke="#1e2a44" stroke-width="1.5"/><circle cx="450" cy="220" r="4" fill="#b5602e"/><circle cx="488" cy="190" r="6" fill="#1e2a44"/><circle cx="494" cy="195" r="6" fill="#1e2a44"/><circle cx="490" cy="184" r="6" fill="#1e2a44"/><circle cx="496" cy="188" r="6" fill="#1e2a44"/><text x="450" y="326" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Reliable, not accurate</text><text x="450" y="356" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">consistent but wrong: a</text><text x="450" y="377.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">thermometer that always</text><text x="450" y="398.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">reads 2 °C too high</text><rect x="604" y="110" width="266" height="330" rx="14" fill="#fbeee6" stroke="#b5602e" stroke-width="2.5"/><circle cx="737" cy="220" r="70" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.5"/><circle cx="737" cy="220" r="50" fill="#ffffff" stroke="#1e2a44" stroke-width="1.5"/><circle cx="737" cy="220" r="30" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.5"/><circle cx="737" cy="220" r="12" fill="#ffffff" stroke="#1e2a44" stroke-width="1.5"/><circle cx="737" cy="220" r="4" fill="#b5602e"/><circle cx="697" cy="250" r="6" fill="#1e2a44"/><circle cx="767" cy="170" r="6" fill="#1e2a44"/><circle cx="787" cy="240" r="6" fill="#1e2a44"/><circle cx="717" cy="175" r="6" fill="#1e2a44"/><text x="737" y="326" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Neither</text><text x="737" y="356" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">scattered and off target</text><text x="450" y="466" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">red dot = the true value</text><rect x="30" y="486" width="840" height="64.24000000000001" fill="#ffffff" stroke="#c9d6d4" stroke-width="1.5"/><text x="46" y="524.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Accuracy</text><text x="190" y="522.56" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">how close to the true value</text><text x="450" y="512" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="start">precise equipment; read scales carefully; keep</text><text x="450" y="533.12" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="start">tapes taut</text><rect x="30" y="550.24" width="840" height="64.24000000000001" fill="#f7f9f9" stroke="#c9d6d4" stroke-width="1.5"/><text x="46" y="588.36" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Reliability</text><text x="190" y="576.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">repeating gives similar</text><text x="190" y="597.36" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">results</text><text x="450" y="576.24" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="start">repeat readings; take the mean; more than one</text><text x="450" y="597.36" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="start">day</text><rect x="30" y="614.48" width="840" height="64.24000000000001" fill="#ffffff" stroke="#c9d6d4" stroke-width="1.5"/><text x="46" y="652.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Procedures</text><text x="190" y="651.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the exact steps followed</text><text x="450" y="640.48" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="start">same method, equipment, time and person at every</text><text x="450" y="661.6" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="start">site</text><rect x="30" y="678.72" width="840" height="64.24000000000001" fill="#f7f9f9" stroke="#c9d6d4" stroke-width="1.5"/><text x="46" y="716.84" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Control group</text><text x="190" y="704.72" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">a comparison without the</text><text x="190" y="725.84" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">factor</text><text x="450" y="715.28" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="start">air temperature over grass as well as tarmac</text>
</svg>