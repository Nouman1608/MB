<rect width="900" height="684" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Designing a data collection sheet</text>

<rect x="30" y="120" width="840" height="330" rx="6" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="52" y="154" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Title: How does the river change downstream?</text><text x="52" y="182" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Date: ________   Time: ______   Weather: ____________</text><rect x="40" y="200" width="60" height="74" rx="0" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.5"/><text x="70" y="242" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Site</text><rect x="40" y="274" width="60" height="44" rx="0" fill="#ffffff" stroke="#1e2a44" stroke-width="1.2"/><text x="70" y="302" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">1</text><rect x="40" y="318" width="60" height="44" rx="0" fill="#ffffff" stroke="#1e2a44" stroke-width="1.2"/><text x="70" y="346" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">2</text><rect x="40" y="362" width="60" height="44" rx="0" fill="#ffffff" stroke="#1e2a44" stroke-width="1.2"/><text x="70" y="390" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">3</text><rect x="100" y="200" width="120" height="74" rx="0" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.5"/><text x="160" y="233" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Distance from</text><text x="160" y="251" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">source (km)</text><rect x="100" y="274" width="120" height="44" rx="0" fill="#ffffff" stroke="#1e2a44" stroke-width="1.2"/><text x="160" y="302" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">0.5</text><rect x="100" y="318" width="120" height="44" rx="0" fill="#ffffff" stroke="#1e2a44" stroke-width="1.2"/><text x="160" y="346" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">1.5</text><rect x="100" y="362" width="120" height="44" rx="0" fill="#ffffff" stroke="#1e2a44" stroke-width="1.2"/><rect x="220" y="200" width="90" height="74" rx="0" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.5"/><text x="265" y="242" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Width (m)</text><rect x="220" y="274" width="90" height="44" rx="0" fill="#ffffff" stroke="#1e2a44" stroke-width="1.2"/><rect x="220" y="318" width="90" height="44" rx="0" fill="#ffffff" stroke="#1e2a44" stroke-width="1.2"/><rect x="220" y="362" width="90" height="44" rx="0" fill="#ffffff" stroke="#1e2a44" stroke-width="1.2"/><rect x="310" y="200" width="150" height="74" rx="0" fill="#f2e7b8" stroke="#1e2a44" stroke-width="1.5"/><text x="385" y="233" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Depth readings</text><text x="385" y="251" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">(cm)</text><rect x="310" y="274" width="150" height="44" rx="0" fill="#ffffff" stroke="#1e2a44" stroke-width="1.2"/><rect x="310" y="318" width="150" height="44" rx="0" fill="#ffffff" stroke="#1e2a44" stroke-width="1.2"/><rect x="310" y="362" width="150" height="44" rx="0" fill="#ffffff" stroke="#1e2a44" stroke-width="1.2"/><rect x="460" y="200" width="100" height="74" rx="0" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.5"/><text x="510" y="233" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Mean depth</text><text x="510" y="251" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">(cm)</text><rect x="460" y="274" width="100" height="44" rx="0" fill="#ffffff" stroke="#1e2a44" stroke-width="1.2"/><rect x="460" y="318" width="100" height="44" rx="0" fill="#ffffff" stroke="#1e2a44" stroke-width="1.2"/><rect x="460" y="362" width="100" height="44" rx="0" fill="#ffffff" stroke="#1e2a44" stroke-width="1.2"/><rect x="560" y="200" width="150" height="74" rx="0" fill="#f2e7b8" stroke="#1e2a44" stroke-width="1.5"/><text x="635" y="233" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Float time over 10</text><text x="635" y="251" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">m (s): 1, 2, 3</text><rect x="560" y="274" width="150" height="44" rx="0" fill="#ffffff" stroke="#1e2a44" stroke-width="1.2"/><rect x="560" y="318" width="150" height="44" rx="0" fill="#ffffff" stroke="#1e2a44" stroke-width="1.2"/><rect x="560" y="362" width="150" height="44" rx="0" fill="#ffffff" stroke="#1e2a44" stroke-width="1.2"/><rect x="710" y="200" width="70" height="74" rx="0" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.5"/><text x="745" y="242" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Mean (s)</text><rect x="710" y="274" width="70" height="44" rx="0" fill="#ffffff" stroke="#1e2a44" stroke-width="1.2"/><rect x="710" y="318" width="70" height="44" rx="0" fill="#ffffff" stroke="#1e2a44" stroke-width="1.2"/><rect x="710" y="362" width="70" height="44" rx="0" fill="#ffffff" stroke="#1e2a44" stroke-width="1.2"/><rect x="780" y="200" width="60" height="74" rx="0" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.5"/><text x="810" y="242" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Notes</text><rect x="780" y="274" width="60" height="44" rx="0" fill="#ffffff" stroke="#1e2a44" stroke-width="1.2"/><rect x="780" y="318" width="60" height="44" rx="0" fill="#ffffff" stroke="#1e2a44" stroke-width="1.2"/><rect x="780" y="362" width="60" height="44" rx="0" fill="#ffffff" stroke="#1e2a44" stroke-width="1.2"/><circle cx="840" cy="148" r="13" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="840" y="153" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">a</text><text x="52" y="470" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">A good sheet includes:</text><circle cx="66" cy="500" r="13" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="66" y="504.68" font-size="13" font-weight="700" fill="#1e2a44" text-anchor="middle">a</text><text x="90" y="506" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">the title, date, time and weather</text><circle cx="66" cy="536" r="13" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="66" y="540.68" font-size="13" font-weight="700" fill="#1e2a44" text-anchor="middle">b</text><text x="90" y="542" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">site number and location (grid reference or distance)</text><circle cx="66" cy="572" r="13" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="66" y="576.68" font-size="13" font-weight="700" fill="#1e2a44" text-anchor="middle">c</text><text x="90" y="578" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">a column for each variable, with units</text><circle cx="66" cy="608" r="13" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="66" y="612.68" font-size="13" font-weight="700" fill="#1e2a44" text-anchor="middle">d</text><text x="90" y="614" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">space for repeat readings and their mean</text><circle cx="66" cy="644" r="13" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="66" y="648.68" font-size="13" font-weight="700" fill="#1e2a44" text-anchor="middle">e</text><text x="90" y="650" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">a notes column for anything unusual</text><circle cx="70" cy="426" r="13" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="70" y="431" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">b</text><circle cx="265" cy="426" r="13" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="265" y="431" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">c</text><circle cx="510" cy="426" r="13" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="510" y="431" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">d</text><circle cx="810" cy="426" r="13" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="810" y="431" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">e</text>
</svg>