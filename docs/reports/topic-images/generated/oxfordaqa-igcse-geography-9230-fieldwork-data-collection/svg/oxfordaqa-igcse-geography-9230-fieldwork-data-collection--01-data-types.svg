<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 619" width="900" height="619" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="619" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Types of data</text>

<text x="30" y="128" font-size="18" font-weight="700" fill="#4a5568" text-anchor="start">Who collected it?</text><rect x="30" y="142" width="410" height="150" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.2"/><text x="48" y="179.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Primary</text><text x="48" y="207.07" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">collected first-hand by you or your group</text><text x="48" y="228.19" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"></text><text x="48" y="249.31" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">e.g. measurements, counts, questionnaires,</text><text x="48" y="270.43" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">field sketches</text><rect x="460" y="142" width="410" height="150" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="478" y="179.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Secondary</text><text x="478" y="207.07" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">collected by someone else</text><text x="478" y="228.19" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"></text><text x="478" y="249.31" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">e.g. census data, maps, published river-flow</text><text x="478" y="270.43" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">records, GIS layers</text><circle cx="450" cy="217" r="20" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="450" y="223" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">or</text><text x="30" y="330" font-size="18" font-weight="700" fill="#4a5568" text-anchor="start">What form does it take?</text><rect x="30" y="344" width="410" height="150" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.2"/><text x="48" y="381.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Quantitative</text><text x="48" y="409.07" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">numerical</text><text x="48" y="430.19" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"></text><text x="48" y="451.31" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">e.g. river width, pedestrian count,</text><text x="48" y="472.43" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">temperature</text><rect x="460" y="344" width="410" height="150" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="478" y="381.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Qualitative</text><text x="478" y="409.07" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">descriptive</text><text x="478" y="430.19" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"></text><text x="478" y="451.31" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">e.g. interview comments, photographs, field</text><text x="478" y="472.43" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">sketches</text><circle cx="450" cy="419" r="20" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="450" y="425" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">or</text><rect x="30" y="518" width="840" height="72.24000000000001" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="548.2" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Alternative methods must go beyond pre-processed data: e.g. selecting data from the internet, raw</text><text x="450" y="569.32" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">data from the teacher, or interviews at school or home.</text>
</svg>