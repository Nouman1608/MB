<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Choosing a sample</text>

<rect x="30" y="110" width="266" height="470" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="163" y="146" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Random</text><rect x="53" y="164" width="220" height="220" rx="4" fill="#d8e3c6" stroke="#1e2a44" stroke-width="2"/><rect x="75" y="194" width="18" height="18" rx="2" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><rect x="193" y="178" width="18" height="18" rx="2" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><rect x="123" y="256" width="18" height="18" rx="2" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><rect x="233" y="224" width="18" height="18" rx="2" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><rect x="163" y="304" width="18" height="18" rx="2" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><rect x="83" y="330" width="18" height="18" rx="2" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><rect x="213" y="350" width="18" height="18" rx="2" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><rect x="247" y="282" width="18" height="18" rx="2" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><rect x="123" y="360" width="18" height="18" rx="2" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><rect x="171" y="224" width="18" height="18" rx="2" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="163" y="410" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">10 quadrats</text><text x="48" y="472" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">random numbers choose grid</text><text x="48" y="493.12" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">coordinates</text><text x="48" y="522.24" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">avoids your bias; may miss</text><text x="48" y="543.36" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">parts by chance</text><rect x="317" y="110" width="266" height="470" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="146" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Systematic</text><rect x="340" y="164" width="220" height="220" rx="4" fill="#d8e3c6" stroke="#1e2a44" stroke-width="2"/><rect x="368" y="200" width="18" height="18" rx="2" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><rect x="423" y="200" width="18" height="18" rx="2" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><rect x="478" y="200" width="18" height="18" rx="2" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><rect x="533" y="200" width="18" height="18" rx="2" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><rect x="368" y="275" width="18" height="18" rx="2" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><rect x="423" y="275" width="18" height="18" rx="2" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><rect x="478" y="275" width="18" height="18" rx="2" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><rect x="533" y="275" width="18" height="18" rx="2" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><rect x="368" y="350" width="18" height="18" rx="2" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><rect x="423" y="350" width="18" height="18" rx="2" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="450" y="410" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">10 quadrats</text><text x="335" y="472" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">sites at regular intervals</text><text x="335" y="501.12" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">even coverage, easy to</text><text x="335" y="522.24" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">repeat; may miss features</text><text x="335" y="543.36" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">between sites</text><rect x="604" y="110" width="266" height="470" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="737" y="146" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Stratified</text><rect x="627" y="164" width="154" height="220" rx="4" fill="#d8e3c6" stroke="#1e2a44" stroke-width="2"/><rect x="781" y="164" width="66" height="220" rx="4" fill="#a9c48f" stroke="#1e2a44" stroke-width="2"/><text x="704" y="406" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">grass 70%</text><text x="814" y="406" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">wood 30%</text><rect x="647" y="189" width="18" height="18" rx="2" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><rect x="707" y="189" width="18" height="18" rx="2" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><rect x="752" y="189" width="18" height="18" rx="2" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><rect x="647" y="259" width="18" height="18" rx="2" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><rect x="707" y="259" width="18" height="18" rx="2" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><rect x="752" y="259" width="18" height="18" rx="2" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><rect x="677" y="329" width="18" height="18" rx="2" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><rect x="802" y="204" width="18" height="18" rx="2" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><rect x="802" y="274" width="18" height="18" rx="2" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><rect x="802" y="344" width="18" height="18" rx="2" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="737" y="430" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">7 quadrats on grass, 3 in woodland</text><text x="622" y="472" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">each group sampled in</text><text x="622" y="493.12" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">proportion</text><text x="622" y="522.24" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">represents every group;</text><text x="622" y="543.36" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">needs information in advance</text><text x="30" y="608" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Sampling a place by</text><rect x="30" y="622" width="266" height="70" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="163" y="650" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Points</text><text x="163" y="676" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">sites along a river</text><rect x="317" y="622" width="266" height="70" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="450" y="650" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Lines (transects)</text><text x="450" y="676" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">across a sand dune system</text><rect x="604" y="622" width="266" height="70" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="737" y="650" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Areas</text><text x="737" y="676" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">quadrats on a field</text>
</svg>