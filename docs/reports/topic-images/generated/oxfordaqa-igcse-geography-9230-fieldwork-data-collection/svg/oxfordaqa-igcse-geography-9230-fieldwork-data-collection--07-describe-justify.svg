<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 630" width="900" height="630" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="630" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Describing and justifying a method</text>

<text x="450" y="104" font-size="16" font-weight="600" fill="#4a5568" text-anchor="middle" font-style="italic">Question: Describe and justify one method you used to collect primary data. [4 marks]</text><rect x="30" y="122" width="840" height="52" rx="12" fill="#2e6b62" stroke="#2e6b62" stroke-width="2.2"/><text x="52" y="155" font-size="19" font-weight="700" fill="#ffffff" text-anchor="start">Description: so someone else could repeat it</text><rect x="30" y="184" width="266" height="60" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="46" y="209" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Equipment</text><text x="46" y="232" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">an orange float</text><rect x="317" y="184" width="266" height="60" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="333" y="209" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Distance</text><text x="333" y="232" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">a measured 10 m stretch</text><rect x="604" y="184" width="266" height="60" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="620" y="209" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Position</text><text x="620" y="232" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the centre of the channel</text><rect x="30" y="254" width="266" height="60" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="46" y="279" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Repeats</text><text x="46" y="302" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">three per site; mean taken</text><rect x="317" y="254" width="266" height="60" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="333" y="279" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Sites</text><text x="333" y="302" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">six sites</text><rect x="30" y="334" width="840" height="52" rx="12" fill="#8a6d0d" stroke="#8a6d0d" stroke-width="2.2"/><text x="52" y="367" font-size="19" font-weight="700" fill="#ffffff" text-anchor="start">Justification: why it was a good choice</text><rect x="30" y="396" width="840" height="56" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="52" y="431" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Time</text><text x="200" y="431" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">cheap and quick, so all six sites could be measured in one day</text><rect x="30" y="460" width="840" height="56" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="52" y="495" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Reliability</text><text x="200" y="495" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">three repeats reduced the effect of the float catching on a rock</text><rect x="30" y="524" width="840" height="56" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="52" y="559" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Fairness</text><text x="200" y="559" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">measuring in the centre at every site kept the procedure the same</text><text x="450" y="602" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">✗ “It was easy” is not a justification unless it is linked to the enquiry.</text>
</svg>