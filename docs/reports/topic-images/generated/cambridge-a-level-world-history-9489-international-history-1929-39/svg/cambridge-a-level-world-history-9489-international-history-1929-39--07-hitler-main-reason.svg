<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 585" width="900" height="585" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="585" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Was Hitler's foreign policy the main reason?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Weigh the stated factor against the alternatives</text>
<rect x="30" y="124" width="198" height="117" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="173.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Appeasement</text><text x="46" y="200.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Encouraged him</text><rect x="244" y="124" width="198" height="117" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="260" y="173.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">League failure</text><text x="260" y="200.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Removed restraint</text><rect x="458" y="124" width="198" height="117" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="474" y="173.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Nazi-Soviet Pact</text><text x="474" y="200.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">No two-front war</text><rect x="672" y="124" width="198" height="117" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="688" y="153.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Guarantee to</text><text x="688" y="174.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Poland</text><text x="688" y="201" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">A commitment Hitler</text><text x="688" y="221" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">did not believe</text><rect x="150" y="305" width="600" height="137" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="337" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">STATED FACTOR</text><text x="450" y="365.38" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Hitler's aims and actions</text><text x="450" y="395.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Overturn Versailles; unite German-speakers; Lebensraum; the</text><text x="450" y="417.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">decision to invade Poland</text><line x1="129" y1="247" x2="300" y2="299" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="343" y1="247" x2="400" y2="299" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="557" y1="247" x2="500" y2="299" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="771" y1="247" x2="600" y2="299" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="464" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="498.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">A possible judgement</text><text x="450" y="528.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Hitler's aims made war <tspan font-weight="700" fill="#1e2a44">likely</tspan>; the Nazi-Soviet Pact determined its <tspan font-weight="700" fill="#1e2a44">timing</tspan>.</text>
</svg>