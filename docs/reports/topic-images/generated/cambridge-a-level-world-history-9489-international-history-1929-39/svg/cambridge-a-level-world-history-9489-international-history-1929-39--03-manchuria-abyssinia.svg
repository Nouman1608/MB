<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Two tests the League failed</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Manchuria and Abyssinia compared</text>
<clipPath id="tc124"><rect x="30" y="124" width="840" height="321" rx="14"/></clipPath><g clip-path="url(#tc124)"><rect x="30" y="124" width="178.1818181818182" height="49" fill="#b5d3cf"/><rect x="208.1818181818182" y="124" width="330.90909090909093" height="49" fill="#b5d3cf"/><text x="222.1818181818182" y="152.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Manchuria, 1931-33</text><rect x="539.0909090909091" y="124" width="330.90909090909093" height="49" fill="#f2e7b8"/><text x="553.0909090909091" y="152.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Abyssinia, 1935-36</text><rect x="30" y="173" width="178.1818181818182" height="68" fill="#dce9e7"/><text x="44" y="199.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Trigger</text><rect x="208.1818181818182" y="173" width="330.90909090909093" height="68" fill="#ffffff"/><text x="222.1818181818182" y="199.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Mukden incident (September 1931);</text><text x="222.1818181818182" y="220.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Kwantung Army creates Manchukuo</text><rect x="539.0909090909091" y="173" width="330.90909090909093" height="68" fill="#ffffff"/><text x="553.0909090909091" y="199.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Walwal clash (December 1934); Italy</text><text x="553.0909090909091" y="220.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">invades (October 1935)</text><line x1="30" y1="241" x2="870" y2="241" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="241" width="178.1818181818182" height="68" fill="#dce9e7"/><text x="44" y="267.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">League action</text><rect x="208.1818181818182" y="241" width="330.90909090909093" height="68" fill="#f8faf9"/><text x="222.1818181818182" y="267.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Lytton Commission: condemns Japan</text><text x="222.1818181818182" y="288.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">but proposes autonomy under China</text><rect x="539.0909090909091" y="241" width="330.90909090909093" height="68" fill="#f8faf9"/><text x="553.0909090909091" y="267.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Italy named aggressor; sanctions, but</text><text x="553.0909090909091" y="288.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">not on oil, coal or steel; Suez left open</text><line x1="30" y1="309" x2="870" y2="309" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="309" width="178.1818181818182" height="68" fill="#dce9e7"/><text x="44" y="335.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Undermined by</text><rect x="208.1818181818182" y="309" width="330.90909090909093" height="68" fill="#ffffff"/><text x="222.1818181818182" y="335.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Distance; little British or French power</text><text x="222.1818181818182" y="356.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">in the Far East; USA not a member</text><rect x="539.0909090909091" y="309" width="330.90909090909093" height="68" fill="#ffffff"/><text x="553.0909090909091" y="335.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Hoare-Laval Plan leaked (December</text><text x="553.0909090909091" y="356.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">1935)</text><line x1="30" y1="377" x2="870" y2="377" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="377" width="178.1818181818182" height="68" fill="#dce9e7"/><text x="44" y="403.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Outcome</text><rect x="208.1818181818182" y="377" width="330.90909090909093" height="68" fill="#f8faf9"/><text x="222.1818181818182" y="403.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Japan announces withdrawal (February</text><text x="222.1818181818182" y="424.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">1933); no sanctions</text><rect x="539.0909090909091" y="377" width="330.90909090909093" height="68" fill="#f8faf9"/><text x="553.0909090909091" y="403.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Conquest complete (May 1936);</text><text x="553.0909090909091" y="424.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">sanctions lifted (July)</text></g><line x1="208.1818181818182" y1="124" x2="208.1818181818182" y2="445" stroke="#c9d6d4" stroke-width="1.5"/><line x1="539.0909090909091" y1="124" x2="539.0909090909091" y2="445" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="124" width="840" height="321" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="481" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Five underlying causes of failure</text><rect x="139.144" y="503" width="152.848" height="30" rx="15" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="215.568" y="523.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">No disarmament</text><rect x="301.992" y="503" width="188.64" height="30" rx="15" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="396.312" y="523.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Major powers absent</text><rect x="500.632" y="503" width="260.224" height="30" rx="15" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="630.744" y="523.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Reliance on Britain and France</text><rect x="246.504" y="543" width="280" height="30" rx="15" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="386.504" y="563.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Depression: sanctions too costly</text><rect x="536.504" y="543" width="116.992" height="30" rx="15" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="595" y="563.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Nationalism</text>
