<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 405" width="900" height="405" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="405" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Shifting alignments, 1934-37</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">From the Stresa Front to the Axis</text>
<rect x="30" y="124" width="270" height="217" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="152" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">1934-35</text><text x="46" y="178.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Collective security</text><text x="46" y="207.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">USSR</tspan> joins the League (1934);</text><text x="46" y="228.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">pacts with <tspan font-weight="700" fill="#1e2a44">France</tspan> and</text><text x="46" y="249.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Czechoslovakia</tspan> (1935)</text><text x="46" y="278.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Britain and France reluctant</text><text x="46" y="299.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">partners; purges raise doubts</text><rect x="315" y="124" width="270" height="217" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="331" y="152" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">APRIL 1935</text><text x="331" y="178.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Stresa Front</text><text x="331" y="207.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Britain,</tspan> <tspan font-weight="700" fill="#1e2a44">France,</tspan> <tspan font-weight="700" fill="#1e2a44">Italy</tspan> condemn</text><text x="331" y="228.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">German rearmament</text><text x="331" y="257.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Collapses within months:</text><text x="331" y="278.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Anglo-German Naval</text><text x="331" y="299.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Agreement; Abyssinia</text><rect x="600" y="124" width="270" height="217" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="616" y="152" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">1936-37</text><text x="616" y="178.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Axis and Anti-Comintern</text><text x="616" y="207.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Germany</tspan> <tspan font-weight="700" fill="#1e2a44">and</tspan> <tspan font-weight="700" fill="#1e2a44">Italy</tspan></text><text x="616" y="228.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">(Rome-Berlin Axis, 1936);</text><text x="616" y="249.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Germany</tspan> <tspan font-weight="700" fill="#1e2a44">and</tspan> <tspan font-weight="700" fill="#1e2a44">Japan</tspan>, joined by</text><text x="616" y="270.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Italy</tspan> in 1937</text><text x="616" y="299.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Against international</text><text x="616" y="320.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">communism</text><line x1="450" y1="363" x2="600" y2="363" stroke="#b5602e" stroke-width="4" marker-end="url(#ahR)"/><text x="440" y="369" font-size="16" font-weight="700" fill="#b5602e" text-anchor="end">Italy moves</text><text x="610" y="369" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">after Abyssinia and Spain</text>
</svg>