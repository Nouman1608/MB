<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 578" width="900" height="578" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="578" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">One crisis, four political effects</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">How the Depression changed each power's policy</text>
<rect x="225" y="124" width="450" height="89" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="450" y="159.6" font-size="20" font-weight="700" fill="#b5602e" text-anchor="middle">The Depression</text><text x="450" y="188.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Unemployment, lost exports, rural distress</text><line x1="450" y1="219" x2="135" y2="257" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="450" y1="219" x2="345" y2="257" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="450" y1="219" x2="555" y2="257" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="450" y1="219" x2="765" y2="257" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="279" width="199.5" height="158" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="305" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">GERMANY</text><text x="44" y="331.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Nazis rise</text><text x="44" y="359" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Fringe party in 1928;</text><text x="44" y="379" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">largest party July 1932;</text><text x="44" y="399" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Hitler Chancellor</text><text x="44" y="419" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">January 1933</text><rect x="243.5" y="279" width="199.5" height="158" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="257.5" y="305" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">JAPAN</text><text x="257.5" y="331.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Army gains power</text><text x="257.5" y="359" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Silk exports collapse;</text><text x="257.5" y="379" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Inukai assassinated</text><text x="257.5" y="399" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">(1932); party cabinets</text><text x="257.5" y="419" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">end</text><rect x="457" y="279" width="199.5" height="158" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="471" y="325" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ITALY</text><text x="471" y="351.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Foreign success</text><text x="471" y="379" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Mussolini seeks</text><text x="471" y="399" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">prestige abroad</text><rect x="670.5" y="279" width="199.5" height="158" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="684.5" y="325" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">USA</text><text x="684.5" y="351.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Isolation</text><text x="684.5" y="379" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Neutrality Acts from</text><text x="684.5" y="399" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">1935</text><rect x="30" y="457" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="491.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">The pattern</text><text x="450" y="521.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Extremism and expansion grew in Germany, Japan and Italy; the USA turned inward.</text>
</svg>