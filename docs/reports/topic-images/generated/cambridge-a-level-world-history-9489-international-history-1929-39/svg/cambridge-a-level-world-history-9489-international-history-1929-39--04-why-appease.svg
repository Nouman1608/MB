<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 525" width="900" height="525" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="525" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why Britain and France appeased</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Different pressures, the same caution</text>
<rect x="30" y="124" width="411" height="258" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">BRITAIN</text><text x="50" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Considerations</text><text x="50" y="211.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="211.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Depression limited money for arms</text><text x="50" y="237.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="237.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Ten-Year Rule dropped only in 1932</text><text x="50" y="263.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="263.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Public opinion: Oxford Union (1933), Peace</text><text x="65.2" y="284.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Ballot (1934-35)</text><text x="50" y="310.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="310.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Fear of bombing</text><text x="50" y="336.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="336.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Fascism as a bulwark against Bolshevism;</text><text x="65.2" y="357.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">sympathy over Versailles</text><rect x="459" y="124" width="411" height="258" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="479" y="177" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FRANCE</text><text x="479" y="203.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Considerations</text><text x="479" y="232.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="494.2" y="232.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Economic problems</text><text x="479" y="258.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="494.2" y="258.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Political divisions: riots of February 1934</text><text x="479" y="284.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="494.2" y="284.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Fear of communism; Popular Front (1936)</text><text x="479" y="310.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="494.2" y="310.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Dependent on Britain</text><text x="479" y="336.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="494.2" y="336.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Maginot Line: defence, not offence</text><rect x="30" y="404" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="438.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Not just cowardice</text><text x="450" y="468.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Appeasement was a policy with <tspan font-weight="700" fill="#1e2a44">economic</tspan>, <tspan font-weight="700" fill="#1e2a44">military</tspan> and <tspan font-weight="700" fill="#1e2a44">political</tspan> reasons.</text>
</svg>