<rect width="900" height="484" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What schools teach, and why</text>

<rect x="30" y="108" width="404" height="150" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="232" y="146" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Official curriculum</text><text x="232" y="178" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">The subjects formally taught</text><rect x="62" y="206" width="104" height="36" rx="18" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="114" y="230" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">maths</text><rect x="178" y="206" width="104" height="36" rx="18" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="230" y="230" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">science</text><rect x="294" y="206" width="104" height="36" rx="18" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="346" y="230" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">history</text><rect x="466" y="108" width="404" height="150" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5" stroke-dasharray="8 6"/><text x="668" y="146" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Hidden curriculum</text><text x="668" y="178" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Attitudes taught through routine</text><rect x="482" y="206" width="116" height="36" rx="18" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="540" y="230" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">punctuality</text><rect x="610" y="206" width="116" height="36" rx="18" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="668" y="230" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">authority</text><rect x="738" y="206" width="116" height="36" rx="18" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="796" y="230" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">competition</text><rect x="30" y="286" width="269.3333333333333" height="174" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,336 L31.25,300.25 Q31.25,287.25 44.25,287.25 L285.0833333333333,287.25 Q298.0833333333333,287.25 298.0833333333333,300.25 L298.0833333333333,336 Z" fill="#b5d3cf"/><line x1="31.25" y1="336" x2="298.0833333333333" y2="336" stroke="#c9d6d4" stroke-width="2"/><text x="164.66666666666666" y="316.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Functionalism</text><text x="44" y="367.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Davis and Moore</text><text x="44" y="394.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Allocates roles by ability and</text><text x="44" y="415.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">socialises shared values:</text><text x="44" y="436.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“role allocation”</text><rect x="315.3333333333333" y="286" width="269.3333333333333" height="174" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M316.5833333333333,336 L316.5833333333333,300.25 Q316.5833333333333,287.25 329.5833333333333,287.25 L570.4166666666666,287.25 Q583.4166666666666,287.25 583.4166666666666,300.25 L583.4166666666666,336 Z" fill="#dce9e7"/><line x1="316.5833333333333" y1="336" x2="583.4166666666666" y2="336" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="316.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Marxism</text><text x="329.3333333333333" y="367.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Bourdieu</text><text x="329.3333333333333" y="394.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Reproduces class inequality:</text><text x="329.3333333333333" y="415.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">schools reward the “cultural</text><text x="329.3333333333333" y="436.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">capital” of better-off pupils</text><rect x="600.6666666666666" y="286" width="269.3333333333333" height="174" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.9166666666666,336 L601.9166666666666,300.25 Q601.9166666666666,287.25 614.9166666666666,287.25 L855.75,287.25 Q868.75,287.25 868.75,300.25 L868.75,336 Z" fill="#f2e7b8"/><line x1="601.9166666666666" y1="336" x2="868.75" y2="336" stroke="#c9d6d4" stroke-width="2"/><text x="735.3333333333333" y="316.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Radical / critical</text><text x="614.6666666666666" y="367.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Freire, Illich</text><text x="614.6666666666666" y="394.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Traditional schooling can</text><text x="614.6666666666666" y="415.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">suppress critical thought</text><text x="614.6666666666666" y="436.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">rather than develop it</text>
</svg>