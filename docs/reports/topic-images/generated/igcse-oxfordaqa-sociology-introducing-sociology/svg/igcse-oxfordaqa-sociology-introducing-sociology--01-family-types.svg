xt x="343.3" y="280" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">more relatives beyond</text><text x="343.3" y="300" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">parents and children</text><rect x="456.6" y="108" width="200" height="200" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><line x1="556.6" y1="168" x2="556.6" y2="208" stroke="#1e2a44" stroke-width="2.5"/><line x1="531.6" y1="208" x2="581.6" y2="208" stroke="#1e2a44" stroke-width="2.5"/><circle cx="556.6" cy="168" r="13" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="531.6" cy="216" r="13" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="581.6" cy="216" r="13" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="556.6" y="258" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Single-parent</text><text x="556.6" y="280" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">one parent and their</text><text x="556.6" y="300" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">children</text><rect x="669.9000000000001" y="108" width="200" height="200" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><line x1="739.9000000000001" y1="168" x2="799.9000000000001" y2="168" stroke="#1e2a44" stroke-width="2.5"/><line x1="739.9000000000001" y1="168" x2="739.9000000000001" y2="208" stroke="#1e2a44" stroke-width="2.5"/><line x1="799.9000000000001" y1="168" x2="799.9000000000001" y2="208" stroke="#1e2a44" stroke-width="2.5" stroke-dasharray="5 4"/><circle cx="739.9000000000001" cy="168" r="13" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="799.9000000000001" cy="168" r="13" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="739.9000000000001" cy="216" r="13" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="799.9000000000001" cy="216" r="13" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="769.90000000000