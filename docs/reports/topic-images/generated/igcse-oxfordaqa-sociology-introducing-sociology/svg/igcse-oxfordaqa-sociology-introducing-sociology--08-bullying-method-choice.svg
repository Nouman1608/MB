<rect x="30" y="108" width="840" height="60" rx="12" fill="#1e2a44" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="146" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">Research aim: bullying in a secondary school</text><rect x="30" y="190" width="412" height="188" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,240 L31.25,204.25 Q31.25,191.25 44.25,191.25 L427.75,191.25 Q440.75,191.25 440.75,204.25 L440.75,240 Z" fill="#b5d3cf"/><line x1="31.25" y1="240" x2="440.75" y2="240" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="221" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Questionnaire</text><circle cx="49" cy="266.53999999999996" r="4.5" fill="#2e6b62"/><text x="62" y="272.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">+</tspan> Anonymous, so pupils may answer honestly</text><text x="62" y="294.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">on a sensitive topic</text><circle cx="49" cy="318.53999999999996" r="4.5" fill="#2e6b62"/><text x="62" y="324.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">+</tspan> Large sample; reliable</text><circle cx="49" cy="348.53999999999996" r="4.5" fill="#2e6b62"/><text x="62" y="354.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">−</tspan> Little depth on why bullying happens</text><rect x="458" y="190" width="412" height="188" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,240 L459.25,204.25 Q459.25,191.25 472.25,191.25 L855.75,191.25 Q868.75,191.25 868.75,204.25 L868.75,240 Z" fill="#f2e7b8"/><line x1="459.25" y1="240" x2="868.75" y2="240" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="221" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Unstructured interview</text><circle cx="477" cy="266.53999999999996" r="4.5" fill="#2e6b62"/><text x="490" y="272.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">+</tspan> Rich detail on experiences and meanings</text><circle cx="477" cy="296.53999999999996" r="4.5" fill="#2e6b62"/><text x="490" y="302.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">−</tspan> Pupils may not open up to an adult</text><text x="490" y="324.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">stranger</text><circle cx="477" cy="348.53999999999996" r="4.5" fill="#2e6b62"/><text x="490" y="354.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">−</tspan> Small sample, not representative</text><path d="M232,382 L232,408 L668,408 L668,382" fill="none" stroke="#1e2a44" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><line x1="450" y1="408" x2="450" y2="434" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="130" y="440" width="640" height="110" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="474" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Best: combine both</text><text x="450" y="504" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Questionnaire: how widespread is it?</text><text x="450" y="530" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Follow-up interviews with volunteers: why does it happen?</text>
