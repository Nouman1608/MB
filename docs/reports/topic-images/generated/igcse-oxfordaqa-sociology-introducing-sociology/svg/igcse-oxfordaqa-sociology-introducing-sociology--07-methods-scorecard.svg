<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 757" width="900" height="757" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="757" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Judging research methods</text>

<text x="450" y="104" font-size="18" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Reliability and validity often trade off against each other</text><text x="372" y="154" font-size="17" font-weight="700" fill="#4a5568" text-anchor="middle">Strong on</text><text x="470" y="154" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">Strength / weakness</text><rect x="30" y="182" width="260" height="66" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="220.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Questionnaire</text><rect x="300" y="195" width="144" height="40" rx="20" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="372" y="221" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Reliability</text><rect x="460" y="182" width="410" height="66" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="474" y="210" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">+ Large samples, cheap</text><text x="474" y="234" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">− Low response, may lack depth</text><rect x="30" y="256" width="260" height="66" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="294.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Structured interview</text><rect x="300" y="269" width="144" height="40" rx="20" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="372" y="295" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Reliability</text><rect x="460" y="256" width="410" height="66" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="474" y="284" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">+ Comparable</text><text x="474" y="308" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">− Limited depth; interviewer effect</text><rect x="30" y="330" width="260" height="66" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="368.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Unstructured interview</text><rect x="300" y="343" width="144" height="40" rx="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="372" y="369" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Validity</text><rect x="460" y="330" width="410" height="66" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="474" y="358" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">+ Rich, valid detail</text><text x="474" y="382" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">− Time-consuming; hard to replicate</text><rect x="30" y="404" width="260" height="66" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="442.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Participant observation</text><rect x="300" y="417" width="144" height="40" rx="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="372" y="443" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Validity</text><rect x="460" y="404" width="410" height="66" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="474" y="432" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">+ Natural setting</text><text x="474" y="456" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">− Not reliable; going native</text><rect x="30" y="478" width="260" height="66" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="516.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Official statistics</text><rect x="300" y="491" width="144" height="40" rx="20" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="372" y="517" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Scale</text><rect x="460" y="478" width="410" height="66" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="474" y="506" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">+ Large scale, free, comparable</text><text x="474" y="530" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">− Made for other purposes</text><rect x="30" y="562" width="840" height="171" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="598" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Three tests for any method</text><circle cx="61" cy="621.39" r="4.5" fill="#8a6d0d"/><text x="74" y="627" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Reliability:</tspan> would repeating it give the same result?</text><circle cx="61" cy="651.39" r="4.5" fill="#8a6d0d"/><text x="74" y="657" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Validity:</tspan> does it measure what it claims?</text><circle cx="61" cy="681.39" r="4.5" fill="#8a6d0d"/><text x="74" y="687" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Representativeness:</tspan> can it be generalised? A bigger sample does not remove bias from a</text><text x="74" y="709" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">biased method</text>
</svg>