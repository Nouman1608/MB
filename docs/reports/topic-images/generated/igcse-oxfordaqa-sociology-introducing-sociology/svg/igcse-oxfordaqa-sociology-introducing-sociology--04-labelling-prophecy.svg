<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 766" width="900" height="766" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="766" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How a label comes true</text>

<circle cx="450" cy="360" r="200" fill="none" stroke="#2e6b62" stroke-width="4" stroke-dasharray="12 8"/><circle cx="450" cy="360" r="96" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="352" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Self-fulfilling</text><text x="450" y="378" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">prophecy</text><path d="M-14,-13 L14,0 L-14,13 z" transform="translate(591.4213562373095,218.57864376269052) rotate(45)" fill="#2e6b62"/><path d="M-14,-13 L14,0 L-14,13 z" transform="translate(591.4213562373095,501.4213562373095) rotate(135)" fill="#2e6b62"/><path d="M-14,-13 L14,0 L-14,13 z" transform="translate(308.5786437626905,501.4213562373095) rotate(225)" fill="#2e6b62"/><path d="M-14,-13 L14,0 L-14,13 z" transform="translate(308.5786437626905,218.57864376269052) rotate(315)" fill="#2e6b62"/><rect x="325" y="111" width="250" height="98" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="141" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Teacher labels a pupil</text><text x="450" y="165" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">“bright” or “disruptive”,</text><text x="450" y="185" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">often on limited evidence</text><rect x="565" y="311" width="250" height="98" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="690" y="341" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Expectations change</text><text x="690" y="365" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">the teacher expects more, or</text><text x="690" y="385" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">less</text><rect x="325" y="511" width="250" height="98" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="541" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Treatment changes</text><text x="450" y="565" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">how the pupil is treated in</text><text x="450" y="585" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">class</text><rect x="85" y="321" width="250" height="78" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="210" y="351" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Pupil internalises the label</text><text x="210" y="375" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">and acts it out</text><rect x="30" y="630" width="840" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="61" cy="660.39" r="4.5" fill="#8a6d0d"/><text x="74" y="666" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Pupil subcultures form in response: some pro-school, some anti-school</text><circle cx="61" cy="690.39" r="4.5" fill="#8a6d0d"/><text x="74" y="696" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Racism and sexism in the classroom can work through the same labelling process (Becker on</text><text x="74" y="718" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">labelling)</text>
</svg>