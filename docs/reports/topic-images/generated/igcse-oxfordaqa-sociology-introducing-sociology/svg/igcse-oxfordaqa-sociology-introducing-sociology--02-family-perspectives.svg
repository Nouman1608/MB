<rect width="900" height="503" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three views of the family</text>

<rect x="30" y="104" width="269.3333333333333" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,154 L31.25,118.25 Q31.25,105.25 44.25,105.25 L285.0833333333333,105.25 Q298.0833333333333,105.25 298.0833333333333,118.25 L298.0833333333333,154 Z" fill="#b5d3cf"/><line x1="31.25" y1="154" x2="298.0833333333333" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="164.66666666666666" y="135" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Functionalism</text><text x="46" y="188.15" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="start">Parsons</text><circle cx="51" cy="212.54" r="4.5" fill="#2e6b62"/><text x="64" y="218.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The family performs</text><text x="64" y="240.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">positive functions</text><circle cx="51" cy="264.53999999999996" r="4.5" fill="#2e6b62"/><text x="64" y="270.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Primary socialisation</text><circle cx="51" cy="294.53999999999996" r="4.5" fill="#2e6b62"/><text x="64" y="300.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">“Stabilisation of adult</text><text x="64" y="322.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">personalities”</text><rect x="315.3333333333333" y="104" width="269.3333333333333" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M316.5833333333333,154 L316.5833333333333,118.25 Q316.5833333333333,105.25 329.5833333333333,105.25 L570.4166666666666,105.25 Q583.4166666666666,105.25 583.4166666666666,118.25 L583.4166666666666,154 Z" fill="#dce9e7"/><line x1="316.5833333333333" y1="154" x2="583.4166666666666" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="135" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Marxism</text><text x="331.3333333333333" y="188.15" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="start">Engels</text><circle cx="336.3333333333333" cy="212.54" r="4.5" fill="#2e6b62"/><text x="349.3333333333333" y="218.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The family serves</text><text x="349.3333333333333" y="240.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">capitalism</text><circle cx="336.3333333333333" cy="264.53999999999996" r="4.5" fill="#2e6b62"/><text x="349.3333333333333" y="270.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Reproduces labour power</text><circle cx="336.3333333333333" cy="294.53999999999996" r="4.5" fill="#2e6b62"/><text x="349.3333333333333" y="300.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Transmits property</text><circle cx="336.3333333333333" cy="324.53999999999996" r="4.5" fill="#2e6b62"/><text x="349.3333333333333" y="330.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A form of social control</text><rect x="600.6666666666666" y="104" width="269.3333333333333" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.9166666666666,154 L601.9166666666666,118.25 Q601.9166666666666,105.25 614.9166666666666,105.25 L855.75,105.25 Q868.75,105.25 868.75,118.25 L868.75,154 Z" fill="#f2e7b8"/><line x1="601.9166666666666" y1="154" x2="868.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="735.3333333333333" y="135" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Feminism</text><text x="616.6666666666666" y="188.15" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="start">Oakley</text><circle cx="621.6666666666666" cy="212.54" r="4.5" fill="#2e6b62"/><text x="634.6666666666666" y="218.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The family positions women</text><text x="634.6666666666666" y="240.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">unequally</text><circle cx="621.6666666666666" cy="264.53999999999996" r="4.5" fill="#2e6b62"/><text x="634.6666666666666" y="270.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Especially around domestic</text><text x="634.6666666666666" y="292.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">labour and childcare</text><rect x="30" y="370" width="840" height="119" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="406" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Growing diversity</text><circle cx="61" cy="429.39" r="4.5" fill="#8a6d0d"/><text x="74" y="435" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Smart:</tspan> individualisation</text><circle cx="61" cy="459.39" r="4.5" fill="#8a6d0d"/><text x="74" y="465" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Stacey:</tspan> diverse, “negotiated” family forms</text>
</svg>