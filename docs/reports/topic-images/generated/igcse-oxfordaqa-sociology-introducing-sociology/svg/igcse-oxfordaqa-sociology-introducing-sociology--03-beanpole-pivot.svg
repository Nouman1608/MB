<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Beanpole families and the pivot generation</text>

<text x="240" y="112" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Demographic change</text><rect x="30" y="128" width="420" height="110" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="162" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Rising life expectancy</text><text x="50" y="186" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">more generations alive at once</text><text x="50" y="214" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Falling birth rates: fewer members in each</text><line x1="240" y1="244" x2="240" y2="276" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><circle cx="160" cy="320" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><circle cx="220" cy="320" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><line x1="190" y1="344" x2="190" y2="388" stroke="#1e2a44" stroke-width="3"/><text x="260" y="326" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Grandparents</text><circle cx="160" cy="430" r="22" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="220" cy="430" r="22" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><line x1="190" y1="454" x2="190" y2="498" stroke="#1e2a44" stroke-width="3"/><text x="260" y="436" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Parents (pivot)</text><circle cx="160" cy="540" r="22" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><circle cx="220" cy="540" r="22" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="260" y="546" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Children</text><text x="200" y="640" font-size="17" font-weight="600" fill="#4a5568" text-anchor="middle" font-style="italic">A “beanpole” family</text><rect x="500" y="128" width="370" height="500" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M501.25,178 L501.25,142.25 Q501.25,129.25 514.25,129.25 L855.75,129.25 Q868.75,129.25 868.75,142.25 L868.75,178 Z" fill="#d4b02e"/><line x1="501.25" y1="178" x2="868.75" y2="178" stroke="#c9d6d4" stroke-width="2"/><text x="685" y="158.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">The pivot generation</text><rect x="540" y="210" width="290" height="80" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="685" y="256" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Ageing parents</text><rect x="540" y="370" width="290" height="80" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="685" y="416" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Adults in the middle</text><rect x="540" y="530" width="290" height="80" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="685" y="576" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Their children</text><line x1="685" y1="366" x2="685" y2="296" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><line x1="685" y1="454" x2="685" y2="524" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><text x="700" y="336" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="start">care</text><text x="700" y="494" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="start">care</text>
