<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 654" width="900" height="654" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="654" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Global education: what limits access?</text>

<rect x="30" y="104" width="412" height="186" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,154 L31.25,118.25 Q31.25,105.25 44.25,105.25 L427.75,105.25 Q440.75,105.25 440.75,118.25 L440.75,154 Z" fill="#b5d3cf"/><line x1="31.25" y1="154" x2="440.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="135" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Provision</text><circle cx="51" cy="181.92" r="4.5" fill="#2e6b62"/><text x="64" y="187.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Years of free, compulsory schooling</text><circle cx="51" cy="210.92" r="4.5" fill="#2e6b62"/><text x="64" y="216.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Class sizes and trained teachers</text><circle cx="51" cy="239.92" r="4.5" fill="#2e6b62"/><text x="64" y="245.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">School buildings and materials</text><rect x="458" y="104" width="412" height="186" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,154 L459.25,118.25 Q459.25,105.25 472.25,105.25 L855.75,105.25 Q868.75,105.25 868.75,118.25 L868.75,154 Z" fill="#dce9e7"/><line x1="459.25" y1="154" x2="868.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="135" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Poverty</text><circle cx="479" cy="181.92" r="4.5" fill="#2e6b62"/><text x="492" y="187.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Children kept home to work or care for</text><text x="492" y="208.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">siblings</text><circle cx="479" cy="231.92" r="4.5" fill="#2e6b62"/><text x="492" y="237.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">School fees and uniform costs</text><circle cx="479" cy="260.92" r="4.5" fill="#2e6b62"/><text x="492" y="266.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Underfunded schools</text><rect x="30" y="306" width="412" height="207" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,356 L31.25,320.25 Q31.25,307.25 44.25,307.25 L427.75,307.25 Q440.75,307.25 440.75,320.25 L440.75,356 Z" fill="#f2e7b8"/><line x1="31.25" y1="356" x2="440.75" y2="356" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="337" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Gender and other inequalities</text><circle cx="51" cy="383.92" r="4.5" fill="#2e6b62"/><text x="64" y="389.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Girls may leave early through early marriage,</text><text x="64" y="410.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">domestic work or safety concerns</text><circle cx="51" cy="433.92" r="4.5" fill="#2e6b62"/><text x="64" y="439.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Disability, rural location and conflict</text><circle cx="51" cy="462.92" r="4.5" fill="#2e6b62"/><text x="64" y="468.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">UNESCO: about two-thirds of adults without</text><text x="64" y="489.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">basic literacy are women</text><rect x="458" y="306" width="412" height="207" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,356 L459.25,320.25 Q459.25,307.25 472.25,307.25 L855.75,307.25 Q868.75,307.25 868.75,320.25 L868.75,356 Z" fill="#efdfa8"/><line x1="459.25" y1="356" x2="868.75" y2="356" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="337" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Digital access</text><circle cx="479" cy="383.92" r="4.5" fill="#2e6b62"/><text x="492" y="389.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Devices, electricity and internet connection</text><circle cx="479" cy="412.92" r="4.5" fill="#2e6b62"/><text x="492" y="418.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Especially visible when schools closed during</text><text x="492" y="439.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the COVID-19 pandemic</text><rect x="30" y="529" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="565" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Literacy rates</text><text x="56" y="594" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Compare global rates and rates between countries, and link explanations back to the</text><text x="56" y="616" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">perspectives on education.</text>
</svg>