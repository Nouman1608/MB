<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 432" width="900" height="432" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="432" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Answering on a physical hazard</text>

<rect x="30" y="140" width="250" height="135" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="173" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Physical causes</text><text x="48" y="202.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="202.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Tectonic setting</text><text x="48" y="227.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="227.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Monsoon rainfall</text><text x="48" y="252.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="252.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Glacial melt</text><rect x="620" y="140" width="250" height="135" rx="12" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="638" y="173" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Human impacts</text><text x="638" y="202.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="654" y="202.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Settlement damage</text><text x="638" y="227.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="654" y="227.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Displacement</text><text x="638" y="252.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="654" y="252.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Economic loss</text><rect x="330" y="147.5" width="240" height="120" rx="18" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="191.5" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Named hazard</text><text x="450" y="219.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">earthquake, flood or</text><text x="450" y="241.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">glacial process</text><line x1="284" y1="207.5" x2="324" y2="207.5" stroke="#1e2a44" stroke-width="5" marker-end="url(#ah)"/><line x1="574" y1="207.5" x2="614" y2="207.5" stroke="#1e2a44" stroke-width="5" marker-end="url(#ah)"/><text x="155" y="126" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">CAUSE</text><text x="450" y="126" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">EVENT</text><text x="745" y="126" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">IMPACT</text><rect x="30" y="305" width="840" height="97" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="335.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The specification says “human and physical causes and impacts”: an answer that links a named</text><text x="48" y="357.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">hazard’s causes to its human impacts matches what is tested. A list of landforms on its own does</text><text x="48" y="379.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">not.</text>
</svg>