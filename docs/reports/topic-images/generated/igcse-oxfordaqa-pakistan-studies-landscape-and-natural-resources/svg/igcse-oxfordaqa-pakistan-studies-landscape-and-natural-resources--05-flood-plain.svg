<rect width="900" height="537" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What a flood plain is</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">simple cross-section, not to scale</text>
<rect x="30" y="112" width="840" height="300" rx="14" fill="#e6eef0"/><path d="M30,232 Q120,242 180,302 L380,308 L410,352 L490,352 L520,308 L720,302 Q780,242 870,232 L870,412 L30,412 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><path d="M180,302 L380,308 L380,328 L180,322 Z M520,308 L720,302 L720,322 L520,328 Z" fill="#9a7a4a" opacity="0.65"/><path d="M386,320 L410,352 L490,352 L514,320 Z" fill="#b5d3cf"/><line x1="180" y1="280" x2="720" y2="280" stroke="#2b5a9a" stroke-width="3" stroke-dasharray="10 7"/><text x="450" y="270" font-size="16" font-weight="700" fill="#2b5a9a" text-anchor="middle">water level in a flood</text><text x="450" y="382" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">river channel</text><text x="280" y="252" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">flood plain</text><text x="620" y="252" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">flood plain</text><text x="280" y="372" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">fertile deposited soil</text><line x1="280" y1="358" x2="280" y2="314" stroke="#1e2a44" stroke-width="1.5"/><text x="90" y="212" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">higher ground</text><rect x="30" y="432" width="840" height="75" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="462.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Flood plain: the low-lying land alongside a river that is subject to periodic flooding and typically has</text><text x="48" y="484.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">fertile, deposited soil. Do not confuse it with a delta.</text>
</svg>