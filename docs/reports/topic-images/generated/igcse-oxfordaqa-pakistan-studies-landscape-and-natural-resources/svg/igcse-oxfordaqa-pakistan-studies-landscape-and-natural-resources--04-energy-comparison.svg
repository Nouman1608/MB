<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 468" width="900" height="468" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="468" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Comparing a renewable and a non-renewable</text>

<rect x="30" y="112" width="840" height="231" rx="12" fill="#ffffff"/><path d="M30,156 L30,124 Q30,112 42,112 L858,112 Q870,112 870,124 L870,156 Z" fill="#b5d3cf"/><rect x="30" y="156" width="840" height="83" fill="#ffffff"/><text x="42" y="181.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Non-renewable:</text><text x="42" y="202.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">natural gas</text><text x="242" y="181.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Established infrastructure; reliable,</text><text x="242" y="202.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">high-output supply for industry and</text><text x="242" y="223.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">households</text><text x="562" y="181.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Finite reserves; import dependency</text><text x="562" y="202.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">once domestic reserves decline;</text><text x="562" y="223.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">environmental and climate impact</text><line x1="30" y1="156" x2="870" y2="156" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="239" width="840" height="104" fill="#dce9e7"/><text x="42" y="264.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Renewable: hydel</text><text x="42" y="285.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">power</text><text x="242" y="264.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Abundant potential from Pakistan’s</text><text x="242" y="285.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">river systems and glacial meltwater;</text><text x="242" y="306.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">lower long-term running costs</text><text x="562" y="264.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">High upfront construction cost;</text><text x="562" y="285.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">depends on seasonal river flow;</text><text x="562" y="306.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">possible environmental disruption from</text><text x="562" y="327.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">dams</text><line x1="30" y1="239" x2="870" y2="239" stroke="#c9d6d4" stroke-width="1.5"/><line x1="230" y1="112" x2="230" y2="343" stroke="#c9d6d4" stroke-width="1.5"/><line x1="550" y1="112" x2="550" y2="343" stroke="#c9d6d4" stroke-width="1.5"/><text x="42" y="141.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Resource</text><text x="242" y="141.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Advantage</text><text x="562" y="141.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Disadvantage</text><rect x="30" y="112" width="840" height="231" rx="12" fill="none" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="363" width="840" height="75" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="393.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Go resource by resource with a clear advantage and disadvantage for each. Avoid the general claim</text><text x="48" y="415.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">that “renewables are better”.</text>
</svg>