<rect width="900" height="774" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Two rain-bringers: monsoon and western disturbances</text>

<rect x="30" y="112" width="840" height="330" rx="12" fill="#e6eef0" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="140" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">schematic: arrows show general direction only, not a map</text><rect x="560" y="232" width="200" height="110" rx="16" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="660" y="294" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Pakistan</text><line x1="330" y1="402" x2="552" y2="322" stroke="#2e6b62" stroke-width="9" marker-end="url(#ahT)"/><text x="60" y="382" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">MONSOON</text><text x="60" y="404" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="start">summer, from the south-west</text><line x1="330" y1="222" x2="548" y2="262" stroke="#2b5a9a" stroke-width="9" marker-end="url(#ah)"/><text x="60" y="192" font-size="19" font-weight="700" fill="#2b5a9a" text-anchor="start">WESTERN DISTURBANCES</text><text x="60" y="214" font-size="16" font-weight="400" fill="#2b5a9a" text-anchor="start">winter, from the Mediterranean</text><text x="60" y="234" font-size="16" font-weight="400" fill="#2b5a9a" text-anchor="start">and Caspian regions</text><rect x="30" y="462" width="840" height="209" rx="12" fill="#ffffff"/><path d="M30,506 L30,474 Q30,462 42,462 L858,462 Q870,462 870,474 L870,506 Z" fill="#b5d3cf"/><rect x="30" y="506" width="840" height="41" fill="#ffffff"/><text x="42" y="531.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Season</text><text x="242" y="531.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Summer</text><text x="562" y="531.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Winter</text><line x1="30" y1="506" x2="870" y2="506" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="547" width="840" height="62" fill="#dce9e7"/><text x="42" y="572.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Comes from</text><text x="242" y="572.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The south-west</text><text x="562" y="572.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The Mediterranean and Caspian</text><text x="562" y="593.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">regions</text><line x1="30" y1="547" x2="870" y2="547" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="609" width="840" height="62" fill="#ffffff"/><text x="42" y="634.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Brings</text><text x="242" y="634.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The bulk of summer rainfall</text><text x="562" y="634.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Rain and snow to northern and western</text><text x="562" y="655.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Pakistan</text><line x1="30" y1="609" x2="870" y2="609" stroke="#c9d6d4" stroke-width="1.5"/><line x1="230" y1="462" x2="230" y2="671" stroke="#c9d6d4" stroke-width="1.5"/><line x1="550" y1="462" x2="550" y2="671" stroke="#c9d6d4" stroke-width="1.5"/><text x="42" y="491.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start"></text><text x="242" y="491.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Monsoon</text><text x="562" y="491.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Western disturbances</text><rect x="30" y="462" width="840" height="209" rx="12" fill="none" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="691" width="840" height="53" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="721.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Common mistake: treating them as one system, or calling all of Pakistan’s rainfall monsoon-driven.</text>
</svg>