<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 615" width="900" height="615" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="615" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Where sovereignty comes from</text>

<line x1="450" y1="350" x2="180" y2="197.5" stroke="#1e2a44" stroke-width="2.5"/><line x1="450" y1="350" x2="720" y2="197.5" stroke="#1e2a44" stroke-width="2.5"/><line x1="450" y1="350" x2="180" y2="502.5" stroke="#1e2a44" stroke-width="2.5"/><line x1="450" y1="350" x2="720" y2="502.5" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="115" width="300" height="165" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="180" y="172.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Force</text><text x="180" y="198.35000000000002" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Weber (1919): monopoly of legitimate</text><text x="180" y="218.15000000000003" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">force. Haiti: gangs controlled much</text><text x="180" y="237.95000000000002" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">of the capital after 2021</text><rect x="570" y="115" width="300" height="165" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="720" y="160.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">International law and</text><text x="720" y="185.13000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">norms</text><text x="720" y="210.93" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Montevideo (1933) criteria; UNGA</text><text x="720" y="230.73000000000002" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">68/262 (2014) on Ukraine’s</text><text x="720" y="250.53" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">territorial integrity</text><rect x="30" y="420" width="300" height="165" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="180" y="477.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Recognition</text><text x="180" y="503.35" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Nicaragua (2021) and Honduras (2023)</text><text x="180" y="523.15" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">switched to Beijing; Kosovo not a UN</text><text x="180" y="542.95" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">member</text><rect x="570" y="420" width="300" height="165" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="720" y="487.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Consent of the governed</text><text x="720" y="513.35" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Scotland’s agreed 2014 referendum:</text><text x="720" y="533.15" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">about 55% voted to stay</text><circle cx="450" cy="350" r="92" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="343.49" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">State</text><text x="450" y="371.21000000000004" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">sovereignty</text>
</svg>