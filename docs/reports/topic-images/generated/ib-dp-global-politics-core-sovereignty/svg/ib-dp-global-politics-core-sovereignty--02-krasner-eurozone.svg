<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 647" width="900" height="647" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="647" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Which sovereignty? Krasner’s four meanings</text>

<text x="450" y="136" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">Has a eurozone member, without its own interest rates, lost sovereignty?</text><rect x="30" y="150" width="840" height="51.760000000000005" rx="12" fill="#2e6b62"/><text x="42" y="178.2" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">Krasner (1999)</text><text x="302" y="178.2" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">Meaning</text><text x="632" y="178.2" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">Eurozone member</text><rect x="30" y="197.76" width="840" height="42.44" fill="#ffffff"/><text x="42" y="224.20999999999998" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Domestic</text><text x="302" y="224.20999999999998" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">effective control at home</text><text x="632" y="224.20999999999998" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">✓ intact</text><rect x="30" y="240.2" width="840" height="42.44" fill="#fbeee6"/><text x="42" y="266.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Interdependence</text><text x="302" y="266.65" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">control over cross-border flows</text><text x="632" y="266.65" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">▼ reduced (money flows)</text><line x1="30" y1="240.2" x2="870" y2="240.2" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="282.64" width="840" height="42.44" fill="#ffffff"/><text x="42" y="309.09" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">International legal</text><text x="302" y="309.09" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">recognition</text><text x="632" y="309.09" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">✓ intact</text><line x1="30" y1="282.64" x2="870" y2="282.64" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="325.08" width="840" height="64.88" fill="#ffffff"/><text x="42" y="351.53" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Westphalian</text><text x="302" y="351.53" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">no outside actors in domestic</text><text x="302" y="373.96999999999997" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">authority</text><text x="632" y="351.53" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">—</text><line x1="30" y1="325.08" x2="870" y2="325.08" stroke="#c9d6d4" stroke-width="1.5"/><line x1="290" y1="197.76" x2="290" y2="389.96" stroke="#c9d6d4" stroke-width="1.5"/><line x1="620" y1="197.76" x2="620" y2="389.96" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="150" width="840" height="239.95999999999998" rx="12" fill="none" stroke="#1e2a44" stroke-width="2.2"/><rect x="30" y="413.96" width="410" height="130" rx="12" fill="#fbeee6" stroke="#b5602e" stroke-width="2.2"/><text x="48" y="450.01" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Traditional notion: yes</text><text x="48" y="477.13" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">a key power now sits with the European Central</text><text x="48" y="498.25" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Bank</text><rect x="460" y="413.96" width="410" height="130" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="478" y="450.01" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Pooled sovereignty: not really</text><text x="478" y="477.13" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">shared by treaty; shapes ECB policy; could</text><text x="478" y="498.25" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">leave under Article 50</text><rect x="30" y="563.96" width="840" height="52.44" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="595.11" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">It has given up some control but not its authority: the answer depends on the notion used.</text>
</svg>