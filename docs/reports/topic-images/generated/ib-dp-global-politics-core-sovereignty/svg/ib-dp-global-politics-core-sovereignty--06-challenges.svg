<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 793" width="900" height="793" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="793" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Challenges to state sovereignty</text>

<rect x="30" y="110" width="410" height="560" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="235" y="146" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">From states and the system</text><rect x="50" y="165" width="370" height="110" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="64" y="196.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Global interdependence</text><text x="64" y="221.9" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">15% global minimum corporate tax (2021)</text><rect x="50" y="289" width="370" height="110" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="64" y="320.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Interference by other states</text><text x="64" y="345.90000000000003" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Russia’s invasion of Ukraine, 2022</text><rect x="50" y="413" width="370" height="110" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="64" y="444.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Supranationality</text><text x="64" y="469.90000000000003" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">EU law has priority (Costa v ENEL, 1964);</text><text x="64" y="489.70000000000005" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Brexit 2020</text><rect x="50" y="537" width="370" height="110" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="64" y="568.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Humanitarian intervention</text><text x="64" y="593.9" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">UNSC 1973 on Libya (2011); vetoes on Syria</text><rect x="460" y="110" width="410" height="560" rx="14" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.5"/><text x="665" y="146" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">From non-state actors and other claims</text><rect x="480" y="165" width="370" height="88" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="492" y="193.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Indigenous claims</text><text x="492" y="218.95000000000002" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">UNDRIP (2007); Waitangi (1840); Sámi</text><text x="492" y="238.75000000000003" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Parliaments</text><rect x="480" y="264" width="370" height="88" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="492" y="292.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Transnational groups</text><text x="492" y="317.95" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Kurdistan Region referendum, 2017</text><rect x="480" y="363" width="370" height="88" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="492" y="391.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Nationalist movements</text><text x="492" y="416.95" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Scotland 2014 vs Catalonia 2017</text><rect x="480" y="462" width="370" height="88" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="492" y="490.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Violent non-state actors</text><text x="492" y="515.9499999999999" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Islamic State “caliphate”, 2014–2019</text><rect x="480" y="561" width="370" height="88" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="492" y="589.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">TNCs</text><text x="492" y="614.9499999999999" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Philip Morris v Uruguay: Uruguay won, 2016</text><rect x="30" y="690" width="840" height="72.24000000000001" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="720.2" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Whether something is a challenge depends on which notion of sovereignty you examine: build that into</text><text x="450" y="741.32" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">every answer.</text>
</svg>