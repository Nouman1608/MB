<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 541" width="900" height="541" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="541" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Internal and external sovereignty</text>

<rect x="30" y="110" width="840" height="51.760000000000005" rx="12" fill="#2e6b62"/><text x="42" y="138.2" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start"></text><text x="222" y="138.2" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">Internal sovereignty</text><text x="552" y="138.2" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">External sovereignty</text><rect x="30" y="157.76" width="840" height="62.24000000000001" fill="#ffffff"/><text x="42" y="183.35999999999999" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Meaning</text><text x="222" y="183.35999999999999" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">supreme authority over people and</text><text x="222" y="204.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">territory inside the borders</text><text x="552" y="183.35999999999999" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">independence from outside control;</text><text x="552" y="204.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">recognised as an equal</text><rect x="30" y="220" width="840" height="62.24000000000001" fill="#f7f9f9"/><text x="42" y="245.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Shown by</text><text x="222" y="245.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">making and enforcing laws, taxing,</text><text x="222" y="266.71999999999997" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">controlling force</text><text x="552" y="245.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">recognition, UN membership, treaties,</text><text x="552" y="266.71999999999997" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">non-intervention</text><line x1="30" y1="220" x2="870" y2="220" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="282.24" width="840" height="62.24000000000001" fill="#ffffff"/><text x="42" y="307.84000000000003" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Main threat</text><text x="222" y="307.84000000000003" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">armed groups, secession, loss of</text><text x="222" y="328.96000000000004" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">consent</text><text x="552" y="307.84000000000003" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">invasion, interference, supranational</text><text x="552" y="328.96000000000004" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">rules, intervention</text><line x1="30" y1="282.24" x2="870" y2="282.24" stroke="#c9d6d4" stroke-width="1.5"/><line x1="210" y1="157.76" x2="210" y2="344.48" stroke="#c9d6d4" stroke-width="1.5"/><line x1="540" y1="157.76" x2="540" y2="344.48" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="110" width="840" height="234.48000000000002" rx="12" fill="none" stroke="#1e2a44" stroke-width="2.2"/><text x="30" y="374.48" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">De jure (legal right) and de facto (actual control) can split</text><rect x="30" y="390.48" width="410" height="120" rx="12" fill="#fbeee6" stroke="#b5602e" stroke-width="2.2"/><text x="48" y="427.48" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Somalia</text><text x="48" y="454.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">de jure recognition for years; armed groups</text><text x="48" y="475.72" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">such as al-Shabaab control parts of the</text><text x="48" y="496.84000000000003" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">territory</text><rect x="460" y="390.48" width="410" height="120" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="478" y="427.48" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Taiwan</text><text x="478" y="454.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">strong de facto internal sovereignty; formal</text><text x="478" y="475.72" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">recognition from only a small number of states</text>
</svg>