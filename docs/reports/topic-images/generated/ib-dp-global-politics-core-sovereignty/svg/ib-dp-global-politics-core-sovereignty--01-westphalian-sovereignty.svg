<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 685" width="900" height="685" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="685" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The traditional (Westphalian) notion</text>

<text x="450" y="136" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">Traced to the Peace of Westphalia, 1648</text><rect x="30" y="150" width="840" height="94.16" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="84" cy="197.07999999999998" r="28" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="84" y="207.16" font-size="28" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="136" y="189.85" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Territoriality</text><text x="136" y="215.57" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">authority tied to a fixed territory with clear borders</text><rect x="30" y="256.15999999999997" width="840" height="94.16" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="84" cy="303.23999999999995" r="28" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="84" y="313.31999999999994" font-size="28" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="136" y="296.01" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Supreme authority</text><text x="136" y="321.73" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">the state has the final say inside its territory (Bodin, 1576; Hobbes, 1651)</text><rect x="30" y="362.31999999999994" width="840" height="94.16" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="84" cy="409.3999999999999" r="28" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="84" y="419.4799999999999" font-size="28" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="136" y="402.16999999999996" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Non-intervention</text><text x="136" y="427.89" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">outside actors have no right to decide what happens inside</text><rect x="30" y="468.4799999999999" width="840" height="94.16" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="84" cy="515.56" r="28" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="84" y="525.64" font-size="28" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="136" y="508.3299999999999" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Legal equality</text><text x="136" y="534.05" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">every sovereign state has the same formal rights, large or small</text><rect x="30" y="582.6399999999999" width="840" height="72.24000000000001" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="612.8399999999999" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">UN Charter: sovereign equality (2(1)), no force against territorial integrity (2(4)), no UN</text><text x="450" y="633.9599999999999" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">intervention in domestic matters except Chapter VII (2(7)).</text>
</svg>