<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 690" width="900" height="690" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="690" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What the model paragraph does</text>

<text x="450" y="128" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Task: your plans after your exams, one other option, and your reasons</text><rect x="30" y="150" width="840" height="82" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="66" cy="191" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="66" y="198.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="100" y="186" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Intention</text><text x="100" y="211" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">subjunctive</text><text x="846" y="204" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="end">‏میرا ارادہ ہے کہ میں ... داخلہ لوں ... پڑھوں‏</text><rect x="30" y="246" width="840" height="82" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="66" cy="287" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="66" y="294.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="100" y="282" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Condition</text><text x="100" y="307" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">if ... then</text><text x="846" y="300" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="end">‏اگر ... تو ... مل سکتا ہے‏</text><rect x="30" y="342" width="840" height="82" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="66" cy="383" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="66" y="390.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="100" y="378" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Other option</text><text x="100" y="403" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">past tense</text><text x="846" y="396" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="end">‏میرے بڑے بھائی نے ... تربیت حاصل کی‏</text><rect x="30" y="438" width="840" height="82" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="66" cy="479" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="66" y="486.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="100" y="486" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Preference</text><text x="846" y="492" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="end">‏مجھے پڑھائی زیادہ پسند ہے‏</text><rect x="30" y="534" width="840" height="82" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="66" cy="575" r="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="66" y="582.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="100" y="570" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Balanced judgement</text><text x="100" y="595" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">on the one hand ... on the other</text><text x="846" y="588" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="end">‏ایک طرف ...، دوسری طرف ...‏</text><text x="450" y="662" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">It compares two routes and weighs cost against opportunity</text>
</svg>