305" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="670" y="200" width="200" height="210" rx="14" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><text x="770" y="236" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">Later:</text><text x="770" y="262" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">university</text><text x="770" y="318" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="middle">‏یونیورسٹی / جامعہ‏</text><text x="770" y="382" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="middle">‏اعلیٰ تعلیم‏</text><text x="52" y="548" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Practicalities and choices</text><rect x="30" y="566" width="120" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="90" y="612" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="middle">‏داخلہ‏</text><text x="90" y="650" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">admission</text><rect x="160" y="566" width="170" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="245" y="612" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="middle">‏درخواست دینا‏</text><text x="245" y="650" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">to apply</text><rect x="340" y="566" width="100" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="390" y="612" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="middle">‏فیس‏</text><text x="390" y="650" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">fees</text><rect x="450" y="566" width="130" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="515" y="612" font-family="Noto Na