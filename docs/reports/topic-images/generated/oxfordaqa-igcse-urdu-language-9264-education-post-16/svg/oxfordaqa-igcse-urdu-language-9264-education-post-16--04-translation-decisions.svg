<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 750" width="900" height="750" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="750" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three decisions in one translation</text>

<rect x="30" y="108" width="840" height="76" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="450" y="140" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">"After my exams I will go to college. I would like to study at a</text><text x="450" y="166" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">university abroad, but living there is expensive."</text><rect x="30" y="204" width="260" height="104" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="160" y="264" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">"will go"</text><line x1="296" y1="256" x2="334" y2="256" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="340" y="204" width="530" height="104" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="846" y="252" font-family="Noto Nastaliq Urdu" font-size="26" font-weight="400" fill="#1e2a44" text-anchor="end">‏جاؤں گی‏</text><text x="730" y="250" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end">girl</text><text x="640" y="252" font-family="Noto Nastaliq Urdu" font-size="26" font-weight="400" fill="#1e2a44" text-anchor="end">‏جاؤں گا‏</text><text x="530" y="250" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end">boy</text><text x="846" y="294" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end">future ending matches the speaker</text><rect x="30" y="324" width="260" height="104" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="160" y="384" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">"would like to"</text><line x1="296" y1="376" x2="334" y2="376" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="340" y="324" width="530" height="104" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="846" y="372" font-family="Noto Nastaliq Urdu" font-size="26" font-weight="400" fill="#1e2a44" text-anchor="end">‏چاہتا ہوں‏</text><text x="846" y="414" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end">Urdu uses the present tense where English says "would"</text><rect x="30" y="444" width="260" height="104" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="160" y="504" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle"></text><line x1="296" y1="496" x2="334" y2="496" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="340" y="444" width="530" height="104" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="846" y="492" font-family="Noto Nastaliq Urdu" font-size="26" font-weight="400" fill="#1e2a44" text-anchor="end">‏وہاں رہنے کے اخراجات بہت زیادہ ہیں‏</text><text x="846" y="534" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end">translate the sense: "the expenses are very high"</text><text x="160" y="490" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">"living there is</text><text x="160" y="514" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">expensive"</text><rect x="30" y="572" width="840" height="156" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="54" y="604" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="start">Answer</text><text x="846" y="650" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="end">‏امتحانات کے بعد میں کالج جاؤں گا۔ میں بیرونِ ملک کسی یونیورسٹی میں پڑھنا چاہتا ہوں،‏</text><text x="846" y="704" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="end">‏لیکن وہاں رہنے کے اخراجات بہت زیادہ ہیں۔‏</text>
</svg>