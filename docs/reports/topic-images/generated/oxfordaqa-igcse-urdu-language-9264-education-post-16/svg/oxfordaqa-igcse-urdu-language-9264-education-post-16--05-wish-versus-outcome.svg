<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 636" width="900" height="636" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="636" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Wish, cause and purpose</text>

<rect x="30" y="108" width="840" height="148" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="140" font-size="18" font-weight="700" fill="#4a5568" text-anchor="start">Text</text><text x="846" y="178" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="end">‏میرا بھائی یونیورسٹی جانا چاہتا تھا، لیکن والد صاحب کی بیماری کی وجہ سے اس نے‏</text><text x="846" y="230" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="end">‏پیشہ ورانہ تربیت کا انتخاب کیا تاکہ وہ جلدی کمانے لگے۔‏</text><text x="450" y="292" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Why did the brother choose vocational training? [2]</text><rect x="30" y="316" width="266" height="250" rx="14" fill="#f6ece4" stroke="#b5602e" stroke-width="2.5"/><text x="163" y="368" font-family="Noto Nastaliq Urdu" font-size="26" font-weight="400" fill="#2e6b62" text-anchor="middle">‏چاہتا تھا‏</text><text x="163" y="410" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">the wish</text><text x="163" y="442" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">he wanted university</text><text x="163" y="465" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">(not what he chose)</text><text x="163" y="540" font-size="19" font-weight="700" fill="#b5602e" text-anchor="middle">scores nothing</text><rect x="317" y="316" width="266" height="250" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="368" font-family="Noto Nastaliq Urdu" font-size="26" font-weight="400" fill="#2e6b62" text-anchor="middle">‏کی وجہ سے‏</text><text x="450" y="410" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">the cause</text><text x="450" y="442" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">because of his</text><text x="450" y="465" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">father’s illness</text><text x="450" y="540" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="middle">[1]</text><rect x="604" y="316" width="266" height="250" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="737" y="368" font-family="Noto Nastaliq Urdu" font-size="26" font-weight="400" fill="#2e6b62" text-anchor="middle">‏تاکہ‏</text><text x="737" y="410" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">the purpose</text><text x="737" y="442" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">so that he could start</text><text x="737" y="465" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">earning sooner</text><text x="737" y="540" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="middle">[1]</text><text x="450" y="606" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">Two marks, two connectives, two points</text>
</svg>