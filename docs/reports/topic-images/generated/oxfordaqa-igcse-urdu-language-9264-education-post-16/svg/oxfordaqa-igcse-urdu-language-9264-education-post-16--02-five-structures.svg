<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 870" width="900" height="870" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="870" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Structures for post-16 plans</text>

<rect x="30" y="110" width="840" height="140" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="148" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Future tense</text><text x="330" y="150" font-family="Noto Nastaliq Urdu" font-size="22" font-weight="400" fill="#2e6b62" text-anchor="middle">‏گا‏</text><text x="350" y="148" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">male</text><text x="450" y="150" font-family="Noto Nastaliq Urdu" font-size="22" font-weight="400" fill="#2e6b62" text-anchor="middle">‏گی‏</text><text x="470" y="148" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">female</text><text x="846" y="198" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="end">‏امتحانات کے بعد میں کالج جاؤں گا۔‏</text><text x="846" y="234" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">After my exams I will go to college.</text><rect x="30" y="262" width="840" height="140" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="300" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Intention</text><text x="330" y="302" font-family="Noto Nastaliq Urdu" font-size="22" font-weight="400" fill="#2e6b62" text-anchor="middle">‏ارادہ ہے کہ‏</text><text x="400" y="300" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">+ subjunctive</text><text x="846" y="350" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="end">‏میرا ارادہ ہے کہ میں سائنس کے مضامین پڑھوں۔‏</text><text x="846" y="386" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">I intend to study science subjects.</text><rect x="30" y="414" width="840" height="140" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="452" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Condition</text><text x="330" y="454" font-family="Noto Nastaliq Urdu" font-size="22" font-weight="400" fill="#2e6b62" text-anchor="middle">‏اگر ... تو‏</text><text x="846" y="502" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="end">‏اگر میرے نمبر اچھے آئے تو میں وظیفے کے لیے درخواست دوں گا۔‏</text><text x="846" y="538" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">If I get good marks, I will apply for a scholarship.</text><rect x="30" y="566" width="840" height="140" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="52" y="604" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Weighing options</text><text x="360" y="606" font-family="Noto Nastaliq Urdu" font-size="22" font-weight="400" fill="#2e6b62" text-anchor="middle">‏ایک طرف / دوسری طرف‏</text><text x="846" y="654" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="end">‏ایک طرف یونیورسٹی کی تعلیم مہنگی ہے، دوسری طرف اس سے زیادہ مواقع ملتے ہیں۔‏</text><text x="846" y="690" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">On the one hand university is expensive; on the other, it brings more opportunities.</text><rect x="30" y="718" width="840" height="140" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="756" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Others’ wishes</text><text x="330" y="758" font-family="Noto Nastaliq Urdu" font-size="22" font-weight="400" fill="#2e6b62" text-anchor="middle">‏چاہتے ہیں کہ‏</text><text x="400" y="756" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">+ subjunctive</text><text x="846" y="806" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="end">‏میرے والدین چاہتے ہیں کہ میں اسی اسکول میں رہوں۔‏</text><text x="846" y="842" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">My parents want me to stay at the same school.</text>
</svg>