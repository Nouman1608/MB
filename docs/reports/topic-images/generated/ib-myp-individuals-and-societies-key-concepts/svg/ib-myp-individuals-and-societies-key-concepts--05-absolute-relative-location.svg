<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Absolute and relative location</text>

<rect x="30" y="110" width="410" height="430" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="235" y="150" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Absolute location</text><text x="235" y="176" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">a fixed position</text><line x1="70" y1="220" x2="400" y2="220" stroke="#c9d6d4" stroke-width="1.5"/><line x1="90" y1="200" x2="90" y2="470" stroke="#c9d6d4" stroke-width="1.5"/><line x1="70" y1="280" x2="400" y2="280" stroke="#c9d6d4" stroke-width="1.5"/><line x1="165" y1="200" x2="165" y2="470" stroke="#c9d6d4" stroke-width="1.5"/><line x1="70" y1="340" x2="400" y2="340" stroke="#c9d6d4" stroke-width="1.5"/><line x1="240" y1="200" x2="240" y2="470" stroke="#c9d6d4" stroke-width="1.5"/><line x1="70" y1="400" x2="400" y2="400" stroke="#c9d6d4" stroke-width="1.5"/><line x1="315" y1="200" x2="315" y2="470" stroke="#c9d6d4" stroke-width="1.5"/><line x1="70" y1="460" x2="400" y2="460" stroke="#c9d6d4" stroke-width="1.5"/><line x1="390" y1="200" x2="390" y2="470" stroke="#c9d6d4" stroke-width="1.5"/><line x1="70" y1="340" x2="400" y2="340" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="8 5"/><text x="398" y="332" font-size="15" font-weight="600" fill="#b5602e" text-anchor="end">latitude about 1° N</text><circle cx="240" cy="340" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="240" y="375" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Singapore</text><text x="235" y="512" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">coordinates on a grid</text><rect x="460" y="110" width="410" height="430" rx="14" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.5"/><text x="665" y="150" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Relative location</text><text x="665" y="176" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">position relative to other places</text><rect x="480" y="200" width="160" height="70" rx="12" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.2"/><text x="560" y="241.7" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Indian Ocean</text><rect x="690" y="200" width="160" height="70" rx="12" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.2"/><text x="770" y="241.7" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Pacific Ocean</text><rect x="560" y="300" width="210" height="64" rx="12" fill="#cbbf9f" stroke="#9c8f6e" stroke-width="2.2"/><text x="665" y="338.7" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Malay Peninsula</text><line x1="644" y1="235" x2="686" y2="235" stroke="#2b5a9a" stroke-width="3" marker-end="url(#ah)"/><text x="665" y="414" font-size="15" font-weight="600" fill="#2b5a9a" text-anchor="middle">Strait of Malacca: one of the busiest</text><text x="665" y="434" font-size="15" font-weight="600" fill="#2b5a9a" text-anchor="middle">shipping lanes</text><circle cx="665" cy="376" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="665" y="478" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">off the southern tip of the peninsula,</text><text x="665" y="500" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">beside the strait</text><rect x="30" y="560" width="840" height="53.760000000000005" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="592.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Relative location explains far more of Singapore’s growth than its coordinates.</text>
</svg>