<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 525" width="900" height="525" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="525" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Change: causes, process, consequences</text>

<text x="450" y="136" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">History example: emancipation of the Russian serfs</text><rect x="30" y="150" width="253.33333333333334" height="210" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.2"/><text x="156.66666666666669" y="228.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Cause</text><text x="156.66666666666669" y="256.07" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Defeat in the Crimean War</text><text x="156.66666666666669" y="277.19" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">exposed Russia’s</text><text x="156.66666666666669" y="298.31" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">backwardness</text><line x1="286.33333333333337" y1="255" x2="318.33333333333337" y2="255" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="323.33333333333337" y="150" width="253.33333333333334" height="210" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="450.00000000000006" y="228.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Process</text><text x="450.00000000000006" y="256.07" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Reform from above, by</text><text x="450.00000000000006" y="277.19" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">decree: the 1861</text><text x="450.00000000000006" y="298.31" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Emancipation Manifesto</text><line x1="579.6666666666667" y1="255" x2="611.6666666666667" y2="255" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="616.6666666666667" y="150" width="253.33333333333334" height="210" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.2"/><text x="743.3333333333334" y="207.45" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Consequences</text><text x="743.3333333333334" y="234.57" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">About 23 million serfs</text><text x="743.3333333333334" y="255.69" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">legally free; too little</text><text x="743.3333333333334" y="276.81" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">land and 49 years of</text><text x="743.3333333333334" y="297.93" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">redemption payments fed</text><text x="743.3333333333334" y="319.05" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">unrest</text><text x="743.3333333333334" y="390" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">unintended result</text><rect x="30" y="420" width="840" height="74.88" rx="14" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="451.15" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Causes and effects can be natural or human-made, intended or unintended, positive, negative or</text><text x="450" y="473.59" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">neutral.</text>
</svg>