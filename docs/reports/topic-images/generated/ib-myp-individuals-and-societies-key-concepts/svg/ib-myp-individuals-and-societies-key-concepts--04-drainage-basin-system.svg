<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="640" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Systems: a drainage basin</text>

<rect x="30" y="120" width="840" height="70" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="450" y="163.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">INPUT: precipitation</text><line x1="450" y1="194" x2="450" y2="236" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><rect x="30" y="240" width="840" height="250" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="52" y="274" font-size="18" font-weight="700" fill="#4a5568" text-anchor="start">Inside the basin</text><text x="250" y="306" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">STORES</text><text x="660" y="306" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">FLOWS</text><rect x="60" y="324" width="118" height="60" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.2"/><text x="119" y="360.7" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">soil water</text><rect x="188" y="324" width="118" height="60" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.2"/><text x="247" y="360.7" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">groundwater</text><rect x="316" y="324" width="118" height="60" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.2"/><text x="375" y="360.7" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">lakes</text><rect x="470" y="324" width="122" height="60" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="531" y="360.7" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">infiltration</text><rect x="602" y="324" width="122" height="60" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="663" y="360.7" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">throughflow</text><rect x="734" y="324" width="122" height="60" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="795" y="350.2" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">surface</text><text x="795" y="371.32" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">runoff</text><text x="450" y="430" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">Deforestation cuts interception → faster runoff → higher flood peaks</text><text x="450" y="462" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">an external force pushes the system out of equilibrium</text><line x1="300" y1="494" x2="300" y2="536" stroke="#b5602e" stroke-width="3.5" marker-end="url(#ahR)"/><line x1="600" y1="494" x2="600" y2="536" stroke="#b5602e" stroke-width="3.5" marker-end="url(#ahR)"/><rect x="150" y="540" width="300" height="64" rx="12" fill="#fbeee6" stroke="#b5602e" stroke-width="2.2"/><text x="300" y="579.6" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">OUTPUT: river discharge</text><rect x="460" y="540" width="300" height="64" rx="12" fill="#fbeee6" stroke="#b5602e" stroke-width="2.2"/><text x="610" y="579.6" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">OUTPUT: evaporation</text>
</svg>