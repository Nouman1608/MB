 y2="316" stroke="#2b5a9a" stroke-width="3" marker-end="url(#ah)"/><text x="250" y="318" font-size="15" font-weight="600" fill="#2b5a9a" text-anchor="end">flow</text><text x="640" y="400" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">Concern: how much water</text><text x="640" y="424" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">will reach us?</text><rect x="30" y="600" width="840" height="52.44" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="631.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">A shared river makes three states interdependent: one country’s decision affects the others.</text>
