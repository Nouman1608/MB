<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">From concepts to a statement of inquiry</text>

<text x="450" y="136" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">Unit topic (school’s choice): water use in a farming region</text><rect x="30" y="156" width="260" height="150" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.2"/><text x="160" y="202.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Key concept</text><text x="160" y="230.99" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">systems</text><text x="160" y="253.43" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">(one; broad,</text><text x="160" y="275.87" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">cross-subject)</text><text x="305" y="242" font-size="28" font-weight="700" fill="#1e2a44" text-anchor="middle">+</text><rect x="320" y="156" width="260" height="150" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="450" y="202.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Related concepts</text><text x="450" y="230.99" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">scarcity, sustainability</text><text x="450" y="253.43" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">(narrower, from a</text><text x="450" y="275.87" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">discipline)</text><text x="595" y="242" font-size="28" font-weight="700" fill="#1e2a44" text-anchor="middle">+</text><rect x="610" y="156" width="260" height="150" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.2"/><text x="740" y="202.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Global context</text><text x="740" y="230.99" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">globalization and</text><text x="740" y="253.43" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">sustainability</text><text x="740" y="275.87" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">(why it matters)</text><line x1="450" y1="312" x2="450" y2="350" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="356" width="840" height="120" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="450" y="397.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Statement of inquiry</text><text x="450" y="427.31" font-size="18" font-weight="400" fill="#4a5568" text-anchor="middle">“When people take more from a natural system than it can replace, the whole system and</text><text x="450" y="451.07" font-size="18" font-weight="400" fill="#4a5568" text-anchor="middle">the communities depending on it can be damaged.”</text><text x="60" y="520" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">✓</text><text x="90" y="520" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">No named place or date: transfers to Lake Chad, an aquifer or a fishery</text><text x="60" y="552" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">✓</text><text x="90" y="552" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Uses the key concept and both related concepts</text><text x="60" y="584" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">✓</text><text x="90" y="584" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Links to a global issue</text>
</svg>