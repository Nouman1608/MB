<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 643" width="900" height="643" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="643" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Factual, conceptual or debatable?</text>

<rect x="30" y="120" width="420" height="110" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.2"/><text x="240" y="182.6" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Does a textbook settle it?</text><line x1="454" y1="175" x2="500" y2="175" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="477" y="164" font-size="15" font-weight="600" fill="#4a5568" text-anchor="middle">yes</text><rect x="504" y="120" width="366" height="110" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.2"/><text x="522" y="170" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Factual</text><text x="522" y="195.8" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">“Which countries border Lake Chad?”</text><line x1="240" y1="234" x2="240" y2="268" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="256" y="258" font-size="15" font-weight="600" fill="#4a5568" text-anchor="start">no</text><rect x="30" y="272" width="420" height="110" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.2"/><text x="240" y="323.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Does it work for a different place</text><text x="240" y="346.86" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">unchanged?</text><line x1="454" y1="327" x2="500" y2="327" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="477" y="316" font-size="15" font-weight="600" fill="#4a5568" text-anchor="middle">yes</text><rect x="504" y="272" width="366" height="110" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="522" y="312" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Conceptual</text><text x="522" y="337.8" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">“How does a change in one part of a water</text><text x="522" y="357.6" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">system affect the other parts?”</text><line x1="240" y1="386" x2="240" y2="420" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="256" y="410" font-size="15" font-weight="600" fill="#4a5568" text-anchor="start">no</text><rect x="30" y="424" width="420" height="110" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.2"/><text x="240" y="475.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Could informed people argue opposite</text><text x="240" y="498.86" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">answers with evidence?</text><line x1="454" y1="479" x2="500" y2="479" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="477" y="468" font-size="15" font-weight="600" fill="#4a5568" text-anchor="middle">yes</text><rect x="504" y="424" width="366" height="110" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.2"/><text x="522" y="464" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Debatable</text><text x="522" y="489.8" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">“Should a government put farm exports ahead</text><text x="522" y="509.6" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">of a local fishing industry?”</text><rect x="30" y="560" width="840" height="52.44" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="591.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">A “debatable” question with a factual answer (“When did the embargo start?”) is not debatable.</text>
</svg>