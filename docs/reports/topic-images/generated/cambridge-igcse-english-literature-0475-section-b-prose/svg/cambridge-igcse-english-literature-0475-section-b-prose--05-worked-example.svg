<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 776" width="900" height="776" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="776" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: what reveals Amira’s feelings</text>

<rect x="30" y="110" width="180" height="103" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="167.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Imagery</text><rect x="222" y="110" width="480" height="103" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="240" y="140" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“like a small, stubborn animal”</text><text x="240" y="165" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">the suitcase seems alive and hard to control,</text><text x="240" y="185" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">carrying the feelings she holds in</text><rect x="30" y="225" width="180" height="84" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="262" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Repeated</text><text x="48" y="284" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">action</text><rect x="222" y="225" width="480" height="84" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="240" y="255" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">pressing the clasp “every few minutes”</text><text x="240" y="280" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">nervous repetition</text><rect x="30" y="321" width="180" height="124" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="378" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Narrative</text><text x="48" y="400" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">comment</text><rect x="222" y="321" width="480" height="124" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="240" y="351" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“as if the things inside might decide to leave</text><text x="240" y="372" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">without her”</text><text x="240" y="397" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">quietly ironic: it is Amira who is about to leave,</text><text x="240" y="417" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">and she seems unready</text><rect x="30" y="457" width="180" height="103" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="514.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Setting</text><rect x="222" y="457" width="480" height="103" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="240" y="487" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“the evening hurried”</text><text x="240" y="512" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">the busy station contrasts with her stillness,</text><text x="240" y="532" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">isolating her</text><rect x="30" y="572" width="180" height="104" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="619" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Dialogue and</text><text x="48" y="641" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">narration</text><rect x="222" y="572" width="480" height="104" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="240" y="602" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“I’m not looking at my feet” … “and did not look</text><text x="240" y="623" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">up”</text><text x="240" y="648" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">a gap between her words and her behaviour</text><rect x="738" y="110" width="132" height="566" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="804" y="333" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Amira’s</text><text x="804" y="357" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">feelings</text><text x="804" y="397" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">anxious;</text><text x="804" y="418" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">wants to</text><text x="804" y="439" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">seem in</text><text x="804" y="460" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">control</text><line x1="706" y1="161.5" x2="732" y2="161.5" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="706" y1="267" x2="732" y2="267" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="706" y1="383" x2="732" y2="383" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="706" y1="508.5" x2="732" y2="508.5" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="706" y1="624" x2="732" y2="624" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="694" width="840" height="58" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="729" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">Personal response grows from the analysis: “a gap … that I find touching”.</text>
</svg>