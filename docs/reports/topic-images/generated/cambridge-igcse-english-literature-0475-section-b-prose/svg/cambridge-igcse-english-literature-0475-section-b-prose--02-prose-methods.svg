<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 714" width="900" height="714" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="714" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Seven methods prose writers use</text>

<circle cx="450" cy="470" r="92" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="464" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">the reader’s</text><text x="450" y="488" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">response</text><line x1="450" y1="230" x2="450" y2="374" stroke="#2e6b62" stroke-width="3"/><rect x="300" y="110" width="300" height="120" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="318" y="144" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Narrative voice</text><text x="318" y="174" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">Whose view do we share? Can we</text><text x="318" y="194" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">trust the narrator?</text><line x1="330" y1="290" x2="370.123171743567" y2="416.748781162378" stroke="#2e6b62" stroke-width="3"/><rect x="30" y="230" width="300" height="120" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="264" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Characterisation</text><text x="48" y="294" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">Where do actions contradict</text><text x="48" y="314" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">words?</text><line x1="330" y1="460" x2="354.06577595839036" y2="466.44688059105147" stroke="#2e6b62" stroke-width="3"/><rect x="30" y="400" width="300" height="120" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="434" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Dialogue</text><text x="48" y="464" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">What does it reveal that the</text><text x="48" y="484" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">narrator does not state?</text><line x1="330" y1="630" x2="367.4120127711193" y2="518.9410294689663" stroke="#2e6b62" stroke-width="3"/><rect x="30" y="570" width="300" height="120" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="604" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Setting and atmosphere</text><text x="48" y="634" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">Does it reflect feelings or work</text><text x="48" y="654" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">against them?</text><line x1="570" y1="290" x2="529.876828256433" y2="416.748781162378" stroke="#2e6b62" stroke-width="3"/><rect x="570" y="230" width="300" height="120" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="588" y="264" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Structure and pace</text><text x="588" y="294" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">Why slow down or speed up here?</text><line x1="570" y1="460" x2="545.9342240416097" y2="466.44688059105147" stroke="#2e6b62" stroke-width="3"/><rect x="570" y="400" width="300" height="120" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="588" y="434" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Imagery and symbol</text><text x="588" y="464" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">What larger idea does the image</text><text x="588" y="484" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">carry?</text><line x1="570" y1="630" x2="532.5879872288807" y2="518.9410294689663" stroke="#2e6b62" stroke-width="3"/><rect x="570" y="570" width="300" height="120" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="588" y="604" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Tone and irony</text><text x="588" y="634" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">Criticism, sympathy or</text><text x="588" y="654" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">amusement?</text>
</svg>