<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 738" width="900" height="738" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="738" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Preparing to write about the whole text</text>

<rect x="30" y="110" width="840" height="300" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="55" y="146" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">For each major character and theme</text><line x1="70" y1="236" x2="830" y2="236" stroke="#1e2a44" stroke-width="4"/><text x="150" y="200" font-size="16" font-weight="700" fill="#4a5568" text-anchor="middle">beginning</text><text x="450" y="200" font-size="16" font-weight="700" fill="#4a5568" text-anchor="middle">middle</text><text x="750" y="200" font-size="16" font-weight="700" fill="#4a5568" text-anchor="middle">end</text><circle cx="110" cy="236" r="16" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="110" y="242" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="76" y="268" width="68" height="16" rx="8" fill="#b5d3cf"/><rect x="84" y="290" width="52" height="16" rx="8" fill="#b5d3cf"/><circle cx="230" cy="236" r="16" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="230" y="242" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="196" y="268" width="68" height="16" rx="8" fill="#b5d3cf"/><rect x="204" y="290" width="52" height="16" rx="8" fill="#b5d3cf"/><circle cx="370" cy="236" r="16" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="370" y="242" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="336" y="268" width="68" height="16" rx="8" fill="#b5d3cf"/><rect x="344" y="290" width="52" height="16" rx="8" fill="#b5d3cf"/><circle cx="520" cy="236" r="16" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="520" y="242" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="486" y="268" width="68" height="16" rx="8" fill="#b5d3cf"/><rect x="494" y="290" width="52" height="16" rx="8" fill="#b5d3cf"/><circle cx="640" cy="236" r="16" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="640" y="242" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><rect x="606" y="268" width="68" height="16" rx="8" fill="#b5d3cf"/><rect x="614" y="290" width="52" height="16" rx="8" fill="#b5d3cf"/><circle cx="790" cy="236" r="16" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="790" y="242" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">6</text><rect x="756" y="268" width="68" height="16" rx="8" fill="#b5d3cf"/><rect x="764" y="290" width="52" height="16" rx="8" fill="#b5d3cf"/><text x="450" y="340" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">five or six key moments · two or three short quotations each</text><text x="450" y="376" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Learn from memory: set texts cannot be taken into the exam room.</text><rect x="30" y="428" width="410" height="120" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="52" y="462" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Know the change</text><text x="52" y="490" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">how a character changes, and what causes</text><text x="52" y="511" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the change</text><rect x="460" y="428" width="410" height="120" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="482" y="462" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Know why</text><text x="482" y="490" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">why the writer includes each moment:</text><text x="482" y="511" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">what it adds to the meaning</text><rect x="30" y="566" width="840" height="148" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="52" y="600" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Short-story texts: prepare each story separately</text><rect x="52" y="622" width="150" height="42" rx="21" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="127" y="648.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">its narrator</text><rect x="216" y="622" width="270" height="42" rx="21" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="351" y="648.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">its central change or revelation</text><rect x="500" y="622" width="130" height="42" rx="21" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="565" y="648.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">its ending</text><rect x="644" y="622" width="150" height="42" rx="21" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="719" y="648.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">its key images</text><text x="52" y="694" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="start" font-style="italic">Any story on the list may be set.</text>
</svg>