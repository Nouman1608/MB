<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 652" width="900" height="652" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="652" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Context: the deletion test</text>

<rect x="250" y="110" width="400" height="70" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="140" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">A sentence about context</text><text x="450" y="166" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">in your answer</text><line x1="450" y1="182" x2="450" y2="214" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="250" y="220" width="400" height="56" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="254" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Delete it.</text><line x1="450" y1="278" x2="450" y2="306" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><path d="M450,310 L640,380 L450,450 L260,380 Z" fill="#d4b02e" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><text x="450" y="374" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Does your reading of</text><text x="450" y="398" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">the passage lose anything?</text><path d="M260,380 L150,380 L150,470" fill="none" stroke="#2e6b62" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahT)"/><text x="200" y="368" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">yes</text><path d="M640,380 L750,380 L750,470" fill="none" stroke="#b5602e" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahR)"/><text x="700" y="368" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">no</text><rect x="30" y="478" width="400" height="150" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="52" y="512" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Keep it</text><text x="52" y="544" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">It explains something in the words in</text><text x="52" y="565" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">front of you, such as why a character’s</text><text x="52" y="586" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">choice is shocking in their society.</text><rect x="470" y="478" width="400" height="150" rx="12" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="492" y="512" font-size="20" font-weight="700" fill="#b5602e" text-anchor="start">Leave it out</text><text x="492" y="544" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">It is a separate block of history that</text><text x="492" y="565" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">does not help your reading.</text>
</svg>