<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 706" width="900" height="706" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="706" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Structuring a 25-mark prose answer</text>

<rect x="30" y="110" width="840" height="100" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="52" y="144" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Introduction</text><text x="848" y="144" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="end"></text><text x="52" y="172" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">two or three sentences: your answer to the question and, for a passage, where it sits in</text><text x="52" y="193" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the text</text><rect x="30" y="224" width="840" height="170" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="52" y="258" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Analytical paragraphs</text><text x="848" y="258" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="end">four or five</text><text x="52" y="286" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">a clear point linked to the question, short quotations, analysis of method, the effect</text><text x="52" y="307" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">on the reader</text><rect x="52" y="328" width="136" height="42" rx="21" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="120" y="354.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">point</text><line x1="189" y1="349" x2="201" y2="349" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="202" y="328" width="136" height="42" rx="21" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="270" y="354.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">quotation</text><line x1="339" y1="349" x2="351" y2="349" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="352" y="328" width="136" height="42" rx="21" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="420" y="354.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">method</text><line x1="489" y1="349" x2="501" y2="349" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="502" y="328" width="136" height="42" rx="21" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="570" y="354.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">effect</text><rect x="30" y="408" width="840" height="79" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="52" y="442" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Structure or the ending</text><text x="848" y="442" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="end"></text><text x="52" y="470" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">how the passage or the text develops the focus of the question</text><rect x="30" y="501" width="840" height="79" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="52" y="535" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Conclusion</text><text x="848" y="535" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="end"></text><text x="52" y="563" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">a considered judgement on the question’s key word</text><rect x="30" y="598" width="840" height="84" rx="12" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="632" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">One precise quotation explored for its connotations and context</text><text x="450" y="660" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">earns more than a string of quotations listed one after another.</text>
</svg>