<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 722" width="900" height="722" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="722" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Section B: one prose text, four objectives</text>

<text x="450" y="104" font-size="18" font-weight="600" fill="#4a5568" text-anchor="middle">Paper 1: 50 marks</text><rect x="30" y="118" width="420" height="70" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="240" y="151" font-size="20" font-weight="700" fill="#4a5568" text-anchor="middle">Section A: Poetry</text><text x="240" y="175" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">25 marks</text><rect x="450" y="118" width="420" height="70" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="660" y="151" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Section B: Prose</text><text x="660" y="175" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">25 marks</text><rect x="30" y="208" width="270" height="96" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="240" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">one set text</text><text x="50" y="266" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">a novel or a selection of</text><text x="50" y="285" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">short stories</text><rect x="315" y="208" width="270" height="96" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="335" y="240" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">choice of two</text><text x="335" y="266" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">two questions on each text;</text><text x="335" y="285" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">answer one</text><rect x="600" y="208" width="270" height="96" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="620" y="240" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">passages printed</text><text x="620" y="266" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">relevant passages are on the</text><text x="620" y="285" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">question paper</text><text x="450" y="346" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">The same four objectives as Section A</text><rect x="30" y="366" width="410" height="120" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="414" r="30" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="421" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">AO1</text><text x="120" y="404" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Knowledge of the text</text><text x="120" y="428" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">through detail and quotation</text><rect x="460" y="366" width="410" height="120" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><circle cx="506" cy="414" r="30" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="506" y="421" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">AO2</text><text x="550" y="404" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Understanding</text><text x="550" y="428" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">characters, relationships,</text><text x="550" y="447" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">situations, themes</text><text x="550" y="470" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start" font-style="italic">often leads in prose</text><rect x="30" y="498" width="410" height="120" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="76" cy="546" r="30" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="553" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">AO3</text><text x="120" y="536" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Writer’s intentions and methods</text><text x="120" y="560" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">including language</text><text x="120" y="602" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start" font-style="italic">lifts answers above the middle levels</text><rect x="460" y="498" width="410" height="120" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="506" cy="546" r="30" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="506" y="553" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">AO4</text><text x="550" y="536" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Personal response</text><text x="550" y="560" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">asked for directly or by implication</text><rect x="30" y="640" width="840" height="58" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="675" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">Questions often focus on a character, a relationship or a moment of change.</text>
</svg>