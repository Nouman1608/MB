<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 822" width="900" height="822" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="822" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Working through a printed passage</text>

<rect x="30" y="110" width="840" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="55" y="146" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">1. Start with position</text><rect x="60" y="176" width="780" height="34" rx="6" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><rect x="470" y="170" width="110" height="46" rx="6" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="525" y="199" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">passage</text><path d="M465,193 L380,193" fill="none" stroke="#2e6b62" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahT)"/><text x="310" y="198" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="middle">just before</text><path d="M585,193 L670,193" fill="none" stroke="#2e6b62" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahT)"/><text x="735" y="198" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="middle">what follows</text><text x="450" y="252" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">One or two sentences placing it show secure knowledge (AO1) and why the moment matters.</text><text x="55" y="326" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">2. Annotate for the question’s key words</text><rect x="30" y="344" width="410" height="70" rx="10" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="374" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">the impression</text><text x="50" y="400" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">of the focus: a character, a relationship, a mood</text><rect x="460" y="344" width="410" height="70" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="480" y="374" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">changes within it</text><text x="480" y="400" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">many extracts are chosen because something shifts</text><rect x="30" y="426" width="410" height="70" rx="10" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="456" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">specific language</text><text x="50" y="482" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">verbs, adjectives, imagery, sentence length</text><rect x="460" y="426" width="410" height="70" rx="10" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="480" y="456" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">narrative choices</text><text x="480" y="482" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">what the narrator reveals, withholds or judges</text><rect x="30" y="508" width="840" height="70" rx="10" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="538" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">dialogue</text><text x="50" y="564" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">what lies beneath what characters say</text><text x="55" y="622" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">3. Organise</text><rect x="30" y="640" width="410" height="84" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="52" y="674" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">In order</text><text x="52" y="702" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">if the passage develops</text><rect x="460" y="640" width="410" height="84" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="482" y="674" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">By aspect</text><text x="482" y="702" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">if it does not</text><rect x="30" y="742" width="840" height="56" rx="12" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="450" y="777" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">Either way, cover the whole passage, including its ending.</text>
</svg>