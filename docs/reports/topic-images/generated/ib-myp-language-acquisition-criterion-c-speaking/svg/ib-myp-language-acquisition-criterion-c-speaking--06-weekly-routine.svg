<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="700" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A weekly speaking routine</text>

<ellipse cx="450" cy="400" rx="290" ry="230" fill="none" stroke="#b5d3cf" stroke-width="12"/><rect x="310" y="124" width="280" height="92" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><circle cx="338" cy="152" r="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="338" y="158.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="364" y="159" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Collect stimuli</text><text x="326" y="188" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="start">posters, adverts, infographics</text><text x="326" y="206" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="start">linked to the global contexts</text><rect x="561.1473670974872" y="239" width="280" height="92" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><circle cx="589.1473670974872" cy="267" r="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="589.1473670974872" y="273.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="615.1473670974872" y="274" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Two-minute read</text><text x="577.1473670974872" y="303" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="start">five words for the image, five for</text><text x="577.1473670974872" y="321" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="start">the text</text><rect x="561.1473670974872" y="469" width="280" height="92" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><circle cx="589.1473670974872" cy="497" r="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="589.1473670974872" y="503.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="615.1473670974872" y="504" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Speak with a partner</text><text x="577.1473670974872" y="533" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="start">one interprets; the other asks</text><text x="577.1473670974872" y="551" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="start">three follow-ups; swap</text><rect x="310" y="584" width="280" height="92" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><circle cx="338" cy="612" r="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="338" y="618.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="364" y="619" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Record and review</text><text x="326" y="648" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="start">play back for content, errors,</text><text x="326" y="666" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="start">pauses; note three fixes</text><rect x="58.85263290251277" y="469" width="280" height="92" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><circle cx="86.85263290251277" cy="497" r="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="86.85263290251277" y="503.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="112.85263290251277" y="504" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">4-3-2 drill</text><text x="74.85263290251277" y="533" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="start">one stimulus a week</text><rect x="58.852632902512795" y="239" width="280" height="92" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><circle cx="86.8526329025128" cy="267" r="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="86.8526329025128" y="273.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">6</text><text x="112.8526329025128" y="274" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Refresh the phrase bank</text><text x="74.8526329025128" y="303" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="start">interaction strategies in your</text><text x="74.8526329025128" y="321" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="start">target language</text><rect x="350" y="356" width="200" height="88" rx="44" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="394" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">every week,</text><text x="450" y="420" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">last term</text>
</svg>