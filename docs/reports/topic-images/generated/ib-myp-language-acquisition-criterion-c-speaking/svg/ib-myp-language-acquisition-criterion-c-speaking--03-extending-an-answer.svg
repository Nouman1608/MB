<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 715" width="900" height="715" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="715" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Extending a flat answer</text>

<rect x="30" y="110" width="840" height="60" rx="30" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="60" y="147" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start">Teacher: “Would you volunteer at a Repair Café?”</text><rect x="30" y="190" width="840" height="80" rx="14" fill="#fbeee6" stroke="#b5602e" stroke-width="2.5"/><text x="52" y="226" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">✗ Flat: “Yes, I would.”</text><text x="55" y="310" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Extended with the chain:</text><rect x="30" y="328" width="180" height="70" rx="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.2"/><text x="120" y="369.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Answer</text><rect x="226" y="328" width="520" height="70" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="244" y="368" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“Yes, I would,”</text><rect x="760" y="344" width="110" height="38" rx="10" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="815" y="368.25" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">present</text><line x1="120" y1="399" x2="120" y2="413" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="30" y="414" width="180" height="70" rx="10" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.2"/><text x="120" y="455.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Reason</text><rect x="226" y="414" width="520" height="70" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="244" y="444" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“because I’m quite good with my hands and I like</text><text x="244" y="465" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">helping people.”</text><line x1="120" y1="485" x2="120" y2="499" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="30" y="500" width="180" height="70" rx="10" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.2"/><text x="120" y="541.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Example</text><rect x="226" y="500" width="520" height="70" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="244" y="530" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“Last month I fixed my grandmother’s radio with my</text><text x="244" y="551" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">dad.”</text><rect x="760" y="516" width="110" height="38" rx="10" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="815" y="540.25" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">past</text><line x1="120" y1="571" x2="120" y2="585" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="30" y="586" width="180" height="70" rx="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.2"/><text x="120" y="627.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Consequence</text><rect x="226" y="586" width="520" height="70" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="244" y="616" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“If I volunteered, I’d practise more and maybe teach</text><text x="244" y="637" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">younger children too.”</text><rect x="760" y="602" width="110" height="38" rx="10" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="815" y="626.25" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">conditional</text><text x="450" y="690" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="middle">Three tenses used naturally, and two new threads for the teacher to follow.</text>
</svg>