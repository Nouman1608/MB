<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 730" width="900" height="730" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="730" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Responding to a stimulus: see, read, think, relate</text>

<text x="450" y="132" font-size="17" font-weight="600" fill="#4a5568" text-anchor="middle">Stimulus: a Repair Café poster (original, fictional)</text><rect x="30" y="150" width="170" height="112" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><circle cx="64" cy="188" r="18" fill="#fff" stroke="#1e2a44" stroke-width="3"/><text x="64" y="194.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="92" y="196" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">See</text><rect x="214" y="150" width="656" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="236" y="184" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">describe the image: people, place, action, mood</text><text x="236" y="232" font-size="15.5" font-weight="400" fill="#2e6b62" text-anchor="start" font-style="italic">“A teenager and an older man fix a bike wheel; both smiling.”</text><rect x="30" y="278" width="170" height="112" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><circle cx="64" cy="316" r="18" fill="#fff" stroke="#1e2a44" stroke-width="3"/><text x="64" y="322.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="92" y="324" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Read</text><rect x="214" y="278" width="656" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="236" y="312" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">key words, slogan or data and what they mean</text><text x="236" y="360" font-size="15.5" font-weight="400" fill="#2e6b62" text-anchor="start" font-style="italic">“Don’t bin it – fix it!”; icons: bike, lamp, shirt</text><rect x="30" y="406" width="170" height="112" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="64" cy="444" r="18" fill="#fff" stroke="#1e2a44" stroke-width="3"/><text x="64" y="450.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="92" y="452" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Think</text><rect x="214" y="406" width="656" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="236" y="440" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">interpret: audience, aim, how image and words work together</text><text x="236" y="488" font-size="15.5" font-weight="400" fill="#2e6b62" text-anchor="start" font-style="italic">repair, not throw away; two generations learning from each other</text><rect x="30" y="534" width="170" height="112" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="64" cy="572" r="18" fill="#fff" stroke="#1e2a44" stroke-width="3"/><text x="64" y="578.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="92" y="580" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Relate</text><rect x="214" y="534" width="656" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="236" y="568" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">link to you, your community, the world; give a view and a reason</text><text x="236" y="606" font-size="15.5" font-weight="400" fill="#2e6b62" text-anchor="start" font-style="italic">old phones and clothes thrown away; “some might say it’s quicker to</text><text x="236" y="626" font-size="15.5" font-weight="400" fill="#2e6b62" text-anchor="start" font-style="italic">buy new”</text><text x="115" y="680" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">steps 1–2: safe ground</text><text x="450" y="680" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">steps 3–4: show range and thinking</text><text x="450" y="708" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Learn a sentence frame for each step, not whole answers.</text>
</svg>