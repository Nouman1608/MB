<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 635" width="900" height="635" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="635" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Building fluency: the 4-3-2 drill</text>

<rect x="30" y="110" width="840" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="55" y="146" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The 4-3-2 drill: one stimulus, 9 minutes in all</text><rect x="60" y="180" width="336" height="80" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="228" y="220" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4 min</text><text x="228" y="246" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">round 1</text><rect x="406" y="180" width="249.5" height="80" rx="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="530.75" y="220" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3 min</text><text x="530.75" y="246" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">round 2: same ideas</text><rect x="665.5" y="180" width="163" height="80" rx="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="747" y="220" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2 min</text><text x="747" y="246" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">round 3: same</text><text x="450" y="300" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="middle">each round forces you to say the same ideas more smoothly</text><text x="450" y="336" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="middle">Fluency is flow: steady pace, pauses in natural places, little restarting. It is not speed.</text><rect x="30" y="380" width="270" height="110" rx="14" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="416" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Chunks, not single words</text><text x="48" y="444" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“It depends on …”, “On the one</text><text x="48" y="463" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">hand …”</text><rect x="315" y="380" width="270" height="110" rx="14" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.5"/><text x="333" y="416" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Pause at phrase boundaries</text><text x="333" y="444" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">after “In my opinion,”, not</text><text x="333" y="463" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">mid-verb</text><rect x="600" y="380" width="270" height="110" rx="14" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.5"/><text x="618" y="416" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Target-language fillers</text><text x="618" y="444" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">not “um” or your home language</text><rect x="30" y="510" width="840" height="100" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="55" y="546" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Accuracy: safe, then stretch</text><text x="55" y="576" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">open with a structure you control, then try one complex form (a conditional, a relative clause).</text>
</svg>