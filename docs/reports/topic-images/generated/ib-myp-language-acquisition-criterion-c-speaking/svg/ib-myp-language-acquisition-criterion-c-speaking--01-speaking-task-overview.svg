<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 555" width="900" height="555" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="555" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The speaking examination at a glance</text>

<rect x="30" y="110" width="410" height="250" rx="14" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.5"/><text x="55" y="148" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">On-screen examination</text><rect x="55" y="168" width="360" height="46" rx="10" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="235" y="196.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">A Listening</text><rect x="55" y="226" width="360" height="46" rx="10" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="235" y="254.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">B Reading</text><rect x="55" y="284" width="360" height="46" rx="10" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="235" y="312.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">D Writing</text><rect x="460" y="110" width="410" height="250" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="485" y="148" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="start">Speaking examination</text><rect x="485" y="168" width="360" height="46" rx="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.2"/><text x="665" y="196.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">C Speaking: 24 marks</text><text x="485" y="250" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">• interactive: a conversation,</text><text x="499" y="274" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">not a speech</text><text x="485" y="298" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">• responds to multimodal texts</text><rect x="30" y="390" width="265" height="104" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="48" y="426" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Classroom teacher marks it</text><text x="48" y="454" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">against the MYP year 5</text><text x="48" y="473" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">speaking criteria</text><line x1="297" y1="442" x2="313" y2="442" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="315" y="390" width="265" height="104" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="333" y="426" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">IB moderates a sample</text><text x="333" y="454" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">from each school, each</text><text x="333" y="473" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">session</text><line x1="582" y1="442" x2="598" y2="442" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="600" y="390" width="265" height="104" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="618" y="426" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Grades adjusted</text><text x="618" y="454" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">where needed</text><text x="450" y="530" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="middle">Assessed at one level: emergent, capable or proficient. Four criteria, equally weighted, levels 1–8.</text>
</svg>