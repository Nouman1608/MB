<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 755" width="900" height="755" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="755" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Strategies that keep a conversation alive</text>

<rect x="30" y="110" width="840" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="153" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Ask for repetition</text><text x="320" y="153" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="start" font-style="italic">“Sorry, could you repeat that, please?”</text><text x="850" y="153" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">better than guessing</text><rect x="30" y="192" width="840" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="235" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Check meaning</text><text x="320" y="235" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="start" font-style="italic">“Do you mean … ?”</text><text x="850" y="235" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">shows listening, buys time</text><rect x="30" y="274" width="840" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="317" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Paraphrase a missing word</text><text x="320" y="317" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="start" font-style="italic">“It’s the thing you use to …”</text><text x="850" y="317" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">keeps you going</text><rect x="30" y="356" width="840" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="399" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Give a view, invite one</text><text x="320" y="399" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="start" font-style="italic">“I think … What do you think?”</text><text x="850" y="399" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">makes it two-way</text><rect x="30" y="438" width="840" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="481" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Self-correct</text><text x="320" y="481" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="start" font-style="italic">“She go – sorry, she goes …”</text><text x="850" y="481" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">shows control</text><rect x="30" y="520" width="840" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="563" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Hold the turn</text><text x="320" y="563" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="start" font-style="italic">“Let me think …”</text><text x="850" y="563" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">fills a pause naturally</text><rect x="30" y="610" width="840" height="120" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="55" y="644" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Unexpected question? Three moves</text><rect x="55" y="662" width="250" height="50" rx="10" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.2"/><text x="180" y="692.25" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Buy time</text><line x1="307" y1="687" x2="325" y2="687" stroke="#8a6d0d" stroke-width="2.5" marker-end="url(#ahO)"/><rect x="327" y="662" width="250" height="50" rx="10" fill="#d4b02e" stroke="#8a6d0d" stroke-width="2.2"/><text x="452" y="692.25" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Narrow it: “For me personally …”</text><line x1="579" y1="687" x2="597" y2="687" stroke="#8a6d0d" stroke-width="2.5" marker-end="url(#ahO)"/><rect x="599" y="662" width="250" height="50" rx="10" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.2"/><text x="724" y="692.25" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Link back to stimulus words</text>
</svg>