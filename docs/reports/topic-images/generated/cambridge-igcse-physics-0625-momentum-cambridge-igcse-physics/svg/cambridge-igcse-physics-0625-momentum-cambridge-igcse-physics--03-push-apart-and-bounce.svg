<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="560" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Momentum before = momentum after</text>

<rect x="30" y="72" width="148.8" height="30" rx="15" fill="#8a6d0d"/><text x="42" y="93" font-size="16" font-weight="700" fill="#ffffff" text-anchor="start">Extended only</text><rect x="30" y="110" width="410" height="380" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="235" y="148" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Example 3: skaters push apart</text><text x="235" y="182" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">at rest together: total momentum 0</text><circle cx="185" cy="260" r="30" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><text x="185" y="266" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">60 kg</text><circle cx="285" cy="260" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="285" y="266" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">40 kg</text><line x1="150" y1="320" x2="80" y2="320" stroke="#2e6b62" stroke-width="5" marker-end="url(#ahT)"/><text x="115" y="308" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">v = ?</text><line x1="310" y1="320" x2="390" y2="320" stroke="#b5602e" stroke-width="5" marker-end="url(#ahR)"/><text x="350" y="308" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">1.5 m/s</text><text x="55" y="380" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">(40 × 1.5) + (60 × v) = 0</text><text x="55" y="406" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">60 + 60 v = 0  →  v = −1.0 m/s</text><text x="55" y="450" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">1.0 m/s the opposite way</text><rect x="460" y="110" width="410" height="380" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="665" y="148" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Example 4: one trolley bounces</text><rect x="490" y="200" width="90" height="44" rx="6" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><circle cx="508" cy="246" r="9" fill="#1e2a44" stroke="#1e2a44" stroke-width="1"/><circle cx="562" cy="246" r="9" fill="#1e2a44" stroke="#1e2a44" stroke-width="1"/><text x="535" y="228" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">2.0 kg</text><line x1="490" y1="190" x2="570" y2="190" stroke="#b5602e" stroke-width="5" marker-end="url(#ahR)"/><text x="530" y="178" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">3.0 m/s</text><rect x="700" y="200" width="120" height="44" rx="6" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><circle cx="718" cy="246" r="9" fill="#1e2a44" stroke="#1e2a44" stroke-width="1"/><circle cx="802" cy="246" r="9" fill="#1e2a44" stroke="#1e2a44" stroke-width="1"/><text x="760" y="228" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">4.0 kg</text><text x="760" y="190" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">at rest</text><text x="665" y="290" font-size="16" font-weight="700" fill="#4a5568" text-anchor="middle">after</text><line x1="560" y1="320" x2="500" y2="320" stroke="#2e6b62" stroke-width="5" marker-end="url(#ahT)"/><text x="530" y="308" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">v = ?</text><line x1="720" y1="320" x2="780" y2="320" stroke="#b5602e" stroke-width="5" marker-end="url(#ahR)"/><text x="750" y="308" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">2.0 m/s</text><text x="485" y="380" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">6.0 = 2.0 v + 4.0 × 2.0</text><text x="485" y="406" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">2.0 v = −2.0  →  v = −1.0 m/s</text><text x="485" y="450" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">bounces back at 1.0 m/s</text><text x="450" y="530" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">Recoil works the same way: cannon and shell, rocket and exhaust gas.</text>
</svg>