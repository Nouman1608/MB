<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 616" width="900" height="616" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="616" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Impulse when a ball rebounds</text>

<rect x="30" y="72" width="148.8" height="30" rx="15" fill="#8a6d0d"/><text x="42" y="93" font-size="16" font-weight="700" fill="#ffffff" text-anchor="start">Extended only</text><rect x="30" y="110" width="840" height="270" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="380" y="160" width="24" height="200" rx="0" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3"/><circle cx="330" cy="270" r="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><line x1="170" y1="270" x2="290" y2="270" stroke="#b5602e" stroke-width="5" marker-end="url(#ahR)"/><text x="230" y="258" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">+20 m/s</text><text x="240" y="330" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">before: 0.15 × 20 = +3.0 kg m/s</text><rect x="820" y="160" width="24" height="200" rx="0" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3"/><circle cx="770" cy="270" r="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><line x1="745" y1="270" x2="655" y2="270" stroke="#2e6b62" stroke-width="5" marker-end="url(#ahT)"/><text x="700" y="258" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">−15 m/s</text><text x="660" y="330" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">after: 0.15 × (−15) = −2.25 kg m/s</text><line x1="60" y1="140" x2="130" y2="140" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="140" y="146" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">+ positive</text><rect x="30" y="400" width="840" height="186" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="436" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Worked example 1 (contact 0.010 s)</text><text x="50" y="470" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">Δp = −2.25 − 3.0 = −5.25 kg m/s</text><text x="50" y="502" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">impulse on ball = 5.25 N s, away from the wall</text><text x="50" y="534" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">average force = 5.25 / 0.010 = 525 N  (about 530 N)</text><text x="50" y="566" font-size="19" font-weight="600" fill="#4a5568" text-anchor="start">not 0.15 × (20 − 15): that ignores the reversal</text>
</svg>