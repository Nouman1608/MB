<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="640" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Stretching the stopping time</text>

<rect x="30" y="72" width="148.8" height="30" rx="15" fill="#8a6d0d"/><text x="42" y="93" font-size="16" font-weight="700" fill="#ffffff" text-anchor="start">Extended only</text><rect x="30" y="110" width="840" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="150" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">5.0 kg head stopped from 14 m/s:  Δp = 5.0 × 14 = 70 kg m/s</text><text x="60" y="210" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">hard dashboard</text><text x="60" y="236" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Δt = 0.010 s</text><rect x="300" y="188" width="540" height="44" rx="6" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><text x="828" y="218" font-size="18" font-weight="700" fill="#ffffff" text-anchor="end">F = 70 / 0.010 s = 7000 N</text><text x="60" y="320" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">airbag</text><text x="60" y="346" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Δt = 0.10 s</text><rect x="300" y="298" width="54" height="44" rx="6" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><text x="364" y="328" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">F = 70 / 0.10 s = 700 N</text><text x="450" y="415" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">force bars to scale</text><rect x="40" y="470" width="190" height="66" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="135" y="497" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">longer</text><text x="135" y="517" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">stopping time</text><line x1="232" y1="503" x2="248" y2="503" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="250" y="470" width="190" height="66" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="345" y="497" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">same change</text><text x="345" y="517" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">in momentum</text><line x1="442" y1="503" x2="458" y2="503" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="460" y="470" width="190" height="66" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="555" y="497" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">smaller rate of</text><text x="555" y="517" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">change of momentum</text><line x1="652" y1="503" x2="668" y2="503" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="670" y="470" width="190" height="66" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="765" y="497" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">smaller force</text><text x="765" y="517" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">F = Δp/Δt</text><text x="450" y="590" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">Crumple zones, seat belts, helmets, crash mats and bending the knees all work this way.</text>
</svg>