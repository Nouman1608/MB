<rect width="900" height="746" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Conservation of momentum: a collision</text>

<rect x="30" y="72" width="148.8" height="30" rx="15" fill="#8a6d0d"/><text x="42" y="93" font-size="16" font-weight="700" fill="#ffffff" text-anchor="start">Extended only</text><rect x="30" y="110" width="840" height="400" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="375" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">After: stuck together</text><line x1="60" y1="475" x2="840" y2="475" stroke="#1e2a44" stroke-width="3" stroke-linecap="round"/><rect x="380" y="420" width="110" height="44" rx="6" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><circle cx="398" cy="466" r="9" fill="#1e2a44" stroke="#1e2a44" stroke-width="1"/><circle cx="472" cy="466" r="9" fill="#1e2a44" stroke="#1e2a44" stroke-width="1"/><text x="435" y="448" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">0.40 kg</text><rect x="490" y="420" width="130" height="44" rx="6" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><circle cx="508" cy="466" r="9" fill="#1e2a44" stroke="#1e2a44" stroke-width="1"/><circle cx="602" cy="466" r="9" fill="#1e2a44" stroke="#1e2a44" stroke-width="1"/><text x="555" y="448" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">0.60 kg</text><line x1="500" y1="395" x2="560" y2="395" stroke="#b5602e" stroke-width="5" marker-end="url(#ahR)"/><text x="530" y="383" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">v = ?</text><line x1="60" y1="150" x2="130" y2="150" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="140" y="156" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">+ positive</text><text x="60" y="205" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Before</text><line x1="60" y1="305" x2="840" y2="305" stroke="#1e2a44" stroke-width="3" stroke-linecap="round"/><rect x="250" y="250" width="110" height="44" rx="6" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><circle cx="268" cy="296" r="9" fill="#1e2a44" stroke="#1e2a44" stroke-width="1"/><circle cx="342" cy="296" r="9" fill="#1e2a44" stroke="#1e2a44" stroke-width="1"/><text x="305" y="278" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">0.40 kg</text><rect x="470" y="250" width="130" height="44" rx="6" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><circle cx="488" cy="296" r="9" fill="#1e2a44" stroke="#1e2a44" stroke-width="1"/><circle cx="582" cy="296" r="9" fill="#1e2a44" stroke="#1e2a44" stroke-width="1"/><text x="535" y="278" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">0.60 kg</text><line x1="250" y1="225" x2="360" y2="225" stroke="#b5602e" stroke-width="5" marker-end="url(#ahR)"/><text x="305" y="213" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">5.0 m/s</text><line x1="600" y1="225" x2="520" y2="225" stroke="#2e6b62" stroke-width="5" marker-end="url(#ahT)"/><text x="560" y="213" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">2.0 m/s</text><rect x="30" y="530" width="840" height="186" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="566" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Worked example 2 (right is positive)</text><text x="50" y="600" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">before: (0.40 × 5.0) + (0.60 × −2.0) = 2.0 − 1.2 = 0.80 kg m/s</text><text x="50" y="632" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">after: (0.40 + 0.60) × v = 1.00 v</text><text x="50" y="664" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">v = 0.80 m/s to the right</text><text x="50" y="696" font-size="19" font-weight="600" fill="#4a5568" text-anchor="start">kinetic energy: 6.2 J before, 0.32 J after (not conserved)</text>
