<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 690" width="900" height="690" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="690" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Related concepts in product and digital design</text>

<rect x="250" y="110" width="300" height="44" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="400" y="137.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Product</text><rect x="565" y="110" width="305" height="44" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.2"/><text x="717.5" y="137.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Digital</text><rect x="30" y="168" width="205" height="98" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="132" y="224" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Ergonomics</text><rect x="250" y="168" width="300" height="98" rx="10" fill="#fbf6e0" stroke="#8a6d0d" stroke-width="1.8"/><text x="266" y="210" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">fit the handle to hand sizes</text><text x="266" y="232" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">from anthropometric data</text><rect x="565" y="168" width="305" height="98" rx="10" fill="#eaf3f1" stroke="#2e6b62" stroke-width="1.8"/><text x="581" y="199" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">touch targets big enough for</text><text x="581" y="221" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">fingertips; text readable at</text><text x="581" y="243" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">arm’s length</text><rect x="30" y="280" width="205" height="98" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="132" y="336" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Sustainability</text><rect x="250" y="280" width="300" height="98" rx="10" fill="#fbf6e0" stroke="#8a6d0d" stroke-width="1.8"/><text x="266" y="322" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">material choice; can be taken</text><text x="266" y="344" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">apart and recycled</text><rect x="565" y="280" width="305" height="98" rx="10" fill="#eaf3f1" stroke="#2e6b62" stroke-width="1.8"/><text x="581" y="322" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">small file sizes; works on older</text><text x="581" y="344" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">devices</text><rect x="30" y="392" width="205" height="98" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="132" y="448" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Adaptation</text><rect x="250" y="392" width="300" height="98" rx="10" fill="#fbf6e0" stroke="#8a6d0d" stroke-width="1.8"/><text x="266" y="434" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">adapt an existing product for a</text><text x="266" y="456" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">new user</text><rect x="565" y="392" width="305" height="98" rx="10" fill="#eaf3f1" stroke="#2e6b62" stroke-width="1.8"/><text x="581" y="434" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">a layout that adapts to</text><text x="581" y="456" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">different screen sizes</text><rect x="30" y="504" width="205" height="98" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="132" y="560" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Innovation</text><rect x="250" y="504" width="620" height="98" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="1.8"/><text x="560" y="546" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">a new combination of known parts: a digital reminder for an</text><text x="560" y="568" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">ordinary plant pot</text><text x="450" y="640" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">The same plant project could sit in Globalization and sustainability (saving water)</text><text x="450" y="664" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">or Identities and relationships (pupils taking responsibility).</text>
</svg>