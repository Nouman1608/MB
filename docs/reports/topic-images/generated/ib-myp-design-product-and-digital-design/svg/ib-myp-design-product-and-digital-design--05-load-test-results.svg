<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 715" width="900" height="715" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="715" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Product test: reading load-test results</text>

<rect x="30" y="110" width="840" height="450" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="55" y="146" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Shelf: sag at the centre under load</text><line x1="130" y1="470" x2="580" y2="470" stroke="#1e2a44" stroke-width="2.5"/><line x1="130" y1="470" x2="130" y2="150" stroke="#1e2a44" stroke-width="2.5"/><text x="130" y="496" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">0</text><text x="237.5" y="496" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">2</text><text x="345" y="496" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">4</text><text x="452.5" y="496" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">6</text><text x="560" y="496" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">8</text><text x="120" y="475" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">0</text><text x="120" y="397.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">1</text><text x="120" y="320" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">2</text><text x="120" y="242.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">3</text><text x="120" y="165" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">4</text><text x="345" y="522" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">load (kg)</text><text transform="translate(80 315) rotate(-90)" font-size="15" fill="#4a5568" text-anchor="middle">sag (mm)</text><line x1="130" y1="237.5" x2="580" y2="237.5" stroke="#b5602e" stroke-width="3" stroke-dasharray="9 6"/><text x="138" y="227.5" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">limit 3 mm</text><path d="M130,470 L237.5,423.5 L345,369.25 L452.5,307.25 L560,206.5" fill="none" stroke="#2e6b62" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><circle cx="237.5" cy="423.5" r="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="249.5" y="443.5" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">0.6</text><circle cx="345" cy="369.25" r="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="357" y="389.25" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">1.3</text><circle cx="452.5" cy="307.25" r="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="464.5" y="327.25" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">2.1</text><circle cx="560" cy="206.5" r="8" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><text x="548" y="194.5" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="end">3.4</text><line x1="527.75" y1="237.5" x2="527.75" y2="470" stroke="#8a6d0d" stroke-width="2.5" stroke-dasharray="6 5"/><text x="527.75" y="460" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="end">≈ 7.4</text><rect x="600" y="160" width="250" height="300" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="620" y="192" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Estimate safe load</text><text x="620" y="226" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">allowed after 6 kg:</text><text x="620" y="257" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">3 − 2.1 = 0.9 mm</text><text x="620" y="288" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">per extra 2 kg:</text><text x="620" y="319" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">3.4 − 2.1 = 1.3 mm</text><text x="620" y="350" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">safe load ≈</text><text x="620" y="381" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">6 + 2 × (0.9 ÷ 1.3)</text><text x="620" y="412" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">≈ 7.4 kg</text><rect x="30" y="580" width="840" height="110" rx="14" fill="#fbeee6" stroke="#b5602e" stroke-width="2.5"/><text x="55" y="616" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">✗ Spec (8 kg, 3 mm or less) not met: passes at 6 kg, fails at 8 kg</text><text x="55" y="648" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Improve: thicker board, a bracket nearer the centre or a stiffer material,</text><text x="55" y="672" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">then test again.</text>
</svg>