<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" width="900" height="760" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="760" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Combined design: two strands, one project</text>

<rect x="140" y="110" width="340" height="46" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="310" y="138.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Product strand: sensor housing</text><rect x="520" y="110" width="350" height="46" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.2"/><text x="695" y="138.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Digital strand: web page</text><circle cx="70" cy="222" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="70" y="230.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">A</text><rect x="140" y="172" width="340" height="100" rx="12" fill="#fbf6e0" stroke="#8a6d0d" stroke-width="2"/><text x="160" y="214" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">interview the teacher; observe</text><text x="160" y="237" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">pupils aged 7–8: pictures, little text</text><rect x="520" y="172" width="350" height="100" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2"/><text x="540" y="214" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">research soil-moisture sensors</text><text x="540" y="237" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and simple web dashboards</text><line x1="70" y1="250" x2="70" y2="312" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><circle cx="70" cy="340" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="70" y="348.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">B</text><rect x="140" y="290" width="340" height="100" rx="12" fill="#fbf6e0" stroke="#8a6d0d" stroke-width="2"/><text x="160" y="332" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">housing fits a 120 mm pot</text><text x="160" y="355" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and survives splashes</text><rect x="520" y="290" width="350" height="100" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2"/><text x="540" y="332" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“water me” picture within one</text><text x="540" y="355" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">minute of a dry reading</text><line x1="70" y1="368" x2="70" y2="430" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><circle cx="70" cy="458" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="70" y="466.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">C</text><rect x="140" y="408" width="340" height="100" rx="12" fill="#fbf6e0" stroke="#8a6d0d" stroke-width="2"/><text x="160" y="450" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">make the housing: 3D print,</text><text x="160" y="473" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">fit test, seal</text><rect x="520" y="408" width="350" height="100" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2"/><text x="540" y="450" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">build the page: layout, image,</text><text x="540" y="473" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">link to readings</text><line x1="70" y1="486" x2="70" y2="548" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><circle cx="70" cy="576" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="70" y="584.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">D</text><rect x="140" y="526" width="340" height="100" rx="12" fill="#fbf6e0" stroke="#8a6d0d" stroke-width="2"/><text x="160" y="568" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">splash it; check the sensor</text><text x="160" y="591" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">still reads</text><rect x="520" y="526" width="350" height="100" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2"/><text x="540" y="568" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">dry the soil 10 times:</text><text x="540" y="591" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">9 reminders = 90%</text><line x1="482" y1="458" x2="518" y2="458" stroke="#b5602e" stroke-width="4"/><rect x="250" y="650" width="520" height="50" rx="10" fill="#fbeee6" stroke="#b5602e" stroke-width="2"/><text x="510" y="682" font-size="16" font-weight="600" fill="#b5602e" text-anchor="middle">Where they meet: the housing must leave room for the cable</text><path d="M500,646 L500,462" fill="none" stroke="#b5602e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahR)"/><text x="450" y="735" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">A combined project needs both kinds of evidence at every stage.</text>
</svg>