<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 740" width="900" height="740" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="740" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Prototypes: sufficient for testing</text>

<defs><linearGradient id="fid" x1="0" x2="1"><stop offset="0" stop-color="#dce9e7"/><stop offset="1" stop-color="#d4b02e"/></linearGradient></defs><rect x="220" y="120" width="630" height="34" rx="17" fill="url(#fid)" stroke="#1e2a44" stroke-width="2"/><text x="236" y="143" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">low fidelity: quick, cheap</text><text x="834" y="143" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">high fidelity: real properties</text><rect x="30" y="176" width="175" height="104" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="117" y="236" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Product</text><rect x="220" y="176" width="300" height="104" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="240" y="220" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">card or foam model</text><text x="240" y="246" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">scale model</text><line x1="525" y1="228" x2="545" y2="228" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="550" y="176" width="300" height="104" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="570" y="220" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">full-size, real materials</text><text x="570" y="246" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">3D print</text><rect x="30" y="296" width="175" height="104" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="117" y="356" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Digital</text><rect x="220" y="296" width="300" height="104" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="240" y="340" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">paper prototype</text><text x="240" y="366" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">static wireframe</text><line x1="525" y1="348" x2="545" y2="348" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="550" y="296" width="300" height="104" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="570" y="340" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">clickable mock-up</text><text x="570" y="366" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">working build</text><text x="450" y="440" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="middle">Go high fidelity when a test depends on strength, weight, load time or a working button.</text><rect x="30" y="465" width="840" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="55" y="501" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Worked example: a 1:5 card model of a display stand</text><rect x="100" y="522" width="70" height="180" rx="4" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="135" y="618" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">1:5</text><text x="180" y="618" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">180 mm</text><text x="135" y="710" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start"></text><text x="250" y="560" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">full size: 900 × 350 mm</text><text x="250" y="590" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">model height = 900 ÷ 5 = 180 mm</text><text x="250" y="620" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">model width = 350 ÷ 5 = 70 mm</text><rect x="560" y="520" width="290" height="180" rx="12" fill="#fbeee6" stroke="#b5602e" stroke-width="2"/><text x="580" y="552" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Tests proportions</text><text x="580" y="576" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="start">with the client ✓</text><text x="580" y="616" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">Says nothing about</text><text x="580" y="640" font-size="16" font-weight="400" fill="#b5602e" text-anchor="start">how full-size plywood</text><text x="580" y="662" font-size="16" font-weight="400" fill="#b5602e" text-anchor="start">carries a load ✗</text>
</svg>