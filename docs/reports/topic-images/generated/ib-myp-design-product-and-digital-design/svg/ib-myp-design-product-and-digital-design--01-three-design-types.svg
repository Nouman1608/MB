y="359" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">together</text><rect x="30" y="540" width="840" height="140" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="55" y="576" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Combined examples</text><text x="55" y="606" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">• a board game with a companion scoring app</text><text x="55" y="629" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">• a sensor housing linked to a web page showing the readings</text><text x="55" y="652" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">• packaging with a code that opens an instruction video you made</text><text x="450" y="712" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="middle">Same design cycle and criteria for all three; the evidence, tools and tests change.</text>
