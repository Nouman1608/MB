<rect width="900" height="705" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Evidence at each stage: product vs digital</text>

<rect x="250" y="110" width="300" height="46" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="400" y="139.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Product design</text><rect x="565" y="110" width="305" height="46" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.2"/><text x="717.5" y="139.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Digital design</text><rect x="30" y="170" width="840" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="68" cy="210" r="22" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="68" y="217.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">A</text><text x="44" y="256" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Inquiring and</text><text x="44" y="274" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">analysing</text><rect x="250" y="178" width="300" height="96" rx="10" fill="#fbf6e0" stroke="#8a6d0d" stroke-width="1.8"/><text x="264" y="204" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">client interview; existing products;</text><text x="264" y="225" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">materials research;</text><text x="264" y="246" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">anthropometric data</text><rect x="565" y="178" width="295" height="96" rx="10" fill="#eaf3f1" stroke="#2e6b62" stroke-width="1.8"/><text x="579" y="204" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">client interview; existing apps</text><text x="579" y="225" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">or sites; target devices and</text><text x="579" y="246" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">screen sizes; accessibility needs</text><rect x="30" y="294" width="840" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="68" cy="334" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="68" y="341.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">B</text><text x="44" y="380" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Developing</text><text x="44" y="398" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">ideas</text><rect x="250" y="302" width="300" height="96" rx="10" fill="#fbf6e0" stroke="#8a6d0d" stroke-width="1.8"/><text x="264" y="328" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">spec: sizes, materials, cost,</text><text x="264" y="349" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">safety; annotated sketches;</text><text x="264" y="370" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">CAD; working drawings</text><rect x="565" y="302" width="295" height="96" rx="10" fill="#eaf3f1" stroke="#2e6b62" stroke-width="1.8"/><text x="579" y="328" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">spec: platform, load time, content,</text><text x="579" y="349" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">accessibility; wireframes;</text><text x="579" y="370" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">flowcharts; site maps; storyboards</text><rect x="30" y="418" width="840" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="68" cy="458" r="22" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="68" y="465.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">C</text><text x="44" y="504" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Creating the</text><text x="44" y="522" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">solution</text><rect x="250" y="426" width="300" height="96" rx="10" fill="#fbf6e0" stroke="#8a6d0d" stroke-width="1.8"/><text x="264" y="452" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">cutting list; sequence of operations;</text><text x="264" y="473" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">tools; safety notes; build photos;</text><text x="264" y="494" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">justified changes</text><rect x="565" y="426" width="295" height="96" rx="10" fill="#eaf3f1" stroke="#2e6b62" stroke-width="1.8"/><text x="579" y="452" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">development plan; asset list; file</text><text x="579" y="473" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">structure; version saves;</text><text x="579" y="494" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">screenshots; justified changes</text><rect x="30" y="542" width="840" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="68" cy="582" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="68" y="589.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">D</text><text x="44" y="628" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Evaluating</text><rect x="250" y="550" width="300" height="96" rx="10" fill="#fbf6e0" stroke="#8a6d0d" stroke-width="1.8"/><text x="264" y="576" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">measurements against the spec;</text><text x="264" y="597" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">load, drop or durability tests;</text><text x="264" y="618" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">user trials</text><rect x="565" y="550" width="295" height="96" rx="10" fill="#eaf3f1" stroke="#2e6b62" stroke-width="1.8"/><text x="579" y="576" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">usability tests with set tasks;</text><text x="579" y="597" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">device and browser tests;</text><text x="579" y="618" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">functional checklists</text><text x="450" y="680" font-size="16" font-weight="600" fill="#4a5568" text-anchor="middle">Both types record changes to the plan and give a reason for each.</text>
</svg>