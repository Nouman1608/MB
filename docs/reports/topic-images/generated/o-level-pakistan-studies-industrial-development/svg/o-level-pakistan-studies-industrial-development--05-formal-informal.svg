<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 681" width="900" height="681" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="681" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Formal and informal sectors depend on each other</text>

<rect x="30" y="110" width="330" height="190" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="46" y="138" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Formal sector</text><text x="46" y="164" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Registered, taxed, inspected.</text><text x="46" y="186.1" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Contracts, regular wages, some</text><text x="46" y="208.2" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">benefits. Capital from banks,</text><text x="46" y="230.3" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">shareholders, foreign investors.</text><rect x="540" y="110" width="330" height="190" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="556" y="138" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="start">Informal sector</text><text x="556" y="164" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Unregistered, untaxed. Casual work,</text><text x="556" y="186.1" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">irregular pay, no protection.</text><text x="556" y="208.2" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Capital from family savings and</text><text x="556" y="230.3" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">moneylenders.</text><line x1="366" y1="170" x2="532" y2="170" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><text x="450" y="158" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">subcontracts</text><text x="450" y="200" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">e.g. Sialkot exporters</text><line x1="534" y1="246" x2="368" y2="246" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><text x="450" y="236" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">home stitching</text><text x="450" y="272" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">cheap, flexible labour</text><rect x="30" y="320" width="840" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="354" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Services the informal sector provides</text><text x="50" y="384" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Cheap repairs, transport, recycling of scrap, small retail and domestic work</text><rect x="30" y="430" width="410" height="231" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="462" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Advantages</text><circle cx="60" cy="474.39" r="5" fill="#2e6b62"/><text x="76" y="480" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Jobs for people without formal</text><text x="76" y="502.1" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">qualifications</text><circle cx="60" cy="528.59" r="5" fill="#2e6b62"/><text x="76" y="534.2" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Low start-up cost</text><circle cx="60" cy="560.69" r="5" fill="#2e6b62"/><text x="76" y="566.3000000000001" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Cheap goods and services</text><circle cx="60" cy="592.7900000000001" r="5" fill="#2e6b62"/><text x="76" y="598.4000000000001" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Flexible subcontracting for exporters</text><rect x="460" y="430" width="410" height="231" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="484" y="462" font-size="20" font-weight="700" fill="#b5602e" text-anchor="start">Disadvantages</text><circle cx="490" cy="474.39" r="5" fill="#b5602e"/><text x="506" y="480" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Low pay</text><circle cx="490" cy="506.49" r="5" fill="#b5602e"/><text x="506" y="512.1" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Child labour (a long-standing concern in</text><text x="506" y="534.2" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">brick kilns)</text><circle cx="490" cy="560.69" r="5" fill="#b5602e"/><text x="506" y="566.3000000000001" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Unsafe conditions</text><circle cx="490" cy="592.7900000000001" r="5" fill="#b5602e"/><text x="506" y="598.4000000000001" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">No tax revenue</text>
</svg>