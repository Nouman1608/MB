<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 669" width="900" height="669" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="669" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How government promotes industry</text>

<rect x="30" y="110" width="410" height="313" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="54" y="146" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="start">Export processing zone</text><text x="54" y="176" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">Duty-free imports and tax concessions, on</text><text x="54" y="198" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">condition that most output is exported</text><circle cx="60" cy="230.39" r="5" fill="#2e6b62"/><text x="76" y="236" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Karachi EPZ (the first, set up in the</text><text x="76" y="258.1" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">1980s)</text><circle cx="60" cy="284.59" r="5" fill="#2e6b62"/><text x="76" y="290.2" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Sialkot, Risalpur, Gujranwala</text><circle cx="60" cy="316.69" r="5" fill="#2e6b62"/><text x="76" y="322.3" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Mineral EPZs at Saindak and Duddar in</text><text x="76" y="344.40000000000003" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Balochistan</text><rect x="460" y="110" width="410" height="313" rx="14" fill="#dfe7f2" stroke="#2b5a9a" stroke-width="2.5"/><text x="484" y="146" font-size="21" font-weight="700" fill="#2b5a9a" text-anchor="start">Industrial estate or SEZ</text><text x="484" y="176" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">Serviced plots and infrastructure, with no</text><text x="484" y="198" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">export condition</text><circle cx="490" cy="230.39" r="5" fill="#2b5a9a"/><text x="506" y="236" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">SITE in Karachi and Hyderabad</text><circle cx="490" cy="262.49" r="5" fill="#2b5a9a"/><text x="506" y="268.1" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Sundar Industrial Estate near Lahore</text><circle cx="490" cy="294.59000000000003" r="5" fill="#2b5a9a"/><text x="506" y="300.20000000000005" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Hattar and Gadoon Amazai (KP); Hub</text><text x="506" y="322.30000000000007" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">(Balochistan)</text><circle cx="490" cy="348.79" r="5" fill="#2b5a9a"/><text x="506" y="354.40000000000003" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">CPEC zones: Rashakai, Allama Iqbal</text><text x="506" y="376.50000000000006" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Industrial City</text><rect x="30" y="442.6" width="840" height="74" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="474.6" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Other measures</text><text x="54" y="500.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Tax holidays, cheaper credit, training, subsidised power and gas, motorways, dry ports</text><text x="450" y="548.6" font-size="18" font-weight="700" fill="#4a5568" text-anchor="middle">WHY BUILD THEM?</text><rect x="30" y="564.6" width="200" height="84" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5" /><text x="130" y="590.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Attract foreign</text><text x="130" y="612.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">investment and</text><text x="130" y="634.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">technology</text><rect x="243" y="564.6" width="200" height="84" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5" /><text x="343" y="601.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Earn foreign</text><text x="343" y="623.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">exchange</text><rect x="456" y="564.6" width="200" height="84" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5" /><text x="556" y="612.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Create jobs</text><rect x="669" y="564.6" width="200" height="84" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5" /><text x="769" y="590.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Spread industry</text><text x="769" y="612.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">beyond Karachi and</text><text x="769" y="634.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Lahore</text>
</svg>