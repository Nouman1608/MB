<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 636" width="900" height="636" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="636" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Large-scale, small-scale and cottage industry</text>

<rect x="30" y="110" width="270" height="440" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="95" y="190" width="140" height="60" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.5"/><path d="M95,190 l35,-22 l0,22 l35,-22 l0,22 l35,-22 l0,22" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.5"/><rect x="205" y="134" width="18" height="56" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2.5"/><text x="165" y="290" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Large-scale</text><text x="50" y="326" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Factories registered under</text><text x="50" y="349" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">the Factories Act and</text><text x="50" y="372" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">covered by the census of</text><text x="50" y="395" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">manufacturing; generally</text><text x="50" y="418" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">ten or more workers using</text><text x="50" y="441" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">power-driven machinery.</text><text x="50" y="500" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="start" font-style="italic">e.g. textile mills, cement</text><text x="50" y="521" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="start" font-style="italic">plants</text><rect x="315" y="110" width="270" height="440" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="400" y="190" width="100" height="60" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><rect x="434" y="222" width="32" height="28" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><path d="M392,190 L508,190" stroke="#1e2a44" stroke-width="4"/><text x="450" y="290" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Small-scale</text><text x="335" y="326" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Smaller workshops with a</text><text x="335" y="349" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">few hired workers.</text><text x="335" y="500" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="start" font-style="italic">e.g. a Gujranwala metal</text><text x="335" y="521" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="start" font-style="italic">workshop</text><rect x="600" y="110" width="270" height="440" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="695" y="200" width="80" height="50" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><path d="M685,200 L735,164 L785,200 Z" fill="#b5602e" stroke="#1e2a44" stroke-width="2.5"/><rect x="725" y="224" width="20" height="26" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="735" y="290" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Cottage</text><text x="620" y="326" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Carried out at home by</text><text x="620" y="349" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">family members with simple</text><text x="620" y="372" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">tools.</text><text x="620" y="500" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="start" font-style="italic">e.g. embroidery or rilli</text><text x="620" y="521" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="start" font-style="italic">quilt-making in rural Sindh</text><line x1="60" y1="580" x2="840" y2="580" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="450" y="612" font-size="17" font-weight="600" fill="#4a5568" text-anchor="middle">fewer workers, less machinery, closer to the home</text>
</svg>