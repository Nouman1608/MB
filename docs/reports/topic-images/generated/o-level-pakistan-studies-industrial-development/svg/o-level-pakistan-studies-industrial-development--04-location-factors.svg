<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 748" width="900" height="748" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="748" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why industries are where they are</text>

<rect x="30" y="110" width="410" height="408" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="146" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="start">Near the raw material</text><text x="50" y="170" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">bulky, heavy or perishable inputs</text><text x="50" y="206" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Cement</text><text x="50" y="230" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">heavy limestone and gypsum quarried nearby</text><text x="50" y="262" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Cotton ginning</text><text x="50" y="286" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">seed cotton is bulky: the cotton belt</text><text x="50" y="318" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Sugar refining</text><text x="50" y="342" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">cane loses sugar within a day or two</text><text x="50" y="374" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Brick</text><text x="50" y="398" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">river-plain clay; bricks heavy and cheap</text><rect x="460" y="110" width="410" height="156" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="480" y="146" font-size="21" font-weight="700" fill="#8a6d0d" text-anchor="start">On the gas supply</text><text x="480" y="170" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">fuel and feedstock in one</text><text x="480" y="206" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Fertiliser (urea)</text><text x="480" y="230" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">natural gas is both feedstock and fuel:</text><text x="480" y="250" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Daharki, Mirpur Mathelo, Sadiqabad</text><rect x="460" y="286" width="410" height="232" rx="14" fill="#dfe7f2" stroke="#2b5a9a" stroke-width="2.5"/><text x="480" y="322" font-size="21" font-weight="700" fill="#2b5a9a" text-anchor="start">At the coast</text><text x="480" y="346" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">imported inputs land at the port</text><text x="480" y="382" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Iron and steel</text><text x="480" y="406" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">imported ore and coking coal at Port Qasim;</text><text x="480" y="426" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">scrap from Gadani</text><text x="480" y="458" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Oil refining</text><text x="480" y="482" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">coastal sites for imported crude; Potwar sites</text><text x="480" y="502" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">for local crude</text><rect x="30" y="538" width="840" height="190" rx="14" fill="#f6e4d8" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="574" font-size="21" font-weight="700" fill="#b5602e" text-anchor="start">Labour, skills and links</text><text x="50" y="598" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">people and transport matter most</text><text x="50" y="638" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Spinning to clothing</text><text x="50" y="662" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">labour, capital, power; port</text><text x="50" y="682" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">for exports</text><text x="325" y="638" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Crafts</text><text x="325" y="662" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">inherited skills, local</text><text x="325" y="682" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">materials, tourists</text><text x="600" y="638" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Sports and surgical goods</text><text x="600" y="662" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Sialkot: skilled workers, dry</text><text x="600" y="682" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">port, airport</text>
</svg>