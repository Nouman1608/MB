<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 804" width="900" height="804" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="804" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">From field to shirt: the key terms</text>

<rect x="30" y="120" width="840" height="120" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="78" cy="180" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="78" y="188.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="124" y="164" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Raw material</text><text x="124" y="164" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start"></text><text x="124" y="194" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Seed cotton picked in Sanghar or Vehari</text><rect x="570" y="142" width="124" height="30" rx="15" fill="#6f9a52" stroke="none" stroke-width="0" /><text x="632" y="163" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">PRIMARY</text><rect x="700" y="190" width="40" height="30" rx="6" fill="#d4b02e" stroke="#1e2a44" stroke-width="2" /><line x1="78" y1="242" x2="78" y2="264" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="266" width="840" height="120" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="78" cy="326" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="78" y="334.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="124" y="310" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Processed</text><text x="124" y="310" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start"></text><text x="124" y="340" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Ginned to separate lint from seed, then spun into</text><text x="124" y="362" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">yarn</text><rect x="570" y="288" width="124" height="30" rx="15" fill="#2b5a9a" stroke="none" stroke-width="0" /><text x="632" y="309" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">SECONDARY</text><rect x="700" y="336" width="95" height="30" rx="6" fill="#d4b02e" stroke="#1e2a44" stroke-width="2" /><line x1="78" y1="388" x2="78" y2="410" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="412" width="840" height="120" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="78" cy="472" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="78" y="480.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="124" y="456" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Manufactured</text><text x="124" y="456" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start"></text><text x="124" y="486" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Yarn woven or knitted into cloth, then cut and sewn</text><text x="124" y="508" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">into garments</text><rect x="570" y="434" width="124" height="30" rx="15" fill="#2b5a9a" stroke="none" stroke-width="0" /><text x="632" y="455" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">SECONDARY</text><rect x="700" y="482" width="160" height="30" rx="6" fill="#d4b02e" stroke="#1e2a44" stroke-width="2" /><text x="700" y="112" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="start">value of the product</text><rect x="30" y="558" width="840" height="96" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="60" y="596" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Value-added</text><text x="60" y="626" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Each stage raises the price: a kilogram of garments earns far more than a kilogram of raw lint.</text><rect x="30" y="674" width="410" height="110" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="46" y="702" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Refined (other chains)</text><text x="46" y="728" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Crude oil into petrol; raw cane juice into</text><text x="46" y="750.1" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">white sugar.</text><rect x="460" y="674" width="410" height="110" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="476" y="702" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Tertiary industry</text><text x="476" y="728" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Services that support people and firms:</text><text x="476" y="750.1" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">banking, insurance, transport and repair.</text>
</svg>