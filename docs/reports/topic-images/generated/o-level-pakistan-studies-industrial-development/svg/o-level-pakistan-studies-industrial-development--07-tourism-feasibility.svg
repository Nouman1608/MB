<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Tourism: attractions, benefits and constraints</text>

<rect x="30" y="110" width="410" height="223" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="150" font-size="21" font-weight="700" fill="#3d5f2a" text-anchor="start">Natural attractions</text><circle cx="60" cy="184.39" r="5" fill="#6f9a52"/><text x="76" y="190" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Fairy Meadows below Nanga Parbat</text><circle cx="60" cy="212.48999999999998" r="5" fill="#6f9a52"/><text x="76" y="218.1" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Deosai Plains</text><circle cx="60" cy="240.58999999999997" r="5" fill="#6f9a52"/><text x="76" y="246.2" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Lake Saiful Muluk, Kaghan valley</text><circle cx="60" cy="268.69" r="5" fill="#6f9a52"/><text x="76" y="274.3" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Hingol National Park</text><circle cx="60" cy="296.79" r="5" fill="#6f9a52"/><text x="76" y="302.40000000000003" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Kund Malir beach, Makran coast</text><rect x="460" y="110" width="410" height="223" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="484" y="150" font-size="21" font-weight="700" fill="#b5602e" text-anchor="start">Cultural attractions</text><circle cx="490" cy="184.39" r="5" fill="#b5602e"/><text x="506" y="190" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Makli necropolis near Thatta</text><circle cx="490" cy="212.48999999999998" r="5" fill="#b5602e"/><text x="506" y="218.1" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Rohtas Fort; Takht-i-Bahi</text><circle cx="490" cy="240.58999999999997" r="5" fill="#b5602e"/><text x="506" y="246.2" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Kalash valleys</text><circle cx="490" cy="268.69" r="5" fill="#b5602e"/><text x="506" y="274.3" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Sufi shrines at Sehwan and Multan</text><circle cx="490" cy="296.79" r="5" fill="#b5602e"/><text x="506" y="302.40000000000003" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Kartarpur Corridor (opened 2019)</text><line x1="450" y1="336.50000000000006" x2="450" y2="366.50000000000006" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="372.50000000000006" width="410" height="259" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="54" y="410.50000000000006" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="start">Benefits</text><circle cx="60" cy="440.89000000000004" r="5" fill="#2e6b62"/><text x="76" y="446.50000000000006" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Jobs: guides, drivers, hotel and</text><text x="76" y="468.6000000000001" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">restaurant staff, craft sellers</text><circle cx="60" cy="495.09000000000003" r="5" fill="#2e6b62"/><text x="76" y="500.70000000000005" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Earns foreign exchange</text><circle cx="60" cy="527.19" r="5" fill="#2e6b62"/><text x="76" y="532.8000000000001" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Adds to GDP and GNP</text><rect x="460" y="372.50000000000006" width="410" height="259" rx="14" fill="#f6e4d8" stroke="#b5602e" stroke-width="2.5"/><text x="484" y="410.50000000000006" font-size="21" font-weight="700" fill="#b5602e" text-anchor="start">Constraints</text><circle cx="490" cy="440.89000000000004" r="5" fill="#b5602e"/><text x="506" y="446.50000000000006" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Poor road access and landslides</text><circle cx="490" cy="472.99000000000007" r="5" fill="#b5602e"/><text x="506" y="478.6000000000001" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Seasonal demand</text><circle cx="490" cy="505.0900000000001" r="5" fill="#b5602e"/><text x="506" y="510.7000000000001" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Security perceptions</text><circle cx="490" cy="537.19" r="5" fill="#b5602e"/><text x="506" y="542.8000000000001" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Limited hotels</text><circle cx="490" cy="569.2900000000001" r="5" fill="#b5602e"/><text x="506" y="574.9000000000001" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Litter and unplanned building damage</text><text x="506" y="597.0000000000001" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">mountain areas</text>
