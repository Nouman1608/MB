<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 750" width="900" height="750" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="750" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Reading a heating curve</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Plateau lengths to scale; temperatures not given</text>
<rect x="30" y="110" width="840" height="470" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><line x1="170" y1="480" x2="830" y2="480" stroke="#1e2a44" stroke-width="3"/><line x1="170" y1="480" x2="170" y2="160" stroke="#1e2a44" stroke-width="3"/><text x="500" y="514" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">time (heated steadily)</text><text x="35" y="320" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle" transform="rotate(-90 35 320)">temperature</text><path d="M180.0,460 L224.0,369 L311.9,369 L370.5,187 L810.0,187" fill="none" stroke="#b5602e" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><line x1="170" y1="369" x2="223.95348837209303" y2="369" stroke="#4a5568" stroke-width="1.8" stroke-dasharray="5 5"/><text x="162" y="374" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="end">melting point</text><line x1="170" y1="187" x2="370.4651162790698" y2="187" stroke="#4a5568" stroke-width="1.8" stroke-dasharray="5 5"/><text x="162" y="192" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="end">boiling point</text><text x="213.97674418604652" y="444.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">solid</text><text x="267.90697674418607" y="395" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">melting</text><text x="267.90697674418607" y="415" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">solid + liquid</text><text x="355.1627906976744" y="278" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">liquid</text><text x="590.2325581395348" y="213" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">boiling: liquid + gas</text><line x1="223.95348837209303" y1="347" x2="311.8604651162791" y2="347" stroke="#1e2a44" stroke-width="2" marker-start="url(#ah)" marker-end="url(#ah)"/><text x="267.90697674418607" y="337" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">120 s</text><line x1="370.4651162790698" y1="165" x2="810" y2="165" stroke="#1e2a44" stroke-width="2" marker-start="url(#ah)" marker-end="url(#ah)"/><text x="590.2325581395348" y="155" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">600 s</text><text x="619.5348837209302" y="356" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">sloping: particles gain kinetic energy</text><text x="619.5348837209302" y="376" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">flat: energy overcomes forces</text><rect x="30" y="600" width="840" height="130" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="60" y="638" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">With a 100 W heater (energy = power × time):</text><text x="60" y="672" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">melting: 100 × 120 = 12 000 J</text><text x="400" y="672" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">boiling: 100 × 600 = 60 000 J</text><text x="60" y="708" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="start">Boiling needs 5 times as much: it separates the particles completely.</text>
</svg>