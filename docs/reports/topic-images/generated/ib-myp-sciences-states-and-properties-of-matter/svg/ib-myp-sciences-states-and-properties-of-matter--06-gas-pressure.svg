70.1243556529821 Z" fill="#1e2a44"/><text x="660" y="230" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">same speed, less</text><text x="660" y="250" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">space: more collisions</text><text x="660" y="270" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">per second</text><rect x="656" y="324" width="190" height="40" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="751" y="350" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">pressure rises</text><rect x="30" y="410" width="410" height="284" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="446" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Heat it, pressure the same</text><text x="52" y="468" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">balloon</text><circle cx="130" cy="560" r="70" fill="#fff" stroke="#1e2a44" stroke-width="3"/><circle cx="130" cy="560" r="50" fill="none" stroke="#4a5568" stroke-width="2" stroke-dasharray="6 5"/><circle cx="81.6" cy="519.7" r="7" fill="#f6d9c6" stroke="#1e2a44" stroke-width="2"/><line x1="88.56820323027551" y1="523.7" x2="99.82653347947321" y2="530.2" stroke="#1e2a44" stroke-width="2"/><path d="M105.88871130596428,533.7 L96.96050807568876,533.1641016151378 L100.96050807568876,526.2358983848623 Z" fill="#1e2a44"/><circle cx="154.2" cy="511.6" r="7" fill="#f6d9c6" stroke="#1e2a44" stroke-width="2"/><line x1="146.66245903371274" y1="514.3761611466053" x2="134.4464549634959" y2="518.822423009839" stroke="#1e2a44" stroke-width="2"/><path d="M127.86860661799456,521.2165640131186 L134.01806701097917,514.7216323833698 L136.75422815758452,522.239173349657 Z" fill="#1e2a44"/><circle cx="178.4" cy="576.1" r="7" fill="#f6d9c6" stroke="#1e2a44" stroke-width="2"/><line x1="173.2176991225077" y1="569.9916444550482" x2="164.86146019658267" y2="560.0330666945015" stroke=