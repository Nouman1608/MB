<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 710" width="900" height="710" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="710" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Measuring density</text>

<rect x="30" y="110" width="410" height="470" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="460" y="110" width="410" height="470" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="235" y="148" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Regular block</text><text x="665" y="148" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Irregular object</text><path d="M90,300 L282,300 L282,236 L90,236 Z" fill="#c7cdd6" stroke="#1e2a44" stroke-width="2.5"/><path d="M90,236 L138,197.6 L330,197.6 L282,236 Z" fill="#dde1e7" stroke="#1e2a44" stroke-width="2.5"/><path d="M282,300 L330,261.6 L330,197.6 L282,236 Z" fill="#b3bac6" stroke="#1e2a44" stroke-width="2.5"/><text x="186" y="326" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">6.0 cm</text><text x="82" y="268" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="end">2.0 cm</text><text x="330.4" y="223.2" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">3.0 cm</text><text x="60" y="370" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">V = 6.0 × 3.0 × 2.0 = 36 cm³</text><text x="60" y="398" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">ρ = 97.2 ÷ 36 = 2.7 g/cm³</text><text x="60" y="426" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">= 2700 kg/m³</text><text x="60" y="470" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">Sinks in water: 2.7 > 1.00 g/cm³</text><text x="60" y="500" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">mass 97.2 g</text><rect x="520" y="190" width="70" height="230" fill="#fff" stroke="#1e2a44" stroke-width="2.5"/><rect x="522" y="345" width="66" height="73" fill="#dce9e7"/><path d="M522,345 Q555,353 588,345" fill="none" stroke="#2e6b62" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><line x1="520" y1="377.5" x2="534" y2="377.5" stroke="#1e2a44" stroke-width="1.8"/><line x1="520" y1="345" x2="534" y2="345" stroke="#1e2a44" stroke-width="1.8"/><line x1="520" y1="312.5" x2="534" y2="312.5" stroke="#1e2a44" stroke-width="1.8"/><line x1="520" y1="280" x2="534" y2="280" stroke="#1e2a44" stroke-width="1.8"/><line x1="520" y1="247.5" x2="534" y2="247.5" stroke="#1e2a44" stroke-width="1.8"/><line x1="520" y1="215" x2="534" y2="215" stroke="#1e2a44" stroke-width="1.8"/><text x="555" y="446" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">50.0 cm³</text><rect x="690" y="190" width="70" height="230" fill="#fff" stroke="#1e2a44" stroke-width="2.5"/><rect x="692" y="263.75" width="66" height="154.25" fill="#dce9e7"/><path d="M692,263.75 Q725,271.75 758,263.75" fill="none" stroke="#2e6b62" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><line x1="690" y1="377.5" x2="704" y2="377.5" stroke="#1e2a44" stroke-width="1.8"/><line x1="690" y1="345" x2="704" y2="345" stroke="#1e2a44" stroke-width="1.8"/><line x1="690" y1="312.5" x2="704" y2="312.5" stroke="#1e2a44" stroke-width="1.8"/><line x1="690" y1="280" x2="704" y2="280" stroke="#1e2a44" stroke-width="1.8"/><line x1="690" y1="247.5" x2="704" y2="247.5" stroke="#1e2a44" stroke-width="1.8"/><line x1="690" y1="215" x2="704" y2="215" stroke="#1e2a44" stroke-width="1.8"/><line x1="725" y1="180" x2="725" y2="388" stroke="#1e2a44" stroke-width="1.5"/><path d="M712,388 L738,384 L742,408 L710,412 Z" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><text x="725" y="446" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">62.5 cm³</text><line x1="600" y1="300" x2="680" y2="300" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="665" y="482" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">V = 62.5 − 50.0 = 12.5 cm³</text><text x="665" y="512" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">ρ = 112.5 ÷ 12.5 = 9.0 g/cm³</text><text x="665" y="548" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">read the bottom of the meniscus</text><rect x="30" y="600" width="840" height="90" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="638" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">ρ = m ÷ V</text><text x="450" y="668" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Floats if less dense than the liquid; ice (0.92 g/cm³) floats on water (1.00 g/cm³).</text>
</svg>