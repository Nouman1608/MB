<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 830" width="900" height="830" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="830" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Changes of state</text>

<circle cx="450" cy="190" r="78" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="450" y="199" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">Solid</text><circle cx="700" cy="560" r="78" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="700" y="569" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">Liquid</text><circle cx="200" cy="560" r="78" fill="#f6d9c6" stroke="#1e2a44" stroke-width="3"/><text x="200" y="569" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">Gas</text><line x1="510.8676977541427" y1="255.07782548695317" x2="660.0933637241052" y2="475.9318111224975" stroke="#b5602e" stroke-width="4" marker-end="url(#ahR)"/><text x="660" y="350" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">melting</text><line x1="639.1323022458573" y1="494.9221745130468" x2="489.9066362758949" y2="274.0681888775025" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><text x="575" y="425" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="end">freezing</text><line x1="612" y1="574" x2="292" y2="574" stroke="#b5602e" stroke-width="4" marker-end="url(#ahR)"/><text x="450" y="680" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">boiling / evaporation</text><line x1="288" y1="546" x2="608" y2="546" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><text x="450" y="530" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">condensation</text><line x1="389.1323022458573" y1="255.07782548695317" x2="239.9066362758949" y2="475.9318111224975" stroke="#b5602e" stroke-width="4" marker-end="url(#ahR)"/><text x="240" y="350" font-size="18" font-weight="700" fill="#b5602e" text-anchor="end">sublimation</text><line x1="260.8676977541427" y1="494.9221745130468" x2="410.0933637241051" y2="274.0681888775025" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><text x="325" y="425" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">deposition</text><rect x="40" y="120" width="230" height="80" rx="12" fill="#fff" stroke="#c9d6d4" stroke-width="2"/><line x1="58" y1="148" x2="98" y2="148" stroke="#b5602e" stroke-width="4" marker-end="url(#ahR)"/><text x="108" y="154" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">energy absorbed</text><line x1="58" y1="180" x2="98" y2="180" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><text x="108" y="186" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">energy released</text><rect x="30" y="720" width="840" height="90" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="756" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">During a change of state the temperature stays constant:</text><text x="450" y="784" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">energy overcomes forces between particles instead of speeding them up.</text>
</svg>