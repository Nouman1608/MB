<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 630" width="900" height="630" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="630" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Chromatography and Rf values</text>

<rect x="30" y="110" width="840" height="500" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="100" y="140" width="260" height="440" rx="6" fill="#f3f8fa" stroke="#1e2a44" stroke-width="2.5"/><rect x="102" y="540" width="256" height="38" fill="#dce9e7"/><text x="370" y="564" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">solvent</text><rect x="140" y="150" width="180" height="420" fill="#fff" stroke="#1e2a44" stroke-width="2"/><rect x="141" y="196" width="178" height="373" fill="#eef4f6"/><line x1="140" y1="196" x2="320" y2="196" stroke="#2b5a9a" stroke-width="2.5" stroke-dasharray="8 5"/><text x="370" y="201" font-size="15" font-weight="700" fill="#2b5a9a" text-anchor="start">solvent front</text><line x1="140" y1="520" x2="320" y2="520" stroke="#4a5568" stroke-width="2"/><text x="370" y="525" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">pencil baseline</text><circle cx="200" cy="520" r="7" fill="#1e2a44"/><ellipse cx="200" cy="390.4" rx="11" ry="8" fill="#2b5a9a"/><ellipse cx="200" cy="293.20000000000005" rx="11" ry="8" fill="#b5602e"/><text x="200" y="538" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">ink</text><circle cx="270" cy="520" r="7" fill="#1e2a44"/><ellipse cx="270" cy="293.20000000000005" rx="11" ry="8" fill="#b5602e"/><text x="270" y="538" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">ref.</text><line x1="126" y1="520" x2="126" y2="196" stroke="#2b5a9a" stroke-width="2.5" marker-start="url(#ah)" marker-end="url(#ah)"/><text x="118" y="363" font-size="15" font-weight="700" fill="#2b5a9a" text-anchor="end">9.0 cm</text><line x1="178" y1="520" x2="178" y2="390.4" stroke="#1e2a44" stroke-width="2" marker-start="url(#ah)" marker-end="url(#ah)"/><text x="172" y="460.2" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="end">3.6</text><line x1="222" y1="520" x2="222" y2="293.20000000000005" stroke="#b5602e" stroke-width="2" marker-start="url(#ahR)" marker-end="url(#ahR)"/><text x="230" y="354.4" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">6.3</text><text x="520" y="170" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Rf = spot distance ÷ solvent distance</text><text x="520" y="196" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">both measured from the baseline</text><rect x="520" y="220" width="320" height="56" rx="10" fill="#dce9e7"/><text x="536" y="255" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">blue: 3.6 ÷ 9.0 = 0.40</text><rect x="520" y="290" width="320" height="56" rx="10" fill="#f6d9c6"/><text x="536" y="325" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">red: 6.3 ÷ 9.0 = 0.70</text><text x="520" y="390" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Two spots: the ink is a mixture</text><text x="520" y="412" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">of at least two dyes.</text><text x="520" y="434" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"></text><text x="520" y="456" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A reference with the same Rf</text><text x="520" y="478" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(same solvent and paper) is</text><text x="520" y="500" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the same substance.</text><text x="450" y="595" font-size="15" font-weight="600" fill="#b5602e" text-anchor="middle">Baseline in pencil and above the solvent, so spots do not wash away.</text>
</svg>