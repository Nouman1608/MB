<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Two separation methods</text>

<rect x="30" y="110" width="300" height="520" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="180" y="148" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Filtration</text><text x="180" y="172" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">sand from water</text><path d="M110,220 L250,220 L195,320 L195,370 L165,370 L165,320 Z" fill="#fff" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><path d="M122,226 L238,226 L182,312 Z" fill="#efdfa8" stroke="#4a5568" stroke-width="1.5" stroke-dasharray="4 3"/><circle cx="150" cy="236" r="5" fill="#9c8f6e"/><circle cx="170" cy="250" r="5" fill="#9c8f6e"/><circle cx="195" cy="240" r="5" fill="#9c8f6e"/><circle cx="210" cy="232" r="5" fill="#9c8f6e"/><circle cx="180" cy="270" r="5" fill="#9c8f6e"/><path d="M120,430 L120,560 Q120,575 135,575 L225,575 Q240,575 240,560 L240,430" fill="#fff" stroke="#1e2a44" stroke-width="2.5"/><rect x="122" y="510" width="116" height="63" fill="#dce9e7"/><circle cx="180" cy="390" r="3.5" fill="#2b5a9a"/><circle cx="180" cy="420" r="3.5" fill="#2b5a9a"/><circle cx="180" cy="450" r="3.5" fill="#2b5a9a"/><text x="260" y="240" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">residue</text><text x="260" y="260" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">(sand)</text><text x="245" y="540" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">filtrate</text><text x="50" y="600" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Grains too big for the paper.</text><rect x="350" y="110" width="520" height="520" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="610" y="148" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Simple distillation</text><text x="610" y="172" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">pure water from seawater</text><circle cx="450" cy="400" r="60" fill="#fff" stroke="#1e2a44" stroke-width="2.5"/><path d="M392,418 A60,60 0 0 0 508,418 Z" fill="#dce9e7"/><rect x="436" y="260" width="28" height="86" fill="#fff" stroke="#1e2a44" stroke-width="2.5"/><rect x="434" y="250" width="32" height="14" rx="3" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><line x1="450" y1="210" x2="450" y2="290" stroke="#1e2a44" stroke-width="4"/><circle cx="450" cy="292" r="5" fill="#b5602e"/><text x="438" y="210" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="end">thermometer</text><line x1="464" y1="290" x2="710" y2="390" stroke="#1e2a44" stroke-width="12"/><line x1="464" y1="290" x2="710" y2="390" stroke="#fff" stroke-width="7"/><line x1="530" y1="318" x2="670" y2="374" stroke="#1e2a44" stroke-width="34" stroke-linecap="butt"/><line x1="530" y1="318" x2="670" y2="374" stroke="#dce9e7" stroke-width="29" stroke-linecap="butt"/><line x1="530" y1="318" x2="670" y2="374" stroke="#1e2a44" stroke-width="12"/><line x1="530" y1="318" x2="670" y2="374" stroke="#fff" stroke-width="7"/><line x1="660" y1="434" x2="660" y2="392" stroke="#2b5a9a" stroke-width="3" marker-end="url(#ah)"/><text x="652" y="444" font-size="15" font-weight="600" fill="#2b5a9a" text-anchor="end">cold water in</text><line x1="540" y1="300" x2="540" y2="258" stroke="#2b5a9a" stroke-width="3" marker-end="url(#ah)"/><text x="548" y="254" font-size="15" font-weight="600" fill="#2b5a9a" text-anchor="start">water out</text><text x="630" y="316" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">condenser</text><path d="M680,420 L680,530 Q680,545 695,545 L765,545 Q780,545 780,530 L780,420" fill="#fff" stroke="#1e2a44" stroke-width="2.5"/><rect x="682" y="500" width="96" height="43" fill="#dbeaf6"/><text x="730" y="572" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">pure water</text><path d="M442,512 q-14,-18 -2,-38 q4,14 10,6 q6,14 -8,32 Z" fill="#d4b02e" stroke="#b5602e" stroke-width="2"/><path d="M468,512 q-14,-18 -2,-38 q4,14 10,6 q6,14 -8,32 Z" fill="#d4b02e" stroke="#b5602e" stroke-width="2"/><text x="450" y="540" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">heat</text><text x="380" y="404" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="end">seawater</text><text x="370" y="600" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Water boils, vapour condenses; salt stays in the flask.</text>
</svg>