<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="600" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Diffusion in a tube</text>

<rect x="30" y="110" width="840" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="120" y="218" width="660" height="44" rx="6" fill="#f3f8fa" stroke="#1e2a44" stroke-width="2.5"/><rect x="80" y="212" width="44" height="56" rx="6" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><rect x="776" y="212" width="44" height="56" rx="6" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><rect x="506" y="220" width="20" height="40" fill="#fff" stroke="#4a5568" stroke-width="2"/><text x="80" y="196" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">cotton wool soaked in</text><text x="80" y="300" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">ammonia</text><text x="820" y="196" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">cotton wool soaked in</text><text x="820" y="300" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">hydrogen chloride</text><line x1="140" y1="180" x2="486" y2="180" stroke="#2e6b62" stroke-width="6" marker-end="url(#ahT)"/><text x="318" y="166" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">lighter: moves faster, travels further</text><line x1="760" y1="180" x2="546" y2="180" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><text x="658" y="166" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">heavier: slower</text><line x1="516" y1="264" x2="516" y2="328" stroke="#1e2a44" stroke-width="1.8"/><text x="516" y="348" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">white ring of ammonium chloride</text><text x="516" y="368" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">forms nearer the hydrogen chloride end</text><rect x="30" y="460" width="840" height="120" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="60" y="496" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Diffusion: net movement from higher to lower concentration by random motion.</text><text x="60" y="528" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Fast in gases, slower in liquids, extremely slow in solids.</text><text x="60" y="556" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Faster at higher temperature and for lighter particles.</text>
</svg>