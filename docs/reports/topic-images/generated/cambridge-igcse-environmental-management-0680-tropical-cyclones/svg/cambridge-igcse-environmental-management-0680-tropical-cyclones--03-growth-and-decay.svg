<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 815" width="900" height="815" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="815" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How a tropical cyclone grows and dies</text>

<rect x="30" y="110" width="840" height="410" rx="14" fill="#eef1f8"/><rect x="30" y="520" width="560" height="50" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><path d="M590,520 L870,490 L870,570 L590,570 Z" fill="#a77b52" stroke="#1e2a44" stroke-width="2.5"/><text x="300" y="553" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">warm sea, at least 27 °C</text><text x="730" y="553" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">land</text><path d="M105,510 Q85,320 135,220 Q165,180 195,220 Q245,320 225,510 Z" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><path d="M395,510 Q375,320 425,220 Q455,180 485,220 Q535,320 515,510 Z" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="300" y="360" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">EYE</text><text x="300" y="382" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="middle">calm, clear</text><line x1="165" y1="490" x2="165" y2="250" stroke="#b5602e" stroke-width="4" marker-end="url(#ahR)"/><line x1="455" y1="490" x2="455" y2="250" stroke="#b5602e" stroke-width="4" marker-end="url(#ahR)"/><line x1="36" y1="500" x2="98" y2="500" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="586" y1="500" x2="524" y2="500" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="135" y1="190" x2="60" y2="170" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="485" y1="190" x2="560" y2="170" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><circle cx="60" cy="470" r="16" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="475.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><circle cx="125" cy="370" r="16" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="125" y="375.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><circle cx="215" cy="240" r="16" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="215" y="245.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><circle cx="640" cy="410" r="16" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="640" y="415.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><circle cx="720" cy="230" r="70" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><path d="M720,230 m0,-12 a12,12 0 1,1 -12,12 M699,230 q0,-36 36,-33 M741,230 q0,36 -36,33 M720,194 q48,0 57,30 M720,266 q-48,0 -57,-30" fill="none" stroke="#2e6b62" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><text x="720" y="326" font-size="15.5" font-weight="600" fill="#1e2a44" text-anchor="middle">from above: spins</text><line x1="600" y1="450" x2="720" y2="450" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)" stroke-dasharray="8 6"/><text x="730" y="444" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">over land:</text><text x="730" y="464" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">weakens</text><text x="860" y="132" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">schematic, not to scale</text><circle cx="50" cy="604" r="15" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="50" y="609.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="78" y="610" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">Warm, moist air rises from the sea, creating very low pressure.</text><circle cx="50" cy="637" r="15" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="50" y="642.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="78" y="643" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">It cools; water vapour condenses into towering clouds, releasing heat that makes the</text><text x="78" y="664" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">air rise faster.</text><circle cx="50" cy="691" r="15" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="50" y="696.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="78" y="697" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">More air is drawn in across the sea and Earth’s rotation makes it spiral; a calm eye</text><text x="78" y="718" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">forms, ringed by the strongest winds and heaviest rain.</text><circle cx="50" cy="745" r="15" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="50" y="750.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="78" y="751" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">Over land or cooler water it loses its warm, moist air supply, and friction slows the</text><text x="78" y="772" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">winds.</text>
</svg>