<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 785" width="900" height="785" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="785" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Seven strategies: before, during, after</text>

<path d="M30,110 L285,110 L305,140 L285,170 L30,170 Z" fill="#2e6b62"/><text x="158" y="148" font-size="21" font-weight="700" fill="#ffffff" text-anchor="middle">Before</text><rect x="30" y="186" width="270" height="136" rx="12" fill="#eef5f4" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="216" font-size="17.5" font-weight="700" fill="#1e2a44" text-anchor="start">Monitoring and warning</text><text x="46" y="242" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">satellites, radar, aircraft;</text><text x="46" y="262" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">warnings days ahead by radio,</text><text x="46" y="282" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">phone, sirens</text><rect x="30" y="336" width="270" height="136" rx="12" fill="#eef5f4" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="366" font-size="17.5" font-weight="700" fill="#1e2a44" text-anchor="start">Structure of buildings</text><text x="46" y="392" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">roof straps, shutters, raised</text><text x="46" y="412" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">floors, stronger frames</text><rect x="30" y="486" width="270" height="136" rx="12" fill="#eef5f4" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="516" font-size="17.5" font-weight="700" fill="#1e2a44" text-anchor="start">Disaster preparation</text><text x="46" y="542" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">plans, drills, stores of</text><text x="46" y="562" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">food, water, medicine; rescue</text><text x="46" y="582" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">teams</text><path d="M315,110 L570,110 L590,140 L570,170 L315,170 Z" fill="#8a6d0d"/><text x="443" y="148" font-size="21" font-weight="700" fill="#ffffff" text-anchor="middle">During</text><rect x="315" y="186" width="270" height="136" rx="12" fill="#fbf6e2" stroke="#8a6d0d" stroke-width="2.5"/><text x="331" y="216" font-size="17.5" font-weight="700" fill="#1e2a44" text-anchor="start">Evacuation</text><text x="331" y="242" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">people and livestock inland</text><text x="331" y="262" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">or to higher ground</text><rect x="315" y="336" width="270" height="136" rx="12" fill="#fbf6e2" stroke="#8a6d0d" stroke-width="2.5"/><text x="331" y="366" font-size="17.5" font-weight="700" fill="#1e2a44" text-anchor="start">Shelters</text><text x="331" y="392" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">strong raised buildings, e.g.</text><text x="331" y="412" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">along Bangladesh’s low coast</text><path d="M600,110 L855,110 L875,140 L855,170 L600,170 Z" fill="#b5602e"/><text x="728" y="148" font-size="21" font-weight="700" fill="#ffffff" text-anchor="middle">After</text><rect x="600" y="186" width="270" height="136" rx="12" fill="#fbf1ea" stroke="#b5602e" stroke-width="2.5"/><text x="616" y="216" font-size="17.5" font-weight="700" fill="#1e2a44" text-anchor="start">Rebuilding</text><text x="616" y="242" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">ideally to stronger standards</text><rect x="600" y="336" width="270" height="136" rx="12" fill="#fbf1ea" stroke="#b5602e" stroke-width="2.5"/><text x="616" y="366" font-size="17.5" font-weight="700" fill="#1e2a44" text-anchor="start">International aid</text><text x="616" y="392" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">money, food, temporary</text><text x="616" y="412" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">housing, water purification,</text><text x="616" y="432" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">medical teams</text><rect x="30" y="650" width="840" height="76" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="684" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Strategies depend on each other: a warning only saves lives if people</text><text x="450" y="708" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">have a plan, transport and a shelter to go to.</text><text x="450" y="760" font-size="16" font-weight="600" fill="#b5602e" text-anchor="middle">Land use zoning is NOT one of the seven cyclone strategies.</text>
</svg>