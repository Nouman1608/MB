<rect width="900" height="705" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three conditions, exact numbers</text>

<rect x="30" y="110" width="270" height="290" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="165" y="148" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Latitude</text><rect x="60" y="166" width="210" height="76" rx="14" fill="#d4b02e" stroke="#8a6d0d" stroke-width="3"/><text x="165" y="218" font-size="32" font-weight="700" fill="#1e2a44" text-anchor="middle">5° to 30°</text><text x="165" y="270" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">north or south of the Equator</text><text x="165" y="316" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Earth’s rotation makes the</text><text x="165" y="337" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">air spin</text><rect x="315" y="110" width="270" height="290" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="148" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Ocean temperature</text><rect x="345" y="166" width="210" height="76" rx="14" fill="#d4b02e" stroke="#8a6d0d" stroke-width="3"/><text x="450" y="218" font-size="32" font-weight="700" fill="#1e2a44" text-anchor="middle">≥ 27 °C</text><text x="450" y="270" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">at least</text><text x="450" y="316" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">warm water evaporates fast,</text><text x="450" y="337" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">supplying heat and moisture</text><rect x="600" y="110" width="270" height="290" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="735" y="148" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Ocean depth</text><rect x="630" y="166" width="210" height="76" rx="14" fill="#d4b02e" stroke="#8a6d0d" stroke-width="3"/><text x="735" y="218" font-size="32" font-weight="700" fill="#1e2a44" text-anchor="middle">≥ 60 m</text><text x="735" y="270" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">of warm water, at least</text><text x="735" y="316" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">storm cannot stir up cold</text><text x="735" y="337" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">water and cut off its</text><text x="735" y="358" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">energy</text><rect x="30" y="420" width="840" height="260" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="60" y="470" width="780" height="180" fill="#9fc1bd"/><rect x="60" y="470" width="780" height="90" fill="#b5d3cf"/><rect x="60" y="470" width="780" height="90" fill="url(#warm)" opacity="0.0"/><line x1="60" y1="470" x2="840" y2="470" stroke="#2e6b62" stroke-width="3"/><line x1="60" y1="560" x2="840" y2="560" stroke="#1e2a44" stroke-width="2.5" stroke-dasharray="8 6"/><rect x="320.25" y="504.325" width="259.5" height="22.275000000000002" rx="5" fill="#f2e7b8" opacity="1"/><text x="450" y="520" font-size="16.5" font-weight="700" fill="#8a6d0d" text-anchor="middle">warm layer at least 27 °C</text><rect x="354.9" y="596.325" width="190.2" height="22.275000000000002" rx="5" fill="#ffffff" opacity="0.92"/><text x="450" y="612" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="middle">cooler water below</text><line x1="110" y1="476" x2="110" y2="552" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="110" y1="552" x2="110" y2="478" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="126" y="520" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="start">at least 60 m</text><path d="M667,461 Q656,461 657.1,450 Q658.2,437.9 672.5,440.1 Q678,423.6 697.25,426.9 Q713.75,417 724.75,436.25 Q744,436.25 742.9,451.1 Q744,461 733,461 Z" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><text x="840" y="455" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start"></text><text x="450" y="668" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">not to scale</text>
</svg>