<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 800" width="900" height="800" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="800" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Where tropical cyclones form</text>

<rect x="140" y="135" width="720" height="450" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><rect x="140" y="210" width="720" height="125" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><rect x="140" y="385" width="720" height="125" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><line x1="140" y1="360" x2="860" y2="360" stroke="#1e2a44" stroke-width="3" stroke-dasharray="12 6"/><line x1="130" y1="210" x2="140" y2="210" stroke="#1e2a44" stroke-width="2.5"/><text x="124" y="216" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">30° N</text><line x1="130" y1="335" x2="140" y2="335" stroke="#1e2a44" stroke-width="2.5"/><text x="124" y="341" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">5° N</text><line x1="130" y1="360" x2="140" y2="360" stroke="#1e2a44" stroke-width="2.5"/><text x="124" y="366" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">Equator 0°</text><line x1="130" y1="385" x2="140" y2="385" stroke="#1e2a44" stroke-width="2.5"/><text x="124" y="391" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">5° S</text><line x1="130" y1="510" x2="140" y2="510" stroke="#1e2a44" stroke-width="2.5"/><text x="124" y="516" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">30° S</text><text x="500" y="278.5" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">cyclones form here: 5° to 30° N</text><text x="500" y="453.5" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">cyclones form here: 5° to 30° S</text><rect x="294.05" y="351.275" width="411.9" height="20.925" rx="5" fill="#dce9e7" opacity="1"/><text x="500" y="366" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="middle">too close to the Equator: air does not spin</text><text x="500" y="175" font-size="15.5" font-weight="600" fill="#4a5568" text-anchor="middle">beyond about 30°: sea usually too cool</text><text x="500" y="555" font-size="15.5" font-weight="600" fill="#4a5568" text-anchor="middle">beyond about 30°: sea usually too cool</text><text x="860" y="125" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">schematic latitude band, not a map</text><text x="450" y="625" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Same storm, regional names</text><rect x="30" y="643" width="270" height="100" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="165" y="678" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Hurricane</text><text x="165" y="702.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">North Atlantic and</text><text x="165" y="723.92" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">north-east Pacific</text><rect x="315" y="643" width="270" height="100" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="678" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Typhoon</text><text x="450" y="702.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">north-west Pacific</text><rect x="600" y="643" width="270" height="100" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="735" y="678" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Cyclone</text><text x="735" y="702.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Indian Ocean and South</text><text x="735" y="723.92" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Pacific</text><text x="450" y="775" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Weaker systems are called tropical storms. The same conditions and strategies apply.</text>
</svg>