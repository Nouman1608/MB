<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 780" width="900" height="780" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="780" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three processes, ten impacts</text>

<text x="450" y="128" font-size="17" font-weight="700" fill="#4a5568" text-anchor="middle">The three physical processes behind the impacts</text><rect x="35" y="140" width="250" height="34" rx="17" fill="#1e2a44" stroke="#1e2a44" stroke-width="2.5"/><text x="160" y="163.12" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">Strong winds</text><rect x="325" y="140" width="250" height="34" rx="17" fill="#2b5a9a" stroke="#2b5a9a" stroke-width="2.5"/><text x="450" y="163.12" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">Heavy rainfall</text><rect x="615" y="140" width="250" height="34" rx="17" fill="#2e6b62" stroke="#2e6b62" stroke-width="2.5"/><text x="740" y="163.12" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">Storm surge</text><rect x="30" y="196" width="410" height="70" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="224" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Buildings and infrastructure</text><text x="46" y="248" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">roofs, power lines, coastal roads</text><rect x="460" y="196" width="410" height="70" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="476" y="224" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Loss of crops</text><text x="476" y="248" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">flattened; salt from sea water</text><rect x="30" y="278" width="410" height="70" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="306" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Livestock and habitats</text><text x="46" y="330" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">animals drown; mangroves, reefs</text><rect x="460" y="278" width="410" height="70" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="476" y="306" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Evacuation</text><text x="476" y="330" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">people and livestock move inland</text><rect x="30" y="360" width="410" height="70" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="388" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Flooding</text><text x="46" y="412" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">rain on land, surge at coast</text><rect x="460" y="360" width="410" height="70" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="476" y="388" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Landslides</text><text x="476" y="412" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">saturated soil on steep slopes</text><rect x="30" y="442" width="410" height="70" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="470" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Contaminated drinking water</text><text x="46" y="494" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">sea water and sewage in wells</text><rect x="460" y="442" width="410" height="70" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="476" y="470" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Water-related disease</text><text x="476" y="494" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">cholera, diarrhoea, mosquitoes</text><rect x="30" y="524" width="410" height="70" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="552" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Financial losses</text><text x="46" y="576" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">rebuilding, harvests, tourism</text><rect x="460" y="524" width="410" height="70" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="476" y="552" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Human health</text><text x="476" y="576" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">debris injuries, drowning, stress</text><rect x="30" y="618" width="840" height="140" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="60" y="656" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Make the chain clear, for example:</text><rect x="46" y="680" width="146" height="66" rx="10" fill="#ffffff" stroke="#8a6d0d" stroke-width="2"/><text x="119" y="718" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">storm surge</text><line x1="194" y1="715" x2="209" y2="715" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="212" y="680" width="146" height="66" rx="10" fill="#ffffff" stroke="#8a6d0d" stroke-width="2"/><text x="285" y="709" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">sea water floods</text><text x="285" y="727" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">farmland</text><line x1="360" y1="715" x2="375" y2="715" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="378" y="680" width="146" height="66" rx="10" fill="#ffffff" stroke="#8a6d0d" stroke-width="2"/><text x="451" y="709" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">salt left in</text><text x="451" y="727" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">soil</text><line x1="526" y1="715" x2="541" y2="715" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="544" y="680" width="146" height="66" rx="10" fill="#ffffff" stroke="#8a6d0d" stroke-width="2"/><text x="617" y="701" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">crops fail for</text><text x="617" y="719" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">more than one</text><text x="617" y="737" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">season</text><line x1="692" y1="715" x2="707" y2="715" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="710" y="680" width="146" height="66" rx="10" fill="#ffffff" stroke="#8a6d0d" stroke-width="2"/><text x="783" y="709" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">food shortages,</text><text x="783" y="727" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">lost income</text>
</svg>