<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 780" width="900" height="780" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="780" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three processes, ten impacts</text>

<rect x="35" y="112" width="250" height="50" rx="25" fill="#1e2a44" stroke="#1e2a44" stroke-width="2.5"/><text x="160" y="143.48" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Strong winds</text><rect x="325" y="112" width="250" height="50" rx="25" fill="#2b5a9a" stroke="#2b5a9a" stroke-width="2.5"/><text x="450" y="143.48" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Heavy rainfall</text><rect x="615" y="112" width="250" height="50" rx="25" fill="#2e6b62" stroke="#2e6b62" stroke-width="2.5"/><text x="740" y="143.48" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Storm surge</text><rect x="30" y="186" width="410" height="70" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="214" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Buildings and infrastructure</text><text x="46" y="238" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">roofs, power lines, coastal roads</text><circle cx="422" cy="204" r="7" fill="#1e2a44" stroke="#1e2a44" stroke-width="1"/><circle cx="404" cy="204" r="7" fill="#2e6b62" stroke="#2e6b62" stroke-width="1"/><rect x="460" y="186" width="410" height="70" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="476" y="214" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Loss of crops</text><text x="476" y="238" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">flattened; salt from sea water</text><circle cx="852" cy="204" r="7" fill="#1e2a44" stroke="#1e2a44" stroke-width="1"/><circle cx="834" cy="204" r="7" fill="#2e6b62" stroke="#2e6b62" stroke-width="1"/><rect x="30" y="268" width="410" height="70" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="296" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Livestock and habitats</text><text x="46" y="320" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">animals drown; mangroves, reefs</text><circle cx="422" cy="286" r="7" fill="#2b5a9a" stroke="#2b5a9a" stroke-width="1"/><circle cx="404" cy="286" r="7" fill="#2e6b62" stroke="#2e6b62" stroke-width="1"/><rect x="460" y="268" width="410" height="70" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="476" y="296" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Evacuation</text><text x="476" y="320" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">people and livestock move inland</text><circle cx="852" cy="286" r="7" fill="#1e2a44" stroke="#1e2a44" stroke-width="1"/><circle cx="834" cy="286" r="7" fill="#2b5a9a" stroke="#2b5a9a" stroke-width="1"/><circle cx="816" cy="286" r="7" fill="#2e6b62" stroke="#2e6b62" stroke-width="1"/><rect x="30" y="350" width="410" height="70" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="378" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Flooding</text><text x="46" y="402" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">rain on land, surge at coast</text><circle cx="422" cy="368" r="7" fill="#2b5a9a" stroke="#2b5a9a" stroke-width="1"/><circle cx="404" cy="368" r="7" fill="#2e6b62" stroke="#2e6b62" stroke-width="1"/><rect x="460" y="350" width="410" height="70" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="476" y="378" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Landslides</text><text x="476" y="402" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">saturated soil on steep slopes</text><circle cx="852" cy="368" r="7" fill="#2b5a9a" stroke="#2b5a9a" stroke-width="1"/><rect x="30" y="432" width="410" height="70" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="460" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Contaminated drinking water</text><text x="46" y="484" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">sea water and sewage in wells</text><circle cx="422" cy="450" r="7" fill="#2b5a9a" stroke="#2b5a9a" stroke-width="1"/><circle cx="404" cy="450" r="7" fill="#2e6b62" stroke="#2e6b62" stroke-width="1"/><rect x="460" y="432" width="410" height="70" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="476" y="460" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Water-related disease</text><text x="476" y="484" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">cholera, diarrhoea, mosquitoes</text><circle cx="852" cy="450" r="7" fill="#2b5a9a" stroke="#2b5a9a" stroke-width="1"/><circle cx="834" cy="450" r="7" fill="#2e6b62" stroke="#2e6b62" stroke-width="1"/><rect x="30" y="514" width="410" height="70" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="542" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Financial losses</text><text x="46" y="566" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">rebuilding, harvests, tourism</text><circle cx="422" cy="532" r="7" fill="#1e2a44" stroke="#1e2a44" stroke-width="1"/><circle cx="404" cy="532" r="7" fill="#2b5a9a" stroke="#2b5a9a" stroke-width="1"/><circle cx="386" cy="532" r="7" fill="#2e6b62" stroke="#2e6b62" stroke-width="1"/><rect x="460" y="514" width="410" height="70" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="476" y="542" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Human health</text><text x="476" y="566" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">debris injuries, drowning, stress</text><circle cx="852" cy="532" r="7" fill="#1e2a44" stroke="#1e2a44" stroke-width="1"/><circle cx="834" cy="532" r="7" fill="#2b5a9a" stroke="#2b5a9a" stroke-width="1"/><circle cx="816" cy="532" r="7" fill="#2e6b62" stroke="#2e6b62" stroke-width="1"/><text x="450" y="618" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Dots show which process mainly drives each impact.</text><rect x="30" y="636" width="840" height="120" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="60" y="670" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Make the chain clear, for example:</text><rect x="50" y="690" width="107.6" height="48" rx="10" fill="#ffffff" stroke="#8a6d0d" stroke-width="2"/><text x="103.8" y="720" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">storm surge</text><line x1="159.6" y1="714" x2="175.6" y2="714" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="179.6" y="690" width="214" height="48" rx="10" fill="#ffffff" stroke="#8a6d0d" stroke-width="2"/><text x="286.6" y="720" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">sea water floods farmland</text><line x1="395.6" y1="714" x2="411.6" y2="714" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="415.6" y="690" width="153.2" height="48" rx="10" fill="#ffffff" stroke="#8a6d0d" stroke-width="2"/><text x="492.20000000000005" y="720" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">salt left in soil</text><line x1="570.8" y1="714" x2="586.8" y2="714" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="590.8" y="690" width="290" height="48" rx="10" fill="#ffffff" stroke="#8a6d0d" stroke-width="2"/><text x="735.8" y="720" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">crops fail for more than one season</text><line x1="882.8" y1="714" x2="898.8" y2="714" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="902.8" y="690" width="229.2" height="48" rx="10" fill="#ffffff" stroke="#8a6d0d" stroke-width="2"/><text x="1017.4" y="720" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">food shortages, lost income</text>
</svg>