<text x="450" y="120" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">About five or six paragraphs, each doing a job</text><rect x="30" y="140" width="152" height="96" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><line x1="46" y1="162" x2="166" y2="162" stroke="#1e2a44" stroke-opacity="0.25" stroke-width="5" stroke-linecap="round"/><line x1="46" y1="180" x2="166" y2="180" stroke="#1e2a44" stroke-opacity="0.25" stroke-width="5" stroke-linecap="round"/><line x1="46" y1="198" x2="136" y2="198" stroke="#1e2a44" stroke-opacity="0.25" stroke-width="5" stroke-linecap="round"/><text x="106" y="260" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">establishing</text><rect x="202" y="140" width="152" height="96" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><line x1="218" y1="162" x2="338" y2="162" stroke="#1e2a44" stroke-opacity="0.25" stroke-width="5" stroke-linecap="round"/><line x1="218" y1="180" x2="338" y2="180" stroke="#1e2a44" stroke-opacity="0.25" stroke-width="5" stroke-linecap="round"/><line x1="218" y1="198" x2="308" y2="198" stroke="#1e2a44" stroke-opacity="0.25" stroke-width="5" stroke-linecap="round"/><text x="278" y="260" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">developing</text><rect x="374" y="140" width="152" height="96" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><line x1="390" y1="162" x2="510" y2="162" stroke="#1e2a44" stroke-opacity="0.25" stroke-width="5" stroke-linecap="round"/><line x1="390" y1="180" x2="510" y2="180" stroke="#1e2a44" stroke-opacity="0.25" stroke-width="5" stroke-linecap="round"/><line x1="390" y1="198" x2="480" y2="198" stroke="#1e2a44" stroke-opacity="0.25" stroke-width="5" stroke-linecap="round"/><text x="450" y="260" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">developing</text><rect x="546" y="140" width="152" height="96" rx="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><line x1="562" y1="162" x2="682" y2="162" stroke="#1e2a44" stroke-opacity="0.25" stroke-width="5" stroke-linecap="round"/><line x1="562" y1="180" x2="682" y2="180" stroke="#1e2a44" stroke-opacity="0.25" stroke-width="5" stroke-linecap="round"/><line x1="562" y1="198" x2="652" y2="198" stroke="#1e2a44" stroke-opacity="0.25" stroke-width="5" stroke-linecap="round"/><text x="622" y="260" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">turning</text><rect x="718" y="140" width="152" height="96" rx="10" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><line x1="734" y1="162" x2="854" y2="162" stroke="#1e2a44" stroke-opacity="0.25" stroke-width="5" stroke-linecap="round"/><line x1="734" y1="180" x2="854" y2="180" stroke="#1e2a44" stroke-opacity="0.25" stroke-width="5" stroke-linecap="round"/><line x1="734" y1="198" x2="824" y2="198" stroke="#1e2a44" stroke-opacity="0.25" stroke-width="5" stroke-linecap="round"/><text x="794" y="260" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">resolving</text><rect x="30" y="292" width="270" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="165" y="326.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">One scene or a short</text><text x="165" y="350.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">sequence</text><text x="165" y="379.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">not a whole life</text><rect x="315" y="292" width="270" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="326.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">A single viewpoint</text><text x="450" y="355.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">held steadily</text><rect x="600" y="292" width="270" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="735" y="326.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">One situation, one</text><text x="735" y="350.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">change, one ending</text><text x="735" y="379.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">and not much more</text><text x="450" y="446" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Choose a clear shape</text><rect x="30" y="462" width="268" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="164" y="492" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Zoom</text><path d="M70,512 L258,512 L178,586 L150,586 Z" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="164" y="616" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">setting → detail</text><rect x="316" y="462" width="268" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="492" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Present + one memory</text><rect x="346" y="536" width="208" height="22" rx="6" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><rect x="416" y="508" width="68" height="22" rx="6" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><path d="M450,530 L450,536" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><text x="450" y="586" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="middle">present scene</text><text x="450" y="616" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">one memory dropped in</text><rect x="602" y="462" width="268" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="736" y="492" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Cyclical ending</text><circle cx="736" cy="550" r="34" fill="none" stroke="#8a6d0d" stroke-width="3" stroke-dasharray="150 64" marker-end="url(#ahO)"/><text x="736" y="616" font-size="16" font-weight="400" 