<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 502" width="900" height="502" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="502" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Two routes to a topic</text>

<rect x="30" y="100" width="408" height="200" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="133" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ROUTE 1</text><text x="50" y="160" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Suggested by an Anthology piece</text><text x="50" y="189.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="189.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">A piece that begins or ends with a given</text><text x="66.15" y="211.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">line</text><text x="50" y="241.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="241.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">The next episode in a character’s story</text><text x="66.15" y="263.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">after reading a Part 2 prose text</text><rect x="462" y="100" width="408" height="200" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="482" y="133" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">ROUTE 2</text><text x="482" y="160" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Unrelated, perhaps from a set of</text><text x="482" y="186" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">images</text><text x="482" y="215.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="498.15" y="215.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">A title such as “The visitor”</text><text x="482" y="245.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="498.15" y="245.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">A frightening experience</text><text x="482" y="275.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="498.15" y="275.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">An embarrassing moment</text><rect x="30" y="322" width="840" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="360" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Anthology text: a springboard, not a template</text><rect x="54" y="382" width="282" height="33" rx="16.5" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="195" y="404.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">match: voice and situation</text><rect x="54" y="426" width="379" height="33" rx="16.5" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="243.5" y="448.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">your own: writing, events and images</text><text x="480" y="404" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Close enough to be recognisable; never</text><text x="480" y="426" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">copy the original’s sentences.</text>
</svg>