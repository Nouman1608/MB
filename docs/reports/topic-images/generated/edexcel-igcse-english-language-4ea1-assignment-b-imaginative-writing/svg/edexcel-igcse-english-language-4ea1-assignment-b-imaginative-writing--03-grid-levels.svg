<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 665" width="900" height="665" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="665" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What the grids reward</text>

<rect x="30" y="100" width="120" height="47" fill="#1e2a44"/><text x="90" y="129.3" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Level</text><rect x="150" y="100" width="390" height="47" fill="#8a6d0d"/><text x="345" y="129.3" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">AO4 (18 marks)</text><rect x="540" y="100" width="330" height="47" fill="#2e6b62"/><text x="705" y="129.3" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">AO5 (12 marks)</text><rect x="30" y="147" width="120" height="139" fill="#d4b02e" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="219.12" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Level 5</text><rect x="150" y="147" width="390" height="139" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2"/><text x="164" y="173.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“Communication is perceptive and subtle”;</text><text x="164" y="194.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“sharply focused on purpose”;</text><text x="164" y="215.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“sophisticated use of form, tone and</text><text x="164" y="236.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">register”</text><text x="164" y="265.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">16–18</text><rect x="540" y="147" width="330" height="139" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2"/><text x="554" y="173.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“Manipulates complex ideas”;</text><text x="554" y="194.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“extensive vocabulary</text><text x="554" y="215.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">strategically”; punctuation “to aid</text><text x="554" y="236.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">emphasis and precision”</text><text x="554" y="265.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">11–12</text><rect x="30" y="286" width="120" height="118" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="347.62" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Level 4</text><rect x="150" y="286" width="390" height="118" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="164" y="312.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“Communicates successfully”; “a secure</text><text x="164" y="333.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">realisation of the writing task”;</text><text x="164" y="354.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“effective use of form, tone and register”</text><text x="164" y="383.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">12–15</text><rect x="540" y="286" width="330" height="118" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="554" y="312.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“Wide, selective vocabulary”;</text><text x="554" y="333.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“managing sentence structures for</text><text x="554" y="354.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">deliberate effect”</text><text x="554" y="383.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">8–10</text><rect x="30" y="404" width="120" height="97" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="455.12" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Level 3</text><rect x="150" y="404" width="390" height="97" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="164" y="430.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“Communicates clearly”; “appropriate use of</text><text x="164" y="451.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">form, tone and register”</text><text x="164" y="480.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">8–11</text><rect x="540" y="404" width="330" height="97" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="554" y="430.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“Varied vocabulary”; “accurate and</text><text x="554" y="451.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">varied punctuation”</text><text x="554" y="480.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">5–7</text><rect x="30" y="100" width="840" height="401" rx="4" fill="none" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="543" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Words that recur at the top levels</text><rect x="134" y="559" width="200" height="40" rx="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="234" y="585.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">deliberate</text><rect x="350" y="559" width="200" height="40" rx="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="450" y="585.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">strategically</text><rect x="566" y="559" width="200" height="40" rx="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="666" y="585.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">selectively</text><text x="450" y="629" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">Choices you can make visible because you have time to revise.</text>
</svg>