<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 775" width="900" height="775" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="775" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked redraft: after “The Necklace”</text>

<rect x="30" y="100" width="840" height="104" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="133" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">FIRST DRAFT: TELLS</text><text x="50" y="157.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">“Madame Forestier went home and thought about the necklace. She felt quite sad and</text><text x="50" y="179.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">guilty because Mathilde had worked so hard for ten years…”</text><rect x="30" y="222" width="840" height="126" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="255" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">REDRAFT: SHOWS</text><text x="50" y="279.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">“…The case was where it had always been, at the back of the drawer… She had not</text><text x="50" y="301.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">even opened it, that day. She opened it now. The stones looked exactly as they</text><text x="50" y="323.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">always had, which was the worst of it…”</text><rect x="30" y="366" width="411" height="254" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="399" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">AO4</text><text x="50" y="426" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Showing, not stating</text><text x="50" y="454.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="454.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Close third person gives her thoughts</text><text x="65.2" y="475.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">without naming emotions</text><text x="50" y="501.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="501.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The unopened case: a telling detail that</text><text x="65.2" y="522.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">turns into guilt</text><text x="50" y="548.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="548.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Two short sentences pivot from past to</text><text x="65.2" y="569.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">present</text><text x="50" y="595.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="595.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The ending keeps the original story’s irony</text><rect x="459" y="366" width="411" height="254" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="479" y="399" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">AO5</text><text x="479" y="426" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Deliberate technique</text><text x="479" y="454.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="494.2" y="454.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A precise verb: “gargling”</text><text x="479" y="480.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="494.2" y="480.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A semicolon and a colon used deliberately</text><text x="479" y="506.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="494.2" y="506.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Sentence lengths that slow down to the</text><text x="494.2" y="527.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">final admission</text><rect x="30" y="638" width="840" height="107" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="671.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Faithful but original</text><text x="48" y="700.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">It follows on from the story’s ending and the returned case, but invents its own images,</text><text x="48" y="722.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">voice and structure. Check every borrowed detail against the original.</text>
</svg>