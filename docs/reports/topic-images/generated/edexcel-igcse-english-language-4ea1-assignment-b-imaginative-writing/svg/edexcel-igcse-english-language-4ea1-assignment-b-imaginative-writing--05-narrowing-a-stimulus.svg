<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="600" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Narrow the stimulus quickly</text>

<rect x="30" y="100" width="405" height="189" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="133" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">A TITLE</text><text x="50" y="161.6" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">“The visitor”</text><text x="50" y="192.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="192.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Who is the visitor?</text><text x="50" y="220.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="220.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">To whom?</text><text x="50" y="248.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="248.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Why does the visit matter now?</text><rect x="465" y="100" width="405" height="189" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="485" y="133" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ONE IMAGE FROM A SET</text><text x="485" y="161.6" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Ask about the moment</text><text x="485" y="192.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="501.15" y="192.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">What happened five minutes before it</text><text x="501.15" y="214.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">was taken?</text><text x="485" y="242.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="501.15" y="242.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">What can the person outside the frame</text><text x="501.15" y="264.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">see?</text><line x1="232" y1="295" x2="400" y2="339" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="668" y1="295" x2="500" y2="339" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="450" y="381" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Specific answers give you</text><rect x="104" y="397" width="220" height="42" rx="21" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="214" y="424.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">a situation</text><rect x="340" y="397" width="220" height="42" rx="21" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="450" y="424.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">a viewpoint</text><rect x="576" y="397" width="220" height="42" rx="21" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="686" y="424.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">a source of tension</text><rect x="30" y="463" width="840" height="107" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="496.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">“Sharply focused on purpose” (AO4)</text><text x="48" y="525.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Decide early whether the piece will mainly narrate or describe, and keep that purpose clear</text><text x="48" y="547.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">through every draft. The risk otherwise is a generic piece.</text>
</svg>