<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 737" width="900" height="737" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="737" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A drafting routine, all before marking</text>

<rect x="30" y="100" width="150" height="52" rx="26" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="105" y="132" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Draft</text><line x1="183" y1="126" x2="199" y2="126" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="202" y="100" width="150" height="52" rx="26" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="277" y="132" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Feedback</text><line x1="355" y1="126" x2="371" y2="126" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="374" y="100" width="150" height="52" rx="26" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="449" y="132" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Revise</text><line x1="527" y1="126" x2="543" y2="126" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="546" y="100" width="150" height="52" rx="26" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="621" y="132" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Proofread</text><line x1="699" y1="126" x2="715" y2="126" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="718" y="100" width="150" height="52" rx="26" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="793" y="132" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Submit</text><text x="450" y="182" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">The teacher may suggest general improvements; you make the corrections. No rewriting after marking.</text><line x1="62" y1="228" x2="62" y2="687" stroke="#c9d6d4" stroke-width="4"/><rect x="108" y="208" width="762" height="73" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="121" y="235.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">First draft</text><text x="121" y="263.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The whole shape, including the ending, without polishing</text><circle cx="62" cy="244.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="253.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="108" y="289" width="762" height="73" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="121" y="316.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Structure pass</text><text x="121" y="344.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Does each paragraph earn its place? Cut or merge any that repeat.</text><circle cx="62" cy="325.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="334.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="108" y="370" width="762" height="73" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="121" y="397.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Voice pass</text><text x="121" y="425.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Read aloud; mark any sentence where the voice slips.</text><circle cx="62" cy="406.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="415.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="108" y="451" width="762" height="94" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="121" y="478.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Vocabulary pass</text><text x="121" y="506.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Replace “nice”, “scary”, “very”; cut adjectives a stronger noun or verb makes</text><text x="121" y="527.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">unnecessary.</text><circle cx="62" cy="498" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="506.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="108" y="553" width="762" height="73" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="121" y="580.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Sentence pass</text><text x="121" y="608.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Variety, and short sentences placed at moments of emphasis</text><circle cx="62" cy="589.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="598.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><rect x="108" y="634" width="762" height="73" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="121" y="661.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Accuracy pass</text><text x="121" y="689.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Spelling, punctuation (especially dialogue), paragraphing, tense</text><circle cx="62" cy="670.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="679.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">6</text>
</svg>