<rect width="900" height="745" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Recurring topics, competing discourses</text>

<text x="140" y="130" font-size="16" font-weight="700" fill="#4a5568" text-anchor="middle">Topic</text><text x="415" y="130" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">One discourse</text><text x="705" y="130" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">A competing discourse</text><rect x="40" y="145" width="200" height="68" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="140" y="175" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Accents and</text><text x="140" y="195" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">dialects</text><rect x="258" y="145" width="314" height="68" rx="10" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2"/><text x="274" y="173" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">barrier to success</text><text x="274" y="198" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">"holding back", "proper"</text><rect x="590" y="145" width="270" height="68" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="606" y="173" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">identity and pride</text><text x="606" y="198" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">"heritage", "roots"</text><text x="581" y="186" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">↔</text><rect x="40" y="225" width="200" height="68" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="140" y="255" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Young people's</text><text x="140" y="275" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">language</text><rect x="258" y="225" width="314" height="68" rx="10" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2"/><text x="274" y="253" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">decline</text><text x="274" y="278" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">"lazy", "grunt"</text><rect x="590" y="225" width="270" height="68" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="606" y="253" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">creativity and innovation</text><text x="606" y="278" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">"inventive", "playful"</text><text x="581" y="266" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">↔</text><rect x="40" y="305" width="200" height="68" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="140" y="345" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Technology</text><rect x="258" y="305" width="314" height="68" rx="10" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2"/><text x="274" y="333" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">corruption</text><text x="274" y="358" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">"destroying"</text><rect x="590" y="305" width="270" height="68" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="606" y="333" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">natural adaptation</text><text x="606" y="358" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">"evolving", "adapting"</text><text x="581" y="346" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">↔</text><rect x="40" y="385" width="200" height="68" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="140" y="425" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Americanisms</text><rect x="258" y="385" width="314" height="68" rx="10" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2"/><text x="274" y="413" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">invasion</text><text x="274" y="438" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">"creeping", "infiltrating"</text><rect x="590" y="385" width="270" height="68" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="606" y="413" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">global exchange</text><text x="606" y="438" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">"borrowing", "shared"</text><text x="581" y="426" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">↔</text><rect x="40" y="465" width="200" height="68" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="140" y="505" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Inclusive language</text><rect x="258" y="465" width="314" height="68" rx="10" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2"/><text x="274" y="493" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">political correctness gone mad</text><text x="274" y="518" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">"banned", "woke"</text><rect x="590" y="465" width="270" height="68" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="606" y="493" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">respect and accuracy</text><text x="606" y="518" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">"respectful", "inclusive"</text><text x="581" y="506" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">↔</text><rect x="40" y="545" width="200" height="68" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="140" y="575" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Grammar, spelling,</text><text x="140" y="595" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">punctuation</text><rect x="258" y="545" width="314" height="68" rx="10" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2"/><text x="274" y="573" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">standards and correctness</text><text x="274" y="598" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">"errors", "basic rules"</text><rect x="590" y="545" width="270" height="68" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="606" y="573" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">rules as social convention</text><text x="606" y="598" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">"convention", "context"</text><text x="581" y="586" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">↔</text><rect x="40" y="625" width="200" height="68" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="140" y="655" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Endangered</text><text x="140" y="675" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">dialects</text><rect x="258" y="625" width="314" height="68" rx="10" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2"/><text x="274" y="653" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">loss and nostalgia</text><text x="274" y="678" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">"dying", "vanishing"</text><rect x="590" y="625" width="270" height="68" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="606" y="653" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">natural change</text><text x="606" y="678" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">"shift", "new varieties"</text><text x="581" y="666" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">↔</text><text x="450" y="720" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Accents also meet a third discourse: prejudice as discrimination ("unfair", "judged").</text>
</svg>