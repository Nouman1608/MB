<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 610" width="900" height="610" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="610" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What a discourse is</text>

<rect x="260" y="115" width="380" height="90" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="3"/><text x="450" y="148" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">A shared storyline</text><text x="450" y="180" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle" font-style="italic">"Young people are ruining English"</text><path d="M450,205 L150,262" fill="none" stroke="#8a6d0d" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahO)"/><rect x="70" y="268" width="160" height="64" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="150" y="307" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">text 1</text><path d="M450,205 L350,262" fill="none" stroke="#8a6d0d" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahO)"/><rect x="270" y="268" width="160" height="64" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="350" y="307" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">text 2</text><path d="M450,205 L550,262" fill="none" stroke="#8a6d0d" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahO)"/><rect x="470" y="268" width="160" height="64" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="550" y="307" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">text 3</text><path d="M450,205 L750,262" fill="none" stroke="#8a6d0d" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahO)"/><rect x="670" y="268" width="160" height="64" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="750" y="307" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">text 4</text><text x="450" y="368" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">Many texts repeat it, with typical</text><rect x="170" y="385" width="160" height="46" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="250" y="415" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">vocabulary</text><rect x="370" y="385" width="160" height="46" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="450" y="415" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">metaphors</text><rect x="570" y="385" width="160" height="46" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="650" y="415" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">villains</text><rect x="40" y="455" width="400" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="64" y="490" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Recognising it lets you</text><text x="64" y="520" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">• explain why a text sounds as it does</text><text x="64" y="542" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">• connect two texts that never</text><text x="78" y="564" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">mention each other</text><rect x="460" y="455" width="400" height="130" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="484" y="490" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Verbal hygiene (Deborah Cameron)</text><text x="484" y="520" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the urge to regulate and "clean up"</text><text x="484" y="542" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">language, often about social values:</text><text x="484" y="564" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">order, discipline, respectability</text>
</svg>