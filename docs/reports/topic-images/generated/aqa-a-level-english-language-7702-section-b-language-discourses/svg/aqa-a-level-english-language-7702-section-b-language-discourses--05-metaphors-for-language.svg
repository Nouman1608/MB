<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="900" height="550" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="550" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Representing language through metaphor</text>

<text x="450" y="125" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">What kind of thing does the text make language into?</text><rect x="40" y="145" width="260" height="110" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="170" y="175" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Language as</text><text x="170" y="207" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">a building</text><text x="170" y="235" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">that crumbles</text><rect x="320" y="145" width="260" height="110" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="175" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Language as</text><text x="450" y="207" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">a body</text><text x="450" y="235" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">that sickens</text><rect x="600" y="145" width="260" height="110" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="730" y="175" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Language as</text><text x="730" y="207" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">a territory</text><text x="730" y="235" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">that is invaded</text><rect x="40" y="275" width="260" height="110" rx="12" fill="#efdfa8" stroke="#1e2a44" stroke-width="2.5"/><text x="170" y="305" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Language as</text><text x="170" y="337" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">a garden</text><text x="170" y="365" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">that needs weeding</text><rect x="320" y="275" width="260" height="110" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="305" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Language as</text><text x="450" y="337" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">a living organism</text><text x="450" y="365" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">that grows</text><rect x="600" y="275" width="260" height="110" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="730" y="305" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Language as</text><text x="730" y="337" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">a toolkit</text><text x="730" y="365" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">that adapts</text><rect x="40" y="415" width="820" height="110" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="64" y="450" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Also notice whose language is represented, and how</text><rect x="64" y="465" width="370" height="44" rx="9" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2"/><text x="249" y="493" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">quoted "errors" held up for ridicule</text><text x="450" y="493" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">or</text><rect x="466" y="465" width="370" height="44" rx="9" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="651" y="493" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">examples presented neutrally as data</text>
</svg>