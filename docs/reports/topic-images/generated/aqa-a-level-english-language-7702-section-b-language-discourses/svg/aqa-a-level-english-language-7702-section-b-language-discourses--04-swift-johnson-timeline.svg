<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 505" width="900" height="505" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="505" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worries about decline are not new</text>

<line x1="80" y1="325" x2="840" y2="325" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><circle cx="170" cy="325" r="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="170" y="368" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">1712</text><rect x="35" y="115" width="270" height="185" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="170" y="147" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Jonathan Swift</text><text x="170" y="175" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Proposal for Correcting,</text><text x="170" y="194" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Improving and Ascertaining</text><text x="170" y="213" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">the English Tongue</text><text x="170" y="252" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">argued for fixing</text><text x="170" y="273" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">the language</text><circle cx="450" cy="325" r="12" fill="#2e6b62" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="368" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">1755</text><rect x="315" y="115" width="270" height="185" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="147" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Samuel Johnson</text><text x="450" y="175" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">preface to his dictionary</text><text x="450" y="252" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">a living language cannot</text><text x="450" y="273" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">be fixed entirely</text><circle cx="730" cy="325" r="12" fill="#b5602e" stroke="#1e2a44" stroke-width="2.5"/><text x="730" y="368" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Today</text><rect x="595" y="115" width="270" height="185" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="730" y="147" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">A modern text</text><text x="730" y="175" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">presents decline as new</text><text x="730" y="252" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">concerns about decline</text><text x="730" y="273" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">are centuries old</text><rect x="40" y="400" width="820" height="80" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="450" y="433" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">When a modern text treats decline as new, point out that the</text><text x="450" y="459" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">concern has been voiced since at least the eighteenth century.</text>
</svg>