<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 670" width="900" height="670" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="670" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Who is speaking, and who is the reader made to be?</text>

<rect x="40" y="115" width="400" height="420" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="240" y="152" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Producer personas</text><rect x="70" y="172" width="340" height="40" rx="9" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="240" y="198" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">the guardian of standards</text><rect x="70" y="222" width="340" height="40" rx="9" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="240" y="248" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">the concerned parent</text><rect x="70" y="272" width="340" height="40" rx="9" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="240" y="298" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">the expert</text><rect x="70" y="322" width="340" height="40" rx="9" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="240" y="348" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">the insider for a community</text><rect x="70" y="372" width="340" height="40" rx="9" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="240" y="398" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">the ordinary person</text><rect x="70" y="422" width="340" height="40" rx="9" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="240" y="448" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">the comic observer</text><text x="240" y="494" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">clues: pronouns, credentials,</text><text x="240" y="515" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">anecdote, register, humour</text><rect x="460" y="115" width="400" height="420" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="660" y="152" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Roles for the reader</text><rect x="490" y="175" width="160" height="62" rx="10" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="570" y="213" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">fellow sufferer</text><rect x="665" y="175" width="160" height="62" rx="10" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="745" y="213" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">pupil</text><rect x="490" y="255" width="160" height="62" rx="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="570" y="293" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">ally</text><rect x="665" y="255" width="160" height="62" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="745" y="293" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">opponent</text><text x="484" y="365" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">built through</text><text x="484" y="393" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">inclusive "we" and "our"; direct address;</text><text x="484" y="415" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">presupposition; "everyone knows";</text><text x="484" y="437" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">rhetorical questions; irony; an out-group</text><text x="484" y="459" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">("these so-called experts", "snobs")</text><rect x="40" y="555" width="820" height="90" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="64" y="590" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">A persona can be inconsistent, and that is analysable:</text><text x="64" y="620" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">a writer attacking informality while writing informally; an expert using emotive language.</text>
</svg>