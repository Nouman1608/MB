<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 661" width="900" height="661" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="661" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Two texts on accents, compared</text>

<rect x="250" y="112" width="295" height="52" rx="10" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="397" y="136" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Text 1</text><text x="397" y="156" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">opinion column</text><rect x="565" y="112" width="295" height="52" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="712" y="136" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Text 2</text><text x="712" y="156" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">personal blog</text><circle cx="64" cy="220" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="64" y="226.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="92" y="216" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Represents</text><text x="92" y="236" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">accent</text><rect x="250" y="178" width="295" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="266" y="215.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">a "handicap": a deficit in</text><text x="266" y="236.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the speaker</text><rect x="565" y="178" width="295" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="581" y="215.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the problem is "how some</text><text x="581" y="236.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">people listen"</text><circle cx="64" cy="316" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="64" y="322.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="92" y="312" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Producer</text><text x="92" y="332" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">identity</text><rect x="250" y="274" width="295" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="266" y="322" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">speaks for employers</text><rect x="565" y="274" width="295" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="581" y="311.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the person judged: anecdote,</text><text x="581" y="332.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">"two degrees", "my nan"</text><circle cx="64" cy="412" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="64" y="418.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="92" y="408" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Positions</text><text x="92" y="428" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">reader</text><rect x="250" y="370" width="295" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="266" y="407.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">"Let's be honest"</text><text x="266" y="428.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">presupposes an avoided truth</text><rect x="565" y="370" width="295" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="581" y="407.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">invites sympathy rather than</text><text x="581" y="428.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">correction</text><circle cx="64" cy="508" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="64" y="514.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="92" y="514" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Discourse</text><rect x="250" y="466" width="295" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="266" y="503.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">correctness: "Teach them to</text><text x="266" y="524.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">speak properly"</text><rect x="565" y="466" width="295" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="581" y="503.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">accent prejudice as</text><text x="581" y="524.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">discrimination</text><rect x="40" y="566" width="820" height="70" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="596" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Shared ground: both represent accent as consequential at work,</text><text x="450" y="620" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">but locate the problem in different places.</text>
</svg>