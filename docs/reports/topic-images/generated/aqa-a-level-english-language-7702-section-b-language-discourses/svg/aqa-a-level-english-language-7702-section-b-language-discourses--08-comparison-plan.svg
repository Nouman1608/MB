<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 675" width="900" height="675" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="675" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Planning the comparison</text>

<rect x="40" y="115" width="820" height="62" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="146" r="18" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="76" y="152.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="110" y="153" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Represent</text><text x="240" y="153" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">How does each text represent the language or speakers?</text><rect x="40" y="189" width="820" height="62" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="220" r="18" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="76" y="226.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="110" y="227" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Identity</text><text x="240" y="227" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">What identity does each producer construct, and with what evidence?</text><rect x="40" y="263" width="820" height="62" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="294" r="18" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="76" y="300.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="110" y="301" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Position</text><text x="240" y="301" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">How is each reader positioned, and into what role?</text><rect x="40" y="337" width="820" height="62" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="368" r="18" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="76" y="374.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="110" y="375" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Discourse</text><text x="240" y="375" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Which discourse does each reproduce, challenge or mix?</text><rect x="40" y="411" width="820" height="62" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><circle cx="76" cy="442" r="18" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="76" y="448.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="110" y="449" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Context</text><text x="240" y="449" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">How do genre, date and audience explain the differences?</text><text x="450" y="520" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Points 1 to 4 are the four questions; point 5 adds context.</text><rect x="40" y="540" width="820" height="110" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="64" y="575" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Often the most revealing comparison</text><text x="64" y="605" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">the same device used to opposite ends: both use anecdote,</text><text x="64" y="630" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">one to ridicule and one to win sympathy.</text>
</svg>