<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 735" width="900" height="735" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="735" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Six categories of supply chain risk</text>

<rect x="30" y="110" width="270" height="275" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="30" y="110" width="270" height="50" rx="14" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2.5"/><text x="165" y="143" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Environmental</text><text x="48" y="190" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">Examples</text><text x="48" y="214" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Pollution from a supplier’s</text><text x="48" y="235" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">factory; deforestation</text><text x="48" y="310" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">Possible effect</text><text x="48" y="334" font-size="16" font-weight="400" fill="#b5602e" text-anchor="start">Fines, stricter rules,</text><text x="48" y="355" font-size="16" font-weight="400" fill="#b5602e" text-anchor="start">boycotts</text><rect x="315" y="110" width="270" height="275" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="315" y="110" width="270" height="50" rx="14" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="143" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Natural disasters</text><text x="333" y="190" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">Examples</text><text x="333" y="214" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Earthquakes, floods,</text><text x="333" y="235" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">storms, drought</text><text x="333" y="310" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">Possible effect</text><text x="333" y="334" font-size="16" font-weight="400" fill="#b5602e" text-anchor="start">Factories or ports closed;</text><text x="333" y="355" font-size="16" font-weight="400" fill="#b5602e" text-anchor="start">shortages</text><rect x="600" y="110" width="270" height="275" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="600" y="110" width="270" height="50" rx="14" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2.5"/><text x="735" y="143" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Financial</text><text x="618" y="190" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">Examples</text><text x="618" y="214" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Supplier goes out of</text><text x="618" y="235" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">business; exchange rates;</text><text x="618" y="256" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">transport costs</text><text x="618" y="310" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">Possible effect</text><text x="618" y="334" font-size="16" font-weight="400" fill="#b5602e" text-anchor="start">Supplies stop; costs rise</text><rect x="30" y="400" width="270" height="275" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="30" y="400" width="270" height="50" rx="14" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2.5"/><text x="165" y="433" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Ethical</text><text x="48" y="480" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">Examples</text><text x="48" y="504" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Child labour, unsafe</text><text x="48" y="525" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">factories, very low pay</text><text x="48" y="600" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">Possible effect</text><text x="48" y="624" font-size="16" font-weight="400" fill="#b5602e" text-anchor="start">Reputation damage, legal</text><text x="48" y="645" font-size="16" font-weight="400" fill="#b5602e" text-anchor="start">action</text><rect x="315" y="400" width="270" height="275" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="315" y="400" width="270" height="50" rx="14" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="433" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Technological</text><text x="333" y="480" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">Examples</text><text x="333" y="504" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Cyber attacks; system</text><text x="333" y="525" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">failure; outdated component</text><text x="333" y="600" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">Possible effect</text><text x="333" y="624" font-size="16" font-weight="400" fill="#b5602e" text-anchor="start">Orders lost, production</text><text x="333" y="645" font-size="16" font-weight="400" fill="#b5602e" text-anchor="start">halted</text><rect x="600" y="400" width="270" height="275" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="600" y="400" width="270" height="50" rx="14" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2.5"/><text x="735" y="433" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Political</text><text x="618" y="480" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">Examples</text><text x="618" y="504" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">War, unrest, tariffs,</text><text x="618" y="525" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">quotas, embargoes, new laws</text><text x="618" y="600" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">Possible effect</text><text x="618" y="624" font-size="16" font-weight="400" fill="#b5602e" text-anchor="start">Routes closed, supplier</text><text x="618" y="645" font-size="16" font-weight="400" fill="#b5602e" text-anchor="start">country cut off</text><text x="450" y="712" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Name the category and give an example that fits the scenario.</text>
</svg>