 x="194" y="130" width="74" height="74" fill="#f2e7b8" stroke="#ffffff" stroke-width="3"/><rect x="268" y="130" width="74" height="74" fill="#e6b79a" stroke="#ffffff" stroke-width="3"/><rect x="342" y="130" width="74" height="74" fill="#e6b79a" stroke="#ffffff" stroke-width="3"/><rect x="416" y="130" width="74" height="74" fill="#e6b79a" stroke="#ffffff" stroke-width="3"/><rect x="120" y="130" width="370" height="370" fill="none" stroke="#1e2a44" stroke-width="2.5"/><text x="157" y="526" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">1</text><text x="104" y="469" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">1</text><text x="231" y="526" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">2</text><text x="104" y="395" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">2</text><text x="305" y="526" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">3</text><text x="104" y="321" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">3</text><text x="379" y="526" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">4</text><text x="104" y="247" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">4</text><text x="453" y="526" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">5</text><text x="104" y="173" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">5</text><text x="305" y="558" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Impact (1 low to 5 high)</text><text x="70" y="315" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle" transform="rotate(-90 70 315)">Likelihood (1 low to 5 high)</text><circle cx="453" cy="315" r="20" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="453" y="322.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">A</text><circle cx="453" cy="389" r="20" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="453" y="396.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">B</text><circle cx="379" cy="389" r="20" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="379" y="396.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">C</text><circle cx="231" cy="241" r="20" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="231" y="248.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">D</text><rect x="535" y="120" width="335" height="94" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="565" cy="150" r="17" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="565" y="156.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">A</text><text x="592" y="156" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Flood closes the factory</text><text x="555" y="184" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">3 × 5 = 15</text><text x="660" y="184" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Second supplier; safety</text><text x="660" y="204" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">stock</text><rect x="535" y="224" width="335" height="94" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="565" cy="254" r="17" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="565" y="260.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">B</text><text x="592" y="260" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Child labour at factory</text><text x="555" y="288" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">2 × 5 = 10</text><text x="660" y="288" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Audit; code of conduct</text><rect x="535" y="328" width="335" height="94" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="565" cy="358" r="17" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="565" y="364.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">C</text><text x="592" y="364" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Ordering system hacked</text><text x="555" y="392" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">2 × 4 = 8</text><text x="660" y="392" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Security; training;</text><text x="660" y="412" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">backups</text><rect x="535" y="432" width="335" height="94" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="565" cy="462" r="17" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="565" y="468.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">D</text><text x="592" y="468" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Currency raises cost</text><text x="555" y="496" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">4 × 2 = 8</text><text x="660" y="496" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Agree prices; review</text><text x="660" y="516" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">pricing</text><rect x="30" y="580" width="840" height="80" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="615" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">Score = likelihood × impact. The flood scores highest (15),</text><text x="450" y="642" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">so the first priority is reducing dependence on one supplier.</text>
