<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 755" width="900" height="755" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="755" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Upstream, the enterprise and downstream</text>

<rect x="30" y="110" width="250" height="500" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="42" y="125" width="226" height="48" rx="14" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="155" y="156" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Upstream</text><text x="155" y="200" font-size="16" font-weight="700" fill="#4a5568" text-anchor="middle">Flows into the business</text><text x="50" y="230" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Suppliers of raw</text><text x="50" y="251" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">materials and components;</text><text x="50" y="272" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">transport bringing them</text><text x="50" y="293" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">in</text><line x1="50" y1="330" x2="260" y2="330" stroke="#c9d6d4" stroke-width="2"/><text x="50" y="360" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="start">Chocolate maker:</text><circle cx="52" cy="386.4" r="5" fill="#8a6d0d"/><text x="76" y="392" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Cocoa farmers in</text><text x="76" y="413" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Country B</text><circle cx="52" cy="438.4" r="5" fill="#8a6d0d"/><text x="76" y="444" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Sugar producer in</text><text x="76" y="465" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Country C</text><circle cx="52" cy="490.4" r="5" fill="#8a6d0d"/><text x="76" y="496" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Shipping of beans and</text><text x="76" y="517" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">sugar</text><circle cx="52" cy="542.4" r="5" fill="#8a6d0d"/><text x="76" y="548" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Port storage</text><line x1="283" y1="149" x2="320" y2="149" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="325" y="110" width="250" height="500" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="337" y="125" width="226" height="48" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="156" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">The enterprise</text><text x="450" y="200" font-size="16" font-weight="700" fill="#4a5568" text-anchor="middle">The business’s own activities</text><text x="345" y="230" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Making, assembling or</text><text x="345" y="251" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">processing; managing its</text><text x="345" y="272" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">stock</text><line x1="345" y1="330" x2="555" y2="330" stroke="#c9d6d4" stroke-width="2"/><text x="345" y="360" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="start">Chocolate maker:</text><circle cx="347" cy="386.4" r="5" fill="#8a6d0d"/><text x="371" y="392" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Roasting, grinding,</text><text x="371" y="413" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">moulding</text><circle cx="347" cy="438.4" r="5" fill="#8a6d0d"/><text x="371" y="444" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Packaging</text><circle cx="347" cy="469.4" r="5" fill="#8a6d0d"/><text x="371" y="475" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Storing finished bars</text><line x1="578" y1="149" x2="615" y2="149" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="620" y="110" width="250" height="500" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="632" y="125" width="226" height="48" rx="14" fill="#e6b79a" stroke="#1e2a44" stroke-width="2.5"/><text x="745" y="156" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Downstream</text><text x="745" y="200" font-size="16" font-weight="700" fill="#4a5568" text-anchor="middle">Flows out to the consumer</text><text x="640" y="230" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Warehousing, transport,</text><text x="640" y="251" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">wholesalers, retailers,</text><text x="640" y="272" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">delivery</text><line x1="640" y1="330" x2="850" y2="330" stroke="#c9d6d4" stroke-width="2"/><text x="640" y="360" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="start">Chocolate maker:</text><circle cx="642" cy="386.4" r="5" fill="#8a6d0d"/><text x="666" y="392" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Freight forwarders and</text><text x="666" y="413" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">transport to export</text><text x="666" y="434" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">markets</text><circle cx="642" cy="459.4" r="5" fill="#8a6d0d"/><text x="666" y="465" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Wholesalers</text><circle cx="642" cy="490.4" r="5" fill="#8a6d0d"/><text x="666" y="496" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Supermarkets</text><circle cx="642" cy="521.4" r="5" fill="#8a6d0d"/><text x="666" y="527" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Consumers</text><rect x="30" y="630" width="840" height="100" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="54" y="662" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="start">Managing the chain = coordinating all three</text><text x="54" y="692" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Order enough beans before a poor harvest; keep the factory supplied without excess stock; get</text><text x="54" y="713" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">bars to shops before festive seasons.</text>
</svg>