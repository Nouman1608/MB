<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 530" width="900" height="530" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="530" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What risk assessment does</text>

<rect x="30" y="110" width="250" height="120" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><circle cx="64" cy="145" r="18" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="64" y="151.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="94" y="152" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Identify</text><text x="50" y="188" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">what could go wrong</text><line x1="284" y1="170" x2="320" y2="170" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="325" y="110" width="250" height="120" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><circle cx="359" cy="145" r="18" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="359" y="151.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="389" y="152" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Judge</text><text x="345" y="188" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">how likely, and how</text><text x="345" y="209" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">serious the impact</text><line x1="579" y1="170" x2="615" y2="170" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="620" y="110" width="250" height="120" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><circle cx="654" cy="145" r="18" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="654" y="151.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="684" y="152" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Plan</text><text x="640" y="188" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">how to reduce each risk</text><text x="450" y="280" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Why it matters</text><rect x="30" y="300" width="270" height="95" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="58" cy="347" r="13" fill="#2e6b62"/><path d="M52.15,347.26 L56.7,351.94 L64.5,342.45" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="82" y="342" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Act before a problem,</text><text x="82" y="363" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">not after supplies stop</text><rect x="315" y="300" width="270" height="95" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="343" cy="347" r="13" fill="#2e6b62"/><path d="M337.15,347.26 L341.7,351.94 L349.5,342.45" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="367" y="342" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Spend money on the most</text><text x="367" y="363" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">serious risks</text><rect x="600" y="300" width="270" height="95" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="628" cy="347" r="13" fill="#2e6b62"/><path d="M622.15,347.26 L626.7,351.94 L634.5,342.45" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="652" y="342" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Protect reputation by</text><text x="652" y="363" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">checking suppliers</text><rect x="172" y="410" width="270" height="95" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="200" cy="457" r="13" fill="#2e6b62"/><path d="M194.15,457.26 L198.7,461.94 L206.5,452.45" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="224" y="452" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Keep customers supplied:</text><text x="224" y="473" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">sales and profit</text><rect x="457" y="410" width="270" height="95" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="485" cy="457" r="13" fill="#2e6b62"/><path d="M479.15,457.26 L483.7,461.94 L491.5,452.45" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="509" y="452" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Lenders, insurers and</text><text x="509" y="473" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">large customers may</text><text x="509" y="494" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">expect it</text>
</svg>