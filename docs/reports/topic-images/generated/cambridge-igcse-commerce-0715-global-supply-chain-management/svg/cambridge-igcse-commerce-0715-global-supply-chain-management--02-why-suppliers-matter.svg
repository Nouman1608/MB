<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 715" width="900" height="715" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="715" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why suppliers matter</text>

<rect x="30" y="110" width="560" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="142" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Quality</text><text x="50" y="168" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The product can be no better than its materials</text><path d="M592,154 C620,154 615,350 640,350" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="30" y="208" width="560" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="240" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Reliability</text><text x="50" y="266" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Late deliveries stop production and empty shelves</text><path d="M592,252 C620,252 615,350 640,350" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="30" y="306" width="560" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="338" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Cost</text><text x="50" y="364" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Purchase prices are a large part of production cost</text><path d="M592,350 C620,350 615,350 640,350" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="30" y="404" width="560" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="436" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Innovation</text><text x="50" y="462" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">New materials or components can improve the product</text><path d="M592,448 C620,448 615,350 640,350" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="30" y="502" width="560" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="534" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Ethics and reputation</text><text x="50" y="560" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Customers blame the brand for a supplier’s pollution or poor</text><text x="50" y="581" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">treatment of workers</text><path d="M592,546 C620,546 615,350 640,350" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="650" y="280" width="220" height="140" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="760" y="344" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">The business</text><text x="760" y="370" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">and its brand</text><rect x="30" y="612" width="840" height="80" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="659" font-size="18" font-weight="600" fill="#2e6b62" text-anchor="middle">So: long-term relationships, shared sales forecasts and factory checks</text>
</svg>