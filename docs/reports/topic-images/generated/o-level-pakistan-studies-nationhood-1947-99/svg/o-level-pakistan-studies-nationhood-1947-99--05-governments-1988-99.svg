<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 780" width="900" height="780" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="780" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four governments, four early endings, 1988–99</text>

<rect x="30" y="110" width="600" height="124" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="30" y="110" width="12" height="124" rx="6" fill="#b5602e"/><text x="60" y="146" font-size="21" font-weight="700" fill="#b5602e" text-anchor="start">Benazir Bhutto</text><text x="600" y="146" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="end">1988–90</text><text x="60" y="178" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">First woman PM of a Muslim-majority country; conflict with Nawaz</text><text x="60" y="200" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Sharif in Punjab; dispute with the president</text><line x1="634" y1="172" x2="662" y2="172" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="668" y="127" width="202" height="90" rx="12" fill="#f6e4d8" stroke="#b5602e" stroke-width="2.5" /><text x="769" y="178" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Dismissed 1990</text><rect x="30" y="250" width="600" height="124" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="30" y="250" width="12" height="124" rx="6" fill="#2b5a9a"/><text x="60" y="286" font-size="21" font-weight="700" fill="#2b5a9a" text-anchor="start">Nawaz Sharif</text><text x="600" y="286" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="end">1990–93</text><text x="60" y="318" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Privatisation; BCCI collapse; loss of US aid over the nuclear</text><text x="60" y="340" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">programme</text><line x1="634" y1="312" x2="662" y2="312" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="668" y="267" width="202" height="90" rx="12" fill="#f6e4d8" stroke="#b5602e" stroke-width="2.5" /><text x="769" y="298" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Dismissed 1993,</text><text x="769" y="318" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">restored, then</text><text x="769" y="338" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">resigned</text><rect x="30" y="390" width="600" height="124" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="30" y="390" width="12" height="124" rx="6" fill="#b5602e"/><text x="60" y="426" font-size="21" font-weight="700" fill="#b5602e" text-anchor="start">Benazir Bhutto</text><text x="600" y="426" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="end">1993–96</text><text x="60" y="458" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Kashmir tensions; rupee devaluation, IMF pressure</text><line x1="634" y1="452" x2="662" y2="452" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="668" y="407" width="202" height="90" rx="12" fill="#f6e4d8" stroke="#b5602e" stroke-width="2.5" /><text x="769" y="448" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Dismissed by President</text><text x="769" y="468" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Leghari, 1996</text><rect x="30" y="530" width="600" height="124" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="30" y="530" width="12" height="124" rx="6" fill="#2b5a9a"/><text x="60" y="566" font-size="21" font-weight="700" fill="#2b5a9a" text-anchor="start">Nawaz Sharif</text><text x="600" y="566" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="end">1997–99</text><text x="60" y="598" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Thirteenth Amendment (1997); nuclear tests 1998; Lahore</text><text x="60" y="620" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Declaration; Kargil</text><line x1="634" y1="592" x2="662" y2="592" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="668" y="547" width="202" height="90" rx="12" fill="#f6e4d8" stroke="#b5602e" stroke-width="2.5" /><text x="769" y="588" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Removed by Musharraf,</text><text x="769" y="608" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Oct 1999</text><text x="769" y="100" font-size="16" font-weight="700" fill="#4a5568" text-anchor="middle">HOW IT ENDED</text><rect x="30" y="676" width="840" height="84" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="710" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">No government in this period completed its term.</text><text x="450" y="738" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">In 1997 the Thirteenth Amendment removed the president’s power to dismiss.</text>
</svg>