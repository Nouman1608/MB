<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Pakistan’s alignments, 1947–99</text>

<line x1="246.22641509433961" y1="140" x2="246.22641509433961" y2="550" stroke="#c9d6d4" stroke-width="1.5"/><text x="246.22641509433961" y="132" font-size="16" font-weight="700" fill="#4a5568" text-anchor="middle">1950</text><line x1="366.9811320754717" y1="140" x2="366.9811320754717" y2="550" stroke="#c9d6d4" stroke-width="1.5"/><text x="366.9811320754717" y="132" font-size="16" font-weight="700" fill="#4a5568" text-anchor="middle">1960</text><line x1="487.7358490566038" y1="140" x2="487.7358490566038" y2="550" stroke="#c9d6d4" stroke-width="1.5"/><text x="487.7358490566038" y="132" font-size="16" font-weight="700" fill="#4a5568" text-anchor="middle">1970</text><line x1="608.4905660377358" y1="140" x2="608.4905660377358" y2="550" stroke="#c9d6d4" stroke-width="1.5"/><text x="608.4905660377358" y="132" font-size="16" font-weight="700" fill="#4a5568" text-anchor="middle">1980</text><line x1="729.2452830188679" y1="140" x2="729.2452830188679" y2="550" stroke="#c9d6d4" stroke-width="1.5"/><text x="729.2452830188679" y="132" font-size="16" font-weight="700" fill="#4a5568" text-anchor="middle">1990</text><line x1="850" y1="140" x2="850" y2="550" stroke="#c9d6d4" stroke-width="1.5"/><text x="850" y="132" font-size="16" font-weight="700" fill="#4a5568" text-anchor="middle">2000</text><rect x="30" y="150" width="840" height="80" fill="#ffffff" opacity="0.7"/><text x="40" y="190" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">SEATO</text><text x="40" y="270" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">CENTO</text><rect x="30" y="310" width="840" height="80" fill="#ffffff" opacity="0.7"/><text x="40" y="350" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Non-Aligned</text><text x="40" y="430" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Commonwealth</text><rect x="30" y="470" width="840" height="80" fill="#ffffff" opacity="0.7"/><text x="40" y="510" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Nuclear</text><rect x="294.52830188679246" y="168" width="217.35849056603774" height="30" rx="6" fill="#2b5a9a" stroke="#1e2a44" stroke-width="2" /><text x="403.20754716981133" y="189" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">1954–72</text><rect x="306.60377358490564" y="248" width="289.81132075471703" height="30" rx="6" fill="#2b5a9a" stroke="#1e2a44" stroke-width="2" /><text x="451.50943396226415" y="269" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">1955–79</text><rect x="596.4150943396227" y="328" width="253.58490566037733" height="30" rx="6" fill="#2e6b62" stroke="#1e2a44" stroke-width="2" /><text x="723.2075471698113" y="349" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">joined 1979</text><circle cx="511.8867924528302" cy="423" r="8" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><text x="511.8867924528302" y="454" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">left 1972</text><circle cx="717.1698113207547" cy="423" r="8" fill="#2e6b62" stroke="#1e2a44" stroke-width="2"/><text x="717.1698113207547" y="454" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">rejoined 1989</text><circle cx="511.8867924528302" cy="503" r="8" fill="#1e2a44" stroke="#1e2a44" stroke-width="2"/><text x="511.8867924528302" y="484" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">programme 1972</text><circle cx="536.0377358490566" cy="503" r="8" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><text x="536.0377358490566" y="534" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">India tests 1974</text><circle cx="825.8490566037735" cy="503" r="8" fill="#1e2a44" stroke="#1e2a44" stroke-width="2"/><text x="837.8490566037735" y="484" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="end">Pakistan tests 1998</text><rect x="30" y="574" width="410" height="110" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="46" y="602" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Why leave SEATO and CENTO?</text><text x="46" y="628" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Western allies had not supported Pakistan in</text><text x="46" y="650.1" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">its wars with India, especially in 1971.</text><rect x="460" y="574" width="410" height="110" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="476" y="602" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Why leave the Commonwealth?</text><text x="476" y="628" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Over recognition of Bangladesh in 1972.</text>
</svg>