e-width="1.5" /><rect x="772.0754716981132" y="464" width="33.39622641509436" height="28" rx="5" fill="#b5602e" stroke="#1e2a44" stroke-width="1.5" /><text x="40" y="528" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Nawaz Sharif</text><text x="40" y="548" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">1990–93, 1997–99</text><rect x="738.6792452830189" y="516" width="33.39622641509436" height="28" rx="5" fill="#2b5a9a" stroke="#1e2a44" stroke-width="1.5" /><rect x="816.6037735849056" y="516" width="31.169811320754206" height="28" rx="5" fill="#2b5a9a" stroke="#1e2a44" stroke-width="1.5" /><rect x="30" y="556" width="840" height="52" fill="#ffffff" opacity="0.7"/><text x="40" y="580" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Musharraf</text><text x="40" y="600" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">takeover Oct 1999</text><rect x="847.7735849056598" y="568" width="6" height="28" rx="5" fill="#1e2a44" stroke="#1e2a44" stroke-width="1.5" /><text x="40" y="648" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Constitutions</text><path d="M360.188679245283,630 l12,12 l-12,12 l-12,-12 z" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="360.188679245283" y="678" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">1956</text><path d="M426.9811320754717,630 l12,12 l-12,12 l-12,-12 z" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="426.9811320754717" y="678" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">1962</text><path d="M549.433962264151,630 l12,12 l-12,12 l-12,-12 z" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="549.433962264151" y="678" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">1973</text>
