<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 920" width="900" height="920" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="920" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The new state’s problems, 1947–48</text>

<text x="155" y="128" font-size="16" font-weight="700" fill="#4a5568" text-anchor="middle">PROBLEM</text><text x="620" y="128" font-size="16" font-weight="700" fill="#4a5568" text-anchor="middle">OUTCOME</text><rect x="30" y="140" width="470" height="78" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="50" y="170" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Boundaries</text><text x="50" y="196" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Radcliffe Award gave most of Gurdaspur to India</text><line x1="504" y1="179" x2="536" y2="179" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="542" y="140" width="328" height="78" rx="12" fill="#f6e4d8" stroke="#b5602e" stroke-width="2.5" /><text x="562" y="184" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">Lasting grievance</text><rect x="30" y="228" width="470" height="78" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="50" y="258" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Water</text><text x="50" y="284" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Supply to Pakistani canals cut in 1948</text><line x1="504" y1="267" x2="536" y2="267" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="542" y="228" width="328" height="78" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="562" y="260" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">Solved later: Indus Waters Treaty,</text><text x="562" y="282" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">1960</text><rect x="30" y="316" width="470" height="78" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="50" y="346" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Assets</text><text x="50" y="372" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Share of cash and military stores delayed and reduced</text><line x1="504" y1="355" x2="536" y2="355" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="542" y="316" width="328" height="78" rx="12" fill="#f6e4d8" stroke="#b5602e" stroke-width="2.5" /><text x="562" y="360" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">Weak start for treasury and army</text><rect x="30" y="404" width="470" height="78" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="50" y="434" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Princely states</text><text x="50" y="460" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Junagadh, Hyderabad and the Kashmir war, 1947–48</text><line x1="504" y1="443" x2="536" y2="443" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="542" y="404" width="328" height="78" rx="12" fill="#f6e4d8" stroke="#b5602e" stroke-width="2.5" /><text x="562" y="436" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">UN ceasefire 1949; Kashmir</text><text x="562" y="458" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">unresolved</text><rect x="30" y="492" width="470" height="78" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="50" y="522" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Refugees</text><text x="50" y="548" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Millions arrived amid violence</text><line x1="504" y1="531" x2="536" y2="531" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="542" y="492" width="328" height="78" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="562" y="524" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">Huge relief effort; strain on</text><text x="562" y="546" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">cities</text><rect x="30" y="580" width="470" height="78" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="50" y="610" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Administration</text><text x="50" y="636" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">New capital at Karachi; few trained officials</text><line x1="504" y1="619" x2="536" y2="619" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="542" y="580" width="328" height="78" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="562" y="612" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">Government built almost from</text><text x="562" y="634" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">scratch</text><rect x="30" y="668" width="470" height="78" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="50" y="698" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Language</text><text x="50" y="724" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Urdu declared the state language</text><line x1="504" y1="707" x2="536" y2="707" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="542" y="668" width="328" height="78" rx="12" fill="#f6e4d8" stroke="#b5602e" stroke-width="2.5" /><text x="562" y="712" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">Opposition in East Pakistan</text><rect x="430" y="762" width="18" height="18" rx="4" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="456" y="777" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">dealt with</text><rect x="565" y="762" width="18" height="18" rx="4" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="591" y="777" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">mixed</text><rect x="700" y="762" width="18" height="18" rx="4" fill="#f6e4d8" stroke="#b5602e" stroke-width="2"/><text x="726" y="777" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">lasting damage</text><rect x="30" y="796" width="840" height="104" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="54" y="830" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Judgement</text><text x="54" y="858" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The state survived, a real success, but Kashmir and the language issue were left unresolved;</text><text x="54" y="880" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Jinnah’s death in September 1948 removed the one leader accepted across the country.</text>
</svg>