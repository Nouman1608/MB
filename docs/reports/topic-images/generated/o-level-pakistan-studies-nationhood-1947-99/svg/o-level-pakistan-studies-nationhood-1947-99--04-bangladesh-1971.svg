<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 618" width="900" height="618" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="618" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why East Pakistan became Bangladesh</text>

<text x="170" y="128" font-size="16" font-weight="700" fill="#4a5568" text-anchor="middle">LONG-TERM CAUSES</text><rect x="30" y="140" width="280" height="84" rx="10" fill="#f6e4d8" stroke="#b5602e" stroke-width="2" /><text x="44" y="166" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Political domination by the</text><text x="44" y="186" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">West despite the East’s larger</text><text x="44" y="206" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">population</text><rect x="30" y="234" width="280" height="44" rx="10" fill="#f6e4d8" stroke="#b5602e" stroke-width="2" /><text x="44" y="260" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Economic disparity</text><rect x="30" y="288" width="280" height="44" rx="10" fill="#f6e4d8" stroke="#b5602e" stroke-width="2" /><text x="44" y="314" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The language movement</text><rect x="30" y="342" width="280" height="64" rx="10" fill="#f6e4d8" stroke="#b5602e" stroke-width="2" /><text x="44" y="368" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Army and civil service</text><text x="44" y="388" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">recruited mainly from the West</text><rect x="30" y="416" width="280" height="64" rx="10" fill="#f6e4d8" stroke="#b5602e" stroke-width="2" /><text x="44" y="442" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Slow relief after the 1970</text><text x="44" y="462" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">cyclone</text><text x="600" y="128" font-size="16" font-weight="700" fill="#4a5568" text-anchor="middle">HOW INDEPENDENCE CAME</text><rect x="350" y="140" width="520" height="96" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" /><text x="370" y="170" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">1966</text><text x="460" y="170" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Six Points</text><text x="460" y="194" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Awami League under Sheikh Mujib-ur-Rahman</text><text x="460" y="214" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">demands maximum provincial autonomy; rejected</text><line x1="610" y1="238" x2="610" y2="258" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="350" y="262" width="520" height="76" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" /><text x="370" y="292" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">1970</text><text x="460" y="292" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Election</text><text x="460" y="316" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Awami League wins, but power is not transferred</text><line x1="610" y1="340" x2="610" y2="360" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="350" y="364" width="520" height="96" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" /><text x="370" y="394" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">1971</text><text x="460" y="394" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Talks fail</text><text x="460" y="418" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Mujib, Bhutto and Yahya Khan; military action</text><text x="460" y="438" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">begins in March</text><line x1="610" y1="462" x2="610" y2="482" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="350" y="486" width="520" height="96" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5" /><text x="370" y="516" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Dec 1971</text><text x="460" y="516" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Indian intervention</text><text x="460" y="540" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Pakistani forces surrender in Dhaka on 16</text><text x="460" y="560" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">December</text><line x1="312" y1="300" x2="346" y2="300" stroke="#b5602e" stroke-width="4" marker-end="url(#ahR)"/>
</svg>