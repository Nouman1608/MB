<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 676" width="900" height="676" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="676" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Planning a 12-mark judgement</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">"The alliance system was the main reason…" How far do you agree?</text>
<rect x="30" y="124" width="840" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">GIVEN FACTOR</text><text x="50" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Alliances</text><text x="50" y="211.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Turned the Austro-Serbian war into a European war as Russia, Germany and France were drawn in</text><rect x="30" y="258" width="413" height="132" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="290" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">OTHER FACTOR</text><text x="50" y="316.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The Schlieffen Plan</text><text x="50" y="344.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Attack on France through Belgium brought</text><text x="50" y="365.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Britain in</text><rect x="457" y="258" width="413" height="132" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="477" y="300.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">OTHER FACTOR</text><text x="477" y="326.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Naval race and imperial rivalry</text><text x="477" y="355.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Britain saw Germany as a threat</text><rect x="30" y="402" width="413" height="111" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="448" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">OTHER FACTOR</text><text x="50" y="474.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Nationalism in the Balkans</text><rect x="457" y="402" width="413" height="111" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="477" y="434" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">OTHER FACTOR</text><text x="477" y="460.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Leaders' decisions</text><text x="477" y="488.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">e.g. Germany's support for Austria-Hungary</text><rect x="30" y="535" width="840" height="109" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="50" y="569.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Judgement: weigh, do not list</text><text x="50" y="598.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Alliances created the framework, military planning made escalation rapid, and the invasion of Belgium</text><text x="50" y="619.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">decided Britain's entry. Alliances alone did not make war inevitable: Italy did not join its partners.</text>
</svg>