<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 588" width="900" height="588" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="588" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The alliance system, 1882-1907</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Schematic, not a map</text>
<rect x="40" y="154" width="260" height="300" rx="16" fill="none" stroke="#8a6d0d" stroke-width="2.5" stroke-dasharray="8 6"/><text x="170" y="146" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">Triple Alliance (1882)</text><line x1="700" y1="228" x2="700" y2="380" stroke="#2e6b62" stroke-width="4"/><text x="0" y="0" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle"></text><text x="712" y="300" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">Franco-Russian</text><text x="712" y="320" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">Alliance (1894)</text><line x1="548" y1="284" x2="660" y2="224" stroke="#2e6b62" stroke-width="4"/><text x="0" y="0" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle"></text><text x="590" y="236" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="end">Entente Cordiale</text><text x="590" y="256" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="end">(1904)</text><line x1="548" y1="324" x2="660" y2="384" stroke="#2e6b62" stroke-width="4"/><text x="0" y="0" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle"></text><text x="590" y="378" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="end">Anglo-Russian</text><text x="590" y="398" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="end">Agreement (1907)</text><rect x="109.75200000000001" y="180" width="120.496" height="48" rx="24" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="170" y="210" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Germany</text><rect x="75.858" y="280" width="188.284" height="48" rx="24" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="170" y="310" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Austria-Hungary</text><rect x="131.091" y="380" width="77.818" height="48" rx="24" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="170" y="410" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Italy</text><rect x="649.562" y="180" width="100.876" height="48" rx="24" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="700" y="210" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">France</text><rect x="650.732" y="380" width="98.536" height="48" rx="24" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="700" y="410" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Russia</text><rect x="471.371" y="280" width="97.25800000000001" height="48" rx="24" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="520" y="310" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Britain</text><rect x="30" y="476" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="509.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Britain left "Splendid Isolation" as rivalry with Germany grew. In 1914 Italy did <tspan font-weight="700" fill="#1e2a44">not</tspan> join its partners; it</text><text x="50" y="531.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">joined the Allies in 1915.</text>
</svg>