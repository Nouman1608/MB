<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 642" width="900" height="642" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="642" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Action and reaction, 1947-1949</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Each move by one side brought a response from the other</text>
<text x="250" y="138" font-size="15" font-weight="700" fill="#2b5a9a" text-anchor="middle">WEST</text><text x="680" y="138" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">SOVIET UNION</text><rect x="110" y="152" width="300" height="90" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="122" y="178.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Truman Doctrine</text><text x="122" y="206" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Support for Greece and Turkey;</text><text x="122" y="226" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">containment</text><rect x="530" y="152" width="340" height="90" rx="14" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5"/><text x="542" y="188.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Cominform</text><text x="542" y="216" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Soviet response</text><line x1="416" y1="197" x2="522" y2="197" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="30" y="203" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">1947</text><rect x="110" y="254" width="300" height="84" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="122" y="287.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Marshall Aid</text><text x="122" y="315" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Money to rebuild Europe</text><rect x="530" y="254" width="340" height="84" rx="14" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5"/><text x="542" y="287.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Rejected; Comecon</text><text x="542" y="315" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Seen as spreading US influence</text><line x1="416" y1="296" x2="522" y2="296" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="30" y="302" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">1947</text><rect x="110" y="350" width="300" height="84" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="122" y="385.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">New currency in the Western</text><text x="122" y="408.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">zones</text><rect x="530" y="350" width="340" height="84" rx="14" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5"/><text x="542" y="383.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Berlin Blockade</text><text x="542" y="411" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Answered by the Airlift (1948-49)</text><line x1="416" y1="392" x2="522" y2="392" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="30" y="398" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">1948</text><rect x="110" y="446" width="300" height="84" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="122" y="492.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">NATO formed</text><rect x="530" y="446" width="340" height="84" rx="14" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5"/><text x="542" y="481.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Federal Republic and GDR; first</text><text x="542" y="504.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Soviet atomic test</text><line x1="416" y1="488" x2="522" y2="488" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="30" y="494" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">1949</text><rect x="30" y="552" width="840" height="58" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="585.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Europe was now divided <tspan font-weight="700" fill="#1e2a44">economically</tspan> as well as politically.</text>
</svg>