<rect width="900" height="562" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Détente, renewed tension and collapse, c1969-1991</text>

<rect x="30" y="100" width="190.5" height="299" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="43" y="127.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Détente</text><text x="43" y="155" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Motives:</tspan> <tspan font-style="italic">cost</tspan> <tspan font-style="italic">of</tspan> <tspan font-style="italic">the</tspan></text><text x="43" y="175" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">arms</tspan> <tspan font-style="italic">race,</tspan> <tspan font-style="italic">Sino-Soviet</tspan></text><text x="43" y="195" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">split,</tspan> <tspan font-style="italic">Ostpolitik</tspan></text><text x="43" y="221" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">ABM Treaty and SALT</text><text x="43" y="241" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">I (1972)</text><text x="43" y="267" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Nixon-Brezhnev</text><text x="43" y="287" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">summits</text><text x="43" y="313" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Helsinki Accords</text><text x="43" y="333" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">(1975)</text><line x1="226.5" y1="249.5" x2="240.5" y2="249.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="246.5" y="100" width="190.5" height="299" rx="14" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5"/><text x="259.5" y="127.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Collapse of</text><text x="259.5" y="150.04000000000002" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">détente</text><text x="259.5" y="178" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">From</tspan> <tspan font-style="italic">the</tspan> <tspan font-style="italic">invasion</tspan> <tspan font-style="italic">of</tspan></text><text x="259.5" y="198" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Afghanistan</tspan> <tspan font-style="italic">(Dec</tspan></text><text x="259.5" y="218" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">1979)</tspan></text><text x="259.5" y="244" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">SALT II not ratified</text><text x="259.5" y="270" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Olympic boycotts</text><text x="259.5" y="290" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">(1980, 1984)</text><text x="259.5" y="316" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Reagan: SDI (1983),</text><text x="259.5" y="336" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">new missiles in Europe</text><line x1="443" y1="249.5" x2="457" y2="249.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="463" y="100" width="190.5" height="299" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="476" y="127.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Second détente</text><text x="476" y="155" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Gorbachev,</tspan> <tspan font-style="italic">from</tspan> <tspan font-style="italic">1985</tspan></text><text x="476" y="181" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Reykjavik Summit</text><text x="476" y="201" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">(1986)</text><text x="476" y="227" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">START treaty (1991)</text><line x1="659.5" y1="249.5" x2="673.5" y2="249.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="679.5" y="100" width="190.5" height="299" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="692.5" y="127.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Collapse of</text><text x="692.5" y="150.04000000000002" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">communism</text><text x="692.5" y="178" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">To</tspan> <tspan font-style="italic">December</tspan> <tspan font-style="italic">1991</tspan></text><text x="692.5" y="204" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Afghanistan</text><text x="692.5" y="224" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">withdrawal complete</text><text x="692.5" y="244" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">(1989)</text><text x="692.5" y="270" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Solidarity wins</text><text x="692.5" y="290" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">elections (1989)</text><text x="692.5" y="316" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Berlin Wall opened</text><text x="692.5" y="336" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">(Nov 1989)</text><text x="692.5" y="362" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">USSR collapses (Dec</text><text x="692.5" y="382" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">1991)</text><rect x="30" y="421" width="840" height="109" rx="14" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="455.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Also part of the collapse</text><text x="50" y="484.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Glasnost and perestroika; the Velvet Revolution in Czechoslovakia; the end of communist rule in East</text><text x="50" y="505.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Germany and Hungary.</text>
</svg>