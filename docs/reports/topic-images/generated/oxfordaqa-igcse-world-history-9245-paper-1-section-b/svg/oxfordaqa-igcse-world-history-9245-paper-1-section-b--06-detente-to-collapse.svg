<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 838" width="900" height="838" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="838" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Détente, renewed tension and collapse, c1969-1991</text>

<rect x="30" y="100" width="840" height="113" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="132" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">Motives: cost of the arms race, Sino-Soviet split, Ostpolitik</text><text x="50" y="159.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Détente</text><text x="50" y="188.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">ABM Treaty and SALT I (1972) · Nixon-Brezhnev summits · Helsinki Accords (1975)</text><line x1="450" y1="218" x2="450" y2="242" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="247" width="840" height="113" rx="14" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="279" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">From the invasion of Afghanistan (Dec 1979)</text><text x="50" y="306.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Collapse of détente</text><text x="50" y="335.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">SALT II not ratified · Olympic boycotts (1980, 1984) · Reagan: SDI (1983), new missiles in Europe</text><line x1="450" y1="365" x2="450" y2="389" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="394" width="840" height="113" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="426" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">Gorbachev, from 1985</text><text x="50" y="453.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Second détente</text><text x="50" y="482.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Reykjavik Summit (1986) · START treaty (1991)</text><line x1="450" y1="512" x2="450" y2="536" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="541" width="840" height="134" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="573" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">To December 1991</text><text x="50" y="600.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Collapse of communism</text><text x="50" y="629.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Afghanistan withdrawal complete (1989) · Solidarity wins elections (1989) · Berlin Wall opened (Nov 1989)</text><text x="50" y="650.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">· USSR collapses (Dec 1991)</text><rect x="30" y="697" width="840" height="109" rx="14" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="731.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Also part of the collapse</text><text x="50" y="760.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Glasnost and perestroika; the Velvet Revolution in Czechoslovakia; the end of communist rule in East</text><text x="50" y="781.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Germany and Hungary.</text>
</svg>