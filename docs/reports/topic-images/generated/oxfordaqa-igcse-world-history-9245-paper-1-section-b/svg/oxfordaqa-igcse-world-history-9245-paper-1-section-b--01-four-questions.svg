<rect width="900" height="673" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Section B: four questions, rising demands</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">One option studied; 30 marks</text>
<rect x="30" y="124" width="69" height="90" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="64.5" y="165" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Q1</text><text x="64.5" y="189" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">3 marks</text><rect x="330" y="124" width="540" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="342" y="148" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">AO1</text><text x="342" y="174.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Show knowledge</text><text x="342" y="197.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Three relevant points; no explanation needed</text><rect x="30" y="226" width="138" height="90" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="99" y="267" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Q2</text><text x="99" y="291" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">6 marks</text><rect x="330" y="226" width="540" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="342" y="250" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">AO1 + AO2</text><text x="342" y="276.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Explain one way</text><text x="342" y="299.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">One cause or consequence, with precise knowledge and a clear link</text><rect x="30" y="328" width="207" height="111" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="133.5" y="379.5" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Q3</text><text x="133.5" y="403.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">9 marks</text><rect x="330" y="328" width="540" height="111" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="342" y="352" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">AO1 + AO2</text><text x="342" y="378.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Explain two ways or reasons</text><text x="342" y="401.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Keep the two separate; each linked to how it caused the</text><text x="342" y="422.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">development</text><rect x="30" y="451" width="276" height="90" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="168" y="492" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Q4</text><text x="168" y="516" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">12 marks</text><rect x="330" y="451" width="540" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="342" y="475" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">AO1 + AO2</text><text x="342" y="501.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Given factor + at least one other</text><text x="342" y="524.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A line of reasoning and a judgement on relative importance</text><text x="30" y="559" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Bar lengths show marks, to scale</text><rect x="30" y="583" width="840" height="58" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="616.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Allow about 50 minutes for Section B, with roughly 18 for the 12-mark question. Plan it first.</text>
</svg>