<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 739" width="900" height="739" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="739" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Hitler's foreign policy, 1933-1941</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Aims: overturn Versailles, unite German-speakers, Lebensraum in the east</text>
<line x1="150" y1="132" x2="150" y2="699" stroke="#1e2a44" stroke-width="4"/><rect x="190" y="124" width="680" height="43" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="202" y="150.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Leaves the Disarmament Conference and the League</text><circle cx="150" cy="145.5" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="130" y="151.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1933</text><rect x="190" y="176" width="680" height="43" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="202" y="202.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Non-aggression pact with Poland</text><circle cx="150" cy="197.5" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="130" y="203.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1934</text><rect x="190" y="228" width="680" height="67" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="202" y="254.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Saar returns; conscription reintroduced</text><text x="202" y="278.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Stresa Front formed, then the Anglo-German Naval Agreement</text><circle cx="150" cy="261.5" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="130" y="267.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1935</text><rect x="190" y="304" width="680" height="67" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="202" y="330.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Rhineland remilitarised</text><text x="202" y="354.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Rome-Berlin Axis and Anti-Comintern Pact (1936); aid to Franco</text><circle cx="150" cy="337.5" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="130" y="343.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Mar 1936</text><rect x="190" y="380" width="680" height="43" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="202" y="406.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Anschluss</text><circle cx="150" cy="401.5" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="130" y="407.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Mar 1938</text><rect x="190" y="432" width="680" height="43" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="202" y="458.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Munich Agreement over the Sudetenland</text><circle cx="150" cy="453.5" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="130" y="459.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Sep 1938</text><rect x="190" y="484" width="680" height="67" rx="14" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5"/><text x="202" y="510.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Rest of Czechoslovakia occupied: appeasement ends</text><text x="202" y="534.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Britain and France guarantee Poland; Pact of Steel (May)</text><circle cx="150" cy="517.5" r="10" fill="#b5602e" stroke="#1e2a44" stroke-width="3"/><text x="130" y="523.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Mar 1939</text><rect x="190" y="560" width="680" height="43" rx="14" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5"/><text x="202" y="586.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Nazi-Soviet Pact</text><circle cx="150" cy="581.5" r="10" fill="#b5602e" stroke="#1e2a44" stroke-width="3"/><text x="130" y="587.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">23 Aug 1939</text><rect x="190" y="612" width="680" height="43" rx="14" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5"/><text x="202" y="638.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Invasion of Poland; Britain and France declare war (3 Sep)</text><circle cx="150" cy="633.5" r="10" fill="#b5602e" stroke="#1e2a44" stroke-width="3"/><text x="130" y="639.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1 Sep 1939</text><rect x="190" y="664" width="680" height="43" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="202" y="690.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Invasion of the USSR (June); Pearl Harbor (December)</text><circle cx="150" cy="685.5" r="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="130" y="691.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1941</text>
</svg>