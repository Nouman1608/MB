<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 536" width="900" height="536" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="536" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Structure of a 9-mark answer</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Two reasons why tension increased, 1945-49: keep them separate</text>
<rect x="30" y="124" width="405" height="380" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="160" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">REASON 1</text><text x="52" y="188" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The division of Germany and the Berlin</text><text x="52" y="213" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Blockade</text><rect x="48" y="244" width="369" height="91" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="268" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PRECISE DETAIL</text><text x="60" y="299" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">New Western currency (1948); Stalin blockaded</text><text x="60" y="319" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">West Berlin; supplied by air until 1949</text><line x1="232" y1="337" x2="232" y2="349" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="48" y="351" width="369" height="91" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="60" y="375" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">LINK: WHY TENSION ROSE</text><text x="60" y="406" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Germany became a test of strength; led to</text><text x="60" y="426" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">NATO (1949) and two German states</text><rect x="465" y="124" width="405" height="380" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="487" y="160" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">REASON 2</text><text x="487" y="188" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The Truman Doctrine and Marshall Aid</text><rect x="483" y="244" width="369" height="111" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="495" y="268" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PRECISE DETAIL</text><text x="495" y="299" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Support for Greece and Turkey (1947); aid to</text><text x="495" y="319" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">rebuild Europe; Stalin refused it and set up</text><text x="495" y="339" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Cominform and Comecon</text><line x1="667" y1="357" x2="667" y2="369" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="483" y="371" width="369" height="91" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="495" y="395" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">LINK: WHY TENSION ROSE</text><text x="495" y="426" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Europe divided economically as well as</text><text x="495" y="446" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">politically</text>
</svg>