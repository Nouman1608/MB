<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 635" width="900" height="635" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="635" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">From Sarajevo to world war, 1914</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">How a regional conflict escalated</text>
<line x1="130" y1="132" x2="130" y2="595" stroke="#1e2a44" stroke-width="4"/><rect x="170" y="124" width="700" height="67" rx="14" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5"/><text x="182" y="150.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Franz Ferdinand assassinated in Sarajevo</text><text x="182" y="174.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">By Gavrilo Princip, linked to the Black Hand</text><circle cx="130" cy="157.5" r="10" fill="#b5602e" stroke="#1e2a44" stroke-width="3"/><text x="110" y="163.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">28 June</text><rect x="170" y="200" width="700" height="67" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="182" y="226.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Austria-Hungary's ultimatum to Serbia</text><text x="182" y="250.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Only partly accepted</text><circle cx="130" cy="233.5" r="6" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><rect x="170" y="276" width="700" height="43" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="182" y="302.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Austria-Hungary declares war on Serbia</text><circle cx="130" cy="297.5" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="110" y="303.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">28 July</text><rect x="170" y="328" width="700" height="43" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="182" y="354.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Russia mobilises</text><circle cx="130" cy="349.5" r="6" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><rect x="170" y="380" width="700" height="43" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="182" y="406.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Germany declares war on Russia and France</text><circle cx="130" cy="401.5" r="6" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><rect x="170" y="432" width="700" height="43" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="182" y="458.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Schlieffen Plan: German troops through Belgium</text><circle cx="130" cy="453.5" r="6" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><rect x="170" y="484" width="700" height="67" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="182" y="510.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Britain declares war</text><text x="182" y="534.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A guarantor of Belgian neutrality under the 1839 Treaty of London</text><circle cx="130" cy="517.5" r="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="110" y="523.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">4 Aug</text><rect x="170" y="560" width="700" height="43" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="182" y="586.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Ottoman Empire joins Germany (1914); Italy joins the Allies (1915)</text><circle cx="130" cy="581.5" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="110" y="587.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">later</text>
</svg>