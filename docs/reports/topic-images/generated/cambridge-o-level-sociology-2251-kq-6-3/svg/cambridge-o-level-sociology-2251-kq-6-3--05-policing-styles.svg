<rect x="30" y="104" width="249.33333333333334" height="175" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="137" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">COMMUNITY STYLE</text><text x="50" y="163.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Public cooperation</text><text x="50" y="191.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Relies on local knowledge</text><text x="50" y="212.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and trust</text><line x1="285.33333333333337" y1="191.5" x2="319.33333333333337" y2="191.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="325.33333333333337" y="104" width="249.33333333333334" height="175" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="345.33333333333337" y="137" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">TARGETING</text><text x="345.33333333333337" y="163.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Stop and search</text><text x="345.33333333333337" y="191.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Finds weapons and drugs;</text><text x="345.33333333333337" y="212.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">damages trust if unfair</text><text x="345.33333333333337" y="233.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(Scarman 1981, Macpherson</text><text x="345.33333333333337" y="254.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">1999)</text><line x1="580.6666666666667" y1="191.5" x2="614.6666666666667" y2="191.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="620.6666666666667" y="104" width="249.33333333333334" height="175" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="640.6666666666667" y="137" font-size="15" font-weight="700" fill="#b5602e" text-anchor="s