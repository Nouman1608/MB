<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 561" width="900" height="561" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="561" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Preventing crime and watching for it</text>

<rect x="30" y="104" width="269.3333333333333" height="248" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="137" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SITUATIONAL (CLARKE)</text><text x="50" y="163.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Reduce opportunities</text><text x="50" y="191.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="191.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Better locks, lighting</text><text x="65.2" y="212.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and design</text><text x="50" y="239.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="239.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Newman (1972): defensible</text><text x="65.2" y="260.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">space lets residents</text><text x="65.2" y="281.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">watch shared areas</text><rect x="315.3333333333333" y="104" width="269.3333333333333" height="248" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="335.3333333333333" y="137" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">SOCIAL</text><text x="335.3333333333333" y="163.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Tackle causes</text><text x="335.3333333333333" y="191.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="350.5333333333333" y="191.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Youth clubs, education,</text><text x="350.5333333333333" y="212.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">employment schemes</text><rect x="600.6666666666666" y="104" width="269.3333333333333" height="248" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="620.6666666666666" y="137" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ZERO TOLERANCE</text><text x="620.6666666666666" y="163.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Broken windows</text><text x="620.6666666666666" y="188.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">(1982)</text><text x="620.6666666666666" y="216.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="635.8666666666667" y="216.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Wilson and Kelling:</text><text x="635.8666666666667" y="237.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">unchecked disorder</text><text x="635.8666666666667" y="258.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">invites serious crime</text><text x="620.6666666666666" y="285.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="635.8666666666667" y="285.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">New York 1990s; critics:</text><text x="635.8666666666667" y="306.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">crime fell for other</text><text x="635.8666666666667" y="327.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">reasons too</text><rect x="30" y="370" width="408" height="161" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="405.2" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Surveillance: for</text><text x="50" y="433.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="433.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">CCTV, number-plate recognition, phone data</text><text x="65.2" y="454.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and facial recognition aid detection</text><text x="50" y="480.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="480.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">May deter: the panopticon effect</text><rect x="462" y="370" width="408" height="161" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="482" y="405.2" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">Surveillance: doubts</text><text x="482" y="433.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="497.2" y="433.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Displacement: crime moves to unwatched</text><text x="497.2" y="454.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">places</text><text x="482" y="480.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="497.2" y="480.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Privacy</text><text x="482" y="506.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="497.2" y="506.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">May be used against particular groups</text>
</svg>