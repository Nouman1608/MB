<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 458" width="900" height="458" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="458" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Sociological views of punishment</text>

<rect x="30" y="104" width="411" height="154" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="137" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DURKHEIM</text><text x="50" y="163.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Expresses shared values</text><text x="50" y="191.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Retributive justice in simpler societies;</text><text x="50" y="212.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">restitutive justice, restoring things, in</text><text x="50" y="233.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">complex modern ones.</text><rect x="459" y="104" width="411" height="154" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="479" y="137" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">MARXISTS</text><text x="479" y="163.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Controls the working class</text><text x="479" y="191.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Crimes of the powerful are rarely punished.</text><rect x="30" y="274" width="411" height="154" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="307" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">FOUCAULT (1975)</text><text x="50" y="333.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Sovereign to disciplinary power</text><text x="50" y="361.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">From public physical punishment to control</text><text x="50" y="382.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">through surveillance; Bentham’s panopticon.</text><rect x="459" y="274" width="411" height="154" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="479" y="307" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">BRAITHWAITE (1989)</text><text x="479" y="333.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Two kinds of shaming</text><text x="479" y="361.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Disintegrative shaming labels and excludes;</text><text x="479" y="382.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">reintegrative shaming condemns the act but</text><text x="479" y="403.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">welcomes the offender back.</text>
</svg>