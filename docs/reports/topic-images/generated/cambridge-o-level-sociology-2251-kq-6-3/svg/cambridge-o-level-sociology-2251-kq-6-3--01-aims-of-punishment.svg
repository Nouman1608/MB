<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 643" width="900" height="643" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="643" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Five aims of punishment</text>

<rect x="345" y="130" width="210" height="80" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="175.1" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">The crime</text><rect x="30" y="110" width="280" height="155" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="143" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">LOOKS BACKWARD</text><text x="50" y="170" font-size="20" font-weight="700" fill="#b5602e" text-anchor="start">Retribution</text><text x="50" y="198.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Make the offender suffer in</text><text x="50" y="219.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">proportion to the harm: “just</text><text x="50" y="240.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">deserts”. Is this deserved?</text><line x1="340" y1="170" x2="316" y2="170" stroke="#b5602e" stroke-width="3.5" marker-end="url(#ahR)"/><line x1="560" y1="170" x2="600" y2="170" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><text x="735" y="176" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">LOOKS FORWARD</text><rect x="30" y="285" width="411" height="109" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="320.2" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Protection of citizens</text><text x="50" y="348.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Will this make people safer?</text><rect x="459" y="285" width="411" height="109" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="479" y="320.2" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Deterrence</text><text x="479" y="348.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Individual (the offender) and general (others</text><text x="479" y="369.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">who see it). Will this put people off?</text><rect x="30" y="408" width="411" height="109" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="443.2" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Incapacitation</text><text x="50" y="471.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Remove the ability to offend. Can they offend</text><text x="50" y="492.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">while this lasts?</text><rect x="459" y="408" width="411" height="109" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="479" y="443.2" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Rehabilitation</text><text x="479" y="471.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Change the offender. Will they stop</text><text x="479" y="492.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">afterwards?</text><rect x="30" y="533" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="566.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A sentence can be deserved yet fail to reduce reoffending, or reduce reoffending yet seem</text><text x="50" y="588.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">too lenient. That is why people disagree about punishment.</text>
</svg>