<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 604" width="900" height="604" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="604" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Dealing with crime in different societies</text>

<line x1="216" y1="142" x2="216" y2="536" stroke="#1e2a44" stroke-width="4"/><rect x="246" y="104" width="624" height="76" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="260" y="133.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Napoleon exiled to Elba, later St Helena</text><text x="260" y="161.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Today: deportation of foreign offenders.</text><circle cx="216" cy="142" r="11" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="192" y="149" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="end">Exile</text><rect x="246" y="192" width="624" height="76" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="260" y="221.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Amish shunning</text><text x="260" y="249.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Members who break community rules are shunned.</text><circle cx="216" cy="230" r="11" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="192" y="237" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="end">Ostracism</text><rect x="246" y="280" width="624" height="97" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="260" y="309.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Bastøy prison, Norway</text><text x="260" y="337.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Prisoners live in houses on an island and work a farm, preparing for</text><text x="260" y="358.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">release.</text><circle cx="216" cy="328.5" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="192" y="335.5" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="end">Rehabilitation</text><rect x="246" y="389" width="624" height="97" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="260" y="418.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">New Zealand family group conferences (1989)</text><text x="260" y="446.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Young offenders, victims and families meet: close to reintegrative</text><text x="260" y="467.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">shaming.</text><circle cx="216" cy="437.5" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="192" y="444.5" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="end">Restorative</text><rect x="246" y="498" width="624" height="76" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="260" y="527.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Boston Marathon bombing (2013)</text><text x="260" y="555.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Online amateurs wrongly named innocent people as suspects.</text><circle cx="216" cy="536" r="11" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="192" y="543" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="end">Vigilantism</text>
</svg>