<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 542" width="900" height="542" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="542" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Plan: are harsher punishments best?</text>

<rect x="30" y="104" width="170" height="72" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="115" y="147" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Introduction</text><rect x="214" y="104" width="656" height="72" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="230" y="133.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The view rests on deterrence and incapacitation; the alternative</text><text x="230" y="155.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">stresses rehabilitation and prevention.</text><rect x="30" y="188" width="170" height="72" rx="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="115" y="231" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">For</text><rect x="214" y="188" width="656" height="72" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="230" y="217.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Long prison terms incapacitate; some states use capital and corporal</text><text x="230" y="239.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">punishment to deter; retribution satisfies victims.</text><rect x="30" y="272" width="170" height="72" rx="14" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="115" y="315" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Against</text><rect x="214" y="272" width="656" height="72" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="230" y="301.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Certainty of being caught matters more than severity; prison can raise</text><text x="230" y="323.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">reoffending; Bastøy and Halden; reintegrative shaming.</text><rect x="30" y="356" width="170" height="72" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="115" y="399" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Policing</text><rect x="214" y="356" width="656" height="72" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="230" y="385.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Situational and social crime prevention; community policing reduce</text><text x="230" y="407.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">crime without punishment.</text><rect x="30" y="440" width="170" height="72" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="115" y="483" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Conclusion</text><rect x="214" y="440" width="656" height="72" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="230" y="469.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Harsh punishment serves retribution and incapacitation, but</text><text x="230" y="491.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">rehabilitation and prevention are more likely to reduce crime overall.</text>
</svg>