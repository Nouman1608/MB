<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 858" width="900" height="858" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="858" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Which aims does each punishment serve?</text>

<rect x="30" y="110" width="840" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="42" y="140" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Punishment</text><text x="313" y="140" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Protect</text><text x="379" y="140" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Deter</text><text x="445" y="140" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Retrib.</text><text x="511" y="140" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Incap.</text><text x="577" y="140" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Rehab.</text><text x="622" y="140" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Main doubt</text><rect x="30" y="156" width="840" height="56" fill="#fbf8ea" stroke="#c9d6d4" stroke-width="1.5"/><text x="42" y="180" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Prison</text><circle cx="313" cy="184" r="10" fill="#2e6b62"/><circle cx="445" cy="184" r="10" fill="#2e6b62"/><circle cx="511" cy="184" r="10" fill="#2e6b62"/><text x="622" y="179" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">High reoffending; spreads</text><text x="622" y="198" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">criminal skills; labels</text><rect x="30" y="212" width="840" height="58" fill="#ffffff" stroke="#c9d6d4" stroke-width="1.5"/><text x="42" y="236" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Rehabilitation</text><text x="42" y="256" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">programmes</text><circle cx="577" cy="241" r="10" fill="#2e6b62"/><text x="622" y="235" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Need resources and willing</text><text x="622" y="254" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">offenders</text><rect x="30" y="270" width="840" height="56" fill="#fbf8ea" stroke="#c9d6d4" stroke-width="1.5"/><text x="42" y="294" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Community sentencing</text><circle cx="445" cy="298" r="10" fill="#2e6b62"/><circle cx="577" cy="298" r="10" fill="#2e6b62"/><text x="622" y="293" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">May seem soft, weakening</text><text x="622" y="312" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">deterrence</text><rect x="30" y="326" width="840" height="56" fill="#ffffff" stroke="#c9d6d4" stroke-width="1.5"/><text x="42" y="350" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Financial penalties</text><circle cx="379" cy="354" r="10" fill="#2e6b62"/><circle cx="445" cy="354" r="10" fill="#2e6b62"/><text x="622" y="349" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Hurts the poor more than the</text><text x="622" y="368" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">rich</text><rect x="30" y="382" width="840" height="56" fill="#fbf8ea" stroke="#c9d6d4" stroke-width="1.5"/><text x="42" y="406" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Capital punishment</text><circle cx="445" cy="410" r="10" fill="#2e6b62"/><circle cx="511" cy="410" r="10" fill="#2e6b62"/><text x="622" y="405" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Irreversible; deterrent effect</text><text x="622" y="424" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">disputed</text><rect x="30" y="438" width="840" height="56" fill="#ffffff" stroke="#c9d6d4" stroke-width="1.5"/><text x="42" y="462" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Corporal punishment</text><circle cx="379" cy="466" r="10" fill="#2e6b62"/><circle cx="445" cy="466" r="10" fill="#2e6b62"/><text x="622" y="461" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Widely condemned as a human</text><text x="622" y="480" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">rights abuse</text><rect x="30" y="494" width="840" height="38" fill="#fbf8ea" stroke="#c9d6d4" stroke-width="1.5"/><text x="42" y="518" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Exile</text><circle cx="313" cy="513" r="10" fill="#2e6b62"/><circle cx="511" cy="513" r="10" fill="#2e6b62"/><text x="622" y="517" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Moves the problem elsewhere</text><rect x="30" y="532" width="840" height="56" fill="#ffffff" stroke="#c9d6d4" stroke-width="1.5"/><text x="42" y="556" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Ostracism</text><circle cx="379" cy="560" r="10" fill="#2e6b62"/><circle cx="445" cy="560" r="10" fill="#2e6b62"/><text x="622" y="555" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">May push the person further</text><text x="622" y="574" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">into deviance</text><rect x="30" y="588" width="840" height="58" fill="#fbf8ea" stroke="#c9d6d4" stroke-width="1.5"/><text x="42" y="612" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Tagging, curfews,</text><text x="42" y="632" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">restraining orders</text><circle cx="313" cy="617" r="10" fill="#2e6b62"/><circle cx="511" cy="617" r="9" fill="none" stroke="#2e6b62" stroke-width="3"/><text x="622" y="611" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Depend on monitoring; can be</text><text x="622" y="630" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">breached</text><rect x="30" y="646" width="840" height="56" fill="#ffffff" stroke="#c9d6d4" stroke-width="1.5"/><text x="42" y="670" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Probation</text><circle cx="577" cy="674" r="10" fill="#2e6b62"/><text x="622" y="669" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Depends on caseloads and</text><text x="622" y="688" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">support</text><rect x="30" y="702" width="840" height="38" fill="#fbf8ea" stroke="#c9d6d4" stroke-width="1.5"/><text x="42" y="726" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Police cautions</text><circle cx="379" cy="721" r="10" fill="#2e6b62"/><text x="622" y="725" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">May seem to let offenders off</text><rect x="30" y="740" width="840" height="58" fill="#ffffff" stroke="#c9d6d4" stroke-width="1.5"/><text x="42" y="764" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Social media and</text><text x="42" y="784" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">vigilante groups</text><circle cx="379" cy="769" r="10" fill="#2e6b62"/><circle cx="445" cy="769" r="10" fill="#2e6b62"/><text x="622" y="763" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">No due process; innocent</text><text x="622" y="782" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">people targeted</text><rect x="30" y="110" width="840" height="688" fill="none" stroke="#1e2a44" stroke-width="2.5"/><line x1="280" y1="110" x2="280" y2="798" stroke="#1e2a44" stroke-width="2"/><line x1="610" y1="110" x2="610" y2="798" stroke="#1e2a44" stroke-width="2"/><circle cx="42" cy="824" r="9" fill="#2e6b62"/><text x="60" y="830" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">serves this aim</text><circle cx="212" cy="824" r="8" fill="none" stroke="#2e6b62" stroke-width="3"/><text x="230" y="830" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">partly</text><text x="870" y="830" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">Protect = protection of citizens; Retrib. = retribution; Incap. = incapacitation</text>
</svg>