<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 776" width="900" height="776" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="776" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Getting a case to Strasbourg</text>

<rect x="30" y="100" width="412" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ARTICLE 34</text><text x="50" y="158.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Individual applications</text><text x="50" y="186.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A person, NGO or group who is a <tspan font-weight="700" fill="#1e2a44">victim</tspan>: directly</text><text x="50" y="207.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">affected, no challenge in the abstract</text><rect x="458" y="100" width="412" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="478" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ARTICLE 33</text><text x="478" y="158.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Inter-state cases</text><text x="478" y="186.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Rare. <tspan font-style="italic">Ireland</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">UK</tspan> (1978): interrogation</text><text x="478" y="207.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">techniques in Northern Ireland</text><text x="450" y="268" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">ADMISSIBILITY: ARTICLE 35 (MOST APPLICATIONS FAIL HERE)</text><rect x="30" y="282" width="840" height="46" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="450" y="311" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Domestic remedies exhausted (in the UK, including an HRA claim)</text><rect x="45" y="336" width="810" height="46" rx="10" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="450" y="365" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Within four months of the final domestic decision (Protocol 15; since 2022)</text><rect x="60" y="390" width="780" height="46" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="450" y="419" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Not anonymous; not substantially the same as one already examined</text><rect x="75" y="444" width="750" height="46" rx="10" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="450" y="473" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Not manifestly ill-founded or an abuse of the right of application</text><rect x="90" y="498" width="720" height="46" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="450" y="527" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">A significant disadvantage, unless human rights require examination (Protocol 14)</text><line x1="450" y1="558" x2="450" y2="590" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="300" y="596" width="300" height="48" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="627" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Case examined on the merits</text><rect x="30" y="666" width="840" height="78" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="698.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Urgent cases: <tspan font-weight="700" fill="#1e2a44">interim</tspan> <tspan font-weight="700" fill="#1e2a44">measures</tspan> under Rule 39, such as asking a state not to deport someone while the</text><text x="450" y="719.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">case is pending.</text>
</svg>