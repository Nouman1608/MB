<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 601" width="900" height="601" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="601" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The Human Rights Act 1998 in the domestic courts</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">The first and main forum</text>
<rect x="30" y="124" width="413" height="174" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SECTION 6</text><text x="50" y="182.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Public authorities must act compatibly</text><text x="50" y="210.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Core (police, councils) and hybrid bodies</text><text x="50" y="231.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">performing public functions. <tspan font-style="italic">YL</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Birmingham</tspan></text><text x="50" y="252.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">CC</tspan> (2007): private care home not; reversed by</text><text x="50" y="273.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Care Act 2014 s73</text><rect x="457" y="124" width="413" height="174" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SECTION 7</text><text x="477" y="182.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Only a victim may claim</text><text x="477" y="210.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Normally within one year (s7(5)); rights can also</text><text x="477" y="231.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">be relied on as a defence</text><rect x="30" y="316" width="413" height="153" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="348" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SECTION 8</text><text x="50" y="374.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">A just and appropriate remedy</text><text x="50" y="402.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Damages only where necessary; <tspan font-style="italic">R</tspan> <tspan font-style="italic">(Greenfield)</tspan></text><text x="50" y="423.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">(2005): follow Strasbourg practice, a finding is</text><text x="50" y="444.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">often enough</text><rect x="457" y="316" width="413" height="153" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="348" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SECTION 2</text><text x="477" y="374.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Take Strasbourg case law into account</text><text x="477" y="402.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">R</tspan> <tspan font-style="italic">(Ullah)</tspan> (2004): “no more, but certainly no less”.</text><text x="477" y="423.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">R</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Horncastle</tspan> (2009): judicial dialogue on</text><text x="477" y="444.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">hearsay</text><rect x="30" y="491" width="840" height="78" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="523.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Sections 3 and 4 (interpretation and declarations of incompatibility) are covered in the Human Rights</text><text x="450" y="544.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">study guide.</text>
</svg>