<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" width="900" height="580" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="580" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The European Court of Human Rights</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">An institution of the Council of Europe, not the European Union</text>
<rect x="250" y="124" width="400" height="74" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="156" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Grand Chamber of seventeen</text><text x="450" y="182" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">the most serious issues</text><rect x="180" y="208" width="540" height="58" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="245" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Chamber of seven</text><rect x="105" y="276" width="690" height="58" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="313" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Committee of three</text><rect x="30" y="344" width="840" height="74" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="376" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Single judge</text><text x="450" y="402" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">can only declare clearly inadmissible applications inadmissible</text><rect x="30" y="440" width="412" height="108" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="474.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Single, full-time court</text><text x="50" y="502.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Since Protocol 11 (1998); the European</text><text x="50" y="523.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Commission of Human Rights was abolished</text><rect x="458" y="440" width="412" height="108" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="478" y="484.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">One judge for each state party</text><text x="478" y="513.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Decides cases in the formations above</text>
</svg>