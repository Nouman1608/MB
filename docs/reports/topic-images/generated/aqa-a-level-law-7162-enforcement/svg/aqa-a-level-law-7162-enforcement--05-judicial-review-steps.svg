<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 710" width="900" height="710" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="710" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The process of judicial review</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Tests how a decision was made, not whether it was the best one</text>
<line x1="60" y1="144" x2="60" y2="658" stroke="#c9d6d4" stroke-width="4"/><rect x="104" y="124" width="766" height="77" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="119" y="153.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Pre-action letter</text><text x="119" y="181.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">To the public body, under the pre-action protocol.</text><circle cx="60" cy="162.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="171.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="104" y="211" width="766" height="77" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="119" y="240.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Claim form</text><text x="119" y="268.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Administrative Court, CPR Part 54: <tspan font-weight="700" fill="#1e2a44">promptly</tspan> <tspan font-weight="700" fill="#1e2a44">and</tspan> <tspan font-weight="700" fill="#1e2a44">in</tspan> <tspan font-weight="700" fill="#1e2a44">any</tspan> <tspan font-weight="700" fill="#1e2a44">event</tspan> <tspan font-weight="700" fill="#1e2a44">within</tspan> <tspan font-weight="700" fill="#1e2a44">three</tspan> <tspan font-weight="700" fill="#1e2a44">months</tspan>.</text><circle cx="60" cy="249.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="258.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="104" y="298" width="766" height="77" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="119" y="327.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Standing</text><text x="119" y="355.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Sufficient interest (Senior Courts Act 1981 s31(3)); a <tspan font-weight="700" fill="#1e2a44">victim</tspan> for an HRA claim (s7(3)).</text><circle cx="60" cy="336.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="345.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="104" y="385" width="766" height="77" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="119" y="414.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Permission</text><text x="119" y="442.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">On the papers: is there an <tspan font-weight="700" fill="#1e2a44">arguable</tspan> <tspan font-weight="700" fill="#1e2a44">case</tspan>? Many claims end here.</text><circle cx="60" cy="423.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="432.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="104" y="472" width="766" height="98" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="119" y="501.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Full hearing: the grounds</text><text x="119" y="529.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">CCSU</tspan> (1985): illegality, irrationality, procedural impropriety. With Convention rights,</text><text x="119" y="550.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">proportionality</tspan>: more intense than irrationality (<tspan font-style="italic">R</tspan> <tspan font-style="italic">(Daly)</tspan>, 2001).</text><circle cx="60" cy="521" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="529.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><rect x="104" y="580" width="766" height="98" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="119" y="609.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Discretionary remedies</text><text x="119" y="637.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Quashing, prohibiting or mandatory order; declaration; injunction; limited damages. Normally</text><text x="119" y="658.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">refused if it is <tspan font-weight="700" fill="#1e2a44">highly</tspan> <tspan font-weight="700" fill="#1e2a44">likely</tspan> the outcome would not have been substantially different (s31(2A)).</text><circle cx="60" cy="629" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="637.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">6</text>
</svg>