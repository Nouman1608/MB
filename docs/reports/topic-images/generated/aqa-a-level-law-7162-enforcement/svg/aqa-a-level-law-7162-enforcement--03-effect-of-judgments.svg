<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 830" width="900" height="830" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="830" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">After a violation: what happens?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">The Court cannot quash a national law or overturn a domestic decision</text>
<rect x="30" y="124" width="840" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">ARTICLE 41</text><text x="450" y="182.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Just satisfaction</text><text x="450" y="210.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Compensation and costs. Referral to the Grand Chamber within three months in exceptional cases</text><text x="450" y="231.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">(Article 43)</text><line x1="450" y1="261" x2="450" y2="287" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="292" width="840" height="83" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="324" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">ARTICLE 46</text><text x="450" y="350.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">States abide by final judgments; the Committee of Ministers supervises execution</text><rect x="30" y="397" width="412" height="111" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="429" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">INDIVIDUAL MEASURES</text><text x="50" y="455.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">For the claimant</text><text x="50" y="483.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Paying just satisfaction; reopening a case</text><rect x="458" y="397" width="412" height="111" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="478" y="429" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">GENERAL MEASURES</text><text x="478" y="455.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">To prevent repetition</text><text x="478" y="483.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Usually a change in law or practice</text><clipPath id="tc530"><rect x="30" y="530" width="840" height="268" rx="14"/></clipPath><g clip-path="url(#tc530)"><rect x="30" y="530" width="420" height="42" fill="#b5d3cf"/><text x="41" y="554.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">UK judgment</text><rect x="450" y="530" width="420" height="42" fill="#b5d3cf"/><text x="461" y="554.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Response</text><rect x="30" y="572" width="420" height="41" fill="#dce9e7"/><text x="41" y="595.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Sunday Times v UK (1979)</text><rect x="450" y="572" width="420" height="41" fill="#ffffff"/><text x="461" y="595.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Contempt of Court Act 1981</text><line x1="30" y1="613" x2="870" y2="613" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="613" width="420" height="41" fill="#dce9e7"/><text x="41" y="636.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Malone v UK (1984)</text><rect x="450" y="613" width="420" height="41" fill="#f8faf9"/><text x="461" y="636.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Interception of Communications Act 1985</text><line x1="30" y1="654" x2="870" y2="654" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="654" width="420" height="41" fill="#dce9e7"/><text x="41" y="677.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Goodwin v UK (2002)</text><rect x="450" y="654" width="420" height="41" fill="#ffffff"/><text x="461" y="677.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Gender Recognition Act 2004</text><line x1="30" y1="695" x2="870" y2="695" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="695" width="420" height="41" fill="#dce9e7"/><text x="41" y="718.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">S and Marper v UK (2008)</text><rect x="450" y="695" width="420" height="41" fill="#f8faf9"/><text x="461" y="718.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Protection of Freedoms Act 2012</text><line x1="30" y1="736" x2="870" y2="736" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="736" width="420" height="62" fill="#dce9e7"/><text x="41" y="759.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Hirst v UK (No 2) (2005)</text><rect x="450" y="736" width="420" height="62" fill="#ffffff"/><text x="461" y="759.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Delayed over a decade, then limited administrative</text><text x="461" y="780.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">changes accepted</text></g><line x1="450" y1="530" x2="450" y2="798" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="530" width="840" height="268" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/>
</svg>