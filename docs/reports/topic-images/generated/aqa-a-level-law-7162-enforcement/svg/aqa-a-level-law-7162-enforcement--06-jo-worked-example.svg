<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 817" width="900" height="817" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="817" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: Jo’s letters</text>

<rect x="30" y="100" width="840" height="111" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FACTS</text><text x="50" y="164.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A prison governor stops Jo, a prisoner, sending letters to a newspaper about her conviction. Jo</text><text x="50" y="186.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">wants to challenge the decision.</text><line x1="60" y1="253" x2="60" y2="765" stroke="#c9d6d4" stroke-width="4"/><rect x="104" y="233" width="766" height="80" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="119" y="263.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Forum</text><text x="119" y="293.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Domestic first: judicial review in the Administrative Court, relying on Article 10 and the HRA.</text><circle cx="60" cy="273" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="281.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="104" y="323" width="766" height="80" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="119" y="353.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Standing</text><text x="119" y="383.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Directly affected, so a victim (s7(3) HRA).</text><circle cx="60" cy="363" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="371.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="104" y="413" width="766" height="102" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="119" y="443.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Time</text><text x="119" y="473.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Pre-action letter, then claim form promptly and within three months; the HRA one-year limit</text><text x="119" y="495.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">is also met.</text><circle cx="60" cy="464" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="472.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="104" y="525" width="766" height="80" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="119" y="555.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Grounds</text><text x="119" y="585.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Illegality (s6 HRA) and proportionality (<tspan font-style="italic">Daly</tspan>), not just irrationality.</text><circle cx="60" cy="565" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="573.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="104" y="615" width="766" height="80" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="119" y="645.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Remedy</text><text x="119" y="675.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Quashing order and declaration; damages only if needed (s8, <tspan font-style="italic">Greenfield</tspan>).</text><circle cx="60" cy="655" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="663.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><rect x="104" y="705" width="766" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="119" y="735.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">If she loses at the final domestic level</text><text x="119" y="765.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Apply to Strasbourg within four months.</text><circle cx="60" cy="745" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="753.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">6</text>
</svg>