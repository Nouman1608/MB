<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" width="900" height="720" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="720" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Kinds of aid, and tools of trade</text>

<rect x="300" y="110" width="300" height="114" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="149.2" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">Aid</text><text x="450" y="180" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">money, goods or expertise given</text><text x="450" y="200" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">or lent to another country</text><path d="M450,224 L450,250 M165,250 L735,250 M165,250 L165,270 M450,250 L450,270 M735,250 L735,270" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="165" y="296" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">BY ROUTE</text><rect x="30" y="310" width="270" height="104" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="345.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Bilateral</text><text x="50" y="373.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">one government to another</text><rect x="30" y="426" width="270" height="109" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="461.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Multilateral</text><text x="50" y="489.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">through international</text><text x="50" y="510.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">organisations</text><text x="450" y="296" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">BY PURPOSE</text><rect x="315" y="310" width="270" height="104" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="335" y="345.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Humanitarian</text><text x="335" y="373.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">responds to emergencies</text><rect x="315" y="426" width="270" height="104" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="335" y="461.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Development</text><text x="335" y="489.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">supports long-term change</text><text x="735" y="296" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">BY CONDITIONS</text><rect x="600" y="310" width="270" height="109" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="620" y="345.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Tied aid</text><text x="620" y="373.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">receiver must buy goods or</text><text x="620" y="394.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">services from the donor</text><rect x="600" y="426" width="270" height="104" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="620" y="461.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Untied aid</text><text x="620" y="489.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">no such condition</text><text x="450" y="574" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Trade tools</text><rect x="30" y="590" width="268" height="110" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="164" y="626" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Tariff</text><text x="164" y="654.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">a tax on imports</text><rect x="316" y="590" width="268" height="110" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="626" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Quota</text><text x="450" y="654.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">a limit on the amount</text><text x="450" y="675.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">imported</text><rect x="602" y="590" width="268" height="110" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="736" y="626" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Fair trade</text><text x="736" y="654.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">certification for a fairer</text><text x="736" y="675.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">price and conditions</text>
</svg>