<rect width="900" height="631" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Who speaks, and from which level</text>

<circle cx="205" cy="303.5" r="175" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="205" cy="303.5" r="116.66666666666667" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><circle cx="205" cy="303.5" r="58.333333333333336" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="205" y="309.5" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Personal</text><text x="205" y="397" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">National</text><text x="205" y="455.33333333333337" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Global</text><path d="M249.8,304.5 C329.9,304.5 329.9,155.5 406,155.5" fill="none" stroke="#1e2a44" stroke-width="2" stroke-dasharray="5 5"/><circle cx="249.8" cy="304.5" r="4" fill="#1e2a44"/><path d="M249.8,392 C329.9,392 329.9,281.5 406,281.5" fill="none" stroke="#1e2a44" stroke-width="2" stroke-dasharray="5 5"/><circle cx="249.8" cy="392" r="4" fill="#1e2a44"/><path d="M240.6,450.33333333333337 C325.3,450.33333333333337 325.3,429.5 406,429.5" fill="none" stroke="#1e2a44" stroke-width="2" stroke-dasharray="5 5"/><circle cx="240.6" cy="450.33333333333337" r="4" fill="#1e2a44"/><rect x="410" y="104" width="460" height="103" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="426" y="135.2" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="start">Personal</text><text x="426" y="164.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">A farmer or factory worker: wages, prices, job</text><text x="426" y="186.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">security.</text><rect x="410" y="219" width="460" height="125" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="426" y="250.2" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="start">National</text><text x="426" y="279.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">An exporters’ association: gains if tariffs</text><text x="426" y="301.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">fall. A donor-country taxpayer or politician:</text><text x="426" y="323.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">value for money, spending at home.</text><rect x="410" y="356" width="460" height="147" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="426" y="387.2" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Global</text><text x="426" y="416.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">An international organisation: targets such as</text><text x="426" y="438.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">the UN Sustainable Development Goals (2015). An</text><text x="426" y="460.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">aid charity: urgent needs, but it may also need</text><text x="426" y="482.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">funding to survive.</text><rect x="30" y="521" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="554.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A perspective is stronger when its evidence is relevant and checkable, weaker when it rests</text><text x="50" y="576.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">on assertion or a vested interest.</text>
</svg>