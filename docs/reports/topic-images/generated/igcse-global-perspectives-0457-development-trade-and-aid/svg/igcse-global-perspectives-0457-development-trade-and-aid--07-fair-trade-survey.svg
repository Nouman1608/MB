troke-width="1.8"/><circle cx="290" cy="374" r="8.5" fill="#ffffff" stroke="#1e2a44" stroke-width="1.8"/><circle cx="312" cy="374" r="8.5" fill="#ffffff" stroke="#1e2a44" stroke-width="1.8"/><circle cx="334" cy="374" r="8.5" fill="#ffffff" stroke="#1e2a44" stroke-width="1.8"/><circle cx="356" cy="374" r="8.5" fill="#ffffff" stroke="#1e2a44" stroke-width="1.8"/><circle cx="378" cy="374" r="8.5" fill="#ffffff" stroke="#1e2a44" stroke-width="1.8"/><circle cx="400" cy="374" r="8.5" fill="#ffffff" stroke="#1e2a44" stroke-width="1.8"/><circle cx="422" cy="374" r="8.5" fill="#ffffff" stroke="#1e2a44" stroke-width="1.8"/><circle cx="444" cy="374" r="8.5" fill="#ffffff" stroke="#1e2a44" stroke-width="1.8"/><circle cx="466" cy="374" r="8.5" fill="#ffffff" stroke="#1e2a44" stroke-width="1.8"/><circle cx="488" cy="374" r="8.5" fill="#ffffff" stroke="#1e2a44" stroke-width="1.8"/><text x="61" y="410" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="start">30 say they always buy it</text><text x="61" y="432" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">90 do not</text><rect x="530" y="250" width="340" height="132" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="550" y="284.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The figure may work against</text><text x="550" y="308.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">the claim</text><text x="550" y="336.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">If a quarter always buy fair trade,</text><text x="550" y="357.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">three-quarters do not.</text><rect x="40" y="472.5" width="40" height="40" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><path d="M51,483.5 l18,18 m0,-18 l-18,18" fill="none" stroke="#b5602e" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><rect x="94" y="455" width="776" height="75" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="108" y="483.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Run by a campaign group</text><text x="108" y="511.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A vested interest in showing support.</text><rect x="40" y="555.5" width="40" height="40" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><path d="M51,566.5 l18,18 m0,-18 l-18,18" fill="none" stroke="#b5602e" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><rect x="94" y="538" width="776" height="75" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="108" y="566.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">120 people in one town</text><text x="108" y="594.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Cannot represent “the public” as a whole.</text><rect x="40" y="638.5" width="40" height="40" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><path d="M51,649.5 l18,18 m0,-18 l-18,18" fill="none" stroke="#b5602e" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><rect x="94" y="621" width="776" height="75" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="108" y="649.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">What people say they do</text><text x="108" y="677.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">May differ from what they actually buy.</text><rect x="30" y="714" width="840" height="90" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="750" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Better evidence</text><text x="50" y="779.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Independent sales data from several areas would be more reliable.</text>
