<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 564" width="900" height="564" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="564" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Two published perspectives on aid</text>

<rect x="30" y="104" width="408" height="160" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="137" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">JEFFREY SACHS, THE END OF POVERTY (2005)</text><text x="50" y="164.8" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">More, well-planned aid</text><text x="50" y="195.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Increases in aid could end extreme</text><text x="50" y="217.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">poverty.</text><rect x="462" y="104" width="408" height="160" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="482" y="137" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">DAMBISA MOYO, DEAD AID (2009)</text><text x="482" y="164.8" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Trade and investment instead</text><text x="482" y="195.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Long-term government-to-government aid</text><text x="482" y="217.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">harmed many African countries by</text><text x="482" y="239.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">encouraging dependency and corruption.</text><text x="450" y="302" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Each can be challenged</text><rect x="30" y="328" width="408" height="108" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="361" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">CRITICS OF SACHS</text><text x="50" y="386.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Can large aid programmes be managed</text><text x="50" y="410.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">well?</text><rect x="462" y="328" width="408" height="108" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="482" y="361" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">CRITICS OF MOYO</text><text x="482" y="386.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">In areas such as vaccination, aid</text><text x="482" y="410.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">has clear results.</text><rect x="30" y="454" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="487.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Neither is “the right answer”. Both use evidence and reasoning, so judge how well each</text><text x="50" y="509.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">holds up.</text>
</svg>