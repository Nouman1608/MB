<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 599" width="900" height="599" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="599" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Rana Plaza: who answers for factory conditions?</text>

<rect x="200" y="110" width="500" height="139" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="143" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">BANGLADESH, APRIL 2013</text><text x="450" y="171.6" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Rana Plaza collapses</text><text x="450" y="202.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">The building housed garment factories. More than</text><text x="450" y="224.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">1,100 people died, most of them garment workers.</text><text x="450" y="305" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Who is responsible for conditions in export industries?</text><rect x="30" y="405" width="260" height="90" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="160" y="454.7" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Factory owners</text><rect x="320" y="405" width="260" height="90" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="442.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">The national</text><text x="450" y="467.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">government</text><rect x="610" y="405" width="260" height="90" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="740" y="442.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">International brands</text><text x="740" y="467.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">that buy the clothes</text><path d="M450,321 L450,397 M450,345 L160,345 L160,397 M450,345 L740,345 L740,397" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><rect x="30" y="515" width="840" height="58" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="548.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">An issue that crosses levels: a local workplace, a national government and global buyers.</text>
</svg>