<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 820" width="900" height="820" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="820" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A chain, not a list: removing a clothing tariff</text>

<rect x="190" y="110" width="520" height="56" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="142.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Tariff on imported clothing removed</text><line x1="450" y1="169" x2="450" y2="191" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="190" y="194" width="520" height="56" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="226.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Exporters win more orders</text><line x1="450" y1="253" x2="450" y2="275" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="190" y="278" width="520" height="56" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="310.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">More factory jobs</text><line x1="450" y1="337" x2="450" y2="359" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="190" y="362" width="520" height="56" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="394.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Higher household incomes</text><line x1="450" y1="421" x2="450" y2="443" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="190" y="446" width="520" height="56" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="478.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">But more pressure on workers to meet deadlines</text><path d="M450,502 L450,526 M230,526 L670,526" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><line x1="230" y1="526" x2="230" y2="548" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="670" y1="526" x2="670" y2="548" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="462" y="516" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">depends on</text><rect x="80" y="552" width="300" height="84" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="230" y="598.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Labour standards enforced</text><rect x="520" y="552" width="300" height="84" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="670" y="586.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Labour standards not</text><text x="670" y="610.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">enforced</text><rect x="30" y="660" width="408" height="129" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="694.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Short term or long term?</text><text x="50" y="722.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Cutting aid may save a donor money now,</text><text x="50" y="743.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">while effects on health services last for</text><text x="50" y="764.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">years.</text><rect x="462" y="660" width="408" height="129" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="482" y="694.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Who gains, who loses?</text><text x="482" y="722.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Most issues have several causes, and a</text><text x="482" y="743.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">source may give only one.</text>
</svg>