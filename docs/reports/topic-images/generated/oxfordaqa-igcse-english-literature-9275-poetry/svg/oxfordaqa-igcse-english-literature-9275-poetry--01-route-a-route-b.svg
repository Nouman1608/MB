<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">One anthology question, two papers</text>

<text x="30" y="130" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Route A</text><text x="124.5" y="130" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Paper 2a: Poetry and Unseen Texts · 2 h 15 min, 90 marks, 60%</text><rect x="30" y="144" width="280" height="74" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="170" y="176" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Anthology poetry</text><text x="170" y="202" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">30 marks · about 45 min</text><rect x="310" y="144" width="280" height="74" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="187" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Unseen poetry</text><rect x="590" y="144" width="280" height="74" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="730" y="187" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Unseen prose</text><text x="30" y="260" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="start">Route B</text><text x="124.5" y="260" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Paper 2b: Poetry · 1 h 30 min, 60 marks, 40%</text><rect x="30" y="274" width="280" height="74" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="170" y="306" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Anthology poetry</text><text x="170" y="332" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">30 marks · about 45 min</text><rect x="310" y="274" width="280" height="74" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="317" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Unseen poetry</text><rect x="30" y="400" width="410" height="140" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="435.2" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">The same on both routes</text><text x="50" y="463.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="463.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The People and Places anthology</text><text x="50" y="489.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="489.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">One question from a choice of two, 30 marks</text><text x="50" y="515.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="515.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Open book: the anthology is supplied</text><rect x="460" y="400" width="410" height="140" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="480" y="435.2" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="start">Watch out on Route A</text><text x="480" y="463.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A longer paper makes it easier to overrun on</text><text x="480" y="484.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the familiar anthology question and leave</text><text x="480" y="505.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">too little time for unseen prose.</text>
