<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 755" width="900" height="755" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="755" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">An integrated comparison</text>

<rect x="30" y="116" width="405" height="114" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="149" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">POEM X (ORIGINAL LINES)</text><text x="50" y="180.4" font-size="18" font-weight="400" font-style="italic" fill="#1e2a44" text-anchor="start">The bus pulls out. I count the roofs /</text><text x="50" y="204.4" font-size="18" font-weight="400" font-style="italic" fill="#1e2a44" text-anchor="start">until the roofs run out.</text><rect x="465" y="116" width="405" height="114" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="485" y="149" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">POEM Y (ORIGINAL LINES)</text><text x="485" y="180.4" font-size="18" font-weight="400" font-style="italic" fill="#1e2a44" text-anchor="start">What I carry is not the street /</text><text x="485" y="204.4" font-size="18" font-weight="400" font-style="italic" fill="#1e2a44" text-anchor="start">but the weight of being from it.</text><rect x="110" y="250" width="680" height="85" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="283" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">BOTH</text><text x="450" y="309.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Leaving is a loss the speaker cannot fully control</text><text x="450" y="359" font-size="17" font-weight="700" fill="#4a5568" text-anchor="middle">but they locate the loss differently</text><rect x="30" y="375" width="340" height="78" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="407.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">External and visual: the reader</text><text x="50" y="428.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">watches the place disappear</text><rect x="530" y="375" width="340" height="78" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="550" y="407.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Inside the speaker: identity, not</text><text x="550" y="428.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">geography</text><text x="450" y="389" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Where the</text><text x="450" y="408" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">loss is</text><line x1="376" y1="430" x2="524" y2="430" stroke="#1e2a44" stroke-width="2.5" marker-start="url(#ah)" marker-end="url(#ah)"/><rect x="30" y="465" width="340" height="78" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="497.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“roofs” repeated across the line</text><text x="50" y="518.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">break mimics the town shrinking</text><rect x="530" y="465" width="340" height="78" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="550" y="497.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The negative “not the street / but…”</text><text x="550" y="518.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">rejects the physical place</text><text x="450" y="498" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Structure</text><line x1="376" y1="520" x2="524" y2="520" stroke="#1e2a44" stroke-width="2.5" marker-start="url(#ah)" marker-end="url(#ah)"/><rect x="30" y="555" width="340" height="78" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="587.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The image ends when the roofs “run</text><text x="50" y="608.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">out”</text><rect x="530" y="555" width="340" height="78" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="550" y="587.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The weight never runs out: leaving</text><text x="550" y="608.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">is permanent</text><text x="450" y="569" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">How long</text><text x="450" y="588" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">it lasts</text><line x1="376" y1="610" x2="524" y2="610" stroke="#1e2a44" stroke-width="2.5" marker-start="url(#ah)" marker-end="url(#ah)"/><rect x="30" y="651" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="684.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">One point, both poems, comparative connectives (“but”, “by contrast”, “whereas”), brief</text><text x="50" y="706.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">quotations, and structure as well as language.</text>
</svg>