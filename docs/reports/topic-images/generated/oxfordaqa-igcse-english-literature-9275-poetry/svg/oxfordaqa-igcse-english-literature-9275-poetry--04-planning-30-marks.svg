<rect width="900" height="731" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Planning a 30-mark comparison</text>

<line x1="62" y1="136" x2="62" y2="563" stroke="#c9d6d4" stroke-width="4"/><rect x="108" y="116" width="762" height="87" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="150.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Underline</text><text x="128" y="178.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The theme and the command words.</text><circle cx="62" cy="159.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="168.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="108" y="211" width="762" height="87" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="245.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Choose your poems</text><text x="128" y="273.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">If the question leaves the choice to you: the best contrast within the theme.</text><circle cx="62" cy="254.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="263.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="108" y="306" width="762" height="87" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="340.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">One-sentence argument</text><text x="128" y="368.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">“Both present…, but X… whereas Y…”</text><circle cx="62" cy="349.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="358.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="108" y="401" width="762" height="87" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="128" y="435.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Three comparative points</text><text x="128" y="463.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Each covering both poems, e.g. voice and perspective, imagery, form or structure.</text><circle cx="62" cy="444.5" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="62" y="453.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="108" y="496" width="762" height="87" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="530.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Context, only if it helps</text><text x="128" y="558.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">One piece per poem, only if it explains a choice in the poem.</text><circle cx="62" cy="539.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="548.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="30" y="609" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Then write</text><rect x="30" y="623" width="76.36363636363636" height="56" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="68.18181818181819" y="657" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Intro</text><rect x="106.36363636363636" y="623" width="229.0909090909091" height="56" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="220.9090909090909" y="657" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Point 1: X + Y</text><rect x="335.45454545454544" y="623" width="229.0909090909091" height="56" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="657" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Point 2: X + Y</text><rect x="564.5454545454545" y="623" width="229.0909090909091" height="56" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="679.090909090909" y="657" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Point 3: X + Y</text><rect x="793.6363636363636" y="623" width="76.36363636363636" height="56" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="831.8181818181818" y="657" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">End</text><text x="450" y="707" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">about five minutes planning; about 45 minutes in all</text>
</svg>