<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1035" width="900" height="1035" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="1035" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Albert Cohen: delinquent subcultures</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Delinquent Boys (1955), functionalist</text>
<rect x="30" y="120" width="840" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="67" cy="168" r="21" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="67" y="175.56" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="104" y="159.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Same success goals</text><text x="104" y="189.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Working-class boys hold the same success goals as wider society.</text><line x1="450" y1="220" x2="450" y2="256" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="262" width="840" height="118" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="67" cy="321" r="21" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="67" y="328.56" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="104" y="301.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Blocked</text><text x="104" y="331.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Educational failure (which Cohen put down to <tspan font-weight="700">cultural deprivation</tspan>) and poor job</text><text x="104" y="353.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">prospects.</text><line x1="450" y1="384" x2="450" y2="420" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="426" width="840" height="96" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="67" cy="474" r="21" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="67" y="481.56" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="104" y="465.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Status frustration</text><text x="104" y="495.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Stuck at the bottom of the stratification system.</text><line x1="450" y1="526" x2="450" y2="562" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="568" width="840" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="67" cy="616" r="21" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="67" y="623.56" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="104" y="607.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Delinquent subculture</text><text x="104" y="637.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">An alternative route to success that values stealing, vandalism and truancy.</text><line x1="450" y1="668" x2="450" y2="704" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="710" width="840" height="118" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="67" cy="769" r="21" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="67" y="776.56" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="104" y="749.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Recognition and prestige</text><text x="104" y="779.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Those who do well by the subculture’s values, such as a successful thief, gain status</text><text x="104" y="801.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">from peers.</text><rect x="30" y="846" width="840" height="163" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="882" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Evaluation</text><circle cx="61" cy="905.39" r="4.5" fill="#8a6d0d"/><text x="74" y="911" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Strength:</tspan> explains non-financial crime such as vandalism, which Merton’s focus on money</text><text x="74" y="933" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">does not</text><circle cx="61" cy="957.39" r="4.5" fill="#8a6d0d"/><text x="74" y="963" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Criticism:</tspan> some argue working-class youths do not accept mainstream goals at all, but act</text><text x="74" y="985" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">out of resentment towards those whose values they do not share</text>
</svg>