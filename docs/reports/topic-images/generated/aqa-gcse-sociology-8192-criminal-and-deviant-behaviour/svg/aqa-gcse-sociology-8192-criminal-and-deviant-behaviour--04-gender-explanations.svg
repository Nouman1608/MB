<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 489" width="900" height="489" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="489" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why do men commit more recorded crime?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Men commit far more recorded crime, especially violent crime</text>
<rect x="30" y="124" width="269.3333333333333" height="200" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,174 L31.25,138.25 Q31.25,125.25 44.25,125.25 L285.0833333333333,125.25 Q298.0833333333333,125.25 298.0833333333333,138.25 L298.0833333333333,174 Z" fill="#b5d3cf"/><line x1="31.25" y1="174" x2="298.0833333333333" y2="174" stroke="#c9d6d4" stroke-width="2"/><text x="164.66666666666666" y="155" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Social control</text><text x="44" y="206.15" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="start">Heidensohn</text><text x="44" y="234.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Patriarchal societies</text><text x="44" y="256.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">control women more</text><text x="44" y="278.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">effectively at home, in</text><text x="44" y="300.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">public and at work.</text><rect x="315.3333333333333" y="124" width="269.3333333333333" height="200" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M316.5833333333333,174 L316.5833333333333,138.25 Q316.5833333333333,125.25 329.5833333333333,125.25 L570.4166666666666,125.25 Q583.4166666666666,125.25 583.4166666666666,138.25 L583.4166666666666,174 Z" fill="#dce9e7"/><line x1="316.5833333333333" y1="174" x2="583.4166666666666" y2="174" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="155" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Socialisation</text><text x="329.3333333333333" y="206.15" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="start">How children are raised</text><text x="329.3333333333333" y="234.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Boys more often encouraged</text><text x="329.3333333333333" y="256.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">to be tough and risk-taking;</text><text x="329.3333333333333" y="278.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">girls to be caring and</text><text x="329.3333333333333" y="300.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">careful.</text><rect x="600.6666666666666" y="124" width="269.3333333333333" height="200" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.9166666666666,174 L601.9166666666666,138.25 Q601.9166666666666,125.25 614.9166666666666,125.25 L855.75,125.25 Q868.75,125.25 868.75,138.25 L868.75,174 Z" fill="#f2e7b8"/><line x1="601.9166666666666" y1="174" x2="868.75" y2="174" stroke="#c9d6d4" stroke-width="2"/><text x="735.3333333333333" y="155" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Chivalry thesis</text><text x="614.6666666666666" y="206.15" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="start">Pollak (1950)</text><text x="614.6666666666666" y="234.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A male-dominated justice</text><text x="614.6666666666666" y="256.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">system treats women more</text><text x="614.6666666666666" y="278.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">leniently, so female crime</text><text x="614.6666666666666" y="300.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">is under-recorded.</text><text x="165" y="354" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle" font-style="italic">about offending</text><text x="450" y="354" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle" font-style="italic">about offending</text><text x="735" y="354" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle" font-style="italic">about recording</text><rect x="30" y="376" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="412" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Criticism of the chivalry thesis</text><text x="56" y="441" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Women who break gender norms may be treated more harshly, not less.</text>
</svg>