<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 654" width="900" height="654" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="654" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Ethnicity and age</text>

<rect x="30" y="108" width="404" height="520" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,159 L31.25,122.25 Q31.25,109.25 44.25,109.25 L419.75,109.25 Q432.75,109.25 432.75,122.25 L432.75,159 Z" fill="#b5d3cf"/><line x1="31.25" y1="159" x2="432.75" y2="159" stroke="#c9d6d4" stroke-width="2"/><text x="232" y="139.9" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Ethnicity</text><text x="48" y="190" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">Some minority groups, particularly Black</text><text x="48" y="211" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">people, are over-represented in stop and</text><text x="48" y="232" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">search, arrest and imprisonment.</text><circle cx="53" cy="282.39" r="4.5" fill="#2e6b62"/><text x="66" y="288" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Discrimination and labelling:</tspan> the</text><text x="66" y="310" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Macpherson Report (1999) found the</text><text x="66" y="332" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Metropolitan Police institutionally</text><text x="66" y="354" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">racist</text><circle cx="53" cy="378.39" r="4.5" fill="#2e6b62"/><text x="66" y="384" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Deprivation:</tspan> class and ethnicity overlap</text><circle cx="53" cy="408.39" r="4.5" fill="#2e6b62"/><text x="66" y="414" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Media stereotypes</tspan> shape public fears and</text><text x="66" y="436" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">police priorities</text><rect x="48" y="520" width="368" height="90" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="64" y="550" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Debate: differences in offending, in</text><text x="64" y="572" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">policing, or both?</text><rect x="466" y="108" width="404" height="520" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M467.25,159 L467.25,122.25 Q467.25,109.25 480.25,109.25 L855.75,109.25 Q868.75,109.25 868.75,122.25 L868.75,159 Z" fill="#f2e7b8"/><line x1="467.25" y1="159" x2="868.75" y2="159" stroke="#c9d6d4" stroke-width="2"/><text x="668" y="139.9" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Age</text><line x1="500" y1="400" x2="840" y2="400" stroke="#1e2a44" stroke-width="2.5"/><line x1="500" y1="400" x2="500" y2="210" stroke="#1e2a44" stroke-width="2.5"/><path d="M530,396 C580,380 595,230 620,230 C660,230 690,330 830,370" fill="none" stroke="#2e6b62" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><text x="620" y="218" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">peak: late teens, early 20s</text><text x="840" y="424" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">age →</text><text x="490" y="305" font-size="15" fill="#4a5568" text-anchor="middle" transform="rotate(-90 490 305)">recorded offending</text><line x1="530" y1="400" x2="530" y2="410" stroke="#b5602e" stroke-width="3"/><text x="530" y="426" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">10</text><circle cx="489" cy="444.72" r="4.5" fill="#2e6b62"/><text x="502" y="450" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">More time in public spaces, more visible to</text><text x="502" y="471" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">police</text><circle cx="489" cy="491.72" r="4.5" fill="#2e6b62"/><text x="502" y="497" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Peer pressure and subcultures matter more</text><circle cx="489" cy="517.72" r="4.5" fill="#2e6b62"/><text x="502" y="523" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Less to lose: no careers, mortgages or</text><text x="502" y="544" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">children yet</text><circle cx="489" cy="564.72" r="4.5" fill="#2e6b62"/><text x="502" y="570" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Adolescent risk-taking</text><circle cx="489" cy="590.72" r="4.5" fill="#2e6b62"/><text x="502" y="596" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Age of criminal responsibility: 10</text>
</svg>