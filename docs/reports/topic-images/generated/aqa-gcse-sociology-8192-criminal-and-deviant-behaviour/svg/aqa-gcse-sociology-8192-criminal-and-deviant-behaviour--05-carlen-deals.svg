<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 855" width="900" height="855" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="855" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Carlen: women, crime and poverty (1988)</text>

<rect x="30" y="108" width="840" height="62" rx="12" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="146" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Unstructured interviews with 39 mostly working-class convicted women, aged 15 to 46</text><rect x="30" y="186" width="840" height="76" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="50" y="216" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Control theory</text><text x="50" y="244" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">People make a rational decision to turn to crime when the advantages outweigh the disadvantages.</text><rect x="30" y="282" width="404" height="266" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,332 L31.25,296.25 Q31.25,283.25 44.25,283.25 L419.75,283.25 Q432.75,283.25 432.75,296.25 L432.75,332 Z" fill="#b5d3cf"/><line x1="31.25" y1="332" x2="432.75" y2="332" stroke="#c9d6d4" stroke-width="2"/><text x="232" y="312.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">The class deal</text><rect x="50" y="348" width="364" height="64" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="66" y="372" font-size="15" font-weight="600" fill="#4a5568" text-anchor="start">Women give</text><text x="66" y="398" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">wage labour</text><line x1="232" y1="416" x2="232" y2="444" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="50" y="448" width="364" height="84" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="66" y="474" font-size="15" font-weight="600" fill="#4a5568" text-anchor="start">in return for</text><text x="66" y="500" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">consumer goods</text><rect x="466" y="282" width="404" height="266" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M467.25,332 L467.25,296.25 Q467.25,283.25 480.25,283.25 L855.75,283.25 Q868.75,283.25 868.75,296.25 L868.75,332 Z" fill="#f2e7b8"/><line x1="467.25" y1="332" x2="868.75" y2="332" stroke="#c9d6d4" stroke-width="2"/><text x="668" y="312.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">The gender deal</text><rect x="486" y="348" width="364" height="64" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="502" y="372" font-size="15" font-weight="600" fill="#4a5568" text-anchor="start">Women give</text><text x="502" y="398" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">love and domestic labour</text><line x1="668" y1="416" x2="668" y2="444" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="486" y="448" width="364" height="84" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="502" y="474" font-size="15" font-weight="600" fill="#4a5568" text-anchor="start">in return for</text><text x="502" y="500" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">psychological and material rewards</text><text x="502" y="522" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">from a male breadwinner</text><path d="M232,552 L232,576 L668,576 L668,552" fill="none" stroke="#b5602e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><line x1="450" y1="576" x2="450" y2="612" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><text x="462" y="600" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">rewards unavailable or illusory</text><rect x="250" y="616" width="400" height="56" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="651" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Criminality becomes a viable alternative</text><rect x="30" y="690" width="840" height="141" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="726" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Why the deals fail, and evaluation</text><circle cx="61" cy="749.39" r="4.5" fill="#8a6d0d"/><text x="74" y="755" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Poverty, unemployment, abuse or time in care</text><circle cx="61" cy="779.39" r="4.5" fill="#8a6d0d"/><text x="74" y="785" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Small sample, but detailed, valid accounts; supports the view that crime rises when social</text><text x="74" y="807" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">control breaks down</text>
</svg>