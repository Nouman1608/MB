<rect width="900" height="477" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Media coverage: moral panics</text>

<rect x="30" y="118" width="184.5" height="133" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="122.25" y="151.8" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Exaggerated</text><text x="122.25" y="175.8" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">reporting</text><text x="122.25" y="205.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">News values favour</text><text x="122.25" y="226.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">rare, violent crime</text><line x1="218.5" y1="184.5" x2="244.5" y2="184.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="248.5" y="118" width="184.5" height="133" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="340.75" y="163.8" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Folk devils</text><text x="340.75" y="193.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">A group is turned</text><text x="340.75" y="214.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">into a threat</text><line x1="437" y1="184.5" x2="463" y2="184.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="467" y="118" width="184.5" height="133" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="559.25" y="150.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Public concern</text><text x="559.25" y="174.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">and police</text><text x="559.25" y="198.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">attention</text><text x="559.25" y="228.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">A moral panic</text><line x1="655.5" y1="184.5" x2="681.5" y2="184.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="685.5" y="118" width="184.5" height="133" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="777.75" y="151.8" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">More recorded</text><text x="777.75" y="175.8" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">deviance</text><text x="777.75" y="205.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Deviancy</text><text x="777.75" y="226.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">amplification</text><text x="450" y="281" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Stanley Cohen, Folk Devils and Moral Panics (1972): reactions to mods and rockers</text><rect x="30" y="303" width="390" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,353 L31.25,317.25 Q31.25,304.25 44.25,304.25 L405.75,304.25 Q418.75,304.25 418.75,317.25 L418.75,353 Z" fill="#b5d3cf"/><line x1="31.25" y1="353" x2="418.75" y2="353" stroke="#c9d6d4" stroke-width="2"/><text x="225" y="334" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Albert Cohen</text><text x="44" y="385.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Delinquent subcultures and status</text><text x="44" y="407.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">frustration (named in the specification)</text><rect x="480" y="303" width="390" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M481.25,353 L481.25,317.25 Q481.25,304.25 494.25,304.25 L855.75,304.25 Q868.75,304.25 868.75,317.25 L868.75,353 Z" fill="#f2e7b8"/><line x1="481.25" y1="353" x2="868.75" y2="353" stroke="#c9d6d4" stroke-width="2"/><text x="675" y="334" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Stanley Cohen</text><text x="494" y="385.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Moral panics and folk devils (not named in</text><text x="494" y="407.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">the specification, but the terms are key</text><text x="494" y="429.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">terms)</text><text x="450" y="386" font-size="34" font-weight="700" fill="#b5602e" text-anchor="middle">≠</text>
</svg>