<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 458" width="900" height="458" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="458" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Social class: two kinds of explanation</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Why are working-class people over-represented in the statistics?</text>
<rect x="30" y="150" width="404" height="282" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,200 L31.25,164.25 Q31.25,151.25 44.25,151.25 L419.75,151.25 Q432.75,151.25 432.75,164.25 L432.75,200 Z" fill="#b5d3cf"/><line x1="31.25" y1="200" x2="432.75" y2="200" stroke="#c9d6d4" stroke-width="2"/><text x="232" y="180.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Explain more offending</text><circle cx="53" cy="230.79" r="4.5" fill="#2e6b62"/><text x="66" y="236.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Blocked opportunities (Merton):</tspan> success</text><text x="66" y="258.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">goals but no legitimate means, so some</text><text x="66" y="280.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">turn to innovation</text><circle cx="53" cy="304.78999999999996" r="4.5" fill="#2e6b62"/><text x="66" y="310.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Status frustration (Albert Cohen):</tspan> a</text><text x="66" y="332.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">delinquent subculture offers another</text><text x="66" y="354.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">route</text><circle cx="53" cy="378.78999999999996" r="4.5" fill="#2e6b62"/><text x="66" y="384.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Material deprivation:</tspan> poverty may push</text><text x="66" y="406.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">some towards property crime</text><rect x="466" y="150" width="404" height="282" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M467.25,200 L467.25,164.25 Q467.25,151.25 480.25,151.25 L855.75,151.25 Q868.75,151.25 868.75,164.25 L868.75,200 Z" fill="#f2e7b8"/><line x1="467.25" y1="200" x2="868.75" y2="200" stroke="#c9d6d4" stroke-width="2"/><text x="668" y="180.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Explain the recording</text><circle cx="489" cy="230.79" r="4.5" fill="#8a6d0d"/><text x="502" y="236.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Labelling (interactionist):</tspan> police patrol</text><text x="502" y="258.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">working-class areas more and see</text><text x="502" y="280.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">working-class youths as likely offenders</text><circle cx="489" cy="304.78999999999996" r="4.5" fill="#8a6d0d"/><text x="502" y="310.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Crimes of the powerful (Marxist):</tspan> white</text><text x="502" y="332.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">collar and corporate crime are harder to</text><text x="502" y="354.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">detect, less often prosecuted and often</text><text x="502" y="376.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">dealt with outside the courts, so they</text><text x="502" y="398.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">are under-represented</text><circle cx="450" cy="291" r="24" fill="#1e2a44"/><text x="450" y="298" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">vs</text>
</svg>