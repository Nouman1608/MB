<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Who commits crime, or who gets recorded?</text>

<rect x="40" y="112" width="700" height="70" rx="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="390" y="144" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Commits crime</text><text x="390" y="168" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">everyone who offends</text><line x1="390" y1="186" x2="390" y2="212" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="110" y="216" width="560" height="70" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="390" y="248" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Caught</text><text x="390" y="272" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">depends partly on policing</text><line x1="390" y1="290" x2="390" y2="316" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="180" y="320" width="420" height="70" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="390" y="352" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Recorded</text><text x="390" y="376" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">by the police</text><line x1="390" y1="394" x2="390" y2="420" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="240" y="424" width="300" height="70" rx="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="390" y="456" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Convicted</text><text x="390" y="480" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">in the courts</text><path d="M680,216 L700,216 L700,494 L550,494" fill="none" stroke="#8a6d0d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 6"/><text x="715" y="300" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="start">what</text><text x="715" y="322" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="start">official</text><text x="715" y="344" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="start">statistics</text><text x="715" y="366" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="start">measure</text><text x="450" y="520" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">A group can appear more often in the statistics because…</text><rect x="30" y="538" width="269.3333333333333" height="128" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,588 L31.25,552.25 Q31.25,539.25 44.25,539.25 L285.0833333333333,539.25 Q298.0833333333333,539.25 298.0833333333333,552.25 L298.0833333333333,588 Z" fill="#b5d3cf"/><line x1="31.25" y1="588" x2="298.0833333333333" y2="588" stroke="#c9d6d4" stroke-width="2"/><text x="164.66666666666666" y="568.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">It offends more</text><text x="44" y="620.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A real difference in</text><text x="44" y="642.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">offending</text><rect x="315.3333333333333" y="538" width="269.3333333333333" height="128" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M316.5833333333333,588 L316.5833333333333,552.25 Q316.5833333333333,539.25 329.5833333333333,539.25 L570.4166666666666,539.25 Q583.4166666666666,539.25 583.4166666666666,552.25 L583.4166666666666,588 Z" fill="#f2e7b8"/><line x1="316.5833333333333" y1="588" x2="583.4166666666666" y2="588" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="568.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">It is policed more</text><text x="329.3333333333333" y="620.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">More attention means more</text><text x="329.3333333333333" y="642.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">arrests</text><rect x="600.6666666666666" y="538" width="269.3333333333333" height="128" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.9166666666666,588 L601.9166666666666,552.25 Q601.9166666666666,539.25 614.9166666666666,539.25 L855.75,539.25 Q868.75,539.25 868.75,552.25 L868.75,588 Z" fill="#dce9e7"/><line x1="601.9166666666666" y1="588" x2="868.75" y2="588" stroke="#c9d6d4" stroke-width="2"/><text x="735.3333333333333" y="568.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Or both</text><text x="614.6666666666666" y="620.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The two can combine</text>
