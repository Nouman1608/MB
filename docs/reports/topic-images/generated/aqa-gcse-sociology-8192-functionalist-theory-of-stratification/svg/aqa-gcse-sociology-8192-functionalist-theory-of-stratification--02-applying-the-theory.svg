<rect width="900" height="533" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Applying the theory: two roles compared</text>

<rect x="30" y="104" width="404" height="274" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,182 L31.25,118.25 Q31.25,105.25 44.25,105.25 L419.75,105.25 Q432.75,105.25 432.75,118.25 L432.75,182 Z" fill="#b5d3cf"/><line x1="31.25" y1="182" x2="432.75" y2="182" stroke="#c9d6d4" stroke-width="2"/><text x="232" y="148.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Air traffic controller</text><circle cx="53" cy="212.79" r="4.5" fill="#2e6b62"/><text x="66" y="218.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Needs <tspan font-weight="700">rare skills</tspan></text><circle cx="53" cy="242.79" r="4.5" fill="#2e6b62"/><text x="66" y="248.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Carries responsibility for many lives</text><circle cx="53" cy="272.78999999999996" r="4.5" fill="#2e6b62"/><text x="66" y="278.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Long, selective training</text><circle cx="53" cy="302.78999999999996" r="4.5" fill="#2e6b62"/><text x="66" y="308.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">High pay and prestige</tspan> attract able</text><text x="66" y="330.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">candidates, make training worthwhile and</text><text x="66" y="352.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">encourage careful work</text><rect x="466" y="104" width="404" height="274" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M467.25,182 L467.25,118.25 Q467.25,105.25 480.25,105.25 L855.75,105.25 Q868.75,105.25 868.75,118.25 L868.75,182 Z" fill="#f2e7b8"/><line x1="467.25" y1="182" x2="868.75" y2="182" stroke="#c9d6d4" stroke-width="2"/><text x="668" y="134.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">A role almost anyone could learn</text><text x="668" y="162.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">quickly</text><circle cx="489" cy="212.79" r="4.5" fill="#8a6d0d"/><text x="502" y="218.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Common skills</text><circle cx="489" cy="242.79" r="4.5" fill="#8a6d0d"/><text x="502" y="248.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Short training</text><circle cx="489" cy="272.78999999999996" r="4.5" fill="#8a6d0d"/><text x="502" y="278.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Lower rewards</tspan> are enough to fill it</text><circle cx="450" cy="241" r="24" fill="#1e2a44"/><text x="450" y="248" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">vs</text><rect x="30" y="396" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="432" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">When you apply it</text><text x="56" y="461" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Name the four needs or functional importance and show how the example fits. Do not stop at</text><text x="56" y="483" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">“doctors earn a lot”.</text>
</svg>