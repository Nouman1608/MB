<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 548" width="900" height="548" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="548" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Anatomy of a strong paragraph</text>

<rect x="30" y="108" width="170" height="96" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="115" y="163" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Point</text><rect x="212" y="108" width="490" height="96" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="226" y="139.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Davis and Moore argue that unequal rewards make sure</text><text x="226" y="161.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">functionally important roles are filled by the most</text><text x="226" y="183.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">able people.</text><text x="716" y="150.25" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start" font-style="italic">names the theory</text><text x="716" y="170.25" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start" font-style="italic">accurately</text><rect x="30" y="214" width="170" height="96" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="115" y="269" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Application</text><rect x="212" y="214" width="490" height="96" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="226" y="245.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A hospital consultant trains for many years, so high</text><text x="226" y="267.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">pay is the incentive that makes the training</text><text x="226" y="289.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">worthwhile.</text><text x="716" y="266.25" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start" font-style="italic">a specific example</text><rect x="30" y="320" width="170" height="96" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="115" y="375" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Analysis</text><rect x="212" y="320" width="490" height="96" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="226" y="351.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Without the reward fewer able people would train, and</text><text x="226" y="373.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">the health service would suffer, so stratification is</text><text x="226" y="395.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">functional.</text><text x="716" y="362.25" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start" font-style="italic">explains why the</text><text x="716" y="382.25" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start" font-style="italic">mechanism matters</text><rect x="30" y="426" width="170" height="96" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="115" y="481" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Evaluation</text><rect x="212" y="426" width="490" height="96" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="226" y="457.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Feminists note nurses and care workers are also</text><text x="226" y="479.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">essential but paid much less, and most are women:</text><text x="226" y="501.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">rewards follow gender and bargaining power too.</text><text x="716" y="458.25" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start" font-style="italic">a named</text><text x="716" y="478.25" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start" font-style="italic">perspective, not</text><text x="716" y="498.25" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start" font-style="italic">“some disagree”</text>
</svg>