<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 641" width="900" height="641" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="641" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Five criticisms of Davis and Moore</text>

<rect x="30" y="108" width="360" height="70" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><circle cx="64" cy="143" r="18" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="64" y="149.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="96" y="148.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Low-paid roles can be vital</text><text x="408" y="150" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">e.g.</text><rect x="446" y="108" width="424" height="70" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="462" y="148.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Are lawyers more important than nurses?</text><rect x="30" y="188" width="360" height="70" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><circle cx="64" cy="223" r="18" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="64" y="229.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="96" y="216.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Pay may reflect power, not</text><text x="96" y="240.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">importance</text><text x="408" y="230" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">e.g.</text><rect x="446" y="188" width="424" height="70" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="462" y="217.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Bargaining power: are MPs worth more than</text><text x="462" y="239.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">nurses?</text><rect x="30" y="268" width="360" height="74" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><circle cx="64" cy="305" r="18" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="64" y="311.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="96" y="298.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">No proof exceptional talent</text><text x="96" y="322.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">is needed</text><text x="408" y="312" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">e.g.</text><rect x="446" y="268" width="424" height="74" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="462" y="288.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">No agreed way to measure talent; no formal</text><text x="462" y="310.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">educational requirement for government</text><text x="462" y="332.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">ministers</text><rect x="30" y="352" width="360" height="74" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><circle cx="64" cy="389" r="18" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="64" y="395.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="96" y="382.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The pool of talent may be</text><text x="96" y="406.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">larger</text><text x="408" y="396" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">e.g.</text><rect x="446" y="352" width="424" height="74" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="462" y="383.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Unequal rewards may not be the best way to</text><text x="462" y="405.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">harness it</text><rect x="30" y="436" width="360" height="74" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><circle cx="64" cy="473" r="18" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="64" y="479.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="96" y="466.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Reward and importance do not</text><text x="96" y="490.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">match</text><text x="408" y="480" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">e.g.</text><rect x="446" y="436" width="424" height="74" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="462" y="467.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The Prime Minister is paid far less than a</text><text x="462" y="489.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">typical major corporation’s chief executive</text><rect x="30" y="528" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="564" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Learn them as separate points</text><text x="56" y="593" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Each criticism needs its own example, such as nurses, ministers or the Prime Minister’s pay.</text>
</svg>