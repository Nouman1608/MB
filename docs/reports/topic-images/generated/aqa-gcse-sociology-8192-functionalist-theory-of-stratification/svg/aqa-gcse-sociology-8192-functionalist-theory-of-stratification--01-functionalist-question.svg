<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 662" width="900" height="662" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="662" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What functionalism is trying to explain</text>

<rect x="30" y="112" width="840" height="96" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="450" y="148" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Every known society ranks people unequally…</text><text x="450" y="180" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">so inequality must do something useful for society as a whole</text><line x1="450" y1="212" x2="450" y2="244" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="250" width="400" height="120" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="230" y="284" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">Not this question</text><text x="230" y="324" font-size="22" font-weight="700" fill="#4a5568" text-anchor="middle">“Is inequality fair?”</text><line x1="110" y1="314" x2="350" y2="314" stroke="#b5602e" stroke-width="3"/><rect x="470" y="250" width="400" height="120" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="670" y="284" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">The functionalist question</text><text x="670" y="324" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">“What does inequality</text><text x="670" y="352" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">do for society?”</text><text x="450" y="414" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Linking topics</text><rect x="30" y="430" width="390" height="108" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="225" y="462.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Parsons: school</text><text x="225" y="492.3" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Meritocratic; selects people for future</text><text x="225" y="514.3" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">roles</text><line x1="424" y1="484" x2="476" y2="484" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="480" y="430" width="390" height="108" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="675" y="462.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Davis and Moore: rewards</text><text x="675" y="492.3" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Finish the job schools start: the reward</text><text x="675" y="514.3" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">system sorts people into roles</text><rect x="30" y="556" width="840" height="82" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="592" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Functionalism sees society as a system of connected parts, like the organs of a body;</text><text x="56" y="614" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">stratification is one of those parts.</text>
</svg>