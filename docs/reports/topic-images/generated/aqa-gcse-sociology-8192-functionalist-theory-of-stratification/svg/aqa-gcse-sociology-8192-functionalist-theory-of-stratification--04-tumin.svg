<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 569" width="900" height="569" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="569" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Tumin (1953): stratification can be dysfunctional</text>

<text x="450" y="132" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">The mechanism fails on its own terms</text><rect x="30" y="150" width="246.66666666666666" height="108" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="153.33333333333331" y="193.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Unequal access</text><text x="153.33333333333331" y="223.3" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">to education and training</text><line x1="280.66666666666663" y1="204" x2="322.66666666666663" y2="204" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="326.66666666666663" y="150" width="246.66666666666666" height="108" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="449.99999999999994" y="182.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Able people</text><text x="449.99999999999994" y="212.3" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">never get the chance to</text><text x="449.99999999999994" y="234.3" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">compete</text><line x1="577.3333333333333" y1="204" x2="619.3333333333333" y2="204" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="623.3333333333333" y="150" width="246.66666666666666" height="108" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="746.6666666666666" y="193.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Talent wasted</text><text x="746.6666666666666" y="223.3" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">rather than discovered</text><rect x="30" y="288" width="412" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,338 L31.25,302.25 Q31.25,289.25 44.25,289.25 L427.75,289.25 Q440.75,289.25 440.75,302.25 L440.75,338 Z" fill="#ffffff"/><line x1="31.25" y1="338" x2="440.75" y2="338" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="318.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Is training a sacrifice?</text><text x="44" y="370.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Tumin questioned whether training really</text><text x="44" y="392.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">needs large rewards</text><rect x="458" y="288" width="412" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,338 L459.25,302.25 Q459.25,289.25 472.25,289.25 L855.75,289.25 Q868.75,289.25 868.75,302.25 L868.75,338 Z" fill="#ffffff"/><line x1="459.25" y1="338" x2="868.75" y2="338" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="318.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Hostility, not unity</text><text x="472" y="370.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Stratification can create hostility and</text><text x="472" y="392.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">distrust between groups instead of binding</text><text x="472" y="414.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">society together</text><rect x="30" y="456" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="492" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Common mistake</text><text x="56" y="521" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Do not call Tumin a Marxist: use him simply as a critic of Davis and Moore.</text>
</svg>