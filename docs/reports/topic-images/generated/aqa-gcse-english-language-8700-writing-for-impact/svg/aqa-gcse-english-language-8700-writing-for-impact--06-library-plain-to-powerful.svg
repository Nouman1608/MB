<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 861" width="900" height="861" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="861" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">From plain to powerful: the library article</text>

<rect x="30" y="100" width="840" height="108" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="133" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">PLAIN DRAFT</text><text x="50" y="158.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">“The library should stay open. It is useful for lots of people. Closing it</text><text x="50" y="182.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">would be bad. People need it.”</text><rect x="100" y="226" width="770" height="68" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="113" y="252" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CONCRETE DETAIL</text><text x="113" y="276.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">“Every weekday at nine, a queue forms outside Hartley Road Library.”</text><circle cx="60" cy="260" r="19" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="266.84" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="100" y="304" width="770" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="113" y="330" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ANTITHESIS, TRICOLON</text><text x="113" y="354.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">“…not a queue for bargains… it is a queue for warmth, for help with a job</text><text x="113" y="376.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">application, for a quiet table…”</text><circle cx="60" cy="349" r="19" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="355.84" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="100" y="404" width="770" height="68" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="113" y="430" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">QUOTES THE OPPOSING VIEW</text><text x="113" y="454.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">The council calls the library “non-essential”.</text><circle cx="60" cy="438" r="19" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="444.84" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="100" y="482" width="770" height="68" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="113" y="508" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ANAPHORA, SPECIFIC PEOPLE</text><text x="113" y="532.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">“Ask the pensioner… Ask the boy whose home has no desk.”</text><circle cx="60" cy="516" r="19" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="522.84" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="100" y="560" width="770" height="68" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="113" y="586" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PARENTHESIS; END FOCUS ON LOSS</text><text x="113" y="610.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">“The building, which has stood for a hundred years, could be gone by spring.”</text><circle cx="60" cy="594" r="19" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="600.84" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><rect x="100" y="638" width="770" height="68" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="113" y="664" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">ONE RHETORICAL QUESTION</text><text x="113" y="688.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">“Is that really a saving worth making?”</text><circle cx="60" cy="672" r="19" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="678.84" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">6</text><rect x="30" y="724" width="840" height="107" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="757.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Each named device is used once and for a reason.</text><text x="48" y="786.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">A striking opening image, loss placed last for emphasis, and a register suitable for a</text><text x="48" y="808.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">public article.</text>
</svg>