<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 510" width="900" height="510" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="510" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Select, organise, emphasise</text>

<rect x="30" y="100" width="268" height="380" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="138" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">1  Select</text><rect x="60" y="166" width="90" height="24" rx="5" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><rect x="60" y="200" width="90" height="24" rx="5" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><rect x="60" y="234" width="90" height="24" rx="5" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><rect x="190" y="164" width="80" height="9" rx="4" fill="#c9d6d4"/><rect x="190" y="181" width="80" height="9" rx="4" fill="#c9d6d4"/><rect x="190" y="198" width="80" height="9" rx="4" fill="#c9d6d4"/><rect x="190" y="215" width="80" height="9" rx="4" fill="#c9d6d4"/><rect x="190" y="232" width="80" height="9" rx="4" fill="#c9d6d4"/><rect x="190" y="249" width="80" height="9" rx="4" fill="#c9d6d4"/><text x="105" y="286" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">three strong</text><text x="230" y="286" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">six thin</text><text x="166" y="220" font-size="28" font-weight="700" fill="#1e2a44" text-anchor="middle">></text><text x="50" y="330" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Three strong, distinct</text><text x="50" y="352" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">ideas beat six thin ones.</text><text x="50" y="400" font-size="17" font-weight="400" fill="#2e6b62" text-anchor="start" font-style="italic">Ask: “Would my reader care</text><text x="50" y="422" font-size="17" font-weight="400" fill="#2e6b62" text-anchor="start" font-style="italic">about this?”</text><rect x="316" y="100" width="268" height="380" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="336" y="138" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">2  Organise</text><rect x="338" y="230" width="18" height="30" rx="3" fill="#b5d3cf" stroke="#1e2a44" stroke-width="1.5"/><rect x="362" y="210" width="18" height="50" rx="3" fill="#b5d3cf" stroke="#1e2a44" stroke-width="1.5"/><rect x="386" y="190" width="18" height="70" rx="3" fill="#b5d3cf" stroke="#1e2a44" stroke-width="1.5"/><rect x="410" y="165" width="18" height="95" rx="3" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.5"/><text x="383" y="282" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">climactic</text><rect x="472" y="165" width="18" height="95" rx="3" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.5"/><rect x="496" y="190" width="18" height="70" rx="3" fill="#b5d3cf" stroke="#1e2a44" stroke-width="1.5"/><rect x="520" y="210" width="18" height="50" rx="3" fill="#b5d3cf" stroke="#1e2a44" stroke-width="1.5"/><rect x="544" y="230" width="18" height="30" rx="3" fill="#b5d3cf" stroke="#1e2a44" stroke-width="1.5"/><text x="517" y="282" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">strongest first</text><text x="336" y="330" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Climactic order saves the</text><text x="336" y="352" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">most powerful point for</text><text x="336" y="374" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">last; strongest first wins</text><text x="336" y="396" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">attention.</text><text x="336" y="422" font-size="17" font-weight="400" fill="#2e6b62" text-anchor="start" font-style="italic">Either works if it is</text><text x="336" y="444" font-size="17" font-weight="400" fill="#2e6b62" text-anchor="start" font-style="italic">deliberate.</text><rect x="602" y="100" width="268" height="380" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="622" y="138" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">3  Emphasise</text><text x="622" y="170" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="start">Position is emphasis:</text><text x="622" y="202" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="638.15" y="202" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">end of a sentence</text><text x="622" y="230" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="638.15" y="230" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">end of a paragraph</text><text x="622" y="258" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="638.15" y="258" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">a one-sentence paragraph</text><text x="622" y="286" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="638.15" y="286" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">a short sentence after</text><text x="638.15" y="308" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">long ones</text><text x="622" y="336" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="638.15" y="336" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">a repeated key word</text><text x="622" y="400" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">In Paper 1, choose the one</text><text x="622" y="421" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">image that carries the</text><text x="622" y="442" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">mood, and place it where</text><text x="622" y="463" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the reader feels it most.</text>
</svg>