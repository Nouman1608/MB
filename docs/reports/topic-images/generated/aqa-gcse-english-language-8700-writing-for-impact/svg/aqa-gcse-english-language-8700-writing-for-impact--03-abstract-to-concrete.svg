<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 724" width="900" height="724" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="724" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Make the abstract concrete</text>

<rect x="30" y="100" width="370" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="142" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">INFORMS</text><text x="50" y="169" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">“Loneliness affects older</text><text x="50" y="195" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">people”</text><rect x="500" y="100" width="370" height="130" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="520" y="142" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">MAKES THE READER FEEL</text><text x="520" y="169" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">“Mrs Patel has not spoken to</text><text x="520" y="195" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">anyone since Tuesday”</text><line x1="410" y1="165" x2="490" y2="165" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="30" y="252" width="300" height="47" fill="#1e2a44"/><text x="180" y="281.3" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Method</text><rect x="330" y="252" width="540" height="47" fill="#1e2a44"/><text x="600" y="281.3" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">How it works</text><rect x="30" y="299" width="300" height="48" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="325.94" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Specific, human detail</text><rect x="330" y="299" width="540" height="48" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="344" y="325.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Replaces a generalisation</text><rect x="30" y="347" width="300" height="48" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="373.94" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Emotive vocabulary</text><rect x="330" y="347" width="540" height="48" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="344" y="373.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Chosen precisely rather than piled up</text><rect x="30" y="395" width="300" height="48" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="421.94" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Direct address</text><rect x="330" y="395" width="540" height="48" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="344" y="421.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Makes the reader part of the situation: “Imagine you…”</text><rect x="30" y="443" width="300" height="70" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="480.94" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Shift in tone</text><rect x="330" y="443" width="540" height="70" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="344" y="469.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">From humour to seriousness, so the serious moment hits</text><text x="344" y="491.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">harder</text><rect x="30" y="513" width="300" height="48" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="539.94" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Restraint</text><rect x="330" y="513" width="540" height="48" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="344" y="539.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Understatement can be more moving than exclamation marks</text><rect x="30" y="252" width="840" height="309" rx="4" fill="none" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="583" width="411" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="235.5" y="618.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Assembly speech</text><text x="235.5" y="647.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">can be passionate</text><rect x="459" y="583" width="411" height="111" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="664.5" y="618.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Letter to a council officer</text><text x="664.5" y="647.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">more convincing when its feeling is</text><text x="664.5" y="669.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">controlled</text>
</svg>