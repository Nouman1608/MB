<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 589" width="900" height="589" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="589" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Making evidence pertinent</text>

<rect x="30" y="100" width="170" height="47" fill="#1e2a44"/><text x="115" y="129.3" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Kind</text><rect x="200" y="100" width="350" height="47" fill="#1e2a44"/><text x="375" y="129.3" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Example</text><rect x="550" y="100" width="320" height="47" fill="#1e2a44"/><text x="710" y="129.3" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">How to make it pertinent</text><rect x="30" y="147" width="170" height="70" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="184.94" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Example</text><rect x="200" y="147" width="350" height="70" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="214" y="173.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“the bus that stopped running last</text><text x="214" y="195.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">spring”</text><rect x="550" y="147" width="320" height="70" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="564" y="173.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Concrete and local, so the reader</text><text x="564" y="195.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">recognises it</text><rect x="30" y="217" width="170" height="70" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="254.94" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Anecdote</text><rect x="200" y="217" width="350" height="70" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="214" y="254.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A short story of one person affected</text><rect x="550" y="217" width="320" height="70" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="564" y="243.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Keep it brief, then draw the</text><text x="564" y="265.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">general point</text><rect x="30" y="287" width="170" height="70" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="324.94" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Expert view</text><rect x="200" y="287" width="350" height="70" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="214" y="324.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“Doctors have long warned that…”</text><rect x="550" y="287" width="320" height="70" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="564" y="313.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Use it to support, not replace,</text><text x="564" y="335.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">your argument</text><rect x="30" y="357" width="170" height="70" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="394.94" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Quotation</text><rect x="200" y="357" width="350" height="70" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="214" y="383.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A well-known saying, or a phrase</text><text x="214" y="405.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">from the Paper 2 sources</text><rect x="550" y="357" width="320" height="70" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="564" y="383.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Short, integrated, followed by</text><text x="564" y="405.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">your comment</text><rect x="30" y="100" width="840" height="327" rx="4" fill="none" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="449" width="840" height="110" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><rect x="54" y="483" width="272" height="33" rx="16.5" fill="#ffffff" stroke="#8a6d0d" stroke-width="2"/><text x="190" y="505.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Paper 2 Section A sources</text><line x1="330" y1="500" x2="420" y2="500" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="375" y="487" font-size="15" font-weight="600" fill="#8a6d0d" text-anchor="middle">shared theme</text><rect x="430" y="483" width="253" height="33" rx="16.5" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="556.5" y="505.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">your Section B argument</text><text x="54" y="545" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Use the sources as springboards, rephrased in your own words, not as copied passages.</text>
</svg>