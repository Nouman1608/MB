<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 698" width="900" height="698" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="698" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The three devices the specification names</text>

<rect x="30" y="100" width="840" height="136" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="133" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">RHETORICAL QUESTION</text><text x="50" y="160" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">“Is a few minutes’ convenience really worth a lifetime of litter?”</text><text x="50" y="189.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Asked for effect; the answer is implied. Use one or two at moments of challenge, not one</text><text x="50" y="211.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">per paragraph.</text><rect x="30" y="254" width="840" height="196" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="54" y="288" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ANTITHESIS</text><rect x="50" y="306" width="390" height="56" rx="10" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="245" y="341" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">We built the roads for cars;</text><rect x="460" y="306" width="390" height="56" rx="10" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="655" y="341" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">we must now rebuild them for people.</text><path d="M245,366 L245,382 L655,382 L655,366" fill="none" stroke="#2e6b62" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M450,382 l-14,18 h28 z" fill="#2e6b62"/><text x="450" y="430" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">Contrasting ideas in a balanced structure: memorable and quotable</text><rect x="30" y="468" width="840" height="200" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="54" y="502" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">PARENTHESIS</text><text x="54" y="548" font-size="18" fill="#1e2a44" xml:space="preserve">“The council’s plan,<tspan font-weight="700" fill="#8a6d0d" text-decoration="underline"> announced without any public meeting,</tspan> will close the pool in June.”</text><text x="54" y="586" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="start">↑ the inserted aside, marked off here by commas</text><text x="54" y="630" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Brackets, dashes or commas mark it off. It adds a pointed aside, a qualification</text><text x="54" y="654" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">or a note of irony without breaking the sentence.</text>
</svg>