<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 674" width="900" height="674" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="674" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Other devices for impact</text>

<rect x="30" y="100" width="260" height="47" fill="#1e2a44"/><text x="160" y="129.3" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Device</text><rect x="290" y="100" width="580" height="47" fill="#1e2a44"/><text x="580" y="129.3" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Example</text><rect x="30" y="147" width="260" height="74" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="174.76" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Tricolon (rule of</text><text x="44" y="198.76" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">three)</text><rect x="290" y="147" width="580" height="74" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="304" y="186.76" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“It is cheaper, cleaner and kinder.”</text><rect x="30" y="221" width="260" height="74" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="260.76" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Anaphora</text><rect x="290" y="221" width="580" height="74" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="304" y="248.76" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“We need trees. We need shade. We need somewhere to</text><text x="304" y="272.76" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">breathe.”</text><rect x="30" y="295" width="260" height="56" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="325.76" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Hyperbole</text><rect x="290" y="295" width="580" height="56" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="304" y="325.76" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“The queue stretched halfway to the coast.”</text><rect x="30" y="351" width="260" height="74" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="390.76" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Irony</text><rect x="290" y="351" width="580" height="74" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="304" y="378.76" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“What a triumph of planning: a cycle lane that ends in a</text><text x="304" y="402.76" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">wall.”</text><rect x="30" y="425" width="260" height="56" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="455.76" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Imperative</text><rect x="290" y="425" width="580" height="56" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="304" y="455.76" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“Picture it. Now picture it gone.”</text><rect x="30" y="481" width="260" height="56" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="511.76" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Inclusive pronouns</text><rect x="290" y="481" width="580" height="56" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="304" y="511.76" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“Together, we can keep it open.”</text><rect x="30" y="100" width="840" height="437" rx="4" fill="none" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="559" width="840" height="85" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="592.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Device-stuffing loses force.</text><text x="450" y="621.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">Choose two or three devices in advance and decide where each will do most work.</text>
</svg>