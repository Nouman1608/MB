<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 693" width="900" height="693" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="693" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four objectives around one statement</text>

<line x1="320" y1="187" x2="366.7" y2="230.875" stroke="#1e2a44" stroke-width="2.5"/><line x1="320" y1="322" x2="366.7" y2="278.125" stroke="#1e2a44" stroke-width="2.5"/><line x1="580" y1="187" x2="533.3" y2="230.875" stroke="#1e2a44" stroke-width="2.5"/><line x1="580" y1="332.5" x2="533.3" y2="281.8" stroke="#1e2a44" stroke-width="2.5"/><circle cx="450" cy="254.5" r="98" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="250.25" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">The statement:</text><text x="450" y="272.75" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">“an invitation”</text><g transform="translate(0,10.5)"><rect x="30" y="116" width="290" height="121" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="146.4" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">AO1</text><text x="46" y="174.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A clear, personal argument on</text><text x="46" y="195.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the statement, with accurate</text><text x="46" y="216.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">dramatic terminology.</text><rect x="30" y="251" width="290" height="121" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="281.4" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">AO2</text><text x="46" y="309.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Dramatic methods: verse and</text><text x="46" y="330.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">prose, soliloquy, staging,</text><text x="46" y="351.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">structure, imagery, dialogue.</text></g><g transform="translate(0,0)"><rect x="580" y="116" width="290" height="142" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="596" y="146.4" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">AO3</text><text x="596" y="174.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Contexts of writing and</text><text x="596" y="195.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">reception: early modern ideas,</text><text x="596" y="216.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">genre, performance history,</text><text x="596" y="237.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">adaptation.</text><rect x="580" y="272" width="290" height="121" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="596" y="302.4" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="start">AO5</text><text x="596" y="330.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Different interpretations:</text><text x="596" y="351.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">critics, productions, different</text><text x="596" y="372.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">audiences, class debate.</text></g><rect x="30" y="415" width="840" height="102" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="448.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The statement is an invitation to show that texts can be read in different ways. You may</text><text x="50" y="470.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">draw on wider critical reading, class discussion, or “performances they have seen or</text><text x="50" y="492.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">viewed”.</text><rect x="30" y="533" width="840" height="136" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="566" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">THE WORD THAT KEEPS APPEARING</text><text x="50" y="593" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Audiences</text><text x="50" y="622.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Treat the play as something performed and received, not just read: how Shakespeare uses</text><text x="50" y="644.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">dramatic forms to evoke responses in audiences.</text>
</svg>