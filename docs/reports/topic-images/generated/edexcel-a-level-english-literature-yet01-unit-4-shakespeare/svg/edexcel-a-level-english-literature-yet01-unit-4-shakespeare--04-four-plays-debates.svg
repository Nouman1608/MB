<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 547" width="900" height="547" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="547" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The four plays: features and debates</text>

<rect x="30" y="116" width="200" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="42" y="146" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Play</text><rect x="230" y="116" width="300" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="242" y="146" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Dramatic features</text><rect x="530" y="116" width="340" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="542" y="146" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Interpretive debates (AO5)</text><rect x="30" y="162" width="200" height="106" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="187.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Hamlet</text><rect x="230" y="162" width="300" height="106" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="242" y="187.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Soliloquies; the</text><text x="242" y="208.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">play-within-the-play; revenge</text><text x="242" y="229.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">tragedy conventions</text><rect x="530" y="162" width="340" height="106" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="542" y="187.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Delay as moral seriousness or</text><text x="542" y="208.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">weakness; Ophelia and Gertrude as</text><text x="542" y="229.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">victims or agents; the Ghost’s</text><text x="542" y="250.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">reliability</text><rect x="30" y="268" width="200" height="85" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="293.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">King Lear</text><rect x="230" y="268" width="300" height="85" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="242" y="293.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Double plot (Lear and</text><text x="242" y="314.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Gloucester); storm scenes; the</text><text x="242" y="335.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Fool</text><rect x="530" y="268" width="340" height="85" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="542" y="293.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Redemption or nihilism; the ending;</text><text x="542" y="314.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Nahum Tate’s adapted ending as</text><text x="542" y="335.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">reception</text><rect x="30" y="353" width="200" height="85" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="378.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Measure for Measure</text><rect x="230" y="353" width="300" height="85" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="242" y="378.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Disguised Duke; bed-trick; a</text><text x="242" y="399.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">comic ending with unsettling</text><text x="242" y="420.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">silences</text><rect x="530" y="353" width="340" height="85" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="542" y="378.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Justice and mercy; the Duke as</text><text x="542" y="399.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">providential or manipulative;</text><text x="542" y="420.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Isabella’s silence at the end</text><rect x="30" y="438" width="200" height="85" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="463.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">The Taming of the</text><text x="42" y="484.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Shrew</text><rect x="230" y="438" width="300" height="85" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="242" y="463.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Induction with Christopher Sly;</text><text x="242" y="484.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">disguise; the wager scene</text><rect x="530" y="438" width="340" height="85" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="542" y="463.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Katherina’s final speech as sincere,</text><text x="542" y="484.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">ironic or strategic; farce or social</text><text x="542" y="505.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">criticism</text>
</svg>