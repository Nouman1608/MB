xt><text x="46" y="519.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">silent on stage, implied</text><text x="46" y="540.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">stage directions.</text><rect x="314.6666666666667" y="361" width="270.6666666666667" height="231" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="326.6666666666667" y="373" width="246.66666666666669" height="76" rx="10" fill="#dce9e7"/><circle cx="360" cy="403" r="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="420" cy="403" r="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="480" cy="403" r="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="540" cy="403" r="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><path d="M360,403 L540,403" fill="none" stroke="#8a6d0d" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 4"/><text x="450" y="435" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">a recurring cluster</text><text x="330.6666666666667" y="470.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Imagery clusters</text><text x="330.6666666666667" y="498.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Recurring images (disease,</text><text x="330.6666666666667" y="519.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">sight, clothing, animals)</text><text x="330.6666666666667" y="540.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">build meaning across the</text><text x="330.6666666666667" y="561.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">play.</text><rect x="599.3333333333334" y="361" width="270.6666666666667" height="231" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="611.3333333333334" y="373" width="246.66666666666669" height="76" rx="10" fill="#f2e7b8"/><g transform="translate(734.6666666666667