und"/><circle cx="410" cy="152.8" r="7.8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><path d="M442,132 L488,132 Q500,132 500,144 L500,148 Q500,160 488,160 L464,160 L446,176 L450,160 L442,160 Q430,160 430,148 L430,144 Q430,132 442,132 Z" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><text x="465" y="151" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">…</text><path d="M510.2,176 Q530,159.8 549.8,176 Q530,192.2 510.2,176 Z" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><circle cx="530" cy="176" r="6.3" fill="#2e6b62"/><text x="330.6666666666667" y="225.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Soliloquy and aside</text><text x="330.6666666666667" y="253.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">What the audience knows that</text><text x="330.6666666666667" y="274.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">other characters do not.</text><rect x="599.3333333333334" y="116" width="270.6666666666667" height="231" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="611.3333333333334" y="128" width="246.66666666666669" height="76" rx="10" fill="#dce9e7"/><rect x="634.6666666666667" y="140" width="36" height="22" rx="4" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><rect x="676.6666666666667" y="140" width="36" height="22" rx="4" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><rect x="718.6666666666667" y="140" width="36" height="22" rx="4" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><rect x="760.6666666666667" y="140" width="36" height="22" rx="4" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><rect x="802.6666666666667" y="140" width="36" height="22" rx="4" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><rect x="655.6666666666667" y="172" width="36" height="18" rx="4" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><rect x="711.6666666666667" y="172" width="36" height="18" rx="4" fill="