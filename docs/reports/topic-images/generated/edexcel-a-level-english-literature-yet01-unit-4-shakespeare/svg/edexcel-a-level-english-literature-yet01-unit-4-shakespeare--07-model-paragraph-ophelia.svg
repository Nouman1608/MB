<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 612" width="900" height="612" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="612" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Model paragraph: madness as a licence for truth</text>

<rect x="30" y="120" width="412" height="196" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="153" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">BEFORE ACT 4</text><text x="50" y="180" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Brief, obedient replies</text><text x="50" y="208.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="208.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">“I shall obey, my lord”</text><text x="50" y="234.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="234.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Her one soliloquy laments Hamlet rather</text><text x="65.2" y="255.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">than herself.</text><rect x="458" y="120" width="412" height="212" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="478" y="153" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">IN MADNESS</text><text x="478" y="180" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">A freedom of speech she never</text><text x="478" y="206" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">had</text><text x="478" y="234.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="493.2" y="234.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Fragments of bawdy songs</text><text x="478" y="260.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="493.2" y="260.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Flowers distributed with pointed meanings</text><text x="478" y="286.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="493.2" y="286.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">What a dutiful daughter could not say</text><text x="493.2" y="307.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">emerges in disordered form</text><text x="30" y="356" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Two production readings (AO5)</text><rect x="30" y="372" width="412" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="407.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Pathetic collapse</text><text x="50" y="435.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Invites the audience’s pity.</text><rect x="458" y="372" width="412" height="88" rx="14" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="478" y="407.2" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">Unsettling and accusatory</text><text x="478" y="435.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Forces the court to watch what it has done.</text><rect x="30" y="476" width="840" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="509" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">JUDGEMENT</text><text x="50" y="535.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">At once the play’s victim and one of its most disturbing witnesses</text><text x="50" y="563.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The second reading supports madness as a licence for truth, as with Hamlet’s “antic disposition”.</text>
</svg>