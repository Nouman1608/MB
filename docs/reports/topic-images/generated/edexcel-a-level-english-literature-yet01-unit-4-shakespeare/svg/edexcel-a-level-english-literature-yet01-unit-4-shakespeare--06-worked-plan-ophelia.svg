<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 862" width="900" height="862" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="862" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked plan: “Ophelia is the play’s true victim”</text>

<rect x="30" y="118" width="840" height="86" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="151" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STATEMENT (ORIGINAL)</text><text x="50" y="178" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">“Ophelia is the play’s true victim.”</text><rect x="30" y="218" width="840" height="108" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="251" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">THESIS</text><text x="50" y="280.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The character the play most fully sacrifices, but presenting her only as a victim ignores the</text><text x="50" y="301.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">moments in which the play gives her a voice more disruptive than anyone’s.</text><rect x="30" y="340" width="190" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="42" y="370" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Paragraph</text><rect x="220" y="340" width="450" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="232" y="370" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Evidence</text><rect x="670" y="340" width="200" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="682" y="370" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">AOs</text><rect x="30" y="386" width="190" height="82" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="410.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">1 Obedience</text><rect x="220" y="386" width="450" height="82" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="232" y="410.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Told by Laertes and Polonius to reject Hamlet; bait in</text><text x="232" y="430.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">the “nunnery” scene while her father and the King watch</text><rect x="670" y="386" width="200" height="82" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="682" y="410.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">AO2 staging; AO3</text><text x="682" y="430.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">expectations of</text><text x="682" y="450.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">daughters</text><rect x="30" y="468" width="190" height="62" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="492.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">2 Hamlet’s cruelty</text><rect x="220" y="468" width="450" height="62" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="232" y="492.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">“Get thee to a nunnery”: victim of his performed</text><text x="232" y="512.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">madness or genuine disgust?</text><rect x="670" y="468" width="200" height="62" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="682" y="492.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">AO5 readings of Hamlet</text><rect x="30" y="530" width="190" height="62" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="554.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">3 Madness</text><rect x="220" y="530" width="450" height="62" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="232" y="554.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Act 4 songs and flowers; from verse to song and broken</text><text x="232" y="574.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">speech</text><rect x="670" y="530" width="200" height="62" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="682" y="554.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">AO2 form; AO5 release</text><text x="682" y="574.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">or collapse</text><rect x="30" y="592" width="190" height="62" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="616.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">4 Death reported</text><rect x="220" y="592" width="450" height="62" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="232" y="616.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Gertrude’s lyrical account; the gravediggers’ debate</text><text x="232" y="636.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">over her burial</text><rect x="670" y="592" width="200" height="62" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="682" y="616.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">AO2 structure; AO3</text><text x="682" y="636.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">attitudes to suicide</text><rect x="30" y="654" width="190" height="62" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="678.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">5 Reception</text><rect x="220" y="654" width="450" height="62" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="232" y="678.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Victorian painting; feminist criticism including Elaine</text><text x="232" y="698.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Showalter’s essay; productions that foreground her</text><rect x="670" y="654" width="200" height="62" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="682" y="678.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">AO3 reception; AO5</text><rect x="30" y="730" width="840" height="108" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="763" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">CONCLUSION</text><text x="50" y="792.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A victim of the play’s male world, but the staging of her madness gives her a voice it denies her</text><text x="50" y="813.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">in sanity.</text>
</svg>