<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 730" width="900" height="730" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="730" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Responding to the statement</text>

<line x1="62" y1="140" x2="62" y2="686" stroke="#c9d6d4" stroke-width="4"/><rect x="108" y="120" width="442" height="87" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="154.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Unpack the statement</text><text x="128" y="182.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Identify the key terms and what they assume.</text><circle cx="62" cy="163.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="172.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="108" y="215" width="442" height="87" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="249.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Take a position</text><text x="128" y="277.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Agree, disagree or qualify.</text><circle cx="62" cy="258.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="267.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="108" y="310" width="442" height="87" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="344.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Test it across the play</text><text x="128" y="372.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">An early scene, a turning point, the ending.</text><circle cx="62" cy="353.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="362.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="108" y="405" width="442" height="87" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="439.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Analyse dramatic methods</text><text x="128" y="467.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">In each piece of evidence.</text><circle cx="62" cy="448.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="457.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="108" y="500" width="442" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="128" y="534.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Introduce alternative readings and</text><text x="128" y="558.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">contexts</text><text x="128" y="586.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">AO5 and AO3, where they explain the evidence.</text><circle cx="62" cy="555.5" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="62" y="564.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><rect x="108" y="619" width="442" height="87" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="653.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Reach a judgement</text><text x="128" y="681.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">One that answers the statement.</text><circle cx="62" cy="662.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="671.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">6</text><rect x="580" y="120" width="290" height="586" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="725" y="154" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">Test across the play</text><rect x="780" y="180" width="60" height="466" rx="6" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><rect x="780" y="203.28" width="60" height="28" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="770" y="222.28" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="end">an early scene</text><rect x="780" y="399" width="60" height="28" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="770" y="418" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="end">a turning point</text><rect x="780" y="594.72" width="60" height="28" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="770" y="613.72" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="end">the ending</text><text x="725" y="680" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">the whole play</text>
</svg>