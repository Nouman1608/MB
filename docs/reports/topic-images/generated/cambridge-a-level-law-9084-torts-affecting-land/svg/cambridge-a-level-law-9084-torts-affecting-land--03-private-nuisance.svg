<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 727" width="900" height="727" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="727" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Private nuisance: is the interference unreasonable?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">More than an ordinary person should tolerate</text>
<rect x="30" y="124" width="413" height="143" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="152" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">LOCALITY</text><text x="46" y="183.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Sturges</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Bridgman</tspan> (1879): Belgrave Square v</text><text x="46" y="204.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Bermondsey. Irrelevant for physical damage (<tspan font-style="italic">St</tspan></text><text x="46" y="225.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Helen’s</tspan> <tspan font-style="italic">Smelting</tspan>). Planning permission may</text><text x="46" y="246.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">change the character (<tspan font-style="italic">Coventry</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Lawrence</tspan>)</text><rect x="457" y="124" width="413" height="143" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="473" y="152" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DURATION AND TIMING</text><text x="473" y="183.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Usually continuing, but a short intense event can</text><text x="473" y="204.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">count (<tspan font-style="italic">Crown</tspan> <tspan font-style="italic">River</tspan> <tspan font-style="italic">Cruises</tspan>). Night-time</text><text x="473" y="225.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">pile-driving (<tspan font-style="italic">De</tspan> <tspan font-style="italic">Keyser’s</tspan> <tspan font-style="italic">Royal</tspan> <tspan font-style="italic">Hotel</tspan>)</text><rect x="30" y="281" width="413" height="122" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="309" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SENSITIVITY</text><text x="46" y="340.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Abnormally sensitive use not protected: <tspan font-style="italic">Robinson</tspan></text><text x="46" y="361.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">v</tspan> <tspan font-style="italic">Kilvert</tspan> (1889); reframed as foreseeability in</text><text x="46" y="382.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Network</tspan> <tspan font-style="italic">Rail</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Morris</tspan> (2004)</text><rect x="457" y="281" width="413" height="122" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="473" y="309" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">MALICE</text><text x="473" y="340.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Deliberate annoyance: <tspan font-style="italic">Christie</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Davey</tspan> (1893),</text><text x="473" y="361.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">banging on a wall; <tspan font-style="italic">Hollywood</tspan> <tspan font-style="italic">Silver</tspan> <tspan font-style="italic">Fox</tspan> <tspan font-style="italic">Farm</tspan> <tspan font-style="italic">v</tspan></text><text x="473" y="382.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Emmett</tspan> (1936)</text><rect x="30" y="425" width="413" height="122" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="453" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">WHO CAN SUE</text><text x="46" y="484.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A proprietary interest, e.g. owner or tenant:</text><text x="46" y="505.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Hunter</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Canary</tspan> <tspan font-style="italic">Wharf</tspan> (1997)</text><rect x="457" y="425" width="413" height="122" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="473" y="453" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">WHO CAN BE SUED</text><text x="473" y="484.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Creator; occupier who adopts or continues it</text><text x="473" y="505.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(<tspan font-style="italic">Sedleigh-Denfield</tspan>); landlord who authorises it</text><text x="473" y="526.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(<tspan font-style="italic">Tetley</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Chitty</tspan>)</text><rect x="30" y="569" width="413" height="126" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="46" y="597" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DEFENCES</text><text x="46" y="628.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Prescription:</tspan> 20 years as a nuisance to the</text><text x="46" y="649.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">claimant</text><text x="46" y="674.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Statutory</tspan> <tspan font-weight="700" fill="#1e2a44">authority:</tspan> <tspan font-style="italic">Allen</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Gulf</tspan> <tspan font-style="italic">Oil</tspan> (1981)</text><rect x="457" y="569" width="413" height="126" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="473" y="597" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">NOT DEFENCES</text><text x="473" y="628.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Coming to the nuisance (<tspan font-style="italic">Miller</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Jackson</tspan>, 1977)</text><text x="473" y="653.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Public benefit</text>
</svg>