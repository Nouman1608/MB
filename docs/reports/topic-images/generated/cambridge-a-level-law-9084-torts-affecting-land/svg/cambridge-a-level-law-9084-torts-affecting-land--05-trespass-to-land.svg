<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 661" width="900" height="661" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="661" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Trespass to land</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Direct and intentional interference with land in another’s possession</text>
<rect x="30" y="124" width="840" height="290" fill="#dce9e7"/><rect x="30" y="414" width="840" height="50" fill="#d8e3c6"/><line x1="30" y1="414" x2="870" y2="414" stroke="#1e2a44" stroke-width="3"/><line x1="450" y1="134" x2="450" y2="464" stroke="#8a6d0d" stroke-width="3" stroke-dasharray="9 6"/><text x="440" y="448" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">defendant’s land</text><text x="460" y="448" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">claimant’s land</text><rect x="250" y="294" width="150" height="120" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><line x1="400" y1="314" x2="520" y2="314" stroke="#1e2a44" stroke-width="4"/><rect x="490" y="318" width="56" height="30" rx="4" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="518" y="338" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">SIGN</text><line x1="110" y1="414" x2="110" y2="190" stroke="#1e2a44" stroke-width="5"/><line x1="90" y1="190" x2="600" y2="190" stroke="#1e2a44" stroke-width="5"/><rect x="740" y="324" width="110" height="90" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><path d="M730,324 L795,279 L860,324 Z" fill="#b5602e" stroke="#1e2a44" stroke-width="2.5"/><path d="M400,414 L400,364 L480,414 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.5"/><rect x="470" y="150" width="281.705" height="28" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="480" y="169" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">crane jib: Anchor Brewhouse (1987)</text><rect x="470" y="274" width="256.28" height="28" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="480" y="293" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">overhanging sign: Kelsen (1957)</text><rect x="492" y="376" width="257.79499999999996" height="28" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="502" y="395" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">buttresses left: Holmes v Wilson</text><text x="860" y="234" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="end">Airspace to a reasonable height</text><text x="860" y="254" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="end" font-style="italic">(Bernstein v Skyviews, 1978)</text><rect x="30" y="486" width="270.6666666666667" height="143" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="514" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ACTIONABLE PER SE</text><text x="46" y="545.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">No damage needed. Only the</text><text x="46" y="566.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">entry need be intended: a</text><text x="46" y="587.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">mistake about ownership is no</text><text x="46" y="608.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">defence</text><rect x="314.6666666666667" y="486" width="270.6666666666667" height="143" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="330.6666666666667" y="514" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EXCEEDING PERMISSION</text><text x="330.6666666666667" y="545.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">The</tspan> <tspan font-style="italic">Calgarth</tspan> (1927): invited to</text><text x="330.6666666666667" y="566.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">use the staircase, not to slide</text><text x="330.6666666666667" y="587.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">down the banisters</text><rect x="599.3333333333334" y="486" width="270.6666666666667" height="143" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="615.3333333333334" y="514" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CONTINUING TRESPASS</text><text x="615.3333333333334" y="545.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Something left on the land: a</text><text x="615.3333333333334" y="566.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">fresh cause of action each day</text><text x="615.3333333333334" y="587.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(<tspan font-style="italic">Holmes</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Wilson</tspan>, 1839)</text>
</svg>