<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 686" width="900" height="686" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="686" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Does the 1984 Act give a trespasser a claim?</text>

<line x1="60" y1="120" x2="60" y2="341" stroke="#c9d6d4" stroke-width="4"/><rect x="104" y="100" width="766" height="79" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="130" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">s1(3)(a)</text><text x="122" y="156.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Aware of the danger, or reasonable grounds to believe it exists?</text><circle cx="60" cy="139.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="148.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="104" y="191" width="766" height="79" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="221" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">s1(3)(b)</text><text x="122" y="247.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Knows or has reasonable grounds to believe the person is or may come near it?</text><circle cx="60" cy="230.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="239.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="104" y="282" width="766" height="79" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="312" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">s1(3)(c)</text><text x="122" y="338.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">A risk the occupier may reasonably be expected to offer some protection against?</text><circle cx="60" cy="321.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="330.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="104" y="383" width="766" height="75" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="120" y="411" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">ALL THREE: DUTY UNDER s1(4)</text><text x="120" y="437.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Reasonable care that the person does not suffer injury from the danger</text><text x="450" y="492" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">CLAIMS THAT FAILED</text><rect x="30" y="514" width="270.6666666666667" height="140" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="543.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Ratcliff v McConnell (1999)</text><text x="46" y="570.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Dived into a closed college</text><text x="46" y="591.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">pool at night: an obvious risk</text><text x="46" y="612.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">accepted</text><rect x="314.6666666666667" y="514" width="270.6666666666667" height="140" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="330.6666666666667" y="543.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Tomlinson v Congleton BC</text><text x="330.6666666666667" y="564.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">(2003)</text><text x="330.6666666666667" y="591.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Dived into a shallow lake:</text><text x="330.6666666666667" y="612.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">danger from his own activity,</text><text x="330.6666666666667" y="633.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">not the state of the premises</text><rect x="599.3333333333334" y="514" width="270.6666666666667" height="140" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="615.3333333333334" y="543.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Keown v Coventry</text><text x="615.3333333333334" y="564.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Healthcare (2006)</text><text x="615.3333333333334" y="591.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Boy climbing a fire escape:</text><text x="615.3333333333334" y="612.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">similar reasoning</text>
</svg>