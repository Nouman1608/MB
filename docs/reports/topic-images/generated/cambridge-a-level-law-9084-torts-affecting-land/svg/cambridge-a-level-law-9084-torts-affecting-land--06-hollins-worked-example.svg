<rect x="30" y="124" width="560" height="280" rx="14" fill="#efdfa8" stroke="#1e2a44" stroke-width="2.5"/><text x="50" y="154" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Hollins Ltd’s quarry</text><rect x="590" y="124" width="280" height="280" rx="14" fill="#d8e3c6" stroke="#1e2a44" stroke-width="2.5"/><text x="850" y="154" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Neighbour’s land</text><ellipse cx="330" cy="274" rx="150" ry="70" fill="#8a6d0d" opacity="0.75" stroke="#1e2a44" stroke-width="2.5"/><text x="330" y="280" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">chemical lagoon</text><rect x="150" y="184" width="360" height="180" rx="20" fill="none" stroke="#1e2a44" stroke-width="3" stroke-dasharray="14 6"/><rect x="140" y="259" width="20" height="40" fill="#efdfa8"/><text x="130" y="252" font-size="15" font-weight="700" fill="#b5602e" text-anchor="end">broken fence</text><line x1="60" y1="334" x2="175" y2="284" stroke="#b5602e" stroke-width="3.5" marker-end="url(#ahR)"/><text x="50" y="364" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">Sam, 15, and</text><text x="50" y="382" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">other teenagers</text><path d="M480,294 C540,334 600,324 690,314" fill="none" stroke="#8a6d0d" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="4 8"/><line x1="680" y1="314" x2="712" y2="314" stroke="#8a6d0d" stroke-width="3" marker-end="url(#ahO)"/><circle cx="740" cy="314" r="26" fill="#2b5a9a" stroke="#1e2a44" stroke-width="2.5"/><text x="740" y="362" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">well</text><text x="610" y="374" font-size="15" font-weight="600" fill="#8a6d0d" text-anchor="start">seepage</text><rect x="30" y="424" width="413" height="194" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="452" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SAM: OLA 1984</text><text x="46" y="483.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="61.2" y="483.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Trespasser, so the 1984 Act</text><text x="46" y="507.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="61.2" y="507.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">s1(3): knows of the danger and regular entry;</text><text x="61.2" y="528.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">protection expected</text><text x="46" y="552.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="61.2" y="552.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">s1(4) breached: repairing the fence is cheap</text><text x="46" y="576.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="61.2" y="576.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Unlike <tspan font-style="italic">Tomlinson</tspan>, the danger is the state of the</text><text x="61.2" y="597.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">premises</text><rect x="457" y="424" width="413" height="194" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="473" y="452" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">NEIGHBOUR: RYLANDS v FLETCHER</text><text x="473" y="483.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="488.2" y="483.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Waste accumulated and dangerous</text><text x="473" y="507.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="488.2" y="507.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Non-natural use</text><text x="473" y="531.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="488.2" y="531.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Escaped, causing foreseeable damage to land</text><text x="488.2" y="552.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(<tspan font-style="italic">Cambridge</tspan> <tspan font-style="italic">Water</tspan>)</text><text x="473" y="576.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="488.2" y="576.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Private nuisance is an alternative</text>
