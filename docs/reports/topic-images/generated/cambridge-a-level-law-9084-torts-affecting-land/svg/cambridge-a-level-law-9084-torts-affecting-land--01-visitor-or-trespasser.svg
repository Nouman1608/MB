<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 865" width="900" height="865" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="865" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Which Occupiers’ Liability Act?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Identify the claimant’s status first</text>
<clipPath id="tc124"><rect x="30" y="124" width="840" height="609" rx="14"/></clipPath><g clip-path="url(#tc124)"><rect x="30" y="124" width="197.6470588235294" height="70" fill="#b5d3cf"/><rect x="227.6470588235294" y="124" width="321.17647058823525" height="70" fill="#b5d3cf"/><text x="241.6470588235294" y="151.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">1957 Act: lawful visitors</text><rect x="548.8235294117646" y="124" width="321.17647058823525" height="70" fill="#d4b02e"/><text x="562.8235294117646" y="151.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">1984 Act: trespassers and other</text><text x="562.8235294117646" y="173.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">non-visitors</text><rect x="30" y="194" width="197.6470588235294" height="68" fill="#dce9e7"/><text x="44" y="220.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Who</text><rect x="227.6470588235294" y="194" width="321.17647058823525" height="68" fill="#ffffff"/><text x="241.6470588235294" y="220.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Express or implied permission; beyond</text><text x="241.6470588235294" y="241.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">it, a trespasser</text><rect x="548.8235294117646" y="194" width="321.17647058823525" height="68" fill="#ffffff"/><text x="562.8235294117646" y="220.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Not visitors; builds on <tspan font-style="italic">Herrington</tspan></text><text x="562.8235294117646" y="241.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(1972), common humanity</text><line x1="30" y1="262" x2="870" y2="262" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="262" width="197.6470588235294" height="68" fill="#dce9e7"/><text x="44" y="288.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">When a duty arises</text><rect x="227.6470588235294" y="262" width="321.17647058823525" height="68" fill="#f8faf9"/><text x="241.6470588235294" y="288.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Always: the common duty of care</text><text x="241.6470588235294" y="309.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(s2(2))</text><rect x="548.8235294117646" y="262" width="321.17647058823525" height="68" fill="#f8faf9"/><text x="562.8235294117646" y="288.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Only if the three s1(3) conditions are</text><text x="562.8235294117646" y="309.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">met</text><line x1="30" y1="330" x2="870" y2="330" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="330" width="197.6470588235294" height="89" fill="#dce9e7"/><text x="44" y="356.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">The duty</text><rect x="227.6470588235294" y="330" width="321.17647058823525" height="89" fill="#ffffff"/><text x="241.6470588235294" y="356.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Reasonable care so the visitor is</text><text x="241.6470588235294" y="377.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">reasonably safe for the purposes of</text><text x="241.6470588235294" y="398.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the visit</text><rect x="548.8235294117646" y="330" width="321.17647058823525" height="89" fill="#ffffff"/><text x="562.8235294117646" y="356.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Reasonable care that the person does</text><text x="562.8235294117646" y="377.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">not suffer injury from the danger</text><text x="562.8235294117646" y="398.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(s1(4))</text><line x1="30" y1="419" x2="870" y2="419" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="419" width="197.6470588235294" height="47" fill="#dce9e7"/><text x="44" y="445.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Property damage</text><rect x="227.6470588235294" y="419" width="321.17647058823525" height="47" fill="#f8faf9"/><text x="241.6470588235294" y="445.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Covered</text><rect x="548.8235294117646" y="419" width="321.17647058823525" height="47" fill="#f8faf9"/><text x="562.8235294117646" y="445.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Not covered (s1(8))</text><line x1="30" y1="466" x2="870" y2="466" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="466" width="197.6470588235294" height="89" fill="#dce9e7"/><text x="44" y="492.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Warnings</text><rect x="227.6470588235294" y="466" width="321.17647058823525" height="89" fill="#ffffff"/><text x="241.6470588235294" y="492.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Discharge the duty only if enough to</text><text x="241.6470588235294" y="513.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">make the visitor reasonably safe</text><text x="241.6470588235294" y="534.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(s2(4)(a))</text><rect x="548.8235294117646" y="466" width="321.17647058823525" height="89" fill="#ffffff"/><text x="562.8235294117646" y="492.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A warning or discouraging the risk can</text><text x="562.8235294117646" y="513.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">discharge it (s1(5))</text><line x1="30" y1="555" x2="870" y2="555" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="555" width="197.6470588235294" height="89" fill="#dce9e7"/><text x="44" y="581.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Exclusion</text><rect x="227.6470588235294" y="555" width="321.17647058823525" height="89" fill="#f8faf9"/><text x="241.6470588235294" y="581.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">By agreement or notice (s2(1)); UCTA</text><text x="241.6470588235294" y="602.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">bars excluding negligent death or</text><text x="241.6470588235294" y="623.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">injury on business premises</text><rect x="548.8235294117646" y="555" width="321.17647058823525" height="89" fill="#f8faf9"/><text x="562.8235294117646" y="581.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The Act is silent: uncertain</text><line x1="30" y1="644" x2="870" y2="644" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="644" width="197.6470588235294" height="89" fill="#dce9e7"/><text x="44" y="670.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Defences</text><rect x="227.6470588235294" y="644" width="321.17647058823525" height="89" fill="#ffffff"/><text x="241.6470588235294" y="670.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Consent (s2(5)); contributory</text><text x="241.6470588235294" y="691.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">negligence; obvious dangers (<tspan font-style="italic">Darby</tspan> <tspan font-style="italic">v</tspan></text><text x="241.6470588235294" y="712.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">National</tspan> <tspan font-style="italic">Trust</tspan>)</text><rect x="548.8235294117646" y="644" width="321.17647058823525" height="89" fill="#ffffff"/><text x="562.8235294117646" y="670.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Risks willingly accepted (s1(6))</text></g><line x1="227.6470588235294" y1="124" x2="227.6470588235294" y2="733" stroke="#c9d6d4" stroke-width="1.5"/><line x1="548.8235294117646" y1="124" x2="548.8235294117646" y2="733" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="124" width="840" height="609" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="755" width="840" height="78" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="787.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Occupier:</tspan> sufficient control; there can be more than one (<tspan font-style="italic">Wheat</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">E</tspan> <tspan font-style="italic">Lacon</tspan>, 1966). <tspan font-weight="700" fill="#1e2a44">Common</tspan> <tspan font-weight="700" fill="#1e2a44">mistake:</tspan></text><text x="50" y="808.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">claiming property damage under the 1984 Act.</text>
</svg>