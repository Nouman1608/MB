<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 794" width="900" height="794" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="794" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Rylands v Fletcher (1868): five conditions</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Strict liability; a sub-species of private nuisance (Cambridge Water; Transco)</text>
<line x1="60" y1="144" x2="60" y2="598" stroke="#c9d6d4" stroke-width="4"/><rect x="104" y="124" width="766" height="85" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="157.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Brought onto the land and accumulated</text><text x="122" y="186.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Not things naturally there: <tspan font-style="italic">Giles</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Walker</tspan> (1890), thistles.</text><circle cx="60" cy="166.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="175.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="104" y="221" width="766" height="85" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="254.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Likely to do mischief if it escapes</text><text x="122" y="283.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Transco</tspan> (2003): an exceptionally high risk of danger.</text><circle cx="60" cy="263.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="272.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="104" y="318" width="766" height="106" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="351.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Non-natural use</text><text x="122" y="380.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Special use bringing increased danger (<tspan font-style="italic">Rickards</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Lothian</tspan>); a water pipe to flats is ordinary</text><text x="122" y="401.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">(<tspan font-style="italic">Transco</tspan>).</text><circle cx="60" cy="371" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="379.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="104" y="436" width="766" height="85" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="469.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Escape to land outside the defendant’s control</text><text x="122" y="498.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">None in <tspan font-style="italic">Read</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">J</tspan> <tspan font-style="italic">Lyons</tspan> (1947): injured inside the factory.</text><circle cx="60" cy="478.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="487.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="104" y="533" width="766" height="85" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="566.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Damage of a foreseeable type</text><text x="122" y="595.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Cambridge</tspan> <tspan font-style="italic">Water</tspan> (1994).</text><circle cx="60" cy="575.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="584.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><rect x="30" y="640" width="270.6666666666667" height="122" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="668" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">FAILED</text><text x="46" y="699.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Stannard</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Gore</tspan> (2012): tyres</text><text x="46" y="720.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">not exceptionally dangerous,</text><text x="46" y="741.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and fire escaped, not the tyres</text><rect x="314.6666666666667" y="640" width="270.6666666666667" height="122" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="330.6666666666667" y="668" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">LIMITS</text><text x="330.6666666666667" y="699.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Claimant needs an interest in</text><text x="330.6666666666667" y="720.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">land; no personal injury claims</text><rect x="599.3333333333334" y="640" width="270.6666666666667" height="122" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="615.3333333333334" y="668" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DEFENCES</text><text x="615.3333333333334" y="699.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Act of God; act of a stranger;</text><text x="615.3333333333334" y="720.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">consent; claimant’s default;</text><text x="615.3333333333334" y="741.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">statutory authority</text>
</svg>