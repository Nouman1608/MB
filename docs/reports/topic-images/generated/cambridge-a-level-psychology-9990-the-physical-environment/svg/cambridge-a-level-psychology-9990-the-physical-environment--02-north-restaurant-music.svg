<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 993" width="900" height="993" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="993" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Key study: North et al. (2003)</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Does background music style affect how much diners spend?</text>
<rect x="30" y="124" width="413" height="132" rx="14" fill="#eef1f0" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EARLIER: ARENI AND KIM (1993)</text><text x="50" y="182.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Classical music in a wine shop</text><text x="50" y="210.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">→ more expensive wine chosen</text><rect x="457" y="124" width="413" height="132" rx="14" fill="#eef1f0" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EARLIER: NORTH ET AL. (1999)</text><text x="477" y="182.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">French v German music in a supermarket</text><text x="477" y="210.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">→ wine from the matching country outsold the</text><text x="477" y="231.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">other</text><text x="450" y="291.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Music seems to <tspan font-weight="700">prime</tspan> ideas linked to its style.</text><rect x="30" y="322" width="840" height="70" rx="14" fill="#ffffff"/><path d="M44,322 H200 V392 H44 A14,14 0 0 1 30,378 V336 A14,14 0 0 1 44,322 Z" fill="#f2e7b8"/><rect x="30" y="322" width="840" height="70" rx="14" fill="none" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="360.44" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Aim</text><text x="216" y="350.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">To investigate whether the style of background music in a restaurant affects how</text><text x="216" y="371.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">much diners spend</text><rect x="30" y="402" width="840" height="99" rx="14" fill="#ffffff"/><path d="M44,402 H200 V501 H44 A14,14 0 0 1 30,487 V416 A14,14 0 0 1 44,402 Z" fill="#b5d3cf"/><rect x="30" y="402" width="840" height="99" rx="14" fill="none" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="454.94" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Method</text><text x="216" y="430.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="231.2" y="430.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Field experiment in a restaurant; different evenings</text><text x="216" y="455.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="231.2" y="455.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">IV: <tspan font-weight="700" fill="#1e2a44">classical,</tspan> <tspan font-weight="700" fill="#1e2a44">pop</tspan> <tspan font-weight="700" fill="#1e2a44">or</tspan> <tspan font-weight="700" fill="#1e2a44">no</tspan> <tspan font-weight="700" fill="#1e2a44">music</tspan></text><text x="216" y="480.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="231.2" y="480.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">DV: spend per head from the bills: starters, mains, desserts, coffee, drinks, total</text><rect x="30" y="511" width="840" height="70" rx="14" fill="#fbf7e6"/><path d="M44,511 H200 V581 H44 A14,14 0 0 1 30,567 V525 A14,14 0 0 1 44,511 Z" fill="#d4b02e"/><rect x="30" y="511" width="840" height="70" rx="14" fill="none" stroke="#8a6d0d" stroke-width="2.5"/><text x="46" y="549.44" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Results</text><text x="216" y="539.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Spending per head was <tspan font-weight="700" fill="#1e2a44">highest</tspan> <tspan font-weight="700" fill="#1e2a44">with</tspan> <tspan font-weight="700" fill="#1e2a44">classical</tspan> <tspan font-weight="700" fill="#1e2a44">music</tspan>, compared with pop and no</text><text x="216" y="560.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">music</text><rect x="30" y="591" width="840" height="70" rx="14" fill="#ffffff"/><path d="M44,591 H200 V661 H44 A14,14 0 0 1 30,647 V605 A14,14 0 0 1 44,591 Z" fill="#2e6b62"/><rect x="30" y="591" width="840" height="70" rx="14" fill="none" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="629.44" font-size="17" font-weight="700" fill="#ffffff" text-anchor="start">Conclusion</text><text x="216" y="619.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Classical music may create a sophisticated, upmarket atmosphere that primes</text><text x="216" y="640.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">diners to spend more</text><rect x="30" y="683" width="413" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="715" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STRENGTH</text><text x="50" y="741.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">High ecological validity</text><text x="50" y="769.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Real diners, real money; unaware of the study.</text><rect x="457" y="683" width="413" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="715" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">LIMITATION</text><text x="477" y="741.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">No random allocation</text><text x="477" y="769.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Weather, day or type of customer could</text><text x="477" y="790.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">confound.</text><rect x="30" y="829" width="413" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="861" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">LIMITATION</text><text x="50" y="887.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Generalisation</text><text x="50" y="915.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">One restaurant, one country; classical music may</text><text x="50" y="936.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">mean different things in other cultures.</text><rect x="457" y="829" width="413" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="861" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">ETHICS</text><text x="477" y="887.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">No consent</text><text x="477" y="915.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">But spending data were anonymous and the</text><text x="477" y="936.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">music harmless.</text>
</svg>