<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The PAD model</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Mehrabian and Russell</text>
<rect x="30" y="194" width="220" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="140" y="248" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">STIMULI</text><text x="140" y="274.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Music, light, scent,</text><text x="140" y="297.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">crowding</text><rect x="320" y="124" width="260" height="86" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="157.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Pleasure</text><text x="450" y="186.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">how happy or satisfied</text><line x1="256" y1="269" x2="314" y2="167" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="320" y="224" width="260" height="86" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="257.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Arousal</text><text x="450" y="286.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">how stimulated or alert</text><line x1="256" y1="269" x2="314" y2="267" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="320" y="324" width="260" height="86" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="357.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Dominance</text><text x="450" y="386.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">how in control</text><line x1="256" y1="269" x2="314" y2="367" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="650" y="144" width="220" height="129" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="760" y="176" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">APPROACH</text><text x="760" y="202.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Stay longer,</text><text x="760" y="225.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">explore, spend,</text><text x="760" y="248.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">return</text><rect x="650" y="284" width="220" height="120" rx="14" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5"/><text x="760" y="334.5" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">AVOIDANCE</text><text x="760" y="360.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Leave, do not return</text><line x1="586" y1="267" x2="644" y2="204" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="586" y1="267" x2="644" y2="344" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="140" y="174" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">environment</text><text x="450" y="440" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">emotional states</text><text x="760" y="424" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">behaviour</text><rect x="30" y="466" width="840" height="60" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="500.4" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">Pleasant, moderately arousing and in control → <tspan font-weight="700" fill="#1e2a44">approach</tspan>.</text>
