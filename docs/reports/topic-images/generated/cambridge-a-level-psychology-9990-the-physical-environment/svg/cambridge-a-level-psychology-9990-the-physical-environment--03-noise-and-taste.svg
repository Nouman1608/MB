<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 594" width="900" height="594" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="594" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Background noise and taste</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Woods et al. (2011): loud background noise</text>
<rect x="30" y="124" width="413" height="90" rx="14" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5"/><text x="236.5" y="156" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">RATED WEAKER</text><text x="236.5" y="186.72" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">Sweet ↓ Salty ↓</text><rect x="457" y="124" width="413" height="90" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="663.5" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">RATED STRONGER</text><text x="663.5" y="186.72" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">Crunchiness ↑</text><text x="450" y="252" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">WHY? THREE SUGGESTED REASONS</text><rect x="30" y="274" width="272" height="155" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="306" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ATTENTION</text><text x="50" y="332.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Noise draws attention</text><text x="50" y="355.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">away from taste</text><text x="50" y="383.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">so flavour seems weaker</text><rect x="314" y="274" width="272" height="155" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="334" y="306" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">AROUSAL OR DISCOMFORT</text><text x="334" y="332.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Loud noise may change</text><text x="334" y="355.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">mood</text><text x="334" y="383.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">food less enjoyable</text><rect x="598" y="274" width="272" height="155" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="618" y="306" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">MASKING AND ENHANCING</text><text x="618" y="332.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Changes the sounds of</text><text x="618" y="355.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">eating</text><text x="618" y="383.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">which contribute to</text><text x="618" y="404.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">crunchiness</text><rect x="30" y="451" width="413" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="483" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">APPLICATION</text><text x="50" y="509.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Aircraft cabins, noisy restaurants</text><text x="50" y="537.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">food may need stronger seasoning</text><rect x="457" y="451" width="413" height="111" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="483" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EVALUATION</text><text x="477" y="509.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Laboratory with headphones</text><text x="477" y="537.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">well controlled but artificial</text>
</svg>