<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 530" width="900" height="530" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="530" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Applying the topic: a bookshop</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Goal: customers browse for longer</text>
<rect x="30" y="124" width="840" height="64" rx="14" fill="#ffffff"/><path d="M44,124 H310 V188 H44 A14,14 0 0 1 30,174 V138 A14,14 0 0 1 44,124 Z" fill="#f2e7b8"/><rect x="30" y="124" width="840" height="64" rx="14" fill="none" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="159.44" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Freeform layout with seating</text><text x="326" y="160.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Freeform encourages <tspan font-weight="700" fill="#1e2a44">browsing</tspan> and exploration</text><rect x="30" y="198" width="840" height="64" rx="14" fill="#ffffff"/><path d="M44,198 H310 V262 H44 A14,14 0 0 1 30,248 V212 A14,14 0 0 1 44,198 Z" fill="#f2e7b8"/><rect x="30" y="198" width="840" height="64" rx="14" fill="none" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="233.44" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Slow, quiet music</text><text x="326" y="234.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Pleasure with moderate arousal → <tspan font-weight="700" fill="#1e2a44">approach</tspan> behaviour (PAD)</text><rect x="30" y="272" width="840" height="64" rx="14" fill="#ffffff"/><path d="M44,272 H310 V336 H44 A14,14 0 0 1 30,322 V286 A14,14 0 0 1 44,272 Z" fill="#f2e7b8"/><rect x="30" y="272" width="840" height="64" rx="14" fill="none" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="307.44" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Subtle pleasant scent</text><text x="326" y="308.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Adds <tspan font-weight="700" fill="#1e2a44">pleasure</tspan> → approach behaviour</text><rect x="30" y="346" width="840" height="72" rx="14" fill="#ffffff"/><path d="M44,346 H310 V418 H44 A14,14 0 0 1 30,404 V360 A14,14 0 0 1 44,346 Z" fill="#f2e7b8"/><rect x="30" y="346" width="840" height="72" rx="14" fill="none" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="385.44" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Uncluttered aisles</text><text x="326" y="375.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Avoids <tspan font-weight="700" fill="#1e2a44">spatial</tspan> <tspan font-weight="700" fill="#1e2a44">crowding</tspan>, so shoppers keep a sense of</text><text x="326" y="397.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">dominance</tspan></text><rect x="30" y="440" width="840" height="58" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="473.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Each suggestion earns credit only when it is <tspan font-weight="700" fill="#1e2a44">linked</tspan> <tspan font-weight="700" fill="#1e2a44">to</tspan> <tspan font-weight="700" fill="#1e2a44">a</tspan> <tspan font-weight="700" fill="#1e2a44">concept</tspan>.</text>
</svg>