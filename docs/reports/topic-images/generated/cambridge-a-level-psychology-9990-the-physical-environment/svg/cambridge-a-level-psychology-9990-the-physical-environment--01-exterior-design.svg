<rect width="900" height="779" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Exterior store design</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Three features named in the syllabus</text>
<rect x="30" y="124" width="840" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="40" y="324" width="820" height="40" fill="#d8e3c6"/><rect x="250" y="174" width="400" height="150" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><rect x="250" y="174" width="400" height="44" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="450" y="204" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">SIGNAGE</text><rect x="275" y="236" width="140" height="88" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><rect x="485" y="236" width="140" height="88" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><rect x="425" y="244" width="50" height="80" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><rect x="300" y="284" width="22" height="40" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.5"/><rect x="330" y="272" width="22" height="52" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.5"/><rect x="360" y="260" width="22" height="64" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.5"/><rect x="145" y="284" width="10" height="40" fill="#9c8f6e"/><circle cx="150" cy="269" r="30" fill="#6f9a52" stroke="#1e2a44" stroke-width="2.5"/><rect x="745" y="284" width="10" height="40" fill="#9c8f6e"/><circle cx="750" cy="269" r="30" fill="#6f9a52" stroke="#1e2a44" stroke-width="2.5"/><ellipse cx="200" cy="328" rx="40" ry="12" fill="#6f9a52"/><ellipse cx="700" cy="328" rx="40" ry="12" fill="#6f9a52"/><text x="450" y="158" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Storefront: entrance, signage, materials, colours, lighting</text><rect x="274.4475" y="328" width="141.10500000000002" height="29" rx="14.5" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="345" y="347.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Window display</text><rect x="90.87" y="184" width="118.26" height="29" rx="14.5" fill="#ffffff" stroke="#6f9a52" stroke-width="2"/><text x="150" y="203.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Landscaping</text><rect x="30" y="396" width="272" height="155" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="428" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STOREFRONT</text><text x="50" y="454.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Signals the kind of shop</text><text x="50" y="477.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">and the prices to expect</text><rect x="314" y="396" width="272" height="155" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="334" y="428" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">WINDOW DISPLAYS</text><text x="334" y="454.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Attract attention and</text><text x="334" y="477.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">invite people in</text><text x="334" y="505.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">new stock, a season or a</text><text x="334" y="526.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">lifestyle</text><rect x="598" y="396" width="272" height="155" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="618" y="428" font-size="15" font-weight="700" fill="#6f9a52" text-anchor="start">LANDSCAPING</text><text x="618" y="454.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Plants, trees and flower</text><text x="618" y="477.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">beds</text><text x="618" y="505.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">a more pleasant, inviting</text><text x="618" y="526.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">exterior</text><rect x="30" y="573" width="249.33333333333334" height="110" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="154.66666666666669" y="607.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Landscaping and</text><text x="154.66666666666669" y="630.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">window displays</text><text x="154.66666666666669" y="658.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Mower et al. (2012)</text><line x1="285.33333333333337" y1="628" x2="319.33333333333337" y2="628" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="325.33333333333337" y="573" width="249.33333333333334" height="110" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450.00000000000006" y="621.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">More liking for the</text><text x="450.00000000000006" y="644.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">store</text><line x1="580.6666666666667" y1="628" x2="614.6666666666667" y2="628" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="620.6666666666667" y="573" width="249.33333333333334" height="110" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="745.3333333333334" y="632.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Intention to visit</text><text x="450" y="717.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Rating images is controlled and quantitative, but not the same as walking past a real shop; preferences may</text><text x="450" y="738.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">differ between cultures.</text>
</svg>