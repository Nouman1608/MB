<rect width="900" height="650" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Crowding: Machleit et al. (2000)</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Perceived crowding lowers shopping satisfaction</text>
<rect x="30" y="124" width="405" height="230" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="160" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Human crowding</text><text x="54" y="184" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">too many people</text><rect x="70" y="208" width="325" height="120" rx="6" fill="#eef1f0" stroke="#1e2a44" stroke-width="2.5"/><circle cx="90" cy="226" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.5"/><circle cx="143" cy="263" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.5"/><circle cx="196" cy="300" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.5"/><circle cx="249" cy="251" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.5"/><circle cx="302" cy="288" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.5"/><circle cx="355" cy="239" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.5"/><circle cx="118" cy="276" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.5"/><circle cx="171" cy="227" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.5"/><circle cx="224" cy="264" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.5"/><circle cx="277" cy="301" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.5"/><circle cx="330" cy="252" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.5"/><circle cx="93" cy="289" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.5"/><circle cx="146" cy="240" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.5"/><circle cx="199" cy="277" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.5"/><circle cx="252" cy="228" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.5"/><circle cx="305" cy="265" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.5"/><circle cx="358" cy="302" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.5"/><circle cx="121" cy="253" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.5"/><circle cx="174" cy="290" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.5"/><circle cx="227" cy="241" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.5"/><circle cx="280" cy="278" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.5"/><circle cx="333" cy="229" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.5"/><circle cx="96" cy="266" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.5"/><circle cx="149" cy="303" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.5"/><circle cx="202" cy="254" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.5"/><circle cx="255" cy="291" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.5"/><rect x="465" y="124" width="405" height="230" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="489" y="160" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Spatial crowding</text><text x="489" y="184" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">too much merchandise or too little space</text><rect x="505" y="208" width="325" height="120" rx="6" fill="#eef1f0" stroke="#1e2a44" stroke-width="2.5"/><rect x="515" y="218" width="305" height="24" fill="#cbbf9f" stroke="#1e2a44" stroke-width="1.5"/><rect x="515" y="256" width="305" height="24" fill="#cbbf9f" stroke="#1e2a44" stroke-width="1.5"/><rect x="515" y="294" width="305" height="24" fill="#cbbf9f" stroke="#1e2a44" stroke-width="1.5"/><circle cx="665" cy="252" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.5"/><rect x="30" y="376" width="249.33333333333334" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="154.66666666666669" y="435.32" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Crowding</text><line x1="285.33333333333337" y1="430.5" x2="319.33333333333337" y2="430.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="325.33333333333337" y="376" width="249.33333333333334" height="109" rx="14" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5"/><text x="450.00000000000006" y="410.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Less dominance</text><text x="450.00000000000006" y="439.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">shoppers feel less in</text><text x="450.00000000000006" y="460.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">control</text><line x1="580.6666666666667" y1="430.5" x2="614.6666666666667" y2="430.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="620.6666666666667" y="376" width="249.33333333333334" height="109" rx="14" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5"/><text x="745.3333333333334" y="435.32" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Lower satisfaction</text><rect x="30" y="507" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="541.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">But it depends on expectations and tolerance</text><text x="50" y="571.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A crowded market may be expected and enjoyed; the same crowd in a quiet boutique feels</text><text x="50" y="593.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">unpleasant.</text>
</svg>