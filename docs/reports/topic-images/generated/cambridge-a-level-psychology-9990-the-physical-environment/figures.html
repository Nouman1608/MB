<figure class="topic-figure">

<!-- place after: ### Background noise and taste -->
<figure class="topic-figure">
  <img src="https://img.marlbridge.com/cambridge-a-level-psychology-9990-the-physical-environment--03-noise-and-taste.webp" width="900" height="594" alt="Woods et al. (2011) found loud background noise lowered ratings of sweetness and saltiness but raised ratings of crunchiness. Three suggested reasons are attention drawn away from taste, arousal or discomfort, and masking or enhancing the sounds of eating. Food in aircraft and noisy restaurants may need stronger seasoning; the laboratory method was controlled but artificial." loading="lazy">
  <figcaption>Noise weakens sweet and salty tastes but makes food seem crunchier.</figcaption>
</figure>

<!-- place after: ### The PAD model -->
<figure class="topic-figure">
  <img src="https://img.marlbridge.com/cambridge-a-level-psychology-9990-the-physical-environment--04-pad-model.webp" width="900" height="558" alt="Environmental stimuli such as music, light, scent and crowding produce three emotional states: pleasure, arousal and dominance. These lead to approach behaviours (staying longer, exploring, spending, returning) or avoidance (leaving, not returning). A pleasant, moderately arousing environment where shoppers feel in control encourages approach." loading="lazy">
  <figcaption>Stimuli shape pleasure, arousal and dominance, which drive approach or avoidance.</figcaption>
</figure>

<!-- place after: ### Odour -->
<figure class="topic-figure">
  <img src="https://img.marlbridge.com/cambridge-a-level-psychology-9990-the-physical-environment--05-odour.webp" width="900" height="419" alt="A pleasant scent improved shoppers' perceptions of the mall and of product quality, which were linked to spending. The real mall gives ecological validity, but questionnaires are subjective and people differ in which scents they like." loading="lazy">
  <figcaption>Scent works through perceptions of the mall and its products.</figcaption>
</figure>

<!-- place after: ### Crowding -->
<figure class="topic-figure">
  <img src="https://img.marlbridge.com/cambridge-a-level-psychology-9990-the-physical-environment--06-crowding.webp" width="900" height="650" alt="Two schematic shop interiors: human crowding with too many people, and spatial crowding with too much merchandise or too little space. Crowding reduces dominance, so shoppers feel less in control and less satisfied, but the effect depends on expectations: a crowded market can be enjoyed while the same crowd in a boutique feels unpleasant." loading="lazy">
  <figcaption>Crowding lowers dominance, but expectations decide how much it matters.</figcaption>
</figure>
