<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 601" width="900" height="601" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="601" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Post-event discussion: Gabbert et al. (2003)</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Pairs saw different films of the same crime, then discussed it</text>
<text x="30" y="140" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">REPORTED DETAILS THEY COULD ONLY HAVE LEARNED FROM THEIR PARTNER</text><text x="184" y="187" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="end">Discussed</text><rect x="200" y="160" width="369.2" height="42" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><text x="579.2" y="188" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">71%</text><text x="184" y="243" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="end">Control</text><rect x="200" y="216" width="0" height="42" fill="#c9d6d4" stroke="#1e2a44" stroke-width="2"/><text x="210" y="244" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">0%</text><line x1="200" y1="152" x2="200" y2="266" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="280" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="314.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Memory conformity</text><text x="50" y="344.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A wish to agree, or genuine incorporation of the other witness’s details.</text><rect x="30" y="391" width="413" height="134" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="423" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">LIMITATION OF LAB STUDIES</text><text x="50" y="449.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Films lack the emotional consequences of</text><text x="50" y="472.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">a real crime</text><rect x="457" y="391" width="413" height="134" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="477" y="423" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">YUILLE AND CUTSHALL (1986)</text><text x="477" y="449.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Real shooting: accounts highly accurate</text><text x="477" y="472.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">months later</text><text x="477" y="500.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">misleading questions had little effect</text><text x="450" y="560.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Laboratory studies may <tspan font-weight="700">overstate</tspan> the problem.</text>
</svg>