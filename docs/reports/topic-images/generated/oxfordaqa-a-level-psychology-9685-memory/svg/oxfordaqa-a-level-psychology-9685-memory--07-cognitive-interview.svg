<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 629" width="900" height="629" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="629" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The cognitive interview</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Fisher and Geiselman: four techniques, each with a rationale</text>
<rect x="30" y="124" width="840" height="62" rx="14" fill="#ffffff"/><path d="M44,124 H250 V186 H44 A14,14 0 0 1 30,172 V138 A14,14 0 0 1 44,124 Z" fill="#f2e7b8"/><rect x="30" y="124" width="840" height="62" rx="14" fill="none" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="158.44" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Report everything</text><text x="266" y="159.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Even trivial details may cue more important memories</text><rect x="30" y="196" width="840" height="72" rx="14" fill="#ffffff"/><path d="M44,196 H250 V268 H44 A14,14 0 0 1 30,254 V210 A14,14 0 0 1 44,196 Z" fill="#f2e7b8"/><rect x="30" y="196" width="840" height="72" rx="14" fill="none" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="235.44" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Reinstate the context</text><text x="266" y="225.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Mentally returning to the scene uses environmental and emotional cues</text><text x="266" y="247.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">present at encoding</text><rect x="30" y="278" width="840" height="62" rx="14" fill="#ffffff"/><path d="M44,278 H250 V340 H44 A14,14 0 0 1 30,326 V292 A14,14 0 0 1 44,278 Z" fill="#f2e7b8"/><rect x="30" y="278" width="840" height="62" rx="14" fill="none" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="312.44" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Reverse the order</text><text x="266" y="313.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Disrupts expectations and schemas that might fill gaps</text><rect x="30" y="350" width="840" height="72" rx="14" fill="#ffffff"/><path d="M44,350 H250 V422 H44 A14,14 0 0 1 30,408 V364 A14,14 0 0 1 44,350 Z" fill="#f2e7b8"/><rect x="30" y="350" width="840" height="72" rx="14" fill="none" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="389.44" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Change perspective</text><text x="266" y="379.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Another person’s viewpoint reduces the influence of the witness’s own</text><text x="266" y="401.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">schemas</text><rect x="30" y="444" width="413" height="153" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="476" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STRENGTH</text><text x="50" y="502.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">More correct information</text><text x="50" y="530.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Köhnken et al. (1999) meta-analysis v standard</text><text x="50" y="551.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">interviews.</text><rect x="457" y="444" width="413" height="153" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="476" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">LIMITATION</text><text x="477" y="502.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Costs</text><text x="477" y="530.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Small rise in incorrect details; slower; needs</text><text x="477" y="551.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">trained officers, so often only some techniques</text><text x="477" y="572.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">are used.</text>
</svg>