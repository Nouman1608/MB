<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 630" width="900" height="630" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="630" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">An application answer: Amira’s phone number</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Use the multi-store model [4]</text>
<line x1="60" y1="144" x2="60" y2="476" stroke="#c9d6d4" stroke-width="4"/><rect x="104" y="124" width="766" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="156.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Attention</text><text x="122" y="185.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">She paid attention, so the number passed from the sensory register into STM.</text><circle cx="60" cy="166" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="174.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="104" y="220" width="766" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="252.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Rehearsal</text><text x="122" y="281.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Repeating it was maintenance rehearsal: it stayed in STM long enough to dial.</text><circle cx="60" cy="262" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="270.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="104" y="316" width="766" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="348.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Capacity and duration</text><text x="122" y="377.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">STM holds about 7 ± 2 items for up to about 30 s; once rehearsal stopped, it decayed.</text><circle cx="60" cy="358" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="366.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="104" y="412" width="766" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="444.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Transfer</text><text x="122" y="473.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Brief rehearsal did not transfer it to LTM, so it could not be retrieved next day.</text><circle cx="60" cy="454" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="462.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="30" y="518" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="551.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Each sentence pairs a <tspan font-weight="700" fill="#1e2a44">feature</tspan> <tspan font-weight="700" fill="#1e2a44">of</tspan> <tspan font-weight="700" fill="#1e2a44">the</tspan> <tspan font-weight="700" fill="#1e2a44">model</tspan> with a <tspan font-weight="700" fill="#1e2a44">detail</tspan> <tspan font-weight="700" fill="#1e2a44">from</tspan> <tspan font-weight="700" fill="#1e2a44">the</tspan> <tspan font-weight="700" fill="#1e2a44">scenario</tspan>: that link earns AO2</text><text x="450" y="573.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">marks.</text>
</svg>