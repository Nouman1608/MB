<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 849" width="900" height="849" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="849" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The working memory model</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Baddeley and Hitch (1974): replaces the single short-term store</text>
<rect x="220" y="124" width="460" height="114" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="160.38" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Central executive</text><text x="450" y="189.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Directs attention; allocates resources</text><text x="450" y="213.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Very limited capacity; <tspan font-weight="700" fill="#1e2a44">does</tspan> <tspan font-weight="700" fill="#1e2a44">not</tspan> <tspan font-weight="700" fill="#1e2a44">store</tspan> information</text><line x1="320" y1="242" x2="165.33333333333334" y2="292" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="450" y1="242" x2="450" y2="292" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="580" y1="242" x2="734.6666666666667" y2="292" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="298" width="270.6666666666667" height="188" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="328.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Phonological loop</text><text x="46" y="356" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Coding:</tspan> acoustic</text><text x="46" y="381" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Parts:</tspan> phonological store (“inner</text><text x="46" y="401" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">ear”), articulatory process (“inner</text><text x="46" y="421" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">voice”)</text><text x="46" y="446" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Capacity:</tspan> about two seconds of</text><text x="46" y="466" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">speech</text><rect x="314.6666666666667" y="298" width="270.6666666666667" height="188" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="330.6666666666667" y="328.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Episodic buffer</text><text x="330.6666666666667" y="356" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Added:</tspan> Baddeley (2000)</text><text x="330.6666666666667" y="381" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Coding:</tspan> multi-modal; integrates</text><text x="330.6666666666667" y="401" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">components and LTM into</text><text x="330.6666666666667" y="421" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">episodes</text><text x="330.6666666666667" y="446" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Capacity:</tspan> a few chunks</text><rect x="599.3333333333334" y="298" width="270.6666666666667" height="188" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="615.3333333333334" y="328.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Visuo-spatial sketchpad</text><text x="615.3333333333334" y="356" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Coding:</tspan> visual and spatial</text><text x="615.3333333333334" y="381" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Example:</tspan> the layout of a room</text><text x="615.3333333333334" y="406" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Capacity:</tspan> a few objects at a time</text><rect x="30" y="508" width="413" height="155" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="540" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">WORD LENGTH EFFECT</text><text x="50" y="566.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">More short words recalled than long</text><text x="50" y="589.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">words</text><text x="50" y="617.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Baddeley, Thomson and Buchanan (1975): the</text><text x="50" y="638.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">loop holds about two seconds of speech</text><rect x="457" y="508" width="413" height="155" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="540" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DUAL-TASK STUDIES</text><text x="477" y="566.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Same component: interference</text><text x="477" y="594.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Different components (visual + verbal): little loss</text><rect x="30" y="685" width="413" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="717" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STRENGTH</text><text x="50" y="743.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Fits KF</text><text x="50" y="771.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Damaged phonological loop, intact sketchpad.</text><rect x="457" y="685" width="413" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="717" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">LIMITATION</text><text x="477" y="743.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Central executive poorly specified</text><text x="477" y="771.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">“Controls attention” does not say how: hard to</text><text x="477" y="792.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">test.</text>
</svg>