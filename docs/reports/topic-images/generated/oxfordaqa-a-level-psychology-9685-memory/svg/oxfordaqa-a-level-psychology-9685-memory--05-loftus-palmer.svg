<rect width="900" height="613" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Leading questions: Loftus and Palmer (1974)</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Students watched films of car crashes</text>
<text x="30" y="140" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">EXPERIMENT 1: MEAN SPEED ESTIMATE (MPH)</text><text x="184" y="187" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="end">“smashed”</text><rect x="200" y="160" width="468" height="42" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><text x="678" y="188" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">40.5 mph</text><text x="184" y="243" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="end">“contacted”</text><rect x="200" y="216" width="367.46666666666664" height="42" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="577.4666666666667" y="244" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">31.8 mph</text><line x1="200" y1="152" x2="200" y2="266" stroke="#1e2a44" stroke-width="2.5"/><text x="30" y="296" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">EXPERIMENT 2, ONE WEEK LATER: FALSELY REPORTED BROKEN GLASS</text><text x="184" y="340" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="end">“smashed”</text><rect x="200" y="316" width="369.77777777777777" height="36" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><text x="579.7777777777778" y="341" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">32%</text><text x="184" y="388" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="end">“hit”</text><rect x="200" y="364" width="161.77777777777777" height="36" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="371.77777777777777" y="389" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">14%</text><text x="184" y="436" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="end">control</text><rect x="200" y="412" width="138.66666666666666" height="36" fill="#c9d6d4" stroke="#1e2a44" stroke-width="2"/><text x="348.66666666666663" y="437" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">12%</text><line x1="200" y1="308" x2="200" y2="456" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="470" width="413" height="111" rx="14" fill="#eef1f0" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="504.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">RESPONSE BIAS</text><text x="50" y="530.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Wording affects the answer, not the</text><text x="50" y="553.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">memory</text><rect x="457" y="470" width="413" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="477" y="502" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SUBSTITUTION</text><text x="477" y="528.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Wording alters the stored memory itself</text><text x="477" y="556.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">supported by the broken-glass finding</text>
</svg>