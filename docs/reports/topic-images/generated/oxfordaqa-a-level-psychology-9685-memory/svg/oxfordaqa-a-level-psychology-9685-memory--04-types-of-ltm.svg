<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 657" width="900" height="657" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="657" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Types of long-term memory</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Tulving (1972): episodic and semantic; procedural added as a third type</text>
<rect x="30" y="124" width="270.6666666666667" height="155" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EPISODIC: EXPLICIT</text><text x="50" y="182.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Personal experiences,</text><text x="50" y="205.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">tied to time and place</text><text x="50" y="233.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Remembering</tspan> <tspan font-style="italic">your</tspan> <tspan font-style="italic">first</tspan> <tspan font-style="italic">day</tspan> <tspan font-style="italic">at</tspan></text><text x="50" y="254.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">school</tspan></text><rect x="314.6666666666667" y="124" width="270.6666666666667" height="155" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="334.6666666666667" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SEMANTIC: EXPLICIT</text><text x="334.6666666666667" y="182.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Facts and general</text><text x="334.6666666666667" y="205.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">knowledge</text><text x="334.6666666666667" y="233.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Paris</tspan> <tspan font-style="italic">is</tspan> <tspan font-style="italic">the</tspan> <tspan font-style="italic">capital</tspan> <tspan font-style="italic">of</tspan> <tspan font-style="italic">France</tspan></text><rect x="599.3333333333334" y="124" width="270.6666666666667" height="155" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="619.3333333333334" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PROCEDURAL: IMPLICIT</text><text x="619.3333333333334" y="182.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Skills and actions</text><text x="619.3333333333334" y="210.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Riding</tspan> <tspan font-style="italic">a</tspan> <tspan font-style="italic">bicycle</tspan></text><text x="450" y="317" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">EVIDENCE FROM BRAIN DAMAGE</text><clipPath id="tc339"><rect x="30" y="339" width="840" height="184" rx="14"/></clipPath><g clip-path="url(#tc339)"><rect x="30" y="339" width="225.36585365853662" height="48" fill="#b5d3cf"/><text x="44" y="366.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Case</text><rect x="255.36585365853662" y="339" width="204.87804878048783" height="48" fill="#f2e7b8"/><text x="269.3658536585366" y="366.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Episodic</text><rect x="460.24390243902445" y="339" width="204.87804878048783" height="48" fill="#f2e7b8"/><text x="474.24390243902445" y="366.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Semantic</text><rect x="665.1219512195123" y="339" width="204.87804878048783" height="48" fill="#b5d3cf"/><text x="679.1219512195123" y="366.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Procedural</text><rect x="30" y="387" width="225.36585365853662" height="68" fill="#dce9e7"/><text x="44" y="413.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Clive Wearing (viral</text><text x="44" y="434.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">brain infection)</text><rect x="255.36585365853662" y="387" width="204.87804878048783" height="68" fill="#f6e3d8"/><text x="269.3658536585366" y="413.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">✗ lost most</text><rect x="460.24390243902445" y="387" width="204.87804878048783" height="68" fill="#eaf3ef"/><text x="474.24390243902445" y="413.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">✓ knew many facts</text><rect x="665.1219512195123" y="387" width="204.87804878048783" height="68" fill="#eaf3ef"/><text x="679.1219512195123" y="413.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">✓ could still play the</text><text x="679.1219512195123" y="434.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">piano</text><line x1="30" y1="455" x2="870" y2="455" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="455" width="225.36585365853662" height="68" fill="#dce9e7"/><text x="44" y="481.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">HM</text><rect x="255.36585365853662" y="455" width="204.87804878048783" height="68" fill="#f6e3d8"/><text x="269.3658536585366" y="481.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">✗ no memory of</text><text x="269.3658536585366" y="502.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">practising</text><rect x="460.24390243902445" y="455" width="204.87804878048783" height="68" fill="#f8faf9"/><rect x="665.1219512195123" y="455" width="204.87804878048783" height="68" fill="#eaf3ef"/><text x="679.1219512195123" y="481.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">✓ learned</text><text x="679.1219512195123" y="502.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">mirror-drawing</text></g><line x1="255.36585365853662" y1="339" x2="255.36585365853662" y2="523" stroke="#c9d6d4" stroke-width="1.5"/><line x1="460.24390243902445" y1="339" x2="460.24390243902445" y2="523" stroke="#c9d6d4" stroke-width="1.5"/><line x1="665.1219512195123" y1="339" x2="665.1219512195123" y2="523" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="339" width="840" height="184" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="545" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="578.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">The types seem stored at least partly separately, but <tspan font-weight="700" fill="#1e2a44">unusual</tspan> <tspan font-weight="700" fill="#1e2a44">individuals</tspan> are hard to generalise</text><text x="450" y="600.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">from.</text>
</svg>