<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 486" width="900" height="486" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="486" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The multi-store model</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Atkinson and Shiffrin (1968): three separate stores</text>
<rect x="30" y="184" width="216" height="270" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="138" y="220" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Sensory register</text><text x="48" y="254" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">CODING</text><text x="48" y="276" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">modality-specific</text><text x="48" y="297" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(visual, auditory…)</text><text x="48" y="326" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">CAPACITY</text><text x="48" y="348" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">very large</text><text x="48" y="377" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">DURATION</text><text x="48" y="399" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">very brief: under a</text><text x="48" y="420" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">second for visual</text><rect x="342" y="184" width="216" height="270" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="220" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Short-term memory</text><text x="360" y="254" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">CODING</text><text x="360" y="276" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">mainly acoustic</text><text x="360" y="305" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">CAPACITY</text><text x="360" y="327" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">about 7 ± 2 items</text><text x="360" y="356" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">DURATION</text><text x="360" y="378" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">about 18-30 s without</text><text x="360" y="399" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">rehearsal</text><rect x="654" y="184" width="216" height="270" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="762" y="220" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Long-term memory</text><text x="672" y="254" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">CODING</text><text x="672" y="276" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">mainly semantic</text><text x="672" y="305" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">CAPACITY</text><text x="672" y="327" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">effectively unlimited</text><text x="672" y="356" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">DURATION</text><text x="672" y="378" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">potentially a lifetime</text><line x1="252" y1="284" x2="336" y2="284" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><text x="294" y="272" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">attention</text><line x1="564" y1="274" x2="648" y2="274" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><text x="606" y="262" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">transfer</text><line x1="648" y1="344" x2="564" y2="344" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><text x="606" y="370" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">retrieval</text><path d="M410,184 C410,130 490,130 490,178" fill="none" stroke="#1e2a44" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><text x="450" y="138" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">rehearsal</text>
</svg>