<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 998" width="900" height="998" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="998" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Evidence for each feature</text>

<rect x="30" y="100" width="413" height="153" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CAPACITY OF STM</text><text x="50" y="158.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Jacobs (1887): digit span</text><text x="50" y="186.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">About 9 digits and about 7 letters. Miller (1956): 7</text><text x="50" y="207.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">± 2 chunks. Cowan (2001): nearer about 4</text><text x="50" y="228.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">chunks.</text><rect x="457" y="100" width="413" height="153" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CODING</text><text x="477" y="158.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Baddeley (1966)</text><text x="477" y="186.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Acoustically similar words harder to recall</text><text x="477" y="207.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">immediately (STM); semantically similar words</text><text x="477" y="228.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">harder after 20 minutes (LTM).</text><rect x="30" y="275" width="840" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="309" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">DURATION OF STM: PETERSON AND PETERSON (1959)</text><text x="54" y="335" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Consonant trigrams; counting backwards in</text><text x="54" y="356" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">threes prevents rehearsal.</text><line x1="470" y1="485" x2="830" y2="485" stroke="#1e2a44" stroke-width="2.5"/><line x1="470" y1="485" x2="470" y2="335" stroke="#1e2a44" stroke-width="2.5"/><rect x="510" y="350" width="90" height="135" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="555" y="509" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">3 s</text><text x="555" y="342" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">about 90%</text><rect x="690" y="470" width="90" height="15" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><text x="735" y="509" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">18 s</text><text x="735" y="462" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">≈10% or less</text><text x="460" y="341" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">recall</text><text x="54" y="395" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Without rehearsal, short-term memories are</text><text x="54" y="417" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">lost within about <tspan font-weight="700">18</tspan> <tspan font-weight="700">seconds</tspan>.</text><rect x="30" y="547" width="840" height="140" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="581" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">DURATION OF LTM: BAHRICK ET AL. (1975), YEARBOOK PHOTOGRAPHS</text><text x="214" y="622" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="end">within 15 years</text><rect x="230" y="601" width="423" height="30" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="663" y="623" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">about 90%</text><text x="214" y="664" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="end">after 48 years</text><rect x="230" y="643" width="329" height="30" fill="#2e6b62" stroke="#1e2a44" stroke-width="2"/><text x="569" y="665" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">about 70%</text><line x1="230" y1="593" x2="230" y2="681" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="709" width="413" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="741" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STRENGTH</text><text x="50" y="767.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">HM (Scoville and Milner, 1957)</text><text x="50" y="795.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">No new LTMs but normal immediate span:</text><text x="50" y="816.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">separate stores.</text><rect x="457" y="709" width="413" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="741" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">LIMITATION</text><text x="477" y="767.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">KF (Shallice and Warrington, 1970)</text><text x="477" y="795.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Poor verbal STM, better visual: STM is not one</text><text x="477" y="816.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">store.</text><rect x="30" y="855" width="413" height="111" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="887" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">LIMITATION</text><text x="50" y="913.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Rehearsal over-emphasised</text><text x="50" y="941.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Levels of processing (Craik and Lockhart, 1972).</text><rect x="457" y="855" width="413" height="111" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="887" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">LIMITATION</text><text x="477" y="913.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Artificial stimuli</text><text x="477" y="941.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Trigrams may not reflect everyday memory.</text>
</svg>