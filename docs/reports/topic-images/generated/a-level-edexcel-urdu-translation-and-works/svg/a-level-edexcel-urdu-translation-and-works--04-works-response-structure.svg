<rect width="900" height="710" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Structuring a works response</text>

<rect x="110" y="110" width="760" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="62" cy="166" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="174.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="134" y="150" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Position</text><text x="134" y="180" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">open with a brief statement of the writer’s overall stance on the</text><text x="134" y="202" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">question</text><line x1="62" y1="192" x2="62" y2="236" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="110" y="242" width="760" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="62" cy="298" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="62" y="306.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="134" y="282" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Evidence</text><text x="134" y="312" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">two or three specific scenes or exchanges; particular lines or moments,</text><text x="134" y="334" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">not paraphrased whole scenes</text><line x1="62" y1="324" x2="62" y2="368" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="110" y="374" width="760" height="112" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><circle cx="62" cy="430" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="438.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="134" y="414" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Cultural connection</text><text x="134" y="444" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">close by linking the treatment of the issue to the wider social theme it</text><text x="134" y="466" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">belongs to</text><rect x="30" y="520" width="410" height="90" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="556" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">AO3</text><text x="52" y="584" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">precise, accurate language throughout</text><rect x="460" y="520" width="410" height="90" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="482" y="556" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">AO4</text><text x="482" y="584" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">explicit link to social and cultural context</text><rect x="30" y="626" width="840" height="60" rx="12" fill="#f6ece4" stroke="#b5602e" stroke-width="2.5"/><circle cx="66" cy="656" r="15" fill="#f6ece4" stroke="#b5602e" stroke-width="2.5"/><path d="M60,650 l12,12 m0,-12 l-12,12" fill="none" stroke="#b5602e" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><text x="96" y="662" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">Moving through the work chronologically, retelling events</text>
</svg>