<text x="450" y="128" font-size="18" font-weight="600" fill="#4a5568" text-anchor="middle">Every candidate writes exactly two works essays</text><rect x="30" y="150" width="410" height="200" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="3"/><circle cx="66" cy="186" r="15" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><path d="M59,186 l5,6 l10,-12" fill="none" stroke="#2e6b62" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><text x="94" y="192" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Route 1</text><rect x="60" y="226" width="150" height="80" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="135" y="273" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Text</text><text x="235" y="272" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">+</text><rect x="260" y="226" width="150" height="80" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="335" y="273" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Text</text><text x="235" y="334" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Section B twice, no Section C</text><rect x="460" y="150" width="410" height="200" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="3"/><circle cx="496" cy="186" r="15" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><path d="M489,186 l5,6 l10,-12" fill="none" stroke="#2e6b62" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><text x="524" y="192" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Route 2</text><rect x="490" y="226" width="150" height="80" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="565" y="273" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Text</text><text x="665" y="272" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">+</text><rect x="690" y="226" width="150" height="80" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="765" y="273" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Film</text><text x="665" y="334" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Section B, then Section C</text><rect x="30" y="370" width="410" height="90" rx="12" fill="#f6ece4" stroke="#b5602e" stroke-width="2.5"/><circle cx="66" cy="415" r="15" fill="#f6ece4" stroke="#b5602e" stroke-width="2.5"/><path d="M60,409 l12,12 m0,-12 l-12,12" fill="none" stroke="#b5602e" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><text x="96" y="421" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">Two film essays</text><rect x="460" y="370" width="410" height="90" rx="12" fill="#f6ece4" stroke="#b5602e" stroke-width="2.5"/><circle cx="496" cy="415" r="15" fill="#f6ece4" stroke="#b5602e" stroke-width="2.5"/><path d="M490,409 l12,12 m0,-12 l-12,12" fill="none" stroke="#b5602e" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><text x="526" y="421" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">Three extended responses</text><text x="450" y="500" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Also: Paper 2 translates into Urdu; Paper 1 translates into English</text>
