f" stroke="#c9d6d4" stroke-width="2.5"/><text x="314.8093919727312" y="478.71322893124" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Plot</text><text x="314.8093919727312" y="501.71322893124" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">structure</text><line x1="358.69857443566525" y1="300.334368540005" x2="307.341522555727" y2="291.6818926975065" stroke="#1e2a44" stroke-width="2.5"/><rect x="136.2570012521147" y="233.28677106875995" width="190" height="76" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="231.2570012521147" y="266.28677106875995" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Character-</text><text x="231.2570012521147" y="289.28677106875995" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">isation</text><rect x="30" y="584" width="840" height="84" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="54" y="618" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">For AO4, connect each work to the four social and cultural themes</text><text x="54" y="646" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">place it in its wider social or historical context, not only what happens in it</text>
