<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 626" width="900" height="626" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="626" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Paper 2 at a glance</text>

<rect x="30" y="110" width="840" height="70" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="54" y="154" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Paper 2</text><text x="846" y="154" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="end">2 hours 40 minutes  ·  110 marks  ·  30% of A-level</text><text x="54" y="218" font-size="16" font-weight="600" fill="#4a5568" text-anchor="start">Recommended time, to scale</text><rect x="30" y="232" width="151.5" height="70" rx="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="105.75" y="262" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Section A</text><text x="105.75" y="288" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">30 min</text><text x="105.75" y="330" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">20 marks</text><text x="105.75" y="356" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Translation</text><text x="105.75" y="375" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">into Urdu</text><rect x="187.5" y="232" width="335.25" height="70" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="355.125" y="262" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Section B</text><text x="355.125" y="288" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">1 h 5 min</text><text x="355.125" y="330" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">45 marks</text><text x="355.125" y="356" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Response to a literary text</text><rect x="528.75" y="232" width="341.25" height="70" rx="10" fill="#efdfa8" stroke="#1e2a44" stroke-width="2.5"/><text x="699.375" y="262" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Section B or C</text><text x="699.375" y="288" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">1 h 5 min</text><text x="699.375" y="330" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">45 marks</text><text x="699.375" y="356" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Second literary text, or a</text><text x="699.375" y="375" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">film</text><rect x="30" y="400" width="840" height="200" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="436" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Section A is marked in chunks</text><text x="54" y="468" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the passage is divided into 20 chunks, one mark each</text><text x="54" y="490" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">non-grammatical misspellings are tolerated if they create no ambiguity</text><text x="54" y="512" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and do not belong to a different word</text><rect x="54" y="538" width="792" height="46" rx="10" fill="#f6ece4" stroke="#b5602e" stroke-width="2"/><text x="450" y="568" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">Verb and adjective endings must be correct: they are not "spelling"</text>
</svg>