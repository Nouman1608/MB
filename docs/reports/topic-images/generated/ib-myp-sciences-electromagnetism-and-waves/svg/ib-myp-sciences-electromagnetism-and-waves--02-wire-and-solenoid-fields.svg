<rect x="30" y="110" width="410" height="380" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="235" y="148" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Straight wire, end-on</text><circle cx="140" cy="290" r="30" fill="none" stroke="#2b5a9a" stroke-width="2.5"/><path d="M131,260 L149,253.7 L149,266.3 Z" fill="#2b5a9a"/><path d="M149,320 L131,326.3 L131,313.7 Z" fill="#2b5a9a"/><circle cx="140" cy="290" r="52" fill="none" stroke="#2b5a9a" stroke-width="2.5"/><path d="M131,238 L149,231.7 L149,244.3 Z" fill="#2b5a9a"/><path d="M149,342 L131,348.3 L131,335.7 Z" fill="#2b5a9a"/><circle cx="140" cy="290" r="74" fill="none" stroke="#2b5a9a" stroke-width="2.5"/><path d="M131,216 L149,209.7 L149,222.3 Z" fill="#2b5a9a"/><path d="M149,364 L131,370.3 L131,357.7 Z" fill="#2b5a9a"/><circle cx="140" cy="290" r="14" fill="#fff" stroke="#1e2a44" stroke-width="2.5"/><circle cx="140" cy="290" r="3.9200000000000004" fill="#1e2a44"/><text x="140" y="400" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">current out of page</text><text x="140" y="420" font-size="15" font-weight="600" fill="#2b5a9a" text-anchor="middle">field anticlockwise</text><circle cx="335" cy="290" r="30" fill="none" stroke="#2b5a9a" stroke-width="2.5"/><path d="M344,260 L326,266.3 L326,253.7 Z" fill="#2b5a9a"/><path d="M326,320 L344,313.7 L344,326.3 Z" fill="#2b5a9a"/><circle cx="335" cy="290" r="52" fill="none" stroke="#2b5a9a" stroke-width="2.5"/><path d="M344,238 L326,244.3 L326,231.7 Z" fill="#2b5a9a"/><path d="M326,342 L344,335.7 L344,348.3 Z" fill="#2b5a9a"/><circle cx="335" cy="290" r="74" fill="none" stroke="#2b5a9a" stroke-width="2.5"/><path d="M344,216 L326,222.3 L326,209.7 Z" fill="#2b5a9a"/><path d="M326,364 L344,357.7 L344,370.3 Z" fill="#2b5a9a"/><circle cx="335" cy="290" r="14" fill="#fff" stroke="#1e2a44" stroke-width="2.5"/><path d="M326.6,281.6 L343.4,298.4 M343.4,281.6 L326.6,298.4" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><text x="335" y="400" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">current into page</text><text x="335" y="420" font-size="15" font-weight="600" fill="#2b5a9a" text-anchor="middle">field clockwise</text><text x="235" y="460" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">Right-hand grip: thumb = current, fingers = field</text><rect x="460" y="110" width="410" height="380" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="665" y="148" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Solenoid on an iron core</text><path d="M556,260 C500,188.5 830,188.5 774,260" fill="none" stroke="#2b5a9a" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M674,206.375 L656,212.675 L656,200.075 Z" fill="#2b5a9a"/><path d="M556,320 C500,391.5 830,391.5 774,320" fill="none" stroke="#2b5a9a" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M674,373.625 L656,379.925 L656,367.325 Z" fill="#2b5a9a"/><path d="M556,260 C500,136.5 830,136.5 774,260" fill="none" stroke="#2b5a9a" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M674,167.375 L656,173.675 L656,161.075 Z" fill="#2b5a9a"/><path d="M556,320 C500,443.5 830,443.5 774,320" fill="none" stroke="#2b5a9a" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M674,412.625 L656,418.925 L656,406.325 Z" fill="#2b5a9a"/><rect x="540" y="268" width="250" height="44" fill="#c9c9c9" stroke="#1e2a44" stroke-width="2"/><ellipse cx="560" cy="290" rx="8" ry="32" fill="none" stroke="#b5602e" stroke-width="3"/><ellipse cx="586" cy="290" rx="8" ry="32" fill="none" stroke="#b5602e" stroke-width="3"/><ellipse cx="612" cy="290" rx="8" ry="32" fill="none" stroke="#b5602e" stroke-width="3"/><ellipse cx="638" cy="290" rx="8" ry="32" fill="none" stroke="#b5602e" stroke-width="3"/><ellipse cx="664" cy="290" rx="8" ry="32" fill="none" stroke="#b5602e" stroke-width="3"/><ellipse cx="690" cy="290" rx="8" ry="32" fill="none" stroke="#b5602e" stroke-width="3"/><ellipse cx="716" cy="290" rx="8" ry="32" fill="none" stroke="#b5602e" stroke-width="3"/><ellipse cx="742" cy="290" rx="8" ry="32" fill="none" stroke="#b5602e" stroke-width="3"/><ellipse cx="768" cy="290" rx="8" ry="32" fill="none" stroke="#b5602e" stroke-width="3"/><line x1="570" y1="280" x2="760" y2="280" stroke="#2b5a9a" stroke-width="2.5" opacity="0.9"/><line x1="570" y1="300" x2="760" y2="300" stroke="#2b5a9a" stroke-width="2.5" opacity="0.9"/><path d="M753,280 L771,273.7 L771,286.3 Z" fill="#2b5a9a"/><path d="M753,300 L771,293.7 L771,306.3 Z" fill="#2b5a9a"/><text x="665" y="448" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Grey: soft iron core. Outside: like a bar</text><text x="665" y="468" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">magnet. Inside: strong and nearly uniform.</text><rect x="30" y="510" width="840" height="170" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="60" y="548" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Make an electromagnet stronger</text><rect x="60" y="568" width="240" height="50" rx="10" fill="#fff" stroke="#8a6d0d" stroke-width="2.2"/><text x="180" y="598.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">more current</text><rect x="330" y="568" width="240" height="50" rx="10" fill="#fff" stroke="#8a6d0d" stroke-width="2.2"/><text x="450" y="598.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">more turns of wire</text><rect x="600" y="568" width="240" height="50" rx="10" fill="#fff" stroke="#8a6d0d" stroke-width="2.2"/><text x="720" y="598.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">a soft iron core</text><text x="60" y="655" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Soft iron loses its magnetism when the current stops, so the magnet switches off cleanly.</text>
