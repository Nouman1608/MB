<rect width="900" height="800" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Electromagnetic induction</text>

<rect x="30" y="110" width="840" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="150" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Magnet pushed in</text><text x="60" y="176" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">field through the coil changes</text><ellipse cx="470" cy="210" rx="10" ry="36" fill="none" stroke="#b5602e" stroke-width="3.5"/><ellipse cx="492" cy="210" rx="10" ry="36" fill="none" stroke="#b5602e" stroke-width="3.5"/><ellipse cx="514" cy="210" rx="10" ry="36" fill="none" stroke="#b5602e" stroke-width="3.5"/><ellipse cx="536" cy="210" rx="10" ry="36" fill="none" stroke="#b5602e" stroke-width="3.5"/><ellipse cx="558" cy="210" rx="10" ry="36" fill="none" stroke="#b5602e" stroke-width="3.5"/><ellipse cx="580" cy="210" rx="10" ry="36" fill="none" stroke="#b5602e" stroke-width="3.5"/><path d="M470,246 L470,266 L730,266 L730,230" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M580,246 L580,256 L700,256 L700,230" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="715" cy="204" r="34" fill="#fff" stroke="#1e2a44" stroke-width="2.5"/><path d="M690,192 A30,30 0 0 1 740,192" fill="none" stroke="#4a5568" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" /><line x1="715" y1="222" x2="698.28752214815" y2="197.4865778201927" stroke="#b5602e" stroke-width="3"/><circle cx="715" cy="222" r="4" fill="#1e2a44"/><rect x="300" y="192" width="60" height="36" fill="#2e6b62" stroke="#1e2a44" stroke-width="2.5"/><rect x="360" y="192" width="60" height="36" fill="#b5602e" stroke="#1e2a44" stroke-width="2.5"/><text x="330" y="216.48" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">S</text><text x="390" y="216.48" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">N</text><line x1="255" y1="210" x2="292" y2="210" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="30" y="296" width="840" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="336" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Magnet held still</text><text x="60" y="362" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">no change: no induced voltage</text><ellipse cx="470" cy="396" rx="10" ry="36" fill="none" stroke="#b5602e" stroke-width="3.5"/><ellipse cx="492" cy="396" rx="10" ry="36" fill="none" stroke="#b5602e" stroke-width="3.5"/><ellipse cx="514" cy="396" rx="10" ry="36" fill="none" stroke="#b5602e" stroke-width="3.5"/><ellipse cx="536" cy="396" rx="10" ry="36" fill="none" stroke="#b5602e" stroke-width="3.5"/><ellipse cx="558" cy="396" rx="10" ry="36" fill="none" stroke="#b5602e" stroke-width="3.5"/><ellipse cx="580" cy="396" rx="10" ry="36" fill="none" stroke="#b5602e" stroke-width="3.5"/><path d="M470,432 L470,452 L730,452 L730,416" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M580,432 L580,442 L700,442 L700,416" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="715" cy="390" r="34" fill="#fff" stroke="#1e2a44" stroke-width="2.5"/><path d="M690,378 A30,30 0 0 1 740,378" fill="none" stroke="#4a5568" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" /><line x1="715" y1="408" x2="715" y2="376" stroke="#b5602e" stroke-width="3"/><circle cx="715" cy="408" r="4" fill="#1e2a44"/><rect x="380" y="378" width="60" height="36" fill="#2e6b62" stroke="#1e2a44" stroke-width="2.5"/><rect x="440" y="378" width="60" height="36" fill="#b5602e" stroke="#1e2a44" stroke-width="2.5"/><text x="410" y="402.48" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">S</text><text x="470" y="402.48" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">N</text><rect x="30" y="482" width="840" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="522" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Magnet pulled out</text><text x="60" y="548" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">change in the other direction</text><ellipse cx="470" cy="582" rx="10" ry="36" fill="none" stroke="#b5602e" stroke-width="3.5"/><ellipse cx="492" cy="582" rx="10" ry="36" fill="none" stroke="#b5602e" stroke-width="3.5"/><ellipse cx="514" cy="582" rx="10" ry="36" fill="none" stroke="#b5602e" stroke-width="3.5"/><ellipse cx="536" cy="582" rx="10" ry="36" fill="none" stroke="#b5602e" stroke-width="3.5"/><ellipse cx="558" cy="582" rx="10" ry="36" fill="none" stroke="#b5602e" stroke-width="3.5"/><ellipse cx="580" cy="582" rx="10" ry="36" fill="none" stroke="#b5602e" stroke-width="3.5"/><path d="M470,618 L470,638 L730,638 L730,602" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M580,618 L580,628 L700,628 L700,602" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="715" cy="576" r="34" fill="#fff" stroke="#1e2a44" stroke-width="2.5"/><path d="M690,564 A30,30 0 0 1 740,564" fill="none" stroke="#4a5568" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" /><line x1="715" y1="594" x2="731.71247785185" y2="569.4865778201927" stroke="#b5602e" stroke-width="3"/><circle cx="715" cy="594" r="4" fill="#1e2a44"/><rect x="300" y="564" width="60" height="36" fill="#2e6b62" stroke="#1e2a44" stroke-width="2.5"/><rect x="360" y="564" width="60" height="36" fill="#b5602e" stroke="#1e2a44" stroke-width="2.5"/><text x="330" y="588.48" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">S</text><text x="390" y="588.48" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">N</text><line x1="292" y1="582" x2="240" y2="582" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><text x="855" y="230" font-size="16" font-weight="700" fill="#b5602e" text-anchor="end">one way</text><text x="855" y="416" font-size="16" font-weight="700" fill="#4a5568" text-anchor="end">zero</text><text x="855" y="602" font-size="16" font-weight="700" fill="#b5602e" text-anchor="end">other way</text><rect x="30" y="670" width="840" height="100" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="60" y="708" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Bigger induced voltage:</text><text x="290" y="708" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">move faster, stronger magnet, more turns.</text><text x="60" y="746" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A generator turns a coil in a field: each side moves up then down, giving a.c.</text>
