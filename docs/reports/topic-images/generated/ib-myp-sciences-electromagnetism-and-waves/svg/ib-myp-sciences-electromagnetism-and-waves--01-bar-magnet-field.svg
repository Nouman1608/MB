<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Magnetic field of a bar magnet</text>

<rect x="30" y="110" width="840" height="440" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M346,320 C306,280.1 594,280.1 554,320" fill="none" stroke="#2b5a9a" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M459,290 L441,296.3 L441,283.7 Z" fill="#2b5a9a"/><path d="M346,380 C306,419.9 594,419.9 554,380" fill="none" stroke="#2b5a9a" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M459,410 L441,416.3 L441,403.7 Z" fill="#2b5a9a"/><path d="M333,320 C275,237.54 625,237.54 567,320" fill="none" stroke="#2b5a9a" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M459,258 L441,264.3 L441,251.7 Z" fill="#2b5a9a"/><path d="M333,380 C275,462.46000000000004 625,462.46000000000004 567,380" fill="none" stroke="#2b5a9a" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M459,442 L441,448.3 L441,435.7 Z" fill="#2b5a9a"/><path d="M320,320 C244,192.32 656,192.32 580,320" fill="none" stroke="#2b5a9a" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M459,224 L441,230.3 L441,217.7 Z" fill="#2b5a9a"/><path d="M320,380 C244,507.68 656,507.68 580,380" fill="none" stroke="#2b5a9a" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M459,476 L441,482.3 L441,469.7 Z" fill="#2b5a9a"/><path d="M307,320 C213,147.1 687,147.1 593,320" fill="none" stroke="#2b5a9a" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M459,190 L441,196.3 L441,183.7 Z" fill="#2b5a9a"/><path d="M307,380 C213,552.9 687,552.9 593,380" fill="none" stroke="#2b5a9a" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M459,510 L441,516.3 L441,503.7 Z" fill="#2b5a9a"/><path d="M300,350 L170,350" fill="none" stroke="#2b5a9a" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M211,350 L229,343.7 L229,356.3 Z" fill="#2b5a9a"/><path d="M730,350 L600,350" fill="none" stroke="#2b5a9a" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M661,350 L679,343.7 L679,356.3 Z" fill="#2b5a9a"/><rect x="300" y="320" width="150" height="60" fill="#b5602e" stroke="#1e2a44" stroke-width="2.5"/><rect x="450" y="320" width="150" height="60" fill="#2e6b62" stroke="#1e2a44" stroke-width="2.5"/><text x="375" y="360.08" font-size="28" font-weight="700" fill="#fff" text-anchor="middle">N</text><text x="525" y="360.08" font-size="28" font-weight="700" fill="#fff" text-anchor="middle">S</text><circle cx="680" cy="304" r="15" fill="#fff" stroke="#1e2a44" stroke-width="2"/><g transform="rotate(150 680 304)"><path d="M691,304 L680,300 L680,308 Z" fill="#b5602e"/><path d="M669,304 L680,300 L680,308 Z" fill="#4a5568"/></g><text x="700" y="284" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">compass needle</text><text x="700" y="302" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">follows the field</text><text x="50" y="150" font-size="17" font-weight="700" fill="#2b5a9a" text-anchor="start">Lines run N → S</text><text x="50" y="172" font-size="17" font-weight="700" fill="#2b5a9a" text-anchor="start">outside the magnet</text><text x="850" y="150" font-size="17" font-weight="700" fill="#2b5a9a" text-anchor="end">Lines never cross</text><text x="50" y="500" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Lines closest at the poles:</text><text x="50" y="522" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">field strongest there</text><rect x="30" y="570" width="410" height="200" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="606" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Unlike poles attract</text><rect x="60" y="630" width="75" height="44" fill="#b5602e" stroke="#1e2a44" stroke-width="2.5"/><rect x="135" y="630" width="75" height="44" fill="#2e6b62" stroke="#1e2a44" stroke-width="2.5"/><text x="97.5" y="659.2" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">N</text><text x="172.5" y="659.2" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">S</text><rect x="250" y="630" width="75" height="44" fill="#b5602e" stroke="#1e2a44" stroke-width="2.5"/><rect x="325" y="630" width="75" height="44" fill="#2e6b62" stroke="#1e2a44" stroke-width="2.5"/><text x="287.5" y="659.2" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">N</text><text x="362.5" y="659.2" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">S</text><line x1="190" y1="700" x2="215" y2="700" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="270" y1="700" x2="245" y2="700" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="60" y="750" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">S faces N across the gap</text><rect x="460" y="570" width="410" height="200" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="490" y="606" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Like poles repel</text><rect x="490" y="630" width="75" height="44" fill="#b5602e" stroke="#1e2a44" stroke-width="2.5"/><rect x="565" y="630" width="75" height="44" fill="#2e6b62" stroke="#1e2a44" stroke-width="2.5"/><text x="527.5" y="659.2" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">N</text><text x="602.5" y="659.2" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">S</text><rect x="680" y="630" width="75" height="44" fill="#2e6b62" stroke="#1e2a44" stroke-width="2.5"/><rect x="755" y="630" width="75" height="44" fill="#b5602e" stroke="#1e2a44" stroke-width="2.5"/><text x="717.5" y="659.2" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">S</text><text x="792.5" y="659.2" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">N</text><line x1="620" y1="700" x2="590" y2="700" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="700" y1="700" x2="730" y2="700" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="490" y="750" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">S faces S across the gap</text><rect x="30" y="790" width="840" height="110" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="60" y="826" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="start">Magnetic:</text><text x="180" y="826" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">iron, nickel, cobalt, steel</text><text x="60" y="864" font-size="18" font-weight="700" fill="#4a5568" text-anchor="start">Not magnetic:</text><text x="190" y="864" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">copper, aluminium, brass, plastic</text>
