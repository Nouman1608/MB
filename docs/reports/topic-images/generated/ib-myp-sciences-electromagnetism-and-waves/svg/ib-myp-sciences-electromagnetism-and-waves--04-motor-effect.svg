<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 710" width="900" height="710" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="710" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The motor effect</text>

<rect x="30" y="110" width="410" height="420" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="235" y="148" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Fleming’s left-hand rule</text><line x1="200" y1="300" x2="370" y2="300" stroke="#2b5a9a" stroke-width="5" marker-end="url(#ah)"/><text x="370" y="286" font-size="16" font-weight="700" fill="#2b5a9a" text-anchor="end">First finger</text><text x="370" y="328" font-size="16" font-weight="400" fill="#2b5a9a" text-anchor="end">Field (N → S)</text><line x1="200" y1="300" x2="295" y2="190" stroke="#b5602e" stroke-width="5" marker-end="url(#ahR)"/><text x="305" y="184" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">seCond finger</text><text x="305" y="204" font-size="16" font-weight="400" fill="#b5602e" text-anchor="start">Current</text><line x1="200" y1="300" x2="200" y2="460" stroke="#8a6d0d" stroke-width="5" marker-end="url(#ahO)"/><text x="188" y="440" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="end">thuMb</text><text x="188" y="460" font-size="16" font-weight="400" fill="#8a6d0d" text-anchor="end">Motion (force)</text><circle cx="200" cy="300" r="7" fill="#1e2a44"/><text x="235" y="505" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">All three at right angles</text><rect x="460" y="110" width="410" height="420" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="665" y="148" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Wire between two poles</text><rect x="480" y="230" width="70" height="140" fill="#b5602e" stroke="#1e2a44" stroke-width="2.5"/><text x="515" y="310" font-size="26" font-weight="700" fill="#fff" text-anchor="middle">N</text><rect x="780" y="230" width="70" height="140" fill="#2e6b62" stroke="#1e2a44" stroke-width="2.5"/><text x="815" y="310" font-size="26" font-weight="700" fill="#fff" text-anchor="middle">S</text><line x1="555" y1="250" x2="772" y2="250" stroke="#2b5a9a" stroke-width="2.2" marker-end="url(#ah)"/><line x1="555" y1="280" x2="772" y2="280" stroke="#2b5a9a" stroke-width="2.2" marker-end="url(#ah)"/><line x1="555" y1="320" x2="772" y2="320" stroke="#2b5a9a" stroke-width="2.2" marker-end="url(#ah)"/><line x1="555" y1="350" x2="772" y2="350" stroke="#2b5a9a" stroke-width="2.2" marker-end="url(#ah)"/><circle cx="665" cy="300" r="22" fill="#fff" stroke="#1e2a44" stroke-width="3"/><path d="M652,287 L678,313 M678,287 L652,313" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><line x1="665" y1="326" x2="665" y2="430" stroke="#8a6d0d" stroke-width="6" marker-end="url(#ahO)"/><text x="680" y="420" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="start">force</text><text x="665" y="200" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">current into the page</text><text x="665" y="470" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Reverse the current or the field:</text><text x="665" y="492" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">the force reverses.</text><rect x="30" y="550" width="840" height="130" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="60" y="588" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Bigger force:</text><text x="200" y="588" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">bigger current, stronger magnet, or longer wire in the field.</text><text x="60" y="626" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">No force:</text><text x="200" y="626" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">wire parallel to the field. The force is largest at 90°.</text><text x="60" y="660" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The wire’s own field interacts with the magnet’s field.</text>
</svg>