<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 750" width="900" height="750" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="750" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Reflection and refraction</text>

<rect x="30" y="110" width="360" height="470" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="210" y="148" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Reflection</text><rect x="60" y="470" width="300" height="16" fill="#c9d3e6" stroke="#1e2a44" stroke-width="2.5"/><line x1="68" y1="486" x2="58" y2="500" stroke="#1e2a44" stroke-width="2"/><line x1="93" y1="486" x2="83" y2="500" stroke="#1e2a44" stroke-width="2"/><line x1="118" y1="486" x2="108" y2="500" stroke="#1e2a44" stroke-width="2"/><line x1="143" y1="486" x2="133" y2="500" stroke="#1e2a44" stroke-width="2"/><line x1="168" y1="486" x2="158" y2="500" stroke="#1e2a44" stroke-width="2"/><line x1="193" y1="486" x2="183" y2="500" stroke="#1e2a44" stroke-width="2"/><line x1="218" y1="486" x2="208" y2="500" stroke="#1e2a44" stroke-width="2"/><line x1="243" y1="486" x2="233" y2="500" stroke="#1e2a44" stroke-width="2"/><line x1="268" y1="486" x2="258" y2="500" stroke="#1e2a44" stroke-width="2"/><line x1="293" y1="486" x2="283" y2="500" stroke="#1e2a44" stroke-width="2"/><line x1="318" y1="486" x2="308" y2="500" stroke="#1e2a44" stroke-width="2"/><line x1="343" y1="486" x2="333" y2="500" stroke="#1e2a44" stroke-width="2"/><line x1="210" y1="470" x2="210" y2="200" stroke="#4a5568" stroke-width="2" stroke-dasharray="8 6"/><text x="210" y="190" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">normal</text><line x1="62.15884977209598" y1="293.80977808263503" x2="206" y2="466" stroke="#b5602e" stroke-width="3.5" marker-end="url(#ahR)"/><line x1="210" y1="470" x2="357.841150227904" y2="293.80977808263503" stroke="#b5602e" stroke-width="3.5" marker-end="url(#ahR)"/><path d="M210,400 A70,70 0 0 0 165.00486732194224,416.3768889816715" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><path d="M210,400 A70,70 0 0 1 254.99513267805776,416.3768889816715" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><text x="180" y="382" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle" font-style="italic">i</text><text x="240" y="382" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle" font-style="italic">r</text><text x="210" y="540" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">angle i = angle r</text><text x="210" y="564" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">both measured from the normal</text><rect x="410" y="110" width="460" height="470" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="640" y="148" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Refraction through a glass block</text><rect x="480" y="250" width="320" height="180" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="490" y="418" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start">glass  2.0 × 10⁸ m/s</text><text x="796" y="236" font-size="15" font-weight="600" fill="#4a5568" text-anchor="end">air  3.0 × 10⁸ m/s</text><line x1="650" y1="170" x2="650" y2="330" stroke="#4a5568" stroke-width="2" stroke-dasharray="7 6"/><line x1="746.2140470884727" y1="350" x2="746.2140470884727" y2="510" stroke="#4a5568" stroke-width="2" stroke-dasharray="7 6"/><line x1="580" y1="180" x2="647" y2="247" stroke="#b5602e" stroke-width="3.5" marker-end="url(#ahR)"/><line x1="650" y1="250" x2="746.2140470884727" y2="430" stroke="#b5602e" stroke-width="3.5"/><path d="M702.3496642313557,347.93725393319374 L688.3083051038815,335.03259454778976 L699.4204606103527,329.09289758582275 Z" fill="#b5602e"/><line x1="746.2140470884727" y1="430" x2="816.2140470884727" y2="500" stroke="#b5602e" stroke-width="3.5" marker-end="url(#ahR)"/><text x="636" y="320" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="end">slows down:</text><text x="636" y="340" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="end">bends towards</text><text x="636" y="360" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="end">the normal</text><text x="732.2140470884727" y="460" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="end">speeds up: bends</text><text x="732.2140470884727" y="480" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="end">away from the normal</text><rect x="30" y="600" width="840" height="120" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="60" y="638" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Frequency stays the same; speed and wavelength change (λ = v ÷ f).</text><text x="60" y="670" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Light at 5.0 × 10¹⁴ Hz: 600 nm in air, 400 nm in glass.</text><text x="60" y="700" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A ray along the normal changes speed but not direction.</text>
</svg>