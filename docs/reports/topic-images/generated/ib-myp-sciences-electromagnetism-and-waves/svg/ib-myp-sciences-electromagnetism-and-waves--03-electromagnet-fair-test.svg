<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="600" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Reading an electromagnet test</text>

<rect x="30" y="110" width="840" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="90" y="155" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Row</text><text x="230" y="155" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Turns</text><text x="380" y="155" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Current (A)</text><text x="540" y="155" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Paperclips</text><rect x="55" y="185" width="560" height="62" rx="10" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="90" y="225" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="230" y="225" font-size="20" font-weight="400" fill="#1e2a44" text-anchor="middle">20</text><text x="380" y="225" font-size="20" font-weight="400" fill="#1e2a44" text-anchor="middle">1.0</text><rect x="470" y="203" width="28" height="26" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="508" y="223" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">4</text><rect x="55" y="265" width="560" height="62" rx="10" fill="#fff" stroke="#c9d6d4" stroke-width="2"/><text x="90" y="305" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="230" y="305" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle">40</text><text x="380" y="305" font-size="20" font-weight="400" fill="#1e2a44" text-anchor="middle">1.0</text><rect x="470" y="283" width="63" height="26" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="543" y="303" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">9</text><rect x="55" y="345" width="560" height="62" rx="10" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="90" y="385" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="230" y="385" font-size="20" font-weight="400" fill="#1e2a44" text-anchor="middle">40</text><text x="380" y="385" font-size="20" font-weight="700" fill="#b5602e" text-anchor="middle">2.0</text><rect x="470" y="363" width="119" height="26" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="599" y="383" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">17</text><path d="M630,216 L648,216 L648,296 L630,296" fill="none" stroke="#2e6b62" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="660" y="252" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">only turns change</text><text x="660" y="274" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">more turns: stronger</text><path d="M630,306 L648,306 L648,376 L630,376" fill="none" stroke="#b5602e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="660" y="337" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">only current changes</text><text x="660" y="359" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">more current: stronger</text><rect x="30" y="460" width="840" height="110" rx="14" fill="#fbeee6" stroke="#b5602e" stroke-width="2.5"/><text x="60" y="500" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">Rows 1 and 3: not a fair test</text><text x="60" y="530" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Turns and current both change, so you cannot tell which one caused</text><text x="60" y="552" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">the extra paperclips.</text>
</svg>