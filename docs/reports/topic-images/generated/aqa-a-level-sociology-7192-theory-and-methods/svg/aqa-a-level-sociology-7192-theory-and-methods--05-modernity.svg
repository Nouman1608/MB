<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 537" width="900" height="537" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="537" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Has modernity ended?</text>

<rect x="150" y="104" width="600" height="92" rx="14" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="450" y="138" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Modernity</text><text x="450" y="166" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">nation state, capitalism, rationality, science, progress; grand</text><text x="450" y="187" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">narratives such as functionalism and Marxism</text><line x1="330" y1="202" x2="230" y2="252" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="570" y1="202" x2="670" y2="252" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="258" width="412" height="253" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,308 L31.25,272.25 Q31.25,259.25 44.25,259.25 L427.75,259.25 Q440.75,259.25 440.75,272.25 L440.75,308 Z" fill="#f2e7b8"/><line x1="31.25" y1="308" x2="440.75" y2="308" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="288.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Post-modernity</text><text x="44" y="339.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">modernity has ended</text><circle cx="49" cy="360.92" r="4.5" fill="#2e6b62"/><text x="62" y="366.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Lyotard (1979):</tspan> "incredulity towards</text><text x="62" y="387.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">meta-narratives"</text><circle cx="49" cy="410.92" r="4.5" fill="#2e6b62"/><text x="62" y="416.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Baudrillard:</tspan> media signs create</text><text x="62" y="437.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">hyperreality</text><circle cx="49" cy="460.92" r="4.5" fill="#2e6b62"/><text x="62" y="466.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Fragmented, media-saturated, based on</text><text x="62" y="487.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">consumer choice and identity</text><rect x="458" y="258" width="412" height="253" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,308 L459.25,272.25 Q459.25,259.25 472.25,259.25 L855.75,259.25 Q868.75,259.25 868.75,272.25 L868.75,308 Z" fill="#dce9e7"/><line x1="459.25" y1="308" x2="868.75" y2="308" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="288.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Late modernity</text><text x="472" y="339.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">modernity continues</text><circle cx="477" cy="360.92" r="4.5" fill="#2e6b62"/><text x="490" y="366.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Giddens:</tspan> late or "high" modernity marked by</text><text x="490" y="387.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">reflexivity</text><circle cx="477" cy="410.92" r="4.5" fill="#2e6b62"/><text x="490" y="416.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Beck (1986):</tspan> a risk society preoccupied</text><text x="490" y="437.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">with manufactured risks</text>
</svg>