<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 405" width="900" height="405" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="405" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Can sociology be value-free?</text>

<line x1="60" y1="120" x2="840" y2="120" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)" marker-start="url(#ah)"/><text x="60" y="106" font-size="16" font-weight="600" fill="#4a5568" text-anchor="start">value-free is possible</text><text x="840" y="106" font-size="16" font-weight="600" fill="#4a5568" text-anchor="end">research should take sides</text><rect x="30" y="142" width="269.3333333333333" height="237" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,192 L31.25,156.25 Q31.25,143.25 44.25,143.25 L285.0833333333333,143.25 Q298.0833333333333,143.25 298.0833333333333,156.25 L298.0833333333333,192 Z" fill="#b5d3cf"/><line x1="31.25" y1="192" x2="298.0833333333333" y2="192" stroke="#c9d6d4" stroke-width="2"/><text x="164.66666666666666" y="172.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Classical positivists</text><text x="44" y="223.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Comte; Durkheim</text><text x="44" y="250.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Sociology could be objective</text><text x="44" y="271.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and should guide society.</text><rect x="315.3333333333333" y="142" width="269.3333333333333" height="237" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M316.5833333333333,192 L316.5833333333333,156.25 Q316.5833333333333,143.25 329.5833333333333,143.25 L570.4166666666666,143.25 Q583.4166666666666,143.25 583.4166666666666,156.25 L583.4166666666666,192 Z" fill="#d4b02e"/><line x1="316.5833333333333" y1="192" x2="583.4166666666666" y2="192" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="172.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Weber</text><text x="329.3333333333333" y="223.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">a middle position</text><text x="329.3333333333333" y="250.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Values shape topic choice</text><text x="329.3333333333333" y="271.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and interpretation; be</text><text x="329.3333333333333" y="292.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">value-free in data</text><text x="329.3333333333333" y="313.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">collection.</text><rect x="600.6666666666666" y="142" width="269.3333333333333" height="237" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.9166666666666,192 L601.9166666666666,156.25 Q601.9166666666666,143.25 614.9166666666666,143.25 L855.75,143.25 Q868.75,143.25 868.75,156.25 L868.75,192 Z" fill="#f2e7b8"/><line x1="601.9166666666666" y1="192" x2="868.75" y2="192" stroke="#c9d6d4" stroke-width="2"/><text x="735.3333333333333" y="172.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Committed sociology</text><text x="614.6666666666666" y="223.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Becker (1967); Gouldner</text><text x="614.6666666666666" y="244.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">(1962)</text><text x="614.6666666666666" y="271.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Side with the underdog;</text><text x="614.6666666666666" y="292.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">claims of value freedom</text><text x="614.6666666666666" y="313.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">often hid support for the</text><text x="614.6666666666666" y="334.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">powerful. Feminists: serve</text><text x="614.6666666666666" y="355.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">women’s interests.</text>
</svg>