<rect width="900" height="493" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What shapes research choices?</text>

<rect x="30" y="104" width="269.3333333333333" height="247" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,154 L31.25,118.25 Q31.25,105.25 44.25,105.25 L285.0833333333333,105.25 Q298.0833333333333,105.25 298.0833333333333,118.25 L298.0833333333333,154 Z" fill="#b5d3cf"/><line x1="31.25" y1="154" x2="298.0833333333333" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="164.66666666666666" y="134.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Theoretical</text><circle cx="49" cy="179.92" r="4.5" fill="#2e6b62"/><text x="62" y="185.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Positivists favour</text><text x="62" y="206.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">reliable, quantitative</text><text x="62" y="227.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">methods</text><circle cx="49" cy="250.92" r="4.5" fill="#2e6b62"/><text x="62" y="256.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Interpretivists favour</text><text x="62" y="277.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">valid, qualitative ones</text><circle cx="49" cy="300.92" r="4.5" fill="#2e6b62"/><text x="62" y="306.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Perspective shapes which</text><text x="62" y="327.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">questions seem important</text><rect x="315.3333333333333" y="104" width="269.3333333333333" height="247" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M316.5833333333333,154 L316.5833333333333,118.25 Q316.5833333333333,105.25 329.5833333333333,105.25 L570.4166666666666,105.25 Q583.4166666666666,105.25 583.4166666666666,118.25 L583.4166666666666,154 Z" fill="#dce9e7"/><line x1="316.5833333333333" y1="154" x2="583.4166666666666" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="134.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Practical</text><circle cx="334.3333333333333" cy="179.92" r="4.5" fill="#2e6b62"/><text x="347.3333333333333" y="185.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Time and money</text><circle cx="334.3333333333333" cy="208.92" r="4.5" fill="#2e6b62"/><text x="347.3333333333333" y="214.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Funding bodies’</text><text x="347.3333333333333" y="235.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">requirements</text><circle cx="334.3333333333333" cy="258.92" r="4.5" fill="#2e6b62"/><text x="347.3333333333333" y="264.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Access</text><circle cx="334.3333333333333" cy="287.92" r="4.5" fill="#2e6b62"/><text x="347.3333333333333" y="293.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The researcher’s</text><text x="347.3333333333333" y="314.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">characteristics and skills</text><rect x="600.6666666666666" y="104" width="269.3333333333333" height="247" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.9166666666666,154 L601.9166666666666,118.25 Q601.9166666666666,105.25 614.9166666666666,105.25 L855.75,105.25 Q868.75,105.25 868.75,118.25 L868.75,154 Z" fill="#f2e7b8"/><line x1="601.9166666666666" y1="154" x2="868.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="735.3333333333333" y="134.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Ethical</text><circle cx="619.6666666666666" cy="179.92" r="4.5" fill="#2e6b62"/><text x="632.6666666666666" y="185.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">BSA Statement of Ethical</text><text x="632.6666666666666" y="206.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Practice: informed</text><text x="632.6666666666666" y="227.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">consent, confidentiality,</text><text x="632.6666666666666" y="248.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">avoiding harm, care with</text><text x="632.6666666666666" y="269.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">vulnerable groups</text><circle cx="619.6666666666666" cy="292.92" r="4.5" fill="#2e6b62"/><text x="632.6666666666666" y="298.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Covert methods raise</text><text x="632.6666666666666" y="319.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">deception</text><line x1="164.66666666666666" y1="357" x2="330" y2="401" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="450" y1="357" x2="450" y2="401" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="735.3333333333333" y1="357" x2="570" y2="401" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="220" y="407" width="460" height="60" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="445" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Choice of topic, method and conduct</text>
</svg>