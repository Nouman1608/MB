<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 731" width="900" height="731" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="731" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Methods and sources of data</text>

<rect x="180" y="108" width="336" height="38" rx="10" fill="#b5d3cf"/><text x="348" y="134" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Quantitative</text><rect x="534" y="108" width="336" height="38" rx="10" fill="#f2e7b8"/><text x="702" y="134" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Qualitative</text><rect x="30" y="158" width="140" height="206" rx="10" fill="#dce9e7"/><text x="100" y="268" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Primary</text><rect x="30" y="444" width="140" height="150" rx="10" fill="#dce9e7"/><text x="100" y="526" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Secondary</text><rect x="180" y="158" width="336" height="206" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="198" y="197" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Questionnaires</text><text x="198" y="220" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">large samples, reliable; low validity</text><text x="198" y="259" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Structured interviews</text><text x="198" y="282" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">standardised; interviewer bias</text><text x="198" y="321" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Laboratory experiments</text><text x="198" y="344" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">control, cause and effect; artificial</text><rect x="534" y="158" width="336" height="206" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="552" y="184" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Unstructured interviews</text><text x="552" y="207" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">rapport, depth; small samples</text><text x="552" y="254" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Participant observation</text><text x="552" y="277" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">natural behaviour, verstehen; going</text><text x="552" y="297" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">native</text><rect x="180" y="444" width="336" height="150" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="198" y="517" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Official statistics</text><text x="198" y="540" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">large scale, trends; socially</text><text x="198" y="560" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">constructed, dark figures</text><rect x="534" y="444" width="336" height="150" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="552" y="517" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Documents (usually)</text><text x="552" y="540" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">access to the past, cheap; judge by</text><text x="552" y="560" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Scott’s four criteria</text><rect x="180" y="378" width="690" height="48" rx="24" fill="#efdfa8" stroke="#8a6d0d" stroke-width="2" stroke-dasharray="7 5"/><text x="525" y="409" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Also primary: non-participant observation, field experiments</text><rect x="30" y="616" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="652" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Scott (1990): four criteria for documents</text><text x="56" y="681" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Authenticity, credibility, representativeness and meaning.</text>
</svg>