<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="520" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Consensus, conflict and social action</text>

<rect x="30" y="104" width="269.3333333333333" height="308" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,154 L31.25,118.25 Q31.25,105.25 44.25,105.25 L285.0833333333333,105.25 Q298.0833333333333,105.25 298.0833333333333,118.25 L298.0833333333333,154 Z" fill="#b5d3cf"/><line x1="31.25" y1="154" x2="298.0833333333333" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="164.66666666666666" y="134.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Consensus</text><text x="44" y="185.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">structural</text><circle cx="49" cy="206.92" r="4.5" fill="#2e6b62"/><text x="62" y="212.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Functionalism:</tspan> society as</text><text x="62" y="233.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">a system of interrelated</text><text x="62" y="254.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">parts based on shared</text><text x="62" y="275.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">values</text><circle cx="49" cy="298.92" r="4.5" fill="#2e6b62"/><text x="62" y="304.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Durkheim; Parsons; Merton</text><text x="62" y="325.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(manifest and latent</text><text x="62" y="346.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">functions)</text><rect x="315.3333333333333" y="104" width="269.3333333333333" height="308" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M316.5833333333333,154 L316.5833333333333,118.25 Q316.5833333333333,105.25 329.5833333333333,105.25 L570.4166666666666,105.25 Q583.4166666666666,105.25 583.4166666666666,118.25 L583.4166666666666,154 Z" fill="#f2e7b8"/><line x1="316.5833333333333" y1="154" x2="583.4166666666666" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="134.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Conflict</text><text x="329.3333333333333" y="185.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">structural, or mainly</text><text x="329.3333333333333" y="206.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">conflict</text><circle cx="334.3333333333333" cy="227.92" r="4.5" fill="#2e6b62"/><text x="347.3333333333333" y="233.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Marxism:</tspan> class conflict;</text><text x="347.3333333333333" y="254.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">ideology legitimates</text><text x="347.3333333333333" y="275.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">exploitation (Marx;</text><text x="347.3333333333333" y="296.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Althusser; Gramsci)</text><circle cx="334.3333333333333" cy="319.92" r="4.5" fill="#2e6b62"/><text x="347.3333333333333" y="325.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Feminism:</tspan> patriarchy;</text><text x="347.3333333333333" y="346.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">liberal, radical, Marxist</text><text x="347.3333333333333" y="367.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and difference feminisms</text><text x="347.3333333333333" y="388.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(Oakley; Walby)</text><rect x="600.6666666666666" y="104" width="269.3333333333333" height="308" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.9166666666666,154 L601.9166666666666,118.25 Q601.9166666666666,105.25 614.9166666666666,105.25 L855.75,105.25 Q868.75,105.25 868.75,118.25 L868.75,154 Z" fill="#dce9e7"/><line x1="601.9166666666666" y1="154" x2="868.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="735.3333333333333" y="134.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Social action</text><text x="614.6666666666666" y="185.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">meanings and interaction</text><circle cx="619.6666666666666" cy="206.92" r="4.5" fill="#2e6b62"/><text x="632.6666666666666" y="212.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Symbolic interactionism:</tspan></text><text x="632.6666666666666" y="233.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">people create society</text><text x="632.6666666666666" y="254.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">through shared meanings</text><text x="632.6666666666666" y="275.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(Mead; Blumer)</text><circle cx="619.6666666666666" cy="298.92" r="4.5" fill="#2e6b62"/><text x="632.6666666666666" y="304.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Phenomenology /</tspan></text><text x="632.6666666666666" y="325.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">ethnomethodology:</tspan> how</text><text x="632.6666666666666" y="346.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">people make sense of the</text><text x="632.6666666666666" y="367.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">world (Schutz; Garfinkel)</text><rect x="30" y="430" width="840" height="64" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="458" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Structuration (Giddens, 1984)</text><text x="450" y="482" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">bridges structure and action: each reproduces the other</text>
</svg>