<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 568" width="900" height="568" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="568" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Is sociology a science?</text>

<rect x="258" y="104" width="612" height="44" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="564" y="131.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Position</text><rect x="30" y="156" width="220" height="74" rx="10" fill="#b5d3cf" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="198.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Positivists</text><rect x="258" y="156" width="612" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="272" y="187.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Yes: sociology can and should follow the logic of the natural</text><text x="272" y="209.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">sciences.</text><rect x="30" y="238" width="220" height="74" rx="10" fill="#b5d3cf" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="269.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Realists: Keat and</text><text x="42" y="291.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Urry; Sayer</text><rect x="258" y="238" width="612" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="272" y="269.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Yes: like meteorology, it studies <tspan font-weight="700">open systems</tspan> but can still seek</text><text x="272" y="291.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">underlying causes.</text><rect x="30" y="320" width="220" height="52" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="351.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Popper (1934)</text><rect x="258" y="320" width="612" height="52" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="272" y="351.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Science is defined by <tspan font-weight="700">falsification</tspan>; Marxism is unfalsifiable.</text><rect x="30" y="380" width="220" height="74" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="422.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Kuhn (1962)</text><rect x="258" y="380" width="612" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="272" y="411.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Science works within <tspan font-weight="700">paradigms</tspan>; sociology is "pre-paradigmatic"</text><text x="272" y="433.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">because sociologists disagree on fundamentals.</text><rect x="30" y="462" width="220" height="74" rx="10" fill="#ffffff" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="504.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Interpretivists</text><rect x="258" y="462" width="612" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="272" y="493.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">No: sociology studies meaningful action, so natural-science</text><text x="272" y="515.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">methods are inappropriate.</text>
</svg>