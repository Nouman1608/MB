<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 528" width="900" height="528" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="528" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Women and the Great Patriotic War</text>

<rect x="30" y="100" width="268" height="218" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">HOME FRONT</text><text x="50" y="158.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Replaced men</text><text x="50" y="186.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Factories, mines, transport;</text><text x="50" y="207.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">most of the work on</text><text x="50" y="228.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">collective farms; dug city</text><text x="50" y="249.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">defences; civil defence.</text><rect x="316" y="100" width="268" height="218" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="336" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ARMED FORCES</text><text x="336" y="158.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Over 800,000 (common</text><text x="336" y="181.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">estimates)</text><text x="336" y="209.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Medics, signallers,</text><text x="336" y="230.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">anti-aircraft gunners, snipers,</text><text x="336" y="251.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">tank crew, pilots. 588th Night</text><text x="336" y="272.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Bomber Regiment: the "Night</text><text x="336" y="293.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Witches".</text><rect x="602" y="100" width="268" height="218" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="622" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">AFTER THE WAR</text><text x="622" y="158.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Back to motherhood</text><text x="622" y="186.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Most demobilised; the state</text><text x="622" y="207.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">again stressed motherhood;</text><text x="622" y="228.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">many veterans' service little</text><text x="622" y="249.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">recognised for years.</text><text x="30" y="348" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">WOMEN IN PROPAGANDA</text><rect x="30" y="366" width="328.8" height="130" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="411.32" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">"The Motherland Calls!" (1941)</text><text x="50" y="440.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A woman as the symbol of the nation</text><text x="50" y="461.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">calling its people to fight.</text><rect x="376.8" y="366" width="493.2" height="130" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="396.8" y="400.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Lyudmila Pavlichenko</text><text x="396.8" y="429.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Sniper credited with 309 kills. Wounded 1942, sent on a</text><text x="396.8" y="450.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">tour of Allied countries (USA, Britain): to show Soviet</text><text x="396.8" y="471.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">heroism and equality, and to press for a second front.</text>
</svg>