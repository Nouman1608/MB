<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="540" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Stalin as war leader: a balance</text>

<rect x="30" y="100" width="411" height="232" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="132" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">WEAKNESSES</text><text x="50" y="158.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Costly mistakes</text><text x="50" y="187.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="187.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Ignored warnings of the attack</text><text x="50" y="213.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="213.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Purges of 1937-38 removed experienced</text><text x="65.2" y="234.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">officers</text><text x="50" y="260.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="260.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">1941: holding ground led to huge</text><text x="65.2" y="281.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">encirclements, e.g. Kiev</text><rect x="459" y="100" width="411" height="232" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="479" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STRENGTHS</text><text x="479" y="158.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Leadership</text><text x="479" y="187.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="494.2" y="187.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Chaired the State Defence Committee</text><text x="479" y="213.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="494.2" y="213.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Stayed in Moscow, October 1941; 7 November</text><text x="494.2" y="234.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">parade</text><text x="479" y="260.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="494.2" y="260.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">July 1941 speech: "brothers and sisters"</text><text x="479" y="286.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="494.2" y="286.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">From 1942 relied on commanders such as</text><text x="494.2" y="307.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Zhukov: Stalingrad (1942-43), Kursk (1943)</text><rect x="30" y="354" width="411" height="154" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="386" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">HARSHNESS</text><text x="50" y="412.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Order No. 227, July 1942</text><text x="50" y="441.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">"Not one step back": retreat without orders was</text><text x="50" y="462.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">treason, enforced by penal battalions and NKVD</text><text x="50" y="483.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">units.</text><rect x="459" y="354" width="411" height="154" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="479" y="396.5" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">CHANGING TONE</text><text x="479" y="423.32" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Motherland before communism</text><text x="479" y="452.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Propaganda stressed Russian history; in 1943</text><text x="479" y="473.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the Orthodox Church could elect a patriarch.</text>
</svg>