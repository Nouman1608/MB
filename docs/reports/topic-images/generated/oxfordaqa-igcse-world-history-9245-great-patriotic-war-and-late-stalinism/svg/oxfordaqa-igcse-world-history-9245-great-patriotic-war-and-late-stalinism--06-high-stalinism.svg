<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 778" width="900" height="778" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="778" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">High Stalinism and the death of Stalin</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">1946-1953</text>
<line x1="160" y1="132" x2="160" y2="738" stroke="#1e2a44" stroke-width="4"/><rect x="200" y="124" width="670" height="69" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="213" y="151.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Zhdanov's cultural attacks</text><text x="213" y="175.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Writers and artists accused of Western influence, e.g. Akhmatova and Zoshchenko.</text><circle cx="160" cy="158.5" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="140" y="164.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">From 1946</text><rect x="200" y="203" width="670" height="69" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="213" y="230.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Campaign against "cosmopolitans"</text><text x="213" y="254.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Targeted Jewish intellectuals in particular.</text><circle cx="160" cy="237.5" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="140" y="243.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">From 1948</text><rect x="200" y="282" width="670" height="69" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="213" y="309.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Leningrad Affair</text><text x="213" y="333.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Leading Leningrad party officials arrested and shot.</text><circle cx="160" cy="316.5" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="140" y="322.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1949-50</text><rect x="200" y="361" width="670" height="69" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="213" y="388.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Stalin's seventieth birthday</text><text x="213" y="412.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The cult of personality at its height.</text><circle cx="160" cy="395.5" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="140" y="401.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Dec 1949</text><rect x="200" y="440" width="670" height="69" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="213" y="467.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Gulag population peaks</text><text x="213" y="491.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Including returning prisoners of war suspected of disloyalty.</text><circle cx="160" cy="474.5" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="140" y="480.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Early 1950s</text><rect x="200" y="519" width="670" height="69" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="213" y="546.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Doctors' Plot announced</text><text x="213" y="570.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Mostly Jewish doctors accused; fear of a new great purge.</text><circle cx="160" cy="553.5" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="140" y="559.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Jan 1953</text><rect x="200" y="598" width="670" height="69" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="213" y="625.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Stalin dies</text><text x="213" y="649.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">After a stroke on 1 March; help delayed by fearful guards.</text><circle cx="160" cy="632.5" r="10" fill="#1e2a44" stroke="#1e2a44" stroke-width="3"/><text x="140" y="638.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">5 Mar 1953</text><rect x="200" y="677" width="670" height="69" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="213" y="704.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Beria arrested, then executed</text><text x="213" y="728.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">NKVD head from 1938; Doctors' Plot defendants soon released.</text><circle cx="160" cy="711.5" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="140" y="707.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Jun / Dec</text><text x="140" y="727.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1953</text>
</svg>