<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 525" width="900" height="525" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="525" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The human cost of the war</text>

<rect x="30" y="100" width="840" height="93" rx="14" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="450" y="137.16" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Around 27 million Soviet citizens died</text><text x="450" y="168.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Soldiers and civilians: the greatest loss of any country in the war.</text><rect x="30" y="215" width="411" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="249.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Siege of Leningrad</text><text x="50" y="278.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Hundreds of thousands of civilians died, mostly</text><text x="50" y="299.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">of starvation and cold.</text><rect x="459" y="215" width="411" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="479" y="249.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Occupation</text><text x="479" y="278.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Mass killings, including the murder of Soviet</text><text x="479" y="299.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Jews; villages burned; deportation to Germany</text><text x="479" y="320.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">for forced labour.</text><rect x="30" y="363" width="411" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="397.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Homes and families</text><text x="50" y="426.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Millions of homes destroyed; many children</text><text x="50" y="447.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">orphaned.</text><rect x="459" y="363" width="411" height="130" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="479" y="397.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Deported nationalities</text><text x="479" y="426.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Accused of collaboration: Volga Germans (1941),</text><text x="479" y="447.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Chechens and Ingush (1944), Crimean Tatars</text><text x="479" y="468.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">(1944). Many died.</text>
</svg>