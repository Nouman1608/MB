<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 683" width="900" height="683" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="683" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A war economy</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">After the invasion of 22 June 1941 (Operation Barbarossa)</text>
<rect x="30" y="124" width="840" height="111" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="158.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The blow</text><text x="50" y="188.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Germany captured vast areas, including much of Ukraine (the richest farmland and an important</text><text x="50" y="210.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">industrial region). Leningrad was besieged from September 1941 to January 1944.</text><rect x="30" y="251" width="411" height="154" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="283" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">RELOCATION</text><text x="50" y="309.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Factories moved east</text><text x="50" y="338.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Over 1,500 dismantled and moved by rail to the</text><text x="50" y="359.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Urals, Siberia and Central Asia in 1941; rebuilt,</text><text x="50" y="380.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">often in the open air.</text><rect x="459" y="251" width="411" height="154" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="479" y="283" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">TOTAL MOBILISATION</text><text x="479" y="309.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Everything for the war</text><text x="479" y="338.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Huge production of tanks, aircraft and guns;</text><text x="479" y="359.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">longer hours; tighter labour discipline.</text><rect x="30" y="423" width="411" height="154" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="455" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">FOOD</text><text x="50" y="481.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Strict rationing</text><text x="50" y="510.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Farmland occupied; men and horses taken by</text><text x="50" y="531.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the army. Many survived on bread and what they</text><text x="50" y="552.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">could grow.</text><rect x="459" y="423" width="411" height="154" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="479" y="455" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">ALLIED AID</text><text x="479" y="481.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Lend-Lease</text><text x="479" y="510.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">From the USA and Britain, especially lorries, food</text><text x="479" y="531.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">and raw materials.</text><rect x="30" y="593" width="840" height="58" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="626.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">The industrial base built in the east during the Five-Year Plans proved vital.</text>
</svg>