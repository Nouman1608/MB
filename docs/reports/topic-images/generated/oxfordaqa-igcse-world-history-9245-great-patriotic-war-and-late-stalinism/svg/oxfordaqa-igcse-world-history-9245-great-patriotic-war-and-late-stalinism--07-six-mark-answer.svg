<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 576" width="900" height="576" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="576" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A 6-mark "explain one way" answer</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">How the war changed life in the countryside</text>
<line x1="60" y1="144" x2="60" y2="524" stroke="#c9d6d4" stroke-width="4"/><rect x="104" y="124" width="766" height="85" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="122" y="156.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Name the way</text><text x="122" y="186.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Villages were left with far fewer workers.</text><circle cx="60" cy="166.5" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="175.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="104" y="221" width="766" height="107" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="253.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Support with detail</text><text x="122" y="283.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Millions of men and many horses and tractors were taken by the army; women, children</text><text x="122" y="305.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">and the elderly did almost all the farm work and still met grain demands.</text><circle cx="60" cy="274.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="283.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="104" y="340" width="766" height="85" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="372.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Explain the effect</text><text x="122" y="402.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Longer hours and greater hardship: food went first to the army and the cities.</text><circle cx="60" cy="382.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="391.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="104" y="437" width="766" height="107" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="469.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Show the change lasted</text><text x="122" y="499.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">So many men died that the countryside stayed short of labour after 1945, helping explain</text><text x="122" y="521.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">post-war stagnation.</text><circle cx="60" cy="490.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="499.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text>
</svg>