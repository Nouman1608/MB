<rect width="900" height="468" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The research proposal</text>

<rect x="30" y="115" width="280" height="105" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="48" y="150.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Research question</text><text x="48" y="175.9" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">the single question the report</text><text x="48" y="195.70000000000002" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">answers</text><rect x="330" y="115" width="280" height="105" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="348" y="150.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Key concepts</text><text x="348" y="175.9" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">e.g. gender and feminism for</text><text x="348" y="195.70000000000002" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">women in poetry</text><rect x="30" y="235" width="280" height="105" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="48" y="270.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Outline of the debate</text><text x="48" y="295.90000000000003" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">the perspectives to be addressed</text><rect x="330" y="235" width="280" height="105" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="348" y="270.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Example sources</text><text x="348" y="295.90000000000003" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">what will be used</text><line x1="614" y1="230" x2="646" y2="230" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="650" y="115" width="220" height="225" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="668" y="150.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Teacher checks</text><text x="668" y="175.9" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">concepts and debate</text><text x="668" y="195.70000000000002" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">relevant; scope to meet</text><text x="668" y="215.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">criteria; no safety</text><text x="668" y="235.3" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">issues; then formally</text><text x="668" y="255.10000000000002" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">approves</text><rect x="30" y="365" width="840" height="72.24000000000001" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="395.2" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Not externally marked, but sent to Cambridge with the report and log. A weak proposal often leads to</text><text x="450" y="416.32" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">a weak question.</text>
</svg>