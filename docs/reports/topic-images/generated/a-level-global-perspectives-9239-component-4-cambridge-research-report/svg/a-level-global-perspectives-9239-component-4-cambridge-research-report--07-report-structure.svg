<rect width="900" height="724" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Structuring the report</text>

<rect x="130" y="115" width="640" height="83" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="450" y="151.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Introduction</text><text x="450" y="177.51000000000002" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="middle">the question; how and why it was developed and narrowed</text><line x1="450" y1="202" x2="450" y2="228" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="130" y="234" width="640" height="104" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="450" y="270.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Main body (sub-headings allowed)</text><text x="450" y="296.51" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="middle">methods and methodology; contrasting perspectives built and compared; sources</text><text x="450" y="316.96999999999997" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="middle">assessed</text><line x1="450" y1="342" x2="450" y2="368" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="130" y="374" width="640" height="83" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.2"/><text x="450" y="410.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Conclusion</text><text x="450" y="436.51" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="middle">a judgement weighing the perspectives; reflection on scope and limitations</text><line x1="450" y1="461" x2="450" y2="487" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="130" y="493" width="640" height="104" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="450" y="529.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Bibliography</text><text x="450" y="555.51" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="middle">one consistent system (e.g. Harvard, Chicago, APA); full references for</text><text x="450" y="575.97" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="middle">quotations</text><rect x="30" y="621" width="840" height="72.24000000000001" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="651.2" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Continuous prose for a non-specialist reader; max 5000 words with the count stated (title and</text><text x="450" y="672.32" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">references excluded); beyond 5000 is not marked.</text>
</svg>