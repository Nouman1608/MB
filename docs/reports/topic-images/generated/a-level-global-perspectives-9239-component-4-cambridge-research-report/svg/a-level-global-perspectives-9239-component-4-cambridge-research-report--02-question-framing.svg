<rect width="900" height="590" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">From topic to research question</text>

<rect x="30" y="115" width="840" height="96" rx="12" fill="#fbeee6" stroke="#b5602e" stroke-width="2.2"/><text x="48" y="157.5" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">✗  “Industrialisation”</text><text x="48" y="184.62" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">a topic, not a question</text><line x1="450" y1="213" x2="450" y2="233" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="235" width="840" height="96" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="48" y="277.5" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">~  “Has industrialisation been environmentally damaging?”</text><text x="48" y="304.62" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">a question, but one-sided</text><line x1="450" y1="333" x2="450" y2="353" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="355" width="840" height="96" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="48" y="397.5" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">✓  “Is industrialisation a good thing?”</text><text x="48" y="424.62" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">works: opens up competing views</text><text x="30" y="500" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Scope: the teacher checks it is “not too large, nor too complex”</text><defs><linearGradient id="sg" x1="0" x2="1"><stop offset="0" stop-color="#f3d9c9"/><stop offset="0.5" stop-color="#d4b02e"/><stop offset="1" stop-color="#f3d9c9"/></linearGradient></defs><rect x="30" y="515" width="840" height="44" rx="22" fill="url(#sg)" stroke="#1e2a44" stroke-width="2"/><text x="50" y="543" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">too broad: shallow</text><text x="450" y="543" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">best fit</text><text x="850" y="543" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">too narrow: not enough evidence</text>
</svg>