<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 652" width="900" height="652" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="652" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Choosing research methods</text>

<rect x="30" y="110" width="840" height="51.760000000000005" rx="12" fill="#2e6b62"/><text x="42" y="138.2" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">Method</text><text x="282" y="138.2" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">Strength</text><text x="582" y="138.2" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">Limitation</text><rect x="30" y="157.76" width="840" height="64.88" fill="#ffffff"/><text x="42" y="184.20999999999998" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Literature review</text><text x="282" y="184.20999999999998" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">access to expert arguments and</text><text x="282" y="206.64999999999998" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">large data sets</text><text x="582" y="184.20999999999998" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">depends on what others chose to</text><text x="582" y="206.64999999999998" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">study</text><rect x="30" y="222.64" width="840" height="64.88" fill="#f7f9f9"/><text x="42" y="249.08999999999997" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Interviews</text><text x="282" y="249.08999999999997" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">depth; you can follow up answers</text><text x="582" y="249.08999999999997" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">few people; answers shaped by</text><text x="582" y="271.53" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">the interviewer</text><line x1="30" y1="222.64" x2="870" y2="222.64" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="287.52" width="840" height="42.44" fill="#ffffff"/><text x="42" y="313.96999999999997" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Survey</text><text x="282" y="313.96999999999997" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">many responses; easy to compare</text><text x="582" y="313.96999999999997" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">shallow answers; sampling bias</text><line x1="30" y1="287.52" x2="870" y2="287.52" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="329.96" width="840" height="64.88" fill="#f7f9f9"/><text x="42" y="356.40999999999997" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Close analysis of texts</text><text x="282" y="356.40999999999997" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">detailed reading of language and</text><text x="282" y="378.84999999999997" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">meaning</text><text x="582" y="356.40999999999997" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">interpretations can be contested</text><line x1="30" y1="329.96" x2="870" y2="329.96" stroke="#c9d6d4" stroke-width="1.5"/><line x1="270" y1="157.76" x2="270" y2="394.84" stroke="#c9d6d4" stroke-width="1.5"/><line x1="570" y1="157.76" x2="570" y2="394.84" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="110" width="840" height="284.84" rx="12" fill="none" stroke="#1e2a44" stroke-width="2.2"/><rect x="30" y="418.84" width="410" height="110" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="48" y="467.89" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Qualitative</text><text x="48" y="495.01" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">words and meanings; depth over number</text><rect x="460" y="418.84" width="410" height="110" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="478" y="467.89" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Quantitative</text><text x="478" y="495.01" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">numbers; patterns across many cases</text><rect x="30" y="548.8399999999999" width="840" height="72.24000000000001" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="579.04" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Methodology: explain why your methods suit the question and the discipline, and how that shapes the</text><text x="450" y="600.16" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">report.</text>
</svg>