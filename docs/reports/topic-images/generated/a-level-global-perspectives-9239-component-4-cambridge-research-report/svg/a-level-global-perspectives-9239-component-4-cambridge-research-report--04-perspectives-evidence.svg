<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 603" width="900" height="603" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="603" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Perspectives and evidence</text>

<rect x="30" y="115" width="840" height="80" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.2"/><text x="450" y="152.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Perspective</text><text x="450" y="180.07" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">“a coherent world view which is a response to an issue”, possibly shaped by context</text><line x1="450" y1="199" x2="175" y2="222" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="30" y="226" width="270" height="56" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="165" y="261.6" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Argument</text><line x1="450" y1="199" x2="450" y2="222" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="315" y="226" width="270" height="56" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="450" y="261.6" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Evidence</text><line x1="450" y1="199" x2="725" y2="222" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="600" y="226" width="270" height="56" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="735" y="261.6" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Assumptions</text><rect x="30" y="310" width="410" height="170" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="48" y="346.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Primary evidence</text><text x="48" y="371.85" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">first-hand: documents, literary texts, artefacts,</text><text x="48" y="391.65000000000003" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">observation, interviews, surveys</text><text x="48" y="411.45000000000005" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">+ test a claim yourself</text><text x="48" y="431.25" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">− a small local sample rarely supports a general</text><text x="48" y="451.05" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">conclusion</text><rect x="460" y="310" width="410" height="170" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.2"/><text x="478" y="346.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Secondary evidence</text><text x="478" y="371.85" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">specialists’ arguments and opinions</text><text x="478" y="391.65000000000003" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">+ expert depth quickly</text><text x="478" y="411.45000000000005" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">− may share hidden assumptions; one source type</text><text x="478" y="431.25" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">gives a lopsided review</text><rect x="30" y="500" width="840" height="72.24000000000001" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="530.2" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Literature review: group sources into perspectives and assess each for provenance, evidence and</text><text x="450" y="551.32" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">assumptions, not a list of summaries.</text>
</svg>