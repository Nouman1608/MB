<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A research log that reflects</text>

<rect x="30" y="115" width="840" height="120" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="450" y="159.45" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Research log: 10 marks</text><text x="450" y="186.57" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">separate from the report · notes or prose · not in the 5000 words, and not a way to extend them · no</text><text x="450" y="207.69" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">need to record every action</text><rect x="30" y="260" width="300" height="140" rx="12" fill="#fbeee6" stroke="#b5602e" stroke-width="2.2"/><text x="48" y="296.05" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">✗ Records only</text><text x="48" y="323.17" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">dates and “found three articles”</text><rect x="350" y="260" width="520" height="300" rx="14" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.5"/><text x="372" y="296" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">✓ Reflects: found → why it matters → next</text><text x="372" y="336" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Found</text><text x="460" y="336" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">two interview answers contradict the survey data</text><text x="460" y="355" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">on cost</text><text x="372" y="394" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Why</text><text x="460" y="394" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">interviewees all run shops; survey was shoppers</text><text x="372" y="452" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Decision</text><text x="460" y="452" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">keep both as separate perspectives; flag sample</text><text x="460" y="471" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">difference in methods</text><text x="372" y="510" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Next</text><text x="460" y="510" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">check with teacher whether question still works</text><text x="610" y="584" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">example entry, Week 6</text>
</svg>