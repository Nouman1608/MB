<rect width="900" height="593" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Adapting to rising sea levels</text>

<rect x="30" y="110" width="840" height="360" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="32" y="330" width="250" height="120" fill="#b5d3cf"/><line x1="32" y1="300" x2="282" y2="300" stroke="#2b5a9a" stroke-width="2.5" stroke-dasharray="9 6"/><text x="40" y="292" font-size="15" font-weight="700" fill="#2b5a9a" text-anchor="start">higher sea level</text><line x1="32" y1="330" x2="282" y2="330" stroke="#2e6b62" stroke-width="2.5"/><text x="40" y="352" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">present sea level</text><path d="M282,450 L282,340 L330,330 L420,324 L520,320 L640,290 L760,240 L868,220 L868,450 Z" fill="#efdfa8" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M200,360 L200,296 M190,350 L200,324 L210,350" fill="none" stroke="#6f9a52" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><circle cx="200" cy="288" r="15" fill="#6f9a52" stroke="#1e2a44" stroke-width="1.5"/><path d="M226,360 L226,296 M216,350 L226,324 L236,350" fill="none" stroke="#6f9a52" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><circle cx="226" cy="288" r="15" fill="#6f9a52" stroke="#1e2a44" stroke-width="1.5"/><path d="M252,360 L252,296 M242,350 L252,324 L262,350" fill="none" stroke="#6f9a52" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><circle cx="252" cy="288" r="15" fill="#6f9a52" stroke="#1e2a44" stroke-width="1.5"/><rect x="290" y="260" width="22" height="80" rx="2" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2.5"/><line x1="436" y1="324" x2="436" y2="274" stroke="#1e2a44" stroke-width="3"/><line x1="484" y1="322" x2="484" y2="274" stroke="#1e2a44" stroke-width="3"/><rect x="426" y="238" width="68" height="36" rx="2" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><path d="M420,238 L460,212 L500,238 Z" fill="#b5602e" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="760" y="200" width="50" height="36" rx="2" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><path d="M754,200 L785,178 L816,200 Z" fill="#b5602e" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M560,300 C620,240 680,210 744,212" fill="none" stroke="#8a6d0d" stroke-width="3" stroke-linecap="round" marker-end="url(#ahO)" stroke-dasharray="8 6"/><line x1="226" y1="272" x2="180" y2="190" stroke="#4a5568" stroke-width="1.8"/><text x="180" y="164" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Restore</text><text x="180" y="184" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">mangroves</text><line x1="301" y1="258" x2="320" y2="190" stroke="#4a5568" stroke-width="1.8"/><text x="320" y="164" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Sea walls and</text><text x="320" y="184" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">flood barriers</text><line x1="460" y1="210" x2="470" y2="168" stroke="#4a5568" stroke-width="1.8"/><text x="470" y="142" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Raise buildings</text><text x="470" y="162" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">on stilts</text><text x="600" y="180" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">Move people and</text><text x="600" y="200" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">buildings inland</text><text x="150" y="412" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">mangroves absorb</text><text x="150" y="431" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">wave energy</text><text x="856" y="136" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">not to scale</text><rect x="30" y="490" width="840" height="74.88" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="521.15" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">The Netherlands, much of which lies below sea level, protects its coast with large engineering</text><text x="450" y="543.59" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">schemes such as the Delta Works.</text>
