<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 702" width="900" height="702" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="702" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Mitigation and adaptation</text>

<rect x="30" y="116" width="186" height="86" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.2"/><text x="123" y="166.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Human activities</text><line x1="219" y1="159" x2="244" y2="159" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="248" y="116" width="186" height="86" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.2"/><text x="341" y="155.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Greenhouse gas</text><text x="341" y="177.59" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">emissions</text><line x1="437" y1="159" x2="462" y2="159" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="466" y="116" width="186" height="86" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.2"/><text x="559" y="166.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Climate change</text><line x1="655" y1="159" x2="680" y2="159" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="684" y="116" width="186" height="86" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.2"/><text x="777" y="150.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Effects on</text><text x="777" y="172.59" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">people and</text><text x="777" y="195.03" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">environment</text><path d="M30,212 L30,222 L434,222 L434,212" fill="none" stroke="#2e6b62" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><path d="M684,212 L684,222 L870,222 L870,212" fill="none" stroke="#8a6d0d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><rect x="30" y="236" width="470" height="52" rx="12" fill="#2e6b62" stroke="#2e6b62" stroke-width="2.2"/><text x="265" y="270" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">Mitigation: reduce the causes</text><rect x="520" y="236" width="350" height="52" rx="12" fill="#8a6d0d" stroke="#8a6d0d" stroke-width="2.2"/><text x="695" y="270" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">Adaptation: respond</text><rect x="30" y="298" width="470" height="88" rx="10" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="48" y="326" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Alternative energy</text><text x="48" y="350" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">wind, solar, hydroelectric</text><text x="48" y="374" font-size="15" font-weight="400" fill="#b5602e" text-anchor="start">– weather-dependent; costly infrastructure</text><rect x="30" y="394" width="470" height="88" rx="10" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="48" y="422" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Carbon capture</text><text x="48" y="446" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">store CO₂ deep underground</text><text x="48" y="470" font-size="15" font-weight="400" fill="#b5602e" text-anchor="start">– costly; not yet at large scale</text><rect x="30" y="490" width="470" height="88" rx="10" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="48" y="518" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Planting trees</text><text x="48" y="542" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">absorb CO₂ as they grow</text><text x="48" y="566" font-size="15" font-weight="400" fill="#b5602e" text-anchor="start">– takes decades; needs land; carbon returns if it burns</text><rect x="30" y="586" width="470" height="88" rx="10" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="48" y="614" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">International agreements</text><text x="48" y="638" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Kyoto 1997; Paris 2015</text><text x="48" y="662" font-size="15" font-weight="400" fill="#b5602e" text-anchor="start">– depend on countries keeping promises</text><rect x="520" y="298" width="350" height="110" rx="10" fill="#ffffff" stroke="#8a6d0d" stroke-width="2"/><text x="538" y="328" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Agricultural systems</text><text x="538" y="356" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">drought-resistant crops, new planting</text><text x="538" y="377.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">dates, efficient irrigation</text><rect x="520" y="416" width="350" height="110" rx="10" fill="#ffffff" stroke="#8a6d0d" stroke-width="2"/><text x="538" y="446" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Managing water supply</text><text x="538" y="474" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">reservoirs, transfers, desalination,</text><text x="538" y="495.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">rainwater, fixing leaks</text><rect x="520" y="534" width="350" height="110" rx="10" fill="#ffffff" stroke="#8a6d0d" stroke-width="2"/><text x="538" y="564" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Rising sea levels</text><text x="538" y="592" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">sea walls, stilts, mangroves, moving</text><text x="538" y="613.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">away from the coast</text>
</svg>