<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 627" width="900" height="627" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="627" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Human causes: the enhanced greenhouse effect</text>

<rect x="30" y="115" width="330" height="110" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="48" y="154" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Fossil fuels</text><text x="48" y="181.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">coal, oil and gas for electricity,</text><text x="48" y="202.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">transport and industry</text><line x1="364" y1="170" x2="392" y2="170" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="396" y="119" width="240" height="102" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="516" y="154.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">carbon dioxide</text><text x="516" y="179.95000000000002" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">the largest single human</text><text x="516" y="199.75000000000003" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">contribution</text><path d="M640,170 C668,170 660,301 684,301" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linecap="round" marker-end="url(#ah)"/><rect x="30" y="239" width="330" height="110" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="48" y="278" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Agriculture</text><text x="48" y="305.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">livestock digestion; flooded rice</text><text x="48" y="326.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">fields; nitrogen fertilisers</text><line x1="364" y1="294" x2="392" y2="294" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="396" y="243" width="240" height="102" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="516" y="288.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">methane, nitrous oxide</text><text x="516" y="313.95" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">powerful greenhouse gases</text><path d="M640,294 C668,294 660,301 684,301" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linecap="round" marker-end="url(#ah)"/><rect x="30" y="363" width="330" height="110" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="48" y="402" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Deforestation</text><text x="48" y="429.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">clearing forest, especially by</text><text x="48" y="450.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">burning</text><line x1="364" y1="418" x2="392" y2="418" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="396" y="367" width="240" height="102" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="516" y="412.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">carbon dioxide</text><text x="516" y="437.95" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">and a carbon store is lost</text><path d="M640,418 C668,418 660,301 684,301" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linecap="round" marker-end="url(#ah)"/><rect x="688" y="196" width="182" height="210" rx="12" fill="#b5602e" stroke="#1e2a44" stroke-width="2.2"/><text x="779" y="242.1" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Enhanced</text><text x="779" y="265.86" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">greenhouse</text><text x="779" y="289.62" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">effect</text><text x="779" y="315.41999999999996" font-size="15" font-weight="400" fill="#ffffff" text-anchor="middle">more heat trapped</text><text x="779" y="335.21999999999997" font-size="15" font-weight="400" fill="#ffffff" text-anchor="middle">that would</text><text x="779" y="355.02" font-size="15" font-weight="400" fill="#ffffff" text-anchor="middle">otherwise escape to</text><text x="779" y="374.81999999999994" font-size="15" font-weight="400" fill="#ffffff" text-anchor="middle">space</text><text x="30" y="505" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Why recent warming is linked to human causes</text><rect x="30" y="521" width="266" height="78" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="163" y="553" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Orbital changes</text><text x="163" y="579" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">far too slow for a century</text><rect x="317" y="521" width="266" height="78" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="450" y="553" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Volcanic and solar</text><text x="450" y="579" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">too small and short-term</text><rect x="604" y="521" width="266" height="78" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="737" y="553" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Greenhouse gases</text><text x="737" y="579" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">rise matches warming since c. 1850</text>
</svg>