<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 603" width="900" height="603" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="603" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Natural causes of climate change</text>

<rect x="30" y="110" width="266" height="390" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="163" y="144" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Orbital changes</text><ellipse cx="163" cy="205" rx="95" ry="45" fill="none" stroke="#2e6b62" stroke-width="2.5"/><circle cx="163" cy="205" r="44" fill="none" stroke="#4a5568" stroke-width="2" stroke-dasharray="5 5"/><circle cx="143" cy="205" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="258" cy="205" r="7" fill="#2b5a9a" stroke="#1e2a44" stroke-width="1.5"/><text x="48" y="288" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Shape (circular ↔ oval)</text><text x="48" y="310" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="start">about 100,000 years</text><text x="48" y="340" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Tilt of the axis</text><text x="48" y="362" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="start">about 41,000 years</text><text x="48" y="392" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Wobble of the axis</text><text x="48" y="414" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="start">about 26,000 years</text><text x="48" y="456" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Linked to the timing of glacials</text><text x="48" y="476" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">and interglacials</text><rect x="317" y="110" width="266" height="390" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="144" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Volcanic activity</text><g transform="translate(0,26)"><path d="M360,270 L428,190 L472,190 L540,270 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M440,188 q-30,-18 -10,-34 q10,-20 30,-6 q24,-6 22,18 q4,16 -14,22 z" fill="#c9cfd6" stroke="#1e2a44" stroke-width="2"/><circle cx="390" cy="175" r="3.5" fill="#8a6d0d"/><circle cx="375" cy="200" r="3.5" fill="#8a6d0d"/><circle cx="510" cy="170" r="3.5" fill="#8a6d0d"/><circle cx="530" cy="195" r="3.5" fill="#8a6d0d"/><circle cx="450" cy="160" r="3.5" fill="#8a6d0d"/></g><text x="335" y="324" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Sulphur dioxide droplets</text><text x="335" y="346" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">reflect sunlight → cooling</text><text x="335" y="380" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Pinatubo, 1991: about 0.5 °C</text><text x="335" y="402" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">cooler for a year or two</text><text x="335" y="444" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="start">short-lived: droplets fall out</text><rect x="604" y="110" width="266" height="390" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="737" y="144" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Solar output</text><line x1="785" y1="215" x2="801" y2="215" stroke="#8a6d0d" stroke-width="3"/><line x1="778.569219381653" y1="239" x2="792.4256258422041" y2="247" stroke="#8a6d0d" stroke-width="3"/><line x1="761" y1="256.56921938165306" x2="769" y2="270.42562584220406" stroke="#8a6d0d" stroke-width="3"/><line x1="737" y1="263" x2="737" y2="279" stroke="#8a6d0d" stroke-width="3"/><line x1="713" y1="256.56921938165306" x2="705" y2="270.42562584220406" stroke="#8a6d0d" stroke-width="3"/><line x1="695.430780618347" y1="239" x2="681.5743741577959" y2="247" stroke="#8a6d0d" stroke-width="3"/><line x1="689" y1="215" x2="673" y2="215" stroke="#8a6d0d" stroke-width="3"/><line x1="695.430780618347" y1="191" x2="681.5743741577959" y2="183.00000000000003" stroke="#8a6d0d" stroke-width="3"/><line x1="713" y1="173.43078061834694" x2="705" y2="159.57437415779594" stroke="#8a6d0d" stroke-width="3"/><line x1="737" y1="167" x2="737" y2="151" stroke="#8a6d0d" stroke-width="3"/><line x1="761" y1="173.43078061834694" x2="769" y2="159.57437415779594" stroke="#8a6d0d" stroke-width="3"/><line x1="778.569219381653" y1="190.99999999999997" x2="792.425625842204" y2="182.99999999999997" stroke="#8a6d0d" stroke-width="3"/><circle cx="737" cy="215" r="40" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="725" cy="206" r="6" fill="#8a6d0d"/><circle cx="751" cy="224" r="4.5" fill="#8a6d0d"/><text x="622" y="316" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Varies slightly, partly in a</text><text x="622" y="338" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">cycle of about 11 years</text><text x="622" y="360" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">linked to sunspots</text><text x="622" y="400" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Maunder Minimum (about</text><text x="622" y="422" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">1645–1715) coincided with</text><text x="622" y="444" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">part of the Little Ice Age</text><rect x="30" y="522" width="840" height="52.44" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="553.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Orbital cycles work over thousands of years, so they cannot explain change over decades.</text>
</svg>