<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 679" width="900" height="679" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="679" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How far back each type of evidence reaches</text>

<text x="280" y="157" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">Ocean sediment cores</text><rect x="300" y="136" width="545.542483734664" height="32" rx="6" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="833.542483734664" y="158" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="end">the whole Quaternary and beyond</text><text x="280" y="209" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">Ice cores</text><rect x="300" y="188" width="457.621732119248" height="32" rx="6" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="745.621732119248" y="210" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="end">Antarctic cores: about 800,000 years</text><text x="280" y="261" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">Pollen analysis</text><rect x="300" y="240" width="296.43518417853033" height="32" rx="6" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="606.4351841785303" y="262" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">thousands of years</text><text x="280" y="313" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">Tree rings</text><rect x="300" y="292" width="251.9038670713618" height="32" rx="6" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="561.9038670713618" y="314" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">hundreds to several thousand years</text><text x="280" y="365" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">Historical records</text><rect x="300" y="344" width="172.20915040133065" height="32" rx="6" fill="#efdfa8" stroke="#1e2a44" stroke-width="2"/><text x="482.20915040133065" y="366" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">hundreds of years</text><text x="280" y="417" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">Instrumental records</text><rect x="300" y="396" width="114.84189932863893" height="32" rx="6" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="424.84189932863893" y="418" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">about 170 years</text><text x="280" y="469" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">Satellite observations</text><rect x="300" y="448" width="69.10051768612942" height="32" rx="6" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="379.1005176861294" y="470" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">since the 1970s</text><line x1="805.3975124772763" y1="118" x2="805.3975124772763" y2="500" stroke="#b5602e" stroke-width="2" stroke-dasharray="6 5"/><text x="799.3975124772763" y="122" font-size="15" font-weight="700" fill="#b5602e" text-anchor="end">Quaternary begins</text><line x1="300" y1="500" x2="860" y2="500" stroke="#1e2a44" stroke-width="2.5"/><line x1="300" y1="500" x2="300" y2="508" stroke="#1e2a44" stroke-width="2"/><text x="300" y="528" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">10</text><line x1="393.3333333333333" y1="500" x2="393.3333333333333" y2="508" stroke="#1e2a44" stroke-width="2"/><text x="393.3333333333333" y="528" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">100</text><line x1="486.66666666666663" y1="500" x2="486.66666666666663" y2="508" stroke="#1e2a44" stroke-width="2"/><text x="486.66666666666663" y="528" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">1,000</text><line x1="580" y1="500" x2="580" y2="508" stroke="#1e2a44" stroke-width="2"/><text x="580" y="528" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">10,000</text><line x1="673.3333333333333" y1="500" x2="673.3333333333333" y2="508" stroke="#1e2a44" stroke-width="2"/><text x="673.3333333333333" y="528" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">100,000</text><line x1="766.6666666666667" y1="500" x2="766.6666666666667" y2="508" stroke="#1e2a44" stroke-width="2"/><text x="766.6666666666667" y="528" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">1 million</text><line x1="860" y1="500" x2="860" y2="508" stroke="#1e2a44" stroke-width="2"/><text x="300" y="556" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">← present</text><text x="860" y="556" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end">years before present (log scale) →</text><rect x="30" y="578" width="840" height="72.24000000000001" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="608.2" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Older evidence is indirect (“proxies”); instrumental records are precise but short. Confidence comes</text><text x="450" y="629.32" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">from different types pointing the same way.</text>
</svg>