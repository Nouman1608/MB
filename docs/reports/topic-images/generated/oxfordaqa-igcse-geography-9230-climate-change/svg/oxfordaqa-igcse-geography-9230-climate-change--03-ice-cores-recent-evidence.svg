<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Reading the evidence</text>

<rect x="30" y="110" width="400" height="380" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="230" y="144" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">How an ice core works</text><g transform="translate(-24,0)"><rect x="150" y="165" width="110" height="300" rx="10" fill="#eef6f8" stroke="#1e2a44" stroke-width="2.5"/><line x1="150" y1="202.5" x2="260" y2="202.5" stroke="#c9d6d4" stroke-width="1.5"/><line x1="150" y1="240" x2="260" y2="240" stroke="#c9d6d4" stroke-width="1.5"/><line x1="150" y1="277.5" x2="260" y2="277.5" stroke="#c9d6d4" stroke-width="1.5"/><line x1="150" y1="315" x2="260" y2="315" stroke="#c9d6d4" stroke-width="1.5"/><line x1="150" y1="352.5" x2="260" y2="352.5" stroke="#c9d6d4" stroke-width="1.5"/><line x1="150" y1="390" x2="260" y2="390" stroke="#c9d6d4" stroke-width="1.5"/><line x1="150" y1="427.5" x2="260" y2="427.5" stroke="#c9d6d4" stroke-width="1.5"/><circle cx="175" cy="190" r="5" fill="#ffffff" stroke="#2b5a9a" stroke-width="2"/><circle cx="215" cy="200" r="5" fill="#ffffff" stroke="#2b5a9a" stroke-width="2"/><circle cx="190" cy="245" r="5" fill="#ffffff" stroke="#2b5a9a" stroke-width="2"/><circle cx="230" cy="270" r="5" fill="#ffffff" stroke="#2b5a9a" stroke-width="2"/><circle cx="170" cy="320" r="5" fill="#ffffff" stroke="#2b5a9a" stroke-width="2"/><circle cx="220" cy="345" r="5" fill="#ffffff" stroke="#2b5a9a" stroke-width="2"/><circle cx="195" cy="395" r="5" fill="#ffffff" stroke="#2b5a9a" stroke-width="2"/><circle cx="235" cy="420" r="5" fill="#ffffff" stroke="#2b5a9a" stroke-width="2"/><circle cx="175" cy="445" r="5" fill="#ffffff" stroke="#2b5a9a" stroke-width="2"/><text x="205" y="184" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">snow</text><path d="M120,175 L120,450" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linecap="round" marker-end="url(#ah)"/><text x="108" y="320" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">older</text><line x1="238" y1="270" x2="282" y2="250" stroke="#1e2a44" stroke-width="2"/><text x="288" y="238" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">air bubbles:</text><text x="288" y="258" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">CO₂ measured</text><line x1="240" y1="380" x2="282" y2="360" stroke="#1e2a44" stroke-width="2"/><text x="288" y="350" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">ice chemistry:</text><text x="288" y="370" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">temperature when</text><text x="288" y="390" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">the snow fell</text></g><rect x="450" y="110" width="420" height="380" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="660" y="144" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">What the recent evidence shows</text><text x="472" y="180" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">Carbon dioxide (parts per million)</text><rect x="472" y="192" width="173.6" height="30" rx="4" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="655.6" y="213" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">about 280 pre-industrial</text><rect x="472" y="230" width="260.4" height="30" rx="4" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><text x="742.4" y="251" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">&gt; 420 today</text><text x="472" y="300" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">Global surface temperature</text><text x="472" y="328" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">about 1.1 °C higher in 2011–2020</text><text x="472" y="350" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">than in 1850–1900 (IPCC)</text><text x="472" y="392" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">• Arctic late-summer sea ice shrinking</text><text x="472" y="420" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">• global sea level rising</text><text x="472" y="448" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">• glaciers photographed retreating</text>
