<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 741" width="900" height="741" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="741" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Townsend: the measure decides the amount</text>

<text x="450" y="92" font-size="18" font-weight="400" fill="#4a5568" text-anchor="middle">Poverty in the United Kingdom (1979): population in poverty, 1968–69</text><rect x="30" y="116" width="410" height="104" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="48" y="146" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">State standard</text><text x="48" y="172" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">Based on entitlement to benefits; arbitrarily set</text><text x="48" y="192" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">by the government of the day</text><rect x="470" y="146" width="66" height="44" rx="6" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="548" y="176" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">just over 6%</text><rect x="30" y="232" width="410" height="104" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="48" y="262" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Relative income</text><text x="48" y="288" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">Below the average for similar households;</text><text x="48" y="308" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">arbitrary, ignores welfare levels and lifestyles</text><rect x="470" y="262" width="99" height="44" rx="6" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="581" y="292" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">a little over 9%</text><rect x="30" y="348" width="410" height="104" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="48" y="378" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Relative deprivation</text><text x="48" y="404" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">Townsend’s preferred measure: lacking the diet,</text><text x="48" y="424" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">activities and living conditions widely available</text><rect x="470" y="378" width="242" height="44" rx="6" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="724" y="408" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">more than 22%</text><line x1="470" y1="110" x2="470" y2="458" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="470" width="412" height="247" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,520 L31.25,484.25 Q31.25,471.25 44.25,471.25 L427.75,471.25 Q440.75,471.25 440.75,484.25 L440.75,520 Z" fill="#b5d3cf"/><line x1="31.25" y1="520" x2="440.75" y2="520" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="500.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Method</text><circle cx="49" cy="545.9200000000001" r="4.5" fill="#2e6b62"/><text x="62" y="551.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Questionnaires: over 2,000 households, more</text><text x="62" y="572.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">than 6,000 individuals</text><circle cx="49" cy="595.9200000000001" r="4.5" fill="#2e6b62"/><text x="62" y="601.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Deprivation index: diet, fuel, clothing,</text><text x="62" y="622.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">housing, working conditions, health,</text><text x="62" y="643.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">education, social activities</text><circle cx="49" cy="666.9200000000001" r="4.5" fill="#2e6b62"/><text x="62" y="672.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">An income threshold below which deprivation</text><text x="62" y="693.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">rapidly increased</text><rect x="458" y="470" width="412" height="247" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,520 L459.25,484.25 Q459.25,471.25 472.25,471.25 L855.75,471.25 Q868.75,471.25 868.75,484.25 L868.75,520 Z" fill="#f2e7b8"/><line x1="459.25" y1="520" x2="868.75" y2="520" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="500.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Criticism</text><circle cx="477" cy="545.9200000000001" r="4.5" fill="#2e6b62"/><text x="490" y="551.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The index may mislead: no fresh meat or cooked</text><text x="490" y="572.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">meals might reflect choice, not poverty</text><circle cx="477" cy="595.9200000000001" r="4.5" fill="#2e6b62"/><text x="490" y="601.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Figures refer to 1968–69, not today</text>
</svg>