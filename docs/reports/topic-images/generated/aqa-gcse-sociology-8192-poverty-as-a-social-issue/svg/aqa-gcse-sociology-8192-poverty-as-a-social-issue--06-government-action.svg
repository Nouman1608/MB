<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 779" width="900" height="779" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="779" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How governments have tackled poverty</text>

<line x1="40" y1="170" x2="868" y2="170" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><circle cx="110" cy="170" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="110" y="146" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">1942</text><text x="110" y="208" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Beveridge Report: five</text><text x="110" y="229" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">giants (Want, Disease,</text><text x="110" y="250" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Ignorance, Squalor,</text><text x="110" y="271" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Idleness)</text><circle cx="300" cy="170" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="300" y="146" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">1948</text><text x="300" y="208" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">NHS; post-war welfare</text><text x="300" y="229" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">state</text><circle cx="520" cy="170" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="520" y="146" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">1999</text><text x="520" y="208" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">National minimum wage</text><circle cx="740" cy="170" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="740" y="146" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">2013</text><text x="740" y="208" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Universal Credit begins</text><rect x="30" y="336" width="404" height="230" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,386 L31.25,350.25 Q31.25,337.25 44.25,337.25 L419.75,337.25 Q432.75,337.25 432.75,350.25 L432.75,386 Z" fill="#b5d3cf"/><line x1="31.25" y1="386" x2="432.75" y2="386" stroke="#c9d6d4" stroke-width="2"/><text x="232" y="367" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Universal benefits</text><rect x="466" y="336" width="404" height="230" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M467.25,386 L467.25,350.25 Q467.25,337.25 480.25,337.25 L855.75,337.25 Q868.75,337.25 868.75,350.25 L868.75,386 Z" fill="#f2e7b8"/><line x1="467.25" y1="386" x2="868.75" y2="386" stroke="#c9d6d4" stroke-width="2"/><text x="668" y="367" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Selective benefits</text><circle cx="55" cy="414.72" r="4.5" fill="#2e6b62"/><text x="68" y="420" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Go to everyone in a group, whatever their</text><text x="68" y="441" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">income</text><circle cx="55" cy="464.72" r="4.5" fill="#2e6b62"/><text x="68" y="470" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">+</tspan> Avoid stigma</text><circle cx="55" cy="493.72" r="4.5" fill="#2e6b62"/><text x="68" y="499" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">–</tspan> Cost more</text><circle cx="491" cy="414.72" r="4.5" fill="#2e6b62"/><text x="504" y="420" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Means tested</tspan>: targeted at low incomes</text><circle cx="491" cy="443.72" r="4.5" fill="#2e6b62"/><text x="504" y="449" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">+</tspan> Cost less</text><circle cx="491" cy="472.72" r="4.5" fill="#2e6b62"/><text x="504" y="478" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">–</tspan> Can create a <tspan font-weight="700">poverty trap</tspan>: earning more</text><text x="504" y="499" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">means losing benefits</text><rect x="30" y="584" width="840" height="171" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="620" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Evaluation</text><circle cx="61" cy="643.39" r="4.5" fill="#8a6d0d"/><text x="74" y="649" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Supporters: these measures stopped absolute poverty for most people</text><circle cx="61" cy="673.39" r="4.5" fill="#8a6d0d"/><text x="74" y="679" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Material deprivation critics: low benefits and wages still leave many in relative poverty</text><circle cx="61" cy="703.39" r="4.5" fill="#8a6d0d"/><text x="74" y="709" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">New Right critics: welfare creates dependency; they support conditions such as looking for</text><text x="74" y="731" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">work</text>
</svg>