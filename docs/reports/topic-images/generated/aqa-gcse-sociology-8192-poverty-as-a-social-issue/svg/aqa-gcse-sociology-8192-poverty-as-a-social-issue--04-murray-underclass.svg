<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 925" width="900" height="925" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="925" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Murray: the underclass and the New Right</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Losing Ground (1984); visited Britain at the end of the 1980s</text>
<rect x="30" y="120" width="840" height="95" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="67" cy="167.5" r="21" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="67" y="175.06" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="104" y="159.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Higher benefits</text><text x="104" y="188.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Government policies encourage dependence on benefits</text><line x1="450" y1="219" x2="450" y2="255" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="261" width="840" height="95" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="67" cy="308.5" r="21" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="67" y="316.06" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="104" y="300.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Self-sufficiency discouraged</text><text x="104" y="329.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">More single parents and young people lose interest in jobs</text><line x1="450" y1="360" x2="450" y2="396" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="402" width="840" height="116" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="67" cy="460" r="21" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="67" y="467.56" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="104" y="441.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">A growing underclass</text><text x="104" y="470.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">An alternative value system that tolerates crime and anti-social behaviour replaces honesty,</text><text x="104" y="491.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">family life and hard work</text><line x1="450" y1="522" x2="450" y2="558" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="564" width="840" height="116" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="67" cy="622" r="21" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="67" y="629.56" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="104" y="603.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Seen as a burden</text><text x="104" y="632.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">On taxpayers, and responsible for rising crime; in Britain he pointed to rising illegitimacy,</text><text x="104" y="653.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">crime and some young people’s unwillingness to seek work</text><rect x="30" y="698" width="840" height="201" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="734" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Evaluation</text><circle cx="61" cy="757.39" r="4.5" fill="#8a6d0d"/><text x="74" y="763" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Ignores economic reasons for the underclass</text><circle cx="61" cy="787.39" r="4.5" fill="#8a6d0d"/><text x="74" y="793" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Research suggests benefits do not have the effect he claims</text><circle cx="61" cy="817.39" r="4.5" fill="#8a6d0d"/><text x="74" y="823" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Many labelled “underclass” hold conventional attitudes and want stable relationships and</text><text x="74" y="845" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">paid work</text><circle cx="61" cy="869.39" r="4.5" fill="#8a6d0d"/><text x="74" y="875" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Viewed sympathetically: victims of inequality, not its cause</text>
</svg>