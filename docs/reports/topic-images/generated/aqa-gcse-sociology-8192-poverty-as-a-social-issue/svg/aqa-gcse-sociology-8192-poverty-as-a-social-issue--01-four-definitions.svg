<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 535" width="900" height="535" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="535" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four ways to define poverty</text>

<rect x="30" y="104" width="412" height="207" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,154 L31.25,118.25 Q31.25,105.25 44.25,105.25 L427.75,105.25 Q440.75,105.25 440.75,118.25 L440.75,154 Z" fill="#b5d3cf"/><line x1="31.25" y1="154" x2="440.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="134.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Absolute</text><text x="46" y="187.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Lacking basic necessities for survival:</text><text x="46" y="208.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">food, water, shelter, clothing</text><circle cx="51" cy="231.92" r="4.5" fill="#2e6b62"/><text x="64" y="237.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">+</tspan> Easy to compare across time and place</text><circle cx="51" cy="260.92" r="4.5" fill="#2e6b62"/><text x="64" y="266.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">–</tspan> Ignores what is normal in a society</text><rect x="458" y="104" width="412" height="207" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,154 L459.25,118.25 Q459.25,105.25 472.25,105.25 L855.75,105.25 Q868.75,105.25 868.75,118.25 L868.75,154 Z" fill="#dce9e7"/><line x1="459.25" y1="154" x2="868.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="134.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Relative</text><text x="474" y="187.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Falling well below the usual standard of</text><text x="474" y="208.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">living in your society</text><circle cx="479" cy="231.92" r="4.5" fill="#2e6b62"/><text x="492" y="237.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Changes as society becomes richer</text><circle cx="479" cy="260.92" r="4.5" fill="#2e6b62"/><text x="492" y="266.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Can never be fully abolished on this</text><text x="492" y="287.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">definition</text><rect x="30" y="327" width="412" height="178" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,377 L31.25,341.25 Q31.25,328.25 44.25,328.25 L427.75,328.25 Q440.75,328.25 440.75,341.25 L440.75,377 Z" fill="#f2e7b8"/><line x1="31.25" y1="377" x2="440.75" y2="377" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="357.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Subjective</text><text x="46" y="410.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Whether people see themselves as poor</text><circle cx="51" cy="433.92" r="4.5" fill="#2e6b62"/><text x="64" y="439.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">+</tspan> Captures experience</text><circle cx="51" cy="462.92" r="4.5" fill="#2e6b62"/><text x="64" y="468.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">–</tspan> People judge by different standards</text><rect x="458" y="327" width="412" height="178" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,377 L459.25,341.25 Q459.25,328.25 472.25,328.25 L855.75,328.25 Q868.75,328.25 868.75,341.25 L868.75,377 Z" fill="#dce9e7"/><line x1="459.25" y1="377" x2="868.75" y2="377" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="357.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Environmental</text><text x="474" y="410.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Living in a poor local environment: poor</text><text x="474" y="431.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">housing, few amenities, unsafe streets</text><circle cx="479" cy="454.92" r="4.5" fill="#2e6b62"/><text x="492" y="460.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Shows poverty is about place as well as</text><text x="492" y="481.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">income</text>
</svg>