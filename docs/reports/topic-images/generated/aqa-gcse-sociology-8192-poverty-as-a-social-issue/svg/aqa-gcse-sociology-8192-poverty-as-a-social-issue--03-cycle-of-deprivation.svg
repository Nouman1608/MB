<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 695" width="900" height="695" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="695" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The culture of poverty</text>

<line x1="580" y1="200" x2="700" y2="270" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="700" y1="392" x2="580" y2="460" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="320" y1="460" x2="200" y2="392" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="200" y1="270" x2="320" y2="200" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="315" y="125" width="270" height="100" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="161" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Living in poverty</text><text x="450" y="189" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="middle">values form in response to the</text><text x="450" y="209" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="middle">situation</text><rect x="605" y="280" width="270" height="100" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="740" y="316" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Distinct values develop</text><text x="740" y="344" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="middle">fatalism, living for the</text><text x="740" y="364" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="middle">present, not belonging</text><rect x="315" y="435" width="270" height="100" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="471" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Passed to children</text><text x="450" y="499" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="middle">through socialisation</text><rect x="25" y="280" width="270" height="100" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="160" y="316" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Next generation</text><text x="160" y="344" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="middle">stays in poverty</text><text x="450" y="322" font-size="18" font-weight="400" fill="#4a5568" text-anchor="middle">cycle of</text><text x="450" y="348" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">deprivation</text><rect x="30" y="560" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="596" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The culture of poverty (Oscar Lewis)</text><text x="56" y="625" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Poor people develop a distinct set of values in response to their situation, so poverty</text><text x="56" y="647" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">continues across generations. The explanation blames values, not lack of money.</text>
</svg>