<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 610" width="900" height="610" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="610" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Two competing explanations</text>

<rect x="30" y="104" width="404" height="351" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,154 L31.25,118.25 Q31.25,105.25 44.25,105.25 L419.75,105.25 Q432.75,105.25 432.75,118.25 L432.75,154 Z" fill="#f2e7b8"/><line x1="31.25" y1="154" x2="432.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="232" y="134.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Culture of poverty</text><text x="48" y="190.4" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">Blames values passed between generations</text><circle cx="53" cy="215.79" r="4.5" fill="#2e6b62"/><text x="66" y="221.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Fatalism, living for the present</text><circle cx="53" cy="245.79" r="4.5" fill="#2e6b62"/><text x="66" y="251.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Murray: welfare dependency</text><circle cx="53" cy="275.78999999999996" r="4.5" fill="#2e6b62"/><text x="66" y="281.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">New Right: lower benefits, stricter</text><text x="66" y="303.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">conditions, self-reliance</text><circle cx="53" cy="327.78999999999996" r="4.5" fill="#2e6b62"/><text x="66" y="333.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Key terms: <tspan font-weight="700">culture of dependency</tspan>, <tspan font-weight="700">welfare</tspan></text><text x="66" y="355.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">scrounger</tspan></text><rect x="466" y="104" width="404" height="351" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M467.25,154 L467.25,118.25 Q467.25,105.25 480.25,105.25 L855.75,105.25 Q868.75,105.25 868.75,118.25 L868.75,154 Z" fill="#b5d3cf"/><line x1="467.25" y1="154" x2="868.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="668" y="134.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Material deprivation</text><text x="484" y="190.4" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">Blames lack of money and resources</text><circle cx="489" cy="215.79" r="4.5" fill="#8a6d0d"/><text x="502" y="221.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Low pay</tspan> and insecure work (zero-hours</text><text x="502" y="243.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">contracts)</text><circle cx="489" cy="267.78999999999996" r="4.5" fill="#8a6d0d"/><text x="502" y="273.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Unemployment</tspan> and under-employment</text><circle cx="489" cy="297.78999999999996" r="4.5" fill="#8a6d0d"/><text x="502" y="303.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Benefits set too low; <tspan font-weight="700">high housing costs</tspan></text><circle cx="489" cy="327.78999999999996" r="4.5" fill="#8a6d0d"/><text x="502" y="333.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Extra costs of disability; lost earnings</text><text x="502" y="355.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">of caring</text><circle cx="489" cy="379.78999999999996" r="4.5" fill="#8a6d0d"/><text x="502" y="385.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Any “culture” is a sensible response:</text><text x="502" y="407.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">give decent jobs and incomes, and values</text><text x="502" y="429.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">change</text><circle cx="450" cy="279.5" r="24" fill="#1e2a44"/><text x="450" y="286.5" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">vs</text><rect x="30" y="473" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="509" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Evidence for material deprivation</text><text x="56" y="538" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Townsend: poverty is exclusion from normal life, caused by lack of resources rather than</text><text x="56" y="560" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">values.</text>
</svg>