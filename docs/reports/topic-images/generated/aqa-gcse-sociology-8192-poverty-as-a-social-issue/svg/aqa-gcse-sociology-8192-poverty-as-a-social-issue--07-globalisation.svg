<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 759" width="900" height="759" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="759" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Globalisation and poverty</text>

<rect x="250" y="112" width="400" height="84" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="146" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">A town where several generations of a</text><text x="450" y="170" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">family have not worked</text><line x1="370" y1="200" x2="230" y2="248" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="530" y1="200" x2="670" y2="248" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="254" width="400" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,304 L31.25,268.25 Q31.25,255.25 44.25,255.25 L415.75,255.25 Q428.75,255.25 428.75,268.25 L428.75,304 Z" fill="#f2e7b8"/><line x1="31.25" y1="304" x2="428.75" y2="304" stroke="#c9d6d4" stroke-width="2"/><text x="230" y="285" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Murray’s reading</text><text x="44" y="336.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Generous benefits created an underclass with</text><text x="44" y="358.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">values that reject work</text><rect x="470" y="254" width="400" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M471.25,304 L471.25,268.25 Q471.25,255.25 484.25,255.25 L855.75,255.25 Q868.75,255.25 868.75,268.25 L868.75,304 Z" fill="#b5d3cf"/><line x1="471.25" y1="304" x2="868.75" y2="304" stroke="#c9d6d4" stroke-width="2"/><text x="670" y="285" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Structural reading</text><text x="484" y="336.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The main employer closed when production</text><text x="484" y="358.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">moved abroad: material deprivation linked to</text><text x="484" y="380.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">globalisation</text><text x="450" y="434" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Globalisation: the growing interconnection of economies and cultures</text><rect x="30" y="452" width="412" height="205" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,502 L31.25,466.25 Q31.25,453.25 44.25,453.25 L427.75,453.25 Q440.75,453.25 440.75,466.25 L440.75,502 Z" fill="#dce9e7"/><line x1="31.25" y1="502" x2="440.75" y2="502" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="482.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Negative impacts</text><circle cx="49" cy="527.9200000000001" r="4.5" fill="#2e6b62"/><text x="62" y="533.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Manufacturing jobs moved to lower-wage</text><text x="62" y="554.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">countries: unemployment in former industrial</text><text x="62" y="575.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">areas</text><circle cx="49" cy="598.9200000000001" r="4.5" fill="#2e6b62"/><text x="62" y="604.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Competition can keep wages down</text><circle cx="49" cy="627.9200000000001" r="4.5" fill="#2e6b62"/><text x="62" y="633.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Less secure work</text><rect x="458" y="452" width="412" height="205" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,502 L459.25,466.25 Q459.25,453.25 472.25,453.25 L855.75,453.25 Q868.75,453.25 868.75,466.25 L868.75,502 Z" fill="#dce9e7"/><line x1="459.25" y1="502" x2="868.75" y2="502" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="482.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Positive impacts</text><circle cx="477" cy="527.9200000000001" r="4.5" fill="#2e6b62"/><text x="490" y="533.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Cheaper goods lower the cost of living</text><circle cx="477" cy="556.9200000000001" r="4.5" fill="#2e6b62"/><text x="490" y="562.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">New jobs in services and technology</text><circle cx="477" cy="585.9200000000001" r="4.5" fill="#2e6b62"/><text x="490" y="591.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">More trade and investment</text><rect x="30" y="675" width="840" height="60" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="711" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">People in former industrial towns did not lose their work ethic; their jobs left.</text>
</svg>