<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 576" width="900" height="576" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="576" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Each source has a role</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Worked example 1: should the car park become a green square?</text>
<circle cx="60" cy="167" r="26" fill="#dce9e7" stroke="#2e6b62" stroke-width="3"/><text x="60" y="176" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">A</text><rect x="100" y="122" width="400" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="114" y="159.48" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Council survey of 800 residents</text><text x="114" y="185.07" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">62% want green space; 21% parking</text><line x1="504" y1="167" x2="540" y2="167" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><rect x="546" y="122" width="324" height="90" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="560" y="159.48" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start" xml:space="preserve">SUPPORTS</text><text x="560" y="185.07" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">residents want it</text><line x1="60" y1="194" x2="60" y2="230" stroke="#c9d6d4" stroke-width="3"/><circle cx="60" cy="275" r="26" fill="#f6e3d8" stroke="#b5602e" stroke-width="3"/><text x="60" y="284" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">B</text><rect x="100" y="230" width="400" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="114" y="267.48" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Shopkeeper’s letter</text><text x="114" y="293.07" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">village visitors spend about £40 each</text><line x1="504" y1="275" x2="540" y2="275" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><rect x="546" y="230" width="324" height="90" rx="14" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5" /><text x="560" y="267.48" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start" xml:space="preserve">QUALIFIES A</text><text x="560" y="293.07" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">the survey asks residents, not visitors</text><line x1="60" y1="302" x2="60" y2="338" stroke="#c9d6d4" stroke-width="3"/><circle cx="60" cy="383" r="26" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="3"/><text x="60" y="392" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">C</text><rect x="100" y="338" width="400" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="114" y="375.48" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Planner’s article</text><text x="114" y="401.07" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">placement of seating and signs mattered more</text><line x1="504" y1="383" x2="540" y2="383" stroke="#8a6d0d" stroke-width="3" marker-end="url(#ahO)"/><rect x="546" y="338" width="324" height="90" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="560" y="375.48" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="start" xml:space="preserve">EXTENDS B</text><text x="560" y="401.07" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">and supplies a remedy</text><rect x="30" y="450" width="840" height="83.51999999999998" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="3" /><text x="48" y="484" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Claim (qualified)</text><text x="48" y="512" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“The town should therefore build the square, but plan its layout around the shops that need the trade.”</text>
</svg>