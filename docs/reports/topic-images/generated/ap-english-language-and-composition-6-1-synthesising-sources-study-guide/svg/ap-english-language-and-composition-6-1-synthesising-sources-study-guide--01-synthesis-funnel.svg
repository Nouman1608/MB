<rect width="900" height="610" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What synthesis does</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Draw on several sources, select strategically, combine into your own argument</text>
<rect x="60" y="122" width="220" height="120" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" /><text x="170" y="148" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Source A</text><rect x="80" y="162" width="150" height="8" rx="3" fill="#c9d6d4"/><rect x="80" y="177" width="150" height="8" rx="3" fill="#d4b02e"/><rect x="80" y="192" width="180" height="8" rx="3" fill="#c9d6d4"/><rect x="80" y="207" width="150" height="8" rx="3" fill="#d4b02e"/><rect x="80" y="222" width="150" height="8" rx="3" fill="#c9d6d4"/><rect x="340" y="122" width="220" height="120" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" /><text x="450" y="148" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Source B</text><rect x="360" y="162" width="150" height="8" rx="3" fill="#c9d6d4"/><rect x="360" y="177" width="150" height="8" rx="3" fill="#c9d6d4"/><rect x="360" y="192" width="180" height="8" rx="3" fill="#d4b02e"/><rect x="360" y="207" width="150" height="8" rx="3" fill="#c9d6d4"/><rect x="360" y="222" width="150" height="8" rx="3" fill="#d4b02e"/><rect x="620" y="122" width="220" height="120" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" /><text x="730" y="148" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Source C</text><rect x="640" y="162" width="150" height="8" rx="3" fill="#d4b02e"/><rect x="640" y="177" width="150" height="8" rx="3" fill="#c9d6d4"/><rect x="640" y="192" width="180" height="8" rx="3" fill="#c9d6d4"/><rect x="640" y="207" width="150" height="8" rx="3" fill="#d4b02e"/><rect x="640" y="222" width="150" height="8" rx="3" fill="#c9d6d4"/><path d="M40,272 L860,272 L560,412 L340,412 Z" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="312" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">strategically select the most relevant</text><text x="450" y="340" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="middle" xml:space="preserve">information (the highlighted lines)</text><text x="450" y="382" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">combine apt, specific material</text><line x1="450" y1="414" x2="450" y2="446" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="220" y="452" width="460" height="84" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3" /><text x="450" y="486" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Your own argument</text><text x="450" y="514.85" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">sources serve your claim</text><text x="450" y="568" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" xml:space="preserve">Some sources are more reliable or credible than others: weigh quality as well as content.</text>
</svg>