<rect x="30" y="96" width="412" height="190" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="48" y="128" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Agreement</text><rect x="200" y="146" width="70" height="40" rx="8" fill="#dce9e7" stroke="#1e2a44" stroke-width="2" /><text x="235" y="172" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">A</text><rect x="350" y="146" width="70" height="40" rx="8" fill="#dce9e7" stroke="#1e2a44" stroke-width="2" /><text x="385" y="172" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">C</text><line x1="235" y1="188" x2="300" y2="216" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><line x1="385" y1="188" x2="320" y2="216" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><circle cx="310" cy="224" r="10" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="48" y="246" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic" xml:space="preserve">“Both the survey and the planner suggest...”</text><rect x="458" y="96" width="412" height="190" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="476" y="128" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Extension</text><rect x="628" y="156" width="90" height="40" rx="8" fill="#dce9e7" stroke="#1e2a44" stroke-width="2" /><text x="673" y="182" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">B</text><rect x="718" y="156" width="130" height="40" rx="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2" /><text x="783" y="182" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">C adds</text><text x="476" y="246" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic" xml:space="preserve">“The planner goes further, showing that...”</text><rect x="30" y="302" width="412" height="190" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="48" y="334" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Qualification</text><rect x="200" y="362" width="220" height="40" rx="8" fill="#dce9e7" stroke="#1e2a44" stroke-width="2" /><text x="270" y="388" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">A</text><rect x="340" y="362" width="80" height="40" rx="8" fill="#f6e3d8" stroke="#b5602e" stroke-width="2" stroke-dasharray="5 4"/><text x="380" y="388" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle" xml:space="preserve">B limits</text><text x="48" y="452" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic" xml:space="preserve">“The survey’s 62% should not hide...”</text><rect x="458" y="302" width="412" height="190" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="476" y="334" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Conflict</text><rect x="628" y="362" width="80" height="40" rx="8" fill="#dce9e7" stroke="#1e2a44" stroke-width="2" /><text x="668" y="388" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">A</text><rect x="768" y="362" width="80" height="40" rx="8" fill="#f6e3d8" stroke="#1e2a44" stroke-width="2" /><text x="808" y="388" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">B</text><text x="738" y="389" font-size="20" font-weight="700" fill="#b5602e" text-anchor="middle" xml:space="preserve">⟷</text><text x="476" y="452" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic" xml:space="preserve">explain why they disagree, or choose between</text><text x="476" y="471.8" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic" xml:space="preserve">them</text><text x="450" y="522" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" xml:space="preserve">Strong synthesis often uses more than one move in a paragraph.</text>
