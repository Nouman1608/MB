<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 566" width="900" height="566" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="566" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Bringing source material in</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Using the fictional shopkeeper and planner</text>
<rect x="30" y="122" width="245" height="87.35999999999999" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5" /><text x="42" y="148.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Quotation</text><text x="42" y="174.51" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">when the exact words matter</text><text x="42" y="194.31" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">or add force</text><rect x="290" y="122" width="580" height="87.35999999999999" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="304" y="170.72" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">A shopkeeper warns that “trees don’t buy bread”</text><rect x="30" y="219.35999999999999" width="245" height="87.36000000000004" rx="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5" /><text x="42" y="245.76" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Paraphrase</text><text x="42" y="271.87" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">to restate a specific point in</text><text x="42" y="291.67" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">your own words</text><rect x="290" y="219.35999999999999" width="580" height="87.36000000000004" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="304" y="257.52000000000004" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">The shopkeeper argues that the car park brings in customers who</text><text x="304" y="278.64000000000004" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">spend about £40 each</text><rect x="30" y="316.72" width="245" height="67.56" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" /><text x="42" y="343.12" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Summary</text><text x="42" y="369.23" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">to compress a long passage</text><rect x="290" y="316.72" width="580" height="67.56" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="304" y="344.98" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">The planner’s article describes a northern town’s conversion and its</text><text x="304" y="366.1" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">uneven results</text><text x="30" y="410.28000000000003" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Always attribute and comment. Signal verbs say how you use the source:</text><rect x="30" y="426.28000000000003" width="66.03379" height="35" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2" /><text x="63.016895" y="449.73" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">notes</text><rect x="110.03379" y="426.28000000000003" width="70.34125" height="35" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2" /><text x="145.20441499999998" y="449.73" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">warns</text><rect x="194.37504" y="426.28000000000003" width="101.22889" height="35" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2" /><text x="244.989485" y="449.73" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">concedes</text><rect x="309.60393" y="426.28000000000003" width="76.96003" height="35" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2" /><text x="348.08394499999997" y="449.73" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">argues</text><rect x="400.56396" y="426.28000000000003" width="96.55372" height="35" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2" /><text x="448.84082" y="449.73" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">observes</text><rect x="511.11768" y="426.28000000000003" width="95.48561000000001" height="35" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2" /><text x="558.860485" y="449.73" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">suggests</text><rect x="30" y="479.28000000000003" width="840" height="74.23999999999995" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="7 5"/><text x="450" y="510.88000000000005" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve"><tspan font-weight="700" fill="#b5602e">Dropped</tspan> <tspan font-weight="700" fill="#b5602e">quote:</tspan> a quotation with no introduction or explanation is weaker than one that is introduced</text><text x="450" y="532" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">and explained.</text>
</svg>