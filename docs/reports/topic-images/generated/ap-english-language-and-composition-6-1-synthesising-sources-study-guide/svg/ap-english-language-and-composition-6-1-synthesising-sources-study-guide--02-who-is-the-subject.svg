<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 891" width="900" height="891" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="891" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Who is the subject of the sentence?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Summary puts the source first; synthesis puts the idea first</text>
<text x="30" y="134" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start" xml:space="preserve">Source-by-source summary</text><rect x="30" y="148" width="138.98045000000002" height="35" rx="8" fill="#f6e3d8" stroke="#1e2a44" stroke-width="2" /><text x="99.49022500000001" y="171.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Source A says</text><rect x="174.98045000000002" y="148" width="384.50567" height="35" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2" /><text x="367.233285" y="171.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">that most residents want more green space.</text><rect x="30" y="191" width="138.35009000000002" height="35" rx="8" fill="#f6e3d8" stroke="#1e2a44" stroke-width="2" /><text x="99.17504500000001" y="214.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Source B says</text><rect x="174.35009000000002" y="191" width="282.59747000000004" height="35" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2" /><text x="315.64882500000004" y="214.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">that shopkeepers need parking.</text><rect x="30" y="234" width="139.68085" height="35" rx="8" fill="#f6e3d8" stroke="#1e2a44" stroke-width="2" /><text x="99.840425" y="257.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Source C says</text><rect x="175.68085" y="234" width="373.24674" height="35" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2" /><text x="362.30422" y="257.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">that a town in the north had a mixed result.</text><text x="30" y="299" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start" xml:space="preserve">Synthesis</text><rect x="30" y="315" width="538.9438700000001" height="35" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2" /><text x="299.47193500000003" y="338.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Whether a town centre should turn a car park into green space</text><text x="299.47193500000003" y="371.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">subject: the issue</text><rect x="30" y="400.3" width="374.98023" height="35" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2" /><text x="217.490115" y="423.75" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">depends less on whether residents want it,</text><rect x="410.98023" y="400.3" width="295.13463" height="35" rx="8" fill="#dce9e7" stroke="#1e2a44" stroke-width="2" /><text x="558.547545" y="423.75" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">as the council’s survey suggests,</text><text x="558.547545" y="456.8" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">source as evidence</text><rect x="30" y="485.6" width="537.89327" height="35" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2" /><text x="298.946635" y="509.05" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">than on whether the change is planned with the shops in mind,</text><rect x="30" y="542.6" width="609.1764800000001" height="35" rx="8" fill="#dce9e7" stroke="#1e2a44" stroke-width="2" /><text x="334.58824000000004" y="566.0500000000001" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">as both a local shopkeeper’s warning and a planner’s case study imply.</text><text x="334.58824000000004" y="599.1" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">two sources, one purpose</text><rect x="30" y="631.9" width="840" height="41.8" fill="#dce9e7"/><text x="42" y="656.1999999999999" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Feature</text><text x="282" y="656.1999999999999" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Summary</text><text x="582" y="656.1999999999999" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Synthesis</text><rect x="30" y="673.6999999999999" width="840" height="41.8" fill="#ffffff"/><text x="42" y="697.9999999999999" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Organising principle</text><text x="282" y="697.9999999999999" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">the sources, one after another</text><rect x="570" y="673.6999999999999" width="300" height="41.8" fill="#dce9e7"/><text x="582" y="697.9999999999999" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">the writer’s idea</text><line x1="30" y1="673.6999999999999" x2="870" y2="673.6999999999999" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="715.4999999999999" width="840" height="61.6" fill="#ffffff"/><text x="42" y="739.7999999999998" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Relationship</text><text x="282" y="739.7999999999998" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">none stated</text><rect x="570" y="715.4999999999999" width="300" height="61.6" fill="#dce9e7"/><text x="582" y="739.7999999999998" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">agreement, extension, qualification or</text><text x="582" y="759.5999999999998" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">conflict</text><line x1="30" y1="715.4999999999999" x2="870" y2="715.4999999999999" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="777.0999999999999" width="840" height="41.8" fill="#ffffff"/><text x="42" y="801.3999999999999" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Commentary</text><text x="282" y="801.3999999999999" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">little or none</text><rect x="570" y="777.0999999999999" width="300" height="41.8" fill="#dce9e7"/><text x="582" y="801.3999999999999" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">what the sources show together</text><line x1="30" y1="777.0999999999999" x2="870" y2="777.0999999999999" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="818.8999999999999" width="840" height="41.8" fill="#ffffff"/><text x="42" y="843.1999999999998" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Selection</text><text x="282" y="843.1999999999998" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">everything</text><rect x="570" y="818.8999999999999" width="300" height="41.8" fill="#dce9e7"/><text x="582" y="843.1999999999998" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">only what is relevant</text><line x1="30" y1="818.8999999999999" x2="870" y2="818.8999999999999" stroke="#c9d6d4" stroke-width="1.5"/><line x1="270" y1="631.9" x2="270" y2="860.6999999999998" stroke="#c9d6d4" stroke-width="1.5"/><line x1="570" y1="631.9" x2="570" y2="860.6999999999998" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="631.9" width="840" height="228.79999999999984" rx="12" fill="none" stroke="#1e2a44" stroke-width="2.5" />
</svg>