<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 690" width="900" height="690" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="690" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Measuring crime and the dark figure</text>

<rect x="50" y="110" width="800" height="52" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="68" y="143" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">All crime committed</text><text x="834" y="143" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="end">Self-report studies ask offenders</text><rect x="120" y="174" width="660" height="52" rx="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="138" y="207" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Crime victims know about</text><text x="764" y="207" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="end">Victim surveys ask victims</text><rect x="190" y="238" width="520" height="52" rx="10" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="208" y="271" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Crime reported to the police</text><rect x="260" y="302" width="380" height="52" rx="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="278" y="335" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Crime recorded by the police</text><text x="654" y="335" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">Official statistics</text><text x="450" y="382" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">The gap between all crime and recorded crime is the dark figure</text><rect x="30" y="402" width="411" height="130" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="437.2" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">Why unreported</text><text x="50" y="465.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Seems trivial; fear of revenge; no trust in</text><text x="50" y="486.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">police; shame; victim does not know (some</text><text x="50" y="507.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">fraud)</text><rect x="459" y="402" width="411" height="130" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="479" y="437.2" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">Why unrecorded</text><text x="479" y="465.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Police decide it is not a crime, lack</text><text x="479" y="486.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">evidence, or deal with it informally</text><rect x="30" y="548" width="840" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="584" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Socially constructed</text><text x="50" y="613.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Cicourel (1968): officials’ stereotypes of “typical delinquents” shaped who was arrested</text><text x="50" y="635.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">and charged, so statistics show policing as well as offending.</text>
</svg>