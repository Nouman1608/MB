<rect width="900" height="612" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Informal control and Hirschi’s bonds</text>

<rect x="30" y="104" width="200" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="42" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Agency</text><rect x="230" y="104" width="640" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="242" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Positive and negative sanctions</text><rect x="30" y="150" width="200" height="43" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="175.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Family</text><rect x="230" y="150" width="640" height="43" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="242" y="175.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Rewards, punishments, curfews, supervision</text><rect x="30" y="193" width="200" height="43" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="218.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Education</text><rect x="230" y="193" width="640" height="43" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="242" y="218.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Praise, rules, detentions, the hidden curriculum</text><rect x="30" y="236" width="200" height="43" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="261.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Workplace</text><rect x="230" y="236" width="640" height="43" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="242" y="261.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Promotion; warnings or dismissal; colleagues’ expectations</text><rect x="30" y="279" width="200" height="43" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="304.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Peer group</text><rect x="230" y="279" width="640" height="43" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="242" y="304.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Acceptance or ridicule</text><rect x="30" y="322" width="200" height="43" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="347.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Media</text><rect x="230" y="322" width="640" height="43" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="242" y="347.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">News shapes right and wrong; online call-outs and shaming</text><rect x="30" y="365" width="200" height="43" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="390.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Religion</text><rect x="230" y="365" width="640" height="43" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="242" y="390.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Teachings on sin; community approval; reward or punishment after death</text><text x="450" y="446" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="middle">Hirschi (1969): strong bonds mean more to lose by offending</text><rect x="30" y="472" width="199.5" height="110" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="129.75" y="508" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Attachment</text><text x="129.75" y="536.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">to others</text><rect x="243.5" y="472" width="199.5" height="110" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="343.25" y="508" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Commitment</text><text x="343.25" y="536.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">to goals such as a</text><text x="343.25" y="557.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">career</text><rect x="457" y="472" width="199.5" height="110" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="556.75" y="508" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Involvement</text><text x="556.75" y="536.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">in conventional</text><text x="556.75" y="557.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">activities</text><rect x="670.5" y="472" width="199.5" height="110" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="770.25" y="508" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Belief</text><text x="770.25" y="536.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">in rules</text>
</svg>