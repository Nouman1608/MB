<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="520" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Relativity: four dimensions</text>

<rect x="30" y="104" width="411" height="136" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="137" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">BETWEEN SOCIETIES</text><text x="50" y="164" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Drinking alcohol</text><text x="50" y="193.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Legal in many countries, banned in others</text><rect x="459" y="104" width="411" height="136" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="479" y="137" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">WITHIN A SOCIETY, BETWEEN CULTURES</text><text x="479" y="164" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Dress, diet, celebration</text><text x="479" y="193.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Normal in one community, frowned on in</text><text x="479" y="215.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">another</text><rect x="30" y="256" width="411" height="136" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="289" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">SITUATIONS</text><text x="50" y="316" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Killing</text><text x="50" y="345.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Murder in a street fight; may be lawful in</text><text x="50" y="367.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">self-defence or by a soldier in war</text><rect x="459" y="256" width="411" height="136" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="479" y="289" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ACROSS TIME</text><text x="479" y="316" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Smoking indoors in public</text><text x="479" y="345.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Once normal in many countries, now banned</text><text x="479" y="367.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">in many</text><rect x="30" y="410" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="443.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Crime and deviance are socially constructed: people with the power to make rules decide</text><text x="50" y="465.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">what counts. Labelling theory (6.2) develops this.</text>
</svg>