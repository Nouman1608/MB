<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Eleven types of crime</text>

<rect x="30" y="104" width="272" height="118" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="44" y="132.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Violent</text><text x="44" y="160" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Assault, robbery</text><rect x="314" y="104" width="272" height="118" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="328" y="132.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Property</text><text x="328" y="160" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Burglary, shoplifting,</text><text x="328" y="180" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">vandalism</text><rect x="598" y="104" width="272" height="118" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="612" y="132.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">White-collar /</text><text x="612" y="156.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">corporate</text><text x="612" y="184" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Fraud, tax evasion, ignoring</text><text x="612" y="204" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">safety laws</text><rect x="30" y="234" width="272" height="94" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="44" y="262.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Expressive</text><text x="44" y="290" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Emotion or thrill: fighting for</text><text x="44" y="310" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">excitement</text><rect x="314" y="234" width="272" height="94" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="328" y="262.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Instrumental</text><text x="328" y="290" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">For a goal, usually money:</text><text x="328" y="310" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">theft</text><rect x="598" y="234" width="272" height="94" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="612" y="262.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Gang</text><text x="612" y="290" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Territorial violence, drug</text><text x="612" y="310" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">dealing</text><rect x="30" y="340" width="272" height="94" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="44" y="368.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Green</text><text x="44" y="396" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Illegal logging, toxic dumping,</text><text x="44" y="416" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">wildlife trafficking</text><rect x="314" y="340" width="272" height="94" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="328" y="368.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Global / organised</text><text x="328" y="396" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Drug and people trafficking,</text><text x="328" y="416" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">money laundering</text><rect x="598" y="340" width="272" height="94" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="612" y="368.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Cyber</text><text x="612" y="396" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Hacking, phishing, ransomware</text><rect x="30" y="446" width="272" height="94" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="44" y="474.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Hate</text><text x="44" y="502" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Attacks because of ethnicity or</text><text x="44" y="522" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">religion</text><rect x="314" y="446" width="272" height="94" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="328" y="474.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Domestic</text><text x="328" y="502" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Domestic violence and abuse</text><rect x="598" y="446" width="272" height="94" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="612" y="474.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Types overlap</text><text x="612" y="502" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">A gang robbery is gang, violent</text><text x="612" y="522" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">and instrumental</text>
</svg>