<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 684" width="900" height="684" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="684" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Crime and deviance overlap</text>

<circle cx="330" cy="320" r="200" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="3"/><circle cx="570" cy="320" r="200" fill="#dce9e7" stroke="#2e6b62" stroke-width="3" fill-opacity="0.65"/><circle cx="330" cy="320" r="200" fill="none" stroke="#8a6d0d" stroke-width="3"/><text x="262" y="210" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="middle">DEVIANCE</text><text x="262" y="234" font-size="15" font-weight="400" fill="#8a6d0d" text-anchor="middle">breaks norms; draws</text><text x="262" y="254" font-size="15" font-weight="400" fill="#8a6d0d" text-anchor="middle">disapproval</text><text x="638" y="210" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">CRIME</text><text x="638" y="234" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="middle">breaks criminal</text><text x="638" y="254" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="middle">law; punishable by</text><text x="638" y="274" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="middle">the state</text><text x="255" y="320" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Talking loudly</text><text x="255" y="342" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">in a library</text><text x="255" y="382" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">deviant, not criminal</text><text x="450" y="325" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Most crimes</text><text x="645" y="320" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Minor speeding</text><text x="645" y="342" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">in some places</text><text x="645" y="382" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">criminal, barely deviant</text><rect x="30" y="542" width="840" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="578" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Not all deviance is bad</text><text x="50" y="607.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Deviance can be positive: unusual bravery or self-sacrifice departs from the norm but is</text><text x="50" y="629.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">admired.</text>
</svg>