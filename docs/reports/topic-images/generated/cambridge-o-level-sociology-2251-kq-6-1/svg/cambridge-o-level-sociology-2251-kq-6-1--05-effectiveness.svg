<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 508" width="900" height="508" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="508" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How effective is social control?</text>

<rect x="30" y="104" width="408" height="222" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="140.8" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="start">Formal control</text><text x="50" y="171.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">+ Backed by law and force</text><text x="50" y="198.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">+ Deals with serious and organised crime</text><text x="50" y="225.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">+ Clear, consistent rules</text><text x="50" y="252.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">− Most crime never detected</text><text x="50" y="279.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">− Can be applied unfairly; expensive; may</text><text x="50" y="301.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">label people</text><rect x="462" y="104" width="408" height="222" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="482" y="140.8" font-size="21" font-weight="700" fill="#8a6d0d" text-anchor="start">Informal control</text><text x="482" y="171.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">+ Works every day, before crime happens</text><text x="482" y="198.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">+ Internalised norms: people control</text><text x="482" y="220.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">themselves</text><text x="482" y="247.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">− Weaker in large, anonymous cities</text><text x="482" y="274.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">− Peers or family may encourage deviance</text><text x="482" y="301.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">− Social media shaming can be unfair</text><rect x="30" y="344" width="840" height="134" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="380" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Judgement</text><text x="50" y="409.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Informal control does most of the work of producing conformity; formal control handles what</text><text x="50" y="431.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">it fails to prevent. Informal control does little against corporate fraud or cyber crime by</text><text x="50" y="453.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">strangers.</text>
</svg>