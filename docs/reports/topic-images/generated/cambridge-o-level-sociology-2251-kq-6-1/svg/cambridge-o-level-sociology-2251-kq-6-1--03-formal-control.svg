<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 695" width="900" height="695" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="695" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Formal social control: agencies and methods</text>

<text x="228.5" y="124" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Agency</text><text x="671.5" y="124" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">How it controls and prevents crime</text><rect x="30" y="140" width="397" height="91" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="168.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Police</text><line x1="433" y1="185.5" x2="467" y2="185.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="473" y="140" width="397" height="91" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="489" y="168.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Patrol, surveillance, stop and search,</text><text x="489" y="189.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">arrest, investigation; visible presence</text><text x="489" y="210.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">deters</text><rect x="30" y="245" width="397" height="70" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="273.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Courts</text><line x1="433" y1="280" x2="467" y2="280" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="473" y="245" width="397" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="489" y="273.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Decide guilt and impose sentences; public</text><text x="489" y="294.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">trials signal what is unacceptable</text><rect x="30" y="329" width="397" height="70" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="357.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Armed forces</text><line x1="433" y1="364" x2="467" y2="364" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="473" y="329" width="397" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="489" y="357.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Used in emergencies, unrest or war; may</text><text x="489" y="378.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">enforce curfews or protect borders</text><rect x="30" y="413" width="397" height="70" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="441.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Government</text><line x1="433" y1="448" x2="467" y2="448" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="473" y="413" width="397" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="489" y="441.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Makes laws, funds police and penal system,</text><text x="489" y="462.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">sets crime prevention policies</text><rect x="30" y="497" width="397" height="70" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="525.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Penal system</text><line x1="433" y1="532" x2="467" y2="532" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="473" y="497" width="397" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="489" y="525.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Prisons, probation and community sentences</text><text x="489" y="546.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">punish, incapacitate, rehabilitate</text><rect x="30" y="585" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="618.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Formal control relies on negative sanctions (fines, imprisonment) and deterrence: the</text><text x="50" y="640.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">expectation of being caught and punished.</text>
</svg>