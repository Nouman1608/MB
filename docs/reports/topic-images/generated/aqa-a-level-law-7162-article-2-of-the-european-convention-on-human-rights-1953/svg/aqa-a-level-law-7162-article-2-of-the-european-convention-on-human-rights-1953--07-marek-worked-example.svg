<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 853" width="900" height="853" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="853" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: Marek at the bank</text>

<rect x="30" y="100" width="840" height="133" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FACTS</text><text x="50" y="164.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Police know Marek has a gun and plans a bank robbery, but let him enter the bank to catch him “in</text><text x="50" y="186.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">the act”. An officer shoots him dead when he raises an object later found to be a phone. His family</text><text x="50" y="208.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">hear nothing for two weeks; officers from the same force investigate.</text><line x1="60" y1="275" x2="60" y2="801" stroke="#c9d6d4" stroke-width="4"/><rect x="104" y="255" width="766" height="86" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="288.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Article 2.2 aim</text><text x="122" y="318.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">(a) defence of others from unlawful violence, or (b) effecting a lawful arrest.</text><circle cx="60" cy="298" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="306.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="104" y="353" width="766" height="108" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="386.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Absolutely necessary</text><text x="122" y="416.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">An honest belief, for good reasons, that Marek was raising a gun may justify the shot itself</text><text x="122" y="438.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">(<tspan font-style="italic">Da</tspan> <tspan font-style="italic">Silva</tspan>).</text><circle cx="60" cy="407" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="415.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="104" y="473" width="766" height="108" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="506.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Planning</text><text x="122" y="536.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Letting an armed suspect enter a bank instead of arresting him earlier may breach Article 2</text><text x="122" y="558.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">(<tspan font-style="italic">McCann</tspan>).</text><circle cx="60" cy="527" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="535.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="104" y="593" width="766" height="108" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="626.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Procedural</text><text x="122" y="656.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Investigation by the same force is not independent and the family was not involved</text><text x="122" y="678.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">(<tspan font-style="italic">Jordan</tspan>): a separate breach.</text><circle cx="60" cy="647" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="655.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="104" y="713" width="766" height="108" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="122" y="746.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Conclusion</text><text x="122" y="776.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Likely violation on planning and on the investigation, even if the officer is not personally at</text><text x="122" y="798.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">fault.</text><circle cx="60" cy="767" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="775.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text>
</svg>