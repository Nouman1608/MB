<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 381" width="900" height="381" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="381" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">When does Article 2 apply?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">The edges of the right to life</text>
<line x1="40" y1="144" x2="860" y2="144" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><text x="40" y="132" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">start of life</text><text x="860" y="132" font-size="15" font-weight="700" fill="#4a5568" text-anchor="end">end of life</text><rect x="30" y="174" width="268" height="175" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="206" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">BEFORE BIRTH</text><text x="50" y="232.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Vo v France (2004)</text><text x="50" y="261.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Court declined to decide if an</text><text x="50" y="282.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">unborn child is a “person”:</text><text x="50" y="303.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">left to the state’s margin of</text><text x="50" y="324.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">appreciation</text><rect x="316" y="174" width="268" height="175" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="336" y="206" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EMBRYOS</text><text x="336" y="232.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Evans v UK (2007)</text><text x="336" y="261.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">No breach when embryos</text><text x="336" y="282.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">were to be destroyed after</text><text x="336" y="303.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the father withdrew consent</text><rect x="602" y="174" width="268" height="175" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="622" y="206" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">END OF LIFE</text><text x="622" y="232.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Pretty v UK (2002)</text><text x="622" y="261.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">No right to die: the ban on</text><text x="622" y="282.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">assisted suicide did not</text><text x="622" y="303.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">breach Article 2</text>
</svg>