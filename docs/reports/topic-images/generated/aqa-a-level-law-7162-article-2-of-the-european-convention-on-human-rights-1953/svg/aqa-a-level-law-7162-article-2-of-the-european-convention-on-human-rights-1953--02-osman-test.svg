<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 671" width="900" height="671" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="671" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The Osman test for the operational duty</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Every part must be met before the state is liable</text>
<line x1="60" y1="144" x2="60" y2="400" stroke="#c9d6d4" stroke-width="4"/><rect x="104" y="124" width="766" height="48" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="118" y="152.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The authorities knew, or ought to have known</text><circle cx="60" cy="148" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="156.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="104" y="180" width="766" height="48" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="118" y="208.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">of a real and immediate risk to life</text><circle cx="60" cy="204" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="212.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="104" y="236" width="766" height="48" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="118" y="264.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">of an identified individual</text><circle cx="60" cy="260" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="268.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="104" y="292" width="766" height="48" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="118" y="320.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">from the criminal acts of a third party</text><circle cx="60" cy="316" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="324.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="104" y="348" width="766" height="72" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="118" y="376.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">and failed to take reasonable measures within their powers that might have</text><text x="118" y="400.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">avoided it</text><circle cx="60" cy="384" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="392.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><rect x="30" y="442" width="201" height="197" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="44" y="468" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">TEST NOT MET</text><text x="44" y="493.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Osman v UK (1998)</text><text x="44" y="520" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">No real and immediate</text><text x="44" y="540" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">risk known at any</text><text x="44" y="560" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">decisive stage</text><rect x="243" y="442" width="201" height="197" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="257" y="468" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">BREACH</text><text x="257" y="493.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Edwards v UK</text><text x="257" y="514.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">(2002)</text><text x="257" y="541" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Prisoner killed by a</text><text x="257" y="561" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">mentally ill cellmate;</text><text x="257" y="581" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">information on his</text><text x="257" y="601" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">dangerousness not</text><text x="257" y="621" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">passed on</text><rect x="456" y="442" width="201" height="197" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="470" y="468" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">NO BREACH</text><text x="470" y="493.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Van Colle (2008)</text><text x="470" y="520" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Witness shot; earlier</text><text x="470" y="540" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">threats did not show a</text><text x="470" y="560" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">real and immediate risk</text><rect x="669" y="442" width="201" height="197" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="683" y="468" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">BREACH</text><text x="683" y="493.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Rabone (2012)</text><text x="683" y="520" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Voluntary psychiatric</text><text x="683" y="540" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">patient at risk of suicide</text><text x="683" y="560" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">allowed home leave</text>
</svg>