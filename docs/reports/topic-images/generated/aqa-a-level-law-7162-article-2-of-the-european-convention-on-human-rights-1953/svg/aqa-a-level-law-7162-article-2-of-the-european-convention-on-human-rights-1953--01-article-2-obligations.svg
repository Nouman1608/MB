<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 552" width="900" height="552" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="552" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four duties inside Article 2</text>

<rect x="200" y="100" width="500" height="135" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="135.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">“Everyone’s right to life shall be protected by</text><text x="450" y="160.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">law”</text><text x="450" y="189.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Article 2.1: a limited right; no derogation except for deaths</text><text x="450" y="210.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">from lawful acts of war</text><rect x="30" y="291" width="198" height="189" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="319" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">NEGATIVE</text><text x="46" y="345.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Do not take life</text><text x="46" y="373.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">except as Article 2.2</text><text x="46" y="394.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">allows. <tspan font-style="italic">McCann</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">UK</tspan></text><text x="46" y="415.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">(1995)</text><line x1="360" y1="239" x2="129" y2="285" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="244" y="291" width="198" height="189" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="260" y="319" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FRAMEWORK</text><text x="260" y="345.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Laws that deter</text><text x="260" y="368.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">and punish</text><text x="260" y="396.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Effective criminal law</text><text x="260" y="417.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">and regulation.</text><text x="260" y="438.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Öneryildiz</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Turkey</tspan></text><text x="260" y="459.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">(2004)</text><line x1="420" y1="239" x2="343" y2="285" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="458" y="291" width="198" height="189" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="474" y="319" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">OPERATIONAL</text><text x="474" y="345.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Protect people at</text><text x="474" y="368.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">risk</text><text x="474" y="396.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Real and immediate</text><text x="474" y="417.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">risk known, or ought</text><text x="474" y="438.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">to be. <tspan font-style="italic">Osman</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">UK</tspan></text><text x="474" y="459.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">(1998)</text><line x1="480" y1="239" x2="557" y2="285" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="672" y="291" width="198" height="189" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="688" y="319" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PROCEDURAL</text><text x="688" y="345.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Investigate deaths</text><text x="688" y="373.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Effective official</text><text x="688" y="394.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">investigation where</text><text x="688" y="415.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the state is involved.</text><text x="688" y="436.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Jordan</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">UK</tspan> (2001)</text><line x1="540" y1="239" x2="771" y2="285" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="236" y="281" width="428" height="209" rx="18" fill="none" stroke="#2e6b62" stroke-width="2.5" stroke-dasharray="8 6"/><text x="450" y="514" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="middle">positive obligations come from the words “protected by law”</text>
</svg>