<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 472" width="900" height="472" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="472" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">An effective investigation: Jordan v UK (2001)</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Required where someone dies from state force or in state custody</text>
<rect x="30" y="124" width="270.6666666666667" height="132" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="165.33333333333334" y="180" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">1</text><text x="165.33333333333334" y="206.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Independent</text><rect x="314.6666666666667" y="124" width="270.6666666666667" height="132" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">2</text><text x="450" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Capable of establishing</text><text x="450" y="206.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">the facts and identifying</text><text x="450" y="230.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">those responsible</text><rect x="599.3333333333334" y="124" width="270.6666666666667" height="132" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="734.6666666666667" y="180" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">3</text><text x="734.6666666666667" y="206.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Prompt</text><rect x="30" y="274" width="413" height="84" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="236.5" y="306" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">4</text><text x="236.5" y="332.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Open to sufficient public scrutiny</text><rect x="457" y="274" width="413" height="84" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="663.5" y="306" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">5</text><text x="663.5" y="332.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Involves the family of the deceased</text><rect x="30" y="380" width="840" height="60" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="414.4" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">The procedural duty can be breached <tspan font-weight="700" fill="#1e2a44">on</tspan> <tspan font-weight="700" fill="#1e2a44">its</tspan> <tspan font-weight="700" fill="#1e2a44">own</tspan>, separately from the death itself.</text>
</svg>