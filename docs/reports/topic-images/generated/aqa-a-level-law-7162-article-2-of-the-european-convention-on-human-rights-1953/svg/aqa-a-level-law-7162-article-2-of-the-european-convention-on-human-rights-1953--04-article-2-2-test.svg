<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 818" width="900" height="818" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="818" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Article 2.2: when is lethal force lawful?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Covers unintentional as well as intentional killing</text>
<rect x="30" y="124" width="840" height="158" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">QUESTION 1</text><text x="50" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Was the force used for a listed aim?</text><text x="50" y="211.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(a) defence of any person from unlawful violence</text><text x="50" y="234.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(b) to effect a lawful arrest or prevent the escape of a person lawfully detained</text><text x="50" y="257.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(c) action lawfully taken to quell a riot or insurrection</text><line x1="450" y1="287" x2="450" y2="317" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="322" width="840" height="137" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="354" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">QUESTION 2</text><text x="50" y="380.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Was it no more than absolutely necessary?</text><text x="50" y="409.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Strictly proportionate to the aim: a <tspan font-weight="700" fill="#1e2a44">stricter</tspan> test than “necessary in a democratic society”</text><text x="50" y="434.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Judged on an <tspan font-weight="700" fill="#1e2a44">honest</tspan> <tspan font-weight="700" fill="#1e2a44">belief,</tspan> <tspan font-weight="700" fill="#1e2a44">perceived</tspan> <tspan font-weight="700" fill="#1e2a44">for</tspan> <tspan font-weight="700" fill="#1e2a44">good</tspan> <tspan font-weight="700" fill="#1e2a44">reasons</tspan>, even if mistaken (<tspan font-style="italic">Da</tspan> <tspan font-style="italic">Silva</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">UK</tspan>, 2016)</text><line x1="450" y1="464" x2="450" y2="494" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="499" width="840" height="112" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="531" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">QUESTION 3</text><text x="50" y="557.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Was the operation planned and controlled to minimise risk to life?</text><text x="50" y="586.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">McCann</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">UK</tspan> (1995)</text><rect x="30" y="633" width="413" height="153" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="665" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">WITHIN 2.2(c)</text><text x="50" y="691.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Stewart v UK (1984)</text><text x="50" y="719.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Plastic baton round in a riot killed a boy: no</text><text x="50" y="740.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">breach in the circumstances</text><rect x="457" y="633" width="413" height="153" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="477" y="665" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">BREACH</text><text x="477" y="691.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Güleç v Turkey (1998)</text><text x="477" y="719.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Live ammunition at demonstrators killed a boy:</text><text x="477" y="740.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">not absolutely necessary; no less lethal</text><text x="477" y="761.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">equipment</text>
</svg>