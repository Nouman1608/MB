<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 453" width="900" height="453" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="453" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">McCann v UK (1995): two levels of responsibility</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Three IRA suspects shot dead by soldiers in Gibraltar</text>
<rect x="30" y="124" width="412" height="191" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">THE SOLDIERS</text><text x="50" y="185.16" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Not a breach</text><text x="50" y="216.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">They honestly believed the suspects could</text><text x="50" y="238.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">detonate a bomb remotely</text><rect x="458" y="124" width="412" height="191" rx="14" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="478" y="156" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">PLANNING AND CONTROL</text><text x="478" y="185.16" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Violation</text><text x="478" y="216.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="494.15" y="216.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Failed to arrest the suspects earlier</text><text x="478" y="242.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="494.15" y="242.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Did not allow for the intelligence being</text><text x="494.15" y="264.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">wrong</text><text x="478" y="290.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="494.15" y="290.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Soldiers trained to shoot to kill</text><rect x="30" y="337" width="840" height="84" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="371.4" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">Look beyond the person who fired: Article 2 requires the state to <tspan font-weight="700" fill="#1e2a44">plan</tspan> <tspan font-weight="700" fill="#1e2a44">operations</tspan> <tspan font-weight="700" fill="#1e2a44">to</tspan> <tspan font-weight="700" fill="#1e2a44">minimise</tspan></text><text x="450" y="395.4" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle"><tspan font-weight="700" fill="#1e2a44">the</tspan> <tspan font-weight="700" fill="#1e2a44">risk</tspan> <tspan font-weight="700" fill="#1e2a44">to</tspan> <tspan font-weight="700" fill="#1e2a44">life</tspan>.</text>
</svg>