 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="694" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why people migrate: push and pull</text>

<text x="195" y="130" font-size="18" font-weight="600" fill="#4a5568" text-anchor="middle">Sending country</text><text x="705" y="130" font-size="18" font-weight="600" fill="#4a5568" text-anchor="middle">Receiving country</text><rect x="30" y="150" width="330" height="230" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,200 L31.25,164.25 Q31.25,151.25 44.25,151.25 L345.75,151.25 Q358.75,151.25 358.75,164.25 L358.75,200 Z" fill="#f2e7b8"/><line x1="31.25" y1="200" x2="358.75" y2="200" stroke="#c9d6d4" stroke-width="2"/><text x="195" y="180.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Push factors</text><circle cx="57" cy="230.06" r="4.5" fill="#8a6d0d"/><text x="70" y="236" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Poverty</text><circle cx="57" cy="266.06" r="4.5" fill="#8a6d0d"/><text x="70" y="272" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Conflict</text><circle cx="57" cy="302.06" r="4.5" fill="#8a6d0d"/><text x="70" y="308" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Persecution</text><circle cx="57" cy="338.06" r="4.5" fill="#8a6d0d"/><text x="70" y="344" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Climate disaster</text><rect x="540" y="150" width="330" height="230" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M541.25,200 L541.25,164.25 Q541.25,151.25 554.25,151.25 L855.75,151.25 Q868.75,151.25 868.75,164.25 L868.75,200 Z" fill="#b5d3cf"/><line x1="541.25" y1="200" x2="868.75" y2="200" stroke="#c9d6d4" stroke-width="2"/><text x="705" y="180.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Pull factors</text><circle cx="567" cy="230.06" r="4.5" fill="#2e6b62"/><text x="580" y="236" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Jobs and wages</text><circle cx="567" cy="266.06" r="4.5" fill="#2e6b62"/><text x="580" y="272" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Safety</text><circle cx="567" cy="302.06" r="4.5" fill="#2e6b62"/><text x="580" y="308" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Family</text><circle cx="567" cy="338.06" r="4.5" fill="#2e6b62"/><text x="580" y="344" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Education</text><path d="M372,265 L470,265 L470,240 L528,300 L470,360 L470,335 L372,335 Z" fill="#d4b02e" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><text x="440" y="307" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">migrate</text><text x="450" y="410" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Lee (1966): the push–pull model</text><rect x="30" y="432" width="840" height="82" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="468" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Net migration = immigration − emigration. <tspan font-weight="700">Global labour patterns</tspan> add demand in sectors</text><text x="56" y="490" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">such as care, construction and technology (e.g. labour migration to the Gulf states).</text><text x="450" y="560" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Castles and Miller (1993): migration is now…</text><rect x="30" y="578" width="268" height="88" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="164" y="612" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Globalised</text><text x="164" y="642" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">more countries involved</text><rect x="316" y="578" width="268" height="88" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="450" y="612" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Accelerated</text><text x="450" y="642" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">growing in scale</text><rect x="602" y="578" width="268" height="88" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="736" y="612" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Feminised</text><text x="736" y="642" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">more women migrate</text>
</svg>