<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" width="900" height="580" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="580" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why crime has become global</text>

<rect x="30" y="108" width="260" height="64" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="160" y="143.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Cheaper travel</text><rect x="320" y="108" width="260" height="64" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="143.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Global finance</text><rect x="610" y="108" width="260" height="64" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="740" y="143.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">The internet</text><text x="450" y="198" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">create opportunities to commit crime across borders, such as…</text><line x1="165" y1="206" x2="163" y2="224" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="228" width="266" height="197" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="44" y="262" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">Human trafficking</text><text x="44" y="291" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Victims often women and</text><text x="44" y="312" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">children exploited for sex</text><text x="44" y="333" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">or labour. UN Palermo</text><text x="44" y="354" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Protocol (2000) defines it.</text><line x1="450" y1="206" x2="450" y2="224" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="317" y="228" width="266" height="197" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="331" y="262" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">Corporate crime</text><text x="331" y="291" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">TNCs move operations to</text><text x="331" y="312" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">places with weaker</text><text x="331" y="333" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">regulation. Bhopal (1984);</text><text x="331" y="354" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Sutherland’s white-collar</text><text x="331" y="375" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">crime (1939).</text><line x1="735" y1="206" x2="737" y2="224" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="604" y="228" width="266" height="197" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="618" y="262" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">Crimes against the</text><text x="618" y="287" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">environment</text><text x="618" y="316" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Illegal logging, wildlife</text><text x="618" y="337" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">trafficking, toxic waste</text><text x="618" y="358" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">dumping. Deepwater Horizon</text><text x="618" y="379" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(2010); White’s green</text><text x="618" y="400" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">criminology (2008).</text><rect x="30" y="445" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="481" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">A global criminal economy</text><text x="56" y="510" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Castells (1998): drug, arms and people trafficking networks are linked worldwide; Glenny’s</text><text x="56" y="532" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">McMafia (2008) traced these networks.</text>
</svg>