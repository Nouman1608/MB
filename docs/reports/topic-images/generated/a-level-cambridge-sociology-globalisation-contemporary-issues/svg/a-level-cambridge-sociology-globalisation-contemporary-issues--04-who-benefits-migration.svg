<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" width="900" height="580" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="580" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Migration: who benefits?</text>

<rect x="30" y="104" width="412" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,154 L31.25,118.25 Q31.25,105.25 44.25,105.25 L427.75,105.25 Q440.75,105.25 440.75,118.25 L440.75,154 Z" fill="#b5d3cf"/><line x1="31.25" y1="154" x2="440.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="135" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Functionalist / neo-liberal</text><text x="46" y="187.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Mutual gains: labour shortages are filled,</text><text x="46" y="208.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">sending families receive remittances,</text><text x="46" y="229.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">receiving societies gain diversity and</text><text x="46" y="250.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">entrepreneurship.</text><rect x="458" y="104" width="412" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,154 L459.25,118.25 Q459.25,105.25 472.25,105.25 L855.75,105.25 Q868.75,105.25 868.75,118.25 L868.75,154 Z" fill="#f2e7b8"/><line x1="459.25" y1="154" x2="868.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="135" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Marxist</text><text x="474" y="187.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Migrants form a <tspan font-weight="700">reserve army of labour</tspan> that</text><text x="474" y="208.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">holds down wages and divides workers.</text><rect x="30" y="290" width="412" height="149" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,340 L31.25,304.25 Q31.25,291.25 44.25,291.25 L427.75,291.25 Q440.75,291.25 440.75,304.25 L440.75,340 Z" fill="#f2e7b8"/><line x1="31.25" y1="340" x2="440.75" y2="340" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="321" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Feminist</text><text x="46" y="373.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The <tspan font-weight="700">global care chain</tspan>: migrant women care for</text><text x="46" y="394.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">richer families while their own children are</text><text x="46" y="415.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">cared for by others.</text><rect x="458" y="290" width="412" height="149" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,340 L459.25,304.25 Q459.25,291.25 472.25,291.25 L855.75,291.25 Q868.75,291.25 868.75,304.25 L868.75,340 Z" fill="#dce9e7"/><line x1="459.25" y1="340" x2="868.75" y2="340" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="321" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Migrants themselves</text><text x="474" y="373.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">May gain income but lose status and rights;</text><text x="474" y="394.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">irregular migrants risk exploitation and face</text><text x="474" y="415.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">negative media portrayals and racism.</text><rect x="30" y="455" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="491" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Use in essays</text><text x="56" y="520" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Weigh the positive consequences (diversity, labour, remittances) against the negative</text><text x="56" y="542" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">(pressure on scarce resources, exploitation, brain drain, racism), then ask who has power.</text>
</svg>