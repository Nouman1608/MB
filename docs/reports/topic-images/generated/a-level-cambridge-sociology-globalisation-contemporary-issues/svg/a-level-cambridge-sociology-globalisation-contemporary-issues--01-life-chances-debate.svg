<rect width="900" height="624" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Does globalisation improve life chances?</text>

<rect x="30" y="104" width="404" height="365" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,154 L31.25,118.25 Q31.25,105.25 44.25,105.25 L419.75,105.25 Q432.75,105.25 432.75,118.25 L432.75,154 Z" fill="#b5d3cf"/><line x1="31.25" y1="154" x2="432.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="232" y="134.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Optimistic view</text><text x="48" y="190.4" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">Modernisation and neo-liberal</text><circle cx="53" cy="215.79" r="4.5" fill="#2e6b62"/><text x="66" y="221.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Foreign investment and trade create jobs</text><text x="66" y="243.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">and raise incomes</text><circle cx="53" cy="267.78999999999996" r="4.5" fill="#2e6b62"/><text x="66" y="273.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Rostow (1960): joining the world economy</text><text x="66" y="295.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">is the route to development</text><circle cx="53" cy="319.78999999999996" r="4.5" fill="#2e6b62"/><text x="66" y="325.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Technology spreads: mobile banking,</text><text x="66" y="347.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">online learning, medical knowledge</text><circle cx="53" cy="371.78999999999996" r="4.5" fill="#2e6b62"/><text x="66" y="377.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">UN Millennium and Sustainable</text><text x="66" y="399.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Development Goals target schooling,</text><text x="66" y="421.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">child mortality and disease</text><rect x="466" y="104" width="404" height="365" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M467.25,154 L467.25,118.25 Q467.25,105.25 480.25,105.25 L855.75,105.25 Q868.75,105.25 868.75,118.25 L868.75,154 Z" fill="#f2e7b8"/><line x1="467.25" y1="154" x2="868.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="668" y="134.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Pessimistic view</text><text x="484" y="190.4" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">Dependency and Marxist</text><circle cx="489" cy="215.79" r="4.5" fill="#8a6d0d"/><text x="502" y="221.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Frank (1966): the rich “metropolis”</text><text x="502" y="243.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">grows by extracting surplus from the</text><text x="502" y="265.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">“satellite”</text><circle cx="489" cy="289.78999999999996" r="4.5" fill="#8a6d0d"/><text x="502" y="295.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Low-wage export jobs can be insecure and</text><text x="502" y="317.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">unsafe (Rana Plaza, 2013)</text><circle cx="489" cy="341.78999999999996" r="4.5" fill="#8a6d0d"/><text x="502" y="347.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Debt repayments and structural</text><text x="502" y="369.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">adjustment blamed for cuts to health and</text><text x="502" y="391.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">education</text><circle cx="489" cy="415.78999999999996" r="4.5" fill="#8a6d0d"/><text x="502" y="421.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">“Brain drain” removes trained doctors</text><text x="502" y="443.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">and teachers</text><circle cx="450" cy="286.5" r="24" fill="#1e2a44"/><text x="450" y="293.5" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">vs</text><rect x="30" y="487" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="523" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Evaluate by country</text><text x="56" y="552" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Outcomes differ sharply: fast-growing East Asian economies versus countries dependent on a</text><text x="56" y="574" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">single commodity. Judge with indicators: education, income, health.</text>
</svg>