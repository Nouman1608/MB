<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 628" width="900" height="628" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="628" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four explanations of global inequality</text>

<circle cx="245" cy="340" r="200" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><circle cx="245" cy="340" r="132" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><circle cx="245" cy="340" r="64" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="245" y="347" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Core</text><text x="245" y="248" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Semi-periphery</text><text x="245" y="180" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Periphery</text><line x1="77.3561191008759" y1="418.2338110862579" x2="179.7548139203409" y2="370.44775350384094" stroke="#b5602e" stroke-width="4" marker-end="url(#ahR)"/><line x1="398.0830182624753" y1="443.87776239239395" x2="304.5782557562066" y2="380.42810212028303" stroke="#b5602e" stroke-width="4" marker-end="url(#ahR)"/><line x1="203.7774117221039" y1="520.3488237157954" x2="228.95661429184585" y2="410.18981247317447" stroke="#b5602e" stroke-width="4" marker-end="url(#ahR)"/><text x="245" y="575" font-size="16" font-weight="600" fill="#b5602e" text-anchor="middle">surplus flows towards the core</text><text x="245" y="598" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Wallerstein’s world-systems theory</text><rect x="480" y="108" width="390" height="102" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="480" y="108" width="12" height="102" rx="4" fill="#2e6b62"/><text x="506" y="140" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Capitalism</text><text x="506" y="165" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Marxists and world-systems theory:</text><text x="506" y="186" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">inequality is built into the global system.</text><rect x="480" y="222" width="390" height="123" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="480" y="222" width="12" height="123" rx="4" fill="#d4b02e"/><text x="506" y="254" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Colonialism</text><text x="506" y="279" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Colonial powers extracted resources and</text><text x="506" y="300" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">labour and reshaped economies around</text><text x="506" y="321" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">exports.</text><rect x="480" y="357" width="390" height="123" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="480" y="357" width="12" height="123" rx="4" fill="#d4b02e"/><text x="506" y="389" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Post-colonialism</text><text x="506" y="414" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">After independence, dependence continued</text><text x="506" y="435" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">through trade terms, debt and cultural</text><text x="506" y="456" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">influence (“neo-colonialism”).</text><rect x="480" y="492" width="390" height="102" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="480" y="492" width="12" height="102" rx="4" fill="#2e6b62"/><text x="506" y="524" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Patriarchy</text><text x="506" y="549" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Mies (1986): global capitalism depends on</text><text x="506" y="570" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">women’s unpaid and low-paid labour.</text>
</svg>