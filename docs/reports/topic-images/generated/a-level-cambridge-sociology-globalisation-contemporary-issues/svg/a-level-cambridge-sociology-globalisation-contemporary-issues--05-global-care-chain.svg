<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="480" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The global care chain</text>

<text x="145" y="132" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">SENDING COUNTRY</text><text x="620" y="132" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">RICHER RECEIVING COUNTRY</text><line x1="315" y1="115" x2="315" y2="215" stroke="#4a5568" stroke-width="2" stroke-dasharray="6 6"/><line x1="315" y1="270" x2="315" y2="320" stroke="#4a5568" stroke-width="2" stroke-dasharray="6 6"/><rect x="30" y="160" width="230" height="140" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="145" y="200" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Her own children</text><text x="145" y="230" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">cared for by others</text><text x="145" y="251" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">while she works abroad</text><rect x="370" y="160" width="190" height="140" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="465" y="200" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Migrant woman</text><text x="465" y="230" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">care worker</text><rect x="670" y="160" width="200" height="140" rx="14" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="770" y="200" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Richer family</text><text x="770" y="230" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">receives her</text><text x="770" y="251" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">care labour</text><line x1="564" y1="205" x2="664" y2="205" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><text x="614" y="192" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">care</text><line x1="666" y1="260" x2="566" y2="260" stroke="#8a6d0d" stroke-width="4" marker-end="url(#ahO)"/><text x="616" y="285" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">wages</text><line x1="366" y1="230" x2="266" y2="230" stroke="#8a6d0d" stroke-width="4" marker-end="url(#ahO)"/><text x="316" y="257" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">remittances</text><rect x="30" y="340" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="376" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Feminist reading</text><text x="56" y="405" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Migrant women care for richer families while their own children are cared for by others,</text><text x="56" y="427" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">so care work is passed along a chain of women across borders.</text>
</svg>