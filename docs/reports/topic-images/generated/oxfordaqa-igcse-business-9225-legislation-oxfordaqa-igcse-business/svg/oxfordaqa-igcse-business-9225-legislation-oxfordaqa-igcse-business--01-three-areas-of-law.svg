<rect width="900" height="590" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three areas of business law</text>

<rect x="30" y="110" width="270" height="450" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="30" y="110" width="270" height="64" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="165" y="150" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Employment law</text><text x="48" y="200" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="200" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Written contracts</text><text x="48" y="231" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="231" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A minimum wage</text><text x="48" y="262" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="262" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Limits on working hours</text><text x="48" y="293" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="293" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Paid holiday</text><text x="48" y="324" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="324" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Fair treatment, no</text><text x="64" y="345" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">discrimination</text><text x="48" y="376" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="376" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Fair dismissal and</text><text x="64" y="397" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">redundancy</text><rect x="44" y="432" width="242" height="114" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="60" y="460" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">Protects</text><text x="60" y="486" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">Employees</text><rect x="315" y="110" width="270" height="450" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="315" y="110" width="270" height="64" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="150" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Health and safety law</text><text x="333" y="200" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">•</text><text x="349" y="200" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Assessing risks</text><text x="333" y="231" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">•</text><text x="349" y="231" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Safe equipment and</text><text x="349" y="252" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">premises</text><text x="333" y="283" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">•</text><text x="349" y="283" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Training</text><text x="333" y="314" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">•</text><text x="349" y="314" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Protective clothing</text><text x="333" y="345" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">•</text><text x="349" y="345" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Reporting accidents</text><rect x="329" y="432" width="242" height="114" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="345" y="460" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">Protects</text><text x="345" y="486" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">Employees, visitors</text><text x="345" y="509" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">and customers on the</text><text x="345" y="532" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">premises</text><rect x="600" y="110" width="270" height="450" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="600" y="110" width="270" height="64" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="735" y="150" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Consumer law</text><text x="618" y="200" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">•</text><text x="634" y="200" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Goods match description,</text><text x="634" y="221" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">acceptable quality, fit</text><text x="634" y="242" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">for purpose</text><text x="618" y="273" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">•</text><text x="634" y="273" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Safe products</text><text x="618" y="304" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">•</text><text x="634" y="304" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Accurate weights and</text><text x="634" y="325" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">labels</text><text x="618" y="356" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">•</text><text x="634" y="356" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Honest advertising</text><text x="618" y="387" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">•</text><text x="634" y="387" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Refunds or repairs for</text><text x="634" y="408" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">faulty goods</text><rect x="614" y="432" width="242" height="114" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="630" y="460" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">Protects</text><text x="630" y="486" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">Customers</text>
</svg>