<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 810" width="900" height="810" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="810" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Answering a legislation question</text>

<text x="450" y="128" font-size="18" font-weight="700" fill="#4a5568" text-anchor="middle">Analyse: a chain from the law to profit or staff (Juniper Cafés)</text><circle cx="64" cy="197" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="64" y="204.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="100" y="150" width="770" height="94" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="118" y="184" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The law</text><text x="118" y="214" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">The minimum wage rises from $7.20 to $7.80</text><line x1="64" y1="220" x2="64" y2="284" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><circle cx="64" cy="309" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="64" y="316.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="100" y="262" width="770" height="94" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="118" y="296" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">What the business must do</text><text x="118" y="326" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Pay 20 staff $0.60 more for 35,000 hours</text><line x1="64" y1="332" x2="64" y2="396" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><circle cx="64" cy="421" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="64" y="428.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="100" y="374" width="770" height="94" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="118" y="408" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The cost or benefit</text><text x="118" y="438" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">$21,000 more a year; staff may be more motivated and stay</text><line x1="64" y1="444" x2="64" y2="508" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><circle cx="64" cy="533" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="64" y="540.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="100" y="486" width="770" height="94" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="118" y="520" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Effect on profit or staff</text><text x="118" y="550" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Profit falls unless meals rise about 14 cents, or hours are cut</text><rect x="30" y="610" width="840" height="170" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="56" y="648" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Evaluate: the judgement depends on</text><rect x="56" y="670" width="252" height="90" rx="10" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="72" y="708" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">How many staff are on the</text><text x="72" y="731" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">minimum wage</text><rect x="328" y="670" width="252" height="90" rx="10" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="344" y="708" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Whether rivals face the</text><text x="344" y="731" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">same cost</text><rect x="600" y="670" width="252" height="90" rx="10" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="616" y="708" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Whether customers will</text><text x="616" y="731" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">accept higher prices</text>
</svg>