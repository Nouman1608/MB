<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 749" width="900" height="749" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="749" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Brackwell Appliances: the cost of a recall</text>

<rect x="30" y="110" width="500" height="520" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><line x1="120" y1="560" x2="505" y2="560" stroke="#c9d6d4" stroke-width="1.5"/><text x="110" y="566" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">$0</text><line x1="120" y1="454.2857142857143" x2="505" y2="454.2857142857143" stroke="#c9d6d4" stroke-width="1.5"/><text x="110" y="460.2857142857143" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">$10,000</text><line x1="120" y1="348.57142857142856" x2="505" y2="348.57142857142856" stroke="#c9d6d4" stroke-width="1.5"/><text x="110" y="354.57142857142856" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">$20,000</text><line x1="120" y1="242.85714285714283" x2="505" y2="242.85714285714283" stroke="#c9d6d4" stroke-width="1.5"/><text x="110" y="248.85714285714283" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">$30,000</text><rect x="160" y="496.57142857142856" width="130" height="63.42857142857143" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><rect x="340" y="221.71428571428572" width="130" height="338.2857142857143" fill="#b5602e" stroke="#1e2a44" stroke-width="2.5"/><text x="225" y="486.57142857142856" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">about $6,000</text><text x="405" y="211.71428571428572" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">$32,000</text><line x1="120" y1="560" x2="505" y2="560" stroke="#1e2a44" stroke-width="2.5"/><text x="225" y="588" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Safety testing</text><text x="225" y="610" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">before sale</text><text x="405" y="588" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Recall</text><text x="405" y="610" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">after sale</text><rect x="550" y="110" width="320" height="150" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="570" y="144" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">Kettles returned</text><text x="570" y="178" font-size="20" font-weight="400" fill="#1e2a44" text-anchor="start">40% × 2,000</text><text x="570" y="208" font-size="20" font-weight="400" fill="#1e2a44" text-anchor="start">= 800 kettles</text><rect x="550" y="280" width="320" height="180" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="570" y="314" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">Cost of recall</text><text x="570" y="348" font-size="20" font-weight="400" fill="#1e2a44" text-anchor="start">800 × ($35 refund</text><text x="570" y="378" font-size="20" font-weight="400" fill="#1e2a44" text-anchor="start">+ $5 handling)</text><text x="570" y="408" font-size="20" font-weight="400" fill="#1e2a44" text-anchor="start">= $32,000</text><rect x="550" y="480" width="320" height="150" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="570" y="516" font-size="17" font-weight="600" fill="#b5602e" text-anchor="start">Over five times the cost of</text><text x="570" y="539" font-size="17" font-weight="600" fill="#b5602e" text-anchor="start">testing, before any damage to</text><text x="570" y="562" font-size="17" font-weight="600" fill="#b5602e" text-anchor="start">reputation with shops</text><rect x="30" y="660" width="840" height="59" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="700" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Compliance is often cheaper than non-compliance.</text>
</svg>