<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 706" width="900" height="706" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="706" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Juniper Cafés: a minimum wage rise</text>

<rect x="30" y="110" width="250" height="110" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="155" y="146" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">20 staff × 35 h × 50 weeks</text><text x="155" y="184" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="middle">35,000 hours</text><text x="310" y="175" font-size="28" font-weight="700" fill="#1e2a44" text-anchor="middle">×</text><rect x="340" y="110" width="230" height="110" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="455" y="146" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">$7.80 − $7.20</text><text x="455" y="184" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="middle">$0.60 an hour</text><text x="600" y="175" font-size="28" font-weight="700" fill="#1e2a44" text-anchor="middle">=</text><rect x="630" y="110" width="240" height="110" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="750" y="146" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Extra cost a year</text><text x="750" y="184" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="middle">$21,000</text><line x1="750" y1="222" x2="750" y2="262" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="560" y="266" width="310" height="110" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="715" y="302" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">$21,000 ÷ 150,000 meals</text><text x="715" y="340" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="middle">$0.14 a meal</text><text x="56" y="300" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Price rise needed</text><text x="56" y="330" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">to cover the higher wage bill</text><text x="56" y="430" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Juniper’s three main choices</text><rect x="30" y="450" width="270" height="110" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="490" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Raise prices</text><text x="48" y="521" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">by about 14 cents a meal</text><rect x="315" y="450" width="270" height="110" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="333" y="490" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Accept lower profit</text><text x="333" y="521" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">absorb the $21,000</text><rect x="600" y="450" width="270" height="110" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="618" y="490" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Use fewer hours</text><text x="618" y="521" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">e.g. faster ordering</text><text x="618" y="544" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">systems</text><rect x="30" y="590" width="840" height="86" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="630" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The level playing field</text><text x="56" y="657" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">A 14-cent rise may be accepted if rivals face the same law and raise their prices too.</text>
</svg>