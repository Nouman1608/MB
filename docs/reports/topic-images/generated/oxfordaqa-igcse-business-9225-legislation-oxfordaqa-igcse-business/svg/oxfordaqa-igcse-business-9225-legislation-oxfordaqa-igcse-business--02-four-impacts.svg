<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" width="900" height="720" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="720" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four ways a law affects a business</text>

<circle cx="450" cy="400" r="88" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="3"/><text x="450" y="396" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">A business</text><text x="450" y="424" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">law</text><rect x="30" y="110" width="340" height="190" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="150" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Cost</text><text x="48" y="184" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Higher wages, safety equipment,</text><text x="48" y="207" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">inspections, testing, insurance,</text><text x="48" y="230" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">record keeping: profit falls unless</text><text x="48" y="253" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">prices rise</text><line x1="370" y1="330" x2="340" y2="306" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="530" y="110" width="340" height="190" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="548" y="150" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Training needs</text><text x="548" y="184" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Safe working methods, fair</text><text x="548" y="207" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">recruitment and dismissal, refund</text><text x="548" y="230" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">rights: costs time and money, but</text><text x="548" y="253" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">fewer mistakes</text><line x1="530" y1="330" x2="560" y2="306" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="500" width="340" height="190" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="540" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Recruitment</text><text x="48" y="574" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">No discrimination in adverts or</text><text x="48" y="597" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">interviews; proper contracts;</text><text x="48" y="620" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">checks on right to work: slower,</text><text x="48" y="643" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">but a wider pool and fewer disputes</text><line x1="370" y1="470" x2="340" y2="494" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="530" y="500" width="340" height="190" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="548" y="540" font-size="21" font-weight="700" fill="#b5602e" text-anchor="start">Failing to comply</text><text x="548" y="574" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Fines, compensation, orders to stop</text><text x="548" y="597" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">or close, recalls, prosecution, and</text><text x="548" y="620" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">bad publicity</text><line x1="530" y1="470" x2="560" y2="494" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/>
</svg>