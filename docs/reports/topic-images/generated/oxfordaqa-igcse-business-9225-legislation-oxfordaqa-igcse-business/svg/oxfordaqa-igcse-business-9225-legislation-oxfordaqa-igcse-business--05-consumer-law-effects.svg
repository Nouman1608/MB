<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="540" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How consumer law changes a business</text>

<text x="245" y="132" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="middle">The law requires</text><text x="665" y="132" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">So the business must</text><rect x="30" y="152" width="430" height="110" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="195.2" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Products must be safe and work as</text><text x="48" y="219.2" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">described</text><line x1="464" y1="207" x2="500" y2="207" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="504" y="152" width="366" height="110" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="522" y="195.2" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">More spent on design, testing and</text><text x="522" y="219.2" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">quality control</text><rect x="30" y="282" width="430" height="110" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="337.2" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Packaging and adverts must be accurate</text><line x1="464" y1="337" x2="500" y2="337" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="504" y="282" width="366" height="110" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="522" y="337.2" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Marketing claims need checking</text><rect x="30" y="412" width="430" height="110" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="455.2" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Faulty goods must be repaired, replaced or</text><text x="48" y="479.2" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">refunded</text><line x1="464" y1="467" x2="500" y2="467" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="504" y="412" width="366" height="110" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="522" y="455.2" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Returns procedures and staff who</text><text x="522" y="479.2" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">know the rules</text>
</svg>