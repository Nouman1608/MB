<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 566" width="900" height="566" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="566" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The cost of breaking the law</text>

<text x="56" y="132" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">Legal consequences</text><rect x="30" y="150" width="500" height="66" rx="10" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><text x="52" y="190" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Fines</text><rect x="30" y="230" width="500" height="66" rx="10" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><text x="52" y="270" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Compensation to injured workers or customers</text><rect x="30" y="310" width="500" height="66" rx="10" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><text x="52" y="338" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Orders to stop using unsafe equipment or to close</text><text x="52" y="362" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">premises</text><rect x="30" y="390" width="500" height="66" rx="10" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><text x="52" y="430" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Product recalls</text><rect x="30" y="470" width="500" height="66" rx="10" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><text x="52" y="510" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Prosecution of managers, in serious cases</text><line x1="534" y1="330" x2="562" y2="330" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="566" y="150" width="304" height="386" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="590" y="196" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Bad publicity</text><text x="590" y="236" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Customers and future</text><text x="590" y="260" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">employees lose trust.</text><text x="590" y="330" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="start">This often costs more</text><text x="590" y="354" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="start">than the fine itself.</text>
</svg>