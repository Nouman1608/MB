<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: averages hide the pattern</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Illustrative data for three districts of one region</text>
<rect x="30" y="110" width="840" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="55" y="168" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Share of</text><text x="55" y="190" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="start">LAND</text><rect x="200" y="150" width="34.23868312757202" height="44" fill="#2e6b62" stroke="#1e2a44" stroke-width="2"/><rect x="234.23868312757202" y="150" width="184.3621399176955" height="44" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><rect x="418.6008230452675" y="150" width="421.3991769547325" height="44" fill="#efdfa8" stroke="#1e2a44" stroke-width="2"/><text x="55" y="268" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Share of</text><text x="55" y="290" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">PEOPLE</text><rect x="200" y="250" width="549.1749174917492" height="44" fill="#2e6b62" stroke="#1e2a44" stroke-width="2"/><rect x="749.1749174917492" y="250" width="73.92739273927393" height="44" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><rect x="823.1023102310231" y="250" width="16.897689768976896" height="44" fill="#efdfa8" stroke="#1e2a44" stroke-width="2"/><rect x="196" y="125.75" width="138" height="20.25" rx="5" fill="#ffffff" opacity="1"/><text x="202" y="140" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">Riverside ≈ 5%</text><text x="530" y="316" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">Riverside ≈ 86% of the people</text><text x="836" y="216" font-size="15" font-weight="600" fill="#8a6d0d" text-anchor="end">Dry Plateau: most of the land</text><text x="450" y="345" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Key:  dark teal = Riverside · light teal = Hill Country · sand = Dry Plateau</text><text x="450" y="400" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Density = population ÷ area (people per km²)</text><rect x="30" y="420" width="201" height="120" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="30" y="420" width="201" height="10" rx="5" fill="#2e6b62"/><text x="130" y="458" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Riverside</text><text x="130" y="500" font-size="28" font-weight="700" fill="#1e2a44" text-anchor="middle">1,200</text><text x="130" y="526" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">1,560,000 ÷ 1,300</text><rect x="243" y="420" width="201" height="120" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="243" y="420" width="201" height="10" rx="5" fill="#b5d3cf"/><text x="343" y="458" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Hill Country</text><text x="343" y="500" font-size="28" font-weight="700" fill="#1e2a44" text-anchor="middle">30</text><text x="343" y="526" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">210,000 ÷ 7,000</text><rect x="456" y="420" width="201" height="120" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="456" y="420" width="201" height="10" rx="5" fill="#efdfa8"/><text x="556" y="458" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Dry Plateau</text><text x="556" y="500" font-size="28" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="556" y="526" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">48,000 ÷ 16,000</text><rect x="669" y="420" width="201" height="120" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="769" y="458" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Whole region</text><text x="769" y="500" font-size="28" font-weight="700" fill="#1e2a44" text-anchor="middle">≈ 75</text><text x="769" y="526" font-size="15" font-weight="600" fill="#b5602e" text-anchor="middle">describes no district well</text>
