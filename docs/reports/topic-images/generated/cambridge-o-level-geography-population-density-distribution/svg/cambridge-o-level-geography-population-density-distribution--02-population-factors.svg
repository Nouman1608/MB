<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why people live where they do</text>

<rect x="30" y="110" width="840" height="400" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="45" y="125" width="810" height="305" rx="10" fill="#dce9e7"/><path d="M45,430 L45,250 L90,200 L130,240 L170,180 L215,235 L250,430 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><path d="M75,215 L90,200 L105,215 Z M155,195 L170,180 L185,195 Z" fill="#ffffff"/><rect x="250" y="422" width="330" height="8" fill="#a9c48f"/><rect x="580" y="422" width="150" height="8" fill="#efdfa8"/><rect x="730" y="416" width="125" height="14" fill="#b5d3cf"/><path d="M250,426 Q420,432 580,426 Q680,424 730,420" fill="none" stroke="#2b5a9a" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" /><rect x="45" y="430" width="810" height="60" fill="#b9ab88"/><line x1="45" y1="430" x2="855" y2="430" stroke="#1e2a44" stroke-width="2.5"/><rect x="270" y="396" width="24" height="19.200000000000003" fill="#ffffff" stroke="#1e2a44" stroke-width="2.2"/><path d="M267.6,396 L282,385.6 L296.4,396 Z" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><rect x="300" y="390" width="24" height="19.200000000000003" fill="#ffffff" stroke="#1e2a44" stroke-width="2.2"/><path d="M297.6,390 L312,379.6 L326.4,390 Z" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><rect x="330" y="396" width="24" height="19.200000000000003" fill="#ffffff" stroke="#1e2a44" stroke-width="2.2"/><path d="M327.6,396 L342,385.6 L356.4,396 Z" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><rect x="360" y="390" width="24" height="19.200000000000003" fill="#ffffff" stroke="#1e2a44" stroke-width="2.2"/><path d="M357.6,390 L372,379.6 L386.4,390 Z" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><rect x="395" y="396" width="24" height="19.200000000000003" fill="#ffffff" stroke="#1e2a44" stroke-width="2.2"/><path d="M392.6,396 L407,385.6 L421.4,396 Z" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><rect x="430" y="390" width="24" height="19.200000000000003" fill="#ffffff" stroke="#1e2a44" stroke-width="2.2"/><path d="M427.6,390 L442,379.6 L456.4,390 Z" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><rect x="470" y="396" width="24" height="19.200000000000003" fill="#ffffff" stroke="#1e2a44" stroke-width="2.2"/><path d="M467.6,396 L482,385.6 L496.4,396 Z" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><rect x="520" y="390" width="24" height="19.200000000000003" fill="#ffffff" stroke="#1e2a44" stroke-width="2.2"/><path d="M517.6,390 L532,379.6 L546.4,390 Z" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><path d="M640,420 L640,397.5 L655,388.5 L655,397.5 L670,388.5 L670,397.5 L685,388.5 L685,420 Z" fill="#ffffff" stroke="#1e2a44" stroke-width="2.2" stroke-linejoin="round"/><rect x="673.75" y="370.5" width="6.75" height="22.5" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><rect x="600" y="400" width="24" height="19.200000000000003" fill="#ffffff" stroke="#1e2a44" stroke-width="2.2"/><path d="M597.6,400 L612,389.6 L626.4,400 Z" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><rect x="690" y="380" width="21" height="16.799999999999997" fill="#ffffff" stroke="#1e2a44" stroke-width="2.2"/><path d="M687.9,380 L700.5,370.9 L713.1,380 Z" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><rect x="735" y="400" width="40" height="16" rx="4" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><rect x="130" y="400" width="18" height="14.399999999999999" fill="#ffffff" stroke="#1e2a44" stroke-width="2.2"/><path d="M128.2,400 L139,392.2 L149.8,400 Z" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><rect x="29.5" y="141.75" width="237" height="20.25" rx="5" fill="#ffffff" opacity="0.92"/><text x="148" y="156" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">Sparse: high, steep, cold</text><rect x="71.875" y="315.75" width="152.25" height="20.25" rx="5" fill="#ffffff" opacity="0.92"/><text x="148" y="330" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">people in valleys</text><rect x="268" y="285.75" width="264" height="20.25" rx="5" fill="#ffffff" opacity="0.92"/><text x="400" y="300" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">Dense: flat, fertile lowland</text><rect x="286.75" y="305.75" width="226.50000000000003" height="20.25" rx="5" fill="#ffffff" opacity="0.92"/><text x="400" y="320" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">river water, alluvial soil</text><rect x="586" y="285.75" width="228" height="20.25" rx="5" fill="#ffffff" opacity="0.92"/><text x="700" y="300" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">Dense: port, jobs, trade</text><rect x="607.375" y="305.75" width="185.25" height="20.25" rx="5" fill="#ffffff" opacity="0.92"/><text x="700" y="320" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">industry and services</text><rect x="307.875" y="453.75" width="284.25" height="20.25" rx="5" fill="#b9ab88" opacity="1"/><text x="450" y="468" font-size="15" font-weight="400" fill="#ffffff" text-anchor="middle">Schematic landscape, not to scale</text><rect x="30" y="530" width="410" height="210" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="564.15" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Physical factors</text><text x="50" y="590" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="66" y="590" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Relief: flat lowland vs steep, high land</text><text x="50" y="618" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="66" y="618" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Climate: moderate, reliable rain vs</text><text x="66" y="638" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">extremes</text><text x="50" y="666" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="66" y="666" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Water and soils: rivers, fertile alluvium</text><text x="66" y="686" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">vs dry, thin soils</text><text x="50" y="714" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="66" y="714" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Vegetation: cleared land vs dense forest</text><rect x="460" y="530" width="410" height="210" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="478" y="564.15" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Human factors</text><text x="480" y="590" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="496" y="590" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Economic: jobs, ports, trade vs remoteness</text><text x="480" y="618" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="496" y="618" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Transport: good links vs isolation</text><text x="480" y="646" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="496" y="646" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Political: capitals, stability vs conflict</text><text x="480" y="674" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="496" y="674" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">History: old cities and farming regions</text><rect x="30" y="760" width="840" height="76" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="55" y="792" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Exceptions: technology (irrigation, air conditioning, desalination) lets desert cities grow;</text><text x="55" y="816" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">a resource such as a mine creates a dense pocket in a sparse region.</text>
</svg>