<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 635" width="900" height="635" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="635" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: how well does each soil drain?</text>

<rect x="30" y="110" width="540" height="500" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><line x1="120" y1="500" x2="550" y2="500" stroke="#1e2a44" stroke-width="3"/><line x1="120" y1="500" x2="120" y2="160" stroke="#1e2a44" stroke-width="3"/><line x1="112" y1="500" x2="120" y2="500" stroke="#1e2a44" stroke-width="2.5"/><text x="106" y="506" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="end">0</text><line x1="112" y1="432" x2="120" y2="432" stroke="#1e2a44" stroke-width="2.5"/><text x="106" y="438" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="end">20</text><line x1="112" y1="364" x2="120" y2="364" stroke="#1e2a44" stroke-width="2.5"/><text x="106" y="370" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="end">40</text><line x1="112" y1="296" x2="120" y2="296" stroke="#1e2a44" stroke-width="2.5"/><text x="106" y="302" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="end">60</text><line x1="112" y1="228" x2="120" y2="228" stroke="#1e2a44" stroke-width="2.5"/><text x="106" y="234" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="end">80</text><line x1="112" y1="160" x2="120" y2="160" stroke="#1e2a44" stroke-width="2.5"/><text x="106" y="166" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="end">100</text><text x="58" y="330" font-size="16" fill="#4a5568" text-anchor="middle" transform="rotate(-90 58 330)">water (cm³ of 100)</text><rect x="160" y="234.8" width="90" height="265.2" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><rect x="160" y="160" width="90" height="74.8" fill="#a77b52" stroke="#1e2a44" stroke-width="2.5"/><text x="205" y="373.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">78</text><text x="205" y="203.4" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">22</text><text x="205" y="528" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Sandy</text><rect x="290" y="323.20000000000005" width="90" height="176.79999999999998" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><rect x="290" y="160" width="90" height="163.2" fill="#a77b52" stroke="#1e2a44" stroke-width="2.5"/><text x="335" y="417.6" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">52</text><text x="335" y="247.6" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">48</text><text x="335" y="528" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Loam</text><rect x="420" y="449" width="90" height="51" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><rect x="420" y="160" width="90" height="289" fill="#a77b52" stroke="#1e2a44" stroke-width="2.5"/><text x="465" y="480.5" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">15</text><text x="465" y="310.5" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">85</text><text x="465" y="528" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Clay</text><rect x="140" y="120" width="18" height="18" rx="3" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="166" y="135" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">collected (drained)</text><rect x="340" y="120" width="18" height="18" rx="3" fill="#a77b52" stroke="#1e2a44" stroke-width="2"/><text x="366" y="135" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">retained</text><text x="560" y="590" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">invented results</text><rect x="590" y="110" width="280" height="500" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="612" y="148" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Sandy</text><text x="612" y="174" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">large connected pores:</text><text x="612" y="194" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">drains fastest, retains</text><text x="612" y="214" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">little</text><text x="612" y="250" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Clay</text><text x="612" y="276" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">tiny pores hold water</text><text x="612" y="296" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">tightly: may waterlog</text><text x="612" y="352" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Loam</text><text x="612" y="378" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="start">drains excess but retains</text><text x="612" y="398" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="start">nearly half: suits crops</text><text x="612" y="462" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Fair test</text><text x="612" y="488" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">same soil mass, water volume</text><text x="612" y="508" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and time; repeat each test</text>
</svg>