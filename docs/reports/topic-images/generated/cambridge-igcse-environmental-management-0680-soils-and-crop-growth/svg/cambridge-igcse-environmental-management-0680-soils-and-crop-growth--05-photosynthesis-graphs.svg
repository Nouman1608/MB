<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="700" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Reading photosynthesis graphs</text>

<rect x="30" y="110" width="840" height="90" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="148" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">carbon dioxide + water → glucose + oxygen</text><text x="450" y="178" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="middle">using light energy absorbed by chlorophyll</text><rect x="30" y="220" width="410" height="360" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="235" y="256" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Light intensity</text><line x1="90" y1="520" x2="410" y2="520" stroke="#1e2a44" stroke-width="3"/><line x1="90" y1="520" x2="90" y2="300" stroke="#1e2a44" stroke-width="3"/><text x="62" y="410" font-size="16" fill="#4a5568" text-anchor="middle" transform="rotate(-90 62 410)">rate of photosynthesis</text><text x="410" y="548" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end">light intensity →</text><path d="M90,520 Q180,311 260,344 L410,344" fill="none" stroke="#2e6b62" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="169" y="445.275" width="132.89999999999998" height="20.925" rx="5" fill="#ffffff" opacity="0.92"/><text x="175" y="460" font-size="15.5" font-weight="700" fill="#2e6b62" text-anchor="start">rises steeply</text><text x="270" y="374" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">levels off: another</text><text x="270" y="393" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">factor (temperature</text><text x="270" y="412" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">or CO2) now limits</text><rect x="460" y="220" width="410" height="360" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="665" y="256" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Temperature</text><line x1="520" y1="520" x2="840" y2="520" stroke="#1e2a44" stroke-width="3"/><line x1="520" y1="520" x2="520" y2="300" stroke="#1e2a44" stroke-width="3"/><text x="492" y="410" font-size="16" fill="#4a5568" text-anchor="middle" transform="rotate(-90 492 410)">rate of photosynthesis</text><text x="840" y="548" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end">temperature →</text><path d="M520,510 Q640,480 710,333 Q750,322 790,490" fill="none" stroke="#2e6b62" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round" /><line x1="725" y1="330.8" x2="725" y2="520" stroke="#4a5568" stroke-width="2" stroke-dasharray="6 5"/><text x="725" y="317.6" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">optimum</text><text x="530" y="355" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">below: slow</text><text x="770" y="421" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">above:</text><text x="770" y="440" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">enzymes</text><text x="770" y="459" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">work less</text><text x="770" y="478" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">well</text><text x="450" y="612" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Three conditions set the rate and how long it lasts:</text><rect x="60" y="630" width="250" height="44" rx="22" fill="#eef5f4" stroke="#2e6b62" stroke-width="2.5"/><text x="185" y="657.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">length of growing season</text><rect x="330" y="630" width="270" height="44" rx="22" fill="#eef5f4" stroke="#2e6b62" stroke-width="2.5"/><text x="465" y="657.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">optimum weather conditions</text><rect x="620" y="630" width="180" height="44" rx="22" fill="#eef5f4" stroke="#2e6b62" stroke-width="2.5"/><text x="710" y="657.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">daylight hours</text><text x="860" y="240" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start"></text>
</svg>