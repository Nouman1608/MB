<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 715" width="900" height="715" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="715" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Pore spaces: air and water</text>

<rect x="30" y="110" width="410" height="470" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="235" y="148" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="middle">Well-drained</text><text x="235" y="174" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">excess water drains away</text><clipPath id="pc30"><rect x="55" y="195" width="360" height="230" rx="8"/></clipPath><rect x="55" y="195" width="360" height="230" rx="8" fill="#ffffff"/><g clip-path="url(#pc30)"><circle cx="90" cy="230" r="26" fill="#efdfa8" stroke="#1e2a44" stroke-width="2"/><circle cx="160" cy="220" r="30" fill="#efdfa8" stroke="#1e2a44" stroke-width="2"/><circle cx="240" cy="240" r="34" fill="#efdfa8" stroke="#1e2a44" stroke-width="2"/><circle cx="320" cy="225" r="26" fill="#efdfa8" stroke="#1e2a44" stroke-width="2"/><circle cx="380" cy="250" r="30" fill="#efdfa8" stroke="#1e2a44" stroke-width="2"/><circle cx="120" cy="300" r="34" fill="#efdfa8" stroke="#1e2a44" stroke-width="2"/><circle cx="200" cy="290" r="26" fill="#efdfa8" stroke="#1e2a44" stroke-width="2"/><circle cx="280" cy="310" r="30" fill="#efdfa8" stroke="#1e2a44" stroke-width="2"/><circle cx="360" cy="300" r="34" fill="#efdfa8" stroke="#1e2a44" stroke-width="2"/><circle cx="90" cy="380" r="26" fill="#efdfa8" stroke="#1e2a44" stroke-width="2"/><circle cx="170" cy="370" r="30" fill="#efdfa8" stroke="#1e2a44" stroke-width="2"/><circle cx="250" cy="390" r="34" fill="#efdfa8" stroke="#1e2a44" stroke-width="2"/><circle cx="330" cy="375" r="26" fill="#efdfa8" stroke="#1e2a44" stroke-width="2"/><circle cx="395" cy="395" r="30" fill="#efdfa8" stroke="#1e2a44" stroke-width="2"/><ellipse cx="126" cy="260" rx="12" ry="7" fill="#b5d3cf"/><ellipse cx="276" cy="270" rx="12" ry="7" fill="#b5d3cf"/><ellipse cx="416" cy="280" rx="12" ry="7" fill="#b5d3cf"/><ellipse cx="236" cy="320" rx="12" ry="7" fill="#b5d3cf"/><ellipse cx="396" cy="330" rx="12" ry="7" fill="#b5d3cf"/><path d="M235,195 L235,300 M235,260 l-40,50 M235,260 l40,60" fill="none" stroke="#9c8f6e" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /></g><rect x="55" y="195" width="360" height="230" rx="8" fill="none" stroke="#1e2a44" stroke-width="2"/><text x="60" y="455" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">pores hold air and some water</text><text x="60" y="482" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">roots get oxygen to respire</text><text x="60" y="503" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">aerobically, releasing energy to</text><text x="60" y="524" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">grow and absorb ions</text><rect x="460" y="110" width="410" height="470" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="665" y="148" font-size="21" font-weight="700" fill="#b5602e" text-anchor="middle">Waterlogged</text><text x="665" y="174" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">too little drainage</text><clipPath id="pc460"><rect x="485" y="195" width="360" height="230" rx="8"/></clipPath><rect x="485" y="195" width="360" height="230" rx="8" fill="#dce9e7"/><g clip-path="url(#pc460)"><circle cx="520" cy="230" r="26" fill="#efdfa8" stroke="#1e2a44" stroke-width="2"/><circle cx="590" cy="220" r="30" fill="#efdfa8" stroke="#1e2a44" stroke-width="2"/><circle cx="670" cy="240" r="34" fill="#efdfa8" stroke="#1e2a44" stroke-width="2"/><circle cx="750" cy="225" r="26" fill="#efdfa8" stroke="#1e2a44" stroke-width="2"/><circle cx="810" cy="250" r="30" fill="#efdfa8" stroke="#1e2a44" stroke-width="2"/><circle cx="550" cy="300" r="34" fill="#efdfa8" stroke="#1e2a44" stroke-width="2"/><circle cx="630" cy="290" r="26" fill="#efdfa8" stroke="#1e2a44" stroke-width="2"/><circle cx="710" cy="310" r="30" fill="#efdfa8" stroke="#1e2a44" stroke-width="2"/><circle cx="790" cy="300" r="34" fill="#efdfa8" stroke="#1e2a44" stroke-width="2"/><circle cx="520" cy="380" r="26" fill="#efdfa8" stroke="#1e2a44" stroke-width="2"/><circle cx="600" cy="370" r="30" fill="#efdfa8" stroke="#1e2a44" stroke-width="2"/><circle cx="680" cy="390" r="34" fill="#efdfa8" stroke="#1e2a44" stroke-width="2"/><circle cx="760" cy="375" r="26" fill="#efdfa8" stroke="#1e2a44" stroke-width="2"/><circle cx="825" cy="395" r="30" fill="#efdfa8" stroke="#1e2a44" stroke-width="2"/><path d="M665,195 L665,300 M665,260 l-40,50 M665,260 l40,60" fill="none" stroke="#6b5a48" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /></g><rect x="485" y="195" width="360" height="230" rx="8" fill="none" stroke="#1e2a44" stroke-width="2"/><text x="490" y="455" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">pores full of water</text><text x="490" y="482" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">oxygen runs out, so roots can die;</text><text x="490" y="503" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">earthworms and decomposers</text><text x="490" y="524" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">also lack oxygen</text><rect x="30" y="600" width="840" height="90" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="638" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Ideal soil: holds enough water for roots but lets the excess drain.</text><text x="450" y="666" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="middle">Too little drainage: waterlogging. Too much: drought stress.</text>
</svg>