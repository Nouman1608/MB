ont-weight="400" fill="#1e2a44" text-anchor="start">especially of leaves</text><text x="50" y="600" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">Sign of deficiency</text><text x="50" y="624" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">stunted growth; yellowing</text><text x="50" y="644" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">leaves</text><rect x="315" y="110" width="270" height="560" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="148" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Phosphate</text><text x="450" y="176" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">PO₄³⁻, supplies phosphorus</text><rect x="330" y="330" width="240" height="90" fill="#a77b52" opacity="0.35"/><line x1="330" y1="330" x2="570" y2="330" stroke="#9c8f6e" stroke-width="2.5"/><line x1="450" y1="330" x2="450" y2="190" stroke="#6f9a52" stroke-width="4"/><ellipse cx="426" cy="300" rx="24" ry="10" transform="rotate(-25 426 300)" fill="#6f9a52" stroke="#1e2a44" stroke-width="2"/><ellipse cx="474" cy="292" rx="24" ry="10" transform="rotate(25 474 292)" fill="#6f9a52" stroke="#1e2a44" stroke-width="2"/><ellipse cx="426" cy="260" rx="24" ry="10" transform="rotate(-25 426 260)" fill="#6f9a52" stroke="#1e2a44" stroke-width="2"/><ellipse cx="474" cy="252" rx="24" ry="10" transform="rotate(25 474 252)" fill="#6f9a52" stroke="#1e2a44" stroke-width="2"/><ellipse cx="426" cy="220" rx="24" ry="10" transform="rotate(-25 426 220)" fill="#6f9a52" stroke="#1e2a44" stroke-width="2"/><ellipse cx="474" cy="212" rx="24" ry="10" transform="rotate(25 474 212)" fill="#6f9a52" stroke="#1e2a44" stroke-width="2"/><ellipse cx="426" cy="300" rx="24" ry="10" transform="rotate(-25 426 300)" fill="#8a5a8a" stroke="#1e2a44" stroke-width="2"/><path d="M450,330 l-10.799999999999999,18 M450,330 l0,19.8 M450,330 l10.799999999999999,18" fill="none" stroke="#9c8f6e" stroke-width="3" str