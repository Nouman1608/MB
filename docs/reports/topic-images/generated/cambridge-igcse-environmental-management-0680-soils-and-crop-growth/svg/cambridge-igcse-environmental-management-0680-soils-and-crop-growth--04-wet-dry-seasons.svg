<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 665" width="900" height="665" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="665" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Weather and the wet–dry year</text>

<rect x="30" y="110" width="410" height="130" rx="14" fill="#eef5f4" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="145" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Weather</text><text x="48" y="171.35" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">the day-to-day conditions of the</text><text x="48" y="193.79" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">atmosphere in a location</text><rect x="460" y="110" width="410" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="478" y="145" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Climate (not the same)</text><text x="478" y="171.35" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">the average conditions over many years</text><text x="450" y="280" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">In places with wet and dry seasons (schematic year)</text><rect x="60" y="350" width="420" height="60" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><rect x="480" y="350" width="360" height="60" fill="#efdfa8" stroke="#1e2a44" stroke-width="2.5"/><text x="270" y="388" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">WET SEASON</text><text x="660" y="388" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="middle">DRY SEASON</text><line x1="70" y1="480" x2="70" y2="416" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="70" y="506" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="start">plant at the start</text><text x="70" y="528" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">of the wet season</text><line x1="480" y1="480" x2="480" y2="416" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="480" y="506" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="middle">harvest as the dry</text><text x="480" y="528" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="middle">season begins</text><line x1="760" y1="480" x2="760" y2="416" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="840" y="506" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="end">growing now needs</text><text x="840" y="528" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="end">irrigation</text><path d="M100,344 Q270,310 450,344" fill="none" stroke="#6f9a52" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><text x="270" y="316" font-size="15.5" font-weight="600" fill="#6f9a52" text-anchor="middle">crop grows with water</text><rect x="30" y="570" width="840" height="70" rx="14" fill="#fbf1ea" stroke="#b5602e" stroke-width="2.5"/><text x="450" y="612" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">A late or failed wet season can ruin a harvest.</text>
</svg>