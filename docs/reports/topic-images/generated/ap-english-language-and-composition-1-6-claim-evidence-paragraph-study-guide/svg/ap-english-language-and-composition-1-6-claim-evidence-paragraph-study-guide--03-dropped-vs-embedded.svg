<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 722" width="900" height="722" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="722" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Dropped or embedded?</text>

<text x="30" y="106" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start" xml:space="preserve">Dropped: the quotation stands alone</text><rect x="30" y="124" width="302.5496" height="36" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2" /><text x="181.2748" y="148.3" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Lincoln wants to heal the nation.</text><text x="181.2748" y="181.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">claim</text><rect x="342.5496" y="124" width="426.11870000000005" height="36" rx="8" fill="#f6e3d8" stroke="#1e2a44" stroke-width="2" /><text x="555.60895" y="148.3" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">“With malice toward none, with charity for all.”</text><text x="555.60895" y="181.5" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle" xml:space="preserve">quotation, no link</text><rect x="30" y="210.3" width="199.18909999999997" height="36" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2" /><text x="129.59454999999997" y="234.60000000000002" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">This shows his tone.</text><text x="129.59454999999997" y="267.8" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle" xml:space="preserve">vague comment</text><text x="30" y="314.6" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start" xml:space="preserve">Embedded: the quotation is part of your sentence</text><rect x="30" y="332.6" width="163.05464" height="36" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2" /><text x="111.52732" y="356.90000000000003" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Lincoln’s call for</text><text x="111.52732" y="390.1" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">your grammar</text><rect x="199.05464" y="332.6" width="208.70012000000003" height="36" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2" /><text x="303.40470000000005" y="356.90000000000003" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">“malice toward none”</text><text x="303.40470000000005" y="390.1" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">quoted phrase</text><rect x="413.75476000000003" y="332.6" width="52.7231" height="36" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2" /><text x="440.11631000000006" y="356.90000000000003" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">and</text><rect x="472.47786" y="332.6" width="150.98510000000002" height="36" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2" /><text x="547.97041" y="356.90000000000003" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">“charity for all”</text><text x="547.97041" y="390.1" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">quoted phrase</text><rect x="30" y="418.90000000000003" width="358.72580000000005" height="36" rx="8" fill="#dce9e7" stroke="#1e2a44" stroke-width="2" /><text x="209.36290000000002" y="443.20000000000005" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">shifts the aim of the war’s final months</text><text x="209.36290000000002" y="476.40000000000003" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">your verb and claim</text><rect x="394.72580000000005" y="418.90000000000003" width="314.02586" height="36" rx="8" fill="#dce9e7" stroke="#1e2a44" stroke-width="2" /><text x="551.73873" y="443.20000000000005" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">from vengeance to reconciliation.</text><rect x="30" y="513.2" width="412" height="71.56" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="44" y="540.8000000000001" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Short phrase in your grammar</text><text x="44" y="567.2400000000001" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">...his call for “malice toward none”...</text><rect x="458" y="513.2" width="412" height="71.56" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="472" y="540.8000000000001" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Signal phrase + comma or colon</text><text x="472" y="567.2400000000001" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">As Lincoln urges, “let us strive on...”</text><rect x="30" y="598.76" width="412" height="92.68" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="44" y="626.36" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Object of a verb</text><text x="44" y="652.8000000000001" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">Lincoln asks the country to act “with firmness in</text><text x="44" y="673.9200000000001" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">the right”.</text><rect x="458" y="598.76" width="412" height="92.68" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="472" y="626.36" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Change nothing inside</text><text x="472" y="652.8000000000001" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">except with brackets or ellipses that keep the</text><text x="472" y="673.9200000000001" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">meaning</text>
</svg>