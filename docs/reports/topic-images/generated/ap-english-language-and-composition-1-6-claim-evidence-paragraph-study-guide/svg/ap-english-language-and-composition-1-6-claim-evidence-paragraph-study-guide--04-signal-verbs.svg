<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 582" width="900" height="582" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="582" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Signal verbs carry meaning</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Choose the verb that matches what the source is doing</text>
<rect x="30" y="122" width="400" height="54" rx="27" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" /><text x="230" y="156" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">states · notes · observes</text><line x1="436" y1="149" x2="480" y2="149" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="494" y="156" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">a neutral report</text><rect x="30" y="190" width="400" height="54" rx="27" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5" /><text x="230" y="224" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">urges · calls on · appeals to</text><line x1="436" y1="217" x2="480" y2="217" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="494" y="224" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">the writer wants action</text><rect x="30" y="258" width="400" height="54" rx="27" fill="#f6e3d8" stroke="#1e2a44" stroke-width="2.5" /><text x="230" y="292" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">warns · cautions</text><line x1="436" y1="285" x2="480" y2="285" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="494" y="292" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">a threat or risk</text><rect x="30" y="326" width="400" height="54" rx="27" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5" /><text x="230" y="360" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">concedes · admits</text><line x1="436" y1="353" x2="480" y2="353" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="494" y="360" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">grants a point to an opponent</text><rect x="30" y="394" width="400" height="54" rx="27" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5" /><text x="230" y="428" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">insists · asserts · maintains</text><line x1="436" y1="421" x2="480" y2="421" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="494" y="428" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">a strongly held claim</text><rect x="30" y="468" width="408" height="83.52000000000001" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" /><text x="234" y="502" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Not “proves”</text><text x="234" y="530" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">for a statement that only suggests</text><rect x="462" y="468" width="408" height="83.52000000000001" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" /><text x="666" y="502" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Not “shows”</text><text x="666" y="530" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">for an opinion</text>
</svg>