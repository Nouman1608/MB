<rect width="900" height="558" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A reliable paragraph pattern</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Five moves, and how they compress in a timed essay</text>
<circle cx="52" cy="150" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="52" y="156.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="84" y="122" width="500" height="64" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5" /><text x="98" y="151.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Claim</text><text x="98" y="178.68" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">topic sentence: the point, in your own words</text><circle cx="52" cy="224" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="52" y="230.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="84" y="196" width="500" height="64" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="98" y="225.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Lead-in</text><text x="98" y="252.68" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">where the evidence comes from</text><circle cx="52" cy="298" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="52" y="304.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="84" y="270" width="500" height="64" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="98" y="299.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Evidence</text><text x="98" y="326.68" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">quoted, paraphrased or summarised; embedded</text><circle cx="52" cy="372" r="18" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="52" y="378.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="84" y="344" width="500" height="64" rx="14" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5" /><text x="98" y="373.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Commentary</text><text x="98" y="400.68" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">how the evidence supports the claim</text><circle cx="52" cy="446" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="52" y="452.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><rect x="84" y="418" width="500" height="64" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="98" y="447.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Link</text><text x="98" y="474.68" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">to the larger argument or next paragraph</text><text x="755" y="136" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Timed essay</text><rect x="640" y="152" width="230" height="42.2" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2" /><text x="755" y="180.1" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">1</text><rect x="640" y="198.2" width="230" height="62" rx="8" fill="#dce9e7" stroke="#1e2a44" stroke-width="2" /><text x="755" y="236.2" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">2 + 3</text><rect x="640" y="264.2" width="230" height="167.6" rx="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2" /><text x="755" y="355" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">4 Commentary</text><rect x="640" y="435.79999999999995" width="230" height="42.2" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2" /><text x="755" y="463.9" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">5</text><text x="450" y="516" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle" xml:space="preserve">Steps 2 and 3 can share one sentence; most of the space goes to commentary.</text>
</svg>