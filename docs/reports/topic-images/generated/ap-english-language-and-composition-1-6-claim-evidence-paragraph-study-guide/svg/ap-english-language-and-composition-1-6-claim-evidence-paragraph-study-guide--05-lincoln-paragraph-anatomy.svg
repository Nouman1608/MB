<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 601" width="900" height="601" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="601" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Anatomy of the strong paragraph</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Lincoln, Second Inaugural Address, 4 March 1865</text>
<rect x="30" y="122" width="590" height="91.32" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5" /><text x="44" y="150.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">Lincoln’s Second Inaugural Address uses its closing paragraph to</text><text x="44" y="172.89" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">turn the audience from the bitterness of war toward the work of</text><text x="44" y="195.32999999999998" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">rebuilding.</text><path d="M626,126 q10,0 10,10 L636,199.32 q0,10 -10,10" fill="none" stroke="#1e2a44" stroke-width="3"/><text x="652" y="163.66" font-size="18" font-weight="400" fill="#8a6d0d" text-anchor="start" xml:space="preserve"><tspan font-weight="700">Claim</tspan></text><text x="652" y="185.66" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" xml:space="preserve">in the writer’s own words</text><rect x="30" y="223.32" width="590" height="91.32" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="44" y="251.76999999999998" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">By asking the nation to proceed “with malice toward none, with</text><text x="44" y="274.21" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">charity for all,” he removes revenge from the agenda before the</text><text x="44" y="296.65" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">war has even ended.</text><path d="M626,227.32 q10,0 10,10 L636,300.64 q0,10 -10,10" fill="none" stroke="#2e6b62" stroke-width="3"/><text x="652" y="264.98" font-size="18" font-weight="400" fill="#2e6b62" text-anchor="start" xml:space="preserve"><tspan font-weight="700">Embedded</tspan> <tspan font-weight="700">evidence</tspan></text><text x="652" y="286.98" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" xml:space="preserve">object of “proceed”</text><rect x="30" y="324.64" width="590" height="68.88" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="44" y="353.09" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">The sentence continues with a demand that is practical rather than</text><text x="44" y="375.53" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">sentimental: “let us strive on to finish the work we are in.”</text><path d="M626,328.64 q10,0 10,10 L636,379.52 q0,10 -10,10" fill="none" stroke="#2e6b62" stroke-width="3"/><text x="652" y="355.08" font-size="18" font-weight="400" fill="#2e6b62" text-anchor="start" xml:space="preserve"><tspan font-weight="700">Evidence</tspan> <tspan font-weight="700">after</tspan> <tspan font-weight="700">a</tspan> <tspan font-weight="700">colon</tspan></text><text x="652" y="377.08" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" xml:space="preserve">extends the point</text><rect x="30" y="403.52" width="590" height="91.32" rx="14" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5" /><text x="44" y="431.96999999999997" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">The word “work” casts peace as a task, and “strive” makes it</text><text x="44" y="454.40999999999997" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">demanding, so the audience is asked to labour for reconciliation,</text><text x="44" y="476.84999999999997" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">not merely to wish for it.</text><path d="M626,407.52 q10,0 10,10 L636,480.84 q0,10 -10,10" fill="none" stroke="#2e6b62" stroke-width="3"/><text x="652" y="445.17999999999995" font-size="18" font-weight="400" fill="#2e6b62" text-anchor="start" xml:space="preserve"><tspan font-weight="700">Commentary</tspan></text><text x="652" y="467.17999999999995" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" xml:space="preserve">zooms in on single words</text><rect x="30" y="514.8399999999999" width="840" height="76.88" rx="14" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5" stroke-dasharray="7 5"/><text x="450" y="547.29" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve"><tspan font-weight="700">Cover</tspan> <tspan font-weight="700">the</tspan> <tspan font-weight="700">quotations.</tspan> Still a readable paragraph? Then the quotations serve the argument</text><text x="450" y="569.73" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">instead of replacing it.</text>
</svg>