<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 582" width="900" height="582" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="582" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three ways to use a source</text>

<rect x="30" y="96" width="520" height="46" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" /><text x="290" y="126" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Source passage</text><rect x="30" y="172" width="520" height="40" rx="8" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="46" y="199" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="start" xml:space="preserve">Quotation</text><text x="566" y="199" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic" xml:space="preserve">exact words, quoted</text><text x="46" y="240" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700">Use:</tspan> when the wording itself matters</text><text x="470" y="240" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700" fill="#b5602e">Danger:</tspan> overquoting; leaving it unexplained</text><rect x="30" y="280" width="505" height="40" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="46" y="307" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start" xml:space="preserve">Paraphrase</text><text x="551" y="307" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic" xml:space="preserve">new words and structure, same length</text><text x="46" y="348" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700">Use:</tspan> when the idea matters more than the wording</text><text x="470" y="348" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700" fill="#b5602e">Danger:</tspan> staying too close to the original wording</text><rect x="30" y="388" width="220" height="40" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" /><text x="46" y="415" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Summary</text><text x="266" y="415" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic" xml:space="preserve">condensed to the main point only</text><text x="46" y="456" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700">Use:</tspan> when you need the gist of a long section</text><text x="470" y="456" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700" fill="#b5602e">Danger:</tspan> distorting meaning or adding opinion</text><line x1="550" y1="142" x2="550" y2="172" stroke="#c9d6d4" stroke-width="2" stroke-dasharray="5 5"/><rect x="30" y="498" width="840" height="54.440000000000055" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="450" y="530.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Whichever you use: <tspan font-weight="700">credit</tspan> <tspan font-weight="700">the</tspan> <tspan font-weight="700">source</tspan> and <tspan font-weight="700">connect</tspan> <tspan font-weight="700">it</tspan> <tspan font-weight="700">to</tspan> <tspan font-weight="700">your</tspan> <tspan font-weight="700">claim</tspan>.</text>
</svg>