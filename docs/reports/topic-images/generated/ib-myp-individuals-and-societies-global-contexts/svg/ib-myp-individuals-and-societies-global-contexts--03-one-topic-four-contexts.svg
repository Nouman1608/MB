<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 724" width="900" height="724" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="724" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">One topic, four global contexts</text>

<line x1="450" y1="365" x2="220" y2="190" stroke="#2e6b62" stroke-width="2.5"/><line x1="450" y1="365" x2="680" y2="190" stroke="#2e6b62" stroke-width="2.5"/><line x1="450" y1="365" x2="220" y2="540" stroke="#2e6b62" stroke-width="2.5"/><line x1="450" y1="365" x2="680" y2="540" stroke="#2e6b62" stroke-width="2.5"/><rect x="30" y="120" width="380" height="140" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="220" y="173.6" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Orientation in space and time</text><text x="220" y="200.72" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">How has the city’s response to flooding</text><text x="220" y="221.84" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">changed over decades?</text><rect x="490" y="120" width="380" height="140" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="680" y="173.6" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Fairness and development</text><text x="680" y="200.72" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Which neighbourhoods were hit hardest, and</text><text x="680" y="221.84" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">why were they less protected?</text><rect x="30" y="470" width="380" height="140" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="220" y="523.6" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Scientific and technical innovation</text><text x="220" y="550.72" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Did new defences or warning systems reduce</text><text x="220" y="571.84" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">the damage?</text><rect x="490" y="470" width="380" height="140" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="680" y="523.6" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Globalization and sustainability</text><text x="680" y="550.72" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">How do rising sea levels link this city to</text><text x="680" y="571.84" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">choices made elsewhere?</text><circle cx="450" cy="365" r="92" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="346.57" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">A coastal city</text><text x="450" y="371.65" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">after a</text><text x="450" y="396.73" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">major flood</text><rect x="30" y="640" width="840" height="53.760000000000005" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="672.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Same topic, different context: the context changes the questions you ask.</text>
</svg>