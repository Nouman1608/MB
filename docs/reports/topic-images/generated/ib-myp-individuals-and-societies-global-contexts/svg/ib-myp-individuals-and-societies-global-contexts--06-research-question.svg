<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="560" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Sharpening a research question</text>

<rect x="30" y="110" width="840" height="92" rx="12" fill="#fbeee6" stroke="#b5602e" stroke-width="2.2"/><text x="48" y="150.05" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">✗ Weak: “Is water access fair?”</text><text x="48" y="177.17000000000002" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Too broad, with no place or measure.</text><line x1="450" y1="206" x2="450" y2="244" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="250" width="840" height="110" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="48" y="286.55" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">✓ Better</text><text x="48" y="316.31" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">“How far does access to piped water differ between two districts of my city, and what</text><text x="48" y="340.07" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">explains the gap?”</text><line x1="450" y1="364" x2="450" y2="402" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="408" width="410" height="120" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="48" y="451.6" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Relevance (fairness and development)</text><text x="48" y="478.72" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Tests whether location affects access to a</text><text x="48" y="499.84000000000003" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">basic need: a fairness issue.</text><rect x="460" y="408" width="410" height="120" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="478" y="451.6" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Manageable</text><text x="478" y="478.72" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Census tables and a short survey can answer it</text><text x="478" y="499.84000000000003" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">in the time allowed.</text>
</svg>