<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" width="900" height="660" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="660" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Building a statement of inquiry</text>

<text x="450" y="138" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">Topic: the Wall Street Crash and the depression that followed</text><rect x="30" y="160" width="270" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="165" y="195" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">1  Key concept</text><text x="165" y="232" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Change</text><text x="165" y="305" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">boom to slump</text><line x1="165" y1="334" x2="330" y2="384" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="315" y="160" width="270" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="195" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">2  Related concepts</text><text x="450" y="232" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Causality,</text><text x="450" y="258" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">interdependence</text><text x="450" y="305" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">one collapse caused others</text><line x1="450" y1="334" x2="450" y2="384" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="600" y="160" width="270" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="735" y="195" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">3  Global context</text><text x="735" y="232" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Orientation in space</text><text x="735" y="258" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">and time</text><text x="735" y="305" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">a turning point that spread</text><line x1="735" y1="334" x2="570" y2="384" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="390" width="840" height="110" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.2"/><text x="450" y="425.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">4  Statement of inquiry (topic not named)</text><text x="450" y="456.18" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="middle">“A crisis in one economy can spread across borders and change ordinary lives for</text><text x="450" y="481.26" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="middle">years.”</text><rect x="30" y="525" width="410" height="105" rx="12" fill="#fbeee6" stroke="#b5602e" stroke-width="2.2"/><text x="48" y="561.05" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">✗ Fails the test</text><text x="48" y="588.17" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Only makes sense for 1929, so it is a fact,</text><text x="48" y="609.29" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">not a statement of inquiry.</text><rect x="460" y="525" width="410" height="105" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="478" y="561.05" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">✓ Passes the test</text><text x="478" y="588.17" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Transferable: could guide a unit on a</text><text x="478" y="609.29" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">different crisis too.</text>
</svg>