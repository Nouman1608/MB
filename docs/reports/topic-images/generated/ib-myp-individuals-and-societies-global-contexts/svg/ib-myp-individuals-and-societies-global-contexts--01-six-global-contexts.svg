<rect width="900" height="746" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The six global contexts</text>

<rect x="30" y="110" width="410" height="150" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="48" y="169" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Identities and relationships</text><text x="48" y="196.12" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">who people are, what they value, how</text><text x="48" y="217.24" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">individuals, groups and nations relate</text><circle cx="410" cy="136" r="16" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><text x="410" y="141.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="460" y="110" width="410" height="150" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="3"/><text x="478" y="169" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Orientation in space and time</text><text x="478" y="196.12" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">where and when things happen, turning points,</text><text x="478" y="217.24" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">connections across eras and distances</text><circle cx="840" cy="136" r="16" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="840" y="141.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="30" y="280" width="410" height="150" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="48" y="339" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Personal and cultural expression</text><text x="48" y="366.12" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">how people express ideas and identity; how</text><text x="48" y="387.24" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">ideas spread, adapt or are resisted</text><circle cx="410" cy="306" r="16" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><text x="410" y="311.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="460" y="280" width="410" height="150" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="478" y="326" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Scientific and technical</text><text x="478" y="352.4" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">innovation</text><text x="478" y="379.52" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">how science and technology change</text><text x="478" y="400.64" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">environments, economies and societies</text><circle cx="840" cy="306" r="16" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><text x="840" y="311.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="30" y="450" width="410" height="150" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="48" y="509" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Globalization and sustainability</text><text x="48" y="536.12" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">how local and global systems link; effects of</text><text x="48" y="557.24" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">decisions now and in future</text><circle cx="410" cy="476" r="16" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><text x="410" y="481.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><rect x="460" y="450" width="410" height="150" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="478" y="509" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Fairness and development</text><text x="478" y="536.12" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">rights, responsibilities, opportunity,</text><text x="478" y="557.24" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">inequality and sharing resources</text><circle cx="840" cy="476" r="16" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><text x="840" y="481.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">6</text><text x="450" y="640" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="middle">Highlighted: the guide notes many I&amp;S inquiries focus on orientation in space and time.</text><rect x="30" y="662" width="840" height="53.760000000000005" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="694.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Every unit has one global context. It shows why the inquiry matters.</text>
</svg>