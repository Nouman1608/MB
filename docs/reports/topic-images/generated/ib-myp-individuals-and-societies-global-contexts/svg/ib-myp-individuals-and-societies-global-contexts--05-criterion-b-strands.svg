<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 661" width="900" height="661" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="661" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Criterion B: where the context does its work</text>

<rect x="30" y="110" width="840" height="94.16" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="84" cy="157.07999999999998" r="28" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="84" y="167.16" font-size="28" font-weight="700" fill="#1e2a44" text-anchor="middle">i</text><text x="136" y="149.85" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Research question and its relevance</text><text x="136" y="175.57" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Context does most of its work here: it justifies why the question matters.</text><rect x="30" y="218.16" width="840" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="84" cy="262.15999999999997" r="28" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="84" y="272.23999999999995" font-size="28" font-weight="700" fill="#1e2a44" text-anchor="middle">ii</text><text x="136" y="266.15000000000003" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Plan the investigation and follow it</text><rect x="30" y="320.15999999999997" width="840" height="116.6" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="84" cy="378.46" r="28" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="84" y="388.53999999999996" font-size="28" font-weight="700" fill="#1e2a44" text-anchor="middle">iii</text><text x="136" y="360.01" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Gather and record varied, relevant information</text><text x="136" y="385.73" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Context guides the evidence: fairness compares groups; orientation needs evidence</text><text x="136" y="408.17" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">across dates; identities may need interviews.</text><rect x="30" y="450.76" width="840" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="84" cy="494.76" r="28" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="84" y="504.84" font-size="28" font-weight="700" fill="#1e2a44" text-anchor="middle">iv</text><text x="136" y="498.75" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Evaluate the process and findings</text><rect x="30" y="558.76" width="840" height="72.24000000000001" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="588.96" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Judge a question on relevance, manageability, originality, assessability, resources, interest and</text><text x="450" y="610.08" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">link to the discipline.</text>
</svg>