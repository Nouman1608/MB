<rect width="900" height="755" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: biomagnification in an estuary</text>

<rect x="30" y="110" width="840" height="450" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><line x1="220" y1="140" x2="220" y2="460" stroke="#e3e9e8" stroke-width="1.5"/><text x="220" y="488" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">0.00001</text><line x1="305.7142857142857" y1="140" x2="305.7142857142857" y2="460" stroke="#e3e9e8" stroke-width="1.5"/><text x="305.7142857142857" y="488" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">0.0001</text><line x1="391.42857142857144" y1="140" x2="391.42857142857144" y2="460" stroke="#e3e9e8" stroke-width="1.5"/><text x="391.42857142857144" y="488" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">0.001</text><line x1="477.1428571428571" y1="140" x2="477.1428571428571" y2="460" stroke="#e3e9e8" stroke-width="1.5"/><text x="477.1428571428571" y="488" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">0.01</text><line x1="562.8571428571429" y1="140" x2="562.8571428571429" y2="460" stroke="#e3e9e8" stroke-width="1.5"/><text x="562.8571428571429" y="488" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">0.1</text><line x1="648.5714285714286" y1="140" x2="648.5714285714286" y2="460" stroke="#e3e9e8" stroke-width="1.5"/><text x="648.5714285714286" y="488" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">1</text><line x1="734.2857142857142" y1="140" x2="734.2857142857142" y2="460" stroke="#e3e9e8" stroke-width="1.5"/><text x="734.2857142857142" y="488" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">10</text><line x1="820" y1="140" x2="820" y2="460" stroke="#e3e9e8" stroke-width="1.5"/><text x="820" y="488" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">100</text><line x1="220" y1="460" x2="820" y2="460" stroke="#1e2a44" stroke-width="3"/><line x1="220" y1="140" x2="220" y2="460" stroke="#1e2a44" stroke-width="3"/><text x="520" y="520" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">pesticide concentration, parts per million (log scale: each line ×10)</text><text x="206" y="185" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Water</text><rect x="220" y="158" width="59.91171465737301" height="40" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="289.911714657373" y="185" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">0.00005</text><text x="206" y="245" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Plankton</text><rect x="220" y="218" width="308.74799925668253" height="40" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="538.7479992566825" y="245" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">0.04</text><text x="206" y="305" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Small fish</text><rect x="220" y="278" width="402.76885751451596" height="40" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="632.768857514516" y="305" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">0.5</text><text x="206" y="365" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Large fish</text><rect x="220" y="338" width="454.37399962834127" height="40" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="684.3739996283413" y="365" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">2.0</text><text x="206" y="425" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Fish-eating bird</text><rect x="220" y="398" width="548.3948578861746" height="40" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><text x="778.3948578861746" y="425" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">25</text><text x="860" y="136" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">invented data</text><rect x="30" y="580" width="840" height="150" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="60" y="618" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Bird ÷ water = 25 ÷ 0.00005 = 500,000 times more concentrated</text><text x="60" y="650" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">Not broken down or excreted, so each organism stores it (bioaccumulation).</text><text x="60" y="673" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">Each consumer eats many from the level below, so it rises at each</text><text x="60" y="696" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">trophic level (biomagnification). The bird at the top has the most.</text>
</svg>