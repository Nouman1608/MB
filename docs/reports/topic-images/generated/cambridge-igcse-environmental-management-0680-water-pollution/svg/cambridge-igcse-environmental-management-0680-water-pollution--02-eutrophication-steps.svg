<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 775" width="900" height="775" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="775" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Eutrophication: six linked steps</text>

<rect x="30" y="110" width="560" height="78" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="66" cy="149" r="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="66" y="156.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="100" y="142" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Nutrients arrive</text><text x="100" y="166" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">nitrate and phosphate ions leach from fields or come in</text><text x="100" y="185" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">sewage and runoff</text><line x1="310" y1="190" x2="310" y2="200" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="202" width="560" height="78" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="66" cy="241" r="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="66" y="248.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="100" y="234" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Algal bloom</text><text x="100" y="258" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">algae and surface plants grow rapidly</text><line x1="310" y1="282" x2="310" y2="292" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="294" width="560" height="78" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="66" cy="333" r="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="66" y="340.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="100" y="326" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Light blocked</text><text x="100" y="350" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">plants lower in the water cannot photosynthesise and die</text><line x1="310" y1="374" x2="310" y2="384" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="386" width="560" height="78" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="66" cy="425" r="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="66" y="432.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="100" y="418" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Algae die</text><text x="100" y="442" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">in large numbers as they run short of nutrients</text><line x1="310" y1="466" x2="310" y2="476" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="478" width="560" height="78" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="66" cy="517" r="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="66" y="524.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="100" y="510" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Bacteria decompose</text><text x="100" y="534" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">their population rises; their RESPIRATION uses up</text><text x="100" y="553" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">dissolved oxygen</text><line x1="310" y1="558" x2="310" y2="568" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="570" width="560" height="78" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="66" cy="609" r="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="66" y="616.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">6</text><text x="100" y="602" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Fish die or leave</text><text x="100" y="626" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">oxygen falls too low for aerobic animals</text><path d="M594,149 C700,149 720,480 596,480" fill="none" stroke="#b5602e" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahR)" stroke-dasharray="9 6"/><rect x="640" y="250" width="230" height="150" rx="12" fill="#fbf1ea" stroke="#b5602e" stroke-width="2.5"/><text x="660" y="282" font-size="16.5" font-weight="700" fill="#b5602e" text-anchor="start">Organic content</text><text x="660" y="303" font-size="16.5" font-weight="700" fill="#b5602e" text-anchor="start">(sewage, manure,</text><text x="660" y="324" font-size="16.5" font-weight="700" fill="#b5602e" text-anchor="start">food waste):</text><text x="660" y="350" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">bacteria feed on it</text><text x="660" y="369" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">directly, so oxygen can</text><text x="660" y="388" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">fall before a bloom</text><rect x="30" y="670" width="840" height="80" rx="14" fill="#eef5f4" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="704" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Marks are for the links, especially “bacteria decompose” and</text><text x="450" y="728" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">“respiration uses oxygen”. Living algae are not the marked step.</text>
</svg>