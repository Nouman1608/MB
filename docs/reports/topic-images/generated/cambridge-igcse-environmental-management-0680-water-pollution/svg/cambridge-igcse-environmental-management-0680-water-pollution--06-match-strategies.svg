<text x="165" y="132" font-size="17" font-weight="700" fill="#4a5568" text-anchor="middle">Source</text><text x="450" y="132" font-size="17" font-weight="700" fill="#4a5568" text-anchor="middle">Impact</text><text x="735" y="132" font-size="17" font-weight="700" fill="#4a5568" text-anchor="middle">Strategy that fits</text><rect x="30" y="148" width="250" height="100" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="155" y="204" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="middle">Sewage</text><line x1="284" y1="198" x2="316" y2="198" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="320" y="148" width="260" height="100" rx="12" fill="#fbf1ea" stroke="#b5602e" stroke-width="2.5"/><text x="450" y="204" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="middle">Cholera</text><line x1="584" y1="198" x2="616" y2="198" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="620" y="148" width="250" height="100" rx="12" fill="#eef5f4" stroke="#2e6b62" stroke-width="2.5"/><text x="745" y="193.5" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="middle">Improved sanitation;</text><text x="745" y="214.5" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="middle">treatment of sewage</text><rect x="30" y="266" width="250" height="100" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="155" y="311.5" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="middle">Fertilisers, sewage,</text><text x="155" y="332.5" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="middle">detergents</text><line x1="284" y1="316" x2="316" y2="316" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="320" y="266" width="260" height="100" rx="12" fill="#fbf1ea" stroke="#b5602e" stroke-width="2.5"/><text x="450" y="322" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="middle">Eutrophication</text><line x1="584" y1="316" x2="616" y2="316" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="620" y="266" width="250" height="100" rx="12" fill="#eef5f4" stroke="#2e6b62" stroke-width="2.5"/><text x="745" y="290.5" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="middle">Sewage treatment removing</text><text x="745" y="311.5" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="middle">nitrates and phosphates;</text><text x="745" y="332.5" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="middle">limits on fertiliser near</text><text x="745" y="353.5" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="middle">rivers; buffer strips</text><rect x="30" y="384" width="250" height="100" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="155" y="440" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="middle">Industrial processes</text><line x1="284" y1="434" x2="316" y2="434" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="320" y="384" width="260" height="100" rx="12" fill="#fbf1ea" stroke="#b5602e" stroke-width="2.5"/><text x="450" y="429.5" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="middle">Toxic accumulation,</text><text x="450" y="450.5" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="middle">biomagnification</text><line x1="584" y1="434" x2="616" y2="434" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="620" y="384" width="250" height="100" rx="12" fill="#eef5f4" stroke="#2e6b62" stroke-width="2.5"/><text x="745" y="419" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="middle">Legislation: discharge</text><text x="745" y="440" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="middle">limits, permits, on-site</text><text x="745" y="461" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="middle">treatment, fines</text><rect x="30" y="502" width="250" height="100" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="155" y="558" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="middle">Pesticides</text><line x1="284" y1="552" x2="316" y2="552" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="320" y="502" width="260" height="100" rx="12" fill="#fbf1ea" stroke="#b5602e" stroke-width="2.5"/><text x="450" y="547.5" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="middle">Bioaccumulation,</text><text x="450" y="568.5" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="middle">biomagnification</text><line x1="584" y1="552" x2="616" y2="552" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="620" y="502" width="250" height="100" rx="12" fill="#eef5f4" stroke="#2e6b62" stroke-width="2.5"/><text x="745" y="547.5" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="middle">Banning the most</text><text x="745" y="568.5" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="middle">persistent pesticides</text><text x="450" y="640" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="middle">Match the strategy to the source in the question: sewage treatment</text><text x="450" y="664" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="middle">does not answer an industrial pollution question.</text>
