<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 840" width="900" height="840" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="840" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Five sources of water pollution</text>

<rect x="30" y="110" width="840" height="470" rx="14" fill="#e3ecd9"/><path d="M30,470 C200,430 300,520 450,480 C600,440 700,510 870,470" fill="none" stroke="#1e2a44" stroke-width="46" stroke-linejoin="round" stroke-linecap="round" /><path d="M30,470 C200,430 300,520 450,480 C600,440 700,510 870,470" fill="none" stroke="#b5d3cf" stroke-width="40" stroke-linejoin="round" stroke-linecap="round" /><text x="840" y="478" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="end">river</text><rect x="70" y="250" width="39" height="31.200000000000003" fill="#ffffff" stroke="#1e2a44" stroke-width="2.2"/><path d="M66.1,250 L89.5,233.1 L112.9,250 Z" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><rect x="130" y="262" width="33" height="26.400000000000002" fill="#ffffff" stroke="#1e2a44" stroke-width="2.2"/><path d="M126.7,262 L146.5,247.7 L166.3,262 Z" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><line x1="120" y1="300" x2="150" y2="440" stroke="#b5602e" stroke-width="3.5" marker-end="url(#ahR)"/><path d="M250,250 L250,330 L280,400" fill="none" stroke="#9c8f6e" stroke-width="10" stroke-linejoin="round" stroke-linecap="round" /><rect x="230" y="220" width="40" height="34" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><line x1="282" y1="404" x2="292" y2="444" stroke="#b5602e" stroke-width="3.5" marker-end="url(#ahR)"/><rect x="380" y="330" width="18" height="11" rx="2" fill="#2b5a9a" stroke="#1e2a44" stroke-width="1.5"/><rect x="410" y="360" width="18" height="11" rx="2" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.5"/><rect x="360" y="390" width="18" height="11" rx="2" fill="#b5602e" stroke="#1e2a44" stroke-width="1.5"/><rect x="430" y="400" width="18" height="11" rx="2" fill="#2e6b62" stroke="#1e2a44" stroke-width="1.5"/><rect x="470" y="470" width="15" height="9" rx="2" fill="#2b5a9a" stroke="#1e2a44" stroke-width="1.5"/><rect x="520" y="462" width="15" height="9" rx="2" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.5"/><rect x="600" y="455" width="15" height="9" rx="2" fill="#b5602e" stroke="#1e2a44" stroke-width="1.5"/><path d="M560,320 L560,278 L588,261.2 L588,278 L616,261.2 L616,278 L644,261.2 L644,320 Z" fill="#ffffff" stroke="#1e2a44" stroke-width="2.2" stroke-linejoin="round"/><rect x="623" y="227.60000000000002" width="12.6" height="42" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><path d="M620,320 L620,400 L640,440" fill="none" stroke="#8a6d0d" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" /><line x1="640" y1="440" x2="646" y2="452" stroke="#b5602e" stroke-width="3.5" marker-end="url(#ahR)"/><path d="M700,280 L860,250 L860,380 L700,400 Z" fill="#efdfa8" stroke="#1e2a44" stroke-width="2"/><line x1="712" y1="395" x2="732" y2="282" stroke="#6f9a52" stroke-width="3"/><line x1="742" y1="391" x2="762" y2="278" stroke="#6f9a52" stroke-width="3"/><line x1="772" y1="387" x2="792" y2="274" stroke="#6f9a52" stroke-width="3"/><line x1="802" y1="383" x2="822" y2="270" stroke="#6f9a52" stroke-width="3"/><line x1="832" y1="379" x2="852" y2="266" stroke="#6f9a52" stroke-width="3"/><line x1="760" y1="405" x2="740" y2="450" stroke="#b5602e" stroke-width="3.5" marker-end="url(#ahR)"/><text x="780" y="432" font-size="15" font-weight="600" fill="#b5602e" text-anchor="start">runoff</text><path d="M820,385 L820,520" fill="none" stroke="#2b5a9a" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 5"/><text x="828" y="545" font-size="15" font-weight="600" fill="#2b5a9a" text-anchor="start">leaching</text><circle cx="100" cy="200" r="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="100" y="206.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><circle cx="250" cy="190" r="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="250" y="196.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><circle cx="400" cy="300" r="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="400" y="306.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><circle cx="600" cy="220" r="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="600" y="226.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><circle cx="780" cy="230" r="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="780" y="236.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="60" y="140" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">schematic, not to scale</text><circle cx="50" cy="630" r="16" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="50" y="635.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="76" y="636" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Domestic waste</text><text x="76" y="660" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">detergents (phosphates), food waste, oils,</text><text x="76" y="679" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">chemicals, litter</text><circle cx="480" cy="630" r="16" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="480" y="635.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="506" y="636" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Sewage</text><text x="506" y="660" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">disease-causing bacteria and organic matter;</text><text x="506" y="679" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">leaks and storm overflows</text><circle cx="50" cy="706" r="16" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="50" y="711.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="76" y="712" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Plastic waste</text><text x="76" y="736" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">litter, landfill and drains; slow to</text><text x="76" y="755" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">decompose, carried to the sea</text><circle cx="480" cy="706" r="16" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="480" y="711.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="506" y="712" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Industrial processes</text><text x="506" y="736" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">heavy metals (mercury, lead), solvents,</text><text x="506" y="755" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">acids, heated water</text><circle cx="50" cy="782" r="16" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="50" y="787.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="76" y="788" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Agricultural practices</text><text x="76" y="812" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">nitrate and phosphate fertilisers, manure,</text><text x="76" y="831" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">slurry, pesticides</text>
</svg>