pathogens and organic matter;</text><text x="48" y="562.785" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">protects rivers; nutrient removal reduces</text><text x="48" y="583.2449999999999" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">eutrophication downstream</text><rect x="460" y="485" width="410" height="110" rx="14" fill="#fbf1ea" stroke="#b5602e" stroke-width="2.5"/><text x="478" y="518.3" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">Limitation</text><text x="478" y="542.3249999999999" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">expensive to build and run; works can</text><text x="478" y="562.785" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">overflow in storms</text>
