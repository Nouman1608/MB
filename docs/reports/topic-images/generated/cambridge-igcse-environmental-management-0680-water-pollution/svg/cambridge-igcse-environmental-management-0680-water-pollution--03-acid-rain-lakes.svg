roke="#1e2a44" stroke-width="1.6" stroke-linejoin="round"/><path d="M506,400 Q490,390 476,400 Q490,410 506,400 Z M478,400 L466,392 L466,408 Z" fill="#4a5568" stroke="#1e2a44" stroke-width="1.6" stroke-linejoin="round"/><text x="160" y="380" font-size="16" font-weight="700" fill="#ffffff" text-anchor="start">soil</text><line x1="200" y1="380" x2="300" y2="370" stroke="#8a6d0d" stroke-width="3" marker-end="url(#ahO)"/><text x="160" y="410" font-size="15" font-weight="600" fill="#ffffff" text-anchor="start">releases aluminium</text><rect x="30" y="460" width="270" height="140" rx="14" fill="#fbf1ea" stroke="#b5602e" stroke-width="2.5"/><text x="48" y="493.3" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">Fish, eggs and</text><text x="48" y="515.8" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">invertebrates</text><text x="48" y="540.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">many cannot survive below</text><text x="48" y="561.72" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">certain pH values (e.g.</text><text x="48" y="582.84" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">insect larvae, snails)</text><rect x="315" y="460" width="270" height="140" rx="14" fill="#fbf1ea" stroke="#b5602e" stroke-width="2.5"/><text x="333" y="493.3" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">Food web disrupted</text><text x="333" y="518.1" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">as populations fall</text><rect x="600" y="460" width="270" height="140" rx="14" fill="#fbf1ea" stroke="#b5602e" stroke-width="2.5"/><text x="618" y="493.3" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">Aluminium</text><text x="618" y="518.1" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">released from soils into</text><text x="618" y="539.22" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">lakes damages fish gills</text><text x="450" y="630" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="middle">How acid rain forms belongs to sub-topic 4.3.</text>
