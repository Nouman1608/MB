<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 809" width="900" height="809" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="809" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A seven-step matching method</text>

<rect x="30" y="110" width="840" height="87" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="153.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="162.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="122" y="148" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Read the sentences first</text><text x="122" y="176" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Note the key idea of each in your own words, and whether it has two parts.</text><rect x="30" y="207" width="840" height="87" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="250.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="259.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="122" y="245" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Read each paragraph once</text><text x="122" y="273" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Who the person is and two or three things they say.</text><rect x="30" y="304" width="840" height="87" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="347.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="356.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="122" y="342" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Match the easiest first</text><text x="122" y="370" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Obvious matches reduce the field for the rest.</text><rect x="30" y="401" width="840" height="87" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="444.5" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="76" y="453.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="122" y="439" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Find the evidence</text><text x="122" y="467" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Locate the specific words that justify each match. No evidence, no answer yet.</text><rect x="30" y="498" width="840" height="87" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="541.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="550.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="122" y="536" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Check both parts</text><text x="122" y="564" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Every two-part sentence must be satisfied in full.</text><rect x="30" y="595" width="840" height="87" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="638.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="647.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">6</text><text x="122" y="633" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Eliminate, then verify</text><text x="122" y="661" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Resolve the hard ones by elimination, but still check the evidence.</text><rect x="30" y="692" width="840" height="87" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="735.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="744.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">7</text><text x="122" y="730" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Answer every sentence</text><text x="122" y="758" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">There is no penalty for a wrong letter, so never leave a blank.</text>
</svg>