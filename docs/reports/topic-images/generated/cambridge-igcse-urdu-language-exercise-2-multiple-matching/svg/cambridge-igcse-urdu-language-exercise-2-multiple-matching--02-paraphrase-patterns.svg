<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 936" width="900" height="936" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="936" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Same meaning, different words</text>

<rect x="30" y="110" width="840" height="795.1999999999999" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,160 L31.25,124 Q31.25,111.25 44,111.25 L856,111.25 Q868.75,111.25 868.75,124 L868.75,160 Z" fill="#b5d3cf"/><text x="46" y="142" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Pattern</text><text x="564" y="142" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">In the paragraph</text><line x1="240" y1="110" x2="240" y2="905.1999999999999" stroke="#c9d6d4" stroke-width="2"/><text x="854" y="142" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">In the sentence</text><line x1="580" y1="110" x2="580" y2="905.1999999999999" stroke="#c9d6d4" stroke-width="2"/><line x1="30" y1="160" x2="870" y2="160" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="201.85" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Synonym</text><text x="564" y="210.4" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;کام شروع کیا&#x200F;</text><text x="854" y="210.4" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;کام کا آغاز کیا&#x200F;</text><line x1="30" y1="234.4" x2="870" y2="234.4" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="264.75" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">General word for</text><text x="46" y="287.75" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">specific ones</text><text x="564" y="284.8" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;فٹ بال اور کرکٹ&#x200F;</text><text x="854" y="284.8" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;کھیل&#x200F;</text><line x1="30" y1="308.8" x2="870" y2="308.8" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="339.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Negative of the</text><text x="46" y="362.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">opposite</text><text x="564" y="359.20000000000005" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;آسان نہیں تھا&#x200F;</text><text x="854" y="359.20000000000005" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;مشکل تھا&#x200F;</text><line x1="30" y1="383.20000000000005" x2="870" y2="383.20000000000005" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="413.55" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Feeling described</text><text x="46" y="436.55" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">indirectly</text><text x="564" y="433.6" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;میرا دل خوش ہو جاتا ہے&#x200F;</text><text x="854" y="433.6" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;اسے خوشی ملتی ہے&#x200F;</text><line x1="30" y1="457.6" x2="870" y2="457.6" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="499.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Change over time</text><text x="564" y="508" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;پہلے… مگر اب…&#x200F;</text><text x="854" y="508" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;اس کا معمول بدل گیا ہے&#x200F;</text><line x1="30" y1="532" x2="870" y2="532" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="587.35" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Someone else's</text><text x="46" y="610.35" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">view</text><text x="564" y="582.4" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;میرے دوست کہتے ہیں کہ&#x200F;</text><text x="564" y="632.4" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;یہ وقت کا ضیاع ہے&#x200F;</text><text x="854" y="582.4" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;دوسرے اس کے شوق کو&#x200F;</text><text x="854" y="632.4" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;اہمیت نہیں دیتے&#x200F;</text><line x1="30" y1="656.4" x2="870" y2="656.4" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="723.25" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Future intention</text><text x="564" y="706.8" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;میں بڑی ہو کر ڈیزائنر&#x200F;</text><text x="564" y="756.8" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;بننا چاہتی ہوں&#x200F;</text><text x="854" y="731.8" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;اس کا مستقبل کا پیشہ&#x200F;</text><line x1="30" y1="780.8" x2="870" y2="780.8" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="836.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Cause stated as</text><text x="46" y="859.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">result</text><text x="564" y="831.1999999999999" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;شور کی وجہ سے گھر میں&#x200F;</text><text x="564" y="881.1999999999999" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;نہیں پڑھ سکتی&#x200F;</text><text x="854" y="831.1999999999999" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;گھر پڑھنے کے لیے&#x200F;</text><text x="854" y="881.1999999999999" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;مناسب جگہ نہیں&#x200F;</text>
</svg>