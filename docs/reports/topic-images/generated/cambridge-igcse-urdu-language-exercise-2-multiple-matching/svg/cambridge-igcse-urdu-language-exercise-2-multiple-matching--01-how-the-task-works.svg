<rect width="900" height="794" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How Exercise 2 works</text>

<rect x="30" y="110" width="195" height="130" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="127.5" y="154" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">9 marks</text><text x="127.5" y="184" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">one per sentence</text><rect x="245" y="110" width="195" height="130" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="342.5" y="154" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">12-15 min</text><text x="342.5" y="184" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">a sensible time</text><text x="342.5" y="205" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">allowance</text><rect x="460" y="110" width="195" height="130" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="557.5" y="154" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">R1, R2, R3</text><text x="557.5" y="184" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">not R4: answers are</text><text x="557.5" y="205" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">stated, reworded</text><rect x="675" y="110" width="195" height="130" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="772.5" y="154" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">One letter</text><text x="772.5" y="184" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">per answer: no Urdu</text><text x="772.5" y="205" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">to write</text><text x="160" y="290" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Sentences</text><text x="740" y="290" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Paragraphs</text><path d="M220,334 C450,334 450,426 650,426" fill="none" stroke="#8a6d0d" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><path d="M220,396 C450,396 450,350 650,350" fill="none" stroke="#2e6b62" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><path d="M220,458 C450,458 450,578 650,578" fill="none" stroke="#2e6b62" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><path d="M220,520 C450,520 450,426 650,426" fill="none" stroke="#8a6d0d" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><path d="M220,582 C450,582 450,502 650,502" fill="none" stroke="#2e6b62" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><rect x="100" y="310" width="120" height="48" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="160" y="341" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Sentence 1</text><rect x="100" y="372" width="120" height="48" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="160" y="403" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Sentence 2</text><rect x="100" y="434" width="120" height="48" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="160" y="465" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Sentence 3</text><rect x="100" y="496" width="120" height="48" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="160" y="527" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Sentence 4</text><rect x="100" y="558" width="120" height="48" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="160" y="589" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Sentence 5</text><text x="160" y="638" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">… up to 9</text><rect x="650" y="320" width="180" height="60" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="740" y="358" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Paragraph A</text><rect x="650" y="396" width="180" height="60" rx="10" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="740" y="434" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Paragraph B</text><rect x="650" y="472" width="180" height="60" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="740" y="510" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Paragraph C</text><rect x="650" y="548" width="180" height="60" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="740" y="586" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Paragraph D</text><rect x="30" y="670" width="840" height="96" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="54" y="706" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Read the rubric: a letter may be used more than once</text><text x="54" y="736" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Here B matches two sentences. Do not cross a letter off unless each is used once.</text>
</svg>