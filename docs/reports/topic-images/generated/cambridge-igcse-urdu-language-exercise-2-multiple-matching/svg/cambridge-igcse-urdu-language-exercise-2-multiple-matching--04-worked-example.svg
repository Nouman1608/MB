<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 806" width="900" height="806" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="806" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Matching by meaning: the worked example</text>

<text x="235" y="116" font-size="18" font-weight="700" fill="#4a5568" text-anchor="middle">Sentence</text><text x="665" y="116" font-size="18" font-weight="700" fill="#4a5568" text-anchor="middle">Evidence in the paragraph</text><rect x="30" y="132" width="410" height="228" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="460" y="132" width="410" height="228" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="420" y="196" font-size="25" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;یہ شخص اپنے خاندان کے ایک بزرگ&#x200F;</text><text x="420" y="250" font-size="25" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;کی مدد کرتا/کرتی ہے۔&#x200F;</text><text x="50" y="286" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">helps an elder in the family</text><line x1="442" y1="246" x2="458" y2="246" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><circle cx="500" cy="170" r="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="500" y="177.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">A</text><text x="850" y="184" font-size="25" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;زینب&#x200F;</text><text x="850" y="240" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;نانی&#x200F;</text><text x="850" y="294" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;وہ اکیلی نہیں جا سکتیں&#x200F;</text><text x="480" y="326" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">grandmother = older relative; she</text><text x="480" y="346" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">cannot go alone</text><rect x="30" y="374" width="410" height="208" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="460" y="374" width="410" height="208" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="420" y="438" font-size="25" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;کسی اور کو اس شخص کی صلاحیت&#x200F;</text><text x="420" y="492" font-size="25" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;پر اس سے زیادہ بھروسا ہے۔&#x200F;</text><text x="50" y="528" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">someone else trusts their ability more than</text><text x="50" y="548" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">they do</text><line x1="442" y1="478" x2="458" y2="478" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><circle cx="500" cy="412" r="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="500" y="419.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">B</text><text x="850" y="426" font-size="25" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;حمزہ&#x200F;</text><text x="850" y="482" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;میرے کوچ کا خیال ہے&#x200F;</text><text x="850" y="536" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;مجھے خود اس پر یقین نہیں&#x200F;</text><text x="480" y="568" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">the coach believes; Hamza does not</text><rect x="30" y="596" width="410" height="180" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="460" y="596" width="410" height="180" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="420" y="660" font-size="25" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;اس شخص کے ہفتے کے دن کا&#x200F;</text><text x="420" y="714" font-size="25" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;معمول بدل گیا ہے۔&#x200F;</text><text x="50" y="750" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">their Saturday routine has changed</text><line x1="442" y1="686" x2="458" y2="686" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><circle cx="500" cy="634" r="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="500" y="641.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">C</text><text x="850" y="648" font-size="25" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;مریم&#x200F;</text><text x="850" y="704" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;پہلے… مگر اب…&#x200F;</text><text x="480" y="736" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">used to sleep late, now works</text>
</svg>