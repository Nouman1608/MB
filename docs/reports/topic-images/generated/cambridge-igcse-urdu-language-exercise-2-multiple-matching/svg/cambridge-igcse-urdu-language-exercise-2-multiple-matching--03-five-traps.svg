<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1025" width="900" height="1025" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="1025" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Five traps in multiple matching</text>

<rect x="30" y="110" width="840" height="144" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="182" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="190.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="122" y="150" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">The shared word</text><text x="122" y="180" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The paragraph that repeats the word</text><text x="122" y="201" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">is often wrong: there, the brother</text><text x="122" y="222" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">is in the band, not the writer.</text><rect x="769.6800000000001" y="126" width="80.32" height="110" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="809.84" y="176" font-size="24" fill="#1e2a44" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;بینڈ&#x200F;</text><text x="809.84" y="220" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">band</text><rect x="30" y="266" width="840" height="139" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="335.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="344.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="122" y="306" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Half a match</text><text x="122" y="336" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A paragraph that satisfies only one</text><text x="122" y="357" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">part of a two-part sentence is not a</text><text x="122" y="378" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">match. Underline both parts.</text><rect x="450" y="288" width="400" height="44" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="470" y="317" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">helps an older relative</text><text x="820" y="319" font-size="26" font-weight="700" fill="#2e6b62" text-anchor="middle">✓</text><rect x="450" y="342" width="400" height="44" rx="10" fill="#fbf1ea" stroke="#b5602e" stroke-width="2"/><text x="470" y="371" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">and does it every week</text><text x="820" y="373" font-size="26" font-weight="700" fill="#b5602e" text-anchor="middle">✗</text><rect x="30" y="417" width="840" height="144" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="489" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="497.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="122" y="457" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Wanted versus did</text><text x="122" y="487" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Something the person has done does</text><text x="122" y="508" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">not match a paragraph where they</text><text x="122" y="529" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">only plan it.</text><rect x="779.76" y="433" width="70.24" height="110" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="814.88" y="483" font-size="24" fill="#1e2a44" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;کیا&#x200F;</text><text x="814.88" y="527" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">did</text><rect x="649.12" y="433" width="120.64" height="110" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="709.44" y="483" font-size="24" fill="#1e2a44" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;ارادہ ہے&#x200F;</text><text x="709.44" y="527" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">intends to</text><rect x="508.4" y="433" width="130.72" height="110" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="573.76" y="483" font-size="24" fill="#1e2a44" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;چاہتا تھا&#x200F;</text><text x="573.76" y="527" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">wanted to</text><rect x="30" y="573" width="840" height="144" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="645" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="653.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="122" y="613" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Whose opinion?</text><text x="122" y="643" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The writer's own view or someone</text><text x="122" y="664" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">else's: sentences frequently turn on</text><text x="122" y="685" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">this difference.</text><rect x="678.96" y="589" width="171.04" height="110" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="764.48" y="639" font-size="24" fill="#1e2a44" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;میرے خیال میں&#x200F;</text><text x="764.48" y="683" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">writer's view</text><rect x="437.44000000000005" y="589" width="231.51999999999998" height="110" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="553.2" y="639" font-size="24" fill="#1e2a44" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;میری امی کا خیال ہے&#x200F;</text><text x="553.2" y="683" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">someone else's view</text><rect x="30" y="729" width="840" height="266" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="862" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="870.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="122" y="769" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Time words</text><text x="122" y="799" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">They anchor events in time: "this</text><text x="122" y="820" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">place will soon be unavailable"</text><text x="122" y="841" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">needs a future event, not a past</text><text x="122" y="862" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">one.</text><rect x="769.6800000000001" y="745" width="80.32" height="110" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="809.84" y="795" font-size="24" fill="#1e2a44" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;پہلے&#x200F;</text><text x="809.84" y="839" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">before</text><rect x="699.5200000000001" y="745" width="60.16" height="110" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="729.6000000000001" y="795" font-size="24" fill="#1e2a44" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;اب&#x200F;</text><text x="729.6000000000001" y="839" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">now</text><rect x="568.8800000000001" y="745" width="120.64" height="110" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="629.2000000000002" y="795" font-size="24" fill="#1e2a44" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;اگلے سال&#x200F;</text><text x="629.2000000000002" y="839" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">next year</text><rect x="699.12" y="867" width="150.88" height="110" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="774.56" y="917" font-size="24" fill="#1e2a44" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;دو سال پہلے&#x200F;</text><text x="774.56" y="961" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">two years ago</text><rect x="551.3199999999999" y="867" width="137.8" height="110" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="620.2199999999999" y="917" font-size="24" fill="#1e2a44" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;ابھی تک&#x200F;</text><text x="620.2199999999999" y="961" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">still, so far</text>
</svg>