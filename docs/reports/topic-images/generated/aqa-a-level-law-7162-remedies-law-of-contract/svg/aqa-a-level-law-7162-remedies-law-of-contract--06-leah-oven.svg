<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 570" width="900" height="570" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="570" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: Leah’s late oven</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Ordered for £10,000; told of a wedding contract worth £6,000 profit</text>
<rect x="30" y="124" width="206" height="70" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="133" y="156" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Wedding profit</text><text x="133" y="178" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">£6,000</text><rect x="250" y="124" width="440" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="264" y="152.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Ovenco was told: within Hadley’s second limb</text><text x="264" y="173.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(<tspan font-style="italic">Victoria</tspan> <tspan font-style="italic">Laundry</tspan>)</text><rect x="706" y="124" width="164" height="70" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="788" y="166" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">Not too remote</text><rect x="30" y="204" width="206" height="70" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="133" y="236" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Banquet profit</text><text x="133" y="258" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">£9,000</text><rect x="250" y="204" width="440" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="264" y="243.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Never mentioned and unusually profitable</text><rect x="706" y="204" width="164" height="70" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="788" y="246" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">Too remote</text><text x="30" y="314" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Mitigation (Payzu v Saunders): a similar oven was available on 10 April</text><rect x="250" y="338" width="360" height="44" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="236" y="366" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">Lost wedding profit</text><text x="618" y="366" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="start">£6,000</text><rect x="250" y="396" width="60" height="44" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="236" y="424" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">Extra cost of oven</text><text x="318" y="424" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">£1,000 (£11,000 − £10,000)</text><rect x="30" y="460" width="840" height="78" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="492.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A court may limit damages to the <tspan font-weight="700" fill="#1e2a44">£1,000</tspan> <tspan font-weight="700" fill="#1e2a44">extra</tspan> <tspan font-weight="700" fill="#1e2a44">cost</tspan> rather than the £6,000 lost profit. Specific</text><text x="50" y="513.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">performance is irrelevant after delivery, and an oven is not unique.</text>
</svg>