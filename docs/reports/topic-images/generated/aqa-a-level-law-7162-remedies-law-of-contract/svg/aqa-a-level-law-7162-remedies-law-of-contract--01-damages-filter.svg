<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 626" width="900" height="626" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="626" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">From breach to damages: three filters</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Aim: the position as if the contract had been performed (Robinson v Harman, 1848)</text>
<rect x="30" y="124" width="840" height="125" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="152" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">LOSS</text><text x="46" y="178.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">What loss has the claimant suffered?</text><text x="46" y="207.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Expectation, reliance, loss of a chance, loss of amenity, non-pecuniary. No provable loss: <tspan font-weight="700" fill="#1e2a44">nominal</tspan></text><text x="46" y="228.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">damages</tspan></text><line x1="450" y1="253" x2="450" y2="273" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="293" width="270" height="177" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="44" y="319" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">1  CAUSATION</text><text x="44" y="344.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Was the breach an effective</text><text x="44" y="365.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">cause?</text><text x="44" y="392" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">✗ <tspan font-style="italic">Quinn</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Burch</tspan> <tspan font-style="italic">Brothers</tspan> (1966):</text><text x="44" y="412" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">no stepladder, used an unfooted</text><text x="44" y="432" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">trestle and fell: breach the</text><text x="44" y="452" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">occasion, not the cause</text><rect x="315" y="293" width="270" height="177" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="329" y="319" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">2  REMOTENESS</text><text x="329" y="344.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Within <tspan font-style="italic">Hadley</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Baxendale</tspan></text><text x="329" y="365.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">(1854)?</text><text x="329" y="392" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Arising naturally, or in both</text><text x="329" y="412" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">parties’ reasonable contemplation</text><text x="329" y="432" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">when</tspan> <tspan font-weight="700" fill="#1e2a44">the</tspan> <tspan font-weight="700" fill="#1e2a44">contract</tspan> <tspan font-weight="700" fill="#1e2a44">was</tspan> <tspan font-weight="700" fill="#1e2a44">made</tspan></text><rect x="600" y="293" width="270" height="177" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="614" y="319" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">3  MITIGATION</text><text x="614" y="344.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Did the claimant take</text><text x="614" y="365.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">reasonable steps?</text><text x="614" y="392" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Loss reasonably avoidable is not</text><text x="614" y="412" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">recoverable (<tspan font-style="italic">British</tspan></text><text x="614" y="432" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Westinghouse</tspan>, 1912)</text><line x1="450" y1="474" x2="450" y2="494" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="170" y="514" width="560" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="544.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Recoverable compensatory damages</text><text x="450" y="573.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Available as of right once breach and loss are shown; not punitive</text>
</svg>