<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 525" width="900" height="525" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="525" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Remoteness: the two limbs of Hadley v Baxendale</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Judged at the time the contract was made, not the time of breach</text>
<rect x="30" y="124" width="411" height="125" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="152" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">LIMB 1</text><text x="46" y="178.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Losses arising naturally</text><text x="46" y="206" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">In the usual course of things. “Not unlikely” to result:</text><text x="46" y="226" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">The</tspan> <tspan font-style="italic">Heron</tspan> <tspan font-style="italic">II</tspan> (1969), fall in the sugar market</text><rect x="459" y="124" width="411" height="125" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="475" y="152" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">LIMB 2</text><text x="475" y="178.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Losses both parties reasonably</text><text x="475" y="201.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">contemplated</text><text x="475" y="229" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Because of <tspan font-weight="700" fill="#1e2a44">special</tspan> <tspan font-weight="700" fill="#1e2a44">knowledge</tspan> shared at contracting</text><rect x="30" y="267" width="413" height="97" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="45" y="294" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">✗ HADLEY v BAXENDALE (1854)</text><text x="45" y="325" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Delayed crankshaft: mill’s lost profit too remote;</text><text x="45" y="345" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">carrier did not know there was no spare</text><rect x="457" y="267" width="413" height="97" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="472" y="294" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">VICTORIA LAUNDRY (1949)</text><text x="472" y="325" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Late boiler: ordinary profits ✓; especially lucrative</text><text x="472" y="345" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">dyeing contracts, unknown to the seller ✗</text><rect x="30" y="376" width="413" height="117" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="45" y="403" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">✓ PARSONS v UTTLEY INGHAM (1978)</text><text x="45" y="434" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Type of loss (illness) contemplated, so full extent</text><text x="45" y="454" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">recovered: the pigs died</text><rect x="457" y="376" width="413" height="117" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="472" y="403" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">THE ACHILLEAS (2008)</text><text x="472" y="434" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Did the defendant <tspan font-weight="700" fill="#1e2a44">assume</tspan> <tspan font-weight="700" fill="#1e2a44">responsibility</tspan>? Market</text><text x="472" y="454" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">rate for the overrun only, not the lost follow-on</text><text x="472" y="474" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">charter</text>
</svg>