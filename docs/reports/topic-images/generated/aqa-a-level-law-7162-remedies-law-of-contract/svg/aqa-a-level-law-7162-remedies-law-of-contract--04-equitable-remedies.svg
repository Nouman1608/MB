<rect width="900" height="557" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Equitable remedies: discretionary, not as of right</text>

<rect x="30" y="100" width="411" height="125" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="128" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SPECIFIC PERFORMANCE</text><text x="46" y="154.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Carry out the contract</text><text x="46" y="183.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Only where <tspan font-weight="700" fill="#1e2a44">damages</tspan> <tspan font-weight="700" fill="#1e2a44">are</tspan> <tspan font-weight="700" fill="#1e2a44">inadequate</tspan></text><rect x="459" y="100" width="411" height="125" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="475" y="128" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">RESCISSION</text><text x="475" y="154.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Set aside from the start</text><text x="475" y="183.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Restores pre-contract positions. Main remedy for</text><text x="475" y="204.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">misrepresentation</tspan> and <tspan font-weight="700" fill="#1e2a44">economic</tspan> <tspan font-weight="700" fill="#1e2a44">duress</tspan></text><rect x="30" y="243" width="411" height="135" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="44" y="269" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">✓ GRANTED</text><text x="44" y="300" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Land</tspan>, treated as unique. <tspan font-weight="700" fill="#1e2a44">Unique</tspan> <tspan font-weight="700" fill="#1e2a44">goods</tspan>: <tspan font-style="italic">Falcke</tspan> <tspan font-style="italic">v</tspan></text><text x="44" y="320" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Gray</tspan> (1859), rare china vases. <tspan font-style="italic">Beswick</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Beswick</tspan></text><text x="44" y="340" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">(1968): annuity for a widow, damages to the estate</text><text x="44" y="360" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">nominal</text><rect x="30" y="390" width="411" height="135" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="44" y="416" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">✗ REFUSED</text><text x="44" y="447" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Personal service; <tspan font-weight="700" fill="#1e2a44">constant</tspan> <tspan font-weight="700" fill="#1e2a44">supervision</tspan></text><text x="44" y="467" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">(<tspan font-style="italic">Co-operative</tspan> <tspan font-style="italic">Insurance</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Argyll</tspan>, 1997: keep a</text><text x="44" y="487" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">supermarket open); <tspan font-weight="700" fill="#1e2a44">severe</tspan> <tspan font-weight="700" fill="#1e2a44">hardship</tspan> (<tspan font-style="italic">Patel</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Ali</tspan>,</text><text x="44" y="507" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">1984); unfairness or delay</text><rect x="459" y="243" width="411" height="282" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="475" y="271" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">✗ RESCISSION LOST BY</text><text x="475" y="302.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="490.2" y="302.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Affirmation</text><text x="475" y="329.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="490.2" y="329.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Lapse of time</text><text x="475" y="356.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="490.2" y="356.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Intervening third-party rights</text><text x="475" y="383.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="490.2" y="383.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Restitution impossible</text>
</svg>