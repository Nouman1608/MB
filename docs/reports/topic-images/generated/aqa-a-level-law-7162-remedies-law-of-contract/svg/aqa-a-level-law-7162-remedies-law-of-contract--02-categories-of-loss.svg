<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 447" width="900" height="447" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="447" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Categories of recoverable loss</text>

<rect x="30" y="100" width="413" height="97" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="45" y="127" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EXPECTATION</text><text x="45" y="158" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">The value of the promised performance: price</text><text x="45" y="178" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">difference or lost profit (<tspan font-style="italic">Robinson</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Harman</tspan>)</text><rect x="457" y="100" width="413" height="97" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="472" y="127" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">RELIANCE</text><text x="472" y="158" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Wasted expenditure where profit is speculative.</text><text x="472" y="178" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Anglia</tspan> <tspan font-style="italic">TV</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Reed</tspan> (1972): pre- and post-contract costs</text><rect x="30" y="209" width="413" height="97" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="45" y="236" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">LOSS OF A CHANCE</text><text x="45" y="267" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Chaplin</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Hicks</tspan> (1911): denied the final interview of a</text><text x="45" y="287" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">beauty contest</text><rect x="457" y="209" width="413" height="97" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="472" y="236" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">LOSS OF AMENITY</text><text x="472" y="267" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Ruxley</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Forsyth</tspan> (1996): pool too shallow but safe;</text><text x="472" y="287" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">rebuilding unreasonable; £2,500 for lost amenity</text><rect x="30" y="318" width="413" height="97" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="45" y="345" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">NON-PECUNIARY: GENERALLY NO</text><text x="45" y="376" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Addis</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Gramophone</tspan> (1909): no damages for distress</text><rect x="457" y="318" width="413" height="97" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="472" y="345" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">NON-PECUNIARY: PLEASURE CONTRACTS</text><text x="472" y="376" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Jarvis</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Swans</tspan> <tspan font-style="italic">Tours</tspan> (1973): holiday. <tspan font-style="italic">Farley</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Skinner</tspan></text><text x="472" y="396" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">(2001): aircraft noise not reported</text>
</svg>