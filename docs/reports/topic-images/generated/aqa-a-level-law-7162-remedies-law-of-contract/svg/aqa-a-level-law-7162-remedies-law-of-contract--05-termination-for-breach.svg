<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 724" width="900" height="724" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="724" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Termination for breach</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">A self-help remedy: no need to go to court</text>
<rect x="30" y="124" width="272" height="155" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="150" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">BREACH OF A CONDITION</text><text x="44" y="181" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Poussard</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Spiers</tspan> (1876)</text><rect x="314" y="124" width="272" height="155" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="328" y="150" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">INNOMINATE TERM</text><text x="328" y="181" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Serious breach: deprives of</text><text x="328" y="201" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">substantially the whole benefit</text><text x="328" y="221" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">(<tspan font-style="italic">Hong</tspan> <tspan font-style="italic">Kong</tspan> <tspan font-style="italic">Fir</tspan>, 1962). Not a</text><text x="328" y="241" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">minor breach (<tspan font-style="italic">The</tspan> <tspan font-style="italic">Hansa</tspan> <tspan font-style="italic">Nord</tspan>,</text><text x="328" y="261" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">1976)</text><rect x="598" y="124" width="272" height="155" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="612" y="150" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">RENUNCIATION</text><text x="612" y="181" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Including anticipatory breach</text><line x1="450" y1="281" x2="450" y2="301" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="462" y="295" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">innocent party must elect</text><rect x="30" y="315" width="411" height="103" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="343" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">TERMINATE</text><text x="46" y="369.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Both parties’ future obligations end</text><text x="46" y="397.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Damages for loss of the bargain</text><rect x="459" y="315" width="411" height="103" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="475" y="343" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">AFFIRM</text><text x="475" y="369.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The contract stays alive</text><text x="475" y="397.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Damages for the breach</text><rect x="30" y="436" width="840" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="466" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">RESCISSION OR TERMINATION?</text><line x1="120" y1="488" x2="840" y2="488" stroke="#1e2a44" stroke-width="3"/><line x1="120" y1="474" x2="120" y2="502" stroke="#1e2a44" stroke-width="3"/><text x="120" y="522" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">contract made</text><line x1="520" y1="474" x2="520" y2="502" stroke="#1e2a44" stroke-width="3"/><text x="520" y="522" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">remedy used</text><line x1="510" y1="554" x2="126" y2="554" stroke="#8a6d0d" stroke-width="4" marker-end="url(#ahO)"/><text x="315" y="578" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">rescission: undone from the start</text><line x1="530" y1="554" x2="836" y2="554" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><text x="685" y="578" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">termination: ends the future</text><rect x="30" y="604" width="840" height="88" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="638.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Consumers</text><text x="50" y="667.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Consumer Rights Act 2015: the short-term and final rights to reject goods end the contract with a refund.</text>
</svg>