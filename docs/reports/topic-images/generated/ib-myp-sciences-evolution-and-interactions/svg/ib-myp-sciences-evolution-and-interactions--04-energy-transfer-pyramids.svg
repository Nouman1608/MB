<rect width="900" height="930" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Energy through a food chain</text>

<rect x="30" y="110" width="840" height="400" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="220" y="400" width="480" height="76" fill="#6f9a52" stroke="#1e2a44" stroke-width="2.5"/><text x="70" y="434" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Producers</text><text x="70" y="458" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">level 1</text><text x="460" y="446" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">24 000</text><rect x="330" y="308" width="260" height="76" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="70" y="342" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Primary consumers</text><text x="70" y="366" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">level 2</text><text x="460" y="354" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">2160</text><rect x="415" y="216" width="90" height="76" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="70" y="250" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Secondary consumers</text><text x="70" y="274" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">level 3</text><text x="460" y="262" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">216</text><text x="460" y="160" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">kJ m⁻² year⁻¹</text><line x1="750" y1="420" x2="750" y2="340" stroke="#8a6d0d" stroke-width="3" marker-end="url(#ahO)"/><text x="762" y="385" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="start">9.0%</text><line x1="750" y1="328" x2="750" y2="248" stroke="#8a6d0d" stroke-width="3" marker-end="url(#ahO)"/><text x="762" y="293" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="start">10%</text><text x="700" y="200" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">efficiency =</text><text x="700" y="220" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">passed on ÷ in × 100</text><rect x="30" y="530" width="840" height="120" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="60" y="568" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Where the rest goes</text><rect x="60" y="588" width="250" height="44" rx="10" fill="#fff" stroke="#8a6d0d" stroke-width="2.2"/><text x="185" y="615.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">heat from respiration</text><rect x="325" y="588" width="180" height="44" rx="10" fill="#fff" stroke="#8a6d0d" stroke-width="2.2"/><text x="415" y="615.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">movement</text><rect x="520" y="588" width="320" height="44" rx="10" fill="#fff" stroke="#8a6d0d" stroke-width="2.2"/><text x="680" y="615.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">parts not eaten or digested</text><rect x="30" y="690" width="840" height="220" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="170" y="726" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Energy</text><text x="170" y="890" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">always pyramid-shaped</text><rect x="70" y="840" width="200" height="30" fill="#6f9a52" stroke="#1e2a44" stroke-width="2"/><rect x="115" y="806" width="110" height="30" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><rect x="150" y="772" width="40" height="30" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="450" y="726" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Numbers</text><text x="450" y="890" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">one oak, thousands of caterpillars</text><rect x="432" y="840" width="36" height="30" fill="#6f9a52" stroke="#1e2a44" stroke-width="2"/><rect x="345" y="806" width="210" height="30" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><rect x="405" y="772" width="90" height="30" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="730" y="726" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Biomass</text><text x="730" y="890" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">usually upright</text><rect x="635" y="840" width="190" height="30" fill="#6f9a52" stroke="#1e2a44" stroke-width="2"/><rect x="675" y="806" width="110" height="30" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><rect x="705" y="772" width="50" height="30" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/>
</svg>