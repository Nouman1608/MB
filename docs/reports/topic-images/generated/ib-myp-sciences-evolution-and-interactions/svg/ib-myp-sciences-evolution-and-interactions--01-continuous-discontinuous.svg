<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" width="900" height="760" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="760" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Two kinds of variation</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Bar heights are illustrative</text>
<rect x="30" y="110" width="410" height="470" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="460" y="110" width="410" height="470" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="235" y="150" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Continuous</text><text x="235" y="176" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">any value in a range, e.g. height</text><text x="665" y="150" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Discontinuous</text><text x="665" y="176" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">distinct groups, e.g. ABO blood group</text><line x1="90" y1="470" x2="410" y2="470" stroke="#1e2a44" stroke-width="3"/><line x1="90" y1="470" x2="90" y2="220" stroke="#1e2a44" stroke-width="3"/><text x="250" y="504" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">height</text><text x="72" y="345" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle" transform="rotate(-90 72 345)">number of people</text><rect x="96" y="458" width="28" height="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="1.8"/><rect x="124" y="440" width="28" height="30" fill="#b5d3cf" stroke="#1e2a44" stroke-width="1.8"/><rect x="152" y="408" width="28" height="62" fill="#b5d3cf" stroke="#1e2a44" stroke-width="1.8"/><rect x="180" y="365" width="28" height="105" fill="#b5d3cf" stroke="#1e2a44" stroke-width="1.8"/><rect x="208" y="320" width="28" height="150" fill="#b5d3cf" stroke="#1e2a44" stroke-width="1.8"/><rect x="236" y="292" width="28" height="178" fill="#b5d3cf" stroke="#1e2a44" stroke-width="1.8"/><rect x="264" y="320" width="28" height="150" fill="#b5d3cf" stroke="#1e2a44" stroke-width="1.8"/><rect x="292" y="365" width="28" height="105" fill="#b5d3cf" stroke="#1e2a44" stroke-width="1.8"/><rect x="320" y="408" width="28" height="62" fill="#b5d3cf" stroke="#1e2a44" stroke-width="1.8"/><rect x="348" y="440" width="28" height="30" fill="#b5d3cf" stroke="#1e2a44" stroke-width="1.8"/><rect x="376" y="458" width="28" height="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="1.8"/><path d="M96,466 C200,460 210,280 250,280 C290,280 300,460 404,466" fill="none" stroke="#b5602e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="235" y="545" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Histogram: bars touch;</text><text x="235" y="567" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">often bell-shaped</text><line x1="520" y1="470" x2="840" y2="470" stroke="#1e2a44" stroke-width="3"/><line x1="520" y1="470" x2="520" y2="220" stroke="#1e2a44" stroke-width="3"/><text x="680" y="504" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">blood group</text><text x="502" y="345" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle" transform="rotate(-90 502 345)">number of people</text><rect x="542" y="320" width="52" height="150" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="568" y="310" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">A</text><rect x="618" y="390" width="52" height="80" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="644" y="380" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">B</text><rect x="694" y="430" width="52" height="40" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="720" y="420" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">AB</text><rect x="770" y="300" width="52" height="170" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="796" y="290" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">O</text><text x="665" y="545" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Bar chart: bars separate;</text><text x="665" y="567" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">no in-between values</text><rect x="30" y="600" width="840" height="140" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="60" y="638" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Causes</text><text x="60" y="672" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Genetic:</text><text x="150" y="672" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">mutation makes new alleles; meiosis and random fertilisation reshuffle them.</text><text x="60" y="702" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="start">Environmental:</text><text x="200" y="702" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">diet, light, temperature, soil minerals.</text><text x="60" y="728" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Only genetic variation is passed to offspring, so only it matters for evolution.</text>
</svg>