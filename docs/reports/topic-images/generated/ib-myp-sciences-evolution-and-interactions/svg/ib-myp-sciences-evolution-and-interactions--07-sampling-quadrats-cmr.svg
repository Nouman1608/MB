-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">N = (48 × 60) ÷ 12</text><text x="610" y="652" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">= 2880 ÷ 12 = 240</text><text x="610" y="690" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Assumes: marks stay on and do</text><text x="610" y="710" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">no harm; marked animals mix;</text><text x="610" y="730" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">no big births, deaths or</text><text x="610" y="750" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">migration between samples.</text><text x="450" y="806" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Drawings show the proportions, not every animal.</text>
