<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three kinds of symbiosis</text>

<rect x="30" y="110" width="840" height="154" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="95" cy="187" r="34" fill="#fff" stroke="#2e6b62" stroke-width="4"/><text x="95" y="200" font-size="36" font-weight="700" fill="#2e6b62" text-anchor="middle">+</text><circle cx="185" cy="187" r="34" fill="#fff" stroke="#2e6b62" stroke-width="4"/><text x="185" y="200" font-size="36" font-weight="700" fill="#2e6b62" text-anchor="middle">+</text><line x1="129" y1="187" x2="151" y2="187" stroke="#1e2a44" stroke-width="3"/><text x="250" y="156" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="start">Mutualism</text><text x="250" y="184" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="start">both benefit</text><text x="250" y="214" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Rhizobium bacteria in legume root nodules fix nitrogen;</text><text x="250" y="236" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the plant supplies sugars.</text><rect x="30" y="280" width="840" height="154" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="95" cy="357" r="34" fill="#fff" stroke="#2e6b62" stroke-width="4"/><text x="95" y="370" font-size="36" font-weight="700" fill="#2e6b62" text-anchor="middle">+</text><circle cx="185" cy="357" r="34" fill="#fff" stroke="#4a5568" stroke-width="4"/><text x="185" y="370" font-size="36" font-weight="700" fill="#4a5568" text-anchor="middle">0</text><line x1="129" y1="357" x2="151" y2="357" stroke="#1e2a44" stroke-width="3"/><text x="250" y="326" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="start">Commensalism</text><text x="250" y="354" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="start">one benefits, other unaffected</text><text x="250" y="384" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Barnacles on a whale gain transport and feeding</text><text x="250" y="406" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">opportunities.</text><rect x="30" y="450" width="840" height="154" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="95" cy="527" r="34" fill="#fff" stroke="#2e6b62" stroke-width="4"/><text x="95" y="540" font-size="36" font-weight="700" fill="#2e6b62" text-anchor="middle">+</text><circle cx="185" cy="527" r="34" fill="#fff" stroke="#b5602e" stroke-width="4"/><text x="185" y="540" font-size="36" font-weight="700" fill="#b5602e" text-anchor="middle">−</text><line x1="129" y1="527" x2="151" y2="527" stroke="#1e2a44" stroke-width="3"/><text x="250" y="496" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="start">Parasitism</text><text x="250" y="524" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="start">one benefits, host harmed</text><text x="250" y="554" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A tapeworm absorbs digested food in its host’s gut.</text><text x="450" y="630" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Symbiosis: a close, long-term relationship between two species. Always say which type.</text>
</svg>