<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="700" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Holiday past tense: which pattern?</text>

<rect x="290" y="108" width="320" height="60" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="145" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">A past-tense verb</text><path d="M450,168 V190 H235 V212" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><path d="M450,190 H665 V212" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><rect x="30" y="220" width="410" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="235" y="256" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Intransitive or habitual</text><text x="235" y="282" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">go, come, stay; used to ...</text><text x="235" y="326" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">no ergative: agrees with subject</text><rect x="460" y="220" width="410" height="130" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="665" y="256" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Transitive, simple past</text><text x="665" y="282" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">see, do, eat</text><text x="665" y="326" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">ergative: agrees with object</text><rect x="30" y="366" width="410" height="310" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="60" cy="412" r="15" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><path d="M53,412 l5,6 l10,-12" fill="none" stroke="#2e6b62" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><text x="420" y="422" font-family="Noto Nastaliq Urdu" font-size="25" font-weight="400" fill="#1e2a44" text-anchor="end">‏ہم ٹرین سے لاہور گئے۔‏</text><text x="420" y="452" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">We went to Lahore by train.</text><circle cx="60" cy="512" r="15" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><path d="M53,512 l5,6 l10,-12" fill="none" stroke="#2e6b62" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><text x="420" y="522" font-family="Noto Nastaliq Urdu" font-size="25" font-weight="400" fill="#1e2a44" text-anchor="end">‏ہر روز ہم ساحل پر جاتے تھے۔‏</text><text x="420" y="552" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">Every day we used to go to the beach.</text><circle cx="60" cy="612" r="15" fill="#f6ece4" stroke="#b5602e" stroke-width="2.5"/><path d="M54,606 l12,12 m0,-12 l-12,12" fill="none" stroke="#b5602e" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><text x="420" y="622" font-family="Noto Nastaliq Urdu" font-size="25" font-weight="400" fill="#b5602e" text-anchor="end">‏ہم نے لاہور گئے‏</text><text x="420" y="652" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">wrong: going takes no ergative</text><rect x="460" y="366" width="410" height="310" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="490" cy="412" r="15" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><path d="M483,412 l5,6 l10,-12" fill="none" stroke="#2e6b62" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><text x="850" y="422" font-family="Noto Nastaliq Urdu" font-size="25" font-weight="400" fill="#1e2a44" text-anchor="end">‏ہم نے بادشاہی مسجد دیکھی۔‏</text><text x="850" y="452" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">We saw the Badshahi Mosque (mosque is f).</text><circle cx="490" cy="512" r="15" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><path d="M483,512 l5,6 l10,-12" fill="none" stroke="#2e6b62" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><text x="850" y="522" font-family="Noto Nastaliq Urdu" font-size="25" font-weight="400" fill="#1e2a44" text-anchor="end">‏ہم نے اونٹ کی سواری کی‏</text><text x="850" y="552" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">We rode a camel.</text><circle cx="490" cy="612" r="15" fill="#f6ece4" stroke="#b5602e" stroke-width="2.5"/><path d="M484,606 l12,12 m0,-12 l-12,12" fill="none" stroke="#b5602e" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><text x="850" y="622" font-family="Noto Nastaliq Urdu" font-size="25" font-weight="400" fill="#b5602e" text-anchor="end">‏ہم نے مسجد دیکھا‏</text><text x="850" y="652" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">wrong: agree with the feminine object</text>
</svg>