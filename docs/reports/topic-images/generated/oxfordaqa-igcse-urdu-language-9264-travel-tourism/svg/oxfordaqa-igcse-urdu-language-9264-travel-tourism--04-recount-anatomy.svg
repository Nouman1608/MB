<text x="450" y="128" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Task: a blog post about a memorable trip</text><rect x="30" y="150" width="840" height="82" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="64" cy="191" r="19" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="64" y="197.84" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="96" y="186" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Past, no ergative</text><text x="96" y="211" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">intransitive</text><text x="846" y="204" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="end">‏ہم ... کراچی گئے / ساحلِ سمندر پر گئے‏</text><rect x="30" y="246" width="840" height="82" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="64" cy="287" r="19" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="64" y="293.84" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="96" y="282" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Past with ergative</text><text x="96" y="307" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">transitive</text><text x="846" y="300" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="end">‏ہم نے ... سفر کیا / ہم نے اونٹ کی سواری کی‏</text><rect x="30" y="342" width="840" height="82" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="64" cy="383" r="19" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="64" y="389.84" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="96" y="390" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Description</text><text x="846" y="396" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="end">‏سفر بہت آرام دہ تھا‏</text><rect x="30" y="438" width="840" height="82" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="64" cy="479" r="19" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="64" y="485.84" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="96" y="486" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Opinion + reason</text><text x="846" y="492" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="end">‏میرے خیال میں ... کیونکہ ...‏</text><rect x="30" y="534" width="840" height="82" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="64" cy="575" r="19" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="64" y="581.84" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="96" y="582" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Future wish</text><text x="846" y="588" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="end">‏اگلے سال ... سیر کرنا چاہتا ہوں‏</text><text x="450" y="662" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Every bullet answered, and three time frames: past events, an evaluation, a plan</text>
