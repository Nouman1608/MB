<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Travel and tourism at a glance</text>

<rect x="30" y="110" width="840" height="110" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="172" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Holidays and trips</text><rect x="704" y="115" width="150" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="779" y="161" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="middle">‏چھٹیاں‏</text><text x="779" y="199" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">holidays</text><rect x="546" y="115" width="150" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="621" y="161" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="middle">‏سیر کرنا‏</text><text x="621" y="199" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">to go sightseeing</text><rect x="388" y="115" width="150" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="463" y="161" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="middle">‏ٹھہرنا‏</text><text x="463" y="199" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">to stay</text><rect x="30" y="232" width="840" height="110" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="294" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Transport</text><rect x="704" y="237" width="150" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="779" y="283" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="middle">‏ہوائی جہاز‏</text><text x="779" y="321" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">aeroplane</text><rect x="546" y="237" width="150" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="621" y="283" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="middle">‏ٹرین‏</text><text x="621" y="321" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">train</text><rect x="388" y="237" width="150" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="463" y="283" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="middle">‏ہوائی اڈا‏</text><text x="463" y="321" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">airport</text><rect x="30" y="354" width="840" height="110" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="416" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Planning and booking</text><rect x="704" y="359" width="150" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="779" y="405" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="middle">‏ٹکٹ‏</text><text x="779" y="443" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">ticket</text><rect x="546" y="359" width="150" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="621" y="405" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="middle">‏ہوٹل‏</text><text x="621" y="443" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">hotel</text><rect x="388" y="359" width="150" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="463" y="405" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="middle">‏پاسپورٹ‏</text><text x="463" y="443" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">passport</text><rect x="30" y="476" width="840" height="110" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="538" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Destinations</text><rect x="704" y="481" width="150" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="779" y="527" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="middle">‏ساحلِ سمندر‏</text><text x="779" y="565" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">seaside, beach</text><rect x="546" y="481" width="150" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="621" y="527" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="middle">‏پہاڑ‏</text><text x="621" y="565" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">mountain</text><rect x="388" y="481" width="150" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="463" y="527" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="middle">‏عجائب گھر‏</text><text x="463" y="565" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">museum</text><rect x="30" y="598" width="840" height="196" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="52" y="634" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Tourism as an issue</text><text x="52" y="660" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">links to Global issues</text><rect x="400" y="618" width="450" height="74" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="832" y="662" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="end">‏سیاحت سے مقامی لوگوں کو روزگار ملتا ہے،‏</text><text x="388" y="662" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="end">benefit</text><rect x="400" y="702" width="450" height="74" rx="10" fill="#f6ece4" stroke="#b5602e" stroke-width="2"/><text x="832" y="746" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="end">‏لیکن اس سے آلودگی بھی بڑھتی ہے۔‏</text><text x="388" y="746" font-size="16" font-weight="700" fill="#b5602e" text-anchor="end">cost</text><text x="52" y="716" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">Tourism gives local people work,</text><text x="52" y="738" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">but it also increases pollution.</text>
