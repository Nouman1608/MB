<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 716" width="900" height="716" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="716" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Plan the time frames</text>

<rect x="30" y="110" width="840" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="166" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Past events</text><text x="846" y="160" font-family="Noto Nastaliq Urdu" font-size="26" font-weight="400" fill="#1e2a44" text-anchor="end">‏ہم ٹرین سے لاہور گئے۔‏</text><text x="846" y="196" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">We went to Lahore by train.</text><rect x="30" y="222" width="840" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="278" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Past description</text><text x="846" y="272" font-family="Noto Nastaliq Urdu" font-size="26" font-weight="400" fill="#1e2a44" text-anchor="end">‏موسم بہت گرم تھا۔‏</text><text x="846" y="308" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">The weather was very hot.</text><rect x="30" y="334" width="840" height="100" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="52" y="390" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Superlative judgement</text><text x="846" y="384" font-family="Noto Nastaliq Urdu" font-size="26" font-weight="400" fill="#1e2a44" text-anchor="end">‏یہ میری سب سے یادگار چھٹی تھی۔‏</text><text x="846" y="420" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">This was my most memorable holiday.</text><rect x="30" y="446" width="840" height="100" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="52" y="502" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Future plan</text><text x="846" y="496" font-family="Noto Nastaliq Urdu" font-size="26" font-weight="400" fill="#1e2a44" text-anchor="end">‏اگلے سال ہم مری جائیں گے۔‏</text><text x="846" y="532" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">Next year we will go to Murree.</text><rect x="30" y="558" width="840" height="100" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="52" y="614" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Unreal condition</text><text x="846" y="608" font-family="Noto Nastaliq Urdu" font-size="26" font-weight="400" fill="#1e2a44" text-anchor="end">‏اگر میرے پاس پیسے ہوتے تو میں ترکی جاتا۔‏</text><text x="846" y="644" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">If I had the money, I would go to Turkey.</text><text x="450" y="690" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Before writing, mark which bullet needs past, present, future or a condition</text>
</svg>