<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 775" width="900" height="775" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="775" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What pushes the birth rate up or down?</text>

<text x="240" y="140" font-size="19" font-weight="700" fill="#b5602e" text-anchor="middle">▲ Pushes birth rate UP</text><text x="660" y="140" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">▼ Pushes birth rate DOWN</text><rect x="30" y="160" width="380" height="84" rx="12" fill="#f6e6dc" stroke="#b5602e" stroke-width="2"/><rect x="490" y="160" width="380" height="84" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="220" y="198" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">children work on farms, support parents</text><text x="220" y="218" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">in old age</text><text x="680" y="198" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">children costly to educate and house in</text><text x="680" y="218" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">cities</text><rect x="390" y="182" width="120" height="40" rx="20" fill="#1e2a44" stroke="#1e2a44" stroke-width="2"/><text x="450" y="208" font-size="15.5" font-weight="700" fill="#ffffff" text-anchor="middle">Economic</text><rect x="30" y="258" width="380" height="84" rx="12" fill="#f6e6dc" stroke="#b5602e" stroke-width="2"/><rect x="490" y="258" width="380" height="84" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="220" y="306" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">early marriage; low status of women</text><text x="680" y="296" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">women in education and paid work; later</text><text x="680" y="316" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">marriage</text><rect x="390" y="280" width="120" height="40" rx="20" fill="#1e2a44" stroke="#1e2a44" stroke-width="2"/><text x="450" y="306" font-size="15.5" font-weight="700" fill="#ffffff" text-anchor="middle">Social</text><rect x="30" y="356" width="380" height="84" rx="12" fill="#f6e6dc" stroke="#b5602e" stroke-width="2"/><rect x="490" y="356" width="380" height="84" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="220" y="394" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">high infant mortality: more births to</text><text x="220" y="414" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">“replace” losses</text><text x="680" y="394" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">low infant mortality; access to</text><text x="680" y="414" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">contraception</text><rect x="390" y="378" width="120" height="40" rx="20" fill="#1e2a44" stroke="#1e2a44" stroke-width="2"/><text x="450" y="404" font-size="15.5" font-weight="700" fill="#ffffff" text-anchor="middle">Health</text><rect x="30" y="454" width="380" height="84" rx="12" fill="#f6e6dc" stroke="#b5602e" stroke-width="2"/><rect x="490" y="454" width="380" height="84" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="220" y="502" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">beliefs that value large families</text><text x="680" y="492" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">more secular attitudes; smaller family</text><text x="680" y="512" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">norms</text><rect x="390" y="476" width="120" height="40" rx="20" fill="#1e2a44" stroke="#1e2a44" stroke-width="2"/><text x="450" y="502" font-size="15.5" font-weight="700" fill="#ffffff" text-anchor="middle">Cultural</text><rect x="30" y="552" width="380" height="84" rx="12" fill="#f6e6dc" stroke="#b5602e" stroke-width="2"/><rect x="490" y="552" width="380" height="84" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="220" y="600" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">pro-natalist incentives</text><text x="680" y="600" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">anti-natalist campaigns and limits</text><rect x="390" y="574" width="120" height="40" rx="20" fill="#1e2a44" stroke="#1e2a44" stroke-width="2"/><text x="450" y="600" font-size="15.5" font-weight="700" fill="#ffffff" text-anchor="middle">Political</text><rect x="30" y="660" width="840" height="92" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="55" y="694" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="start">Death rates differ with healthcare, diet, water and sanitation, conflict and disease.</text><text x="55" y="724" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">An ageing rich country can have a higher crude death rate than a poorer, younger one.</text>
</svg>