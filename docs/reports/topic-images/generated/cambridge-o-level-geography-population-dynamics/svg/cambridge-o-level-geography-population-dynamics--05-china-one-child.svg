<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="620" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Evaluating a policy: China’s one-child policy</text>

<line x1="90" y1="160" x2="810" y2="160" stroke="#1e2a44" stroke-width="4"/><circle cx="90" cy="160" r="11" fill="#b5602e" stroke="#1e2a44" stroke-width="2.5"/><text x="90" y="136" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">c. 1979–80</text><text x="90" y="192" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">one-child policy</text><circle cx="560" cy="160" r="11" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="560" y="136" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">2016</text><text x="560" y="192" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="middle">two-child policy</text><circle cx="810" cy="160" r="11" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="810" y="136" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">2021</text><text x="810" y="192" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="end">three-child policy</text><rect x="30" y="225" width="520" height="84" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="64" cy="267" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="64" y="273.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="96" y="257" font-size="17.5" font-weight="700" fill="#1e2a44" text-anchor="start">Did it change the birth rate?</text><text x="96" y="281" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Growth slowed, but the birth rate was already falling</text><text x="96" y="300" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">before the policy began.</text><rect x="30" y="321" width="520" height="84" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="64" cy="363" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="64" y="369.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="96" y="353" font-size="17.5" font-weight="700" fill="#1e2a44" text-anchor="start">Unintended consequences?</text><text x="96" y="377" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">More boys than girls; rapid ageing; the 4-2-1 family.</text><rect x="30" y="417" width="520" height="84" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="64" cy="459" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="64" y="465.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="96" y="449" font-size="17.5" font-weight="700" fill="#1e2a44" text-anchor="start">Was it acceptable?</text><text x="96" y="473" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Coercive measures raised serious human rights</text><text x="96" y="492" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">concerns.</text><rect x="30" y="513" width="520" height="84" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="64" cy="555" r="18" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="64" y="561.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="96" y="545" font-size="17.5" font-weight="700" fill="#1e2a44" text-anchor="start">Overall judgement</text><text x="96" y="569" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Effective at slowing growth, but at a social and</text><text x="96" y="588" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">demographic cost that forced reversal.</text><rect x="570" y="225" width="300" height="372" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="720" y="260" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">The 4-2-1 family</text><circle cx="605" cy="317.7" r="6.6499999999999995" fill="#4a5568"/><path d="M596.45,350 L596.45,334.8 Q596.45,326.25 605,326.25 Q613.55,326.25 613.55,334.8 L613.55,350 Z" fill="#4a5568"/><circle cx="673" cy="317.7" r="6.6499999999999995" fill="#4a5568"/><path d="M664.45,350 L664.45,334.8 Q664.45,326.25 673,326.25 Q681.55,326.25 681.55,334.8 L681.55,350 Z" fill="#4a5568"/><circle cx="777" cy="317.7" r="6.6499999999999995" fill="#4a5568"/><path d="M768.45,350 L768.45,334.8 Q768.45,326.25 777,326.25 Q785.55,326.25 785.55,334.8 L785.55,350 Z" fill="#4a5568"/><circle cx="845" cy="317.7" r="6.6499999999999995" fill="#4a5568"/><path d="M836.45,350 L836.45,334.8 Q836.45,326.25 845,326.25 Q853.55,326.25 853.55,334.8 L853.55,350 Z" fill="#4a5568"/><text x="720" y="372" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">4 grandparents</text><circle cx="690" cy="424.3" r="7.3500000000000005" fill="#2e6b62"/><path d="M680.55,460 L680.55,443.2 Q680.55,433.75 690,433.75 Q699.45,433.75 699.45,443.2 L699.45,460 Z" fill="#2e6b62"/><circle cx="760" cy="424.3" r="7.3500000000000005" fill="#2e6b62"/><path d="M750.55,460 L750.55,443.2 Q750.55,433.75 760,433.75 Q769.45,433.75 769.45,443.2 L769.45,460 Z" fill="#2e6b62"/><text x="725" y="482" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">2 parents</text><circle cx="725" cy="520.9" r="8.049999999999999" fill="#b5602e"/><path d="M714.65,560 L714.65,541.6 Q714.65,531.25 725,531.25 Q735.35,531.25 735.35,541.6 L735.35,560 Z" fill="#b5602e"/><text x="725" y="585" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">1 adult child supports all six</text><line x1="640" y1="380" x2="690" y2="420" stroke="#4a5568" stroke-width="1.8"/><line x1="810" y1="380" x2="760" y2="420" stroke="#4a5568" stroke-width="1.8"/><line x1="700" y1="490" x2="720" y2="515" stroke="#4a5568" stroke-width="1.8"/><line x1="750" y1="490" x2="730" y2="515" stroke="#4a5568" stroke-width="1.8"/>
</svg>