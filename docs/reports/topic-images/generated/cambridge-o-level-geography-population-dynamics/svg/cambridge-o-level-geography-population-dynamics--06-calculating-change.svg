<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 545" width="900" height="545" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="545" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: from rates to people</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Illustrative figures</text>
<rect x="30" y="120" width="190" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="125" y="154" font-size="16" font-weight="700" fill="#4a5568" text-anchor="middle">Birth rate per 1,000</text><text x="125" y="190" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="middle">32</text><text x="240" y="180" font-size="30" font-weight="700" fill="#1e2a44" text-anchor="middle">−</text><rect x="260" y="120" width="190" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="355" y="154" font-size="16" font-weight="700" fill="#4a5568" text-anchor="middle">Death rate per 1,000</text><text x="355" y="190" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="middle">9</text><text x="470" y="180" font-size="30" font-weight="700" fill="#1e2a44" text-anchor="middle">=</text><rect x="490" y="120" width="380" height="100" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="680" y="154" font-size="16" font-weight="700" fill="#4a5568" text-anchor="middle">Natural change</text><text x="680" y="190" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="middle">23 per 1,000 = 2.3%</text><line x1="680" y1="224" x2="680" y2="262" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="665" y="250" font-size="16" font-weight="700" fill="#b5602e" text-anchor="end">+ net migration (−2 per 1,000)</text><rect x="490" y="268" width="380" height="100" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="680" y="302" font-size="16" font-weight="700" fill="#4a5568" text-anchor="middle">Total change</text><text x="680" y="338" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="middle">21 per 1,000 = 2.1%</text><line x1="680" y1="372" x2="680" y2="410" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="665" y="398" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">× population of 40 million</text><rect x="490" y="416" width="380" height="100" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="680" y="450" font-size="16" font-weight="700" fill="#4a5568" text-anchor="middle">Yearly increase</text><text x="680" y="486" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="middle">840,000 people</text><text x="40" y="300" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Per 1,000 → %: divide by 10.</text><text x="40" y="350" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">40,000,000 × 21 ÷ 1,000 = 840,000</text><text x="40" y="420" font-size="17" font-weight="600" fill="#b5602e" text-anchor="start">Stopping at natural change misses the</text><text x="40" y="442" font-size="17" font-weight="600" fill="#b5602e" text-anchor="start">migration step.</text>
</svg>