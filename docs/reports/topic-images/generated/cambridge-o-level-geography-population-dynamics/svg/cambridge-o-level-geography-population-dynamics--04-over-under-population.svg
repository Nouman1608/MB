<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Over-, optimum and under-population</text>

<rect x="30" y="110" width="270" height="480" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="165" y="146" font-size="20" font-weight="700" fill="#b5602e" text-anchor="middle">Over-population</text><path d="M135,360 L165,330 L195,360 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2"/><line x1="165" y1="330" x2="165" y2="250" stroke="#1e2a44" stroke-width="4"/><line x1="86.92820405355155" y1="267.45836984646957" x2="243.07179594644845" y2="232.54163015353046" stroke="#1e2a44" stroke-width="5"/><line x1="86.92820405355155" y1="267.45836984646957" x2="56.92820405355155" y2="307.45836984646957" stroke="#1e2a44" stroke-width="1.6"/><line x1="86.92820405355155" y1="267.45836984646957" x2="116.92820405355155" y2="307.45836984646957" stroke="#1e2a44" stroke-width="1.6"/><path d="M50.92820405355155,307.45836984646957 L122.92820405355155,307.45836984646957 Q86.92820405355155,329.45836984646957 50.92820405355155,307.45836984646957 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="86.92820405355155" y="353.45836984646957" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="middle">people</text><line x1="243.07179594644845" y1="232.54163015353046" x2="213.07179594644845" y2="272.5416301535305" stroke="#1e2a44" stroke-width="1.6"/><line x1="243.07179594644845" y1="232.54163015353046" x2="273.07179594644845" y2="272.5416301535305" stroke="#1e2a44" stroke-width="1.6"/><path d="M207.07179594644845,272.5416301535305 L279.07179594644845,272.5416301535305 Q243.07179594644845,294.5416301535305 207.07179594644845,272.5416301535305 Z" fill="#efdfa8" stroke="#1e2a44" stroke-width="2"/><text x="243.07179594644845" y="318.5416301535305" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="middle">resources</text><text x="50" y="400" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Too many people for the</text><text x="50" y="421" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">resources and technology:</text><text x="50" y="442" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">food shortages,</text><text x="50" y="463" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">unemployment, overcrowding.</text><rect x="46" y="500" width="238" height="74" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="165" y="528" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">often used: Bangladesh</text><rect x="315" y="110" width="270" height="480" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="146" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle">Optimum</text><path d="M420,360 L450,330 L480,360 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2"/><line x1="450" y1="330" x2="450" y2="250" stroke="#1e2a44" stroke-width="4"/><line x1="370" y1="250" x2="530" y2="250" stroke="#1e2a44" stroke-width="5"/><line x1="370" y1="250" x2="340" y2="290" stroke="#1e2a44" stroke-width="1.6"/><line x1="370" y1="250" x2="400" y2="290" stroke="#1e2a44" stroke-width="1.6"/><path d="M334,290 L406,290 Q370,312 334,290 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="370" y="336" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="middle">people</text><line x1="530" y1="250" x2="500" y2="290" stroke="#1e2a44" stroke-width="1.6"/><line x1="530" y1="250" x2="560" y2="290" stroke="#1e2a44" stroke-width="1.6"/><path d="M494,290 L566,290 Q530,312 494,290 Z" fill="#efdfa8" stroke="#1e2a44" stroke-width="2"/><text x="530" y="336" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="middle">resources</text><text x="335" y="400" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The number giving the</text><text x="335" y="421" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">highest standard of living</text><text x="335" y="442" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">with the resources and</text><text x="335" y="463" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">technology.</text><rect x="331" y="500" width="238" height="74" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="450" y="528" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">a balance point</text><rect x="600" y="110" width="270" height="480" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="735" y="146" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="middle">Under-population</text><path d="M705,360 L735,330 L765,360 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2"/><line x1="735" y1="330" x2="735" y2="250" stroke="#1e2a44" stroke-width="4"/><line x1="656.9282040535516" y1="232.54163015353046" x2="813.0717959464484" y2="267.45836984646957" stroke="#1e2a44" stroke-width="5"/><line x1="656.9282040535516" y1="232.54163015353046" x2="626.9282040535516" y2="272.5416301535305" stroke="#1e2a44" stroke-width="1.6"/><line x1="656.9282040535516" y1="232.54163015353046" x2="686.9282040535516" y2="272.5416301535305" stroke="#1e2a44" stroke-width="1.6"/><path d="M620.9282040535516,272.5416301535305 L692.9282040535516,272.5416301535305 Q656.9282040535516,294.5416301535305 620.9282040535516,272.5416301535305 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="656.9282040535516" y="318.5416301535305" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="middle">people</text><line x1="813.0717959464484" y1="267.45836984646957" x2="783.0717959464484" y2="307.45836984646957" stroke="#1e2a44" stroke-width="1.6"/><line x1="813.0717959464484" y1="267.45836984646957" x2="843.0717959464484" y2="307.45836984646957" stroke="#1e2a44" stroke-width="1.6"/><path d="M777.0717959464484,307.45836984646957 L849.0717959464484,307.45836984646957 Q813.0717959464484,329.45836984646957 777.0717959464484,307.45836984646957 Z" fill="#efdfa8" stroke="#1e2a44" stroke-width="2"/><text x="813.0717959464484" y="353.45836984646957" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="middle">resources</text><text x="620" y="400" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Too few people to use the</text><text x="620" y="421" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">resources: labour</text><text x="620" y="442" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">shortages, unused land or</text><text x="620" y="463" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">minerals.</text><rect x="616" y="500" width="238" height="74" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="735" y="528" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">often used: Australia</text><rect x="30" y="610" width="840" height="76" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="642" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">People compared with resources, not with area.</text><text x="450" y="668" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">The Netherlands is dense but wealthy enough to import food and resources.</text>
</svg>