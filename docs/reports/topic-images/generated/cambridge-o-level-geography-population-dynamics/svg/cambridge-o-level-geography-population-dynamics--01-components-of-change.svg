<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 755" width="900" height="755" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="755" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three flows change a population</text>

<rect x="320" y="200" width="260" height="200" rx="18" fill="#dce9e7" stroke="#2e6b62" stroke-width="3"/><text x="450" y="290" font-size="22" font-weight="700" fill="#2e6b62" text-anchor="middle">POPULATION</text><text x="450" y="318" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">of a country</text><circle cx="430" cy="342.8" r="5.6000000000000005" fill="#2e6b62"/><path d="M422.8,370 L422.8,357.2 Q422.8,350 430,350 Q437.2,350 437.2,357.2 L437.2,370 Z" fill="#2e6b62"/><circle cx="450" cy="342.8" r="5.6000000000000005" fill="#8a6d0d"/><path d="M442.8,370 L442.8,357.2 Q442.8,350 450,350 Q457.2,350 457.2,357.2 L457.2,370 Z" fill="#8a6d0d"/><circle cx="470" cy="342.8" r="5.6000000000000005" fill="#b5602e"/><path d="M462.8,370 L462.8,357.2 Q462.8,350 470,350 Q477.2,350 477.2,357.2 L477.2,370 Z" fill="#b5602e"/><line x1="150" y1="240" x2="312" y2="240" stroke="#2e6b62" stroke-width="8" marker-end="url(#ahT)"/><text x="70" y="232" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Births</text><text x="70" y="256" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">add</text><line x1="588" y1="240" x2="750" y2="240" stroke="#b5602e" stroke-width="8" marker-end="url(#ahR)"/><text x="760" y="232" font-size="20" font-weight="700" fill="#b5602e" text-anchor="start">Deaths</text><text x="760" y="256" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">remove</text><line x1="150" y1="360" x2="312" y2="360" stroke="#2e6b62" stroke-width="5" marker-end="url(#ahT)" stroke-dasharray="10 6"/><text x="50" y="352" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Immigrants</text><text x="50" y="376" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">arrive</text><line x1="588" y1="360" x2="750" y2="360" stroke="#b5602e" stroke-width="5" marker-end="url(#ahR)" stroke-dasharray="10 6"/><text x="760" y="352" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">Emigrants</text><text x="760" y="376" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">leave</text><text x="450" y="160" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Rates are given per 1,000 people per year</text><rect x="30" y="440" width="840" height="62" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="55" y="479" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Natural change</text><text x="260" y="479" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">= birth rate − death rate</text><text x="845" y="479" font-size="15" font-weight="400" fill="#b5602e" text-anchor="end" font-style="italic">can be negative: natural decrease</text><rect x="30" y="514" width="840" height="62" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="55" y="553" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Net migration</text><text x="260" y="553" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">= immigrants − emigrants</text><rect x="30" y="588" width="840" height="62" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="55" y="627" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Total change</text><text x="260" y="627" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">= natural change + net migration</text><rect x="30" y="670" width="840" height="64" rx="14" fill="#f6e6dc" stroke="#b5602e" stroke-width="2.5"/><text x="450" y="709" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Trap: infant mortality is per 1,000 live births, not per 1,000 people.</text>
</svg>