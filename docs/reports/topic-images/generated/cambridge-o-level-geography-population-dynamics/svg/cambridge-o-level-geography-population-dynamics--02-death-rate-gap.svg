<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="640" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why the world’s population grew so fast</text>

<rect x="30" y="110" width="560" height="410" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><line x1="80" y1="430" x2="560" y2="430" stroke="#1e2a44" stroke-width="2.5"/><line x1="80" y1="150" x2="80" y2="430" stroke="#1e2a44" stroke-width="2.5"/><text x="70" y="220" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">rate</text><text x="560" y="420" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">time →</text><path d="M170,196 Q230,260 290,330 Q330,365 560,372 L560,370 Q490,360 450,300 Q400,215 330,190 L230,182 L170,190 Z" fill="#f2e7b8" stroke="none"/><path d="M80,180 L230,182 L330,190 Q400,215 450,300 Q490,360 560,370" fill="none" stroke="#2e6b62" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><path d="M80,200 L170,196 Q230,260 290,330 Q330,365 560,372" fill="none" stroke="#b5602e" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><text x="240" y="172" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">birth rate</text><text x="130" y="300" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">death rate</text><rect x="354" y="246.8" width="223.2" height="21.6" rx="5" fill="#f2e7b8" opacity="1"/><text x="360" y="262" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="start">the gap = rapid growth</text><text x="195" y="470" font-size="15.5" font-weight="700" fill="#b5602e" text-anchor="middle">1 death rate falls first</text><text x="470" y="470" font-size="15.5" font-weight="700" fill="#2e6b62" text-anchor="middle">2 birth rate falls later</text><text x="310" y="500" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Schematic, not to scale</text><rect x="610" y="110" width="260" height="250" rx="14" fill="#f6e6dc" stroke="#b5602e" stroke-width="2.5"/><text x="628" y="144.15" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">Why deaths fell</text><text x="628" y="172" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="644" y="172" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Better food supply and</text><text x="644" y="192" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">storage</text><text x="628" y="220" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="644" y="220" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Clean water and sewage</text><text x="644" y="240" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">disposal</text><text x="628" y="268" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="644" y="268" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Vaccination, antibiotics,</text><text x="644" y="288" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">clinics</text><text x="628" y="316" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="644" y="316" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Hygiene and nutrition</text><text x="644" y="336" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">knowledge</text><rect x="610" y="375" width="260" height="145" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="628" y="409.15" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Why births lag</text><text x="628" y="433.17499999999995" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">Family decisions shaped by</text><text x="628" y="453.63499999999993" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">culture, religion,</text><text x="628" y="474.09499999999997" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">education and economics</text><text x="628" y="494.55499999999995" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">change over a generation.</text><line x1="80" y1="590" x2="820" y2="590" stroke="#1e2a44" stroke-width="4"/><circle cx="100" cy="590" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="100" y="568" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">~1 billion</text><text x="100" y="618" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">around 1800</text><circle cx="560" cy="590" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="560" y="568" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">7 billion</text><text x="560" y="618" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="middle">2011</text><circle cx="800" cy="590" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="800" y="568" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">8 billion</text><text x="800" y="618" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="end">November 2022</text><text x="340" y="618" font-size="15.5" font-weight="400" fill="#8a6d0d" text-anchor="middle" font-style="italic">growth accelerates sharply (not to scale)</text>
</svg>