<rect width="900" height="470" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Evidence cited in the innateness debate</text>

<rect x="40" y="115" width="260" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="52" y="127" width="236" height="92" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="170" y="152" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Critical period</text><text x="170" y="174" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">hypothesis</text><text x="170" y="206" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="middle">Eric Lenneberg, 1967</text><text x="64" y="258" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">language is acquired</text><text x="64" y="280" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">most readily before</text><text x="64" y="302" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">puberty</text><rect x="320" y="115" width="260" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="332" y="127" width="236" height="92" rx="10" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="450" y="162" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Genie</text><text x="450" y="206" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="middle">discovered in 1970</text><text x="344" y="258" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">after severe isolation,</text><text x="344" y="280" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">learned vocabulary but</text><text x="344" y="302" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">struggled with grammar</text><rect x="334" y="335" width="232" height="96" rx="9" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><text x="346" y="362" font-size="15" font-weight="600" fill="#b5602e" text-anchor="start">caution: the abuse she</text><text x="346" y="382" font-size="15" font-weight="600" fill="#b5602e" text-anchor="start">suffered makes firm</text><text x="346" y="402" font-size="15" font-weight="600" fill="#b5602e" text-anchor="start">conclusions difficult</text><rect x="600" y="115" width="260" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="612" y="127" width="236" height="92" rx="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="730" y="152" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Nicaraguan Sign</text><text x="730" y="174" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Language</text><text x="730" y="206" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="middle">1980s</text><text x="624" y="258" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">developed among deaf</text><text x="624" y="280" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">children brought</text><text x="624" y="302" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">together in schools</text><rect x="614" y="335" width="232" height="96" rx="9" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="626" y="362" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">cited as children</text><text x="626" y="382" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">creating grammatical</text><text x="626" y="402" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">structure</text>
</svg>