<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 565" width="900" height="565" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="565" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Accent and identity: the worked example</text>

<rect x="40" y="112" width="820" height="120" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="64" y="145" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"At university I lost my accent in about six weeks. Nobody told me to. I just noticed people smiling</text><text x="64" y="170" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">when I said 'bath', and I stopped saying it that way. When I go home now, my brother says I sound</text><text x="64" y="195" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">'posh'. I don't feel posh. I feel like I live between two places and belong properly to neither."</text><rect x="40" y="265" width="230" height="150" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="155" y="300" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">University</text><text x="155" y="330" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">smiles at "bath" act as</text><text x="155" y="350" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">informal sanctions</text><text x="155" y="390" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">CONVERGENCE</text><rect x="630" y="265" width="230" height="150" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="745" y="300" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Home</text><text x="745" y="330" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">brother's label "posh";</text><text x="745" y="350" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">local accent has covert</text><text x="745" y="370" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">prestige (Trudgill)</text><text x="745" y="398" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">DIVERGENCE</text><circle cx="450" cy="340" r="26" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="347" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">writer</text><line x1="420" y1="340" x2="276" y2="340" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><line x1="480" y1="340" x2="624" y2="340" stroke="#8a6d0d" stroke-width="3" marker-end="url(#ahO)"/><text x="450" y="395" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">the same move, read two ways</text><rect x="40" y="440" width="820" height="100" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="64" y="474" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start" font-style="italic">"belong properly to neither"</text><text x="64" y="504" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">identity is performed differently for each speech community; the cost of accommodation</text><text x="64" y="526" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">can be a sense of displacement.</text>
</svg>