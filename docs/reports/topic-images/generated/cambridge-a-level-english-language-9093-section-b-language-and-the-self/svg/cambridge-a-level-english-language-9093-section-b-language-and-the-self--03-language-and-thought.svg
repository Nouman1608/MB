<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 745" width="900" height="745" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="745" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How language and thought relate</text>

<rect x="40" y="115" width="820" height="116" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="70" y="145" width="90" height="46" rx="9" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="115" y="174" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">language</text><line x1="162" y1="168" x2="198" y2="168" stroke="#b5602e" stroke-width="6" marker-end="url(#ahR)"/><rect x="202" y="145" width="90" height="46" rx="9" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="247" y="174" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">thought</text><text x="70" y="215" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">language determines thought</text><text x="330" y="149" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">Linguistic determinism</text><text x="572.8" y="149" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">strong Sapir-Whorf</text><text x="330" y="179" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Whorf on Hopi time, challenged by Malotki (1983);</text><text x="330" y="201" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Orwell's Newspeak as fiction</text><rect x="40" y="245" width="820" height="116" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="70" y="275" width="90" height="46" rx="9" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="115" y="304" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">language</text><line x1="162" y1="298" x2="198" y2="298" stroke="#2e6b62" stroke-width="2.5" marker-end="url(#ahT)" stroke-dasharray="6 4"/><rect x="202" y="275" width="90" height="46" rx="9" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="247" y="304" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">thought</text><text x="70" y="345" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">language influences habitual thought</text><text x="330" y="279" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Linguistic relativity</text><text x="562.4" y="279" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">weak Sapir-Whorf</text><text x="330" y="309" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Kay and Kempton (1984): blue-green; compass directions</text><text x="330" y="331" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">in Guugu Yimithirr, Kuuk Thaayorre</text><rect x="40" y="375" width="820" height="116" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="70" y="405" width="90" height="46" rx="9" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="115" y="434" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">thought</text><line x1="162" y1="428" x2="198" y2="428" stroke="#8a6d0d" stroke-width="3.5" marker-end="url(#ahO)"/><rect x="202" y="405" width="90" height="46" rx="9" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="247" y="434" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">language</text><text x="70" y="475" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">perception shapes language</text><text x="330" y="409" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="start">Universalism</text><text x="330" y="439" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Berlin and Kay (1969): basic colour terms added in a</text><text x="330" y="461" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">predictable order</text><rect x="40" y="505" width="820" height="116" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="70" y="535" width="90" height="46" rx="9" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="115" y="564" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">mentalese</text><line x1="162" y1="558" x2="198" y2="558" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="202" y="535" width="90" height="46" rx="9" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="247" y="564" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">language</text><text x="70" y="605" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">thinking in an internal "mentalese"</text><text x="330" y="539" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Language of thought</text><text x="541.6" y="539" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Jerry Fodor (1975)</text><text x="330" y="569" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">language expresses thought rather than containing it</text><rect x="40" y="640" width="820" height="80" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="64" y="672" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">For the self: labels and framing can shape how we see ourselves and others,</text><text x="64" y="698" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">"a diabetic" or "a person with diabetes". Weak relativity explains this without claiming it is absolute.</text>
</svg>