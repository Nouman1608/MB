<rect width="900" height="630" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Prestige and accommodation</text>

<rect x="40" y="115" width="400" height="220" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="64" y="150" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Overt prestige</text><text x="64" y="176" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">status from the standard, widely recognised</text><rect x="64" y="196" width="352" height="120" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="80" y="224" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Labov, New York, 1966</text><text x="80" y="250" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">department store study: post-vocalic</text><text x="80" y="270" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">/r/ linked to higher-status stores</text><rect x="460" y="115" width="400" height="220" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="484" y="150" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="start">Covert prestige</text><text x="484" y="176" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">status within a group from non-standard forms</text><rect x="484" y="196" width="352" height="120" rx="10" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2"/><text x="500" y="224" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Trudgill, Norwich, 1974</text><text x="500" y="250" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">some men over-reported non-standard</text><text x="500" y="270" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">pronunciations</text><rect x="40" y="355" width="820" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="64" y="390" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Accommodation (Howard Giles)</text><circle cx="110" cy="448" r="13" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><path d="M90,488 Q90,464 110,464 Q130,464 130,488 Z" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><circle cx="370" cy="448" r="13" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><path d="M350,488 Q350,464 370,464 Q390,464 390,488 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><line x1="140" y1="465" x2="330" y2="465" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><text x="235" y="452" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">convergence</text><text x="240" y="520" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">speech moves towards the listener</text><circle cx="560" cy="448" r="13" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><path d="M540,488 Q540,464 560,464 Q580,464 580,488 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="790" cy="448" r="13" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><path d="M770,488 Q770,464 790,464 Q810,464 810,488 Z" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><line x1="640" y1="465" x2="595" y2="465" stroke="#b5602e" stroke-width="4" marker-end="url(#ahR)"/><text x="680" y="452" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">divergence</text><text x="675" y="520" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">speech moves away from the listener</text><text x="450" y="575" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Martha's Vineyard (Labov, 1963): islanders who identified with the island used a local vowel more.</text>
</svg>