<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 705" width="900" height="705" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="705" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">From idiolect to speech community</text>

<ellipse cx="300" cy="370" rx="250" ry="235" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="300" y="172" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Speech community</text><text x="300" y="196" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">shared norms of use</text><ellipse cx="300" cy="400" rx="180" ry="165" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="300" y="278" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Dialect or sociolect</text><text x="300" y="300" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">region / social group</text><circle cx="300" cy="430" r="82" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="300" y="426" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Idiolect</text><text x="300" y="450" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">one individual</text><rect x="570" y="150" width="290" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="590" y="184" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Idiolect</text><text x="590" y="210" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">favourite words, fillers,</text><text x="590" y="229" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">pronunciations</text><rect x="570" y="255" width="290" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="590" y="289" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Dialect</text><text x="590" y="315" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">region, own lexis and grammar:</text><text x="590" y="334" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">"youse"</text><rect x="570" y="360" width="290" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="590" y="394" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Sociolect</text><text x="590" y="420" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">social group, e.g.</text><text x="590" y="439" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">professional jargon</text><rect x="570" y="465" width="290" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="590" y="499" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Speech community</text><text x="590" y="525" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">a school, a city, an online</text><text x="590" y="544" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">fandom</text><rect x="40" y="620" width="820" height="62" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="450" y="658" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Accent is pronunciation; dialect is lexis and grammar. Do not confuse them.</text>
</svg>