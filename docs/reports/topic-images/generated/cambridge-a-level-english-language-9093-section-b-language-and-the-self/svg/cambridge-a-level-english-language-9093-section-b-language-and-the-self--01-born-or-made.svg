<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 665" width="900" height="665" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="665" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Is language born or made?</text>

<defs><linearGradient id="bm" x1="0" x2="1"><stop offset="0" stop-color="#f2e7b8"/><stop offset="1" stop-color="#b5d3cf"/></linearGradient></defs><rect x="40" y="125" width="820" height="50" rx="25" fill="url(#bm)" stroke="#1e2a44" stroke-width="2.5"/><text x="64" y="157" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">MADE: learned from experience</text><text x="836" y="157" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">BORN: innate capacity</text><rect x="40" y="200" width="340" height="330" rx="14" fill="#ffffff" stroke="#d4b02e" stroke-width="2.5"/><rect x="54" y="214" width="312" height="140" rx="10" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="70" y="242" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Empiricism</text><text x="70" y="264" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">philosophy; John Locke</text><text x="70" y="292" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">knowledge comes from experience;</text><text x="70" y="312" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">the mind begins as a "blank slate"</text><rect x="54" y="368" width="312" height="148" rx="10" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="70" y="396" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Behaviourism</text><text x="70" y="418" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">B.F. Skinner, Verbal Behavior (1957)</text><text x="70" y="446" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">language is learned behaviour shaped</text><text x="70" y="466" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">by imitation and reinforcement</text><rect x="520" y="200" width="340" height="330" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><rect x="534" y="214" width="312" height="140" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="550" y="242" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Innatism</text><text x="550" y="264" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">philosophy; roots in Plato, Descartes</text><text x="550" y="292" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">some ideas or capacities are</text><text x="550" y="312" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">present from birth</text><rect x="534" y="368" width="312" height="148" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="550" y="396" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Nativism</text><text x="550" y="418" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Noam Chomsky; Steven Pinker (1994)</text><text x="550" y="446" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">complex grammar from limited input</text><text x="550" y="466" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">("poverty of the stimulus"): an</text><text x="550" y="486" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">innate capacity for language</text><rect x="390" y="300" width="120" height="120" rx="60" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="352" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">interaction-</text><text x="450" y="372" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">ist middle</text><line x1="390" y1="360" x2="384" y2="360" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="510" y1="360" x2="516" y2="360" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="450" y="445" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">most linguists</text><text x="450" y="465" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">now</text><rect x="40" y="550" width="820" height="90" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="64" y="584" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">For the self:</text><text x="180" y="584" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">if largely innate, part of what makes us human is shared;</text><text x="180" y="612" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">if largely learned, our language and perhaps our identity are shaped by environment.</text>
</svg>