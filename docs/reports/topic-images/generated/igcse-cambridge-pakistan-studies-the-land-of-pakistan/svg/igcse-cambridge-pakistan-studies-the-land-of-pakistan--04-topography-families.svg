<rect width="900" height="722" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Landforms and rivers to learn for 1(c)</text>

<rect x="30" y="112" width="840" height="380" rx="12" fill="#e6eef0" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="142" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">positions are schematic: not a map</text><path d="M300,252 Q450,152 640,222" fill="none" stroke="#9c8f6e" stroke-width="26" stroke-linejoin="round" stroke-linecap="round" /><text x="286" y="258" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Hindu Kush</text><text x="455" y="172" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Karakoram</text><text x="640" y="196" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Himalaya</text><text x="470" y="278" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">mountain arc: north to north-east</text><rect x="60" y="292" width="220" height="150" rx="10" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.5"/><text x="170" y="326" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">WEST</text><text x="170" y="358" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Balochistan Plateau</text><text x="170" y="388" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Sulaiman Range</text><rect x="380" y="302" width="220" height="110" rx="10" fill="#efdfa8" stroke="#1e2a44" stroke-width="2.5"/><text x="490" y="334" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">NORTH-CENTRE</text><text x="490" y="364" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Potwar Plateau</text><text x="490" y="392" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Salt Range</text><path d="M700,282 L700,472" fill="none" stroke="#2b5a9a" stroke-width="10" stroke-linejoin="round" stroke-linecap="round" /><text x="688" y="472" font-size="18" font-weight="700" fill="#2b5a9a" text-anchor="end">Indus</text><path d="M845,302 L706,324" fill="none" stroke="#2b5a9a" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><text x="850" y="296" font-size="15" font-weight="700" fill="#2b5a9a" text-anchor="end">Jhelum</text><path d="M845,342 L706,364" fill="none" stroke="#2b5a9a" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><text x="850" y="336" font-size="15" font-weight="700" fill="#2b5a9a" text-anchor="end">Chenab</text><path d="M845,382 L706,404" fill="none" stroke="#2b5a9a" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><text x="850" y="376" font-size="15" font-weight="700" fill="#2b5a9a" text-anchor="end">Ravi</text><path d="M845,422 L706,444" fill="none" stroke="#2b5a9a" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><text x="850" y="416" font-size="15" font-weight="700" fill="#2b5a9a" text-anchor="end">Sutlej</text><rect x="30" y="512" width="410" height="85" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="545" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Also named</text><text x="48" y="574.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Safed Koh; rivers Kabul, Hab and Dasht</text><rect x="460" y="512" width="410" height="85" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="478" y="545" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Deserts</text><text x="478" y="574.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Thar, Thal and Kharan</text><rect x="30" y="617" width="840" height="75" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="647.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">You need to identify and describe these features and explain how they shape land use, roads and</text><text x="48" y="669.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">railways. How they formed is not required.</text>
</svg>