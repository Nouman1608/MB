<rect width="900" height="552" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The 15 named cities for Section 1(b)</text>

<rect x="30" y="112" width="156" height="48" rx="24" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="108" y="143" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Islamabad</text><rect x="200" y="112" width="156" height="48" rx="24" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="278" y="143" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Murree</text><rect x="370" y="112" width="156" height="48" rx="24" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="448" y="143" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Rawalpindi</text><rect x="540" y="112" width="156" height="48" rx="24" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="618" y="143" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Gujranwala</text><rect x="710" y="112" width="156" height="48" rx="24" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="788" y="143" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Lahore</text><rect x="30" y="174" width="156" height="48" rx="24" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="108" y="205" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Faisalabad</text><rect x="200" y="174" width="156" height="48" rx="24" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="278" y="205" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Multan</text><rect x="370" y="174" width="156" height="48" rx="24" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="448" y="205" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Sialkot</text><rect x="540" y="174" width="156" height="48" rx="24" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="618" y="205" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Peshawar</text><rect x="710" y="174" width="156" height="48" rx="24" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="788" y="205" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Chitral</text><rect x="30" y="236" width="156" height="48" rx="24" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="108" y="267" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Gilgit</text><rect x="200" y="236" width="156" height="48" rx="24" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="278" y="267" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Hyderabad</text><rect x="370" y="236" width="156" height="48" rx="24" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="448" y="267" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Karachi</text><rect x="540" y="236" width="156" height="48" rx="24" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="618" y="267" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Quetta</text><rect x="710" y="236" width="156" height="48" rx="24" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="788" y="267" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Gwadar</text><text x="30" y="328" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">COMMON MARK LOSSES</text><rect x="30" y="342" width="410" height="107" rx="12" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="48" y="375" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Gilgit and Chitral</text><text x="48" y="404.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Both are in the north: do not place them too</text><text x="48" y="426.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">far south.</text><rect x="460" y="342" width="410" height="107" rx="12" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="478" y="375" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Gwadar vs Hyderabad</text><text x="478" y="404.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Gwadar is coastal; Hyderabad is inland. Do not</text><text x="478" y="426.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">confuse them.</text><rect x="30" y="469" width="840" height="53" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="499.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Learn the cities well enough to place them correctly relative to each other, not just one by one.</text>
</svg>