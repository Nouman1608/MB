<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="900" height="550" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="550" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Section 1 underpins Paper 2</text>

<rect x="30" y="112" width="410" height="96" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="145" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Paper 1</text><text x="48" y="174.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">The History and Culture of Pakistan</text><rect x="460" y="112" width="410" height="96" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="478" y="145" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Paper 2</text><text x="478" y="174.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The Environment of Pakistan</text><line x1="665" y1="212" x2="665" y2="248" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="460" y="256" width="360" height="50" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="640" y="288" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Section 2: Natural resources</text><rect x="460" y="318" width="360" height="50" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="640" y="350" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Later sections: power, agriculture…</text><rect x="460" y="400" width="410" height="120" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="665" y="440" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Section 1: The Land of Pakistan</text><text x="665" y="470" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">the foundation: named places, mountain</text><text x="665" y="491" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">ranges and rivers used without re-explaining</text><line x1="848" y1="396" x2="848" y2="266" stroke="#8a6d0d" stroke-width="4" marker-end="url(#ahO)"/><text x="430" y="434" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="end">Build it first:</text><text x="430" y="458" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="end">every later Paper 2</text><text x="430" y="482" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="end">section refers back</text><text x="430" y="506" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="end">to it</text>
</svg>