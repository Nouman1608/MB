<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="540" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Climate answers need a benefit and a problem</text>

<text x="330" y="132" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Benefit</text><text x="620" y="132" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">Problem</text><rect x="30" y="148" width="250" height="73" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="46" y="190.5" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Monsoon rain</text><rect x="310" y="148" width="270" height="73" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="328" y="177.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Supports agriculture</text><rect x="600" y="148" width="270" height="73" rx="12" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="618" y="177.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Flooding disrupts industry and</text><text x="618" y="198.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">communications</text><line x1="282" y1="184.5" x2="306" y2="184.5" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="235" width="250" height="94" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="46" y="288" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Cold in the mountains</text><rect x="310" y="235" width="270" height="94" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="328" y="264.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Low temperatures feed the</text><text x="328" y="285.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">glacial meltwater that sustains</text><text x="328" y="306.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the Indus system</text><rect x="600" y="235" width="270" height="94" rx="12" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="618" y="264.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Low temperature, ice and</text><text x="618" y="285.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">snow constrain people’s lives</text><line x1="282" y1="282" x2="306" y2="282" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="343" width="250" height="70" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="46" y="372" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Drought and water</text><text x="46" y="396" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">shortage</text><rect x="310" y="343" width="270" height="70" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="328" y="372.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(problem only)</text><rect x="600" y="343" width="270" height="70" rx="12" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="618" y="372.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Harm agriculture and industry</text><line x1="282" y1="378" x2="306" y2="378" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="435" width="840" height="75" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="465.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">One-sided answers (only benefits, or only problems) rarely reach full marks. Explain why the</text><text x="48" y="487.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">monsoon happens, not just that it happens.</text>
</svg>