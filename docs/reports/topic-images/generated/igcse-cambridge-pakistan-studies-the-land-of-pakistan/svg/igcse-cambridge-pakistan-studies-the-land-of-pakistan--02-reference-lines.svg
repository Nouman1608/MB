<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The lines to identify on a map of Pakistan</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">schematic grid: not to scale, no outline or borders</text>
<rect x="170" y="140" width="620" height="330" rx="6" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><line x1="170" y1="305" x2="790" y2="305" stroke="#1e2a44" stroke-width="2.5" stroke-dasharray="10 7"/><text x="158" y="311" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">30°N</text><line x1="170" y1="181.25" x2="790" y2="181.25" stroke="#1e2a44" stroke-width="2.5" stroke-dasharray="10 7"/><text x="158" y="187.25" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">36°N</text><line x1="170" y1="439.0625" x2="790" y2="439.0625" stroke="#b5602e" stroke-width="4"/><text x="158" y="435.0625" font-size="17" font-weight="700" fill="#b5602e" text-anchor="end">Tropic of</text><text x="158" y="455.0625" font-size="17" font-weight="700" fill="#b5602e" text-anchor="end">Cancer</text><line x1="294" y1="140" x2="294" y2="470" stroke="#2b5a9a" stroke-width="2.5" stroke-dasharray="10 7"/><text x="294" y="130" font-size="18" font-weight="700" fill="#2b5a9a" text-anchor="middle">64°E</text><line x1="480" y1="140" x2="480" y2="470" stroke="#2b5a9a" stroke-width="2.5" stroke-dasharray="10 7"/><text x="480" y="130" font-size="18" font-weight="700" fill="#2b5a9a" text-anchor="middle">70°E</text><line x1="666" y1="140" x2="666" y2="470" stroke="#2b5a9a" stroke-width="2.5" stroke-dasharray="10 7"/><text x="666" y="130" font-size="18" font-weight="700" fill="#2b5a9a" text-anchor="middle">76°E</text><line x1="840" y1="300" x2="840" y2="170" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><text x="840" y="330" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">N</text><line x1="480" y1="474" x2="480" y2="510" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><text x="496" y="504" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Arabian Sea to the south</text><rect x="30" y="536" width="840" height="75" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="566.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Practise plotting these lines against Pakistan’s outline, then add the Arabian Sea and each</text><text x="48" y="588.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">neighbouring country.</text>
