<rect width="900" height="535" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">One annotated map, built in layers</text>

<path d="M120,330 L640,330 L720,400 L200,400 Z" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><circle cx="240" cy="366" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="240" y="372.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="270" y="373" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Administrative areas and cities</text><path d="M150,250 L670,250 L750,320 L230,320 Z" fill="#efdfa8" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><circle cx="270" cy="286" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="270" y="292.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="300" y="293" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Landforms and rivers</text><path d="M180,170 L700,170 L780,240 L260,240 Z" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><circle cx="300" cy="206" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="300" y="212.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="330" y="213" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">A simple climate-zone overlay</text><text x="450" y="150" font-size="18" font-weight="700" fill="#4a5568" text-anchor="middle">Start one outline map early and add to it</text><rect x="30" y="430" width="840" height="75" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="460.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Revisit the map whenever a later Paper 2 topic (natural resources, power, agriculture) mentions a</text><text x="48" y="482.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">place or feature from Section 1.</text>
