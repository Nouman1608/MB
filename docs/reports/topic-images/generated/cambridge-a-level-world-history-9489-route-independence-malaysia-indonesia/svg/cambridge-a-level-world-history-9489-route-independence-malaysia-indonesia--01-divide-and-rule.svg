<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 515" width="900" height="515" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="515" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Divide and rule in British Malaya</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Three communities kept apart</text>
<rect x="30" y="124" width="270.6666666666667" height="226" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="169" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">MALAYS</text><text x="50" y="195.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">"People of the land"</text><text x="50" y="223.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="223.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Ruled through the sultans</text><text x="50" y="249.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="249.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Aristocratic elite trained at</text><text x="65.2" y="270.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the Malay College, Kuala</text><text x="65.2" y="291.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Kangsar, for the civil</text><text x="65.2" y="312.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">service</text><rect x="314.6666666666667" y="124" width="270.6666666666667" height="226" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="334.6666666666667" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CHINESE</text><text x="334.6666666666667" y="182.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Tin and commerce</text><text x="334.6666666666667" y="210.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="349.8666666666667" y="210.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Immigrant workers and</text><text x="349.8666666666667" y="231.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">traders</text><text x="334.6666666666667" y="257.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="349.8666666666667" y="257.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">By the 1930s close to</text><text x="349.8666666666667" y="278.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">equalling Malays in number</text><text x="334.6666666666667" y="304.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="349.8666666666667" y="304.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Politics looked mainly to</text><text x="349.8666666666667" y="325.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">China</text><rect x="599.3333333333334" y="124" width="270.6666666666667" height="226" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="619.3333333333334" y="213.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">INDIANS</text><text x="619.3333333333334" y="239.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Rubber estates</text><text x="619.3333333333334" y="268.3" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="634.5333333333334" y="268.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Mainly Tamil labourers</text><rect x="30" y="372" width="840" height="111" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="450" y="404" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">KEPT SEPARATE BY</text><text x="450" y="430.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Separate vernacular schools, separate occupations, separate residential areas</text><text x="450" y="458.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Society polarised; Malay leaders feared becoming a minority in their own land</text>
</svg>