<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">From Malayan Union to Malaysia, 1946-65</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Drawn to scale: constitutional steps left, conflict right</text>
<line x1="96" y1="168" x2="870" y2="168" stroke="#c9d6d4" stroke-width="1.2"/><text x="30" y="174" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">1946</text><line x1="96" y1="260" x2="870" y2="260" stroke="#c9d6d4" stroke-width="1.2"/><text x="30" y="266" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">1948</text><line x1="96" y1="352" x2="870" y2="352" stroke="#c9d6d4" stroke-width="1.2"/><text x="30" y="358" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">1950</text><line x1="96" y1="444" x2="870" y2="444" stroke="#c9d6d4" stroke-width="1.2"/><text x="30" y="450" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">1952</text><line x1="96" y1="536" x2="870" y2="536" stroke="#c9d6d4" stroke-width="1.2"/><text x="30" y="542" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">1954</text><line x1="96" y1="628" x2="870" y2="628" stroke="#c9d6d4" stroke-width="1.2"/><text x="30" y="634" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">1956</text><line x1="96" y1="720" x2="870" y2="720" stroke="#c9d6d4" stroke-width="1.2"/><text x="30" y="726" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">1958</text><line x1="96" y1="812" x2="870" y2="812" stroke="#c9d6d4" stroke-width="1.2"/><text x="30" y="818" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">1960</text><line x1="96" y1="904" x2="870" y2="904" stroke="#c9d6d4" stroke-width="1.2"/><text x="30" y="910" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">1962</text><line x1="96" y1="996" x2="870" y2="996" stroke="#c9d6d4" stroke-width="1.2"/><text x="30" y="1002" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">1964</text><line x1="96" y1="1088" x2="870" y2="1088" stroke="#c9d6d4" stroke-width="1.2"/><text x="30" y="1094" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">1966</text><rect x="460" y="280.7000000000021" width="20" height="531.2999999999979" rx="6" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><line x1="470" y1="168" x2="470" y2="1088" stroke="#1e2a44" stroke-width="4" stroke-linecap="round"/><text x="430" y="138" font-size="15" font-weight="700" fill="#b5602e" text-anchor="end">CONSTITUTION AND PARTIES</text><text x="510" y="138" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CONFLICT AND CRISIS</text><path d="M470,168 L454,168 L436,168" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="144.79200000000003" y="153.4" width="290.20799999999997" height="67" fill="#f4f6f6"/><text x="430" y="172.20000000000002" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">1946</text><text x="430" y="193.20000000000002" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">Malayan Union; UMNO formed under</text><text x="430" y="214.20000000000002" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">Dato Onn (May)</text><path d="M470,214 L486,214 L504,214" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="505" y="199.4" width="283.44" height="46" fill="#f4f6f6"/><text x="510" y="218.20000000000002" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">1947</text><text x="510" y="239.20000000000002" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">PUTERA and Joint Action hartal fails</text><path d="M470,263.83333333332985 L454,263.83333333332985 L436,263.83333333332985" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="133.88" y="249.23333333332985" width="301.12" height="46" fill="#f4f6f6"/><text x="430" y="268.03333333332984" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">February 1948</text><text x="430" y="289.03333333332984" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">Federation of Malaya: sultans restored</text><path d="M470,279.16666666667015 L486,279.16666666667015 L504,279.16666666667015" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="505" y="264.56666666667013" width="294.096" height="46" fill="#f4f6f6"/><text x="510" y="283.36666666667014" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">June 1948</text><text x="510" y="304.36666666667014" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Planters killed: the Emergency begins</text><path d="M470,352 L486,352 L504,352" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="505" y="337.4" width="202.752" height="46" fill="#f4f6f6"/><text x="510" y="356.2" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">1950</text><text x="510" y="377.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Briggs Plan: New Villages</text><path d="M470,444 L454,444 L436,444" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="139.11200000000002" y="429.4" width="295.888" height="67" fill="#f4f6f6"/><text x="430" y="448.2" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">1952</text><text x="430" y="469.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">UMNO-MCA Alliance in Kuala Lumpur</text><text x="430" y="490.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">elections</text><path d="M470,453.2000000000021 L486,453.2000000000021 L504,453.2000000000021" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="505" y="438.60000000000207" width="226.99200000000002" height="46" fill="#f4f6f6"/><text x="510" y="457.4000000000021" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">1952-54</text><text x="510" y="478.4000000000021" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Templer: "hearts and minds"</text><path d="M470,582 L454,582 L436,582" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="216.392" y="567.4" width="218.608" height="46" fill="#f4f6f6"/><text x="430" y="586.1999999999999" font-size="16" font-weight="700" fill="#b5602e" text-anchor="end">1955</text><text x="430" y="607.1999999999999" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">Alliance wins 51 of 52 seats</text><path d="M470,704.6038251366163 L454,704.6038251366163 L436,704.6038251366163" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="306.552" y="690.0038251366162" width="128.44799999999998" height="46" fill="#f4f6f6"/><text x="430" y="708.8038251366162" font-size="16" font-weight="700" fill="#b5602e" text-anchor="end">31 August 1957</text><text x="430" y="729.8038251366162" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">Merdeka</text><path d="M470,812 L486,812 L504,812" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="505" y="797.4" width="202.99200000000002" height="46" fill="#f4f6f6"/><text x="510" y="816.1999999999999" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">1960</text><text x="510" y="837.1999999999999" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Emergency formally ends</text><path d="M470,858 L454,858 L436,858" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="230.888" y="843.4" width="204.112" height="46" fill="#f4f6f6"/><text x="430" y="862.1999999999999" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">1961</text><text x="430" y="883.1999999999999" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">Tunku proposes Malaysia</text><path d="M470,982.5519125683081 L454,982.5519125683081 L436,982.5519125683081" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="161.06400000000002" y="967.9519125683081" width="273.936" height="46" fill="#f4f6f6"/><text x="430" y="986.7519125683081" font-size="16" font-weight="700" fill="#b5602e" text-anchor="end">16 September 1963</text><text x="430" y="1007.7519125683081" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">Malaysia formed (Brunei stays out)</text><path d="M470,996 L486,996 L504,996" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="505" y="981.4" width="184.88" height="46" fill="#f4f6f6"/><text x="510" y="1000.1999999999999" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">1964</text><text x="510" y="1021.1999999999999" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Race riots in Singapore</text><path d="M470,1069.8387978142027 L486,1069.8387978142027 L504,1069.8387978142027" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="505" y="1055.2387978142028" width="166.208" height="46" fill="#f4f6f6"/><text x="510" y="1074.0387978142028" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">9 August 1965</text><text x="510" y="1095.0387978142028" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Singapore separates</text><circle cx="470" cy="168" r="7" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="470" cy="214" r="7" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="470" cy="263.83333333332985" r="7" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="470" cy="279.16666666667015" r="7" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="470" cy="352" r="7" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="470" cy="444" r="7" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="470" cy="453.2000000000021" r="7" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="470" cy="582" r="7" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="470" cy="704.6038251366163" r="7" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="470" cy="812" r="7" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="470" cy="858" r="7" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="470" cy="982.5519125683081" r="7" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="470" cy="996" r="7" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="470" cy="1069.8387978142027" r="7" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="1129.2387978142028" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="1164.0587978142028" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Do not confuse</text><text x="50" y="1193.8387978142027" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The <tspan font-weight="700" fill="#1e2a44">Federation</tspan> <tspan font-weight="700" fill="#1e2a44">of</tspan> <tspan font-weight="700" fill="#1e2a44">Malaya</tspan> (1948) is not <tspan font-weight="700" fill="#1e2a44">Malaysia</tspan> (1963). The red band on the spine marks the</text><text x="50" y="1215.8387978142027" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Emergency, 1948-60.</text>
</svg>