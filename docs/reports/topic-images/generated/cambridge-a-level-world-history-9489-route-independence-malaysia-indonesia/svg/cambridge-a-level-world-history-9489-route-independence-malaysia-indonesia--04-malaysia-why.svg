<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 682" width="900" height="682" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="682" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Malaysia: why form it, why split?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Reasons for 1963 and for 1965</text>
<rect x="30" y="124" width="269.3333333333333" height="145" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="152" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">POLITICAL</text><text x="46" y="178.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Contain the left</text><text x="46" y="206.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Fear that left-wing forces</text><text x="46" y="227.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">would take an independent</text><text x="46" y="248.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Singapore</text><rect x="315.3333333333333" y="124" width="269.3333333333333" height="145" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="331.3333333333333" y="173" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ECONOMIC</text><text x="331.3333333333333" y="199.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">A common market</text><text x="331.3333333333333" y="227.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Singapore needed a hinterland</text><rect x="600.6666666666666" y="124" width="269.3333333333333" height="145" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="616.6666666666666" y="162.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CULTURAL</text><text x="616.6666666666666" y="188.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Racial balance</text><text x="616.6666666666666" y="217.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Borneo peoples to balance</text><text x="616.6666666666666" y="238.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Singapore's Chinese majority</text><rect x="150" y="333" width="600" height="115" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="365" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">16 SEPTEMBER 1963</text><text x="450" y="393.38" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Malaysia: Malaya, Singapore, Sarawak, Sabah</text><text x="450" y="423.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Brunei stayed out</text><line x1="164.66666666666666" y1="275" x2="300" y2="327" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="450" y1="275" x2="450" y2="327" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="735.3333333333333" y1="275" x2="600" y2="327" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="450" y1="454" x2="450" y2="490" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="512" width="840" height="138" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="544" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">9 AUGUST 1965: SINGAPORE SEPARATES</text><text x="50" y="575.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="575.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Lee Kuan Yew's "Malaysian Malaysia" against Malay special rights</text><text x="50" y="600.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="600.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The PAP enters peninsular politics; race riots in Singapore (1964)</text><text x="50" y="625.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="625.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Quarrels over finance and the common market</text>
</svg>