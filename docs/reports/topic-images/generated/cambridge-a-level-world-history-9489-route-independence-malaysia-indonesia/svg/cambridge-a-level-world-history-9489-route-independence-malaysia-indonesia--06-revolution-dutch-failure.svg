<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 597" width="900" height="597" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="597" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why the Dutch could not reconquer Indonesia</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">From the proclamation to the transfer of sovereignty, 1945-49</text>
<rect x="30" y="124" width="198" height="180" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="192" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">INDONESIAN RESOLVE</text><text x="46" y="217.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Surabaya</text><text x="46" y="244" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">November 1945</text><rect x="244" y="124" width="198" height="180" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="260" y="172" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DIPLOMACY</text><text x="260" y="197.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Linggadjati</text><text x="260" y="224" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">November 1946; then</text><text x="260" y="244" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">"police actions" (1947,</text><text x="260" y="264" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">1948)</text><rect x="458" y="124" width="198" height="180" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="474" y="172" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">COLD WAR</text><text x="474" y="197.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Madiun crushed</text><text x="474" y="224" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">1948: a communist</text><text x="474" y="244" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">revolt put down wins</text><text x="474" y="264" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">US sympathy</text><rect x="672" y="124" width="198" height="180" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="688" y="152" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">INTERNATIONAL</text><text x="688" y="177.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">UN and USA</text><text x="688" y="204" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">UN condemns the</text><text x="688" y="224" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">second offensive; USA</text><text x="688" y="244" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">presses the Dutch,</text><text x="688" y="264" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">dependent on Marshall</text><text x="688" y="284" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Aid</text><rect x="150" y="368" width="600" height="86" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="400" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">DECEMBER 1949</text><text x="450" y="428.38" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Sovereignty transferred</text><line x1="129" y1="310" x2="300" y2="362" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="343" y1="310" x2="400" y2="362" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="557" y1="310" x2="500" y2="362" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="771" y1="310" x2="600" y2="362" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="476" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="510.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Often overlooked</text><text x="450" y="540.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">US and UN pressure on the Dutch, not only Indonesian resistance.</text>
</svg>