<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 575" width="900" height="575" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="575" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Malay nationalism before 1945: weak and divided</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">From loyal to radical</text>
<text x="40" y="140" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">LOYAL TO BRITAIN AND THE SULTANS</text><text x="860" y="140" font-size="17" font-weight="700" fill="#b5602e" text-anchor="end">ANTI-BRITISH</text><defs><linearGradient id="sg124" x1="0" x2="1"><stop offset="0" stop-color="#b5d3cf"/><stop offset="1" stop-color="#f2e7b8"/></linearGradient></defs><rect x="60" y="169" width="780" height="26" rx="13" fill="url(#sg124)" stroke="#1e2a44" stroke-width="2.5"/><path d="M122.4,195 L122.4,218 L129.75,232 L129.75,252" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="122.4" cy="182" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><path d="M309.6,195 L309.6,218 L343.25,232 L343.25,252" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="309.6" cy="182" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><path d="M528,195 L528,218 L556.75,232 L556.75,252" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="528" cy="182" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><path d="M777.6,195 L777.6,218 L770.25,232 L770.25,252" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="777.6" cy="182" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><rect x="30" y="252" width="199.5" height="133" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="129.75" y="279.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">English-educated</text><text x="129.75" y="300.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Malays</text><text x="129.75" y="327" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Civil servants: protect</text><text x="129.75" y="347" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Malay privileges, not</text><text x="129.75" y="367" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">independence</text><rect x="243.5" y="252" width="199.5" height="133" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="343.25" y="289.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Malay associations</text><text x="343.25" y="316.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">From 1926: defend</text><text x="343.25" y="336.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Malay interests;</text><text x="343.25" y="356.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Congresses 1939, 1940</text><rect x="457" y="252" width="199.5" height="133" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="556.75" y="279.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Kaum Muda</text><text x="556.75" y="306.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Reformist Muslims:</text><text x="556.75" y="326.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">criticised religious</text><text x="556.75" y="346.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">authority and Malay</text><text x="556.75" y="366.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">backwardness</text><rect x="670.5" y="252" width="199.5" height="133" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="770.25" y="289.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">KMM (1938)</text><text x="770.25" y="316.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Ibrahim Yaacob: radical,</text><text x="770.25" y="336.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">pan-Malay, union with</text><text x="770.25" y="356.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Indonesia</text><rect x="30" y="407" width="840" height="136" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="439" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">JAPANESE OCCUPATION, 1942-45</text><text x="50" y="465.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Politicised Malays, deepened racial hostility</text><text x="50" y="493.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="493.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Chinese killed in Sook Ching; Malays kept in administration; Indians recruited for the INA</text><text x="50" y="518.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="518.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">MPAJA (communist-led) the main resistance; KMM used then disbanded; PETA, then KRIS (1945)</text>
</svg>