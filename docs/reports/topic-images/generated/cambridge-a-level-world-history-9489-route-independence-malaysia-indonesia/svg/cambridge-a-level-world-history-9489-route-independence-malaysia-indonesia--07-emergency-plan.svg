<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 615" width="900" height="615" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="615" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why did Britain defeat the insurgency?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Criterion: isolate the guerrillas from support</text>
<rect x="130" y="124" width="740" height="78" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="145" y="153.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Briggs Plan</text><text x="145" y="182.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Resettlement into New Villages cut supplies: the decisive structural factor</text><circle cx="62" cy="163" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="62" y="171.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="769.3199999999999" y="136" width="85.68" height="29" rx="14.5" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="812.16" y="155.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">decisive</text><rect x="130" y="214" width="740" height="78" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="145" y="243.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Templer</text><text x="145" y="272.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Co-ordination, intelligence and political concessions</text><circle cx="62" cy="253" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="261.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="774.885" y="226" width="80.11500000000001" height="29" rx="14.5" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="814.9425" y="245.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">method</text><rect x="130" y="304" width="740" height="78" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="145" y="333.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Communist weaknesses</text><text x="145" y="362.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A Chinese base only; Lai Teck's betrayal; little Malay support</text><circle cx="62" cy="343" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="351.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="781.05" y="316" width="73.95" height="29" rx="14.5" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="818.025" y="335.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">enemy</text><rect x="130" y="394" width="740" height="78" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="145" y="423.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Politics</text><text x="145" y="452.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The Alliance and the promise of independence removed the anti-colonial case</text><circle cx="62" cy="433" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="441.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="738.705" y="406" width="116.295" height="29" rx="14.5" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="796.8525000000001" y="425.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">permanence</text><rect x="30" y="494" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="528.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Judgement</text><text x="450" y="558.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Resettlement made victory <tspan font-weight="700" fill="#1e2a44">possible</tspan>; political progress towards Merdeka made it <tspan font-weight="700" fill="#1e2a44">permanent</tspan>.</text>
</svg>