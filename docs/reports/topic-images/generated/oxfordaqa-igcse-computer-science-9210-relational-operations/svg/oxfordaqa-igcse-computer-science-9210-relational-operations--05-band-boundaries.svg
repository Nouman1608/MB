<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 788" width="900" height="788" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="788" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: choosing a band</text>

<rect x="30" y="110" width="380" height="236" rx="12" fill="#1e2a44"/><text x="48" y="140" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="17" font-weight="400" fill="#e8eef0" text-anchor="start">IF time &lt; 20 THEN</text><text x="68.4" y="170" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="17" font-weight="400" fill="#e8eef0" text-anchor="start">band ← "Fast"</text><text x="48" y="200" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="17" font-weight="400" fill="#e8eef0" text-anchor="start">ELSE IF time &lt; 30 THEN</text><text x="68.4" y="230" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="17" font-weight="400" fill="#e8eef0" text-anchor="start">band ← "Steady"</text><text x="48" y="260" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="17" font-weight="400" fill="#e8eef0" text-anchor="start">ELSE</text><text x="68.4" y="290" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="17" font-weight="400" fill="#e8eef0" text-anchor="start">band ← "Starter"</text><text x="48" y="320" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="17" font-weight="400" fill="#e8eef0" text-anchor="start">ENDIF</text><rect x="430" y="110" width="440" height="236" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="452" y="146" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Tests are checked in order</text><text x="452" y="176" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Any time that reaches the second test has already</text><text x="452" y="197" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">failed time &lt; 20, so it does not need "and at least</text><text x="452" y="218" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">20".</text><text x="452" y="262" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="start">The boundary values 20 and 30 show whether &lt;</text><text x="452" y="283" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="start">or ≤ was right.</text><rect x="60" y="386" width="260" height="24" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><rect x="320" y="386" width="260" height="24" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><rect x="580" y="386" width="260" height="24" fill="#dfe7f3" stroke="#2b5a9a" stroke-width="2"/><text x="190" y="376" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Fast</text><text x="450" y="376" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="middle">Steady</text><text x="710" y="376" font-size="18" font-weight="700" fill="#2b5a9a" text-anchor="middle">Starter</text><text x="60" y="444" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">10</text><text x="190" y="444" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">15</text><text x="320" y="444" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">20</text><text x="450" y="444" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">25</text><text x="580" y="444" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">30</text><text x="710" y="444" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">35</text><text x="840" y="444" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">40</text><text x="840" y="466" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">minutes</text><rect x="30" y="486" width="840" height="50" rx="10" fill="#1e2a44"/><text x="44" y="517" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">time</text><text x="154" y="517" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">time &lt; 20</text><text x="384" y="517" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">time &lt; 30</text><text x="614" y="517" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">band</text><rect x="30" y="536" width="840" height="50" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="565.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">18</text><text x="154" y="565.3" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">True</text><line x1="140" y1="536" x2="140" y2="586" stroke="#c9d6d4" stroke-width="2"/><text x="384" y="565.3" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">not reached</text><line x1="370" y1="536" x2="370" y2="586" stroke="#c9d6d4" stroke-width="2"/><text x="614" y="565.3" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Fast</text><line x1="600" y1="536" x2="600" y2="586" stroke="#c9d6d4" stroke-width="2"/><rect x="30" y="586" width="840" height="50" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="615.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">20</text><text x="154" y="615.3" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">False</text><line x1="140" y1="586" x2="140" y2="636" stroke="#c9d6d4" stroke-width="2"/><text x="384" y="615.3" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">True</text><line x1="370" y1="586" x2="370" y2="636" stroke="#c9d6d4" stroke-width="2"/><text x="614" y="615.3" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Steady</text><line x1="600" y1="586" x2="600" y2="636" stroke="#c9d6d4" stroke-width="2"/><rect x="30" y="636" width="840" height="50" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="665.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">29</text><text x="154" y="665.3" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">False</text><line x1="140" y1="636" x2="140" y2="686" stroke="#c9d6d4" stroke-width="2"/><text x="384" y="665.3" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">True</text><line x1="370" y1="636" x2="370" y2="686" stroke="#c9d6d4" stroke-width="2"/><text x="614" y="665.3" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Steady</text><line x1="600" y1="636" x2="600" y2="686" stroke="#c9d6d4" stroke-width="2"/><rect x="30" y="686" width="840" height="50" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="715.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">30</text><text x="154" y="715.3" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">False</text><line x1="140" y1="686" x2="140" y2="736" stroke="#c9d6d4" stroke-width="2"/><text x="384" y="715.3" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">False</text><line x1="370" y1="686" x2="370" y2="736" stroke="#c9d6d4" stroke-width="2"/><text x="614" y="715.3" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Starter</text><line x1="600" y1="686" x2="600" y2="736" stroke="#c9d6d4" stroke-width="2"/><text x="30" y="764" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">Highlighted rows are boundary values. Boundaries are invented for the example.</text>
</svg>