<rect width="900" height="656" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Opposite operators</text>

<rect x="30" y="110" width="840" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><line x1="260" y1="186" x2="840" y2="186" stroke="#1e2a44" stroke-width="2.5"/><line x1="260" y1="179" x2="260" y2="193" stroke="#1e2a44" stroke-width="2"/><line x1="405" y1="179" x2="405" y2="193" stroke="#1e2a44" stroke-width="2"/><line x1="550" y1="179" x2="550" y2="193" stroke="#1e2a44" stroke-width="2"/><line x1="695" y1="179" x2="695" y2="193" stroke="#1e2a44" stroke-width="2"/><line x1="840" y1="179" x2="840" y2="193" stroke="#1e2a44" stroke-width="2"/><line x1="538" y1="186" x2="262" y2="186" stroke="#8a6d0d" stroke-width="9" marker-end="url(#ahO)"/><line x1="562" y1="186" x2="838" y2="186" stroke="#2e6b62" stroke-width="9" marker-end="url(#ahT)"/><text x="54" y="166" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="22" font-weight="700" fill="#8a6d0d" text-anchor="start">count &lt; 10</text><text x="54" y="206" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="22" font-weight="700" fill="#2e6b62" text-anchor="start">count ≥ 10</text><circle cx="550" cy="186" r="9" fill="#2e6b62" stroke="#2e6b62" stroke-width="3.5"/><text x="550" y="222" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">10</text><text x="550" y="156" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">10 goes with ≥</text><rect x="30" y="256" width="840" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><line x1="260" y1="332" x2="840" y2="332" stroke="#1e2a44" stroke-width="2.5"/><line x1="260" y1="325" x2="260" y2="339" stroke="#1e2a44" stroke-width="2"/><line x1="405" y1="325" x2="405" y2="339" stroke="#1e2a44" stroke-width="2"/><line x1="550" y1="325" x2="550" y2="339" stroke="#1e2a44" stroke-width="2"/><line x1="695" y1="325" x2="695" y2="339" stroke="#1e2a44" stroke-width="2"/><line x1="840" y1="325" x2="840" y2="339" stroke="#1e2a44" stroke-width="2"/><line x1="538" y1="332" x2="262" y2="332" stroke="#8a6d0d" stroke-width="9" marker-end="url(#ahO)"/><line x1="562" y1="332" x2="838" y2="332" stroke="#2e6b62" stroke-width="9" marker-end="url(#ahT)"/><text x="54" y="312" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="22" font-weight="700" fill="#8a6d0d" text-anchor="start">count ≤ 10</text><text x="54" y="352" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="22" font-weight="700" fill="#2e6b62" text-anchor="start">count > 10</text><circle cx="550" cy="332" r="9" fill="#8a6d0d" stroke="#8a6d0d" stroke-width="3.5"/><text x="550" y="368" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">10</text><text x="550" y="302" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">10 goes with ≤</text><rect x="30" y="402" width="840" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="452" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="22" font-weight="700" fill="#8a6d0d" text-anchor="start">count = 10</text><text x="240" y="451" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">is the opposite of</text><text x="400" y="452" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="22" font-weight="700" fill="#2e6b62" text-anchor="start">count ≠ 10</text><rect x="30" y="506" width="411" height="120" rx="14" fill="#1e2a44" stroke="#1e2a44" stroke-width="2.5"/><text x="54" y="550" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="19" font-weight="700" fill="#ffffff" text-anchor="start">WHILE count &lt; 10</text><text x="54" y="586" font-size="16" font-weight="400" fill="#b5d3cf" text-anchor="start">keeps going while True</text><line x1="447" y1="566" x2="455" y2="566" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="459" y="506" width="411" height="120" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="483" y="550" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">UNTIL count ≥ 10</text><text x="483" y="586" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">stops when the opposite is True</text><text x="483" y="610" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">not UNTIL count > 10: that drops the equal case</text>
</svg>