<rect width="900" height="404" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Vietnam: why in, why it failed, why out</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Three stages of a failed containment</text>
<rect x="30" y="124" width="257.3333333333333" height="248" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="44" y="170" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">WHY INVOLVED</text><text x="44" y="195.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Credibility</text><text x="44" y="222" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="58.25" y="222" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Domino theory</text><text x="44" y="246" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="58.25" y="246" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">SEATO (1954)</text><text x="44" y="270" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="58.25" y="270" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Backing Diem:</text><text x="58.25" y="290" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">anti-communist but corrupt</text><text x="44" y="314" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="58.25" y="314" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">After Korea, credibility at</text><text x="58.25" y="334" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">stake</text><line x1="293.3333333333333" y1="248" x2="315.3333333333333" y2="248" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="321.3333333333333" y="124" width="257.3333333333333" height="248" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="335.3333333333333" y="170" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">WHY IT FAILED</text><text x="335.3333333333333" y="195.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Attrition against guerrillas</text><text x="335.3333333333333" y="222" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="349.5833333333333" y="222" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Westmoreland's body counts</text><text x="335.3333333333333" y="246" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="349.5833333333333" y="246" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Firepower killed civilians,</text><text x="349.5833333333333" y="266" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">drove villagers to the Viet</text><text x="349.5833333333333" y="286" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Cong</text><text x="335.3333333333333" y="310" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="349.5833333333333" y="310" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Strategic hamlets resented</text><text x="335.3333333333333" y="334" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="349.5833333333333" y="334" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Ho Chi Minh Trail supplies</text><line x1="584.6666666666666" y1="248" x2="606.6666666666666" y2="248" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="612.6666666666666" y="124" width="257.3333333333333" height="248" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="626.6666666666666" y="150" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">WHY WITHDRAWAL</text><text x="626.6666666666666" y="175.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Opinion turned</text><text x="626.6666666666666" y="202" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="640.9166666666666" y="202" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Tet (1968): not close to</text><text x="640.9166666666666" y="222" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">winning</text><text x="626.6666666666666" y="246" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="640.9166666666666" y="246" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Casualties, the draft,</text><text x="640.9166666666666" y="266" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">television, Kent State (1970)</text><text x="626.6666666666666" y="290" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="640.9166666666666" y="290" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Vietnamisation; better</text><text x="640.9166666666666" y="310" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">relations with China and USSR</text><text x="626.6666666666666" y="334" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="640.9166666666666" y="334" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Paris (1973); Saigon falls</text><text x="640.9166666666666" y="354" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">(1975)</text>
</svg>