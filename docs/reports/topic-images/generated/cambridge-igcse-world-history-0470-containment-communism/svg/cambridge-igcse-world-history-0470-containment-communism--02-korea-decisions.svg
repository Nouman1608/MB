<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 852" width="900" height="852" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="852" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Korea, 1950-53: five decisions</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Containment, a turn to rollback, then back to a limited war</text>
<line x1="60" y1="144" x2="60" y2="666" stroke="#c9d6d4" stroke-width="4"/><rect x="104" y="124" width="766" height="106" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="154" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">JUNE 1950</text><text x="122" y="180.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Intervene at once</text><text x="122" y="208" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">A Soviet-backed test; the lesson of 1930s appeasement. South Korea saved; Pusan perimeter held</text><circle cx="60" cy="177" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="185.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="104" y="238" width="766" height="106" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="268" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">JUNE 1950</text><text x="122" y="294.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Act through the UN</text><text x="122" y="322" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">USSR boycotting the Security Council; sixteen states sent forces</text><circle cx="60" cy="291" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="299.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="104" y="352" width="766" height="106" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="122" y="382" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">OCTOBER 1950</text><text x="122" y="408.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Cross the 38th parallel</text><text x="122" y="436" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">After Inchon: "rollback" to unite Korea. China intervenes; UN forces driven back</text><circle cx="60" cy="405" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="413.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="104" y="466" width="766" height="106" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="496" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">APRIL 1951</text><text x="122" y="522.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Dismiss MacArthur</text><text x="122" y="550" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">He wanted attacks on China; Truman wanted a limited war</text><circle cx="60" cy="519" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="527.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="104" y="580" width="766" height="106" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="610" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">JULY 1953</text><text x="122" y="636.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Accept an armistice</text><text x="122" y="664" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Stalemate, casualties, Eisenhower. Korea divided close to the 38th parallel</text><circle cx="60" cy="633" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="641.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><rect x="30" y="708" width="411" height="112" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="235.5" y="740" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">AGAINST THE ORIGINAL AIM</text><text x="235.5" y="766.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Success</text><text x="235.5" y="795.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">The South survived</text><rect x="459" y="708" width="411" height="112" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="664.5" y="740" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">AGAINST THE OCTOBER 1950 AIM</text><text x="664.5" y="766.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Failure</text><text x="664.5" y="795.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Korea not united</text>
</svg>