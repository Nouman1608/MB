<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="430" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three checks for every containment source</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Paper 2: up to seven sources on the prescribed topic</text>
<rect x="30" y="124" width="270.6666666666667" height="142" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="162" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CHECK 1</text><text x="46" y="188.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The precise date</text><text x="46" y="216" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">During the Missile Crisis (16-28</text><text x="46" y="236" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">October 1962) or after it?</text><rect x="314.6666666666667" y="124" width="270.6666666666667" height="142" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="330.6666666666667" y="152" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CHECK 2</text><text x="330.6666666666667" y="178.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The author's position</text><text x="330.6666666666667" y="206" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">An American official, a Soviet</text><text x="330.6666666666667" y="226" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">newspaper and a Cuban leader</text><text x="330.6666666666667" y="246" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">had different purposes</text><rect x="599.3333333333334" y="124" width="270.6666666666667" height="142" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="615.3333333333334" y="162" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CHECK 3</text><text x="615.3333333333334" y="188.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Test with knowledge</text><text x="615.3333333333334" y="216" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Did Kennedy's public statements</text><text x="615.3333333333334" y="236" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">match the secret Turkish deal?</text><text x="450" y="304" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Typical demands</text><rect x="112.928" y="328" width="192.816" height="30" rx="15" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="209.336" y="348.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Message of a cartoon</text><rect x="315.744" y="328" width="187.552" height="30" rx="15" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="409.52000000000004" y="348.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Why produced then?</text><rect x="513.296" y="328" width="273.776" height="30" rx="15" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="650.1840000000001" y="348.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Does one prove another wrong?</text><rect x="195.864" y="368" width="203.12" height="30" rx="15" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="297.424" y="388.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">How useful or reliable?</text><rect x="408.98400000000004" y="368" width="295.152" height="30" rx="15" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="556.5600000000001" y="388.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">How far do the sources support...?</text>
</svg>