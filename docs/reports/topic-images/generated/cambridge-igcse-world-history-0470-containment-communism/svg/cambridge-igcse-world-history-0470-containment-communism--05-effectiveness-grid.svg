<rect width="900" height="579" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How effective was containment?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Three criteria applied to three cases</text>
<clipPath id="tc124"><rect x="30" y="124" width="840" height="312" rx="14"/></clipPath><g clip-path="url(#tc124)"><rect x="30" y="124" width="158.9189189189189" height="48" fill="#b5d3cf"/><text x="44" y="151.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Criterion</text><rect x="188.9189189189189" y="124" width="227.027027027027" height="48" fill="#dce9e7"/><text x="202.9189189189189" y="151.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Korea, 1950-53</text><rect x="415.94594594594594" y="124" width="227.027027027027" height="48" fill="#f2e7b8"/><text x="429.94594594594594" y="151.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Cuba, 1959-62</text><rect x="642.9729729729729" y="124" width="227.027027027027" height="48" fill="#f3dccd"/><text x="656.9729729729729" y="151.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Vietnam, 1955-75</text><rect x="30" y="172" width="158.9189189189189" height="86" fill="#dce9e7"/><text x="44" y="198" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Aim achieved?</text><rect x="188.9189189189189" y="172" width="227.027027027027" height="86" fill="#ffffff"/><text x="202.9189189189189" y="198" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">South stayed</text><text x="202.9189189189189" y="218" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">non-communist</text><rect x="415.94594594594594" y="172" width="227.027027027027" height="86" fill="#ffffff"/><text x="429.94594594594594" y="198" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Cuba stayed communist,</text><text x="429.94594594594594" y="218" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">but missiles removed</text><rect x="642.9729729729729" y="172" width="227.027027027027" height="86" fill="#ffffff"/><text x="656.9729729729729" y="198" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">South Vietnam, Laos,</text><text x="656.9729729729729" y="218" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Cambodia communist in</text><text x="656.9729729729729" y="238" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">1975</text><line x1="30" y1="258" x2="870" y2="258" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="258" width="158.9189189189189" height="66" fill="#dce9e7"/><text x="44" y="284" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Cost?</text><rect x="188.9189189189189" y="258" width="227.027027027027" height="66" fill="#f8faf9"/><text x="202.9189189189189" y="284" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">War with China; Korea</text><text x="202.9189189189189" y="304" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">divided</text><rect x="415.94594594594594" y="258" width="227.027027027027" height="66" fill="#f8faf9"/><text x="429.94594594594594" y="284" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Bay of Pigs; near nuclear</text><text x="429.94594594594594" y="304" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">war</text><rect x="642.9729729729729" y="258" width="227.027027027027" height="66" fill="#f8faf9"/><text x="656.9729729729729" y="284" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Lives, money, reputation;</text><text x="656.9729729729729" y="304" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Kent State</text><line x1="30" y1="324" x2="870" y2="324" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="324" width="158.9189189189189" height="66" fill="#dce9e7"/><text x="44" y="350" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Wider effects?</text><rect x="188.9189189189189" y="324" width="227.027027027027" height="66" fill="#ffffff"/><text x="202.9189189189189" y="350" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Cold War spread to Asia</text><rect x="415.94594594594594" y="324" width="227.027027027027" height="66" fill="#ffffff"/><text x="429.94594594594594" y="350" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Hotline; Test Ban Treaty</text><text x="429.94594594594594" y="370" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">(1963)</text><rect x="642.9729729729729" y="324" width="227.027027027027" height="66" fill="#ffffff"/><text x="656.9729729729729" y="350" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Thailand, Malaysia,</text><text x="656.9729729729729" y="370" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Indonesia did not fall</text><line x1="30" y1="390" x2="870" y2="390" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="390" width="158.9189189189189" height="46" fill="#dce9e7"/><text x="44" y="416" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Overall</text><rect x="188.9189189189189" y="390" width="227.027027027027" height="46" fill="#b5d3cf"/><text x="202.9189189189189" y="416" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Limited success</text><rect x="415.94594594594594" y="390" width="227.027027027027" height="46" fill="#f2e7b8"/><text x="429.94594594594594" y="416" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Mixed</text><rect x="642.9729729729729" y="390" width="227.027027027027" height="46" fill="#f3dccd"/><text x="656.9729729729729" y="416" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Failure</text></g><line x1="188.9189189189189" y1="124" x2="188.9189189189189" y2="436" stroke="#c9d6d4" stroke-width="1.5"/><line x1="415.94594594594594" y1="124" x2="415.94594594594594" y2="436" stroke="#c9d6d4" stroke-width="1.5"/><line x1="642.9729729729729" y1="124" x2="642.9729729729729" y2="436" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="124" width="840" height="312" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="458" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="492.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Then ask</text><text x="450" y="522.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Did the policy improve as the USA learned the limits of its power?</text>
</svg>