<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 388" width="900" height="388" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="388" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How containment widened, 1947-54</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">From aid, to fighting, to defending every domino</text>
<rect x="30" y="124" width="187.5" height="156" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="44" y="150" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">1947</text><text x="44" y="175.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Truman Doctrine</text><text x="44" y="202" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">A promise to stop</text><text x="44" y="222" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">communism</text><text x="44" y="242" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">spreading to new</text><text x="44" y="262" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">countries</text><line x1="223.5" y1="202" x2="241.5" y2="202" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="247.5" y="124" width="187.5" height="156" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="261.5" y="160" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">APRIL 1950</text><text x="261.5" y="185.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">NSC-68</text><text x="261.5" y="212" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">USSR aims at world</text><text x="261.5" y="232" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">domination: a huge</text><text x="261.5" y="252" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">military build-up</text><line x1="441" y1="202" x2="459" y2="202" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="465" y="124" width="187.5" height="156" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="479" y="160" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">JUNE 1950</text><text x="479" y="185.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Korea</text><text x="479" y="212" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Seems to prove it;</text><text x="479" y="232" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">defence spending</text><text x="479" y="252" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">rises sharply</text><line x1="658.5" y1="202" x2="676.5" y2="202" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="682.5" y="124" width="187.5" height="156" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="696.5" y="170" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">1954</text><text x="696.5" y="195.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Domino theory</text><text x="696.5" y="222" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Even small states</text><text x="696.5" y="242" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">matter</text><rect x="30" y="302" width="280" height="54" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="170" y="336" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Send aid</text><rect x="310" y="302" width="280" height="54" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="336" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Willing to fight</text><rect x="590" y="302" width="280" height="54" fill="#f3dccd" stroke="#1e2a44" stroke-width="2.5"/><text x="730" y="336" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Defend everywhere</text>
</svg>