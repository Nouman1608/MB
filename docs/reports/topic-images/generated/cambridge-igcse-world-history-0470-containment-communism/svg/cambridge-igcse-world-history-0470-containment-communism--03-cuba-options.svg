<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 591" width="900" height="591" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="591" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Kennedy's five options, October 1962</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Why the "quarantine" was chosen</text>
<rect x="30" y="124" width="520" height="68" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M516,149 l18,18 m0,-18 l-18,18" fill="none" stroke="#b5602e" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><text x="42" y="149.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Do nothing</text><text x="42" y="176" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Looks weak; missiles stay</text><rect x="30" y="202" width="520" height="68" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M516,227 l18,18 m0,-18 l-18,18" fill="none" stroke="#b5602e" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><text x="42" y="227.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Diplomacy alone</text><text x="42" y="254" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Slow, while sites become operational</text><rect x="30" y="280" width="520" height="68" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M516,305 l18,18 m0,-18 l-18,18" fill="none" stroke="#b5602e" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><text x="42" y="305.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Air strikes</text><text x="42" y="332" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Cannot guarantee every missile; kills Soviet personnel</text><rect x="30" y="358" width="520" height="68" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M516,383 l18,18 m0,-18 l-18,18" fill="none" stroke="#b5602e" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><text x="42" y="383.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Invasion</text><text x="42" y="410" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Soviet response, perhaps in Berlin; nuclear war</text><rect x="590" y="124" width="280" height="302" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="610" y="210.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CHOSEN</text><text x="610" y="236.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Naval blockade: a</text><text x="610" y="259.53999999999996" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">"quarantine"</text><text x="610" y="287.5" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">A blockade is an act of war; this</text><text x="610" y="307.5" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">stopped more weapons arriving</text><text x="610" y="327.5" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">and gave Khrushchev time to</text><text x="610" y="347.5" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">back down</text><rect x="30" y="448" width="411" height="111" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="480" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">26 OCTOBER: FIRST LETTER</text><text x="50" y="506.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Missiles out for a no-invasion pledge</text><text x="50" y="534.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Kennedy publicly accepts</text><rect x="459" y="448" width="411" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="479" y="480" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">27 OCTOBER: SECOND LETTER</text><text x="479" y="506.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Also remove US missiles from Turkey</text><text x="479" y="534.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Robert Kennedy privately agrees</text>
</svg>