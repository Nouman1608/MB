<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 844" width="900" height="844" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="844" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Sound, rhythm and metre</text>

<rect x="30" y="116" width="840" height="120" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="42" y="126" width="250" height="100" rx="10" fill="#dce9e7"/><circle cx="62" cy="176" r="5" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><circle cx="84" cy="176" r="8" fill="#2e6b62" stroke="#1e2a44" stroke-width="2"/><circle cx="106" cy="176" r="5" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><circle cx="128" cy="176" r="8" fill="#2e6b62" stroke="#1e2a44" stroke-width="2"/><circle cx="150" cy="176" r="5" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><circle cx="172" cy="176" r="8" fill="#2e6b62" stroke="#1e2a44" stroke-width="2"/><circle cx="194" cy="176" r="5" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><circle cx="216" cy="176" r="8" fill="#2e6b62" stroke="#1e2a44" stroke-width="2"/><circle cx="238" cy="176" r="5" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><circle cx="260" cy="176" r="8" fill="#2e6b62" stroke="#1e2a44" stroke-width="2"/><text x="316" y="154" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Iambic</text><text x="316" y="182" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Unstressed, stressed: close to natural speech. Iambic</text><text x="316" y="204" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">pentameter has five such feet in a line.</text><rect x="30" y="246" width="840" height="104" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="42" y="256" width="250" height="84" rx="10" fill="#f2e7b8"/><circle cx="66" cy="298" r="8" fill="#2e6b62" stroke="#1e2a44" stroke-width="2"/><circle cx="90" cy="298" r="5" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><circle cx="114" cy="298" r="8" fill="#2e6b62" stroke="#1e2a44" stroke-width="2"/><circle cx="138" cy="298" r="5" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><circle cx="162" cy="298" r="8" fill="#2e6b62" stroke="#1e2a44" stroke-width="2"/><circle cx="186" cy="298" r="5" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><circle cx="210" cy="298" r="8" fill="#2e6b62" stroke="#1e2a44" stroke-width="2"/><circle cx="234" cy="298" r="5" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="316" y="284" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Trochaic or stressed opening</text><text x="316" y="312" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Gives a line force, urgency or a chant-like quality.</text><rect x="30" y="360" width="840" height="104" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="42" y="370" width="250" height="84" rx="10" fill="#dce9e7"/><line x1="60" y1="412" x2="146" y2="412" stroke="#1e2a44" stroke-width="6" stroke-linecap="round" opacity="0.5"/><text x="164" y="421" font-size="26" font-weight="700" fill="#b5602e">‖</text><line x1="190" y1="412" x2="276" y2="412" stroke="#1e2a44" stroke-width="6" stroke-linecap="round" opacity="0.5"/><text x="316" y="398" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Caesura</text><text x="316" y="426" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">A pause within a line controls pace and emphasis.</text><rect x="30" y="474" width="840" height="120" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="42" y="484" width="250" height="100" rx="10" fill="#f2e7b8"/><line x1="60" y1="518" x2="246" y2="518" stroke="#1e2a44" stroke-width="6" stroke-linecap="round" opacity="0.5"/><circle cx="262" cy="518" r="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><path d="M266,528 C236,542 96,532 66,544" fill="none" stroke="#2e6b62" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 4" marker-end="url(#ahT)"/><line x1="72" y1="554" x2="206" y2="554" stroke="#1e2a44" stroke-width="6" stroke-linecap="round" opacity="0.5"/><text x="316" y="512" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Enjambment</text><text x="316" y="540" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">A sentence runs over a line break. The word at the end of a</text><text x="316" y="562" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">line, or just after a break, gains weight.</text><rect x="30" y="604" width="840" height="120" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="42" y="614" width="250" height="100" rx="10" fill="#dce9e7"/><line x1="60" y1="652" x2="236" y2="652" stroke="#1e2a44" stroke-width="6" stroke-linecap="round" opacity="0.45"/><circle cx="256" cy="652" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2" /><line x1="60" y1="676" x2="236" y2="676" stroke="#1e2a44" stroke-width="6" stroke-linecap="round" opacity="0.45"/><circle cx="256" cy="676" r="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2" stroke-dasharray="4 3"/><text x="316" y="642" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Rhyme</text><text x="316" y="670" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Binds ideas or gives closure; half-rhyme or broken rhyme can</text><text x="316" y="692" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">suggest something incomplete.</text><rect x="30" y="740" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="773.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">You do not need to scan every line: recognise a regular metre and, more importantly, notice</text><text x="50" y="795.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">when it is disturbed.</text>
</svg>