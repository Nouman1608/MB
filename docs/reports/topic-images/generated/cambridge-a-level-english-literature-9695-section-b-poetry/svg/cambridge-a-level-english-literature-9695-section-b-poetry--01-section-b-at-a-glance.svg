<text x="30" y="118" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">Paper 1 · 50 marks</text><rect x="30" y="130" width="420" height="74" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="240" y="162" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Section A: Drama</text><text x="240" y="188" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">25 marks</text><rect x="450" y="130" width="420" height="74" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="660" y="162" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Section B: Poetry</text><text x="660" y="188" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">25 marks · one essay</text><rect x="30" y="130" width="840" height="74" fill="none" stroke="#1e2a44" stroke-width="3"/><rect x="30" y="222" width="380" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="255" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">QUESTION (a)</text><text x="50" y="282" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Essay across the poems</text><text x="50" y="311.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="311.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">A theme, attitude or method.</text><text x="50" y="338.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="338.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Usually you choose which poems.</text><rect x="490" y="222" width="380" height="170" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="510" y="255" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">QUESTION (b)</text><text x="510" y="282" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">One printed poem</text><text x="510" y="311.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="526.15" y="311.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">A poem from the selection.</text><text x="510" y="338.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="526.15" y="338.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Analyse it closely.</text><circle cx="450" cy="307" r="30" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="314" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">or</text><text x="30" y="428" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Assessed on</text><rect x="160" y="408" width="57" height="34" rx="17" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="188.5" y="431.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">AO1</text><rect x="227" y="408" width="57" height="34" rx="17" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="255.5" y="431.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">AO2</text><rect x="294" y="408" width="57" height="34" rx="17" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="322.5" y="431.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">AO3</text><rect x="361" y="408" width="57" height="34" rx="17" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="389.5" y="431.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">AO4</text><text x="438" y="428" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">AO2: choices of language, form and structure</text><rect x="30" y="464" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="497.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Texts are not allowed in the exam room, so for (a) you need short quotations from several</text><text x="50" y="519.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">poems in memory.</text>
