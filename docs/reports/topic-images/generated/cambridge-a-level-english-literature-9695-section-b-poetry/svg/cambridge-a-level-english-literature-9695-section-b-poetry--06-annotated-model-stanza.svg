<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 706" width="900" height="706" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="706" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Technique tied to effect: the model stanza</text>

<rect x="30" y="118" width="840" height="224" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="50" y="148" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">Original stanza, written for the guide</text><text x="100" y="190" font-size="20" fill="#1e2a44" xml:space="preserve"><tspan fill="#8a6d0d" font-weight="600">The house is sold. They’ve taken down the </tspan><tspan fill="#8a6d0d" font-weight="700">gate</tspan><tspan fill="#8a6d0d" font-weight="600">.</tspan></text><text x="100" y="232" font-size="20" fill="#1e2a44" xml:space="preserve">I walk the hedge-line where the garden was</text><text x="100" y="274" font-size="20" fill="#1e2a44" xml:space="preserve">and count the posts, as if the count <tspan fill="#2e6b62" font-weight="700">could wait</tspan></text><text x="100" y="316" font-size="20" fill="#1e2a44" xml:space="preserve"><tspan fill="#2e6b62" font-weight="700">for one more summer</tspan>, one more hour. <tspan fill="#b5602e" font-weight="700">It does.</tspan></text><line x1="780" y1="164" x2="780" y2="330" stroke="#c9d6d4" stroke-width="2"/><circle cx="808" cy="183" r="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="808" y="188.04" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><circle cx="842" cy="183" r="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="842" y="188.04" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><circle cx="808" cy="267" r="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="808" y="272.04" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><circle cx="842" cy="267" r="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="842" y="272.04" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><circle cx="808" cy="309" r="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="808" y="314.04" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><circle cx="842" cy="309" r="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="842" y="314.04" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="50" y="346" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start"></text><rect x="76" y="360" width="366" height="117" rx="14" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="90" y="388.4" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="start">Two flat, end-stopped statements</text><text x="90" y="416.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The loss is presented as accomplished</text><text x="90" y="437.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">fact before the speaker can resist it.</text><circle cx="50" cy="418.5" r="16" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="50" y="424.26" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="504" y="360" width="366" height="117" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="518" y="388.4" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Enjambment</text><text x="518" y="416.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">“could wait / for one more summer”</text><text x="518" y="437.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">stretches the sentence across the line</text><text x="518" y="458.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">break, enacting the wish to delay.</text><circle cx="478" cy="418.5" r="16" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="478" y="424.26" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="76" y="491" width="366" height="117" rx="14" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="90" y="519.4" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="start">Regular rhyme</text><text x="90" y="547.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">“gate” / “wait” seems to promise order.</text><circle cx="50" cy="549.5" r="16" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="50" y="555.26" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="504" y="491" width="366" height="117" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="518" y="519.4" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">Caesura and a short sentence</text><text x="518" y="547.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The abrupt “It does.” breaks the rhythm:</text><text x="518" y="568.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the count waits, but the speaker’s hope</text><text x="518" y="589.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">is left unconfirmed.</text><circle cx="478" cy="549.5" r="16" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="478" y="555.26" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="30" y="624" width="840" height="58" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="657.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Each technique is tied to an effect on meaning at that exact point.</text>
</svg>