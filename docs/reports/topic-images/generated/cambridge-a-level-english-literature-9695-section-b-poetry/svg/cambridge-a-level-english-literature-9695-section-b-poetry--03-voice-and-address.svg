<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 647" width="900" height="647" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="647" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Voice and address</text>

<rect x="30" y="120" width="840" height="246" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M113,290 L118,238 Q130,228 142,238 L147,290 Z" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><circle cx="130" cy="218" r="13" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="130" y="324" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">the speaker</text><text x="130" y="342" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">(a persona)</text><path d="M182,158 L278,158 Q290,158 290,170 L290,186 Q290,198 278,198 L204,198 L186,214 L190,198 L182,198 Q170,198 170,186 L170,170 Q170,158 182,158 Z" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><text x="230" y="184" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">I …</text><line x1="300" y1="240" x2="430" y2="240" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><path d="M463,290 L468,238 Q480,228 492,238 L497,290 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><circle cx="480" cy="218" r="13" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="480" y="324" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">to whom?</text><rect x="580" y="144" width="270" height="196" rx="10" fill="#dce9e7"/><text x="715" y="176" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Start every poem with</text><circle cx="612" cy="212" r="13" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="612" y="216.68" font-size="13" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="636" y="219" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">who is speaking?</text><circle cx="612" cy="254" r="13" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="612" y="258.68" font-size="13" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="636" y="261" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">to whom?</text><circle cx="612" cy="296" r="13" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="612" y="300.68" font-size="13" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="636" y="303" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">in what situation?</text><text x="30" y="402" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Watch for shifts in address</text><rect x="30" y="418" width="390" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="453.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">from “I” to “you”</text><text x="50" y="481.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The speaker turns to address someone</text><text x="50" y="502.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">directly.</text><rect x="480" y="418" width="390" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="500" y="453.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">from describing to speaking to</text><text x="500" y="481.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Someone described becomes someone spoken</text><text x="500" y="502.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">to.</text><rect x="30" y="543" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="576.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A shift in address changes the relationship between speaker and reader. The speaker is a</text><text x="50" y="598.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">constructed voice even when the poem sounds autobiographical.</text>
</svg>