<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 728" width="900" height="728" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="728" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The (b) answer on a printed poem</text>

<rect x="30" y="120" width="280" height="54" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="170" y="154" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">opening</text><rect x="310" y="120" width="280" height="54" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="154" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">turn</text><rect x="590" y="120" width="280" height="54" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="730" y="154" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">ending</text><text x="450" y="202" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="middle">follow the poem’s movement, keeping the question’s focus in every paragraph</text><line x1="62" y1="244" x2="62" y2="684" stroke="#c9d6d4" stroke-width="4"/><rect x="108" y="224" width="762" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="259.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Read the question’s focus first</text><text x="128" y="287.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Keep it in every paragraph.</text><circle cx="62" cy="268" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="276.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="108" y="322" width="762" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="357.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Gist in one sentence</text><text x="128" y="385.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The speaker, the situation and what changes by the end.</text><circle cx="62" cy="366" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="374.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="108" y="420" width="762" height="88" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="128" y="455.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Follow the poem’s movement</text><text x="128" y="483.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Opening, turn, ending: this keeps you analysing structure as you go.</text><circle cx="62" cy="464" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="62" y="472.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="108" y="518" width="762" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="553.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Select small evidence</text><text x="128" y="581.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A word or phrase, then its effect.</text><circle cx="62" cy="562" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="570.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="108" y="616" width="762" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="651.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Link outward once or twice</text><text x="128" y="679.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Briefly, to other poems in the selection, to show AO1.</text><circle cx="62" cy="660" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="668.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text>
</svg>