<rect width="900" height="558" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Section B poetry texts: 2026 and 2027</text>

<rect x="30" y="160" width="560" height="270" rx="34" fill="#f2e7b8" fill-opacity="0.75" stroke="#8a6d0d" stroke-width="3"/><rect x="310" y="160" width="560" height="270" rx="34" fill="#b5d3cf" fill-opacity="0.55" stroke="#2e6b62" stroke-width="3"/><text x="170" y="146" font-size="21" font-weight="700" fill="#8a6d0d" text-anchor="middle">2026 examination</text><text x="730" y="146" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="middle">2027 examination</text><text x="170" y="202" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">2026 only</text><text x="170" y="246" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Maya Angelou</text><text x="170" y="270" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">And Still I Rise</text><text x="170" y="322" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Blake</text><text x="170" y="346" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">Songs of Innocence</text><text x="170" y="368" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">and of Experience</text><text x="450" y="202" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Both years</text><text x="450" y="246" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Plath</text><text x="450" y="270" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">Ariel</text><text x="450" y="322" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">Songs of Ourselves,</text><text x="450" y="344" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">Volume 2</text><text x="730" y="202" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">2027 only</text><text x="730" y="246" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Zaffar Kunial</text><text x="730" y="270" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">England’s Green</text><text x="730" y="322" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Christina Rossetti</text><text x="730" y="346" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">poems</text><rect x="30" y="454" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="487.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The syllabus names the individual poems in each selection: learn those poems, not the whole</text><text x="50" y="509.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">book. Lists change by year, so check yours.</text>
</svg>