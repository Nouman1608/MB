<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The (a) essay: integrate, do not alternate</text>

<text x="30" y="138" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">Alternate</text><circle cx="425" cy="131" r="15" fill="#b5602e"/><path d="M419,125 l12,12 m0,-12 l-12,12" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="30" y="158" width="410" height="42" rx="8" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="44" y="186" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">All of Poem A</text><rect x="30" y="210" width="410" height="42" rx="8" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="44" y="238" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">All of Poem A</text><rect x="30" y="262" width="410" height="42" rx="8" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="44" y="290" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">All of Poem B</text><rect x="30" y="314" width="410" height="42" rx="8" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="44" y="342" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">All of Poem B</text><text x="460" y="138" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Integrate</text><circle cx="855" cy="131" r="15" fill="#2e6b62"/><path d="M848.25,131.3 l4.8,5.1000000000000005 l9,-9.9" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><text x="580" y="138" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">by point of similarity or contrast</text><rect x="460" y="158" width="410" height="58" rx="8" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="474" y="193" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Point 1</text><rect x="580" y="172" width="78" height="30" rx="15" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="619" y="192.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Poem A</text><rect x="680" y="172" width="78" height="30" rx="15" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="719" y="192.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Poem B</text><line x1="664" y1="187" x2="676" y2="187" stroke="#1e2a44" stroke-width="2.5"/><rect x="460" y="228" width="410" height="58" rx="8" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="474" y="263" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Point 2</text><rect x="580" y="242" width="78" height="30" rx="15" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="619" y="262.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Poem A</text><rect x="680" y="242" width="78" height="30" rx="15" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="719" y="262.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Poem B</text><line x1="664" y1="257" x2="676" y2="257" stroke="#1e2a44" stroke-width="2.5"/><rect x="460" y="298" width="410" height="58" rx="8" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="474" y="333" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Point 3</text><rect x="580" y="312" width="78" height="30" rx="15" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="619" y="332.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Poem A</text><rect x="680" y="312" width="78" height="30" rx="15" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="719" y="332.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Poem B</text><line x1="664" y1="327" x2="676" y2="327" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="378" width="270.6666666666667" height="124" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="420.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Follow the wording</text><text x="46" y="448.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">If it says two poems, write</text><text x="46" y="469.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">on two.</text><rect x="314.6666666666667" y="378" width="270.6666666666667" height="124" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="330.6666666666667" y="408.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Choose poems that let</text><text x="330.6666666666667" y="432.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">you argue</text><text x="330.6666666666667" y="460.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Two that treat the focus</text><text x="330.6666666666667" y="481.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">differently.</text><rect x="599.3333333333334" y="378" width="270.6666666666667" height="124" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="615.3333333333334" y="420.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Stay at line level</text><text x="615.3333333333334" y="448.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Short quotation and comment</text><text x="615.3333333333334" y="469.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">on form in every paragraph.</text><rect x="30" y="518" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="551.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Prepare flexibly: four or five short, versatile quotations for each poem in the selection,</text><text x="50" y="573.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">plus one feature of its form.</text>
