<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 592" width="900" height="592" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="592" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Know the convention, then read the departure</text>

<rect x="30" y="116" width="200" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="42" y="146" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Form</text><rect x="230" y="116" width="300" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="242" y="146" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Convention</text><rect x="530" y="116" width="340" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="542" y="146" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">What a departure can suggest</text><rect x="30" y="162" width="200" height="66" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="188.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Sonnet</text><rect x="230" y="162" width="300" height="66" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="242" y="188.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">14 lines; a turn (volta) in</text><text x="242" y="210.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">argument</text><rect x="530" y="162" width="340" height="66" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="542" y="188.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">A delayed or missing turn: an</text><text x="542" y="210.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">argument that will not resolve</text><rect x="30" y="228" width="200" height="66" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="254.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Ballad</text><rect x="230" y="228" width="300" height="66" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="242" y="254.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Quatrains, regular rhyme,</text><text x="242" y="276.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">narrative, refrain</text><rect x="530" y="228" width="340" height="66" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="542" y="254.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Dark content in a song-like form:</text><text x="542" y="276.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">unsettling innocence</text><rect x="30" y="294" width="200" height="66" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="320.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Dramatic monologue</text><rect x="230" y="294" width="300" height="66" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="242" y="320.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">One speaker addressing a silent</text><text x="242" y="342.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">listener</text><rect x="530" y="294" width="340" height="66" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="542" y="320.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">The speaker reveals more than they</text><text x="542" y="342.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">intend</text><rect x="30" y="360" width="200" height="44" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="386.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Free verse</text><rect x="230" y="360" width="300" height="44" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="242" y="386.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">No fixed metre or rhyme</text><rect x="530" y="360" width="340" height="44" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="542" y="386.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Line breaks carry the shaping work</text><rect x="30" y="404" width="200" height="66" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="430.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Villanelle</text><rect x="230" y="404" width="300" height="66" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="242" y="430.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Two repeated refrains, tight</text><text x="242" y="452.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">rhyme</text><rect x="530" y="404" width="340" height="66" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="542" y="430.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Obsession, or a feeling that keeps</text><text x="542" y="452.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">returning</text><rect x="30" y="488" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="521.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Structure is also the movement of thought: where does the poem turn, and how does its</text><text x="50" y="543.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">ending reframe its opening?</text>
</svg>