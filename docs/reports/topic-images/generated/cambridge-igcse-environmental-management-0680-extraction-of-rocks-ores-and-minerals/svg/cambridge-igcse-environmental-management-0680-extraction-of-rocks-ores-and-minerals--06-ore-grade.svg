<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 590" width="900" height="590" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="590" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why ore grade matters</text>

<rect x="170" y="140" width="420" height="360" fill="#ffffff"/><line x1="170" y1="500" x2="590" y2="500" stroke="#c9d6d4" stroke-width="1.5"/><line x1="163" y1="500" x2="170" y2="500" stroke="#1e2a44" stroke-width="2"/><text x="158" y="506" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">0</text><line x1="170" y1="410" x2="590" y2="410" stroke="#c9d6d4" stroke-width="1.5"/><line x1="163" y1="410" x2="170" y2="410" stroke="#1e2a44" stroke-width="2"/><text x="158" y="416" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">4,000</text><line x1="170" y1="320" x2="590" y2="320" stroke="#c9d6d4" stroke-width="1.5"/><line x1="163" y1="320" x2="170" y2="320" stroke="#1e2a44" stroke-width="2"/><text x="158" y="326" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">8,000</text><line x1="170" y1="230" x2="590" y2="230" stroke="#c9d6d4" stroke-width="1.5"/><line x1="163" y1="230" x2="170" y2="230" stroke="#1e2a44" stroke-width="2"/><text x="158" y="236" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">12,000</text><line x1="170" y1="140" x2="590" y2="140" stroke="#c9d6d4" stroke-width="1.5"/><line x1="163" y1="140" x2="170" y2="140" stroke="#1e2a44" stroke-width="2"/><text x="158" y="146" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">16,000</text><path d="M170,140 L170,500 L590,500" fill="none" stroke="#1e2a44" stroke-width="2.5"/><text x="0" y="0" transform="translate(108,320) rotate(-90)" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Ore to dig and process (tonnes)</text><rect x="220" y="387.5" width="130" height="112.5" rx="0" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><rect x="410" y="162.5" width="130" height="337.5" rx="0" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2.5"/><text x="285" y="375.5" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">5,000 t</text><text x="475" y="150.5" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">15,000 t</text><text x="285" y="532" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Deposit X</text><text x="285" y="554" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">grade 1.2%</text><text x="475" y="532" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Deposit Y</text><text x="475" y="554" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">grade 0.4%</text><rect x="620" y="150" width="250" height="340" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="640" y="186" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">For 60 t of copper</text><text x="640" y="226" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">X: 60 ÷ 0.012</text><text x="640" y="250" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">= 5,000 t of ore</text><text x="640" y="296" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Y: 60 ÷ 0.004</text><text x="640" y="320" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">= 15,000 t of ore</text><text x="640" y="370" font-size="15" font-weight="600" fill="#b5602e" text-anchor="start">Three times the rock:</text><text x="640" y="390" font-size="15" font-weight="600" fill="#b5602e" text-anchor="start">more cost, energy, water</text><text x="640" y="410" font-size="15" font-weight="600" fill="#b5602e" text-anchor="start">and waste for the same</text><text x="640" y="430" font-size="15" font-weight="600" fill="#b5602e" text-anchor="start">copper.</text>
</svg>