<rect width="900" height="676" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Shaft and deep mining</text>

<rect x="30" y="110" width="840" height="440" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="32" y="200" width="836" height="348" rx="0" fill="#cbbf9f"/><line x1="32" y1="200" x2="868" y2="200" stroke="#1e2a44" stroke-width="3"/><path d="M200,200 L220,140 L240,200" fill="none" stroke="#1e2a44" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><rect x="205" y="134" width="30" height="10" rx="0" fill="#1e2a44"/><rect x="212" y="200" width="16" height="300" rx="0" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><path d="M300,420 L780,340 L800,380 L320,460 Z" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2.5"/><text x="620" y="412" font-size="16" font-weight="700" fill="#ffffff" text-anchor="start">ore</text><rect x="228" y="430" width="100" height="14" rx="0" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><rect x="228" y="340" width="300" height="14" rx="0" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><path d="M520,340 L700,360 L700,374 L520,354 Z" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><line x1="220" y1="470" x2="220" y2="208" stroke="#8a6d0d" stroke-width="3.5" marker-end="url(#ahO)"/><text x="250" y="236" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">shaft: workers, equipment and</text><text x="250" y="254" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">air down; ore lifted up</text><text x="560" y="326" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">horizontal tunnels follow the ore</text><path d="M560,200 Q620,222 680,200" fill="#f4f6f6" stroke="#1e2a44" stroke-width="2.5"/><text x="620" y="186" font-size="15" font-weight="600" fill="#b5602e" text-anchor="middle">subsidence above old workings</text><text x="858" y="538" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">Not to scale</text><rect x="30" y="570" width="840" height="76" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="601.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Smaller surface area disturbed and suits deep deposits, but more expensive, with risks</text><text x="48" y="623.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">of roof collapse, flooding, explosive gases and poor air.</text>
</svg>