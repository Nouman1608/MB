<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 746" width="900" height="746" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="746" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The life of a mine and its land</text>

<rect x="30" y="110" width="270" height="104" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="44" y="142.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Before</text><text x="44" y="174.82" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">exploration, EIA, restoration</text><text x="44" y="194.82" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">plan and money set aside</text><line x1="302" y1="162" x2="313" y2="162" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="315" y="110" width="270" height="104" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="329" y="142.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">During</text><text x="329" y="174.82" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">extraction; impacts on land,</text><text x="329" y="194.82" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">air, water and people</text><line x1="587" y1="162" x2="598" y2="162" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="600" y="110" width="270" height="104" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="614" y="142.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">After</text><text x="614" y="174.82" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">restore the land or repurpose</text><text x="614" y="194.82" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">it</text><rect x="30" y="240" width="410" height="380" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="460" y="240" width="410" height="380" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="276" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="start">Land restoration</text><text x="484" y="276" font-size="21" font-weight="700" fill="#8a6d0d" text-anchor="start">Repurposing land</text><text x="54" y="316" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Replace overburden</text><text x="54" y="338" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">refill the pit, recreate the slope</text><text x="54" y="396" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Soil improvement</text><text x="54" y="418" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">topsoil, organic matter, fertiliser</text><text x="54" y="476" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Bioremediation</text><text x="54" y="498" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">bacteria or plants break down or absorb</text><text x="54" y="518" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">pollutants</text><text x="54" y="556" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Tree planting</text><text x="54" y="578" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">roots bind soil; habitat returns</text><text x="484" y="316" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Landfill</text><text x="484" y="338" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">fill the pit with waste, then cap it</text><text x="484" y="396" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Lakes</text><text x="484" y="418" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">pits below the water table fill with water</text><text x="484" y="476" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Recreation</text><text x="484" y="498" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">parks, water sports, golf courses</text><text x="484" y="556" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Nature reserves</text><text x="484" y="578" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">wetland and woodland habitats</text><rect x="30" y="640" width="840" height="76" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="671.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Restoration only happens if it is planned and paid for before mining starts, so laws</text><text x="48" y="693.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">often require companies to set money aside.</text>
</svg>