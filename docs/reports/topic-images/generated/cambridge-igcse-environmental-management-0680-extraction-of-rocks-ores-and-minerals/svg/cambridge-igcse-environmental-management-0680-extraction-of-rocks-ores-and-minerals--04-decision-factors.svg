<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 715" width="900" height="715" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="715" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Should the deposit be mined?</text>

<rect x="30" y="110" width="270" height="48" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="165" y="141" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Physical</text><rect x="30" y="172" width="270" height="89" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="42" y="197.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Exploration</text><text x="42" y="226.26" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">surveys, satellite images,</text><text x="42" y="246.26" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">test drilling</text><rect x="30" y="271" width="270" height="89" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="42" y="296.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Geology</text><text x="42" y="325.26" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">depth, shape, angle, rock</text><text x="42" y="345.26" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">hardness</text><rect x="30" y="370" width="270" height="69" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="42" y="395.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Accessibility and terrain</text><text x="42" y="424.26" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">mountains, forest, remoteness</text><rect x="30" y="449" width="270" height="89" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="42" y="474.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Climate</text><text x="42" y="503.26" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">cold, frozen ground, rain,</text><text x="42" y="523.26" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">heat</text><rect x="315" y="110" width="270" height="48" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="141" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Deposit</text><rect x="315" y="172" width="270" height="89" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="327" y="197.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Quantity and quality</text><text x="327" y="226.26" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">ore grade: share of useful</text><text x="327" y="246.26" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">metal in the rock</text><rect x="600" y="110" width="270" height="48" rx="12" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.5"/><text x="735" y="141" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Economic and environmental</text><rect x="600" y="172" width="270" height="89" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="612" y="197.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Supply and demand</text><text x="612" y="226.26" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">rising price makes poorer</text><text x="612" y="246.26" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">deposits worth mining</text><rect x="600" y="271" width="270" height="89" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="612" y="296.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Cost and profit</text><text x="612" y="325.26" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">price must exceed all costs,</text><text x="612" y="345.26" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">including restoration</text><rect x="600" y="370" width="270" height="69" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="612" y="395.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">EIA</text><text x="612" y="424.26" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">can stop or change a project</text><line x1="165" y1="552" x2="330" y2="592" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="450" y1="552" x2="450" y2="592" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="735" y1="552" x2="570" y2="592" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="150" y="598" width="600" height="87" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="631.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Mine opens only if</text><text x="450" y="664.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">it is expected to make a profit and its impacts are acceptable</text>
</svg>