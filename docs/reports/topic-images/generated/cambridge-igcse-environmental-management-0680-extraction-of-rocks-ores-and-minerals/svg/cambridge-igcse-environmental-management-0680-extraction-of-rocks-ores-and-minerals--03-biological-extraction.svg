<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" width="900" height="680" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="680" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Biological extraction</text>

<rect x="30" y="110" width="840" height="200" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="148" font-size="21" font-weight="700" fill="#6f9a52" text-anchor="start">Phytomining: plants</text><rect x="54" y="172" width="182" height="108" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="145" y="208.98" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">plants grown on</text><text x="145" y="229.98" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">low-grade ore or</text><text x="145" y="250.98" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">waste</text><line x1="238" y1="226" x2="253" y2="226" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="256" y="172" width="182" height="108" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="347" y="219.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">roots absorb metal</text><text x="347" y="240.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">compounds</text><line x1="440" y1="226" x2="455" y2="226" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="458" y="172" width="182" height="108" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="549" y="219.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">plants harvested</text><text x="549" y="240.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">and burned</text><line x1="642" y1="226" x2="657" y2="226" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="660" y="172" width="182" height="108" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="751" y="219.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">metal extracted</text><text x="751" y="240.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">from the ash</text><rect x="30" y="330" width="840" height="200" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="368" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="start">Bioleaching: bacteria</text><rect x="54" y="392" width="182" height="108" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="145" y="439.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">bacteria added to</text><text x="145" y="460.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">low-grade ore</text><line x1="238" y1="446" x2="253" y2="446" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="256" y="392" width="182" height="108" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="347" y="439.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">bacteria break</text><text x="347" y="460.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">down the ore</text><line x1="440" y1="446" x2="455" y2="446" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="458" y="392" width="182" height="108" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="549" y="428.98" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">metal compounds</text><text x="549" y="449.98" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">released into a</text><text x="549" y="470.98" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">leachate</text><line x1="642" y1="446" x2="657" y2="446" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="660" y="392" width="182" height="108" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="751" y="439.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">metal recovered</text><text x="751" y="460.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">from the solution</text><rect x="30" y="550" width="410" height="100" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="579.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Benefits</text><text x="48" y="610.54" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">far less digging and energy; less waste;</text><text x="48" y="631.54" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">can use land already mined</text><rect x="460" y="550" width="410" height="100" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="478" y="579.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Limitations</text><text x="478" y="610.54" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">slow; produce only small quantities of</text><text x="478" y="631.54" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">metal</text>
</svg>