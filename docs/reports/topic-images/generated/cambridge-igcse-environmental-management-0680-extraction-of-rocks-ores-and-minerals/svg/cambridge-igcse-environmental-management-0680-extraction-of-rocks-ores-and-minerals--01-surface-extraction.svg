<rect width="900" height="790" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Surface extraction</text>

<rect x="30" y="110" width="840" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="146" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Open-pit (opencast, open-cut) mining</text><path d="M32,220 L230,220 L260,250 L300,250 L330,280 L370,280 L400,310 L500,310 L530,280 L570,280 L600,250 L640,250 L670,220 L868,220 L868,416 L32,416 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><rect x="32" y="220" width="198" height="26" rx="0" fill="#f2e7b8" stroke="#1e2a44" stroke-width="1.5"/><rect x="670" y="220" width="198" height="26" rx="0" fill="#f2e7b8" stroke="#1e2a44" stroke-width="1.5"/><rect x="250" y="310" width="400" height="50" rx="0" fill="#9c8f6e"/><text x="450" y="342" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">deposit</text><text x="130" y="238" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">overburden</text><line x1="330" y1="198" x2="312" y2="246" stroke="#1e2a44" stroke-width="2"/><text x="300" y="174" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">benches stop the walls collapsing;</text><text x="300" y="192" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">ramps let trucks climb out</text><path d="M740,220 Q790,160 840,220 Z" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><text x="790" y="266" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">waste heap</text><rect x="30" y="460" width="840" height="300" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="496" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Strip mining (thin, flat seam near the surface)</text><path d="M60,580 Q125,550 190,580 L190,660 L60,660 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2"/><rect x="60" y="660" width="130" height="40" rx="0" fill="#9c8f6e" stroke="#1e2a44" stroke-width="1.5"/><path d="M190,580 Q255,550 320,580 L320,660 L190,660 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2"/><rect x="190" y="660" width="130" height="40" rx="0" fill="#9c8f6e" stroke="#1e2a44" stroke-width="1.5"/><rect x="320" y="660" width="130" height="0" rx="0" fill="#1e2a44"/><path d="M320,660 L450,660" stroke="#1e2a44" stroke-width="2"/><rect x="320" y="660" width="130" height="40" rx="0" fill="#9c8f6e" stroke="#1e2a44" stroke-width="1.5"/><rect x="450" y="570" width="130" height="70" rx="0" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><rect x="450" y="640" width="130" height="20" rx="0" fill="#1e2a44"/><rect x="450" y="660" width="130" height="40" rx="0" fill="#9c8f6e" stroke="#1e2a44" stroke-width="1.5"/><rect x="580" y="570" width="130" height="70" rx="0" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><rect x="580" y="640" width="130" height="20" rx="0" fill="#1e2a44"/><rect x="580" y="660" width="130" height="40" rx="0" fill="#9c8f6e" stroke="#1e2a44" stroke-width="1.5"/><rect x="710" y="570" width="130" height="70" rx="0" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><rect x="710" y="640" width="130" height="20" rx="0" fill="#1e2a44"/><rect x="710" y="660" width="130" height="40" rx="0" fill="#9c8f6e" stroke="#1e2a44" stroke-width="1.5"/><text x="385" y="650" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">seam taken</text><text x="190" y="540" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">filled with overburden earlier</text><text x="645" y="620" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">overburden</text><text x="645" y="656" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">seam</text><path d="M515,566 Q450,500 385,604" fill="none" stroke="#8a6d0d" stroke-width="3.5" marker-end="url(#ahO)"/><text x="855" y="526" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="end">next strip’s overburden is dumped into the gap</text><line x1="500" y1="730" x2="780" y2="730" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><text x="490" y="736" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">mining moves this way, one strip at a time</text><text x="858" y="434" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">Not to scale</text>
</svg>