<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three 1.5 V cells, one turned round</text>

<rect x="30" y="110" width="840" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><line x1="150" y1="260" x2="750" y2="260" stroke="#1e2a44" stroke-width="3" stroke-linecap="round"/><line x1="217" y1="260" x2="283" y2="260" stroke="#ffffff" stroke-width="9" stroke-linecap="butt"/><line x1="215" y1="260" x2="245" y2="260" stroke="#1e2a44" stroke-width="3" stroke-linecap="round"/><line x1="257" y1="260" x2="285" y2="260" stroke="#1e2a44" stroke-width="3" stroke-linecap="round"/><line x1="245" y1="236" x2="245" y2="284" stroke="#1e2a44" stroke-width="3" stroke-linecap="round"/><line x1="257" y1="248" x2="257" y2="272" stroke="#1e2a44" stroke-width="7" stroke-linecap="round"/><line x1="417" y1="260" x2="483" y2="260" stroke="#ffffff" stroke-width="9" stroke-linecap="butt"/><g transform="rotate(180 450 260)"><line x1="415" y1="260" x2="445" y2="260" stroke="#1e2a44" stroke-width="3" stroke-linecap="round"/><line x1="457" y1="260" x2="485" y2="260" stroke="#1e2a44" stroke-width="3" stroke-linecap="round"/><line x1="445" y1="236" x2="445" y2="284" stroke="#1e2a44" stroke-width="3" stroke-linecap="round"/><line x1="457" y1="248" x2="457" y2="272" stroke="#1e2a44" stroke-width="7" stroke-linecap="round"/></g><line x1="617" y1="260" x2="683" y2="260" stroke="#ffffff" stroke-width="9" stroke-linecap="butt"/><line x1="615" y1="260" x2="645" y2="260" stroke="#1e2a44" stroke-width="3" stroke-linecap="round"/><line x1="657" y1="260" x2="685" y2="260" stroke="#1e2a44" stroke-width="3" stroke-linecap="round"/><line x1="645" y1="236" x2="645" y2="284" stroke="#1e2a44" stroke-width="3" stroke-linecap="round"/><line x1="657" y1="248" x2="657" y2="272" stroke="#1e2a44" stroke-width="7" stroke-linecap="round"/><text x="250" y="324" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="middle">+1.5 V</text><text x="450" y="324" font-size="21" font-weight="700" fill="#b5602e" text-anchor="middle">−1.5 V</text><text x="650" y="324" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="middle">+1.5 V</text><text x="450" y="210" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">reversed</text><text x="450" y="160" font-size="18" font-weight="400" fill="#4a5568" text-anchor="middle">Cells facing the same way add; a reversed cell opposes them</text><rect x="200" y="360" width="500" height="56" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="395.35" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">total e.m.f. = 1.5 + 1.5 − 1.5 = 1.5 V</text>
