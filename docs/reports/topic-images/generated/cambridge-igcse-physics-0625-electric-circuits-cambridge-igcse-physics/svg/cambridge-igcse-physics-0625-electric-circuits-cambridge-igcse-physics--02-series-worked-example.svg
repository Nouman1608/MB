<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Series circuit: one current, shared p.d.</text>

<rect x="30" y="110" width="840" height="340" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><polyline points="110,200 790,200 790,380 110,380 110,200" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><line x1="110" y1="242" x2="110" y2="338" stroke="#ffffff" stroke-width="9" stroke-linecap="butt"/><g transform="rotate(90 110 290)"><line x1="60" y1="290" x2="88" y2="290" stroke="#1e2a44" stroke-width="3" stroke-linecap="round"/><line x1="134" y1="290" x2="160" y2="290" stroke="#1e2a44" stroke-width="3" stroke-linecap="round"/><line x1="88" y1="266" x2="88" y2="314" stroke="#1e2a44" stroke-width="3" stroke-linecap="round"/><line x1="100" y1="278" x2="100" y2="302" stroke="#1e2a44" stroke-width="7" stroke-linecap="round"/><line x1="122" y1="266" x2="122" y2="314" stroke="#1e2a44" stroke-width="3" stroke-linecap="round"/><line x1="134" y1="278" x2="134" y2="302" stroke="#1e2a44" stroke-width="7" stroke-linecap="round"/><line x1="100" y1="290" x2="122" y2="290" stroke="#1e2a44" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="3 4"/></g><text x="76" y="250" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">+</text><text x="80" y="296" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="end">12 V</text><line x1="257" y1="200" x2="323" y2="200" stroke="#ffffff" stroke-width="9" stroke-linecap="butt"/><line x1="255" y1="200" x2="264" y2="200" stroke="#1e2a44" stroke-width="3" stroke-linecap="round"/><line x1="316" y1="200" x2="325" y2="200" stroke="#1e2a44" stroke-width="3" stroke-linecap="round"/><rect x="264" y="189" width="52" height="22" rx="0" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="290" y="174" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">10 Ω</text><text x="290" y="244" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">2.0 V</text><line x1="417" y1="200" x2="483" y2="200" stroke="#ffffff" stroke-width="9" stroke-linecap="butt"/><line x1="415" y1="200" x2="424" y2="200" stroke="#1e2a44" stroke-width="3" stroke-linecap="round"/><line x1="476" y1="200" x2="485" y2="200" stroke="#1e2a44" stroke-width="3" stroke-linecap="round"/><rect x="424" y="189" width="52" height="22" rx="0" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="450" y="174" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">20 Ω</text><text x="450" y="244" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">4.0 V</text><line x1="577" y1="200" x2="643" y2="200" stroke="#ffffff" stroke-width="9" stroke-linecap="butt"/><line x1="575" y1="200" x2="584" y2="200" stroke="#1e2a44" stroke-width="3" stroke-linecap="round"/><line x1="636" y1="200" x2="645" y2="200" stroke="#1e2a44" stroke-width="3" stroke-linecap="round"/><rect x="584" y="189" width="52" height="22" rx="0" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="610" y="174" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">30 Ω</text><text x="610" y="244" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">6.0 V</text><line x1="417" y1="380" x2="483" y2="380" stroke="#ffffff" stroke-width="9" stroke-linecap="butt"/><line x1="415" y1="380" x2="431" y2="380" stroke="#1e2a44" stroke-width="3" stroke-linecap="round"/><line x1="469" y1="380" x2="485" y2="380" stroke="#1e2a44" stroke-width="3" stroke-linecap="round"/><circle cx="450" cy="380" r="19" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="450" y="387" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">A</text><text x="450" y="430" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">0.20 A everywhere</text><path d="M209,200 L191,192.8 L191,207.2 Z" fill="#b5602e"/><path d="M709,200 L691,192.8 L691,207.2 Z" fill="#b5602e"/><path d="M790,299 L782.8,281 L797.2,281 Z" fill="#b5602e"/><path d="M611,380 L629,372.8 L629,387.2 Z" fill="#b5602e"/><path d="M271,380 L289,372.8 L289,387.2 Z" fill="#b5602e"/><path d="M110,211 L102.8,229 L117.2,229 Z" fill="#b5602e"/><text x="450" y="272" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="middle">p.d. across each resistor (V = IR)</text><rect x="30" y="470" width="840" height="186" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="506" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Worked example 1</text><text x="50" y="540" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">total R = 10 + 20 + 30 = 60 Ω</text><text x="50" y="572" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">I = V / R = 12 / 60 = 0.20 A  (same through all three)</text><text x="50" y="604" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">V = I R:  0.20 × 10 = 2.0 V,  0.20 × 20 = 4.0 V,  0.20 × 30 = 6.0 V</text><text x="50" y="636" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">check: 2.0 + 4.0 + 6.0 = 12 V</text>
