<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Series resistor plus a parallel pair</text>

<rect x="30" y="72" width="148.8" height="30" rx="15" fill="#8a6d0d"/><text x="42" y="93" font-size="16" font-weight="700" fill="#ffffff" text-anchor="start">Extended only</text><rect x="30" y="130" width="545" height="418" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><polyline points="80,210 460,210 460,430 80,430 80,210" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><polyline points="340,210 340,430" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><line x1="80" y1="272" x2="80" y2="368" stroke="#ffffff" stroke-width="9" stroke-linecap="butt"/><g transform="rotate(90 80 320)"><line x1="30" y1="320" x2="58" y2="320" stroke="#1e2a44" stroke-width="3" stroke-linecap="round"/><line x1="104" y1="320" x2="130" y2="320" stroke="#1e2a44" stroke-width="3" stroke-linecap="round"/><line x1="58" y1="296" x2="58" y2="344" stroke="#1e2a44" stroke-width="3" stroke-linecap="round"/><line x1="70" y1="308" x2="70" y2="332" stroke="#1e2a44" stroke-width="7" stroke-linecap="round"/><line x1="92" y1="296" x2="92" y2="344" stroke="#1e2a44" stroke-width="3" stroke-linecap="round"/><line x1="104" y1="308" x2="104" y2="332" stroke="#1e2a44" stroke-width="7" stroke-linecap="round"/><line x1="70" y1="320" x2="92" y2="320" stroke="#1e2a44" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="3 4"/></g><text x="46" y="280" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">+</text><text x="110" y="326" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">12 V</text><line x1="177" y1="210" x2="243" y2="210" stroke="#ffffff" stroke-width="9" stroke-linecap="butt"/><line x1="175" y1="210" x2="184" y2="210" stroke="#1e2a44" stroke-width="3" stroke-linecap="round"/><line x1="236" y1="210" x2="245" y2="210" stroke="#1e2a44" stroke-width="3" stroke-linecap="round"/><rect x="184" y="199" width="52" height="22" rx="0" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="210" y="184" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">4.0 Ω</text><text x="210" y="254" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">6.0 V</text><line x1="340" y1="287" x2="340" y2="353" stroke="#ffffff" stroke-width="9" stroke-linecap="butt"/><g transform="rotate(90 340 320)"><line x1="305" y1="320" x2="314" y2="320" stroke="#1e2a44" stroke-width="3" stroke-linecap="round"/><line x1="366" y1="320" x2="375" y2="320" stroke="#1e2a44" stroke-width="3" stroke-linecap="round"/><rect x="314" y="309" width="52" height="22" rx="0" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/></g><text x="314" y="316" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">6.0 Ω</text><line x1="460" y1="287" x2="460" y2="353" stroke="#ffffff" stroke-width="9" stroke-linecap="butt"/><g transform="rotate(90 460 320)"><line x1="425" y1="320" x2="434" y2="320" stroke="#1e2a44" stroke-width="3" stroke-linecap="round"/><line x1="486" y1="320" x2="495" y2="320" stroke="#1e2a44" stroke-width="3" stroke-linecap="round"/><rect x="434" y="309" width="52" height="22" rx="0" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/></g><text x="486" y="316" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">12 Ω</text><circle cx="340" cy="210" r="6" fill="#1e2a44"/><circle cx="340" cy="430" r="6" fill="#1e2a44"/><path d="M149,210 L131,202.8 L131,217.2 Z" fill="#b5602e"/><text x="130" y="192" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">1.5 A</text><path d="M340,264 L332.8,246 L347.2,246 Z" fill="#b5602e"/><text x="326" y="262" font-size="18" font-weight="700" fill="#b5602e" text-anchor="end">1.0 A</text><path d="M409,210 L391,202.8 L391,217.2 Z" fill="#b5602e"/><path d="M460,264 L452.8,246 L467.2,246 Z" fill="#b5602e"/><text x="474" y="262" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">0.50 A</text><path d="M201,430 L219,422.8 L219,437.2 Z" fill="#b5602e"/><text x="210" y="460" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">1.5 A</text><text x="474" y="352" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">6.0 V</text><text x="314" y="344" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="end">6.0 V</text><rect x="60" y="485" width="485" height="70" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="302.5" y="513.45" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">4.0 Ω is less than both 6.0 Ω and 12 Ω,</text><text x="302.5" y="538.45" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">as a parallel pair must be</text><rect x="590" y="130" width="270" height="418" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="610" y="166" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Step by step</text><text x="610" y="200" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">1/R = 1/6.0 + 1/12</text><text x="670" y="230" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">= 3/12</text><text x="610" y="260" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">R pair = 4.0 Ω</text><text x="610" y="290" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">total = 4.0 + 4.0</text><text x="670" y="320" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">= 8.0 Ω</text><text x="610" y="350" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">I = 12 / 8.0</text><text x="640" y="380" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">= 1.5 A</text><text x="610" y="410" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">4.0 Ω: 1.5 × 4.0 = 6.0 V</text><text x="610" y="440" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">pair: 12 − 6.0 = 6.0 V</text><text x="610" y="470" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">6.0/6.0 = 1.0 A</text><text x="610" y="500" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">6.0/12 = 0.50 A</text><text x="610" y="530" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">1.0 + 0.50 = 1.5 A ✓</text>
</svg>