<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="700" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Energy flows one way along a food chain</text>

<rect x="110" y="570" width="400" height="90" rx="12" fill="#6f9a52" stroke="#1e2a44" stroke-width="2.5"/><text x="310" y="608" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Producers</text><text x="310" y="636" font-size="17" font-weight="400" fill="#ffffff" text-anchor="middle">10 000 units</text><line x1="310" y1="568" x2="310" y2="542" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><text x="325" y="560" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">~10%</text><path d="M516,615 Q520.4,627.0 524.8,615.0 Q529.2,603.0 533.6,615.0 Q538.0,627.0 542.4,615.0 Q546.8,603.0 551.2,615.0 Q555.6,627.0 560.0,615.0 L582,615" fill="none" stroke="#b5602e" stroke-width="3.5" stroke-linecap="round" marker-end="url(#ahR)"/><rect x="150" y="450" width="320" height="90" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="310" y="488" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Primary consumers</text><text x="310" y="516" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">1000 units</text><line x1="310" y1="448" x2="310" y2="422" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><text x="325" y="440" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">~10%</text><path d="M476,495 Q480.4,507.0 484.8,495.0 Q489.2,483.0 493.6,495.0 Q498.0,507.0 502.4,495.0 Q506.8,483.0 511.2,495.0 Q515.6,507.0 520.0,495.0 L542,495" fill="none" stroke="#b5602e" stroke-width="3.5" stroke-linecap="round" marker-end="url(#ahR)"/><rect x="185" y="330" width="250" height="90" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="310" y="368" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Secondary consumers</text><text x="310" y="396" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">100 units</text><line x1="310" y1="328" x2="310" y2="302" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><text x="325" y="320" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">~10%</text><path d="M441,375 Q445.4,387.0 449.8,375.0 Q454.2,363.0 458.6,375.0 Q463.0,387.0 467.4,375.0 Q471.8,363.0 476.2,375.0 Q480.6,387.0 485.0,375.0 L507,375" fill="none" stroke="#b5602e" stroke-width="3.5" stroke-linecap="round" marker-end="url(#ahR)"/><rect x="210" y="210" width="200" height="90" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="310" y="248" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Tertiary consumers</text><text x="310" y="276" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">10 units</text><path d="M416,255 Q420.4,267.0 424.8,255.0 Q429.2,243.0 433.6,255.0 Q438.0,267.0 442.4,255.0 Q446.8,243.0 451.2,255.0 Q455.6,267.0 460.0,255.0 L482,255" fill="none" stroke="#b5602e" stroke-width="3.5" stroke-linecap="round" marker-end="url(#ahR)"/><text x="488" y="261" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">heat</text><text x="45" y="165" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="start">Sunlight</text><path d="M75,180 C60,380 60,560 104,612" fill="none" stroke="#8a6d0d" stroke-width="4" stroke-linecap="round" marker-end="url(#ahO)"/><rect x="590" y="110" width="280" height="570" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="612" y="150" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Why so much is lost</text><text x="612" y="186" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Not all of a level is</text><text x="612" y="208" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">eaten (roots, bark,</text><text x="612" y="230" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">bones).</text><text x="612" y="264" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Not all that is eaten</text><text x="612" y="286" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">is digested: it leaves</text><text x="612" y="308" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">as faeces.</text><text x="612" y="342" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Much of what is</text><text x="612" y="364" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">assimilated is used in</text><text x="612" y="386" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">respiration and lost</text><text x="612" y="408" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">as heat.</text><line x1="612" y1="440" x2="848" y2="440" stroke="#c9d6d4" stroke-width="2"/><text x="612" y="470" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Worked example</text><text x="612" y="496" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Pond: NPP 7400,</text><text x="612" y="518" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">primary consumers</text><text x="612" y="540" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">store 666</text><text x="612" y="562" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">kJ m⁻² yr⁻¹</text><text x="612" y="600" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">666 / 7400 × 100</text><text x="612" y="626" font-size="22" font-weight="700" fill="#8a6d0d" text-anchor="start">= 9.0%</text><text x="612" y="660" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">So food chains are short.</text>
</svg>