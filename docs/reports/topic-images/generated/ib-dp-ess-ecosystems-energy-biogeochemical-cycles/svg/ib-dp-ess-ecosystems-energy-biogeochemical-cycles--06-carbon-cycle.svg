"M590,150 C700,150 760,230 760,326" fill="none" stroke="#2e6b62" stroke-width="3.5" stroke-linecap="round" marker-end="url(#ahT)"/><text x="720" y="200" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">dissolving</text><path d="M680,326 C680,260 650,200 594,175" fill="none" stroke="#2e6b62" stroke-width="3.5" stroke-linecap="round" marker-end="url(#ahT)"/><text x="668" y="270" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="end">release</text><path d="M760,406 L760,686" fill="none" stroke="#1e2a44" stroke-width="3.5" stroke-linecap="round" marker-end="url(#ah)" stroke-dasharray="8 6"/><text x="768" y="560" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">sedimentation</text><text x="768" y="580" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">(slow)</text><path d="M240,596 C220,630 200,660 185,686" fill="none" stroke="#1e2a44" stroke-width="3.5" stroke-linecap="round" marker-end="url(#ah)" stroke-dasharray="8 6"/><text x="232" y="660" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">fossilisation (slow)</text><path d="M80,360 C62,360 52,352 49,330" fill="none" stroke="#b5602e" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><path d="M70,690 C40,600 40,250 306,140" fill="none" stroke="#b5602e" stroke-width="6" stroke-linecap="round" marker-end="url(#ahR)"/><text x="52" y="470" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">combustion</text><rect x="30" y="790" width="840" height="110" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="56" y="812" width="40" height="26" rx="6" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="108" y="832" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">storage (stock)</text><line x1="290" y1="825" x2="340" y2="825" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="352" y="832" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">flow</text><line x1="440" y1="825" x2="490" y2="825" stroke="#b5602e" stroke-width="6" marker-end="url(#ahR)"/><text x="502" y="832" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">combustion of fossil fuels and biomass</text><text x="56" y="876" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Humans speed up combustion and remove sinks (deforestation): CO₂ about 280 ppm → above 420 ppm.</text>
</svg>