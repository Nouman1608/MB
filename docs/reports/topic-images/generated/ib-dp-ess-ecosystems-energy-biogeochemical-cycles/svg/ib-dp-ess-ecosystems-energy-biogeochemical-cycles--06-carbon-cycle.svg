<rect width="900" height="920" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The carbon cycle: storages and flows</text>

<rect x="310" y="115" width="280" height="70" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="146.19000000000003" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Atmosphere</text><text x="450" y="166.23000000000002" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">CO₂, CH₄</text><rect x="80" y="330" width="190" height="74" rx="12" fill="#cfe0c0" stroke="#1e2a44" stroke-width="2.5"/><text x="175" y="363.18999999999994" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Producers</text><text x="175" y="383.22999999999996" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">biomass</text><rect x="360" y="330" width="190" height="74" rx="12" fill="#cfe0c0" stroke="#1e2a44" stroke-width="2.5"/><text x="455" y="363.18999999999994" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Consumers</text><text x="455" y="383.22999999999996" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">biomass</text><rect x="660" y="330" width="200" height="74" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="760" y="363.18999999999994" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Oceans</text><text x="760" y="383.22999999999996" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">dissolved CO₂, carbonate</text><rect x="200" y="520" width="250" height="74" rx="12" fill="#efdfa8" stroke="#1e2a44" stroke-width="2.5"/><text x="325" y="553.19" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Soil organic matter</text><text x="325" y="573.23" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">dead matter</text><rect x="60" y="690" width="230" height="74" rx="12" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.5"/><text x="175" y="723.19" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Fossil fuels</text><text x="175" y="743.23" font-size="1