<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 635" width="900" height="635" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="635" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three kinds of ecological pyramid</text>

<rect x="30" y="110" width="270" height="470" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="165" y="150" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Numbers</text><text x="165" y="174" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">individuals per level</text><rect x="45" y="300" width="240" height="56" rx="4" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="165" y="335" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">caterpillars: thousands</text><rect x="135" y="360" width="60" height="56" rx="4" fill="#6f9a52" stroke="#1e2a44" stroke-width="2.5"/><text x="165" y="395" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">oak</text><rect x="50" y="440" width="230" height="50" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="165" y="472" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Can be inverted</text><text x="165" y="525.25" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">One oak tree can support</text><text x="165" y="545.25" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">thousands of caterpillars.</text><rect x="315" y="110" width="270" height="470" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="150" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Biomass</text><text x="450" y="174" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">standing stock, g m⁻²</text><rect x="350" y="300" width="200" height="56" rx="4" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="335" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">zooplankton</text><rect x="390" y="360" width="120" height="56" rx="4" fill="#6f9a52" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="395" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">phytoplankton</text><rect x="335" y="440" width="230" height="50" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="472" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Can be inverted</text><text x="450" y="515.25" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">In water, fast-reproducing</text><text x="450" y="535.25" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">phytoplankton support more</text><text x="450" y="555.25" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">zooplankton mass at one time.</text><rect x="600" y="110" width="270" height="470" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="735" y="150" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Productivity</text><text x="735" y="174" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">energy flow, kJ m⁻² yr⁻¹</text><rect x="705" y="200" width="60" height="56" rx="4" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="735" y="235" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle"></text><rect x="680" y="250" width="110" height="56" rx="4" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="735" y="285" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle"></text><rect x="650" y="300" width="170" height="56" rx="4" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="735" y="335" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle"></text><rect x="620" y="360" width="230" height="56" rx="4" fill="#6f9a52" stroke="#1e2a44" stroke-width="2.5"/><text x="735" y="395" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">producers</text><rect x="620" y="440" width="230" height="50" rx="12" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><text x="735" y="472" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Never inverted</text><text x="735" y="515.25" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Each level receives only a</text><text x="735" y="535.25" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">fraction of the energy of</text><text x="735" y="555.25" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">the one below.</text><text x="450" y="610" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Bars not to scale. Pyramid shape also explains biomagnification of persistent toxins.</text>
</svg>