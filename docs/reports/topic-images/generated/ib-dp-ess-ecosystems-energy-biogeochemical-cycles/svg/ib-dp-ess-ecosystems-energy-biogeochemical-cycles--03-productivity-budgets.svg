<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Where the energy goes: GPP to NSP</text>

<rect x="30" y="110" width="840" height="310" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="148" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Producers (grassland)</text><text x="310" y="148" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">kJ m⁻² yr⁻¹</text><rect x="60" y="240" width="240" height="150" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="180" y="310" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">GPP</text><text x="180" y="336" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">18 500</text><path d="M300,240 C350,240 370,210 370,190 L460,190 C460,290 395,330 300,330 Z" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><path d="M360,190 L470,190 L415,164 Z" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><rect x="300" y="330" width="540" height="60" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="480" y="196" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">R 11 100</text><text x="480" y="218" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">lost as heat</text><text x="600" y="368" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">NPP = 18 500 − 11 100 = 7400 (40.0% of GPP)</text><rect x="30" y="440" width="840" height="360" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="478" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Grasshoppers (primary consumers)</text><text x="442" y="478" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">kJ m⁻² yr⁻¹</text><rect x="60" y="560" width="200" height="150" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="160" y="624" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Food eaten</text><text x="160" y="650" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">1850</text><path d="M260,710 C310,710 330,740 330,760 L420,760 C420,660 355,620 260,620 Z" fill="#efdfa8" stroke="#1e2a44" stroke-width="2"/><path d="M320,760 L430,760 L375,786 Z" fill="#efdfa8" stroke="#1e2a44" stroke-width="2"/><rect x="260" y="560" width="240" height="60" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="440" y="720" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">faeces 1110</text><text x="440" y="742" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">not assimilated</text><text x="330" y="598" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">GSP 740</text><path d="M500,560 C550,560 570,530 570,520 L618,520 C618,568 574,608 500,608 Z" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><path d="M560,520 L628,520 L594,494 Z" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><rect x="500" y="608" width="340" height="12" fill="#6f9a52" stroke="#1e2a44" stroke-width="2"/><text x="640" y="528" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">R 592</text><text x="640" y="550" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">lost as heat</text><text x="840" y="652" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">NSP = 740 − 592 = 148</text><text x="840" y="676" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end">new consumer biomass</text><text x="840" y="478" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">GSP = 1850 − 1110 = 740</text>
</svg>