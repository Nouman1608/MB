<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 670" width="900" height="670" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="670" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Population growth: J-curve and S-curve</text>

<rect x="30" y="110" width="410" height="540" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="235" y="150" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">J-curve</text><line x1="90" y1="520" x2="415" y2="520" stroke="#1e2a44" stroke-width="3"/><line x1="90" y1="520" x2="90" y2="180" stroke="#1e2a44" stroke-width="3"/><text x="252.5" y="550" font-size="16" font-weight="600" fill="#4a5568" text-anchor="middle">time →</text><text x="64" y="355" font-size="16" font-weight="600" fill="#4a5568" text-anchor="middle" transform="rotate(-90 64 355)">population size</text><path d="M92,512 C200,505 250,440 290,200" fill="none" stroke="#b5602e" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><path d="M290,200 C300,190 310,420 340,500" fill="none" stroke="#b5602e" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="9 6"/><text x="110" y="240" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">exponential</text><text x="110" y="260" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">growth, no limit</text><text x="330" y="420" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">crash</text><text x="60" y="600" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Usually ends in a crash when</text><text x="60" y="621" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">resources run out.</text><rect x="460" y="110" width="410" height="540" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="665" y="150" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">S-curve</text><line x1="520" y1="520" x2="845" y2="520" stroke="#1e2a44" stroke-width="3"/><line x1="520" y1="520" x2="520" y2="180" stroke="#1e2a44" stroke-width="3"/><text x="682.5" y="550" font-size="16" font-weight="600" fill="#4a5568" text-anchor="middle">time →</text><text x="494" y="355" font-size="16" font-weight="600" fill="#4a5568" text-anchor="middle" transform="rotate(-90 494 355)">population size</text><line x1="520" y1="230" x2="845" y2="230" stroke="#2e6b62" stroke-width="2.5" stroke-dasharray="9 6"/><text x="525" y="220" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">carrying capacity (K)</text><path d="M522,512 C580,510 600,500 640,440 C680,370 700,280 740,250 C770,232 800,232 845,232" fill="none" stroke="#2e6b62" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="560" cy="480" r="15" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="560" y="485.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="582" y="486" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">lag</text><circle cx="660" cy="400" r="15" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="660" y="405.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="682" y="406" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">exponential</text><circle cx="740" cy="290" r="15" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="740" y="295.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="762" y="296" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">transitional</text><circle cx="775" cy="205" r="15" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="775" y="210.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="797" y="211" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">plateau</text><text x="490" y="600" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Negative feedback holds the plateau:</text><text x="490" y="621" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">birth rate falls, death rate rises.</text>
</svg>