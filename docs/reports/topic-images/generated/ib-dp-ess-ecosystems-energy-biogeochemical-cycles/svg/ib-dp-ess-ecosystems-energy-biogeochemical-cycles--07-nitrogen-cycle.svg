<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 880" width="900" height="880" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="880" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The nitrogen cycle</text>

<rect x="320" y="115" width="260" height="70" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="146.52" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Nitrogen gas, N₂</text><text x="450" y="166.84" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">atmosphere</text><rect x="40" y="330" width="180" height="70" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="130" y="361.52000000000004" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Ammonium</text><text x="130" y="381.84000000000003" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">NH₄⁺ in soil</text><rect x="360" y="330" width="180" height="70" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="361.52000000000004" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Nitrite</text><text x="450" y="381.84000000000003" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">NO₂⁻</text><rect x="680" y="330" width="180" height="70" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="770" y="361.52000000000004" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Nitrate</text><text x="770" y="381.84000000000003" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">NO₃⁻ in soil</text><rect x="40" y="560" width="180" height="74" rx="12" fill="#efdfa8" stroke="#1e2a44" stroke-width="2.5"/><text x="130" y="593.5199999999999" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Dead matter</text><text x="130" y="613.8399999999999" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">and waste</text><rect x="360" y="560" width="180" height="74" rx="12" fill="#cfe0c0" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="593.5199999999999" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Animals</text><text x="450" y="613.8399999999999" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">proteins</text><rect x="680" y="560" width="180" height="74" rx="12" fill="#cfe0c0" stroke="#1e2a44" stroke-width="2.5"/><text x="770" y="593.5199999999999" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Plants</text><text x="770" y="613.8399999999999" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">proteins</text><path d="M318,150 C200,150 140,220 130,326" fill="none" stroke="#2e6b62" stroke-width="4.5" stroke-linecap="round" marker-end="url(#ahT)"/><text x="178" y="232" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">Fixation</text><text x="178" y="251" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="start">bacteria, Rhizobium,</text><text x="178" y="270" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="start">Haber process</text><line x1="222" y1="365" x2="356" y2="365" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><line x1="542" y1="365" x2="676" y2="365" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><text x="450" y="430" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">Nitrification</text><text x="450" y="449" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="middle">needs oxygen</text><path d="M800,326 C870,220 760,140 584,152" fill="none" stroke="#8a6d0d" stroke-width="4" stroke-linecap="round" marker-end="url(#ahO)"/><text x="790" y="236" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="end">Denitrification</text><text x="790" y="255" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="end">anaerobic,</text><text x="790" y="274" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="end">waterlogged soil</text><path d="M560,186 C620,230 680,280 700,324" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linecap="round" marker-end="url(#ah)" stroke-dasharray="7 5"/><text x="612" y="250" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">lightning</text><line x1="730" y1="404" x2="730" y2="556" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><text x="718" y="470" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">Assimilation</text><text x="718" y="489" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="end">uptake by plants</text><line x1="676" y1="597" x2="544" y2="597" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><text x="610" y="585" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">feeding</text><line x1="356" y1="597" x2="224" y2="597" stroke="#8a6d0d" stroke-width="4" marker-end="url(#ahO)"/><path d="M770,636 C770,690 130,690 130,640" fill="none" stroke="#8a6d0d" stroke-width="3.5" stroke-linecap="round" marker-end="url(#ahO)"/><text x="450" y="708" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">death and waste</text><line x1="130" y1="556" x2="130" y2="404" stroke="#8a6d0d" stroke-width="4" marker-end="url(#ahO)"/><text x="142" y="470" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="start">Ammonification</text><text x="142" y="489" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="start">decomposers</text><line x1="840" y1="406" x2="840" y2="496" stroke="#b5602e" stroke-width="4" marker-end="url(#ahR)" stroke-dasharray="8 6"/><text x="862" y="522" font-size="16" font-weight="700" fill="#b5602e" text-anchor="end">Leaching</text><text x="862" y="541" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="end">to rivers, lakes</text><rect x="30" y="740" width="840" height="120" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="56" y="776" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Human impacts</text><text x="56" y="804" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Haber process fixes N for fertiliser; excess nitrate leaches and can cause eutrophication.</text><text x="56" y="828" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Draining land reduces denitrification; burning fuels releases nitrogen oxides (acid deposition).</text>
</svg>