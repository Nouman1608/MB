<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="900" height="650" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="650" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Further galaxies, bigger red-shift</text>

<defs><linearGradient id="spec" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#2b5a9a"/><stop offset="0.38" stop-color="#b5d3cf"/><stop offset="0.68" stop-color="#d4b02e"/><stop offset="1" stop-color="#b5602e"/></linearGradient></defs><circle cx="90" cy="230" r="32" fill="#b5d3cf" stroke="#2e6b62" stroke-width="3"/><text x="90" y="290" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Earth</text><g transform="translate(280 230) scale(1.26)"><ellipse rx="34" ry="13" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" transform="rotate(-20)"/><ellipse rx="12" ry="7" fill="#d4b02e" transform="rotate(-20)"/></g><line x1="320" y1="230" x2="360" y2="230" stroke="#b5602e" stroke-width="3.5" marker-end="url(#ahR)"/><rect x="190" y="320" width="180" height="40" rx="3" fill="url(#spec)" stroke="#1e2a44" stroke-width="2" /><line x1="230" y1="322" x2="230" y2="358" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4"/><line x1="244" y1="322" x2="244" y2="358" stroke="#1e2a44" stroke-width="5" stroke-linecap="butt"/><text x="280" y="390" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">near</text><text x="280" y="412" font-size="16" font-weight="600" fill="#b5602e" text-anchor="middle">small red-shift</text><g transform="translate(480 230) scale(1.1199999999999999)"><ellipse rx="34" ry="13" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" transform="rotate(-20)"/><ellipse rx="12" ry="7" fill="#d4b02e" transform="rotate(-20)"/></g><line x1="520" y1="230" x2="590" y2="230" stroke="#b5602e" stroke-width="4.5" marker-end="url(#ahR)"/><rect x="390" y="320" width="180" height="40" rx="3" fill="url(#spec)" stroke="#1e2a44" stroke-width="2" /><line x1="430" y1="322" x2="430" y2="358" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4"/><line x1="466" y1="322" x2="466" y2="358" stroke="#1e2a44" stroke-width="5" stroke-linecap="butt"/><text x="480" y="390" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">further</text><text x="480" y="412" font-size="16" font-weight="600" fill="#b5602e" text-anchor="middle">bigger red-shift</text><g transform="translate(680 230) scale(0.9799999999999999)"><ellipse rx="34" ry="13" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" transform="rotate(-20)"/><ellipse rx="12" ry="7" fill="#d4b02e" transform="rotate(-20)"/></g><line x1="720" y1="230" x2="820" y2="230" stroke="#b5602e" stroke-width="5.5" marker-end="url(#ahR)"/><rect x="590" y="320" width="180" height="40" rx="3" fill="url(#spec)" stroke="#1e2a44" stroke-width="2" /><line x1="630" y1="322" x2="630" y2="358" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4"/><line x1="692" y1="322" x2="692" y2="358" stroke="#1e2a44" stroke-width="5" stroke-linecap="butt"/><text x="680" y="390" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">furthest</text><text x="680" y="412" font-size="16" font-weight="600" fill="#b5602e" text-anchor="middle">biggest red-shift</text><line x1="160" y1="460" x2="860" y2="460" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="160" y="490" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">distance from Earth increases →  red-shift increases →  galaxy moves away faster</text><text x="480" y="160" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">arrow length = speed moving away</text><text x="450" y="535" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">dashed line: reference position of the line (laboratory)</text><rect x="30" y="560" width="840" height="70" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="602" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">Almost all distant galaxies are red-shifted: they are moving away from us.</text>
</svg>