<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 535" width="900" height="535" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="535" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">From red-shift to the Big Bang</text>

<rect x="30" y="115" width="400" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="151" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start">Almost all distant galaxies are</text><text x="50" y="175" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start">red-shifted</text><line x1="432" y1="165" x2="466" y2="165" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="470" y="115" width="400" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="490" y="151" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start">Further galaxies are more</text><text x="490" y="175" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start">red-shifted, so they move away faster</text><line x1="670" y1="218" x2="670" y2="250" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="470" y="255" width="400" height="100" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="490" y="291" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start">Simplest explanation: space itself is</text><text x="490" y="315" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start">expanding</text><line x1="468" y1="305" x2="434" y2="305" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="30" y="255" width="400" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="291" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start">Run it backwards: galaxies were once</text><text x="50" y="315" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start">much closer together</text><line x1="230" y1="358" x2="230" y2="390" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="30" y="395" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="431" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start">The whole universe was once in a tiny, hot, dense state: the Big Bang</text><text x="450" y="510" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">Earth is not at the centre: an observer in any galaxy sees the same pattern.</text>
</svg>