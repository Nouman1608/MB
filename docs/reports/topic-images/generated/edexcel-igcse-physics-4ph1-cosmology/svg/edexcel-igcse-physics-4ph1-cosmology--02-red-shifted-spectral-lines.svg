<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Red-shift in the light from a galaxy</text>

<defs><linearGradient id="spec" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#2b5a9a"/><stop offset="0.38" stop-color="#b5d3cf"/><stop offset="0.68" stop-color="#d4b02e"/><stop offset="1" stop-color="#b5602e"/></linearGradient></defs><text x="30" y="176" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Laboratory</text><text x="30" y="198" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">reference λ₀</text><rect x="170" y="150" width="680" height="60" rx="4" fill="url(#spec)" stroke="#1e2a44" stroke-width="2.5" /><line x1="247.06666666666666" y1="153" x2="247.06666666666666" y2="207" stroke="#1e2a44" stroke-width="6" stroke-linecap="butt"/><line x1="364.93333333333334" y1="153" x2="364.93333333333334" y2="207" stroke="#1e2a44" stroke-width="6" stroke-linecap="butt"/><line x1="457.8666666666667" y1="153" x2="457.8666666666667" y2="207" stroke="#1e2a44" stroke-width="6" stroke-linecap="butt"/><line x1="598.4" y1="153" x2="598.4" y2="207" stroke="#1e2a44" stroke-width="6" stroke-linecap="butt"/><line x1="750.2666666666667" y1="153" x2="750.2666666666667" y2="207" stroke="#1e2a44" stroke-width="6" stroke-linecap="butt"/><text x="30" y="316" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Distant</text><text x="30" y="338" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">galaxy</text><rect x="170" y="290" width="680" height="60" rx="4" fill="url(#spec)" stroke="#1e2a44" stroke-width="2.5" /><line x1="296.25333333333344" y1="293" x2="296.25333333333344" y2="347" stroke="#1e2a44" stroke-width="6" stroke-linecap="butt"/><line x1="420.0133333333334" y1="293" x2="420.0133333333334" y2="347" stroke="#1e2a44" stroke-width="6" stroke-linecap="butt"/><line x1="517.5933333333334" y1="293" x2="517.5933333333334" y2="347" stroke="#1e2a44" stroke-width="6" stroke-linecap="butt"/><line x1="665.1533333333334" y1="293" x2="665.1533333333334" y2="347" stroke="#1e2a44" stroke-width="6" stroke-linecap="butt"/><line x1="824.6133333333336" y1="293" x2="824.6133333333336" y2="347" stroke="#1e2a44" stroke-width="6" stroke-linecap="butt"/><line x1="247.06666666666666" y1="222" x2="294.25333333333344" y2="283" stroke="#b5602e" stroke-width="2.5" marker-end="url(#ahR)"/><line x1="364.93333333333334" y1="222" x2="418.0133333333334" y2="283" stroke="#b5602e" stroke-width="2.5" marker-end="url(#ahR)"/><line x1="457.8666666666667" y1="222" x2="515.5933333333334" y2="283" stroke="#b5602e" stroke-width="2.5" marker-end="url(#ahR)"/><line x1="598.4" y1="222" x2="663.1533333333334" y2="283" stroke="#b5602e" stroke-width="2.5" marker-end="url(#ahR)"/><line x1="750.2666666666667" y1="222" x2="822.6133333333336" y2="283" stroke="#b5602e" stroke-width="2.5" marker-end="url(#ahR)"/><text x="170" y="140" font-size="16" font-weight="600" fill="#2b5a9a" text-anchor="start">shorter wavelength (blue end)</text><text x="850" y="140" font-size="16" font-weight="600" fill="#b5602e" text-anchor="end">longer wavelength (red end)</text><rect x="30" y="390" width="410" height="160" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="52" y="428.8" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="start">Same pattern of lines</text><text x="52" y="455.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">So it is the same element: the lines</text><text x="52" y="477.59" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">are recognisably the same set.</text><rect x="460" y="390" width="410" height="160" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="482" y="428.8" font-size="21" font-weight="700" fill="#b5602e" text-anchor="start">Every line at a longer λ</text><text x="482" y="455.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Red-shift: the galaxy is moving away. A</text><text x="482" y="477.59" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">source moving towards us would show</text><text x="482" y="500.03" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">blue-shift.</text>
