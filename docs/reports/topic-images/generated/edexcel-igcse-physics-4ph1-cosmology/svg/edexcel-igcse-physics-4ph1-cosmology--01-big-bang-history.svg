6" fill="#ffffff" stroke="#1e2a44" stroke-width="1.5"/><circle cx="470" cy="300" r="4" fill="#1e2a44" stroke="#1e2a44" stroke-width="1.5"/><circle cx="385" cy="260" r="4" fill="#1e2a44" stroke="#1e2a44" stroke-width="1.5"/><circle cx="460" cy="340" r="6" fill="#ffffff" stroke="#1e2a44" stroke-width="1.5"/><circle cx="430" cy="255" r="4" fill="#1e2a44" stroke="#1e2a44" stroke-width="1.5"/><g transform="translate(560 270) scale(0.8)"><ellipse rx="34" ry="13" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" transform="rotate(-20)"/><ellipse rx="12" ry="7" fill="#d4b02e" transform="rotate(-20)"/></g><g transform="translate(620 340) scale(0.7)"><ellipse rx="34" ry="13" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" transform="rotate(-20)"/><ellipse rx="12" ry="7" fill="#d4b02e" transform="rotate(-20)"/></g><path d="M540.0,323.0 L541.9,327.5 L546.7,327.8 L543.0,331.0 L544.1,335.7 L540.0,333.1 L535.9,335.7 L537.0,331.0 L533.3,327.8 L538.1,327.5 Z" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.2"/><path d="M650.0,249.0 L651.6,252.8 L655.7,253.1 L652.6,255.8 L653.5,259.9 L650.0,257.7 L646.5,259.9 L647.4,255.8 L644.3,253.1 L648.4,252.8 Z" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.2"/><path d="M600.0,295.0 L601.3,298.2 L604.8,298.5 L602.1,300.7 L602.9,304.0 L600.0,302.3 L597.1,304.0 L597.9,300.7 L595.2,298.5 L598.7,298.2 Z" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.2"/><g transform="translate(740 230) scale(0.6)"><ellipse rx="34" ry="13" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" transform="rotate(-20)"/><ellipse rx="12" ry="7" fill="#d4b02e" transform="rotate(-20)"/></g><g transform="translate(800 350) scale(0.6)"><ellipse rx="34" ry="13" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" transform="rotate(-20)"/><ellipse rx="12" ry="7" fill="#d4b02e" transform="rotate(-20)"/></g><line x1="770" y1="290" x2="845" y2="290" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><line x1="760" y1="250" x2="830" y2="200" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><line x1="760" y1="330" x2="830" y2="380" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><line x1="80" y1="135" x2="860" y2="135" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="80" y="124" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">about 13.8 billion years ago</text><text x="860" y="124" font-size="16" font-weight="600" fill="#4a5568" text-anchor="end">today</text><text x="130" y="470" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">hot</text><text x="780" y="470" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">cooler</text><rect x="32" y="480" width="162" height="190" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="58" cy="512" r="17" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="58" y="518.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="82" y="518" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Tiny</text><text x="82" y="538" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">hot</text><text x="46" y="572" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">About 13.8</text><text x="46" y="592" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">billion years</text><text x="46" y="612" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">ago: extremely</text><text x="46" y="632" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">small, hot and</text><text x="46" y="652" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">dense.</text><rect x="200" y="480" width="162" height="190" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="226" cy="512" r="17" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="226" y="518.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="250" y="518" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Expands</text><text x="250" y="538" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">cools</text><text x="214" y="572" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">It began to</text><text x="214" y="592" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">expand, and</text><text x="214" y="612" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">cooled as it</text><text x="214" y="632" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">expanded.</text><rect x="368" y="480" width="162" height="190" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="394" cy="512" r="17" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="394" y="518.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="418" y="518" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Particles</text><text x="418" y="538" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">atoms</text><text x="382" y="572" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">First particles,</text><text x="382" y="592" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">then nuclei and</text><text x="382" y="612" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">atoms of mainly</text><text x="382" y="632" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">hydrogen and</text><text x="382" y="652" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">helium.</text><rect x="536" y="480" width="162" height="190" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="562" cy="512" r="17" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="562" y="518.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="586" y="518" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Stars</text><text x="586" y="538" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">galaxies</text><text x="550" y="572" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Gravity pulled</text><text x="550" y="592" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">matter into</text><text x="550" y="612" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">clouds that</text><text x="550" y="632" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">formed stars and</text><text x="550" y="652" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">galaxies.</text><rect x="704" y="480" width="162" height="190" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="730" cy="512" r="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="730" y="518.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="754" y="518" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Still</text><text x="754" y="538" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">expanding</text><text x="718" y="572" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">The universe is</text><text x="718" y="592" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">still expanding</text><text x="718" y="612" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">today.</text><rect x="30" y="690" width="840" height="62" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="728" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Not an explosion from one place: space itself expands everywhere at once.</text>
</svg>