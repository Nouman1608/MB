<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 555" width="900" height="555" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="555" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Using the red-shift equation</text>

<rect x="30" y="110" width="840" height="70" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="190" y="155" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Δλ / λ₀ = v / c</text><text x="450" y="155" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Δλ = λ − λ₀</text><text x="710" y="155" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">c = 3.0 × 10⁸ m/s</text><rect x="30" y="200" width="410" height="273.6" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="54" y="241.1" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Example 1: find v</text><text x="54" y="281.1" font-size="19" font-weight="400" fill="#4a5568" text-anchor="start">λ₀ = 486 nm,  λ = 495.72 nm</text><text x="54" y="321.1" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">Δλ = 495.72 − 486 = 9.72 nm</text><text x="54" y="361.1" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">Δλ / λ₀ = 9.72 / 486 = 0.020</text><text x="54" y="401.1" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">v = 0.020 × 3.0 × 10⁸</text><text x="76" y="441.1" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">= 6.0 × 10⁶ m/s, moving away</text><rect x="460" y="200" width="410" height="273.6" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="484" y="241.1" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Example 2: find λ</text><text x="484" y="281.1" font-size="19" font-weight="400" fill="#4a5568" text-anchor="start">v = 1.5 × 10⁷ m/s,  λ₀ = 410 nm</text><text x="484" y="321.1" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">v / c = 1.5 × 10⁷ / 3.0 × 10⁸</text><text x="534" y="361.1" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">= 0.050</text><text x="484" y="401.1" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">Δλ = 0.050 × 410 = 20.5 nm</text><text x="484" y="441.1" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">λ = 410 + 20.5 = 430.5 nm</text><text x="450" y="500" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Subtract first to get Δλ, then divide by λ₀ (the reference wavelength, not the observed one).</text><text x="450" y="528" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">If asked for the observed wavelength, add Δλ to λ₀.</text>
</svg>