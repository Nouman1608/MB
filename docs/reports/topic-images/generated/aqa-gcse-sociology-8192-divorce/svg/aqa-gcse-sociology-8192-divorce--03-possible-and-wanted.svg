<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 758" width="900" height="758" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="758" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why divorce rose: the law and social change</text>

<rect x="30" y="112" width="840" height="176" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="50" y="144" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Changes in the law: divorce becomes POSSIBLE</text><text x="50" y="168" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">easier, cheaper and quicker</text><rect x="50" y="184" width="190" height="90" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="62" y="206" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">1949</text><text x="62" y="228" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Legal aid</text><rect x="255" y="184" width="190" height="90" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="267" y="206" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">1969 (1971)</text><text x="267" y="228" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Irretrievable</text><text x="267" y="248" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">breakdown; no need to</text><text x="267" y="268" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">prove guilt</text><rect x="460" y="184" width="190" height="90" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="472" y="206" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">1984</text><text x="472" y="228" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Apply after one year</text><rect x="665" y="184" width="190" height="90" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="677" y="206" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">2020 (2022)</text><text x="677" y="228" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">No-fault; joint</text><text x="677" y="248" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">applications</text><text x="450" y="320" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Social change: people WANT a divorce</text><rect x="30" y="336" width="269.3333333333333" height="269" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,408 L31.25,350.25 Q31.25,337.25 44.25,337.25 L285.0833333333333,337.25 Q298.0833333333333,337.25 298.0833333333333,350.25 L298.0833333333333,408 Z" fill="#b5d3cf"/><line x1="31.25" y1="408" x2="298.0833333333333" y2="408" stroke="#c9d6d4" stroke-width="2"/><text x="164.66666666666666" y="365.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Social attitudes and</text><text x="164.66666666666666" y="390.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">values</text><circle cx="49" cy="433.92" r="4.5" fill="#2e6b62"/><text x="62" y="439.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Much less stigma</text><circle cx="49" cy="462.92" r="4.5" fill="#2e6b62"/><text x="62" y="468.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Marriage should bring</text><text x="62" y="489.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">happiness and fulfilment,</text><text x="62" y="510.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">not just duty</text><circle cx="49" cy="533.9200000000001" r="4.5" fill="#2e6b62"/><text x="62" y="539.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Higher expectations: less</text><text x="62" y="560.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">willing to put up with an</text><text x="62" y="581.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">empty shell (functionalists)</text><rect x="315.3333333333333" y="336" width="269.3333333333333" height="269" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M316.5833333333333,408 L316.5833333333333,350.25 Q316.5833333333333,337.25 329.5833333333333,337.25 L570.4166666666666,337.25 Q583.4166666666666,337.25 583.4166666666666,350.25 L583.4166666666666,408 Z" fill="#b5d3cf"/><line x1="316.5833333333333" y1="408" x2="583.4166666666666" y2="408" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="377.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Secularisation</text><circle cx="334.3333333333333" cy="433.92" r="4.5" fill="#2e6b62"/><text x="347.3333333333333" y="439.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Fewer see marriage as a</text><text x="347.3333333333333" y="460.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">sacred, lifelong vow</text><circle cx="334.3333333333333" cy="483.92" r="4.5" fill="#2e6b62"/><text x="347.3333333333333" y="489.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Most marriages now civil</text><text x="347.3333333333333" y="510.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">ceremonies</text><circle cx="334.3333333333333" cy="533.9200000000001" r="4.5" fill="#2e6b62"/><text x="347.3333333333333" y="539.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Many religious groups more</text><text x="347.3333333333333" y="560.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">accepting</text><rect x="600.6666666666666" y="336" width="269.3333333333333" height="269" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.9166666666666,408 L601.9166666666666,350.25 Q601.9166666666666,337.25 614.9166666666666,337.25 L855.75,337.25 Q868.75,337.25 868.75,350.25 L868.75,408 Z" fill="#b5d3cf"/><line x1="601.9166666666666" y1="408" x2="868.75" y2="408" stroke="#c9d6d4" stroke-width="2"/><text x="735.3333333333333" y="377.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Status of women</text><circle cx="619.6666666666666" cy="433.92" r="4.5" fill="#2e6b62"/><text x="632.6666666666666" y="439.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Own income from paid work</text><circle cx="619.6666666666666" cy="462.92" r="4.5" fill="#2e6b62"/><text x="632.6666666666666" y="468.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Equal Pay Act 1970; Sex</text><text x="632.6666666666666" y="489.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Discrimination Act 1975</text><circle cx="619.6666666666666" cy="512.9200000000001" r="4.5" fill="#2e6b62"/><text x="632.6666666666666" y="518.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Welfare support for lone</text><text x="632.6666666666666" y="539.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">parents</text><circle cx="619.6666666666666" cy="562.9200000000001" r="4.5" fill="#2e6b62"/><text x="632.6666666666666" y="568.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Feminism raised expectations</text><rect x="30" y="623" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="659" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Discuss how far</text><text x="56" y="688" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Laws make divorce possible but do not explain why people want one, and laws often follow</text><text x="56" y="710" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">changes in attitudes rather than causing them.</text>
</svg>