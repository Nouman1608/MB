<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 493" width="900" height="493" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="493" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three traps in divorce statistics</text>

<rect x="30" y="108" width="269.3333333333333" height="254" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,158 L31.25,122.25 Q31.25,109.25 44.25,109.25 L285.0833333333333,109.25 Q298.0833333333333,109.25 298.0833333333333,122.25 L298.0833333333333,158 Z" fill="#b5d3cf"/><line x1="31.25" y1="158" x2="298.0833333333333" y2="158" stroke="#c9d6d4" stroke-width="2"/><text x="164.66666666666666" y="139" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Number vs rate</text><circle cx="49" cy="184.54" r="4.5" fill="#2e6b62"/><text x="62" y="190.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The <tspan font-weight="700">rate</tspan> is divorces per</text><text x="62" y="212.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">1,000 married people in a</text><text x="62" y="234.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">year</text><circle cx="49" cy="258.53999999999996" r="4.5" fill="#2e6b62"/><text x="62" y="264.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The <tspan font-weight="700">number</tspan> can fall while</text><text x="62" y="286.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">the rate stays high, if</text><text x="62" y="308.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">fewer people marry</text><rect x="315.3333333333333" y="108" width="269.3333333333333" height="254" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M316.5833333333333,158 L316.5833333333333,122.25 Q316.5833333333333,109.25 329.5833333333333,109.25 L570.4166666666666,109.25 Q583.4166666666666,109.25 583.4166666666666,122.25 L583.4166666666666,158 Z" fill="#dce9e7"/><line x1="316.5833333333333" y1="158" x2="583.4166666666666" y2="158" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="139" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Hidden breakdown</text><circle cx="334.3333333333333" cy="184.54" r="4.5" fill="#2e6b62"/><text x="347.3333333333333" y="190.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Figures leave out</text><text x="347.3333333333333" y="212.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">separations</tspan> of couples who</text><text x="347.3333333333333" y="234.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">never divorce</text><circle cx="334.3333333333333" cy="258.53999999999996" r="4.5" fill="#2e6b62"/><text x="347.3333333333333" y="264.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">And the break-up of</text><text x="347.3333333333333" y="286.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">cohabiting</tspan> couples</text><circle cx="334.3333333333333" cy="310.53999999999996" r="4.5" fill="#2e6b62"/><text x="347.3333333333333" y="316.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">So they <tspan font-weight="700">underestimate</tspan></text><text x="347.3333333333333" y="338.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">relationship breakdown</text><rect x="600.6666666666666" y="108" width="269.3333333333333" height="254" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.9166666666666,158 L601.9166666666666,122.25 Q601.9166666666666,109.25 614.9166666666666,109.25 L855.75,109.25 Q868.75,109.25 868.75,122.25 L868.75,158 Z" fill="#f2e7b8"/><line x1="601.9166666666666" y1="158" x2="868.75" y2="158" stroke="#c9d6d4" stroke-width="2"/><text x="735.3333333333333" y="139" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Backlog after a law</text><circle cx="619.6666666666666" cy="184.54" r="4.5" fill="#2e6b62"/><text x="632.6666666666666" y="190.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A sudden rise after a new</text><text x="632.6666666666666" y="212.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">law may be couples <tspan font-weight="700">already</tspan></text><text x="632.6666666666666" y="234.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">separated</tspan> finally</text><text x="632.6666666666666" y="256.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">divorcing</text><circle cx="619.6666666666666" cy="280.53999999999996" r="4.5" fill="#2e6b62"/><text x="632.6666666666666" y="286.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Not a sudden rise in</text><text x="632.6666666666666" y="308.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">unhappy marriages</text><rect x="30" y="380" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="416" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Using data in an answer</text><text x="56" y="445" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Describe the overall trend, quote two figures, point out any exception, then explain.</text>
</svg>