<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 738" width="900" height="738" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="738" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The pattern of divorce since 1945</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">England and Wales: the shape of the trend, not exact figures</text>
<line x1="70" y1="450" x2="870" y2="450" stroke="#1e2a44" stroke-width="2.5"/><line x1="70" y1="450" x2="70" y2="160" stroke="#1e2a44" stroke-width="2.5"/><line x1="70" y1="450" x2="70" y2="457" stroke="#1e2a44" stroke-width="2"/><text x="70" y="476" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">1945</text><line x1="168.75" y1="450" x2="168.75" y2="457" stroke="#1e2a44" stroke-width="2"/><text x="168.75" y="476" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">1955</text><line x1="267.5" y1="450" x2="267.5" y2="457" stroke="#1e2a44" stroke-width="2"/><text x="267.5" y="476" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">1965</text><line x1="366.25" y1="450" x2="366.25" y2="457" stroke="#1e2a44" stroke-width="2"/><text x="366.25" y="476" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">1975</text><line x1="465" y1="450" x2="465" y2="457" stroke="#1e2a44" stroke-width="2"/><text x="465" y="476" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">1985</text><line x1="563.75" y1="450" x2="563.75" y2="457" stroke="#1e2a44" stroke-width="2"/><text x="563.75" y="476" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">1995</text><line x1="662.5" y1="450" x2="662.5" y2="457" stroke="#1e2a44" stroke-width="2"/><text x="662.5" y="476" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">2005</text><line x1="761.25" y1="450" x2="761.25" y2="457" stroke="#1e2a44" stroke-width="2"/><text x="761.25" y="476" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">2015</text><line x1="860" y1="450" x2="860" y2="457" stroke="#1e2a44" stroke-width="2"/><text x="860" y="476" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">2025</text><text x="52" y="310" font-size="15" fill="#4a5568" text-anchor="middle" transform="rotate(-90 52 310)">number of divorces (shape only)</text><path d="M70,410 L89.75,375 L119.375,405 L218.125,410 L297.125,395 L326.75,330 L366.25,285 L465,245 L534.125,220 L613.125,250 L711.875,290 L800.75,330" fill="none" stroke="#2e6b62" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><line x1="109.5" y1="450" x2="109.5" y2="143" stroke="#b5602e" stroke-width="2" stroke-dasharray="5 5"/><text x="109.5" y="135" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">1949 legal aid</text><line x1="326.75" y1="450" x2="326.75" y2="168" stroke="#b5602e" stroke-width="2" stroke-dasharray="5 5"/><text x="326.75" y="160" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">1971 Divorce Reform Act</text><line x1="455.125" y1="450" x2="455.125" y2="193" stroke="#b5602e" stroke-width="2" stroke-dasharray="5 5"/><text x="455.125" y="185" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">1984: after 1 year</text><line x1="830.375" y1="450" x2="830.375" y2="143" stroke="#b5602e" stroke-width="2" stroke-dasharray="5 5"/><text x="830.375" y="135" font-size="15" font-weight="700" fill="#b5602e" text-anchor="end">2022 no-fault</text><text x="534.125" y="278" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">peak: early 1990s</text><rect x="30" y="506" width="415" height="62" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="58" cy="537" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="58" y="542.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="84" y="532" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Just after 1945</text><text x="84" y="555" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Short rise as wartime marriages ended</text><rect x="455" y="506" width="415" height="62" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="483" cy="537" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="483" y="542.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="509" y="532" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">1950s–1960s</text><text x="509" y="555" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Uncommon; stigma; an offence had to be proved</text><rect x="30" y="578" width="415" height="62" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="58" cy="609" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="58" y="614.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="84" y="604" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">1970s</text><text x="84" y="627" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Sharp rise after the 1969 Act came into force</text><rect x="455" y="578" width="415" height="62" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="483" cy="609" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="483" y="614.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="509" y="604" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">1980s–early 1990s</text><text x="509" y="627" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Continued growth to a peak</text><rect x="30" y="650" width="415" height="62" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="58" cy="681" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="58" y="686.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="84" y="676" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Late 1990s–2010s</text><text x="84" y="699" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Fall: fewer marry, more cohabit, marry later</text><rect x="455" y="650" width="415" height="62" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="483" cy="681" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="483" y="686.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">6</text><text x="509" y="676" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">2022 onwards</text><text x="509" y="699" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">No-fault divorce from April 2022</text>
</svg>