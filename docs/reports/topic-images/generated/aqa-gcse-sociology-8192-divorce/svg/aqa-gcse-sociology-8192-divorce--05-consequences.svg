<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 686" width="900" height="686" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="686" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Consequences of divorce</text>

<rect x="30" y="108" width="412" height="255" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,158 L31.25,122.25 Q31.25,109.25 44.25,109.25 L427.75,109.25 Q440.75,109.25 440.75,122.25 L440.75,158 Z" fill="#b5d3cf"/><line x1="31.25" y1="158" x2="440.75" y2="158" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="139" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Husband and wife</text><circle cx="49" cy="183.92" r="4.5" fill="#2e6b62"/><text x="62" y="189.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Two households cost more; women’s incomes</text><text x="62" y="210.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">often fall more</text><circle cx="49" cy="233.92" r="4.5" fill="#2e6b62"/><text x="62" y="239.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Men may pay maintenance and need new housing</text><circle cx="49" cy="262.92" r="4.5" fill="#2e6b62"/><text x="62" y="268.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Stress and loneliness, but also <tspan font-weight="700">relief</tspan> from an</text><text x="62" y="289.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">unhappy or abusive relationship</text><circle cx="49" cy="312.92" r="4.5" fill="#2e6b62"/><text x="62" y="318.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Remarriage or cohabitation: <tspan font-weight="700">serial monogamy</tspan>,</text><text x="62" y="339.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">reconstituted families</text><rect x="458" y="108" width="412" height="255" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,158 L459.25,122.25 Q459.25,109.25 472.25,109.25 L855.75,109.25 Q868.75,109.25 868.75,122.25 L868.75,158 Z" fill="#dce9e7"/><line x1="459.25" y1="158" x2="868.75" y2="158" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="139" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Children</text><circle cx="477" cy="183.92" r="4.5" fill="#2e6b62"/><text x="490" y="189.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Moving home or school; two households</text><circle cx="477" cy="212.92" r="4.5" fill="#2e6b62"/><text x="490" y="218.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Often less contact with the non-resident</text><text x="490" y="239.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">father</text><circle cx="477" cy="262.92" r="4.5" fill="#2e6b62"/><text x="490" y="268.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Step-parents and step-siblings</text><circle cx="477" cy="291.92" r="4.5" fill="#2e6b62"/><text x="490" y="297.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Distress; but parental <tspan font-weight="700">conflict</tspan> may harm more</text><text x="490" y="318.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">than divorce itself</text><rect x="30" y="379" width="412" height="176" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,429 L31.25,393.25 Q31.25,380.25 44.25,380.25 L427.75,380.25 Q440.75,380.25 440.75,393.25 L440.75,429 Z" fill="#f2e7b8"/><line x1="31.25" y1="429" x2="440.75" y2="429" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="410" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Extended family</text><circle cx="49" cy="454.92" r="4.5" fill="#2e6b62"/><text x="62" y="460.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Grandparents may lose contact, or give more</text><text x="62" y="481.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">childcare to a lone parent</text><circle cx="49" cy="504.92" r="4.5" fill="#2e6b62"/><text x="62" y="510.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">More complex kin: step-grandparents and former</text><text x="62" y="531.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">in-laws</text><rect x="458" y="379" width="412" height="176" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,429 L459.25,393.25 Q459.25,380.25 472.25,380.25 L855.75,380.25 Q868.75,380.25 868.75,393.25 L868.75,429 Z" fill="#d4b02e"/><line x1="459.25" y1="429" x2="868.75" y2="429" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="410" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Family structures</text><circle cx="477" cy="454.92" r="4.5" fill="#2e6b62"/><text x="490" y="460.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">More <tspan font-weight="700">lone parent families</tspan>, mostly headed by</text><text x="490" y="481.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">mothers</text><circle cx="477" cy="504.92" r="4.5" fill="#2e6b62"/><text x="490" y="510.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Higher risk of poverty: childcare costs; hard</text><text x="490" y="531.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">to combine full-time work with sole care</text><rect x="30" y="573" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="609" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Not every consequence is negative</text><text x="56" y="638" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Ending a violent or high-conflict marriage can benefit family members.</text>
</svg>