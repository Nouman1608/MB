<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 533" width="900" height="533" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="533" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Women’s changing status and divorce</text>

<rect x="30" y="118" width="184.5" height="151" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="122.25" y="172.8" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Paid work</text><text x="122.25" y="202.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Many women have</text><text x="122.25" y="223.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">their own income</text><line x1="218.5" y1="193.5" x2="244.5" y2="193.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="248.5" y="118" width="184.5" height="151" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="340.75" y="162.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Less dependent</text><text x="340.75" y="192.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">No longer</text><text x="340.75" y="213.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">financially reliant</text><text x="340.75" y="234.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">on a husband</text><line x1="437" y1="193.5" x2="463" y2="193.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="467" y="118" width="184.5" height="151" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="559.25" y="150.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Leaving is</text><text x="559.25" y="174.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">realistic</text><text x="559.25" y="204.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">She can support</text><text x="559.25" y="225.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">herself and her</text><text x="559.25" y="246.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">children</text><line x1="655.5" y1="193.5" x2="681.5" y2="193.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="685.5" y="118" width="184.5" height="151" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="777.75" y="162.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Evidence</text><text x="777.75" y="192.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Most divorce</text><text x="777.75" y="213.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">petitions are</text><text x="777.75" y="234.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">brought by wives</text><text x="450" y="311" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Also strengthening women’s position</text><rect x="30" y="325" width="269.3333333333333" height="168" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,375 L31.25,339.25 Q31.25,326.25 44.25,326.25 L285.0833333333333,326.25 Q298.0833333333333,326.25 298.0833333333333,339.25 L298.0833333333333,375 Z" fill="#ffffff"/><line x1="31.25" y1="375" x2="298.0833333333333" y2="375" stroke="#c9d6d4" stroke-width="2"/><text x="164.66666666666666" y="355.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Equality laws</text><text x="44" y="406.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Equal Pay Act 1970 and Sex</text><text x="44" y="427.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Discrimination Act 1975</text><text x="44" y="448.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">improved women’s position at</text><text x="44" y="469.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">work</text><rect x="315.3333333333333" y="325" width="269.3333333333333" height="168" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M316.5833333333333,375 L316.5833333333333,339.25 Q316.5833333333333,326.25 329.5833333333333,326.25 L570.4166666666666,326.25 Q583.4166666666666,326.25 583.4166666666666,339.25 L583.4166666666666,375 Z" fill="#ffffff"/><line x1="316.5833333333333" y1="375" x2="583.4166666666666" y2="375" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="355.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Welfare benefits</text><text x="329.3333333333333" y="406.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Some support for lone parents</text><rect x="600.6666666666666" y="325" width="269.3333333333333" height="168" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.9166666666666,375 L601.9166666666666,339.25 Q601.9166666666666,326.25 614.9166666666666,326.25 L855.75,326.25 Q868.75,326.25 868.75,339.25 L868.75,375 Z" fill="#ffffff"/><line x1="601.9166666666666" y1="375" x2="868.75" y2="375" stroke="#c9d6d4" stroke-width="2"/><text x="735.3333333333333" y="355.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Feminism</text><text x="614.6666666666666" y="406.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Raised expectations: a</text><text x="614.6666666666666" y="427.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">marriage that leaves her a</text><text x="614.6666666666666" y="448.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">dual burden is harder to</text><text x="614.6666666666666" y="469.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">accept</text>
</svg>