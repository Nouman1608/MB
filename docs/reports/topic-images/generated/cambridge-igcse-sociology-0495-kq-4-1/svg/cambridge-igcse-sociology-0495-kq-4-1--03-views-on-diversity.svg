<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 454" width="900" height="454" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="454" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Is family diversity good, bad or exaggerated?</text>

<rect x="30" y="104" width="269.3333333333333" height="320" rx="14" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="137" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">BAD</text><text x="50" y="164.8" font-size="21" font-weight="700" fill="#b5602e" text-anchor="start">New Right</text><text x="50" y="194.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="194.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Married two-parent</text><text x="65.2" y="215.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">nuclear family is best</text><text x="65.2" y="236.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">for children</text><text x="50" y="265.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="265.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Murray: lone parenthood</text><text x="65.2" y="286.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and welfare dependency</text><text x="65.2" y="307.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">create an “underclass”</text><text x="50" y="336.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="336.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Critics: poverty, not</text><text x="65.2" y="357.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">structure, explains most</text><text x="65.2" y="378.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">disadvantage; the view</text><text x="65.2" y="399.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">blames women</text><rect x="315.3333333333333" y="104" width="269.3333333333333" height="320" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="335.3333333333333" y="137" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">EXAGGERATED</text><text x="335.3333333333333" y="164.8" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Chester (1985)</text><text x="335.3333333333333" y="194.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="350.5333333333333" y="194.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Most people live in a</text><text x="350.5333333333333" y="215.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">nuclear family at some</text><text x="350.5333333333333" y="236.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">stage</text><text x="335.3333333333333" y="265.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="350.5333333333333" y="265.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Main change: the</text><text x="350.5333333333333" y="286.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">neo-conventional family</text><text x="350.5333333333333" y="307.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">where both partners work</text><text x="335.3333333333333" y="336.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="350.5333333333333" y="336.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Snapshot statistics</text><text x="350.5333333333333" y="357.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">overstate diversity</text><rect x="600.6666666666666" y="104" width="269.3333333333333" height="320" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="620.6666666666666" y="137" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">GOOD</text><text x="620.6666666666666" y="164.8" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="start">Postmodernists</text><text x="620.6666666666666" y="194.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="635.8666666666667" y="194.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">No fixed rules: people</text><text x="635.8666666666667" y="215.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">choose relationships</text><text x="620.6666666666666" y="244.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="635.8666666666667" y="244.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Diversity = freedom and</text><text x="635.8666666666667" y="265.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">tolerance</text><text x="620.6666666666666" y="294.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="635.8666666666667" y="294.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">But choice is constrained</text><text x="635.8666666666667" y="315.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">by money, law and culture</text>
</svg>