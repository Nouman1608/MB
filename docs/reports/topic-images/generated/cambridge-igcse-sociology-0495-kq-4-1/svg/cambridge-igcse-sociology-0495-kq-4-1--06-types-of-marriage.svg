<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 631" width="900" height="631" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="631" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Types of marriage</text>

<text x="30" y="130" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">How many spouses?</text><rect x="30" y="144" width="410" height="110" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="180" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Monogamy</text><text x="50" y="208.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">One spouse at a time</text><rect x="460" y="144" width="410" height="110" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="480" y="180" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Serial monogamy</text><text x="480" y="208.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A sequence of monogamous marriages, through</text><text x="480" y="229.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">divorce and remarriage</text><text x="30" y="294" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="start">How is the partner chosen?</text><rect x="30" y="308" width="410" height="131" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="344" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Arranged</text><text x="50" y="372.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Families play a major part in choosing; the</text><text x="50" y="393.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">couple’s consent stays central. Not the same</text><text x="50" y="414.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">as forced marriage.</text><rect x="460" y="308" width="410" height="131" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="480" y="344" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Love</text><text x="480" y="372.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Partners choose each other on the basis of</text><text x="480" y="393.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">romantic attachment</text><text x="30" y="479" font-size="20" font-weight="700" fill="#b5602e" text-anchor="start">What is the relationship like?</text><rect x="30" y="493" width="840" height="110" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="529" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Empty shell marriage</text><text x="50" y="557.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Legally married but no emotional content, often for financial, religious or children’s reasons.</text><text x="50" y="578.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Do not confuse with an empty nest family (children have left home).</text>
</svg>