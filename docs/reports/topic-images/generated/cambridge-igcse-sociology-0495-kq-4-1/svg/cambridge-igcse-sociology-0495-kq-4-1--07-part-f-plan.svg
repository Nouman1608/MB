<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 674" width="900" height="674" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="674" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Is the nuclear family still dominant?</text>

<line x1="215" y1="154" x2="685" y2="154" stroke="#1e2a44" stroke-width="7" stroke-linecap="round"/><path d="M450,154 L420,246 L480,246 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><circle cx="450" cy="154" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><line x1="215" y1="154" x2="160" y2="209" stroke="#1e2a44" stroke-width="2.5"/><line x1="215" y1="154" x2="270" y2="209" stroke="#1e2a44" stroke-width="2.5"/><path d="M140,209 L290,209 Q275,236 215,236 Q155,236 140,209 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><line x1="685" y1="154" x2="630" y2="209" stroke="#1e2a44" stroke-width="2.5"/><line x1="685" y1="154" x2="740" y2="209" stroke="#1e2a44" stroke-width="2.5"/><path d="M610,209 L760,209 Q745,236 685,236 Q625,236 610,209 Z" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="215" y="258" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">STILL DOMINANT</text><text x="685" y="258" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">NOT DOMINANT</text><rect x="30" y="282" width="405" height="232" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="318" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">For the view</text><text x="50" y="347.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="347.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Most children raised by two parents for</text><text x="66.15" y="369.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">much of childhood (neo-conventional</text><text x="66.15" y="391.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">family)</text><text x="50" y="418.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="418.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Still the cultural ideal in media and</text><text x="66.15" y="440.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">policy</text><text x="50" y="467.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="467.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Many in other households have lived or</text><text x="66.15" y="489.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">will live in one</text><rect x="465" y="282" width="405" height="232" rx="14" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="485" y="318" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="start">Against the view</text><text x="485" y="347.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="501.15" y="347.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Divorce and remarriage: reconstituted</text><text x="501.15" y="369.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">and lone-parent families</text><text x="485" y="396.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="501.15" y="396.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Single person households have grown</text><text x="485" y="423.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="501.15" y="423.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Extended families dominate in many</text><text x="501.15" y="445.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">societies</text><text x="485" y="472.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="501.15" y="472.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Postmodernists: no dominant type</text><rect x="30" y="532" width="840" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="568" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Judgement</text><text x="50" y="597.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Dominant as an ideal and as a life stage, less dominant as a snapshot of households at any</text><text x="50" y="619.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">one time.</text>
</svg>