<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="480" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Family, household and the alternatives</text>

<rect x="30" y="110" width="840" height="340" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="55" y="150" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">HOUSEHOLD: a person or group sharing a home</text><rect x="55" y="172" width="250" height="240" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="180" y="206" font-size="21" font-weight="700" fill="#8a6d0d" text-anchor="middle">Family</text><text x="180" y="234" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">related by blood,</text><text x="180" y="255" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">marriage, civil</text><text x="180" y="276" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">partnership or adoption</text><line x1="158" y1="330" x2="202" y2="330" stroke="#1e2a44" stroke-width="3"/><circle cx="158" cy="330" r="13" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="202" cy="330" r="13" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><line x1="180" y1="358" x2="180" y2="372" stroke="#1e2a44" stroke-width="2.5"/><line x1="165" y1="372" x2="195" y2="372" stroke="#1e2a44" stroke-width="2.5"/><line x1="165" y1="372" x2="165" y2="378" stroke="#1e2a44" stroke-width="2.5"/><circle cx="165" cy="388" r="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><line x1="195" y1="372" x2="195" y2="378" stroke="#1e2a44" stroke-width="2.5"/><circle cx="195" cy="388" r="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><rect x="330" y="172" width="515" height="90" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="342" y="198.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Single person household</text><text x="342" y="226" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">later marriage, divorce, ageing population, women’s financial</text><text x="342" y="246" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">independence</text><rect x="330" y="272" width="515" height="70" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="342" y="298.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Shared household</text><text x="342" y="326" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">unrelated adults, e.g. students; housing is expensive</text><rect x="330" y="352" width="515" height="70" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="342" y="378.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Friends as family</text><text x="342" y="406" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">“families of choice” giving emotional and practical support</text>
</svg>