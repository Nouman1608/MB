<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 602" width="900" height="602" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="602" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Five dimensions of family diversity</text>

<line x1="310" y1="143.5" x2="365" y2="238.075" stroke="#1e2a44" stroke-width="2.5"/><line x1="310" y1="268" x2="365" y2="281.65" stroke="#1e2a44" stroke-width="2.5"/><line x1="310" y1="413.5" x2="365" y2="332.575" stroke="#1e2a44" stroke-width="2.5"/><line x1="590" y1="232" x2="535" y2="269.05" stroke="#1e2a44" stroke-width="2.5"/><line x1="590" y1="335.5" x2="535" y2="305.275" stroke="#1e2a44" stroke-width="2.5"/><circle cx="450" cy="289" r="100" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="284.75" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Rapoport and</text><text x="450" y="307.25" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Rapoport (1982)</text><g transform="translate(0,0)"><rect x="30" y="104" width="280" height="79" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="134.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Organisational</text><text x="46" y="162.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">how roles are arranged</text><rect x="30" y="197" width="280" height="142" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="227.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Cultural</text><text x="46" y="255.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">e.g. extended households in</text><text x="46" y="276.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">South Asia and sub-Saharan</text><text x="46" y="297.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Africa; kibbutz children’s</text><text x="46" y="318.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">houses</text><rect x="30" y="353" width="280" height="121" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="383.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Class</text><text x="46" y="411.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">e.g. Bethnal Green</text><text x="46" y="432.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">working-class extended</text><text x="46" y="453.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">families; mobile middle class</text></g><g transform="translate(0,88.5)"><rect x="590" y="104" width="280" height="79" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="606" y="134.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Life course</text><text x="606" y="162.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">families change as members age</text><rect x="590" y="197" width="280" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="606" y="227.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Cohort</text><text x="606" y="255.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the historical period a family</text><text x="606" y="276.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">lives through</text></g><rect x="30" y="492" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="525.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Ethnicity: explain patterns with culture, migration history and economic position, not by</text><text x="50" y="547.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">treating any group as having one “type” of family.</text>
</svg>