<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 462" width="900" height="462" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="462" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Snapshot or life course?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Why household statistics can overstate diversity</text>
<line x1="60" y1="148" x2="850" y2="148" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><text x="850" y="136" font-size="16" font-weight="600" fill="#4a5568" text-anchor="end">one person’s life course</text><rect x="30" y="174" width="340" height="110" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="200" y="220.5" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Nuclear family</text><text x="200" y="249.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">earlier in life</text><line x1="376" y1="229" x2="526" y2="229" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><text x="451" y="218" font-size="16" font-weight="600" fill="#4a5568" text-anchor="middle">later</text><rect x="530" y="174" width="340" height="110" rx="14" fill="#d4b02e" stroke="#c9d6d4" stroke-width="2.5"/><text x="700" y="220.5" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Single person household</text><text x="700" y="249.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">today</text><rect x="518" y="162" width="364" height="134" rx="18" fill="none" stroke="#b5602e" stroke-width="3.5" stroke-dasharray="10 6"/><text x="700" y="326" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">a household count sees only this moment</text><rect x="30" y="354" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="387.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Chester: statistics that count households at one moment make diversity look larger than it</text><text x="50" y="409.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">is, because people move through different household types over their lives.</text>
</svg>