<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 676" width="900" height="676" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="676" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How revelation began</text>

<line x1="150" y1="138" x2="150" y2="598" stroke="#1e2a44" stroke-width="3"/><circle cx="150" cy="138" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="130" y="144" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">610, Ramadan</text><rect x="176" y="110" width="694" height="80" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="194" y="142" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Retreat in the cave of Hira</text><text x="194" y="168" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">on Jabal al-Nur outside Makkah; the Prophet (pbuh) was about forty</text><circle cx="150" cy="230" r="7" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><rect x="176" y="202" width="694" height="100" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="194" y="234" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Jibril: "Read!" (Iqra')</text><text x="194" y="260" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">pressed him three times, then recited the first five verses of Sura 96; the Night of</text><text x="194" y="280" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Power (Sura 97.1)</text><circle cx="150" cy="342" r="7" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><rect x="176" y="314" width="694" height="80" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="194" y="346" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Khadija reassures him</text><text x="194" y="372" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">God would never disgrace him; she takes him to her cousin Waraqa ibn Nawfal</text><circle cx="150" cy="434" r="7" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><rect x="176" y="406" width="694" height="80" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="194" y="438" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Waraqa recognises the angel</text><text x="194" y="464" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">as the one who had come to Musa</text><circle cx="150" cy="526" r="7" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><rect x="176" y="498" width="694" height="56" rx="12" fill="#f4f6f6" stroke="#c9d6d4" stroke-width="2.5"/><text x="194" y="530" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">A pause in revelation (fatra)</text><circle cx="150" cy="594" r="7" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><rect x="176" y="566" width="694" height="80" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="194" y="598" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Sura 74: "arise and warn"</text><text x="194" y="624" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">revelation resumes: the start of his mission to preach</text>
</svg>