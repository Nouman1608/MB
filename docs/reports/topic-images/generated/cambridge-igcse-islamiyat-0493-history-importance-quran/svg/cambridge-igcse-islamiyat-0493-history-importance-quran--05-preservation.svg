<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 648" width="900" height="648" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="648" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Preserved in the Prophet's lifetime</text>

<rect x="30" y="110" width="410" height="142" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="147" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Memorisation</text><text x="50" y="175.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Companions learned each revelation and</text><text x="50" y="197.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">recited it in prayer; many became huffaz.</text><rect x="460" y="110" width="410" height="142" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="480" y="147" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Writing</text><text x="480" y="175.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Scribes, best known Zayd ibn Thabit, wrote</text><text x="480" y="197.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">on parchment, palm stalks, flat stones and</text><text x="480" y="219.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">shoulder blades.</text><rect x="30" y="266" width="410" height="142" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="303" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Order</text><text x="50" y="331.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The Prophet (pbuh) told the scribes where</text><text x="50" y="353.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">each new passage belonged.</text><rect x="460" y="266" width="410" height="142" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="480" y="303" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Review</text><text x="480" y="331.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Jibril went through the revelation with him</text><text x="480" y="353.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">every Ramadan, twice in his final year.</text><rect x="30" y="432" width="840" height="76" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="466" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">632, Farewell Pilgrimage: Sura 5.3</text><text x="54" y="492" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">"This day I have perfected your religion for you"</text><rect x="30" y="528" width="410" height="92" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="564.15" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">At his death: complete</text><text x="50" y="592.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">in memory and in writing</text><rect x="460" y="528" width="410" height="92" rx="14" fill="#fbf1ea" stroke="#b5602e" stroke-width="2.5"/><text x="480" y="564.15" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">But not yet</text><text x="480" y="592.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">one bound volume</text>
</svg>