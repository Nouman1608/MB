<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 678" width="900" height="678" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="678" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why the Qur'an came gradually</text>

<text x="450" y="124" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">About 23 years</text><rect x="30" y="140" width="468.7826086956522" height="58" rx="10" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="267.3913043478261" y="176" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Makkah: about 13 years</text><rect x="504.7826086956522" y="140" width="365.2173913043478" height="58" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="687.3913043478261" y="176" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Madinah: about 10 years</text><rect x="30" y="214" width="470" height="120" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="250.15" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Mostly short; about belief</text><text x="50" y="278.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">tawhid, prophethood, judgement</text><rect x="520" y="214" width="350" height="120" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="540" y="250.15" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Often longer; laws</text><text x="540" y="278.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">prayer, fasting, zakat, family,</text><text x="540" y="300.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">trade, relations with others</text><text x="450" y="376" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Why in stages?</text><rect x="30" y="394" width="268" height="132" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="50" y="428.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">"to strengthen your</text><text x="50" y="450.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">heart"</text><text x="50" y="477.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Sura 25.32</text><rect x="316" y="394" width="268" height="132" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="336" y="428.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">"to recite it to people</text><text x="336" y="450.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">at intervals"</text><text x="336" y="477.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Sura 17.106</text><rect x="602" y="394" width="268" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="622" y="428.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Answers to events</text><text x="622" y="455.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Many verses came in answer</text><text x="622" y="477.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">to events or questions.</text><rect x="30" y="546" width="840" height="104" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="54" y="582" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Rulings introduced in steps</text><rect x="54" y="598" width="150" height="36" rx="8" fill="#ffffff"/><text x="129" y="622" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">step</text><line x1="208" y1="616" x2="238" y2="616" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="244" y="598" width="150" height="36" rx="8" fill="#ffffff"/><text x="319" y="622" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">step</text><line x1="398" y1="616" x2="428" y2="616" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="434" y="598" width="412" height="36" rx="8" fill="#d4b02e"/><text x="640" y="622" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">intoxicants: complete ban, Sura 5.90</text>
</svg>