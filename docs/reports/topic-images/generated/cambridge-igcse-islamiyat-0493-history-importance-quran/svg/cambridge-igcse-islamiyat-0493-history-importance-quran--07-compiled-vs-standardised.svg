<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 624" width="900" height="624" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="624" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Abu Bakr compiled; Uthman standardised</text>

<rect x="30" y="110" width="840" height="354" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,160 L31.25,124 Q31.25,111.25 44,111.25 L856,111.25 Q868.75,111.25 868.75,124 L868.75,160 Z" fill="#b5d3cf"/><text x="46" y="142" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start"></text><text x="216" y="142" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Abu Bakr</text><line x1="200" y1="110" x2="200" y2="464" stroke="#c9d6d4" stroke-width="2"/><text x="551" y="142" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Uthman</text><line x1="535" y1="110" x2="535" y2="464" stroke="#c9d6d4" stroke-width="2"/><line x1="30" y1="160" x2="870" y2="160" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="202.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Problem</text><text x="216" y="191.15" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">many huffaz killed at Yamama;</text><text x="216" y="214.15" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">parts could be lost</text><text x="551" y="191.15" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Muslims reciting in differing</text><text x="551" y="214.15" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">ways; risk of division</text><line x1="30" y1="236" x2="870" y2="236" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="278.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Who acted</text><text x="216" y="278.65" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Zayd ibn Thabit, urged on by Umar</text><text x="551" y="278.65" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Zayd ibn Thabit and three others</text><line x1="30" y1="312" x2="870" y2="312" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="354.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Method</text><text x="216" y="343.15" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">written pieces accepted only when</text><text x="216" y="366.15" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">confirmed</text><text x="551" y="343.15" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">copied Hafsa's sheets; Quraysh</text><text x="551" y="366.15" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">dialect where they differed</text><line x1="30" y1="388" x2="870" y2="388" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="430.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Result</text><text x="216" y="430.65" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">one written collection (suhuf)</text><text x="551" y="419.15" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">standard copies sent out; other</text><text x="551" y="442.15" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">copies burned</text><rect x="30" y="484" width="840" height="112" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="54" y="524" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Key distinction</text><text x="54" y="556" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Abu Bakr compiled; Uthman standardised, earning the title Jami' al-Qur'an.</text><text x="54" y="580" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">Uthman did not "write" the Qur'an.</text>
</svg>