<rect width="900" height="466" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Question 2: compulsory, five strands</text>

<rect x="30" y="110" width="560" height="96" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="310" y="148" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Part (a): 10 marks</text><text x="310" y="178" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">knowledge: describe, write about</text><rect x="600" y="110" width="270" height="96" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="735" y="148" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Part (b): 4 marks</text><text x="735" y="178" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">understanding: why, how important</text><text x="450" y="246" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Question 2 is compulsory: every strand must be revised</text><rect x="30" y="266" width="160" height="172" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="110" cy="304" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="110" y="311.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="110" y="352" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Revelation</text><text x="110" y="378" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">610 to 632</text><rect x="200" y="266" width="160" height="172" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="280" cy="304" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="280" y="311.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="280" y="352" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Compilation</text><text x="280" y="378" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">under the Rightly</text><text x="280" y="397" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Guided Caliphs</text><rect x="370" y="266" width="160" height="172" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="450" cy="304" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="450" y="311.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="450" y="352" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Major themes</text><text x="450" y="378" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">set passages and</text><text x="450" y="397" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">similar passages</text><rect x="540" y="266" width="160" height="172" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="620" cy="304" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="620" y="311.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="620" y="352" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Legal thinking</text><text x="620" y="378" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">with Hadiths,</text><text x="620" y="397" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">ijma' and qiyas</text><rect x="710" y="266" width="160" height="172" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="790" cy="304" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="790" y="311.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="790" y="352" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Significance</text><text x="790" y="378" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">the basis of all</text><text x="790" y="397" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">thought and</text><text x="790" y="416" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">action</text>
</svg>