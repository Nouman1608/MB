<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 754" width="900" height="754" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="754" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">From Yamama to the standard copies</text>

<text x="225" y="124" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="middle">Abu Bakr: compiled</text><text x="670" y="124" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Uthman: standardised</text><rect x="30" y="142" width="390" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="174" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Battle of Yamama</text><text x="48" y="200" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">many huffaz killed</text><line x1="225" y1="243" x2="225" y2="258" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="260" width="390" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="292" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Umar urges Abu Bakr</text><text x="48" y="318" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">who at first hesitates, then agrees</text><line x1="225" y1="361" x2="225" y2="376" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="378" width="390" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="410" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Zayd ibn Thabit collects</text><text x="48" y="436" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">written pieces confirmed by memory</text><line x1="225" y1="479" x2="225" y2="494" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="496" width="390" height="100" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="48" y="528" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Sheets (suhuf) kept</text><text x="48" y="554" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Abu Bakr, then Umar, then Hafsa</text><rect x="470" y="142" width="400" height="100" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="488" y="174" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Hudhayfa ibn al-Yaman warns</text><text x="488" y="200" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Muslims disputing over recitation</text><line x1="670" y1="243" x2="670" y2="258" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="470" y="260" width="400" height="100" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="488" y="292" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Uthman borrows Hafsa's sheets</text><line x1="670" y1="361" x2="670" y2="376" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="470" y="378" width="400" height="100" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="488" y="410" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Committee of four copies</text><text x="488" y="436" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">in the dialect of the Quraysh where they</text><text x="488" y="456" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">differed</text><line x1="670" y1="479" x2="670" y2="494" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="470" y="496" width="400" height="100" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="488" y="528" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Copies sent out</text><text x="488" y="554" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">to Kufa, Basra, Damascus; one kept in Madinah;</text><text x="488" y="574" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">other copies burned</text><path d="M422,546 C448,546 446,310 458,310" fill="none" stroke="#8a6d0d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><polygon points="456,303 469,310 456,317" fill="#8a6d0d"/><rect x="30" y="622" width="840" height="104" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="656" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">The committee</text><text x="54" y="682" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Zayd ibn Thabit, Abdullah ibn al-Zubayr, Sa'id ibn al-As</text><text x="54" y="704" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">and Abd al-Rahman ibn al-Harith</text><text x="846" y="682" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="end">Hafsa's sheets were returned.</text>
</svg>