<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 556" width="900" height="556" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="556" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Ways revelation came</text>

<rect x="30" y="110" width="410" height="136" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="50" y="144" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">MODE 1</text><text x="50" y="173" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Like the ringing of a bell</text><text x="50" y="201.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The hardest on him: Companions saw him sweat</text><text x="50" y="223.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">even on cold days.</text><rect x="460" y="110" width="410" height="136" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="480" y="144" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">MODE 2</text><text x="480" y="173" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Jibril in the form of a man</text><text x="480" y="201.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">He spoke to him so that he understood.</text><rect x="30" y="260" width="410" height="136" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="294" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">MODE 3</text><text x="50" y="323" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Jibril in his true form</text><text x="50" y="351.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Seen on rare occasions; Sura 53 refers to</text><text x="50" y="373.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">this.</text><rect x="460" y="260" width="410" height="136" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="480" y="294" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">MODE 4</text><text x="480" y="323" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">True dreams</text><text x="480" y="351.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Before and alongside the spoken revelation.</text><rect x="30" y="418" width="410" height="110" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="54" y="456" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Wahy</text><text x="54" y="486" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">revelation from God: the Qur'an</text><text x="450" y="480" font-size="34" font-weight="700" fill="#1e2a44" text-anchor="middle">≠</text><rect x="460" y="418" width="410" height="110" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="484" y="456" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">His own words</text><text x="484" y="486" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">recorded separately as Hadiths</text>
</svg>