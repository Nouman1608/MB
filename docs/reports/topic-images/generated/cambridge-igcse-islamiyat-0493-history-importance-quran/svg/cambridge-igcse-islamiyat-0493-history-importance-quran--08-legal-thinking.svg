<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 772" width="900" height="772" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="772" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The Qur'an in legal thinking</text>

<rect x="30" y="110" width="840" height="84" rx="14" fill="#d4b02e" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="72" cy="152" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="72" y="159.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="112" y="146" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Qur'an: the first source of law</text><text x="112" y="174" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Every other source is used in relation to it.</text><line x1="450" y1="196" x2="450" y2="208" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="50" y="210" width="820" height="128" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><circle cx="92" cy="250" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="92" y="257.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="132" y="248" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Hadith (Sunnah)</text><text x="132" y="274" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">explains how to carry out its commands and adds detail</text><rect x="74" y="290" width="772" height="34" rx="8" fill="#ffffff"/><text x="90" y="313" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">e.g. The Qur'an commands salat; the Hadiths show its times, units and movements.</text><line x1="450" y1="342" x2="450" y2="354" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="70" y="356" width="800" height="128" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><circle cx="112" cy="396" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="112" y="403.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="152" y="394" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Ijma' (consensus)</text><text x="152" y="420" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">agreement of scholars where the texts do not settle a matter</text><rect x="94" y="436" width="752" height="34" rx="8" fill="#ffffff"/><text x="110" y="459" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">e.g. The Companions agreed to compile the Qur'an into one book.</text><line x1="450" y1="488" x2="450" y2="500" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="90" y="502" width="780" height="128" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><circle cx="132" cy="542" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="132" y="549.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="172" y="540" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Qiyas (analogy)</text><text x="172" y="566" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">applies a Qur'anic ruling to a new case with the same cause</text><rect x="114" y="582" width="732" height="34" rx="8" fill="#ffffff"/><text x="130" y="605" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">e.g. Wine intoxicates (Sura 5.90), so other intoxicating drugs are forbidden.</text><rect x="30" y="648" width="840" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="684" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A second qiyas: Sura 62.9 says leave trade for Friday prayer,</text><text x="54" y="708" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">so any activity that keeps a person from that prayer is covered too.</text><text x="54" y="732" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">A ruling from ijma' or qiyas can never contradict the Qur'an.</text>
</svg>