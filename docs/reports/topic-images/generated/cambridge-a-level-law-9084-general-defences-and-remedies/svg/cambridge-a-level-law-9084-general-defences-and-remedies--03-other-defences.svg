<clipPath id="tc100"><rect x="30" y="100" width="840" height="514" rx="14"/></clipPath><g clip-path="url(#tc100)"><rect x="30" y="100" width="197.6470588235294" height="48" fill="#b5d3cf"/><text x="44" y="127.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Defence</text><rect x="227.6470588235294" y="100" width="333.52941176470586" height="48" fill="#b5d3cf"/><text x="241.6470588235294" y="127.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Meaning and case</text><rect x="561.1764705882352" y="100" width="308.8235294117647" height="48" fill="#d4b02e"/><text x="575.1764705882352" y="127.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Limit or contrast</text><rect x="30" y="148" width="197.6470588235294" height="89" fill="#dce9e7"/><text x="44" y="174.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Inevitable accident</text><rect x="227.6470588235294" y="148" width="333.52941176470586" height="89" fill="#ffffff"/><text x="241.6470588235294" y="174.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Could not be avoided by reasonable</text><text x="241.6470588235294" y="195.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">care: <tspan font-style="italic">Stanley</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Powell</tspan> (1891), pellet</text><text x="241.6470588235294" y="216.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">glanced off a tree</text><rect x="561.1764705882352" y="148" width="308.8235294117647" height="89" fill="#ffffff"/><text x="575.1764705882352" y="174.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">In negligence, simply a finding of no</text><text x="575.1764705882352" y="195.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">breach</text><line x1="30" y1="237" x2="870" y2="237" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="237" width="197.6470588235294" height="89" fill="#dce9e7"/><text x="44" y="263.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Act of God</text><rect x="227.6470588235294" y="237" width="333.52941176470586" height="89" fill="#f8faf9"/><text x="241.6470588235294" y="263.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Natural event no human foresight could</text><text x="241.6470588235294" y="284.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">guard against: <tspan font-style="italic">Nichols</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Marsland</tspan></text><text x="241.6470588235294" y="305.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(1876)</text><rect x="561.1764705882352" y="237" width="308.8235294117647" height="89" fill="#f8faf9"/><text x="575.1764705882352" y="263.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Greenock</tspan> <tspan font-style="italic">Corporation</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Caledonian</tspan></text><text x="575.1764705882352" y="284.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Railway</tspan> (1917): rain not exceptional</text><text x="575.1764705882352" y="305.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">enough</text><line x1="30" y1="326" x2="870" y2="326" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="326" width="197.6470588235294" height="89" fill="#dce9e7"/><text x="44" y="352.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Statutory authority</text><rect x="227.6470588235294" y="326" width="333.52941176470586" height="89" fill="#ffffff"/><text x="241.6470588235294" y="352.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Inevitable result of an activity</text><text x="241.6470588235294" y="373.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Parliament authorised: <tspan font-style="italic">Allen</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Gulf</tspan> <tspan font-style="italic">Oil</tspan></text><text x="241.6470588235294" y="394.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Refining</tspan> (1981)</text><rect x="561.1764705882352" y="326" width="308.8235294117647" height="89" fill="#ffffff"/><text x="575.1764705882352" y="352.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Does not cover carrying out the</text><text x="575.1764705882352" y="373.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">activity negligently</text><line x1="30" y1="415" x2="870" y2="415" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="415" width="197.6470588235294" height="89" fill="#dce9e7"/><text x="44" y="441.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Illegality (ex turpi</text><text x="44" y="462.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">causa)</text><rect x="227.6470588235294" y="415" width="333.52941176470586" height="89" fill="#f8faf9"/><text x="241.6470588235294" y="441.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Claim from the claimant’s own serious</text><text x="241.6470588235294" y="462.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">wrongdoing: <tspan font-style="italic">Pitts</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Hunt</tspan>; <tspan font-style="italic">Gray</tspan> <tspan font-style="italic">v</tspan></text><text x="241.6470588235294" y="483.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Thames</tspan> <tspan font-style="italic">Trains</tspan> (2009)</text><rect x="561.1764705882352" y="415" width="308.8235294117647" height="89" fill="#f8faf9"/><text x="575.1764705882352" y="441.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Not automatic: <tspan font-style="italic">Revill</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Newbery</tspan></text><text x="575.1764705882352" y="462.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(1996). <tspan font-style="italic">Patel</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Mirza</tspan> (2016): range of</text><text x="575.1764705882352" y="483.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">factors</text><line x1="30" y1="504" x2="870" y2="504" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="504" width="197.6470588235294" height="110" fill="#dce9e7"/><text x="44" y="530.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Necessity</text><rect x="227.6470588235294" y="504" width="333.52941176470586" height="110" fill="#ffffff"/><text x="241.6470588235294" y="530.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Acting to prevent greater harm: <tspan font-style="italic">Cope</tspan> <tspan font-style="italic">v</tspan></text><text x="241.6470588235294" y="551.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Sharpe</tspan> (1912), firebreak</text><rect x="561.1764705882352" y="504" width="308.8235294117647" height="110" fill="#ffffff"/><text x="575.1764705882352" y="530.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Rigby</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">CC</tspan> <tspan font-style="italic">of</tspan> <tspan font-style="italic">Northamptonshire</tspan></text><text x="575.1764705882352" y="551.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(1985): CS gas necessary, but</text><text x="575.1764705882352" y="572.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">negligent to have no fire-fighting</text><text x="575.1764705882352" y="593.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">equipment</text></g><line x1="227.6470588235294" y1="100" x2="227.6470588235294" y2="614" stroke="#c9d6d4" stroke-width="1.5"/><line x1="561.1764705882352" y1="100" x2="561.1764705882352" y2="614" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="100" width="840" height="514" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/>
