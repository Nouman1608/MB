<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 635" width="900" height="635" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="635" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Volenti non fit injuria</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">A complete defence: “to one who is willing, no harm is done”</text>
<rect x="30" y="124" width="270.6666666666667" height="132" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="165.33333333333334" y="169" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">TEST</text><text x="165.33333333333334" y="195.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Full knowledge and</text><text x="165.33333333333334" y="218.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">understanding of the risk</text><rect x="314.6666666666667" y="124" width="270.6666666666667" height="132" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="180.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">AND</text><text x="450" y="206.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Freely agreed to accept it</text><rect x="599.3333333333334" y="124" width="270.6666666666667" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="734.6666666666667" y="156" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">NOT ENOUGH</text><text x="734.6666666666667" y="182.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Knowledge alone</text><text x="734.6666666666667" y="210.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle"><tspan font-style="italic">Smith</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Baker</tspan> (1891): stones</text><text x="734.6666666666667" y="231.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">swung overhead</text><rect x="30" y="278" width="413" height="124" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="306" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EMPLOYMENT</text><text x="46" y="332.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Rarely succeeds: no real choice</text><text x="46" y="360.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Bowater</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Rowley</tspan> <tspan font-style="italic">Regis</tspan> (1944). Exception: <tspan font-style="italic">ICI</tspan> <tspan font-style="italic">v</tspan></text><text x="46" y="381.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Shatwell</tspan> (1965), shotfirers broke rules together</text><rect x="457" y="278" width="413" height="124" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="473" y="306" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">MEDICAL TREATMENT</text><text x="473" y="332.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Consent stops a battery claim</text><text x="473" y="360.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">But consent to treatment is not consent to</text><text x="473" y="381.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">negligent treatment</text><rect x="30" y="416" width="413" height="187" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="444" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SPORT</text><text x="46" y="470.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Risks inherent in the game only</text><text x="46" y="498.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Not a reckless tackle: <tspan font-style="italic">Condon</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Basi</tspan> (1985).</text><text x="46" y="519.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Spectators: error of judgement, not reckless</text><text x="46" y="540.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">disregard (<tspan font-style="italic">Wooldridge</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Sumner</tspan>, 1963)</text><rect x="457" y="416" width="413" height="187" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="473" y="444" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">LIMITS</text><text x="473" y="470.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Where volenti fails</text><text x="473" y="498.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Rescuers (<tspan font-style="italic">Haynes</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Harwood</tspan>; <tspan font-style="italic">Baker</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">TE</tspan></text><text x="473" y="519.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Hopkins</tspan>); driving instructor (<tspan font-style="italic">Nettleship</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Weston</tspan>);</text><text x="473" y="540.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">car passengers, s149 Road Traffic Act 1988.</text><text x="473" y="561.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Succeeded: <tspan font-style="italic">Morris</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Murray</tspan> (1991), very drunk</text><text x="473" y="582.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">pilot</text>
</svg>