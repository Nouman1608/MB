<rect width="900" height="582" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: Tariq’s damages</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">A passenger injured by a driver he knew had drunk heavily</text>
<rect x="30" y="124" width="330.4" height="125" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="152" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">VOLENTI?</text><text x="46" y="178.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Excluded</text><text x="46" y="207.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">s149 Road Traffic Act 1988 for car</text><text x="46" y="228.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">passengers</text><rect x="374.4" y="124" width="495.6" height="125" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="390.4" y="152" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CONTRIBUTORY NEGLIGENCE</text><text x="390.4" y="178.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Yes, two grounds</text><text x="390.4" y="207.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Lift from a drunk driver (<tspan font-style="italic">Owens</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Brimmell</tspan>); no seat belt</text><text x="390.4" y="228.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(<tspan font-style="italic">Froom</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Butcher</tspan>)</text><text x="30" y="287" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">TOTAL LOSS £60,000</text><rect x="30" y="297" width="252" height="60" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="156" y="334" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Special £18,000</text><rect x="282" y="297" width="588" height="60" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="576" y="334" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">General £42,000</text><text x="30" y="395" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">COMBINED REDUCTION OF 30 PER CENT: £60,000 × 0.30 = £18,000</text><rect x="30" y="407" width="588" height="60" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="324" y="444" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Award £42,000</text><rect x="618" y="407" width="252" height="60" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="744" y="444" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">−£18,000</text><rect x="30" y="489" width="840" height="61" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="524.2" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="middle"><tspan font-weight="700" fill="#1e2a44">Award:</tspan> £60,000 − £18,000 = <tspan font-weight="700" fill="#1e2a44">£42,000</tspan></text>
