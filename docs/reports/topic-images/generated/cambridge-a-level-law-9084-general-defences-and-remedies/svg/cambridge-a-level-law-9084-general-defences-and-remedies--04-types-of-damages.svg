<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 827" width="900" height="827" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="827" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Types of damages</text>

<rect x="300" y="100" width="300" height="52" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="131.16" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Damages</text><rect x="30" y="202" width="330" height="155" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="195" y="234" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">COMPENSATORY</text><text x="195" y="260.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Restore the claimant, as far as</text><text x="195" y="283.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">money can</text><text x="195" y="311.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle"><tspan font-style="italic">Livingstone</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Rawyards</tspan> <tspan font-style="italic">Coal</tspan> <tspan font-style="italic">Co</tspan></text><text x="195" y="332.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">(1880)</text><rect x="390" y="202" width="480" height="155" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="630" y="258.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">OTHER KINDS</text><text x="630" y="284.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Mark a right, show disapproval, soothe feelings,</text><text x="630" y="307.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">or punish</text><path d="M450,152 L450,174 M195,174 L630,174" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><line x1="195" y1="174" x2="195" y2="198" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="630" y1="174" x2="630" y2="198" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="195" y1="363" x2="195" y2="391" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="630" y1="363" x2="630" y2="391" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="397" width="330" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="427.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Special damages</text><text x="46" y="455.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Quantifiable losses to trial: medical</text><text x="46" y="476.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">expenses, repairs, lost earnings</text><rect x="30" y="509" width="330" height="121" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="539.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">General damages</text><text x="46" y="567.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Not precisely calculable: pain,</text><text x="46" y="588.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">suffering, loss of amenity, future</text><text x="46" y="609.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">losses</text><rect x="390" y="397" width="234" height="117" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="404" y="425.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Nominal</text><text x="404" y="453.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Infringement of a right, no</text><text x="404" y="474.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">loss; common in trespass</text><rect x="636" y="397" width="234" height="117" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="650" y="425.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Contemptuous</text><text x="650" y="453.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Tiny sum, claim had no</text><text x="650" y="474.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">merit: <tspan font-style="italic">Grobbelaar</tspan> (2002),</text><text x="650" y="495.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">£1</text><rect x="390" y="526" width="234" height="117" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="404" y="554.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Aggravated</text><text x="404" y="582.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Compensate extra injury to</text><text x="404" y="603.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">feelings from the manner</text><text x="404" y="624.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">of the tort</text><rect x="636" y="526" width="234" height="117" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="650" y="554.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Exemplary</text><text x="650" y="582.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Punish; only the <tspan font-style="italic">Rookes</tspan> <tspan font-style="italic">v</tspan></text><text x="650" y="603.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Barnard</tspan> (1964) categories</text><rect x="30" y="661" width="840" height="134" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="691" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ROOKES v BARNARD: EXEMPLARY DAMAGES ONLY FOR</text><text x="48" y="722.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="722.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">oppressive, arbitrary or unconstitutional action by government servants</text><text x="48" y="747.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="747.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">conduct calculated to make a profit exceeding the compensation payable</text><text x="48" y="772.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="772.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">where statute authorises them</text>
</svg>