<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 503" width="900" height="503" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="503" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Contributory negligence: a partial defence</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Law Reform (Contributory Negligence) Act 1945 s1(1)</text>
<text x="30" y="140" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">Damages reduced to the extent that is just and equitable, given the claimant’s share in the responsibility</text><text x="134" y="194" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Damages</text><rect x="150" y="160" width="336" height="52" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><rect x="486" y="160" width="144" height="52" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5" stroke-dasharray="7 5"/><text x="318" y="193" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">claimant recovers</text><text x="558" y="193" font-size="17" font-weight="600" fill="#8a6d0d" text-anchor="middle">reduction</text><line x1="690" y1="186" x2="638" y2="186" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><text x="696" y="180" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">never 100%</text><text x="696" y="200" font-size="15" font-weight="400" fill="#b5602e" text-anchor="start" font-style="italic">(Pitts v Hunt)</text><rect x="30" y="234" width="413" height="122" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="262" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CONTRIBUTES TO THE DAMAGE</text><text x="46" y="293.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Need not cause the accident: <tspan font-style="italic">Froom</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Butcher</tspan></text><text x="46" y="314.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(1976), seat belt; <tspan font-style="italic">O’Connell</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Jackson</tspan> (1972), no</text><text x="46" y="335.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">crash helmet</text><rect x="457" y="234" width="413" height="122" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="473" y="262" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">OBJECTIVE TEST</text><text x="473" y="293.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Failed to take reasonable care for own safety:</text><text x="473" y="314.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Jones</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Livox</tspan> <tspan font-style="italic">Quarries</tspan> (1952)</text><rect x="30" y="370" width="413" height="101" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="398" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CHILDREN</text><text x="46" y="429.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Judged by their age: <tspan font-style="italic">Gough</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Thorne</tspan> (1966), a</text><text x="46" y="450.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">13-year-old girl was not contributorily negligent</text><rect x="457" y="370" width="413" height="101" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="473" y="398" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DRUNK DRIVER</text><text x="473" y="429.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Accepting a lift from a driver known to be drunk</text><text x="473" y="450.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">can count: <tspan font-style="italic">Owens</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Brimmell</tspan> (1977)</text>
</svg>