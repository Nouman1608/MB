<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 689" width="900" height="689" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="689" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Injunctions and damages in lieu</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">An equitable, discretionary order</text>
<rect x="30" y="124" width="270.6666666666667" height="168" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="152" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PROHIBITORY</text><text x="46" y="178.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Stop doing something</text><text x="46" y="206.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Kennaway</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Thompson</tspan> (1981):</text><text x="46" y="227.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">powerboat racing restricted to</text><text x="46" y="248.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">certain days, not banned</text><rect x="314.6666666666667" y="124" width="270.6666666666667" height="168" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="330.6666666666667" y="152" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">MANDATORY</text><text x="330.6666666666667" y="178.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Do something positive</text><text x="330.6666666666667" y="206.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Onerous, so strict conditions:</text><text x="330.6666666666667" y="227.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Redland</tspan> <tspan font-style="italic">Bricks</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Morris</tspan> (1970)</text><rect x="599.3333333333334" y="124" width="270.6666666666667" height="168" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="615.3333333333334" y="152" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">INTERLOCUTORY</text><text x="615.3333333333334" y="178.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Preserve the position until</text><text x="615.3333333333334" y="201.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">trial</text><text x="615.3333333333334" y="229.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">American</tspan> <tspan font-style="italic">Cyanamid</tspan> (1975):</text><text x="615.3333333333334" y="250.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">serious question to be tried?</text><text x="615.3333333333334" y="271.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Balance of convenience?</text><text x="450" y="330" font-size="16" font-weight="700" fill="#4a5568" text-anchor="middle">DAMAGES IN LIEU (power first given by Lord Cairns’ Act 1858)</text><rect x="30" y="342" width="400" height="159" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="374" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SHELFER (1895)</text><text x="50" y="400.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Damages only if the injury is</text><text x="50" y="428.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="428.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">small</text><text x="50" y="452.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="452.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">measurable in money</text><text x="50" y="476.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="476.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and an injunction would be oppressive</text><rect x="470" y="342" width="400" height="159" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="490" y="374" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">COVENTRY v LAWRENCE (2014)</text><text x="490" y="400.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Not applied mechanically</text><text x="490" y="428.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Public interest can be weighed. <tspan font-style="italic">Miller</tspan> <tspan font-style="italic">v</tspan></text><text x="490" y="449.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Jackson</tspan> (1977); <tspan font-style="italic">Dennis</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">MoD</tspan> (2003), RAF jet</text><text x="490" y="470.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">noise</text><line x1="434" y1="421.5" x2="466" y2="421.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="535" width="270.6666666666667" height="122" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="563" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">+ INJUNCTIONS</text><text x="46" y="594.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Stop continuing wrongs, which</text><text x="46" y="615.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">damages cannot</text><rect x="314.6666666666667" y="535" width="270.6666666666667" height="122" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="330.6666666666667" y="563" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">− INJUNCTIONS</text><text x="330.6666666666667" y="594.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Blunt; can harm third parties</text><text x="330.6666666666667" y="615.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and the public interest; hard to</text><text x="330.6666666666667" y="636.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">enforce</text><rect x="599.3333333333334" y="535" width="270.6666666666667" height="122" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="615.3333333333334" y="563" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">− DAMAGES IN LIEU</text><text x="615.3333333333334" y="594.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Can let a defendant buy the</text><text x="615.3333333333334" y="615.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">right to commit a tort</text>
</svg>