<rect width="900" height="648" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Personal injury, future losses and death</text>

<rect x="30" y="100" width="250" height="120" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="155" y="135.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">MULTIPLICAND</text><text x="155" y="163.1" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Annual loss</text><text x="155" y="192.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">earnings or care</text><rect x="330" y="100" width="220" height="120" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="440" y="135.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">MULTIPLIER</text><text x="440" y="163.1" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Period of loss</text><text x="440" y="192.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">actuarial tables</text><rect x="600" y="100" width="270" height="134" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="735" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">FUTURE LOSS</text><text x="735" y="159.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Lump sum</text><text x="735" y="188.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">adjusted by a discount rate</text><text x="735" y="209.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">for investing it</text><text x="305" y="174" font-size="34" font-weight="700" fill="#1e2a44" text-anchor="middle">×</text><text x="575" y="172" font-size="34" font-weight="700" fill="#1e2a44" text-anchor="middle">=</text><rect x="30" y="242" width="270.6666666666667" height="126" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="165.33333333333334" y="270" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">LUMP SUM</text><text x="165.33333333333334" y="296.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Final</text><text x="165.33333333333334" y="324.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Must guess the future</text><rect x="314.6666666666667" y="242" width="270.6666666666667" height="126" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="270" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">PERIODICAL PAYMENTS</text><text x="450" y="296.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Damages Act 1996</text><text x="450" y="324.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Paid over time instead</text><rect x="599.3333333333334" y="242" width="270.6666666666667" height="126" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="734.6666666666667" y="270" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">PROVISIONAL DAMAGES</text><text x="734.6666666666667" y="296.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Chance of serious</text><text x="734.6666666666667" y="319.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">deterioration</text><text x="734.6666666666667" y="347.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Can return to court</text><rect x="30" y="390" width="840" height="78" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="422.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Pain, suffering and loss of amenity are awarded even if the claimant cannot appreciate the loss (<tspan font-style="italic">H</tspan> <tspan font-style="italic">West</tspan></text><text x="50" y="443.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">and</tspan> <tspan font-style="italic">Son</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Shephard</tspan>, 1964).</text><rect x="30" y="490" width="413" height="126" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="46" y="518" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DEATH: THE ESTATE</text><text x="46" y="544.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Law Reform (Miscellaneous Provisions)</text><text x="46" y="567.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Act 1934</text><text x="46" y="595.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Continues claims the deceased had</text><rect x="457" y="490" width="413" height="126" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="473" y="518" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DEATH: DEPENDANTS AND RELATIVES</text><text x="473" y="544.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Fatal Accidents Act 1976</text><text x="473" y="572.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Loss of financial support; fixed bereavement</text><text x="473" y="593.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">award for certain relatives</text>
</svg>