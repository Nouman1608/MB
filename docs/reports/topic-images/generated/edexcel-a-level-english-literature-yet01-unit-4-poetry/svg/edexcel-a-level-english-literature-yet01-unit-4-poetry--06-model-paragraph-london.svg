<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 641" width="900" height="641" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="641" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Model paragraph: Blake’s “London”</text>

<rect x="30" y="118" width="86" height="75" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="73" y="162.5" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">AO1</text><rect x="130" y="118" width="740" height="75" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="144" y="146.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Response to the statement</text><text x="144" y="174.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“London” challenges it: the speaker’s feeling is directed entirely at others.</text><rect x="30" y="203" width="86" height="96" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="73" y="258" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle">AO2</text><rect x="130" y="203" width="740" height="96" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="144" y="231.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Voice and imagery</text><text x="144" y="259.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“I wander” promises a personal lyric, but the poem records the “mark” in every face</text><text x="144" y="280.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and the cries of chimney-sweepers and soldiers.</text><rect x="30" y="309" width="86" height="96" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="73" y="364" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle">AO2</text><rect x="130" y="309" width="740" height="96" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="144" y="337.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">A key phrase</text><text x="144" y="365.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“mind-forg’d manacles” makes oppression psychological as well as social, located in</text><text x="144" y="386.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Londoners’ minds, not the speaker’s.</text><rect x="30" y="415" width="86" height="96" rx="12" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="73" y="470" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="middle">AO3</text><rect x="130" y="415" width="740" height="96" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="144" y="443.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Context tied to method</text><text x="144" y="471.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Written in the decade of revolution in France and rapid change in London: the walking</text><text x="144" y="492.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">speaker is a witness, not a subject.</text><rect x="30" y="521" width="86" height="96" rx="12" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="73" y="576" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="middle">AO5</text><rect x="130" y="521" width="740" height="96" rx="14" fill="#d4b02e" stroke="#8a6d0d" stroke-width="2.5"/><text x="144" y="549.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">A critical position tested</text><text x="144" y="577.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Critics who read Romanticism as a retreat into the self must account for poems in</text><text x="144" y="598.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">which intense feeling is the instrument of social criticism.</text>
</svg>