<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 665" width="900" height="665" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="665" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Literary context and critical debates</text>

<rect x="30" y="116" width="170" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="42" y="146" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Movement</text><rect x="200" y="116" width="360" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="212" y="146" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">AO3: context worth using</text><rect x="560" y="116" width="310" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="572" y="146" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">AO5: debates to test</text><rect x="30" y="162" width="170" height="148" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="187.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Metaphysical</text><rect x="200" y="162" width="360" height="148" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="212" y="187.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The term was applied later, critically,</text><text x="212" y="208.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">by Samuel Johnson in his life of Cowley;</text><text x="212" y="229.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">seventeenth-century learning, new</text><text x="212" y="250.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">science, religious controversy;</text><text x="212" y="271.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">manuscript circulation among coteries</text><rect x="560" y="162" width="310" height="148" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="572" y="187.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Johnson: “most heterogeneous ideas</text><text x="572" y="208.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">are yoked by violence together”</text><text x="572" y="229.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">against T. S. Eliot (1921): a</text><text x="572" y="250.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">fusion of thought and feeling</text><text x="572" y="271.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">before a “dissociation of</text><text x="572" y="292.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">sensibility”</text><rect x="30" y="310" width="170" height="127" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="335.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Romantic</text><rect x="200" y="310" width="360" height="127" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="212" y="335.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The French Revolution and its aftermath;</text><text x="212" y="356.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">industrialisation and the growth of</text><text x="212" y="377.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">cities; Wordsworth’s Preface: poetry as</text><text x="212" y="398.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">“the spontaneous overflow of powerful</text><text x="212" y="419.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">feelings”</text><rect x="560" y="310" width="310" height="127" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="572" y="335.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Escape into nature and the self,</text><text x="572" y="356.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">against political engagement</text><text x="572" y="377.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">(Blake’s protest, Wordsworth on</text><text x="572" y="398.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">rural poverty)</text><rect x="30" y="437" width="170" height="106" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="462.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Victorian</text><rect x="200" y="437" width="360" height="106" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="212" y="462.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Religious doubt in an age of geology and</text><text x="212" y="483.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">evolution; empire and its wars; mourning</text><text x="212" y="504.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">culture; constraints on women’s lives</text><text x="212" y="525.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">and voices</text><rect x="560" y="437" width="310" height="106" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="572" y="462.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Consoling or doubtful? Does the</text><text x="572" y="483.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">dramatic monologue invite sympathy</text><text x="572" y="504.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">or judgement?</text><rect x="30" y="561" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="594.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Because the question is set on a movement, its literary context is central to AO3. Use a</text><text x="50" y="616.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">critical view as something to test against the poems, then reach your own judgement.</text>
</svg>