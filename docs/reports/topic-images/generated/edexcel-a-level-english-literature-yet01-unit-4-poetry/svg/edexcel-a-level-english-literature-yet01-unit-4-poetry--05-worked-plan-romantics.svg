<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 891" width="900" height="891" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="891" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked plan: testing a statement on the Romantics</text>

<rect x="30" y="118" width="840" height="110" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="151" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STATEMENT (ORIGINAL)</text><text x="50" y="177.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">“Romantic poetry is more interested in the poet’s own feelings than in</text><text x="50" y="202.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">the world.”</text><line x1="80" y1="298" x2="820" y2="298" stroke="#1e2a44" stroke-width="4" marker-start="url(#ah)" marker-end="url(#ah)"/><text x="80" y="334" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="start">the poet’s own feelings</text><text x="820" y="334" font-size="16" font-weight="700" fill="#b5602e" text-anchor="end">the world</text><circle cx="154" cy="298" r="16" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="154" y="303.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="138" y="270" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start" font-style="italic">Ode to a Nightingale</text><circle cx="413" cy="298" r="16" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="413" y="303.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="423" y="270" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="end" font-style="italic">Tintern Abbey</text><circle cx="487.00000000000006" cy="298" r="16" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="487.00000000000006" y="303.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="477.00000000000006" y="362" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start" font-style="italic">Lines Written in Early Spring</text><circle cx="746" cy="298" r="16" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="746" y="303.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="762" y="270" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="end" font-style="italic">London</text><rect x="30" y="384" width="840" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="42" y="409.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">1 Supporting</text><text x="42" y="436" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">“Ode to a Nightingale”: the desire to dissolve into the bird’s song and the return to his “sole self”.</text><text x="42" y="458" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">AO2: ode form, sound</text><rect x="30" y="482" width="840" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="42" y="507.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">2 Complicating</text><text x="42" y="534" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">“London”: the walking speaker records others’ suffering; “mind-forg’d manacles”.</text><text x="42" y="556" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">AO3: industrial London, revolution era</text><rect x="30" y="580" width="840" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="42" y="605.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">3 Both</text><text x="42" y="632" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">“Lines Written in Early Spring”: pleasure in nature interrupted by grief at “what man has made of man”.</text><text x="42" y="654" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">AO2: refrain-like return</text><rect x="30" y="678" width="840" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="42" y="703.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">4 Memory and the self</text><text x="42" y="730" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">“Tintern Abbey”: but nature as a moral guide to the world.</text><text x="42" y="752" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">AO3: the Preface; AO5: what the poem leaves out</text><rect x="30" y="782" width="840" height="85" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="815" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">CONCLUSION</text><text x="50" y="841.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Feeling is the Romantic method; the world is often its subject</text>
</svg>