<rect width="900" height="564" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Ranging and depth</text>

<rect x="250" y="120" width="400" height="90" rx="14" fill="#d4b02e" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="155" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">THE STATEMENT</text><text x="450" y="182" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">about the movement</text><line x1="80" y1="260" x2="820" y2="260" stroke="#1e2a44" stroke-width="4" marker-start="url(#ah)" marker-end="url(#ah)"/><text x="80" y="296" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">supports it</text><text x="820" y="296" font-size="17" font-weight="700" fill="#b5602e" text-anchor="end">complicates it</text><circle cx="168.8" cy="260" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="168.8" y="266.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">A</text><circle cx="376" cy="260" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="376" y="266.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">B</text><circle cx="538.8" cy="260" r="18" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="538.8" y="266.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">C</text><circle cx="731.2" cy="260" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="731.2" y="266.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">D</text><text x="538.8" y="322" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">shorter reference</text><rect x="30" y="344" width="270.6666666666667" height="122" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="385.7" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Three or four poems</text><text x="46" y="414.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Each analysed in at least</text><text x="46" y="435.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">one detailed paragraph.</text><rect x="314.6666666666667" y="344" width="270.6666666666667" height="122" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="330.6666666666667" y="385.7" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Shorter references</text><text x="330.6666666666667" y="414.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Supporting references to</text><text x="330.6666666666667" y="435.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">other poems.</text><rect x="599.3333333333334" y="344" width="270.6666666666667" height="122" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="615.3333333333334" y="375.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Test the statement</text><text x="615.3333333333334" y="403.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">At least one poem that</text><text x="615.3333333333334" y="424.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">supports it and one that</text><text x="615.3333333333334" y="445.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">complicates it.</text><rect x="30" y="482" width="840" height="58" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="515.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A movement question invites range, but marks come from analysis.</text>
</svg>