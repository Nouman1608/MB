<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Unit 4 Section B at a glance</text>

<text x="30" y="118" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">Unit 4 · 50 marks · open book</text><rect x="30" y="130" width="420" height="74" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="240" y="162" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Section A</text><text x="240" y="188" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">25 marks</text><rect x="450" y="130" width="420" height="74" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="660" y="162" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Section B: Pre-1900 Poetry</text><text x="660" y="188" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">25 marks · one essay</text><rect x="30" y="130" width="840" height="74" fill="none" stroke="#1e2a44" stroke-width="3"/><text x="30" y="240" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Prescribed poems from one movement</text><rect x="30" y="256" width="270.6666666666667" height="150" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="290" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Metaphysical Poets</text><text x="46" y="320" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">Metaphysical Poetry</text><text x="46" y="347" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">ed. Colin Burrow (Penguin,</text><text x="46" y="367" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">2006)</text><rect x="314.6666666666667" y="256" width="270.6666666666667" height="150" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="330.6666666666667" y="290" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="start">The Victorians</text><text x="330.6666666666667" y="320" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">The New Oxford Book of</text><text x="330.6666666666667" y="341" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">Victorian Verse</text><text x="330.6666666666667" y="368" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">ed. Christopher Ricks (OUP,</text><text x="330.6666666666667" y="388" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">2008)</text><rect x="599.3333333333334" y="256" width="270.6666666666667" height="150" rx="14" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="615.3333333333334" y="290" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">The Romantics</text><text x="615.3333333333334" y="320" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">English Romantic Verse</text><text x="615.3333333333334" y="347" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">ed. David Wright (Penguin</text><text x="615.3333333333334" y="367" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Classics, 1973)</text><rect x="30" y="424" width="840" height="136" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="457" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">THE QUESTION</text><text x="50" y="484" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">A statement about your movement</text><text x="50" y="513.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Respond considering relevant contextual factors and different interpretations. One essay</text><text x="50" y="535.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">from a choice of two.</text><text x="30" y="596" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Assessed on</text><rect x="160" y="576" width="57" height="34" rx="17" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="188.5" y="599.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">AO1</text><rect x="227" y="576" width="57" height="34" rx="17" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="255.5" y="599.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">AO2</text><rect x="294" y="576" width="57" height="34" rx="17" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="322.5" y="599.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">AO3</text><rect x="361" y="576" width="57" height="34" rx="17" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="389.5" y="599.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">AO5</text><rect x="30" y="632" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="665.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Only the poems listed in the specification’s appendix are prescribed; check the current</text><text x="50" y="687.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">list with your teacher.</text>
