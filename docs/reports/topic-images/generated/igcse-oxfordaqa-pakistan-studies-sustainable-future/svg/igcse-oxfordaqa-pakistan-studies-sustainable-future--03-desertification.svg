<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 508" width="900" height="508" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="508" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Desertification: causes, impacts, responses</text>

<text x="160" y="128" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">CAUSE</text><text x="450" y="128" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">IMPACT</text><text x="740" y="128" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">RESPONSE</text><rect x="30" y="140" width="260" height="243" rx="12" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="48" y="173" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Causes</text><text x="48" y="201.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="201.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Low, unreliable rainfall and</text><text x="64" y="222.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">drought</text><text x="48" y="246.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="246.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Over-grazing</text><text x="48" y="270.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="270.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Cutting shrubs for fuel</text><text x="48" y="294.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="294.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Over-pumping groundwater</text><text x="48" y="318.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="318.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Poor irrigation leaves salt</text><text x="64" y="339.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">in the soil</text><line x1="294" y1="261.5" x2="316" y2="261.5" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="320" y="140" width="260" height="243" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="338" y="173" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Impacts</text><text x="338" y="201.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="354" y="201.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Loss of farmland and</text><text x="354" y="222.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">grazing</text><text x="338" y="246.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="354" y="246.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Falling incomes</text><text x="338" y="270.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="354" y="270.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Migration to towns</text><text x="338" y="294.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="354" y="294.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Dust storms</text><line x1="584" y1="261.5" x2="606" y2="261.5" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="610" y="140" width="260" height="243" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="628" y="173" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Strategies</text><text x="628" y="201.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="644" y="201.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Shelter belts of</text><text x="644" y="222.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">drought-resistant trees and</text><text x="644" y="243.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">shrubs</text><text x="628" y="267.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="644" y="267.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Controlled grazing</text><text x="628" y="291.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="644" y="291.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Drip irrigation</text><text x="628" y="315.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="644" y="315.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Water harvesting and small</text><text x="644" y="336.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">dams</text><text x="628" y="360.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="644" y="360.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Reclaiming saline land</text><rect x="30" y="403" width="840" height="75" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="433.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Desertification is the spread of desert-like conditions in dry areas. It threatens parts of the Thar,</text><text x="48" y="455.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Cholistan and Thal deserts and Balochistan.</text>
</svg>