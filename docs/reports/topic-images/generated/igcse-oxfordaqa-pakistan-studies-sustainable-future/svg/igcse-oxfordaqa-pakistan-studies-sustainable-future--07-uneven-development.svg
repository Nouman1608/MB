<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 749" width="900" height="749" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="749" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why development is uneven within Pakistan</text>

<text x="30" y="132" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">FACTORS</text><rect x="30" y="146" width="197" height="181" rx="12" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="48" y="177.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Physical</text><text x="48" y="204.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Fertile irrigated plains</text><text x="48" y="224.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">of Punjab and Sindh</text><text x="48" y="244.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">vs mountains and</text><text x="48" y="264.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">deserts</text><rect x="244.3" y="146" width="197" height="181" rx="12" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="262.3" y="177.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Economic</text><text x="262.3" y="204.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Industry and services</text><text x="262.3" y="224.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">concentrated in</text><text x="262.3" y="244.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Karachi, Lahore and</text><text x="262.3" y="264.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Islamabad</text><rect x="458.6" y="146" width="197" height="181" rx="12" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="476.6" y="177.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Social</text><text x="476.6" y="204.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Literacy and health</text><text x="476.6" y="224.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">care higher in cities</text><rect x="672.9000000000001" y="146" width="197" height="181" rx="12" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="690.9000000000001" y="177.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Political</text><text x="690.9000000000001" y="204.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Security problems;</text><text x="690.9000000000001" y="224.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">historical neglect;</text><text x="690.9000000000001" y="244.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">former tribal areas</text><text x="690.9000000000001" y="264.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">merged into Khyber</text><text x="690.9000000000001" y="284.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Pakhtunkhwa only in</text><text x="690.9000000000001" y="304.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">2018</text><rect x="130" y="347" width="640" height="54" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="381" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Lowest development: Balochistan and the former tribal districts</text><line x1="450" y1="405" x2="450" y2="417" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><text x="30" y="435" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STRATEGIES AND HOW EFFECTIVE</text><rect x="30" y="447" width="840" height="272" rx="12" fill="#ffffff"/><path d="M30,491 L30,459 Q30,447 42,447 L858,447 Q870,447 870,459 L870,491 Z" fill="#b5d3cf"/><rect x="30" y="491" width="840" height="83" fill="#ffffff"/><text x="42" y="516.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">National Finance Commission</text><text x="42" y="537.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">award</text><text x="342" y="516.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Shares federal revenue with</text><text x="342" y="537.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">provinces, weighting poverty and</text><text x="342" y="558.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">backwardness</text><text x="622" y="516.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The 2010 award increased the</text><text x="622" y="537.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">provinces’ share</text><line x1="30" y1="491" x2="870" y2="491" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="574" width="840" height="62" fill="#dce9e7"/><text x="42" y="599.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Benazir Income Support</text><text x="42" y="620.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Programme (2008), later Ehsaas</text><text x="342" y="599.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Cash transfers to poor women</text><text x="622" y="599.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Helps the poorest households,</text><text x="622" y="620.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">though payments are small</text><line x1="30" y1="574" x2="870" y2="574" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="636" width="840" height="83" fill="#ffffff"/><text x="42" y="661.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">CPEC and Balochistan projects</text><text x="342" y="661.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Infrastructure</text><text x="622" y="661.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Mixed so far; local</text><text x="622" y="682.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">communities question how</text><text x="622" y="703.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">much they benefit</text><line x1="30" y1="636" x2="870" y2="636" stroke="#c9d6d4" stroke-width="1.5"/><line x1="330" y1="447" x2="330" y2="719" stroke="#c9d6d4" stroke-width="1.5"/><line x1="610" y1="447" x2="610" y2="719" stroke="#c9d6d4" stroke-width="1.5"/><text x="42" y="476.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Strategy</text><text x="342" y="476.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">What it does</text><text x="622" y="476.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Effectiveness</text><rect x="30" y="447" width="840" height="272" rx="12" fill="none" stroke="#1e2a44" stroke-width="2.5"/>
</svg>