<rect width="900" height="613" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Climate change: small emitter, high risk</text>

<rect x="30" y="112" width="410" height="110" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="235" y="152" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Emissions</text><text x="235" y="180" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">a very small share of the</text><text x="235" y="202" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">global total</text><rect x="460" y="112" width="410" height="110" rx="12" fill="#b5602e" stroke="#1e2a44" stroke-width="2.5"/><text x="665" y="152" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">Vulnerability</text><text x="665" y="180" font-size="16" font-weight="400" fill="#ffffff" text-anchor="middle">among the most vulnerable</text><text x="665" y="202" font-size="16" font-weight="400" fill="#ffffff" text-anchor="middle">countries</text><text x="30" y="250" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">CONSEQUENCES</text><rect x="30" y="262" width="156" height="221" rx="12" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="48" y="292.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Heatwaves</text><text x="48" y="318.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">e.g. Karachi,</text><text x="48" y="338.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">2015</text><rect x="201" y="262" width="156" height="221" rx="12" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="219" y="292.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Glacier melt</text><text x="219" y="318.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Karakoram and</text><text x="219" y="338.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Himalaya; glacial</text><text x="219" y="358.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">lake outburst</text><text x="219" y="378.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">floods</text><rect x="372" y="262" width="156" height="221" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="390" y="292.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Monsoon</text><text x="390" y="314.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">floods</text><text x="390" y="340.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">2022: large</text><text x="390" y="360.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">areas of Sindh</text><text x="390" y="380.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">and Balochistan;</text><text x="390" y="400.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">1,700+ deaths;</text><text x="390" y="420.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">about US$30</text><text x="390" y="440.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">billion damage</text><text x="390" y="460.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">and losses</text><rect x="543" y="262" width="156" height="221" rx="12" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="561" y="292.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Droughts</text><rect x="714" y="262" width="156" height="221" rx="12" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="732" y="292.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Sea-level rise</text><text x="732" y="318.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Saltwater</text><text x="732" y="338.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">intrusion in the</text><text x="732" y="358.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Indus delta</text><line x1="450" y1="489" x2="450" y2="517" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="100" y="523" width="700" height="60" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="560" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Lower yields · damaged infrastructure · disease · poverty</text>
</svg>