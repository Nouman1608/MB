<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 455" width="900" height="455" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="455" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four kinds of pollution: causes and consequences</text>

<rect x="30" y="112" width="840" height="313" rx="12" fill="#ffffff"/><path d="M30,156 L30,124 Q30,112 42,112 L858,112 Q870,112 870,124 L870,156 Z" fill="#b5d3cf"/><rect x="30" y="156" width="840" height="83" fill="#ffffff"/><text x="42" y="181.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Air</text><text x="162" y="181.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Vehicle exhaust, old brick kilns, industry,</text><text x="162" y="202.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">burning crop stubble and waste</text><text x="522" y="181.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Winter smog in Lahore and other Punjab</text><text x="522" y="202.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">cities; respiratory illness; school and road</text><text x="522" y="223.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">closures</text><line x1="30" y1="156" x2="870" y2="156" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="239" width="840" height="62" fill="#dce9e7"/><text x="42" y="264.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Water</text><text x="162" y="264.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Untreated sewage and industrial waste in</text><text x="162" y="285.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">rivers and the sea; farm chemicals</text><text x="522" y="264.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Water-borne disease such as diarrhoea and</text><text x="522" y="285.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">typhoid; harm to fish and the Indus delta</text><line x1="30" y1="239" x2="870" y2="239" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="301" width="840" height="62" fill="#ffffff"/><text x="42" y="326.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Soil</text><text x="162" y="326.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Over-use of fertiliser and pesticides; salinity</text><text x="162" y="347.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">from poor irrigation; dumped waste</text><text x="522" y="326.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Falling yields; contaminated crops</text><line x1="30" y1="301" x2="870" y2="301" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="363" width="840" height="62" fill="#dce9e7"/><text x="42" y="388.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Noise</text><text x="162" y="388.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Traffic, generators, construction and</text><text x="162" y="409.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">loudspeakers in cities</text><text x="522" y="388.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Stress, sleep loss and hearing damage</text><line x1="30" y1="363" x2="870" y2="363" stroke="#c9d6d4" stroke-width="1.5"/><line x1="150" y1="112" x2="150" y2="425" stroke="#c9d6d4" stroke-width="1.5"/><line x1="510" y1="112" x2="510" y2="425" stroke="#c9d6d4" stroke-width="1.5"/><text x="42" y="141.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Type</text><text x="162" y="141.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Main causes</text><text x="522" y="141.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Consequences</text><rect x="30" y="112" width="840" height="313" rx="12" fill="none" stroke="#1e2a44" stroke-width="2.5"/>
</svg>