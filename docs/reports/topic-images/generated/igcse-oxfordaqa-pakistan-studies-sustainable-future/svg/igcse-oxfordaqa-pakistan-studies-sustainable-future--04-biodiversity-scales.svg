<rect width="900" height="700" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Protecting biodiversity at three scales</text>

<ellipse cx="450" cy="400" rx="420" ry="280" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><ellipse cx="450" cy="450" rx="300" ry="200" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><ellipse cx="450" cy="500" rx="170" ry="110" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="162" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">INTERNATIONAL</text><text x="450" y="188" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Work with WWF and the United Nations; conventions</text><text x="450" y="208" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">on biodiversity and wetlands</text><text x="450" y="284" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="middle">NATIONAL</text><text x="450" y="310" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">National parks: Khunjerab, Margalla Hills, Kirthar,</text><text x="450" y="330" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Hingol; wildlife laws; protecting the endangered</text><text x="450" y="350" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Indus river dolphin</text><text x="450" y="434" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">LOCAL</text><text x="450" y="460" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Markhor trophy-hunting</text><text x="450" y="480" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">income shared with</text><text x="450" y="500" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">villages that protect</text><text x="450" y="520" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">the animals</text>
</svg>