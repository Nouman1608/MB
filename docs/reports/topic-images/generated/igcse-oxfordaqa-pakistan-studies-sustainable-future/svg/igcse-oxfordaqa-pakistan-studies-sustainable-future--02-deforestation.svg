<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 452" width="900" height="452" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="452" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Deforestation: causes, impacts, responses</text>

<text x="160" y="128" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">CAUSE</text><text x="450" y="128" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">IMPACT</text><text x="740" y="128" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">RESPONSE</text><rect x="30" y="140" width="260" height="282" rx="12" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="48" y="173" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Causes</text><text x="48" y="201.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="201.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Wood for fuel and timber</text><text x="48" y="225.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="225.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Clearing for farms and</text><text x="64" y="246.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">housing</text><text x="48" y="270.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="270.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Over-grazing</text><text x="48" y="294.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="294.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Illegal logging in the</text><text x="64" y="315.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">northern mountains</text><line x1="294" y1="281" x2="316" y2="281" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="320" y="140" width="260" height="282" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="338" y="173" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Impacts</text><text x="338" y="201.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="354" y="201.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Soil erosion and landslides</text><text x="338" y="225.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="354" y="225.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Faster run-off worsens</text><text x="354" y="246.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">floods</text><text x="338" y="270.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="354" y="270.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Silting of reservoirs such as</text><text x="354" y="291.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Tarbela</text><text x="338" y="315.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="354" y="315.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Habitat loss; less carbon</text><text x="354" y="336.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">stored</text><line x1="584" y1="281" x2="606" y2="281" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="610" y="140" width="260" height="282" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="628" y="173" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Strategies</text><text x="628" y="201.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="644" y="201.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Billion Tree Tsunami,</text><text x="644" y="222.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Khyber Pakhtunkhwa (from</text><text x="644" y="243.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">2014)</text><text x="628" y="267.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="644" y="267.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Ten Billion Tree Tsunami</text><text x="644" y="288.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(from 2018)</text><text x="628" y="312.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="644" y="312.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Mangrove protection,</text><text x="644" y="333.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Sindh coast</text><text x="628" y="357.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="644" y="357.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">LPG instead of wood;</text><text x="644" y="378.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">community management;</text><text x="644" y="399.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">logging bans</text>
</svg>