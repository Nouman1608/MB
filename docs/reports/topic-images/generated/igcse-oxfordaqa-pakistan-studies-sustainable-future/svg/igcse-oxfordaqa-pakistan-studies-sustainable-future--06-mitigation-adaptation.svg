<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Responding to climate change</text>

<rect x="30" y="112" width="840" height="153" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="145" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Agreements and policy</text><text x="48" y="173.6" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="64" y="173.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Paris Agreement: limit warming to well below 2°C; national plans for emission cuts and adaptation</text><text x="48" y="197.6" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="64" y="197.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">National Adaptation Plan (2023): agriculture and water, urban resilience, health, disaster risk,</text><text x="64" y="218.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">ecosystems</text><text x="48" y="242.6" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="64" y="242.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">COP 2022: a leading voice for the loss and damage fund</text><path d="M450,267 L450,291 L235,291 L235,309" fill="none" stroke="#1e2a44" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><path d="M450,291 L665,291 L665,309" fill="none" stroke="#1e2a44" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><rect x="30" y="315" width="410" height="244" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="349.7" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Mitigation</text><text x="48" y="374.75" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start">reducing the causes</text><text x="48" y="401.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="401.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Solar, wind and hydro under the Alternative</text><text x="64" y="422.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and Renewable Energy Policy (2019)</text><text x="48" y="446.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="446.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Electric vehicle policies</text><text x="48" y="470.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="470.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Mass transit in cities</text><text x="48" y="494.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="494.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Reforestation that stores carbon</text><rect x="460" y="315" width="410" height="244" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="478" y="349.7" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Adaptation</text><text x="478" y="374.75" font-size="15" font-weight="600" fill="#8a6d0d" text-anchor="start">reducing the impacts</text><text x="478" y="401.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="494" y="401.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Early warnings from the Pakistan</text><text x="494" y="422.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Meteorological Department; NDMA disaster</text><text x="494" y="443.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">planning</text><text x="478" y="467.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="494" y="467.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Heatwave plans in cities</text><text x="478" y="491.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="494" y="491.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Embankments, raised homes, protected</text><text x="494" y="512.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">wetlands, land-use planning</text><text x="478" y="536.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="494" y="536.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Reducing glacial lake outburst flood risk</text>
