<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 755" width="900" height="755" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="755" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: Tom the teacher</text>

<rect x="30" y="100" width="840" height="133" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FACTS</text><text x="50" y="164.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Tom attends a private support group for gambling addiction. A member secretly photographs him</text><text x="50" y="186.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">and sells the photographs to a news website planning a story on “teachers with secrets”. The</text><text x="50" y="208.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">council has also installed a camera that films straight into his back garden.</text><line x1="60" y1="275" x2="60" y2="703" stroke="#c9d6d4" stroke-width="4"/><rect x="104" y="255" width="766" height="108" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="288.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Interest</text><text x="122" y="318.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Private life (health, personal information, image) for the photographs; private life and home</text><text x="122" y="340.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">for the camera.</text><circle cx="60" cy="309" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="317.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="104" y="375" width="766" height="108" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="408.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Interference?</text><text x="122" y="438.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Publication interferes with private life. The website is not a public authority, but the court is</text><text x="122" y="460.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">(HRA s6): sue for misuse of private information.</text><circle cx="60" cy="429" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="437.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="104" y="495" width="766" height="108" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="528.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Expectation?</text><text x="122" y="558.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">An addiction support group is like Campbell’s treatment: a strong reasonable expectation</text><text x="122" y="580.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">of privacy.</text><circle cx="60" cy="549" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="557.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="104" y="615" width="766" height="108" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="122" y="648.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Next stage</text><text x="122" y="678.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Balance against Article 10; apply 8.2 to the council camera (lawful basis, legitimate aim,</text><text x="122" y="700.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">necessity).</text><circle cx="60" cy="669" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="677.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text>
</svg>