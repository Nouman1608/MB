<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 822" width="900" height="822" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="822" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Article 8 against the press</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">How protection reaches disputes between private parties</text>
<rect x="30" y="124" width="412" height="133" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ROUTE 1</text><text x="50" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Positive obligations</text><text x="50" y="211.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The state must secure respect for private life (<tspan font-style="italic">X</tspan></text><text x="50" y="232.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">and</tspan> <tspan font-style="italic">Y</tspan>; <tspan font-style="italic">Von</tspan> <tspan font-style="italic">Hannover</tspan>)</text><rect x="458" y="124" width="412" height="133" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="478" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ROUTE 2</text><text x="478" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The court is a public authority</text><text x="478" y="211.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">HRA 1998 s6: it must give effect to Article 8 in a</text><text x="478" y="232.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">celebrity v newspaper case</text><rect x="30" y="279" width="840" height="75" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="307" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">WAINWRIGHT v HOME OFFICE (2003)</text><text x="450" y="333.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">No general tort of invasion of privacy</text><line x1="450" y1="359" x2="450" y2="383" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="388" width="840" height="75" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="416" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">CAMPBELL (2004)</text><text x="450" y="442.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Breach of confidence developed into misuse of private information</text><line x1="450" y1="468" x2="450" y2="492" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="497" width="840" height="75" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="525" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">TEST, PART 1</text><text x="450" y="551.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Did the claimant have a reasonable expectation of privacy?</text><line x1="450" y1="577" x2="450" y2="601" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="606" width="840" height="75" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="634" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">TEST, PART 2</text><text x="450" y="660.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">If so, is it outweighed by the publisher’s Article 10 rights?</text><line x1="450" y1="686" x2="450" y2="710" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="715" width="840" height="75" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="743" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">GOOGLE INC v VIDAL-HALL (2015)</text><text x="450" y="769.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Misuse of private information is a tort in its own right</text>
</svg>