<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 490" width="900" height="490" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="490" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Family life and home</text>

<rect x="30" y="100" width="840" height="154" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FAMILY LIFE</text><text x="50" y="158.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Marckx v Belgium (1979)</text><text x="50" y="187.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Family life existed between an unmarried mother and her child; rules treating children born outside</text><text x="50" y="208.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">marriage less favourably breached Article 8 with Article 14. Family life arguments are common in</text><text x="50" y="229.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">deportation cases.</text><rect x="30" y="276" width="412" height="154" rx="14" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="308" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">HOME: BREACH</text><text x="50" y="334.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">López Ostra v Spain (1994)</text><text x="50" y="363.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Fumes from a waste treatment plant next to the</text><text x="50" y="384.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">applicant’s home</text><rect x="458" y="276" width="412" height="154" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="478" y="308" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">HOME: NO BREACH</text><text x="478" y="334.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Hatton v UK (2003)</text><text x="478" y="363.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Heathrow night-flight scheme: a fair balance</text><text x="478" y="384.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">struck; wide margin on economic and</text><text x="478" y="405.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">environmental policy</text><text x="450" y="456" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">serious environmental nuisance can interfere with the home; in Hatton the state had a wide margin</text>
</svg>