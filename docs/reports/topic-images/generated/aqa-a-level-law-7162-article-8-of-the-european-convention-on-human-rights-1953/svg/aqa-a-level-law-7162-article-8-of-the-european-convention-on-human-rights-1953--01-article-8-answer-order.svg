<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 443" width="900" height="443" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="443" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Handling Article 8: three steps in order</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Do not just assert that “privacy” is breached</text>
<rect x="30" y="124" width="250.66666666666666" height="154" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STEP 1</text><text x="50" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Identify the interest</text><text x="50" y="211.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Private life, family life,</text><text x="50" y="232.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">home or correspondence</text><text x="50" y="253.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">(8.1)</text><line x1="286.66666666666663" y1="201" x2="318.66666666666663" y2="201" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="324.66666666666663" y="124" width="250.66666666666666" height="154" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="344.66666666666663" y="166.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STEP 2</text><text x="344.66666666666663" y="193.32" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Show an interference</text><text x="344.66666666666663" y="222.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">or a failure in a positive</text><text x="344.66666666666663" y="243.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">obligation</text><line x1="581.3333333333333" y1="201" x2="613.3333333333333" y2="201" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="619.3333333333333" y="124" width="250.66666666666666" height="154" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="639.3333333333333" y="177" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STEP 3</text><text x="639.3333333333333" y="203.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Move to Article 8.2</text><text x="639.3333333333333" y="232.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Is the interference justified?</text><rect x="30" y="300" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="334.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The right is to “respect for” private and family life</text><text x="50" y="364.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">This gives states room to decide how to protect the interests, and it is the textual basis for positive</text><text x="50" y="386.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">obligations. Article 8 is a <tspan font-weight="700" fill="#1e2a44">qualified</tspan> right.</text>
</svg>