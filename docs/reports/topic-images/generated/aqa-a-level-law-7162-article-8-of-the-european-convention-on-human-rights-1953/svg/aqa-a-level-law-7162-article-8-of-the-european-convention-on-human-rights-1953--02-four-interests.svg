<rect width="900" height="391" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The four interests in Article 8.1</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Each read broadly by the European Court</text>
<line x1="330" y1="184.5" x2="410" y2="224.4" stroke="#1e2a44" stroke-width="2.5"/><line x1="330" y1="309" x2="410" y2="261.75" stroke="#1e2a44" stroke-width="2.5"/><line x1="570" y1="184.5" x2="490" y2="224.4" stroke="#1e2a44" stroke-width="2.5"/><line x1="570" y1="309" x2="490" y2="261.75" stroke="#1e2a44" stroke-width="2.5"/><circle cx="450" cy="241.5" r="80" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="235.26000000000002" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">Article</text><text x="450" y="264.53999999999996" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">8.1</text><rect x="30" y="124" width="300" height="121" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="154.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Private life</text><text x="46" y="182.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">No exhaustive definition: integrity,</text><text x="46" y="203.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">sexual life, identity, data, image,</text><text x="46" y="224.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">medical information, end of life</text><rect x="30" y="259" width="300" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="289.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Family life</text><text x="46" y="317.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A question of fact: real and close</text><text x="46" y="338.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">personal ties, not formal status</text><rect x="570" y="124" width="300" height="121" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="586" y="154.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Home</text><text x="586" y="182.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Where a person lives, owned or</text><text x="586" y="203.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">rented; searches and serious</text><text x="586" y="224.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">environmental nuisance</text><rect x="570" y="259" width="300" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="586" y="289.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Correspondence</text><text x="586" y="317.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Letters, telephone calls, emails and</text><text x="586" y="338.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">other communications</text>
</svg>