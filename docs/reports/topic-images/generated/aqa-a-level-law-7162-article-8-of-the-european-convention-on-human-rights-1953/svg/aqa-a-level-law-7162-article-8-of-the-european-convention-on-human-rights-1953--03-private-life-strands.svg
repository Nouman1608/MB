<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What “private life” includes</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">The strands shown by the case law</text>
<clipPath id="tc124"><rect x="30" y="124" width="840" height="503" rx="14"/></clipPath><g clip-path="url(#tc124)"><rect x="30" y="124" width="233.33333333333331" height="48" fill="#b5d3cf"/><text x="44" y="151.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Strand</text><rect x="263.3333333333333" y="124" width="606.6666666666666" height="48" fill="#b5d3cf"/><text x="277.3333333333333" y="151.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Case and outcome</text><rect x="30" y="172" width="233.33333333333331" height="68" fill="#dce9e7"/><text x="44" y="198.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Physical and</text><text x="44" y="219.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">psychological integrity</text><rect x="263.3333333333333" y="172" width="606.6666666666666" height="68" fill="#ffffff"/><text x="277.3333333333333" y="198.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">X</tspan> <tspan font-style="italic">and</tspan> <tspan font-style="italic">Y</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Netherlands</tspan> (1985): no way to prosecute a sexual assault on a girl</text><text x="277.3333333333333" y="219.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">with a mental disability; breach</text><line x1="30" y1="240" x2="870" y2="240" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="240" width="233.33333333333331" height="68" fill="#dce9e7"/><text x="44" y="266.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Sexual life</text><rect x="263.3333333333333" y="240" width="606.6666666666666" height="68" fill="#f8faf9"/><text x="277.3333333333333" y="266.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Dudgeon</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">UK</tspan> (1981): criminalising consensual private acts between adult</text><text x="277.3333333333333" y="287.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">men could not be justified</text><line x1="30" y1="308" x2="870" y2="308" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="308" width="233.33333333333331" height="68" fill="#dce9e7"/><text x="44" y="334.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Personal identity</text><rect x="263.3333333333333" y="308" width="606.6666666666666" height="68" fill="#ffffff"/><text x="277.3333333333333" y="334.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Goodwin</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">UK</tspan> (2002): no legal recognition of acquired gender; breach.</text><text x="277.3333333333333" y="355.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Gender Recognition Act 2004</text><line x1="30" y1="376" x2="870" y2="376" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="376" width="233.33333333333331" height="68" fill="#dce9e7"/><text x="44" y="402.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Personal data</text><rect x="263.3333333333333" y="376" width="606.6666666666666" height="68" fill="#f8faf9"/><text x="277.3333333333333" y="402.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">S</tspan> <tspan font-style="italic">and</tspan> <tspan font-style="italic">Marper</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">UK</tspan> (2008): blanket, indefinite DNA retention for the</text><text x="277.3333333333333" y="423.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">unconvicted; breach. Protection of Freedoms Act 2012</text><line x1="30" y1="444" x2="870" y2="444" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="444" width="233.33333333333331" height="68" fill="#dce9e7"/><text x="44" y="470.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Image and public</text><text x="44" y="491.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">moments</text><rect x="263.3333333333333" y="444" width="606.6666666666666" height="68" fill="#ffffff"/><text x="277.3333333333333" y="470.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Peck</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">UK</tspan> (2003): CCTV after a suicide attempt. <tspan font-style="italic">Von</tspan> <tspan font-style="italic">Hannover</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Germany</tspan></text><text x="277.3333333333333" y="491.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(2004): daily-life photographs</text><line x1="30" y1="512" x2="870" y2="512" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="512" width="233.33333333333331" height="47" fill="#dce9e7"/><text x="44" y="538.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Medical information</text><rect x="263.3333333333333" y="512" width="606.6666666666666" height="47" fill="#f8faf9"/><text x="277.3333333333333" y="538.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Campbell</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">MGN</tspan> (2004): attendance at Narcotics Anonymous was private</text><line x1="30" y1="559" x2="870" y2="559" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="559" width="233.33333333333331" height="68" fill="#dce9e7"/><text x="44" y="585.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Ending one’s life</text><rect x="263.3333333333333" y="559" width="606.6666666666666" height="68" fill="#ffffff"/><text x="277.3333333333333" y="585.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Pretty</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">UK</tspan> (2002): engaged, but justified. <tspan font-style="italic">R</tspan> <tspan font-style="italic">(Purdy)</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">DPP</tspan> (2009): DPP</text><text x="277.3333333333333" y="606.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">must publish a prosecution policy</text></g><line x1="263.3333333333333" y1="124" x2="263.3333333333333" y2="627" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="124" width="840" height="503" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/>
