<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 588" width="900" height="588" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="588" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Correspondence: cases and the law’s response</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Letters, calls, emails and other communications</text>
<line x1="120" y1="134" x2="120" y2="542" stroke="#2e6b62" stroke-width="4"/><circle cx="120" cy="164" r="11" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="92" y="171" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="end">1975</text><rect x="150" y="124" width="720" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="170" y="162.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Golder v UK</text><text x="170" y="191.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Prisoner stopped from writing to a solicitor: breach of Article 8 (and 6)</text><circle cx="120" cy="276" r="11" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="92" y="283" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="end">1984</text><rect x="150" y="236" width="720" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="170" y="274.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Malone v UK</text><text x="170" y="303.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Police phone tapping had no clear legal basis: not “in accordance with the law”</text><circle cx="120" cy="388" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="92" y="395" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="end">1985</text><rect x="150" y="348" width="720" height="96" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="170" y="386.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Interception of Communications Act</text><text x="170" y="415.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Parliament’s response to Malone</text><circle cx="120" cy="500" r="11" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="92" y="507" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="end">1997</text><rect x="150" y="460" width="720" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="170" y="494.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Halford v UK</text><text x="170" y="523.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Office calls of a senior officer intercepted: reasonable expectation of privacy; the 1985</text><text x="170" y="544.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Act did not cover internal networks</text>
</svg>