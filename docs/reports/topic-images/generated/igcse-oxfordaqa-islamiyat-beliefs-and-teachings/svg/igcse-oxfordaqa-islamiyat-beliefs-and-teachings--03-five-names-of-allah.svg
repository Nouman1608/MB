<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 670" width="900" height="670" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="670" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Five names of Allah in the specification</text>

<text x="165" y="130" font-size="17" font-weight="700" fill="#4a5568" text-anchor="middle">Name</text><text x="500" y="130" font-size="17" font-weight="700" fill="#4a5568" text-anchor="middle">Meaning</text><text x="770" y="130" font-size="17" font-weight="700" fill="#4a5568" text-anchor="middle">So Muslims...</text><rect x="30" y="146" width="270" height="74" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="50" y="178" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Qudrah</text><text x="50" y="204" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="start">the All-Powerful</text><rect x="310" y="146" width="380" height="74" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="328" y="189" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">nothing is beyond His power</text><line x1="692" y1="183" x2="708" y2="183" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="712" y="146" width="158" height="74" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="791" y="188.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">rely on Him</text><rect x="30" y="232" width="270" height="74" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="50" y="264" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Al-Khaliq</text><text x="50" y="290" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="start">the Creator</text><rect x="310" y="232" width="380" height="74" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="328" y="275" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">made everything from nothing</text><line x1="692" y1="269" x2="708" y2="269" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="712" y="232" width="158" height="74" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="791" y="264.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">treat creation</text><text x="791" y="285.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">as a trust</text><rect x="30" y="318" width="270" height="74" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="50" y="350" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Ar-Rahman</text><text x="50" y="376" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="start">the Most Gracious</text><rect x="310" y="318" width="380" height="74" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="328" y="361" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">mercy covering all creation</text><rect x="30" y="404" width="270" height="74" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="50" y="436" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Ar-Rahim</text><text x="50" y="462" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="start">the Most Merciful</text><rect x="310" y="404" width="380" height="74" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="328" y="436" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">special mercy to believers, especially</text><text x="328" y="458" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">in the hereafter</text><rect x="30" y="490" width="270" height="74" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="50" y="522" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Al-Alim</text><text x="50" y="548" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="start">the All-Knowing</text><rect x="310" y="490" width="380" height="74" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="328" y="522" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">knows everything, including hidden</text><text x="328" y="544" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">thoughts</text><line x1="692" y1="527" x2="708" y2="527" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="712" y="490" width="158" height="74" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="791" y="532.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">act sincerely</text><rect x="710" y="318" width="160" height="162" rx="12" fill="#f4f6f6" stroke="#2e6b62" stroke-width="2"/><text x="790" y="383.6" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="middle">Every sura but</text><text x="790" y="404.6" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="middle">one opens with</text><text x="790" y="425.6" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="middle">these two names</text><rect x="30" y="588" width="840" height="58" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="624" font-size="18" font-weight="400" fill="#4a5568" text-anchor="middle">"The most beautiful names" (7.180), traditionally counted as ninety-nine</text>
</svg>