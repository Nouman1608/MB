<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 688" width="900" height="688" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="688" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Prophets and holy books</text>

<text x="150" y="128" font-size="17" font-weight="700" fill="#4a5568" text-anchor="middle">Prophet</text><text x="520" y="128" font-size="17" font-weight="700" fill="#4a5568" text-anchor="middle">Key point</text><text x="800" y="128" font-size="17" font-weight="700" fill="#4a5568" text-anchor="middle">Book</text><rect x="30" y="144" width="240" height="62" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="150" y="182" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Adam (AS)</text><rect x="280" y="144" width="460" height="62" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="298" y="181" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">first human and prophet; taught repentance</text><rect x="30" y="218" width="240" height="62" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="150" y="256" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Ibrahim (AS)</text><rect x="280" y="218" width="460" height="62" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="298" y="245" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">rejected idols; rebuilt the Ka'ba with Isma'il; model</text><text x="298" y="265" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">of submission</text><rect x="750" y="218" width="120" height="62" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="810" y="256" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Suhuf</text><rect x="30" y="292" width="240" height="62" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="150" y="330" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Musa (AS)</text><rect x="280" y="292" width="460" height="62" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="298" y="329" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">led the Children of Israel from Pharaoh</text><rect x="750" y="292" width="120" height="62" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="810" y="330" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Tawrat</text><rect x="30" y="366" width="240" height="62" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="150" y="404" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Dawud (AS)</text><rect x="280" y="366" width="460" height="62" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="298" y="403" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">received the Zabur</text><rect x="750" y="366" width="120" height="62" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="810" y="404" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Zabur</text><rect x="30" y="440" width="240" height="62" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="150" y="478" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Isa (AS)</text><rect x="280" y="440" width="460" height="62" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="298" y="467" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">born miraculously to Maryam; miracles by Allah's</text><text x="298" y="487" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">permission</text><rect x="750" y="440" width="120" height="62" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="810" y="478" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Injil</text><rect x="30" y="514" width="240" height="62" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="150" y="552" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Muhammad (pbuh)</text><rect x="280" y="514" width="460" height="62" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="298" y="551" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Khatam an-Nabiyyin, the Seal of the Prophets (33.40)</text><rect x="750" y="514" width="120" height="62" rx="12" fill="#d4b02e" stroke="#8a6d0d" stroke-width="2.5"/><text x="810" y="552" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Qur'an</text><rect x="30" y="600" width="840" height="64" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="640" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">Earlier books carried Allah's message; the Qur'an is the final, preserved revelation.</text>
</svg>