<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 646" width="900" height="646" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="646" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three levels in the Hadith of Jibril</text>

<rect x="220" y="112" width="460" height="124" rx="14" fill="#d4b02e" stroke="#8a6d0d" stroke-width="3"/><text x="450" y="152" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">Ihsan</text><text x="450" y="176" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">excellence</text><text x="450" y="205.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Worshipping Allah as though you see Him; though you</text><text x="450" y="225.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">do not see Him, He sees you.</text><rect x="150" y="248" width="600" height="124" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="3"/><text x="450" y="288" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">Iman</text><text x="450" y="312" font-size="16" font-weight="700" fill="#d4b02e" text-anchor="middle">belief</text><text x="450" y="351.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Belief in Allah, His angels, books, messengers, the Last Day and qadr.</text><rect x="30" y="384" width="840" height="124" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="3"/><text x="450" y="424" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">Islam</text><text x="450" y="448" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">practice</text><text x="450" y="487.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">The five pillars.</text><rect x="30" y="532" width="840" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="56" y="568" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Teachings of the Hadith (recorded by Muslim)</text><text x="56" y="598" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Faith has three levels: practice, belief and excellence. Seek knowledge respectfully.</text>
</svg>