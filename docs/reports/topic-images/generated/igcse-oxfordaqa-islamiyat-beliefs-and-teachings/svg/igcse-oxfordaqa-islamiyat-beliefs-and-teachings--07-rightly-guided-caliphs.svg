<rect width="900" height="552" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The four Rightly Guided Caliphs</text>

<rect x="50" y="130" width="55.172413793103445" height="40" rx="6" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><rect x="105.17241379310344" y="130" width="275.86206896551727" height="40" rx="6" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><rect x="381.0344827586207" y="130" width="331.0344827586207" height="40" rx="6" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><rect x="712.0689655172414" y="130" width="137.9310344827586" height="40" rx="6" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><line x1="50" y1="124" x2="50" y2="176" stroke="#1e2a44" stroke-width="2.5"/><text x="46" y="114" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">632</text><line x1="105.17241379310344" y1="124" x2="105.17241379310344" y2="176" stroke="#1e2a44" stroke-width="2.5"/><text x="109.17241379310344" y="114" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">634</text><line x1="381.0344827586207" y1="124" x2="381.0344827586207" y2="176" stroke="#1e2a44" stroke-width="2.5"/><text x="381.0344827586207" y="114" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">644</text><line x1="712.0689655172414" y1="124" x2="712.0689655172414" y2="176" stroke="#1e2a44" stroke-width="2.5"/><text x="712.0689655172414" y="114" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">656</text><line x1="850" y1="124" x2="850" y2="176" stroke="#1e2a44" stroke-width="2.5"/><text x="850" y="114" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">661</text><path d="M77.58620689655172,172 L77.58620689655172,186 L130.5,222 L130.5,232" fill="none" stroke="#d4b02e" stroke-width="2.5" stroke-linejoin="round"/><rect x="30" y="232" width="201" height="214" rx="14" fill="#ffffff" stroke="#d4b02e" stroke-width="2.5"/><rect x="30" y="232" width="201" height="96" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="130.5" y="267.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Hazrat Abu Bakr</text><text x="130.5" y="289.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">(RA)</text><text x="130.5" y="316" font-size="15" font-weight="600" fill="#4a5568" text-anchor="middle">632–634</text><text x="130.5" y="369.95" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Kept the community</text><text x="130.5" y="391.95" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">united; had the</text><text x="130.5" y="413.95" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Qur'an gathered</text><path d="M243.10344827586206,172 L243.10344827586206,186 L343.5,222 L343.5,232" fill="none" stroke="#2e6b62" stroke-width="2.5" stroke-linejoin="round"/><rect x="243" y="232" width="201" height="214" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><rect x="243" y="232" width="201" height="96" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="343.5" y="278.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Hazrat Umar (RA)</text><text x="343.5" y="316" font-size="15" font-weight="600" fill="#4a5568" text-anchor="middle">634–644</text><text x="343.5" y="380.95" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Expanded and</text><text x="343.5" y="402.95" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">organised the state</text><path d="M546.551724137931,172 L546.551724137931,186 L556.5,222 L556.5,232" fill="none" stroke="#d4b02e" stroke-width="2.5" stroke-linejoin="round"/><rect x="456" y="232" width="201" height="214" rx="14" fill="#ffffff" stroke="#d4b02e" stroke-width="2.5"/><rect x="456" y="232" width="201" height="96" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="556.5" y="267.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Hazrat Uthman</text><text x="556.5" y="289.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">(RA)</text><text x="556.5" y="316" font-size="15" font-weight="600" fill="#4a5568" text-anchor="middle">644–656</text><text x="556.5" y="380.95" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Distributed standard</text><text x="556.5" y="402.95" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">copies of the Qur'an</text><path d="M781.0344827586207,172 L781.0344827586207,186 L769.5,222 L769.5,232" fill="none" stroke="#2e6b62" stroke-width="2.5" stroke-linejoin="round"/><rect x="669" y="232" width="201" height="214" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><rect x="669" y="232" width="201" height="96" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="769.5" y="278.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Hazrat Ali (RA)</text><text x="769.5" y="316" font-size="15" font-weight="600" fill="#4a5568" text-anchor="middle">656–661</text><text x="769.5" y="369.95" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Known for knowledge</text><text x="769.5" y="391.95" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">and justice in a</text><text x="769.5" y="413.95" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">time of conflict</text><rect x="30" y="464" width="840" height="64" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="450" y="504" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">Shi'a Muslims believe Ali (RA) should have led immediately, as the first Imam.</text>
</svg>