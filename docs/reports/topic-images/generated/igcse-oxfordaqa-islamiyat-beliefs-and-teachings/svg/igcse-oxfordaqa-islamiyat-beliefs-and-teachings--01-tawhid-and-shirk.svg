<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="640" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Tawhid and shirk</text>

<text x="450" y="128" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="middle">Tawhid: the absolute oneness of Allah</text><rect x="30" y="146" width="272" height="150" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="176.76" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Tawhid al-Rububiyyah</text><text x="46" y="205.34" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Allah alone is Lord:</text><text x="46" y="227.78" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Creator, Sustainer and</text><text x="46" y="250.22" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Controller of everything</text><rect x="314" y="146" width="272" height="150" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="330" y="176.76" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Tawhid al-Uluhiyyah</text><text x="330" y="205.34" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Allah alone deserves</text><text x="330" y="227.78" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">worship, prayer and devotion</text><rect x="598" y="146" width="272" height="150" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="614" y="176.76" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Tawhid al-Asma wa</text><text x="614" y="200.16" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">al-Sifat</text><text x="614" y="228.74" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Allah's names and attributes</text><text x="614" y="251.18" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">are unique, not shared with</text><text x="614" y="273.62" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">creation</text><text x="450" y="340" font-size="21" font-weight="700" fill="#b5602e" text-anchor="middle">Shirk: associating partners with Allah</text><rect x="30" y="358" width="414" height="178" rx="14" fill="#f3dccd" stroke="#b5602e" stroke-width="2.5"/><text x="52" y="394" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Major shirk</text><text x="52" y="426" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Worshipping idols, other people or forces</text><rect x="46" y="470" width="382" height="50" rx="10" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><text x="64" y="502" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">→ Takes a person outside Islam</text><rect x="456" y="358" width="414" height="178" rx="14" fill="#f3dccd" stroke="#b5602e" stroke-width="2.5"/><text x="478" y="394" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Minor shirk</text><text x="478" y="426" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Showing off in worship (riya') to gain</text><text x="478" y="448" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">praise</text><rect x="472" y="470" width="382" height="50" rx="10" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><text x="490" y="502" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">→ Damages the reward of good deeds</text><rect x="30" y="556" width="840" height="60" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="450" y="594" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">Allah does not forgive shirk if a person dies without repenting (4.48).</text>
</svg>