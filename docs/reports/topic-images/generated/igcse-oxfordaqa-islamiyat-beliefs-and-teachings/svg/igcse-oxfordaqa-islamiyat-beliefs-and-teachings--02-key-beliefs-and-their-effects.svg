<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The six key beliefs and what they give</text>

<text x="190" y="128" font-size="18" font-weight="700" fill="#4a5568" text-anchor="middle">Belief</text><text x="700" y="128" font-size="18" font-weight="700" fill="#4a5568" text-anchor="middle">What it gives Muslims</text><path d="M350,177 C430,177 450,192 536,192" fill="none" stroke="#2e6b62" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#ahT)"/><path d="M350,253 C430,253 450,416 536,416" fill="none" stroke="#2e6b62" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#ahT)"/><path d="M350,329 C430,329 450,304 536,304" fill="none" stroke="#2e6b62" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#ahT)"/><path d="M350,405 C430,405 450,304 536,304" fill="none" stroke="#2e6b62" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#ahT)"/><path d="M350,481 C430,481 450,416 536,416" fill="none" stroke="#2e6b62" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#ahT)"/><path d="M350,557 C430,557 450,528 536,528" fill="none" stroke="#2e6b62" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#ahT)"/><rect x="30" y="146" width="320" height="62" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="185" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Allah</text><text x="330" y="185" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="end" font-style="italic">Tawhid</text><rect x="30" y="222" width="320" height="62" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="261" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Angels</text><text x="330" y="261" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="end" font-style="italic">Malaikah</text><rect x="30" y="298" width="320" height="62" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="337" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Revealed books</text><text x="330" y="337" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="end" font-style="italic">Kutub</text><rect x="30" y="374" width="320" height="62" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="413" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Prophethood</text><text x="330" y="413" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="end" font-style="italic">Risalah</text><rect x="30" y="450" width="320" height="62" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="489" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The Last Day</text><text x="330" y="489" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="end" font-style="italic">Yaum al-Akhirah</text><rect x="30" y="526" width="320" height="62" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="565" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Al-Qadr</text><text x="330" y="565" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="end" font-style="italic">decree</text><rect x="540" y="152" width="330" height="80" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="562" y="186" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Purpose</text><text x="562" y="214" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">to worship Allah</text><rect x="540" y="264" width="330" height="80" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="562" y="298" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Guidance</text><text x="562" y="326" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">books and prophets</text><rect x="540" y="376" width="330" height="80" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="562" y="410" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Accountability</text><text x="562" y="438" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">deeds recorded and judged</text><rect x="540" y="488" width="330" height="80" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="562" y="522" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Trust</text><text x="562" y="550" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">in Allah's decree</text><text x="450" y="630" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">All six are stated together in the Hadith of Jibril and in Qur'an 2.285.</text>
