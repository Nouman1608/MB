<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 672" width="900" height="672" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="672" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">After death</text>

<rect x="30" y="112" width="196" height="120" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="150" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Death</text><text x="128" y="187.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">the Angel of Death</text><text x="128" y="207.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">takes the soul</text><line x1="228" y1="172" x2="242" y2="172" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="244" y="112" width="196" height="120" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="342" y="150" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Barzakh</text><text x="342" y="187.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">questioned in the</text><text x="342" y="207.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">grave; a foretaste</text><line x1="442" y1="172" x2="456" y2="172" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="458" y="112" width="196" height="120" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="556" y="150" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Resurrection</text><text x="556" y="187.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">the trumpet is blown;</text><text x="556" y="207.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">all raised</text><line x1="656" y1="172" x2="670" y2="172" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="672" y="112" width="196" height="120" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="770" y="150" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Judgement</text><text x="770" y="187.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">record of deeds;</text><text x="770" y="207.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">judged justly</text><path d="M770,234 L770,252 L240,252 L240,270" fill="none" stroke="#2e6b62" stroke-width="3.5" stroke-linejoin="round" marker-end="url(#ahT)"/><path d="M770,252 L660,252 L660,270" fill="none" stroke="#b5602e" stroke-width="3.5" stroke-linejoin="round" marker-end="url(#ahR)"/><rect x="60" y="276" width="360" height="80" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="3"/><text x="240" y="308" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Heaven (Jannah)</text><text x="240" y="336" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="middle">eternal reward for the righteous</text><rect x="480" y="276" width="360" height="80" rx="14" fill="#f3dccd" stroke="#b5602e" stroke-width="3"/><text x="660" y="308" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Hell (Jahannam)</text><text x="660" y="336" font-size="16" font-weight="400" fill="#b5602e" text-anchor="middle">punishment for the wicked</text><text x="450" y="384" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Allah's mercy is able to forgive.</text><rect x="30" y="404" width="840" height="244" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="56" y="440" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Death rituals</text><text x="844" y="440" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end">usually soon after death</text><rect x="56" y="460" width="184" height="96" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="148" y="494" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Ghusl</text><text x="148" y="533.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">the body is washed</text><line x1="242" y1="503" x2="254" y2="503" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="256" y="460" width="184" height="96" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="348" y="494" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Kafan</text><text x="348" y="524.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">wrapped in simple</text><text x="348" y="542.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">white cloth</text><line x1="442" y1="503" x2="454" y2="503" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="456" y="460" width="184" height="96" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="548" y="494" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Salat al-janazah</text><text x="548" y="533.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">the funeral prayer</text><line x1="642" y1="503" x2="654" y2="503" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="656" y="460" width="184" height="96" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="748" y="494" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Burial</text><text x="748" y="533.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">facing the qibla</text><text x="56" y="590" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Why: they honour the dead, remind the living of their own death,</text><text x="56" y="616" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">and express equality, since everyone is buried simply. Details differ between communities.</text>
</svg>