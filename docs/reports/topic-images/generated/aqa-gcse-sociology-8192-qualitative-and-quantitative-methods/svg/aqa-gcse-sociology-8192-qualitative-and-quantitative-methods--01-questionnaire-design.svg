<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 719" width="900" height="719" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="719" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Designing a questionnaire</text>

<rect x="30" y="108" width="412" height="128" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,158 L31.25,122.25 Q31.25,109.25 44.25,109.25 L427.75,109.25 Q440.75,109.25 440.75,122.25 L440.75,158 Z" fill="#b5d3cf"/><line x1="31.25" y1="158" x2="440.75" y2="158" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="139" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Closed questions</text><text x="44" y="190.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Fixed options, tick boxes, rating scales:</text><text x="44" y="212.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">quantitative</tspan> data</text><rect x="458" y="108" width="412" height="128" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,158 L459.25,122.25 Q459.25,109.25 472.25,109.25 L855.75,109.25 Q868.75,109.25 868.75,122.25 L868.75,158 Z" fill="#f2e7b8"/><line x1="459.25" y1="158" x2="868.75" y2="158" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="139" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Open questions</text><text x="472" y="190.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Respondents answer in their own words:</text><text x="472" y="212.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">qualitative</tspan> data</text><text x="450" y="270" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Three wording traps to avoid</text><rect x="30" y="290" width="250" height="64" rx="12" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="155" y="329" font-size="19" font-weight="700" fill="#b5602e" text-anchor="middle">Leading</text><rect x="296" y="290" width="574" height="64" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="314" y="327.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Suggests an answer</text><rect x="30" y="366" width="250" height="64" rx="12" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="155" y="405" font-size="19" font-weight="700" fill="#b5602e" text-anchor="middle">Loaded</text><rect x="296" y="366" width="574" height="64" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="314" y="403.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Uses emotive words</text><rect x="30" y="442" width="250" height="64" rx="12" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="155" y="481" font-size="19" font-weight="700" fill="#b5602e" text-anchor="middle">Double-barrelled</text><rect x="296" y="442" width="574" height="64" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="314" y="468.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Asks two things at once, e.g. “Do you enjoy school and</text><text x="314" y="490.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">homework?”</text><rect x="30" y="524" width="840" height="171" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="560" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Delivery and response rates</text><circle cx="61" cy="583.39" r="4.5" fill="#8a6d0d"/><text x="74" y="589" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Online and postal forms reach many people cheaply but often have <tspan font-weight="700">low response rates</tspan></text><circle cx="61" cy="613.39" r="4.5" fill="#8a6d0d"/><text x="74" y="619" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Handing forms out in a classroom or workplace usually raises the response rate</text><circle cx="61" cy="643.39" r="4.5" fill="#8a6d0d"/><text x="74" y="649" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">An <tspan font-weight="700">attitude survey</tspan> asks people to rate statements from “strongly agree” to “strongly</text><text x="74" y="671" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">disagree”</text>
</svg>