<rect width="900" height="735" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Mixed methods</text>

<rect x="30" y="140" width="385" height="85" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="222.5" y="172.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Interviews</text><text x="222.5" y="202.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Explore the issue in depth</text><line x1="419" y1="182.5" x2="481" y2="182.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="485" y="140" width="385" height="85" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="677.5" y="172.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Questionnaire</text><text x="677.5" y="202.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Designed from what interviews revealed</text><text x="450" y="130" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">Sequencing: one way</text><rect x="30" y="290" width="385" height="106" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="222.5" y="332.8" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Questionnaire</text><text x="222.5" y="362.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Shows the scale of a pattern</text><line x1="419" y1="343" x2="481" y2="343" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="485" y="290" width="385" height="106" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="677.5" y="322.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Interviews</text><text x="677.5" y="352.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Explain the pattern, with people the survey</text><text x="677.5" y="373.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">identified</text><text x="450" y="280" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">Sequencing: the other way</text><rect x="30" y="430" width="412" height="205" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,480 L31.25,444.25 Q31.25,431.25 44.25,431.25 L427.75,431.25 Q440.75,431.25 440.75,444.25 L440.75,480 Z" fill="#b5d3cf"/><line x1="31.25" y1="480" x2="440.75" y2="480" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="460.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Useful</text><circle cx="49" cy="505.92" r="4.5" fill="#2e6b62"/><text x="62" y="511.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Triangulation:</tspan> check one method against</text><text x="62" y="532.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">another</text><circle cx="49" cy="555.9200000000001" r="4.5" fill="#2e6b62"/><text x="62" y="561.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Numbers show the scale; words explain it</text><circle cx="49" cy="584.9200000000001" r="4.5" fill="#2e6b62"/><text x="62" y="590.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Willis: observation, group discussions,</text><text x="62" y="611.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">interviews and diaries gave a fuller picture</text><rect x="458" y="430" width="412" height="205" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,480 L459.25,444.25 Q459.25,431.25 472.25,431.25 L855.75,431.25 Q868.75,431.25 868.75,444.25 L868.75,480 Z" fill="#f2e7b8"/><line x1="459.25" y1="480" x2="868.75" y2="480" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="460.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Limits</text><circle cx="477" cy="505.92" r="4.5" fill="#2e6b62"/><text x="490" y="511.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">More time and money; skills in several methods</text><circle cx="477" cy="534.9200000000001" r="4.5" fill="#2e6b62"/><text x="490" y="540.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Results may conflict</text><circle cx="477" cy="563.9200000000001" r="4.5" fill="#2e6b62"/><text x="490" y="569.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A small qualitative sample plus a survey is</text><text x="490" y="590.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">not automatically representative</text><rect x="30" y="651" width="840" height="60" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="687" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Mixed methods is the design; triangulation is one of its uses.</text>
</svg>