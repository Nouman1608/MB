<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 741" width="900" height="741" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="741" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Types of interview</text>

<defs><linearGradient id="gq" x1="0" x2="1"><stop offset="0" stop-color="#b5d3cf"/><stop offset="1" stop-color="#f2e7b8"/></linearGradient></defs><rect x="30" y="150" width="840" height="40" rx="20" fill="url(#gq)" stroke="#1e2a44" stroke-width="2.5"/><text x="30" y="134" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">mainly QUANTITATIVE: comparable, reliable</text><text x="870" y="134" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="end">QUALITATIVE: depth, valid</text><circle cx="170" cy="170" r="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><line x1="170" y1="190" x2="170" y2="212" stroke="#1e2a44" stroke-width="2"/><rect x="40" y="212" width="260" height="190" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="56" y="242" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Structured</text><text x="56" y="272" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Same questions, same order,</text><text x="56" y="293" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">often fixed options: a</text><text x="56" y="314" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">questionnaire read aloud</text><text x="56" y="364" font-size="15.5" font-weight="600" fill="#2e6b62" text-anchor="start" font-style="italic">Young and Willmott: nearly</text><text x="56" y="384" font-size="15.5" font-weight="600" fill="#2e6b62" text-anchor="start" font-style="italic">2,000 people</text><circle cx="450" cy="170" r="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><line x1="450" y1="190" x2="450" y2="212" stroke="#1e2a44" stroke-width="2"/><rect x="320" y="212" width="260" height="190" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="336" y="242" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Semi-structured</text><text x="336" y="272" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Core questions, with freedom</text><text x="336" y="293" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">to probe further</text><text x="336" y="364" font-size="15.5" font-weight="600" fill="#2e6b62" text-anchor="start" font-style="italic">Some comparability, some</text><text x="336" y="384" font-size="15.5" font-weight="600" fill="#2e6b62" text-anchor="start" font-style="italic">depth</text><circle cx="730" cy="170" r="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><line x1="730" y1="190" x2="730" y2="212" stroke="#1e2a44" stroke-width="2"/><rect x="600" y="212" width="260" height="190" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="616" y="242" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Unstructured</text><text x="616" y="272" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A guided conversation</text><text x="616" y="293" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">following up interesting</text><text x="616" y="314" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">points</text><text x="616" y="364" font-size="15.5" font-weight="600" fill="#2e6b62" text-anchor="start" font-style="italic">Carlen: women, crime and</text><text x="616" y="384" font-size="15.5" font-weight="600" fill="#2e6b62" text-anchor="start" font-style="italic">poverty</text><rect x="30" y="422" width="840" height="70" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="50" y="452" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Group interview or focus group</text><text x="50" y="476" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Several people discuss a topic together, guided by the researcher</text><rect x="30" y="512" width="412" height="205" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,562 L31.25,526.25 Q31.25,513.25 44.25,513.25 L427.75,513.25 Q440.75,513.25 440.75,526.25 L440.75,562 Z" fill="#b5d3cf"/><line x1="31.25" y1="562" x2="440.75" y2="562" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="542.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Strengths</text><circle cx="49" cy="587.9200000000001" r="4.5" fill="#2e6b62"/><text x="62" y="593.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Higher response rates than postal</text><text x="62" y="614.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">questionnaires</text><circle cx="49" cy="637.9200000000001" r="4.5" fill="#2e6b62"/><text x="62" y="643.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The interviewer can explain questions</text><circle cx="49" cy="666.9200000000001" r="4.5" fill="#2e6b62"/><text x="62" y="672.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Unstructured: <tspan font-weight="700">rapport</tspan>; people explain views in</text><text x="62" y="693.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">their own words, raising validity</text><rect x="458" y="512" width="412" height="205" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,562 L459.25,526.25 Q459.25,513.25 472.25,513.25 L855.75,513.25 Q868.75,513.25 868.75,526.25 L868.75,562 Z" fill="#f2e7b8"/><line x1="459.25" y1="562" x2="868.75" y2="562" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="542.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Weaknesses</text><circle cx="477" cy="587.9200000000001" r="4.5" fill="#2e6b62"/><text x="490" y="593.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Expensive and slow, especially transcribing</text><circle cx="477" cy="616.9200000000001" r="4.5" fill="#2e6b62"/><text x="490" y="622.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Interviewer effect:</tspan> age, gender, ethnicity or</text><text x="490" y="643.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">manner shape answers</text><circle cx="477" cy="666.9200000000001" r="4.5" fill="#2e6b62"/><text x="490" y="672.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Unstructured: hard to repeat and compare;</text><text x="490" y="693.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">small samples</text>
</svg>