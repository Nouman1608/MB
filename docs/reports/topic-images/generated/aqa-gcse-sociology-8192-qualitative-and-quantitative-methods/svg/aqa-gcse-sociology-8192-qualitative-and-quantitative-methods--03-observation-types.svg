<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 791" width="900" height="791" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="791" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four kinds of observation</text>

<rect x="230" y="108" width="312" height="56" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="386" y="136" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Participant</text><text x="386" y="156" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="middle">researcher joins in</text><rect x="558" y="108" width="312" height="56" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="714" y="136" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Non-participant</text><text x="714" y="156" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="middle">researcher watches</text><rect x="30" y="176" width="186" height="190" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="123" y="267" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Overt</text><text x="123" y="293" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="middle">group knows</text><rect x="230" y="176" width="312" height="190" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="248" y="212" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Joining a school staff room with</text><text x="248" y="234" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">permission, as an open</text><text x="248" y="256" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">researcher</text><rect x="558" y="176" width="312" height="190" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="576" y="212" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Sitting at the back of a</text><text x="576" y="234" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">classroom with a notepad</text><rect x="248" y="308" width="604" height="42" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="1.5"/><text x="550" y="335" font-size="15.5" font-weight="600" fill="#8a6d0d" text-anchor="middle">Risk: the observer effect</text><rect x="30" y="380" width="186" height="190" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="123" y="471" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Covert</text><text x="123" y="497" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="middle">group does not know</text><rect x="230" y="380" width="312" height="190" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="248" y="416" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Taking a job in a workplace</text><text x="248" y="438" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">without revealing the research</text><rect x="558" y="380" width="312" height="190" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="576" y="416" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Watching behaviour in a public</text><text x="576" y="438" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">place unnoticed</text><rect x="248" y="512" width="604" height="42" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="1.5"/><text x="550" y="539" font-size="15.5" font-weight="600" fill="#8a6d0d" text-anchor="middle">Avoids behaviour change, but raises consent and deception</text><rect x="30" y="588" width="840" height="179" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="624" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Watch for</text><circle cx="61" cy="647.39" r="4.5" fill="#8a6d0d"/><text x="74" y="653" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Observer effect</tspan> (Hawthorne effect): people act differently when they know they are watched</text><circle cx="61" cy="677.39" r="4.5" fill="#8a6d0d"/><text x="74" y="683" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Going native:</tspan> the researcher becomes too involved and loses objectivity</text><circle cx="61" cy="707.39" r="4.5" fill="#8a6d0d"/><text x="74" y="713" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Field notes often written later from memory; small, one-off settings give low reliability</text><circle cx="61" cy="737.39" r="4.5" fill="#8a6d0d"/><text x="74" y="743" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Ethnography:</tspan> a detailed study of a way of life, e.g. Ball’s three years at Beachside</text>
</svg>