<rect width="900" height="725" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Matching a method to a topic</text>

<text x="30" y="112" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">Area of research</text><text x="400" y="112" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">Method</text><text x="650" y="112" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">Because…</text><rect x="30" y="126" width="330" height="78" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="159.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">How many couples share housework</text><text x="46" y="181.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">equally?</text><line x1="364" y1="165" x2="392" y2="165" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="396" y="126" width="230" height="78" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="511" y="159.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Closed-question</text><text x="511" y="181.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">questionnaire</text><rect x="642" y="126" width="228" height="78" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="656" y="159.725" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Comparable numbers from a</text><text x="656" y="179.725" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">large sample</text><rect x="30" y="218" width="330" height="78" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="251.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Why do some pupils join anti-school</text><text x="46" y="273.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">groups?</text><line x1="364" y1="257" x2="392" y2="257" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="396" y="218" width="230" height="78" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="511" y="251.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Participant</text><text x="511" y="273.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">observation</text><rect x="642" y="218" width="228" height="78" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="656" y="251.725" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Behaviour and meanings</text><text x="656" y="271.725" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">best seen in context</text><rect x="30" y="310" width="330" height="78" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="354.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Experiences of domestic violence</text><line x1="364" y1="349" x2="392" y2="349" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="396" y="310" width="230" height="78" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="511" y="354.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Unstructured interview</text><rect x="642" y="310" width="228" height="78" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="656" y="343.725" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Sensitive: needs trust,</text><text x="656" y="363.725" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">privacy and depth</text><rect x="30" y="402" width="330" height="78" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="446.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Parents’ views on choosing schools</text><line x1="364" y1="441" x2="392" y2="441" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="396" y="402" width="230" height="78" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="511" y="446.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Focus group</text><rect x="642" y="402" width="228" height="78" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="656" y="435.725" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Shows how opinions form</text><text x="656" y="455.725" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">through discussion</text><rect x="30" y="494" width="330" height="78" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="527.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Attitudes to crime across age</text><text x="46" y="549.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">groups</text><line x1="364" y1="533" x2="392" y2="533" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="396" y="494" width="230" height="78" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="511" y="538.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Structured interview</text><rect x="642" y="494" width="228" height="78" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="656" y="527.725" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Comparable answers, good</text><text x="656" y="547.725" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">response rate</text><rect x="30" y="590" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="626" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Apply, do not list</text><text x="56" y="655" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Tie each strength and weakness to the specific topic, using reliability, validity and</text><text x="56" y="677" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">representativeness.</text>
</svg>