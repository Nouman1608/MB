<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 585" width="900" height="585" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="585" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Functional fit: which came first?</text>

<text x="30" y="120" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Parsons: the family follows the economy</text><rect x="30" y="136" width="246.66666666666666" height="130" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="153.33333333333331" y="201.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Industrial society</text><line x1="280.66666666666663" y1="201" x2="322.66666666666663" y2="201" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="326.66666666666663" y="136" width="246.66666666666666" height="130" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="449.99999999999994" y="168.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Needs a mobile</text><text x="449.99999999999994" y="192.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">workforce</text><text x="449.99999999999994" y="222.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">geographically and</text><text x="449.99999999999994" y="243.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">socially</text><line x1="577.3333333333333" y1="201" x2="619.3333333333333" y2="201" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="623.3333333333333" y="136" width="246.66666666666666" height="130" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="746.6666666666666" y="168.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Isolated nuclear</text><text x="746.6666666666666" y="192.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">family</text><text x="746.6666666666666" y="222.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">replaces the extended</text><text x="746.6666666666666" y="243.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">family</text><text x="30" y="306" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="start">Laslett: cause and effect may be reversed</text><rect x="30" y="322" width="246.66666666666666" height="106" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="153.33333333333331" y="354.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Nuclear households</text><text x="153.33333333333331" y="384.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">already common in</text><text x="153.33333333333331" y="405.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">pre-industrial England</text><line x1="280.66666666666663" y1="375" x2="322.66666666666663" y2="375" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="326.66666666666663" y="322" width="246.66666666666666" height="106" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="449.99999999999994" y="364.8" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">May have helped</text><text x="449.99999999999994" y="394.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">industrialisation happen</text><line x1="577.3333333333333" y1="375" x2="619.3333333333333" y2="375" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="623.3333333333333" y="322" width="246.66666666666666" height="106" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="746.6666666666666" y="375.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Industrial society</text><rect x="30" y="448" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="484" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Also against Parsons</text><text x="56" y="513" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Young and Willmott (1957) found strong extended kin networks in Bethnal Green, an</text><text x="56" y="535" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">industrial city.</text>
</svg>