<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 646" width="900" height="646" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="646" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Who does the family serve?</text>

<rect x="188" y="104" width="337" height="44" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="356.5" y="131.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Functionalism</text><rect x="533" y="104" width="337" height="44" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="701.5" y="131.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Marxism</text><rect x="30" y="156" width="150" height="93" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="207.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Main claim</text><rect x="188" y="156" width="337" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="202" y="186.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The family performs functions for</text><text x="202" y="207.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">society and fits the needs of the</text><text x="202" y="228.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">economy.</text><rect x="533" y="156" width="337" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="547" y="186.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The family serves capitalism and</text><text x="547" y="207.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">private property.</text><rect x="30" y="257" width="150" height="206" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="365.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Key studies</text><rect x="188" y="257" width="337" height="206" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="207" cy="281.92" r="4.5" fill="#2e6b62"/><text x="220" y="287.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Murdock (1949):</tspan> 250 societies;</text><text x="220" y="308.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">four functions: sexual,</text><text x="220" y="329.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">reproductive, economic,</text><text x="220" y="350.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">educational</text><circle cx="207" cy="373.92" r="4.5" fill="#2e6b62"/><text x="220" y="379.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Parsons (1955):</tspan> two "irreducible"</text><text x="220" y="400.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">functions: primary socialisation</text><text x="220" y="421.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and stabilising adult</text><text x="220" y="442.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">personalities</text><rect x="533" y="257" width="337" height="206" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="552" cy="281.92" r="4.5" fill="#2e6b62"/><text x="565" y="287.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Engels (1884):</tspan> monogamy lets men</text><text x="565" y="308.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">know their heirs</text><circle cx="552" cy="331.92" r="4.5" fill="#2e6b62"/><text x="565" y="337.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Zaretsky (1976):</tspan> an illusory</text><text x="565" y="358.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">"refuge" from alienating work; a</text><text x="565" y="379.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">unit of consumption</text><rect x="30" y="471" width="150" height="143" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="547.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Criticisms</text><rect x="188" y="471" width="337" height="143" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="207" cy="495.92" r="4.5" fill="#2e6b62"/><text x="220" y="501.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Feminists: ignores who does the</text><text x="220" y="522.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">work; "functions" can mean</text><text x="220" y="543.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">exploitation for women</text><circle cx="207" cy="566.9200000000001" r="4.5" fill="#2e6b62"/><text x="220" y="572.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Laslett; Young and Willmott</text><text x="220" y="593.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(below)</text><rect x="533" y="471" width="337" height="143" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="552" cy="495.92" r="4.5" fill="#2e6b62"/><text x="565" y="501.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Ignores family diversity</text><circle cx="552" cy="524.9200000000001" r="4.5" fill="#2e6b62"/><text x="565" y="530.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Feminists: gender, not class, is</text><text x="565" y="551.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the main inequality</text>
</svg>