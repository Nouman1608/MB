<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 574" width="900" height="574" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="574" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How should we read family diversity?</text>

<rect x="30" y="104" width="274.6666666666667" height="44" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="167.33333333333334" y="131.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">New Right</text><rect x="312.6666666666667" y="104" width="274.6666666666667" height="44" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="450" y="131.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Chester (1985)</text><rect x="595.3333333333334" y="104" width="274.6666666666667" height="44" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="732.6666666666667" y="131.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Diversity and choice</text><rect x="30" y="156" width="274.6666666666667" height="264" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="49" cy="180.92" r="4.5" fill="#2e6b62"/><text x="62" y="186.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The married nuclear family</text><text x="62" y="207.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">is the best setting for</text><text x="62" y="228.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">raising children</text><circle cx="49" cy="251.92" r="4.5" fill="#2e6b62"/><text x="62" y="257.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Growth of lone-parent</text><text x="62" y="278.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">families linked to social</text><text x="62" y="299.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">problems</text><rect x="312.6666666666667" y="156" width="274.6666666666667" height="264" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="331.6666666666667" cy="180.92" r="4.5" fill="#2e6b62"/><text x="344.6666666666667" y="186.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The main change is the</text><text x="344.6666666666667" y="207.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">"neo-conventional family":</text><text x="344.6666666666667" y="228.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">both partners work</text><circle cx="331.6666666666667" cy="251.92" r="4.5" fill="#2e6b62"/><text x="344.6666666666667" y="257.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Diversity is overstated:</text><text x="344.6666666666667" y="278.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">snapshots catch people</text><text x="344.6666666666667" y="299.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">between stages</text><rect x="595.3333333333334" y="156" width="274.6666666666667" height="264" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="614.3333333333334" cy="180.92" r="4.5" fill="#2e6b62"/><text x="627.3333333333334" y="186.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Rapoports (1982):</tspan></text><text x="627.3333333333334" y="207.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">organisational, cultural,</text><text x="627.3333333333334" y="228.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">class, life-stage and</text><text x="627.3333333333334" y="249.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">cohort diversity</text><circle cx="614.3333333333334" cy="272.92" r="4.5" fill="#2e6b62"/><text x="627.3333333333334" y="278.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Giddens:</tspan> the "pure</text><text x="627.3333333333334" y="299.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">relationship"</text><circle cx="614.3333333333334" cy="322.92" r="4.5" fill="#2e6b62"/><text x="627.3333333333334" y="328.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Beck and Beck-Gernsheim:</tspan></text><text x="627.3333333333334" y="349.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">individualisation</text><circle cx="614.3333333333334" cy="372.92" r="4.5" fill="#2e6b62"/><text x="627.3333333333334" y="378.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Stacey:</tspan> divorce-extended</text><text x="627.3333333333334" y="399.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">families</text><rect x="30" y="428" width="274.6666666666667" height="114" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="458.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Critics:</tspan> low income, not</text><text x="44" y="479.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">family type, explains much</text><text x="44" y="500.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">disadvantage; this view</text><text x="44" y="521.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">stigmatises lone parents.</text><rect x="312.6666666666667" y="428" width="274.6666666666667" height="114" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="326.6666666666667" y="458.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Critics:</tspan> the Rapoports show</text><text x="326.6666666666667" y="479.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">cultural and class diversity</text><text x="326.6666666666667" y="500.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the model misses.</text><rect x="595.3333333333334" y="428" width="274.6666666666667" height="114" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="609.3333333333334" y="458.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Critics:</tspan> may exaggerate</text><text x="609.3333333333334" y="479.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">choice and underplay income</text><text x="609.3333333333334" y="500.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and law.</text>
</svg>