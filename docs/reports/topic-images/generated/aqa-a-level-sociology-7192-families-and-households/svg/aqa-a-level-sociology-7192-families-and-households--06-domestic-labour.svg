<rect width="900" height="543" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Are conjugal roles becoming equal?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Bott (1957): segregated roles versus joint roles</text>
<rect x="30" y="120" width="404" height="260" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,170 L31.25,134.25 Q31.25,121.25 44.25,121.25 L419.75,121.25 Q432.75,121.25 432.75,134.25 L432.75,170 Z" fill="#b5d3cf"/><line x1="31.25" y1="170" x2="432.75" y2="170" stroke="#c9d6d4" stroke-width="2"/><text x="232" y="150.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">March of progress</text><circle cx="53" cy="200.79" r="4.5" fill="#2e6b62"/><text x="66" y="206.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Young and Willmott (1973):</tspan> the</text><text x="66" y="228.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">symmetrical family</text><circle cx="53" cy="252.78999999999996" r="4.5" fill="#2e6b62"/><text x="66" y="258.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Gershuny (1994):</tspan> lagged adaptation, as</text><text x="66" y="280.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">men slowly do more</text><circle cx="53" cy="304.78999999999996" r="4.5" fill="#2e6b62"/><text x="66" y="310.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Sullivan (2000):</tspan> a trend towards more</text><text x="66" y="332.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">equal division</text><rect x="466" y="120" width="404" height="260" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M467.25,170 L467.25,134.25 Q467.25,121.25 480.25,121.25 L855.75,121.25 Q868.75,121.25 868.75,134.25 L868.75,170 Z" fill="#f2e7b8"/><line x1="467.25" y1="170" x2="868.75" y2="170" stroke="#c9d6d4" stroke-width="2"/><text x="668" y="150.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Feminist critique</text><circle cx="489" cy="200.79" r="4.5" fill="#8a6d0d"/><text x="502" y="206.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Oakley (1974):</tspan> 40 housewives, little</text><text x="502" y="228.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">symmetry; "helping" counted if done</text><text x="502" y="250.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">once a week</text><circle cx="489" cy="274.78999999999996" r="4.5" fill="#8a6d0d"/><text x="502" y="280.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Duncombe and Marsden (1995):</tspan> the triple</text><text x="502" y="302.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">shift, adding emotion work</text><circle cx="489" cy="326.78999999999996" r="4.5" fill="#8a6d0d"/><text x="502" y="332.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Edgell; Pahl:</tspan> men hold power over big</text><text x="502" y="354.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">decisions and money</text><circle cx="450" cy="250" r="24" fill="#1e2a44"/><text x="450" y="257" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">vs</text><rect x="30" y="398" width="840" height="119" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="434" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Why does inequality persist? (Crompton and Lyonette, 2008)</text><circle cx="61" cy="457.39" r="4.5" fill="#8a6d0d"/><text x="74" y="463" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Cultural:</tspan> norms tell women to do housework</text><circle cx="61" cy="487.39" r="4.5" fill="#8a6d0d"/><text x="74" y="493" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Material:</tspan> women earn less, so it is "rational" for them to do more</text>
