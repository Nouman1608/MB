<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 679" width="900" height="679" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="679" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why did divorce rise?</text>

<rect x="30" y="104" width="520" height="74" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="134" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Legal change</text><text x="48" y="159" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Divorce Reform Act 1969 (in force 1971); no-fault divorce</text><text x="48" y="180" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">from 6 April 2022</text><path d="M554,141 C630,141 620,319 662,313" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><rect x="30" y="190" width="520" height="74" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="220" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Secularisation and declining stigma</text><text x="48" y="245" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">less social pressure to stay married</text><path d="M554,227 C630,227 620,319 662,313" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><rect x="30" y="276" width="520" height="74" rx="12" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="306" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Rising expectations</text><text x="48" y="331" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Fletcher (1966): less willing to accept an unhappy</text><text x="48" y="352" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">marriage</text><path d="M554,313 C630,313 620,319 662,313" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><rect x="30" y="362" width="520" height="74" rx="12" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="392" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Women’s financial independence</text><text x="48" y="417" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">women can afford to leave</text><path d="M554,399 C630,399 620,319 662,313" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><rect x="30" y="448" width="520" height="74" rx="12" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="478" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Inequality inside marriage</text><text x="48" y="503" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">feminists: divorce partly a response to it</text><path d="M554,485 C630,485 620,319 662,313" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><rect x="670" y="253" width="200" height="120" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="770" y="307" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="middle">More</text><text x="770" y="337" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="middle">divorce</text><rect x="30" y="542" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="578" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Recent figures (ONS)</text><text x="56" y="607" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">80,057 divorces in England and Wales in 2022, the lowest since 1971. In 2019, 62% of</text><text x="56" y="629" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">opposite-sex divorces were petitioned by wives.</text>
</svg>