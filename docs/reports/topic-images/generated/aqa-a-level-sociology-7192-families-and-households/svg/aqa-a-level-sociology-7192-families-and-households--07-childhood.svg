<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 599" width="900" height="599" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="599" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Childhood since 1900</text>

<line x1="50" y1="146" x2="850" y2="146" stroke="#1e2a44" stroke-width="4"/><circle cx="90" cy="146" r="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="90" y="124" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">1944</text><text x="90" y="186" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Education Act: free</text><text x="90" y="207" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">secondary education for all</text><circle cx="450" cy="146" r="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="124" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">1972</text><text x="450" y="186" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">School leaving age raised</text><text x="450" y="207" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">to 16</text><circle cx="810" cy="146" r="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="810" y="124" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">1989</text><text x="810" y="186" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Children Act; UN Convention</text><text x="810" y="207" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">on the Rights of the Child</text><text x="450" y="246" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="middle" font-style="italic">Laws separated children from adults (Pilcher: the "separateness" of childhood)</text><rect x="30" y="270" width="412" height="176" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,320 L31.25,284.25 Q31.25,271.25 44.25,271.25 L427.75,271.25 Q440.75,271.25 440.75,284.25 L440.75,320 Z" fill="#f2e7b8"/><line x1="31.25" y1="320" x2="440.75" y2="320" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="300.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Childhood is disappearing</text><circle cx="49" cy="345.92" r="4.5" fill="#2e6b62"/><text x="62" y="351.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Postman (1982):</tspan> television removed the</text><text x="62" y="372.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">"information hierarchy"</text><circle cx="49" cy="395.92" r="4.5" fill="#2e6b62"/><text x="62" y="401.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Palmer (2006):</tspan> "toxic childhood" from</text><text x="62" y="422.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">technology and consumerism</text><rect x="458" y="270" width="412" height="176" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,320 L459.25,284.25 Q459.25,271.25 472.25,271.25 L855.75,271.25 Q868.75,271.25 868.75,284.25 L868.75,320 Z" fill="#b5d3cf"/><line x1="459.25" y1="320" x2="868.75" y2="320" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="300.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Childhood persists</text><circle cx="477" cy="345.92" r="4.5" fill="#2e6b62"/><text x="490" y="351.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Opie (1993):</tspan> a lively children’s culture of</text><text x="490" y="372.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">games and rhymes</text><circle cx="477" cy="395.92" r="4.5" fill="#2e6b62"/><text x="490" y="401.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Laws on schooling and protection have</text><text x="490" y="422.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">legally extended childhood</text><rect x="30" y="462" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="498" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">March of progress or control?</text><text x="56" y="527" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Children are better cared for than ever, or (Gittins; Firestone) "protection" is also</text><text x="56" y="549" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">control, and childhood varies by gender, class and ethnicity.</text>
</svg>