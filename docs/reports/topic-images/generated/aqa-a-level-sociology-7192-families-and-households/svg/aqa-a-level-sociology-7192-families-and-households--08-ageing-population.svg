<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 758" width="900" height="758" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="758" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why the population is ageing</text>

<rect x="30" y="104" width="380" height="213" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,154 L31.25,118.25 Q31.25,105.25 44.25,105.25 L395.75,105.25 Q408.75,105.25 408.75,118.25 L408.75,154 Z" fill="#b5d3cf"/><line x1="31.25" y1="154" x2="408.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="220" y="134.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Fewer births</text><circle cx="49" cy="179.92" r="4.5" fill="#2e6b62"/><text x="62" y="185.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Women’s education, careers,</text><text x="62" y="206.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">contraception</text><circle cx="49" cy="229.92" r="4.5" fill="#2e6b62"/><text x="62" y="235.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Lower infant mortality</text><circle cx="49" cy="258.92" r="4.5" fill="#2e6b62"/><text x="62" y="264.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Children an economic cost</text><circle cx="49" cy="287.92" r="4.5" fill="#2e6b62"/><text x="62" y="293.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Child-centredness</text><rect x="490" y="104" width="380" height="213" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M491.25,154 L491.25,118.25 Q491.25,105.25 504.25,105.25 L855.75,105.25 Q868.75,105.25 868.75,118.25 L868.75,154 Z" fill="#b5d3cf"/><line x1="491.25" y1="154" x2="868.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="680" y="134.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Longer lives</text><circle cx="509" cy="179.92" r="4.5" fill="#2e6b62"/><text x="522" y="185.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Better nutrition (McKeown, 1976)</text><circle cx="509" cy="208.92" r="4.5" fill="#2e6b62"/><text x="522" y="214.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Public health and housing</text><circle cx="509" cy="237.92" r="4.5" fill="#2e6b62"/><text x="522" y="243.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The NHS (1948)</text><line x1="235" y1="323" x2="390" y2="367" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="665" y1="323" x2="510" y2="367" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="250" y="373" width="400" height="56" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="409" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">An ageing population</text><line x1="350" y1="433" x2="164.66666666666666" y2="473" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="450" y1="433" x2="450" y2="473" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="550" y1="433" x2="735.3333333333333" y2="473" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="479" width="269.3333333333333" height="126" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,529 L31.25,493.25 Q31.25,480.25 44.25,480.25 L285.0833333333333,480.25 Q298.0833333333333,480.25 298.0833333333333,493.25 L298.0833333333333,529 Z" fill="#f2e7b8"/><line x1="31.25" y1="529" x2="298.0833333333333" y2="529" stroke="#c9d6d4" stroke-width="2"/><text x="164.66666666666666" y="509.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Households</text><text x="44" y="560.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">More one-person pensioner</text><text x="44" y="581.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">households.</text><rect x="315.3333333333333" y="479" width="269.3333333333333" height="126" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M316.5833333333333,529 L316.5833333333333,493.25 Q316.5833333333333,480.25 329.5833333333333,480.25 L570.4166666666666,480.25 Q583.4166666666666,480.25 583.4166666666666,493.25 L583.4166666666666,529 Z" fill="#f2e7b8"/><line x1="316.5833333333333" y1="529" x2="583.4166666666666" y2="529" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="509.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Care</text><text x="329.3333333333333" y="560.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">More care by relatives,</text><text x="329.3333333333333" y="581.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">often women.</text><rect x="600.6666666666666" y="479" width="269.3333333333333" height="126" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.9166666666666,529 L601.9166666666666,493.25 Q601.9166666666666,480.25 614.9166666666666,480.25 L855.75,480.25 Q868.75,480.25 868.75,493.25 L868.75,529 Z" fill="#f2e7b8"/><line x1="601.9166666666666" y1="529" x2="868.75" y2="529" stroke="#c9d6d4" stroke-width="2"/><text x="735.3333333333333" y="509.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Dependency ratio</text><text x="614.6666666666666" y="560.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">More dependants per</text><text x="614.6666666666666" y="581.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">working-age person.</text><rect x="30" y="621" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="657" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Evaluation</text><text x="56" y="686" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Phillipson: older people are marginalised under capitalism. Yet many older people also</text><text x="56" y="708" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">give care, such as grandparents doing childcare.</text>
</svg>