<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 774" width="900" height="774" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="774" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A storage and its flows: Lake Varn</text>

<rect x="30" y="110" width="840" height="500" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="300" y="280" width="300" height="150" rx="16" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="450" y="340" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Lake Varn</text><text x="450" y="368" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="middle">storage</text><text x="450" y="398" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">1200 million m³</text><path d="M60.0,350.2 L259.6,350.2 L259.6,368.4 L296.0,330.0 L259.6,291.6 L259.6,309.8 L60.0,309.8 Z" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><text x="70" y="290" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">River inflow 310</text><path d="M354.5,170.0 L354.5,260.0 L348.0,260.0 L360.0,276.0 L372.0,260.0 L365.5,260.0 L365.5,170.0 Z" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><text x="345" y="160" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Rain 45</text><path d="M111.3,474.2 L282.1,419.1 L284.5,426.3 L296.0,410.0 L277.1,403.5 L279.4,410.7 L108.7,465.8 Z" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><text x="60" y="500" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Groundwater seepage 25</text><path d="M604.0,349.1 L805.6,349.1 L805.6,366.3 L840.0,330.0 L805.6,293.7 L805.6,310.9 L604.0,310.9 Z" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><text x="830" y="290" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">River outflow 290</text><path d="M536.9,276.0 L536.9,166.0 L543.1,166.0 L530.0,150.0 L516.9,166.0 L523.1,166.0 L523.1,276.0 Z" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5" stroke-linejoin="round"/><text x="552" y="175" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">Evaporation 70</text><text x="552" y="197" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">transformation:</text><text x="552" y="215" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">liquid to gas</text><path d="M602.3,414.6 L773.3,479.0 L770.8,485.6 L790.0,480.0 L779.3,463.1 L776.8,469.7 L605.7,405.4 Z" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><text x="840" y="515" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Abstraction for a town 35</text><text x="450" y="590" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Flows in million m³ per year; arrow width shows flow size</text><rect x="30" y="630" width="410" height="124" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="55" y="668" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Inputs = 310 + 45 + 25 = 380</text><text x="55" y="698" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Outputs = 290 + 70 + 35 = 395</text><text x="55" y="728" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Net change = 380 − 395 = −15 per year</text><text x="55" y="760" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start"></text><rect x="460" y="630" width="410" height="124" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="485" y="668" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">After 10 years: 1200 − 10 × 15 = 1050</text><text x="485" y="698" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Loss: 15 / 1200 × 100 = 1.25% a year</text><text x="485" y="728" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Not in steady state: the lake shrinks</text>
</svg>