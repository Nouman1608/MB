<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 670" width="900" height="670" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="670" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Ecological footprint versus biocapacity</text>

<rect x="30" y="110" width="840" height="540" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="148" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Country P (fictional), gha per person</text><line x1="140" y1="525" x2="560" y2="525" stroke="#c9d6d4" stroke-width="1.5"/><text x="128" y="531" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">0</text><line x1="140" y1="460" x2="560" y2="460" stroke="#c9d6d4" stroke-width="1.5"/><text x="128" y="466" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">1</text><line x1="140" y1="395" x2="560" y2="395" stroke="#c9d6d4" stroke-width="1.5"/><text x="128" y="401" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">2</text><line x1="140" y1="330" x2="560" y2="330" stroke="#c9d6d4" stroke-width="1.5"/><text x="128" y="336" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">3</text><line x1="140" y1="265" x2="560" y2="265" stroke="#c9d6d4" stroke-width="1.5"/><text x="128" y="271" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">4</text><line x1="140" y1="200" x2="560" y2="200" stroke="#c9d6d4" stroke-width="1.5"/><text x="128" y="206" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">5</text><rect x="190" y="213" width="130" height="312" fill="#b5602e" opacity="0.85" stroke="#1e2a44" stroke-width="2"/><text x="255" y="203" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">4.8</text><rect x="390" y="395" width="130" height="130" fill="#6f9a52" stroke="#1e2a44" stroke-width="2"/><text x="455" y="385" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">2.0</text><line x1="140" y1="525" x2="560" y2="525" stroke="#1e2a44" stroke-width="3"/><text x="255" y="553" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Ecological</text><text x="255" y="575" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">footprint</text><text x="455" y="553" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Biocapacity</text><line x1="390" y1="213" x2="530" y2="213" stroke="#b5602e" stroke-width="2" stroke-dasharray="6 5"/><line x1="540" y1="213" x2="540" y2="395" stroke="#b5602e" stroke-width="3"/><line x1="532" y1="213" x2="548" y2="213" stroke="#b5602e" stroke-width="3"/><line x1="532" y1="395" x2="548" y2="395" stroke="#b5602e" stroke-width="3"/><text x="553" y="300" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">deficit</text><text x="553" y="320" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">2.8</text><rect x="620" y="170" width="230" height="120" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="735" y="210" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">EF / biocapacity</text><text x="735" y="246" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">4.8 / 2.0 = 2.4</text><text x="735" y="274" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">times its own supply</text><rect x="620" y="310" width="230" height="120" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="735" y="350" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Total deficit</text><text x="735" y="386" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">2.8 × 12 million</text><text x="735" y="414" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">= 33.6 million gha</text><text x="620" y="480" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">EF &gt; biocapacity: deficit</text><text x="620" y="504" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">EF &lt; biocapacity: reserve</text><text x="620" y="545" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Relies on imports or runs</text><text x="620" y="565" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">down its own capital.</text>
</svg>