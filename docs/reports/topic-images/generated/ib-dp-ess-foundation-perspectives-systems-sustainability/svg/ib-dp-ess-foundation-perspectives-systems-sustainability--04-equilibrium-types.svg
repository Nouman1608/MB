<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" width="900" height="760" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="760" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Types of equilibrium</text>

<rect x="30" y="110" width="410" height="240" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="146" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Steady-state</text><line x1="70" y1="300" x2="415" y2="300" stroke="#1e2a44" stroke-width="2.5"/><line x1="70" y1="300" x2="70" y2="170" stroke="#1e2a44" stroke-width="2.5"/><text x="415" y="322" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">time →</text><line x1="70" y1="240" x2="410" y2="240" stroke="#4a5568" stroke-width="1.5" stroke-dasharray="6 5"/><path d="M70,240 L70,248.4 L90,222 L110,254 L130,229.2 L150,254 L170,222 L190,248.4 L210,222 L230,254 L250,229.2 L270,254 L290,222 L310,248.4 L330,222 L350,254 L370,229.2 L390,254 " fill="none" stroke="#2e6b62" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><text x="54" y="338" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start"></text><text x="200" y="322" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">fluctuates around an average</text><rect x="460" y="110" width="410" height="240" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="484" y="146" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Static</text><line x1="500" y1="300" x2="845" y2="300" stroke="#1e2a44" stroke-width="2.5"/><line x1="500" y1="300" x2="500" y2="170" stroke="#1e2a44" stroke-width="2.5"/><text x="845" y="322" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">time →</text><path d="M500,240 L840,240" fill="none" stroke="#2e6b62" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><text x="484" y="338" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start"></text><text x="630" y="322" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">no change: non-living systems</text><rect x="30" y="370" width="410" height="240" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="406" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Stable</text><line x1="70" y1="560" x2="415" y2="560" stroke="#1e2a44" stroke-width="2.5"/><line x1="70" y1="560" x2="70" y2="430" stroke="#1e2a44" stroke-width="2.5"/><text x="415" y="582" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">time →</text><line x1="176" y1="432" x2="176" y2="470" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><text x="176" y="425" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">disturbance</text><path d="M70,480 L170,480 L180,530 C220,530 240,485 300,480 L410,480" fill="none" stroke="#2e6b62" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><text x="54" y="598" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start"></text><text x="200" y="582" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">returns to its old state</text><rect x="460" y="370" width="410" height="240" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="484" y="406" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Unstable</text><line x1="500" y1="560" x2="845" y2="560" stroke="#1e2a44" stroke-width="2.5"/><line x1="500" y1="560" x2="500" y2="430" stroke="#1e2a44" stroke-width="2.5"/><text x="845" y="582" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">time →</text><line x1="606" y1="452" x2="606" y2="490" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><text x="606" y="445" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">disturbance</text><text x="780" y="420" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">new state</text><path d="M500,500 L600,500 L610,530 C650,530 680,440 720,432 L840,432" fill="none" stroke="#2e6b62" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><text x="484" y="598" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start"></text><text x="630" y="582" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">moves to a new state</text><rect x="30" y="630" width="840" height="110" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="60" y="668" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Tipping point:</text><text x="205" y="668" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">a threshold past which a small change causes a large,</text><text x="60" y="696" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">long-lasting shift to a new state, usually driven by positive feedback.</text><text x="60" y="722" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Resilience (absorbing disturbance) rises with diversity and large storages.</text>
</svg>