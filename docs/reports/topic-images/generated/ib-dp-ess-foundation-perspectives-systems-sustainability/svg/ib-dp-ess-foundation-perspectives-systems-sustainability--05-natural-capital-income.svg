<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 610" width="900" height="610" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="610" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Natural capital and natural income</text>

<rect x="30" y="110" width="840" height="380" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="320" y="160" width="260" height="210" rx="14" fill="#cfe0c0" stroke="#1e2a44" stroke-width="3"/><rect x="366" y="280" width="8" height="26" fill="#9c8f6e"/><circle cx="370" cy="270" r="18" fill="#6f9a52" stroke="#1e2a44" stroke-width="2"/><rect x="416" y="250" width="8" height="26" fill="#9c8f6e"/><circle cx="420" cy="240" r="18" fill="#6f9a52" stroke="#1e2a44" stroke-width="2"/><rect x="466" y="290" width="8" height="26" fill="#9c8f6e"/><circle cx="470" cy="280" r="18" fill="#6f9a52" stroke="#1e2a44" stroke-width="2"/><rect x="516" y="255" width="8" height="26" fill="#9c8f6e"/><circle cx="520" cy="245" r="18" fill="#6f9a52" stroke="#1e2a44" stroke-width="2"/><rect x="396" y="330" width="8" height="26" fill="#9c8f6e"/><circle cx="400" cy="320" r="18" fill="#6f9a52" stroke="#1e2a44" stroke-width="2"/><rect x="496" y="335" width="8" height="26" fill="#9c8f6e"/><circle cx="500" cy="325" r="18" fill="#6f9a52" stroke="#1e2a44" stroke-width="2"/><text x="450" y="195" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Natural capital</text><text x="450" y="220" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">stock: 48 000 m³ timber</text><path d="M70.0,282.0 L285.4,282.0 L285.4,297.3 L316.0,265.0 L285.4,232.7 L285.4,248.0 L70.0,248.0 Z" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5" stroke-linejoin="round"/><text x="80" y="230" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Natural income</text><text x="80" y="318" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">growth 3.5% of stock</text><text x="80" y="340" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">48 000 × 0.035 = 1680 m³/yr</text><path d="M584.0,286.5 L801.3,286.5 L801.3,305.9 L840.0,265.0 L801.3,224.2 L801.3,243.5 L584.0,243.5 Z" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5" stroke-linejoin="round"/><text x="600" y="230" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">Harvest</text><text x="600" y="318" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">2100 m³/yr</text><text x="600" y="340" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">= 125% of income</text><text x="450" y="420" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Stock after 1 year = 48 000 + 1680 − 2100 = 47 580 m³</text><text x="450" y="450" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Harvest − income = 420 m³ a year taken from the capital</text><rect x="30" y="510" width="840" height="80" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="546" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Not sustainable: the harvest eats into the capital.</text><text x="450" y="572" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Largest sustainable harvest this year = natural income = 1680 m³</text>
</svg>