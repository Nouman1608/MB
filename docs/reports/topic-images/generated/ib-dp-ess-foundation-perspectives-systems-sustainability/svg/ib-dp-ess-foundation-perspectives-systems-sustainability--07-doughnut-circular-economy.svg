<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 670" width="900" height="670" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="670" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Two models for living within limits</text>

<rect x="30" y="110" width="450" height="540" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="255" y="148" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Doughnut economics</text><circle cx="255" cy="395" r="172" fill="#a9c48f" stroke="#b5602e" stroke-width="7"/><circle cx="255" cy="395" r="92" fill="#ffffff" stroke="#2e6b62" stroke-width="7"/><text x="255" y="265" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">safe and just</text><text x="255" y="287" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">space</text><text x="255" y="389" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">social</text><text x="255" y="409" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">foundation</text><text x="255" y="429" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="middle">(inner ring)</text><text x="255" y="211" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">ecological ceiling (outer ring)</text><text x="60" y="600" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Inner ring: food, water, health, education.</text><text x="60" y="620" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Outer ring: based on planetary boundaries.</text><rect x="500" y="110" width="370" height="540" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="685" y="148" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Linear vs circular</text><rect x="525" y="175" width="95" height="50" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="572.5" y="205.61" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Take</text><rect x="637" y="175" width="95" height="50" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="684.5" y="205.61" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Make</text><rect x="749" y="175" width="100" height="50" rx="12" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="799" y="195.85000000000002" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Throw</text><text x="799" y="214.05" font-size="14" font-weight="400" fill="#4a5568" text-anchor="middle">away</text><line x1="621" y1="200" x2="634" y2="200" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="733" y1="200" x2="746" y2="200" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="685" y="254" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">linear model</text><path d="M754.0,361.7 A112,112 0 0 1 795.9,434.4" fill="none" stroke="#2e6b62" stroke-width="5" stroke-linecap="round" marker-end="url(#ahT)"/><path d="M727.0,553.8 A112,112 0 0 1 643.0,553.8" fill="none" stroke="#2e6b62" stroke-width="5" stroke-linecap="round" marker-end="url(#ahT)"/><path d="M574.1,434.4 A112,112 0 0 1 616.0,361.7" fill="none" stroke="#2e6b62" stroke-width="5" stroke-linecap="round" marker-end="url(#ahT)"/><rect x="607" y="309" width="156" height="58" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="685" y="334.51" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Design out</text><text x="685" y="353.27" font-size="14" font-weight="400" fill="#4a5568" text-anchor="middle">waste</text><rect x="703.9948452238572" y="477" width="156" height="58" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="781.9948452238572" y="502.51" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Keep in use</text><text x="781.9948452238572" y="521.27" font-size="14" font-weight="400" fill="#4a5568" text-anchor="middle">products, materials</text><rect x="510.00515477614283" y="477" width="156" height="58" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="588.0051547761428" y="502.51" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Regenerate</text><text x="588.0051547761428" y="521.27" font-size="14" font-weight="400" fill="#4a5568" text-anchor="middle">natural systems</text><text x="685" y="456" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">circular</text>
</svg>