<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 810" width="900" height="810" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="810" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Environmental value systems</text>

<rect x="30" y="110" width="840" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="148" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">An environmental value system works like a system</text><rect x="55" y="170" width="250" height="170" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="180" y="222.60000000000002" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Inputs</text><text x="180" y="243.20000000000002" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">upbringing, culture,</text><text x="180" y="262.70000000000005" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">religion, education,</text><text x="180" y="282.20000000000005" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">media, economic position,</text><text x="180" y="301.70000000000005" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">personal experience</text><rect x="345" y="205" width="210" height="100" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="251.20000000000002" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Processing</text><text x="450" y="272.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">values and beliefs</text><rect x="595" y="170" width="250" height="170" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="720" y="222.60000000000002" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Outputs</text><text x="720" y="243.20000000000002" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">decisions, votes,</text><text x="720" y="262.70000000000005" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">purchases, lifestyle,</text><text x="720" y="282.20000000000005" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">how they argue</text><text x="720" y="301.70000000000005" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">about an issue</text><line x1="307" y1="255" x2="341" y2="255" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><line x1="557" y1="255" x2="591" y2="255" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="30" y="380" width="840" height="410" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="418" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">The EVS spectrum</text><rect x="60" y="440" width="260" height="80" fill="#a9c48f" stroke="#1e2a44" stroke-width="2.5"/><text x="190" y="474" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Ecocentric</text><text x="190" y="500" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">nature-centred</text><rect x="320" y="440" width="260" height="80" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="474" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Anthropocentric</text><text x="450" y="500" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">people-centred</text><rect x="580" y="440" width="260" height="80" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="710" y="474" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Technocentric</text><text x="710" y="500" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">technology-centred</text><text x="70" y="548" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Deep ecologists: nature</text><text x="70" y="567" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">ahead of people</text><text x="70" y="586" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Soft ecologists: small,</text><text x="70" y="605" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">local, self-reliant</text><text x="330" y="548" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Environmental managers:</text><text x="330" y="567" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">limits, regulation and</text><text x="330" y="586" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">taxes protect resources</text><text x="330" y="605" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">for people</text><text x="590" y="548" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Cornucopians: technology</text><text x="590" y="567" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">will always find more;</text><text x="590" y="586" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">resources effectively</text><text x="590" y="605" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">unlimited</text><line x1="60" y1="670" x2="840" y2="670" stroke="#c9d6d4" stroke-width="3"/><circle cx="190" cy="670" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="190" y="702" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Local group</text><text x="190" y="733.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">“The meadow has orchids</text><text x="190" y="752.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">found nowhere else.”</text><circle cx="450" cy="670" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="702" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Farmer</text><text x="450" y="733.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">“I will lease it if the</text><text x="450" y="752.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">rent beats hay.”</text><circle cx="710" cy="670" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="710" y="702" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Engineer</text><text x="710" y="733.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">“Panels on raised frames</text><text x="710" y="752.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">let sheep graze.”</text><text x="450" y="642" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">Solar-farm scenario: each label is justified by the words used</text>
</svg>