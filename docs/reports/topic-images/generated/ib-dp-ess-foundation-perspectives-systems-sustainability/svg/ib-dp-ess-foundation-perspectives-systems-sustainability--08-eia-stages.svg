<rect width="900" height="600" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Environmental impact assessment</text>

<rect x="30" y="120" width="260" height="130" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><circle cx="70" cy="165" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="70" y="172.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="106" y="173" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Baseline study</text><text x="54" y="216" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">of the site before work</text><line x1="292" y1="185" x2="318" y2="185" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="320" y="120" width="260" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="360" cy="165" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="360" y="172.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="396" y="173" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Prediction</text><text x="344" y="216" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">of likely impacts</text><line x1="582" y1="185" x2="608" y2="185" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="610" y="120" width="260" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="650" cy="165" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="650" y="172.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="686" y="173" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Mitigation</text><text x="634" y="216" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">measures to reduce them</text><rect x="30" y="290" width="260" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="70" cy="335" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="70" y="342.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="106" y="343" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Report</text><text x="54" y="386" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">with a non-technical summary</text><line x1="292" y1="355" x2="318" y2="355" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="320" y="290" width="260" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="360" cy="335" r="22" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="360" y="342.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="396" y="343" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Decision</text><text x="344" y="386" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">approve or refuse</text><line x1="582" y1="355" x2="608" y2="355" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="610" y="290" width="260" height="130" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><circle cx="650" cy="335" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="650" y="342.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">6</text><text x="686" y="343" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Monitoring</text><text x="634" y="386" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">after the project starts</text><path d="M800,252 L800,270 L160,270 L160,284" fill="none" stroke="#1e2a44" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><rect x="30" y="470" width="840" height="110" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="60" y="506" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Limits of EIA</text><text x="60" y="534" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Predictions are uncertain; baseline data may be short-term;</text><text x="60" y="558" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">the decision may still favour economic gain.</text>
</svg>