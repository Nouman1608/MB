<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 570" width="900" height="570" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="570" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Nine functions of the wholesaler</text>

<rect x="30" y="110" width="270" height="135" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="62" cy="146" r="17" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="152.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="90" y="153" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Breaking bulk</text><text x="50" y="198" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">pallets split into cases</text><rect x="315" y="110" width="270" height="135" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="347" cy="146" r="17" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="347" y="152.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="375" y="153" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Warehousing</text><text x="335" y="198" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">stores goods between</text><text x="335" y="219" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">production and sale</text><rect x="600" y="110" width="270" height="135" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="632" cy="146" r="17" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="632" y="152.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="660" y="153" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Bearing risk</text><text x="620" y="198" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">damage, theft, going out of</text><text x="620" y="219" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">date or fashion</text><rect x="30" y="260" width="270" height="135" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="62" cy="296" r="17" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="302.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="90" y="303" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Financing</text><text x="50" y="348" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">pays makers promptly; gives</text><text x="50" y="369" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">retailers credit</text><rect x="315" y="260" width="270" height="135" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="347" cy="296" r="17" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="347" y="302.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="375" y="303" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Transport</text><text x="335" y="348" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">delivers several shops’</text><text x="335" y="369" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">orders on one route</text><rect x="600" y="260" width="270" height="135" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="632" cy="296" r="17" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="632" y="302.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">6</text><text x="660" y="303" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Providing a range</text><text x="620" y="348" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">many makers’ goods in one</text><text x="620" y="369" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">visit or order</text><rect x="30" y="410" width="270" height="135" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="62" cy="446" r="17" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="452.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">7</text><text x="90" y="453" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Information and advice</text><text x="50" y="498" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">what sells, to makers; new</text><text x="50" y="519" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">lines, to shops</text><rect x="315" y="410" width="270" height="135" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="347" cy="446" r="17" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="347" y="452.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">8</text><text x="375" y="453" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Preparing goods</text><text x="335" y="498" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">grade, pack, label,</text><text x="335" y="519" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">price-mark, own brand</text><rect x="600" y="410" width="270" height="135" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="632" cy="446" r="17" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="632" y="452.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">9</text><text x="660" y="453" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Steady supplies and</text><text x="660" y="475" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">prices</text><text x="620" y="498" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">store when plentiful,</text><text x="620" y="519" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">release when short</text>
</svg>