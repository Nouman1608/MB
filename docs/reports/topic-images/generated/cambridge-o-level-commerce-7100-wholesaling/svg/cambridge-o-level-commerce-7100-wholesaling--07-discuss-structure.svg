<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="500" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Is the wholesaler still needed?</text>

<rect x="30" y="110" width="410" height="200" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="235" y="146" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle">Still needed</text><circle cx="66" cy="180.05" r="12" fill="#2e6b62"/><path d="M60.6,180.29000000000002 L64.8,184.61 L72,175.85000000000002" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="86" y="186" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Breaks bulk: small shops cannot buy</text><text x="86" y="208" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">by the pallet</text><circle cx="66" cy="242.05" r="12" fill="#2e6b62"/><path d="M60.6,242.29000000000002 L64.8,246.61 L72,237.85000000000002" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="86" y="248" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Credit and delivery help cash flow</text><rect x="460" y="110" width="410" height="200" rx="12" fill="#f3d9c8" stroke="#b5602e" stroke-width="2.5"/><text x="665" y="146" font-size="20" font-weight="700" fill="#b5602e" text-anchor="middle">Less needed</text><circle cx="496" cy="180.05" r="12" fill="#b5602e"/><path d="M491.44,175.49 L500.56,184.61 M500.56,175.49 L491.44,184.61" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="516" y="186" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Some shops order direct from</text><text x="516" y="208" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">manufacturers’ websites</text><circle cx="496" cy="242.05" r="12" fill="#b5602e"/><path d="M491.44,237.49 L500.56,246.61 M500.56,237.49 L491.44,246.61" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="516" y="248" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Large online platforms deliver small</text><text x="516" y="270" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">quantities too</text><line x1="235" y1="316" x2="400" y2="356" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="665" y1="316" x2="500" y2="356" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="130" y="362" width="640" height="110" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="3"/><text x="450" y="398" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="middle">Judgement</text><text x="450" y="430" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Still needed, especially through cash and carry and voluntary</text><text x="450" y="452" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">chains, which let small retailers compete with large chains.</text>
</svg>