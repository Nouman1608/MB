<rect width="900" height="565" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">50 cases of soft drinks: delivered or collected?</text>

<rect x="30" y="110" width="410" height="300" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="30" y="110" width="410" height="52" rx="14" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2.5"/><text x="235" y="144" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Delivered wholesaler</text><text x="52" y="202" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">50 cases × $12.00</text><text x="418" y="202" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="end">600</text><text x="52" y="242" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Delivery</text><text x="418" y="242" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="end">free</text><line x1="52" y1="290" x2="418" y2="290" stroke="#c9d6d4" stroke-width="1.5"/><text x="52" y="324" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Total</text><text x="418" y="324" font-size="22" font-weight="700" fill="#2e6b62" text-anchor="end">$600</text><rect x="52" y="346" width="366" height="46" rx="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="235" y="374.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">30 days’ credit</text><rect x="460" y="110" width="410" height="300" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="460" y="110" width="410" height="52" rx="14" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2.5"/><text x="665" y="144" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Cash and carry</text><text x="482" y="202" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">50 cases × $11.20</text><text x="848" y="202" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="end">560</text><text x="482" y="242" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Own transport</text><text x="848" y="242" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="end">+ 25</text><line x1="482" y1="290" x2="848" y2="290" stroke="#c9d6d4" stroke-width="1.5"/><text x="482" y="324" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Total</text><text x="848" y="324" font-size="22" font-weight="700" fill="#8a6d0d" text-anchor="end">$585</text><rect x="482" y="346" width="366" height="46" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="665" y="374.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Pay at once; a morning travelling</text><rect x="30" y="430" width="840" height="110" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="468" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Cash and carry saves 600 − 585 = $15</text><text x="450" y="506" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">A shop short of cash might still prefer the delivered wholesaler’s credit.</text>
