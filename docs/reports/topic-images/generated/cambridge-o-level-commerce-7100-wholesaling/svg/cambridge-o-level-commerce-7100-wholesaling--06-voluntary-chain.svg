<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="620" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How a voluntary chain works</text>

<rect x="345" y="115" width="210" height="64" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="154" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Wholesaler</text><path d="M450,183 C450,215 140,205 140,236" fill="none" stroke="#2e6b62" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ahT)"/><rect x="60" y="240" width="160" height="50" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="140" y="270.25" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Independent shop</text><path d="M450,183 C450,215 345,205 345,236" fill="none" stroke="#2e6b62" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ahT)"/><rect x="265" y="240" width="160" height="50" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="345" y="270.25" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Independent shop</text><path d="M450,183 C450,215 550,205 550,236" fill="none" stroke="#2e6b62" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ahT)"/><rect x="470" y="240" width="160" height="50" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="550" y="270.25" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Independent shop</text><path d="M450,183 C450,215 755,205 755,236" fill="none" stroke="#2e6b62" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ahT)"/><rect x="675" y="240" width="160" height="50" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="755" y="270.25" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Independent shop</text><rect x="60" y="300" width="775" height="44" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="448" y="328" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="middle">Common name and logo · joint advertising · help with layout and training</text><text x="450" y="372" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Each shop is still independently owned.</text><rect x="30" y="395" width="270" height="200" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="430" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Retailers gain</text><circle cx="62" cy="464.4" r="12" fill="#2e6b62"/><path d="M56.6,464.64 L60.8,468.96 L68,460.2" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="82" y="470" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Lower prices from</text><text x="82" y="491" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">combined buying</text><circle cx="62" cy="518.4" r="12" fill="#2e6b62"/><path d="M56.6,518.64 L60.8,522.9599999999999 L68,514.1999999999999" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="82" y="524" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A recognised name</text><circle cx="62" cy="551.4" r="12" fill="#2e6b62"/><path d="M56.6,551.64 L60.8,555.9599999999999 L68,547.1999999999999" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="82" y="557" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Professional advertising</text><rect x="315" y="395" width="270" height="200" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="335" y="430" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Wholesaler gains</text><circle cx="347" cy="464.4" r="12" fill="#2e6b62"/><path d="M341.6,464.64 L345.8,468.96 L353,460.2" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="367" y="470" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Guaranteed, regular</text><text x="367" y="491" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">orders</text><circle cx="347" cy="518.4" r="12" fill="#2e6b62"/><path d="M341.6,518.64 L345.8,522.9599999999999 L353,514.1999999999999" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="367" y="524" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Can plan stock and</text><text x="367" y="545" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">compete with chains’</text><text x="367" y="566" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">direct buying</text><rect x="600" y="395" width="270" height="200" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="620" y="430" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">Retailers lose</text><circle cx="632" cy="464.4" r="12" fill="#b5602e"/><path d="M627.44,459.84 L636.56,468.96 M636.56,459.84 L627.44,468.96" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="652" y="470" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Less freedom over what</text><text x="652" y="491" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">to stock</text><circle cx="632" cy="518.4" r="12" fill="#b5602e"/><path d="M627.44,513.84 L636.56,522.9599999999999 M636.56,513.84 L627.44,522.9599999999999" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="652" y="524" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A fee or minimum</text><text x="652" y="545" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">purchase may apply</text>
</svg>