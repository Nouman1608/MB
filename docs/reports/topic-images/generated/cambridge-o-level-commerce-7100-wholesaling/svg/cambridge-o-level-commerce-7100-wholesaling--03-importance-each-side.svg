<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 690" width="900" height="690" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="690" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why the wholesaler matters to each side</text>

<rect x="355" y="290" width="190" height="80" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="337.35" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Wholesaler</text><rect x="30" y="110" width="310" height="520" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="185" y="146" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle">To the manufacturer</text><rect x="44" y="166" width="282" height="66" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="58" y="194" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Large orders: long runs, lower</text><text x="58" y="215" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">unit costs</text><rect x="44" y="242" width="282" height="66" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="58" y="281" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Saves storage space and costs</text><rect x="44" y="318" width="282" height="66" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="58" y="346" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Risk of goods not selling</text><text x="58" y="367" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">removed</text><rect x="44" y="394" width="282" height="66" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="58" y="422" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Paid promptly: better cash</text><text x="58" y="443" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">flow</text><rect x="44" y="470" width="282" height="66" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="58" y="509" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Reaches thousands of retailers</text><rect x="44" y="546" width="282" height="66" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="58" y="574" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Market information from</text><text x="58" y="595" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">retailers</text><rect x="560" y="110" width="310" height="520" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="715" y="146" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="middle">To the retailer</text><rect x="574" y="166" width="282" height="66" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="588" y="194" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Small quantities: less capital</text><text x="588" y="215" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">tied up</text><rect x="574" y="242" width="282" height="66" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="588" y="281" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Saves storage: restock quickly</text><rect x="574" y="318" width="282" height="66" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="588" y="346" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Many makers’ goods in one</text><text x="588" y="367" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">place</text><rect x="574" y="394" width="282" height="66" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="588" y="433" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">May get credit and delivery</text><rect x="574" y="470" width="282" height="66" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="588" y="498" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Advice on new products and</text><text x="588" y="519" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">displays</text><rect x="574" y="546" width="282" height="66" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="588" y="585" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Steadier prices for customers</text><line x1="350" y1="330" x2="344" y2="330" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="550" y1="330" x2="556" y2="330" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="450" y="665" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">Answer for the side the question names.</text>
</svg>