<!-- place after: ## Strategy: match the evidence to the argument, the audience and the purpose -->
<figure class="topic-figure">
  <img src="https://img.marlbridge.com/ap-english-language-2-4-choosing-evidence-study-guide--02-matching-evidence.webp" width="900" height="577" alt="Four audiences matched to evidence: a sceptical budget committee gets a costed comparison, neighbours at a meeting get a named local resident’s story, specialist readers get a controlled study and a named authority, and young readers get a vivid analogy. The writer weighs the claim, the audience, credibility and the purpose." loading="lazy">
  <figcaption>The same claim calls for different evidence for different audiences and purposes.</figcaption>
</figure>

<!-- place after: ## Credibility of the source -->
<figure class="topic-figure">
  <img src="https://img.marlbridge.com/ap-english-language-2-4-choosing-evidence-study-guide--03-source-credibility.webp" width="900" height="430" alt="A named study by a university transport department is set against “I read somewhere that...”. Three questions test any source: is it qualified to speak on this question, independent of those who would gain, and current?" loading="lazy">
  <figcaption>Choose reliable, relevant, recent sources and explain them where needed.</figcaption>
</figure>

<!-- place after: ## Strategic selection versus cherry-picking -->
<figure class="topic-figure">
  <img src="https://img.marlbridge.com/ap-english-language-2-4-choosing-evidence-study-guide--04-cherry-picking.webp" width="900" height="476" alt="A pool of evidence holds items that support the claim and items that cut the other way. Cherry-picking shows only the supporting items and can mislead; fair selection acknowledges the counter-evidence and explains why it does not change the conclusion, which builds credibility." loading="lazy">
  <figcaption>Fairness about inconvenient evidence makes a writer more credible, not less.</figcaption>
</figure>

<!-- place after: ## A public-domain example: Lincoln's "house divided" (1858) -->
<figure class="topic-figure">
  <img src="https://img.marlbridge.com/ap-english-language-2-4-choosing-evidence-study-guide--05-house-divided-analogy.webp" width="900" height="589" alt="Lincoln’s analogy, “A house divided against itself cannot stand”, comes before his explicit claim that the government cannot endure half slave and half free. The analogy clarifies an abstract problem, associates the claim with the Gospels, and amplifies the stakes with “cannot stand”." loading="lazy">
  <figcaption>A familiar image does several jobs and prepares the audience for the claim.</figcaption>
</figure>

<!-- place after: ## Worked example 1: choosing evidence for an audience and purpose -->
<figure class="topic-figure">
  <img src="https://img.marlbridge.com/ap-english-language-2-4-choosing-evidence-study-guide--06-minibus-evidence-roles.webp" width="900" height="628" alt="For governors who value careful spending, the taxi cost comparison and the usage table are the main proof. A parent’s story works as an illustration placed after the figures, and a photograph of pupils laughing contributes little because it says nothing about need or cost." loading="lazy">
  <figcaption>Lead with the evidence the audience needs; place the rest where it can still help.</figcaption>
</figure>
