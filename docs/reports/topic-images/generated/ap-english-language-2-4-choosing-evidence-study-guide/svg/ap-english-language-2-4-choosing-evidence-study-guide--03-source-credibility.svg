<rect x="30" y="96" width="400" height="90" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="230" y="134.54" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">“A study by the university’s transport</text><text x="230" y="158.29999999999998" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">department found...”</text><rect x="470" y="96" width="400" height="90" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="7 5"/><text x="670" y="146.42000000000002" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">“I read somewhere that...”</text><text x="450" y="148" font-size="18" font-weight="700" fill="#4a5568" text-anchor="middle" xml:space="preserve">vs</text><text x="450" y="226" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Three questions for any source</text><rect x="30" y="246" width="268" height="107.28" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="164" y="280" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Qualified?</text><text x="164" y="308.84999999999997" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">to speak on this question</text><rect x="316" y="246" width="268" height="107.28" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="450" y="280" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Independent?</text><text x="450" y="308.84999999999997" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">of those who would gain</text><text x="450" y="331.28999999999996" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">from the conclusion</text><rect x="602" y="246" width="268" height="107.28" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="736" y="280" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Current?</text><text x="736" y="308.84999999999997" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">recent enough to rely on</text><text x="450" y="387.28" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle" xml:space="preserve">Credibility is not the source’s fame: it is fitness for this question.</text>
