<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 710" width="900" height="710" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="710" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Match the measure to the purpose</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Choosing a measure of non-adherence in an exam scenario</text>
<text x="30" y="138" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">WHAT YOU WANT TO KNOW</text><text x="480" y="138" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">BEST MEASURE</text><rect x="30" y="162" width="380" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="215.1" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Why does the patient miss doses?</text><rect x="480" y="162" width="390" height="113" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="500" y="194" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SUBJECTIVE</text><text x="500" y="221.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Interview</text><text x="500" y="250.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">clinical or semi-structured</text><line x1="418" y1="218.5" x2="472" y2="218.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="297" width="380" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="350.1" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">How many doses are missed?</text><rect x="480" y="297" width="390" height="113" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="500" y="329" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">OBJECTIVE</text><text x="500" y="356.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Electronic dispenser</text><text x="500" y="385.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">records date and time of every opening</text><line x1="418" y1="353.5" x2="472" y2="353.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="432" width="380" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="485.1" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Has the drug really been taken?</text><rect x="480" y="432" width="390" height="113" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="500" y="464" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">BIOLOGICAL</text><text x="500" y="491.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Blood or urine test</text><text x="500" y="520.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">direct evidence the drug is in the body</text><line x1="418" y1="488.5" x2="472" y2="488.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="567" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="601.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Use two measures together</text><text x="450" y="631.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Each checks the validity of the other. Remember: a dispenser opening does <tspan font-weight="700" fill="#1e2a44">not</tspan> prove a dose was</text><text x="450" y="653.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">swallowed.</text>
</svg>