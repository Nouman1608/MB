<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Building the 6-mark "describe" answer</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Describe ways of measuring non-adherence [6]</text>
<rect x="30" y="124" width="270.6666666666667" height="186" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SUBJECTIVE</text><text x="50" y="183.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">2 marks</text><text x="50" y="212.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">(1)</tspan> clinical or semi-structured</text><text x="50" y="233.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">interview</text><text x="50" y="264.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">(1)</tspan> can reveal reasons for</text><text x="50" y="285.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">missed doses</text><rect x="314.6666666666667" y="124" width="270.6666666666667" height="186" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="334.6666666666667" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">OBJECTIVE</text><text x="334.6666666666667" y="183.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">2 marks</text><text x="334.6666666666667" y="212.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">(1)</tspan> pill counting: pills left vs</text><text x="334.6666666666667" y="233.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">pills that should be left</text><text x="334.6666666666667" y="264.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">(1)</tspan> electronic dispenser</text><text x="334.6666666666667" y="285.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">records each opening</text><rect x="599.3333333333334" y="124" width="270.6666666666667" height="186" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="619.3333333333334" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">BIOLOGICAL</text><text x="619.3333333333334" y="183.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">2 marks</text><text x="619.3333333333334" y="212.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">(1)</tspan> test blood or urine for the</text><text x="619.3333333333334" y="233.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">drug or its by-products</text><text x="619.3333333333334" y="264.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">(1)</tspan> directly shows the drug</text><text x="619.3333333333334" y="285.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">was taken recently</text><rect x="30" y="332" width="840" height="60" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="366.4" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">Name each type, give an example, then add one point of detail: <tspan font-weight="700" fill="#1e2a44">3</tspan> <tspan font-weight="700" fill="#1e2a44">types</tspan> <tspan font-weight="700" fill="#1e2a44">×</tspan> <tspan font-weight="700" fill="#1e2a44">2</tspan> <tspan font-weight="700" fill="#1e2a44">marks</tspan> <tspan font-weight="700" fill="#1e2a44">=</tspan> <tspan font-weight="700" fill="#1e2a44">6</tspan></text>
</svg>