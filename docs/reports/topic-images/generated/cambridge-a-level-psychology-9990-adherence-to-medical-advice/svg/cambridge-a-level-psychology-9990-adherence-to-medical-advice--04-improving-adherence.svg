<rect width="900" height="586" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Ways to improve adherence</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Each technique removes a different barrier</text>
<clipPath id="tc124"><rect x="30" y="124" width="840" height="430" rx="14"/></clipPath><g clip-path="url(#tc124)"><rect x="30" y="124" width="199.17525773195877" height="48" fill="#b5d3cf"/><text x="44" y="151.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Technique</text><rect x="229.17525773195877" y="124" width="363.7113402061856" height="48" fill="#b5d3cf"/><text x="243.17525773195877" y="151.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">What it is</text><rect x="592.8865979381444" y="124" width="277.1134020618557" height="48" fill="#b5d3cf"/><text x="606.8865979381444" y="151.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Barrier it tackles</text><rect x="30" y="172" width="199.17525773195877" height="110" fill="#dce9e7"/><text x="44" y="198.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Funhaler (children)</text><rect x="229.17525773195877" y="172" width="363.7113402061856" height="110" fill="#ffffff"/><text x="243.17525773195877" y="198.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Chaney et al. (2004): an inhaler spacer</text><text x="243.17525773195877" y="219.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">designed as a toy for young children with</text><text x="243.17525773195877" y="240.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">asthma; adherence improved compared</text><text x="243.17525773195877" y="261.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">with their usual device</text><rect x="592.8865979381444" y="172" width="277.1134020618557" height="110" fill="#ffffff"/><text x="606.8865979381444" y="198.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Children may dislike the taste or</text><text x="606.8865979381444" y="219.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">feel of treatment</text><line x1="30" y1="282" x2="870" y2="282" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="282" width="199.17525773195877" height="68" fill="#dce9e7"/><text x="44" y="308.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Contract</text><rect x="229.17525773195877" y="282" width="363.7113402061856" height="68" fill="#f8faf9"/><text x="243.17525773195877" y="308.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Written agreement stating what the patient</text><text x="243.17525773195877" y="329.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">will do and the reward for doing it</text><rect x="592.8865979381444" y="282" width="277.1134020618557" height="68" fill="#f8faf9"/><text x="606.8865979381444" y="308.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Low commitment: writing it</text><text x="606.8865979381444" y="329.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">down increases commitment</text><line x1="30" y1="350" x2="870" y2="350" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="350" width="199.17525773195877" height="47" fill="#dce9e7"/><text x="44" y="376.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Prompts</text><rect x="229.17525773195877" y="350" width="363.7113402061856" height="47" fill="#ffffff"/><text x="243.17525773195877" y="376.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Texts, phone calls, alarms or postcards</text><rect x="592.8865979381444" y="350" width="277.1134020618557" height="47" fill="#ffffff"/><text x="606.8865979381444" y="376.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Forgetting</text><line x1="30" y1="397" x2="870" y2="397" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="397" width="199.17525773195877" height="89" fill="#dce9e7"/><text x="44" y="423.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Customising</text><text x="44" y="444.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">treatment</text><rect x="229.17525773195877" y="397" width="363.7113402061856" height="89" fill="#f8faf9"/><text x="243.17525773195877" y="423.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Fitting the regime to the patient's routine:</text><text x="243.17525773195877" y="444.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">once-daily dosing, or medicine with</text><text x="243.17525773195877" y="465.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">breakfast</text><rect x="592.8865979381444" y="397" width="277.1134020618557" height="89" fill="#f8faf9"/><text x="606.8865979381444" y="423.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A regime that does not fit daily</text><text x="606.8865979381444" y="444.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">life</text><line x1="30" y1="486" x2="870" y2="486" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="486" width="199.17525773195877" height="68" fill="#dce9e7"/><text x="44" y="512.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Community</text><text x="44" y="533.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">intervention</text><rect x="229.17525773195877" y="486" width="363.7113402061856" height="68" fill="#ffffff"/><text x="243.17525773195877" y="512.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Yokley and Glenwick (1984): prompts,</text><text x="243.17525773195877" y="533.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">access and incentives for immunisation</text><rect x="592.8865979381444" y="486" width="277.1134020618557" height="68" fill="#ffffff"/><text x="606.8865979381444" y="512.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Missed appointments across a</text><text x="606.8865979381444" y="533.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">community</text></g><line x1="229.17525773195877" y1="124" x2="229.17525773195877" y2="554" stroke="#c9d6d4" stroke-width="1.5"/><line x1="592.8865979381444" y1="124" x2="592.8865979381444" y2="554" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="124" width="840" height="430" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/>
</svg>