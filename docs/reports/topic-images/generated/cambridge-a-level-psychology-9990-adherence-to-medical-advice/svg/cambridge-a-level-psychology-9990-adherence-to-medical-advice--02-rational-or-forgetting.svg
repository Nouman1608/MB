<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 748" width="900" height="748" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="748" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A decision or a lapse?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">How well the explanations fit two kinds of non-adherence</text>
<rect x="30" y="124" width="410" height="180" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">RATIONAL NON-ADHERENCE</text><text x="50" y="183.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">A reasoned decision</text><text x="50" y="213.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The patient weighs side effects, cost,</text><text x="50" y="235.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">inconvenience or doubts about whether the</text><text x="50" y="257.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">treatment works, and decides not adhering is</text><text x="50" y="279.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">sensible.</text><rect x="460" y="124" width="410" height="180" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="480" y="156" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">UNINTENTIONAL</text><text x="480" y="183.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Simply forgetting</text><text x="480" y="213.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">There is no decision to explain: the patient</text><text x="480" y="235.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">means to adhere but misses doses.</text><rect x="30" y="326" width="410" height="102" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="359.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Fits</tspan> <tspan font-weight="700" fill="#1e2a44">well:</tspan> rational non-adherence and the</text><text x="50" y="381.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Health Belief Model both treat non-adherence</text><text x="50" y="403.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">as a decision.</text><rect x="460" y="326" width="410" height="102" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="480" y="359.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Fits</tspan> <tspan font-weight="700" fill="#1e2a44">poorly:</tspan> decision-based explanations</text><text x="480" y="381.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">miss it, so <tspan font-weight="700" fill="#1e2a44">prompts</tspan> <tspan font-weight="700" fill="#1e2a44">and</tspan> <tspan font-weight="700" fill="#1e2a44">routines</tspan> are needed</text><text x="480" y="403.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">as well.</text><rect x="30" y="450" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="484.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Laba et al. (2012): the syllabus example</text><text x="50" y="514.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">How features of a medication, such as its <tspan font-weight="700" fill="#1e2a44">cost</tspan>, <tspan font-weight="700" fill="#1e2a44">side</tspan> <tspan font-weight="700" fill="#1e2a44">effects</tspan> and <tspan font-weight="700" fill="#1e2a44">effectiveness</tspan>, influence people's</text><text x="50" y="536.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">stated likelihood of continuing to take it.</text><rect x="30" y="583" width="840" height="133" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="617.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Evaluation: the Health Belief Model is reductionist</text><text x="50" y="647.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">It reduces behaviour to a few beliefs and leaves out emotion, social support and habit. Seeing</text><text x="50" y="669.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">non-adherence as rational shifts the focus from blaming patients to designing treatments people</text><text x="50" y="691.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">can live with.</text>
</svg>