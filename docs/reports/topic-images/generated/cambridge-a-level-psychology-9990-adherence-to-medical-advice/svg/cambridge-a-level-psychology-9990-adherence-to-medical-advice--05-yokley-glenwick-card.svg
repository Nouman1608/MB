<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 850" width="900" height="850" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="850" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Key study: Yokley and Glenwick (1984)</text>

<rect x="30" y="100" width="840" height="52" rx="14" fill="#2e6b62"/><rect x="30" y="130" width="840" height="22" fill="#2e6b62"/><text x="50" y="134" font-size="21" font-weight="700" fill="#ffffff" text-anchor="start">Increasing immunisation of preschool children</text><text x="850" y="134" font-size="16" font-weight="600" fill="#ffffff" text-anchor="end">field experiment</text><rect x="30" y="152" width="280" height="143" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="180" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">AIM</text><text x="46" y="211.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">To compare the effectiveness of</text><text x="46" y="232.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">community interventions for</text><text x="46" y="253.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">increasing immunisation of</text><text x="46" y="274.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">preschool children.</text><rect x="310" y="152" width="280" height="143" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="326" y="180" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SAMPLE</text><text x="326" y="211.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Families of <tspan font-weight="700" fill="#1e2a44">1,133</tspan> preschool</text><text x="326" y="232.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">children in a public health</text><text x="326" y="253.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">setting whose immunisations</text><text x="326" y="274.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">were incomplete.</text><rect x="590" y="152" width="280" height="143" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="606" y="180" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">MEASURE</text><text x="606" y="211.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Immunisation records: an</text><text x="606" y="232.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">objective measure of</text><text x="606" y="253.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">attendance.</text><text x="450" y="331" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">RANDOM ALLOCATION TO SIX CONDITIONS</text><rect x="117.632" y="357" width="144.03199999999998" height="30" rx="15" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="189.648" y="377.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">general prompt</text><rect x="271.664" y="357" width="198.096" height="30" rx="15" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="370.712" y="377.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">client-specific prompt</text><rect x="479.76" y="357" width="302.608" height="30" rx="15" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="631.064" y="377.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">specific prompt + increased access</text><rect x="291.416" y="397" width="317.168" height="30" rx="15" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="450" y="417.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">specific prompt + monetary incentive</text><rect x="290.008" y="437" width="141.50400000000002" height="30" rx="15" fill="#ffffff" stroke="#4a5568" stroke-width="2"/><text x="360.76" y="457.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">contact control</text><rect x="441.512" y="437" width="168.48" height="30" rx="15" fill="#ffffff" stroke="#4a5568" stroke-width="2"/><text x="525.752" y="457.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">no-contact control</text><rect x="30" y="489" width="458.8888888888889" height="164" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="517" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">RESULTS</text><text x="46" y="548.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">All interventions <tspan font-weight="700" fill="#1e2a44">except</tspan> <tspan font-weight="700" fill="#1e2a44">the</tspan> <tspan font-weight="700" fill="#1e2a44">general</tspan> <tspan font-weight="700" fill="#1e2a44">prompt</tspan> improved</text><text x="46" y="569.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">on the controls. Largest effect: monetary incentive, then</text><text x="46" y="590.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">increased access, then specific prompt, then general</text><text x="46" y="611.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">prompt. Specific prompts alone were the <tspan font-weight="700" fill="#1e2a44">most</tspan></text><text x="46" y="632.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">cost-effective</tspan>.</text><rect x="502.8888888888889" y="489" width="367.1111111111111" height="164" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="518.8888888888889" y="517" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CONCLUSION</text><text x="518.8888888888889" y="548.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Simple, targeted prompts are an efficient</text><text x="518.8888888888889" y="569.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">way to improve attendance; incentives and</text><text x="518.8888888888889" y="590.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">better access give larger gains at greater</text><text x="518.8888888888889" y="611.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">cost.</text><rect x="30" y="675" width="413" height="143" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="703" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">+ STRENGTHS</text><text x="46" y="734.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Large sample and random allocation support</text><text x="46" y="755.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">generalisation and causal conclusions; records</text><text x="46" y="776.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">avoid self-report bias.</text><rect x="457" y="675" width="413" height="143" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="473" y="703" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">− WEAKNESSES</text><text x="473" y="734.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">One community and one era, so cultural and</text><text x="473" y="755.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">service differences may limit generalisation;</text><text x="473" y="776.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">children's records need parental consent and</text><text x="473" y="797.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">confidentiality.</text>
</svg>