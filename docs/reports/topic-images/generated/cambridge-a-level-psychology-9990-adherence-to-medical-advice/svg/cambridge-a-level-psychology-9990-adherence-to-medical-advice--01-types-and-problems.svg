<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 653" width="900" height="653" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="653" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Two types of non-adherence</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">and the problems they cause</text>
<rect x="30" y="124" width="410" height="217" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">TYPE 1</text><text x="50" y="183.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Failure to follow treatments</text><text x="50" y="213.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="213.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">missing doses</text><text x="50" y="240.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="240.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">wrong dose or wrong time</text><text x="50" y="267.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="267.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">stopping a course early</text><text x="50" y="294.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="294.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">not following lifestyle advice, such as diet</text><text x="66.15" y="316.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">or exercise</text><rect x="460" y="124" width="410" height="217" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="480" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">TYPE 2</text><text x="480" y="183.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Failure to attend appointments</text><text x="480" y="213.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="496.15" y="213.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">check-ups</text><text x="480" y="240.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="496.15" y="240.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">screening</text><text x="480" y="267.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="496.15" y="267.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">vaccinations</text><text x="480" y="294.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="496.15" y="294.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">follow-up visits</text><line x1="450" y1="347" x2="450" y2="407" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="450" y="429" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">PROBLEMS CAUSED</text><rect x="30" y="455" width="410" height="166" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="490.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">For the patient</text><text x="50" y="520.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="66.15" y="520.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">illness may last longer or get worse</text><text x="50" y="547.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="66.15" y="547.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">stopping antibiotics early can let infections</text><text x="66.15" y="569.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">return</text><rect x="460" y="455" width="410" height="166" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="480" y="490.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">For health services</text><text x="480" y="520.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="496.15" y="520.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">missed appointments waste staff time</text><text x="480" y="547.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="496.15" y="547.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">unused medicines waste money</text><text x="480" y="574.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="496.15" y="574.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">doctors may wrongly conclude a treatment</text><text x="496.15" y="596.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">has failed and prescribe a stronger one</text>
</svg>