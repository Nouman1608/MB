<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 565" width="900" height="565" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="565" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Testing the audience models</text>

<line x1="60" y1="120" x2="840" y2="120" stroke="#8a6d0d" stroke-width="4" marker-start="url(#ahO)" marker-end="url(#ahO)"/><text x="60" y="106" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="start">passive audience</text><text x="840" y="106" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="end">active audience</text><rect x="30" y="144" width="202.5" height="266" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,210 L31.25,158.25 Q31.25,145.25 44.25,145.25 L218.25,145.25 Q231.25,145.25 231.25,158.25 L231.25,210 Z" fill="#f2e7b8"/><line x1="31.25" y1="210" x2="231.25" y2="210" stroke="#c9d6d4" stroke-width="2"/><text x="131.25" y="171.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Hypodermic</text><text x="131.25" y="193.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">syringe</text><text x="44" y="240.25" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start">Bandura (1961 on)</text><text x="44" y="266.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Children copied an</text><text x="44" y="286.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">adult hitting a Bobo</text><text x="44" y="306.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">doll. Critics:</text><text x="44" y="326.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">artificial; a doll is</text><text x="44" y="346.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">not a person.</text><rect x="242.5" y="144" width="202.5" height="266" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M243.75,210 L243.75,158.25 Q243.75,145.25 256.75,145.25 L430.75,145.25 Q443.75,145.25 443.75,158.25 L443.75,210 Z" fill="#f2e7b8"/><line x1="243.75" y1="210" x2="443.75" y2="210" stroke="#c9d6d4" stroke-width="2"/><text x="343.75" y="182.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Two step flow</text><text x="256.5" y="240.25" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start">Katz and Lazarsfeld</text><text x="256.5" y="266.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Opinion leaders; later</text><text x="256.5" y="286.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">multi-step flow</text><text x="256.5" y="306.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">models.</text><rect x="455" y="144" width="202.5" height="266" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M456.25,210 L456.25,158.25 Q456.25,145.25 469.25,145.25 L643.25,145.25 Q656.25,145.25 656.25,158.25 L656.25,210 Z" fill="#dce9e7"/><line x1="456.25" y1="210" x2="656.25" y2="210" stroke="#c9d6d4" stroke-width="2"/><text x="556.25" y="182.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Cultural effects</text><text x="469" y="240.25" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start">Gerbner; Hall (1973)</text><text x="469" y="266.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Heavy viewers</text><text x="469" y="286.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">overestimate crime:</text><text x="469" y="306.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">"mean world syndrome".</text><text x="469" y="326.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Encoding/decoding:</text><text x="469" y="346.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">dominant, negotiated</text><text x="469" y="366.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">or oppositional</text><text x="469" y="386.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">readings.</text><rect x="667.5" y="144" width="202.5" height="266" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M668.75,210 L668.75,158.25 Q668.75,145.25 681.75,145.25 L855.75,145.25 Q868.75,145.25 868.75,158.25 L868.75,210 Z" fill="#b5d3cf"/><line x1="668.75" y1="210" x2="868.75" y2="210" stroke="#c9d6d4" stroke-width="2"/><text x="768.75" y="171.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Uses and</text><text x="768.75" y="193.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">gratifications</text><text x="681.5" y="240.25" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start">Blumler and Katz</text><text x="681.5" y="260.25" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start">(1974)</text><text x="681.5" y="286.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">People choose media to</text><text x="681.5" y="306.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">meet their needs.</text><rect x="30" y="428" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="464" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Key test: Morley (1980), Nationwide</text><text x="56" y="493" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Audiences read the same BBC programme differently by class and occupation, so audiences</text><text x="56" y="515" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">are active and the hypodermic model is too simple for most effects.</text>
</svg>