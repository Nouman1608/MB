<rect width="900" height="701" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Representations of social groups</text>

<rect x="178" y="104" width="342" height="44" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="349" y="131.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Pattern to know</text><rect x="528" y="104" width="342" height="44" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="699" y="131.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Thinker or study</text><rect x="30" y="156" width="140" height="74" rx="10" fill="#b5d3cf" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="187.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Social</text><text x="42" y="209.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">class</text><rect x="178" y="156" width="342" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="192" y="186.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Working class comic, feckless or</text><text x="192" y="207.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">criminal; middle-class life the norm</text><rect x="528" y="156" width="342" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="542" y="186.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Owen Jones, Chavs (2011)</text><rect x="30" y="238" width="140" height="93" rx="10" fill="#b5d3cf" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="289.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Gender</text><rect x="178" y="238" width="342" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="192" y="268.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Women shown through appearance and</text><text x="192" y="289.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">domestic roles; camera positions</text><text x="192" y="310.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">viewers as male</text><rect x="528" y="238" width="342" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="542" y="268.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Tuchman: symbolic annihilation;</text><text x="542" y="289.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Mulvey (1975): the "male gaze"</text><rect x="30" y="339" width="140" height="93" rx="10" fill="#b5d3cf" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="390.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Ethnicity</text><rect x="178" y="339" width="342" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="192" y="369.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Minorities linked to crime, conflict</text><text x="192" y="390.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">or threat; under-represented in</text><text x="192" y="411.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">positive roles</text><rect x="528" y="339" width="342" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="542" y="369.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Hall et al. (1978): the "mugging"</text><text x="542" y="390.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">panic; van Dijk (1991)</text><rect x="30" y="440" width="140" height="72" rx="10" fill="#b5d3cf" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="481.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Age</text><rect x="178" y="440" width="342" height="72" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="192" y="470.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Young people as folk devils; older</text><text x="192" y="491.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">people frail, comic or invisible</text><rect x="528" y="440" width="342" height="72" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="542" y="470.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Cohen, Folk Devils and Moral Panics</text><rect x="30" y="528" width="840" height="149" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="564" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Evaluate by asking</text><circle cx="61" cy="587.39" r="4.5" fill="#8a6d0d"/><text x="74" y="593" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Are patterns changing (more diverse casting)?</text><circle cx="61" cy="617.39" r="4.5" fill="#8a6d0d"/><text x="74" y="623" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Do audiences accept or reject them?</text><circle cx="61" cy="647.39" r="4.5" fill="#8a6d0d"/><text x="74" y="653" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Does content analysis capture meaning?</text>
</svg>