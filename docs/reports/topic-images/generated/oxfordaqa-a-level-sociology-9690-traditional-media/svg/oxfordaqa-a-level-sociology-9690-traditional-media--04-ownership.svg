<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 491" width="900" height="491" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="491" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Ownership, control and concentration</text>

<rect x="30" y="110" width="269.3333333333333" height="147" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,160 L31.25,124.25 Q31.25,111.25 44.25,111.25 L285.0833333333333,111.25 Q298.0833333333333,111.25 298.0833333333333,124.25 L298.0833333333333,160 Z" fill="#dce9e7"/><line x1="31.25" y1="160" x2="298.0833333333333" y2="160" stroke="#c9d6d4" stroke-width="2"/><text x="164.66666666666666" y="140.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Horizontal integration</text><text x="44" y="191.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Several outlets of the same</text><text x="44" y="212.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">type (many newspapers)</text><rect x="315.3333333333333" y="110" width="269.3333333333333" height="147" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M316.5833333333333,160 L316.5833333333333,124.25 Q316.5833333333333,111.25 329.5833333333333,111.25 L570.4166666666666,111.25 Q583.4166666666666,111.25 583.4166666666666,124.25 L583.4166666666666,160 Z" fill="#dce9e7"/><line x1="316.5833333333333" y1="160" x2="583.4166666666666" y2="160" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="140.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Vertical integration</text><text x="329.3333333333333" y="191.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Production, distribution and</text><text x="329.3333333333333" y="212.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">sale (a studio owning</text><text x="329.3333333333333" y="233.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">cinemas)</text><rect x="600.6666666666666" y="110" width="269.3333333333333" height="147" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.9166666666666,160 L601.9166666666666,124.25 Q601.9166666666666,111.25 614.9166666666666,111.25 L855.75,111.25 Q868.75,111.25 868.75,124.25 L868.75,160 Z" fill="#dce9e7"/><line x1="601.9166666666666" y1="160" x2="868.75" y2="160" stroke="#c9d6d4" stroke-width="2"/><text x="735.3333333333333" y="140.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Cross-media ownership</text><text x="614.6666666666666" y="191.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Newspapers, television and</text><text x="614.6666666666666" y="212.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">film</text><text x="450" y="283" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Bagdikian (1983): a shrinking number of corporations owned most US media</text><rect x="30" y="309" width="412" height="156" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,359 L31.25,323.25 Q31.25,310.25 44.25,310.25 L427.75,310.25 Q440.75,310.25 440.75,323.25 L440.75,359 Z" fill="#f2e7b8"/><line x1="31.25" y1="359" x2="440.75" y2="359" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="339.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Allocative control</text><text x="44" y="391.15" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="start">stressed by Marxists</text><text x="44" y="419.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Owners decide budgets, editors and</text><text x="44" y="441.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">direction.</text><rect x="458" y="309" width="412" height="156" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,359 L459.25,323.25 Q459.25,310.25 472.25,310.25 L855.75,310.25 Q868.75,310.25 868.75,323.25 L868.75,359 Z" fill="#b5d3cf"/><line x1="459.25" y1="359" x2="868.75" y2="359" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="339.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Operational control</text><text x="472" y="391.15" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="start">stressed by pluralists</text><text x="472" y="419.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Editors and journalists decide daily</text><text x="472" y="441.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">content.</text>
</svg>