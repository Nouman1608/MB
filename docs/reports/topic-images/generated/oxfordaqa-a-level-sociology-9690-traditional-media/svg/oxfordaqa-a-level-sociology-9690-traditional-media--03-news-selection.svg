<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 719" width="900" height="719" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="719" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How news is made</text>

<rect x="30" y="110" width="200" height="200" rx="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="130" y="200" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">All events and</text><text x="130" y="224" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">wire stories</text><path d="M250,110 L470,170 L470,250 L250,310 Z" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><text x="355" y="202" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Gatekeeping</text><text x="355" y="226" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">+ news values</text><line x1="474" y1="210" x2="530" y2="210" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="536" y="160" width="140" height="100" rx="14" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="606" y="216" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">The news</text><line x1="680" y1="210" x2="724" y2="210" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="730" y="140" width="140" height="140" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="800" y="188" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">What people</text><text x="800" y="210" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">think about</text><rect x="30" y="330" width="269.3333333333333" height="174" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,380 L31.25,344.25 Q31.25,331.25 44.25,331.25 L285.0833333333333,331.25 Q298.0833333333333,331.25 298.0833333333333,344.25 L298.0833333333333,380 Z" fill="#f2e7b8"/><line x1="31.25" y1="380" x2="298.0833333333333" y2="380" stroke="#c9d6d4" stroke-width="2"/><text x="164.66666666666666" y="360.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Gatekeeping</text><text x="44" y="411.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">White (1950), "Mr Gates"</text><text x="44" y="438.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A wire editor rejected most</text><text x="44" y="459.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">stories for personal and</text><text x="44" y="480.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">practical reasons.</text><rect x="315.3333333333333" y="330" width="269.3333333333333" height="174" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M316.5833333333333,380 L316.5833333333333,344.25 Q316.5833333333333,331.25 329.5833333333333,331.25 L570.4166666666666,331.25 Q583.4166666666666,331.25 583.4166666666666,344.25 L583.4166666666666,380 Z" fill="#f2e7b8"/><line x1="316.5833333333333" y1="380" x2="583.4166666666666" y2="380" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="360.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">News values</text><text x="329.3333333333333" y="411.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Galtung and Ruge (1965)</text><text x="329.3333333333333" y="438.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Negativity, unexpectedness,</text><text x="329.3333333333333" y="459.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">elite nations and people,</text><text x="329.3333333333333" y="480.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">personalisation.</text><rect x="600.6666666666666" y="330" width="269.3333333333333" height="174" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.9166666666666,380 L601.9166666666666,344.25 Q601.9166666666666,331.25 614.9166666666666,331.25 L855.75,331.25 Q868.75,331.25 868.75,344.25 L868.75,380 Z" fill="#d4b02e"/><line x1="601.9166666666666" y1="380" x2="868.75" y2="380" stroke="#c9d6d4" stroke-width="2"/><text x="735.3333333333333" y="360.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Agenda-setting</text><text x="614.6666666666666" y="411.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">McCombs and Shaw (1972)</text><text x="614.6666666666666" y="438.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Not what to think, but what</text><text x="614.6666666666666" y="459.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">to think about (1968 US</text><text x="614.6666666666666" y="480.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">election).</text><rect x="30" y="522" width="840" height="171" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="558" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Whose interests?</text><circle cx="61" cy="581.39" r="4.5" fill="#8a6d0d"/><text x="74" y="587" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Marxists:</tspan> news values and gatekeeping reflect owners’ and advertisers’ interests</text><circle cx="61" cy="611.39" r="4.5" fill="#8a6d0d"/><text x="74" y="617" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Pluralists:</tspan> professional judgement and audience demand</text><circle cx="61" cy="641.39" r="4.5" fill="#8a6d0d"/><text x="74" y="647" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Glasgow University Media Group:</tspan> journalists’ shared middle-class assumptions produce</text><text x="74" y="669" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">bias without instruction</text>
</svg>