<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 609" width="900" height="609" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="609" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Post, telegraph, telephone</text>

<line x1="150" y1="120" x2="150" y2="444" stroke="#1e2a44" stroke-width="4"/><rect x="172" y="110" width="698" height="98" rx="12" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="150" cy="159" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="128" y="165" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="end">1840</text><text x="190" y="140.64" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Uniform penny post</text><text x="190" y="168.64" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Rowland Hill; the Penny Black. One low price anywhere in Britain made</text><text x="190" y="190.64" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">letter writing a mass activity.</text><rect x="172" y="222" width="698" height="120" rx="12" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="150" cy="282" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="128" y="288" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="end">1844, 1866</text><text x="190" y="252.64" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Telegraph</text><text x="190" y="280.64" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Morse’s Washington–Baltimore line; a lasting transatlantic cable. Carey</text><text x="190" y="302.64" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">(1989): separated communication from transport, making national markets,</text><text x="190" y="324.64" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">standard time and wire-service news possible.</text><rect x="172" y="356" width="698" height="98" rx="12" fill="#b5d3cf" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="150" cy="405" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="128" y="411" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="end">1876</text><text x="190" y="386.64" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Telephone</text><text x="190" y="414.64" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Patented by Bell. Fischer (1992): marketed for business, but users,</text><text x="190" y="436.64" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">especially women, made it a tool for sociability.</text><rect x="30" y="472" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="508" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Exam link</text><text x="56" y="537" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Fischer’s telephone study supports a social constructionist reading of technology:</text><text x="56" y="559" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">users, not designers, decided its main use.</text>
</svg>