<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">3247 Paper 2 Texts at a glance</text>

<rect x="60" y="120" width="312" height="100" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="216" y="162" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Part 1: Unseen Passage</text><text x="216" y="192" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">20 marks</text><rect x="372" y="120" width="234" height="100" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><text x="489" y="162" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Part 2: Poetry</text><text x="489" y="192" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">15 marks</text><rect x="606" y="120" width="234" height="100" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="723" y="162" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Part 3: Prose</text><text x="723" y="192" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">15 marks</text><text x="60" y="248" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Paper 2 Texts: 50% of 3247</text><text x="840" y="248" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="end">all three parts test AO3 Literature</text><rect x="30" y="276" width="268" height="190" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="50" y="313" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Unseen extract</text><text x="50" y="341.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">One passage-based question.</text><text x="50" y="371.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Poetry or prose not seen</text><text x="50" y="393.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">before; prompts guide you</text><text x="50" y="415.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">to how the writer achieves</text><text x="50" y="437.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">effects.</text><rect x="316" y="276" width="268" height="190" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="336" y="313" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Prescribed poetry</text><text x="336" y="341.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Two essay questions: answer</text><text x="336" y="363.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">one.</text><text x="336" y="391.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Ten ghazals and three</text><text x="336" y="413.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">nazms.</text><rect x="602" y="276" width="268" height="190" rx="14" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><text x="622" y="313" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Prescribed prose</text><text x="622" y="341.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Two essay questions: answer</text><text x="622" y="363.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">one.</text><text x="622" y="391.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Eight articles, including</text><text x="622" y="413.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">two of Ghalib's letters.</text><rect x="30" y="486" width="840" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="529" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Paper 1 (the other 50%) is Reading and Writing on a non-literary passage.</text>
