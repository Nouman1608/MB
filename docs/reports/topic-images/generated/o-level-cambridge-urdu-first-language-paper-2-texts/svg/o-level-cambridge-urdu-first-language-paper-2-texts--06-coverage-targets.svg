<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How much of the set texts to know</text>

<rect x="30" y="110" width="840" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="160" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Ghazals</text><text x="54" y="184" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">know at least 6 of 10 in close detail</text><rect x="380" y="138" width="40" height="52" rx="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><rect x="428" y="138" width="40" height="52" rx="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><rect x="476" y="138" width="40" height="52" rx="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><rect x="524" y="138" width="40" height="52" rx="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><rect x="572" y="138" width="40" height="52" rx="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><rect x="620" y="138" width="40" height="52" rx="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><rect x="668" y="138" width="40" height="52" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><rect x="716" y="138" width="40" height="52" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><rect x="764" y="138" width="40" height="52" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><rect x="812" y="138" width="40" height="52" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="54" y="260" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Nazms</text><text x="54" y="284" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">know at least 2 of 3 in close detail</text><rect x="380" y="238" width="40" height="52" rx="8" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><rect x="428" y="238" width="40" height="52" rx="8" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><rect x="476" y="238" width="40" height="52" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="54" y="360" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Prose articles</text><text x="54" y="384" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">know at least 5 of 8 in close detail</text><rect x="380" y="338" width="40" height="52" rx="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><rect x="428" y="338" width="40" height="52" rx="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><rect x="476" y="338" width="40" height="52" rx="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><rect x="524" y="338" width="40" height="52" rx="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><rect x="572" y="338" width="40" height="52" rx="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><rect x="620" y="338" width="40" height="52" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><rect x="668" y="338" width="40" height="52" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><rect x="716" y="338" width="40" height="52" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><rect x="30" y="460" width="840" height="92" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="54" y="496" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Time each part in practice</text><text x="54" y="526" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Too long on Part 1 leaves too little for the two essays.</text>
