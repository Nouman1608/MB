<rect x="190" y="470" width="520" height="82" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="506" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Personal, informed response</text><text x="450" y="532" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">to the text</text><rect x="150" y="374" width="600" height="82" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="410" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Beyond the literal</text><text x="450" y="436" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">deeper implications, not surface meaning only</text><rect x="110" y="278" width="680" height="82" rx="12" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="314" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">The writer's craft</text><text x="450" y="340" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">word choice, imagery, structure, tone</text><rect x="70" y="182" width="760" height="82" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="450" y="218" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Close, well-selected reference</text><text x="450" y="244" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">to the text itself, not paraphrase alone</text><text x="450" y="130" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">Top levels: sustained, perceptive engagement with the writer's craft</text><rect x="30" y="576" width="840" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="619" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">AO3 Literature: first-hand knowledge, literal and deeper meaning, effects, personal response</text>
