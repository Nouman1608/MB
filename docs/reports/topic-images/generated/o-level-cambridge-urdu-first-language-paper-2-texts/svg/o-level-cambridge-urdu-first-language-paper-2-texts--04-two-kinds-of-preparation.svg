<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 522" width="900" height="522" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="522" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Prepare a skill and a body of knowledge</text>

<rect x="30" y="110" width="410" height="260" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="50" y="144" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">UNSEEN PASSAGE</text><text x="50" y="173" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Part 1: build a skill</text><text x="50" y="201.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">You cannot memorise an unseen extract.</text><text x="50" y="233.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Practise unfamiliar Urdu poetry and prose</text><text x="50" y="255.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">and identify how the writer creates effect:</text><text x="50" y="277.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">word choice, imagery, structure.</text><text x="50" y="309.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Use past-question prompts as a model.</text><rect x="460" y="110" width="410" height="260" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="480" y="144" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SET TEXTS</text><text x="480" y="173" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Parts 2 and 3: know the texts</text><text x="480" y="201.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Close, memorised knowledge of the ghazals,</text><text x="480" y="223.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">nazms and prose pieces.</text><text x="480" y="255.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Essays need direct reference and quotation:</text><text x="480" y="277.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">fluent writing without it will not reach the</text><text x="480" y="299.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">top levels.</text><rect x="30" y="390" width="840" height="104" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="426" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">You choose one question from two in Parts 2 and 3</text><text x="54" y="456" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Cover enough of the prescribed list that you are never left with only one usable option.</text>
</svg>