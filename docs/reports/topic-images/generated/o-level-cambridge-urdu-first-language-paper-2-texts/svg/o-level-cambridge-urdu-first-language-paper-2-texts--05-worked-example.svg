<rect width="900" height="516" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: a poetry essay</text>

<rect x="30" y="110" width="840" height="80" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="54" y="146" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Question: how does the poet convey a particular emotion or theme</text><text x="54" y="172" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">in one of the prescribed ghazals?</text><rect x="30" y="214" width="260" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="248" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STEP 1</text><text x="50" y="277" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Identify specific</text><text x="50" y="303" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">lines</text><text x="50" y="331.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">quote the sher itself</text><line x1="292" y1="299" x2="318" y2="299" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="320" y="214" width="260" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="340" y="248" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STEP 2</text><text x="340" y="277" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Explain the</text><text x="340" y="303" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">language</text><text x="340" y="331.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the imagery or word choice</text><text x="340" y="353.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">in those lines</text><line x1="582" y1="299" x2="608" y2="299" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="610" y="214" width="260" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="630" y="248" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STEP 3</text><text x="630" y="277" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Connect to the</text><text x="630" y="303" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">question</text><text x="630" y="331.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">link the language to the</text><text x="630" y="353.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">named emotion or theme</text><rect x="30" y="404" width="840" height="84" rx="12" fill="#fbf1ea" stroke="#b5602e" stroke-width="2"/><text x="62" y="452" font-size="26" font-weight="700" fill="#b5602e" text-anchor="middle">✗</text><text x="90" y="438" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">Weak answer</text><text x="90" y="466" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">summarises the poem's general subject without close reference to its wording</text>
</svg>