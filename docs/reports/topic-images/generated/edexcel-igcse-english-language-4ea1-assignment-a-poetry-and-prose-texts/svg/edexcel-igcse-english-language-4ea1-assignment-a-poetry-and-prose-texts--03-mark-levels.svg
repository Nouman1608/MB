<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 703" width="900" height="703" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="703" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How the levels step up</text>

<rect x="30" y="100" width="120" height="47" fill="#1e2a44"/><text x="90" y="129.3" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Level</text><rect x="150" y="100" width="330" height="47" fill="#2e6b62"/><text x="315" y="129.3" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">AO1 (12 marks)</text><rect x="480" y="100" width="390" height="47" fill="#8a6d0d"/><text x="675" y="129.3" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">AO2 (18 marks)</text><rect x="30" y="147" width="120" height="100" fill="#d4b02e" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="199.94" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Level 5</text><rect x="150" y="147" width="330" height="100" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="164" y="199.94" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">AO1 has four levels</text><rect x="480" y="147" width="390" height="100" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2"/><text x="494" y="173.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">“Subtle and discriminating selection”;</text><text x="494" y="195.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">“perceptive analysis”</text><text x="494" y="225.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">15–18</text><rect x="30" y="247" width="120" height="144" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="321.94" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Level 4</text><rect x="150" y="247" width="330" height="144" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="164" y="273.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">“Detailed and persuasive</text><text x="164" y="295.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">selection”; “discriminating use of</text><text x="164" y="317.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">supporting quotations”;</text><text x="164" y="339.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">“perceptive interpretation”</text><text x="164" y="369.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">10–12</text><rect x="480" y="247" width="390" height="144" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="494" y="295.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">“Makes a detailed exploration of the</text><text x="494" y="317.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">effects”</text><text x="494" y="347.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">11–14</text><rect x="30" y="391" width="120" height="100" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="443.94" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Level 3</text><rect x="150" y="391" width="330" height="100" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="164" y="417.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">“Clear and relevant selection”;</text><text x="164" y="439.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">“relevant interpretation”</text><text x="164" y="469.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">7–9</text><rect x="480" y="391" width="390" height="100" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="494" y="417.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">“Makes clear explanations of the effects</text><text x="494" y="439.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">of language and structure”</text><text x="494" y="469.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">7–10</text><rect x="30" y="100" width="840" height="391" rx="4" fill="none" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="513" width="411" height="160" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="549" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">AO2 is 60% of the marks</text><text x="50" y="578.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Most of each paragraph should analyse</text><text x="50" y="600.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">methods.</text><rect x="459" y="513" width="411" height="160" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="479" y="549" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">A textual reference can be a</text><text x="479" y="575" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">moment</text><text x="479" y="604.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">A direct quotation, or a precise reference</text><text x="479" y="626.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">to a specific moment or event: useful for</text><text x="479" y="648.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">prose.</text>
</svg>