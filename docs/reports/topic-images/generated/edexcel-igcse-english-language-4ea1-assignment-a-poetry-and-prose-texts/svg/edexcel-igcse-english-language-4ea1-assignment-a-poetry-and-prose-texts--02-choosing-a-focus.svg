<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 742" width="900" height="742" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="742" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Test your focus</text>

<line x1="62" y1="120" x2="62" y2="362" stroke="#c9d6d4" stroke-width="4"/><rect x="108" y="100" width="762" height="86" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="126" y="134" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Is it central in each text?</text><text x="126" y="163.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">At least two or three moments in every text where the focus matters</text><circle cx="62" cy="143" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="151.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="108" y="198" width="762" height="86" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="126" y="232" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Do the writers present it differently?</text><text x="126" y="261.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Something to discuss beyond “all three show it”</text><circle cx="62" cy="241" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="249.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="108" y="296" width="762" height="86" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="126" y="330" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Do the texts use different methods?</text><text x="126" y="359.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Form, viewpoint, structure: range for AO2</text><circle cx="62" cy="339" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="347.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="30" y="404" width="230" height="47" fill="#b5602e"/><text x="145" y="433.3" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Weak focus</text><rect x="260" y="404" width="250" height="47" fill="#1e2a44"/><text x="385" y="433.3" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Why</text><rect x="510" y="404" width="360" height="47" fill="#2e6b62"/><text x="690" y="433.3" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Stronger version</text><rect x="30" y="451" width="230" height="56" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="481.94" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">“Feelings”</text><rect x="260" y="451" width="250" height="56" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="274" y="481.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Too vague to argue</text><rect x="510" y="451" width="360" height="56" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="524" y="481.94" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">“Moments of private realisation”</text><rect x="30" y="507" width="230" height="56" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="537.94" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">“War”</text><rect x="260" y="507" width="250" height="56" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="274" y="537.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Fits few texts</text><rect x="510" y="507" width="360" height="56" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="524" y="537.94" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">“Violence and its aftermath”</text><rect x="30" y="563" width="230" height="70" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="600.94" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">“Women”</text><rect x="260" y="563" width="250" height="70" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="274" y="600.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Topic, not idea</text><rect x="510" y="563" width="360" height="70" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="524" y="589.94" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">“The pressure of other people’s</text><text x="524" y="611.94" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">expectations”</text><rect x="30" y="404" width="840" height="229" rx="4" fill="none" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="655" width="840" height="57" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="688.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Narrow enough to argue, broad enough to fit all three texts.</text>
</svg>