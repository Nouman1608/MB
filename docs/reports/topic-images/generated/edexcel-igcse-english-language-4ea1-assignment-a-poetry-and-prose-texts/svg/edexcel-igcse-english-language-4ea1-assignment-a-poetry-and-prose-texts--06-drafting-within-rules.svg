<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 626" width="900" height="626" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="626" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Drafting within the rules</text>

<rect x="30" y="100" width="180" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="120" y="155.8" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Draft</text><text x="120" y="185.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">you write it</text><text x="120" y="206.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">independently</text><line x1="215" y1="175" x2="245" y2="175" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="250" y="100" width="180" height="150" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="340" y="145.3" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Teacher</text><text x="340" y="175.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">may suggest</text><text x="340" y="196.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">general</text><text x="340" y="217.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">improvements</text><line x1="435" y1="175" x2="465" y2="175" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="470" y="100" width="180" height="150" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="560" y="145.3" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">You</text><text x="560" y="175.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">make the</text><text x="560" y="196.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">corrections and</text><text x="560" y="217.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">update the work</text><line x1="655" y1="175" x2="685" y2="175" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="690" y="100" width="180" height="150" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="780" y="145.3" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Marked</text><text x="780" y="175.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">must not be</text><text x="780" y="196.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">rewritten after</text><text x="780" y="217.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">marking</text><text x="450" y="292" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Use the draft stage for three jobs</text><rect x="30" y="308" width="270" height="156" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="341" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">JOB 1</text><text x="50" y="366.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Check the focus</text><text x="50" y="394.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Every paragraph answers it</text><rect x="315" y="308" width="270" height="156" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="335" y="341" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">JOB 2</text><text x="335" y="366.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Replace retelling</text><text x="335" y="394.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">with analysis</text><rect x="600" y="308" width="270" height="156" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="620" y="341" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">JOB 3</text><text x="620" y="366.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Close reading in each</text><text x="620" y="390.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">text</text><text x="620" y="418.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">At least one detailed</text><text x="620" y="439.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">moment per text</text><rect x="30" y="486" width="840" height="110" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="519.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Work independently, acknowledge any sources and sign the authentication</text><text x="48" y="544.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">sheet.</text><text x="48" y="573.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Teachers are told to watch for essays derived from the internet or AI.</text>
</svg>