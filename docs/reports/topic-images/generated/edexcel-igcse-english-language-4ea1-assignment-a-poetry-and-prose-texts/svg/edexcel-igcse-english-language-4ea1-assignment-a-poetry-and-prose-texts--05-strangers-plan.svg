<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 694" width="900" height="694" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="694" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked plan: encounters with strangers</text>

<rect x="30" y="100" width="840" height="96" rx="14" fill="#1e2a44" stroke="#1e2a44" stroke-width="2.5"/><text x="54" y="132" font-size="15" font-weight="700" fill="#b5d3cf" text-anchor="start">THESIS</text><text x="54" y="160" font-size="17" font-weight="400" fill="#ffffff" text-anchor="start">A brief meeting with a stranger becomes a moment of connection that the setting threatens;</text><text x="54" y="182" font-size="17" font-weight="400" fill="#ffffff" text-anchor="start">the writers differ in whether that connection lasts.</text><rect x="30" y="218" width="150" height="66" fill="#1e2a44"/><text x="105" y="245.6" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Paragraph</text><rect x="180" y="218" width="230" height="66" fill="#1e2a44"/><text x="295" y="245.6" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">“The Bright Lights of</text><text x="295" y="266.6" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Sarajevo” (poem)</text><rect x="410" y="218" width="230" height="66" fill="#1e2a44"/><text x="525" y="245.6" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">“Significant</text><text x="525" y="266.6" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Cigarettes” (prose)</text><rect x="640" y="218" width="230" height="66" fill="#1e2a44"/><text x="755" y="245.6" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">“An Unknown Girl”</text><text x="755" y="266.6" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">(poem)</text><rect x="30" y="284" width="150" height="68" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="310.12" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">1 Setting as</text><text x="44" y="331.12" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">threat</text><rect x="180" y="284" width="230" height="68" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="194" y="310.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The besieged city at</text><text x="194" y="331.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">night</text><rect x="410" y="284" width="230" height="68" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="424" y="310.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The long coach journey</text><text x="424" y="331.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">far from home</text><rect x="640" y="284" width="230" height="68" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="654" y="310.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The crowded evening</text><text x="654" y="331.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">bazaar</text><rect x="30" y="352" width="150" height="89" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="378.12" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">2 How the</text><text x="44" y="399.12" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">meeting is</text><text x="44" y="420.12" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">shaped</text><rect x="180" y="352" width="230" height="89" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="194" y="399.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Darkness and light</text><rect x="410" y="352" width="230" height="89" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="424" y="378.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Hesitant, awkward</text><text x="424" y="399.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">conversation in close</text><text x="424" y="420.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">third person</text><rect x="640" y="352" width="230" height="89" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="654" y="378.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Present-tense physical</text><text x="654" y="399.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">closeness as the henna</text><text x="654" y="420.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">is applied</text><rect x="30" y="441" width="150" height="47" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="467.12" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">3 Identity</text><rect x="180" y="441" width="690" height="47" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="525" y="467.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">In all three: each stranger helps define the speaker or character</text><rect x="30" y="488" width="150" height="47" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="514.12" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">4 Endings</text><rect x="180" y="488" width="230" height="47" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2"/><text x="194" y="514.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Hope</text><rect x="410" y="488" width="230" height="47" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2"/><text x="424" y="514.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Uncertainty</text><rect x="640" y="488" width="230" height="47" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2"/><text x="654" y="514.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Something that will fade</text><rect x="30" y="218" width="840" height="317" rx="4" fill="none" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="557" width="840" height="107" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="590.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Conclusion: encounters with strangers as fragile but meaningful.</text><text x="48" y="619.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Paragraph 4 compares endings across all three texts (AO2) and interprets what each</text><text x="48" y="641.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">encounter means (AO1).</text>
</svg>