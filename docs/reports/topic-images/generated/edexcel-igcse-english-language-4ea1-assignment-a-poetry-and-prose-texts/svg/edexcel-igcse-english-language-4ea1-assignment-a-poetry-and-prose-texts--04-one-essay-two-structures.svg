<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 618" width="900" height="618" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="618" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">One essay, not three</text>

<rect x="30" y="100" width="405" height="330" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="54" y="138" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Integrated (by idea)</text><text x="54" y="184" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">Aspect 1</text><rect x="140" y="162" width="86" height="34" rx="7" fill="#f2e7b8" stroke="#1e2a44" stroke-width="1.8"/><text x="183" y="185" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Text 1</text><rect x="232" y="162" width="86" height="34" rx="7" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><text x="275" y="185" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Text 2</text><rect x="324" y="162" width="86" height="34" rx="7" fill="#b5d3cf" stroke="#1e2a44" stroke-width="1.8"/><text x="367" y="185" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Text 3</text><text x="54" y="254" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">Aspect 2</text><rect x="140" y="232" width="86" height="34" rx="7" fill="#f2e7b8" stroke="#1e2a44" stroke-width="1.8"/><text x="183" y="255" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Text 1</text><rect x="232" y="232" width="86" height="34" rx="7" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><text x="275" y="255" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Text 2</text><rect x="324" y="232" width="86" height="34" rx="7" fill="#b5d3cf" stroke="#1e2a44" stroke-width="1.8"/><text x="367" y="255" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Text 3</text><text x="54" y="324" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">Aspect 3</text><rect x="140" y="302" width="86" height="34" rx="7" fill="#f2e7b8" stroke="#1e2a44" stroke-width="1.8"/><text x="183" y="325" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Text 1</text><rect x="232" y="302" width="86" height="34" rx="7" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><text x="275" y="325" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Text 2</text><rect x="324" y="302" width="86" height="34" rx="7" fill="#b5d3cf" stroke="#1e2a44" stroke-width="1.8"/><text x="367" y="325" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Text 3</text><text x="54" y="390" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Makes connections visible; suits clear</text><text x="54" y="411" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">similarities and contrasts.</text><rect x="465" y="100" width="405" height="330" rx="14" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="489" y="138" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Sequenced with links</text><rect x="500" y="162" width="250" height="34" rx="7" fill="#f2e7b8" stroke="#1e2a44" stroke-width="1.8"/><text x="625" y="185" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Text 1 section</text><path d="M760,179 C800,179 800,249 756,249" fill="none" stroke="#8a6d0d" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahO)"/><rect x="500" y="232" width="250" height="34" rx="7" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><text x="625" y="255" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Text 2 section</text><path d="M760,249 C800,249 800,319 756,319" fill="none" stroke="#8a6d0d" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahO)"/><rect x="500" y="302" width="250" height="34" rx="7" fill="#b5d3cf" stroke="#1e2a44" stroke-width="1.8"/><text x="625" y="325" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Text 3 section</text><text x="812" y="220" font-size="15" font-weight="600" fill="#8a6d0d" text-anchor="start">link</text><text x="812" y="290" font-size="15" font-weight="600" fill="#8a6d0d" text-anchor="start">link</text><text x="489" y="390" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Each section links back and points forward;</text><text x="489" y="411" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">suits very different methods.</text><rect x="30" y="452" width="411" height="136" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="485" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">OPEN WITH</text><text x="50" y="512" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">A thesis</text><text x="50" y="541.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Name the focus and make a claim about how</text><text x="50" y="563.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">the writers present it.</text><rect x="459" y="452" width="411" height="136" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="479" y="485" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">CLOSE WITH</text><text x="479" y="512" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">A judgement</text><text x="479" y="541.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">What the three texts, taken together,</text><text x="479" y="563.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">suggest.</text>
</svg>