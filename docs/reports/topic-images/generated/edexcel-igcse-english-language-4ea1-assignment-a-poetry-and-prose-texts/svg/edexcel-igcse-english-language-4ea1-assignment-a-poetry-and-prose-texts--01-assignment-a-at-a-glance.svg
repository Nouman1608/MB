<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 556" width="900" height="556" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="556" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Assignment A at a glance</text>

<text x="450" y="120" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">30 marks, best fit</text><rect x="70" y="138" width="304" height="58" rx="8" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="222" y="163" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">AO1: 12 marks</text><text x="222" y="186" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="middle">ideas, interpretation, references</text><rect x="374" y="138" width="456" height="58" rx="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="602" y="163" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">AO2: 18 marks (60%)</text><text x="602" y="186" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">effects of language and structure</text><rect x="30" y="222" width="270" height="162" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="255" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">TEXTS</text><text x="50" y="282" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Three from Anthology</text><text x="50" y="308" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Part 2</text><text x="50" y="337.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">At least one poetry text</text><text x="50" y="359.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">and one prose text</text><rect x="315" y="222" width="270" height="162" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="335" y="255" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FOCUS</text><text x="335" y="282" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">One focus across all</text><text x="335" y="308" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">three</text><text x="335" y="337.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Setting, character(s),</text><text x="335" y="359.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">event(s) or theme(s)</text><rect x="600" y="222" width="270" height="162" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="620" y="255" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">LENGTH</text><text x="620" y="282" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">About 1200 words</text><text x="620" y="311.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Advisory; no penalty for</text><text x="620" y="333.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">exceeding it</text><rect x="30" y="406" width="840" height="120" rx="14" fill="#1e2a44" stroke="#1e2a44" stroke-width="2.5"/><text x="54" y="438" font-size="15" font-weight="700" fill="#b5d3cf" text-anchor="start">SUGGESTED TASK FORMAT</text><text x="54" y="474" font-size="19" fill="#ffffff" font-style="italic" xml:space="preserve">Discuss how the writers use language and structure to present <tspan fill="#d4b02e" font-weight="700">[focus]</tspan></text><text x="54" y="504" font-size="19" fill="#ffffff" font-style="italic" xml:space="preserve">in <tspan fill="#d4b02e" font-weight="700">[text 1]</tspan>, <tspan fill="#d4b02e" font-weight="700">[text 2]</tspan> and <tspan fill="#d4b02e" font-weight="700">[text 3]</tspan>.</text>
</svg>