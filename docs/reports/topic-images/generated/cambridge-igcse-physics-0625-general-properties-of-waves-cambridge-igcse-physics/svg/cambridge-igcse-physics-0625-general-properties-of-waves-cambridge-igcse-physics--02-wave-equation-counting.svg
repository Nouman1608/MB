#4a5568" text-anchor="middle">9</text><line x1="720" y1="190" x2="720" y2="300" stroke="#2e6b62" stroke-width="3.5" stroke-linecap="round"/><text x="720" y="180" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">10</text><text x="125" y="252" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">1</text><text x="195" y="252" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">2</text><text x="265" y="252" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">3</text><text x="335" y="252" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">4</text><text x="405" y="252" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">5</text><text x="475" y="252" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">6</text><text x="545" y="252" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">7</text><text x="615" y="252" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">8</text><text x="685" y="252" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">9</text><line x1="90" y1="325" x2="720" y2="325" stroke="#1e2a44" stroke-width="2.5" marker-start="url(#ah)" marker-end="url(#ah)"/><text x="405" y="352" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">18 cm</text><rect x="30" y="400" width="410" height="186" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="436" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Worked example 1</text><text x="50" y="470" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">10 wavefronts → 9 gaps</text><text x="50" y="502" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">λ = 18 / 9 = 2.0 cm = 0.020 m</text><text x="50" y="534" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">v = f λ = 12 × 0.020</text><text x="80" y="566" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">= 0.24 m/s</text><rect x="460" y="400" width="410" height="186" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="480" y="436" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Worked example 2</text><text x="480" y="470" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">sound: λ = 340 / 680 = 0.50 m</text><text x="480" y="502" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">radio: f = 3.0 × 10⁸ / 3.0</text><text x="510" y="534" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">= 1.0 × 10⁸ Hz</text><text x="480" y="566" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">water: v = 0.25 × 20 = 5.0 m/s</text>
