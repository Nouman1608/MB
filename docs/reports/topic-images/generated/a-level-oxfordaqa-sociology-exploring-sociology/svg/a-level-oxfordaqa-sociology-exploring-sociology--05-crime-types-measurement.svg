<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 546" width="900" height="546" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="546" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Deviance, harm and crime</text>

<rect x="238" y="104" width="632" height="44" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="554" y="131.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">What the specification names</text><rect x="30" y="156" width="200" height="74" rx="10" fill="#b5d3cf" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="187.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Social</text><text x="42" y="209.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">construction</text><rect x="238" y="156" width="632" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="252" y="187.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">What counts as crime and deviance is defined by society.</text><rect x="30" y="238" width="200" height="74" rx="10" fill="#b5d3cf" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="280.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Crime types</text><rect x="238" y="238" width="632" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="252" y="269.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Violent, property, white-collar, corporate, state, environmental,</text><text x="252" y="291.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">"victimless" and cyber.</text><rect x="30" y="320" width="200" height="52" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="351.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Social harms</text><rect x="238" y="320" width="632" height="52" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="252" y="351.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Behaviour that is harmful but not criminal.</text><rect x="30" y="380" width="200" height="52" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="411.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Measurement</text><rect x="238" y="380" width="632" height="52" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="252" y="411.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Official/police statistics, self-report studies, victim surveys.</text><rect x="30" y="440" width="200" height="74" rx="10" fill="#d4b02e" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="482.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Patterns</text><rect x="238" y="440" width="632" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="252" y="471.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Offending and victimisation by gender, social class, age and</text><text x="252" y="493.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">ethnicity.</text>
</svg>