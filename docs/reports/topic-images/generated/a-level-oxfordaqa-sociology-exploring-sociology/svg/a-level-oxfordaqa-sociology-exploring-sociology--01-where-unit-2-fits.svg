<rect x="30" y="116" width="328.8" height="40" rx="10" fill="#dce9e7"/><text x="194.4" y="143" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">International AS</text><rect x="30" y="166" width="840" height="40" rx="10" fill="#dce9e7"/><text x="450" y="193" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Full International A-level: Units 1 to 5</text><rect x="30" y="222" width="158.4" height="130" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="109.2" y="258" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Unit 1</text><text x="109.2" y="292" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Introducing</text><text x="109.2" y="313" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Sociology</text><rect x="200.4" y="222" width="158.4" height="130" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="3.5"/><text x="279.6" y="258" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Unit 2</text><text x="279.6" y="292" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Exploring</text><text x="279.6" y="313" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Sociology</text><rect x="370.8" y="222" width="158.4" height="130" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="258" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Unit 3</text><text x="450" y="292" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">People and</text><text x="450" y="313" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Development</text><rect x="541.2" y="222" width="158.4" height="130" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="620.4000000000001" y="258" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Unit 4</text><text x="620.4000000000001" y="292" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">People and the</text><text x="620.4000000000001" y="313" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Environment</text><rect x="711.6" y="222" width="158.4" height="130" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="790.8000000000001" y="258" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Unit 5</text><text x="790.8000000000001" y="292" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">People and</text><text x="790.8000000000001" y="313" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Technology</text><text x="450" y="380" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Units 3 to 5 apply the perspectives and methods built in Units 1 and 2 to applied, contemporary topics</text><text x="450" y="426" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Unit 2 assessment (60 marks)</text><rect x="30" y="444" width="412" height="175" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,516 L31.25,458.25 Q31.25,445.25 44.25,445.25 L427.75,445.25 Q440.75,445.25 440.75,458.25 L440.75,516 Z" fill="#b5d3cf"/><line x1="31.25" y1="516" x2="440.75" y2="516" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="473.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Section A: Socialisation and social</text><text x="236" y="498.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">control</text><text x="44" y="547.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">40 of 60 marks</text><text x="44" y="574.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Short and extended-response questions on</text><text x="44" y="595.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">3.1.2.</text><rect x="458" y="444" width="412" height="175" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,516 L459.25,458.25 Q459.25,445.25 472.25,445.25 L855.75,445.25 Q868.75,445.25 868.75,458.25 L868.75,516 Z" fill="#f2e7b8"/><line x1="459.25" y1="516" x2="868.75" y2="516" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="473.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Section B: Research methods and</text><text x="664" y="498.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">theory</text><text x="472" y="547.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">20 marks</text><text x="472" y="574.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">One extended-response question on 3.1.3, the</text><text x="472" y="595.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">same content examined in Unit 1.</text>
