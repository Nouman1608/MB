<rect width="900" height="629" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">3.1.2 Socialisation and Social Control</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">five sub-sections: revise against all of them</text>
<rect x="30" y="120" width="412" height="149" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,170 L31.25,134.25 Q31.25,121.25 44.25,121.25 L427.75,121.25 Q440.75,121.25 440.75,134.25 L440.75,170 Z" fill="#b5d3cf"/><line x1="31.25" y1="170" x2="440.75" y2="170" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="150.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Individuals and society</text><circle cx="64" cy="145" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="64" y="151.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="46" y="203.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Culture, norms, values, roles, status,</text><text x="46" y="224.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">stereotypes, subcultures; Mills’s</text><text x="46" y="245.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">sociological imagination.</text><rect x="458" y="120" width="412" height="149" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,170 L459.25,134.25 Q459.25,121.25 472.25,121.25 L855.75,121.25 Q868.75,121.25 868.75,134.25 L868.75,170 Z" fill="#b5d3cf"/><line x1="459.25" y1="170" x2="868.75" y2="170" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="150.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Socialisation</text><circle cx="492" cy="145" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="492" y="151.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="474" y="203.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Primary, secondary, re-socialisation,</text><text x="474" y="224.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">inadequate socialisation; family, school,</text><text x="474" y="245.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">peers, media, religion, workplace.</text><rect x="30" y="285" width="412" height="149" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,335 L31.25,299.25 Q31.25,286.25 44.25,286.25 L427.75,286.25 Q440.75,286.25 440.75,299.25 L440.75,335 Z" fill="#dce9e7"/><line x1="31.25" y1="335" x2="440.75" y2="335" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="315.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Identities and social change</text><circle cx="64" cy="310" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="64" y="316.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="46" y="368.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Age, gender, ethnicity, class, religion,</text><text x="46" y="389.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">disability, nationality; hybrid and online</text><text x="46" y="410.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">identities.</text><rect x="458" y="285" width="412" height="149" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,335 L459.25,299.25 Q459.25,286.25 472.25,286.25 L855.75,286.25 Q868.75,286.25 868.75,299.25 L868.75,335 Z" fill="#dce9e7"/><line x1="459.25" y1="335" x2="868.75" y2="335" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="315.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Social control</text><circle cx="492" cy="310" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="492" y="316.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="474" y="368.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Formal and informal control; sanctions;</text><text x="474" y="389.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">stigma, othering, punishment, state</text><text x="474" y="410.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">apparatuses, hegemony.</text><rect x="30" y="450" width="412" height="149" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,500 L31.25,464.25 Q31.25,451.25 44.25,451.25 L427.75,451.25 Q440.75,451.25 440.75,464.25 L440.75,500 Z" fill="#d4b02e"/><line x1="31.25" y1="500" x2="440.75" y2="500" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="480.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Deviance, harm and crime</text><circle cx="64" cy="475" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="64" y="481.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="46" y="533.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Social construction; crime types; social</text><text x="46" y="554.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">harms; measurement; patterns by gender,</text><text x="46" y="575.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">class, age and ethnicity.</text><rect x="458" y="450" width="412" height="149" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,500 L459.25,464.25 Q459.25,451.25 472.25,451.25 L855.75,451.25 Q868.75,451.25 868.75,464.25 L868.75,500 Z" fill="#f2e7b8"/><line x1="459.25" y1="500" x2="868.75" y2="500" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="480.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Named sociologists</text><circle cx="492" cy="475" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="492" y="481.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">6</text><text x="474" y="533.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Stanley Cohen, Fanon, Goffman, Mead, Mills,</text><text x="474" y="554.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Zuboff: all directly assessable.</text>
</svg>