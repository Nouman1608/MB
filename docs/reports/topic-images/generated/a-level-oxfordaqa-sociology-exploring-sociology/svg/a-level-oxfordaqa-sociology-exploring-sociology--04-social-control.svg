<rect width="900" height="736" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Social control</text>

<rect x="30" y="104" width="412" height="166" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,154 L31.25,118.25 Q31.25,105.25 44.25,105.25 L427.75,105.25 Q440.75,105.25 440.75,118.25 L440.75,154 Z" fill="#b5d3cf"/><line x1="31.25" y1="154" x2="440.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="134.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Formal social control</text><circle cx="49" cy="180.54" r="4.5" fill="#2e6b62"/><text x="62" y="186.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Government and law</text><circle cx="49" cy="210.54" r="4.5" fill="#2e6b62"/><text x="62" y="216.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Police</text><circle cx="49" cy="240.54" r="4.5" fill="#2e6b62"/><text x="62" y="246.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The criminal justice system</text><rect x="458" y="104" width="412" height="166" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,154 L459.25,118.25 Q459.25,105.25 472.25,105.25 L855.75,105.25 Q868.75,105.25 868.75,118.25 L868.75,154 Z" fill="#f2e7b8"/><line x1="459.25" y1="154" x2="868.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="134.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Informal social control</text><circle cx="477" cy="180.54" r="4.5" fill="#2e6b62"/><text x="490" y="186.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Families, schools, peers</text><circle cx="477" cy="210.54" r="4.5" fill="#2e6b62"/><text x="490" y="216.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Media, religion</text><circle cx="477" cy="240.54" r="4.5" fill="#2e6b62"/><text x="490" y="246.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The workplace</text><rect x="30" y="284" width="840" height="56" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="319" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Both use positive sanctions (rewards) and negative sanctions (punishments)</text><text x="450" y="374" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Key concepts</text><rect x="30" y="394" width="269.3333333333333" height="189" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,444 L31.25,408.25 Q31.25,395.25 44.25,395.25 L285.0833333333333,395.25 Q298.0833333333333,395.25 298.0833333333333,408.25 L298.0833333333333,444 Z" fill="#dce9e7"/><line x1="31.25" y1="444" x2="298.0833333333333" y2="444" stroke="#c9d6d4" stroke-width="2"/><text x="164.66666666666666" y="424.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Stigma and othering</text><text x="44" y="475.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Goffman:</tspan> stigma and</text><text x="44" y="496.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">"spoiled" identity.</text><text x="44" y="517.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Othering: treating a group</text><text x="44" y="538.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">as different from, and</text><text x="44" y="559.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">inferior to, "us".</text><rect x="315.3333333333333" y="394" width="269.3333333333333" height="189" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M316.5833333333333,444 L316.5833333333333,408.25 Q316.5833333333333,395.25 329.5833333333333,395.25 L570.4166666666666,395.25 Q583.4166666666666,395.25 583.4166666666666,408.25 L583.4166666666666,444 Z" fill="#f2e7b8"/><line x1="316.5833333333333" y1="444" x2="583.4166666666666" y2="444" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="424.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Althusser (Marxist)</text><text x="329.3333333333333" y="475.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Repressive and ideological</text><text x="329.3333333333333" y="496.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">state apparatuses;</text><text x="329.3333333333333" y="517.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">interpellation.</text><rect x="600.6666666666666" y="394" width="269.3333333333333" height="189" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.9166666666666,444 L601.9166666666666,408.25 Q601.9166666666666,395.25 614.9166666666666,395.25 L855.75,395.25 Q868.75,395.25 868.75,408.25 L868.75,444 Z" fill="#f2e7b8"/><line x1="601.9166666666666" y1="444" x2="868.75" y2="444" stroke="#c9d6d4" stroke-width="2"/><text x="735.3333333333333" y="424.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Gramsci (Marxist)</text><text x="614.6666666666666" y="475.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Hegemony: rule through the</text><text x="614.6666666666666" y="496.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">consent of the governed to</text><text x="614.6666666666666" y="517.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">ruling-class ideas.</text><rect x="30" y="599" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="635" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Also in 3.1.2.4</text><text x="56" y="664" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Aims and types of punishment; crime prevention (types of policing, surveillance). Read</text><text x="56" y="686" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">through functionalist, Marxist, feminist and interactionist perspectives.</text>
</svg>