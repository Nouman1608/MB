<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 581" width="900" height="581" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="581" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why do some working-class students underachieve?</text>

<rect x="178" y="104" width="342" height="44" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="349" y="131.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Positivist approach</text><rect x="528" y="104" width="342" height="44" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="699" y="131.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Interpretivist approach</text><rect x="30" y="156" width="140" height="93" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="207.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Method</text><rect x="178" y="156" width="342" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="192" y="186.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Large-scale official statistics on</text><text x="192" y="207.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">exam results by social class.</text><rect x="528" y="156" width="342" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="542" y="186.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Unstructured interviews or classroom</text><text x="542" y="207.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">observation with a small number of</text><text x="542" y="228.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">students.</text><rect x="30" y="257" width="140" height="93" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="308.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Strength</text><rect x="178" y="257" width="342" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="192" y="287.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Representative; reveals broad</text><text x="192" y="308.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">patterns.</text><rect x="528" y="257" width="342" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="542" y="287.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Reveals lived experience of</text><text x="542" y="308.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">labelling, teacher expectation or</text><text x="542" y="329.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">subcultural pressure.</text><rect x="30" y="358" width="140" height="72" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="399.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Limitation</text><rect x="178" y="358" width="342" height="72" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="192" y="388.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Limited in explaining why the pattern</text><text x="192" y="409.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">exists.</text><rect x="528" y="358" width="342" height="72" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="542" y="388.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Limited in how far findings can be</text><text x="542" y="409.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">generalised.</text><rect x="30" y="446" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="482" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">What makes it strong</text><text x="56" y="511" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Explain that the choice reflects a real theoretical disagreement about valid knowledge,</text><text x="56" y="533" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">and consider triangulating both to capture pattern and meaning together.</text>
</svg>