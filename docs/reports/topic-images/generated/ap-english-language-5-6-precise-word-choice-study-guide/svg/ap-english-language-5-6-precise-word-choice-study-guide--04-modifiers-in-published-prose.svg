<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 587" width="900" height="587" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="587" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Modifiers that carry feeling and judgement</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Lincoln (1865) and Paine (1776)</text>
<text x="30" y="134" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Lincoln, Second Inaugural Address</text><rect x="30" y="152" width="90" height="36" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2" /><text x="75" y="176.3" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Fondly</text><text x="75" y="209.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">adverb:</text><text x="75" y="227.8" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">affection</text><rect x="126" y="152" width="141.64094" height="36" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2" /><text x="196.82047" y="176.3" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">do we hope—</text><rect x="273.64094" y="152" width="97.79383999999999" height="36" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2" /><text x="322.53786" y="176.3" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">fervently</text><text x="322.53786" y="209.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">adverb:</text><text x="322.53786" y="227.8" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">intensity</text><rect x="377.43478" y="152" width="206.56802000000002" height="36" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2" /><text x="480.71879" y="176.3" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">do we pray—that this</text><rect x="590.0028" y="152" width="90" height="36" rx="8" fill="#dce9e7" stroke="#1e2a44" stroke-width="2" /><text x="635.0028" y="176.3" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">mighty</text><text x="635.0028" y="209.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">immense</text><text x="635.0028" y="227.8" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">force</text><rect x="686.0028" y="152" width="91.60148000000001" height="36" rx="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2" /><text x="731.80354" y="176.3" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">scourge</text><text x="731.80354" y="209.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">a whip;</text><text x="731.80354" y="227.8" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">suffering</text><rect x="30" y="256.6" width="118.03952" height="36" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2" /><text x="89.01975999999999" y="280.90000000000003" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">of war may</text><rect x="154.03951999999998" y="256.6" width="93.49256000000001" height="36" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2" /><text x="200.7858" y="280.90000000000003" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">speedily</text><text x="200.7858" y="314.1" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">how soon</text><rect x="253.53208" y="256.6" width="118.31761999999999" height="36" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2" /><text x="312.69089" y="280.90000000000003" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">pass away.</text><text x="30" y="340.90000000000003" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" xml:space="preserve">Inverted order (“Fondly do we hope”) puts the feeling before the thing hoped for.</text><text x="30" y="386.90000000000003" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Paine, The American Crisis</text><rect x="30" y="404.90000000000003" width="49.37457" height="37" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2" /><text x="54.687285" y="430.05" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">the</text><rect x="85.37457" y="404.90000000000003" width="120" height="37" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2" /><text x="145.37457" y="430.05" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">summer</text><text x="145.37457" y="463.40000000000003" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">noun as</text><text x="145.37457" y="481.70000000000005" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">modifier</text><rect x="211.37457" y="404.90000000000003" width="157.20527" height="37" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2" /><text x="289.977205" y="430.05" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">soldier and the</text><rect x="374.57984" y="404.90000000000003" width="120" height="37" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2" /><text x="434.57984" y="430.05" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">sunshine</text><text x="434.57984" y="463.40000000000003" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">noun as</text><text x="434.57984" y="481.70000000000005" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">modifier</text><rect x="500.57984" y="404.90000000000003" width="79.61022" height="37" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2" /><text x="540.38495" y="430.05" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">patriot</text><rect x="30" y="502.5" width="840" height="53.120000000000005" rx="14" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5" /><text x="450" y="534.1" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Two short modifiers carry a whole judgement: they serve only in fair weather.</text>
</svg>