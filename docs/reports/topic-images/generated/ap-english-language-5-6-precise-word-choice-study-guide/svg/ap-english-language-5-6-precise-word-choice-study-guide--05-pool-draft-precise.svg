<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 530" width="900" height="530" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="530" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Making a draft precise</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Worked example 1: repairing the public pool</text>
<text x="185" y="132" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle" xml:space="preserve">Vague (draft)</text><text x="620" y="132" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">Precise (what the writer knows)</text><rect x="60" y="148" width="250" height="48" rx="24" fill="#f6e3d8" stroke="#b5602e" stroke-width="2" /><text x="185" y="178" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">“bad state”</text><line x1="316" y1="172" x2="364" y2="172" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="370" y="148" width="500" height="48" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="384" y="177.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“falling apart” (a judgement the details must earn)</text><rect x="60" y="206" width="250" height="48" rx="24" fill="#f6e3d8" stroke="#b5602e" stroke-width="2" /><text x="185" y="236" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">“not nice”</text><line x1="316" y1="230" x2="364" y2="230" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="370" y="206" width="500" height="48" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="384" y="235.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">floor tiles are cracked</text><rect x="60" y="264" width="250" height="48" rx="24" fill="#f6e3d8" stroke="#b5602e" stroke-width="2" /><text x="185" y="294" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">“a lot of things... broken”</text><line x1="316" y1="288" x2="364" y2="288" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="370" y="264" width="500" height="48" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="384" y="293.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">two of the six showers do not work</text><rect x="60" y="322" width="250" height="48" rx="24" fill="#f6e3d8" stroke="#b5602e" stroke-width="2" /><text x="185" y="352" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">“problems”</text><line x1="316" y1="346" x2="364" y2="346" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="370" y="322" width="500" height="48" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="384" y="351.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">a ceiling tile fell last month</text><rect x="60" y="380" width="250" height="48" rx="24" fill="#f6e3d8" stroke="#b5602e" stroke-width="2" /><text x="185" y="410" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">“very unpleasant”</text><line x1="316" y1="404" x2="364" y2="404" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="370" y="380" width="500" height="48" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="384" y="409.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">a swimmer slipped on the <tspan font-weight="700">dangerously</tspan> wet floor</text><rect x="30" y="446" width="840" height="74.24000000000001" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="450" y="477.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">“<tspan font-weight="700">Dangerously</tspan>” qualifies the floor and conveys the writer’s concern: a modifier added only where it</text><text x="450" y="498.72" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">helps.</text>
</svg>