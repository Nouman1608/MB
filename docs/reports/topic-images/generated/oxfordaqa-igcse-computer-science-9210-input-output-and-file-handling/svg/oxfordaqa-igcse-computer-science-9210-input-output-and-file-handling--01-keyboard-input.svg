<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 586" width="900" height="586" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="586" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Keyboard input: prompt, then convert</text>

<rect x="30" y="130" width="250" height="150" rx="12" fill="#1e2a44" stroke="#1e2a44" stroke-width="2.5"/><rect x="120" y="280" width="70" height="20" fill="#4a5568"/><rect x="95" y="300" width="120" height="10" rx="4" fill="#4a5568"/><text x="50" y="164" font-size="15" font-weight="700" fill="#d4b02e" text-anchor="start">DISPLAY</text><text x="50" y="204" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="18" font-weight="400" fill="#ffffff" text-anchor="start">Enter your age</text><text x="50" y="240" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="20" font-weight="700" fill="#b5d3cf" text-anchor="start">16</text><rect x="78" y="222" width="12" height="22" fill="#b5d3cf"/><text x="155" y="346" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">1  Prompt first</text><text x="155" y="370" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">say what to type</text><line x1="290" y1="230" x2="340" y2="230" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="470" y="124" font-size="16" font-weight="700" fill="#4a5568" text-anchor="middle">USERINPUT</text><rect x="350" y="150" width="240" height="150" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="470" y="186" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">arrives as a String</text><text x="470" y="242" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="34" font-weight="700" fill="#1e2a44" text-anchor="middle">"16"</text><text x="470" y="280" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">characters, not a number</text><line x1="596" y1="230" x2="646" y2="230" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="656" y="150" width="214" height="150" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="763" y="186" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">converted: Integer</text><text x="763" y="242" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="34" font-weight="700" fill="#2e6b62" text-anchor="middle">16</text><text x="763" y="280" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">ready for arithmetic</text><text x="621" y="346" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">2  Convert numbers before arithmetic</text><rect x="30" y="400" width="840" height="90" rx="12" fill="#1e2a44"/><text x="48" y="430" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="19" font-weight="400" fill="#e8eef0" text-anchor="start">OUTPUT "Enter your age"</text><text x="48" y="462" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="19" font-weight="400" fill="#e8eef0" text-anchor="start">age ← STRING_TO_INT(USERINPUT)</text><text x="30" y="526" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Python:</text><text x="110" y="526" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">age = int(input("Enter your age: "))</text><text x="30" y="556" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">For a real number, use STRING_TO_REAL(USERINPUT).</text>
</svg>