<rect width="900" height="758" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: a high-score file</text>

<rect x="30" y="110" width="500" height="536" rx="12" fill="#1e2a44"/><text x="48" y="140" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="15" font-weight="400" fill="#e8eef0" text-anchor="start">OUTPUT "Enter your score"</text><text x="48" y="170" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="15" font-weight="400" fill="#e8eef0" text-anchor="start">newScore ← STRING_TO_INT(USERINPUT)</text><text x="48" y="200" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="15" font-weight="400" fill="#e8eef0" text-anchor="start"></text><text x="48" y="230" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="15" font-weight="400" fill="#e8eef0" text-anchor="start">file ← OPEN_FILE_APPEND("highscores.txt")</text><text x="48" y="260" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="15" font-weight="400" fill="#e8eef0" text-anchor="start">WRITE_LINE(file, INT_TO_STRING(newScore))</text><text x="48" y="290" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="15" font-weight="400" fill="#e8eef0" text-anchor="start">CLOSE_FILE(file)</text><text x="48" y="320" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="15" font-weight="400" fill="#e8eef0" text-anchor="start"></text><text x="48" y="350" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="15" font-weight="400" fill="#e8eef0" text-anchor="start">best ← 0</text><text x="48" y="380" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="15" font-weight="400" fill="#e8eef0" text-anchor="start">file ← OPEN_FILE_READ("highscores.txt")</text><text x="48" y="410" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="15" font-weight="400" fill="#e8eef0" text-anchor="start">WHILE NOT END_OF_FILE(file)</text><text x="66" y="440" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="15" font-weight="400" fill="#e8eef0" text-anchor="start">score ← STRING_TO_INT(READ_LINE(file))</text><text x="66" y="470" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="15" font-weight="400" fill="#e8eef0" text-anchor="start">IF score > best THEN</text><text x="84" y="500" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="15" font-weight="400" fill="#e8eef0" text-anchor="start">best ← score</text><text x="66" y="530" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="15" font-weight="400" fill="#e8eef0" text-anchor="start">ENDIF</text><text x="48" y="560" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="15" font-weight="400" fill="#e8eef0" text-anchor="start">ENDWHILE</text><text x="48" y="590" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="15" font-weight="400" fill="#e8eef0" text-anchor="start">CLOSE_FILE(file)</text><text x="48" y="620" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="15" font-weight="400" fill="#e8eef0" text-anchor="start">OUTPUT "Best score: " + INT_TO_STRING(best)</text><rect x="536" y="122" width="6" height="60" rx="3" fill="#8a6d0d"/><rect x="552" y="116" width="318" height="76" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="570" y="146" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Input and convert</text><text x="570" y="172" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">string to integer</text><rect x="536" y="212" width="6" height="90" rx="3" fill="#2e6b62"/><rect x="552" y="219" width="318" height="76" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="570" y="249" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Append and close</text><text x="570" y="275" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">earlier scores kept; integer back to string</text><rect x="536" y="332" width="6" height="240" rx="3" fill="#2b5a9a"/><rect x="552" y="414" width="318" height="76" rx="12" fill="#dfe7f3" stroke="#2b5a9a" stroke-width="2.5"/><text x="570" y="444" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Read every line</text><text x="570" y="470" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">loop to end of file; convert each line</text><rect x="536" y="572" width="6" height="60" rx="3" fill="#8a6d0d"/><rect x="552" y="566" width="318" height="76" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="570" y="596" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Close, then output</text><text x="570" y="622" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">with a label</text><rect x="30" y="664" width="840" height="64" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="704" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">The file is closed before it is opened again for reading.</text>
</svg>