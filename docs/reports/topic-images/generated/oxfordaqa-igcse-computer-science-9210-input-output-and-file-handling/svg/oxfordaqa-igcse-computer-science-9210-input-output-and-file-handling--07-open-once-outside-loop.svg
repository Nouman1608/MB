<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" width="900" height="760" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="760" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: writing a table</text>

<rect x="30" y="110" width="840" height="176" rx="12" fill="#1e2a44"/><text x="48" y="140" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="16" font-weight="700" fill="#d4b02e" text-anchor="start">file ← OPEN_FILE_WRITE("seven.txt")</text><text x="48" y="170" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="16" font-weight="400" fill="#e8eef0" text-anchor="start">FOR i ← 1 TO 12</text><text x="67.2" y="200" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="16" font-weight="400" fill="#e8eef0" text-anchor="start">WRITE_LINE(file, INT_TO_STRING(i) + " x 7 = " + INT_TO_STRING(i * 7))</text><text x="48" y="230" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="16" font-weight="400" fill="#e8eef0" text-anchor="start">ENDFOR</text><text x="48" y="260" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="16" font-weight="700" fill="#d4b02e" text-anchor="start">CLOSE_FILE(file)</text><rect x="30" y="310" width="411" height="420" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="54" y="346" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Open once before, close once after</text><path d="M70,366 H372 L400,394 V706 H70 Z" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><path d="M372,366 V394 H400" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><text x="84" y="392" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">seven.txt</text><text x="84" y="424" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">1 x 7 = 7</text><text x="84" y="462" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">2 x 7 = 14</text><text x="84" y="500" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">3 x 7 = 21</text><text x="84" y="538" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">4 x 7 = 28</text><text x="84" y="576" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">…</text><text x="84" y="614" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">11 x 7 = 77</text><text x="84" y="652" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">12 x 7 = 84</text><text x="380" y="694" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="end">12 lines</text><rect x="459" y="310" width="411" height="420" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="483" y="346" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">Open in write mode inside the loop</text><path d="M499,366 H801 L829,394 V506 H499 Z" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><path d="M801,366 V394 H829" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><text x="513" y="392" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">seven.txt</text><text x="513" y="424" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">12 x 7 = 84</text><text x="483" y="550" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">Each pass wipes the file, so only the last</text><text x="483" y="572" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">line survives.</text>
</svg>