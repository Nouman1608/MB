<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="700" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Reading a text file in four steps</text>

<rect x="30" y="110" width="360" height="560" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="90" y="140" width="240" height="56" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="210" y="174" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">1  Open for reading</text><line x1="210" y1="196" x2="210" y2="236" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><path d="M210,242 L330,312 L210,382 L90,312 Z" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><text x="210" y="306" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">2  End of</text><text x="210" y="328" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">file?</text><line x1="210" y1="382" x2="210" y2="430" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><text x="224" y="414" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">no</text><rect x="90" y="430" width="240" height="56" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="210" y="464" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">3  Read a line, process it</text><path d="M90,458 L56,458 L56,212 L204,212" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><path d="M330,312 L364,312 L364,560 L338,560" fill="none" stroke="#b5602e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahR)"/><text x="342" y="300" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">yes</text><rect x="90" y="532" width="240" height="56" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="210" y="566" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">4  Close the file</text><text x="210" y="630" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">an empty file: zero reads</text><rect x="410" y="110" width="460" height="326" rx="12" fill="#1e2a44"/><text x="428" y="140" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="16" font-weight="400" fill="#e8eef0" text-anchor="start">total ← 0</text><text x="428" y="170" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="16" font-weight="400" fill="#e8eef0" text-anchor="start">count ← 0</text><text x="428" y="200" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="16" font-weight="700" fill="#d4b02e" text-anchor="start">file ← OPEN_FILE_READ("scores.txt")</text><text x="428" y="230" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="16" font-weight="700" fill="#d4b02e" text-anchor="start">WHILE NOT END_OF_FILE(file)</text><text x="447.2" y="260" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="16" font-weight="700" fill="#d4b02e" text-anchor="start">line ← READ_LINE(file)</text><text x="447.2" y="290" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="16" font-weight="400" fill="#e8eef0" text-anchor="start">total ← total + STRING_TO_INT(line)</text><text x="447.2" y="320" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="16" font-weight="400" fill="#e8eef0" text-anchor="start">count ← count + 1</text><text x="428" y="350" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="16" font-weight="400" fill="#e8eef0" text-anchor="start">ENDWHILE</text><text x="428" y="380" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="16" font-weight="700" fill="#d4b02e" text-anchor="start">CLOSE_FILE(file)</text><text x="428" y="410" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="16" font-weight="400" fill="#e8eef0" text-anchor="start">OUTPUT total / count</text><rect x="410" y="452" width="460" height="218" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="430" y="482" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Command names are illustrative: the exam judges the</text><text x="430" y="503" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">logic.</text><text x="430" y="536" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">Robust version: check count > 0 before dividing, or an</text><text x="430" y="557" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">empty file divides by zero.</text>
</svg>