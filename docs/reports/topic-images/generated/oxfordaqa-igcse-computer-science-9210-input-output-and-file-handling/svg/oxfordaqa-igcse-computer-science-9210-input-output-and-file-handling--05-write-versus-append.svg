<text x="150" y="140" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Before</text><path d="M40,160 H232 L260,188 V300 H40 Z" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><path d="M232,160 V188 H260" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><text x="54" y="186" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">log.txt</text><text x="54" y="218" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">existing line 1</text><text x="54" y="244" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">existing line 2</text><line x1="270" y1="230" x2="330" y2="200" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="270" y1="230" x2="330" y2="420" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="340" y="110" width="530" height="210" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="364" y="146" font-size="20" font-weight="700" fill="#b5602e" text-anchor="start">Write mode</text><text x="520" y="146" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">OPEN_FILE_WRITE   Python "w"</text><path d="M364,166 H556 L584,194 V296 H364 Z" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><path d="M556,166 V194 H584" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><text x="378" y="192" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">log.txt</text><text x="378" y="224" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">new line</text><text x="610" y="200" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Replaces everything in the</text><text x="610" y="222" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">file</text><text x="610" y="256" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">For saving the current state, e.g.</text><text x="610" y="276" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">a whole settings file</text><rect x="340" y="334" width="530" height="230" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="364" y="370" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Append mode</text><text x="520" y="370" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">OPEN_FILE_APPEND  Python "a"</text><path d="M364,390 H556 L584,418 V540 H364 Z" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><path d="M556,390 V418 H584" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><text x="378" y="416" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">log.txt</text><text x="378" y="448" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">existing line 1</text><text x="378" y="474" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">existing line 2</text><text x="378" y="500" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">new line</text><text x="610" y="424" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Adds new lines to the end</text><text x="610" y="470" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">For logs, or adding one new high</text><text x="610" y="490" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">score</text><rect x="30" y="588" width="840" height="116" rx="12" fill="#1e2a44"/><text x="48" y="618" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="18" font-weight="400" fill="#e8eef0" text-anchor="start">file ← OPEN_FILE_APPEND("log.txt")</text><text x="48" y="648" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="18" font-weight="400" fill="#e8eef0" text-anchor="start">WRITE_LINE(file, "Login by " + username)</text><text x="48" y="678" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="18" font-weight="400" fill="#e8eef0" text-anchor="start">CLOSE_FILE(file)</text><text x="30" y="740" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">End each line with a newline ("\n" in Python), and close the file so the data is saved.</text>
