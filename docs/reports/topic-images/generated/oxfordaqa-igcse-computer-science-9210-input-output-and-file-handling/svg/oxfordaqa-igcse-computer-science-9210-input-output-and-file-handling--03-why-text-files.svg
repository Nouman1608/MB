<rect width="900" height="624" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why use a text file?</text>

<rect x="30" y="110" width="400" height="300" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="230" y="148" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Variables (in the running program)</text><rect x="60" y="176" width="100" height="60" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="110" y="212" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">score</text><rect x="180" y="176" width="100" height="60" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="230" y="212" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">name</text><rect x="300" y="176" width="100" height="60" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="350" y="212" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">level</text><rect x="60" y="268" width="340" height="110" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="9 7"/><text x="230" y="312" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">Program ends:</text><text x="230" y="342" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">the values are lost</text><line x1="440" y1="260" x2="500" y2="260" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><text x="470" y="240" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">save</text><rect x="510" y="110" width="360" height="300" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="690" y="148" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Text file on secondary storage</text><path d="M560,170 H792 L820,198 V340 H560 Z" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><path d="M792,170 V198 H820" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><text x="574" y="196" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">scores.txt</text><text x="574" y="228" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">lines of characters</text><text x="574" y="254" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">…</text><text x="574" y="280" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">…</text><text x="690" y="380" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">still there next time; can be shared</text><rect x="30" y="434" width="196.5" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128.25" y="480.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">High scores</text><rect x="244.5" y="434" width="196.5" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="342.75" y="480.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Event logs</text><rect x="459" y="434" width="196.5" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="557.25" y="480.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Settings</text><rect x="673.5" y="434" width="196.5" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="771.75" y="468.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Word or question</text><text x="771.75" y="492.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">lists</text><rect x="30" y="534" width="840" height="60" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="572" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Numbers read from a text file are strings until converted, just like keyboard input.</text>
</svg>