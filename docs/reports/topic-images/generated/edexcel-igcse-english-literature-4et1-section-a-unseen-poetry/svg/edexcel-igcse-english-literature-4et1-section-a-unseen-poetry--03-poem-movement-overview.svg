<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" width="900" height="580" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="580" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Follow the poem’s movement</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Question: how is the speaker’s relationship with her mother presented?</text>
<rect x="30" y="120" width="260" height="250" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="154" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Stanza 1</text><text x="270" y="154" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">4 lines</text><rect x="50" y="172" width="200" height="10" rx="5" fill="#dce9e7" stroke="#2e6b62" stroke-width="1.5"/><rect x="50" y="194" width="170" height="10" rx="5" fill="#dce9e7" stroke="#2e6b62" stroke-width="1.5"/><rect x="50" y="216" width="200" height="10" rx="5" fill="#dce9e7" stroke="#2e6b62" stroke-width="1.5"/><rect x="50" y="238" width="170" height="10" rx="5" fill="#dce9e7" stroke="#2e6b62" stroke-width="1.5"/><text x="50" y="280" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Close observation of the</text><text x="50" y="301" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">mother coming home</text><line x1="294" y1="245" x2="316" y2="245" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="320" y="120" width="260" height="250" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="340" y="154" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Stanza 2</text><text x="560" y="154" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">4 lines</text><rect x="340" y="172" width="200" height="10" rx="5" fill="#b5d3cf" stroke="#2e6b62" stroke-width="1.5"/><rect x="340" y="194" width="170" height="10" rx="5" fill="#b5d3cf" stroke="#2e6b62" stroke-width="1.5"/><rect x="340" y="216" width="200" height="10" rx="5" fill="#b5d3cf" stroke="#2e6b62" stroke-width="1.5"/><rect x="340" y="238" width="170" height="10" rx="5" fill="#b5d3cf" stroke="#2e6b62" stroke-width="1.5"/><text x="340" y="280" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Side by side in the</text><text x="340" y="301" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">kitchen, on different</text><text x="340" y="322" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">timetables</text><line x1="584" y1="245" x2="606" y2="245" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="610" y="120" width="260" height="250" rx="14" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="630" y="154" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="start">Stanza 3</text><text x="850" y="154" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">2 lines</text><rect x="630" y="172" width="200" height="10" rx="5" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="1.5"/><rect x="630" y="194" width="170" height="10" rx="5" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="1.5"/><text x="630" y="280" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">She is gone; the child</text><text x="630" y="301" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">adapts to her world</text><text x="680" y="248" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">shorter:</text><text x="680" y="266" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">abrupt ending</text><rect x="30" y="396" width="840" height="160" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="429" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">OVERVIEW</text><text x="50" y="455.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">A loving but disconnected relationship: mother and child live side by</text><text x="50" y="480.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">side on different timetables.</text><text x="50" y="509.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The poem moves from close observation to an ending in which the child adapts to the</text><text x="50" y="531.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">mother’s world.</text>
</svg>