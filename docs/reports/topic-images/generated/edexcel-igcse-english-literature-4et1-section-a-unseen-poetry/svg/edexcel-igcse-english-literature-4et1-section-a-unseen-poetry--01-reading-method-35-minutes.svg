<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 823" width="900" height="823" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="823" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A reading method for 35 minutes</text>

<text x="30" y="138" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">Minutes</text><rect x="30" y="150" width="72" height="60" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="66" y="177" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Read</text><text x="66" y="198" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">3</text><rect x="102" y="150" width="120" height="60" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="162" y="177" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Annotate</text><text x="162" y="198" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">5</text><rect x="222" y="150" width="48" height="60" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><rect x="270" y="150" width="528" height="60" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="534" y="177" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Write</text><text x="534" y="198" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">22</text><rect x="798" y="150" width="72" height="60" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="834" y="177" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Reread</text><text x="834" y="198" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">2–3</text><text x="246" y="234" font-size="15" font-weight="600" fill="#8a6d0d" text-anchor="middle">turn, overview, plan</text><path d="M246,212 L246,218" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><line x1="62" y1="276" x2="62" y2="779" stroke="#c9d6d4" stroke-width="4"/><rect x="108" y="256" width="762" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="291.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">First read, for sense</text><text x="128" y="319.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Who is speaking, to whom, about what? The mood at the start and the end. Read the title</text><text x="128" y="340.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">as part of the poem.</text><circle cx="62" cy="310.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="319.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="108" y="375" width="762" height="109" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="128" y="410.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Find the turn</text><text x="128" y="438.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A “but” or “yet”, a change of tense, a stanza that looks different, a final line set</text><text x="128" y="459.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">apart.</text><circle cx="62" cy="429.5" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="62" y="438.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="108" y="494" width="762" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="529.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Second read, annotating</text><text x="128" y="557.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Six to eight short details. Next to each, write the effect, not just the technique.</text><circle cx="62" cy="538" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="546.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="108" y="592" width="762" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="627.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Decide your overview</text><text x="128" y="655.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">“The poet presents X as Y, and the poem moves from A to B.”</text><circle cx="62" cy="636" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="644.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="108" y="690" width="762" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="725.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Plan, write, reread</text><text x="128" y="753.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Three or four paragraphs following the poem’s movement, each mixing language, form and</text><text x="128" y="774.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">structure.</text><circle cx="62" cy="744.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="753.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text>
</svg>