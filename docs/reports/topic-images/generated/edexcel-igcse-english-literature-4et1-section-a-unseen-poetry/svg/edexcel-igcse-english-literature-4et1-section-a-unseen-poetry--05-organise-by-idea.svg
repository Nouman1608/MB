<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Organise by idea, not by technique</text>

<circle cx="48" cy="128" r="15" fill="#b5602e"/><path d="M42,122 l12,12 m0,-12 l-12,12" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><text x="74" y="135" font-size="20" font-weight="700" fill="#b5602e" text-anchor="start">A technique checklist</text><circle cx="488" cy="128" r="15" fill="#2e6b62"/><path d="M481.25,128.3 l4.8,5.1000000000000005 l9,-9.9" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><text x="514" y="135" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Paragraphs built on ideas</text><rect x="30" y="158" width="400" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="192" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Paragraph 1: language</text><rect x="50" y="214" width="95" height="31" rx="15.5" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="97.5" y="234.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Language</text><rect x="30" y="284" width="400" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="318" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Paragraph 2: form</text><rect x="50" y="340" width="61" height="31" rx="15.5" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="80.5" y="360.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Form</text><rect x="30" y="410" width="400" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="444" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Paragraph 3: structure</text><rect x="50" y="466" width="104" height="31" rx="15.5" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="102" y="486.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Structure</text><rect x="470" y="158" width="400" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="490" y="192" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Close in space, apart in time</text><rect x="490" y="214" width="95" height="31" rx="15.5" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="537.5" y="234.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Language</text><rect x="595" y="214" width="104" height="31" rx="15.5" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="647" y="234.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Structure</text><rect x="709" y="214" width="61" height="31" rx="15.5" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="739.5" y="234.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Form</text><rect x="470" y="284" width="400" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="490" y="318" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Two matching silences</text><rect x="490" y="340" width="95" height="31" rx="15.5" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="537.5" y="360.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Language</text><rect x="595" y="340" width="104" height="31" rx="15.5" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="647" y="360.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Structure</text><rect x="470" y="410" width="400" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="490" y="444" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The ending: a reversed day</text><rect x="490" y="466" width="61" height="31" rx="15.5" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="520.5" y="486.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Form</text><rect x="561" y="466" width="95" height="31" rx="15.5" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="608.5" y="486.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Language</text><rect x="30" y="542" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="575.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Work through the poem in order while grouping points by idea, so you do not miss the turn</text><text x="50" y="597.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">or the ending.</text>
</svg>