<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="540" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">From feature-spotting to analysis</text>

<rect x="30" y="120" width="840" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="155.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Feature-spotting</text><text x="50" y="183.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“The poet uses enjambment in stanza 2.”</text><rect x="681" y="136" width="173" height="31" rx="15.5" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="767.5" y="156.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">names a technique</text><line x1="60" y1="210" x2="110" y2="234" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><rect x="100" y="236" width="770" height="88" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="120" y="271.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Explained</text><text x="120" y="299.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“Enjambment after ‘I’ makes the reader pause on the speaker.”</text><rect x="707" y="252" width="147" height="31" rx="15.5" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="780.5" y="272.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">adds an effect</text><line x1="130" y1="326" x2="180" y2="350" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><rect x="170" y="352" width="700" height="130" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="190" y="387.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Analysed, linked to the question</text><text x="190" y="415.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“Breaking ‘I / do not ask’ across the line leaves the speaker stranded at the</text><text x="190" y="436.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">line’s edge, so the form enacts how isolated she feels even in her mother’s</text><text x="190" y="457.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">company.”</text><rect x="604" y="368" width="250" height="31" rx="15.5" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="729" y="388.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">method + effect + question</text><text x="450" y="514" font-size="17" font-weight="600" fill="#8a6d0d" text-anchor="middle">Only the third connects the method, its effect and the focus of the question.</text>
</svg>