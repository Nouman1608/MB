<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 742" width="900" height="742" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="742" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Annotating an unseen poem</text>

<rect x="30" y="110" width="478" height="456" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="142" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Night Shift</text><text x="50" y="176" font-size="17" fill="#1e2a44" xml:space="preserve"><tspan>My mother comes home as the street wakes up,</tspan></text><text x="50" y="210" font-size="17" fill="#1e2a44" xml:space="preserve"><tspan>her coat still cold with the hours she has kept,</tspan></text><text x="50" y="244" font-size="17" fill="#1e2a44" xml:space="preserve"><tspan>and puts the kettle on as if the day</tspan></text><text x="50" y="278" font-size="17" fill="#1e2a44" xml:space="preserve"><tspan>were something she could boil and pour and drink.</tspan></text><text x="50" y="330" font-size="17" fill="#1e2a44" xml:space="preserve"><tspan fill="#b5602e" font-weight="700">She does not ask</tspan><tspan> about my homework. </tspan><tspan fill="#b5602e" font-weight="700">I</tspan></text><text x="50" y="364" font-size="17" fill="#1e2a44" xml:space="preserve"><tspan fill="#b5602e" font-weight="700">do not ask</tspan><tspan> about the ward. We </tspan><tspan fill="#b5602e" font-weight="700">share</tspan></text><text x="50" y="398" font-size="17" fill="#1e2a44" xml:space="preserve"><tspan>the kitchen </tspan><tspan fill="#b5602e" font-weight="700">like two clocks set to different towns</tspan><tspan>,</tspan></text><text x="50" y="432" font-size="17" fill="#1e2a44" xml:space="preserve"><tspan>both right, both ticking, neither of us </tspan><tspan fill="#b5602e" font-weight="700">there</tspan><tspan>.</tspan></text><text x="50" y="484" font-size="17" fill="#1e2a44" xml:space="preserve"><tspan>Then she is gone upstairs. </tspan><tspan fill="#b5602e" font-weight="700">The curtains close</tspan></text><text x="50" y="518" font-size="17" fill="#1e2a44" xml:space="preserve"><tspan fill="#b5602e" font-weight="700">on morning</tspan><tspan>. I eat my breakfast in her dark.</tspan></text><circle cx="456" cy="324" r="12" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="456" y="329" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><circle cx="484" cy="324" r="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="484" y="329" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><circle cx="456" cy="358" r="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="456" y="363" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><circle cx="484" cy="358" r="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="484" y="363" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><circle cx="484" cy="392" r="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="484" y="397" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><circle cx="484" cy="426" r="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="484" y="431" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><circle cx="456" cy="478" r="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="456" y="483" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><circle cx="484" cy="478" r="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="484" y="483" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">6</text><circle cx="456" cy="512" r="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="456" y="517" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><circle cx="484" cy="512" r="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="484" y="517" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">6</text><rect x="530" y="110" width="340" height="90" rx="14" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="542" y="135" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">1 · STRUCTURE</text><text x="542" y="164" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">The line break leaves “I” isolated: the</text><text x="542" y="184" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">speaker is left on her own.</text><rect x="530" y="208" width="340" height="90" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="542" y="233" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">2 · LANGUAGE</text><text x="542" y="262" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Matching negatives balance two silences:</text><text x="542" y="282" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">a shared habit, not blame.</text><rect x="530" y="306" width="340" height="90" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="542" y="331" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">3 · LANGUAGE</text><text x="542" y="360" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Simile: both work properly, yet they</text><text x="542" y="380" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">cannot meet.</text><rect x="530" y="404" width="340" height="90" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="542" y="429" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">4 · FORM</text><text x="542" y="458" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">The rhyme “share” / “there” links them,</text><text x="542" y="478" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">but the meaning undercuts the sharing.</text><rect x="530" y="502" width="340" height="90" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="542" y="527" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">5 · FORM</text><text x="542" y="556" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Two lines, not four: an abrupt ending,</text><text x="542" y="576" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">like the mother’s sudden exit.</text><rect x="530" y="600" width="340" height="90" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="542" y="625" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">6 · LANGUAGE</text><text x="542" y="654" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Paradox: “the curtains close / on</text><text x="542" y="674" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">morning”, a reversed day.</text><text x="30" y="720" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Original poem written for the guide; highlighted words are the details analysed.</text>
</svg>