<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 570" width="900" height="570" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="570" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: density from centimetres</text>

<rect x="30" y="110" width="840" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M110,380 h250 v-100 h-250 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.5"/><path d="M110,280 l96,-72 h250 l-96,72 Z" fill="#eef4f3" stroke="#1e2a44" stroke-width="2.5"/><path d="M360,380 l96,-72 v-100 l-96,72 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="235" y="410" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">5.0 cm</text><text x="90" y="335" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">2.0 cm</text><text x="420" y="300" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">4.0 cm</text><text x="250" y="172" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">mass 108 g</text><rect x="480" y="150" width="360" height="270" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="500" y="190" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">V = 5.0 × 4.0 × 2.0 = 40 cm³</text><text x="500" y="224" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">   = 40 × 10⁻⁶ m³</text><text x="500" y="258" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">   = 4.0 × 10⁻⁵ m³</text><text x="500" y="292" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">m = 108 g = 0.108 kg</text><text x="500" y="326" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">ρ = 0.108 / 4.0 × 10⁻⁵</text><rect x="500" y="360" width="320" height="46" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="660" y="391" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">ρ = 2700 kg/m³</text><rect x="30" y="460" width="840" height="90" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="502" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Shortcut check: 108 ÷ 40 = 2.7 g/cm³, then × 1000 = 2700 kg/m³</text><text x="450" y="532" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">(a solid in kg/m³ is usually in the thousands)</text>
</svg>