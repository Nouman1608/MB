<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 630" width="900" height="630" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="630" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Celsius and kelvin</text>

<rect x="30" y="110" width="840" height="500" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="232" y="150" width="36" height="400" rx="18" fill="#f4f4f4" stroke="#1e2a44" stroke-width="2.5"/><rect x="502" y="150" width="36" height="400" rx="18" fill="#f4f4f4" stroke="#1e2a44" stroke-width="2.5"/><text x="250" y="140" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">°C</text><text x="520" y="140" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">K</text><line x1="220" y1="540" x2="550" y2="540" stroke="#4a5568" stroke-width="1.5" stroke-dasharray="5 5"/><text x="216" y="546" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">−273 °C</text><text x="554" y="546" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">0 K</text><text x="640" y="546" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">absolute zero</text><line x1="220" y1="261.87667560321717" x2="550" y2="261.87667560321717" stroke="#4a5568" stroke-width="1.5" stroke-dasharray="5 5"/><text x="216" y="267.87667560321717" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">0 °C</text><text x="554" y="267.87667560321717" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">273 K</text><text x="640" y="267.87667560321717" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">ice melts</text><line x1="220" y1="160" x2="550" y2="160" stroke="#4a5568" stroke-width="1.5" stroke-dasharray="5 5"/><text x="216" y="166" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">100 °C</text><text x="554" y="166" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">373 K</text><text x="640" y="166" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">water boils</text><rect x="600" y="330" width="250" height="200" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="618" y="366" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">T (K) = θ (°C) + 273</text><text x="618" y="396" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">θ (°C) = T (K) − 273</text><text x="618" y="440" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">1 K is the same size</text><text x="618" y="462" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">as 1 °C: a rise of 30 °C</text><text x="618" y="484" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">is a rise of 30 K.</text><text x="450" y="590" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Unit symbol K, with no degree sign. Gas laws need kelvin.</text>
</svg>