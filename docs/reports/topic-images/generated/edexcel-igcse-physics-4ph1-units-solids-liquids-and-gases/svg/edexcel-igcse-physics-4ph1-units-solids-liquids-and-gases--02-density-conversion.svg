<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="600" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Density: g/cm³ to kg/m³</text>

<rect x="30" y="110" width="840" height="300" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="150" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Why g/cm³ × 1000 = kg/m³</text><rect x="70" y="190" width="330" height="90" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="235" y="228" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">mass: g → kg</text><text x="235" y="260" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">number ÷ 1000</text><rect x="500" y="190" width="330" height="90" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="665" y="228" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">volume: cm³ → m³</text><text x="665" y="260" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">number ÷ 1 000 000</text><text x="450" y="330" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">density = mass ÷ volume: dividing by a million beats dividing by a thousand,</text><text x="450" y="360" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">so the density number gets 1000 times bigger.</text><rect x="30" y="430" width="840" height="150" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="250" y="480" font-size="28" font-weight="700" fill="#1e2a44" text-anchor="middle">2.7 g/cm³</text><line x1="370" y1="470" x2="520" y2="470" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><text x="445" y="458" font-size="18" font-weight="700" fill="#2b5a9a" text-anchor="middle">× 1000</text><text x="670" y="480" font-size="28" font-weight="700" fill="#1e2a44" text-anchor="middle">2700 kg/m³</text><text x="450" y="545" font-size="18" font-weight="600" fill="#8a6d0d" text-anchor="middle">Sense check: water is 1.0 g/cm³ = 1000 kg/m³.</text>
</svg>