<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 715" width="900" height="715" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="715" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: pressure on a tiny area</text>

<rect x="30" y="110" width="840" height="290" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="120" y="170" width="26" height="150" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><path d="M146,236 L560,236 L600,245 L560,254 L146,254 Z" fill="#c9d3e3" stroke="#1e2a44" stroke-width="2.5"/><line x1="50" y1="245" x2="112" y2="245" stroke="#b5602e" stroke-width="6" marker-end="url(#ahR)"/><text x="50" y="225" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">20 N</text><rect x="610" y="150" width="40" height="190" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.5"/><text x="630" y="365" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">board</text><text x="133" y="158" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">head 1.0 cm²</text><text x="600" y="215" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">point 0.10 mm²</text><text x="680" y="220" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Same force on</text><text x="680" y="241" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">both ends</text><rect x="30" y="420" width="410" height="240" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="60" y="458" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Head (on thumb)</text><text x="60" y="496" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">A = 1.0 cm² = 1.0 × 10⁻⁴ m²</text><text x="60" y="528" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">p = 20 / 1.0 × 10⁻⁴</text><text x="60" y="600" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="start">p = 2.0 × 10⁵ Pa</text><rect x="460" y="420" width="410" height="240" rx="14" fill="#fbeee6" stroke="#b5602e" stroke-width="2.5"/><text x="490" y="458" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">Point (on board)</text><text x="490" y="496" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">A = 0.10 mm² = 1.0 × 10⁻⁷ m²</text><text x="490" y="528" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">p = 20 / 1.0 × 10⁻⁷</text><text x="490" y="600" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="start">p = 2.0 × 10⁸ Pa</text><text x="450" y="690" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">A thousand times greater pressure at the point: it pierces the board, not your thumb.</text>
</svg>