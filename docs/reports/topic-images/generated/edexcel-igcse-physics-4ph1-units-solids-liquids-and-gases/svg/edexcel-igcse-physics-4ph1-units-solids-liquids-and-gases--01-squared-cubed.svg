680" width="160" height="42" rx="8" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="140" y="708" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">0.10 mm²</text><line x1="230" y1="701" x2="520" y2="701" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="375" y="694" font-size="17" font-weight="700" fill="#2b5a9a" text-anchor="middle">÷ 1 000 000</text><text x="540" y="708" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">1.0 × 10⁻⁷ m²</text><rect x="60" y="734" width="160" height="42" rx="8" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="140" y="762" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">40 cm³</text><line x1="230" y1="755" x2="520" y2="755" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="375" y="748" font-size="17" font-weight="700" fill="#2b5a9a" text-anchor="middle">÷ 1 000 000</text><text x="540" y="762" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">4.0 × 10⁻⁵ m³</text><text x="840" y="790" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">mm² to m²: ÷ 1000²</text>
