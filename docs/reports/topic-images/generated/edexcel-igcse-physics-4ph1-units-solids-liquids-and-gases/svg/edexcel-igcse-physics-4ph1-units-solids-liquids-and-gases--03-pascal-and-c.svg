<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" width="900" height="760" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="760" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Building the pascal and J/kg °C</text>

<rect x="30" y="110" width="840" height="260" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M110,330 h200 v-30 h-200 Z" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><path d="M110,300 l108,-81 h200 l-108,81 Z" fill="#eef4f3" stroke="#1e2a44" stroke-width="2.5"/><path d="M310,330 l108,-81 v-30 l-108,81 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><line x1="210" y1="160" x2="210" y2="270" stroke="#b5602e" stroke-width="6" marker-end="url(#ahR)"/><text x="228" y="196" font-size="20" font-weight="700" fill="#b5602e" text-anchor="start">1 N</text><text x="230" y="360" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">spread over 1 m²</text><rect x="450" y="170" width="390" height="150" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="645" y="222" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">p = F / A</text><text x="645" y="268" font-size="26" font-weight="700" fill="#2e6b62" text-anchor="middle">1 Pa = 1 N/m²</text><text x="645" y="302" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">1 kPa = 1000 Pa</text><rect x="30" y="390" width="840" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="428" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Unit check for pressure in a liquid</text><text x="60" y="476" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="start">p = h × ρ × g</text><text x="330" y="476" font-size="22" font-weight="600" fill="#2b5a9a" text-anchor="start">m × kg/m³ × N/kg = N/m² = Pa</text><text x="60" y="530" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Depth in m, density in kg/m³, g in N/kg: the answer must come out in pascals.</text><rect x="30" y="580" width="840" height="160" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="60" y="618" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Specific heat capacity (P)</text><text x="60" y="662" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">c = ΔQ / (m × ΔT)</text><text x="400" y="662" font-size="22" font-weight="600" fill="#2b5a9a" text-anchor="start">J / (kg × °C) = J/kg °C</text><text x="60" y="710" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Water: 4200 J/kg °C means 4200 J raises 1 kg of water by 1 °C.</text>
</svg>