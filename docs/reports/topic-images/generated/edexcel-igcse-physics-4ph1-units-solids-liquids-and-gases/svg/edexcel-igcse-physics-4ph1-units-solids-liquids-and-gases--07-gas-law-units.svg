<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 730" width="900" height="730" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="730" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Gas laws: which units matter</text>

<rect x="30" y="110" width="840" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="148" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Constant temperature: p₁V₁ = p₂V₂</text><text x="60" y="190" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">100 kPa at 60 cm³, compressed to 25 cm³</text><text x="60" y="222" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">100 × 60 = p₂ × 25</text><rect x="560" y="170" width="280" height="56" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="700" y="206" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">p₂ = 240 kPa</text><text x="60" y="300" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="start">Volume on both sides: any unit works if both volumes match;</text><text x="60" y="328" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="start">the answer comes out in the pressure unit you put in.</text><rect x="30" y="380" width="840" height="330" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="60" y="418" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Pressure and temperature: p₁/T₁ = p₂/T₂ needs kelvin</text><text x="60" y="452" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Sealed gas at 150 kPa heated from 20 °C to 80 °C</text><rect x="60" y="472" width="370" height="150" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="80" y="506" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">✓ kelvin</text><text x="80" y="540" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">20 °C = 293 K,  80 °C = 353 K</text><text x="80" y="568" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">150 × 353 ÷ 293</text><text x="80" y="606" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">= 181 kPa</text><rect x="470" y="472" width="370" height="150" rx="12" fill="#fbeee6" stroke="#b5602e" stroke-width="2.5"/><text x="490" y="506" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">✗ Celsius</text><text x="490" y="540" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">150 × 80 ÷ 20</text><text x="490" y="606" font-size="22" font-weight="700" fill="#b5602e" text-anchor="start">= 600 kPa: wildly wrong</text><text x="450" y="680" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">The proportion only works from absolute zero, so T must be in kelvin.</text>
</svg>