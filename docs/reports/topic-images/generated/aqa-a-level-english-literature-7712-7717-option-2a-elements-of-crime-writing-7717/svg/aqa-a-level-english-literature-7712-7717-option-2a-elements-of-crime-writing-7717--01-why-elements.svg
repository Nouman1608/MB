<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 590" width="900" height="590" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="590" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why “elements” of crime writing?</text>

<line x1="60" y1="166" x2="840" y2="166" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="60" y="144" width="380" height="44" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="250" y="172" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">before the genre: e.g. Hamlet, the Mariner</text><circle cx="470" cy="166" r="13" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="470" y="132" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">mid-19th century:</text><text x="470" y="212" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">crime fiction emerges as a genre</text><text x="450" y="270" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">What every set text shares</text><rect x="30" y="288" width="269.3333333333333" height="120" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="164.66666666666666" y="338.9" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">A significant crime</text><text x="164.66666666666666" y="367.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">drives the narrative</text><rect x="315.3333333333333" y="288" width="269.3333333333333" height="120" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="316.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Execution and</text><text x="450" y="340.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">consequences</text><text x="450" y="368.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">are fundamental to how the</text><text x="450" y="389.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">text is structured</text><rect x="600.6666666666666" y="288" width="269.3333333333333" height="120" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="735.3333333333333" y="338.9" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Transgressions</text><text x="735.3333333333333" y="367.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">against established order</text><text x="30" y="448" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Laws broken:</text><rect x="160" y="428" width="104" height="33" rx="16.5" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="212" y="450.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">national</text><rect x="276" y="428" width="85" height="33" rx="16.5" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="318.5" y="450.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">social</text><rect x="373" y="428" width="114" height="33" rx="16.5" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="430" y="450.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">religious</text><rect x="499" y="428" width="75" height="33" rx="16.5" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="536.5" y="450.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">moral</text><rect x="30" y="482" width="840" height="84" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="516.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Not “is this a crime novel?” but “which elements of crime writing does this</text><text x="50" y="540.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">text use, and to what effect?”</text>
</svg>