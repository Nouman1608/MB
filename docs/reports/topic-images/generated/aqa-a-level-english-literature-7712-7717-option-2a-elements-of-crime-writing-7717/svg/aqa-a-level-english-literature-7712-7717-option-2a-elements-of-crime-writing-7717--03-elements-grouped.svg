<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 627" width="900" height="627" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="627" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The elements of crime writing, grouped</text>

<rect x="30" y="110" width="411" height="130" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="155.7" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The crime and the criminal</text><text x="50" y="184.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Type of crime text; crimes, criminals and</text><text x="50" y="205.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">motives. Pinkie Brown; Browning’s speakers.</text><rect x="459" y="110" width="411" height="130" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="479" y="145.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Detection and resolution</text><text x="479" y="173.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Investigator and nemesis; punishment;</text><text x="479" y="194.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">restoration of order. Poirot; Jackson Brodie;</text><text x="479" y="215.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Ida Arnold.</text><rect x="30" y="254" width="411" height="109" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="289.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Guilt and its aftermath</text><text x="50" y="317.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Guilt, confession, forgiveness. The Mariner’s</text><text x="50" y="338.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">retelling; Briony’s atonement; Claudius.</text><rect x="459" y="254" width="411" height="109" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="479" y="289.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Victims and justice</text><text x="479" y="317.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Suffering, trials, imprisonment, death.</text><text x="479" y="338.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Reading Gaol; Fagin in the condemned cell.</text><rect x="30" y="377" width="411" height="130" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="412.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Setting, structure, language</text><text x="50" y="440.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Backdrops, plotting, crises to order, legal</text><text x="50" y="461.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">registers. Dickens’s slums; Greene’s</text><text x="50" y="482.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Brighton; King’s Abbot.</text><rect x="459" y="377" width="411" height="130" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="479" y="422.7" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Society and audience</text><text x="479" y="451.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Comment on a historical period; “suspense,</text><text x="479" y="472.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">repugnance, excitement and relief”.</text><rect x="30" y="523" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="556.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">AQA lists elements that “might be explored, depending on the individual text”: use the ones</text><text x="50" y="578.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">your text actually has.</text>
</svg>