<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 722" width="900" height="722" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="722" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three passes through the unseen</text>

<rect x="30" y="110" width="257.3333333333333" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="137.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">1 Identify elements</text><text x="44" y="164" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Crime, criminal, victim,</text><text x="44" y="184" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">investigator, setting, guilt,</text><text x="44" y="204" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">justice. Note what is</text><text x="44" y="224" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">withheld.</text><line x1="293.3333333333333" y1="176" x2="315.3333333333333" y2="176" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="321.3333333333333" y="110" width="257.3333333333333" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="335.3333333333333" y="147.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">2 Analyse methods</text><text x="335.3333333333333" y="174" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Voice, viewpoint, register,</text><text x="335.3333333333333" y="194" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">imagery, structure; suspense</text><text x="335.3333333333333" y="214" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">or repugnance.</text><line x1="584.6666666666666" y1="176" x2="606.6666666666666" y2="176" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="612.6666666666666" y="110" width="257.3333333333333" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="626.6666666666666" y="157.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">3 Build an argument</text><text x="626.6666666666666" y="184" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">A reading of the elements’</text><text x="626.6666666666666" y="204" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">significance, not a list.</text><rect x="30" y="272" width="470" height="266" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="306" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">Original poem</text><rect x="44" y="320" width="8" height="30" rx="3" fill="#b5d3cf"/><text x="64" y="342" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">I told the magistrate the truth: the night</text><rect x="44" y="354" width="8" height="30" rx="3" fill="#b5d3cf"/><text x="64" y="376" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">was dark, the river high, my brother drunk.</text><rect x="44" y="388" width="8" height="30" rx="3" fill="#b5602e"/><text x="64" y="410" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">I did not say I held the lantern tight</text><rect x="44" y="422" width="8" height="30" rx="3" fill="#b5602e"/><text x="64" y="444" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">and walked ahead, and did not turn. He sunk</text><rect x="44" y="456" width="8" height="30" rx="3" fill="#b5602e"/><text x="64" y="478" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">without a sound.</text><rect x="52" y="508" width="8" height="20" rx="3" fill="#b5d3cf"/><text x="68" y="524" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">said to the magistrate</text><rect x="260" y="508" width="8" height="20" rx="3" fill="#b5602e"/><text x="276" y="524" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">not said</text><rect x="520" y="272" width="350" height="92" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="534" y="299.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Public testimony</text><text x="534" y="326" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Facts all true and all irrelevant: the</text><text x="534" y="346" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">legal register becomes a mask.</text><rect x="520" y="374" width="350" height="92" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="534" y="401.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Private guilt</text><text x="534" y="428" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">“I did not say”: the lantern withheld;</text><text x="534" y="448" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">“did not turn” makes inaction the act.</text><rect x="520" y="476" width="350" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="534" y="503.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Form</text><text x="534" y="530" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">The line break and short final sentence:</text><text x="534" y="550" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">a silence mirroring the drowning.</text><rect x="30" y="586" width="840" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="622" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">The argument</text><text x="50" y="651.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A crime of omission: a confession to the reader but not to the law, inviting both</text><text x="50" y="673.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">repugnance and a troubled sympathy.</text>
</svg>