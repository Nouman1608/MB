<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 521" width="900" height="521" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="521" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Five theories: key idea and limitation</text>

<rect x="30" y="104" width="180" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="42" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Theory</text><rect x="210" y="104" width="360" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="222" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Key idea</text><rect x="570" y="104" width="300" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="582" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Limitation</text><rect x="30" y="150" width="180" height="64" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="175.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Functionalism</text><rect x="210" y="150" width="360" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="222" y="175.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Some crime is normal; strain,</text><text x="222" y="196.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">subcultures, underclass</text><rect x="570" y="150" width="300" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="582" y="175.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Does not explain middle-class</text><text x="582" y="196.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">crime</text><rect x="30" y="214" width="180" height="64" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="239.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Interactionism</text><rect x="210" y="214" width="360" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="222" y="239.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Labels and moral panics create deviance</text><rect x="570" y="214" width="300" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="582" y="239.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Does not explain the first</text><text x="582" y="260.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">deviant act</text><rect x="30" y="278" width="180" height="64" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="303.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Marxism</text><rect x="210" y="278" width="360" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="222" y="303.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Capitalism breeds greed; selective</text><text x="222" y="324.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">enforcement (Box, 1983)</text><rect x="570" y="278" width="300" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="582" y="303.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Neglects working-class victims</text><rect x="30" y="342" width="180" height="85" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="367.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Feminism</text><rect x="210" y="342" width="360" height="85" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="222" y="367.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Women controlled more (Heidensohn);</text><text x="222" y="388.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">offend when rewards of conforming are</text><text x="222" y="409.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">missing (Carlen)</text><rect x="570" y="342" width="300" height="85" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="582" y="367.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">May treat women as one group</text><rect x="30" y="427" width="180" height="64" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="452.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Postmodernism</text><rect x="210" y="427" width="360" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="222" y="452.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Crime too varied for one cause;</text><text x="222" y="473.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">seductions (Katz), edgework (Lyng)</text><rect x="570" y="427" width="300" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="582" y="452.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">No single cause to guide policy</text>
</svg>