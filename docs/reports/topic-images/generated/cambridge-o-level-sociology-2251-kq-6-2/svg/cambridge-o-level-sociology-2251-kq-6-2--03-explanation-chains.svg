<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 576" width="900" height="576" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="576" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Writing explanations as chains</text>

<text x="154.66666666666669" y="124" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Cause</text><text x="450.00000000000006" y="124" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Mechanism</text><text x="745.3333333333334" y="124" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Crime outcome</text><rect x="30" y="140" width="249.33333333333334" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="168.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Blocked success at school</text><text x="46" y="189.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">or work</text><line x1="285.33333333333337" y1="175" x2="319.33333333333337" y2="175" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="325.33333333333337" y="140" width="249.33333333333334" height="70" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="341.33333333333337" y="168.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Frustration at low status</text><text x="341.33333333333337" y="189.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(Cohen, 1955)</text><line x1="580.6666666666667" y1="175" x2="614.6666666666667" y2="175" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="620.6666666666667" y="140" width="249.33333333333334" height="70" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="636.6666666666667" y="168.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Subculture gives status</text><text x="636.6666666666667" y="189.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">for deviance</text><rect x="30" y="224" width="249.33333333333334" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="252.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Few legitimate jobs</text><line x1="285.33333333333337" y1="259" x2="319.33333333333337" y2="259" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="325.33333333333337" y="224" width="249.33333333333334" height="70" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="341.33333333333337" y="252.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Legitimate goals out of</text><text x="341.33333333333337" y="273.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">reach</text><line x1="580.6666666666667" y1="259" x2="614.6666666666667" y2="259" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="620.6666666666667" y="224" width="249.33333333333334" height="70" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="636.6666666666667" y="252.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Crime as another route to</text><text x="636.6666666666667" y="273.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">income</text><rect x="30" y="308" width="249.33333333333334" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="336.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Comparison with others’</text><text x="46" y="357.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">wealth, sharpened by media</text><line x1="285.33333333333337" y1="343" x2="319.33333333333337" y2="343" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="325.33333333333337" y="308" width="249.33333333333334" height="70" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="341.33333333333337" y="336.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Sense of injustice (Lea</text><text x="341.33333333333337" y="357.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and Young, 1984)</text><line x1="580.6666666666667" y1="343" x2="614.6666666666667" y2="343" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="620.6666666666667" y="308" width="249.33333333333334" height="70" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="636.6666666666667" y="336.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Property crime or unrest</text><rect x="30" y="392" width="249.33333333333334" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="420.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Police patrol certain</text><text x="46" y="441.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">areas and groups</text><line x1="285.33333333333337" y1="427" x2="319.33333333333337" y2="427" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="325.33333333333337" y="392" width="249.33333333333334" height="70" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="341.33333333333337" y="420.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">More of their offences</text><text x="341.33333333333337" y="441.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">detected</text><line x1="580.6666666666667" y1="427" x2="614.6666666666667" y2="427" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="620.6666666666667" y="392" width="249.33333333333334" height="70" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="636.6666666666667" y="420.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Higher recorded crime</text><rect x="30" y="476" width="249.33333333333334" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="504.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Lenient treatment of women</text><text x="46" y="525.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">by police and courts</text><line x1="285.33333333333337" y1="511" x2="319.33333333333337" y2="511" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="325.33333333333337" y="476" width="249.33333333333334" height="70" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="341.33333333333337" y="504.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Chivalry thesis (Pollak,</text><text x="341.33333333333337" y="525.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">1950)</text><line x1="580.6666666666667" y1="511" x2="614.6666666666667" y2="511" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="620.6666666666667" y="476" width="249.33333333333334" height="70" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="636.6666666666667" y="504.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Female crime</text><text x="636.6666666666667" y="525.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">under-recorded</text>
</svg>