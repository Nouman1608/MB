<rect width="900" height="576" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Two kinds of explanation</text>

<rect x="220" y="110" width="460" height="70" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="137.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">A group appears more often in crime</text><text x="450" y="162.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">statistics</text><line x1="330" y1="178" x2="220" y2="220" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="570" y1="178" x2="680" y2="220" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="228" width="408" height="244" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="261" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EXPLANATIONS OF OFFENDING</text><text x="50" y="288" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Do they really commit more?</text><text x="50" y="317.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="66.15" y="317.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Lack of opportunity</text><text x="50" y="343.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="66.15" y="343.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Status frustration</text><text x="50" y="369.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="66.15" y="369.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Gang culture</text><text x="50" y="395.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="66.15" y="395.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Deprivation</text><text x="50" y="421.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="66.15" y="421.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Culture of masculinity</text><text x="50" y="447.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="66.15" y="447.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Inadequate socialisation</text><rect x="462" y="228" width="408" height="244" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="482" y="261" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">EXPLANATIONS OF THE STATISTICS</text><text x="482" y="288" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Are they more likely to be</text><text x="482" y="314" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">caught and recorded?</text><text x="482" y="343.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="498.15" y="343.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Police targeting</text><text x="482" y="369.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="498.15" y="369.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Stereotyping</text><text x="482" y="395.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="498.15" y="395.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Institutional racism</text><text x="482" y="421.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="498.15" y="421.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The chivalry thesis</text><text x="482" y="447.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="498.15" y="447.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The self-fulfilling prophecy</text><rect x="30" y="488" width="840" height="58" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="521.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A strong answer on any pattern uses at least one of each, then judges which matters more.</text>
