<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 632" width="900" height="632" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="632" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Merton (1938): five adaptations to strain</text>

<rect x="30" y="104" width="840" height="84" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="138.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Society sets goals (wealth and success) but does not give everyone the</text><text x="450" y="162.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">legitimate means to reach them.</text><rect x="30" y="206" width="220" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="42" y="236" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Adaptation</text><rect x="250" y="206" width="260" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="262" y="236" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Goals</text><rect x="510" y="206" width="360" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="522" y="236" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Means</text><rect x="30" y="252" width="220" height="44" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="278.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Conformity</text><rect x="250" y="252" width="260" height="44" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="262" y="278.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Accept</text><rect x="510" y="252" width="360" height="44" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="522" y="278.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Accept</text><rect x="30" y="296" width="220" height="44" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="322.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Innovation</text><rect x="250" y="296" width="260" height="44" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="262" y="322.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Accept</text><rect x="510" y="296" width="360" height="44" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="522" y="322.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Use illegitimate means, such as theft</text><rect x="30" y="340" width="220" height="44" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="366.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Ritualism</text><rect x="250" y="340" width="260" height="44" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="262" y="366.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Give up</text><rect x="510" y="340" width="360" height="44" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="522" y="366.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Keep the rules</text><rect x="30" y="384" width="220" height="44" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="410.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Retreatism</text><rect x="250" y="384" width="260" height="44" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="262" y="410.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Reject</text><rect x="510" y="384" width="360" height="44" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="522" y="410.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Reject (such as some drug addicts)</text><rect x="30" y="428" width="220" height="44" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="454.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Rebellion</text><rect x="250" y="428" width="260" height="44" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="262" y="454.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Replace with new goals</text><rect x="510" y="428" width="360" height="44" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="522" y="454.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Replace with new means</text><rect x="30" y="490" width="840" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="526" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Subcultures</text><text x="50" y="555.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Cloward and Ohlin (1960): the subculture depends on local opportunities: criminal, conflict</text><text x="50" y="577.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">or retreatist.</text>
</svg>