<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 555" width="900" height="555" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="555" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Patterns of offending and victimisation</text>

<rect x="30" y="104" width="170" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="42" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start"></text><rect x="200" y="104" width="335" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="212" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Recorded offending</text><rect x="535" y="104" width="335" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="547" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Victimisation</text><rect x="30" y="150" width="170" height="64" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="175.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Age</text><rect x="200" y="150" width="335" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="212" y="175.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Highest among young people</text><rect x="535" y="150" width="335" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="547" y="175.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Young men frequent victims of street</text><text x="547" y="196.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">violence</text><rect x="30" y="214" width="170" height="64" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="239.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Social class</text><rect x="200" y="214" width="335" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="212" y="239.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Highest among working-class people</text><rect x="535" y="214" width="335" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="547" y="239.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Poorer neighbourhoods suffer more</text><text x="547" y="260.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">burglary</text><rect x="30" y="278" width="170" height="64" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="303.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Gender</text><rect x="200" y="278" width="335" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="212" y="303.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Highest among men</text><rect x="535" y="278" width="335" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="547" y="303.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Women main victims of domestic and</text><text x="547" y="324.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">sexual violence</text><rect x="30" y="342" width="170" height="85" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="367.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Ethnicity</text><rect x="200" y="342" width="335" height="85" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="212" y="367.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Some minority groups over-represented</text><text x="212" y="388.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">in arrests and prisons in some</text><text x="212" y="409.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">societies</text><rect x="535" y="342" width="335" height="85" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="547" y="367.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Minority groups targets of hate crime</text><rect x="30" y="445" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="478.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Repeat victimisation shows risk is concentrated. For every pattern ask: does it show who</text><text x="50" y="500.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">offends, or who is policed, reported and recorded?</text>
</svg>