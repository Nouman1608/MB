<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 740" width="900" height="740" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="740" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Ethics: fair and honest to whom?</text>

<text x="475" y="132" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">Seen as fair and honest</text><text x="745" y="132" font-size="19" font-weight="700" fill="#b5602e" text-anchor="middle">Seen as unethical</text><rect x="30" y="150" width="200" height="100" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="130" y="202.7" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Employees</text><line x1="232" y1="200" x2="262" y2="200" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="266" y="150" width="418" height="100" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="290" y="208" font-size="26" font-weight="700" fill="#2e6b62" text-anchor="middle">✓</text><text x="312" y="195" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Fair pay, safe conditions, respect for</text><text x="312" y="218" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">religious and family needs</text><rect x="700" y="150" width="170" height="100" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="714" y="185" font-size="15" font-weight="400" fill="#b5602e" text-anchor="start">Pressure to work</text><text x="714" y="205" font-size="15" font-weight="400" fill="#b5602e" text-anchor="start">unpaid hours,</text><text x="714" y="225" font-size="15" font-weight="400" fill="#b5602e" text-anchor="start">unfair treatment</text><rect x="30" y="266" width="200" height="100" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="130" y="318.7" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Customers</text><line x1="232" y1="316" x2="262" y2="316" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="266" y="266" width="418" height="100" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="290" y="324" font-size="26" font-weight="700" fill="#2e6b62" text-anchor="middle">✓</text><text x="312" y="311" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Truthful advertising and labelling, fair</text><text x="312" y="334" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">prices, honest refunds</text><rect x="700" y="266" width="170" height="100" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="714" y="311" font-size="15" font-weight="400" fill="#b5602e" text-anchor="start">Hidden charges,</text><text x="714" y="331" font-size="15" font-weight="400" fill="#b5602e" text-anchor="start">misleading claims</text><rect x="30" y="382" width="200" height="100" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="130" y="434.7" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Suppliers</text><line x1="232" y1="432" x2="262" y2="432" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="266" y="382" width="418" height="100" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="290" y="440" font-size="26" font-weight="700" fill="#2e6b62" text-anchor="middle">✓</text><text x="312" y="438" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Paying a fair price, paying on time</text><rect x="700" y="382" width="170" height="100" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="714" y="407" font-size="15" font-weight="400" fill="#b5602e" text-anchor="start">Delaying payment</text><text x="714" y="427" font-size="15" font-weight="400" fill="#b5602e" text-anchor="start">to keep cash,</text><text x="714" y="447" font-size="15" font-weight="400" fill="#b5602e" text-anchor="start">forcing prices</text><text x="714" y="467" font-size="15" font-weight="400" fill="#b5602e" text-anchor="start">below their costs</text><rect x="30" y="498" width="200" height="100" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="130" y="550.7" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Local community</text><line x1="232" y1="548" x2="262" y2="548" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="266" y="498" width="418" height="100" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="290" y="556" font-size="26" font-weight="700" fill="#2e6b62" text-anchor="middle">✓</text><text x="312" y="543" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Supporting local causes, limiting</text><text x="312" y="566" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">disruption</text><rect x="700" y="498" width="170" height="100" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="714" y="523" font-size="15" font-weight="400" fill="#b5602e" text-anchor="start">Ignoring</text><text x="714" y="543" font-size="15" font-weight="400" fill="#b5602e" text-anchor="start">complaints,</text><text x="714" y="563" font-size="15" font-weight="400" fill="#b5602e" text-anchor="start">harming the local</text><text x="714" y="583" font-size="15" font-weight="400" fill="#b5602e" text-anchor="start">area</text><rect x="30" y="614" width="200" height="100" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="130" y="666.7" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Owners</text><line x1="232" y1="664" x2="262" y2="664" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="266" y="614" width="418" height="100" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="290" y="672" font-size="26" font-weight="700" fill="#2e6b62" text-anchor="middle">✓</text><text x="312" y="670" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Accurate reporting of results</text><rect x="700" y="614" width="170" height="100" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="714" y="659" font-size="15" font-weight="400" fill="#b5602e" text-anchor="start">Hiding problems</text><text x="714" y="679" font-size="15" font-weight="400" fill="#b5602e" text-anchor="start">from investors</text>
</svg>