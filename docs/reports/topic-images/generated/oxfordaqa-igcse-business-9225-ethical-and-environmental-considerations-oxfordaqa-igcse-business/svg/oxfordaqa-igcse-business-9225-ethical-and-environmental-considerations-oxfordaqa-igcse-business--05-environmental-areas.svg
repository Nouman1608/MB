<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 770" width="900" height="770" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="770" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four environmental considerations</text>

<rect x="30" y="110" width="410" height="230" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="148" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Traffic congestion</text><text x="50" y="182" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Delivery lorries and customer car journeys</text><text x="50" y="205" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">crowd local roads</text><rect x="46" y="222" width="378" height="104" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="62" y="250" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">What a business can do</text><text x="62" y="276" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Deliver outside rush hours, combine</text><text x="62" y="297" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">deliveries, locate near main roads or</text><text x="62" y="318" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">public transport</text><rect x="460" y="110" width="410" height="230" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="480" y="148" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Recycling</text><text x="480" y="182" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Reusing cardboard, plastic and metal</text><text x="480" y="205" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">reduces waste and can lower costs</text><rect x="476" y="222" width="378" height="104" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="492" y="250" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">The catch</text><text x="492" y="276" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Sorting and collecting it takes staff time</text><text x="492" y="297" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and space</text><rect x="30" y="360" width="410" height="230" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="398" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Disposing of waste</text><text x="50" y="432" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Landfill costs money and can harm land and</text><text x="50" y="455" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">water; hazardous waste needs safe handling</text><rect x="46" y="472" width="378" height="104" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="62" y="500" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">What a business can do</text><text x="62" y="526" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Reduce packaging: cuts both cost and waste</text><rect x="460" y="360" width="410" height="230" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="480" y="398" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Noise and air pollution</text><text x="480" y="432" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Machinery, vehicles and late-night working</text><text x="480" y="455" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">disturb neighbours; fumes affect health</text><rect x="476" y="472" width="378" height="104" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="492" y="500" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">What a business can do</text><text x="492" y="526" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Quieter equipment, cleaner vehicles,</text><text x="492" y="547" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">limited hours: fewer complaints, but cost</text><text x="492" y="568" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">money</text><rect x="30" y="620" width="410" height="120" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="654" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">Costs</text><text x="50" y="684" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">New equipment, staff time, higher-priced</text><text x="50" y="707" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">materials, changed working practices</text><rect x="460" y="620" width="410" height="120" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="480" y="654" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Benefits</text><text x="480" y="684" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Lower waste and energy bills, better</text><text x="480" y="707" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">reputation, green customers, fewer</text><text x="480" y="730" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">complaints</text>
</svg>