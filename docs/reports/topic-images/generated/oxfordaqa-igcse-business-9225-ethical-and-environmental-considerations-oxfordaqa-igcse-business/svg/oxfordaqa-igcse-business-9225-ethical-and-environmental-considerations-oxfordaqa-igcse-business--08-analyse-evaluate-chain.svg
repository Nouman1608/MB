<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 840" width="900" height="840" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="840" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Answering ethics and environment questions</text>

<text x="450" y="128" font-size="19" font-weight="700" fill="#4a5568" text-anchor="middle">Analyse: build a chain that includes the trade-off</text><circle cx="64" cy="200" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="64" y="207.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="100" y="150" width="770" height="100" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="118" y="186" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Action</text><text x="118" y="217" font-size="18" font-weight="400" fill="#4a5568" text-anchor="start">Pay growers $4.60 a kg, not $4.00</text><line x1="64" y1="224" x2="64" y2="290" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><circle cx="64" cy="318" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="64" y="325.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="100" y="268" width="770" height="100" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="118" y="304" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">Its cost</text><text x="118" y="335" font-size="18" font-weight="400" fill="#4a5568" text-anchor="start">$30,000 more a year</text><line x1="64" y1="342" x2="64" y2="408" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><circle cx="64" cy="436" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="64" y="443.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="100" y="386" width="770" height="100" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="118" y="422" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Its benefit</text><text x="118" y="453" font-size="18" font-weight="400" fill="#4a5568" text-anchor="start">Loyalty and reputation from ethical sourcing</text><line x1="64" y1="460" x2="64" y2="526" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><circle cx="64" cy="554" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="64" y="561.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="100" y="504" width="770" height="100" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="118" y="540" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="start">Effect on profit</text><text x="118" y="571" font-size="18" font-weight="400" fill="#4a5568" text-anchor="start">Falls to $60,000 unless the price rises $0.15 a bag</text><rect x="30" y="640" width="840" height="170" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="56" y="678" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Evaluate: judge, and say what it depends on</text><rect x="56" y="700" width="252" height="90" rx="10" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="72" y="738" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">How price-sensitive</text><text x="72" y="761" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">customers are</text><rect x="328" y="700" width="252" height="90" rx="10" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="344" y="738" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">How large the cost is</text><text x="344" y="761" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">compared with profit</text><rect x="600" y="700" width="252" height="90" rx="10" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="616" y="738" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">How long the benefit</text><text x="616" y="761" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">takes to arrive</text>
</svg>