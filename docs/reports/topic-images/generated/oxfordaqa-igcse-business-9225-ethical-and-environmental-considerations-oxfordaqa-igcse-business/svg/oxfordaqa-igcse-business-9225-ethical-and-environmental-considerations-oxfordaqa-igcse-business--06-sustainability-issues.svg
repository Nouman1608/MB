<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="900" height="650" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="650" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Two sustainability issues</text>

<rect x="30" y="110" width="840" height="80" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="144" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start">Sustainability: meeting today’s needs without damaging the ability of future</text><text x="56" y="168" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start">generations to meet theirs</text><rect x="30" y="220" width="410" height="130" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="48" y="258" font-size="21" font-weight="700" fill="#b5602e" text-anchor="start">Global warming</text><text x="48" y="292" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Burning fossil fuels for energy and</text><text x="48" y="315" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">transport releases greenhouse gases</text><line x1="235" y1="352" x2="235" y2="392" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="245" y="380" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">businesses can</text><rect x="30" y="400" width="410" height="66" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="50" y="440" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Use renewable energy</text><rect x="30" y="478" width="410" height="66" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="50" y="518" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Use more efficient machinery</text><rect x="30" y="556" width="410" height="66" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="50" y="596" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Use lower-emission vehicles</text><rect x="460" y="220" width="410" height="130" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="478" y="258" font-size="21" font-weight="700" fill="#b5602e" text-anchor="start">Using scarce resources</text><text x="478" y="292" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Water, timber and some metals are limited</text><line x1="665" y1="352" x2="665" y2="392" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="675" y="380" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">businesses can</text><rect x="460" y="400" width="410" height="66" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="480" y="440" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Use less</text><rect x="460" y="478" width="410" height="66" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="480" y="518" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Switch to renewable or recycled materials</text><rect x="460" y="556" width="410" height="66" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="480" y="584" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Design products that last longer or can be</text><text x="480" y="607" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">repaired</text>
</svg>