<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 670" width="900" height="670" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="670" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Two ethical choices and their price</text>

<rect x="30" y="110" width="410" height="530" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="235" y="150" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Religious observance</text><rect x="50" y="172" width="370" height="52" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="235" y="204" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Prayer breaks or a prayer room</text><rect x="50" y="234" width="370" height="52" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="235" y="266" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Shifts adjusted for festivals or fasting</text><rect x="50" y="296" width="370" height="52" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="235" y="328" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Closing on holy days</text><rect x="50" y="358" width="370" height="52" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="235" y="390" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Food that meets religious requirements</text><line x1="150" y1="430" x2="150" y2="464" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><line x1="320" y1="430" x2="320" y2="464" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><rect x="50" y="472" width="180" height="150" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="68" y="504" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Benefit</text><text x="68" y="534" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Shows respect;</text><text x="68" y="555" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">helps keep staff</text><text x="68" y="576" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">and win loyal</text><text x="68" y="597" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">customers</text><rect x="240" y="472" width="180" height="150" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="258" y="504" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">Cost</text><text x="258" y="534" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Rearranged rotas</text><text x="258" y="555" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">or lost trading</text><text x="258" y="576" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">hours</text><rect x="460" y="110" width="410" height="530" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="665" y="150" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Charitable giving</text><rect x="480" y="172" width="370" height="52" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="665" y="204" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Donating money or products</text><rect x="480" y="234" width="370" height="52" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="665" y="266" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Sponsoring local events</text><rect x="480" y="296" width="370" height="52" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="665" y="328" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Paid time for staff to volunteer</text><line x1="580" y1="430" x2="580" y2="464" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><line x1="750" y1="430" x2="750" y2="464" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><rect x="480" y="472" width="180" height="150" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="498" y="504" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Benefit</text><text x="498" y="534" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Builds goodwill</text><text x="498" y="555" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">in the community</text><rect x="670" y="472" width="180" height="150" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="688" y="504" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">Cost</text><text x="688" y="534" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Every dollar</text><text x="688" y="555" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">donated is a</text><text x="688" y="576" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">dollar less</text><text x="688" y="597" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">profit</text>
</svg>