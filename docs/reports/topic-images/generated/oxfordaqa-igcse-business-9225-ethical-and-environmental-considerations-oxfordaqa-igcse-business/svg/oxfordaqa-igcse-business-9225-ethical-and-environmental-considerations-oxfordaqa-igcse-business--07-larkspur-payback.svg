<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 865" width="900" height="865" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="865" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Larkspur Laundry: solar water heating</text>

<rect x="30" y="110" width="840" height="500" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="56" y="146" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Cumulative gas saving from solar water heating ($4,000 a year)</text><line x1="120" y1="560" x2="850" y2="560" stroke="#c9d6d4" stroke-width="1.5"/><text x="110" y="566" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">$0</text><line x1="120" y1="465" x2="850" y2="465" stroke="#c9d6d4" stroke-width="1.5"/><text x="110" y="471" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">$8,000</text><line x1="120" y1="370" x2="850" y2="370" stroke="#c9d6d4" stroke-width="1.5"/><text x="110" y="376" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">$16,000</text><line x1="120" y1="275" x2="850" y2="275" stroke="#c9d6d4" stroke-width="1.5"/><text x="110" y="281" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">$24,000</text><line x1="120" y1="180" x2="850" y2="180" stroke="#c9d6d4" stroke-width="1.5"/><text x="110" y="186" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">$32,000</text><rect x="140" y="512.5" width="70" height="47.5" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="175" y="586" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Yr 1</text><rect x="228" y="465" width="70" height="95" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="263" y="586" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Yr 2</text><rect x="316" y="417.5" width="70" height="142.5" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="351" y="586" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Yr 3</text><rect x="404" y="370" width="70" height="190" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="439" y="586" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Yr 4</text><rect x="492" y="322.5" width="70" height="237.5" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="527" y="586" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Yr 5</text><rect x="580" y="275" width="70" height="285" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="615" y="586" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Yr 6</text><rect x="668" y="227.5" width="70" height="332.5" fill="#2e6b62" stroke="#1e2a44" stroke-width="2"/><text x="703" y="586" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Yr 7</text><rect x="756" y="180" width="70" height="380" fill="#2e6b62" stroke="#1e2a44" stroke-width="2"/><text x="791" y="586" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Yr 8</text><line x1="120" y1="275" x2="850" y2="275" stroke="#b5602e" stroke-width="3" stroke-dasharray="10 6"/><text x="140" y="263" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">installation cost $24,000</text><line x1="120" y1="560" x2="850" y2="560" stroke="#1e2a44" stroke-width="2.5"/><text x="615" y="237" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">paid back</text><text x="640" y="190" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="end">then saves</text><text x="640" y="208" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="end">$4,000 a year</text><rect x="30" y="630" width="840" height="76" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="677" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Payback = $24,000 ÷ $4,000 a year = 6 years</text><rect x="30" y="726" width="840" height="109" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="766" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Short term: profit falls. Long term: it pays for itself and cuts emissions.</text><text x="56" y="793" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">For a business short of cash, or unsure it will stay six years, it may not be worth it; for</text><text x="56" y="816" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">a stable business it probably is.</text>
</svg>