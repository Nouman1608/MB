<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 740" width="900" height="740" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="740" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Tamarind Coffee: the cost of a fair price</text>

<rect x="30" y="110" width="420" height="600" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="56" y="146" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Annual profit</text><line x1="130" y1="600" x2="425" y2="600" stroke="#c9d6d4" stroke-width="1.5"/><text x="120" y="606" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">$0</text><line x1="130" y1="410" x2="425" y2="410" stroke="#c9d6d4" stroke-width="1.5"/><text x="120" y="416" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">$50,000</text><line x1="130" y1="220" x2="425" y2="220" stroke="#c9d6d4" stroke-width="1.5"/><text x="120" y="226" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">$100,000</text><line x1="130" y1="600" x2="425" y2="600" stroke="#1e2a44" stroke-width="2.5"/><rect x="160" y="258" width="100" height="342" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><rect x="300" y="372" width="100" height="228" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><rect x="300" y="258" width="100" height="114" fill="none" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="7 5"/><text x="350" y="321" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">−$30,000</text><text x="210" y="248" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">$90,000</text><text x="350" y="248" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">$60,000</text><text x="210" y="628" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Now</text><text x="210" y="650" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">$4.00 a kg</text><text x="350" y="628" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Fair price</text><text x="350" y="650" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">$4.60 a kg</text><text x="240" y="690" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">if nothing else changes</text><rect x="470" y="110" width="400" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="490" y="142" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">Extra cost per kg</text><text x="490" y="172" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">$4.60 − $4.00 = $0.60</text><rect x="470" y="225" width="400" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="490" y="257" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">Extra cost per year</text><text x="490" y="287" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">50,000 kg × $0.60 = $30,000</text><rect x="470" y="340" width="400" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="490" y="372" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">New profit</text><text x="490" y="402" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">$90,000 − $30,000 = $60,000</text><rect x="470" y="455" width="400" height="128" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="490" y="487" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">Price rise per bag to cover it</text><text x="490" y="517" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">$30,000 ÷ 200,000 bags</text><text x="490" y="544" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">= $0.15 a bag</text><rect x="470" y="598" width="400" height="112" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="490" y="630" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">Profit falls by a third unless</text><text x="490" y="653" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">customers will pay 15 cents more a</text><text x="490" y="676" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">bag.</text>
</svg>