<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 710" width="900" height="710" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="710" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The trade-off between ethics and profit</text>

<rect x="30" y="110" width="840" height="90" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="148" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Trade-off: gaining one thing by giving up some of another</text><text x="450" y="178" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">Ethical behaviour often costs money now; its benefits come later and are less certain.</text><line x1="60" y1="250" x2="850" y2="250" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="70" y="238" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">NOW</text><text x="840" y="238" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">LATER</text><rect x="30" y="280" width="410" height="400" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="56" y="318" font-size="20" font-weight="700" fill="#b5602e" text-anchor="start">Drawbacks: certain, immediate</text><rect x="460" y="280" width="410" height="400" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="486" y="318" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Benefits: later, less certain</text><rect x="50" y="340" width="370" height="70" rx="10" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><text x="68" y="369" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Higher costs, such as fairer prices to</text><text x="68" y="392" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">suppliers</text><rect x="50" y="422" width="370" height="70" rx="10" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><text x="68" y="451" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Lower profit margins if prices cannot</text><text x="68" y="474" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">rise</text><rect x="50" y="504" width="370" height="70" rx="10" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><text x="68" y="533" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Rivals who do not act ethically may</text><text x="68" y="556" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">undercut on price</text><rect x="50" y="586" width="370" height="70" rx="10" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><text x="68" y="615" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Benefits are hard to measure and may</text><text x="68" y="638" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">take years</text><rect x="480" y="340" width="370" height="70" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="498" y="381" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Better reputation and customer loyalty</text><rect x="480" y="422" width="370" height="70" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="498" y="463" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Can justify a higher price</text><rect x="480" y="504" width="370" height="70" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="498" y="545" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Easier to recruit and keep staff</text><rect x="480" y="586" width="370" height="70" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="498" y="627" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Less risk of boycotts or bad publicity</text>
</svg>