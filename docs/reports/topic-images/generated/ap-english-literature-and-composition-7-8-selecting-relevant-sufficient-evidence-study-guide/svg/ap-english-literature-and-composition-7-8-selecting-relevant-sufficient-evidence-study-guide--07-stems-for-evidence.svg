<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 546" width="900" height="546" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="546" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Stems that signal the job</text>

<rect x="30" y="110" width="170" height="84" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="115" y="158" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">ILLUSTRATE</text><line x1="204" y1="152" x2="232" y2="152" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="236" y="110" width="214" height="84" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="343" y="147" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">The narrator shows ...</text><text x="343" y="169" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">when ...</text><line x1="454" y1="152" x2="474" y2="152" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="478" y="110" width="392" height="84" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="492" y="147" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">The narrator shows his composure when he</text><text x="492" y="168" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"said that it was very healthy".</text><rect x="30" y="206" width="170" height="84" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="115" y="254" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">EXEMPLIFY</text><line x1="204" y1="248" x2="232" y2="248" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="236" y="206" width="214" height="84" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="343" y="254" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">One example is ...</text><line x1="454" y1="248" x2="474" y2="248" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="478" y="206" width="392" height="84" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="492" y="243" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">One example is her repeated deflection, "a dull</text><text x="492" y="264" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">note from the agent".</text><rect x="30" y="302" width="170" height="84" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="115" y="350" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">AMPLIFY</text><line x1="204" y1="344" x2="232" y2="344" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="236" y="302" width="214" height="84" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="343" y="339" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">This is intensified</text><text x="343" y="361" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">when ...</text><line x1="454" y1="344" x2="474" y2="344" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="478" y="302" width="392" height="84" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="492" y="339" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">This is intensified when she holds the letter to</text><text x="492" y="360" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">the lamp.</text><rect x="30" y="398" width="170" height="84" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="115" y="446" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">QUALIFY</text><line x1="204" y1="440" x2="232" y2="440" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="236" y="398" width="214" height="84" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="343" y="446" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Yet ... / Although ...</text><line x1="454" y1="440" x2="474" y2="440" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="478" y="398" width="392" height="84" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="492" y="435" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">Yet the "low voice" suggests that the cheer is</text><text x="492" y="456" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">partly private encouragement.</text><text x="450" y="520" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">The stem shows the reader what each piece of evidence is doing</text>
</svg>