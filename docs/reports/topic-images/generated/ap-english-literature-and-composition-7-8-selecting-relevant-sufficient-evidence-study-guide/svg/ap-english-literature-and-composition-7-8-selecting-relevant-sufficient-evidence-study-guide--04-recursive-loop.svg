<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="900" height="450" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="450" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Claim and evidence: a loop</text>

<rect x="80" y="190" width="270" height="140" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="215" y="251.2" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">Claim</text><text x="215" y="283.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">what you argue</text><rect x="550" y="190" width="270" height="140" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="685" y="251.2" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">Evidence</text><text x="685" y="283.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">details from the text</text><path d="M360,220 Q450,140 540,220" fill="none" stroke="#1e2a44" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><path d="M540,300 Q450,380 360,300" fill="none" stroke="#1e2a44" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><text x="450" y="132" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="middle">if the claim opens new questions: look</text><text x="450" y="153" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="middle">for new evidence</text><text x="450" y="372" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="middle">if the evidence does not support it:</text><text x="450" y="393" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="middle">revise the claim</text><text x="450" y="266" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">start</text><text x="450" y="286" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">at either end</text>
</svg>