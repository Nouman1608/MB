<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 752" width="900" height="752" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="752" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: auditing Montresor</text>

<rect x="30" y="110" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="143" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">CLAIM</text><text x="50" y="174.6" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">Montresor presents his revenge as justified, but the omissions in his account and the pleasure he</text><text x="50" y="196.6" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">takes in the deed undermine his reliability.</text><rect x="294" y="240" width="108" height="96" rx="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="348" y="274" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">(a)</text><text x="348" y="302" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">opening</text><text x="348" y="324" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">USE</text><rect x="410" y="240" width="108" height="96" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="464" y="274" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">(b)</text><text x="464" y="302" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">early</text><text x="464" y="324" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">set aside</text><rect x="526" y="240" width="108" height="96" rx="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="580" y="274" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">(c)</text><text x="580" y="302" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">middle</text><text x="580" y="324" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">USE</text><rect x="642" y="240" width="108" height="96" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="696" y="274" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">(d)</text><text x="696" y="302" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">middle</text><text x="696" y="324" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">set aside</text><rect x="758" y="240" width="108" height="96" rx="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="812" y="274" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">(e)</text><text x="812" y="302" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">ending</text><text x="812" y="324" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">USE</text><rect x="30" y="350" width="840" height="56" rx="10" fill="#f8faf9" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="384" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">1  presents revenge as justified</text><circle cx="348" cy="378" r="16" fill="#2e6b62"/><path d="M340,378 l6,6 l11,-12" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="464" cy="378" r="6" fill="#c9d6d4"/><circle cx="580" cy="378" r="6" fill="#c9d6d4"/><circle cx="696" cy="378" r="6" fill="#c9d6d4"/><circle cx="812" cy="378" r="6" fill="#c9d6d4"/><rect x="30" y="414" width="840" height="56" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="448" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">2  omits key information</text><circle cx="348" cy="442" r="16" fill="#2e6b62"/><path d="M340,442 l6,6 l11,-12" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="464" cy="442" r="6" fill="#c9d6d4"/><circle cx="580" cy="442" r="6" fill="#c9d6d4"/><circle cx="696" cy="442" r="6" fill="#c9d6d4"/><circle cx="812" cy="442" r="6" fill="#c9d6d4"/><rect x="30" y="478" width="840" height="56" rx="10" fill="#f8faf9" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="512" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">3  reveals pleasure</text><circle cx="348" cy="506" r="6" fill="#c9d6d4"/><circle cx="464" cy="506" r="6" fill="#c9d6d4"/><circle cx="580" cy="506" r="16" fill="#2e6b62"/><path d="M572,506 l6,6 l11,-12" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="696" cy="506" r="6" fill="#c9d6d4"/><circle cx="812" cy="506" r="16" fill="#2e6b62"/><path d="M804,506 l6,6 l11,-12" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><text x="46" y="578" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">(b)</text><text x="146" y="578" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">can qualify: he admits his deceit, which makes his silence about the injuries more striking</text><text x="46" y="608" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">(d)</text><text x="146" y="608" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">relevant to another argument (irony), not to this claim: leave it out</text><text x="46" y="638" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">(a) alone</text><text x="146" y="638" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">covers parts 1 and 2 only: insufficient</text><rect x="30" y="658" width="840" height="64" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="697" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">(a) + (c) + (e): all three parts, from three positions in the story</text>
</svg>