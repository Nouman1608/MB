<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 717" width="900" height="717" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="717" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Sufficient: quality and quantity</text>

<rect x="200" y="140" width="260" height="161.2" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="3"/><text x="330" y="188" font-size="24" font-weight="700" fill="#b5602e" text-anchor="middle">Thin</text><text x="330" y="224" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">a broad claim on a single</text><text x="330" y="245" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">detail</text><rect x="474" y="140" width="260" height="161.2" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="3"/><text x="604" y="188" font-size="24" font-weight="700" fill="#2e6b62" text-anchor="middle">Apt</text><text x="604" y="224" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">a broad or pattern claim with</text><text x="604" y="245" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">evidence from several</text><text x="604" y="266" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">places</text><rect x="200" y="315.2" width="260" height="161.2" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="3"/><text x="330" y="363.2" font-size="24" font-weight="700" fill="#2e6b62" text-anchor="middle">Apt</text><text x="330" y="399.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">a narrow point: one</text><text x="330" y="420.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">quotation may be enough</text><rect x="474" y="315.2" width="260" height="161.2" rx="14" fill="#ffffff" stroke="#8a6d0d" stroke-width="3"/><text x="604" y="363.2" font-size="24" font-weight="700" fill="#8a6d0d" text-anchor="middle">Repetitive</text><text x="604" y="399.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">many details for a narrow</text><text x="604" y="420.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">claim</text><text x="180" y="226.6" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">Broad claim</text><text x="180" y="248.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end">or a pattern</text><text x="180" y="401.79999999999995" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">Narrow claim</text><text x="330" y="510.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">One detail</text><text x="604" y="510.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Many details</text><line x1="200" y1="526.4" x2="734" y2="526.4" stroke="#4a5568" stroke-width="3" marker-end="url(#ah)"/><text x="467" y="552.4" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">quantity of evidence</text><rect x="30" y="576.4" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="609.4" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">QUALITY</text><text x="50" y="641" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Specific words and details that carry the meaning, not plot summary; short, embedded quotations;</text><text x="50" y="663" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">details that can bear a close reading.</text>
</svg>