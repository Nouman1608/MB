<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 667" width="900" height="667" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="667" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: Mr Pike's scales</text>

<rect x="40" y="110" width="400" height="280" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="240" y="146" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Widow Lamb</text><text x="240" y="170" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">pays in coppers</text><rect x="232" y="225" width="16" height="90" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.5"/><rect x="190" y="311" width="100" height="14" rx="4" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.5"/><line x1="120" y1="247" x2="360" y2="203" stroke="#1e2a44" stroke-width="6" stroke-linecap="round"/><circle cx="240" cy="225" r="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><line x1="120" y1="247" x2="90" y2="287" stroke="#1e2a44" stroke-width="2"/><line x1="120" y1="247" x2="150" y2="287" stroke="#1e2a44" stroke-width="2"/><path d="M80,287 Q120,313 160,287 Z" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><line x1="360" y1="203" x2="330" y2="243" stroke="#1e2a44" stroke-width="2"/><line x1="360" y1="203" x2="390" y2="243" stroke="#1e2a44" stroke-width="2"/><path d="M320,243 Q360,269 400,243 Z" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="72" y="297" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">tea</text><text x="240" y="348" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">pan "tipped a little in her favour"</text><rect x="460" y="110" width="400" height="280" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="660" y="146" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Sir Anthony's steward</text><text x="660" y="170" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">buys for the Hall</text><rect x="652" y="225" width="16" height="90" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.5"/><rect x="610" y="311" width="100" height="14" rx="4" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.5"/><line x1="540" y1="247" x2="780" y2="203" stroke="#1e2a44" stroke-width="6" stroke-linecap="round"/><circle cx="660" cy="225" r="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><line x1="540" y1="247" x2="510" y2="287" stroke="#1e2a44" stroke-width="2"/><line x1="540" y1="247" x2="570" y2="287" stroke="#1e2a44" stroke-width="2"/><path d="M500,287 Q540,313 580,287 Z" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><line x1="780" y1="203" x2="750" y2="243" stroke="#1e2a44" stroke-width="2"/><line x1="780" y1="203" x2="810" y2="243" stroke="#1e2a44" stroke-width="2"/><path d="M740,243 Q780,269 820,243 Z" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="492" y="297" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">sugar</text><ellipse cx="550" cy="283" rx="18" ry="11" fill="#efdfa8" stroke="#1e2a44" stroke-width="2.5"/><text x="580" y="277" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">thumb</text><text x="660" y="348" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">thumb rests "a moment longer than a thumb</text><text x="660" y="369" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">needs to"</text><rect x="30" y="420" width="395" height="133" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="453" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">FIRST CLAIM</text><text x="50" y="479.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">"Mr Pike is an honest trader."</text><text x="50" y="507.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Generous is not exact, and the thumb</text><text x="50" y="528.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">contradicts it</text><line x1="431" y1="486.5" x2="469" y2="486.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="475" y="420" width="395" height="133" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="495" y="453" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">REVISED CLAIM</text><text x="495" y="479.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">His scales serve loyalty, not honesty</text><text x="495" y="507.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">He gives to the poor what he takes from the</text><text x="495" y="528.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">powerful: a selective, in its way moral, fairness</text><rect x="30" y="573" width="840" height="64" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="612" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">The evidence did not support the first claim: it changed it</text>
</svg>