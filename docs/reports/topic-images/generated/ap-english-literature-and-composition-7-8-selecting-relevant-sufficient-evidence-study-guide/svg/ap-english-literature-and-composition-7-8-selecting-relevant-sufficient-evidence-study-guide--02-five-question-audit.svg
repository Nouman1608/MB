<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 759" width="900" height="759" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="759" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The evidence audit</text>

<text x="110" y="124" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">CANDIDATE DETAIL</text><rect x="80" y="134" width="60" height="30" rx="6" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><line x1="110" y1="166" x2="110" y2="178" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="182" width="840" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="70" cy="226" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="70" y="233.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="110" y="218" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Relevant?</text><text x="110" y="244" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Does it bear on the claim, or only on the topic?</text><line x1="540" y1="198" x2="540" y2="254" stroke="#c9d6d4" stroke-width="2"/><text x="560" y="212" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">WHY IT MATTERS</text><text x="560" y="236" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Interesting but irrelevant evidence</text><text x="560" y="257" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">distracts</text><line x1="70" y1="272" x2="70" y2="288" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="292" width="840" height="108" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="70" cy="346" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="70" y="353.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="110" y="328" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">What job does it do?</text><text x="110" y="354" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Illustrate, clarify, exemplify, associate, amplify or</text><text x="110" y="375" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">qualify?</text><line x1="540" y1="308" x2="540" y2="384" stroke="#c9d6d4" stroke-width="2"/><text x="560" y="322" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">WHY IT MATTERS</text><text x="560" y="346" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A piece with no job is decoration</text><line x1="70" y1="402" x2="70" y2="418" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="422" width="840" height="87" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="70" cy="465.5" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="70" y="473.42" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="110" y="458" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Where is it?</text><text x="110" y="484" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Beginning, turning point, ending?</text><line x1="540" y1="438" x2="540" y2="493" stroke="#c9d6d4" stroke-width="2"/><text x="560" y="452" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">WHY IT MATTERS</text><text x="560" y="476" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Several points show a pattern</text><line x1="70" y1="511" x2="70" y2="527" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="531" width="840" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="70" cy="575" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="70" y="582.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="110" y="567" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Does it complicate?</text><text x="110" y="593" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Does it conflict with the claim in any way?</text><line x1="540" y1="547" x2="540" y2="603" stroke="#c9d6d4" stroke-width="2"/><text x="560" y="561" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">WHY IT MATTERS</text><text x="560" y="585" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Honest handling of counter-evidence</text><text x="560" y="606" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">strengthens the argument</text><line x1="70" y1="621" x2="70" y2="637" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="641" width="840" height="88" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><circle cx="70" cy="685" r="22" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="70" y="692.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="110" y="677" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Does the set cover the claim?</text><text x="110" y="703" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Is every part of the claim supported?</text><line x1="540" y1="657" x2="540" y2="713" stroke="#c9d6d4" stroke-width="2"/><text x="560" y="671" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">WHY IT MATTERS</text><text x="560" y="695" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Sufficiency depends on coverage, not</text><text x="560" y="716" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">count</text>
</svg>