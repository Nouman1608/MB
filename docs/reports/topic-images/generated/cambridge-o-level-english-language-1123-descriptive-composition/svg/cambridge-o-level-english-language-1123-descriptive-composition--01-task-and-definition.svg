<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 915" width="900" height="915" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="915" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The descriptive composition: what is asked</text>

<rect x="30" y="110" width="840" height="128" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="55" y="146" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Section B: answer ONE question from a choice of four</text><rect x="55" y="168" width="136" height="44" rx="22" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="123" y="196.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Descriptive</text><rect x="205" y="168" width="136" height="44" rx="22" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="273" y="196.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Descriptive</text><rect x="355" y="168" width="136" height="44" rx="22" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="423" y="196.12" font-size="17" font-weight="500" fill="#4a5568" text-anchor="middle">Narrative</text><rect x="505" y="168" width="136" height="44" rx="22" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="573" y="196.12" font-size="17" font-weight="500" fill="#4a5568" text-anchor="middle">Narrative</text><rect x="680" y="160" width="168" height="60" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="764" y="185" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">about 350–450</text><text x="764" y="208" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="middle">words · 25 marks</text><text x="450" y="284" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">The syllabus definition, broken into targets</text><rect x="30" y="306" width="360" height="56" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="210" y="340" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">“a person, place or situation”</text><line x1="398" y1="334" x2="436" y2="334" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="446" y="306" width="424" height="56" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="464" y="340" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">the subject of the piece</text><rect x="30" y="376" width="360" height="56" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="210" y="410" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">“including atmosphere”</text><line x1="398" y1="404" x2="436" y2="404" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="446" y="376" width="424" height="56" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="464" y="410" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">the mood of the scene, not just its contents</text><rect x="30" y="446" width="360" height="56" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="210" y="480" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">“in detail”</text><line x1="398" y1="474" x2="436" y2="474" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="446" y="446" width="424" height="56" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="464" y="480" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">specific, chosen details, not general statements</text><rect x="30" y="516" width="360" height="56" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="210" y="550" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">“so that the reader can picture it”</text><line x1="398" y1="544" x2="436" y2="544" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="446" y="516" width="424" height="56" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="464" y="550" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">the test of every sentence</text><text x="450" y="618" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Marked on four writing objectives</text><rect x="30" y="640" width="415" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="74" cy="682" r="26" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="74" y="689" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">W1</text><text x="114" y="676" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">articulate experience and express</text><text x="114" y="698" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">what is thought, felt and imagined</text><rect x="455" y="640" width="415" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="499" cy="682" r="26" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="499" y="689" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">W2</text><text x="539" y="676" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">organise and structure ideas and</text><text x="539" y="698" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">opinions for deliberate effect</text><rect x="30" y="736" width="415" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="74" cy="778" r="26" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="74" y="785" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">W3</text><text x="114" y="772" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">a range of vocabulary and sentence</text><text x="114" y="794" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">structures appropriate to context</text><rect x="455" y="736" width="415" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="499" cy="778" r="26" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="499" y="785" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">W5</text><text x="539" y="772" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">accurate spelling, punctuation</text><text x="539" y="794" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and grammar</text><rect x="30" y="840" width="840" height="50" rx="12" fill="#f4f6f6" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="871" font-size="17" font-weight="600" fill="#4a5568" text-anchor="middle">W4 (register) is not assessed in Section B.</text>
</svg>