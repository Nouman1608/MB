<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 670" width="900" height="670" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="670" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How the model passage is built</text>

<rect x="30" y="112" width="520" height="98" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="60" cy="144" r="18" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="150.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="88" y="151" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">One detail</text><text x="52" y="186" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">a pigeon under the last working light</text><rect x="580" y="112" width="290" height="98" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="598" y="144" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Opens on a precise image, not</text><text x="598" y="165" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">a general statement.</text><line x1="550" y1="161" x2="578" y2="161" stroke="#c9d6d4" stroke-width="2.5" stroke-dasharray="6 5"/><line x1="290" y1="212" x2="290" y2="230" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="45" y="232" width="490" height="98" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><circle cx="75" cy="264" r="18" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="75" y="270.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="103" y="271" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The departure board</text><text x="67" y="306" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">every line reads Cancelled</text><rect x="580" y="232" width="290" height="98" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="598" y="264" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">“has stopped pretending”:</text><text x="598" y="285" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">light personification, a</text><text x="598" y="306" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">weary mood.</text><line x1="535" y1="281" x2="578" y2="281" stroke="#c9d6d4" stroke-width="2.5" stroke-dasharray="6 5"/><line x1="290" y1="332" x2="290" y2="350" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="60" y="352" width="460" height="132" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><circle cx="90" cy="384" r="18" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="90" y="390.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="118" y="391" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The people</text><text x="82" y="426" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">a man asleep upright · two students sharing</text><text x="82" y="447" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">headphones · an old woman peeling an orange</text><rect x="580" y="352" width="290" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="598" y="384" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Each person is a precise</text><text x="598" y="405" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">picture; the orange’s smell</text><text x="598" y="426" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">is the one chosen sense, warm</text><text x="598" y="447" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">against the cold.</text><line x1="520" y1="418" x2="578" y2="418" stroke="#c9d6d4" stroke-width="2.5" stroke-dasharray="6 5"/><line x1="290" y1="486" x2="290" y2="504" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="75" y="506" width="430" height="98" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="105" cy="538" r="18" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="105" y="544.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="133" y="545" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">“Then the cleaner arrives.”</text><text x="97" y="580" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">a one-line paragraph</text><rect x="580" y="506" width="290" height="98" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="598" y="538" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A small event that serves the</text><text x="598" y="559" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">description and opens the</text><text x="598" y="580" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">next stage.</text><line x1="505" y1="555" x2="578" y2="555" stroke="#c9d6d4" stroke-width="2.5" stroke-dasharray="6 5"/><text x="290" y="644" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="middle">a zoom structure: one detail → the board → the people → next stage</text>
</svg>