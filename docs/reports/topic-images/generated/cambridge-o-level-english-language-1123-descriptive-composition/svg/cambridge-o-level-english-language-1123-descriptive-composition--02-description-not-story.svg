<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="700" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Description is not a story</text>

<rect x="270" y="112" width="360" height="64" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="151" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">You find yourself writing “and then”</text><line x1="450" y1="176" x2="450" y2="214" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><path d="M450,218 L600,278 L450,338 L300,278 Z" fill="#d4b02e" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><text x="450" y="274" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Am I still</text><text x="450" y="298" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">describing?</text><path d="M300,278 L190,278 L190,370" fill="none" stroke="#2e6b62" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahT)"/><path d="M600,278 L710,278 L710,370" fill="none" stroke="#b5602e" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahR)"/><text x="245" y="266" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">yes</text><text x="655" y="266" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">no</text><rect x="30" y="378" width="405" height="290" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="55" y="414" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">A small event serves the picture</text><text x="55" y="446" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Events are allowed, but they are not the</text><text x="55" y="469" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">point. If something happens, it should</text><text x="55" y="492" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">be small.</text><rect x="55" y="520" width="220" height="42" rx="21" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="165" y="547.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">a gust of wind</text><rect x="55" y="574" width="220" height="42" rx="21" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="165" y="601.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">a stall closing</text><text x="55" y="650" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="start">The scene stays the subject.</text><rect x="465" y="378" width="405" height="290" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="490" y="414" font-size="20" font-weight="700" fill="#b5602e" text-anchor="start">Drift into narrative</text><text x="490" y="446" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The commonest weakness in descriptive</text><text x="490" y="469" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">answers: a plot takes over.</text><text x="565" y="524" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">starts at</text><text x="771" y="524" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">ends with</text><rect x="490" y="536" width="150" height="64" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="565" y="574" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">a market</text><line x1="648" y1="568" x2="688" y2="568" stroke="#b5602e" stroke-width="3.5" marker-end="url(#ahR)"/><rect x="696" y="536" width="150" height="64" rx="12" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="771" y="574" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">a chase</text><text x="490" y="650" font-size="17" font-weight="600" fill="#b5602e" text-anchor="start">The story has replaced the picture.</text>
</svg>