<rect x="300" y="110" width="300" height="60" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="147" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">A market at dawn</text><text x="450" y="204" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">Decide the mood first, then select details that point that way.</text><path d="M300,140 L110,140 L110,236" fill="none" stroke="#2e6b62" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahT)"/><path d="M600,140 L790,140 L790,236" fill="none" stroke="#b5602e" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahR)"/><rect x="30" y="244" width="405" height="230" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="55" y="282" font-size="22" font-weight="700" fill="#2e6b62" text-anchor="start">Peaceful</text><rect x="55" y="304" width="355" height="46" rx="23" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="232.5" y="333.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">the first stallholder yawning</text><rect x="55" y="364" width="355" height="46" rx="23" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="232.5" y="393.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">a cat stretching on a sack of rice</text><text x="55" y="450" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="start">Selection → a calm, gentle mood</text><rect x="465" y="244" width="405" height="230" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="490" y="282" font-size="22" font-weight="700" fill="#b5602e" text-anchor="start">Unsettling</text><rect x="490" y="304" width="355" height="46" rx="23" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="667.5" y="333.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">shutters half-raised</text><rect x="490" y="364" width="355" height="46" rx="23" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="667.5" y="393.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">a single light swinging</text><text x="490" y="450" font-size="17" font-weight="600" fill="#b5602e" text-anchor="start">Selection → an uneasy mood</text><text x="450" y="520" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">The strongest atmosphere tools</text><rect x="30" y="540" width="200" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="130" cy="588" r="18" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><line x1="155" y1="588" x2="163" y2="588" stroke="#1e2a44" stroke-width="2.5" stroke-linecap="round"/><line x1="147.6776695296637" y1="605.6776695296637" x2="153.33452377915606" y2="611.334523779156" stroke="#1e2a44" stroke-width="2.5" stroke-linecap="round"/><line x1="130" y1="613" x2="130" y2="621" stroke="#1e2a44" stroke-width="2.5" stroke-linecap="round"/><line x1="112.32233047033631" y1="605.6776695296637" x2="106.66547622084394" y2="611.334523779156" stroke="#1e2a44" stroke-width="2.5" stroke-linecap="round"/><line x1="105" y1="588" x2="97" y2="588" stroke="#1e2a44" stroke-width="2.5" stroke-linecap="round"/><line x1="112.32233047033631" y1="570.3223304703363" x2="106.66547622084393" y2="564.665476220844" stroke="#1e2a44" stroke-width="2.5" stroke-linecap="round"/><line x1="130" y1="563" x2="130" y2="555" stroke="#1e2a44" stroke-width="2.5" stroke-linecap="round"/><line x1="147.6776695296637" y1="570.3223304703363" x2="153.33452377915606" y2="564.665476220844" stroke="#1e2a44" stroke-width="2.5" stroke-linecap="round"/><text x="130" y="650" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">light</text><rect x="243" y="540" width="200" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M313,596 a14,14 0 0 1 10,-24 a18,18 0 0 1 34,-4 a13,13 0 0 1 16,22 z" fill="#ffffff" stroke="#1e2a44" stroke-width