<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 708" width="900" height="708" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="708" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Detail that does work</text>

<rect x="30" y="110" width="840" height="124" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="55" y="146" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">General words give the reader nothing to picture</text><rect x="55" y="166" width="70" height="42" rx="21" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="90" y="192.76" font-size="16" font-weight="600" fill="#b5602e" text-anchor="middle">nice</text><rect x="137" y="166" width="76" height="42" rx="21" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="175" y="192.76" font-size="16" font-weight="600" fill="#b5602e" text-anchor="middle">busy</text><rect x="225" y="166" width="108" height="42" rx="21" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="279" y="192.76" font-size="16" font-weight="600" fill="#b5602e" text-anchor="middle">beautiful</text><rect x="345" y="166" width="86" height="42" rx="21" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="388" y="192.76" font-size="16" font-weight="600" fill="#b5602e" text-anchor="middle">lots of</text><text x="470" y="194" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="start">→ replace them with specific words</text><rect x="30" y="254" width="840" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="55" y="296" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="start">Specific noun</text><text x="220" y="296" font-size="18" font-weight="400" fill="#b5602e" text-anchor="start">food</text><line x1="218" y1="290" x2="258" y2="290" stroke="#b5602e" stroke-width="2"/><line x1="395" y1="290" x2="440" y2="290" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><rect x="452" y="266" width="400" height="46" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="470" y="296" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">skewers of charred corn</text><rect x="30" y="338" width="840" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="55" y="380" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="start">Specific noun</text><text x="220" y="380" font-size="18" font-weight="400" fill="#b5602e" text-anchor="start">a bird</text><line x1="218" y1="374" x2="276" y2="374" stroke="#b5602e" stroke-width="2"/><line x1="395" y1="374" x2="440" y2="374" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><rect x="452" y="350" width="400" height="46" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="470" y="380" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">a crow</text><rect x="30" y="422" width="840" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="55" y="464" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="start">Precise verb</text><text x="220" y="464" font-size="18" font-weight="400" fill="#b5602e" text-anchor="start">the smoke went up</text><line x1="218" y1="458" x2="375" y2="458" stroke="#b5602e" stroke-width="2"/><line x1="395" y1="458" x2="440" y2="458" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><rect x="452" y="434" width="400" height="46" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="470" y="464" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">the smoke unravelled into the dark</text><rect x="30" y="522" width="270" height="160" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="558" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Selected senses</text><text x="50" y="594" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">One striking sound or smell</text><text x="50" y="616" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">is worth more than five</text><text x="50" y="638" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">listed ones.</text><rect x="315" y="522" width="270" height="160" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="335" y="558" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Figurative language</text><text x="335" y="594" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Use it sparingly: one fresh</text><text x="335" y="616" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">simile per paragraph is</text><text x="335" y="638" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">plenty; three in one</text><text x="335" y="660" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">sentence is clutter.</text><rect x="600" y="522" width="270" height="160" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="620" y="558" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">People in the scene</text><text x="620" y="594" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A single figure doing</text><text x="620" y="616" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">something characteristic</text><text x="620" y="638" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">brings a place alive.</text>
</svg>