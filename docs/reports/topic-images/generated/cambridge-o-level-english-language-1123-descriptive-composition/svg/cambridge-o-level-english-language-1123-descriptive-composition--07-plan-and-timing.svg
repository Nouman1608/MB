<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 826" width="900" height="826" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="826" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Plan, write, proofread</text>

<rect x="30" y="120" width="270" height="170" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="50" y="156" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Plan</text><text x="50" y="184" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">about five minutes</text><text x="50" y="216" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">atmosphere, structure,</text><text x="50" y="237" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">specific details per stage</text><line x1="301" y1="205" x2="314" y2="205" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="315" y="120" width="270" height="170" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="335" y="156" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Write</text><text x="335" y="184" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">four or five paragraphs</text><text x="335" y="216" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">aim for the middle of</text><text x="335" y="237" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">350–450 words; open on a</text><text x="335" y="258" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">precise image</text><line x1="586" y1="205" x2="599" y2="205" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="600" y="120" width="270" height="170" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="620" y="156" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Proofread</text><text x="620" y="184" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">a few minutes</text><text x="620" y="216" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">W5: spelling, punctuation,</text><text x="620" y="237" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">grammar</text><text x="450" y="336" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">A five-minute plan, filled in from the model passage</text><rect x="30" y="356" width="200" height="46" rx="8" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="130" y="385" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Title</text><rect x="242" y="356" width="628" height="46" rx="8" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="262" y="385" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">Describe a railway station late at night.</text><rect x="30" y="410" width="200" height="46" rx="8" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="130" y="439" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Atmosphere</text><rect x="242" y="410" width="628" height="46" rx="8" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="262" y="439" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">weary, cold; one warm detail against it</text><rect x="30" y="464" width="200" height="46" rx="8" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="130" y="493" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Structure</text><rect x="242" y="464" width="628" height="46" rx="8" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="262" y="493" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">zoom</text><rect x="30" y="518" width="200" height="46" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="130" y="547" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Stage 1</text><rect x="242" y="518" width="628" height="46" rx="8" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="262" y="547" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">a pigeon under the last working light</text><rect x="30" y="572" width="200" height="46" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="130" y="601" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Stage 2</text><rect x="242" y="572" width="628" height="46" rx="8" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="262" y="601" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">the departure board: every line Cancelled</text><rect x="30" y="626" width="200" height="46" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="130" y="655" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Stage 3</text><rect x="242" y="626" width="628" height="46" rx="8" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="262" y="655" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">travellers on the benches; the smell of an orange</text><rect x="30" y="680" width="200" height="46" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="130" y="709" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Stage 4</text><rect x="242" y="680" width="628" height="46" rx="8" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="262" y="709" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">Then the cleaner arrives.</text><rect x="30" y="744" width="840" height="56" rx="12" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="450" y="779" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">Not this opening: “The station was very quiet.” Begin with a precise image.</text>
</svg>