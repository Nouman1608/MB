<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 790" width="900" height="790" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="790" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What the health paragraph does</text>

<text x="450" y="128" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Task: do young people in your area live healthily? Your habits, and what could be done</text><rect x="30" y="148" width="840" height="136" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="186" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">1. Problem + cause and effect</text><text x="846" y="232" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="end">‏جس کی وجہ سے‏</text><text x="846" y="268" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">which is why ... (linking a habit to its effect)</text><rect x="30" y="298" width="840" height="136" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="336" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">2. Trend: present continuous</text><text x="846" y="382" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="end">‏موٹاپا بڑھ رہا ہے‏</text><text x="846" y="418" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">obesity is rising</text><rect x="30" y="448" width="840" height="136" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="52" y="486" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">3. Personal then-and-now</text><text x="846" y="532" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="end">‏پہلے میں بھی روزانہ کولڈ ڈرنک پیتا تھا، لیکن اب میں صرف پانی پیتا ہوں‏</text><text x="846" y="568" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">I used to drink cola daily, but now I drink only water</text><rect x="30" y="598" width="840" height="136" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="636" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">4. Solution + purpose</text><text x="846" y="682" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="end">‏اسکولوں کو ... چاہیے ... تاکہ طلبہ فٹ رہیں‏</text><text x="846" y="718" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">schools should ... so that students stay fit</text><text x="450" y="762" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">To push it further, add a hypothetical with if ... would</text>
</svg>