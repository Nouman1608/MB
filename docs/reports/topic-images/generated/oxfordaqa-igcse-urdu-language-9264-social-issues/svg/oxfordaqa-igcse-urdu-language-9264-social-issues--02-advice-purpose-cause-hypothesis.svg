<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 730" width="900" height="730" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="730" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four structures for social issues</text>

<rect x="30" y="110" width="840" height="140" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="148" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Advice</text><text x="330" y="152" font-family="Noto Nastaliq Urdu" font-size="22" font-weight="400" fill="#2e6b62" text-anchor="middle">‏کو ... چاہیے‏</text><text x="420" y="148" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the person advised takes the oblique</text><text x="846" y="198" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="end">‏ہمیں روزانہ ورزش کرنی چاہیے‏</text><text x="846" y="234" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">We should exercise every day.</text><rect x="30" y="262" width="840" height="140" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="300" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Purpose</text><text x="330" y="304" font-family="Noto Nastaliq Urdu" font-size="22" font-weight="400" fill="#2e6b62" text-anchor="middle">‏تاکہ‏</text><text x="420" y="300" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">+ subjunctive</text><text x="846" y="350" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="end">‏میں رضاکارانہ کام کرتا ہوں تاکہ دوسروں کی مدد کر سکوں‏</text><text x="846" y="386" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">I do voluntary work so that I can help others.</text><rect x="30" y="414" width="840" height="140" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="452" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Cause</text><text x="330" y="456" font-family="Noto Nastaliq Urdu" font-size="22" font-weight="400" fill="#2e6b62" text-anchor="middle">‏کی وجہ سے‏</text><text x="846" y="502" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="end">‏نیند کی کمی کی وجہ سے طلبہ کلاس میں توجہ نہیں دے پاتے‏</text><text x="846" y="538" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">Because of lack of sleep, students cannot concentrate in class.</text><rect x="30" y="566" width="840" height="140" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="52" y="604" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Hypothesis</text><text x="330" y="608" font-family="Noto Nastaliq Urdu" font-size="22" font-weight="400" fill="#2e6b62" text-anchor="middle">‏اگر ... تو‏</text><text x="420" y="604" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">more sophisticated than "should"</text><text x="846" y="654" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="end">‏اگر نوجوان زیادہ سوتے تو وہ کم ذہنی دباؤ محسوس کرتے‏</text><text x="846" y="690" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">If young people slept more, they would feel less stressed.</text>
</svg>