<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 654" width="900" height="654" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="654" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">If ... would: keep both halves matching</text>

<rect x="30" y="110" width="840" height="200" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><circle cx="66" cy="150" r="15" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><path d="M59,150 l5,6 l10,-12" fill="none" stroke="#2e6b62" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><text x="94" y="156" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Both halves in the matching form</text><text x="846" y="226" font-family="Noto Nastaliq Urdu" font-size="28" font-weight="400" fill="#1e2a44" text-anchor="end">‏اگر نوجوان زیادہ سوتے تو وہ کم ذہنی دباؤ محسوس کرتے۔‏</text><text x="846" y="284" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">If young people slept more, they would feel less stressed.</text><rect x="30" y="330" width="840" height="200" rx="14" fill="#f6ece4" stroke="#b5602e" stroke-width="2.5"/><circle cx="66" cy="370" r="15" fill="#f6ece4" stroke="#b5602e" stroke-width="2.5"/><path d="M60,364 l12,12 m0,-12 l-12,12" fill="none" stroke="#b5602e" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><text x="94" y="376" font-size="20" font-weight="700" fill="#b5602e" text-anchor="start">Mixed forms: a common error</text><text x="846" y="446" font-family="Noto Nastaliq Urdu" font-size="28" font-weight="400" fill="#b5602e" text-anchor="end">‏اگر نوجوان زیادہ سوئیں تو وہ ... محسوس کرتے‏</text><text x="846" y="504" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">the first half no longer matches the second</text><rect x="30" y="550" width="840" height="78" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="584" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Also check the time phrase:</text><text x="54" y="610" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">"every Saturday", not "every week"</text><text x="846" y="598" font-family="Noto Nastaliq Urdu" font-size="26" font-weight="400" fill="#1e2a44" text-anchor="end">‏ہر ہفتے کے دن‏</text>
</svg>