<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 840" width="900" height="840" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="840" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Charity: from bare to developed</text>

<rect x="30" y="110" width="840" height="90" rx="12" fill="#f6ece4" stroke="#b5602e" stroke-width="2.5"/><text x="54" y="146" font-size="20" font-weight="700" fill="#b5602e" text-anchor="start">Weak</text><text x="54" y="174" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">a bare statement and a vague judgement</text><text x="846" y="166" font-family="Noto Nastaliq Urdu" font-size="26" font-weight="400" fill="#b5602e" text-anchor="end">‏میں خیرات دیتا ہوں۔ یہ اچھی بات ہے۔‏</text><text x="54" y="240" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Developed</text><rect x="30" y="258" width="840" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="296" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">What you did</text><text x="846" y="336" font-family="Noto Nastaliq Urdu" font-size="23" font-weight="400" fill="#1e2a44" text-anchor="end">‏پچھلے رمضان میں ہم نے اپنے اسکول میں ضرورت مند خاندانوں کے لیے راشن جمع کیا۔‏</text><text x="846" y="372" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">Last Ramadan we collected rations for needy families at school.</text><rect x="30" y="400" width="840" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="438" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Your own part</text><text x="846" y="478" font-family="Noto Nastaliq Urdu" font-size="23" font-weight="400" fill="#1e2a44" text-anchor="end">‏میں نے دس دن تک روزانہ دو گھنٹے سامان کی پیکنگ میں مدد کی۔‏</text><text x="846" y="514" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">For ten days I helped pack goods for two hours a day.</text><rect x="30" y="542" width="840" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="580" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The difference it made</text><text x="846" y="620" font-family="Noto Nastaliq Urdu" font-size="23" font-weight="400" fill="#1e2a44" text-anchor="end">‏جب ہم نے یہ تھیلے بانٹے تو لوگوں کی خوشی دیکھ کر مجھے بہت سکون ملا۔‏</text><text x="846" y="656" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">Seeing people’s happiness when we gave out the bags gave me great peace.</text><rect x="30" y="684" width="840" height="130" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="52" y="722" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">A wider view</text><text x="846" y="762" font-family="Noto Nastaliq Urdu" font-size="23" font-weight="400" fill="#1e2a44" text-anchor="end">‏میرے خیال میں ہر طالب علم کو سال میں کم از کم ایک بار رضاکارانہ کام کرنا چاہیے۔‏</text><text x="846" y="798" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">Every student should volunteer at least once a year.</text>
</svg>