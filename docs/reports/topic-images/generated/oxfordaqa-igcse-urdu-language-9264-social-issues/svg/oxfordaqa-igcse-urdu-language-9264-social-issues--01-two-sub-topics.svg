<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Social issues: two sub-topics</text>

<rect x="30" y="110" width="410" height="456" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="148" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Charity and voluntary work</text><text x="52" y="174" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">helping others, raising money, charities</text><rect x="48" y="196" width="180" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="138" y="242" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="middle">‏رضاکار‏</text><text x="138" y="280" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">volunteer</text><rect x="238" y="196" width="180" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="328" y="242" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="middle">‏فلاحی ادارہ‏</text><text x="328" y="280" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">charitable organisation</text><rect x="48" y="316" width="180" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="138" y="362" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="middle">‏چندہ جمع کرنا‏</text><text x="138" y="400" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">to collect donations</text><rect x="238" y="316" width="180" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="328" y="362" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="middle">‏عطیہ دینا‏</text><text x="328" y="400" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">to donate</text><rect x="48" y="436" width="180" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="138" y="482" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="middle">‏ضرورت مند‏</text><text x="138" y="520" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">needy (person)</text><rect x="238" y="436" width="180" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="328" y="482" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="middle">‏یتیم خانہ‏</text><text x="328" y="520" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">orphanage</text><rect x="460" y="110" width="410" height="456" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="482" y="148" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Healthy and unhealthy living</text><text x="482" y="174" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">diet, exercise, sleep, stress, habits</text><rect x="478" y="196" width="180" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="568" y="242" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="middle">‏متوازن غذا‏</text><text x="568" y="280" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">balanced diet</text><rect x="668" y="196" width="180" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="758" y="242" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="middle">‏ورزش‏</text><text x="758" y="280" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">exercise</text><rect x="478" y="316" width="180" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="568" y="362" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="middle">‏نیند‏</text><text x="568" y="400" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">sleep</text><rect x="668" y="316" width="180" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="758" y="362" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="middle">‏ذہنی دباؤ‏</text><text x="758" y="400" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">stress</text><rect x="478" y="436" width="180" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="568" y="482" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="middle">‏موٹاپا‏</text><text x="568" y="520" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">obesity</text><rect x="668" y="436" width="180" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="758" y="482" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="middle">‏تمباکو نوشی‏</text><text x="758" y="520" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">smoking</text><rect x="30" y="600" width="840" height="92" rx="12" fill="#f6ece4" stroke="#b5602e" stroke-width="2.5"/><text x="54" y="636" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">Poverty is not part of this topic: it sits under Global issues</text><text x="54" y="666" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Social issues here are about individuals and communities, not the wider world</text>
