<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 696" width="900" height="696" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="696" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Vary how you give an opinion</text>

<text x="450" y="128" font-size="17" font-weight="600" fill="#4a5568" text-anchor="middle">Each starter is followed by a full clause with its own verb</text><rect x="30" y="148" width="840" height="74" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="192" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">there is no doubt that ...</text><text x="846" y="196" font-family="Noto Nastaliq Urdu" font-size="26" font-weight="400" fill="#1e2a44" text-anchor="end">‏اس میں کوئی شک نہیں کہ ...‏</text><rect x="30" y="234" width="840" height="74" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="278" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">it is sad that ...</text><text x="846" y="282" font-family="Noto Nastaliq Urdu" font-size="26" font-weight="400" fill="#1e2a44" text-anchor="end">‏یہ بات افسوس ناک ہے کہ ...‏</text><rect x="30" y="320" width="840" height="74" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="364" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">in my view, the real problem is that ...</text><text x="846" y="368" font-family="Noto Nastaliq Urdu" font-size="26" font-weight="400" fill="#1e2a44" text-anchor="end">‏میری رائے میں اصل مسئلہ یہ ہے کہ ...‏</text><rect x="30" y="406" width="840" height="74" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="450" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">the most important thing is that ...</text><text x="846" y="454" font-family="Noto Nastaliq Urdu" font-size="26" font-weight="400" fill="#1e2a44" text-anchor="end">‏سب سے اہم بات یہ ہے کہ ...‏</text><rect x="30" y="492" width="840" height="74" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="536" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">if we really want change, then ...</text><text x="846" y="540" font-family="Noto Nastaliq Urdu" font-size="26" font-weight="400" fill="#1e2a44" text-anchor="end">‏اگر ہم واقعی تبدیلی چاہتے ہیں تو ...‏</text><rect x="30" y="586" width="840" height="84" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="54" y="622" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Obligation in the future, an alternative to should:</text><text x="54" y="648" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">we will have to make time</text><text x="846" y="634" font-family="Noto Nastaliq Urdu" font-size="26" font-weight="400" fill="#1e2a44" text-anchor="end">‏وقت نکالنا ہو گا‏</text>
</svg>