<rect width="900" height="812" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The irrigation system: river to field</text>

<rect x="30" y="110" width="840" height="118" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="60" y="139" width="80" height="50" fill="#b5d3cf"/><path d="M140,129 L170,129 L190,199 L140,199 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3"/><rect x="190" y="179" width="20" height="20" fill="#b5d3cf"/><circle cx="270" cy="169" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="270" y="176.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="312" y="150" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Dam</text><text x="312" y="178" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Stores water</text><text x="840" y="150" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="end" font-style="italic">e.g. Tarbela, Mangla</text><line x1="130" y1="230" x2="130" y2="248" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="250" width="840" height="118" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="60" y="299" width="150" height="34" fill="#b5d3cf"/><rect x="80" y="275" width="14" height="58" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><rect x="110" y="275" width="14" height="58" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><rect x="140" y="275" width="14" height="58" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><rect x="170" y="275" width="14" height="58" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><line x1="60" y1="279" x2="200" y2="279" stroke="#1e2a44" stroke-width="5"/><circle cx="270" cy="309" r="22" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="270" y="316.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="312" y="290" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Barrage</text><text x="312" y="318" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Raises the river level and diverts water into canals</text><text x="840" y="290" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="end" font-style="italic">e.g. Sukkur, Guddu, Taunsa</text><line x1="130" y1="370" x2="130" y2="388" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="390" width="840" height="118" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M70,421 L70,479" fill="none" stroke="#2b5a9a" stroke-width="12" stroke-linejoin="round" stroke-linecap="round" /><path d="M200,421 L200,479" fill="none" stroke="#2b5a9a" stroke-width="12" stroke-linejoin="round" stroke-linecap="round" /><path d="M76,449 L190,449" fill="none" stroke="#2e6b62" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahT)"/><text x="70" y="497" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">W</text><text x="200" y="497" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">E</text><circle cx="270" cy="449" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="270" y="456.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="312" y="430" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Link canal</text><text x="312" y="458" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Moves water from western rivers to eastern ones after the</text><text x="312" y="480" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Indus Waters Treaty</text><line x1="130" y1="510" x2="130" y2="528" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="530" width="840" height="118" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M60,569 L210,569" fill="none" stroke="#2b5a9a" stroke-width="10" stroke-linejoin="round" stroke-linecap="round" /><path d="M90,571 L90,619" fill="none" stroke="#2b5a9a" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><path d="M140,571 L140,619" fill="none" stroke="#2b5a9a" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><path d="M190,571 L190,619" fill="none" stroke="#2b5a9a" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="270" cy="589" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="270" y="596.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="312" y="570" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Distribution canals and watercourses</text><text x="312" y="598" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Carry the water on towards the farms</text><line x1="130" y1="650" x2="130" y2="668" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="670" width="840" height="118" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="60" y="695" width="150" height="68" fill="#a9c48f" stroke="#1e2a44" stroke-width="2"/><line x1="135" y1="695" x2="135" y2="763" stroke="#9c8f6e" stroke-width="7"/><line x1="60" y1="729" x2="210" y2="729" stroke="#9c8f6e" stroke-width="7"/><path d="M60,695 L210,695" fill="none" stroke="#2b5a9a" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" /><circle cx="270" cy="729" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="270" y="736.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="312" y="710" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Field channels and bunds</text><text x="312" y="738" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Bunds (earth ridges) hold the water on each plot</text>
</svg>