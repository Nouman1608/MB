-linecap="round" /><path d="M764,380 q-15,-4 -30,14" fill="none" stroke="#6f9a52" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" /><path d="M764,380 q20,-24 40,-6" fill="none" stroke="#6f9a52" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" /><path d="M764,380 q16,-2 32,16" fill="none" stroke="#6f9a52" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" /><path d="M764,380 q0,-48 0,-30" fill="none" stroke="#6f9a52" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" /><ellipse cx="685" cy="458" rx="11" ry="8" fill="#6f9a52" stroke="#1e2a44" stroke-width="1.5"/><ellipse cx="713" cy="458" rx="11" ry="8" fill="#6f9a52" stroke="#1e2a44" stroke-width="1.5"/><ellipse cx="800" cy="458" rx="11" ry="8" fill="#6f9a52" stroke="#1e2a44" stroke-width="1.5"/><rect x="842" y="424" width="22" height="40" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><line x1="853" y1="470" x2="853" y2="630" stroke="#1e2a44" stroke-width="5"/><text x="140" y="230" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">hills</text><text x="52" y="272" font-size="16" font-weight="700" fill="#2b5a9a" text-anchor="start">water table</text><text x="150" y="470" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">groundwater</text><text x="150" y="494" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="middle">in the hills</text><line x1="450" y1="192" x2="450" y2="428" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><text x="330" y="160" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">underground tunnel: water flows</text><text x="330" y="182" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">by gravity, little lost to evaporation</text><text x="730" y="256" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">OASIS</text><text x="730" y="280" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">dates tolerate heat and</text><text x="730" y="300" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">some salinity; vegetables</text><text x="730" y="320" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">grow in their shade</text><text x="866" y="412" font-size="16" font-weight="700" fill="#b5602e" text-anchor="end">tubewell</text><text x="690" y="520" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">over-pumping lowers the water table</text><text x="690" y="542" font-size="16" font-weight="400" fill="#b5602e" text-anchor="middle">below the tunnel: the karez runs dry</text><rect x="30" y="660" width="840" height="84" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="52" y="694" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Why many karez have dried up</text><text x="52" y="722" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Nearby tubewells lower the water table; fewer people are available to clean the channels.</text>
