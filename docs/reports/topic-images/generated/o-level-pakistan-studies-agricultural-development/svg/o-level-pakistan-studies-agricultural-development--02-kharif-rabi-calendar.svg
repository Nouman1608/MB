<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Kharif and rabi: the farming year</text>

<rect x="730" y="150" width="56" height="246" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="198" y="190" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">J</text><text x="254" y="190" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">F</text><text x="310" y="190" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">M</text><text x="366" y="190" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">A</text><text x="422" y="190" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">M</text><text x="478" y="190" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">J</text><text x="534" y="190" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">J</text><text x="590" y="190" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">A</text><text x="646" y="190" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">S</text><text x="702" y="190" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">O</text><text x="758" y="190" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="middle">N</text><text x="814" y="190" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">D</text><line x1="170" y1="204" x2="170" y2="396" stroke="#c9d6d4" stroke-width="1.5"/><line x1="226" y1="204" x2="226" y2="396" stroke="#c9d6d4" stroke-width="1.5"/><line x1="282" y1="204" x2="282" y2="396" stroke="#c9d6d4" stroke-width="1.5"/><line x1="338" y1="204" x2="338" y2="396" stroke="#c9d6d4" stroke-width="1.5"/><line x1="394" y1="204" x2="394" y2="396" stroke="#c9d6d4" stroke-width="1.5"/><line x1="450" y1="204" x2="450" y2="396" stroke="#c9d6d4" stroke-width="1.5"/><line x1="506" y1="204" x2="506" y2="396" stroke="#c9d6d4" stroke-width="1.5"/><line x1="562" y1="204" x2="562" y2="396" stroke="#c9d6d4" stroke-width="1.5"/><line x1="618" y1="204" x2="618" y2="396" stroke="#c9d6d4" stroke-width="1.5"/><line x1="674" y1="204" x2="674" y2="396" stroke="#c9d6d4" stroke-width="1.5"/><line x1="730" y1="204" x2="730" y2="396" stroke="#c9d6d4" stroke-width="1.5"/><line x1="786" y1="204" x2="786" y2="396" stroke="#c9d6d4" stroke-width="1.5"/><line x1="842" y1="204" x2="842" y2="396" stroke="#c9d6d4" stroke-width="1.5"/><text x="40" y="252" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">KHARIF</text><text x="40" y="276" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">summer crops</text><rect x="284" y="222" width="220" height="64" rx="10" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5" stroke-dasharray="8 6"/><text x="394" y="250" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">sown spring or</text><text x="394" y="270" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">early summer</text><rect x="508" y="222" width="108" height="64" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5" /><text x="562" y="261" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">grow</text><rect x="620" y="222" width="164" height="64" rx="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5" stroke-dasharray="8 6"/><text x="702" y="250" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">harvested</text><text x="702" y="270" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">autumn</text><text x="40" y="348" font-size="20" font-weight="700" fill="#2b5a9a" text-anchor="start">RABI</text><text x="40" y="372" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">winter crops</text><rect x="172" y="318" width="108" height="64" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5" /><text x="226" y="357" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">grow</text><rect x="284" y="318" width="164" height="64" rx="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5" /><text x="366" y="346" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">harvested</text><text x="366" y="366" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Mar to May</text><rect x="676" y="318" width="164" height="64" rx="10" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5" /><text x="758" y="346" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">sown</text><text x="758" y="366" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Oct to Dec</text><text x="562" y="357" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">no rabi crop</text><text x="758" y="140" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">November overlap</text><text x="870" y="424" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">Dashed edges: kharif timing is given only by season</text><rect x="30" y="444" width="410" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="482" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="start">Kharif crops</text><text x="52" y="514" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">Cotton, rice, sugar cane, maize, millet</text><text x="52" y="548" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Need heat and plenty of water from canals and</text><text x="52" y="569" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the monsoon.</text><rect x="460" y="444" width="410" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="482" y="482" font-size="21" font-weight="700" fill="#2b5a9a" text-anchor="start">Rabi crops</text><text x="482" y="514" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">Wheat, gram, oilseeds</text><text x="482" y="548" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Grow in mild winter temperatures; rely on</text><text x="482" y="569" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">canal water, tubewells or winter rain from</text><text x="482" y="590" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">western depressions.</text><rect x="30" y="630" width="840" height="74" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="661" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">In November, cotton picking and wheat sowing overlap,</text><text x="450" y="686" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">so cotton-wheat farmers face a labour squeeze.</text>
</svg>