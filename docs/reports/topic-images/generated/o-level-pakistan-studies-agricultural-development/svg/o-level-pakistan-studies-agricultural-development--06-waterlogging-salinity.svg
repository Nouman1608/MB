<rect width="900" height="780" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Waterlogging and salinity</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Not to scale</text>
<rect x="30" y="110" width="840" height="400" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="40" y="260" width="820" height="240" fill="#efdfa8"/><line x1="40" y1="260" x2="860" y2="260" stroke="#1e2a44" stroke-width="3"/><path d="M80,260 L100,300 L190,300 L210,260 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="145" y="246" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">unlined canal</text><line x1="110" y1="306" x2="110" y2="352" stroke="#2b5a9a" stroke-width="3" marker-end="url(#ah)"/><line x1="145" y1="306" x2="145" y2="352" stroke="#2b5a9a" stroke-width="3" marker-end="url(#ah)"/><line x1="180" y1="306" x2="180" y2="352" stroke="#2b5a9a" stroke-width="3" marker-end="url(#ah)"/><text x="145" y="378" font-size="16" font-weight="600" fill="#2b5a9a" text-anchor="middle">seepage</text><path d="M40,460 L860,460" stroke="#2b5a9a" stroke-width="2.5" stroke-dasharray="10 7"/><rect x="40" y="400" width="820" height="100" fill="#b5d3cf" opacity="0.7"/><text x="60" y="486" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">water table before</text><line x1="40" y1="400" x2="860" y2="400" stroke="#2b5a9a" stroke-width="3.5"/><text x="850" y="392" font-size="16" font-weight="700" fill="#2b5a9a" text-anchor="end">water table rises</text><line x1="760" y1="456" x2="760" y2="410" stroke="#2b5a9a" stroke-width="3" marker-end="url(#ah)"/><path d="M400,394 q-8,-15 0,-30 q8,-15 0,-30 q-8,-15 0,-30" fill="none" stroke="#2e6b62" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahT)"/><path d="M470,394 q-8,-15 0,-30 q8,-15 0,-30 q-8,-15 0,-30" fill="none" stroke="#2e6b62" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahT)"/><path d="M540,394 q-8,-15 0,-30 q8,-15 0,-30 q-8,-15 0,-30" fill="none" stroke="#2e6b62" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahT)"/><path d="M610,394 q-8,-15 0,-30 q8,-15 0,-30 q-8,-15 0,-30" fill="none" stroke="#2e6b62" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahT)"/><text x="505" y="448" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="middle">capillary action draws water up</text><path d="M420,248 q10,-14 0,-28 q-10,-14 0,-28" fill="none" stroke="#b5602e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahR)"/><path d="M520,248 q10,-14 0,-28 q-10,-14 0,-28" fill="none" stroke="#b5602e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahR)"/><path d="M620,248 q10,-14 0,-28 q-10,-14 0,-28" fill="none" stroke="#b5602e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahR)"/><text x="700" y="200" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">hot sun:</text><text x="700" y="220" font-size="16" font-weight="400" fill="#b5602e" text-anchor="start">evaporation</text><rect x="360" y="254" width="9" height="6" fill="#ffffff" stroke="#4a5568" stroke-width="1"/><rect x="373" y="254" width="9" height="6" fill="#ffffff" stroke="#4a5568" stroke-width="1"/><rect x="386" y="254" width="9" height="6" fill="#ffffff" stroke="#4a5568" stroke-width="1"/><rect x="399" y="254" width="9" height="6" fill="#ffffff" stroke="#4a5568" stroke-width="1"/><rect x="412" y="254" width="9" height="6" fill="#ffffff" stroke="#4a5568" stroke-width="1"/><rect x="425" y="254" width="9" height="6" fill="#ffffff" stroke="#4a5568" stroke-width="1"/><rect x="438" y="254" width="9" height="6" fill="#ffffff" stroke="#4a5568" stroke-width="1"/><rect x="451" y="254" width="9" height="6" fill="#ffffff" stroke="#4a5568" stroke-width="1"/><rect x="464" y="254" width="9" height="6" fill="#ffffff" stroke="#4a5568" stroke-width="1"/><rect x="477" y="254" width="9" height="6" fill="#ffffff" stroke="#4a5568" stroke-width="1"/><rect x="490" y="254" width="9" height="6" fill="#ffffff" stroke="#4a5568" stroke-width="1"/><rect x="503" y="254" width="9" height="6" fill="#ffffff" stroke="#4a5568" stroke-width="1"/><rect x="516" y="254" width="9" height="6" fill="#ffffff" stroke="#4a5568" stroke-width="1"/><rect x="529" y="254" width="9" height="6" fill="#ffffff" stroke="#4a5568" stroke-width="1"/><rect x="542" y="254" width="9" height="6" fill="#ffffff" stroke="#4a5568" stroke-width="1"/><rect x="555" y="254" width="9" height="6" fill="#ffffff" stroke="#4a5568" stroke-width="1"/><rect x="568" y="254" width="9" height="6" fill="#ffffff" stroke="#4a5568" stroke-width="1"/><rect x="581" y="254" width="9" height="6" fill="#ffffff" stroke="#4a5568" stroke-width="1"/><rect x="594" y="254" width="9" height="6" fill="#ffffff" stroke="#4a5568" stroke-width="1"/><rect x="607" y="254" width="9" height="6" fill="#ffffff" stroke="#4a5568" stroke-width="1"/><rect x="620" y="254" width="9" height="6" fill="#ffffff" stroke="#4a5568" stroke-width="1"/><rect x="633" y="254" width="9" height="6" fill="#ffffff" stroke="#4a5568" stroke-width="1"/><rect x="646" y="254" width="9" height="6" fill="#ffffff" stroke="#4a5568" stroke-width="1"/><rect x="659" y="254" width="9" height="6" fill="#ffffff" stroke="#4a5568" stroke-width="1"/><text x="520" y="150" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">salt crust left behind: yields fall</text><line x1="520" y1="160" x2="520" y2="184" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><text x="60" y="150" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">over-irrigation and</text><text x="60" y="170" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">poor drainage add water</text><rect x="30" y="530" width="410" height="230" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="568" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="start">Restore the land</text><text x="70" y="602" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">SCARPs (from the 1960s): tubewells pump the</text><text x="70" y="622" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">water table down</text><circle cx="58" cy="597" r="5" fill="#2e6b62"/><text x="70" y="648" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Drains carry saline water to the sea, e.g.</text><text x="70" y="668" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Left Bank Outfall Drain</text><circle cx="58" cy="643" r="5" fill="#2e6b62"/><text x="70" y="694" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Flush fields; add gypsum to sodic soil</text><circle cx="58" cy="689" r="5" fill="#2e6b62"/><rect x="460" y="530" width="410" height="230" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="482" y="568" font-size="21" font-weight="700" fill="#2b5a9a" text-anchor="start">Prevent it</text><text x="500" y="602" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Line watercourses</text><circle cx="488" cy="597" r="5" fill="#2b5a9a"/><text x="500" y="648" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Laser land levelling</text><circle cx="488" cy="643" r="5" fill="#2b5a9a"/><text x="500" y="694" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Measured water allocation</text><circle cx="488" cy="689" r="5" fill="#2b5a9a"/><text x="500" y="740" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Sprinkler or drip irrigation</text><circle cx="488" cy="735" r="5" fill="#2b5a9a"/>
</svg>