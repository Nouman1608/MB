<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 802" width="900" height="802" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="802" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Raising farm output: gains and limits</text>

<rect x="30" y="110" width="840" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="146" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">What government did</text><rect x="52" y="156" width="220" height="38" rx="8" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2" /><text x="162" y="181" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Land reforms</text><text x="292" y="181" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">1959, 1972, 1977: lower ceiling on land per owner</text><rect x="52" y="208" width="220" height="38" rx="8" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2" /><text x="162" y="233" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Improved seeds</text><text x="292" y="233" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Green Revolution wheat of the 1960s</text><rect x="52" y="260" width="220" height="38" rx="8" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2" /><text x="162" y="285" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Research</text><text x="292" y="285" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">e.g. Ayub Agricultural Research Institute, Faisalabad</text><rect x="52" y="312" width="220" height="38" rx="8" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2" /><text x="162" y="337" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Training and credit</text><text x="292" y="337" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Extension training; loans from Zarai Taraqiati Bank</text><rect x="52" y="364" width="220" height="38" rx="8" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2" /><text x="162" y="389" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Subsidies</text><text x="292" y="389" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Fertiliser, tractors and solar tubewells</text><line x1="450" y1="446" x2="450" y2="486" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="30" y="492" width="410" height="290" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="235" y="532" font-size="22" font-weight="700" fill="#2e6b62" text-anchor="middle">Gains</text><text x="74" y="576" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Yields rose</text><circle cx="58" cy="570" r="6" fill="#2e6b62"/><text x="74" y="634" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Land ceilings were lowered, aiming to</text><text x="74" y="656" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">give tenants security</text><circle cx="58" cy="628" r="6" fill="#2e6b62"/><rect x="460" y="492" width="410" height="290" rx="14" fill="#f6e4d8" stroke="#b5602e" stroke-width="2.5"/><text x="665" y="532" font-size="22" font-weight="700" fill="#b5602e" text-anchor="middle">Limits</text><text x="504" y="576" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Much land stayed with large owners</text><circle cx="488" cy="570" r="6" fill="#b5602e"/><text x="504" y="634" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Benefits went mainly to larger farmers</text><circle cx="488" cy="628" r="6" fill="#b5602e"/><text x="504" y="692" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Chemicals raised costs and polluted water</text><circle cx="488" cy="686" r="6" fill="#b5602e"/><text x="504" y="750" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Tubewell expansion drew groundwater down</text><circle cx="488" cy="744" r="6" fill="#b5602e"/>
</svg>