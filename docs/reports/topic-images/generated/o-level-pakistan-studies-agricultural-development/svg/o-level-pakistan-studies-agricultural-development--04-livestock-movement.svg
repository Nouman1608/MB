<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="900" height="650" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="650" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Keeping livestock: fixed or on the move</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Not to scale</text>
<rect x="30" y="110" width="840" height="360" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M60,440 L60,410 Q260,400 420,270 Q520,180 600,180 Q680,180 760,290 Q810,370 840,410 L840,440 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><path d="M520,202 Q600,172 680,202" fill="none" stroke="#6f9a52" stroke-width="10" stroke-linecap="round"/><path d="M70,410 Q180,406 260,388" fill="none" stroke="#6f9a52" stroke-width="10" stroke-linecap="round"/><path d="M250,360 Q330,240 500,180" fill="none" stroke="#2e6b62" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahT)"/><path d="M560,240 Q520,380 300,374" fill="none" stroke="#b5602e" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahR)"/><text x="600" y="156" font-size="18" font-weight="700" fill="#3d5f2a" text-anchor="middle">high summer pastures</text><text x="230" y="260" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="end">SUMMER</text><text x="230" y="282" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="end">flocks moved up</text><text x="588" y="310" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">WINTER</text><text x="588" y="332" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">back down to valleys</text><text x="588" y="352" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">or the plains</text><text x="150" y="434" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">valleys / plains</text><text x="60" y="150" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Transhumance</text><text x="60" y="174" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">sheep and goats in the northern</text><text x="60" y="194" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">mountains and Balochistan</text><rect x="30" y="490" width="410" height="140" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="528" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Small farms</text><text x="52" y="560" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Buffalo and cattle are stall-fed on fodder</text><text x="52" y="583" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">and crop waste, staying in one place.</text><rect x="460" y="490" width="410" height="140" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="482" y="528" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Cholistan</text><text x="482" y="560" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Herders move between rain-fed ponds (tobas)</text><text x="482" y="583" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">and canal areas as the water dries up.</text>
</svg>