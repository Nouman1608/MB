<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 868" width="900" height="868" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="868" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A farm as a system</text>

<rect x="50" y="112" width="236" height="40" rx="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5" /><text x="168" y="139" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">INPUTS</text><rect x="332" y="112" width="236" height="40" rx="20" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5" /><text x="450" y="139" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">PROCESSES</text><rect x="614" y="112" width="236" height="40" rx="20" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5" /><text x="732" y="139" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">OUTPUTS</text><rect x="30" y="170" width="840" height="166" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="204" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Subsistence</text><text x="202.6" y="204" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">e.g. a 3-acre rice plot in a Sindh village</text><rect x="50" y="222" width="236" height="92" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="64" y="252" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Family labour, oxen,</text><text x="64" y="274" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">saved seed, canal water</text><line x1="290" y1="268" x2="326" y2="268" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="332" y="222" width="236" height="92" rx="12" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2.5" /><text x="346" y="252" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Ploughing,</text><text x="346" y="274" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">transplanting, weeding,</text><text x="346" y="296" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">hand harvesting</text><line x1="572" y1="268" x2="608" y2="268" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="614" y="222" width="236" height="92" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="628" y="252" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Rice and vegetables</text><text x="628" y="274" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">eaten by the family; a</text><text x="628" y="296" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">small surplus sold</text><rect x="30" y="350" width="840" height="210" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="384" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Cash crop</text><text x="177.39999999999998" y="384" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">e.g. a cotton farm near Vehari</text><rect x="50" y="402" width="236" height="136" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="64" y="432" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Hired labour, tractor,</text><text x="64" y="454" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">certified seed,</text><text x="64" y="476" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">fertiliser, pesticide,</text><text x="64" y="498" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">tubewell water, bank</text><text x="64" y="520" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">loan</text><line x1="290" y1="470" x2="326" y2="470" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="332" y="402" width="236" height="136" rx="12" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2.5" /><text x="346" y="432" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Machine sowing,</text><text x="346" y="454" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">spraying, picking</text><line x1="572" y1="470" x2="608" y2="470" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="614" y="402" width="236" height="136" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="628" y="432" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Seed cotton sold to a</text><text x="628" y="454" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">ginning factory; profit</text><text x="628" y="476" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">reinvested</text><rect x="30" y="574" width="840" height="166" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="608" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Livestock</text><text x="177.39999999999998" y="608" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">e.g. a buffalo dairy near Lahore</text><rect x="50" y="626" width="236" height="92" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="64" y="656" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Fodder (berseem, maize),</text><text x="64" y="678" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">concentrates, vet</text><text x="64" y="700" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">services</text><line x1="290" y1="672" x2="326" y2="672" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="332" y="626" width="236" height="92" rx="12" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2.5" /><text x="346" y="656" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Feeding, milking,</text><text x="346" y="678" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">breeding</text><line x1="572" y1="672" x2="608" y2="672" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="614" y="626" width="236" height="92" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="628" y="656" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Milk, calves, dung for</text><text x="628" y="678" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">fuel and fertiliser</text><path d="M732,748 L732,784 L168,784 L168,752" fill="none" stroke="#8a6d0d" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahO)"/><text x="450" y="818" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="middle">FEEDBACK: profit or failure in one season</text><text x="450" y="842" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="middle">changes the inputs of the next</text>
</svg>