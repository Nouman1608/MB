linecap="round"/><line x1="60" y1="360" x2="101" y2="360" stroke="#1e2a44" stroke-width="3" stroke-linecap="round"/><g transform="rotate(90 60 320)"><line x1="20" y1="320" x2="41" y2="320" stroke="#1e2a44" stroke-width="3" stroke-linecap="round"/><line x1="79" y1="320" x2="100" y2="320" stroke="#1e2a44" stroke-width="3" stroke-linecap="round"/></g><circle cx="60" cy="320" r="19" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><path d="M50,320 q5,-10 10,0 q5,10 10,0" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><line x1="475" y1="290" x2="520" y2="290" stroke="#1e2a44" stroke-width="3" stroke-linecap="round"/><line x1="475" y1="350" x2="520" y2="350" stroke="#1e2a44" stroke-width="3" stroke-linecap="round"/><text x="135" y="504" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">primary</text><text x="135" y="526" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">2300 turns, 230 V</text><text x="425" y="504" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">secondary</text><text x="425" y="526" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Ns turns, 6.0 V, 0.50 A</text><text x="280" y="156" font-size="17" font-weight="600" fill="#4a5568" text-anchor="middle">soft-iron core</text><rect x="570" y="330" width="300" height="238" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="590" y="366" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Worked example 1</text><text x="590" y="400" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Vp / Vs = Np / Ns</text><text x="590" y="430" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Ns = 2300 × 6.0 / 230</text><text x="620" y="460" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">= 60 turns</text><text x="590" y="490" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Extended: IpVp = IsVs</text><text x="590" y="520" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Ip = (0.50 × 6.0) / 230</text><text x="620" y="550" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">= 0.013 A</text><rect x="570" y="110" width="300" height="200" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="720" y="163.6" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">a.c. in primary →</text><text x="720" y="189.6" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">changing field in core →</text><text x="720" y="215.6" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">induced e.m.f. in secondary</text><text x="720" y="241.6" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">(d.c. gives a steady field:</text><text x="720" y="267.6" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">no e.m.f.)</text>
