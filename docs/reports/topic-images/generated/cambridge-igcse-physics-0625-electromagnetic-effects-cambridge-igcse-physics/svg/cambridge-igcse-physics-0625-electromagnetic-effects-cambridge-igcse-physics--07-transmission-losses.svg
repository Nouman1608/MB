<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="640" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why transmit at high voltage</text>

<rect x="30" y="72" width="148.8" height="30" rx="15" fill="#8a6d0d"/><text x="42" y="93" font-size="16" font-weight="700" fill="#ffffff" text-anchor="start">Extended only</text><rect x="30" y="110" width="840" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="150" font-size="19" font-weight="600" fill="#1e2a44" text-anchor="start">20 MW through cables of total resistance 5.0 Ω</text><text x="60" y="220" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">400 kV</text><text x="60" y="248" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">I = 20 × 10⁶ / 400 × 10³ = 50 A</text><rect x="340" y="190" width="500" height="50" rx="6" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><rect x="837" y="190" width="3" height="50" rx="0" fill="#b5602e" stroke="#b5602e" stroke-width="1"/><text x="352" y="222" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">20 MW sent</text><text x="840" y="268" font-size="18" font-weight="700" fill="#b5602e" text-anchor="end">loss = 50² × 5.0 = 12 500 W (12.5 kW)</text><text x="840" y="290" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end">a tiny sliver</text><text x="60" y="340" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">20 kV</text><text x="60" y="368" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">I = 20 × 10⁶ / 20 × 10³ = 1000 A</text><rect x="340" y="310" width="500" height="50" rx="6" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><rect x="715" y="310" width="125" height="50" rx="0" fill="#b5602e" stroke="#b5602e" stroke-width="1"/><text x="352" y="342" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">20 MW sent</text><text x="840" y="388" font-size="18" font-weight="700" fill="#b5602e" text-anchor="end">loss = 1000² × 5.0 = 5.0 × 10⁶ W (5.0 MW)</text><text x="840" y="410" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end">a quarter of the power sent</text><rect x="30" y="460" width="840" height="150" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="507.65" font-size="19" font-weight="600" fill="#1e2a44" text-anchor="middle">Voltage × 20 → current ÷ 20 → loss ÷ 20² = 400</text><text x="450" y="541.65" font-size="19" font-weight="600" fill="#1e2a44" text-anchor="middle">Use P = I²R with the current in the cables.</text><text x="450" y="575.65" font-size="19" font-weight="600" fill="#1e2a44" text-anchor="middle">Smaller current: less energy wasted heating the cables; thinner cables.</text>
</svg>