 stroke-width="3"/><text x="837" y="246" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">N</text><line x1="811" y1="310" x2="727" y2="310" stroke="#2e6b62" stroke-width="2.5" marker-end="url(#ahT)"/><text x="769" y="340" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="middle">field</text><circle cx="769" cy="235" r="14" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><circle cx="769" cy="235" r="4.5" fill="#1e2a44"/><line x1="769" y1="255" x2="769" y2="300" stroke="#b5602e" stroke-width="5" marker-end="url(#ahR)"/><circle cx="70" cy="393" r="11" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><line x1="63.4" y1="386.4" x2="76.6" y2="399.6" stroke="#1e2a44" stroke-width="3" stroke-linecap="round"/><line x1="63.4" y1="399.6" x2="76.6" y2="386.4" stroke="#1e2a44" stroke-width="3" stroke-linecap="round"/><text x="90" y="400" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">current into the page</text><circle cx="320" cy="393" r="11" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><circle cx="320" cy="393" r="4.5" fill="#1e2a44"/><text x="340" y="400" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">current out of the page</text><line x1="580" y1="393" x2="620" y2="393" stroke="#b5602e" stroke-width="4" marker-end="url(#ahR)"/><text x="632" y="400" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">force on the wire</text><rect x="30" y="420" width="840" height="115" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="455.45" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Force is at right angles to both the current and the field; none if the wire is parallel to the field.</text><text x="450" y="483.45" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Extended: a beam of electrons counts as a current opposite to their motion;</text><text x="450" y="511.45" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">apply the left-hand rule to that current.</text>
