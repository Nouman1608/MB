<rect width="900" height="700" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Inducing a current with a magnet</text>

<rect x="30" y="110" width="410" height="420" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="235" y="148" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Push N pole in</text><ellipse cx="260" cy="260" rx="8" ry="44" fill="none" stroke="#8a6d0d" stroke-width="4"/><ellipse cx="278" cy="260" rx="8" ry="44" fill="none" stroke="#8a6d0d" stroke-width="4"/><ellipse cx="296" cy="260" rx="8" ry="44" fill="none" stroke="#8a6d0d" stroke-width="4"/><ellipse cx="314" cy="260" rx="8" ry="44" fill="none" stroke="#8a6d0d" stroke-width="4"/><ellipse cx="332" cy="260" rx="8" ry="44" fill="none" stroke="#8a6d0d" stroke-width="4"/><ellipse cx="350" cy="260" rx="8" ry="44" fill="none" stroke="#8a6d0d" stroke-width="4"/><line x1="360" y1="304" x2="400" y2="304" stroke="#1e2a44" stroke-width="2.5" stroke-linecap="round"/><line x1="400" y1="304" x2="400" y2="380" stroke="#1e2a44" stroke-width="2.5" stroke-linecap="round"/><line x1="400" y1="380" x2="220" y2="380" stroke="#1e2a44" stroke-width="2.5" stroke-linecap="round"/><line x1="220" y1="380" x2="220" y2="304" stroke="#1e2a44" stroke-width="2.5" stroke-linecap="round"/><line x1="220" y1="304" x2="250" y2="304" stroke="#1e2a44" stroke-width="2.5" stroke-linecap="round"/><circle cx="310" cy="380" r="24" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><line x1="310" y1="392" x2="322" y2="364" stroke="#b5602e" stroke-width="3" stroke-linecap="round"/><text x="310" y="425" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">meter</text><rect x="70" y="238" width="70" height="44" rx="6" fill="#2e6b62" stroke="#1e2a44" stroke-width="3"/><text x="105" y="268" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">S</text><rect x="140" y="238" width="70" height="44" rx="6" fill="#b5602e" stroke="#1e2a44" stroke-width="3"/><text x="175" y="268" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">N</text><line x1="90" y1="210" x2="190" y2="210" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><text x="250" y="196" font-size="24" font-weight="700" fill="#b5602e" text-anchor="middle">N</text><text x="235" y="470" font-size="17" font-weight="600" fill="#b5602e" text-anchor="middle">induced N pole repels the magnet</text><text x="235" y="495" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">meter deflects one way</text><rect x="460" y="110" width="410" height="420" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="665" y="148" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Pull N pole out</text><ellipse cx="690" cy="260" rx="8" ry="44" fill="none" stroke="#8a6d0d" stroke-width="4"/><ellipse cx="708" cy="260" rx="8" ry="44" fill="none" stroke="#8a6d0d" stroke-width="4"/><ellipse cx="726" cy="260" rx="8" ry="44" fill="none" stroke="#8a6d0d" stroke-width="4"/><ellipse cx="744" cy="260" rx="8" ry="44" fill="none" stroke="#8a6d0d" stroke-width="4"/><ellipse cx="762" cy="260" rx="8" ry="44" fill="none" stroke="#8a6d0d" stroke-width="4"/><ellipse cx="780" cy="260" rx="8" ry="44" fill="none" stroke="#8a6d0d" stroke-width="4"/><line x1="790" y1="304" x2="830" y2="304" stroke="#1e2a44" stroke-width="2.5" stroke-linecap="round"/><line x1="830" y1="304" x2="830" y2="380" stroke="#1e2a44" stroke-width="2.5" stroke-linecap="round"/><line x1="830" y1="380" x2="650" y2="380" stroke="#1e2a44" stroke-width="2.5" stroke-linecap="round"/><line x1="650" y1="380" x2="650" y2="304" stroke="#1e2a44" stroke-width="2.5" stroke-linecap="round"/><line x1="650" y1="304" x2="680" y2="304" stroke="#1e2a44" stroke-width="2.5" stroke-linecap="round"/><circle cx="740" cy="380" r="24" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><line x1="740" y1="392" x2="728" y2="364" stroke="#b5602e" stroke-width="3" stroke-linecap="round"/><text x="740" y="425" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">meter</text><rect x="480" y="238" width="70" height="44" rx="6" fill="#2e6b62" stroke="#1e2a44" stroke-width="3"/><text x="515" y="268" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">S</text><rect x="550" y="238" width="70" height="44" rx="6" fill="#b5602e" stroke="#1e2a44" stroke-width="3"/><text x="585" y="268" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">N</text><line x1="600" y1="210" x2="500" y2="210" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><text x="680" y="196" font-size="24" font-weight="700" fill="#2e6b62" text-anchor="middle">S</text><text x="665" y="470" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="middle">induced S pole attracts the magnet</text><text x="665" y="495" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">meter deflects the other way</text><text x="450" y="92" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="middle">Extended: the induced e.m.f. opposes the change causing it</text><rect x="30" y="550" width="840" height="125" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="588" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Bigger induced e.m.f.:</text><text x="60" y="622" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">move faster  •  stronger magnet  •  more turns on the coil</text><text x="60" y="655" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">None if there is no relative movement, or a wire moves parallel to the field lines.</text>
</svg>