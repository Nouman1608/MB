<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 690" width="900" height="690" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="690" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Two effects that mirror each other</text>

<rect x="30" y="110" width="840" height="96" rx="14" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2.5"/><text x="55" y="148" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Motor effect</text><text x="55" y="182" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">current  +  magnetic field  →  force (motion)</text><text x="845" y="182" font-size="17" font-weight="400" fill="#4a5568" text-anchor="end">electrical → kinetic</text><rect x="30" y="220" width="840" height="96" rx="14" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2.5"/><text x="55" y="258" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Electromagnetic induction</text><text x="55" y="292" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">motion  +  magnetic field  →  induced e.m.f. (current)</text><text x="845" y="292" font-size="17" font-weight="400" fill="#4a5568" text-anchor="end">kinetic → electrical</text><rect x="30" y="334" width="148.8" height="30" rx="15" fill="#8a6d0d"/><text x="42" y="355" font-size="16" font-weight="700" fill="#ffffff" text-anchor="start">Extended only</text><rect x="30" y="375" width="410" height="285" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="235" y="410" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">LEFT hand: motors</text><line x1="90" y1="580" x2="90" y2="470" stroke="#b5602e" stroke-width="4" marker-end="url(#ahR)"/><line x1="90" y1="580" x2="160" y2="525" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><line x1="90" y1="580" x2="210" y2="580" stroke="#8a6d0d" stroke-width="4" marker-end="url(#ahO)"/><text x="100" y="462" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">thumb: motion (thrust)</text><text x="168" y="520" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">first finger: Field</text><text x="220" y="586" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="start">second: Current</text><circle cx="90" cy="580" r="6" fill="#1e2a44"/><rect x="460" y="375" width="410" height="285" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="665" y="410" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">RIGHT hand: generators</text><line x1="760" y1="580" x2="760" y2="470" stroke="#b5602e" stroke-width="4" marker-end="url(#ahR)"/><line x1="760" y1="580" x2="830" y2="525" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><line x1="760" y1="580" x2="640" y2="580" stroke="#8a6d0d" stroke-width="4" marker-end="url(#ahO)"/><text x="750" y="480" font-size="17" font-weight="700" fill="#b5602e" text-anchor="end">thumb: motion</text><text x="820" y="612" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="end">first: Field</text><text x="630" y="586" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="end">second: Current</text><circle cx="760" cy="580" r="6" fill="#1e2a44"/><text x="235" y="645" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">field drawn going into the page</text><text x="665" y="645" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">field drawn going into the page</text>
</svg>