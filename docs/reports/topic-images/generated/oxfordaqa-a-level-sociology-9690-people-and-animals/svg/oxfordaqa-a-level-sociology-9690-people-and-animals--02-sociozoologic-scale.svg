<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 647" width="900" height="647" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="647" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The sociozoologic scale</text>

<rect x="60" y="110" width="56" height="380" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><line x1="88" y1="470" x2="88" y2="134" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><text x="140" y="144" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">“Good” animals: protected</text><text x="140" y="170" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">pets; useful "tools" such as working dogs</text><text x="140" y="454" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">“Bad” animals: killed with little concern</text><text x="140" y="480" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">"vermin" that cross boundaries into homes</text><rect x="480" y="190" width="370" height="60" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="500" y="227" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The rat as</text><text x="600" y="227" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Pet</text><text x="690" y="227" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">in a child’s bedroom</text><line x1="130" y1="220" x2="470" y2="220" stroke="#c9d6d4" stroke-width="2" stroke-dasharray="6 6"/><rect x="480" y="270" width="370" height="60" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="500" y="307" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The rat as</text><text x="600" y="307" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Tool</text><text x="690" y="307" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">in a laboratory</text><line x1="130" y1="300" x2="470" y2="300" stroke="#c9d6d4" stroke-width="2" stroke-dasharray="6 6"/><rect x="480" y="350" width="370" height="60" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="500" y="387" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The rat as</text><text x="600" y="387" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Vermin</text><text x="690" y="387" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">in a kitchen</text><line x1="130" y1="380" x2="470" y2="380" stroke="#c9d6d4" stroke-width="2" stroke-dasharray="6 6"/><rect x="30" y="510" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="546" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Arluke and Sanders (1996)</text><text x="56" y="575" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Societies rank animals by how well they fit human purposes. The same species moves up or</text><text x="56" y="597" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">down the scale by setting, so an animal’s status is socially constructed.</text>
</svg>