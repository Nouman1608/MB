<rect width="900" height="468" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Biotechnology and experimentation</text>

<rect x="30" y="110" width="266.6666666666667" height="86" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="163.33333333333334" y="142.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Replace</text><text x="163.33333333333334" y="172.3" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">animals where possible</text><rect x="316.6666666666667" y="110" width="266.6666666666667" height="86" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="142.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Reduce</text><text x="450" y="172.3" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">the numbers used</text><rect x="603.3333333333334" y="110" width="266.6666666666667" height="86" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="736.6666666666667" y="142.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Refine</text><text x="736.6666666666667" y="172.3" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">methods to reduce suffering</text><text x="450" y="224" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Russell and Burch (1959): the 3Rs of animal experimentation</text><line x1="120" y1="256" x2="120" y2="432" stroke="#1e2a44" stroke-width="4"/><rect x="142" y="246" width="728" height="56" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="120" cy="274" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="98" y="280" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="end">1996</text><text x="160" y="280.64" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Dolly the sheep cloned at the Roslin Institute: adult cells can clone mammals</text><rect x="142" y="316" width="728" height="56" rx="12" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="120" cy="344" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="98" y="350" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="end">2013</text><text x="160" y="350.64" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">EU bans marketing of cosmetics tested on animals</text><rect x="142" y="386" width="728" height="56" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="120" cy="414" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="98" y="420" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="end">2015</text><text x="160" y="420.64" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">US regulators approve a genetically modified salmon for food</text>
</svg>