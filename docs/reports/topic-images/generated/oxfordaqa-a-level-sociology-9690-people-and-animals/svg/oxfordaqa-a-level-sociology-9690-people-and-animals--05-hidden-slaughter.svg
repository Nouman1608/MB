<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="480" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Keeping killing out of sight</text>

<rect x="30" y="110" width="250.66666666666666" height="106" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="155.33333333333331" y="163.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Living animal</text><line x1="284.66666666666663" y1="163" x2="320.66666666666663" y2="163" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="324.66666666666663" y="110" width="250.66666666666666" height="106" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="449.99999999999994" y="142.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Killing hidden</text><text x="449.99999999999994" y="172.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">divided into many tasks,</text><text x="449.99999999999994" y="193.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">out of sight</text><line x1="579.3333333333333" y1="163" x2="615.3333333333333" y2="163" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="619.3333333333333" y="110" width="250.66666666666666" height="106" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="744.6666666666666" y="142.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Meat</text><text x="744.6666666666666" y="172.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">separated from the living</text><text x="744.6666666666666" y="193.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">animal</text><rect x="30" y="238" width="269.3333333333333" height="216" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,288 L31.25,252.25 Q31.25,239.25 44.25,239.25 L285.0833333333333,239.25 Q298.0833333333333,239.25 298.0833333333333,252.25 L298.0833333333333,288 Z" fill="#dce9e7"/><line x1="31.25" y1="288" x2="298.0833333333333" y2="288" stroke="#c9d6d4" stroke-width="2"/><text x="164.66666666666666" y="268.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Noske (1989)</text><text x="44" y="319.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">animal-industrial complex</text><text x="44" y="346.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Farming, processing,</text><text x="44" y="367.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">pharmaceutical and retail</text><text x="44" y="388.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">interests treat animals as</text><text x="44" y="409.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">raw material.</text><rect x="315.3333333333333" y="238" width="269.3333333333333" height="216" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M316.5833333333333,288 L316.5833333333333,252.25 Q316.5833333333333,239.25 329.5833333333333,239.25 L570.4166666666666,239.25 Q583.4166666666666,239.25 583.4166666666666,252.25 L583.4166666666666,288 Z" fill="#dce9e7"/><line x1="316.5833333333333" y1="288" x2="583.4166666666666" y2="288" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="268.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Elias (1939)</text><text x="329.3333333333333" y="319.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">The Civilizing Process</text><text x="329.3333333333333" y="346.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Carving whole animals at</text><text x="329.3333333333333" y="367.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">table moved “behind the</text><text x="329.3333333333333" y="388.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">scenes”.</text><rect x="600.6666666666666" y="238" width="269.3333333333333" height="216" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.9166666666666,288 L601.9166666666666,252.25 Q601.9166666666666,239.25 614.9166666666666,239.25 L855.75,239.25 Q868.75,239.25 868.75,252.25 L868.75,288 Z" fill="#dce9e7"/><line x1="601.9166666666666" y1="288" x2="868.75" y2="288" stroke="#c9d6d4" stroke-width="2"/><text x="735.3333333333333" y="268.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Pachirat (2011)</text><text x="614.6666666666666" y="319.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">“politics of sight”</text><text x="614.6666666666666" y="346.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Undercover in a US</text><text x="614.6666666666666" y="367.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">slaughterhouse: killing</text><text x="614.6666666666666" y="388.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">hidden from consumers and</text><text x="614.6666666666666" y="409.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">most workers, so it is</text><text x="614.6666666666666" y="430.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">acceptable.</text>
</svg>