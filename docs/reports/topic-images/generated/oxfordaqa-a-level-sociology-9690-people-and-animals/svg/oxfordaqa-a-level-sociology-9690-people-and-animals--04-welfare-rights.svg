<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 582" width="900" height="582" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="582" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Welfare or rights?</text>

<rect x="30" y="104" width="404" height="263" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,154 L31.25,118.25 Q31.25,105.25 44.25,105.25 L419.75,105.25 Q432.75,105.25 432.75,118.25 L432.75,154 Z" fill="#b5d3cf"/><line x1="31.25" y1="154" x2="432.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="232" y="134.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Welfare</text><text x="48" y="190.4" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">Brambell Report (1965): the Five Freedoms</text><circle cx="53" cy="215.79" r="4.5" fill="#2e6b62"/><text x="66" y="221.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">From hunger and thirst</text><circle cx="53" cy="245.79" r="4.5" fill="#2e6b62"/><text x="66" y="251.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">From discomfort</text><circle cx="53" cy="275.78999999999996" r="4.5" fill="#2e6b62"/><text x="66" y="281.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">From pain, injury or disease</text><circle cx="53" cy="305.78999999999996" r="4.5" fill="#2e6b62"/><text x="66" y="311.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">To express normal behaviour</text><circle cx="53" cy="335.78999999999996" r="4.5" fill="#2e6b62"/><text x="66" y="341.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">From fear and distress</text><rect x="466" y="104" width="404" height="263" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M467.25,154 L467.25,118.25 Q467.25,105.25 480.25,105.25 L855.75,105.25 Q868.75,105.25 868.75,118.25 L868.75,154 Z" fill="#f2e7b8"/><line x1="467.25" y1="154" x2="868.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="668" y="134.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Rights</text><circle cx="489" cy="184.79" r="4.5" fill="#8a6d0d"/><text x="502" y="190.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Rejects any use that treats animals</text><text x="502" y="212.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">merely as means</text><circle cx="489" cy="236.79" r="4.5" fill="#8a6d0d"/><text x="502" y="242.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Includes humane farming</text><circle cx="489" cy="266.78999999999996" r="4.5" fill="#8a6d0d"/><text x="502" y="272.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Welfare reforms make animal use more</text><text x="502" y="294.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">acceptable and so entrench it</text><circle cx="450" cy="235.5" r="24" fill="#1e2a44"/><text x="450" y="242.5" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">vs</text><rect x="30" y="385" width="840" height="171" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="421" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Cruelty is socially defined</text><circle cx="61" cy="444.39" r="4.5" fill="#8a6d0d"/><text x="74" y="450" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Martin’s Act (1822) against cruelty to cattle; the society now known as the RSPCA</text><text x="74" y="472" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">founded 1824</text><circle cx="61" cy="496.39" r="4.5" fill="#8a6d0d"/><text x="74" y="502" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Bullfighting and some festivals: cruelty to critics, cultural heritage to supporters</text><circle cx="61" cy="526.39" r="4.5" fill="#8a6d0d"/><text x="74" y="532" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Welfarists reply that reforms reduce suffering now</text>
</svg>