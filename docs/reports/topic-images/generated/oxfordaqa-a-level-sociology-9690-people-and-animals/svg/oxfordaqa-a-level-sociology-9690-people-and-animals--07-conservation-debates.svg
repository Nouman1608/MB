<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 581" width="900" height="581" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="581" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Countering biodiversity loss: debates</text>

<rect x="218" y="104" width="322" height="44" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="379" y="131.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Example</text><rect x="548" y="104" width="322" height="44" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="709" y="131.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Criticism</text><rect x="30" y="156" width="180" height="93" rx="10" fill="#b5d3cf" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="196.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Protected areas</text><text x="42" y="218.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">and trade rules</text><rect x="218" y="156" width="322" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="232" y="186.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">CITES (1973) regulates trade in</text><text x="232" y="207.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">endangered species; protected areas</text><text x="232" y="228.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">such as Mkomazi, Tanzania</text><rect x="548" y="156" width="322" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="562" y="186.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Brockington (2002): "fortress</text><text x="562" y="207.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">conservation" evicts pastoralists;</text><text x="562" y="228.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">costs fall on the rural poor</text><rect x="30" y="257" width="180" height="93" rx="10" fill="#b5d3cf" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="297.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Zoos and</text><text x="42" y="319.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">reintroduction</text><rect x="218" y="257" width="322" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="232" y="287.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Arabian oryx: extinct in the wild</text><text x="232" y="308.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">by the early 1970s, reintroduced to</text><text x="232" y="329.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Oman in 1982</text><rect x="548" y="257" width="322" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="562" y="287.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Only a small share of zoo species</text><text x="562" y="308.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">are in such programmes</text><rect x="30" y="358" width="180" height="72" rx="10" fill="#b5d3cf" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="399.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">De-extinction</text><rect x="218" y="358" width="322" height="72" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="232" y="388.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Pyrenean ibex cloned in 2003; the</text><text x="232" y="409.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">kid died minutes after birth</text><rect x="548" y="358" width="322" height="72" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="562" y="388.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Diverts money from living species;</text><text x="562" y="409.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">is a clone the same species?</text><rect x="30" y="446" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="482" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Causes of loss to cite</text><text x="56" y="511" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Dodo (late 17th century); passenger pigeon (1914); megafauna "overkill" or climate;</text><text x="56" y="533" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Newfoundland cod moratorium (1992); Nile perch in Lake Victoria.</text>
</svg>