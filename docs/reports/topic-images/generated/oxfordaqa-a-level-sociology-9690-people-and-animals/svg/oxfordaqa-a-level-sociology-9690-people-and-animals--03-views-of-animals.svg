<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 545" width="900" height="545" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="545" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Changing views of animals</text>

<line x1="170" y1="120" x2="170" y2="378" stroke="#1e2a44" stroke-width="4"/><rect x="192" y="110" width="678" height="76" rx="12" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="170" cy="148" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="148" y="154" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="end">17th century</text><text x="210" y="140.64" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Descartes: animals as machines</text><text x="210" y="168.64" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Automata without minds; later used to justify use without moral concern</text><rect x="192" y="200" width="678" height="98" rx="12" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="170" cy="249" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="148" y="255" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="end">1789</text><text x="210" y="230.64" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Bentham: “Can they suffer?”</text><text x="210" y="258.64" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Not whether they can reason or talk; underpins welfare and Singer’s</text><text x="210" y="280.64" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">utilitarian case</text><rect x="192" y="312" width="678" height="76" rx="12" fill="#b5d3cf" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="170" cy="350" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="148" y="356" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="end">1970</text><text x="210" y="342.64" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Ryder: speciesism</text><text x="210" y="370.64" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Discrimination based on species membership; made widely known by Singer</text><rect x="30" y="408" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="444" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Avoid ethnocentrism</text><text x="56" y="473" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Many religious traditions set rules for the treatment and slaughter of animals, and some</text><text x="56" y="495" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">regard certain animals as sacred: the Western "pet or meat" division is not universal.</text>
</svg>