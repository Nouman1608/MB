<rect width="900" height="712" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Animals and human health</text>

<path d="M450,190 L240,372 L660,372 Z" fill="none" stroke="#2e6b62" stroke-width="4" stroke-linejoin="round"/><rect x="330" y="128" width="240" height="64" rx="32" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="167" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Human health</text><rect x="100" y="368" width="240" height="64" rx="32" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="220" y="407" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Animal health</text><rect x="560" y="368" width="240" height="64" rx="32" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="680" y="407" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Environmental health</text><text x="450" y="315" font-size="22" font-weight="700" fill="#2e6b62" text-anchor="middle">One Health</text><text x="450" y="342" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">treated as linked</text><rect x="30" y="460" width="412" height="226" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,510 L31.25,474.25 Q31.25,461.25 44.25,461.25 L427.75,461.25 Q440.75,461.25 440.75,474.25 L440.75,510 Z" fill="#f2e7b8"/><line x1="31.25" y1="510" x2="440.75" y2="510" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="490.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Drivers of zoonoses</text><circle cx="49" cy="535.9200000000001" r="4.5" fill="#2e6b62"/><text x="62" y="541.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Deforestation</text><circle cx="49" cy="564.9200000000001" r="4.5" fill="#2e6b62"/><text x="62" y="570.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Wildlife trade</text><circle cx="49" cy="593.9200000000001" r="4.5" fill="#2e6b62"/><text x="62" y="599.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Intensive farming crowding animals</text><circle cx="49" cy="622.9200000000001" r="4.5" fill="#2e6b62"/><text x="62" y="628.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Urban growth into forest edges</text><rect x="458" y="460" width="412" height="226" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,510 L459.25,474.25 Q459.25,461.25 472.25,461.25 L855.75,461.25 Q868.75,461.25 868.75,474.25 L868.75,510 Z" fill="#f2e7b8"/><line x1="459.25" y1="510" x2="868.75" y2="510" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="490.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Cases</text><circle cx="477" cy="535.9200000000001" r="4.5" fill="#2e6b62"/><text x="490" y="541.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Nipah</tspan> (Malaysia, 1998–99): fruit bats to</text><text x="490" y="562.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">pigs to pig farmers</text><circle cx="477" cy="585.9200000000001" r="4.5" fill="#2e6b62"/><text x="490" y="591.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Ebola</tspan> (West Africa, 2014–16): spread</text><text x="490" y="612.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">through cities with weak health systems</text><circle cx="477" cy="635.9200000000001" r="4.5" fill="#2e6b62"/><text x="490" y="641.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Antimicrobial resistance:</tspan> antibiotics in</text><text x="490" y="662.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">livestock</text>
</svg>