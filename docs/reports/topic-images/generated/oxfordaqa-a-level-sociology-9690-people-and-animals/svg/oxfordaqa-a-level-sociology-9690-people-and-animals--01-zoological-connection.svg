<rect width="900" height="677" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Animals run through social life</text>

<line x1="450" y1="265" x2="450" y2="189" stroke="#2e6b62" stroke-width="3"/><rect x="340" y="121" width="220" height="68" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="151" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Work</text><text x="450" y="175" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">farming, fishing, vets</text><line x1="519.282032302755" y1="292.5" x2="631.8653347947321" y2="254.5" stroke="#2e6b62" stroke-width="3"/><rect x="599.8076211353316" y="203.5" width="220" height="68" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="709.8076211353316" y="233.5" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Crime</text><text x="709.8076211353316" y="257.5" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">poaching, cruelty</text><line x1="519.282032302755" y1="347.5" x2="631.8653347947321" y2="385.5" stroke="#2e6b62" stroke-width="3"/><rect x="599.8076211353316" y="368.5" width="220" height="68" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="709.8076211353316" y="398.5" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Family life</text><text x="709.8076211353316" y="422.5" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">pets</text><line x1="450" y1="375" x2="450" y2="451" stroke="#2e6b62" stroke-width="3"/><rect x="340" y="451" width="220" height="68" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="481" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Religion</text><text x="450" y="505" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">sacrifice, dietary rules</text><line x1="380.71796769724494" y1="347.5" x2="268.13466520526794" y2="385.50000000000006" stroke="#2e6b62" stroke-width="3"/><rect x="80.19237886466846" y="368.50000000000006" width="220" height="68" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="190.19237886466846" y="398.50000000000006" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Leisure</text><text x="190.19237886466846" y="422.50000000000006" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">hunting, racing</text><line x1="380.71796769724494" y1="292.5" x2="268.1346652052679" y2="254.5" stroke="#2e6b62" stroke-width="3"/><rect x="80.1923788646684" y="203.5" width="220" height="68" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="190.1923788646684" y="244.5" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Social status</text><ellipse cx="450" cy="320" rx="90" ry="58" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="327" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Animals</text><rect x="30" y="540" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="576" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Bryant (1979): "The Zoological Connection"</text><text x="56" y="605" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Animals run through almost every area sociologists study; ignoring them leaves gaps in</text><text x="56" y="627" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">the study of human behaviour.</text>
</svg>