roke="#2e6b62" stroke-width="1.5"/><text x="508.5" y="470" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">non-literary</text><rect x="604" y="268" width="266" height="230" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="737" y="306" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Intertextuality:</text><text x="737" y="330" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">connecting texts</text><rect x="624" y="370" width="226" height="30" rx="6" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><text x="737" y="391" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">50 hours SL</text><rect x="624" y="408" width="226" height="30" rx="6" fill="#d4b02e" stroke="#8a6d0d" stroke-width="2"/><text x="737" y="429" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">80 hours HL</text><rect x="624" y="450" width="109" height="30" rx="6" fill="#d4b02e" stroke="#8a6d0d" stroke-width="1.5"/><text x="678.5" y="470" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">literary</text><rect x="741" y="450" width="109" height="30" rx="6" fill="#b5d3cf" stroke="#2e6b62" stroke-width="1.5"/><text x="795.5" y="470" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">non-literary</text><rect x="30" y="518" width="840" height="84" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="550" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Learner portfolio: mandatory, built over two years, used to prepare every component</text><text x="450" y="578" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">not assessed or moderated, but a school may have to submit it to show authenticity</text><text x="450" y="636" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">Hours are a recommendation: the areas often overlap in the study of a text.</text>
