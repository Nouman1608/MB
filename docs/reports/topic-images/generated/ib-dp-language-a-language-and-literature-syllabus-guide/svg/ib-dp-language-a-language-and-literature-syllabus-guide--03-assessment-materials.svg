<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What each assessment is set on</text>

<rect x="30" y="112" width="410" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="148" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Paper 1</text><text x="50" y="174" font-size="16" font-weight="600" fill="#4a5568" text-anchor="start">guided textual analysis</text><rect x="50" y="194" width="370" height="34" rx="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="1.5"/><text x="64" y="216" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">unseen non-literary passages</text><rect x="460" y="112" width="410" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="480" y="148" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Paper 2</text><text x="480" y="174" font-size="16" font-weight="600" fill="#4a5568" text-anchor="start">comparative essay</text><rect x="480" y="194" width="370" height="34" rx="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.5"/><text x="494" y="216" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">literary works only</text><rect x="30" y="262" width="410" height="220" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="298" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Individual oral</text><text x="50" y="324" font-size="16" font-weight="600" fill="#4a5568" text-anchor="start">connected to a common global issue</text><rect x="50" y="344" width="370" height="34" rx="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.5"/><text x="64" y="366" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">one literary work</text><rect x="50" y="388" width="370" height="34" rx="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="1.5"/><text x="64" y="410" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">one non-literary body of work</text><rect x="460" y="262" width="410" height="220" rx="14" fill="#fbf6e2" stroke="#8a6d0d" stroke-width="2.5" stroke-dasharray="7 5"/><text x="480" y="298" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">HL essay</text><rect x="782.67" y="280" width="73.33" height="22" rx="11" fill="#d4b02e" stroke="#8a6d0d" stroke-width="1.5"/><text x="819.3349999999999" y="296" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">HL only</text><text x="480" y="324" font-size="16" font-weight="600" fill="#4a5568" text-anchor="start">1,200 to 1,500 words</text><rect x="480" y="344" width="370" height="34" rx="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.5"/><text x="494" y="366" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">a literary work</text><rect x="480" y="388" width="370" height="34" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="1.5"/><text x="494" y="410" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">or</text><rect x="480" y="432" width="370" height="34" rx="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="1.5"/><text x="494" y="454" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">a non-literary body of work</text><rect x="50" y="501" width="24" height="18" rx="3" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.5"/><text x="82" y="516" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">literary material</text><rect x="269.12" y="501" width="24" height="18" rx="3" fill="#b5d3cf" stroke="#1e2a44" stroke-width="1.5"/><text x="301.12" y="516" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">non-literary material</text><text x="450" y="548" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Keep literary and non-literary revision as two separate tracks.</text>
</svg>