<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Minimum literary works</text>

<text x="40" y="164" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">SL</text><text x="40" y="188" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">4 works</text><rect x="150" y="132" width="44" height="64" rx="5" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><line x1="158" y1="132" x2="158" y2="196" stroke="#1e2a44" stroke-width="1.5"/><rect x="218" y="132" width="44" height="64" rx="5" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><line x1="226" y1="132" x2="226" y2="196" stroke="#1e2a44" stroke-width="1.5"/><rect x="286" y="132" width="44" height="64" rx="5" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><line x1="294" y1="132" x2="294" y2="196" stroke="#1e2a44" stroke-width="1.5"/><rect x="338" y="132" width="44" height="64" rx="5" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><line x1="346" y1="132" x2="346" y2="196" stroke="#1e2a44" stroke-width="1.5"/><text x="40" y="264" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">HL</text><text x="40" y="288" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">6 works</text><rect x="150" y="232" width="44" height="64" rx="5" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><line x1="158" y1="232" x2="158" y2="296" stroke="#1e2a44" stroke-width="1.5"/><rect x="202" y="232" width="44" height="64" rx="5" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><line x1="210" y1="232" x2="210" y2="296" stroke="#1e2a44" stroke-width="1.5"/><rect x="270" y="232" width="44" height="64" rx="5" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><line x1="278" y1="232" x2="278" y2="296" stroke="#1e2a44" stroke-width="1.5"/><rect x="322" y="232" width="44" height="64" rx="5" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><line x1="330" y1="232" x2="330" y2="296" stroke="#1e2a44" stroke-width="1.5"/><rect x="390" y="232" width="44" height="64" rx="5" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><line x1="398" y1="232" x2="398" y2="296" stroke="#1e2a44" stroke-width="1.5"/><rect x="442" y="232" width="44" height="64" rx="5" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><line x1="450" y1="232" x2="450" y2="296" stroke="#1e2a44" stroke-width="1.5"/><rect x="50" y="329" width="24" height="18" rx="3" fill="#b5d3cf" stroke="#1e2a44" stroke-width="1.5"/><text x="82" y="344" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">originally written in the language studied (minimum)</text><rect x="50" y="359" width="24" height="18" rx="3" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.5"/><text x="82" y="374" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">studied in translation (minimum)</text><rect x="409.52" y="359" width="24" height="18" rx="3" fill="#f2e7b8" stroke="#1e2a44" stroke-width="1.5"/><text x="441.52" y="374" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">freely chosen</text><rect x="30" y="400" width="840" height="82" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="428" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Each area must also include non-literary texts equivalent in teaching time to the</text><text x="54" y="451" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">literary works studied in it, so the works count understates the reading.</text>
