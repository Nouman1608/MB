<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="470" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Double the speed, four times the kinetic energy</text>

<rect x="30" y="72" width="148.8" height="30" rx="15" fill="#8a6d0d"/><text x="42" y="93" font-size="16" font-weight="700" fill="#ffffff" text-anchor="start">Extended only</text><rect x="30" y="110" width="840" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="150" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">A 1200 kg car:  Ek = ½ m v²</text><text x="60" y="212" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">15 m/s</text><rect x="200" y="180" width="150" height="46" rx="6" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><text x="360" y="212" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start"></text><text x="364" y="212" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">½ × 1200 × 15² = 135 000 J</text><text x="60" y="292" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">30 m/s</text><rect x="200" y="260" width="600" height="46" rx="6" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><text x="810" y="292" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start"></text><text x="800" y="334" font-size="18" font-weight="700" fill="#b5602e" text-anchor="end">½ × 1200 × 30² = 540 000 J</text><line x1="350" y1="260" x2="350" y2="306" stroke="#ffffff" stroke-width="2" stroke-dasharray="5 4"/><line x1="500" y1="260" x2="500" y2="306" stroke="#ffffff" stroke-width="2" stroke-dasharray="5 4"/><line x1="650" y1="260" x2="650" y2="306" stroke="#ffffff" stroke-width="2" stroke-dasharray="5 4"/><text x="450" y="376" font-size="19" font-weight="600" fill="#1e2a44" text-anchor="middle">v is squared: 2² = 4, so 540 000 J = 4 × 135 000 J</text><text x="450" y="410" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">That is why braking distances rise so steeply with speed.</text>
</svg>