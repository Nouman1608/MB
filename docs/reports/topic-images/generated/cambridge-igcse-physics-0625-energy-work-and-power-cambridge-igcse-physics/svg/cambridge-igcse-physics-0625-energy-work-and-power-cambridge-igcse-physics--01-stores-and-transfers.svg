<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="700" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Energy stores and how energy is transferred</text>

<rect x="30" y="110" width="840" height="160" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="145" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Stores</text><rect x="50" y="160" width="94.39999999999999" height="40" rx="20" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="97.19999999999999" y="186" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">kinetic</text><rect x="158.39999999999998" y="160" width="241.6" height="40" rx="20" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="279.2" y="186" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">gravitational potential</text><rect x="414" y="160" width="103.6" height="40" rx="20" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="465.8" y="186" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">chemical</text><rect x="531.6" y="160" width="177.2" height="40" rx="20" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="620.2" y="186" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">elastic (strain)</text><rect x="722.8" y="160" width="94.39999999999999" height="40" rx="20" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="770" y="186" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">nuclear</text><rect x="50" y="212" width="149.6" height="40" rx="20" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="124.8" y="238" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">electrostatic</text><rect x="213.6" y="212" width="195.6" height="40" rx="20" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="311.4" y="238" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">internal (thermal)</text><rect x="30" y="280" width="840" height="110" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="306" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Transferred between stores by</text><text x="60" y="338" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">• forces (mechanical work)</text><text x="460" y="338" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">• electrical current (electrical work)</text><text x="60" y="368" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">• heating</text><text x="460" y="368" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">• waves (electromagnetic, sound)</text><rect x="30" y="400" width="840" height="270" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="436" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Example: a battery-powered fan</text><rect x="60" y="470" width="230" height="76" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="175" y="503" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">chemical store of</text><text x="175" y="525" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">the battery</text><line x1="294" y1="508" x2="326" y2="508" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="330" y="470" width="230" height="76" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="445" y="514" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">electrical current</text><line x1="564" y1="508" x2="596" y2="508" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="600" y="470" width="230" height="76" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="715" y="492" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">forces of the</text><text x="715" y="514" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">motor on the</text><text x="715" y="536" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">blades</text><line x1="735" y1="546" x2="735" y2="580" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="540" y="584" width="300" height="34" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="690" y="607" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">kinetic store of blades and air</text><rect x="540" y="624" width="300" height="34" rx="10" fill="#efdfa8" stroke="#8a6d0d" stroke-width="2"/><text x="690" y="647" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">internal store of the motor</text><text x="60" y="610" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Total energy is the same before and after:</text><text x="60" y="634" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">it is transferred, never created or destroyed.</text>
</svg>