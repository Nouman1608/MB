<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="620" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Work done lifting a box: W = F d</text>

<rect x="30" y="110" width="570" height="400" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><line x1="60" y1="470" x2="520" y2="470" stroke="#1e2a44" stroke-width="4" stroke-linecap="round"/><rect x="330" y="250" width="190" height="14" rx="0" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2.5"/><line x1="510" y1="264" x2="510" y2="470" stroke="#1e2a44" stroke-width="4" stroke-linecap="round"/><rect x="140" y="400" width="90" height="70" rx="4" fill="#d9b27a" stroke="#1e2a44" stroke-width="3" stroke-dasharray="7 5" opacity="0.6"/><text x="185" y="442" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">25 kg</text><rect x="380" y="180" width="90" height="70" rx="4" fill="#d9b27a" stroke="#1e2a44" stroke-width="3"/><text x="425" y="222" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">25 kg</text><path d="M185,390 C185,190 260,150 370,190" fill="none" stroke="#4a5568" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 5"/><line x1="555" y1="250" x2="555" y2="470" stroke="#1e2a44" stroke-width="2.5" marker-start="url(#ah)" marker-end="url(#ah)"/><text x="555" y="238" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">1.2 m</text><line x1="250" y1="430" x2="250" y2="340" stroke="#2e6b62" stroke-width="5" marker-end="url(#ahT)"/><text x="262" y="380" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">lifting force</text><text x="262" y="402" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">= weight = 245 N</text><rect x="620" y="130" width="250" height="218" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="640" y="166" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Worked example 3</text><text x="640" y="200" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">F = 25 × 9.8</text><text x="670" y="232" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">= 245 N</text><text x="640" y="264" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">W = F d</text><text x="640" y="296" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">= 245 × 1.2</text><text x="640" y="328" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">= 294 J</text><rect x="620" y="360" width="250" height="150" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="745" y="416.3" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">GPE store of</text><text x="745" y="441.3" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">the box rises</text><text x="745" y="466.3" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">by 294 J</text><rect x="30" y="525" width="840" height="68" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="564.95" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Carrying it sideways at a steady height: force and motion at right angles, so no work against gravity.</text>
</svg>