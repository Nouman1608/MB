<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="900" height="550" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="550" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Power and efficiency of a crane</text>

<rect x="30" y="110" width="840" height="160" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="146" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Worked example 4: crane lifts 400 kg through 12 m in 20 s</text><text x="50" y="180" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">work done on load = ΔEp = 400 × 9.8 × 12 = 47 040 J</text><text x="50" y="214" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">useful power output = 47 040 / 20 = 2352 W  ≈ 2.4 kW</text><text x="50" y="248" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">(Extended) efficiency = 2352 / 3500 × 100% = 67%</text><rect x="30" y="300" width="840" height="220" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="340" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Motor takes 3.5 kW = 3500 W from the supply</text><rect x="60" y="360" width="510.72" height="56" rx="6" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><rect x="570.72" y="360" width="249.27999999999997" height="56" rx="6" fill="#cbbf9f" stroke="#9c8f6e" stroke-width="2.5"/><text x="315.36" y="395" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">useful 2352 W (67%)</text><text x="695.36" y="395" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">wasted</text><text x="60" y="450" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start">P = W / t = ΔE / t;  1 W = 1 J/s</text><text x="60" y="485" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Example 5: 2.4 kW kettle for 2.5 min: E = 2400 × 150 = 360 000 J = 360 kJ</text>
</svg>