<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 740" width="900" height="740" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="740" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A 60 kg skier: where 26 460 J goes</text>

<rect x="30" y="72" width="148.8" height="30" rx="15" fill="#8a6d0d"/><text x="42" y="93" font-size="16" font-weight="700" fill="#ffffff" text-anchor="start">Extended only</text><rect x="30" y="110" width="840" height="600" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="150" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start">Starts at rest, 45 m high; 20 m/s at the bottom (g = 9.8 N/kg)</text><rect x="70" y="200" width="350" height="200" fill="#f2e7b8" stroke="none"/><path d="M420,200 L740,200 L740,182 L800,245.3514739229025 L740,308.702947845805 L740,290.702947845805 L420,290.702947845805 Z" fill="#b5d3cf"/><path d="M420,290.702947845805 A139.297052154195,139.297052154195 0 0 1 559.297052154195,430 L559.297052154195,560 L577.297052154195,560 L504.6485260770975,610 L432,560 L450,560 L450,430 A30,30 0 0 0 420,400 Z" fill="#cbbf9f"/><text x="90" y="292" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">ΔEp lost</text><text x="90" y="320" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">60 × 9.8 × 45</text><text x="90" y="348" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">= 26 460 J</text><text x="500" y="238" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">kinetic: ½ × 60 × 20² = 12 000 J</text><text x="589.297052154195" y="470" font-size="20" font-weight="700" fill="#b5602e" text-anchor="start">14 460 J</text><text x="589.297052154195" y="498" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">by friction and air</text><text x="589.297052154195" y="519" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">resistance to the internal</text><text x="589.297052154195" y="540" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">store of snow, skis, air</text><rect x="60" y="625" width="390" height="66" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="255" y="651.95" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Widths are in proportion:</text><text x="255" y="675.95" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">12 000 + 14 460 = 26 460 J</text>
</svg>