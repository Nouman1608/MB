<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 710" width="900" height="710" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="710" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">From resource to electricity</text>

<rect x="30" y="110" width="840" height="430" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="50" y="130" width="270" height="68" rx="10" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2"/><text x="66" y="160" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">fossil fuels, biofuels,</text><text x="66" y="184" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">nuclear fuel, geothermal</text><line x1="320" y1="165" x2="385" y2="165" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="390" y="140" width="150" height="56" rx="12" fill="#efdfa8" stroke="#1e2a44" stroke-width="2.5"/><text x="465" y="175" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">boiler</text><text x="475" y="240" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">steam</text><line x1="465" y1="196" x2="465" y2="270" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="50" y="250" width="270" height="68" rx="10" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="66" y="280" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">hydroelectric, tides,</text><text x="66" y="304" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">waves: moving water</text><line x1="320" y1="288" x2="385" y2="288" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="50" y="345" width="270" height="44" rx="10" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="66" y="375" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">wind: moving air</text><line x1="320" y1="367" x2="395" y2="315" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="390" y="272" width="150" height="56" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="465" y="307" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">turbine</text><line x1="540" y1="300" x2="600" y2="300" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="600" y="272" width="150" height="56" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="675" y="307" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">generator</text><line x1="750" y1="300" x2="810" y2="300" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="800" y="266" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">electricity</text><rect x="50" y="420" width="270" height="68" rx="10" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2"/><text x="66" y="450" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">solar cells: light straight</text><text x="66" y="474" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">to electricity, no turbine</text><path d="M320,450 L790,450 L790,318" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 5" marker-end="url(#ah)"/><text x="560" y="500" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Solar panels only heat water: no electricity.</text><rect x="30" y="555" width="148.8" height="30" rx="15" fill="#8a6d0d"/><text x="42" y="576" font-size="16" font-weight="700" fill="#ffffff" text-anchor="start">Extended only</text><rect x="30" y="595" width="840" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="630" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">The Sun is the main source for all resources except geothermal, nuclear and tidal.</text><text x="60" y="660" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The Sun releases energy by nuclear fusion.</text>
</svg>