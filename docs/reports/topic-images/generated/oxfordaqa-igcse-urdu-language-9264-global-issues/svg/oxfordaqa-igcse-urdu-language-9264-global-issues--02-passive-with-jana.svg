<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 780" width="900" height="780" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="780" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The passive for big problems</text>

<rect x="30" y="110" width="840" height="92" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="54" y="148" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Past participle</text><text x="220" y="148" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="start">+</text><text x="290" y="152" font-family="Noto Nastaliq Urdu" font-size="28" font-weight="400" fill="#8a6d0d" text-anchor="middle">‏جانا‏</text><text x="340" y="148" font-size="19" font-weight="600" fill="#1e2a44" text-anchor="start">agreeing with the thing affected</text><text x="54" y="182" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the key structure for describing large problems impersonally</text><rect x="30" y="222" width="840" height="140" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="260" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Present passive</text><text x="846" y="310" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="end">‏بہت سے درخت کاٹے جاتے ہیں‏</text><text x="846" y="346" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">Many trees are cut down.</text><rect x="30" y="374" width="840" height="140" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="412" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">With can</text><text x="846" y="462" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="end">‏پلاسٹک کو دوبارہ استعمال کیا جا سکتا ہے‏</text><text x="846" y="498" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">Plastic can be reused.</text><rect x="30" y="526" width="840" height="140" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="52" y="564" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Feminine agreement</text><text x="846" y="614" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="end">‏اس مسئلے پر توجہ نہیں دی جاتی‏</text><text x="846" y="650" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">This problem is not given attention.</text><text x="52" y="592" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">agrees with</text><text x="170" y="596" font-family="Noto Nastaliq Urdu" font-size="22" font-weight="400" fill="#2e6b62" text-anchor="middle">‏توجہ‏</text><text x="200" y="592" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">(f)</text><rect x="30" y="690" width="840" height="64" rx="12" fill="#f6ece4" stroke="#b5602e" stroke-width="2.5"/><text x="54" y="728" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">Common slip:</text><text x="330" y="732" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#b5602e" text-anchor="middle">‏توجہ نہیں دیا جاتا‏</text><text x="430" y="728" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start">should be</text><text x="580" y="732" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#2e6b62" text-anchor="middle">‏دی جاتی‏</text>
</svg>