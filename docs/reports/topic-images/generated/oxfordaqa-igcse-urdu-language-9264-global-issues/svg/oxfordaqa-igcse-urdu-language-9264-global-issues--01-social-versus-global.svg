<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="640" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A question of scale</text>

<circle cx="250" cy="380" r="230" fill="#dce9e7" stroke="#2e6b62" stroke-width="3"/><circle cx="250" cy="450" r="110" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="3"/><text x="250" y="210" font-size="23" font-weight="700" fill="#2e6b62" text-anchor="middle">Global issues</text><text x="250" y="236" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">problems that cross borders</text><text x="250" y="430" font-size="21" font-weight="700" fill="#8a6d0d" text-anchor="middle">Social issues</text><text x="250" y="456" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">you and your</text><text x="250" y="478" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">community</text><rect x="110" y="262" width="130" height="84" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="175" y="306" font-family="Noto Nastaliq Urdu" font-size="26" font-weight="400" fill="#1e2a44" text-anchor="middle">‏ماحول‏</text><text x="175" y="334" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">environment</text><rect x="260" y="262" width="130" height="84" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="325" y="306" font-family="Noto Nastaliq Urdu" font-size="26" font-weight="400" fill="#1e2a44" text-anchor="middle">‏غربت‏</text><text x="325" y="334" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">poverty</text><rect x="530" y="160" width="340" height="150" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="552" y="198" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Do connect them</text><text x="552" y="230" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">show how a world problem</text><text x="552" y="253" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">appears in your own area</text><rect x="530" y="340" width="340" height="150" rx="14" fill="#f6ece4" stroke="#b5602e" stroke-width="2.5"/><text x="552" y="378" font-size="20" font-weight="700" fill="#b5602e" text-anchor="start">Do not shrink it</text><text x="552" y="410" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">a global question should</text><text x="552" y="433" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">not become a purely</text><text x="552" y="456" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">personal one</text><text x="700" y="548" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">Global issues differs from</text><text x="700" y="572" font-size="17" font-weight="700" fill="#4a5568" text-anchor="middle">Social issues in scale</text>
</svg>