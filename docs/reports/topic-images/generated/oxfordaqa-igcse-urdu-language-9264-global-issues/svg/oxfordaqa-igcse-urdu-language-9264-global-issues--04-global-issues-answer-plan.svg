<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="700" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Building a global-issues answer</text>

<circle cx="56" cy="130" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="56" y="136.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="86" y="137" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Name the problem</text><circle cx="56" cy="184" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="56" y="190.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="86" y="191" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Chain causes and effects (the chain reads right to left)</text><rect x="600" y="210" width="270" height="106" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="735" y="262" font-family="Noto Nastaliq Urdu" font-size="21" font-weight="400" fill="#1e2a44" text-anchor="middle">‏جنگلات کی کٹائی کی وجہ سے‏</text><text x="735" y="298" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">because of deforestation</text><line x1="598" y1="263" x2="587" y2="263" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="315" y="210" width="270" height="106" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="262" font-family="Noto Nastaliq Urdu" font-size="21" font-weight="400" fill="#1e2a44" text-anchor="middle">‏بارش کم ہوتی ہے،‏</text><text x="450" y="298" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">rainfall decreases</text><line x1="313" y1="263" x2="302" y2="263" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="210" width="270" height="106" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="165" y="262" font-family="Noto Nastaliq Urdu" font-size="21" font-weight="400" fill="#1e2a44" text-anchor="middle">‏جس سے خشک سالی بڑھتی ہے‏</text><text x="165" y="298" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">which increases drought</text><circle cx="56" cy="360" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="56" y="366.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="86" y="367" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Split solutions: who should act?</text><rect x="30" y="384" width="410" height="112" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="416" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Individuals</text><text x="416" y="466" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="end">‏ہر شخص کو ... چاہیے‏</text><rect x="460" y="384" width="410" height="112" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="482" y="416" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Government</text><text x="846" y="466" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="end">‏حکومت کو ... پر پابندی لگانی چاہیے‏</text><circle cx="56" cy="540" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="56" y="546.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="86" y="547" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Finish with a justified opinion</text><rect x="30" y="574" width="840" height="96" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="54" y="606" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Show range in one answer:</text><text x="54" y="640" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">one passive  +  one conditional  +  one concession</text><text x="700" y="644" font-family="Noto Nastaliq Urdu" font-size="26" font-weight="400" fill="#2e6b62" text-anchor="middle">‏اگرچہ‏</text><text x="760" y="640" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">(although)</text>
</svg>