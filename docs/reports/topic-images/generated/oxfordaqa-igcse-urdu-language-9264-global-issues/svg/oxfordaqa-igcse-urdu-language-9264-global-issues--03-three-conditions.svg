<rect x="30" y="110" width="840" height="140" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="148" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Real</text><text x="52" y="174" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">likely result</text><text x="846" y="198" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="end">‏اگر ہم پانی بچائیں تو آنے والی نسلوں کو فائدہ ہو گا‏</text><text x="846" y="234" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">If we save water, future generations will benefit.</text><rect x="30" y="262" width="840" height="140" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="52" y="300" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Warning</text><text x="52" y="326" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">idiomatic past form</text><text x="846" y="350" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="end">‏اگر ہم نے ابھی کچھ نہ کیا تو حالات اور خراب ہو جائیں گے‏</text><text x="846" y="386" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">If we do not act now, things will get worse.</text><rect x="30" y="414" width="840" height="140" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="52" y="452" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Hypothetical</text><text x="52" y="478" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">imagined situation</text><text x="846" y="502" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="end">‏اگر ہر گھر میں شمسی توانائی ہوتی تو بجلی کا مسئلہ حل ہو جاتا‏</text><text x="846" y="538" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">If every home had solar energy, the electricity problem would be solved.</text><text x="450" y="590" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">Every solution paragraph is a chance to use a condition</text>
