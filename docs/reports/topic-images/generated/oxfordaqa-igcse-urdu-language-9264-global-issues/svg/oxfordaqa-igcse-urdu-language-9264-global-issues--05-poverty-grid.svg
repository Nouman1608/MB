<rect width="900" height="770" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Causes, effects and solutions of poverty</text>

<rect x="640" y="110" width="250" height="46" rx="10" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><text x="765" y="140" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Causes</text><rect x="345" y="110" width="250" height="46" rx="10" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><text x="470" y="140" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Effects</text><rect x="50" y="110" width="250" height="46" rx="10" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><text x="175" y="140" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Solutions</text><rect x="640" y="170" width="250" height="104" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="3"/><text x="765" y="228" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="middle">‏بے روزگاری‏</text><text x="765" y="260" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">unemployment</text><rect x="345" y="170" width="250" height="104" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="3"/><text x="470" y="228" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="middle">‏بھوک‏</text><text x="470" y="260" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">hunger</text><rect x="50" y="170" width="250" height="104" rx="12" fill="#f2e7b8" stroke="#2e6b62" stroke-width="3"/><text x="175" y="228" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="middle">‏روزگار کے مواقع‏</text><text x="175" y="260" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">job opportunities</text><line x1="636" y1="222" x2="600" y2="222" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><line x1="341" y1="222" x2="305" y2="222" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><rect x="640" y="286" width="250" height="104" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="765" y="344" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="middle">‏تعلیم کی کمی‏</text><text x="765" y="376" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">lack of education</text><rect x="345" y="286" width="250" height="104" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="470" y="344" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="middle">‏بیماریاں‏</text><text x="470" y="376" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">illnesses</text><rect x="50" y="286" width="250" height="104" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="175" y="344" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="middle">‏مفت تعلیم‏</text><text x="175" y="376" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">free education</text><rect x="640" y="402" width="250" height="104" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="765" y="460" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="middle">‏قدرتی آفات‏</text><text x="765" y="492" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">natural disasters</text><rect x="345" y="402" width="250" height="104" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="470" y="460" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="middle">‏بے گھری‏</text><text x="470" y="492" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">homelessness</text><rect x="50" y="402" width="250" height="104" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="175" y="460" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="middle">‏عالمی امداد‏</text><text x="175" y="492" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">international aid</text><rect x="640" y="518" width="250" height="104" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="765" y="576" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="middle">‏مہنگائی‏</text><text x="765" y="608" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">rising prices</text><rect x="345" y="518" width="250" height="104" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="470" y="576" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="middle">‏بچوں کی مشقت‏</text><text x="470" y="608" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">child labour</text><rect x="50" y="518" width="250" height="104" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="175" y="576" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="middle">‏صاف پانی کی فراہمی‏</text><text x="175" y="608" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">supply of clean water</text><rect x="30" y="650" width="840" height="92" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="54" y="684" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start">Link one item from each column, as in the top row:</text><text x="54" y="714" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">one sentence can then hold a cause, an effect, a passive and a condition</text>
</svg>