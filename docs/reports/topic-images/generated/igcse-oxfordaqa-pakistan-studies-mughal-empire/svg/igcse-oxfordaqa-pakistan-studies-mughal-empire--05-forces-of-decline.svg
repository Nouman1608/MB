<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 570" width="900" height="570" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="570" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four forces behind Mughal decline</text>

<rect x="30" y="112" width="280" height="147" rx="12" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="48" y="145" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Weak leadership</text><text x="48" y="173.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Wars of succession, short</text><text x="48" y="194.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">reigns; nobles such as the</text><text x="48" y="215.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Sayyid brothers controlled</text><text x="48" y="236.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">emperors</text><line x1="314" y1="185.5" x2="340" y2="290" stroke="#b5602e" stroke-width="4" marker-end="url(#ahR)"/><rect x="590" y="112" width="280" height="147" rx="12" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="608" y="145" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Nadir Shah</text><text x="608" y="173.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Battle of Karnal and sack of</text><text x="608" y="194.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Delhi (1739); Peacock Throne</text><text x="608" y="215.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">taken</text><line x1="586" y1="185.5" x2="560" y2="290" stroke="#b5602e" stroke-width="4" marker-end="url(#ahR)"/><rect x="30" y="393" width="280" height="147" rx="12" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="48" y="426" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Marathas and Sikhs</text><text x="48" y="454.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Marathas across central and</text><text x="48" y="475.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">western India; Sikh chiefs take</text><text x="48" y="496.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Punjab; Ranjit Singh’s kingdom</text><text x="48" y="517.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">at Lahore</text><line x1="314" y1="466.5" x2="340" y2="370" stroke="#b5602e" stroke-width="4" marker-end="url(#ahR)"/><rect x="590" y="393" width="280" height="147" rx="12" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="608" y="426" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">East India Company</text><text x="608" y="454.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Plassey (1757); Bengal’s</text><text x="608" y="475.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">revenue (1765); annexations to</text><text x="608" y="496.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the 1850s</text><line x1="586" y1="466.5" x2="560" y2="370" stroke="#b5602e" stroke-width="4" marker-end="url(#ahR)"/><rect x="350" y="270" width="200" height="120" rx="16" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="322" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Mughal</text><text x="450" y="348" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">power after 1707</text>
</svg>