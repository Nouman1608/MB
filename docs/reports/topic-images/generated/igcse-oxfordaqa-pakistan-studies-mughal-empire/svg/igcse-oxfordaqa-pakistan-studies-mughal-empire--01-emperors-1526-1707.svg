<rect width="900" height="593" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The great Mughals, 1526–1707</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">drawn to a year scale</text>
<rect x="30" y="112" width="840" height="378" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><line x1="265.7894736842105" y1="154" x2="265.7894736842105" y2="460" stroke="#c9d6d4" stroke-width="1.5" stroke-dasharray="4 5"/><text x="265.7894736842105" y="146" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">1525</text><line x1="344.7368421052632" y1="154" x2="344.7368421052632" y2="460" stroke="#c9d6d4" stroke-width="1.5" stroke-dasharray="4 5"/><text x="344.7368421052632" y="146" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">1550</text><line x1="423.6842105263158" y1="154" x2="423.6842105263158" y2="460" stroke="#c9d6d4" stroke-width="1.5" stroke-dasharray="4 5"/><text x="423.6842105263158" y="146" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">1575</text><line x1="502.63157894736844" y1="154" x2="502.63157894736844" y2="460" stroke="#c9d6d4" stroke-width="1.5" stroke-dasharray="4 5"/><text x="502.63157894736844" y="146" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">1600</text><line x1="581.578947368421" y1="154" x2="581.578947368421" y2="460" stroke="#c9d6d4" stroke-width="1.5" stroke-dasharray="4 5"/><text x="581.578947368421" y="146" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">1625</text><line x1="660.5263157894738" y1="154" x2="660.5263157894738" y2="460" stroke="#c9d6d4" stroke-width="1.5" stroke-dasharray="4 5"/><text x="660.5263157894738" y="146" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">1650</text><line x1="739.4736842105262" y1="154" x2="739.4736842105262" y2="460" stroke="#c9d6d4" stroke-width="1.5" stroke-dasharray="4 5"/><text x="739.4736842105262" y="146" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">1675</text><line x1="818.421052631579" y1="154" x2="818.421052631579" y2="460" stroke="#c9d6d4" stroke-width="1.5" stroke-dasharray="4 5"/><text x="818.421052631579" y="146" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">1700</text><rect x="40" y="160" width="820" height="50" fill="#dce9e7" opacity="0.5"/><text x="52" y="182" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Babur</text><text x="52" y="201" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">1526–30</text><rect x="268.9473684210526" y="172" width="12.631578947368439" height="26" rx="4" fill="#b5d3cf" stroke="#1e2a44" stroke-width="1.5"/><text x="289.57894736842104" y="191" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Panipat 1526; Khanwa 1527</text><text x="52" y="232" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Humayun</text><text x="52" y="251" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">1530–40, 1555–56</text><rect x="281.57894736842104" y="222" width="31.57894736842104" height="26" rx="4" fill="#b5d3cf" stroke="#1e2a44" stroke-width="1.5"/><rect x="360.5263157894737" y="222" width="6" height="26" rx="4" fill="#b5d3cf" stroke="#1e2a44" stroke-width="1.5"/><text x="371.6842105263158" y="241" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">empire lost to Sher Shah Suri</text><rect x="40" y="260" width="820" height="50" fill="#dce9e7" opacity="0.5"/><text x="52" y="282" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Akbar</text><text x="52" y="301" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">1556–1605</text><rect x="363.6842105263158" y="272" width="154.73684210526318" height="26" rx="4" fill="#b5d3cf" stroke="#1e2a44" stroke-width="1.5"/><text x="526.421052631579" y="291" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">mansabdari; Fatehpur Sikri</text><text x="52" y="332" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Jahangir</text><text x="52" y="351" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">1605–27</text><rect x="518.421052631579" y="322" width="69.47368421052624" height="26" rx="4" fill="#b5d3cf" stroke="#1e2a44" stroke-width="1.5"/><text x="595.8947368421052" y="341" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Sir Thomas Roe</text><rect x="40" y="360" width="820" height="50" fill="#dce9e7" opacity="0.5"/><text x="52" y="382" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Shah Jahan</text><text x="52" y="401" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">1628–58</text><rect x="591.0526315789473" y="372" width="94.73684210526324" height="26" rx="4" fill="#b5d3cf" stroke="#1e2a44" stroke-width="1.5"/><text x="693.7894736842105" y="391" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Taj Mahal; Red Fort</text><text x="52" y="432" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Aurangzeb</text><text x="52" y="451" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">1658–1707</text><rect x="685.7894736842105" y="422" width="154.73684210526312" height="26" rx="4" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.5"/><text x="677.7894736842105" y="441" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="end">Bijapur 1686; Golconda 1687</text><rect x="313.1578947368421" y="226" width="47.36842105263162" height="18" fill="none" stroke="#b5602e" stroke-width="2" stroke-dasharray="5 4"/><rect x="30" y="510" width="840" height="53" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="540.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Between Humayun’s two reigns the empire was lost to the Afghan Sher Shah Suri.</text>
</svg>