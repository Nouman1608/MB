<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 494" width="900" height="494" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="494" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The pillars of Akbar’s rule</text>

<path d="M180,192 L450,112 L720,192 Z" fill="#d4b02e" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><text x="450" y="174" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Akbar’s empire, 1556–1605</text><rect x="30" y="206" width="156" height="159" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="236.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Conquest</text><text x="48" y="262.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Second Battle of</text><text x="48" y="282.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Panipat (1556);</text><text x="48" y="302.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">north India,</text><text x="48" y="322.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Gujarat, Bengal,</text><text x="48" y="342.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Kashmir</text><rect x="201" y="206" width="156" height="159" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="219" y="236.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Alliances</text><text x="219" y="262.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">With Rajput</text><text x="219" y="282.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">rulers</text><rect x="372" y="206" width="156" height="159" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="390" y="236.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Mansabdari</text><text x="390" y="262.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">System to</text><text x="390" y="282.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">organise the</text><text x="390" y="302.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">nobles</text><rect x="543" y="206" width="156" height="159" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="561" y="236.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Land revenue</text><text x="561" y="262.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Reformed with</text><text x="561" y="282.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">finance minister</text><text x="561" y="302.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Raja Todar Mal</text><rect x="714" y="206" width="156" height="159" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="732" y="236.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Religion</text><text x="732" y="262.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Abolished the</text><text x="732" y="282.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">jizya; debates in</text><text x="732" y="302.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">the Ibadat Khana</text><rect x="30" y="371" width="840" height="20" rx="4" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2"/><rect x="30" y="411" width="840" height="53" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="441.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Built Fatehpur Sikri. Jahangir (1605–27) continued Akbar’s system.</text>
</svg>