<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 565" width="900" height="565" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="565" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The empire Aurangzeb left in 1707</text>

<rect x="30" y="112" width="840" height="105" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="145" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Aurangzeb’s reforms (1658–1707)</text><text x="48" y="173.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Governed according to the Sharia · Fatawa-e-Alamgiri compiled · Muhtasibs supervised public morality ·</text><text x="48" y="194.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Jizya reimposed in 1679 · Un-Islamic taxes removed; less court spending · Badshahi Mosque, Lahore</text><path d="M450,245 L434,277 L466,277 Z" fill="#1e2a44"/><line x1="230" y1="247" x2="670" y2="247" stroke="#1e2a44" stroke-width="5" stroke-linecap="round"/><line x1="230" y1="247" x2="230" y2="285" stroke="#1e2a44" stroke-width="2.5"/><line x1="670" y1="247" x2="670" y2="285" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="285" width="410" height="177" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="318" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Strengths at his death</text><text x="48" y="346.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="346.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Largest territory of any Mughal ruler (Bijapur</text><text x="64" y="367.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">1686, Golconda 1687)</text><text x="48" y="391.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="391.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A functioning administration and army</text><rect x="460" y="285" width="410" height="177" rx="12" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="478" y="318" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Weaknesses at his death</text><text x="478" y="346.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="494" y="346.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Long Deccan wars drained the treasury</text><text x="478" y="370.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="494" y="370.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Rajput, Jat, Sikh and Maratha revolts continued</text><text x="478" y="394.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="494" y="394.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Too few jagirs (land grants) for the growing</text><text x="494" y="415.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">number of nobles</text><text x="478" y="439.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="494" y="439.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">No clear rule of succession</text><rect x="30" y="482" width="840" height="53" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="512.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The Maratha wars, first against Shivaji, lasted more than twenty years.</text>
</svg>