<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 667" width="900" height="667" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="667" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How Babur founded the empire</text>

<line x1="95" y1="130" x2="95" y2="532" stroke="#1e2a44" stroke-width="4"/><rect x="182" y="120" width="688" height="82" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="200" y="151.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">From Timur and Genghis Khan</text><text x="200" y="179.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Timur on his father’s side, Genghis Khan on his mother’s.</text><rect x="182" y="212" width="688" height="54" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="200" y="243.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Loses his homeland</text><rect x="182" y="276" width="688" height="82" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="200" y="307.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Takes Kabul</text><text x="200" y="335.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Then turns to India.</text><rect x="182" y="368" width="688" height="82" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="200" y="399.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">First Battle of Panipat</text><text x="200" y="427.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">His smaller army, using field artillery and cavalry tactics, defeats Sultan Ibrahim Lodi.</text><rect x="182" y="460" width="688" height="82" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="200" y="491.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Battle of Khanwa</text><text x="200" y="519.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Defeats the Rajput confederacy under Rana Sanga.</text><rect x="30" y="134" width="130" height="40" rx="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="95" y="161" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Descent</text><line x1="160" y1="154" x2="182" y2="154" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="219" width="130" height="40" rx="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="95" y="246" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Fergana</text><line x1="160" y1="239" x2="182" y2="239" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="290" width="130" height="40" rx="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="95" y="317" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">1504</text><line x1="160" y1="310" x2="182" y2="310" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="382" width="130" height="40" rx="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="95" y="409" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">1526</text><line x1="160" y1="402" x2="182" y2="402" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="474" width="130" height="40" rx="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="95" y="501" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">1527</text><line x1="160" y1="494" x2="182" y2="494" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="562" width="840" height="75" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="592.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Context in 1526: the Lodi Sultanate of Delhi was weakened by quarrels among Afghan nobles, while</text><text x="48" y="614.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Rajput kingdoms such as Mewar were powerful.</text>
</svg>