<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 734" width="900" height="734" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="734" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">From Aurangzeb to the last emperor, 1707–1858</text>

<line x1="95" y1="130" x2="95" y2="694" stroke="#1e2a44" stroke-width="4"/><rect x="182" y="120" width="688" height="82" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="200" y="151.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Death of Aurangzeb</text><text x="200" y="179.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Wars of succession and short reigns follow.</text><rect x="182" y="212" width="688" height="82" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="200" y="243.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Karnal and the sack of Delhi</text><text x="200" y="271.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Nadir Shah defeats Muhammad Shah; Mughal prestige never recovers.</text><rect x="182" y="304" width="688" height="103" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="200" y="335.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Battle of Plassey</text><text x="200" y="363.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Clive defeats Siraj-ud-Daula after securing Mir Jafar’s defection; the Company gains</text><text x="200" y="384.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Bengal’s wealth.</text><rect x="182" y="417" width="688" height="82" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="200" y="448.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Right to collect Bengal’s revenue</text><text x="200" y="476.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Granted to the East India Company.</text><rect x="182" y="509" width="688" height="103" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="200" y="540.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">British annexations</text><text x="200" y="568.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Sindh (1843), Punjab (1849), Awadh (1856), after wars against Mysore and the</text><text x="200" y="589.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Marathas.</text><rect x="182" y="622" width="688" height="82" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="200" y="653.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">War of Independence; last emperor exiled</text><text x="200" y="681.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Bahadur Shah Zafar is exiled in 1858.</text><rect x="30" y="134" width="130" height="40" rx="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="95" y="161" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">1707</text><line x1="160" y1="154" x2="182" y2="154" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="226" width="130" height="40" rx="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="95" y="253" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">1739</text><line x1="160" y1="246" x2="182" y2="246" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="318" width="130" height="40" rx="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="95" y="345" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">1757</text><line x1="160" y1="338" x2="182" y2="338" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="431" width="130" height="40" rx="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="95" y="458" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">1765</text><line x1="160" y1="451" x2="182" y2="451" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="523" width="130" height="40" rx="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="95" y="550" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">1843–56</text><line x1="160" y1="543" x2="182" y2="543" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="636" width="130" height="40" rx="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="95" y="663" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">1857–58</text><line x1="160" y1="656" x2="182" y2="656" stroke="#1e2a44" stroke-width="2.5"/>
</svg>