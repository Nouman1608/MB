<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 690" width="900" height="690" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="690" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Collapse of the Grand Banks cod fishery</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">off Newfoundland, Canada</text>
<text x="165" y="135" font-size="19" font-weight="700" fill="#4a5568" text-anchor="middle">Causes</text><rect x="30" y="150" width="270" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="165" y="188" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Industrial trawlers</text><text x="165" y="216" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">greatly increased catches</text><line x1="302" y1="196" x2="352" y2="305" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="260" width="270" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="165" y="298" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Stock estimates</text><text x="165" y="326" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">proved too optimistic</text><line x1="302" y1="306" x2="352" y2="305" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="370" width="270" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="165" y="408" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Political pressure</text><text x="165" y="436" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">to keep quotas high</text><line x1="302" y1="416" x2="352" y2="305" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="360" y="230" width="230" height="150" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="475" y="272" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Catches above</text><text x="475" y="298" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">maximum sustainable</text><text x="475" y="324" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">yield</text><text x="475" y="356" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">stock is depleted</text><line x1="592" y1="305" x2="628" y2="305" stroke="#1e2a44" stroke-width="4.5" marker-end="url(#ah)"/><rect x="632" y="200" width="238" height="210" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="751" y="240" font-size="30" font-weight="700" fill="#b5602e" text-anchor="middle">1992</text><text x="751" y="272" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">moratorium on</text><text x="751" y="296" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">northern cod</text><text x="751" y="332" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">tens of thousands lose</text><text x="751" y="351" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">work in fishing and</text><text x="751" y="370" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">processing</text><line x1="751" y1="412" x2="751" y2="452" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="632" y="456" width="238" height="70" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="751" y="498" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Recovery is slow</text><rect x="30" y="560" width="840" height="110" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="55" y="596" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Lesson</text><text x="55" y="624" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Scientific uncertainty, pressure to keep quotas high and slow ecosystem response</text><text x="55" y="650" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">can turn overfishing into collapse, even under national control.</text>
</svg>