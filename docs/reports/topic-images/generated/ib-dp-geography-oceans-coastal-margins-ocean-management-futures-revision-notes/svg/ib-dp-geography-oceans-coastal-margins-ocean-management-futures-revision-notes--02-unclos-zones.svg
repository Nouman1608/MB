<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 810" width="900" height="810" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="810" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">UNCLOS: who controls which sea</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">measured from the coastal baseline</text>
<rect x="30" y="170" width="110" height="160" fill="#d8e3c6" stroke="#1e2a44" stroke-width="3"/><text x="85" y="256" font-size="18" font-weight="700" fill="#4a5568" text-anchor="middle">LAND</text><rect x="140" y="170" width="60" height="160" fill="#2e6b62" opacity="0.9"/><rect x="200" y="170" width="70" height="160" fill="#b5d3cf"/><rect x="270" y="170" width="370" height="160" fill="#dce9e7"/><rect x="640" y="170" width="230" height="160" fill="#ffffff"/><rect x="30" y="170" width="840" height="160" fill="none" stroke="#1e2a44" stroke-width="3"/><line x1="200" y1="170" x2="200" y2="330" stroke="#1e2a44" stroke-width="2.5"/><line x1="270" y1="170" x2="270" y2="330" stroke="#1e2a44" stroke-width="2.5"/><line x1="640" y1="170" x2="640" y2="330" stroke="#1e2a44" stroke-width="2.5"/><line x1="140" y1="140" x2="140" y2="350" stroke="#b5602e" stroke-width="4"/><text x="140" y="132" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">baseline</text><text x="200" y="160" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">12</text><text x="270" y="160" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">24</text><text x="640" y="160" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">200 nautical miles</text><text x="176" y="318" font-size="16" font-weight="700" fill="#ffffff" transform="rotate(-90 176 318)">Territorial sea</text><text x="241" y="318" font-size="16" font-weight="700" fill="#1e2a44" transform="rotate(-90 241 318)">Contiguous</text><text x="455" y="246" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Exclusive economic zone</text><text x="455" y="272" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="middle">(EEZ)</text><text x="755" y="256" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">High seas</text><path d="M30,360 L760,370 Q790,372 810,420 L870,430 L870,450 L30,450 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.5"/><text x="400" y="412" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">continental shelf: can extend beyond 200 nm where the shelf continues</text><text x="830" y="446" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="end">deep seabed</text><rect x="30" y="480" width="200" height="48" rx="8" fill="#2e6b62" stroke="#1e2a44" stroke-width="2"/><text x="130" y="510" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">Territorial sea</text><text x="248" y="510" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">sovereignty; foreign ships keep a right of innocent passage</text><rect x="30" y="536" width="200" height="48" rx="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="130" y="566" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Contiguous zone</text><text x="248" y="566" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">limited control, e.g. customs and immigration</text><rect x="30" y="592" width="200" height="48" rx="8" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="130" y="622" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">EEZ</text><text x="248" y="622" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">rights over fish, oil, gas and minerals; others keep freedom of navigation</text><rect x="30" y="648" width="200" height="48" rx="8" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2"/><text x="130" y="678" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Continental shelf</text><text x="248" y="678" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">seabed resources, if backed by scientific evidence</text><rect x="30" y="704" width="200" height="48" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="130" y="734" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">High seas</text><text x="248" y="734" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">open to all; deep seabed is common heritage of humankind (ISA)</text><text x="450" y="785" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Zones not to scale. Small islands can generate large EEZs, so they matter in disputes.</text>
</svg>