<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" width="900" height="680" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="680" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The tragedy of the commons at sea</text>

<path d="M555,218.1346652052679 A210,210 0 0 1 631.8653347947321,295" fill="none" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><path d="M631.8653347947321,505 A210,210 0 0 1 555,581.8653347947321" fill="none" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><path d="M345.00000000000006,581.8653347947321 A210,210 0 0 1 268.1346652052679,505" fill="none" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="330" y="148" width="240" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="184" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Open to all</text><text x="450" y="212" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">a high-seas fish stock</text><rect x="540" y="358" width="240" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="660" y="394" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Each user gains</text><text x="660" y="422" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">from taking more</text><rect x="330" y="568" width="240" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="604" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Cost is shared</text><text x="450" y="632" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">depletion falls on everyone</text><rect x="120" y="358" width="240" height="84" rx="14" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="240" y="394" font-size="20" font-weight="700" fill="#b5602e" text-anchor="middle">Collapse for all</text><text x="240" y="422" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">without agreed limits</text><circle cx="450" cy="400" r="92" fill="#b5d3cf" stroke="#2e6b62" stroke-width="3"/><text x="450" y="382" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Break the chain:</text><text x="450" y="408" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">agreed limits</text><text x="450" y="432" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">(quotas, MPAs)</text>
</svg>