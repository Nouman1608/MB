<rect width="900" height="710" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Great Barrier Reef: zoning and its limits</text>

<rect x="30" y="110" width="560" height="560" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M40,120 L170,120 Q150,250 190,360 Q230,470 270,660 L40,660 Z" fill="#d8e3c6" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><text x="95" y="300" font-size="18" font-weight="700" fill="#4a5568" text-anchor="middle">LAND</text><text x="100" y="330" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">farmland</text><path d="M170,120 L330,120 Q320,250 360,360 Q400,470 440,660 L270,660 Q230,470 190,360 Q150,250 170,120 Z" fill="#dce9e7" opacity="1" stroke="#1e2a44" stroke-width="2"/><path d="M330,120 L470,120 Q460,250 500,360 Q530,470 560,660 L440,660 Q400,470 360,360 Q320,250 330,120 Z" fill="#b5d3cf" opacity="1" stroke="#1e2a44" stroke-width="2"/><path d="M300,180 L420,180 L440,300 L320,300 Z" fill="#6f9a52" opacity="0.85" stroke="#1e2a44" stroke-width="2"/><path d="M380,400 L500,400 L520,520 L400,520 Z" fill="#6f9a52" opacity="0.85" stroke="#1e2a44" stroke-width="2"/><path d="M300,560 L370,560 L385,645 L315,645 Z" fill="#6f9a52" opacity="0.85" stroke="#1e2a44" stroke-width="2"/><text x="370" y="245" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">green zone</text><text x="450" y="465" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">green zone</text><line x1="150" y1="420" x2="270" y2="445" stroke="#8a6d0d" stroke-width="4" marker-end="url(#ahO)"/><line x1="160" y1="500" x2="290" y2="520" stroke="#8a6d0d" stroke-width="4" marker-end="url(#ahO)"/><text x="48" y="455" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">runoff</text><path d="M540,150 q8,10 0,20 q-8,10 0,20 q8,10 0,20" fill="none" stroke="#b5602e" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><path d="M565,150 q8,10 0,20 q-8,10 0,20 q8,10 0,20" fill="none" stroke="#b5602e" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><text x="555" y="235" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">warm</text><text x="555" y="252" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">water</text><rect x="605" y="110" width="265" height="300" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="737" y="145" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Zoning</text><rect x="620" y="170" width="40" height="34" rx="6" fill="#dce9e7" opacity="1" stroke="#1e2a44" stroke-width="2"/><text x="675" y="186" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">General use</text><text x="675" y="206" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">some areas</text><rect x="620" y="240" width="40" height="34" rx="6" fill="#b5d3cf" opacity="1" stroke="#1e2a44" stroke-width="2"/><text x="675" y="256" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Restricted</text><text x="675" y="276" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">fishing limited</text><rect x="620" y="310" width="40" height="34" rx="6" fill="#6f9a52" opacity="0.85" stroke="#1e2a44" stroke-width="2"/><text x="675" y="326" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">No-take green</text><text x="675" y="346" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">roughly a third</text><text x="737" y="385" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">since rezoning in 2004</text><rect x="605" y="430" width="265" height="240" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="737" y="465" font-size="19" font-weight="700" fill="#b5602e" text-anchor="middle">Crosses the</text><text x="737" y="489" font-size="19" font-weight="700" fill="#b5602e" text-anchor="middle">boundaries</text><text x="625" y="530" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="642" y="530" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">warming water:</text><text x="642" y="552" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">repeated mass</text><text x="642" y="574" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">bleaching</text><text x="625" y="610" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="642" y="610" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">pollution running</text><text x="642" y="632" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">off farmland</text><text x="310" y="690" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Schematic, not to scale</text>
</svg>