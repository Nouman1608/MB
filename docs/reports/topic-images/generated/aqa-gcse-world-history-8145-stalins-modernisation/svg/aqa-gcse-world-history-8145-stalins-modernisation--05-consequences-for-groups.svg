<rect width="900" height="566" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Winners and losers</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Consequences for the groups named in the specification</text>
<clipPath id="tc124"><rect x="30" y="124" width="840" height="410" rx="14"/></clipPath><g clip-path="url(#tc124)"><rect x="30" y="124" width="177.46478873239437" height="49" fill="#b5d3cf"/><text x="44" y="152.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Group</text><rect x="207.46478873239437" y="124" width="331.2676056338028" height="49" fill="#b5d3cf"/><text x="221.46478873239437" y="152.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Gains</text><rect x="538.7323943661972" y="124" width="331.2676056338028" height="49" fill="#f2e7b8"/><text x="552.7323943661972" y="152.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Losses</text><rect x="30" y="173" width="177.46478873239437" height="89" fill="#dce9e7"/><text x="44" y="199.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Kulaks</text><rect x="207.46478873239437" y="173" width="331.2676056338028" height="89" fill="#ffffff"/><rect x="538.7323943661972" y="173" width="331.2676056338028" height="89" fill="#ffffff"/><text x="552.7323943661972" y="199.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Millions deported to Siberia,</text><text x="552.7323943661972" y="220.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Kazakhstan and the far north or sent to</text><text x="552.7323943661972" y="241.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">labour camps; land and property taken</text><line x1="30" y1="262" x2="870" y2="262" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="262" width="177.46478873239437" height="68" fill="#dce9e7"/><text x="44" y="288.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">City dwellers</text><rect x="207.46478873239437" y="262" width="331.2676056338028" height="68" fill="#f8faf9"/><text x="221.46478873239437" y="288.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Education, healthcare and cultural</text><text x="221.46478873239437" y="309.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">facilities expanded</text><rect x="538.7323943661972" y="262" width="331.2676056338028" height="68" fill="#f8faf9"/><text x="552.7323943661972" y="288.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Shared rooms in communal flats or</text><text x="552.7323943661972" y="309.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">barracks; rationing until 1935; queues</text><line x1="30" y1="330" x2="870" y2="330" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="330" width="177.46478873239437" height="68" fill="#dce9e7"/><text x="44" y="356.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Industrial workers</text><rect x="207.46478873239437" y="330" width="331.2676056338028" height="68" fill="#ffffff"/><text x="221.46478873239437" y="356.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Stakhanovites (from 1935) got higher</text><text x="221.46478873239437" y="377.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">pay and privileges</text><rect x="538.7323943661972" y="330" width="331.2676056338028" height="68" fill="#ffffff"/><text x="552.7323943661972" y="356.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Harsh discipline; labour books from</text><text x="552.7323943661972" y="377.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">1938; Gulag forced labour</text><line x1="30" y1="398" x2="870" y2="398" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="398" width="177.46478873239437" height="68" fill="#dce9e7"/><text x="44" y="424.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Professional</text><text x="44" y="445.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">workers</text><rect x="207.46478873239437" y="398" width="331.2676056338028" height="68" fill="#f8faf9"/><text x="221.46478873239437" y="424.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">New Soviet-trained engineers rose</text><text x="221.46478873239437" y="445.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">quickly</text><rect x="538.7323943661972" y="398" width="331.2676056338028" height="68" fill="#f8faf9"/><text x="552.7323943661972" y="424.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Old engineers distrusted (Shakhty trial,</text><text x="552.7323943661972" y="445.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">1928); managers blamed and arrested</text><line x1="30" y1="466" x2="870" y2="466" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="466" width="177.46478873239437" height="68" fill="#dce9e7"/><text x="44" y="492.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Women</text><rect x="207.46478873239437" y="466" width="331.2676056338028" height="68" fill="#ffffff"/><text x="221.46478873239437" y="492.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Millions entered industry; more</text><text x="221.46478873239437" y="513.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">education; workplace crèches</text><rect x="538.7323943661972" y="466" width="331.2676056338028" height="68" fill="#ffffff"/><text x="552.7323943661972" y="492.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">"Double burden"; 1936 Family Code</text><text x="552.7323943661972" y="513.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">banned abortion, made divorce harder</text></g><line x1="207.46478873239437" y1="124" x2="207.46478873239437" y2="534" stroke="#c9d6d4" stroke-width="1.5"/><line x1="538.7323943661972" y1="124" x2="538.7323943661972" y2="534" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="124" width="840" height="410" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/>
</svg>