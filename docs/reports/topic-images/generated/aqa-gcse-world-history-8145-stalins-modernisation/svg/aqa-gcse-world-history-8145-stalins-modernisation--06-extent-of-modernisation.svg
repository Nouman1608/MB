<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 553" width="900" height="553" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="553" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How far did the USSR modernise?</text>

<rect x="30" y="100" width="411" height="288" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">MODERNISED</text><text x="50" y="159.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Heavy industry and defence</text><text x="50" y="189.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="189.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Heavy industry expanded dramatically</text><text x="50" y="216.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="216.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">New industrial cities and power stations</text><text x="50" y="243.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="243.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Literacy and technical education spread</text><text x="50" y="270.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="270.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Industry moved east: vital to victory in the</text><text x="66.15" y="292.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Second World War</text><rect x="459" y="100" width="411" height="288" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="479" y="132" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">LIMITS AND COSTS</text><text x="479" y="159.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Countryside and living standards</text><text x="479" y="189.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="495.15" y="189.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Agriculture badly damaged; livestock took</text><text x="495.15" y="211.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">years to recover</text><text x="479" y="238.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="495.15" y="238.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Consumer goods and housing lagged far</text><text x="495.15" y="260.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">behind</text><text x="479" y="287.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="495.15" y="287.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Forced labour and terror</text><text x="479" y="314.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="495.15" y="314.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Statistics often exaggerated</text><text x="479" y="341.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="495.15" y="341.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Enormous human cost of famine and</text><text x="495.15" y="363.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">deportation</text><rect x="30" y="410" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="444.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">A strong conclusion</text><text x="50" y="474.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Heavy industry and defence capacity were modernised to a remarkable extent; the countryside and</text><text x="50" y="496.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">living standards were not, and the methods were brutal.</text>
</svg>