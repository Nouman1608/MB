<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 547" width="900" height="547" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="547" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Question 5: Soviet women</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">In what ways were women's lives affected by modernisation?</text>
<rect x="30" y="124" width="411" height="212" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">WAY 1</text><text x="50" y="183.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">New opportunities in paid work</text><text x="50" y="213.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="213.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">The Five-Year Plans needed huge numbers</text><text x="66.15" y="235.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">of workers</text><text x="50" y="262.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="262.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Millions entered factories, building sites and</text><text x="66.15" y="284.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">transport</text><text x="50" y="311.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="311.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Crèches let mothers work</text><rect x="459" y="124" width="411" height="212" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="479" y="156" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">WAY 2</text><text x="479" y="183.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Family life under state control</text><text x="479" y="213.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="495.15" y="213.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">1936 Family Code banned abortion, made</text><text x="495.15" y="235.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">divorce harder</text><text x="479" y="262.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="495.15" y="262.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Stalin wanted to raise the birth rate</text><line x1="240" y1="350" x2="400" y2="388" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="660" y1="350" x2="500" y2="388" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="404" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="438.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Result: the "double burden"</text><text x="450" y="468.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Expected to be both workers and mothers, while still doing most of the housework in overcrowded</text><text x="450" y="490.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">city flats.</text>
</svg>