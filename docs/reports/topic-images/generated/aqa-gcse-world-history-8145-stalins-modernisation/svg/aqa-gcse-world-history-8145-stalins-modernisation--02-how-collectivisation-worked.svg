<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 498" width="900" height="498" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="498" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How collectivisation worked</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Ending private farming</text>
<rect x="30" y="124" width="230" height="110" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="145" y="159.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Peasants</text><text x="145" y="188.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Land, animals and tools</text><text x="145" y="209.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">merged</text><rect x="320" y="124" width="240" height="110" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="440" y="170.1" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Collective farm</text><text x="440" y="199.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">(kolkhoz)</text><rect x="660" y="124" width="210" height="110" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="765" y="159.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">The state</text><text x="765" y="188.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Grain for cities and</text><text x="765" y="209.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">export</text><rect x="320" y="314" width="240" height="152" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="440" y="348.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Machine Tractor</text><text x="440" y="371.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Station</text><text x="440" y="399.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Supplies tractors and</text><text x="440" y="420.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">machinery; lets the party</text><text x="440" y="441.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">watch the villages</text><rect x="660" y="314" width="210" height="152" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="765" y="370.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">State farm</text><text x="765" y="398.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">(sovkhoz) peasants</text><text x="765" y="419.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">work for wages</text><rect x="30" y="314" width="230" height="152" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="145" y="359.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Kulaks</text><text x="145" y="388.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Better-off peasants;</text><text x="145" y="409.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">anyone who resisted</text><text x="145" y="430.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">could be labelled one</text><line x1="266" y1="179" x2="314" y2="179" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="566" y1="179" x2="654" y2="179" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="610" y="210" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">fixed grain</text><text x="610" y="229" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">quotas</text><line x1="440" y1="308" x2="440" y2="242" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="452" y="284" font-size="16" font-weight="600" fill="#4a5568" text-anchor="start">machinery</text>
</svg>