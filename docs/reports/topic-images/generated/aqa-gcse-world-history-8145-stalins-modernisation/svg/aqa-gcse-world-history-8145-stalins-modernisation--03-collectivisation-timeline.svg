<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 693" width="900" height="693" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="693" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Collectivisation and its cost</text>

<line x1="160" y1="108" x2="160" y2="653" stroke="#1e2a44" stroke-width="4"/><rect x="200" y="100" width="670" height="69" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="213" y="127.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Campaign begins in earnest</text><text x="213" y="151.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">December: Stalin calls for the kulaks to be "liquidated as a class".</text><circle cx="160" cy="134.5" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="140" y="140.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1929</text><rect x="200" y="179" width="670" height="69" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="213" y="206.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Peasant resistance</text><text x="213" y="230.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Animals slaughtered and crops burned; livestock numbers roughly halved.</text><circle cx="160" cy="213.5" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="140" y="219.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Early 1930s</text><rect x="200" y="258" width="670" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="213" y="285.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">"Dizzy with Success"</text><text x="213" y="309.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Stalin blames local officials; many peasants briefly leave the collectives, but</text><text x="213" y="330.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">pressure soon resumes.</text><circle cx="160" cy="303" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="140" y="309" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Mar 1930</text><rect x="200" y="358" width="670" height="69" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="213" y="385.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Law on collective-farm grain</text><text x="213" y="409.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Even the theft of small amounts punished.</text><circle cx="160" cy="392.5" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="140" y="398.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Aug 1932</text><rect x="200" y="437" width="670" height="90" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="213" y="464.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Famine</text><text x="213" y="488.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Ukraine (the Holodomor), Kazakhstan and other regions; millions died while grain</text><text x="213" y="509.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">was still exported.</text><circle cx="160" cy="482" r="10" fill="#b5602e" stroke="#1e2a44" stroke-width="3"/><text x="140" y="488" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1932-33</text><rect x="200" y="537" width="670" height="69" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="213" y="564.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Internal passports</text><text x="213" y="588.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Harder for peasants to leave for the cities.</text><circle cx="160" cy="571.5" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="140" y="577.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">End 1932</text><rect x="200" y="616" width="670" height="45" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="213" y="643.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Almost all farms collectivised</text><circle cx="160" cy="638.5" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="140" y="644.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">End 1930s</text>
</svg>