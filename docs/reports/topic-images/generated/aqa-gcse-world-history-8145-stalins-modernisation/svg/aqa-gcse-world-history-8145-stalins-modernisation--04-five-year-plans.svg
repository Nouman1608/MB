<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 674" width="900" height="674" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="674" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The Five-Year Plans, 1928-41</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Targets set by Gosplan for every industry</text>
<rect x="30" y="124" width="256" height="196" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FIRST · 1928-32</text><text x="50" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Heavy industry</text><text x="50" y="211.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Coal, iron, steel, oil,</text><text x="50" y="232.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">electricity. Magnitogorsk;</text><text x="50" y="253.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Dnieper dam; tractor</text><text x="50" y="274.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">factories. Declared</text><text x="50" y="295.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">complete in four years.</text><line x1="292" y1="222" x2="316" y2="222" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="322" y="124" width="256" height="196" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="342" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SECOND · 1933-37</text><text x="342" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">+ Transport</text><text x="342" y="211.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Moscow Metro (opened</text><text x="342" y="232.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">1935); White Sea Canal,</text><text x="342" y="253.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">built by prisoners.</text><line x1="584" y1="222" x2="608" y2="222" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="614" y="124" width="256" height="196" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="634" y="156" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">THIRD · 1938-41</text><text x="634" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Rearmament</text><text x="634" y="211.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Factories in the Urals and</text><text x="634" y="232.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Siberia. Cut short by the</text><text x="634" y="253.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">German invasion.</text><rect x="30" y="342" width="840" height="300" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="378" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Steel output (official figures, which may be exaggerated)</text><line x1="120" y1="597" x2="480" y2="597" stroke="#1e2a44" stroke-width="2.5"/><rect x="170" y="563" width="100" height="34" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="220" y="553" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">about 4 million t</text><text x="220" y="621" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">1928</text><rect x="340" y="444" width="100" height="153" fill="#2e6b62" stroke="#1e2a44" stroke-width="2.5"/><text x="390" y="434" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">about 18 million t</text><text x="390" y="621" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">1940</text><text x="540" y="432" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Targets were often impossible, and</text><text x="540" y="454" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">managers <tspan font-weight="700">falsified</tspan> <tspan font-weight="700">figures</tspan> to avoid</text><text x="540" y="476" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">punishment.</text><text x="540" y="522" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Consumer goods (clothing, shoes,</text><text x="540" y="544" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">housing) received far less</text><text x="540" y="566" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">investment.</text>
</svg>