<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 571" width="900" height="571" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="571" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why did Stalin modernise?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">A "great turn" towards rapid change from the late 1920s</text>
<rect x="30" y="124" width="840" height="111" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="158.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The starting point</text><text x="50" y="188.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A mainly peasant country. Under the NEP, peasants held back grain in 1927-28 because state</text><text x="50" y="210.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">prices were low, causing shortages in the cities.</text><rect x="30" y="251" width="411" height="135" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="283" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">DEFENCE</text><text x="50" y="309.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">"Fifty or a hundred years behind"</text><text x="50" y="339.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Stalin (1931): close the gap in ten years or be</text><text x="50" y="361.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">crushed by the capitalist powers.</text><rect x="459" y="251" width="411" height="135" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="479" y="283" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">IDEOLOGY</text><text x="479" y="309.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">End capitalist survivals</text><text x="479" y="339.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">A socialist state needed collective farms and</text><text x="479" y="361.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">state-owned industry.</text><rect x="30" y="404" width="411" height="135" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="436" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FOOD AND EXPORTS</text><text x="50" y="462.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Reliable grain</text><text x="50" y="492.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">To feed growing cities and to sell abroad to</text><text x="50" y="514.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">pay for machinery.</text><rect x="459" y="404" width="411" height="135" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="479" y="436" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">POWER</text><text x="479" y="462.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Control</text><text x="479" y="492.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Strengthened Stalin's position and the party's</text><text x="479" y="514.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">control over the countryside.</text>
</svg>