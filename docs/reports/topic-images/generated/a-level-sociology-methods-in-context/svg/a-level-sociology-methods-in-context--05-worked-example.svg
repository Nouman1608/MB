<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 589" width="900" height="589" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="589" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Structured interviews and teachers’ expectations</text>

<rect x="238" y="104" width="632" height="44" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="554" y="131.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">What the answer says</text><rect x="30" y="156" width="200" height="74" rx="10" fill="#ffffff" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="198.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Low: method-only</text><rect x="238" y="156" width="632" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="252" y="187.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Structured interviews are quick to administer and produce data that</text><text x="252" y="209.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">is easy to compare across respondents.</text><rect x="30" y="238" width="200" height="52" rx="10" fill="#ffffff" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="269.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Low: context-only</text><rect x="238" y="238" width="632" height="52" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="252" y="269.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Teachers might not want to admit to treating pupils differently.</text><rect x="30" y="298" width="200" height="140" rx="10" fill="#d4b02e" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="373.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">High: combined</text><rect x="238" y="298" width="632" height="140" rx="10" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2"/><text x="252" y="329.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Structured interviews are <tspan font-weight="700">quick to administer</tspan>, which suits <tspan font-weight="700">teachers’</tspan></text><text x="252" y="351.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">limited free time</tspan> during the school day, but teachers used to being</text><text x="252" y="373.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">observed and evaluated may give <tspan font-weight="700">socially desirable answers</tspan> rather</text><text x="252" y="395.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">than admit to differential treatment: a validity issue acute for this</text><text x="252" y="417.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">sensitive topic</tspan> and this <tspan font-weight="700">standardised method</tspan>.</text><rect x="30" y="454" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="490" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Why it works</text><text x="56" y="519" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">It names a feature of the method and a feature of the education context, and explains how</text><text x="56" y="541" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">the two interact.</text>
</svg>