<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Methods in Context is a skill, not a topic</text>

<rect x="30" y="104" width="390" height="260" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,154 L31.25,118.25 Q31.25,105.25 44.25,105.25 L405.75,105.25 Q418.75,105.25 418.75,118.25 L418.75,154 Z" fill="#b5d3cf"/><line x1="31.25" y1="154" x2="418.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="225" y="134.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">3.1.3 Theory and Methods</text><text x="44" y="186.15" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="start">research methods knowledge</text><circle cx="49" cy="208.54" r="4.5" fill="#2e6b62"/><text x="62" y="214.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Quantitative and qualitative methods</text><circle cx="49" cy="238.54" r="4.5" fill="#2e6b62"/><text x="62" y="244.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Questionnaires, interviews,</text><text x="62" y="266.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">observation, experiments, documents,</text><text x="62" y="288.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">official statistics</text><circle cx="49" cy="312.53999999999996" r="4.5" fill="#2e6b62"/><text x="62" y="318.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Practical, ethical and theoretical</text><text x="62" y="340.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">considerations</text><rect x="480" y="104" width="390" height="260" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M481.25,154 L481.25,118.25 Q481.25,105.25 494.25,105.25 L855.75,105.25 Q868.75,105.25 868.75,118.25 L868.75,154 Z" fill="#f2e7b8"/><line x1="481.25" y1="154" x2="868.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="675" y="134.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">3.1.1 Education</text><text x="494" y="186.15" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="start">substantive knowledge</text><circle cx="499" cy="208.54" r="4.5" fill="#2e6b62"/><text x="512" y="214.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Role and functions of education</text><circle cx="499" cy="238.54" r="4.5" fill="#2e6b62"/><text x="512" y="244.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Differential achievement</text><circle cx="499" cy="268.53999999999996" r="4.5" fill="#2e6b62"/><text x="512" y="274.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">In-school relationships and processes</text><circle cx="499" cy="298.53999999999996" r="4.5" fill="#2e6b62"/><text x="512" y="304.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Educational policy</text><line x1="232" y1="370" x2="400" y2="420" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="668" y1="370" x2="500" y2="420" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="190" y="426" width="520" height="92" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="464" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">3.1.2 Methods in Context</text><text x="450" y="494" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">apply the first to the second</text><rect x="30" y="536" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="572" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The whole requirement</text><text x="56" y="601" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">"Students must be able to apply sociological research methods to the study of education."</text><text x="56" y="623" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">It names no separate content, so it cannot be revised as a standalone topic.</text>
