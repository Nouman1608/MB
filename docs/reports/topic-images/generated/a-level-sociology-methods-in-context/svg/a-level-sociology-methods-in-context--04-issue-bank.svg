<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A bank of education-specific issues</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">research in schools routinely involves children</text>
<rect x="30" y="120" width="412" height="108" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,170 L31.25,134.25 Q31.25,121.25 44.25,121.25 L427.75,121.25 Q440.75,121.25 440.75,134.25 L440.75,170 Z" fill="#b5d3cf"/><line x1="31.25" y1="170" x2="440.75" y2="170" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="151" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Gatekeeper access</text><circle cx="64" cy="145" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="64" y="151.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="46" y="204.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Access via head teachers and parents.</text><rect x="458" y="120" width="412" height="108" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,170 L459.25,134.25 Q459.25,121.25 472.25,121.25 L855.75,121.25 Q868.75,121.25 868.75,134.25 L868.75,170 Z" fill="#b5d3cf"/><line x1="459.25" y1="170" x2="868.75" y2="170" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="151" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Timetabling</text><circle cx="492" cy="145" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="492" y="151.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="474" y="204.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">School timetabling constraints.</text><rect x="30" y="244" width="412" height="108" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,294 L31.25,258.25 Q31.25,245.25 44.25,245.25 L427.75,245.25 Q440.75,245.25 440.75,258.25 L440.75,294 Z" fill="#f2e7b8"/><line x1="31.25" y1="294" x2="440.75" y2="294" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="275" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Power imbalance</text><circle cx="64" cy="269" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="64" y="275.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="46" y="328.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Between adult researchers and pupils.</text><rect x="458" y="244" width="412" height="108" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,294 L459.25,258.25 Q459.25,245.25 472.25,245.25 L855.75,245.25 Q868.75,245.25 868.75,258.25 L868.75,294 Z" fill="#f2e7b8"/><line x1="459.25" y1="294" x2="868.75" y2="294" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="275" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Informed consent</text><circle cx="492" cy="269" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="492" y="275.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="474" y="328.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Complications of working with minors.</text><rect x="30" y="368" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="404" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Prepare in advance</text><text x="56" y="433" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">These issues recur across many different methods-in-context items.</text>
