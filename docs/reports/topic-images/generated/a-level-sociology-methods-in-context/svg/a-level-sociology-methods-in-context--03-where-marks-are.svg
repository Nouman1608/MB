<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Where the marks are earned</text>

<circle cx="340" cy="330" r="200" fill="#b5d3cf" fill-opacity="0.75" stroke="#1e2a44" stroke-width="3"/><circle cx="560" cy="330" r="200" fill="#f2e7b8" fill-opacity="0.75" stroke="#1e2a44" stroke-width="3"/><path d="M450,162.96706911509935 A200,200 0 0 1 450,497.0329308849007 A200,200 0 0 1 450,162.96706911509935 Z" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="245" y="290" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">A feature of</text><text x="245" y="316" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">the method</text><text x="245" y="360" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Method-only:</text><text x="245" y="381" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">abstract strengths</text><text x="245" y="402" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">and weaknesses</text><text x="655" y="290" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">A feature of the</text><text x="655" y="316" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">education context</text><text x="655" y="360" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Context-only:</text><text x="655" y="381" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">facts about education</text><text x="655" y="402" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">with no method link</text><text x="450" y="300" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Explain</text><text x="450" y="325" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">how they</text><text x="450" y="350" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">interact</text><text x="245" y="462" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">low marks</text><text x="655" y="462" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">low marks</text><text x="450" y="404" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">top band</text><rect x="30" y="554" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="590" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Use the item</text><text x="56" y="619" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Every top-band point references a specific detail from the item describing the research</text><text x="56" y="641" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">situation.</text>
