<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 683" width="900" height="683" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="683" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">No liability for omissions, unless there is a duty</text>

<rect x="30" y="100" width="840" height="60" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="134.4" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle"><tspan font-weight="700" fill="#1e2a44">General</tspan> <tspan font-weight="700" fill="#1e2a44">rule:</tspan> no liability for failing to act, even where a moral duty exists.</text><rect x="30" y="182" width="270.6666666666667" height="145" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="210" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STATUTE</text><text x="46" y="236.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Road Traffic Act 1988</text><text x="46" y="264.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Failing to provide a breath</text><text x="46" y="285.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">specimen</text><rect x="314.6666666666667" y="182" width="270.6666666666667" height="145" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="330.6666666666667" y="210" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CONTRACT</text><text x="330.6666666666667" y="236.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">R v Pittwood (1902)</text><text x="330.6666666666667" y="264.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Level-crossing keeper left the</text><text x="330.6666666666667" y="285.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">gate open; a cart was hit by a</text><text x="330.6666666666667" y="306.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">train</text><rect x="599.3333333333334" y="182" width="270.6666666666667" height="145" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="615.3333333333334" y="210" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PUBLIC OFFICE</text><text x="615.3333333333334" y="236.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">R v Dytham (1979)</text><text x="615.3333333333334" y="264.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Police officer watched a man</text><text x="615.3333333333334" y="285.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">being beaten and did nothing</text><rect x="30" y="341" width="270.6666666666667" height="166" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="369" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ASSUMING CARE</text><text x="46" y="395.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">R v Stone and Dobinson</text><text x="46" y="418.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">(1977)</text><text x="46" y="446.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Couple took in a sick relative</text><text x="46" y="467.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and failed to get help</text><rect x="314.6666666666667" y="341" width="270.6666666666667" height="166" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="330.6666666666667" y="369" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SPECIAL RELATIONSHIP</text><text x="330.6666666666667" y="395.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">R v Gibbins and Proctor</text><text x="330.6666666666667" y="418.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">(1918)</text><text x="330.6666666666667" y="446.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Father and partner starved his</text><text x="330.6666666666667" y="467.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">child</text><rect x="599.3333333333334" y="341" width="270.6666666666667" height="166" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="615.3333333333334" y="369" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CREATING DANGER</text><text x="615.3333333333334" y="395.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">R v Miller (1983)</text><text x="615.3333333333334" y="423.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Squatter started a fire</text><text x="615.3333333333334" y="444.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">accidentally and left. Extended</text><text x="615.3333333333334" y="465.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">in <tspan font-style="italic">R</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Evans</tspan> (2009): supplied</text><text x="615.3333333333334" y="486.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">heroin, then failed to get help</text><rect x="30" y="529" width="413" height="122" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="557" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">WITHDRAWING TREATMENT</text><text x="46" y="588.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Airedale</tspan> <tspan font-style="italic">NHS</tspan> <tspan font-style="italic">Trust</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Bland</tspan> (1993): an omission,</text><text x="46" y="609.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">lawful because continued treatment was no</text><text x="46" y="630.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">longer in the patient’s best interests.</text><rect x="457" y="529" width="413" height="122" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="473" y="557" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EVALUATION</text><text x="473" y="588.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Protects autonomy and avoids vague duties, but</text><text x="473" y="609.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">can let morally blameworthy bystanders escape</text><text x="473" y="630.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">liability.</text>
</svg>