<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 515" width="900" height="515" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="515" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What the actus reus can be made of</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Every element of the offence other than the mental element</text>
<rect x="30" y="124" width="270.6666666666667" height="134" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CONDUCT</text><text x="50" y="182.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The act itself</text><text x="50" y="210.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Appropriating property in theft</text><rect x="314.6666666666667" y="124" width="270.6666666666667" height="134" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="334.6666666666667" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">RESULT</text><text x="334.6666666666667" y="182.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">A consequence that must</text><text x="334.6666666666667" y="205.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">follow</text><text x="334.6666666666667" y="233.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Damage in criminal damage</text><rect x="599.3333333333334" y="124" width="270.6666666666667" height="134" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="619.3333333333334" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CIRCUMSTANCES</text><text x="619.3333333333334" y="182.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Surrounding facts</text><text x="619.3333333333334" y="210.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Property “belonging to</text><text x="619.3333333333334" y="231.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">another”</text><rect x="30" y="280" width="412" height="203" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="312" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">MUST BE VOLUNTARY</text><text x="50" y="338.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Involuntary movement is not an act</text><text x="50" y="366.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Hill</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Baxter</tspan> (1958): a driver attacked by a swarm</text><text x="50" y="387.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">of bees</text><rect x="458" y="280" width="412" height="203" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="478" y="312" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">EXCEPTION: STATE OF AFFAIRS</text><text x="478" y="338.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">“Being found”</text><text x="478" y="366.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">R</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Larsonneur</tspan> (1933): brought into the UK</text><text x="478" y="387.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">against her will</text><text x="478" y="412.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Winzar</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Chief</tspan> <tspan font-style="italic">Constable</tspan> <tspan font-style="italic">of</tspan> <tspan font-style="italic">Kent</tspan> (1983): placed</text><text x="478" y="433.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">on the highway by police</text><text x="478" y="458.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Criticised as liability without real fault</text>
</svg>