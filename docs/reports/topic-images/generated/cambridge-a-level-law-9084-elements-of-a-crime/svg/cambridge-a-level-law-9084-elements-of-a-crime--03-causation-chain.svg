<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 903" width="900" height="903" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="903" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Causation: from act to result</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Where the offence needs a result, prove both kinds</text>
<rect x="30" y="124" width="840" height="112" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">FACTUAL CAUSATION</text><text x="450" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">But for the act, would the result have happened?</text><text x="450" y="211.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle"><tspan font-style="italic">R</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">White</tspan> (1910): mother died of a heart attack before the poison worked; not murder (attempt only)</text><line x1="450" y1="241" x2="450" y2="275" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="280" width="840" height="112" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="312" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">LEGAL CAUSATION</text><text x="450" y="338.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">An operating and substantial cause, more than minimal</text><text x="450" y="367.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Not necessarily the only cause: <tspan font-style="italic">R</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Smith</tspan> (1959), the wound was still operating</text><text x="450" y="424" font-size="16" font-weight="700" fill="#4a5568" text-anchor="middle">HAS AN INTERVENING ACT BROKEN THE CHAIN?</text><clipPath id="tc446"><rect x="30" y="446" width="840" height="294" rx="14"/></clipPath><g clip-path="url(#tc446)"><rect x="30" y="446" width="170.27027027027026" height="48" fill="#b5d3cf"/><text x="44" y="473.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Intervening act</text><rect x="200.27027027027026" y="446" width="363.2432432432432" height="48" fill="#b5d3cf"/><text x="214.27027027027026" y="473.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Chain NOT broken</text><rect x="563.5135135135135" y="446" width="306.48648648648646" height="48" fill="#d4b02e"/><text x="577.5135135135135" y="473.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Chain broken</text><rect x="30" y="494" width="170.27027027027026" height="68" fill="#dce9e7"/><text x="44" y="520.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Third party</text><rect x="200.27027027027026" y="494" width="363.2432432432432" height="68" fill="#ffffff"/><text x="214.27027027027026" y="520.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">R</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Pagett</tspan> (1983): police returning fire was</text><text x="214.27027027027026" y="541.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">a reasonable response</text><rect x="563.5135135135135" y="494" width="306.48648648648646" height="68" fill="#ffffff"/><line x1="30" y1="562" x2="870" y2="562" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="562" width="170.27027027027026" height="89" fill="#dce9e7"/><text x="44" y="588.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Medical</text><text x="44" y="609.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">treatment</text><rect x="200.27027027027026" y="562" width="363.2432432432432" height="89" fill="#f8faf9"/><text x="214.27027027027026" y="588.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">R</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Cheshire</tspan> (1991): negligent treatment, not</text><text x="214.27027027027026" y="609.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">so independent and potent as to make the</text><text x="214.27027027027026" y="630.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">wound insignificant</text><rect x="563.5135135135135" y="562" width="306.48648648648646" height="89" fill="#f8faf9"/><text x="577.5135135135135" y="588.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">R</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Jordan</tspan> (1956): “palpably wrong”</text><text x="577.5135135135135" y="609.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">treatment of an almost healed</text><text x="577.5135135135135" y="630.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">wound</text><line x1="30" y1="651" x2="870" y2="651" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="651" width="170.27027027027026" height="89" fill="#dce9e7"/><text x="44" y="677.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Victim’s own act</text><rect x="200.27027027027026" y="651" width="363.2432432432432" height="89" fill="#ffffff"/><text x="214.27027027027026" y="677.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">R</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Roberts</tspan> (1971): jumping from the car</text><text x="214.27027027027026" y="698.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">was foreseeable, not “so daft”</text><rect x="563.5135135135135" y="651" width="306.48648648648646" height="89" fill="#ffffff"/><text x="577.5135135135135" y="677.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">R</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Kennedy</tspan> <tspan font-style="italic">(No</tspan> <tspan font-style="italic">2)</tspan> (2007): free,</text><text x="577.5135135135135" y="698.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">deliberate and informed</text><text x="577.5135135135135" y="719.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">self-injection</text></g><line x1="200.27027027027026" y1="446" x2="200.27027027027026" y2="740" stroke="#c9d6d4" stroke-width="1.5"/><line x1="563.5135135135135" y1="446" x2="563.5135135135135" y2="740" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="446" width="840" height="294" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="762" width="840" height="109" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="796.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Thin skull rule</text><text x="50" y="825.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Take the victim as you find them: <tspan font-style="italic">R</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Blaue</tspan> (1975), refusing a blood transfusion on religious grounds did</text><text x="50" y="846.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">not break the chain.</text>
</svg>