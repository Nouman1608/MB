<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 741" width="900" height="741" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="741" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How oblique intention developed</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">A consequence that was a by-product, not the aim</text>
<line x1="120" y1="134" x2="120" y2="597" stroke="#2e6b62" stroke-width="4"/><rect x="170" y="124" width="700" height="81" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="186" y="154.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">R v Moloney (1985)</text><text x="186" y="184.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Foresight of consequences is only evidence of intention</text><circle cx="120" cy="164.5" r="11" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><line x1="131" y1="164.5" x2="170" y2="164.5" stroke="#1e2a44" stroke-width="2.5"/><text x="98" y="171.5" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="end">1985</text><rect x="170" y="219" width="700" height="81" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="186" y="249.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">R v Hancock and Shankland (1986)</text><text x="186" y="279.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The greater the probability, the more likely it was foreseen and intended</text><circle cx="120" cy="259.5" r="11" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><line x1="131" y1="259.5" x2="170" y2="259.5" stroke="#1e2a44" stroke-width="2.5"/><text x="98" y="266.5" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="end">1986</text><rect x="170" y="314" width="700" height="81" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="186" y="344.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">R v Nedrick (1986)</text><text x="186" y="374.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The “virtual certainty” test</text><circle cx="120" cy="354.5" r="11" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><line x1="131" y1="354.5" x2="170" y2="354.5" stroke="#1e2a44" stroke-width="2.5"/><text x="98" y="361.5" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="end">1986</text><rect x="170" y="409" width="700" height="103" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="186" y="439.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">R v Woollin (1998)</text><text x="186" y="469.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Virtual certainty barring some unforeseen intervention, AND the defendant</text><text x="186" y="491.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">appreciated it</text><circle cx="120" cy="460.5" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><line x1="131" y1="460.5" x2="170" y2="460.5" stroke="#1e2a44" stroke-width="2.5"/><text x="98" y="467.5" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="end">1998</text><rect x="170" y="526" width="700" height="81" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="186" y="556.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">R v Matthews and Alleyne (2003)</text><text x="186" y="586.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A rule of evidence: the jury may find intention but is not obliged to</text><circle cx="120" cy="566.5" r="11" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><line x1="131" y1="566.5" x2="170" y2="566.5" stroke="#1e2a44" stroke-width="2.5"/><text x="98" y="573.5" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="end">2003</text><rect x="30" y="629" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="662.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Common</tspan> <tspan font-weight="700" fill="#1e2a44">mistake:</tspan> writing that foresight of virtual certainty <tspan font-style="italic">is</tspan> intention. It is evidence from which</text><text x="50" y="684.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">the jury is <tspan font-style="italic">entitled</tspan> to find it.</text>
</svg>