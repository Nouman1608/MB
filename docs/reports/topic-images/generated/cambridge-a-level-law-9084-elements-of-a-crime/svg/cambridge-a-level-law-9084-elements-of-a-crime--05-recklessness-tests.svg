<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 539" width="900" height="539" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="539" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Recklessness: subjective, objective, subjective again</text>

<rect x="30" y="100" width="253.33333333333334" height="166" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="128" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SUBJECTIVE</text><text x="46" y="154.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">R v Cunningham (1957)</text><text x="46" y="182.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Tore a gas meter from a</text><text x="46" y="203.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">wall; gas seeped next door.</text><text x="46" y="224.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Reckless only if he foresaw</text><text x="46" y="245.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the risk and took it.</text><line x1="289.33333333333337" y1="183" x2="317.33333333333337" y2="183" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="323.33333333333337" y="100" width="253.33333333333334" height="166" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="339.33333333333337" y="128" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">OBJECTIVE</text><text x="339.33333333333337" y="154.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">MPC v Caldwell (1982)</text><text x="339.33333333333337" y="182.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A risk obvious to a</text><text x="339.33333333333337" y="203.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">reasonable person:</text><text x="339.33333333333337" y="224.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">convicted those incapable of</text><text x="339.33333333333337" y="245.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">seeing the risk.</text><line x1="582.6666666666667" y1="183" x2="610.6666666666667" y2="183" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="616.6666666666667" y="100" width="253.33333333333334" height="166" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="632.6666666666667" y="128" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SUBJECTIVE: TODAY’S LAW</text><text x="632.6666666666667" y="154.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">R v G (2003)</text><text x="632.6666666666667" y="182.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Boys set fire to newspapers</text><text x="632.6666666666667" y="203.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">behind a shop; had not</text><text x="632.6666666666667" y="224.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">foreseen the risk. <tspan font-style="italic">Caldwell</tspan></text><text x="632.6666666666667" y="245.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">overruled.</text><rect x="30" y="288" width="840" height="119" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="50" y="320" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">THE R v G TEST</text><text x="50" y="353.4" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Aware</tspan> <tspan font-weight="700" fill="#1e2a44">of</tspan> <tspan font-weight="700" fill="#1e2a44">a</tspan> <tspan font-weight="700" fill="#1e2a44">risk</tspan> that the result will occur, and</text><text x="50" y="381.4" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">it is, in the circumstances known to the defendant, <tspan font-weight="700" fill="#1e2a44">unreasonable</tspan> <tspan font-weight="700" fill="#1e2a44">to</tspan> <tspan font-weight="700" fill="#1e2a44">take</tspan> that risk.</text><rect x="30" y="429" width="840" height="78" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="461.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Intention is the higher level of fault; recklessness is lower but still needs awareness of risk. Criminal</text><text x="50" y="482.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">damage (Criminal Damage Act 1971) can be committed intentionally or recklessly.</text>
</svg>