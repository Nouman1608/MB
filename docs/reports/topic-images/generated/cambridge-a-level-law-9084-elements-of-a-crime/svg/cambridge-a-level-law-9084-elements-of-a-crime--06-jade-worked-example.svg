<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 885" width="900" height="885" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="885" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: Jade’s brick</text>

<rect x="30" y="100" width="840" height="111" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FACTS</text><text x="50" y="164.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Jade throws a brick at Omar’s car to frighten him, knowing he is inside with the window down. It</text><text x="50" y="186.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">hits his head. In hospital a doctor gives the wrong drug, which delays his recovery.</text><line x1="60" y1="253" x2="60" y2="833" stroke="#c9d6d4" stroke-width="4"/><rect x="104" y="233" width="766" height="86" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="266.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Actus reus: conduct and result</text><text x="122" y="296.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">A voluntary throw; the injury and the damage are results.</text><circle cx="60" cy="276" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="284.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="104" y="331" width="766" height="86" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="364.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Factual causation</text><text x="122" y="394.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">But for the throw, no injury (<tspan font-style="italic">White</tspan>).</text><circle cx="60" cy="374" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="382.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="104" y="429" width="766" height="108" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="462.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Legal causation</text><text x="122" y="492.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">The head wound is still operating and substantial (<tspan font-style="italic">Smith</tspan>); the doctor’s error was not so</text><text x="122" y="514.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">independent and potent (<tspan font-style="italic">Cheshire</tspan>). Chain unbroken.</text><circle cx="60" cy="483" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="491.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="104" y="549" width="766" height="108" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="582.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Intention?</text><text x="122" y="612.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Aim was to frighten, so no direct intention. Injury likely, but perhaps not a virtual certainty</text><text x="122" y="634.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">(<tspan font-style="italic">Woollin</tspan>).</text><circle cx="60" cy="603" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="611.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="104" y="669" width="766" height="86" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="702.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Recklessness</text><text x="122" y="732.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">She knew Omar was inside: aware of the risk, and taking it was unreasonable (<tspan font-style="italic">R</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">G</tspan>).</text><circle cx="60" cy="712" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="720.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><rect x="104" y="767" width="766" height="86" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="122" y="800.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Conclusion</text><text x="122" y="830.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Actus reus and mens rea coincide at the throw: at least reckless as to both harms.</text><circle cx="60" cy="810" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="818.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">6</text>
</svg>