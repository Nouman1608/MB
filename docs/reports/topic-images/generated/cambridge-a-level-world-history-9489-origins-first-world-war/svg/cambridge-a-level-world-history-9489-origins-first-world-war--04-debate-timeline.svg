<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How the debate moved, 1919-2014</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Drawn to scale: Germany's guilt on the left, wider blame on the right</text>
<line x1="96" y1="215.5" x2="870" y2="215.5" stroke="#c9d6d4" stroke-width="1.2"/><text x="30" y="221.5" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">1920</text><line x1="96" y1="310.5" x2="870" y2="310.5" stroke="#c9d6d4" stroke-width="1.2"/><text x="30" y="316.5" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">1930</text><line x1="96" y1="405.5" x2="870" y2="405.5" stroke="#c9d6d4" stroke-width="1.2"/><text x="30" y="411.5" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">1940</text><line x1="96" y1="500.5" x2="870" y2="500.5" stroke="#c9d6d4" stroke-width="1.2"/><text x="30" y="506.5" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">1950</text><line x1="96" y1="595.5" x2="870" y2="595.5" stroke="#c9d6d4" stroke-width="1.2"/><text x="30" y="601.5" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">1960</text><line x1="96" y1="690.5" x2="870" y2="690.5" stroke="#c9d6d4" stroke-width="1.2"/><text x="30" y="696.5" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">1970</text><line x1="96" y1="785.5" x2="870" y2="785.5" stroke="#c9d6d4" stroke-width="1.2"/><text x="30" y="791.5" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">1980</text><line x1="96" y1="880.5" x2="870" y2="880.5" stroke="#c9d6d4" stroke-width="1.2"/><text x="30" y="886.5" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">1990</text><line x1="96" y1="975.5" x2="870" y2="975.5" stroke="#c9d6d4" stroke-width="1.2"/><text x="30" y="981.5" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">2000</text><line x1="96" y1="1070.5" x2="870" y2="1070.5" stroke="#c9d6d4" stroke-width="1.2"/><text x="30" y="1076.5" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">2010</text><line x1="470" y1="168" x2="470" y2="1118" stroke="#1e2a44" stroke-width="4" stroke-linecap="round"/><text x="430" y="138" font-size="15" font-weight="700" fill="#b5602e" text-anchor="end">GERMANY MAINLY TO BLAME</text><text x="510" y="138" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SHARED OR ELSEWHERE</text><path d="M470,206 L454,206 L436,206" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="203.44799999999998" y="191.4" width="231.55200000000002" height="67" fill="#f4f6f6"/><text x="430" y="210.20000000000002" font-size="16" font-weight="700" fill="#b5602e" text-anchor="end">1919</text><text x="430" y="231.20000000000002" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">Article 231: Germany accepts</text><text x="430" y="252.20000000000002" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">responsibility</text><path d="M470,234.5 L486,234.5 L504,234.49999999999997" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="505" y="219.89999999999998" width="306.7199999999999" height="67" fill="#f4f6f6"/><text x="510" y="238.7" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">1922-27</text><text x="510" y="259.7" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">German Foreign Office documents (Die</text><text x="510" y="280.7" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Grosse Politik)</text><path d="M470,272.5 L486,272.5 L504,307.5" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="505" y="292.9" width="302.01599999999996" height="67" fill="#f4f6f6"/><text x="510" y="311.7" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">1926-28</text><text x="510" y="332.7" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Barnes blames France and Russia; Fay</text><text x="510" y="353.7" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">spreads blame</text><path d="M470,510 L486,510 L504,510" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="505" y="495.4" width="298.73600000000005" height="67" fill="#f4f6f6"/><text x="510" y="514.1999999999999" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">1951</text><text x="510" y="535.1999999999999" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">French and German historians: no one</text><text x="510" y="556.1999999999999" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">government wished for war</text><path d="M470,605 L454,605 L436,605" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="169.84799999999996" y="590.4" width="265.15200000000004" height="46" fill="#f4f6f6"/><text x="430" y="609.1999999999999" font-size="16" font-weight="700" fill="#b5602e" text-anchor="end">1961</text><text x="430" y="630.1999999999999" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">Fischer: Griff nach der Weltmacht</text><path d="M470,633.5 L486,633.5 L504,633.5" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="505" y="618.9" width="258.672" height="67" fill="#f4f6f6"/><text x="510" y="637.6999999999999" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">1964</text><text x="510" y="658.6999999999999" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Historians' congress: the Fischer</text><text x="510" y="679.6999999999999" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">controversy</text><path d="M470,681 L454,681 L436,681" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="243.592" y="666.4" width="191.408" height="46" fill="#f4f6f6"/><text x="430" y="685.1999999999999" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">1969</text><text x="430" y="706.1999999999999" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">Fischer: War of Illusions</text><path d="M470,956.5 L486,956.5 L504,956.5" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="505" y="941.9" width="348.496" height="46" fill="#f4f6f6"/><text x="510" y="960.6999999999999" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">1998</text><text x="510" y="981.6999999999999" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Ferguson: Britain's entry made it a world war</text><path d="M470,1080 L486,1080 L504,1080" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="505" y="1065.4" width="347.00800000000004" height="46" fill="#f4f6f6"/><text x="510" y="1084.2" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">2011-12</text><text x="510" y="1105.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">McMeekin (Russia); Clark: The Sleepwalkers</text><path d="M470,1099 L454,1099 L436,1099" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="217.368" y="1084.4" width="217.632" height="46" fill="#f4f6f6"/><text x="430" y="1103.2" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">2013</text><text x="430" y="1124.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">Hastings: Berlin and Vienna</text><path d="M470,1099.9499999999991 L486,1099.9499999999991 L504,1132" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="505" y="1117.4" width="310.28799999999995" height="46" fill="#f4f6f6"/><text x="510" y="1136.2" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">2013</text><text x="510" y="1157.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">MacMillan: the choices of a few leaders</text><circle cx="470" cy="206" r="7" fill="#d4b02e" stroke="#1e2a44"