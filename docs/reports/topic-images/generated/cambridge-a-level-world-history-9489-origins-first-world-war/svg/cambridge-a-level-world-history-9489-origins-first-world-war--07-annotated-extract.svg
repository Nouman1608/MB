<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 615" width="900" height="615" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="615" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Annotating an extract</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">A constructed sentence, read for interpretation and approach</text>
<rect x="30" y="124" width="840" height="172" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="160" font-size="22" font-weight="400" fill="#1e2a44" text-anchor="start">"</text><rect x="57.252" y="139" width="393.442" height="31" rx="5" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><text x="60.252" y="160" font-size="22" font-weight="600" fill="#1e2a44" text-anchor="start">No capital wanted the war that came</text><text x="447.694" y="160" font-size="22" font-weight="400" fill="#1e2a44" text-anchor="start">, but</text><rect x="47" y="183" width="372.08" height="31" rx="5" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="50" y="204" font-size="22" font-weight="600" fill="#1e2a44" text-anchor="start">every capital made choices in July</text><text x="422.262" y="204" font-size="22" font-weight="400" fill="#1e2a44" text-anchor="start">that only made</text><text x="50" y="248" font-size="22" font-weight="400" fill="#1e2a44" text-anchor="start">sense if war was thinkable."</text><rect x="30" y="318" width="411" height="111" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="350" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">INTERPRETATION</text><text x="50" y="376.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Shared responsibility</text><text x="50" y="404.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Through choices, not plans</text><rect x="459" y="318" width="411" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="479" y="350" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">APPROACH</text><text x="479" y="376.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Multi-capital, decision-centred</text><text x="479" y="404.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The July crisis; close to Clark</text><rect x="30" y="451" width="411" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="483" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SUPPORT</text><text x="50" y="509.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Choices everywhere</text><text x="50" y="537.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Russian mobilisation (30 July); the Austrian</text><text x="50" y="558.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">ultimatum</text><rect x="459" y="451" width="411" height="132" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="479" y="483" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">CHALLENGE</text><text x="479" y="509.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Berlin pushed</text><text x="479" y="537.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The blank cheque and pressure on Vienna to act</text><text x="479" y="558.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">quickly (Fischer, Röhl)</text>
</svg>