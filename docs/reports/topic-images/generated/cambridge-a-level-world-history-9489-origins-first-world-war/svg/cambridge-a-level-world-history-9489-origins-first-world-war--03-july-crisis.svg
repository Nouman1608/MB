<rect width="900" height="551" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The July crisis, day by day</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Drawn to scale, 1 July to 5 August 1914</text>
<line x1="70" y1="148" x2="70" y2="382" stroke="#c9d6d4" stroke-width="1.5"/><text x="70" y="138" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">1 Jul</text><line x1="222" y1="148" x2="222" y2="382" stroke="#c9d6d4" stroke-width="1.5"/><text x="222" y="138" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">8</text><line x1="374" y1="148" x2="374" y2="382" stroke="#c9d6d4" stroke-width="1.5"/><text x="374" y="138" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">15</text><line x1="526" y1="148" x2="526" y2="382" stroke="#c9d6d4" stroke-width="1.5"/><text x="526" y="138" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">22</text><line x1="678" y1="148" x2="678" y2="382" stroke="#c9d6d4" stroke-width="1.5"/><text x="678" y="138" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">29</text><line x1="743.1428571428571" y1="148" x2="743.1428571428571" y2="382" stroke="#c9d6d4" stroke-width="1.5"/><text x="743.1428571428571" y="138" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">1 Aug</text><line x1="830" y1="148" x2="830" y2="382" stroke="#c9d6d4" stroke-width="1.5"/><text x="830" y="138" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">5</text><line x1="50" y1="266" x2="850" y2="266" stroke="#1e2a44" stroke-width="4" stroke-linecap="round"/><path d="M167.71428571428572,266 L167.71428571428572,250 L167.71428571428572,216" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="91.75428571428573" y="150" width="151.92" height="64" fill="#f4f6f6"/><text x="167.71428571428572" y="165" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">5-6 July</text><text x="167.71428571428572" y="185" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">German "blank</text><text x="167.71428571428572" y="205" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">cheque" to Vienna</text><path d="M699.7142857142857,266 L699.7142857142857,250 L699.7142857142857,216" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="633.5782857142857" y="150" width="132.272" height="64" fill="#f4f6f6"/><text x="699.7142857142857" y="165" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">30 July</text><text x="699.7142857142857" y="185" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Russian general</text><text x="699.7142857142857" y="205" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">mobilisation</text><path d="M786.5714285714286,266 L786.5714285714286,250 L815.3222857142857,216" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="773.8502857142857" y="150" width="82.944" height="64" fill="#f4f6f6"/><text x="815.3222857142857" y="165" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">3 August</text><text x="815.3222857142857" y="185" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">...and on</text><text x="815.3222857142857" y="205" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">France</text><path d="M547.7142857142858,266 L547.7142857142858,282 L484.91200000000003,316" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="408.336" y="318" width="153.152" height="64" fill="#f4f6f6"/><text x="484.91200000000003" y="333" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">23 July</text><text x="484.91200000000003" y="353" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Austrian ultimatum</text><text x="484.91200000000003" y="373" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">to Serbia</text><path d="M743.1428571428571,266 L743.1428571428571,282 L644.5600000000001,316" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="569.488" y="318" width="150.144" height="64" fill="#f4f6f6"/><text x="644.5600000000001" y="333" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">1 August</text><text x="644.5600000000001" y="353" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Germany declares</text><text x="644.5600000000001" y="373" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">war on Russia</text><path d="M808.2857142857143,266 L808.2857142857143,282 L798.816,316" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="727.6320000000001" y="318" width="142.368" height="64" fill="#f4f6f6"/><text x="798.816" y="333" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">4 August</text><text x="798.816" y="353" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Belgium invaded;</text><text x="798.816" y="373" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Britain enters</text><circle cx="167.71428571428572" cy="266" r="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><circle cx="547.7142857142858" cy="266" r="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><circle cx="699.7142857142857" cy="266" r="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><circle cx="743.1428571428571" cy="266" r="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><circle cx="786.5714285714286" cy="266" r="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><circle cx="808.2857142857143" cy="266" r="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><rect x="30" y="408" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="442.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Read the gaps</text><text x="50" y="472.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Seventeen days pass between the blank cheque and the ultimatum; after Russian mobilisation, the</text><text x="50" y="494.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">general war comes in five days.</text>
</svg>