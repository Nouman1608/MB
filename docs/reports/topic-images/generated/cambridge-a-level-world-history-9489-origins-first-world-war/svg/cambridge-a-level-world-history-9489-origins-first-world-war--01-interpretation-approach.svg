<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="620" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What Paper 3 asks you to find</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">One unattributed extract, one question, 40 marks</text>
<rect x="30" y="124" width="411" height="134" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">INTERPRETATION</text><text x="50" y="183.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">What the historian claims</text><text x="50" y="212.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The claims and conclusions you can infer from</text><text x="50" y="233.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the extract, treated as a whole</text><rect x="459" y="124" width="411" height="134" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="479" y="166.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">APPROACH</text><text x="479" y="194.1" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">What the historian brings</text><text x="479" y="223.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Their interests, questions, ideology and beliefs</text><rect x="30" y="280" width="420" height="66" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="240" y="309" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">AO4: interpretations</text><text x="240" y="333" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">20 marks</text><rect x="450" y="280" width="420" height="66" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="660" y="309" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">AO1: knowledge</text><text x="660" y="333" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">20 marks</text><rect x="30" y="368" width="840" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="400" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">TEST AGAINST THE CONTEXT, c.1890-1914</text><text x="50" y="431.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Great Power tensions, the alliance system, militarism, the arms race, Balkan instability, war plans,</text><text x="50" y="452.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Sarajevo and the July crisis, mobilisation and declarations of war</text><rect x="30" y="499" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="533.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">As a whole</text><text x="450" y="563.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Not a string of sub-messages: state the overall interpretation first.</text>
</svg>