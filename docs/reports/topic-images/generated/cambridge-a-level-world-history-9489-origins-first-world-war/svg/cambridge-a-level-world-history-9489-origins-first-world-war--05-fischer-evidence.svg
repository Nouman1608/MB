<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 542" width="900" height="542" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="542" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Testing the Fischer thesis</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">His evidence, and his critics' objections</text>
<rect x="30" y="124" width="410" height="232" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FISCHER'S EVIDENCE</text><text x="50" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Germany sought war</text><text x="50" y="211.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="211.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Government files, including in East Germany</text><text x="50" y="237.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="237.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">September Programme (1914): annexations,</text><text x="65.2" y="258.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">German-dominated central Europe</text><text x="50" y="284.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="284.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">War Council, December 1912</text><text x="50" y="310.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="310.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Domestic pressure: the rising Social</text><text x="65.2" y="331.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Democrats</text><rect x="460" y="124" width="410" height="232" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="480" y="156" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">THE OBJECTIONS</text><text x="480" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Not proven</text><text x="480" y="211.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="495.2" y="211.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Aims drawn up after war began do not prove</text><text x="495.2" y="232.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">earlier intent (Ritter)</text><text x="480" y="258.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="495.2" y="258.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Other powers' decisions studied little</text><text x="480" y="284.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="495.2" y="284.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The War Council led to no immediate plan</text><text x="480" y="310.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="495.2" y="310.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Zuber: was there a fixed Schlieffen Plan?</text><rect x="30" y="378" width="411" height="132" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="410" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">MIDDLE POSITION</text><text x="50" y="436.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Hillgruber</text><text x="50" y="464.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A "calculated risk": a localised war hoped for, a</text><text x="50" y="485.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">wider one accepted</text><rect x="459" y="378" width="411" height="132" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="479" y="410" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">REINFORCED</text><text x="479" y="436.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Röhl, Mombauer</text><text x="479" y="464.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Sources on the Kaiser and Moltke add weight to</text><text x="479" y="485.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">German decisions</text>
</svg>