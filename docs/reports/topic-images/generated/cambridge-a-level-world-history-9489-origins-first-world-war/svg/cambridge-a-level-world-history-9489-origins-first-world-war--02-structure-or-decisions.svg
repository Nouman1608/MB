<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 676" width="900" height="676" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="676" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Structure or decisions?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Long-term causes against choices in July</text>
<rect x="30" y="124" width="411" height="233" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STRUCTURAL: WAR WAS PROBABLE</text><text x="50" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The system</text><text x="50" y="211.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="211.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Alliances: Triple Alliance (1882),</text><text x="65.2" y="232.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Franco-Russian (1894), Ententes (1904, 1907)</text><text x="50" y="257.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="257.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Naval race; army laws of 1912-13</text><text x="50" y="282.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="282.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Lenin (1916): capitalist competition</text><text x="50" y="307.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="307.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Joll: "unspoken assumptions"</text><text x="50" y="332.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="332.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Taylor: mobilisation timetables</text><rect x="459" y="124" width="411" height="233" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="479" y="166.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DECISIONS: WAR WAS CHOSEN</text><text x="479" y="193.32" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The July crisis</text><text x="479" y="222.3" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="494.2" y="222.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Wilhelm II, Bethmann Hollweg, Moltke</text><text x="479" y="247.3" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="494.2" y="247.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Berchtold and Conrad</text><text x="479" y="272.3" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="494.2" y="272.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Sazonov and Nicholas II</text><text x="479" y="297.3" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="494.2" y="297.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Poincaré; Grey</text><text x="479" y="322.3" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="494.2" y="322.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">What did each know, fear and intend?</text><rect x="30" y="379" width="840" height="132" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="411" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">CRITICS OF STRUCTURE</text><text x="50" y="437.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">If war was inevitable, why did the system hold until 1914?</text><text x="50" y="465.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Anglo-German relations had improved; the powers contained the Balkan Wars of 1912-13; earlier crises</text><text x="50" y="486.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">passed without war</text><rect x="30" y="533" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="567.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">A quick route to approach</text><text x="50" y="597.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">An extract stressing structure plays down individual choice; one stressing détente before 1914</text><text x="50" y="619.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">leads towards decisions in July.</text>
</svg>