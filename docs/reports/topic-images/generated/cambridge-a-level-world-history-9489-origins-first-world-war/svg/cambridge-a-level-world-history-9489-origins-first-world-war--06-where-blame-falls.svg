<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Where historians place the blame</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">One question, many answers</text>
<line x1="310" y1="174" x2="402" y2="253.8" stroke="#1e2a44" stroke-width="2.5"/><line x1="310" y1="288" x2="402" y2="288" stroke="#1e2a44" stroke-width="2.5"/><line x1="310" y1="402" x2="402" y2="322.2" stroke="#1e2a44" stroke-width="2.5"/><line x1="590" y1="174" x2="498" y2="253.8" stroke="#1e2a44" stroke-width="2.5"/><line x1="590" y1="288" x2="498" y2="288" stroke="#1e2a44" stroke-width="2.5"/><line x1="590" y1="402" x2="498" y2="322.2" stroke="#1e2a44" stroke-width="2.5"/><circle cx="450" cy="288" r="96" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="282.8" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Who or what</text><text x="450" y="307.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">was to blame?</text><rect x="30" y="124" width="280" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="154.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Germany</text><text x="46" y="182.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Fischer; Röhl; Mombauer;</text><text x="46" y="203.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Hastings (with Vienna)</text><rect x="30" y="238" width="280" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="268.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Austria-Hungary</text><text x="46" y="296.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Williamson: its own decision for</text><text x="46" y="317.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">war</text><rect x="30" y="352" width="280" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="382.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Russia</text><text x="46" y="410.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">McMeekin (2011); Barnes, with</text><text x="46" y="431.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">France (1926)</text><rect x="590" y="124" width="280" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="606" y="154.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Britain</text><text x="606" y="182.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Ferguson (1998): entry made it a</text><text x="606" y="203.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">world war</text><rect x="590" y="238" width="280" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="606" y="268.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Shared</text><text x="606" y="296.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Fay (1928); Lloyd George:</text><text x="606" y="317.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">"slithered"; Clark (2012)</text><rect x="590" y="352" width="280" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="606" y="382.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The system or chance</text><text x="606" y="410.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Lenin; Joll; Taylor; Lebow's</text><text x="606" y="431.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">counterfactuals</text>
</svg>