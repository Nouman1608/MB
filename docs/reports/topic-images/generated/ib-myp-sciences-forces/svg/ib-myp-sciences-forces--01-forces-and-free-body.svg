<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 910" width="900" height="910" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="910" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Forces and free-body diagrams</text>

<rect x="30" y="110" width="840" height="230" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="150" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Contact forces</text><text x="60" y="172" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">act only when objects touch</text><rect x="60" y="190" width="120" height="44" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.2"/><text x="120" y="217.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">friction</text><rect x="192" y="190" width="210" height="44" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.2"/><text x="297" y="217.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">air resistance / drag</text><rect x="414" y="190" width="110" height="44" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.2"/><text x="469" y="217.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">tension</text><rect x="536" y="190" width="160" height="44" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.2"/><text x="616" y="217.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">normal force</text><rect x="708" y="190" width="120" height="44" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.2"/><text x="768" y="217.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">upthrust</text><text x="60" y="276" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="start">Non-contact forces</text><text x="260" y="276" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">act across a gap</text><rect x="60" y="292" width="230" height="40" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="175" y="317.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">gravitational (weight)</text><rect x="302" y="292" width="130" height="40" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="367" y="317.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">magnetic</text><rect x="444" y="292" width="150" height="40" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="519" y="317.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">electrostatic</text><rect x="30" y="360" width="410" height="420" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="235" y="398" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">A book resting on a table</text><rect x="70" y="540" width="330" height="20" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.5"/><rect x="90" y="560" width="14" height="110" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2"/><rect x="366" y="560" width="14" height="110" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2"/><rect x="175" y="500" width="120" height="40" rx="4" fill="#2b5a9a" stroke="#1e2a44" stroke-width="2.5"/><rect x="460" y="360" width="410" height="420" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="665" y="398" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Its free-body diagram</text><rect x="625" y="555" width="80" height="50" rx="4" fill="#fff" stroke="#1e2a44" stroke-width="3"/><line x1="665" y1="555" x2="665" y2="445" stroke="#2e6b62" stroke-width="5" marker-end="url(#ahT)"/><text x="680" y="470" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">normal force</text><text x="680" y="492" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">(table on book)</text><line x1="665" y1="605" x2="665" y2="715" stroke="#b5602e" stroke-width="5" marker-end="url(#ahR)"/><text x="680" y="690" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">weight</text><text x="680" y="712" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">(Earth on book)</text><text x="490" y="745" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">One object; only forces acting on it.</text><text x="60" y="715" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Equal arrows on the right: balanced</text><text x="60" y="736" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">forces, so the book stays at rest.</text><rect x="30" y="800" width="840" height="90" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="60" y="836" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Mass and weight:</text><text x="230" y="836" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">W = m × g.  A 60 kg astronaut weighs 588 N on Earth (g = 9.8 N/kg)</text><text x="230" y="864" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and 96 N on the Moon (g = 1.6 N/kg); her mass is 60 kg in both places.</text>
</svg>