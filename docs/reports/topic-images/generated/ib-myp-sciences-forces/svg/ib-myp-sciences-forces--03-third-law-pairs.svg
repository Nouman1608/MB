<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 790" width="900" height="790" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="790" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Newton’s third law: spot the pair</text>

<rect x="30" y="110" width="410" height="520" rx="14" fill="#fbeee6" stroke="#b5602e" stroke-width="2.5"/><text x="235" y="150" font-size="20" font-weight="700" fill="#b5602e" text-anchor="middle">✗ Not a third-law pair</text><rect x="70" y="420" width="330" height="18" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.5"/><rect x="185" y="380" width="100" height="40" rx="4" fill="#2b5a9a" stroke="#1e2a44" stroke-width="2.5"/><line x1="235" y1="380" x2="235" y2="260" stroke="#2e6b62" stroke-width="5" marker-end="url(#ahT)"/><text x="250" y="290" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">normal force on book</text><line x1="235" y1="420" x2="235" y2="540" stroke="#b5602e" stroke-width="5" marker-end="url(#ahR)"/><text x="250" y="520" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">weight of book</text><text x="60" y="580" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Both act on the same object (the book)</text><text x="60" y="600" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">and are different types of force.</text><rect x="460" y="110" width="410" height="520" rx="14" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.5"/><text x="665" y="150" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle">✓ A third-law pair</text><path d="M500,560 Q665,470 830,560 L830,600 L500,600 Z" fill="#a9c48f" stroke="#1e2a44" stroke-width="2.5"/><text x="665" y="585" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Earth</text><rect x="615" y="255" width="100" height="40" rx="4" fill="#2b5a9a" stroke="#1e2a44" stroke-width="2.5"/><line x1="665" y1="295" x2="665" y2="385" stroke="#b5602e" stroke-width="5" marker-end="url(#ahR)"/><text x="680" y="345" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">Earth pulls book</text><line x1="665" y1="510" x2="665" y2="420" stroke="#b5602e" stroke-width="5" marker-end="url(#ahR)"/><text x="680" y="470" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">book pulls Earth</text><text x="490" y="190" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Equal size, opposite direction,</text><text x="490" y="210" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">same type (gravity), on</text><text x="490" y="230" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">different objects.</text><rect x="30" y="650" width="840" height="120" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="60" y="688" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">First law:</text><text x="160" y="688" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">no resultant force → stays at rest or keeps a constant velocity.</text><text x="60" y="718" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Second law:</text><text x="175" y="718" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">a resultant force causes acceleration, F = m × a.</text><text x="60" y="748" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Third law:</text><text x="160" y="748" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A on B is equal and opposite to B on A; they never cancel.</text>
</svg>