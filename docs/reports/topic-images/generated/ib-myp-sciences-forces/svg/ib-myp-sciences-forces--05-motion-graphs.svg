<rect width="900" height="860" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Reading motion graphs</text>

<rect x="30" y="110" width="270" height="272" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="165" y="145" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Stationary</text><line x1="80" y1="310" x2="270" y2="310" stroke="#1e2a44" stroke-width="3"/><line x1="80" y1="310" x2="80" y2="180" stroke="#1e2a44" stroke-width="3"/><text x="175" y="340" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">time</text><text x="64" y="245" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle" transform="rotate(-90 64 245)">distance</text><path d="M80,240 L270,240" fill="none" stroke="#2e6b62" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><text x="165" y="366" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">horizontal line</text><rect x="315" y="110" width="270" height="272" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="145" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Constant speed</text><line x1="365" y1="310" x2="555" y2="310" stroke="#1e2a44" stroke-width="3"/><line x1="365" y1="310" x2="365" y2="180" stroke="#1e2a44" stroke-width="3"/><text x="460" y="340" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">time</text><text x="349" y="245" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle" transform="rotate(-90 349 245)">distance</text><path d="M365,305 L545,195" fill="none" stroke="#2e6b62" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><text x="450" y="366" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">straight slope: gradient = speed</text><rect x="600" y="110" width="270" height="272" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="735" y="145" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Speeding up</text><line x1="650" y1="310" x2="840" y2="310" stroke="#1e2a44" stroke-width="3"/><line x1="650" y1="310" x2="650" y2="180" stroke="#1e2a44" stroke-width="3"/><text x="745" y="340" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">time</text><text x="634" y="245" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle" transform="rotate(-90 634 245)">distance</text><path d="M650,308 Q760,300 830,190" fill="none" stroke="#2e6b62" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><text x="735" y="366" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">curve getting steeper</text><rect x="30" y="400" width="840" height="440" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="438" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Velocity-time graph: a tram</text><path d="M110,770 L238,506 L238,770 Z" fill="#b5d3cf" opacity="0.8"/><path d="M238,506 L430,506 L430,770 L238,770 Z" fill="#f2e7b8"/><path d="M430,506 L526,770 L430,770 Z" fill="#b5d3cf" opacity="0.8"/><line x1="110" y1="770" x2="558" y2="770" stroke="#1e2a44" stroke-width="3"/><line x1="110" y1="770" x2="110" y2="474" stroke="#1e2a44" stroke-width="3"/><text x="334" y="800" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">time (s)</text><text x="94" y="622" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle" transform="rotate(-90 94 622)">velocity (m/s)</text><text x="110" y="792" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">0</text><text x="238" y="792" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">4</text><text x="430" y="792" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">10</text><text x="526" y="792" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">13</text><text x="100" y="511" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="end">12</text><line x1="105" y1="506" x2="110" y2="506" stroke="#1e2a44" stroke-width="2"/><path d="M110,770 L238,506 L430,506 L526,770" fill="none" stroke="#1e2a44" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><text x="202.8" y="704" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">24 m</text><text x="334" y="660" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">72 m</text><text x="460.4" y="704" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">18 m</text><text x="192" y="572" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="end">a = 3.0</text><text x="334" y="494" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">a = 0</text><text x="466" y="572" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">a = −4.0</text><rect x="588" y="500" width="250" height="190" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="604" y="535" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">gradient = acceleration</text><text x="604" y="559" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">(a in m/s²)</text><text x="604" y="583" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">area = distance</text><text x="604" y="607" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">total = 114 m</text><text x="604" y="631" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">average speed</text><text x="604" y="655" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">= 114 ÷ 13 = 8.77 m/s</text>
</svg>