<rect width="900" height="870" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Reading motion graphs</text>

<rect x="30" y="110" width="270" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="165" y="145" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Stationary</text><line x1="80" y1="310" x2="270" y2="310" stroke="#1e2a44" stroke-width="3"/><line x1="80" y1="310" x2="80" y2="180" stroke="#1e2a44" stroke-width="3"/><text x="175" y="340" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">time</text><text x="64" y="245" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle" transform="rotate(-90 64 245)">distance</text><path d="M80,240 L270,240" fill="none" stroke="#2e6b62" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><text x="165" y="350" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">horizontal line</text><rect x="315" y="110" width="270" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="145" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Constant speed</text><line x1="365" y1="310" x2="555" y2="310" stroke="#1e2a44" stroke-width="3"/><line x1="365" y1="310" x2="365" y2="180" stroke="#1e2a44" stroke-width="3"/><text x="460" y="340" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">time</text><text x="349" y="245" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle" transform="rotate(-90 349 245)">distance</text><path d="M365,305 L545,195" fill="none" stroke="#2e6b62" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><text x="450" y="350" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">straight slope: gradient = speed</text><rect x="600" y="110" width="270" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="735" y="145" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Speeding up</text><line x1="650" y1="310" x2="840" y2="310" stroke="#1e2a44" stroke-width="3"/><line x1="650" y1="310" x2="650" y2="180" stroke="#1e2a44" stroke-width="3"/><text x="745" y="340" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">time</text><text x="634" y="245" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle" transform="rotate(-90 634 245)">distance</text><path d="M650,308 Q760,300 830,190" fill="none" stroke="#2e6b62" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><text x="735" y="350" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">curve getting steeper</text><rect x="30" y="380" width="840" height="470" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="418" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Velocity-time graph: a tram</text><path d="M110,740 L278,476 L278,740 Z" fill="#b5d3cf" opacity="0.8"/><path d="M278,476 L530,476 L530,740 L278,740 Z" fill="#f2e7b8"/><path d="M530,476 L656,740 L530,740 Z" fill="#b5d3cf" opacity="0.8"/><line x1="110" y1="740" x2="698" y2="740" stroke="#1e2a44" stroke-width="3"/><line x1="110" y1="740" x2="110" y2="444" stroke="#1e2a44" stroke-width="3"/><text x="404" y="770" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">time (s)</text><text x="94" y="592" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle" transform="rotate(-90 94 592)">velocity (m/s)</text><text x="110" y="762" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">0</text><text x="278" y="762" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">4</text><text x="530" y="762" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">10</text><text x="656" y="762" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">13</text><text x="100" y="481" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="end">12</text><line x1="105" y1="476" x2="110" y2="476" stroke="#1e2a44" stroke-width="2"/><path d="M110,740 L278,476 L530,476 L656,740" fill="none" stroke="#1e2a44" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><text x="231.8" y="674" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">24 m</text><text x="404" y="630" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">72 m</text><text x="569.9" y="674" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">18 m</text><text x="180" y="586" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="end">a = 3.0</text><text x="404" y="464" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">a = 0</text><text x="609" y="586" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">a = −4.0 m/s²</text><rect x="728" y="470" width="220" height="190" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="744" y="505" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">gradient = acceleration</text><text x="744" y="529" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">area = distance</text><text x="744" y="553" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start"></text><text x="744" y="577" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">total = 114 m</text><text x="744" y="601" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">average speed</text><text x="744" y="625" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">= 114 ÷ 13 = 8.77 m/s</text>
</svg>