<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="700" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Resultant force</text>

<rect x="30" y="110" width="840" height="260" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="150" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Boat</text><path d="M390,220 L510,220 L490,252 L400,252 Z" fill="#fff" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><line x1="380" y1="240" x2="520" y2="240" stroke="#2e6b62" stroke-width="2" stroke-dasharray="6 5"/><line x1="510" y1="230" x2="810" y2="230" stroke="#2e6b62" stroke-width="7" marker-end="url(#ahT)"/><text x="660" y="266" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">engine 850 N</text><line x1="390" y1="230" x2="277.05882352941177" y2="230" stroke="#b5602e" stroke-width="7" marker-end="url(#ahR)"/><text x="380" y="266" font-size="17" font-weight="700" fill="#b5602e" text-anchor="end">water resistance 320 N</text><rect x="60" y="290" width="780" height="62" rx="10" fill="#f2e7b8"/><text x="80" y="315" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Resultant = 850 − 320 = 530 N forward</text><rect x="30" y="390" width="840" height="260" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="430" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Car of mass 1200 kg</text><rect x="390" y="488" width="120" height="36" rx="8" fill="#fff" stroke="#1e2a44" stroke-width="3"/><path d="M415,488 L430,468 L475,468 L490,488" fill="#fff" stroke="#1e2a44" stroke-width="3"/><circle cx="418" cy="528" r="12" fill="#1e2a44"/><circle cx="482" cy="528" r="12" fill="#1e2a44"/><line x1="510" y1="510" x2="810" y2="510" stroke="#2e6b62" stroke-width="7" marker-end="url(#ahT)"/><text x="660" y="546" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">driving 3000 N</text><line x1="390" y1="510" x2="330" y2="510" stroke="#b5602e" stroke-width="7" marker-end="url(#ahR)"/><text x="380" y="546" font-size="17" font-weight="700" fill="#b5602e" text-anchor="end">friction + air 600 N</text><rect x="60" y="570" width="780" height="62" rx="10" fill="#f2e7b8"/><text x="80" y="595" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Resultant = 3000 − 600 = 2400 N forward</text><text x="80" y="620" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="start">F = ma, so a = 2400 ÷ 1200 = 2.0 m/s²  (use the resultant, not 3000 N)</text><text x="450" y="680" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Arrow lengths are drawn to scale within each diagram.</text>
</svg>