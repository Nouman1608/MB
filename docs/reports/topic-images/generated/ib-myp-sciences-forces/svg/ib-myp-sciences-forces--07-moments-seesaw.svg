<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 750" width="900" height="750" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="750" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Balancing a seesaw</text>

<rect x="30" y="110" width="840" height="400" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M410,440 L490,440 L450,338 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><rect x="82" y="322" width="736" height="16" rx="4" fill="#c79a62" stroke="#1e2a44" stroke-width="2.5"/><circle cx="130" cy="270" r="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><rect x="114" y="284" width="32" height="38" rx="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="690" cy="270" r="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><rect x="674" y="284" width="32" height="38" rx="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><line x1="130" y1="338" x2="130" y2="430" stroke="#b5602e" stroke-width="5" marker-end="url(#ahR)"/><text x="142" y="420" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">300 N</text><line x1="690" y1="338" x2="690" y2="450" stroke="#b5602e" stroke-width="5" marker-end="url(#ahR)"/><text x="702" y="440" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">400 N</text><line x1="130" y1="230" x2="450" y2="230" stroke="#1e2a44" stroke-width="2.5" marker-start="url(#ah)" marker-end="url(#ah)"/><text x="290" y="218" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">2.0 m</text><line x1="450" y1="230" x2="690" y2="230" stroke="#1e2a44" stroke-width="2.5" marker-start="url(#ah)" marker-end="url(#ah)"/><text x="570" y="218" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">d = 1.5 m</text><line x1="450" y1="200" x2="450" y2="330" stroke="#4a5568" stroke-width="2" stroke-dasharray="5 5"/><text x="450" y="465" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">pivot</text><path d="M340,280 Q300,330 340,380" fill="none" stroke="#2e6b62" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahT)"/><text x="300" y="410" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">anticlockwise</text><path d="M560,280 Q600,330 560,380" fill="none" stroke="#8a6d0d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahO)"/><text x="600" y="410" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">clockwise</text><rect x="30" y="530" width="840" height="200" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="60" y="568" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Principle of moments (in balance):</text><text x="60" y="600" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">total anticlockwise moment = total clockwise moment</text><text x="60" y="644" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">300 × 2.0 = 400 × d</text><text x="60" y="684" font-size="22" font-weight="700" fill="#2e6b62" text-anchor="start">600 = 400d   →   d = 1.5 m</text><text x="520" y="644" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">moment = F × d</text><text x="520" y="666" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">(d at right angles to the</text><text x="520" y="688" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">force, from the pivot)</text>
</svg>