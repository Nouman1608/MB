<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 860" width="900" height="860" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="860" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Pressure: force spread over area</text>

<rect x="30" y="110" width="410" height="380" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="460" y="110" width="410" height="380" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="235" y="148" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Boots</text><text x="665" y="148" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Snowshoes</text><rect x="50" y="320" width="370" height="70" fill="#eef4f7" stroke="#c9d6d4" stroke-width="2"/><rect x="480" y="320" width="370" height="70" fill="#eef4f7" stroke="#c9d6d4" stroke-width="2"/><rect x="205" y="290" width="60" height="44" rx="8" fill="#8a6d0d" stroke="#1e2a44" stroke-width="2.5"/><path d="M205,334 L265,334 L262,350 L208,350 Z" fill="#ccd8de" stroke="#1e2a44" stroke-width="0" stroke-linejoin="round" stroke-linecap="round" /><ellipse cx="665" cy="312" rx="130" ry="14" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.5"/><rect x="635" y="270" width="60" height="40" rx="8" fill="#8a6d0d" stroke="#1e2a44" stroke-width="2.5"/><line x1="235" y1="180" x2="235" y2="282" stroke="#b5602e" stroke-width="5" marker-end="url(#ahR)"/><text x="250" y="210" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">600 N</text><line x1="665" y1="180" x2="665" y2="262" stroke="#b5602e" stroke-width="5" marker-end="url(#ahR)"/><text x="680" y="210" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">600 N</text><text x="235" y="420" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">p = 600 ÷ 0.030</text><text x="235" y="452" font-size="22" font-weight="700" fill="#b5602e" text-anchor="middle">= 20 000 Pa</text><text x="665" y="420" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">p = 600 ÷ 0.24</text><text x="665" y="452" font-size="22" font-weight="700" fill="#2e6b62" text-anchor="middle">= 2 500 Pa</text><text x="235" y="382" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">area 0.030 m²: sinks</text><text x="665" y="382" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">area 0.24 m²: 8× less pressure</text><rect x="30" y="510" width="840" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="548" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Pressure in a liquid rises with depth</text><rect x="70" y="590" width="330" height="220" fill="#b5d3cf"/><line x1="70" y1="590" x2="400" y2="590" stroke="#2e6b62" stroke-width="2.5"/><path d="M400,570 L450,570 L540,810 L400,810 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><text x="470" y="760" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">dam</text><line x1="370" y1="610" x2="396" y2="610" stroke="#2b5a9a" stroke-width="3" marker-end="url(#ah)"/><line x1="345" y1="660" x2="396" y2="660" stroke="#2b5a9a" stroke-width="3" marker-end="url(#ah)"/><line x1="320" y1="710" x2="396" y2="710" stroke="#2b5a9a" stroke-width="3" marker-end="url(#ah)"/><line x1="295" y1="760" x2="396" y2="760" stroke="#2b5a9a" stroke-width="3" marker-end="url(#ah)"/><line x1="275" y1="800" x2="396" y2="800" stroke="#2b5a9a" stroke-width="3" marker-end="url(#ah)"/><text x="90" y="620" font-size="15" font-weight="700" fill="#fff" text-anchor="start">longer arrows: more pressure</text><text x="570" y="600" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">p = h × ρ × g</text><text x="570" y="624" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start"></text><text x="570" y="648" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">At 5.0 m in fresh water:</text><text x="570" y="672" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">5.0 × 1000 × 9.8</text><text x="570" y="696" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">= 49 000 Pa</text><text x="570" y="720" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start"></text><text x="570" y="744" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">So dam walls are thicker</text><text x="570" y="768" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">at the bottom.</text>
</svg>