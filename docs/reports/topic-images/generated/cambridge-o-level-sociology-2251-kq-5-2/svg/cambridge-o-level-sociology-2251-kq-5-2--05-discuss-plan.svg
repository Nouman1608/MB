<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 538" width="900" height="538" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="538" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Plan: discuss the Marxist view of education</text>

<rect x="30" y="104" width="190" height="50" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="125" y="136" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Set out the view</text><rect x="234" y="104" width="636" height="50" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="250" y="133.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Education serves the ruling class by reproducing class position.</text><rect x="30" y="166" width="190" height="72" rx="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="125" y="209" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Mechanism 1</text><rect x="234" y="166" width="636" height="72" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="250" y="195.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Correspondence principle and hidden curriculum (Bowles and Gintis,</text><text x="250" y="217.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">1976).</text><rect x="30" y="250" width="190" height="50" rx="14" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="125" y="282" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Mechanism 2</text><rect x="234" y="250" width="636" height="50" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="250" y="279.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Cultural capital rewarded as ability (Bourdieu).</text><rect x="30" y="312" width="190" height="50" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="125" y="344" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Mechanism 3</text><rect x="234" y="312" width="636" height="50" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="250" y="341.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Material factors such as digital access, and setting by ability.</text><rect x="30" y="374" width="190" height="72" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="125" y="417" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Evaluation</text><rect x="234" y="374" width="636" height="72" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="250" y="403.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Willis shows active resistance; functionalists point to mobility;</text><text x="250" y="425.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">feminists say class is not the only inequality.</text><rect x="30" y="458" width="190" height="50" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="125" y="490" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Mini-conclusion</text><rect x="234" y="458" width="636" height="50" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="250" y="487.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Explains persistent gaps but overstates pupils’ passivity.</text>
</svg>