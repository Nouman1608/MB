<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 456" width="900" height="456" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="456" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Strengths and limitations of the three views</text>

<rect x="30" y="104" width="160" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="42" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">View</text><rect x="190" y="104" width="320" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="202" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Strengths</text><rect x="510" y="104" width="360" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="522" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Limitations</text><rect x="30" y="150" width="160" height="85" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="175.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Functionalist</text><rect x="190" y="150" width="320" height="85" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="202" y="175.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Explains mass education; links</text><text x="202" y="196.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">schools to the economy;</text><text x="202" y="217.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">qualifications open doors</text><rect x="510" y="150" width="360" height="85" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="522" y="175.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Class, ethnic and gender gaps persist;</text><text x="522" y="196.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Tumin (1953): Davis and Moore’s argument</text><text x="522" y="217.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">is circular; ignores conflict</text><rect x="30" y="235" width="160" height="85" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="260.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Marxist</text><rect x="190" y="235" width="320" height="85" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="202" y="260.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Explains persistent class gaps;</text><text x="202" y="281.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">highlights money and culture; shows</text><text x="202" y="302.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">how inequality looks fair</text><rect x="510" y="235" width="360" height="85" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="522" y="260.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Assumes passive pupils (Willis shows</text><text x="522" y="281.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">resistance); many working-class pupils</text><text x="522" y="302.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">succeed; little on gender or ethnicity</text><rect x="30" y="320" width="160" height="106" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="345.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Feminist</text><rect x="190" y="320" width="320" height="106" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="202" y="345.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Explains gendered subject choice;</text><text x="202" y="366.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">girls’ access globally; links</text><text x="202" y="387.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">schooling to patriarchy</text><rect x="510" y="320" width="360" height="106" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="522" y="345.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Girls now outperform boys in many</text><text x="522" y="366.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">countries; may ignore class and</text><text x="522" y="387.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">ethnicity; real progress through</text><text x="522" y="408.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">equal-opportunity policies</text>
</svg>