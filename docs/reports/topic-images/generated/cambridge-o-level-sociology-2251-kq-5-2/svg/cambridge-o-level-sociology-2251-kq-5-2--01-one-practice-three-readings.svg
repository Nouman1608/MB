<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 508" width="900" height="508" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="508" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">One school practice, three readings</text>

<rect x="30" y="104" width="170" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="42" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Practice</text><rect x="200" y="104" width="220" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="212" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Functionalist</text><rect x="420" y="104" width="240" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="432" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Marxist</text><rect x="660" y="104" width="210" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="672" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Feminist</text><rect x="30" y="150" width="170" height="82" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="174.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Socialisation</text><text x="42" y="194.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">and social</text><text x="42" y="214.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">control</text><rect x="200" y="150" width="220" height="82" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="212" y="174.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Shared values and social</text><text x="212" y="194.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">solidarity; preparing to</text><text x="212" y="214.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">obey laws</text><rect x="420" y="150" width="240" height="82" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="432" y="174.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Ideological control:</text><text x="432" y="194.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">inequality made to seem</text><text x="432" y="214.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">natural</text><rect x="660" y="150" width="210" height="82" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="672" y="174.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Pupils learn that</text><text x="672" y="194.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">authority is male</text><rect x="30" y="232" width="170" height="102" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="256.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Curriculum</text><rect x="200" y="232" width="220" height="102" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="212" y="256.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Skills the economy needs;</text><text x="212" y="276.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">vocationalism</text><rect x="420" y="232" width="240" height="102" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="432" y="256.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Hidden curriculum mirrors</text><text x="432" y="276.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">work; official curriculum</text><text x="432" y="296.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">rewards middle-class</text><text x="432" y="316.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">culture</text><rect x="660" y="232" width="210" height="102" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="672" y="256.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Gendered curriculum:</text><text x="672" y="276.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">science presented as</text><text x="672" y="296.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">masculine</text><rect x="30" y="334" width="170" height="82" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="358.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Setting by</text><text x="42" y="378.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">ability</text><rect x="200" y="334" width="220" height="82" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="212" y="358.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Teaching matched to</text><text x="212" y="378.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">ability, so talent</text><text x="212" y="398.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">develops</text><rect x="420" y="334" width="240" height="82" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="432" y="358.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Working-class pupils placed</text><text x="432" y="378.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">in lower sets and taught</text><text x="432" y="398.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">less</text><rect x="660" y="334" width="210" height="82" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="672" y="358.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Not in the syllabus list</text><text x="672" y="378.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">for this view</text><rect x="30" y="416" width="170" height="62" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="440.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Testing and</text><text x="42" y="460.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">meritocracy</text><rect x="200" y="416" width="220" height="62" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="212" y="440.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Standardised tests fairly</text><text x="212" y="460.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">measure merit</text><rect x="420" y="416" width="240" height="62" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="432" y="440.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">The myth of meritocracy:</text><text x="432" y="460.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">failure looks personal</text><rect x="660" y="416" width="210" height="62" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="672" y="440.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Teacher expectations</text><text x="672" y="460.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">shape results</text>
</svg>