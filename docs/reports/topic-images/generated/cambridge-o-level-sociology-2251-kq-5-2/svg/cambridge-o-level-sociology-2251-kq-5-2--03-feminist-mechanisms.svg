<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 581" width="900" height="581" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="581" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How education can perpetuate gender inequality</text>

<rect x="30" y="104" width="270.6666666666667" height="153" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="138.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Male power and</text><text x="50" y="162.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">hierarchy</text><text x="50" y="190.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Men more likely in senior</text><text x="50" y="211.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">posts; women teach younger</text><text x="50" y="232.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">children</text><rect x="314.6666666666667" y="104" width="270.6666666666667" height="153" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="334.6666666666667" y="138.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Role models</text><text x="334.6666666666667" y="166.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Few women teaching science</text><text x="334.6666666666667" y="187.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">or leading schools</text><rect x="599.3333333333334" y="104" width="270.6666666666667" height="153" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="619.3333333333334" y="138.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Access to education</text><text x="619.3333333333334" y="166.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Girls kept out by poverty,</text><text x="619.3333333333334" y="187.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">early marriage, distance or</text><text x="619.3333333333334" y="208.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">law; Malala Yousafzai,</text><text x="619.3333333333334" y="229.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Nobel Peace Prize 2014</text><rect x="30" y="271" width="270.6666666666667" height="150" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="305.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Gendered curriculum</text><text x="50" y="333.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Kelly (1987): science</text><text x="50" y="354.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">presented as masculine</text><rect x="314.6666666666667" y="271" width="270.6666666666667" height="150" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="334.6666666666667" y="305.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Teacher expectations</text><text x="334.6666666666667" y="333.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Stanworth (1983): less</text><text x="334.6666666666667" y="354.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">expected of girls; Spender</text><text x="334.6666666666667" y="375.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(1982): boys get more</text><text x="334.6666666666667" y="396.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">attention</text><rect x="599.3333333333334" y="271" width="270.6666666666667" height="150" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="619.3333333333334" y="305.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Peer groups</text><text x="619.3333333333334" y="333.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Lees: girls controlled</text><text x="619.3333333333334" y="354.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">through insults about</text><text x="619.3333333333334" y="375.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">reputation; boys mocked for</text><text x="619.3333333333334" y="396.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">working hard</text><rect x="30" y="439" width="840" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="475" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">A key limitation</text><text x="50" y="504.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">In many countries girls now outperform boys, which suggests schools no longer simply</text><text x="50" y="526.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">disadvantage girls.</text>
</svg>