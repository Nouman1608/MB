<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 549" width="900" height="549" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="549" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How education reproduces class inequality</text>

<line x1="320" y1="176.5" x2="365" y2="264.25" stroke="#1e2a44" stroke-width="2.5"/><line x1="320" y1="311.5" x2="365" y2="311.5" stroke="#1e2a44" stroke-width="2.5"/><line x1="320" y1="446.5" x2="365" y2="358.75" stroke="#1e2a44" stroke-width="2.5"/><line x1="580" y1="164.5" x2="535" y2="260.05" stroke="#1e2a44" stroke-width="2.5"/><line x1="580" y1="299.5" x2="535" y2="307.3" stroke="#1e2a44" stroke-width="2.5"/><line x1="580" y1="446.5" x2="535" y2="358.75" stroke="#1e2a44" stroke-width="2.5"/><circle cx="450" cy="311.5" r="100" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="296" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Reproduction of</text><text x="450" y="318.5" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">class</text><text x="450" y="341" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">inequality</text><g transform="translate(0,12)"><rect x="30" y="104" width="290" height="121" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="134.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Ideological control</text><text x="46" y="162.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Althusser (1971): an</text><text x="46" y="183.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">ideological state apparatus</text><text x="46" y="204.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">spreading ruling-class ideas</text><rect x="30" y="239" width="290" height="121" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="269.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Cultural capital</text><text x="46" y="297.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Bourdieu: middle-class</text><text x="46" y="318.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">language, tastes and knowledge</text><text x="46" y="339.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">rewarded as if natural ability</text><rect x="30" y="374" width="290" height="121" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="404.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Myth of meritocracy</text><text x="46" y="432.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Bowles and Gintis: failure</text><text x="46" y="453.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">presented as personal, so</text><text x="46" y="474.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">pupils blame themselves</text></g><g transform="translate(0,0)"><rect x="580" y="104" width="290" height="121" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="596" y="134.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Material factors</text><text x="596" y="162.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Devices, internet, study space,</text><text x="596" y="183.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">tuition depend on income;</text><text x="596" y="204.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">school closures widened gaps</text><rect x="580" y="239" width="290" height="121" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="596" y="269.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Setting by ability</text><text x="596" y="297.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Working-class pupils more often</text><text x="596" y="318.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">in lower sets and lower-level</text><text x="596" y="339.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">exams</text><rect x="580" y="374" width="290" height="145" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="596" y="404.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Resistance: Willis</text><text x="596" y="428.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">(1977)</text><text x="596" y="456.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Twelve “lads” formed a</text><text x="596" y="477.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">counter-school culture and</text><text x="596" y="498.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">moved into manual jobs</text></g>
</svg>