<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 590" width="900" height="590" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="590" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Toolkit, exploration and shared objectives</text>

<text x="46" y="140" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">The 30 hours at both SL and HL</text><rect x="50" y="158" width="400" height="64" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><defs><pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#d4b02e"/><line x1="0" y1="0" x2="0" y2="12" stroke="#f2e7b8" stroke-width="5"/></pattern></defs><rect x="450" y="158" width="400" height="64" fill="url(#hatch)" stroke="#1e2a44" stroke-width="2"/><text x="250" y="197" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">toolkit</text><rect x="560" y="174" width="180" height="32" rx="8" fill="#fff" stroke="#8a6d0d" stroke-width="2"/><text x="650" y="196" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">up to 15 h</text><rect x="30" y="246" width="410" height="166" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="280" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Toolkit</text><text x="50" y="308" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">time within the taught hours for</text><text x="50" y="330" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">inquiry, modelling and technology</text><text x="50" y="352" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">skills that transfer across strands,</text><text x="50" y="374" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">not tied to one strand</text><rect x="460" y="246" width="410" height="166" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="480" y="280" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Exploration</text><text x="850" y="280" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="end">20% SL · 20% HL</text><text x="480" y="308" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">internally assessed investigation,</text><text x="480" y="330" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">compulsory at both levels, into an</text><text x="480" y="352" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">area of mathematics you choose</text><text x="480" y="382" font-size="15" font-weight="600" fill="#8a6d0d" text-anchor="start">A real dataset or context is a natural</text><text x="480" y="401" font-size="15" font-weight="600" fill="#8a6d0d" text-anchor="start">choice, but not a requirement.</text><text x="450" y="446" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Six assessment objectives apply across every strand</text><rect x="30" y="464" width="255" height="40" rx="9" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="157.5" y="489.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">knowledge and understanding</text><rect x="300" y="464" width="245" height="40" rx="9" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="422.5" y="489.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">problem solving</text><rect x="560" y="464" width="310" height="40" rx="9" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="715" y="489.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">communication and interpretation</text><rect x="30" y="514" width="255" height="40" rx="9" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="157.5" y="539.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">technology</text><rect x="300" y="514" width="245" height="40" rx="9" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="422.5" y="539.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">reasoning</text><rect x="560" y="514" width="310" height="40" rx="9" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="715" y="539.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">inquiry approaches</text>
</svg>