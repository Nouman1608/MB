<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Two ways to organise</text>

<text x="215" y="108" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Point-by-point</text><text x="685" y="108" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Block</text><text x="40" y="156" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start" xml:space="preserve">cost</text><rect x="110" y="130" width="140" height="40" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="2" /><text x="180" y="156" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">A: cost</text><rect x="260" y="130" width="140" height="40" rx="8" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2" /><text x="330" y="156" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">B: cost</text><text x="40" y="208" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start" xml:space="preserve">time</text><rect x="110" y="182" width="140" height="40" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="2" /><text x="180" y="208" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">A: time</text><rect x="260" y="182" width="140" height="40" rx="8" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2" /><text x="330" y="208" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">B: time</text><text x="40" y="260" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start" xml:space="preserve">safety</text><rect x="110" y="234" width="140" height="40" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="2" /><text x="180" y="260" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">A: safety</text><rect x="260" y="234" width="140" height="40" rx="8" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2" /><text x="330" y="260" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">B: safety</text><text x="510" y="180" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start" xml:space="preserve">all of A</text><rect x="590" y="130" width="260" height="70" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="2" /><text x="720" y="156" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">A: cost · time · safety</text><text x="720" y="182" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" xml:space="preserve">same categories, same order</text><text x="510" y="262" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start" xml:space="preserve">all of B</text><rect x="590" y="212" width="260" height="70" rx="8" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2" /><text x="720" y="238" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">B: cost · time · safety</text><text x="720" y="264" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" xml:space="preserve">same categories, same order</text><rect x="30" y="306" width="405" height="141.60000000000002" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="48" y="340" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Best for</text><text x="48" y="367.15" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">close comparison on a few categories</text><text x="48" y="386.95" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700" fill="#b5602e">Risk:</tspan> choppy with many categories</text><text x="48" y="406.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700" fill="#2e6b62">Tip:</tspan> transitions that name the category</text><rect x="465" y="306" width="405" height="141.60000000000002" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="483" y="340" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Best for</text><text x="483" y="367.15" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">complex objects needing description first</text><text x="483" y="386.95" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700" fill="#b5602e">Risk:</tspan> reader forgets the first block; categories</text><text x="483" y="406.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">drift</text><text x="483" y="426.54999999999995" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700" fill="#2e6b62">Tip:</tspan> repeat the categories in the same order</text>
