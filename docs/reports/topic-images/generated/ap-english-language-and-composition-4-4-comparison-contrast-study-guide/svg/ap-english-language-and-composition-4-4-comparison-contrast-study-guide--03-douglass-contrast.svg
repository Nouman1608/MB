<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 562" width="900" height="562" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="562" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">One category, two sides</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Douglass, Rochester, 5 July 1852</text>
<rect x="30" y="122" width="840" height="88.80000000000001" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="450" y="159" font-size="20" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">“The sunlight that brought life and healing to you, has brought stripes and death</text><text x="450" y="185.4" font-size="20" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">to me.”</text><rect x="300" y="232" width="300" height="96" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="3" /><text x="450" y="266" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Category</text><text x="450" y="294" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">the effect of the nation’s freedom</text><text x="450" y="315.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">on each</text><rect x="30" y="372" width="380" height="100" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="220" y="412.92" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">“you” (his white audience)</text><text x="220" y="442.62" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve"><tspan font-weight="700">life</tspan> <tspan font-weight="700">and</tspan> <tspan font-weight="700">healing</tspan></text><rect x="490" y="372" width="380" height="100" rx="14" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5" /><text x="680" y="412.92" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">“me” (the enslaved)</text><text x="680" y="442.62" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve"><tspan font-weight="700">stripes</tspan> <tspan font-weight="700">and</tspan> <tspan font-weight="700">death</tspan></text><line x1="400" y1="330" x2="260" y2="366" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="500" y1="330" x2="640" y2="366" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="450" y="428" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">⟷</text><text x="450" y="512" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" xml:space="preserve">Parallel structure: each side matches in grammar and in the kind of thing compared (effects on bodies).</text>
</svg>