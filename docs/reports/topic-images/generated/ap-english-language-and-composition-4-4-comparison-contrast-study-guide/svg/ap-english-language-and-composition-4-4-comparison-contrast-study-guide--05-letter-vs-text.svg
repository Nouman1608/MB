<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 572" width="900" height="572" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="572" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What a comparison does</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Worked example 2: a letter and a text message</text>
<rect x="200" y="122" width="500" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="450" y="156.24" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Shared feature</text><text x="450" y="184.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">“A letter and a text message both carry news.”</text><line x1="450" y1="208" x2="450" y2="230" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="450" y="258" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Difference on one category: timing of revision</text><rect x="30" y="272" width="400" height="96" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="230" y="306" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Letter</text><text x="230" y="334" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">takes days, cannot be unsent → <tspan font-weight="700">edits</tspan> <tspan font-weight="700">in</tspan></text><text x="230" y="355.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve"><tspan font-weight="700">advance</tspan></text><rect x="470" y="272" width="400" height="96" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="670" y="306" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Text message</text><text x="670" y="334" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">a correction can follow in seconds → <tspan font-weight="700">edits</tspan></text><text x="670" y="355.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve"><tspan font-weight="700">afterwards</tspan></text><line x1="450" y1="374" x2="450" y2="404" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="200" y="410" width="500" height="84" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="3" /><text x="450" y="444.24" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Conclusion about style</text><text x="450" y="472.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">letters read like speeches; texts read like conversations</text><text x="450" y="530" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" xml:space="preserve">The writer never slips from timing to length or formality, which would blur the point.</text>
</svg>