<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">From comparison to claim</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Worked example 1: bus lane or cycle track (invented figures)</text>
<text x="30" y="140" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Cost to build, per km</text><text x="30" y="174" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" xml:space="preserve">Bus lane</text><rect x="160" y="156" width="509.09090909090907" height="26" rx="4" fill="#dce9e7" stroke="#2e6b62" stroke-width="2" /><text x="679.090909090909" y="175" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">£2.0m</text><text x="30" y="208" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" xml:space="preserve">Cycle track</text><rect x="160" y="190" width="152.72727272727272" height="26" rx="4" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2" /><text x="322.72727272727275" y="209" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">£0.6m</text><text x="30" y="258" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Peak capacity, people per hour</text><text x="30" y="292" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" xml:space="preserve">Bus lane</text><rect x="160" y="274" width="407.2727272727273" height="26" rx="4" fill="#dce9e7" stroke="#2e6b62" stroke-width="2" /><text x="577.2727272727273" y="293" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">4,000</text><text x="30" y="326" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" xml:space="preserve">Cycle track</text><rect x="160" y="308" width="509.09090909090907" height="26" rx="4" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2" /><text x="679.090909090909" y="327" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">5,000</text><text x="30" y="376" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Injuries per year after opening</text><text x="30" y="410" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" xml:space="preserve">Bus lane</text><rect x="160" y="392" width="480" height="26" rx="4" fill="#dce9e7" stroke="#2e6b62" stroke-width="2" /><text x="650" y="411" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">6</text><text x="30" y="444" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" xml:space="preserve">Cycle track</text><rect x="160" y="426" width="160" height="26" rx="4" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2" /><text x="330" y="445" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">2</text><rect x="30" y="476" width="840" height="104.63999999999999" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="3" /><text x="48" y="510" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Commentary turns the rows into a claim</text><text x="48" y="538" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“A town that can move more people for less money has a straightforward case; the injury figures, 2 a</text><text x="48" y="559.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">year against 6, only strengthen it.”</text>
