<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 434" width="900" height="434" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="434" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Rate your own comparison</text>

<rect x="30" y="96" width="840" height="41.8" fill="#dce9e7"/><text x="42" y="120.3" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Criterion</text><text x="192" y="120.3" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Not yet</text><text x="422" y="120.3" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Getting there</text><text x="652" y="120.3" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Secure</text><rect x="30" y="137.8" width="840" height="61.6" fill="#ffffff"/><text x="42" y="162.10000000000002" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Category</text><rect x="180" y="137.8" width="230" height="61.6" fill="#fbf3ee"/><text x="192" y="162.10000000000002" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">No clear category; features</text><text x="192" y="181.90000000000003" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">chosen at random</text><rect x="410" y="137.8" width="230" height="61.6" fill="#fbf7e6"/><text x="422" y="162.10000000000002" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">Present but not named</text><rect x="640" y="137.8" width="230" height="61.6" fill="#dce9e7"/><text x="652" y="162.10000000000002" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">Named and relevant to the</text><text x="652" y="181.90000000000003" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">claim</text><line x1="30" y1="137.8" x2="870" y2="137.8" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="199.4" width="840" height="61.6" fill="#ffffff"/><text x="42" y="223.70000000000002" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Like categories</text><rect x="180" y="199.4" width="230" height="61.6" fill="#fbf3ee"/><text x="192" y="223.70000000000002" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">Objects measured on</text><text x="192" y="243.50000000000003" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">different features</text><rect x="410" y="199.4" width="230" height="61.6" fill="#fbf7e6"/><text x="422" y="223.70000000000002" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">Mostly the same feature,</text><text x="422" y="243.50000000000003" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">with a slip</text><rect x="640" y="199.4" width="230" height="61.6" fill="#dce9e7"/><text x="652" y="223.70000000000002" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">Same feature throughout</text><line x1="30" y1="199.4" x2="870" y2="199.4" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="261" width="840" height="81.4" fill="#ffffff"/><text x="42" y="285.3" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Organisation</text><rect x="180" y="261" width="230" height="81.4" fill="#fbf3ee"/><text x="192" y="285.3" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">Mixed order; the reader</text><text x="192" y="305.1" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">hunts for pairs</text><rect x="410" y="261" width="230" height="81.4" fill="#fbf7e6"/><text x="422" y="285.3" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">Mostly point-by-point or</text><text x="422" y="305.1" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">block, with drift</text><rect x="640" y="261" width="230" height="81.4" fill="#dce9e7"/><text x="652" y="285.3" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">Consistent pattern;</text><text x="652" y="305.1" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">transitions name the</text><text x="652" y="324.90000000000003" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">category</text><line x1="30" y1="261" x2="870" y2="261" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="342.4" width="840" height="61.6" fill="#ffffff"/><text x="42" y="366.7" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Claim</text><rect x="180" y="342.4" width="230" height="61.6" fill="#fbf3ee"/><text x="192" y="366.7" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">Ends as a list</text><rect x="410" y="342.4" width="230" height="61.6" fill="#fbf7e6"/><text x="422" y="366.7" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">A claim not tied to the</text><text x="422" y="386.5" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">evidence</text><rect x="640" y="342.4" width="230" height="61.6" fill="#dce9e7"/><text x="652" y="366.7" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">States what the comparison</text><text x="652" y="386.5" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">proves</text><line x1="30" y1="342.4" x2="870" y2="342.4" stroke="#c9d6d4" stroke-width="1.5"/><line x1="180" y1="96" x2="180" y2="404" stroke="#c9d6d4" stroke-width="1.5"/><line x1="410" y1="96" x2="410" y2="404" stroke="#c9d6d4" stroke-width="1.5"/><line x1="640" y1="96" x2="640" y2="404" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="96" width="840" height="308" rx="12" fill="none" stroke="#1e2a44" stroke-width="2.5" />
</svg>