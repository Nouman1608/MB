<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 667" width="900" height="667" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="667" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Dement and Kleitman (1957): procedure</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">9 adults (7 men, 2 women) sleeping in a laboratory</text>
<line x1="60" y1="144" x2="60" y2="572" stroke="#c9d6d4" stroke-width="4"/><rect x="104" y="124" width="766" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="156.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Controls before bed</text><text x="122" y="185.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">No caffeine or alcohol on the test day; arrive near usual bedtime.</text><circle cx="60" cy="166" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="174.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="104" y="220" width="766" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="252.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Wired to an EEG</text><text x="122" y="281.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Electrodes beside the eyes and on the scalp.</text><circle cx="60" cy="262" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="270.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="104" y="316" width="766" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="348.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Woken by a doorbell</text><text x="122" y="377.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">At different points in the night; not told whether they had been in REM or NREM sleep.</text><circle cx="60" cy="358" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="366.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="104" y="412" width="766" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="444.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Report into a recorder</text><text x="122" y="473.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Had they been dreaming? What was the dream about?</text><circle cx="60" cy="454" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="462.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="104" y="508" width="766" height="84" rx="14" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="540.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Five or fifteen minutes?</text><text x="122" y="569.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Some were woken 5 or 15 minutes into REM and asked which length their dream had been.</text><circle cx="60" cy="550" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="558.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="450" y="626.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Five participants were studied intensively; four more were used to confirm results.</text>
</svg>