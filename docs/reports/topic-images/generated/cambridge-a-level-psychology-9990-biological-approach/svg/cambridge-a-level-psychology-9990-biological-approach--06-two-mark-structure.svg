<rect width="900" height="391" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Linking a study to an assumption [2]</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Explain one way Dement and Kleitman support the biological approach</text>
<rect x="30" y="124" width="395" height="155" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">MARK 1: STATE THE ASSUMPTION</text><text x="50" y="188.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">"The biological approach assumes that</text><text x="50" y="210.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">cognitions can be explained by the working</text><text x="50" y="232.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">of the brain."</text><line x1="431" y1="201.5" x2="469" y2="201.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="475" y="124" width="395" height="155" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="495" y="156" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">MARK 2: A PRECISE FINDING TIED TO IT</text><text x="495" y="188.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">"Dream reports were far more likely after</text><text x="495" y="210.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">waking from REM, a distinct brain state</text><text x="495" y="232.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">recorded by the EEG, than after NREM</text><text x="495" y="254.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">sleep."</text><rect x="30" y="301" width="840" height="58" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="450" y="334.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">"Dreams are biological" with no finding earns little.</text>
