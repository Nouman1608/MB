<rect width="900" height="866" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Two assumptions, three studies</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Which part of each assumption each core study tests</text>
<rect x="30" y="124" width="840" height="111" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="158.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Assumption 1</text><text x="50" y="188.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Behaviour, cognitions and emotions can be explained in terms of the working of the <tspan font-weight="700" fill="#1e2a44">brain</tspan> and the</text><text x="50" y="210.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">effect of <tspan font-weight="700" fill="#1e2a44">hormones,</tspan> <tspan font-weight="700" fill="#1e2a44">genetics</tspan> <tspan font-weight="700" fill="#1e2a44">and</tspan> <tspan font-weight="700" fill="#1e2a44">evolution</tspan>.</text><line x1="165" y1="241" x2="165" y2="297" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="450" y1="241" x2="450" y2="297" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="735" y1="241" x2="735" y2="297" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="305" width="270.6666666666667" height="175" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="337" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DEMENT AND KLEITMAN</text><text x="50" y="363.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Brain activity</text><text x="50" y="392.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A mental experience</text><text x="50" y="413.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">(dreaming) linked to</text><text x="50" y="434.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">measurable brain activity and</text><text x="50" y="455.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">eye movement.</text><rect x="314.6666666666667" y="305" width="270.6666666666667" height="175" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="334.6666666666667" y="337" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">HASSETT ET AL.</text><text x="334.6666666666667" y="363.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Hormones and evolution</text><text x="334.6666666666667" y="392.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A sex difference in play that</text><text x="334.6666666666667" y="413.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">also appears in another</text><text x="334.6666666666667" y="434.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">primate, rather than</text><text x="334.6666666666667" y="455.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">upbringing alone.</text><rect x="599.3333333333334" y="305" width="270.6666666666667" height="175" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="619.3333333333334" y="337" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">HÖLZEL ET AL.</text><text x="619.3333333333334" y="363.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Brain structure</text><text x="619.3333333333334" y="392.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A psychological practice</text><text x="619.3333333333334" y="413.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">linked to the structure of</text><text x="619.3333333333334" y="434.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">particular brain regions.</text><rect x="30" y="502" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="536.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Assumption 2</text><text x="50" y="566.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Similarities and differences between people can be understood in terms of biological factors and</text><text x="50" y="588.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">their <tspan font-weight="700" fill="#1e2a44">interaction</tspan> <tspan font-weight="700" fill="#1e2a44">with</tspan> <tspan font-weight="700" fill="#1e2a44">other</tspan> <tspan font-weight="700" fill="#1e2a44">factors</tspan>.</text><line x1="450" y1="619" x2="450" y2="675" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="735" y1="619" x2="735" y2="675" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="315.67" y="683" width="270.165" height="151" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="335.67" y="725.5" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">HASSETT ET AL.</text><text x="335.67" y="757.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Hormones may contribute to a</text><text x="335.67" y="778.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">difference that <tspan font-weight="700" fill="#1e2a44">socialisation</tspan></text><text x="335.67" y="799.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">then</tspan> <tspan font-weight="700" fill="#1e2a44">strengthens</tspan>.</text><rect x="599.835" y="683" width="270.165" height="151" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="619.835" y="715" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">HÖLZEL ET AL.</text><text x="619.835" y="746.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The environment changes</text><text x="619.835" y="767.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">biology: <tspan font-weight="700" fill="#1e2a44">eight</tspan> <tspan font-weight="700" fill="#1e2a44">weeks</tspan> <tspan font-weight="700" fill="#1e2a44">of</tspan></text><text x="619.835" y="788.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">training</tspan> altered grey-matter</text><text x="619.835" y="809.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">concentration.</text>
</svg>