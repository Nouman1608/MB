<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 744" width="900" height="744" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="744" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Dement and Kleitman (1957): results</text>

<rect x="30" y="100" width="840" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="134" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">AWAKENINGS THAT PRODUCED A DREAM REPORT</text><text x="230" y="180" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">REM</text><rect x="250" y="156" width="520" height="38" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><rect x="250" y="156" width="413.8219895287958" height="38" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="782" y="181" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">152 / 191</text><text x="230" y="234" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">NREM</text><rect x="250" y="210" width="520" height="38" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><rect x="250" y="210" width="35.75" height="38" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="782" y="235" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">11 / 160</text><rect x="30" y="292" width="840" height="116" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="326" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FIVE OR FIFTEEN MINUTES? CORRECT JUDGEMENTS</text><text x="230" y="372" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">Estimates</text><rect x="250" y="348" width="520" height="38" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><rect x="250" y="348" width="430.990990990991" height="38" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="782" y="373" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">92 / 111</text><rect x="30" y="430" width="410" height="149" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="235" y="462" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">MAINLY VERTICAL EYE MOVEMENTS</text><text x="235" y="497.4" font-size="30" font-weight="700" fill="#1e2a44" text-anchor="middle">↕</text><text x="235" y="532.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">dream of climbing ladders, looking up and</text><text x="235" y="554.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">down</text><rect x="460" y="430" width="410" height="149" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="665" y="462" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">MAINLY HORIZONTAL EYE MOVEMENTS</text><text x="665" y="497.4" font-size="30" font-weight="700" fill="#1e2a44" text-anchor="middle">↔</text><text x="665" y="532.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">dream of watching two people throw</text><text x="665" y="554.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">tomatoes at each other</text><rect x="30" y="601" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="635.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Not "only in REM"</text><text x="50" y="665.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A small number of NREM awakenings also produced dreams. REM periods recurred at regular</text><text x="50" y="687.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">intervals: an <tspan font-weight="700" fill="#1e2a44">ultradian</tspan> <tspan font-weight="700" fill="#1e2a44">rhythm</tspan> (a cycle shorter than 24 hours).</text>
</svg>