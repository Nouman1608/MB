<rect width="900" height="867" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Hölzel et al. (2011): a before-and-after design</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Experiment with a longitudinal design</text>
<text x="230" y="138" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">BEFORE</text><text x="490" y="138" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">EIGHT WEEKS</text><text x="750" y="138" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">AFTER</text><text x="30" y="168" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">MBSR group (16)</text><rect x="110" y="180" width="240" height="86" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="230" y="214.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">MRI scan</text><text x="230" y="242" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">mindfulness questionnaire</text><rect x="390" y="180" width="200" height="86" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="490" y="227.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">MBSR programme</text><rect x="630" y="180" width="240" height="86" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="750" y="214.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">MRI scan</text><text x="750" y="242" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">mindfulness questionnaire</text><line x1="354" y1="223" x2="384" y2="223" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="594" y1="223" x2="624" y2="223" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="30" y="300" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Control group (17)</text><rect x="110" y="312" width="240" height="86" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="230" y="346.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">MRI scan</text><text x="230" y="374" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">mindfulness questionnaire</text><rect x="390" y="312" width="200" height="86" rx="14" fill="#f4f6f6" stroke="#c9d6d4" stroke-width="2.5"/><text x="490" y="359.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">no programme</text><rect x="630" y="312" width="240" height="86" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="750" y="346.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">MRI scan</text><text x="750" y="374" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">mindfulness questionnaire</text><line x1="354" y1="355" x2="384" y2="355" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="594" y1="355" x2="624" y2="355" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="422" width="840" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="454" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">MBSR PROGRAMME</text><text x="50" y="485.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">weekly group sessions · a day-long retreat · daily home practice guided by audio recordings</text><rect x="30" y="532" width="413" height="151" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="564" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">RESULTS: MBSR GROUP VS CONTROLS</text><text x="50" y="595.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Increased grey-matter concentration in the <tspan font-weight="700" fill="#1e2a44">left</tspan></text><text x="50" y="616.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">hippocampus</tspan>, posterior cingulate cortex,</text><text x="50" y="637.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">temporo-parietal junction and cerebellum;</text><text x="50" y="658.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">mindfulness scores rose.</text><rect x="457" y="532" width="413" height="151" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="564" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">WHY THIS DESIGN</text><text x="477" y="595.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Earlier cross-sectional studies could not show</text><text x="477" y="616.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">meditation <tspan font-weight="700" fill="#1e2a44">caused</tspan> the brain differences; a</text><text x="477" y="637.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">before-and-after design with a control group</text><text x="477" y="658.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">can.</text><rect x="30" y="705" width="305.9259259259259" height="130" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="737" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">+ STRENGTHS</text><text x="50" y="768.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Control group; MRI is objective</text><text x="50" y="789.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and replicable.</text><rect x="349.9259259259259" y="705" width="520.074074074074" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="369.9259259259259" y="737" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">− WEAKNESSES</text><text x="369.9259259259259" y="768.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Small samples; participants knew their group; MBSR mixes</text><text x="369.9259259259259" y="789.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">group support, yoga-based movement and meditation, so the</text><text x="369.9259259259259" y="810.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">active ingredient is unclear.</text>
</svg>