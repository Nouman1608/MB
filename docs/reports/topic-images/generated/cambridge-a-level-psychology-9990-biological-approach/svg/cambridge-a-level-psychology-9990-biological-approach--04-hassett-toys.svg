<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 748" width="900" height="748" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="748" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Hassett et al. (2008): monkey toy preferences</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Rhesus monkeys in a large outdoor enclosure at a primate field station</text>
<rect x="30" y="124" width="350" height="84" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="205" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">WHEELED TOY</text><text x="205" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">e.g. wagon or truck</text><rect x="520" y="124" width="350" height="84" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="695" y="156" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">PLUSH TOY</text><text x="695" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">soft toy</text><text x="450" y="243.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">placed in the enclosure together; contacts coded with a <tspan font-weight="700">behavioural</tspan> <tspan font-weight="700">checklist</tspan> (frequency and duration)</text><rect x="30" y="274" width="840" height="290" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="850" y="302" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">illustrative: the lesson gives no numbers</text><line x1="90" y1="504" x2="810" y2="504" stroke="#1e2a44" stroke-width="3"/><rect x="150" y="328" width="90" height="176" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><rect x="250" y="432" width="90" height="72" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="245" y="534" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Males</text><text x="245" y="556" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">more with wheeled toys</text><rect x="560" y="384" width="90" height="120" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><rect x="660" y="392" width="90" height="112" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="655" y="534" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Females</text><text x="655" y="556" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">much more even</text><rect x="370" y="334" width="22" height="22" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="400" y="352" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">wheeled</text><rect x="370" y="366" width="22" height="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="400" y="384" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">plush</text><rect x="30" y="586" width="840" height="130" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="620.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Conclusion</text><text x="50" y="649.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The male preference appears without human-style socialisation, so biological factors such as <tspan font-weight="700" fill="#1e2a44">hormones</tspan></text><text x="50" y="670.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">may help produce sex differences in toy preference, which <tspan font-weight="700" fill="#1e2a44">socialisation</tspan> <tspan font-weight="700" fill="#1e2a44">may</tspan> <tspan font-weight="700" fill="#1e2a44">then</tspan> <tspan font-weight="700" fill="#1e2a44">strengthen</tspan>.</text><text x="50" y="691.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Children's data came from another study: no children were tested.</text>
</svg>