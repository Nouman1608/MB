<rect width="900" height="721" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Reading the data: Tom, aged 2;6</text>

<text x="40" y="128" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Tom is 2;6 (two years, six months). (.) = micropause</text><rect x="40" y="145" width="110" height="74" rx="9" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2"/><text x="95" y="188" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">TOM</text><rect x="158" y="145" width="380" height="74" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="176" y="188" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">daddy goed work</text><line x1="540" y1="182" x2="562" y2="182" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><text x="570" y="176" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="start">virtuous error "goed";</text><text x="570" y="200" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="start">auxiliary omitted (telegraphic)</text><rect x="40" y="229" width="110" height="74" rx="9" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="95" y="272" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">MOTHER</text><rect x="158" y="229" width="380" height="74" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="176" y="260" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">yes daddy went to work didn't</text><text x="176" y="284" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">he (.) where did daddy go</text><line x1="540" y1="266" x2="562" y2="266" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><text x="570" y="260" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">recast; tag question;</text><text x="570" y="284" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">wh-question hands Tom the turn</text><rect x="40" y="313" width="110" height="50" rx="9" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2"/><text x="95" y="344" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">TOM</text><rect x="158" y="313" width="380" height="50" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="176" y="344" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">work (.) in big car</text><line x1="540" y1="338" x2="562" y2="338" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><text x="570" y="344" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="start">"the" omitted (telegraphic)</text><rect x="40" y="373" width="110" height="74" rx="9" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="95" y="416" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">MOTHER</text><rect x="158" y="373" width="380" height="74" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="176" y="404" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">in the big car that's right</text><text x="176" y="428" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">(.) and what's this</text><line x1="540" y1="410" x2="562" y2="410" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><text x="570" y="416" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">expansion; wh-question</text><rect x="40" y="457" width="110" height="74" rx="9" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2"/><text x="95" y="500" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">TOM</text><rect x="158" y="457" width="380" height="74" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="176" y="500" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">doggy (.) two doggies</text><line x1="540" y1="494" x2="562" y2="494" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><text x="570" y="488" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="start">plural rule applied correctly;</text><text x="570" y="512" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="start">diminutive "-y"</text><rect x="40" y="547" width="400" height="110" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="64" y="581" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Rule formation</text><text x="64" y="609" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">"goed" is not imitated: the mother</text><text x="64" y="631" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">never says it. Supports nativism.</text><rect x="460" y="547" width="400" height="110" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="484" y="581" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Interaction</text><text x="484" y="609" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">recast and wh-questions scaffold</text><text x="484" y="631" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Tom's turns. Supports Bruner.</text><text x="450" y="695" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Judgement: rule formation and interaction work together.</text>
</svg>