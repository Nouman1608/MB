<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" width="900" height="580" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="580" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Aitchison: three processes of word learning</text>

<rect x="40" y="120" width="250" height="335" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="165" cy="160" r="22" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="165" y="167.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="165" y="220" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Labelling</text><text x="165" y="252" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">linking a word to a</text><text x="165" y="273" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">thing</text><line x1="292" y1="270" x2="322" y2="270" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="325" y="120" width="250" height="335" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><circle cx="450" cy="160" r="22" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="167.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="450" y="220" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Packaging</text><text x="450" y="252" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">finding the limits of a</text><text x="450" y="273" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">word's meaning</text><line x1="577" y1="270" x2="607" y2="270" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="610" y="120" width="250" height="335" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="735" cy="160" r="22" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="735" y="167.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="735" y="220" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Network building</text><text x="735" y="252" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">relating words to each</text><text x="735" y="273" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">other, such as opposites</text><text x="735" y="294" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">and categories</text><rect x="100" y="365" width="60" height="50" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><line x1="165" y1="390" x2="195" y2="390" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><text x="225" y="397" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle" font-style="italic">dog</text><circle cx="450" cy="385" r="42" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" stroke-dasharray="7 5"/><text x="450" y="391" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle" font-style="italic">dog</text><path d="M690,375 L770,365 M690,375 L730,425 M770,365 L730,425" fill="none" stroke="#2e6b62" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="658" y="359" width="64" height="30" rx="8" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="690" y="380" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">dog</text><rect x="738" y="349" width="64" height="30" rx="8" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="770" y="370" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">cat</text><rect x="698" y="409" width="64" height="30" rx="8" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="730" y="430" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">animal</text><rect x="40" y="475" width="820" height="80" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="450" y="509" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Overextension and underextension happen during packaging,</text><text x="450" y="535" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">as the child finds where a word's meaning stops.</text>
</svg>