<rect width="900" height="635" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Writing development: Kroll's stages</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Barry Kroll's model</text>
<rect x="40" y="330" width="193" height="130" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><circle cx="70" cy="362" r="18" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="70" y="368.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="94" y="369" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Preparation</text><text x="56" y="406" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">motor skills and</text><text x="56" y="427" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">basic spelling</text><rect x="247" y="270" width="193" height="190" rx="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="277" cy="302" r="18" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="277" y="308.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="301" y="309" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Consolidation</text><text x="263" y="346" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">writing like</text><text x="263" y="367" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">speech, with "and</text><text x="263" y="388" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">then" chaining</text><rect x="454" y="210" width="193" height="250" rx="10" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><circle cx="484" cy="242" r="18" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="484" y="248.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="508" y="249" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Differentiation</text><text x="470" y="286" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">awareness of</text><text x="470" y="307" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">differences between</text><text x="470" y="328" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">speech and writing,</text><text x="470" y="349" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and of genre</text><rect x="661" y="150" width="193" height="310" rx="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="691" cy="182" r="18" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="691" y="188.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="715" y="189" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Integration</text><text x="677" y="226" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">a personal voice</text><text x="677" y="247" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">controlling style</text><text x="677" y="268" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">for audience</text><rect x="40" y="480" width="820" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="64" y="515" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Spelling errors are often logical</text><rect x="64" y="535" width="185" height="58" rx="9" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="156" y="558" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">phonetic</text><text x="156" y="581" font-size="16" font-weight="400" fill="#8a6d0d" text-anchor="middle" font-style="italic">"sed"</text><rect x="264" y="535" width="185" height="58" rx="9" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="356" y="558" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">over-generalised rule</text><text x="356" y="581" font-size="16" font-weight="400" fill="#8a6d0d" text-anchor="middle" font-style="italic">"cryed"</text><rect x="464" y="535" width="185" height="58" rx="9" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="556" y="570" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">omissions</text><rect x="664" y="535" width="185" height="58" rx="9" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="756" y="570" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">transpositions</text>
</svg>