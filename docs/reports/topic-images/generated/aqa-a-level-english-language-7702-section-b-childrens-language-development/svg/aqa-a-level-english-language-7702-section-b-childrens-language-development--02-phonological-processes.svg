<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 692" width="900" height="692" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="692" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Phonological simplification</text>

<text x="530" y="130" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">child says</text><text x="740" y="130" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">adult target</text><rect x="40" y="145" width="820" height="68" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="175" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Deletion</text><text x="60" y="199" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">dropping a sound or unstressed syllable</text><rect x="450" y="157" width="160" height="44" rx="9" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2"/><text x="530" y="186" font-size="19" font-weight="600" fill="#1e2a44" text-anchor="middle" font-style="italic">"nana"</text><line x1="660" y1="179" x2="615" y2="179" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="665" y="157" width="160" height="44" rx="9" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="745" y="186" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">"banana"</text><rect x="40" y="225" width="820" height="68" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="255" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Substitution</text><text x="60" y="279" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">easier sound for a harder one, e.g. fronting</text><rect x="450" y="237" width="160" height="44" rx="9" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2"/><text x="530" y="266" font-size="19" font-weight="600" fill="#1e2a44" text-anchor="middle" font-style="italic">"tat"</text><line x1="660" y1="259" x2="615" y2="259" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="665" y="237" width="160" height="44" rx="9" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="745" y="266" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">"cat"</text><rect x="40" y="305" width="820" height="68" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="335" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Assimilation</text><text x="60" y="359" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">one sound becomes like another in the word</text><rect x="450" y="317" width="160" height="44" rx="9" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2"/><text x="530" y="346" font-size="19" font-weight="600" fill="#1e2a44" text-anchor="middle" font-style="italic">"gog"</text><line x1="660" y1="339" x2="615" y2="339" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="665" y="317" width="160" height="44" rx="9" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="745" y="346" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">"dog"</text><rect x="40" y="385" width="820" height="68" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="415" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Cluster reduction</text><text x="60" y="439" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">a consonant cluster is reduced</text><rect x="450" y="397" width="160" height="44" rx="9" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2"/><text x="530" y="426" font-size="19" font-weight="600" fill="#1e2a44" text-anchor="middle" font-style="italic">"pider"</text><line x1="660" y1="419" x2="615" y2="419" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="665" y="397" width="160" height="44" rx="9" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="745" y="426" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">"spider"</text><rect x="40" y="465" width="820" height="68" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="495" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Reduplication</text><text x="60" y="519" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">repeating a syllable</text><rect x="450" y="477" width="160" height="44" rx="9" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2"/><text x="530" y="506" font-size="19" font-weight="600" fill="#1e2a44" text-anchor="middle" font-style="italic">"wawa"</text><line x1="660" y1="499" x2="615" y2="499" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="665" y="477" width="160" height="44" rx="9" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="745" y="506" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">"water"</text><rect x="40" y="555" width="820" height="112" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="64" y="590" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The "fis" phenomenon (Berko and Brown, 1960)</text><text x="64" y="622" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A child who says "fis" for "fish" may still reject an adult who says "fis":</text><text x="64" y="646" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="start">perception runs ahead of production.</text>
</svg>