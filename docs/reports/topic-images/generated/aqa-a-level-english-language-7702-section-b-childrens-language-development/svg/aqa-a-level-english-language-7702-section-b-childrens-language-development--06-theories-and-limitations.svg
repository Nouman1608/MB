<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 715" width="900" height="715" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="715" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four positions to evaluate</text>

<text x="400" y="130" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">Core claim</text><text x="720" y="130" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">A limitation to raise</text><rect x="40" y="145" width="210" height="100" rx="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="145" y="193" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Behaviourist</text><text x="145" y="219" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">B. F. Skinner</text><rect x="262" y="145" width="312" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="278" y="201" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">imitation and reinforcement</text><rect x="586" y="145" width="274" height="100" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="602" y="190.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">cannot explain virtuous</text><text x="602" y="211.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">errors no adult models</text><rect x="40" y="257" width="210" height="100" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="145" y="305" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Nativist</text><text x="145" y="331" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Noam Chomsky</text><rect x="262" y="257" width="312" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="278" y="292" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">an innate Language Acquisition</text><text x="278" y="313" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Device works out grammar from</text><text x="278" y="334" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">limited input</text><rect x="586" y="257" width="274" height="100" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="602" y="302.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">underplays interaction;</text><text x="602" y="323.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">hard to test directly</text><rect x="40" y="369" width="210" height="100" rx="10" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="145" y="417" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Cognitive</text><text x="145" y="443" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Jean Piaget</text><rect x="262" y="369" width="312" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="278" y="404" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">language follows conceptual</text><text x="278" y="425" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">development, e.g. object</text><text x="278" y="446" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">permanence</text><rect x="586" y="369" width="274" height="100" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="602" y="404" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">some language seems to</text><text x="602" y="425" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">develop ahead of related</text><text x="602" y="446" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">concepts</text><rect x="40" y="481" width="210" height="100" rx="10" fill="#efdfa8" stroke="#1e2a44" stroke-width="2.5"/><text x="145" y="509" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Social</text><text x="145" y="531" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">interactionist</text><text x="145" y="555" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Jerome Bruner;</text><text x="145" y="573" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Lev Vygotsky</text><rect x="262" y="481" width="312" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="278" y="505.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">interaction with caregivers</text><text x="278" y="526.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">drives development: LASS,</text><text x="278" y="547.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">scaffolding, zone of proximal</text><text x="278" y="568.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">development</text><rect x="586" y="481" width="274" height="100" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="602" y="505.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">children in cultures with</text><text x="602" y="526.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">little child-directed</text><text x="602" y="547.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">speech still acquire</text><text x="602" y="568.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">language</text><rect x="40" y="600" width="820" height="90" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="64" y="634" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Child-directed speech: evidence most often linked to interactionist views</text><text x="64" y="664" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">higher pitch, simpler syntax, repetition, questions, expansions and recasts</text>
</svg>