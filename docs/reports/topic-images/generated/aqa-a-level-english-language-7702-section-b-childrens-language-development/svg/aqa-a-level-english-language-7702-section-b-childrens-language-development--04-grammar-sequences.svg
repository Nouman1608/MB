<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="700" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Grammatical development in sequence</text>

<rect x="40" y="115" width="820" height="140" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="64" y="150" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Inflections: broadly predictable order</text><rect x="64" y="172" width="340" height="60" rx="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="80" y="198" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">Early</text><text x="80" y="220" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">present progressive "-ing", plural "-s"</text><line x1="408" y1="202" x2="470" y2="202" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="476" y="172" width="360" height="60" rx="10" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2"/><text x="492" y="198" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">Later</text><text x="492" y="220" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">regular past "-ed", third-person "-s"</text><text x="64" y="295" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Negatives</text><rect x="40" y="313" width="250" height="96" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="165" y="345" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">"no" at the edge of the</text><text x="165" y="364" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">utterance</text><text x="165" y="391" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle" font-style="italic">"no bed"</text><line x1="292" y1="361" x2="322" y2="361" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="325" y="313" width="250" height="96" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="345" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">negative inside the</text><text x="450" y="364" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">utterance</text><text x="450" y="391" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle" font-style="italic">"I no want it"</text><line x1="577" y1="361" x2="607" y2="361" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="610" y="313" width="250" height="96" rx="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="735" y="345" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">correct auxiliary forms</text><text x="735" y="391" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle" font-style="italic">"I don't want it"</text><text x="64" y="445" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Questions</text><rect x="40" y="463" width="250" height="96" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="165" y="495" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">rising intonation</text><text x="165" y="541" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle" font-style="italic">"daddy gone?"</text><line x1="292" y1="511" x2="322" y2="511" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="325" y="463" width="250" height="96" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="495" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">wh-word without inversion</text><text x="450" y="541" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle" font-style="italic">"where daddy going?"</text><line x1="577" y1="511" x2="607" y2="511" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="610" y="463" width="250" height="96" rx="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="735" y="495" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">subject and auxiliary</text><text x="735" y="514" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">inverted</text><text x="735" y="541" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle" font-style="italic">"where is daddy going?"</text><rect x="40" y="585" width="820" height="90" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="64" y="620" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Virtuous errors: "goed", "mouses", "I eated it"</text><text x="64" y="652" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A rule over-applied. Berko's "wug" test (1958): plural rules applied to invented words.</text>
</svg>