<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 690" width="900" height="690" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="690" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Extending an answer</text>

<rect x="30" y="430" width="200" height="90" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="466" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Statement</text><text x="48" y="494" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">one simple, accurate</text><text x="48" y="516" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">sentence</text><rect x="242" y="352" width="200" height="168" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="260" y="388" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">+ opinion</text><text x="260" y="416" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">my view is,</text><text x="260" y="438" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">in my opinion</text><rect x="454" y="274" width="200" height="246" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="472" y="310" font-size="22" font-weight="700" fill="#8a6d0d" text-anchor="start">+ reason</text><text x="472" y="338" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">because,</text><text x="472" y="360" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">therefore</text><rect x="666" y="196" width="200" height="324" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="684" y="232" font-size="22" font-weight="700" fill="#8a6d0d" text-anchor="start">+ example</text><text x="684" y="260" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">a specific</text><text x="684" y="282" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">detail</text><line x1="80" y1="400" x2="700" y2="162" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><text x="50" y="150" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">move up a band</text><text x="50" y="176" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">reason + example is the</text><text x="50" y="199" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">most reliable way</text><rect x="30" y="545" width="840" height="120" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="52" y="580" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Also widen the range with:</text><text x="52" y="612" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">three tenses  ·  comparatives (better than, the best)  ·  connectives</text><text x="52" y="640" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">(however, moreover)  ·  time markers (usually, last week, next year)</text>
</svg>