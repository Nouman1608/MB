<text x="450" y="132" font-size="19" font-weight="600" fill="#4a5568" text-anchor="middle">Content: three themes, examined across both papers</text><rect x="30" y="150" width="266" height="130" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="3"/><text x="48" y="184" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Theme 1</text><text x="48" y="214" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Identity and Culture</text><rect x="317" y="150" width="266" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="335" y="184" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Theme 2</text><text x="335" y="214" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Local, National,</text><text x="335" y="236" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">International and Global</text><text x="335" y="258" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Areas of Interest</text><rect x="604" y="150" width="266" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="622" y="184" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Theme 3</text><text x="622" y="214" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Current and Future Study</text><text x="622" y="236" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">and Employment</text><line x1="50" y1="306" x2="850" y2="306" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="450" y="336" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">from personal life towards more complex, less personal subject matter</text><line x1="232" y1="352" x2="232" y2="392" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="668" y1="352" x2="668" y2="392" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="400" width="405" height="200" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="438" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="start">Paper 1</text><text x="52" y="466" font-size="19" font-weight="600" fill="#2e6b62" text-anchor="start">Reading, Grammar and Meaning</text><rect x="52" y="486" width="120" height="42" rx="21" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="112" y="514" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">1 h 45 min</text><rect x="182" y="486" width="110" height="42" rx="21" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="237" y="514" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">70 marks</text><rect x="302" y="486" width="90" height="42" rx="21" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="347" y="514" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">50%</text><text x="52" y="566" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">tests the theme content receptively</text><rect x="465" y="400" width="405" height="200" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="487" y="438" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="start">Paper 2</text><text x="487" y="466" font-size="19" font-weight="600" fill="#2e6b62" text-anchor="start">Writing</text><rect x="487" y="486" width="120" height="42" rx="21" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="547" y="514" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">1 h 45 min</text><rect x="617" y="486" width="110" height="42" rx="21" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="672" y="514" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">70 marks</text><rect x="737" y="486" width="90" height="42" rx="21" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="782" y="514" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">50%</text><text x=