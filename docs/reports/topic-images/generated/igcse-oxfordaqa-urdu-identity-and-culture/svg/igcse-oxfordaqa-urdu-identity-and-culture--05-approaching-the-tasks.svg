<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="700" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Approaching the tasks</text>

<rect x="30" y="110" width="840" height="290" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="148" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Reading: what does the question want?</text><rect x="330" y="168" width="240" height="50" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="450" y="200" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Read the question</text><path d="M450,218 V240 H180 V262" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><rect x="60" y="270" width="240" height="112" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="180" y="304" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Detail</text><text x="180" y="334" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">a fact stated</text><text x="180" y="356" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">in the text</text><path d="M450,218 V240 H450 V262" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><rect x="330" y="270" width="240" height="112" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="304" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Opinion</text><text x="450" y="334" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">look for evaluative</text><text x="450" y="356" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">language, not facts</text><path d="M450,218 V240 H720 V262" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><rect x="600" y="270" width="240" height="112" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="720" y="304" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Inference</text><text x="720" y="334" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">what the text</text><text x="720" y="356" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">implies</text><rect x="30" y="420" width="840" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="458" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Writing: before you finish, check</text><rect x="56" y="484" width="28" height="28" rx="6" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><path d="M62,498 l7,8 l12,-15" fill="none" stroke="#2e6b62" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><text x="100" y="506" font-size="19" font-weight="600" fill="#1e2a44" text-anchor="start">Every bullet point in the task addressed</text><text x="100" y="529" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">strong practice; the number of words is not important</text><rect x="56" y="544" width="28" height="28" rx="6" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><path d="M62,558 l7,8 l12,-15" fill="none" stroke="#2e6b62" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><text x="100" y="566" font-size="19" font-weight="600" fill="#1e2a44" text-anchor="start">An opinion with a reason wherever the task allows</text><text x="100" y="589" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">in my opinion ... because ...</text><rect x="56" y="604" width="28" height="28" rx="6" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><path d="M62,618 l7,8 l12,-15" fill="none" stroke="#2e6b62" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><text x="100" y="626" font-size="19" font-weight="600" fill="#1e2a44" text-anchor="start">Tenses varied deliberately</text><text x="100" y="649" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">present, past and future</text>
</svg>