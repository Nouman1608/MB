<text x="450" y="128" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Task: describe a festival you celebrate and say why it is important to you</text><rect x="30" y="150" width="260" height="420" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="160" y="190" font-size="24" font-weight="700" fill="#b5602e" text-anchor="middle">Weak</text><rect x="52" y="220" width="216" height="48" rx="10" fill="#f6ece4" stroke="#b5602e" stroke-width="2"/><text x="160" y="250" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">lists what happens</text><rect x="52" y="304" width="216" height="48" rx="10" fill="#f6ece4" stroke="#b5602e" stroke-width="2"/><text x="160" y="334" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">one tense</text><rect x="52" y="388" width="216" height="48" rx="10" fill="#f6ece4" stroke="#b5602e" stroke-width="2"/><text x="160" y="418" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">no opinion</text><rect x="52" y="472" width="216" height="48" rx="10" fill="#f6ece4" stroke="#b5602e" stroke-width="2"/><text x="160" y="502" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">no reason</text><rect x="310" y="150" width="560" height="420" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="3"/><text x="590" y="190" font-size="24" font-weight="700" fill="#2e6b62" text-anchor="middle">Strong</text><line x1="345" y1="250" x2="835" y2="250" stroke="#1e2a44" stroke-width="3"/><circle cx="425" cy="250" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="425" y="228" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Past</text><text x="425" y="288" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">recalls a</text><text x="425" y="309" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">particular occasion</text><circle cx="590" cy="250" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="590" y="228" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Present</text><text x="590" y="288" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">describes</text><text x="590" y="309" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">the festival</text><circle cx="755" cy="250" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="755" y="228" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Future</text><text x="755" y="288" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">what you will</text><text x="755" y="309" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">do next year</text><rect x="334" y="345" width="512" height="100" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="354" y="377" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Opinion WITH a reason</text><text x="354" y="404" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">it matters because it brings the family together,</text><text x="354" y="426" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and my grandparents visit</text><rect x="334" y="460" width="512" height="86" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="354" y="492" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">One specific personal detail</text><text x="354" y="520" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">something only you would write</text><text x="450" y="606" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Three tenses + opinion + reason + personal detail = the top-band recipe</text>
