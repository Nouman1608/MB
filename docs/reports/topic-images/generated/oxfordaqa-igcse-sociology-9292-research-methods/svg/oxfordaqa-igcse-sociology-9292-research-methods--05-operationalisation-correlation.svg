<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Measuring concepts, reading patterns</text>

<text x="225" y="116" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Operationalisation</text><rect x="105" y="136" width="240" height="64" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="225" y="176" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">“Poverty”</text><text x="225" y="222" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">a concept: how will you measure it?</text><line x1="170" y1="232" x2="110" y2="290" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="225" y1="232" x2="225" y2="290" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="280" y1="232" x2="340" y2="290" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="40" y="296" width="120" height="50" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="100" y="328" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Income</text><rect x="165" y="296" width="120" height="50" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="225" y="328" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Both</text><rect x="290" y="296" width="120" height="50" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="350" y="328" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Possessions</text><text x="675" y="116" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Correlation is not causation</text><line x1="500" y1="330" x2="840" y2="330" stroke="#1e2a44" stroke-width="2.5"/><line x1="500" y1="330" x2="500" y2="130" stroke="#1e2a44" stroke-width="2.5"/><path d="M510,290 L600,260 L700,220 L820,160" fill="none" stroke="#2e6b62" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><path d="M510,310 L600,285 L700,250 L820,200" fill="none" stroke="#8a6d0d" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="10 6"/><text x="830" y="154" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">A</text><text x="830" y="206" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="start">B</text><text x="670" y="356" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">time</text><rect x="30" y="380" width="840" height="90" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="61" cy="410.39" r="4.5" fill="#8a6d0d"/><text x="74" y="416" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Operationalisation:</tspan> turning a concept into something you can measure</text><circle cx="61" cy="440.39" r="4.5" fill="#8a6d0d"/><text x="74" y="446" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Correlation:</tspan> A and B rising together does not prove that A causes B</text>
</svg>