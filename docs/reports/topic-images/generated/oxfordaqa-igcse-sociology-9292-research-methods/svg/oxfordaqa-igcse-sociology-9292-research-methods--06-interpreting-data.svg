<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 612" width="900" height="612" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="612" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Reading unfamiliar data</text>

<text x="225" y="120" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Tables, charts and graphs</text><rect x="30" y="138" width="404" height="84" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="64" cy="180" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="64" y="186.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="96" y="168" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Read</text><text x="96" y="192" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">The title, units and source first</text><rect x="30" y="230" width="404" height="84" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="64" cy="272" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="64" y="278.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="96" y="260" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Extremes</text><text x="96" y="284" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">State the highest and lowest figures</text><rect x="30" y="322" width="404" height="84" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="64" cy="364" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="64" y="370.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="96" y="352" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Trend</text><text x="96" y="376" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Describe the overall trend or pattern</text><rect x="30" y="414" width="404" height="84" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="64" cy="456" r="18" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="64" y="462.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="96" y="444" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Quantify</text><text x="96" y="468" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Quote figures for the differences</text><rect x="30" y="506" width="404" height="84" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="64" cy="548" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="64" y="554.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="96" y="536" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Limits</text><text x="96" y="560" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Say what the data does not show: causes,</text><text x="96" y="580" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">how it was collected</text><text x="668" y="120" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Qualitative extracts</text><rect x="466" y="138" width="404" height="440" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="490" y="176" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="start">Field notes or interviews</text><circle cx="495" cy="208.39" r="4.5" fill="#8a6d0d"/><text x="508" y="214" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Identify what it reveals about <tspan font-weight="700">meanings</tspan></text><circle cx="495" cy="238.39" r="4.5" fill="#8a6d0d"/><text x="508" y="244" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Quote a short phrase as evidence</text><circle cx="495" cy="268.39" r="4.5" fill="#8a6d0d"/><text x="508" y="274" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Ask whether the observer’s presence may</text><text x="508" y="296" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">have shaped what happened</text><rect x="490" y="460" width="356" height="96" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2" stroke-dasharray="7 5"/><text x="508" y="492" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">Common mistake</text><text x="508" y="518" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Describing data without quoting figures</text><text x="508" y="539" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">from it</text>
</svg>