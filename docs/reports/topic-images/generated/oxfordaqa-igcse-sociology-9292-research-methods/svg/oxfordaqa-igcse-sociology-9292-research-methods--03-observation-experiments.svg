<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 691" width="900" height="691" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="691" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Observation and experiments</text>

<text x="450" y="112" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Observation</text><rect x="30" y="130" width="412" height="104" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="50" y="164" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Participant</text><text x="50" y="192" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Researcher joins in; ethnography studies a way</text><text x="50" y="213" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">of life in its natural setting</text><rect x="458" y="130" width="412" height="104" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="478" y="164" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Non-participant</text><text x="478" y="192" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Researcher watches without joining in</text><rect x="30" y="248" width="412" height="104" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="50" y="282" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Overt</text><text x="50" y="310" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The group knows it is being studied</text><rect x="458" y="248" width="412" height="104" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="478" y="282" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Covert</text><text x="478" y="310" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The group does not know: avoids the Hawthorne</text><text x="478" y="331" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">effect, but deceives</text><text x="450" y="386" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Experiments</text><rect x="30" y="404" width="412" height="158" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,454 L31.25,418.25 Q31.25,405.25 44.25,405.25 L427.75,405.25 Q440.75,405.25 440.75,418.25 L440.75,454 Z" fill="#ffffff"/><line x1="31.25" y1="454" x2="440.75" y2="454" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="434.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Laboratory</text><circle cx="49" cy="480.53999999999996" r="4.5" fill="#2e6b62"/><text x="62" y="486.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">+</tspan> Control over variables</text><circle cx="49" cy="510.53999999999996" r="4.5" fill="#2e6b62"/><text x="62" y="516.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">−</tspan> Artificial</text><rect x="458" y="404" width="412" height="158" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,454 L459.25,418.25 Q459.25,405.25 472.25,405.25 L855.75,405.25 Q868.75,405.25 868.75,418.25 L868.75,454 Z" fill="#ffffff"/><line x1="459.25" y1="454" x2="868.75" y2="454" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="434.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Field</text><circle cx="477" cy="480.53999999999996" r="4.5" fill="#2e6b62"/><text x="490" y="486.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Real settings, e.g. Rosenthal and Jacobson</text><text x="490" y="508.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">on teacher expectations</text><circle cx="477" cy="532.54" r="4.5" fill="#2e6b62"/><text x="490" y="538.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">−</tspan> Less control; questions of consent</text><rect x="30" y="578" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="614" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Longitudinal studies</text><text x="56" y="643" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Follow the same group over time to show change, but are expensive and people drop out.</text>
</svg>