<rect width="900" height="610" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Choosing a method: experiences of racism</text>

<rect x="30" y="108" width="840" height="60" rx="12" fill="#1e2a44" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="146" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">How do young people experience racism in their town?</text><rect x="30" y="190" width="412" height="184" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,240 L31.25,204.25 Q31.25,191.25 44.25,191.25 L427.75,191.25 Q440.75,191.25 440.75,204.25 L440.75,240 Z" fill="#b5d3cf"/><line x1="31.25" y1="240" x2="440.75" y2="240" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="221" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Questionnaire</text><circle cx="49" cy="265.92" r="4.5" fill="#2e6b62"/><text x="62" y="271.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">+</tspan> Anonymous: may reduce social desirability</text><circle cx="49" cy="294.92" r="4.5" fill="#2e6b62"/><text x="62" y="300.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">+</tspan> Large sample shows how common racism is</text><circle cx="49" cy="323.92" r="4.5" fill="#2e6b62"/><text x="62" y="329.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">−</tspan> Closed questions lose the meaning of</text><text x="62" y="350.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">experiences</text><rect x="458" y="190" width="412" height="184" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,240 L459.25,204.25 Q459.25,191.25 472.25,191.25 L855.75,191.25 Q868.75,191.25 868.75,204.25 L868.75,240 Z" fill="#f2e7b8"/><line x1="459.25" y1="240" x2="868.75" y2="240" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="221" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Unstructured interview</text><circle cx="477" cy="265.92" r="4.5" fill="#2e6b62"/><text x="490" y="271.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">+</tspan> Rich, valid accounts of how racism feels</text><circle cx="477" cy="294.92" r="4.5" fill="#2e6b62"/><text x="490" y="300.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">−</tspan> Small sample</text><circle cx="477" cy="323.92" r="4.5" fill="#2e6b62"/><text x="490" y="329.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">−</tspan> Interviewer’s ethnicity may affect what is</text><text x="490" y="350.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">said (interviewer bias)</text><rect x="30" y="390" width="840" height="60" rx="12" fill="#efdfa8" stroke="#1e2a44" stroke-width="2"/><text x="54" y="427" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">Ethics:</text><text x="124" y="427" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">sensitive topic, so informed consent, anonymity, wellbeing and support afterwards</text><line x1="450" y1="456" x2="450" y2="484" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="150" y="490" width="600" height="96" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="524" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Judgement: triangulation</text><text x="450" y="554" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Questionnaire for extent, then unstructured interviews for meaning</text>
</svg>