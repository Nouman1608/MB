<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Six ways to choose a sample</text>

<rect x="30" y="108" width="268" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,158 L31.25,122.25 Q31.25,109.25 44.25,109.25 L283.75,109.25 Q296.75,109.25 296.75,122.25 L296.75,158 Z" fill="#b5d3cf"/><line x1="31.25" y1="158" x2="296.75" y2="158" stroke="#c9d6d4" stroke-width="2"/><text x="164" y="139" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Random</text><circle cx="74" cy="192" r="9" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.6"/><circle cx="110" cy="192" r="9" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.6"/><circle cx="146" cy="192" r="9" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.6"/><circle cx="182" cy="192" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.8"/><circle cx="218" cy="192" r="9" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.6"/><circle cx="254" cy="192" r="9" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.6"/><circle cx="74" cy="228" r="9" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.6"/><circle cx="110" cy="228" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.8"/><circle cx="146" cy="228" r="9" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.6"/><circle cx="182" cy="228" r="9" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.6"/><circle cx="218" cy="228" r="9" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.6"/><circle cx="254" cy="228" r="9" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.6"/><circle cx="74" cy="264" r="9" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.6"/><circle cx="110" cy="264" r="9" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.6"/><circle cx="146" cy="264" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.8"/><circle cx="182" cy="264" r="9" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.6"/><circle cx="218" cy="264" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.8"/><circle cx="254" cy="264" r="9" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.6"/><circle cx="74" cy="300" r="9" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.6"/><circle cx="110" cy="300" r="9" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.6"/><circle cx="146" cy="300" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.8"/><circle cx="182" cy="300" r="9" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.6"/><circle cx="218" cy="300" r="9" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.6"/><circle cx="254" cy="300" r="9" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.6"/><text x="46" y="358" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Everyone has an equal chance of</text><text x="46" y="378" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">selection. Needs a sampling</text><text x="46" y="398" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">frame.</text><rect x="316" y="108" width="268" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M317.25,158 L317.25,122.25 Q317.25,109.25 330.25,109.25 L569.75,109.25 Q582.75,109.25 582.75,122.25 L582.75,158 Z" fill="#b5d3cf"/><line x1="317.25" y1="158" x2="582.75" y2="158" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="139" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Systematic</text><circle cx="360" cy="192" r="9" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.6"/><circle cx="396" cy="192" r="9" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.6"/><circle cx="432" cy="192" r="9" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.6"/><circle cx="468" cy="192" r="9" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.6"/><circle cx="504" cy="192" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.8"/><circle cx="540" cy="192" r="9" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.6"/><circle cx="360" cy="228" r="9" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.6"/><circle cx="396" cy="228" r="9" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.6"/><circle cx="432" cy="228" r="9" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.6"/><circle cx="468" cy="228" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.8"/><circle cx="504" cy="228" r="9" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.6"/><circle cx="540" cy="228" r="9" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.6"/><circle cx="360" cy="264" r="9" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.6"/><circle cx="396" cy="264" r="9" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.6"/><circle cx="432" cy="264" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.8"/><circle cx="468" cy="264" r="9" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.6"/><circle cx="504" cy="264" r="9" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.6"/><circle cx="540" cy="264" r="9" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.6"/><circle cx="360" cy="300" r="9" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.6"/><circle cx="396" cy="300" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.8"/><circle cx="432" cy="300" r="9" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.6"/><circle cx="468" cy="300" r="9" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.6"/><circle cx="504" cy="300" r="9" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.6"/><circle cx="540" cy="300" r="9" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.6"/><text x="332" y="358" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Every nth name on the list</text><text x="332" y="378" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">(here every 5th).</text><rect x="602" y="108" width="268" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M603.25,158 L603.25,122.25 Q603.25,109.25 616.25,109.25 L855.75,109.25 Q868.75,109.25 868.75,122.25 L868.75,158 Z" fill="#b5d3cf"/><line x1="603.25" y1="158" x2="868.75" y2="158" stroke="#c9d6d4" stroke-width="2"/><text x="736" y="139" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Stratified random</text><circle cx="646" cy="192" r="9" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.6"/><circle cx="682" cy="192" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.8"/><circle cx="718" cy="192" r="9" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.6"/><circle cx="754" cy="192" r="9" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.6"/><circle cx="790" cy="192" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.8"/><circle cx="826" cy="192" r="9" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.6"/><circle cx="646" cy="228" r="9" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.6"/><circle cx="682" cy="228" r="9" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.6"/><circle cx="718" cy="228" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.8"/><circle cx="754" cy="228" r="9" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.6"/><circle cx="790" cy="228" r="9" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.6"/><circle cx="826" cy="228" r="9" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.6"/><circle cx="646" cy="264" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.8"/><circle cx="682" cy="264" r="9" fill="#f2e7b8" stroke="#1e2a44" stroke-width="1.6"/><circle cx="718" cy="264" r="9" fill="#f2e7b8" stroke="#1e2a44" stroke-width="1.6"/><circle cx="754" cy="264" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.8"/><circle cx="790" cy="264" r="9" fill="#f2e7b8" stroke="#1e2a44" stroke-width="1.6"/><circle cx="826" cy="264" r="9" fill="#f2e7b8" stroke="#1e2a44" stroke-width="1.6"/><circle cx="646" cy="300" r="9" fill="#f2e7b8" stroke="#1e2a44" stroke-width="1.6"/><circle cx="682" cy="300" r="9" fill="#f2e7b8" stroke="#1e2a44" stroke-width="1.6"/><circle cx="718" cy="300" r="9" fill="#f2e7b8" stroke="#1e2a44" stroke-width="1.6"/><circle cx="754" cy="300" r="9" fill="#f2e7b8" stroke="#1e2a44" stroke-width="1.6"/><circle cx="790" cy="300" r="9" fill="#f2e7b8" stroke="#1e2a44" stroke-width="1.6"/><circle cx="826" cy="300" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.8"/><line x1="626" y1="246" x2="846" y2="246" stroke="#1e2a44" stroke-width="2" stroke-dasharray="5 4"/><text x="618" y="358" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Divide into groups (e.g. by</text><text x="618" y="378" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">gender), then take a random</text><text x="618" y="398" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">sample from each in proportion.</text><rect x="30" y="454" width="268" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,504 L31.25,468.25 Q31.25,455.25 44.25,455.25 L283.75,455.25 Q296.75,455.25 296.75,468.25 L296.75,504 Z" fill="#b5d3cf"/><line x1="31.25" y1="504" x2="296.75" y2="504" stroke="#c9d6d4" stroke-width="2"/><text x="164" y="485" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Quota</text><circle cx="74" cy="538" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.8"/><circle cx="110" cy="538" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.8"/><circle cx="146" cy="538" r="9" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.6"/><circle cx="182" cy="538" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.8"/><circle cx="218" cy="538" r="9" fill="#f2e7b8" stroke="#1e2a44" stroke-width="1.6"/><circle cx="254" cy="538" r="9" fill="#f2e7b8" stroke="#1e2a44" stroke-width="1.6"/><circle cx="74" cy="574" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.8"/><circle cx="110" cy="574" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.8"/><circle cx="146" cy="574" r="9" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.6"/><circle cx="182" cy="574" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.8"/><circle cx="218" cy="574" r="9" fill="#f2e7b8" stroke="#1e2a44" stroke-width="1.6"/><circle cx="254" cy="574" r="9" fill="#f2e7b8" stroke="#1e2a44" stroke-width="1.6"/><circle cx="74" cy="610" r="9" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.6"/><circle cx="110" cy="610" r="9" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.6"/><circle cx="146" cy="610" r="9" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.6"/><circle cx="182" cy="610" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.8"/><circle cx="218" cy="610" r="9" fill="#f2e7b8" stroke="#1e2a44" stroke-width="1.6"/><circle cx="254" cy="610" r="9" fill="#f2e7b8" stroke="#1e2a44" stroke-width="1.6"/><circle cx="74" cy="646" r="9" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.6"/><circle cx="110" cy="646" r="9" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.6"/><circle cx="146" cy="646" r="9" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.6"/><circle cx="182" cy="646" r="9" fill="#f2e7b8" stroke="#1e2a44" stroke-width="1.6"/><circle cx="218" cy="646" r="9" fill="#f2e7b8" stroke="#1e2a44" stroke-width="1.6"/><circle cx="254" cy="646" r="9" fill="#f2e7b8" stroke="#1e2a44" stroke-width="1.6"/><line x1="182" y1="520" x2="182" y2="664" stroke="#1e2a44" stroke-width="2" stroke-dasharray="5 4"/><text x="46" y="704" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Fill set numbers from each</text><text x="46" y="724" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">category; the researcher</text><text x="46" y="744" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">chooses who to ask.</text><rect x="316" y="454" width="268" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M317.25,504 L317.25,468.25 Q317.25,455.25 330.25,455.25 L569.75,455.25 Q582.75,455.25 582.75,468.25 L582.75,504 Z" fill="#b5d3cf"/><line x1="317.25" y1="504" x2="582.75" y2="504" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="485" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Multistage</text><rect x="340" y="524" width="220" height="160" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="350" y="546" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">region</text><rect x="380" y="558" width="160" height="112" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="390" y="580" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">school</text><circle cx="412" cy="626" r="9" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.6"/><circle cx="446" cy="626" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.8"/><circle cx="480" cy="626" r="9" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.6"/><circle cx="514" cy="626" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.8"/><text x="460" y="658" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">pupils</text><text x="332" y="704" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Sample in stages: regions, then</text><text x="332" y="724" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">schools, then pupils.</text><rect x="602" y="454" width="268" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M603.25,504 L603.25,468.25 Q603.25,455.25 616.25,455.25 L855.75,455.25 Q868.75,455.25 868.75,468.25 L868.75,504 Z" fill="#b5d3cf"/><line x1="603.25" y1="504" x2="868.75" y2="504" stroke="#c9d6d4" stroke-width="2"/><text x="736" y="485" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Snowball</text><line x1="673.0297403602167" y1="558.72703158295" x2="719.1319695797472" y2="578.4851298198917" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><line x1="742.733126291999" y1="578.6334368540005" x2="789.4780193260012" y2="555.2609903369994" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><line x1="727.27296841705" y1="595.0297403602167" x2="707.5148701801083" y2="641.1319695797472" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><line x1="808.289169107972" y1="559.2198998004545" x2="834.6626360406993" y2="602.0767835661364" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><line x1="830.8582797093769" y1="618.4566881162492" x2="804.9986736723936" y2="628.8005305310426" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><circle cx="662" cy="554" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.8"/><circle cx="732" cy="584" r="9" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.6"/><circle cx="802" cy="549" r="9" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.6"/><circle cx="792" cy="634" r="9" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.6"/><circle cx="702" cy="654" r="9" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.6"/><circle cx="842" cy="614" r="9" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.6"/><text x="618" y="704" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Each participant introduces</text><text x="618" y="724" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">others; for hard-to-reach</text><text x="618" y="744" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">groups.</text><rect x="30" y="800" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="836" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Common mistake</text><text x="56" y="865" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Picking people “at random” in the street is not a random sample: a random sample needs a</text><text x="56" y="887" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">sampling frame, such as a school register.</text>
</svg>