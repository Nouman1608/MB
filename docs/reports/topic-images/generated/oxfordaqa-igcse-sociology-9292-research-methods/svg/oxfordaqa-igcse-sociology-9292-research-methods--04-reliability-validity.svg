<rect width="900" height="635" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Reliability and validity</text>

<rect x="30" y="108" width="268" height="300" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="164" cy="200" r="70" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><circle cx="164" cy="200" r="48" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><circle cx="164" cy="200" r="26" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="204" cy="164" r="5" fill="#1e2a44"/><circle cx="210" cy="170" r="5" fill="#1e2a44"/><circle cx="200" cy="172" r="5" fill="#1e2a44"/><circle cx="208" cy="160" r="5" fill="#1e2a44"/><circle cx="214" cy="164" r="5" fill="#1e2a44"/><text x="164" y="306" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Reliable, not valid</text><text x="164" y="334" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Same result each time, but not</text><text x="164" y="354" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">a true picture</text><rect x="316" y="108" width="268" height="300" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="450" cy="200" r="70" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><circle cx="450" cy="200" r="48" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><circle cx="450" cy="200" r="26" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="436" cy="210" r="5" fill="#1e2a44"/><circle cx="462" cy="184" r="5" fill="#1e2a44"/><circle cx="468" cy="214" r="5" fill="#1e2a44"/><circle cx="430" cy="190" r="5" fill="#1e2a44"/><circle cx="454" cy="220" r="5" fill="#1e2a44"/><text x="450" y="306" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Valid, not reliable</text><text x="450" y="334" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Close to the truth, but results</text><text x="450" y="354" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">vary when repeated</text><rect x="602" y="108" width="268" height="300" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="736" cy="200" r="70" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><circle cx="736" cy="200" r="48" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><circle cx="736" cy="200" r="26" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="738" cy="197" r="5" fill="#1e2a44"/><circle cx="732" cy="203" r="5" fill="#1e2a44"/><circle cx="741" cy="204" r="5" fill="#1e2a44"/><circle cx="733" cy="195" r="5" fill="#1e2a44"/><circle cx="736" cy="206" r="5" fill="#1e2a44"/><text x="736" y="306" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Reliable and valid</text><text x="736" y="334" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">A true picture, repeated</text><text x="450" y="446" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">What threatens validity?</text><rect x="30" y="464" width="269.3333333333333" height="147" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,514 L31.25,478.25 Q31.25,465.25 44.25,465.25 L285.0833333333333,465.25 Q298.0833333333333,465.25 298.0833333333333,478.25 L298.0833333333333,514 Z" fill="#b5d3cf"/><line x1="31.25" y1="514" x2="298.0833333333333" y2="514" stroke="#c9d6d4" stroke-width="2"/><text x="164.66666666666666" y="494.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Researcher bias</text><text x="44" y="545.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The researcher’s views or</text><text x="44" y="566.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">presence influence results</text><rect x="315.3333333333333" y="464" width="269.3333333333333" height="147" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M316.5833333333333,514 L316.5833333333333,478.25 Q316.5833333333333,465.25 329.5833333333333,465.25 L570.4166666666666,465.25 Q583.4166666666666,465.25 583.4166666666666,478.25 L583.4166666666666,514 Z" fill="#dce9e7"/><line x1="316.5833333333333" y1="514" x2="583.4166666666666" y2="514" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="494.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Hawthorne effect</text><text x="329.3333333333333" y="545.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">People behave differently</text><text x="329.3333333333333" y="566.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">because they know they are</text><text x="329.3333333333333" y="587.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">studied</text><rect x="600.6666666666666" y="464" width="269.3333333333333" height="147" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.9166666666666,514 L601.9166666666666,478.25 Q601.9166666666666,465.25 614.9166666666666,465.25 L855.75,465.25 Q868.75,465.25 868.75,478.25 L868.75,514 Z" fill="#f2e7b8"/><line x1="601.9166666666666" y1="514" x2="868.75" y2="514" stroke="#c9d6d4" stroke-width="2"/><text x="735.3333333333333" y="494.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Social desirability</text><text x="614.6666666666666" y="545.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">People give answers that make</text><text x="614.6666666666666" y="566.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">them look good</text>
</svg>