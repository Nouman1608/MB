<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 610" width="900" height="610" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="610" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Convection in everyday life</text>

<rect x="30" y="110" width="410" height="360" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="235" y="146" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Room heater</text><rect x="60" y="170" width="350" height="230" rx="0" fill="#ffffff" stroke="#1e2a44" stroke-width="3" /><rect x="62" y="330" width="30" height="68" rx="0" fill="#b5602e" stroke="#1e2a44" stroke-width="2" /><text x="77" y="420" font-size="14" font-weight="600" fill="#b5602e" text-anchor="middle">heater</text><line x1="110" y1="340" x2="110" y2="200" stroke="#b5602e" stroke-width="4" marker-end="url(#ahR)"/><line x1="130" y1="190" x2="350" y2="190" stroke="#b5602e" stroke-width="4" marker-end="url(#ahR)"/><line x1="385" y1="205" x2="385" y2="370" stroke="#2b5a9a" stroke-width="4" marker-end="url(#ah)"/><line x1="360" y1="385" x2="120" y2="385" stroke="#2b5a9a" stroke-width="4" marker-end="url(#ah)"/><text x="118" y="280" font-size="14" font-weight="600" fill="#b5602e" text-anchor="start">warm air rises</text><text x="375" y="300" font-size="14" font-weight="600" fill="#2b5a9a" text-anchor="end">cools,</text><text x="375" y="318" font-size="14" font-weight="600" fill="#2b5a9a" text-anchor="end">sinks</text><text x="235" y="448" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">flows back along the floor to the heater</text><rect x="460" y="110" width="410" height="360" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="665" y="146" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Sea breeze on a sunny day</text><rect x="490" y="340" width="170" height="60" rx="0" fill="#d8e3c6" stroke="#1e2a44" stroke-width="2.5" /><rect x="660" y="352" width="180" height="48" rx="0" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5" /><text x="575" y="378" font-size="14" font-weight="600" fill="#1e2a44" text-anchor="middle">land warms faster</text><text x="750" y="382" font-size="14" font-weight="600" fill="#2e6b62" text-anchor="middle">sea</text><line x1="570" y1="320" x2="570" y2="205" stroke="#b5602e" stroke-width="4" marker-end="url(#ahR)"/><line x1="595" y1="195" x2="750" y2="195" stroke="#4a5568" stroke-width="3" marker-end="url(#ah)"/><line x1="770" y1="210" x2="770" y2="320" stroke="#2b5a9a" stroke-width="4" marker-end="url(#ah)"/><line x1="750" y1="332" x2="600" y2="332" stroke="#2b5a9a" stroke-width="5" marker-end="url(#ah)"/><text x="582" y="260" font-size="14" font-weight="600" fill="#b5602e" text-anchor="start">warm air rises</text><text x="760" y="260" font-size="14" font-weight="600" fill="#2b5a9a" text-anchor="end">cool air</text><text x="760" y="278" font-size="14" font-weight="600" fill="#2b5a9a" text-anchor="end">sinks</text><circle cx="820" cy="190" r="16" fill="#d4b02e" stroke="#8a6d0d" stroke-width="2"/><text x="665" y="448" font-size="15" font-weight="600" fill="#2b5a9a" text-anchor="middle">breeze blows from sea to land</text><rect x="30" y="485" width="840" height="105" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="520" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Heated → expands → less dense → rises.   Cooled → contracts → denser → sinks.</text><text x="450" y="552" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Kettle element at the bottom: heated water rises, so all the water is heated.</text><text x="450" y="576" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Freezer at the top of a fridge: cooled air sinks over the food below.</text>
</svg>