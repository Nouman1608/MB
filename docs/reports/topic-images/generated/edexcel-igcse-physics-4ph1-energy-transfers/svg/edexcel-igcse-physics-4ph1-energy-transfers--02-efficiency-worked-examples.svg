<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 670" width="900" height="670" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="670" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Efficiency: forwards and backwards</text>

<rect x="30" y="110" width="840" height="230" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="55" y="146" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Example 1: a lamp, 200 J in total</text><rect x="55" y="165" width="316" height="46" rx="0" fill="#d4b02e" stroke="#1e2a44" stroke-width="2" /><text x="213" y="194" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">useful light 80 J</text><rect x="371" y="165" width="474" height="46" rx="0" fill="#f6e3d6" stroke="#1e2a44" stroke-width="2" /><text x="608" y="194" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">wasted heating surroundings 120 J</text><text x="55" y="250" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">efficiency = 80 / 200 × 100% = 40%</text><text x="55" y="282" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">wasted = 200 − 80 = 120 J</text><text x="55" y="312" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Check: useful + wasted = total.</text><rect x="30" y="360" width="840" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="55" y="396" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Example 2 (working backwards): a 35% efficient power station</text><rect x="55" y="415" width="276.5" height="46" rx="0" fill="#d4b02e" stroke="#1e2a44" stroke-width="2" /><text x="193.25" y="444" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">700 MJ electrical (35%)</text><rect x="331.5" y="415" width="513.5" height="46" rx="0" fill="#f6e3d6" stroke="#1e2a44" stroke-width="2" /><text x="588.25" y="444" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">wasted 1300 MJ</text><text x="55" y="500" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">0.35 = 700 / total</text><text x="55" y="532" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">total = 700 / 0.35 = 2000 MJ</text><text x="55" y="564" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">wasted = 2000 − 700 = 1300 MJ</text><text x="450" y="645" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">efficiency = useful energy output ÷ total energy output × 100%</text>
</svg>