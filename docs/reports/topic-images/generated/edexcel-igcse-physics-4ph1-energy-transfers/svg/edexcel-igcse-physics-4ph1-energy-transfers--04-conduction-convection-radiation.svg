<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 530" width="900" height="530" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="530" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three ways of transferring thermal energy</text>

<rect x="30" y="110" width="270" height="400" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="165" y="146" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Conduction</text><path d="M60,267 C79.8,291.2 75.4,311 60,313.2 C44.599999999999994,311 40.2,291.2 60,267 Z" fill="#d4b02e" stroke="#8a6d0d" stroke-width="2"/><rect x="80" y="255" width="200" height="70" rx="0" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.5" /><circle cx="98" cy="273" r="8" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><circle cx="98" cy="307" r="8" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><path d="M85,265 l-4,8 l4,8" fill="none" stroke="#b5602e" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="131" cy="273" r="8" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><circle cx="131" cy="307" r="8" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><path d="M118,265 l-4,8 l4,8" fill="none" stroke="#b5602e" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="164" cy="273" r="8" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><circle cx="164" cy="307" r="8" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><path d="M151,265 l-4,8 l4,8" fill="none" stroke="#b5602e" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="197" cy="273" r="8" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><circle cx="197" cy="307" r="8" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><path d="M184,265 l-4,8 l4,8" fill="none" stroke="#b5602e" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="230" cy="273" r="8" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><circle cx="230" cy="307" r="8" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><path d="M217,265 l-4,8 l4,8" fill="none" stroke="#b5602e" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="263" cy="273" r="8" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><circle cx="263" cy="307" r="8" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><path d="M250,265 l-4,8 l4,8" fill="none" stroke="#b5602e" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" /><line x1="110" y1="345" x2="260" y2="345" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><text x="50" y="385" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Faster-vibrating particles</text><text x="50" y="404" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">pass energy to neighbours by</text><text x="50" y="423" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">collisions. In metals free</text><text x="50" y="442" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">electrons also carry energy.</text><text x="50" y="461" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Needs particles in contact.</text><rect x="315" y="110" width="270" height="400" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="146" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Convection</text><rect x="345" y="175" width="210" height="180" rx="0" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5" /><path d="M400,353 C416.2,372.8 412.6,389 400,390.8 C387.4,389 383.8,372.8 400,353 Z" fill="#d4b02e" stroke="#8a6d0d" stroke-width="2"/><path d="M400,330 L400,205 L500,205 L500,330 L400,330" fill="none" stroke="#b5602e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="1 0"/><line x1="400" y1="300" x2="400" y2="230" stroke="#b5602e" stroke-width="3.5" marker-end="url(#ahR)"/><line x1="430" y1="205" x2="480" y2="205" stroke="#b5602e" stroke-width="3.5" marker-end="url(#ahR)"/><line x1="500" y1="230" x2="500" y2="300" stroke="#2b5a9a" stroke-width="3.5" marker-end="url(#ah)"/><line x1="480" y1="330" x2="420" y2="330" stroke="#2b5a9a" stroke-width="3.5" marker-end="url(#ah)"/><text x="410" y="270" font-size="14" font-weight="700" fill="#b5602e" text-anchor="start">warm</text><text x="490" y="270" font-size="14" font-weight="700" fill="#2b5a9a" text-anchor="end">cool</text><text x="335" y="420" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Warm fluid expands, becomes</text><text x="335" y="439" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">less dense and rises;</text><text x="335" y="458" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">cooler, denser fluid sinks.</text><text x="335" y="477" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Not in solids.</text><rect x="600" y="110" width="270" height="400" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="735" y="146" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Radiation</text><circle cx="650" cy="265" r="26" fill="#b5602e" stroke="#1e2a44" stroke-width="3"/><text x="650" y="312" font-size="14" font-weight="400" fill="#4a5568" text-anchor="middle">hot object</text><path d="M682,265 L683,262.5 L685,257.9 L687,254.6 L689,253.1 L691,253.6 L693,256.1 L695,260.1 L697,265.0 L699,269.9 L701,273.9 L703,276.4 L705,276.9 L707,275.4 L709,272.1 L711,267.5 L713,262.5 L715,257.9 L717,254.6 L719,253.1 L721,253.6 L723,256.1 L725,260.1 L727,265.0 L729,269.9 L731,273.9 L733,276.4 L735,276.9 L737,275.4 L739,272.1 L741,267.5 L743,262.5 L745,257.9 L747,254.6 L749,253.1 L751,253.6 L753,256.1 L755,260.1 L757,265.0 L759,269.9 L761,273.9 L763,276.4 L765,276.9 L767,275.4 L769,272.1 L771,267.5 L773,262.5 L775,257.9 L777,254.6 L779,253.1 L781,253.6 L783,256.1 L785,260.1 L787,265.0 L789,269.9 L791,273.9 L793,276.4 L795,276.9 L797,275.4 L799,272.1 L801,267.5 L803,262.5 L805,257.9 L807,254.6 L809,253.1 L811,253.6 L813,256.1 L815,260.1 L817,265.0 L819,269.9 L821,273.9 L823,276.4 L825,276.9 L827,275.4 L829,272.1 L831,267.5" fill="none" stroke="#b5602e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><line x1="830" y1="265" x2="850" y2="265" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><text x="760" y="230" font-size="14" font-weight="600" fill="#b5602e" text-anchor="middle">infrared waves</text><text x="620" y="385" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Energy carried by infrared</text><text x="620" y="404" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">electromagnetic waves. Needs</text><text x="620" y="423" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">no particles: it can cross a</text><text x="620" y="442" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">vacuum.</text>
</svg>