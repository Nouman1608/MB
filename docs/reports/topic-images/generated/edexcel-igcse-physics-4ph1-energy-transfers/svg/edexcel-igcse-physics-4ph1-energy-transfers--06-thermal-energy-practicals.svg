</defs>
<rect width="900" height="635" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The thermal energy practical</text>

<rect x="30" y="110" width="270" height="420" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="165" y="146" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Conduction</text><text x="165" y="168" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">rods of different metals</text><path d="M70,290 C88,312 84,330 70,332 C56,330 52,312 70,290 Z" fill="#d4b02e" stroke="#8a6d0d" stroke-width="2"/><rect x="70" y="215" width="180" height="18" rx="0" fill="#b5602e" stroke="#1e2a44" stroke-width="2" /><ellipse cx="252" cy="224" rx="6" ry="9" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="1.5"/><line x1="262" y1="245" x2="262" y2="263" stroke="#1e2a44" stroke-width="3" stroke-linecap="round"/><circle cx="262" cy="245" r="4" fill="#4a5568" stroke="#1e2a44" stroke-width="1"/><rect x="70" y="270" width="180" height="18" rx="0" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2" /><ellipse cx="252" cy="279" rx="6" ry="9" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="1.5"/><line x1="258" y1="279" x2="276" y2="279" stroke="#1e2a44" stroke-width="3" stroke-linecap="round"/><circle cx="278" cy="279" r="4" fill="#4a5568" stroke="#1e2a44" stroke-width="1"/><rect x="70" y="325" width="180" height="18" rx="0" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2" /><ellipse cx="252" cy="334" rx="6" ry="9" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="1.5"/><line x1="258" y1="334" x2="276" y2="334" stroke="#1e2a44" stroke-width="3" stroke-linecap="round"/><circle cx="278" cy="334" r="4" fill="#4a5568" stroke="#1e2a44" stroke-width="1"/><line x1="70" y1="205" x2="70" y2="395" stroke="#c9d6d4" stroke-width="2" stroke-linecap="round"/><text x="48" y="420" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Same length, thickness and</text><text x="48" y="439" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">heating. The pin falls first</text><text x="48" y="458" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">from the best conductor.</text><rect x="315" y="110" width="270" height="420" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="146" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Convection</text><text x="450" y="168" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">dye crystal in water</text><rect x="350" y="205" width="200" height="160" rx="0" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5" /><circle cx="370" cy="352" r="7" fill="#7b3f8c" stroke="#1e2a44" stroke-width="1.5"/><path d="M375,368 C389.4,385.6 386.2,400 375,401.6 C363.8,400 360.6,385.6 375,368 Z" fill="#d4b02e" stroke="#8a6d0d" stroke-width="2"/><path d="M375,340 C370,270 385,225 445,222 C515,220 530,260 527,340" fill="none" stroke="#7b3f8c" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><text x="333" y="420" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Heat beneath the crystal: the</text><text x="333" y="439" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">coloured streak rises,</text><text x="333" y="458" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">crosses the top and sinks on</text><text x="333" y="477" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">the far side.</text><rect x="600" y="110" width="270" height="420" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="735" y="146" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Radiation</text><text x="735" y="168" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">cube of hot water</text><rect x="695" y="215" width="80" height="80" rx="0" fill="#dce9e7" stroke="#1e2a44" stroke-width="2" /><line x1="695" y1="215" x2="695" y2="295" stroke="#1e2a44" stroke-width="8" stroke-linecap="butt"/><line x1="775" y1="215" x2="775" y2="295" stroke="#c9d0d0" stroke-width="8" stroke-linecap="butt"/><line x1="690" y1="235" x2="640" y2="235" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><line x1="780" y1="235" x2="798" y2="235" stroke="#b5602e" stroke-width="2" marker-end="url(#ahR)"/><line x1="690" y1="255" x2="640" y2="255" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><line x1="780" y1="255" x2="798" y2="255" stroke="#b5602e" stroke-width="2" marker-end="url(#ahR)"/><line x1="690" y1="275" x2="640" y2="275" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><line x1="780" y1="275" x2="798" y2="275" stroke="#b5602e" stroke-width="2" marker-end="url(#ahR)"/><text x="660" y="320" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">matt black</text><text x="810" y="320" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">shiny silver</text><text x="660" y="340" font-size="15" font-weight="600" fill="#b5602e" text-anchor="middle">most</text><text x="810" y="340" font-size="15" font-weight="600" fill="#b5602e" text-anchor="middle">least</text><text x="618" y="420" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Detector at the same distance</text><text x="618" y="439" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">from each face: the matt</text><text x="618" y="458" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">black face gives the highest</text><text x="618" y="477" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">reading.</text><rect x="30" y="545" width="840" height="70" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="576" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Dark, matt surfaces are good emitters and absorbers;</text><text x="450" y="600" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">light, shiny surfaces are poor emitters and absorbers.</text>
</svg>