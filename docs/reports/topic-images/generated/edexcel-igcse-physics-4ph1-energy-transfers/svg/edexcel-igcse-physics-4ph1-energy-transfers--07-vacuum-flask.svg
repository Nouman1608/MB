<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 725" width="900" height="725" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="725" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How a vacuum flask keeps a drink hot</text>

<rect x="30" y="110" width="840" height="520" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="150" y="170" width="200" height="420" rx="16" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3" /><text x="250" y="610" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start"></text><rect x="175" y="215" width="150" height="345" rx="30" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" /><rect x="190" y="230" width="120" height="315" rx="22" fill="#dce9e7" stroke="#9aa5a5" stroke-width="5" /><rect x="177" y="217" width="146" height="341" rx="28" fill="none" stroke="#9aa5a5" stroke-width="4" /><rect x="205" y="180" width="90" height="60" rx="8" fill="#8a6d0d" stroke="#1e2a44" stroke-width="2.5" /><rect x="235" y="558" width="30" height="20" rx="0" fill="#efdfa8" stroke="#1e2a44" stroke-width="2" /><circle cx="315" cy="400" r="4" fill="#1e2a44"/><line x1="315" y1="400" x2="420" y2="400" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><text x="430" y="396" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Vacuum between the double walls</text><text x="430" y="418" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">no particles: no conduction or convection across it</text><circle cx="306" cy="300" r="4" fill="#1e2a44"/><line x1="306" y1="300" x2="420" y2="300" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><text x="430" y="296" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Silvered inner surfaces</text><text x="430" y="318" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">reflect infrared back: less radiation</text><circle cx="290" cy="200" r="4" fill="#1e2a44"/><line x1="290" y1="200" x2="420" y2="200" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><text x="430" y="196" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Plastic or cork stopper</text><text x="430" y="218" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">poor conductor; stops warm air rising out</text><circle cx="265" cy="570" r="4" fill="#1e2a44"/><line x1="265" y1="570" x2="420" y2="570" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><text x="430" y="566" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Insulating support and outer case</text><text x="430" y="588" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">reduce conduction to the outside</text><text x="250" y="400" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">hot</text><text x="250" y="420" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">drink</text><rect x="30" y="645" width="840" height="60" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="682" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Radiation can cross a vacuum: it is the silvering that reduces it.</text>
</svg>