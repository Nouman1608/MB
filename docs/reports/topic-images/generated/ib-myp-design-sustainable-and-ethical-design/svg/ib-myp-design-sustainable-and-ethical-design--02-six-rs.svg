<ellipse cx="450" cy="400" rx="265" ry="225" fill="none" stroke="#b5d3cf" stroke-width="12"/><rect x="310" y="133" width="280" height="84" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="167" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Rethink</text><text x="450" y="195" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="middle">a better way to meet the need?</text><rect x="539.4967320028762" y="245.5" width="280" height="84" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="679.4967320028762" y="279.5" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Refuse</text><text x="679.4967320028762" y="307.5" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="middle">leave out unneeded parts, packaging</text><rect x="539.4967320028762" y="470.5" width="280" height="84" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="679.4967320028762" y="504.5" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Reduce</text><text x="679.4967320028762" y="532.5" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="middle">less material, less energy in use</text><rect x="310" y="583" width="280" height="84" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="617" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Reuse</text><text x="450" y="645" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="middle">a second life, as is or repurposed</text><rect x="80.50326799712374" y="470.5" width="280" height="84" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="220.50326799712374" y="504.5" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Repair</text><text x="220.50326799712374" y="532.5" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="middle">parts easy to replace, ordinary tools</text><rect x="80.50326799712377" y="245.5" width="280" height="84" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="220.50326799712377" y="279.5" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Recycle</text><text x="220.50326799712377" y="307.5" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="middle">single, labelled, separable materials</text><rect x="340" y="350" width="220" height="100" rx="50" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="394" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Improve a</text><text x="450" y="420" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">design</text><text x="450" y="690" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="middle">Shaded: the three Rs that design for disassembly supports</text>
