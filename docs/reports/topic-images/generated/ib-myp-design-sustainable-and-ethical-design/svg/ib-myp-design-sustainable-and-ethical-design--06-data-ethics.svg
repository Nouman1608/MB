<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 735" width="900" height="735" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="735" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Five principles for users’ data</text>

<rect x="30" y="110" width="840" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="154" r="22" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><text x="76" y="161.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="116" y="146" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Data minimisation</text><text x="400" y="146" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">collect only what the solution needs</text><text x="116" y="176" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">homework planner: task and due date, not a home address</text><rect x="30" y="210" width="840" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="254" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="261.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="116" y="246" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Informed consent</text><text x="400" y="246" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">plain language, asked before collecting</text><text x="116" y="276" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">a clear choice, never a pre-ticked box</text><rect x="30" y="310" width="840" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="354" r="22" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><text x="76" y="361.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="116" y="346" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Security</text><text x="400" y="346" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">passwords, access control, encryption</text><text x="116" y="376" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">never store passwords as plain text</text><rect x="30" y="410" width="840" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="454" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="461.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="116" y="446" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Transparency and control</text><text x="400" y="446" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">users can see, correct and delete data</text><rect x="30" y="510" width="840" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="554" r="22" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><text x="76" y="561.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="116" y="546" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">No manipulation</text><text x="400" y="546" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">no dark patterns</text><text x="116" y="576" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">hidden cancel buttons, confusing wording, nagging pop-ups</text><rect x="30" y="615" width="840" height="96" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="55" y="650" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">Also check: the client’s rules on student data and laws such as GDPR;</text><text x="55" y="678" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">test with a varied group to catch algorithmic bias.</text>
</svg>