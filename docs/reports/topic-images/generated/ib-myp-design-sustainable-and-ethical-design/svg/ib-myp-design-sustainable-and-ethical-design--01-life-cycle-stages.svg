<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 645" width="900" height="645" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="645" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A product’s five life-cycle stages</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">impacts happen at every stage, not only when it is made</text>
<rect x="30" y="170" width="152" height="130" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><circle cx="106" cy="170" r="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="106" y="177.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="106" y="222" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Raw</text><text x="106" y="244" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">materials</text><text x="106" y="268" font-size="14.5" font-weight="400" fill="#1e2a44" text-anchor="middle">mining, felling,</text><text x="106" y="286" font-size="14.5" font-weight="400" fill="#1e2a44" text-anchor="middle">drilling</text><line x1="184" y1="235" x2="200" y2="235" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="202" y="170" width="152" height="130" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><circle cx="278" cy="170" r="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="278" y="177.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="278" y="222" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Manufacture</text><text x="278" y="268" font-size="14.5" font-weight="400" fill="#1e2a44" text-anchor="middle">shaping, joining,</text><text x="278" y="286" font-size="14.5" font-weight="400" fill="#1e2a44" text-anchor="middle">packaging</text><line x1="356" y1="235" x2="372" y2="235" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="374" y="170" width="152" height="130" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><circle cx="450" cy="170" r="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="177.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="450" y="222" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Distribution</text><text x="450" y="268" font-size="14.5" font-weight="400" fill="#1e2a44" text-anchor="middle">transport to</text><text x="450" y="286" font-size="14.5" font-weight="400" fill="#1e2a44" text-anchor="middle">shops, users</text><line x1="528" y1="235" x2="544" y2="235" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="546" y="170" width="152" height="130" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><circle cx="622" cy="170" r="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="622" y="177.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="622" y="222" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Use</text><text x="622" y="268" font-size="14.5" font-weight="400" fill="#1e2a44" text-anchor="middle">energy, water,</text><text x="622" y="286" font-size="14.5" font-weight="400" fill="#1e2a44" text-anchor="middle">repairs</text><line x1="700" y1="235" x2="716" y2="235" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="718" y="170" width="152" height="130" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><circle cx="794" cy="170" r="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="794" y="177.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="794" y="222" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">End of life</text><text x="794" y="268" font-size="14.5" font-weight="400" fill="#1e2a44" text-anchor="middle">reuse, recycle,</text><text x="794" y="286" font-size="14.5" font-weight="400" fill="#1e2a44" text-anchor="middle">landfill</text><path d="M140,308 L140,330 L760,330 L760,308" fill="none" stroke="#4a5568" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="450" y="358" font-size="17" font-weight="700" fill="#4a5568" text-anchor="middle">cradle to grave: look at all five stages</text><path d="M794,304 C794,570 106,570 106,310" fill="none" stroke="#2e6b62" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="12 8" marker-end="url(#ahT)"/><text x="450" y="420" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">cradle to cradle:</text><text x="450" y="446" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">end-of-life materials become new raw materials</text><rect x="30" y="530" width="840" height="90" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="566" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Designing for disassembly (screws and clips, not glue; no mixed-material</text><text x="450" y="592" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">laminates) makes reuse, repair and recycling possible.</text>
</svg>