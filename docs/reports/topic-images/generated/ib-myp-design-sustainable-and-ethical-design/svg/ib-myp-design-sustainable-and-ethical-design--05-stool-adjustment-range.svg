="465" y="454" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">mm</text><text x="100" y="226" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">knee</text><circle cx="198.75" cy="220" r="9" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="198.75" y="204" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">5th: 380</text><circle cx="398.4375" cy="220" r="9" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="398.4375" y="204" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">50th: 425</text><circle cx="598.125" cy="220" r="9" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="598.125" y="204" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">95th: 470</text><text x="100" y="306" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">seat</text><circle cx="309.6875" cy="300" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="309.6875" y="284" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">low: 405</text><circle cx="509.375" cy="300" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="509.375" y="284" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">fixed: 450</text><circle cx="709.0625" cy="300" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="709.0625" y="284" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">high: 495</text><rect x="309.6875" y="318" width="399.375" height="26" rx="6" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><text x="509.375" y="337" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">adjust 405 → 495 mm: 90 mm range</text><text x="100" y="262" font-size="15" font-weight="600" fill="#4a5568" text-anchor="end">+25 mm</text><rect x="30" y="490" width="410" height="130" rx="14" fill="#fbeee6" stroke="#b5602e" stroke-width="2.5"/><text x="52" y="526" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">✗ Fixed 450 mm (50th)</text><text x="52" y="556" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">small users’ feet dangle;</text><text x="52" y="578" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">large users’ knees are raised</text><rect x="460" y="490" width="410" height="130" rx="14" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.5"/><text x="482" y="526" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">✓ Adjustable 405–495 mm</text><text x="482" y="556" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">fits 5th to 95th percentile:</text><text x="482" y="578" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">90% of the target group</text><text x="450" y="650" font-size="16" font-weight="600" fill="#4a5568" text-anchor="middle">Clearance: 95th percentile. Reach: 5th percentile. Check the data match your audience.</text>
