<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 755" width="900" height="755" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="755" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Compare per functional unit</text>

<rect x="30" y="110" width="840" height="290" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="55" y="146" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Step 1: total energy (MJ)</text><text x="235" y="192" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="end">P: polypropylene,</text><text x="235" y="212" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="end">5 years</text><rect x="250" y="170" width="100.8" height="44" fill="#b5602e" stroke="#1e2a44" stroke-width="1.5"/><text x="300.4" y="198" font-size="15" font-weight="600" fill="#fff" text-anchor="middle">18</text><rect x="350.8" y="170" width="33.599999999999994" height="44" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.5"/><text x="367.6" y="198" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">6</text><rect x="384.4" y="170" width="11.2" height="44" fill="#f2e7b8" stroke="#1e2a44" stroke-width="1.5"/><rect x="395.59999999999997" y="170" width="84" height="44" fill="#b5d3cf" stroke="#1e2a44" stroke-width="1.5"/><text x="437.59999999999997" y="198" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">15</text><rect x="479.59999999999997" y="170" width="5.6" height="44" fill="#2e6b62" stroke="#1e2a44" stroke-width="1.5"/><text x="495.2" y="199" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">42</text><text x="235" y="272" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="end">S: stainless</text><text x="235" y="292" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="end">steel, 12 years</text><rect x="250" y="250" width="251.99999999999997" height="44" fill="#b5602e" stroke="#1e2a44" stroke-width="1.5"/><text x="376" y="278" font-size="15" font-weight="600" fill="#fff" text-anchor="middle">45</text><rect x="502" y="250" width="56" height="44" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.5"/><text x="530" y="278" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">10</text><rect x="558" y="250" width="16.799999999999997" height="44" fill="#f2e7b8" stroke="#1e2a44" stroke-width="1.5"/><rect x="574.8" y="250" width="201.6" height="44" fill="#b5d3cf" stroke="#1e2a44" stroke-width="1.5"/><text x="675.5999999999999" y="278" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">36</text><rect x="776.4" y="250" width="5.6" height="44" fill="#2e6b62" stroke="#1e2a44" stroke-width="1.5"/><text x="792" y="279" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">95</text><rect x="60" y="345" width="18" height="18" fill="#b5602e" stroke="#1e2a44" stroke-width="1.5"/><text x="86" y="360" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">raw materials</text><rect x="222" y="345" width="18" height="18" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.5"/><text x="248" y="360" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">manufacture</text><rect x="384" y="345" width="18" height="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="1.5"/><text x="410" y="360" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">distribution</text><rect x="546" y="345" width="18" height="18" fill="#b5d3cf" stroke="#1e2a44" stroke-width="1.5"/><text x="572" y="360" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">use (washing)</text><rect x="708" y="345" width="18" height="18" fill="#2e6b62" stroke="#1e2a44" stroke-width="1.5"/><text x="734" y="360" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">end of life</text><text x="450" y="388" font-size="15" font-weight="600" fill="#b5602e" text-anchor="middle">Raw materials is the biggest single stage for both designs.</text><rect x="30" y="420" width="840" height="200" rx="14" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.5"/><text x="55" y="456" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Step 2: per functional unit (one year of packed lunches)</text><text x="235" y="508" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="end">P</text><rect x="250" y="478" width="336" height="44" rx="4" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="598" y="507" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">42 ÷ 5 = 8.4 MJ per year</text><text x="235" y="574" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="end">S</text><rect x="250" y="544" width="316.8" height="44" rx="4" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="578.8" y="573" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">95 ÷ 12 ≈ 7.92 MJ per year</text><rect x="30" y="640" width="840" height="90" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="55" y="676" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">S wins per year only if it really lasts 12 years:</text><text x="55" y="704" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">a broken, unreplaceable lid wipes out the advantage, so repairability goes in the spec.</text>
</svg>