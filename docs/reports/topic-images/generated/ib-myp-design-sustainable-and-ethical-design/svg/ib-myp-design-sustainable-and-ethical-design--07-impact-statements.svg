<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 665" width="900" height="665" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="665" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Writing an impact statement for criterion D</text>

<rect x="30" y="110" width="840" height="92" rx="14" fill="#fbeee6" stroke="#b5602e" stroke-width="2.5"/><text x="52" y="146" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">✗ Weak</text><text x="52" y="176" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“My product is eco-friendly.”</text><rect x="30" y="222" width="840" height="300" rx="14" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.5"/><text x="52" y="258" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">✓ Stronger: specific and balanced</text><rect x="52" y="280" width="190" height="62" rx="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.2"/><text x="147" y="316.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">specific evidence</text><text x="262" y="308" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“The stand uses 70% recycled aluminium …”</text><rect x="52" y="358" width="190" height="62" rx="10" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.2"/><text x="147" y="394.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">effect on the user</text><text x="262" y="376" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“… four screws, so the user can replace a broken arm instead</text><text x="262" y="398" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">of buying a new stand.”</text><rect x="52" y="436" width="190" height="62" rx="10" fill="#f4d9c8" stroke="#1e2a44" stroke-width="2.2"/><text x="147" y="472.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">honest limit</text><text x="262" y="464" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“It still needs energy to recycle at end of life.”</text><rect x="30" y="542" width="840" height="100" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="55" y="578" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Test claims with real users</text><text x="55" y="608" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">across the size range for ergonomics; with users of different needs for digital work.</text>
</svg>