<rect width="900" height="615" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Practise at your confirmed level</text>

<text x="450" y="132" font-size="18" font-weight="600" fill="#4a5568" text-anchor="middle">Writing expectations at each level</text><rect x="30" y="150" width="270" height="230" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><rect x="32" y="152" width="266" height="52" rx="12" fill="#dce9e7"/><text x="165" y="186" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Emergent</text><text x="52" y="238" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">simple sentences</text><text x="52" y="264" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">basic vocabulary</text><text x="52" y="290" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">formulaic expressions</text><rect x="315" y="150" width="270" height="230" rx="14" fill="#fff" stroke="#8a6d0d" stroke-width="4"/><rect x="317" y="152" width="266" height="52" rx="12" fill="#b5d3cf"/><text x="450" y="186" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Capable</text><text x="337" y="238" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">range of sentence structures</text><text x="337" y="264" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">more precise vocabulary</text><text x="337" y="290" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">register awareness for</text><text x="337" y="316" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">audience and purpose</text><rect x="600" y="150" width="270" height="230" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><rect x="602" y="152" width="266" height="52" rx="12" fill="#d4b02e"/><text x="735" y="186" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Proficient</text><text x="622" y="238" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">complex, nuanced structures</text><text x="622" y="264" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">idiomatic language</text><text x="622" y="290" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">sophisticated audience</text><text x="622" y="316" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">awareness</text><text x="165" y="410" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">✗ under-reaching</text><text x="450" y="410" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">✓ target zone</text><text x="735" y="410" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">✗ over-reaching</text><text x="165" y="436" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">formulaic phrases</text><text x="165" y="455" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">underprepare you</text><text x="735" y="436" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">idiom beyond your secure</text><text x="735" y="455" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">range risks errors</text><rect x="30" y="490" width="840" height="100" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="55" y="526" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">A student assessed as capable should practise</text><text x="55" y="556" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">varied sentence structure and basic register awareness, not “harder is always better”.</text>
</svg>