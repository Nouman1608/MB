<rect width="900" height="640" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Balance revision across four equal criteria</text>

<rect x="30" y="110" width="560" height="230" rx="14" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.5"/><text x="55" y="146" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">One on-screen paper: revise together</text><rect x="55" y="166" width="160" height="150" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><circle cx="135" cy="206" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="135" y="214.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">A</text><text x="135" y="262" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Listening</text><text x="135" y="292" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">24 marks</text><rect x="231" y="166" width="160" height="150" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><circle cx="311" cy="206" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="311" y="214.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">B</text><text x="311" y="262" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Reading</text><text x="311" y="292" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">24 marks</text><rect x="407" y="166" width="160" height="150" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><circle cx="487" cy="206" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="487" y="214.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">D</text><text x="487" y="262" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Writing</text><text x="487" y="292" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">24 marks</text><rect x="610" y="110" width="260" height="230" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="635" y="146" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="start">Separate strand</text><rect x="635" y="166" width="210" height="150" rx="12" fill="#ffffff" stroke="#8a6d0d" stroke-width="2"/><circle cx="740" cy="206" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="740" y="214.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">C</text><text x="740" y="262" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Speaking</text><text x="740" y="292" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">24 marks</text><rect x="30" y="360" width="840" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="55" y="396" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Speaking routine</text><text x="55" y="426" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">rehearse spontaneous, interactive conversation under time pressure,</text><text x="55" y="448" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">not prepared monologues</text><rect x="30" y="510" width="840" height="104" rx="14" fill="#fbeee6" stroke="#b5602e" stroke-width="2.5"/><text x="52" y="546" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">✗ Common trap</text><text x="52" y="576" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">over-investing in writing: strong written work can mask a real gap in speaking</text><text x="52" y="598" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">preparation, because all four are weighted equally</text>
</svg>