<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="900" height="650" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="650" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Six phases, three reporting levels</text>

<rect x="30" y="110" width="840" height="230" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="55" y="146" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Six teaching phases</text><text x="290" y="146" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">day-to-day teaching and learning</text><rect x="60" y="170" width="118" height="64" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.2"/><text x="119" y="210" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Phase 1</text><line x1="180" y1="202" x2="191" y2="202" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="193" y="170" width="118" height="64" rx="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.2"/><text x="252" y="210" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Phase 2</text><line x1="313" y1="202" x2="324" y2="202" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="326" y="170" width="118" height="64" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.2"/><text x="385" y="210" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Phase 3</text><line x1="446" y1="202" x2="457" y2="202" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="459" y="170" width="118" height="64" rx="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.2"/><text x="518" y="210" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Phase 4</text><line x1="579" y1="202" x2="590" y2="202" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="592" y="170" width="118" height="64" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.2"/><text x="651" y="210" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Phase 5</text><line x1="712" y1="202" x2="723" y2="202" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="725" y="170" width="118" height="64" rx="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.2"/><text x="784" y="210" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Phase 6</text><text x="55" y="270" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">a continuum: each student moves through it individually, based on actual progress</text><text x="55" y="296" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">phases do not correspond to particular age groups or MYP year levels</text><rect x="330" y="352" width="240" height="40" rx="20" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="450" y="378" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">≠ not the same scale</text><rect x="30" y="404" width="840" height="220" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="55" y="440" font-size="21" font-weight="700" fill="#8a6d0d" text-anchor="start">Three reporting levels</text><text x="320" y="440" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">course results, where a school offers eAssessment</text><rect x="60" y="462" width="240" height="64" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.2"/><text x="180" y="501" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Emergent</text><rect x="330" y="462" width="240" height="64" rx="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.2"/><text x="450" y="501" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Capable</text><rect x="600" y="462" width="240" height="64" rx="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.2"/><text x="720" y="501" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Proficient</text><text x="55" y="560" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="start">coarser, summative: a comparable external result</text><text x="55" y="586" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="start">confirm your level with your teacher: year group does not decide it</text>
</svg>