<rect width="900" height="700" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Which pathway applies to you?</text>

<rect x="300" y="110" width="300" height="70" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="140" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Language Acquisition</text><text x="450" y="164" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">compulsory in every MYP year</text><line x1="450" y1="184" x2="450" y2="220" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><path d="M450,226 L560,286 L450,346 L340,286 Z" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="280" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">bilingual, studying</text><text x="450" y="299" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">multiple languages?</text><path d="M340,286 L230,286 L230,380" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><text x="260" y="276" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">no</text><path d="M560,286 L670,286 L670,380" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><text x="620" y="276" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="start">yes</text><rect x="60" y="386" width="340" height="120" rx="14" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.5"/><text x="230" y="426" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Language Acquisition</text><text x="230" y="450" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">proficiency-level structure</text><text x="230" y="474" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">applies</text><rect x="500" y="386" width="340" height="120" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="670" y="426" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">may follow the Language and</text><text x="670" y="450" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Literature subject group</text><text x="670" y="474" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">instead: confirm with school</text><line x1="230" y1="510" x2="400" y2="562" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><line x1="670" y1="510" x2="500" y2="562" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="150" y="566" width="600" height="110" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="600" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">DP pathways</text><text x="450" y="628" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="middle">DP Language Acquisition or DP Studies in Language and Literature:</text><text x="450" y="649" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="middle">audience-and-purpose writing and unscripted speaking transfer</text>
</svg>