<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 676" width="900" height="676" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="676" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Testing each sentence for unity</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Worked example 1: more vegetarian meals</text>
<rect x="30" y="122" width="840" height="84.84" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3" /><text x="48" y="156" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Controlling idea</text><text x="48" y="184.85" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“Our school canteen should offer more vegetarian meals.”</text><rect x="30" y="218" width="500" height="56" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="6 5"/><text x="44" y="251.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“Lunch is served between 12:00 and 1:00.”</text><rect x="546" y="228" width="76" height="36" rx="18" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5" /><text x="584" y="252" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle" xml:space="preserve">CUT</text><text x="640" y="242" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" xml:space="preserve">irrelevant to the claim</text><rect x="30" y="284" width="500" height="56" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5" /><text x="44" y="317.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“Vegetarian meals are often cheaper to make.”</text><rect x="546" y="294" width="76" height="36" rx="18" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="584" y="318" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">KEEP</text><text x="640" y="308" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" xml:space="preserve">a reason for the canteen</text><rect x="30" y="350" width="500" height="56" rx="14" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5" /><text x="44" y="383.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“Some students eat packed lunches.”</text><rect x="546" y="360" width="76" height="36" rx="18" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="584" y="384" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle" xml:space="preserve">LINK</text><text x="640" y="374" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" xml:space="preserve">relevant only if linked: poor</text><text x="640" y="393.8" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" xml:space="preserve">choice drives packed lunches</text><rect x="30" y="416" width="500" height="56" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5" /><text x="44" y="449.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“More students would buy lunch if there were more choice.”</text><rect x="546" y="426" width="76" height="36" rx="18" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="584" y="450" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">KEEP</text><text x="640" y="440" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" xml:space="preserve">a reason</text><rect x="30" y="482" width="500" height="56" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="6 5"/><text x="44" y="515.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“Kitchens must follow food-safety rules.”</text><rect x="546" y="492" width="76" height="36" rx="18" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5" /><text x="584" y="516" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle" xml:space="preserve">CUT</text><text x="640" y="506" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" xml:space="preserve">irrelevant unless it answers an</text><text x="640" y="525.8" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" xml:space="preserve">objection</text><rect x="30" y="556" width="840" height="104.63999999999999" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="48" y="590" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Reordered and linked</text><text x="48" y="618" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">problem (packed lunches, lost customers) → benefit (“those students” drawn back) → cost (“because”</text><text x="48" y="639.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">cheaper to make)</text>
</svg>