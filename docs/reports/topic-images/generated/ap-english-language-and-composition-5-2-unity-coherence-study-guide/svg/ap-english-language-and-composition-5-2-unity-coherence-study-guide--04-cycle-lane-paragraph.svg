<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 555" width="900" height="555" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="555" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Five loose facts or one linked claim</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Weak and strong paragraphs on a cycle lane</text>
<text x="30" y="134" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start" xml:space="preserve">Weak: all about cycling, none working together</text><rect x="30" y="150" width="229.97168" height="34" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2" /><text x="144.98584" y="172.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Bicycles are cheap to own.</text><rect x="271.97168" y="150" width="242.28224" height="34" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2" /><text x="393.1128" y="172.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">The town has a new bypass.</text><rect x="526.25392" y="150" width="327.05536" height="34" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2" /><text x="689.7816" y="172.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Many people like to cycle at weekends.</text><rect x="30" y="196" width="356.17552" height="34" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2" /><text x="208.08776" y="218.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">A cycle lane would be inexpensive to build.</text><rect x="398.17552" y="196" width="242.01856" height="34" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2" /><text x="519.1848" y="218.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Some cyclists wear helmets.</text><text x="30" y="260" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start" xml:space="preserve">Strong: one claim, each sentence picks up the last</text><rect x="30" y="276" width="600" height="62.24000000000001" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5" /><text x="42" y="301.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">A cycle lane would be an inexpensive way to reduce traffic on the high</text><text x="42" y="322.72" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">street.</text><text x="650" y="312.12" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start" xml:space="preserve">controlling claim</text><line x1="60" y1="339.24" x2="60" y2="351.24" stroke="#2e6b62" stroke-width="2.5" marker-end="url(#ahT)"/><rect x="30" y="352.24" width="600" height="41.120000000000005" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="42" y="377.84000000000003" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">A lane costs a small fraction of what a new road costs...</text><text x="650" y="377.8" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start" xml:space="preserve">cost</text><line x1="60" y1="394.36" x2="60" y2="406.36" stroke="#2e6b62" stroke-width="2.5" marker-end="url(#ahT)"/><rect x="30" y="407.36" width="600" height="41.120000000000005" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="42" y="432.96000000000004" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">Once the lane exists, short journeys... become safer by bicycle.</text><text x="650" y="432.92" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start" xml:space="preserve">effect on journeys</text><line x1="60" y1="449.48" x2="60" y2="461.48" stroke="#2e6b62" stroke-width="2.5" marker-end="url(#ahT)"/><rect x="30" y="462.48" width="600" height="62.24000000000001" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="42" y="488.08000000000004" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">As those journeys move to bicycles, the high street has fewer cars, and</text><text x="42" y="509.20000000000005" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">the bypass... has less to compensate for.</text><text x="650" y="498.6" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start" xml:space="preserve">effect on traffic; may lead to</text><text x="650" y="518.4" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start" xml:space="preserve">the next point</text>
</svg>