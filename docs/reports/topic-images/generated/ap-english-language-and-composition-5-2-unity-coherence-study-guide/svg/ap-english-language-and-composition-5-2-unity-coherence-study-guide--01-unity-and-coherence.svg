<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 677" width="900" height="677" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="677" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Unity and coherence</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Staying on one idea; holding together</text>
<rect x="30" y="122" width="405" height="290" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="232" y="156" font-size="22" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">Unity</text><line x1="232" y1="282" x2="110" y2="222" stroke="#2e6b62" stroke-width="2.5"/><circle cx="110" cy="222" r="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><line x1="232" y1="282" x2="354" y2="222" stroke="#2e6b62" stroke-width="2.5"/><circle cx="354" cy="222" r="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><line x1="232" y1="282" x2="100" y2="342" stroke="#2e6b62" stroke-width="2.5"/><circle cx="100" cy="342" r="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><line x1="232" y1="282" x2="364" y2="342" stroke="#2e6b62" stroke-width="2.5"/><circle cx="364" cy="342" r="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><circle cx="232" cy="282" r="42" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="232" y="278" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve"><tspan font-weight="700">claim</tspan></text><circle cx="380" cy="282" r="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="380" y="318" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle" xml:space="preserve">off-topic</text><text x="232" y="392" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" xml:space="preserve">every sentence serves one controlling claim</text><rect x="465" y="122" width="405" height="290" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="667" y="156" font-size="22" font-weight="700" fill="#8a6d0d" text-anchor="middle" xml:space="preserve">Coherence</text><circle cx="500" cy="302" r="22" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="500" y="308" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">S1</text><line x1="520" y1="292" x2="568" y2="252" stroke="#8a6d0d" stroke-width="2.5" marker-end="url(#ahO)"/><circle cx="590" cy="242" r="22" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="590" y="248" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">S2</text><line x1="610" y1="252" x2="658" y2="292" stroke="#8a6d0d" stroke-width="2.5" marker-end="url(#ahO)"/><circle cx="680" cy="302" r="22" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="680" y="308" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">S3</text><line x1="700" y1="292" x2="748" y2="252" stroke="#8a6d0d" stroke-width="2.5" marker-end="url(#ahO)"/><circle cx="770" cy="242" r="22" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="770" y="248" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">S4</text><text x="667" y="392" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" xml:space="preserve">each idea leads logically to the next</text><rect x="30" y="432" width="840" height="43.120000000000005" fill="#dce9e7"/><text x="42" y="457.12" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Level</text><text x="242" y="457.12" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">What links to what</text><text x="582" y="457.12" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">The reader asks</text><rect x="30" y="475.12" width="840" height="64.24000000000001" fill="#ffffff"/><text x="42" y="500.24" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Sentence</text><text x="242" y="500.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">one clause to the next</text><text x="582" y="500.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“How does this clause relate to the</text><text x="582" y="521.36" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">last?”</text><line x1="30" y1="475.12" x2="870" y2="475.12" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="539.36" width="840" height="43.120000000000005" fill="#ffffff"/><text x="42" y="564.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Paragraph</text><text x="242" y="564.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">one sentence to the next</text><text x="582" y="564.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“How does this sentence follow?”</text><line x1="30" y1="539.36" x2="870" y2="539.36" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="582.48" width="840" height="64.24000000000001" fill="#ffffff"/><text x="42" y="607.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Text</text><text x="242" y="607.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">one paragraph to the next</text><text x="582" y="607.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“Why does this paragraph come</text><text x="582" y="628.72" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">here?”</text><line x1="30" y1="582.48" x2="870" y2="582.48" stroke="#c9d6d4" stroke-width="1.5"/><line x1="230" y1="432" x2="230" y2="646.72" stroke="#c9d6d4" stroke-width="1.5"/><line x1="570" y1="432" x2="570" y2="646.72" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="432" width="840" height="214.72000000000003" rx="12" fill="none" stroke="#1e2a44" stroke-width="2.5" />
</svg>