<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How Paine holds it together</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">The American Crisis, 1776</text>
<rect x="30" y="122" width="270" height="120" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="48" y="164.72" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start" xml:space="preserve">crisis</text><text x="48" y="190.82999999999998" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“These are the times that try</text><text x="48" y="210.63" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">men’s souls.”</text><line x1="302" y1="182" x2="313" y2="182" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="315" y="122" width="270" height="120" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="333" y="164.72" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start" xml:space="preserve">the test of character</text><text x="333" y="190.82999999999998" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“...shrink from the service...; but</text><text x="333" y="210.63" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">he that stands it now...”</text><line x1="587" y1="182" x2="598" y2="182" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="600" y="122" width="270" height="120" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="618" y="164.72" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start" xml:space="preserve">the reward</text><text x="618" y="190.82999999999998" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“...yet... the harder the conflict,</text><text x="618" y="210.63" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">the more glorious the triumph.”</text><text x="30" y="276" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start" xml:space="preserve">Chain of difficulty</text><rect x="230" y="254" width="64.75556" height="35" rx="8" fill="#f6e3d8" stroke="#1e2a44" stroke-width="2" /><text x="262.37778000000003" y="277.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">times</text><rect x="318.75556" y="254" width="63.54737000000001" height="35" rx="8" fill="#f6e3d8" stroke="#1e2a44" stroke-width="2" /><text x="350.529245" y="277.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">crisis</text><rect x="406.30293" y="254" width="90.00498" height="35" rx="8" fill="#f6e3d8" stroke="#1e2a44" stroke-width="2" /><text x="451.30542" y="277.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">stands it</text><rect x="520.30791" y="254" width="81.53014" height="35" rx="8" fill="#f6e3d8" stroke="#1e2a44" stroke-width="2" /><text x="561.07298" y="277.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">conflict</text><text x="30" y="332" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start" xml:space="preserve">Chain of reward</text><rect x="230" y="310" width="86.39792" height="35" rx="8" fill="#dce9e7" stroke="#1e2a44" stroke-width="2" /><text x="273.19896" y="333.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">glorious</text><rect x="340.39792" y="310" width="83.29865000000001" height="35" rx="8" fill="#dce9e7" stroke="#1e2a44" stroke-width="2" /><text x="382.047245" y="333.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">triumph</text><rect x="30" y="378" width="840" height="74.24000000000001" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="450" y="409.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">The parallel <tspan font-weight="700">“the</tspan> <tspan font-weight="700">harder</tspan> <tspan font-weight="700">the</tspan> <tspan font-weight="700">conflict,</tspan> <tspan font-weight="700">the</tspan> <tspan font-weight="700">more</tspan> <tspan font-weight="700">glorious</tspan> <tspan font-weight="700">the</tspan> <tspan font-weight="700">triumph”</tspan> links the two chains; “but” and</text><text x="450" y="430.72" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">“yet” turn each clause toward the next idea.</text>
