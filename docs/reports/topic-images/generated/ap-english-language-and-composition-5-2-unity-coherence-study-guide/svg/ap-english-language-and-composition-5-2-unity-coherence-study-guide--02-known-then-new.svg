<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 542" width="900" height="542" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="542" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Known, then new</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Each sentence starts with what the last one ended on</text>
<rect x="30" y="122" width="116.83209000000001" height="50" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="88.416045" y="154" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">The town</text><rect x="152.83209" y="122" width="163.66310000000001" height="50" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="234.66364" y="154" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">built a bypass.</text><path d="M210.114175,174 C210.114175,198 208.866425,186 208.866425,208" fill="none" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><rect x="140" y="214" width="137.73284999999998" height="50" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="208.866425" y="246" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">The bypass</text><rect x="283.73285" y="214" width="360.57644" height="50" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="464.02107" y="246" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">diverted traffic from the high street.</text><path d="M409.934604,266 C409.934604,290 351.42112000000003,278 351.42112000000003,300" fill="none" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><rect x="250" y="306" width="202.84224000000003" height="50" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="351.42112000000003" y="338" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Without the traffic,</text><rect x="458.84224000000006" y="306" width="430.38263" height="50" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="674.0335550000001" y="338" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">the shops found it easier to attract walkers.</text><rect x="30" y="402" width="22" height="22" rx="4" fill="#dce9e7" stroke="#2e6b62" stroke-width="2" /><text x="62" y="419" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">known: already mentioned</text><rect x="330" y="402" width="22" height="22" rx="4" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2" /><text x="362" y="419" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">new: what this sentence adds</text><text x="30" y="454" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Other links:</text><rect x="150" y="434" width="165.83152" height="34" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2" /><text x="232.91576" y="456.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">logical relationship</text><rect x="325.83152" y="434" width="171.35232" height="34" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2" /><text x="411.50768" y="456.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">repeated key terms</text><rect x="507.18384000000003" y="434" width="212.05792" height="34" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2" /><text x="613.2128" y="456.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">synonyms and pronouns</text><rect x="150" y="478" width="151.37856000000002" height="34" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2" /><text x="225.68928" y="500.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">parallel structure</text><rect x="311.37856" y="478" width="146.79712" height="34" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2" /><text x="384.77711999999997" y="500.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">paragraph order</text>
</svg>