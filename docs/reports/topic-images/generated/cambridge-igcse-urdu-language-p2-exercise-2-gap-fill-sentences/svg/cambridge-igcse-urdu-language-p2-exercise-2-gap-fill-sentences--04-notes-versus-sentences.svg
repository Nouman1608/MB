<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 498" width="900" height="498" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="498" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Gaps in notes and gaps in sentences</text>

<rect x="30" y="110" width="410" height="270" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="146" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Notes</text><text x="50" y="174" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">heading, colon, gap</text><rect x="50" y="196" width="370" height="80" rx="10" fill="#f2e7b8"/><text x="400" y="246" font-size="26" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;کتابوں کی تعداد: ______&#x200F;</text><text x="50" y="312" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Write just the content: a number, a noun</text><text x="50" y="334" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">or a short list.</text><rect x="460" y="110" width="410" height="270" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="480" y="146" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Sentences</text><text x="480" y="174" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">your answer must read as part of it</text><rect x="480" y="196" width="370" height="80" rx="10" fill="#f2e7b8"/><text x="830" y="246" font-size="26" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;شادی کے ______ پر&#x200F;</text><text x="480" y="312" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Use the form that fits: the oblique</text><text x="480" y="334" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">plural after a postposition, the feminine</text><text x="480" y="356" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">form where needed.</text><rect x="30" y="400" width="840" height="70" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="54" y="443" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">Either way: write only what goes in the gap, not the whole sentence.</text>
</svg>