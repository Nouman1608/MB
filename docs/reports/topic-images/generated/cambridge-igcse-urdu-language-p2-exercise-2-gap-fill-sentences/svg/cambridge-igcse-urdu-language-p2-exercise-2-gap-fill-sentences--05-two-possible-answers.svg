<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">When the text gives two possible answers</text>

<rect x="30" y="110" width="840" height="196" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="148" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Then and now</text><text x="846" y="156" font-size="25" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;شروع میں چھ طالب علم تھے، اب ہم پچیس ہیں۔&#x200F;</text><text x="54" y="176" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">At first six students; now 25.</text><rect x="50" y="200" width="370" height="86" rx="10" fill="#fbf1ea" stroke="#b5602e" stroke-width="2"/><text x="78" y="250" font-size="26" font-weight="700" fill="#b5602e" text-anchor="middle">✗</text><text x="400" y="254" font-size="26" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;چھ&#x200F;</text><text x="100" y="248" font-size="15" font-weight="600" fill="#b5602e" text-anchor="start">then, not now</text><rect x="480" y="200" width="370" height="86" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="508" y="250" font-size="26" font-weight="700" fill="#2e6b62" text-anchor="middle">✓</text><text x="830" y="254" font-size="26" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;پچیس&#x200F;</text><text x="530" y="248" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start">gap about now</text><rect x="30" y="320" width="840" height="196" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="358" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">A list and an exception</text><text x="846" y="366" font-size="25" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;ہم سبزیاں اگاتے ہیں ... سردیوں میں گاجریں بھی۔&#x200F;</text><text x="54" y="386" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">We grow vegetables ... carrots too in winter.</text><rect x="50" y="410" width="370" height="86" rx="10" fill="#fbf1ea" stroke="#b5602e" stroke-width="2"/><text x="78" y="460" font-size="26" font-weight="700" fill="#b5602e" text-anchor="middle">✗</text><text x="400" y="464" font-size="26" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;سبزیاں&#x200F;</text><text x="100" y="458" font-size="15" font-weight="600" fill="#b5602e" text-anchor="start">the general list</text><rect x="480" y="410" width="370" height="86" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="508" y="460" font-size="26" font-weight="700" fill="#2e6b62" text-anchor="middle">✓</text><text x="830" y="464" font-size="26" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;گاجریں&#x200F;</text><text x="530" y="458" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start">gap about winter</text><rect x="30" y="530" width="840" height="80" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="566" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">A reason and a result:</text><text x="270" y="566" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">the gap before</text><text x="500" y="572" font-size="25" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;کی وجہ سے&#x200F;</text><text x="520" y="566" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">wants the cause, not the effect.</text><text x="450" y="650" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Underline the word in the printed sentence that says which detail is asked for</text><rect x="690" y="668" width="150" height="104" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="765" y="718" font-size="26" fill="#1e2a44" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;اب&#x200F;</text><text x="765" y="756" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">now</text><rect x="520" y="668" width="150" height="104" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="595" y="718" font-size="26" fill="#1e2a44" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;شروع میں&#x200F;</text><text x="595" y="756" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">at first</text><rect x="350" y="668" width="150" height="104" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="425" y="718" font-size="26" fill="#1e2a44" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;سردیوں میں&#x200F;</text><text x="425" y="756" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">in winter</text><rect x="180" y="668" width="150" height="104" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="255" y="718" font-size="26" fill="#1e2a44" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;اصل میں&#x200F;</text><text x="255" y="756" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">originally</text>
</svg>