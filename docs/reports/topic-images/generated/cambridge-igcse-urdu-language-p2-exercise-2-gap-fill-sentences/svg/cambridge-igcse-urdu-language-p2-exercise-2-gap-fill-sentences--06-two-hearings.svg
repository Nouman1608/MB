<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 708" width="900" height="708" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="708" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A routine for the two hearings</text>

<rect x="30" y="110" width="840" height="110" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="165" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="173.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="122" y="148" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">In the pause</text><text x="122" y="176" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Read every gap; underline time words and grammar clues; pencil the kind of answer</text><text x="122" y="199" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">beside each gap.</text><rect x="30" y="232" width="840" height="110" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="287" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="295.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="122" y="270" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">First hearing</text><text x="122" y="298" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Follow the sentences in order and jot what you catch. Missed one? Move on: the</text><text x="122" y="321" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">next topic will come.</text><rect x="30" y="354" width="840" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="402" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="410.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="122" y="392" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Second hearing</text><text x="122" y="420" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Fill the gaps you missed and confirm the then-and-now details.</text><rect x="30" y="462" width="840" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="510" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="518.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="122" y="500" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">After</text><text x="122" y="528" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Read each completed sentence: does the grammar fit?</text><rect x="30" y="580" width="840" height="100" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="54" y="616" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Time words to underline in the pause</text><text x="840" y="660" font-size="26" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;اب&#x200F;</text><text x="808.16" y="654" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">now</text><text x="690" y="660" font-size="26" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;پہلے&#x200F;</text><text x="636.32" y="654" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">before</text><text x="540" y="660" font-size="26" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;شروع میں&#x200F;</text><text x="442.64" y="654" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">at first</text>
</svg>