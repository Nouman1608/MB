<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1002" width="900" height="1002" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="1002" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: three gaps on a calligrapher</text>

<rect x="30" y="110" width="840" height="80" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="54" y="146" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The extract: a calligrapher talks about learning and his favourite work</text><text x="54" y="172" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">heard twice; three gaps follow its order</text><rect x="30" y="210" width="840" height="214" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="254" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">(a)</text><text x="846" y="260" font-size="25" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;اس نے خطاطی اپنے ______ سے سیکھی۔&#x200F;</text><text x="54" y="292" font-size="15" font-weight="600" fill="#8a6d0d" text-anchor="start">Predict: after اپنے, before سے: a person, probably a relative</text><rect x="450" y="312" width="410" height="94" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="476" y="364" font-size="26" font-weight="700" fill="#2e6b62" text-anchor="middle">✓</text><text x="850" y="366" font-size="27" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;دادا&#x200F;</text><text x="500" y="362" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start">grandfather</text><rect x="40" y="312" width="396" height="94" rx="10" fill="#fbf1ea" stroke="#b5602e" stroke-width="2"/><text x="66" y="350" font-size="26" font-weight="700" fill="#b5602e" text-anchor="middle">✗</text><text x="90" y="348" font-size="15" font-weight="600" fill="#b5602e" text-anchor="start">in that sentence, but does not fit</text><text x="420" y="388" font-size="25" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;بارہ سال کی عمر میں&#x200F;</text><rect x="30" y="438" width="840" height="214" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="482" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">(b)</text><text x="846" y="488" font-size="25" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;آج کل وہ روزانہ تقریباً ______ مشق کرتا ہے۔&#x200F;</text><text x="54" y="520" font-size="15" font-weight="600" fill="#8a6d0d" text-anchor="start">Predict: an amount of time, and the gap is about now</text><rect x="450" y="540" width="410" height="94" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="476" y="592" font-size="26" font-weight="700" fill="#2e6b62" text-anchor="middle">✓</text><text x="850" y="594" font-size="27" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;دو گھنٹے&#x200F;</text><text x="500" y="590" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start">two hours</text><rect x="40" y="540" width="396" height="94" rx="10" fill="#fbf1ea" stroke="#b5602e" stroke-width="2"/><text x="66" y="578" font-size="26" font-weight="700" fill="#b5602e" text-anchor="middle">✗</text><text x="90" y="576" font-size="15" font-weight="600" fill="#b5602e" text-anchor="start">what he did at first</text><text x="420" y="616" font-size="25" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;آدھا گھنٹہ&#x200F;</text><rect x="30" y="666" width="840" height="214" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="710" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">(c)</text><text x="846" y="716" font-size="25" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;اسے شادی کے ______ پر نام لکھنا سب سے زیادہ پسند ہے۔&#x200F;</text><text x="54" y="748" font-size="15" font-weight="600" fill="#8a6d0d" text-anchor="start">Predict: a postposition either side: an oblique noun</text><rect x="40" y="768" width="820" height="94" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="66" y="820" font-size="26" font-weight="700" fill="#2e6b62" text-anchor="middle">✓</text><text x="850" y="822" font-size="27" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;دعوت ناموں&#x200F;</text><text x="90" y="818" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start">wedding invitations</text><rect x="30" y="894" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="54" y="928" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">L2 too: his reason, a feeling of sharing in people's happiness, could also be a gap.</text><text x="54" y="954" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Some gaps are about how a speaker feels or thinks, not only facts.</text>
</svg>