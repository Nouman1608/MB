<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1032" width="900" height="1032" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="1032" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: three gaps on a calligrapher</text>

<rect x="30" y="110" width="840" height="80" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="54" y="146" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The extract: a calligrapher talks about learning and his favourite work</text><text x="54" y="172" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">heard twice; three gaps follow its order</text><rect x="30" y="210" width="840" height="224" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="260" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">(a)</text><text x="846" y="270" font-size="25" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;اس نے خطاطی اپنے ______ سے سیکھی۔&#x200F;</text><text x="54" y="302" font-size="15" font-weight="600" fill="#8a6d0d" text-anchor="start">Predict: a person, probably a relative (the gap comes before "learnt from")</text><rect x="450" y="322" width="410" height="94" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="476" y="374" font-size="26" font-weight="700" fill="#2e6b62" text-anchor="middle">✓</text><text x="850" y="376" font-size="27" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;دادا&#x200F;</text><text x="500" y="372" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start">grandfather</text><rect x="40" y="322" width="396" height="94" rx="10" fill="#fbf1ea" stroke="#b5602e" stroke-width="2"/><text x="66" y="360" font-size="26" font-weight="700" fill="#b5602e" text-anchor="middle">✗</text><text x="90" y="358" font-size="15" font-weight="600" fill="#b5602e" text-anchor="start">in that sentence, but does not fit</text><text x="420" y="398" font-size="25" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;بارہ سال کی عمر میں&#x200F;</text><rect x="30" y="448" width="840" height="224" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="498" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">(b)</text><text x="846" y="508" font-size="25" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;آج کل وہ روزانہ تقریباً ______ مشق کرتا ہے۔&#x200F;</text><text x="54" y="540" font-size="15" font-weight="600" fill="#8a6d0d" text-anchor="start">Predict: an amount of time, and the gap is about now</text><rect x="450" y="560" width="410" height="94" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="476" y="612" font-size="26" font-weight="700" fill="#2e6b62" text-anchor="middle">✓</text><text x="850" y="614" font-size="27" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;دو گھنٹے&#x200F;</text><text x="500" y="610" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start">two hours</text><rect x="40" y="560" width="396" height="94" rx="10" fill="#fbf1ea" stroke="#b5602e" stroke-width="2"/><text x="66" y="598" font-size="26" font-weight="700" fill="#b5602e" text-anchor="middle">✗</text><text x="90" y="596" font-size="15" font-weight="600" fill="#b5602e" text-anchor="start">what he did at first</text><text x="420" y="636" font-size="25" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;آدھا گھنٹہ&#x200F;</text><rect x="30" y="686" width="840" height="224" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="736" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">(c)</text><text x="846" y="746" font-size="25" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;اسے شادی کے ______ پر نام لکھنا سب سے زیادہ پسند ہے۔&#x200F;</text><text x="54" y="778" font-size="15" font-weight="600" fill="#8a6d0d" text-anchor="start">Predict: a postposition either side: an oblique noun</text><rect x="40" y="798" width="820" height="94" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="66" y="850" font-size="26" font-weight="700" fill="#2e6b62" text-anchor="middle">✓</text><text x="850" y="852" font-size="27" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;دعوت ناموں&#x200F;</text><text x="90" y="848" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start">wedding invitations</text><rect x="30" y="924" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="54" y="958" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">L2 too: his reason, a feeling of sharing in people's happiness, could also be a gap.</text><text x="54" y="984" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Some gaps are about how a speaker feels or thinks, not only facts.</text>
</svg>