<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 676" width="900" height="676" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="676" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What you hear and what is printed</text>

<rect x="30" y="110" width="840" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="154" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Heard</text><text x="54" y="182" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">We started this club two years ago.</text><text x="846" y="172" font-size="28" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;ہم نے یہ کلب دو سال پہلے شروع کیا تھا۔&#x200F;</text><line x1="450" y1="214" x2="450" y2="238" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="242" width="840" height="100" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="54" y="286" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Printed</text><text x="54" y="314" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">The club began ___ ago.</text><text x="846" y="304" font-size="28" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;کلب ______ پہلے شروع ہوا۔&#x200F;</text><line x1="450" y1="346" x2="450" y2="370" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="374" width="840" height="100" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="54" y="418" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Answer</text><text x="54" y="446" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">two years</text><text x="846" y="436" font-size="28" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;دو سال&#x200F;</text><rect x="30" y="498" width="840" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="534" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The words around the gap are reworded; the gap content is not</text><text x="54" y="584" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">active</text><text x="320" y="590" font-size="25" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;شروع کیا تھا&#x200F;</text><line x1="340" y1="584" x2="390" y2="584" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="560" y="590" font-size="25" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;شروع ہوا&#x200F;</text><text x="580" y="584" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">intransitive</text><text x="54" y="628" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">So do not wait for the exact printed sentence to be read out.</text>
</svg>