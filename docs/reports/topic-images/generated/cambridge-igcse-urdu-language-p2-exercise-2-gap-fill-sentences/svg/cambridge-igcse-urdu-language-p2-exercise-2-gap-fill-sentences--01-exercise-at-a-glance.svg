<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Paper 2 Exercise 2 at a glance</text>

<rect x="30" y="110" width="195" height="124" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="127.5" y="154" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">8 marks</text><text x="127.5" y="184" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">gaps in notes or</text><text x="127.5" y="205" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">sentences</text><rect x="245" y="110" width="195" height="124" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="342.5" y="154" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">1 longer text</text><text x="342.5" y="184" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">heard twice, with</text><text x="342.5" y="205" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">pauses</text><rect x="460" y="110" width="195" height="124" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="557.5" y="154" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">L1 and L2</text><text x="557.5" y="184" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">facts, and ideas or</text><text x="557.5" y="205" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">attitudes</text><rect x="675" y="110" width="195" height="124" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="772.5" y="154" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">1-3 words</text><text x="772.5" y="184" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">usual length of a</text><text x="772.5" y="205" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">gap</text><text x="450" y="284" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">The longer text may be a</text><rect x="30" y="304" width="195" height="56" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="127" y="339" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">conversation</text><rect x="245" y="304" width="195" height="56" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="342" y="339" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">interview</text><rect x="460" y="304" width="195" height="56" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="557" y="339" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">monologue</text><rect x="675" y="304" width="195" height="56" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="772" y="339" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">formal talk</text><rect x="30" y="384" width="840" height="150" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="54" y="420" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The gaps follow the order of the recording</text><rect x="70" y="440" width="110" height="34" rx="6" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><line x1="100" y1="466" x2="150" y2="466" stroke="#1e2a44" stroke-width="2.5"/><line x1="182" y1="457" x2="198" y2="457" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="202" y="440" width="110" height="34" rx="6" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><line x1="232" y1="466" x2="282" y2="466" stroke="#1e2a44" stroke-width="2.5"/><line x1="314" y1="457" x2="330" y2="457" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="334" y="440" width="110" height="34" rx="6" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><line x1="364" y1="466" x2="414" y2="466" stroke="#1e2a44" stroke-width="2.5"/><line x1="446" y1="457" x2="462" y2="457" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="466" y="440" width="110" height="34" rx="6" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><line x1="496" y1="466" x2="546" y2="466" stroke="#1e2a44" stroke-