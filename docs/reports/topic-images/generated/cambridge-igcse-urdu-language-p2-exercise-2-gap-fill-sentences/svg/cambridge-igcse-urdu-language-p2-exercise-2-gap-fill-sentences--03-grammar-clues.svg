<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1022" width="900" height="1022" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="1022" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Let the grammar predict the gap</text>

<rect x="30" y="110" width="840" height="792" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,160 L31.25,124 Q31.25,111.25 44,111.25 L856,111.25 Q868.75,111.25 868.75,124 L868.75,160 Z" fill="#b5d3cf"/><text x="344" y="142" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Clue around the gap</text><text x="376" y="142" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">What it tells you</text><line x1="360" y1="110" x2="360" y2="902" stroke="#c9d6d4" stroke-width="2"/><text x="854" y="142" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Example answer</text><line x1="640" y1="110" x2="640" y2="902" stroke="#c9d6d4" stroke-width="2"/><line x1="30" y1="160" x2="870" y2="160" stroke="#c9d6d4" stroke-width="2"/><text x="344" y="218.8" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;ہوتی ہے، جاتی ہیں&#x200F;</text><text x="344" y="252" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">a feminine verb</text><text x="376" y="194.65" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">the missing word is</text><text x="376" y="217.65" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">feminine, and plural with</text><text x="376" y="240.65" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">the plural verb</text><text x="854" y="218.8" font-size="24" fill="#2e6b62" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;چوڑیاں&#x200F;</text><text x="854" y="252" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">bangles</text><line x1="30" y1="266" x2="870" y2="266" stroke="#c9d6d4" stroke-width="2"/><text x="344" y="324.8" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;خریدے جاتے ہیں&#x200F;</text><text x="344" y="358" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">a masculine plural verb</text><text x="376" y="323.65" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">a masculine plural noun</text><text x="854" y="324.8" font-size="24" fill="#2e6b62" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;بیج، پودے&#x200F;</text><text x="854" y="358" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">seeds, plants</text><line x1="30" y1="372" x2="870" y2="372" stroke="#c9d6d4" stroke-width="2"/><text x="344" y="441.8" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;ہر ______ کو&#x200F;</text><text x="376" y="429.65" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">a day or time unit</text><text x="854" y="430.8" font-size="24" fill="#2e6b62" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;منگل&#x200F;</text><text x="854" y="464" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">Tuesday</text><line x1="30" y1="478" x2="870" y2="478" stroke="#c9d6d4" stroke-width="2"/><text x="344" y="547.8" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;کی تعداد ______ ہے&#x200F;</text><text x="376" y="535.65" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">a number</text><text x="854" y="536.8" font-size="24" fill="#2e6b62" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;پچیس&#x200F;</text><text x="854" y="570" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">25</text><line x1="30" y1="584" x2="870" y2="584" stroke="#c9d6d4" stroke-width="2"/><text x="344" y="653.8" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;______ کی وجہ سے&#x200F;</text><text x="376" y="641.65" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">a reason: a noun</text><text x="854" y="642.8" font-size="24" fill="#2e6b62" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;بارش&#x200F;</text><text x="854" y="676" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">rain</text><line x1="30" y1="690" x2="870" y2="690" stroke="#c9d6d4" stroke-width="2"/><text x="344" y="748.8" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;کے ... پر / کے ... میں&#x200F;</text><text x="344" y="782" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">around the gap</text><text x="376" y="747.65" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">a noun in the oblique form</text><text x="854" y="748.8" font-size="24" fill="#2e6b62" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;دعوت ناموں&#x200F;</text><text x="854" y="782" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">invitations</text><line x1="30" y1="796" x2="870" y2="796" stroke="#c9d6d4" stroke-width="2"/><text x="344" y="865.8" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;ایک مشہور ______ ... سنائیں گی&#x200F;</text><text x="376" y="853.65" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">a feminine person</text><text x="854" y="854.8" font-size="24" fill="#2e6b62" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;شاعرہ&#x200F;</text><text x="854" y="888" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">poet (woman)</text><rect x="30" y="924" width="840" height="70" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="54" y="967" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The same clue checks your answer: a feminine plural verb needs a feminine plural noun.</text>
</svg>