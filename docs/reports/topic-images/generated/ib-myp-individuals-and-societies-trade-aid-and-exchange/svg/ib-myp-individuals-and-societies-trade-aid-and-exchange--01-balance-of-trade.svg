<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 614" width="900" height="614" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="614" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Balance of trade: surplus or deficit?</text>

<rect x="30" y="110" width="840" height="400" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="148" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">Norland (fictional), this year, billions of dollars</text><text x="200" y="215" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="end">Exports</text><rect x="220" y="180" width="480" height="56" rx="6" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.2"/><text x="710" y="216" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">48 bn</text><text x="200" y="295" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="end">Imports</text><rect x="220" y="260" width="550" height="56" rx="6" fill="#efcdb8" stroke="#b5602e" stroke-width="2.2"/><text x="780" y="296" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">55 bn</text><line x1="700" y1="240" x2="700" y2="345" stroke="#b5602e" stroke-width="2" stroke-dasharray="5 4"/><line x1="770" y1="320" x2="770" y2="345" stroke="#b5602e" stroke-width="2" stroke-dasharray="5 4"/><path d="M700,345 L770,345" stroke="#b5602e" stroke-width="4"/><text x="735" y="372" font-size="20" font-weight="700" fill="#b5602e" text-anchor="middle">−7 bn</text><text x="450" y="420" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Balance of trade = exports − imports = 48 − 55 = −7 bn: a trade deficit</text><text x="450" y="455" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Exports rose from 40 bn last year: (48 − 40) ÷ 40 × 100 = 20%</text><rect x="30" y="530" width="840" height="53.760000000000005" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="562.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Keep the minus sign: “7 bn” alone hides whether it is a deficit.</text>
</svg>