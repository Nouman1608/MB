<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="900" height="650" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="650" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The Columbian Exchange</text>

<rect x="30" y="140" width="300" height="380" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="180" y="180.8" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">The Americas</text><rect x="570" y="140" width="300" height="380" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.2"/><text x="720" y="178.9" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Europe, Africa and</text><text x="720" y="207.94" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Asia</text><line x1="335" y1="250" x2="562" y2="250" stroke="#8a6d0d" stroke-width="6" marker-end="url(#ahO)"/><text x="450" y="220" font-size="16" font-weight="600" fill="#4a5568" text-anchor="middle">after 1492</text><text x="450" y="285" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">maize, potatoes,</text><text x="450" y="307" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">tomatoes, cacao</text><line x1="565" y1="380" x2="338" y2="380" stroke="#2e6b62" stroke-width="6" marker-end="url(#ahT)"/><text x="450" y="415" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">horses, cattle,</text><text x="450" y="437" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">wheat, sugar cane</text><line x1="565" y1="480" x2="338" y2="480" stroke="#b5602e" stroke-width="6" marker-end="url(#ahR)"/><text x="450" y="470" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">smallpox, measles</text><text x="180" y="430" font-size="16" font-weight="600" fill="#b5602e" text-anchor="middle">very large numbers</text><text x="180" y="451" font-size="16" font-weight="600" fill="#b5602e" text-anchor="middle">of Indigenous people</text><text x="180" y="472" font-size="16" font-weight="600" fill="#b5602e" text-anchor="middle">killed by disease</text><rect x="30" y="545" width="840" height="74.88" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="576.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Trade moves more than goods: crops, animals, ideas and diseases. Globalization long before</text><text x="450" y="598.59" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">trade blocs.</text>
</svg>