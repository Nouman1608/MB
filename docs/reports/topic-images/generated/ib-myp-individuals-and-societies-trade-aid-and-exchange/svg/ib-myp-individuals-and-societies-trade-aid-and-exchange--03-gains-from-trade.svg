<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Specialise, then trade: both gain</text>

<rect x="30" y="110" width="410" height="440" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="235" y="148" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">Arlen</text><text x="140" y="210" font-size="17" font-weight="700" fill="#4a5568" text-anchor="middle">before trade</text><rect x="50" y="238" width="80" height="192" rx="4" fill="#c79a62" stroke="#8a6d0d" stroke-width="2"/><text x="90" y="230" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">60</text><rect x="150" y="334" width="80" height="96" rx="4" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><text x="190" y="326" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">30</text><text x="340" y="210" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">after trade</text><rect x="250" y="238" width="80" height="192" rx="4" fill="#c79a62" stroke="#8a6d0d" stroke-width="2"/><text x="290" y="230" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">60</text><rect x="350" y="321.2" width="80" height="108.80000000000001" rx="4" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><text x="390" y="313.2" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">34</text><rect x="460" y="110" width="410" height="440" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="665" y="148" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">Belmar</text><text x="570" y="210" font-size="17" font-weight="700" fill="#4a5568" text-anchor="middle">before trade</text><rect x="480" y="366" width="80" height="64" rx="4" fill="#c79a62" stroke="#8a6d0d" stroke-width="2"/><text x="520" y="358" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">20</text><rect x="580" y="366" width="80" height="64" rx="4" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><text x="620" y="358" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">20</text><text x="770" y="210" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">after trade</text><rect x="680" y="353.2" width="80" height="76.80000000000001" rx="4" fill="#c79a62" stroke="#8a6d0d" stroke-width="2"/><text x="720" y="345.2" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">24</text><rect x="780" y="353.2" width="80" height="76.80000000000001" rx="4" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><text x="820" y="345.2" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">24</text><line x1="50" y1="430" x2="430" y2="430" stroke="#1e2a44" stroke-width="2"/><line x1="480" y1="430" x2="860" y2="430" stroke="#1e2a44" stroke-width="2"/><rect x="190" y="470" width="20" height="18" fill="#c79a62" stroke="#8a6d0d" stroke-width="2"/><text x="218" y="485" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">coffee (sacks)</text><rect x="560" y="470" width="20" height="18" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><text x="588" y="485" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">textiles (rolls)</text><text x="450" y="580" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Belmar swaps 16 rolls for 24 sacks: 1 roll = 1.5 sacks, between the opportunity costs of 1 and 2</text><rect x="30" y="605" width="840" height="74.88" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="636.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Total output rises from 80 coffee and 50 textiles to 84 and 58. Both countries end up with</text><text x="450" y="658.59" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">more.</text>
</svg>