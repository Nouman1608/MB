<rect width="900" height="706" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Comparative advantage</text>

<rect x="30" y="110" width="840" height="75.52000000000001" rx="12" fill="#2e6b62"/><text x="42" y="138.2" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">Per worker per</text><text x="42" y="161.95999999999998" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">day</text><text x="222" y="150.07999999999998" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">Coffee (sacks)</text><text x="372" y="138.2" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">Textiles</text><text x="372" y="161.95999999999998" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">(rolls)</text><text x="532" y="150.07999999999998" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">Opportunity cost</text><rect x="30" y="181.52" width="840" height="67.52000000000001" fill="#ffffff"/><text x="42" y="208.82000000000002" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Arlen</text><text x="222" y="208.82000000000002" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">12</text><text x="372" y="208.82000000000002" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">6</text><text x="532" y="208.82000000000002" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">1 roll costs 2 sacks; 1 sack costs</text><text x="532" y="232.58" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">0.5 rolls</text><rect x="30" y="249.04000000000002" width="840" height="67.52000000000001" fill="#f7f9f9"/><text x="42" y="276.34000000000003" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Belmar</text><text x="222" y="276.34000000000003" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">4</text><text x="372" y="276.34000000000003" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">4</text><text x="532" y="276.34000000000003" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">1 roll costs 1 sack; 1 sack costs 1</text><text x="532" y="300.1" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">roll</text><line x1="30" y1="249.04000000000002" x2="870" y2="249.04000000000002" stroke="#c9d6d4" stroke-width="1.5"/><line x1="210" y1="181.52" x2="210" y2="316.56000000000006" stroke="#c9d6d4" stroke-width="1.5"/><line x1="360" y1="181.52" x2="360" y2="316.56000000000006" stroke="#c9d6d4" stroke-width="1.5"/><line x1="520" y1="181.52" x2="520" y2="316.56000000000006" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="110" width="840" height="206.56000000000006" rx="12" fill="none" stroke="#1e2a44" stroke-width="2.2"/><rect x="30" y="340.56000000000006" width="840" height="70" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="450" y="384.11000000000007" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Absolute advantage: Arlen makes more of BOTH goods</text><rect x="30" y="430.56000000000006" width="410" height="150" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="48" y="490.01000000000005" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Arlen → coffee</text><text x="48" y="517.13" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">gives up 0.5 rolls per sack, against Belmar’s</text><text x="48" y="538.25" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">1 roll: lower opportunity cost</text><rect x="460" y="430.56000000000006" width="410" height="150" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.2"/><text x="478" y="490.01000000000005" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Belmar → textiles</text><text x="478" y="517.13" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">gives up 1 sack per roll, against Arlen’s 2</text><text x="478" y="538.25" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">sacks: lower opportunity cost</text><rect x="30" y="600.5600000000001" width="840" height="74.88" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="631.71" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Specialise by comparative advantage (Ricardo, 1817), even when one country is better at</text><text x="450" y="654.1500000000001" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">everything.</text>
</svg>