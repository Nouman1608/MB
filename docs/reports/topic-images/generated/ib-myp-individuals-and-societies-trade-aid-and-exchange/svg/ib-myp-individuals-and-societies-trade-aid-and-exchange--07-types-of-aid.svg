<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 855" width="900" height="855" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="855" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Types of aid</text>

<rect x="330" y="115" width="240" height="64" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.2"/><text x="450" y="156.4" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Aid</text><line x1="450" y1="183" x2="165" y2="226" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="30" y="232" width="270" height="130" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="165" y="272.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Bilateral</text><text x="165" y="297.85" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">government to government</text><text x="165" y="317.65000000000003" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">e.g. a donor funds a road</text><text x="165" y="337.45000000000005" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">abroad</text><line x1="450" y1="183" x2="450" y2="226" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="315" y="232" width="270" height="130" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="450" y="272.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Multilateral</text><text x="450" y="297.85" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">donors pay an international</text><text x="450" y="317.65000000000003" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">body</text><text x="450" y="337.45000000000005" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">e.g. World Bank; UN agencies</text><line x1="450" y1="183" x2="735" y2="226" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="600" y="232" width="270" height="130" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="735" y="272.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Voluntary (NGO)</text><text x="735" y="297.85" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">charities spend public</text><text x="735" y="317.65000000000003" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">donations</text><text x="735" y="337.45000000000005" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">e.g. village wells</text><text x="30" y="396" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Also classified by time, conditions and approach</text><rect x="30" y="408" width="395" height="104" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="48" y="454.6" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Short-term (emergency)</text><text x="48" y="480.40000000000003" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">relief after the Indian Ocean tsunami, 2004</text><text x="450" y="466" font-size="26" font-weight="700" fill="#4a5568" text-anchor="middle">↔</text><rect x="475" y="408" width="395" height="104" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="493" y="454.6" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Long-term (development)</text><text x="493" y="480.40000000000003" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">schools, clinics, farm training</text><rect x="30" y="528" width="395" height="104" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="48" y="574.6" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Top-down</text><text x="48" y="600.4" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">large government projects, such as a dam</text><text x="450" y="586" font-size="26" font-weight="700" fill="#4a5568" text-anchor="middle">↔</text><rect x="475" y="528" width="395" height="104" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="493" y="574.6" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Bottom-up</text><text x="493" y="600.4" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">small projects run with local people</text><rect x="30" y="656" width="840" height="76" rx="12" fill="#fbeee6" stroke="#b5602e" stroke-width="2.2"/><text x="48" y="691.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Tied aid</text><text x="48" y="716.9" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">must be spent on the donor’s goods or services, e.g. a loan that must buy the donor’s machinery</text><rect x="30" y="752" width="840" height="72.24000000000001" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="782.2" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">UN target (1970): donors give 0.7% of GNI. Does aid work? It depends on type, purpose and</text><text x="450" y="803.32" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">management.</text>
</svg>