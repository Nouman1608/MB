<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 733" width="900" height="733" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="733" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Levels of economic integration</text>

<rect x="30" y="520" width="840" height="104" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.2"/><text x="48" y="566.5" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Free trade area</text><text x="48" y="593.62" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">no tariffs between members; own tariffs on outsiders</text><text x="850" y="580" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="end" font-style="italic">USMCA; AfCFTA</text><rect x="90" y="400" width="780" height="104" rx="12" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.2"/><text x="108" y="446.5" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Customs union</text><text x="108" y="473.62" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">+ common external tariff</text><text x="850" y="460" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="end" font-style="italic">Mercosur (1991)</text><rect x="150" y="280" width="720" height="104" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="168" y="326.5" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Common market</text><text x="168" y="353.62" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">+ free movement of labour and capital</text><text x="850" y="340" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="end" font-style="italic">EU single market</text><rect x="210" y="160" width="660" height="104" rx="12" fill="#d4b02e" stroke="#8a6d0d" stroke-width="2.2"/><text x="228" y="206.5" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Economic union</text><text x="228" y="233.62" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">+ shared economic policies, sometimes one currency</text><text x="850" y="220" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="end" font-style="italic">euro area</text><line x1="890" y1="610" x2="890" y2="150" stroke="#1e2a44" stroke-width="0"/><text x="45" y="140" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">more integration ↑</text><rect x="30" y="650" width="840" height="52.44" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="681.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Each level adds to the one below. A free trade area has no common external tariff.</text>
</svg>