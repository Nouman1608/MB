<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" width="900" height="660" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="660" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Fair trade: who gets the money?</text>

<rect x="30" y="110" width="840" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="148" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">A bag of coffee in a fictional supermarket</text><text x="135" y="205" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">Conventional</text><text x="135" y="227" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">8.00 dollars</text><rect x="150" y="175" width="33.33333333333333" height="64" rx="4" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><rect x="183.33333333333331" y="175" width="633.3333333333333" height="64" rx="4" fill="#eef0f0" stroke="#c9d6d4" stroke-width="2"/><text x="197.33333333333331" y="215" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">processing, shipping, shops, tax</text><text x="152" y="268" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">grower 0.40 = 5.0%</text><text x="135" y="330" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">Fair trade</text><text x="135" y="352" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">8.40 dollars</text><rect x="150" y="300" width="53.33333333333333" height="64" rx="4" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><rect x="203.33333333333331" y="300" width="646.6666666666666" height="64" rx="4" fill="#eef0f0" stroke="#c9d6d4" stroke-width="2"/><text x="217.33333333333331" y="340" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">processing, shipping, shops, tax</text><text x="152" y="393" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">grower 0.64 = 7.6%</text><rect x="30" y="460" width="410" height="170" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="48" y="496.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">How Fairtrade works</text><text x="48" y="522.51" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">• a minimum price, even when world prices fall</text><text x="48" y="542.97" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">• a Fairtrade Premium for projects producers</text><text x="48" y="563.43" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">choose</text><text x="48" y="583.89" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">• standards on work, child labour, environment</text><rect x="460" y="460" width="410" height="170" rx="12" fill="#fbeee6" stroke="#b5602e" stroke-width="2.2"/><text x="478" y="496.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Critics say</text><text x="478" y="522.51" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">• only a small share of trade is certified</text><text x="478" y="542.97" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">• certification costs money the poorest may lack</text><text x="478" y="563.43" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">• a guaranteed price may keep farmers in a crop</text>
</svg>