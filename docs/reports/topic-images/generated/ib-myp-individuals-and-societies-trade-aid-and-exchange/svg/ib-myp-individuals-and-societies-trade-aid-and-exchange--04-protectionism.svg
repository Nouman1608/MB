<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 629" width="900" height="629" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="629" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Free trade or protection?</text>

<rect x="30" y="115" width="270" height="190" rx="12" fill="#fbeee6" stroke="#b5602e" stroke-width="2.2"/><text x="48" y="152.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Tariff</text><text x="48" y="180.07" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">a tax on imports</text><text x="48" y="201.19" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"></text><text x="48" y="222.31" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">imported bicycle 200 dollars</text><text x="48" y="243.43" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">+ 15% = 200 × 1.15 = 230</text><text x="48" y="264.55" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">dollars</text><rect x="315" y="115" width="270" height="190" rx="12" fill="#fbeee6" stroke="#b5602e" stroke-width="2.2"/><text x="333" y="152.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Quota</text><text x="333" y="180.07" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">a limit on the quantity that</text><text x="333" y="201.19" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">may be imported</text><rect x="600" y="115" width="270" height="190" rx="12" fill="#fbeee6" stroke="#b5602e" stroke-width="2.2"/><text x="618" y="152.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Subsidy</text><text x="618" y="180.07" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">a government payment to</text><text x="618" y="201.19" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">domestic producers so they</text><text x="618" y="222.31" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">can sell more cheaply</text><rect x="30" y="330" width="840" height="51.760000000000005" rx="12" fill="#2e6b62"/><text x="42" y="358.2" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">For protection</text><text x="462" y="358.2" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">For free trade</text><rect x="30" y="377.76" width="840" height="42.44" fill="#ffffff"/><text x="42" y="404.21" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">protects jobs in domestic firms</text><text x="462" y="404.21" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">lower prices and more choice for consumers</text><rect x="30" y="420.2" width="840" height="42.44" fill="#f7f9f9"/><text x="42" y="446.65" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">lets “infant” industries grow first</text><text x="462" y="446.65" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">specialisation raises total output</text><line x1="30" y1="420.2" x2="870" y2="420.2" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="462.64" width="840" height="64.88" fill="#ffffff"/><text x="42" y="489.09" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">keeps key goods (food, medicine) in national</text><text x="42" y="511.53" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">hands</text><text x="462" y="489.09" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">competition pushes firms to be efficient</text><line x1="30" y1="462.64" x2="870" y2="462.64" stroke="#c9d6d4" stroke-width="1.5"/><line x1="450" y1="377.76" x2="450" y2="527.52" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="330" width="840" height="197.51999999999998" rx="12" fill="none" stroke="#1e2a44" stroke-width="2.2"/><rect x="30" y="547.52" width="840" height="51.120000000000005" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="577.72" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">The WTO (from 1995, taking over from GATT, 1947) sets trade rules and settles disputes.</text>
</svg>