<rect width="900" height="600" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Fuse or trip switch</text>

<rect x="30" y="110" width="410" height="230" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="235" y="148" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Fuse</text><text x="54" y="190" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">• thin wire in the live wire</text><text x="54" y="222" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">• current above rating: wire</text><text x="54" y="254" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">   heats and melts</text><text x="54" y="286" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">• must be replaced after the</text><text x="54" y="318" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">   fault is repaired</text><rect x="460" y="110" width="410" height="230" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="665" y="148" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Trip switch (circuit breaker)</text><text x="484" y="190" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">• automatic switch in the live wire</text><text x="484" y="222" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">• current above setting: switch</text><text x="484" y="254" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">   opens (trips)</text><text x="484" y="286" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">• reset by hand once the fault</text><text x="484" y="318" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">   is fixed; nothing to replace</text><rect x="30" y="360" width="840" height="220" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="396" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Setting: just above the normal maximum current</text><line x1="80" y1="470" x2="828" y2="470" stroke="#1e2a44" stroke-width="3" stroke-linecap="round"/><line x1="817" y1="470" x2="850" y2="470" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="80" y1="470" x2="80" y2="480" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><text x="80" y="502" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">0</text><line x1="300" y1="470" x2="300" y2="480" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><text x="300" y="502" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">10</text><line x1="520" y1="470" x2="520" y2="480" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><text x="520" y="502" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">20</text><line x1="740" y1="470" x2="740" y2="480" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><text x="740" y="502" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">30</text><text x="839" y="455" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end">current / A</text><rect x="182" y="412" width="60" height="34" rx="8" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="212" y="435" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">6 A</text><line x1="212" y1="446" x2="212" y2="470" stroke="#8a6d0d" stroke-width="2.5" stroke-linecap="round"/><rect x="490" y="412" width="60" height="34" rx="8" fill="#d4b02e" stroke="#8a6d0d" stroke-width="2.5"/><text x="520" y="435" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">20 A</text><line x1="520" y1="446" x2="520" y2="470" stroke="#8a6d0d" stroke-width="2.5" stroke-linecap="round"/><rect x="754" y="412" width="60" height="34" rx="8" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="784" y="435" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">32 A</text><line x1="784" y1="446" x2="784" y2="470" stroke="#8a6d0d" stroke-width="2.5" stroke-linecap="round"/><path d="M462.79999999999995,530 l-9,14 l18,0 z" fill="#b5602e"/><text x="462.79999999999995" y="566" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">4.0 kW ÷ 230 V = 17.4 A  →  choose 20 A</text>
</svg>