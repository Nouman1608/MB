26" y2="220" stroke="#1e2a44" stroke-width="2.5" stroke-linecap="round"/><text x="300" y="252" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">fuse</text><line x1="420" y1="220" x2="430" y2="220" stroke="#1e2a44" stroke-width="3" stroke-linecap="round"/><line x1="470" y1="220" x2="480" y2="220" stroke="#1e2a44" stroke-width="3" stroke-linecap="round"/><circle cx="430" cy="220" r="4" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><circle cx="470" cy="220" r="4" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><line x1="433" y1="218" x2="467" y2="218" stroke="#1e2a44" stroke-width="3" stroke-linecap="round"/><text x="450" y="252" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">switch</text><text x="370" y="432" font-size="16" font-weight="400" fill="#6f9a52" text-anchor="middle">carries current only when there is a fault</text><rect x="30" y="520" width="840" height="64" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="558.3" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">The danger is the live wire: touch it while in contact with earth and current flows through you.</text>
