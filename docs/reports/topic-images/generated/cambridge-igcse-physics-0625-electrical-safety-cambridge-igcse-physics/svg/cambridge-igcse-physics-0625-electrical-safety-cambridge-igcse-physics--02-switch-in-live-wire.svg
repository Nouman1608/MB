<rect width="900" height="620" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why the switch goes in the live wire</text>

<rect x="30" y="110" width="410" height="480" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="235" y="148" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle">Switch in LIVE: correct</text><rect x="60" y="180" width="60" height="180" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="90" y="276" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">supply</text><rect x="320" y="180" width="90" height="180" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="365" y="268" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">lamp</text><text x="365" y="290" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">holder</text><line x1="120" y1="210" x2="190" y2="210" stroke="#b5602e" stroke-width="5" stroke-linecap="round"/><line x1="250" y1="210" x2="320" y2="210" stroke="#4a5568" stroke-width="5" stroke-linecap="round"/><line x1="120" y1="330" x2="190" y2="330" stroke="#2b5a9a" stroke-width="5" stroke-linecap="round"/><line x1="250" y1="330" x2="320" y2="330" stroke="#2b5a9a" stroke-width="5" stroke-linecap="round"/><line x1="190" y1="330" x2="250" y2="330" stroke="#2b5a9a" stroke-width="5" stroke-linecap="round"/><circle cx="190" cy="210" r="5" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><circle cx="250" cy="210" r="5" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><line x1="194" y1="206" x2="244" y2="178" stroke="#1e2a44" stroke-width="4" stroke-linecap="round"/><text x="150" y="196" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">live</text><text x="150" y="360" font-size="16" font-weight="700" fill="#2b5a9a" text-anchor="middle">neutral</text><text x="220" y="250" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">switch OFF</text><rect x="50" y="420" width="370" height="150" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="235" y="474.95" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Off = disconnected from</text><text x="235" y="500.95" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">the high p.d. Parts beyond</text><text x="235" y="526.95" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">the switch are safe to touch.</text><rect x="460" y="110" width="410" height="480" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="665" y="148" font-size="20" font-weight="700" fill="#b5602e" text-anchor="middle">Switch in NEUTRAL: unsafe</text><rect x="490" y="180" width="60" height="180" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="520" y="276" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">supply</text><rect x="750" y="180" width="90" height="180" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="795" y="268" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">lamp</text><text x="795" y="290" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">holder</text><line x1="550" y1="210" x2="620" y2="210" stroke="#b5602e" stroke-width="5" stroke-linecap="round"/><line x1="680" y1="210" x2="750" y2="210" stroke="#b5602e" stroke-width="5" stroke-linecap="round"/><line x1="550" y1="330" x2="620" y2="330" stroke="#2b5a9a" stroke-width="5" stroke-linecap="round"/><line x1="680" y1="330" x2="750" y2="330" stroke="#2b5a9a" stroke-width="5" stroke-linecap="round"/><line x1="620" y1="210" x2="680" y2="210" stroke="#b5602e" stroke-width="5" stroke-linecap="round"/><circle cx="620" cy="330" r="5" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><circle cx="680" cy="330" r="5" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><line x1="624" y1="326" x2="674" y2="298" stroke="#1e2a44" stroke-width="4" stroke-linecap="round"/><text x="580" y="196" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">live</text><text x="580" y="360" font-size="16" font-weight="700" fill="#2b5a9a" text-anchor="middle">neutral</text><text x="650" y="284" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">switch OFF</text><rect x="748" y="178" width="94" height="184" rx="8" fill="none" stroke="#b5602e" stroke-width="4" stroke-dasharray="8 6"/><rect x="480" y="420" width="370" height="150" rx="12" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="665" y="474.95" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Off: the lamp goes out, but</text><text x="665" y="500.95" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">its parts are still connected</text><text x="665" y="526.95" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">to the live wire. Shock risk.</text>
</svg>