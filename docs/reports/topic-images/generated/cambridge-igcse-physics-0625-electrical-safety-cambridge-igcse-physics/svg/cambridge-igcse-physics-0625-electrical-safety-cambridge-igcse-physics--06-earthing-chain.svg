<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How earthing protects you</text>

<rect x="30" y="110" width="430" height="470" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="110" y="170" width="280" height="260" rx="12" fill="#d9dee3" stroke="#1e2a44" stroke-width="4"/><text x="250" y="458" font-size="17" font-weight="600" fill="#4a5568" text-anchor="middle">metal case</text><line x1="30" y1="200" x2="230" y2="200" stroke="#b5602e" stroke-width="5" stroke-linecap="round"/><path d="M230,200 q40,10 30,60 l40,30" fill="none" stroke="#b5602e" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="300" cy="290" r="8" fill="#b5602e"/><text x="130" y="380" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">loose live wire</text><text x="130" y="400" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">touches the case</text><line x1="42" y1="200" x2="44" y2="200" stroke="#1e2a44" stroke-width="3" stroke-linecap="round"/><line x1="96" y1="200" x2="98" y2="200" stroke="#1e2a44" stroke-width="3" stroke-linecap="round"/><rect x="44" y="190" width="52" height="20" rx="0" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><line x1="44" y1="200" x2="96" y2="200" stroke="#1e2a44" stroke-width="2.5" stroke-linecap="round"/><line x1="390" y1="400" x2="420" y2="400" stroke="#6f9a52" stroke-width="5" stroke-linecap="round"/><line x1="420" y1="400" x2="420" y2="460" stroke="#6f9a52" stroke-width="5" stroke-linecap="round"/><line x1="420" y1="460" x2="420" y2="476" stroke="#6f9a52" stroke-width="3" stroke-linecap="round"/><line x1="402" y1="476" x2="438" y2="476" stroke="#6f9a52" stroke-width="3" stroke-linecap="round"/><line x1="409" y1="484" x2="431" y2="484" stroke="#6f9a52" stroke-width="3" stroke-linecap="round"/><line x1="415" y1="492" x2="425" y2="492" stroke="#6f9a52" stroke-width="3" stroke-linecap="round"/><text x="420" y="515" font-size="16" font-weight="700" fill="#6f9a52" text-anchor="middle">earth</text><path d="M360,400 L340,392 L340,408 Z" fill="#b5602e"/><line x1="310" y1="300" x2="340" y2="400" stroke="#b5602e" stroke-width="3" stroke-dasharray="7 6"/><rect x="470" y="110" width="400" height="470" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="500" cy="168" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="500" y="174.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="530" y="162" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Fault: live wire touches the</text><text x="530" y="184" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">metal case</text><circle cx="500" cy="250" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="500" y="256.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="530" y="244" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Large current: live → case →</text><text x="530" y="266" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">earth wire → ground</text><circle cx="500" cy="332" r="18" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="500" y="338.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="530" y="326" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Current above the fuse rating:</text><text x="530" y="348" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">fuse melts (or trip opens)</text><circle cx="500" cy="414" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="500" y="420.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="530" y="408" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Appliance disconnected from</text><text x="530" y="430" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">the live supply</text><circle cx="500" cy="496" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="500" y="502.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="530" y="490" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Case no longer at high p.d.:</text><text x="530" y="512" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">safe to touch</text>
