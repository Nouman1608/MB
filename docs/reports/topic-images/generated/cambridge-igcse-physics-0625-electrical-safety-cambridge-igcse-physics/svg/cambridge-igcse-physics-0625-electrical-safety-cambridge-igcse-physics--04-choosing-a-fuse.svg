<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Choosing a fuse: smallest rating above the current</text>

<rect x="30" y="110" width="840" height="370" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="160" font-size="19" font-weight="600" fill="#1e2a44" text-anchor="start">Available fuses: 3 A, 5 A, 13 A (230 V supply)</text><line x1="80" y1="300" x2="823.6" y2="300" stroke="#1e2a44" stroke-width="3" stroke-linecap="round"/><line x1="808" y1="300" x2="839.1999999999999" y2="300" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="80" y1="300" x2="80" y2="312" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><line x1="132" y1="300" x2="132" y2="307" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><line x1="184" y1="300" x2="184" y2="307" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><line x1="236" y1="300" x2="236" y2="307" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><line x1="288" y1="300" x2="288" y2="307" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><line x1="340" y1="300" x2="340" y2="312" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><line x1="392" y1="300" x2="392" y2="307" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><line x1="444" y1="300" x2="444" y2="307" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><line x1="496" y1="300" x2="496" y2="307" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><line x1="548" y1="300" x2="548" y2="307" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><line x1="600" y1="300" x2="600" y2="312" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><line x1="652" y1="300" x2="652" y2="307" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><line x1="704" y1="300" x2="704" y2="307" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><line x1="756" y1="300" x2="756" y2="307" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><line x1="808" y1="300" x2="808" y2="307" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><text x="80" y="334" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">0</text><text x="340" y="334" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">5</text><text x="600" y="334" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">10</text><text x="828.8000000000001" y="334" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end">current / A</text><rect x="206" y="240" width="60" height="34" rx="8" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="236" y="263" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">3 A</text><line x1="236" y1="274" x2="236" y2="300" stroke="#8a6d0d" stroke-width="2.5" stroke-linecap="round"/><rect x="310" y="240" width="60" height="34" rx="8" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="340" y="263" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">5 A</text><line x1="340" y1="274" x2="340" y2="300" stroke="#8a6d0d" stroke-width="2.5" stroke-linecap="round"/><rect x="726" y="240" width="60" height="34" rx="8" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="756" y="263" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">13 A</text><line x1="756" y1="274" x2="756" y2="300" stroke="#8a6d0d" stroke-width="2.5" stroke-linecap="round"/><path d="M225.6,380 l-9,-14 l18,0 z" fill="#2e6b62"/><line x1="225.6" y1="300" x2="225.6" y2="380" stroke="#2e6b62" stroke-width="2.5" stroke-dasharray="5 4"/><text x="225.6" y="406" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">drill 2.8 A</text><path d="M350.40000000000003,430 l-9,-14 l18,0 z" fill="#b5602e"/><line x1="350.40000000000003" y1="300" x2="350.40000000000003" y2="430" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="5 4"/><text x="350.40000000000003" y="456" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">hair dryer 5.2 A</text><rect x="30" y="500" width="410" height="154" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="536" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">(a) 1.2 kW hair dryer</text><text x="50" y="570" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">I = 1200 / 230 = 5.2 A</text><text x="50" y="602" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">5 A is below 5.2 A: would blow</text><text x="50" y="634" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">→ 13 A fuse</text><rect x="460" y="500" width="410" height="154" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="480" y="536" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">(b) 650 W drill</text><text x="480" y="570" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">I = 650 / 230 = 2.8 A</text><text x="480" y="602" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">3 A is the smallest above 2.8 A</text><text x="480" y="634" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">→ 3 A fuse</text>
</svg>