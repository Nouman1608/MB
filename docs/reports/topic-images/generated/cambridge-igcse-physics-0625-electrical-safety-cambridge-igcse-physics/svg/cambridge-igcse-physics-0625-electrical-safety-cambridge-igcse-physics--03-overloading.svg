<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" width="900" height="580" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="580" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Overloading: currents in parallel add</text>

<rect x="30" y="110" width="840" height="440" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="60" y="200" width="520" height="70" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="320" y="300" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">extension lead designed for 13 A</text><rect x="108" y="214" width="64" height="42" rx="6" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><line x1="140" y1="214" x2="140" y2="150" stroke="#1e2a44" stroke-width="4" stroke-linecap="round"/><text x="140" y="140" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">kettle 2.5 kW</text><text x="140" y="240" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">10.9 A</text><rect x="278" y="214" width="64" height="42" rx="6" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><line x1="310" y1="214" x2="310" y2="150" stroke="#1e2a44" stroke-width="4" stroke-linecap="round"/><text x="310" y="140" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">heater 2.0 kW</text><text x="310" y="240" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">8.7 A</text><rect x="448" y="214" width="64" height="42" rx="6" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><line x1="480" y1="214" x2="480" y2="150" stroke="#1e2a44" stroke-width="4" stroke-linecap="round"/><text x="480" y="140" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">iron 1.2 kW</text><text x="480" y="240" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">5.2 A</text><line x1="60" y1="235" x2="30" y2="235" stroke="#1e2a44" stroke-width="5" stroke-linecap="round"/><rect x="610" y="140" width="260" height="186" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="630" y="176" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Currents add</text><text x="630" y="210" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">I = P / V on 230 V</text><text x="630" y="242" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">10.9 + 8.7 + 5.2</text><text x="630" y="274" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">= 24.8 A</text><text x="630" y="306" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">far above 13 A</text><text x="60" y="370" font-size="19" font-weight="600" fill="#1e2a44" text-anchor="start">Too much current → the cable and sockets overheat</text><text x="60" y="400" font-size="19" font-weight="600" fill="#1e2a44" text-anchor="start">→ insulation melts, exposing wires → fire</text><rect x="60" y="450" width="780" height="76" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="481.45" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Other hazards: damaged insulation (shock, short circuit), cables that</text><text x="450" y="506.45" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">overheat or are coiled up, and damp conditions (impure water conducts).</text>
</svg>