<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="520" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Double insulation: no earth wire needed</text>

<rect x="30" y="110" width="430" height="380" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="80" y="170" width="330" height="240" rx="30" fill="#f7f2e2" stroke="#1e2a44" stroke-width="4"/><rect x="130" y="220" width="230" height="140" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="245" y="296" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">insulated live parts</text><text x="245" y="440" font-size="17" font-weight="600" fill="#4a5568" text-anchor="middle">plastic (non-conducting) case</text><line x1="30" y1="250" x2="130" y2="250" stroke="#b5602e" stroke-width="5" stroke-linecap="round"/><line x1="30" y1="330" x2="130" y2="330" stroke="#2b5a9a" stroke-width="5" stroke-linecap="round"/><line x1="36" y1="250" x2="34" y2="250" stroke="#1e2a44" stroke-width="3" stroke-linecap="round"/><line x1="86" y1="250" x2="84" y2="250" stroke="#1e2a44" stroke-width="3" stroke-linecap="round"/><rect x="34" y="240" width="52" height="20" rx="0" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><line x1="34" y1="250" x2="86" y2="250" stroke="#1e2a44" stroke-width="2.5" stroke-linecap="round"/><text x="60" y="230" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">fuse</text><text x="245" y="470" font-size="17" font-weight="700" fill="#6f9a52" text-anchor="middle">no earth wire</text><rect x="480" y="120" width="390" height="170" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="675" y="183.3" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">The case cannot become live,</text><text x="675" y="211.3" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">even if a wire comes loose,</text><text x="675" y="239.3" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">so no earth wire is needed.</text><rect x="480" y="310" width="390" height="180" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="675" y="364.3" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">The fuse is still there.</text><text x="675" y="392.3" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">It protects the circuit and</text><text x="675" y="420.3" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">the cabling, melting if a short</text><text x="675" y="448.3" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">circuit makes the current too large.</text>
</svg>