<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 788" width="900" height="788" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="788" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">AQA’s aspects of comedy</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Society and the behaviour of men and women in it are ridiculed</text>
<rect x="30" y="110" width="840" height="132" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="143" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">AQA’S DEFINITION</text><text x="50" y="168.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Stories “which primarily amuse”, where discomfort “excites laughter rather</text><text x="50" y="192.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">than concern” and “no great disaster occurs”. Every text has a love interest</text><text x="50" y="216.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">and “marriage is a focal point”.</text><rect x="30" y="258" width="270.6666666666667" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="285.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Type</text><text x="44" y="312" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Romantic (Twelfth Night),</text><text x="44" y="332" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">manners (Emma, Earnest), satire</text><text x="44" y="352" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">(Swift).</text><rect x="314.6666666666667" y="258" width="270.6666666666667" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="328.6666666666667" y="285.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Journey to knowledge</text><text x="328.6666666666667" y="312" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Mistakes, unhappiness, then “a</text><text x="328.6666666666667" y="332" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">sense of joy”: Emma at Box</text><text x="328.6666666666667" y="352" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Hill.</text><rect x="599.3333333333334" y="258" width="270.6666666666667" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="613.3333333333334" y="295.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Comic villain or rival</text><text x="613.3333333333334" y="322" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Disrupts the mood, power</text><text x="613.3333333333334" y="342" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">“finally curtailed”: Malvolio.</text><rect x="30" y="382" width="270.6666666666667" height="134" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="420.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Scale</text><text x="44" y="447" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Themselves and one or two</text><text x="44" y="467" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">others, not countries and</text><text x="44" y="487" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">states.</text><rect x="314.6666666666667" y="382" width="270.6666666666667" height="134" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="328.6666666666667" y="409.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Folly, trickery,</text><text x="328.6666666666667" y="431.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">gullibility</text><text x="328.6666666666667" y="458" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">The forged letter; Tony</text><text x="328.6666666666667" y="478" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Lumpkin’s trick; the fox’s</text><text x="328.6666666666667" y="498" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">flattery.</text><rect x="599.3333333333334" y="382" width="270.6666666666667" height="134" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="613.3333333333334" y="420.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Clowns and posturing</text><text x="613.3333333333334" y="447" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Feste; Lady Bracknell;</text><text x="613.3333333333334" y="467" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Chauntecleer’s learned</text><text x="613.3333333333334" y="487" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">speeches.</text><rect x="30" y="528" width="270.6666666666667" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="555.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Disguise and discovery</text><text x="44" y="582" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Viola as Cesario; false</text><text x="44" y="602" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">identities in Earnest; Kate as</text><text x="44" y="622" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">a barmaid.</text><rect x="314.6666666666667" y="528" width="270.6666666666667" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="328.6666666666667" y="555.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Structure</text><text x="328.6666666666667" y="582" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">“From disorder to order,</text><text x="328.6666666666667" y="602" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">incorporating rule and</text><text x="328.6666666666667" y="622" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">misrule”.</text><rect x="599.3333333333334" y="528" width="270.6666666666667" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="613.3333333333334" y="575.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Language</text><text x="613.3333333333334" y="602" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">“Wit and linguistic play”.</text><rect x="30" y="652" width="270.6666666666667" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="679.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Self-awareness</text><text x="44" y="706" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">The Shrew’s Induction for</text><text x="44" y="726" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Christopher Sly; Wilde’s</text><text x="44" y="746" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">epigrams.</text><rect x="314.6666666666667" y="652" width="270.6666666666667" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="328.6666666666667" y="679.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">The audience</text><text x="328.6666666666667" y="706" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Laughter at “ridiculous</text><text x="328.6666666666667" y="726" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">behaviour”; joy that resolution</text><text x="328.6666666666667" y="746" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">is possible.</text><rect x="599.3333333333334" y="652" width="270.6666666666667" height="112" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="613.3333333333334" y="689.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Absence</text><text x="613.3333333333334" y="716" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">A missing aspect “might also be</text><text x="613.3333333333334" y="736" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">of note”.</text>
</svg>