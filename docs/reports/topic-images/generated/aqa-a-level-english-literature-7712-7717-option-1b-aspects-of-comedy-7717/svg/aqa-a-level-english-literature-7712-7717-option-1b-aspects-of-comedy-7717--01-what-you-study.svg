<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Aspects of Comedy: your three texts</text>

<rect x="30" y="110" width="840" height="92" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="54" y="146" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Text 1 · Shakespeare</text><text x="54" y="174" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">one of:</text><g font-style="italic"><rect x="300" y="138" width="264" height="38" rx="19" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="432" y="163.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">The Taming of the Shrew</text></g><g font-style="italic"><rect x="578" y="138" width="161" height="38" rx="19" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="658.5" y="163.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Twelfth Night</text></g><text x="30" y="242" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Texts 2 and 3 · one pre-1900 drama text and one further text, from:</text><rect x="30" y="262" width="411" height="74" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="293" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start" font-style="italic">She Stoops to Conquer</text><text x="48" y="318" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Oliver Goldsmith</text><rect x="459" y="262" width="411" height="74" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="293" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start" font-style="italic">The Importance of Being Earnest</text><text x="477" y="318" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Oscar Wilde</text><rect x="30" y="346" width="411" height="74" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="377" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start" font-style="italic">Emma</text><text x="48" y="402" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Jane Austen</text><rect x="459" y="346" width="411" height="74" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="377" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">“The Nun’s Priest’s Tale”</text><text x="477" y="402" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Geoffrey Chaucer</text><rect x="30" y="430" width="411" height="74" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="461" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start" font-style="italic">Small Island</text><text x="48" y="486" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Andrea Levy</text><rect x="459" y="430" width="411" height="74" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="461" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Poetry anthology (comedy)</text><text x="477" y="486" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Various</text><rect x="332" y="302" width="95" height="26" rx="13" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="379.5" y="320.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">pre-1900</text><rect x="255" y="302" width="69" height="26" rx="13" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="289.5" y="320.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">drama</text><rect x="761" y="302" width="95" height="26" rx="13" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="808.5" y="320.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">pre-1900</text><rect x="684" y="302" width="69" height="26" rx="13" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="718.5" y="320.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">drama</text><rect x="332" y="386" width="95" height="26" rx="13" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="379.5" y="404.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">pre-1900</text><rect x="761" y="386" width="95" height="26" rx="13" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="808.5" y="404.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">pre-1900</text><rect x="30" y="522" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="555.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A single text can meet more than one requirement: AQA’s own example is She Stoops to</text><text x="50" y="577.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Conquer, both drama and pre-1900. Paper 1 is closed book, so quotations must be learned.</text>
