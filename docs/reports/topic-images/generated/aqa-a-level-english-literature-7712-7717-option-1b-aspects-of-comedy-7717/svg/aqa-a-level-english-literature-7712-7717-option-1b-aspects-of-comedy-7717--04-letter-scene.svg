<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 849" width="900" height="849" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="849" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The letter scene: a double audience</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Twelfth Night: Malvolio finds the forged letter</text>
<path d="M60,320 L840,320 L800,350 L100,350 Z" fill="#efdfa8" stroke="#1e2a44" stroke-width="2.5"/><path d="M541.3,320 L546.8,262.8 Q560,251.8 573.2,262.8 L578.7,320 Z" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><circle cx="560" cy="240.8" r="14.3" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><rect x="574" y="250" width="34" height="26" rx="3" fill="#ffffff" stroke="#1e2a44" stroke-width="2" transform="rotate(-12 591 263)"/><text x="560" y="208" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Malvolio</text><text x="560" y="186" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">performs his fantasies</text><rect x="130" y="210" width="230" height="110" rx="16" fill="#6f9a52" opacity="0.55" stroke="#1e2a44" stroke-width="2"/><path d="M164.8,280 L167.8,248.8 Q175,242.8 182.2,248.8 L185.2,280 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><circle cx="175" cy="236.8" r="7.8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><path d="M234.8,280 L237.8,248.8 Q245,242.8 252.2,248.8 L255.2,280 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><circle cx="245" cy="236.8" r="7.8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><path d="M304.8,280 L307.8,248.8 Q315,242.8 322.2,248.8 L325.2,280 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><circle cx="315" cy="236.8" r="7.8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="245" y="196" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Sir Toby, Sir Andrew, Fabian</text><text x="245" y="174" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">react from hiding</text><line x1="368" y1="250" x2="520" y2="250" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)" stroke-dasharray="6 5"/><circle cx="190" cy="410" r="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><circle cx="255" cy="410" r="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><circle cx="320" cy="410" r="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><circle cx="385" cy="410" r="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><circle cx="450" cy="410" r="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><circle cx="515" cy="410" r="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><circle cx="580" cy="410" r="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><circle cx="645" cy="410" r="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><circle cx="710" cy="410" r="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="450" y="452" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">The theatre audience</text><text x="450" y="476" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">laughs at the gull and with the tricksters</text><line x1="62" y1="522" x2="62" y2="805" stroke="#c9d6d4" stroke-width="4"/><rect x="108" y="502" width="762" height="108" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="536.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Pride as the instrument of humiliation</text><text x="128" y="564.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">He labours to decode the letter’s initials as if solving a puzzle: “folly, trickery and</text><text x="128" y="585.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">gullibility”.</text><circle cx="62" cy="556" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="564.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="108" y="620" width="762" height="87" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="654.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">A harsher turn</text><text x="128" y="682.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The trick leads to imprisonment in darkness and his final vow of revenge.</text><circle cx="62" cy="663.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="672.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="108" y="717" width="762" height="108" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="751.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Two readings</text><text x="128" y="779.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">An audience that valued social order mocks the steward who rises above his place; a</text><text x="128" y="800.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">modern audience may find the punishment cruel.</text><circle cx="62" cy="771" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="779.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text>
</svg>