<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" width="900" height="660" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="660" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Does the ending resolve?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Who is left out of the happy ending?</text>
<circle cx="450" cy="340" r="120" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="3"/><text x="450" y="310" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">The happy ending</text><text x="450" y="340" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">marriage, order</text><text x="450" y="364" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">and joy</text><circle cx="430" cy="404" r="16" fill="none" stroke="#8a6d0d" stroke-width="3"/><circle cx="454" cy="404" r="16" fill="none" stroke="#8a6d0d" stroke-width="3"/><line x1="290" y1="172" x2="350" y2="260" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="7 6"/><rect x="30" y="124" width="260" height="96" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="44" y="152.4" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">Malvolio</text><text x="44" y="180.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Exits vowing revenge on all</text><text x="44" y="201.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">of them.</text><line x1="610" y1="161.5" x2="550" y2="260" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="7 6"/><rect x="610" y="124" width="260" height="75" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="624" y="152.4" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">Antonio</text><text x="624" y="180.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Left alone.</text><line x1="290" y1="468.5" x2="350" y2="420" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="7 6"/><rect x="30" y="410" width="260" height="117" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="44" y="438.4" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">Katherina</text><text x="44" y="466.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Her final speech on wifely</text><text x="44" y="487.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">obedience: sincere, ironic</text><text x="44" y="508.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">or forced?</text><line x1="610" y1="468.5" x2="550" y2="420" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="7 6"/><rect x="610" y="410" width="260" height="117" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="624" y="438.4" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">Small Island</text><text x="624" y="466.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Comic misunderstandings</text><text x="624" y="487.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">alongside racism and wartime</text><text x="624" y="508.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">loss.</text><rect x="30" y="556" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="589.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">These are not reasons to deny that the texts are comedies: they are evidence for a debate</text><text x="50" y="611.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">about what comic resolution costs.</text>
</svg>