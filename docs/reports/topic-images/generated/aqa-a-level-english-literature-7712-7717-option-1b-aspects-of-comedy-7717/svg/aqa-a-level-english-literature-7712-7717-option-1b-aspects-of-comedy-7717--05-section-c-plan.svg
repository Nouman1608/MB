<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 747" width="900" height="747" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="747" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Connecting two comedies</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">“Comedies mock those who try to rise above their place.”</text>
<rect x="30" y="120" width="400" height="52" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="230" y="153" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle" font-style="italic">She Stoops to Conquer</text><rect x="470" y="120" width="400" height="52" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="670" y="153" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle" font-style="italic">Emma</text><rect x="30" y="184" width="400" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="208" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">Ridiculed</text><text x="46" y="232" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Marlow’s two manners: shy with ladies, bold</text><text x="46" y="253" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">with barmaids</text><rect x="470" y="184" width="400" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="486" y="208" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">Ridiculed</text><text x="486" y="232" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Emma’s attempt to raise Harriet Smith</text><text x="486" y="253" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">through a match with Mr Elton</text><line x1="434" y1="228" x2="466" y2="228" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="282" width="400" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="306" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">Rank and climbing</text><text x="46" y="330" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Kate stoops to conquer by playing below her</text><text x="46" y="351" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">rank</text><rect x="470" y="282" width="400" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="486" y="306" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">Rank and climbing</text><text x="486" y="330" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Mr Elton’s ambition to marry Emma is</text><text x="486" y="351" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">rejected</text><line x1="434" y1="326" x2="466" y2="326" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="380" width="400" height="67" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="404" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">Context</text><text x="46" y="428" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Eighteenth-century class codes</text><rect x="470" y="380" width="400" height="67" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="486" y="404" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">Context</text><text x="486" y="428" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Regency class codes</text><line x1="434" y1="413.5" x2="466" y2="413.5" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="465" width="397" height="108" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="498" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">ARGUE</text><text x="50" y="523.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Both mock social climbing, and</text><text x="50" y="547.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">snobbery itself</text><line x1="433" y1="519" x2="467" y2="519" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="473" y="465" width="397" height="108" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="493" y="498" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">WEIGH</text><text x="493" y="523.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Counter-view: Kate’s stooping is</text><text x="493" y="547.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">rewarded</text><text x="450" y="611" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Interpretation: is comedy…</text><path d="M450,647 L432,717 L468,717 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><line x1="330" y1="647" x2="570" y2="647" stroke="#1e2a44" stroke-width="5" stroke-linecap="round"/><line x1="330" y1="647" x2="306" y2="681" stroke="#1e2a44" stroke-width="2"/><line x1="330" y1="647" x2="354" y2="681" stroke="#1e2a44" stroke-width="2"/><path d="M298,681 L362,681 Q330,699 298,681 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><line x1="570" y1="647" x2="546" y2="681" stroke="#1e2a44" stroke-width="2"/><line x1="570" y1="647" x2="594" y2="681" stroke="#1e2a44" stroke-width="2"/><path d="M538,681 L602,681 Q570,699 538,681 Z" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><circle cx="450" cy="647" r="7" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="633" width="260" height="68" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="160" y="658.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Conservative</text><text x="160" y="685" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">restoring the order of rank</text><rect x="610" y="633" width="260" height="68" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="740" y="658.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Subversive</text><text x="740" y="685" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">exposing the order of rank</text>
</svg>