<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 792" width="900" height="792" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="792" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A revolution from above, 1928-41</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Collectivisation fed the Five Year Plans</text>
<rect x="30" y="124" width="840" height="109" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">WHY THE GREAT TURN, 1928-29</text><text x="50" y="187.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Fear of invasion ("fifty or a hundred years behind", 1931); self-sufficiency; building socialism; destroying</text><text x="50" y="208.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the Right's power base</text><rect x="30" y="255" width="330" height="305" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="287" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">COUNTRYSIDE</text><text x="50" y="313.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Collectivisation</text><text x="50" y="341" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="64.25" y="341" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Kolkhozy and sovkhozy</text><text x="50" y="364" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="64.25" y="364" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">"Dizzy with Success" (March 1930): a</text><text x="64.25" y="384" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">pause</text><text x="50" y="407" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="64.25" y="407" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Dekulakisation</text><text x="50" y="430" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="64.25" y="430" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Cattle and horses roughly halved by</text><text x="64.25" y="450" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">1933</text><text x="50" y="473" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="64.25" y="473" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Famine 1932-33, Ukraine and</text><text x="64.25" y="493" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Kazakhstan</text><text x="50" y="516" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="64.25" y="516" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Over 90 per cent collectivised by the</text><text x="64.25" y="536" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">late 1930s</text><rect x="410" y="255" width="460" height="118" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="424" y="281" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">1928-32</text><text x="424" y="307.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">First Plan</text><text x="424" y="335" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Coal, iron, steel, electricity; Magnitogorsk, Dnieper dam;</text><text x="424" y="355" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">"complete" in four years</text><line x1="640" y1="375" x2="640" y2="399" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="410" y="403" width="460" height="118" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="424" y="429" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">1933-37</text><text x="424" y="455.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Second Plan</text><text x="424" y="483" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Consolidation; transport (Moscow Metro, 1935); some</text><text x="424" y="503" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">consumer goods</text><line x1="640" y1="523" x2="640" y2="547" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="410" y="551" width="460" height="98" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="424" y="577" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">from 1938</text><text x="424" y="603.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Third Plan</text><text x="424" y="631" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Switched heavily to armaments</text><line x1="366" y1="407.5" x2="404" y2="407.5" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><text x="385" y="395.5" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">grain</text><rect x="30" y="671" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="705.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Stakhanov, August 1935</text><text x="450" y="735.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">102 tonnes of coal in one shift: shock workers and higher norms followed.</text>
</svg>