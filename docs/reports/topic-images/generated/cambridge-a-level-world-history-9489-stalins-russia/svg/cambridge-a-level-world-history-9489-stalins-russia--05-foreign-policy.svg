<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 442" width="900" height="442" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="442" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Foreign policy in three phases</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">From Rapallo to the Nazi-Soviet Pact</text>
<rect x="30" y="124" width="256" height="180" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="45" y="169.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PHASE 1</text><text x="45" y="195.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Co-operation with</text><text x="45" y="218.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Germany</text><text x="45" y="246.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Rapallo legacy; Treaty of Berlin</text><text x="45" y="266.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">(1926); until Hitler's rise</text><line x1="292" y1="214" x2="316" y2="214" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="322" y="124" width="256" height="180" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="337" y="151" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PHASE 2</text><text x="337" y="177.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Collective security</text><text x="337" y="205" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">League (1934); pacts with</text><text x="337" y="225" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">France and Czechoslovakia,</text><text x="337" y="245" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Popular Fronts (1935); Spain</text><text x="337" y="265" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">(1936-39); China; Lake Khasan</text><text x="337" y="285" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">(1938), Khalkhin Gol (1939)</text><line x1="584" y1="214" x2="608" y2="214" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="614" y="124" width="256" height="180" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="629" y="171" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PHASE 3, 23 AUGUST 1939</text><text x="629" y="197.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Nazi-Soviet Pact</text><text x="629" y="225" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">After exclusion from Munich;</text><text x="629" y="245" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">secret protocol: Poland, Baltic</text><text x="629" y="265" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">states, Bessarabia</text><rect x="30" y="326" width="840" height="84" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="450" y="358" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">THE COST</text><text x="450" y="384.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Time bought, then the disaster of June 1941</text>
</svg>