<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 501" width="900" height="501" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="501" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why the Terror? Three groups of explanation</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">A strong essay weighs them against each other</text>
<rect x="30" y="124" width="269.3333333333333" height="166" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="152" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FROM ABOVE</text><text x="46" y="178.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Stalin's aims</text><text x="46" y="206.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Remove Old Bolsheviks who</text><text x="46" y="227.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">knew him as an equal, and</text><text x="46" y="248.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">anyone who might side with an</text><text x="46" y="269.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">enemy in war</text><rect x="315.3333333333333" y="124" width="269.3333333333333" height="166" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="331.3333333333333" y="162.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">POLITICAL CRISIS</text><text x="331.3333333333333" y="188.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Ryutin and Kirov</text><text x="331.3333333333333" y="217.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Ryutin Platform (1932); Kirov</text><text x="331.3333333333333" y="238.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">murdered 1 December 1934,</text><text x="331.3333333333333" y="259.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">then a decree for fast trials</text><rect x="600.6666666666666" y="124" width="269.3333333333333" height="166" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="616.6666666666666" y="162.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FROM BELOW AND WITHIN</text><text x="616.6666666666666" y="188.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Momentum</text><text x="616.6666666666666" y="217.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">NKVD quotas; denunciations;</text><text x="616.6666666666666" y="238.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">scapegoats for economic</text><text x="616.6666666666666" y="259.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">failure</text><rect x="150" y="354" width="600" height="115" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="386" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">1936-38 PEAK</text><text x="450" y="414.38" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Show trials, the Yezhovshchina, the army purge</text><text x="450" y="444.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">About 680,000 executions in 1937-38 (NKVD records)</text><line x1="164.66666666666666" y1="296" x2="300" y2="348" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="450" y1="296" x2="450" y2="348" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="735.3333333333333" y1="296" x2="600" y2="348" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/>
</svg>