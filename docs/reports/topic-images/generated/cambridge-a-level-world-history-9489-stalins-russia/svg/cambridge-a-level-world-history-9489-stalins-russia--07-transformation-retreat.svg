<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Transformation or retreat?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Society in the 1930s, area by area</text>
<clipPath id="tc124"><rect x="30" y="124" width="840" height="358" rx="14"/></clipPath><g clip-path="url(#tc124)"><rect x="30" y="124" width="168.00000000000003" height="48" fill="#b5d3cf"/><text x="44" y="151.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Area</text><rect x="198.00000000000003" y="124" width="336.00000000000006" height="48" fill="#dce9e7"/><text x="212.00000000000003" y="151.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">What changed</text><rect x="534.0000000000001" y="124" width="336.00000000000006" height="48" fill="#f2e7b8"/><text x="548.0000000000001" y="151.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Retreat or limit</text><rect x="30" y="172" width="168.00000000000003" height="66" fill="#dce9e7"/><text x="44" y="198" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Women and family</text><rect x="198.00000000000003" y="172" width="336.00000000000006" height="66" fill="#ffffff"/><text x="212.00000000000003" y="198" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Women entered industry in large numbers</text><rect x="534.0000000000001" y="172" width="336.00000000000006" height="66" fill="#ffffff"/><text x="548.0000000000001" y="198" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">1936 law banned abortion, made divorce</text><text x="548.0000000000001" y="218" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">costlier; the "double burden"</text><line x1="30" y1="238" x2="870" y2="238" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="238" width="168.00000000000003" height="66" fill="#dce9e7"/><text x="44" y="264" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">National groups</text><rect x="198.00000000000003" y="238" width="336.00000000000006" height="66" fill="#f8faf9"/><text x="212.00000000000003" y="264" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Earlier support for national cultures</text><rect x="534.0000000000001" y="238" width="336.00000000000006" height="66" fill="#f8faf9"/><text x="548.0000000000001" y="264" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Russification: Russian compulsory in</text><text x="548.0000000000001" y="284" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">schools (1938); Koreans deported (1937)</text><line x1="30" y1="304" x2="870" y2="304" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="304" width="168.00000000000003" height="66" fill="#dce9e7"/><text x="44" y="330" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Education</text><rect x="198.00000000000003" y="304" width="336.00000000000006" height="66" fill="#ffffff"/><text x="212.00000000000003" y="330" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Literacy rose sharply; a technical</text><text x="212.00000000000003" y="350" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">intelligentsia</text><rect x="534.0000000000001" y="304" width="336.00000000000006" height="66" fill="#ffffff"/><text x="548.0000000000001" y="330" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Experiments (1928-31) dropped for exams</text><text x="548.0000000000001" y="350" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">and discipline; fees from 1940</text><line x1="30" y1="370" x2="870" y2="370" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="370" width="168.00000000000003" height="46" fill="#dce9e7"/><text x="44" y="396" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Culture</text><rect x="198.00000000000003" y="370" width="336.00000000000006" height="46" fill="#f8faf9"/><text x="212.00000000000003" y="396" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Socialist Realism (1934)</text><rect x="534.0000000000001" y="370" width="336.00000000000006" height="46" fill="#f8faf9"/><text x="548.0000000000001" y="396" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Pravda's attack on Shostakovich (1936)</text><line x1="30" y1="416" x2="870" y2="416" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="416" width="168.00000000000003" height="66" fill="#dce9e7"/><text x="44" y="442" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Religion</text><rect x="198.00000000000003" y="416" width="336.00000000000006" height="66" fill="#ffffff"/><text x="212.00000000000003" y="442" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Churches closed, clergy arrested (law of</text><text x="212.00000000000003" y="462" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">1929; cathedral demolished 1931)</text><rect x="534.0000000000001" y="416" width="336.00000000000006" height="66" fill="#ffffff"/><text x="548.0000000000001" y="442" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">1937 census: a majority still believers</text></g><line x1="198.00000000000003" y1="124" x2="198.00000000000003" y2="482" stroke="#c9d6d4" stroke-width="1.5"/><line x1="534.0000000000001" y1="124" x2="534.0000000000001" y2="482" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="124" width="840" height="358" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/>
</svg>