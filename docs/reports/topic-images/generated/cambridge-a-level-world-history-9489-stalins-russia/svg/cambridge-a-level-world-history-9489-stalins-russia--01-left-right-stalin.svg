<rect width="900" height="571" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Left, Right and Stalin in the middle</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">The ideas behind the power struggle</text>
<text x="40" y="140" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">THE LEFT</text><text x="860" y="140" font-size="17" font-weight="700" fill="#b5602e" text-anchor="end">THE RIGHT</text><defs><linearGradient id="sg124" x1="0" x2="1"><stop offset="0" stop-color="#b5d3cf"/><stop offset="1" stop-color="#f2e7b8"/></linearGradient></defs><rect x="60" y="169" width="780" height="26" rx="13" fill="url(#sg124)" stroke="#1e2a44" stroke-width="2.5"/><path d="M122.4,195 L122.4,218 L165.33333333333334,232 L165.33333333333334,252" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="122.4" cy="182" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><path d="M450,195 L450,218 L450,232 L450,252" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="450" cy="182" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><path d="M777.6,195 L777.6,218 L734.6666666666667,232 L734.6666666666667,252" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="777.6" cy="182" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><rect x="30" y="252" width="270.6666666666667" height="133" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="165.33333333333334" y="279.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Trotsky; later Zinoviev,</text><text x="165.33333333333334" y="300.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Kamenev</text><text x="165.33333333333334" y="327" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Rapid industrialisation paid for by</text><text x="165.33333333333334" y="347" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">the peasantry; Permanent</text><text x="165.33333333333334" y="367" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Revolution</text><rect x="314.6666666666667" y="252" width="270.6666666666667" height="133" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="289.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Stalin</text><text x="450" y="316.5" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">Socialism in One Country (1924):</text><text x="450" y="336.5" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">for members tired of waiting for</text><text x="450" y="356.5" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">world revolution</text><rect x="599.3333333333334" y="252" width="270.6666666666667" height="133" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="734.6666666666667" y="299.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Bukharin, Rykov, Tomsky</text><text x="734.6666666666667" y="326.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Defend NEP: a slow,</text><text x="734.6666666666667" y="346.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">peasant-friendly road</text><rect x="30" y="407" width="840" height="132" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="439" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STALIN'S ADVANTAGE</text><text x="50" y="465.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">General Secretary from 1922</text><text x="50" y="493.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Controlled appointments through the Secretariat and Orgburo; the "Lenin enrolment" (1924) brought in</text><text x="50" y="514.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">members who owed their careers to the apparatus</text>
</svg>