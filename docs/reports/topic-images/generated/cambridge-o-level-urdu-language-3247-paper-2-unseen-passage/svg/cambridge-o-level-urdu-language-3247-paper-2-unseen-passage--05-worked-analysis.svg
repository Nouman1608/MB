<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 775" width="900" height="775" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="775" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: from quotation to effect</text>

<rect x="30" y="110" width="840" height="496.4" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,160 L31.25,124 Q31.25,111.25 44,111.25 L856,111.25 Q868.75,111.25 868.75,124 L868.75,160 Z" fill="#b5d3cf"/><text x="344" y="142" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Quotation</text><text x="376" y="142" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Technique</text><line x1="360" y1="110" x2="360" y2="606.4" stroke="#c9d6d4" stroke-width="2"/><text x="526" y="142" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Effect</text><line x1="510" y1="110" x2="510" y2="606.4" stroke="#c9d6d4" stroke-width="2"/><line x1="30" y1="160" x2="870" y2="160" stroke="#c9d6d4" stroke-width="2"/><text x="344" y="210.4" font-size="24" fill="#2e6b62" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;جیسے کوئی بوڑھا اپنی بات&#x200F;</text><text x="344" y="260.4" font-size="24" fill="#2e6b62" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;ادھوری چھوڑ کر جا رہا ہو&#x200F;</text><text x="376" y="226.39999999999998" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">simile</text><text x="526" y="215.39999999999998" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the unfinished talk points to the</text><text x="526" y="237.39999999999998" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">grandmother's unfinished hope</text><line x1="30" y1="284.4" x2="870" y2="284.4" stroke="#c9d6d4" stroke-width="2"/><text x="344" y="336.6" font-size="24" fill="#2e6b62" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;انتظار کرتے کرتے تھک&#x200F;</text><text x="376" y="316.59999999999997" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">nature as a</text><text x="376" y="338.59999999999997" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">mirror</text><text x="526" y="327.59999999999997" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the neem tree shares her grief</text><line x1="30" y1="362.4" x2="870" y2="362.4" stroke="#c9d6d4" stroke-width="2"/><text x="344" y="419.6" font-size="24" fill="#2e6b62" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;اس سال بھی&#x200F;</text><text x="376" y="388.59999999999997" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">detail</text><text x="376" y="410.59999999999997" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">linked to</text><text x="376" y="432.59999999999997" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">detail</text><text x="526" y="410.59999999999997" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the waiting is not new but years old</text><line x1="30" y1="450.4" x2="870" y2="450.4" stroke="#c9d6d4" stroke-width="2"/><text x="344" y="502.6" font-size="24" fill="#2e6b62" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;پتھر کی طرح&#x200F;</text><text x="376" y="493.59999999999997" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">simile</text><text x="526" y="482.59999999999997" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">laughter turned heavy and hurtful:</text><text x="526" y="504.59999999999997" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">others' joy wounds a grieving house</text><line x1="30" y1="528.4" x2="870" y2="528.4" stroke="#c9d6d4" stroke-width="2"/><text x="344" y="580.5999999999999" font-size="24" fill="#2e6b62" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;ہنسی / چپ&#x200F;</text><text x="376" y="571.6" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">contrast</text><text x="526" y="560.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">life outside against silence inside</text><text x="526" y="582.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">deepens her loneliness</text><rect x="30" y="626.4" width="840" height="120" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="54" y="664.4" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Earned personal response</text><text x="846" y="676.4" font-size="26" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;مجھے ... لگا&#x200F;</text><text x="54" y="696.4" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">The closing judgement grows out of the analysis before it,</text><text x="54" y="720.4" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">not added as decoration.</text>
</svg>