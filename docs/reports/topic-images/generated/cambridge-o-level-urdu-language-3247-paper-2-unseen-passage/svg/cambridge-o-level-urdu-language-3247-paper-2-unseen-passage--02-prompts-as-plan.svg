<rect width="900" height="758" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The prompts are your plan</text>

<rect x="30" y="110" width="840" height="108" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="54" y="140" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="start">Question</text><text x="846" y="186" font-size="26" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;اس اقتباس میں مصنف نے انتظار اور تنہائی کی کیفیت کس طرح پیدا کی ہے؟&#x200F;</text><rect x="30" y="240" width="840" height="120" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="340" y="252" width="514" height="96" rx="10" fill="#dce9e7"/><text x="356" y="276" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">Prompt 1</text><text x="840" y="296" font-size="25" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;ماحول اور فطرت کی منظر کشی&#x200F;</text><text x="840" y="334" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">setting and nature</text><line x1="336" y1="300" x2="304" y2="300" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="50" y="274" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">One or two paragraphs</text><rect x="50" y="286" width="240" height="18" rx="4" fill="#b5d3cf"/><text x="170" y="300" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="middle">short quotation 1</text><rect x="50" y="308" width="240" height="18" rx="4" fill="#b5d3cf"/><text x="170" y="322" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="middle">short quotation 2</text><rect x="50" y="330" width="240" height="18" rx="4" fill="#f2e7b8"/><text x="170" y="344" font-size="15" font-weight="600" fill="#8a6d0d" text-anchor="middle">link to the question</text><rect x="30" y="372" width="840" height="120" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="340" y="384" width="514" height="96" rx="10" fill="#dce9e7"/><text x="356" y="408" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">Prompt 2</text><text x="840" y="428" font-size="25" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;دادی کا رویّہ اور ان کے الفاظ&#x200F;</text><text x="840" y="466" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">the grandmother's manner and words</text><line x1="336" y1="432" x2="304" y2="432" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="50" y="406" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">One or two paragraphs</text><rect x="50" y="418" width="240" height="18" rx="4" fill="#b5d3cf"/><text x="170" y="432" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="middle">short quotation 1</text><rect x="50" y="440" width="240" height="18" rx="4" fill="#b5d3cf"/><text x="170" y="454" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="middle">short quotation 2</text><rect x="50" y="462" width="240" height="18" rx="4" fill="#f2e7b8"/><text x="170" y="476" font-size="15" font-weight="600" fill="#8a6d0d" text-anchor="middle">link to the question</text><rect x="30" y="504" width="840" height="120" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="340" y="516" width="514" height="96" rx="10" fill="#dce9e7"/><text x="356" y="540" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">Prompt 3</text><text x="840" y="560" font-size="25" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;بچوں کی ہنسی اور گھر کی خاموشی کا تضاد&#x200F;</text><text x="840" y="598" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">children's laughter against the silent house</text><line x1="336" y1="564" x2="304" y2="564" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="50" y="538" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">One or two paragraphs</text><rect x="50" y="550" width="240" height="18" rx="4" fill="#b5d3cf"/><text x="170" y="564" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="middle">short quotation 1</text><rect x="50" y="572" width="240" height="18" rx="4" fill="#b5d3cf"/><text x="170" y="586" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="middle">short quotation 2</text><rect x="50" y="594" width="240" height="18" rx="4" fill="#f2e7b8"/><text x="170" y="608" font-size="15" font-weight="600" fill="#8a6d0d" text-anchor="middle">link to the question</text><rect x="30" y="646" width="840" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="680" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">List two or three short quotations under each prompt before writing.</text><text x="54" y="708" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">The prompts suggest; they do not limit. A good point outside them is still credited.</text>
</svg>