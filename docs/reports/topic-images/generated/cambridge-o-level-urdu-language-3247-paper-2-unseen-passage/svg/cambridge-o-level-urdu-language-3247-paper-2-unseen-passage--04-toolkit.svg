<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1072" width="900" height="1072" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="1072" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The toolkit: terms and what they do</text>

<rect x="30" y="110" width="840" height="793.9999999999999" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,160 L31.25,124 Q31.25,111.25 44,111.25 L856,111.25 Q868.75,111.25 868.75,124 L868.75,160 Z" fill="#b5d3cf"/><text x="284" y="142" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Urdu term</text><text x="316" y="142" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">English</text><line x1="300" y1="110" x2="300" y2="903.9999999999999" stroke="#c9d6d4" stroke-width="2"/><text x="486" y="142" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Ask yourself</text><line x1="470" y1="110" x2="470" y2="903.9999999999999" stroke="#c9d6d4" stroke-width="2"/><line x1="30" y1="160" x2="870" y2="160" stroke="#c9d6d4" stroke-width="2"/><text x="284" y="210.4" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;تشبیہ&#x200F;</text><text x="316" y="201.39999999999998" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">simile</text><text x="486" y="190.39999999999998" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">What two things are compared, and what does</text><text x="486" y="212.39999999999998" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the comparison reveal?</text><line x1="30" y1="234.4" x2="870" y2="234.4" stroke="#c9d6d4" stroke-width="2"/><text x="284" y="284.8" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;استعارہ&#x200F;</text><text x="316" y="275.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">metaphor</text><text x="486" y="275.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">What is one thing called, and why?</text><line x1="30" y1="308.8" x2="870" y2="308.8" stroke="#c9d6d4" stroke-width="2"/><text x="284" y="359.20000000000005" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;پیکر تراشی / منظر نگاری&#x200F;</text><text x="316" y="339.2" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">imagery,</text><text x="316" y="361.2" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">description</text><text x="486" y="339.2" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Which senses are used, and what atmosphere</text><text x="486" y="361.2" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">results?</text><line x1="30" y1="383.20000000000005" x2="870" y2="383.20000000000005" stroke="#c9d6d4" stroke-width="2"/><text x="284" y="433.6" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;تضاد&#x200F;</text><text x="316" y="424.6" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">contrast</text><text x="486" y="413.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Which two things are set against each other,</text><text x="486" y="435.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">and what does the gap show?</text><line x1="30" y1="457.6" x2="870" y2="457.6" stroke="#c9d6d4" stroke-width="2"/><text x="284" y="508" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;تکرار&#x200F;</text><text x="316" y="499" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">repetition</text><text x="486" y="499" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">What is stressed by saying it again?</text><line x1="30" y1="532" x2="870" y2="532" stroke="#c9d6d4" stroke-width="2"/><text x="284" y="582.4" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;علامت&#x200F;</text><text x="316" y="573.4000000000001" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">symbol</text><text x="486" y="573.4000000000001" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Does an object stand for an idea or feeling?</text><line x1="30" y1="606.4" x2="870" y2="606.4" stroke="#c9d6d4" stroke-width="2"/><text x="284" y="656.8" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;لہجہ&#x200F;</text><text x="316" y="647.8000000000001" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">tone</text><text x="486" y="636.8000000000001" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Is the voice bitter, tender, ironic,</text><text x="486" y="658.8000000000001" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">resigned?</text><line x1="30" y1="680.8" x2="870" y2="680.8" stroke="#c9d6d4" stroke-width="2"/><text x="284" y="731.1999999999999" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;کردار نگاری&#x200F;</text><text x="316" y="722.2" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">characterisation</text><text x="486" y="711.2" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">What do actions and speech reveal that is</text><text x="486" y="733.2" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">not stated?</text><line x1="30" y1="755.1999999999999" x2="870" y2="755.1999999999999" stroke="#c9d6d4" stroke-width="2"/><text x="284" y="805.5999999999999" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;مکالمہ&#x200F;</text><text x="316" y="796.6" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">dialogue</text><text x="486" y="796.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">What is said, and what is left unsaid?</text><line x1="30" y1="829.5999999999999" x2="870" y2="829.5999999999999" stroke="#c9d6d4" stroke-width="2"/><text x="284" y="879.9999999999999" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;طنز / مزاح&#x200F;</text><text x="316" y="860" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">satire /</text><text x="316" y="882" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">humour</text><text x="486" y="871" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">What is being mocked or gently laughed at?</text><rect x="30" y="923.9999999999999" width="840" height="120" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="54" y="959.9999999999999" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Poetry extract? Add form:</text><text x="54" y="989.9999999999999" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">rhyme and refrain, stanza pattern, rhythm, line breaks.</text><text x="54" y="1015.9999999999999" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Name a feature only if you can say what it does.</text><text x="810" y="979.9999999999999" font-size="26" fill="#1e2a44" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;قافیہ&#x200F;</text><text x="810" y="1019.9999999999999" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">rhyme</text><text x="700" y="979.9999999999999" font-size="26" fill="#1e2a44" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;ردیف&#x200F;</text><text x="700" y="1019.9999999999999" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">refrain</text>
</svg>