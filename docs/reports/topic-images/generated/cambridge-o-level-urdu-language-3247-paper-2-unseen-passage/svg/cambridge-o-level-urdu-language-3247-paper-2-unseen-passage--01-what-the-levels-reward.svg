<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 840" width="900" height="840" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="840" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Part 1: what the levels reward</text>

<rect x="30" y="110" width="840" height="266" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="54" y="150" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Top level (18-20 of 20)</text><rect x="54" y="172" width="792" height="40" rx="8" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="72" y="199" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">"Sustains a perceptive, convincing and relevant personal response."</text><rect x="54" y="220" width="792" height="40" rx="8" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="72" y="247" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">"shows a clear critical understanding of the text and its deeper implications"</text><rect x="54" y="268" width="792" height="40" rx="8" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="72" y="295" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">"responds sensitively and in detail to the way the writer achieves effects"</text><rect x="54" y="316" width="792" height="40" rx="8" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="72" y="343" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">"integrates much well-selected reference to the text."</text><text x="450" y="412" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Three ideas to aim for</text><rect x="30" y="430" width="268" height="128" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="50" y="466.15" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Deeper implications</text><text x="50" y="494.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">what the extract suggests,</text><text x="50" y="516.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">not only what happens</text><rect x="316" y="430" width="268" height="128" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="336" y="466.15" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Effects</text><text x="336" y="494.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">how word choice, imagery</text><text x="336" y="516.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">and structure shape the</text><text x="336" y="538.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">reader's response</text><rect x="602" y="430" width="268" height="128" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="622" y="466.15" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Integrated reference</text><text x="622" y="494.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">short quotations woven into</text><text x="622" y="516.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">your sentences</text><text x="450" y="598" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Lower down, the response to language thins out</text><rect x="30" y="616" width="840" height="56" rx="10" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="52" y="651" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">11-14</text><text x="180" y="651" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">"makes some response to the way the writer uses language"</text><rect x="30" y="682" width="760" height="56" rx="10" fill="#fbf1ea" stroke="#b5602e" stroke-width="2.5"/><text x="52" y="717" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Level below</text><text x="180" y="717" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">"makes a little reference to the language of the text"</text><rect x="30" y="748" width="680" height="56" rx="10" fill="#fbf1ea" stroke="#b5602e" stroke-width="2.5"/><text x="52" y="783" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Level 2</text><text x="180" y="783" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">a paraphrase: "a basic understanding of surface meaning"</text>
</svg>