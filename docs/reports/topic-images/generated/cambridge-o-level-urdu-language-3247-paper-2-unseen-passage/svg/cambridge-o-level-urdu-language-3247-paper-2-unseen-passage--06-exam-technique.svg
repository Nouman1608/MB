<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 885" width="900" height="885" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="885" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Timing and exam technique</text>

<text x="450" y="124" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Paper 2: two hours, 50 marks</text><rect x="30" y="140" width="330" height="80" rx="10" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="195" y="174" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Part 1 Unseen: 20 marks</text><text x="195" y="202" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">roughly 45-50 minutes, with reading</text><rect x="366" y="140" width="504" height="80" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="618" y="174" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Two essays: 15 + 15 marks</text><text x="618" y="202" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">the rest of the time</text><rect x="30" y="250" width="840" height="87" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="293.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="302.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="122" y="288" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Read the question and prompts first</text><text x="122" y="316" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">So your first reading of the extract is already focused.</text><rect x="30" y="347" width="840" height="87" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="390.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="399.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="122" y="385" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Annotate</text><text x="122" y="413" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Underline key words; write the technique and a one-word effect in the margin.</text><rect x="30" y="444" width="840" height="87" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="487.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="496.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="122" y="482" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Open with a direct answer</text><text x="122" y="510" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Two or three sentences answering the question.</text><rect x="30" y="541" width="840" height="87" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="584.5" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="76" y="593.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="122" y="579" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">One paragraph per prompt</text><text x="122" y="607" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Each with at least two integrated quotations.</text><rect x="30" y="638" width="840" height="87" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="681.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="690.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="122" y="676" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">End with a short personal judgement</text><text x="122" y="704" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">One that grows out of your analysis.</text><rect x="30" y="745" width="410" height="112" rx="14" fill="#fbf1ea" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="781.15" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">Weak</text><text x="50" y="809.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">"There is a simile in line 2." A device</text><text x="50" y="831.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">spotted, no effect.</text><rect x="460" y="745" width="410" height="112" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="480" y="781.15" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Strong</text><text x="480" y="809.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Say what the device makes the reader see or</text><text x="480" y="831.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">feel.</text>
</svg>