<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="560" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Reading an unseen extract in three passes</text>

<rect x="30" y="110" width="268" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="164" cy="152" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="164" y="160.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="164" y="206" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">First pass</text><text x="164" y="236" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">What happens or what</text><text x="164" y="260" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">is said</text><text x="52" y="296" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Who is speaking or</text><text x="52" y="317" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">described?</text><text x="52" y="348" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Where and when? What</text><text x="52" y="369" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">situation?</text><text x="52" y="400" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Write a one-sentence</text><text x="52" y="421" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">summary in the margin.</text><line x1="300" y1="275" x2="314" y2="275" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="316" y="110" width="268" height="330" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><circle cx="450" cy="152" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="450" y="160.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="450" y="206" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">Second pass</text><text x="450" y="236" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">How it feels</text><text x="338" y="296" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">What mood is created?</text><text x="338" y="327" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Does it change?</text><text x="338" y="358" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Mark the words that carry</text><text x="338" y="379" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the feeling most strongly.</text><line x1="586" y1="275" x2="600" y2="275" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="602" y="110" width="268" height="330" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><circle cx="736" cy="152" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="736" y="160.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="736" y="206" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">Third pass</text><text x="736" y="236" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">How it is done</text><text x="624" y="296" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">For each marked word: what</text><text x="624" y="317" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">technique is at work?</text><text x="624" y="348" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">What does it make you think</text><text x="624" y="369" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">or feel?</text><rect x="30" y="462" width="840" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="504" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Read the question and prompts before the extract, so the first pass is already focused.</text>
</svg>