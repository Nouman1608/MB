<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 727" width="900" height="727" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="727" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four case-study wars, to scale</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Each bar runs from the start of the war to its end; the trigger is named below</text>
<line x1="70" y1="124" x2="70" y2="522" stroke="#c9d6d4" stroke-width="1.5" stroke-dasharray="4 6"/><line x1="70" y1="522" x2="70" y2="532" stroke="#1e2a44" stroke-width="2.5"/><text x="70" y="554" font-size="16" font-weight="600" fill="#4a5568" text-anchor="middle">1910</text><line x1="166.25" y1="124" x2="166.25" y2="522" stroke="#c9d6d4" stroke-width="1.5" stroke-dasharray="4 6"/><line x1="166.25" y1="522" x2="166.25" y2="532" stroke="#1e2a44" stroke-width="2.5"/><text x="166.25" y="554" font-size="16" font-weight="600" fill="#4a5568" text-anchor="middle">1920</text><line x1="262.5" y1="124" x2="262.5" y2="522" stroke="#c9d6d4" stroke-width="1.5" stroke-dasharray="4 6"/><line x1="262.5" y1="522" x2="262.5" y2="532" stroke="#1e2a44" stroke-width="2.5"/><text x="262.5" y="554" font-size="16" font-weight="600" fill="#4a5568" text-anchor="middle">1930</text><line x1="358.75" y1="124" x2="358.75" y2="522" stroke="#c9d6d4" stroke-width="1.5" stroke-dasharray="4 6"/><line x1="358.75" y1="522" x2="358.75" y2="532" stroke="#1e2a44" stroke-width="2.5"/><text x="358.75" y="554" font-size="16" font-weight="600" fill="#4a5568" text-anchor="middle">1940</text><line x1="455" y1="124" x2="455" y2="522" stroke="#c9d6d4" stroke-width="1.5" stroke-dasharray="4 6"/><line x1="455" y1="522" x2="455" y2="532" stroke="#1e2a44" stroke-width="2.5"/><text x="455" y="554" font-size="16" font-weight="600" fill="#4a5568" text-anchor="middle">1950</text><line x1="551.25" y1="124" x2="551.25" y2="522" stroke="#c9d6d4" stroke-width="1.5" stroke-dasharray="4 6"/><line x1="551.25" y1="522" x2="551.25" y2="532" stroke="#1e2a44" stroke-width="2.5"/><text x="551.25" y="554" font-size="16" font-weight="600" fill="#4a5568" text-anchor="middle">1960</text><line x1="647.5" y1="124" x2="647.5" y2="522" stroke="#c9d6d4" stroke-width="1.5" stroke-dasharray="4 6"/><line x1="647.5" y1="522" x2="647.5" y2="532" stroke="#1e2a44" stroke-width="2.5"/><text x="647.5" y="554" font-size="16" font-weight="600" fill="#4a5568" text-anchor="middle">1970</text><line x1="743.75" y1="124" x2="743.75" y2="522" stroke="#c9d6d4" stroke-width="1.5" stroke-dasharray="4 6"/><line x1="743.75" y1="522" x2="743.75" y2="532" stroke="#1e2a44" stroke-width="2.5"/><text x="743.75" y="554" font-size="16" font-weight="600" fill="#4a5568" text-anchor="middle">1980</text><line x1="840" y1="124" x2="840" y2="522" stroke="#c9d6d4" stroke-width="1.5" stroke-dasharray="4 6"/><line x1="840" y1="522" x2="840" y2="532" stroke="#1e2a44" stroke-width="2.5"/><text x="840" y="554" font-size="16" font-weight="600" fill="#4a5568" text-anchor="middle">1990</text><line x1="50" y1="522" x2="860" y2="522" stroke="#1e2a44" stroke-width="3"/><rect x="108.5" y="150" width="38.5" height="24" rx="6" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="108.5" y="142" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">First World War, 1914-18</text><text x="108.5" y="196" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Trigger: assassination of Franz Ferdinand, 28 June 1914</text><rect x="320.25" y="246" width="28.875" height="24" rx="6" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="320.25" y="238" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Spanish Civil War, 1936-39</text><text x="320.25" y="292" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Trigger: military rising of 17-18 July 1936</text><rect x="743.75" y="342" width="77" height="24" rx="6" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="820.75" y="334" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">Iran-Iraq War, 1980-88</text><text x="820.75" y="388" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end">Trigger: Iraqi invasion, 22 September 1980</text><rect x="763" y="438" width="10" height="24" rx="6" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="773" y="430" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">Falklands War, 1982</text><text x="773" y="484" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end">Trigger: Argentine invasion, 2 April 1982</text><rect x="30" y="584" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="618.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Choose pairs from different regions</text><text x="50" y="648.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The First World War and the Spanish Civil War are both European, so pair one of them with a war</text><text x="50" y="670.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">from another region. Comparing a total war with a civil or limited war also helps.</text>
</svg>