<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 538" width="900" height="538" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="538" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Total war and limited war</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Two of the four types of war in the guide</text>
<rect x="210.71" y="124" width="95.876" height="31" rx="15.5" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="258.648" y="145.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Civil war</text><rect x="316.586" y="124" width="130.284" height="31" rx="15.5" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="381.728" y="145.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Guerrilla war</text><rect x="456.87" y="124" width="120.679" height="31" rx="15.5" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="517.2095" y="145.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Limited war</text><rect x="587.549" y="124" width="101.741" height="31" rx="15.5" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="638.4195" y="145.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Total war</text><rect x="30" y="177" width="410" height="218" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="209" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">TOTAL WAR</text><text x="50" y="236.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">First World War</text><text x="50" y="266.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="266.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Conscription in Britain from 1916</text><text x="50" y="296.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="296.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">State control through the Defence of the</text><text x="66.15" y="318.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Realm Act (1914)</text><text x="50" y="348.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="348.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Economies turned over to war production</text><rect x="460" y="177" width="410" height="218" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="480" y="209" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">LIMITED WAR</text><text x="480" y="236.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Falklands War (1982)</text><text x="480" y="266.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="496.15" y="266.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Confined to the islands and the surrounding</text><text x="496.15" y="288.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">sea</text><text x="480" y="318.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="496.15" y="318.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Limited aims on both sides</text><text x="480" y="348.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="496.15" y="348.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Neither side tried to defeat the other</text><text x="496.15" y="370.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">completely</text><rect x="30" y="417" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="451.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Use the type to explain the outcome</text><text x="50" y="481.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Say why a war was total, limited, civil or guerrilla, and how that shaped who won.</text>
</svg>