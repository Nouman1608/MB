<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 523" width="900" height="523" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="523" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Effects: wider than the peace treaty</text>

<line x1="340" y1="171" x2="409" y2="258.15" stroke="#1e2a44" stroke-width="2.5"/><line x1="340" y1="316.5" x2="409" y2="301.8" stroke="#1e2a44" stroke-width="2.5"/><line x1="340" y1="441" x2="409" y2="339.15" stroke="#1e2a44" stroke-width="2.5"/><line x1="560" y1="207" x2="491" y2="268.95" stroke="#1e2a44" stroke-width="2.5"/><line x1="560" y1="373.5" x2="491" y2="318.9" stroke="#1e2a44" stroke-width="2.5"/><circle cx="450" cy="295.5" r="82" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="290.04" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Effects</text><text x="450" y="315.66" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">of war</text><rect x="30" y="100" width="310" height="142" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="130.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Peacemaking</text><text x="46" y="158.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Paris settlement after 1918</text><text x="46" y="179.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">(Versailles, 28 June 1919); League</text><text x="46" y="200.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">of Nations. Ended the war but left</text><text x="46" y="221.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">grievances, especially in Germany.</text><rect x="30" y="256" width="310" height="121" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="286.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Territorial change</text><text x="46" y="314.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Break-up of the Austro-Hungarian,</text><text x="46" y="335.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Ottoman and Russian empires; new</text><text x="46" y="356.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">states in central and eastern Europe.</text><rect x="30" y="391" width="310" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="421.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Economic, social, demographic</text><text x="46" y="449.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Debts, inflation, mass casualties and</text><text x="46" y="470.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">refugees.</text><rect x="560" y="136" width="310" height="142" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="576" y="166.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Political repercussions</text><text x="576" y="194.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Revolution in Russia (1917); fall of</text><text x="576" y="215.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the Argentine junta and civilian rule</text><text x="576" y="236.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">in 1983; Franco's dictatorship after</text><text x="576" y="257.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">1939.</text><rect x="560" y="292" width="310" height="163" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="576" y="322.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Women</text><text x="576" y="350.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Wartime work in munitions and</text><text x="576" y="371.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">services; in Britain, the 1918 Act</text><text x="576" y="392.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">gave the vote to women over 30</text><text x="576" y="413.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">who met a property qualification.</text><text x="576" y="434.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">How far did change last?</text>
</svg>