<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 518" width="900" height="518" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="518" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The three parts of the topic</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Causes, practices and effects of 20th-century wars</text>
<rect x="30" y="124" width="253.33333333333334" height="229" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="152" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PART 1</text><text x="46" y="178.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Causes of war</text><text x="46" y="207.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="61.2" y="207.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Economic, ideological,</text><text x="61.2" y="228.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">political, territorial and</text><text x="61.2" y="249.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">other</text><text x="46" y="275.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="61.2" y="275.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Short-term and long-term</text><line x1="289.33333333333337" y1="238.5" x2="317.33333333333337" y2="238.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="323.33333333333337" y="124" width="253.33333333333334" height="229" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="339.33333333333337" y="152" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PART 2</text><text x="339.33333333333337" y="178.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Practices of war and</text><text x="339.33333333333337" y="202.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">impact on the outcome</text><text x="339.33333333333337" y="231.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="354.53333333333336" y="231.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Types of war</text><text x="339.33333333333337" y="257.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="354.53333333333336" y="257.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Technology and theatres:</text><text x="354.53333333333336" y="278.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">air, land, sea</text><text x="339.33333333333337" y="304.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="354.53333333333336" y="304.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Mobilization of resources</text><text x="339.33333333333337" y="330.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="354.53333333333336" y="330.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Foreign powers</text><line x1="582.6666666666667" y1="238.5" x2="610.6666666666667" y2="238.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="616.6666666666667" y="124" width="253.33333333333334" height="229" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="632.6666666666667" y="152" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PART 3</text><text x="632.6666666666667" y="178.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Effects of war</text><text x="632.6666666666667" y="207.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="647.8666666666668" y="207.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Peacemaking</text><text x="632.6666666666667" y="233.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="647.8666666666668" y="233.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Territorial change</text><text x="632.6666666666667" y="259.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="647.8666666666668" y="259.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Political repercussions</text><text x="632.6666666666667" y="285.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="647.8666666666668" y="285.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Economic, social,</text><text x="647.8666666666668" y="306.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">demographic</text><text x="632.6666666666667" y="332.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="647.8666666666668" y="332.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Role and status of women</text><rect x="30" y="375" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="409.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The most neglected part is Part 2</text><text x="50" y="439.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Impact on the outcome means explaining <tspan font-weight="700" fill="#1e2a44">why</tspan> <tspan font-weight="700" fill="#1e2a44">one</tspan> <tspan font-weight="700" fill="#1e2a44">side</tspan> <tspan font-weight="700" fill="#1e2a44">won</tspan>, not only describing how the fighting</text><text x="50" y="461.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">took place.</text>
</svg>