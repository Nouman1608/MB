<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 657" width="900" height="657" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="657" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why the Nationalists won</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">The balance of resources and unity in the Spanish Civil War</text>
<path d="M400,294 L500,294 L450,170 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><line x1="150" y1="186" x2="750" y2="142" stroke="#1e2a44" stroke-width="7" stroke-linecap="round"/><circle cx="450" cy="164" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><line x1="150" y1="186" x2="80" y2="246" stroke="#1e2a44" stroke-width="2.5"/><line x1="150" y1="186" x2="220" y2="246" stroke="#1e2a44" stroke-width="2.5"/><path d="M55,246 L245,246 Q230,286 150,286 Q70,286 55,246 Z" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="150" y="272" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Nationalists</text><line x1="750" y1="142" x2="680" y2="202" stroke="#1e2a44" stroke-width="2.5"/><line x1="750" y1="142" x2="820" y2="202" stroke="#1e2a44" stroke-width="2.5"/><path d="M655,202 L845,202 Q830,242 750,242 Q670,242 655,202 Z" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><text x="750" y="228" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Republic</text><rect x="30" y="308" width="410" height="184" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="340.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Nationalist advantages</text><text x="48" y="369.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="63.2" y="369.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">German and Italian aircraft carry the Army of</text><text x="63.2" y="390.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Africa across the Strait of Gibraltar</text><text x="48" y="419.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="63.2" y="419.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Condor Legion and tens of thousands of Italian</text><text x="63.2" y="440.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">troops</text><text x="48" y="469.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="63.2" y="469.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Franco's unified command</text><rect x="460" y="308" width="410" height="184" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="478" y="340.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Republican weaknesses</text><text x="478" y="369.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="493.2" y="369.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Soviet aid, paid with the gold reserves: key at</text><text x="493.2" y="390.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Madrid, less after 1937</text><text x="478" y="419.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="493.2" y="419.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Non-intervention by Britain and France: no</text><text x="493.2" y="440.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">legal arms from the democracies</text><text x="478" y="469.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="493.2" y="469.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Divisions: fighting in Barcelona, May 1937</text><rect x="30" y="514" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="548.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Judgement</text><text x="450" y="578.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Foreign intervention gave the Nationalists the <tspan font-weight="700" fill="#1e2a44">means</tspan> to win; their <tspan font-weight="700" fill="#1e2a44">unity</tspan> let them use those means</text><text x="450" y="600.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">effectively.</text>
</svg>