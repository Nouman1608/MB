<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 779" width="900" height="779" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="779" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Linking practices to the outcome</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Each practice is evidence for why one side won</text>
<text x="30" y="138" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">FIRST WORLD WAR</text><line x1="60" y1="182" x2="60" y2="556" stroke="#c9d6d4" stroke-width="4"/><rect x="104" y="162" width="766" height="105" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="194.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Land: technology brings deadlock</text><text x="122" y="223.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Machine guns and artillery produce trench deadlock on the Western Front. Poison gas at Ypres</text><text x="122" y="244.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">(1915); tanks first at the Somme (September 1916).</text><circle cx="60" cy="214.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="223.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="104" y="279" width="766" height="105" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="311.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Sea: submarine warfare</text><text x="122" y="340.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Unrestricted submarine warfare, resumed in February 1917, helps bring the USA into the war in</text><text x="122" y="361.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">April 1917.</text><circle cx="60" cy="331.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="340.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="104" y="396" width="766" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="428.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Mobilization of resources</text><text x="122" y="457.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The Allies' greater industrial and financial resources, especially after American entry ...</text><circle cx="60" cy="438" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="446.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="104" y="492" width="766" height="84" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="122" y="524.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Outcome</text><text x="122" y="553.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">... wear down the Central Powers by 1918.</text><circle cx="60" cy="534" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="542.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="30" y="622" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">FALKLANDS WAR</text><rect x="30" y="646" width="395" height="101" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="676.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Air power and submarines</text><text x="46" y="705.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A British submarine sinks the <tspan font-style="italic">General</tspan> <tspan font-style="italic">Belgrano</tspan></text><text x="46" y="726.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">(2 May 1982).</text><line x1="431" y1="696.5" x2="469" y2="696.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="475" y="646" width="395" height="101" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="491" y="687.32" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Effect on the outcome</text><text x="491" y="716.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The Argentine navy then stays in port.</text>
</svg>