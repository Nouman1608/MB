<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 569" width="900" height="569" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="569" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Sorting causes: the Falklands War</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Sort by timescale and type, then rank and link</text>
<rect x="30" y="124" width="194.63414634146343" height="190" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="152" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">LONG-TERM</text><text x="46" y="178.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Argentine claim to</text><text x="46" y="201.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">the islands</text><text x="46" y="229.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Long-standing</text><rect x="238.63414634146343" y="124" width="194.63414634146343" height="190" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="254.63414634146343" y="152" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">LONG-TERM</text><text x="254.63414634146343" y="178.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">British reluctance</text><text x="254.63414634146343" y="201.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">to fund their</text><text x="254.63414634146343" y="224.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">defence</text><rect x="447.26829268292687" y="124" width="243.2926829268293" height="190" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="463.26829268292687" y="152" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SHORT-TERM</text><text x="463.26829268292687" y="178.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Junta needs a popular</text><text x="463.26829268292687" y="201.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">cause</text><text x="463.26829268292687" y="229.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">amid economic crisis</text><rect x="704.5609756097562" y="124" width="165.4390243902439" height="190" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="720.5609756097562" y="152" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">TRIGGER</text><text x="720.5609756097562" y="178.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Argentine</text><text x="720.5609756097562" y="201.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">invasion</text><text x="720.5609756097562" y="229.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">2 April 1982</text><rect x="46" y="264" width="92.34" height="29" rx="14.5" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="92.17" y="283.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">territorial</text><rect x="463.26829268292687" y="264" width="81.93" height="29" rx="14.5" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="504.23329268292684" y="283.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">political</text><rect x="553.1982926829269" y="264" width="96.075" height="29" rx="14.5" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="601.2357926829269" y="283.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">economic</text><path d="M127.31707317073172,318 L127.31707317073172,354 L568.9146341463415,354" fill="none" stroke="#8a6d0d" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><line x1="568.9146341463415" y1="354" x2="568.9146341463415" y2="322" stroke="#8a6d0d" stroke-width="3.5" marker-end="url(#ahO)"/><rect x="198.11585365853665" y="337" width="300" height="34" rx="17" fill="#f4f6f6"/><text x="348.11585365853665" y="360" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">the claim served a political need</text><rect x="30" y="394" width="253.33333333333334" height="143" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="424.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Sort</text><text x="46" y="453.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Label each cause by type</text><text x="46" y="474.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">(economic, ideological,</text><text x="46" y="495.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">political, territorial) and by</text><text x="46" y="516.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">timescale.</text><line x1="289.33333333333337" y1="465.5" x2="317.33333333333337" y2="465.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="323.33333333333337" y="394" width="253.33333333333334" height="143" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="339.33333333333337" y="445.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Rank</text><text x="339.33333333333337" y="474.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Decide which cause</text><text x="339.33333333333337" y="495.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">mattered most and say why.</text><line x1="582.6666666666667" y1="465.5" x2="610.6666666666667" y2="465.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="616.6666666666667" y="394" width="253.33333333333334" height="143" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="632.6666666666667" y="435.32" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Link</text><text x="632.6666666666667" y="464.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Show how categories</text><text x="632.6666666666667" y="485.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">overlap, as the territorial</text><text x="632.6666666666667" y="506.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">claim did here.</text>
</svg>