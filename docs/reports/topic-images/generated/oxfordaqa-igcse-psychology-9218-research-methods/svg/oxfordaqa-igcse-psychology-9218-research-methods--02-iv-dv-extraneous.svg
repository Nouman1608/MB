<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 545" width="900" height="545" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="545" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Independent, dependent and extraneous variables</text>

<rect x="30" y="230" width="280" height="150" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="262" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">INDEPENDENT VARIABLE</text><text x="50" y="288.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">What the researcher</text><text x="50" y="312.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">changes</text><text x="50" y="341.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">silence versus music</text><rect x="590" y="230" width="280" height="150" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="610" y="262" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">DEPENDENT VARIABLE</text><text x="610" y="288.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">What is measured</text><text x="610" y="317.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">number of words recalled</text><line x1="318" y1="305" x2="582" y2="305" stroke="#1e2a44" stroke-width="5" marker-end="url(#ah)"/><text x="450" y="292" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">causes?</text><text x="450" y="112" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">EXTRANEOUS VARIABLES</text><rect x="232.16" y="120" width="111.104" height="30" rx="15" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><text x="287.712" y="140.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">time of day</text><rect x="353.264" y="120" width="128.94400000000002" height="30" rx="15" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><text x="417.736" y="140.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">noise outside</text><rect x="492.208" y="120" width="175.632" height="30" rx="15" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><text x="580.024" y="140.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">familiarity of words</text><line x1="640" y1="158" x2="700" y2="222" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)" stroke-dasharray="8 6"/><text x="690" y="196" font-size="15" font-weight="600" fill="#b5602e" text-anchor="start">may also affect the DV</text><rect x="30" y="402" width="840" height="111" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="436.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Confounding variable</text><text x="50" y="466.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">If an extraneous variable changes <tspan font-weight="700" fill="#1e2a44">along</tspan> <tspan font-weight="700" fill="#1e2a44">with</tspan> the IV, the researcher can no longer be sure the IV</text><text x="50" y="488.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">caused the result.</text>
</svg>