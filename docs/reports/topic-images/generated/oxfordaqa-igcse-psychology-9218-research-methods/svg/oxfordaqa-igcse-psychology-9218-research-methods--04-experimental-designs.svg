<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three experimental designs</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Who takes part in condition A and condition B?</text>
<rect x="30" y="124" width="840" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="160" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Independent groups</text><text x="54" y="188" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Different participants in each</text><text x="54" y="209" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">condition. <tspan font-weight="700">+</tspan> no order effects. <tspan font-weight="700">−</tspan></text><text x="54" y="230" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">participant variables</text><rect x="54" y="244" width="216.51" height="29" rx="14.5" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="162.255" y="263.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">control: random allocation</text><rect x="380" y="146" width="210" height="126" rx="10" fill="#dce9e7"/><rect x="636" y="146" width="210" height="126" rx="10" fill="#f2e7b8"/><text x="485" y="168" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">Condition A</text><text x="741" y="168" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">Condition B</text><circle cx="420" cy="219" r="17" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="420" y="225" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">P1</text><circle cx="676" cy="219" r="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="676" y="225" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">P5</text><circle cx="464" cy="219" r="17" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="464" y="225" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">P2</text><circle cx="720" cy="219" r="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="720" y="225" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">P6</text><circle cx="508" cy="219" r="17" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="508" y="225" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">P3</text><circle cx="764" cy="219" r="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="764" y="225" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">P7</text><circle cx="552" cy="219" r="17" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="552" y="225" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">P4</text><circle cx="808" cy="219" r="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="808" y="225" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">P8</text><rect x="30" y="308" width="840" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="344" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Repeated measures</text><text x="54" y="372" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Same participants do every condition.</text><text x="54" y="393" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-weight="700">+</tspan> no participant variables. <tspan font-weight="700">−</tspan> order</text><text x="54" y="414" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">effects</text><rect x="54" y="428" width="214.02" height="29" rx="14.5" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="161.01" y="447.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">control: counterbalancing</text><rect x="380" y="330" width="210" height="126" rx="10" fill="#dce9e7"/><rect x="636" y="330" width="210" height="126" rx="10" fill="#f2e7b8"/><text x="485" y="352" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">Condition A</text><text x="741" y="352" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">Condition B</text><circle cx="420" cy="403" r="17" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="420" y="409" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">P1</text><circle cx="676" cy="403" r="17" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="676" y="409" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">P1</text><circle cx="464" cy="403" r="17" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="464" y="409" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">P2</text><circle cx="720" cy="403" r="17" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="720" y="409" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">P2</text><circle cx="508" cy="403" r="17" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="508" y="409" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">P3</text><circle cx="764" cy="403" r="17" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="764" y="409" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">P3</text><circle cx="552" cy="403" r="17" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="552" y="409" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">P4</text><circle cx="808" cy="403" r="17" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="808" y="409" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">P4</text><text x="613" y="408" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">=</text><rect x="30" y="492" width="840" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="528" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Matched pairs</text><text x="54" y="556" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Pairs matched on a key variable, one</text><text x="54" y="577" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">of each pair per condition. <tspan font-weight="700">−</tspan> matching</text><text x="54" y="598" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">is slow, never perfect</text><rect x="54" y="612" width="235.365" height="29" rx="14.5" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="171.6825" y="631.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">control: pre-testing to match</text><rect x="380" y="514" width="210" height="126" rx="10" fill="#dce9e7"/><rect x="636" y="514" width="210" height="126" rx="10" fill="#f2e7b8"/><text x="485" y="536" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">Condition A</text><text x="741" y="536" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">Condition B</text><circle cx="420" cy="587" r="17" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="420" y="593" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">A1</text><circle cx="676" cy="587" r="17" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="676" y="593" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">A2</text><circle cx="464" cy="587" r="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="464" y="593" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">B1</text><circle cx="720" cy="587" r="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="720" y="593" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">B2</text><circle cx="508" cy="587" r="17" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.5"/><text x="508" y="593" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">C1</text><circle cx="764" cy="587" r="17" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.5"/><text x="764" y="593" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">C2</text><circle cx="552" cy="587" r="17" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="552" y="593" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">D1</text><circle cx="808" cy="587" r="17" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="808" y="593" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">D2</text><text x="613" y="592" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">≈</text>
