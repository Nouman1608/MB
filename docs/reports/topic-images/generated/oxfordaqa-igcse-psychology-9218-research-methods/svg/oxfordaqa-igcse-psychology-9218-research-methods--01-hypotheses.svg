<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Alternative and null hypotheses</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Both must be operationalised: variables stated in measurable terms</text>
<rect x="30" y="124" width="840" height="134" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="54" y="160" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">ALTERNATIVE: predicts an effect</text><text x="54" y="189" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">Participants who learn a list of 20 words</text><rect x="421.823" y="171" width="92.944" height="28" rx="5" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><text x="424.823" y="189" font-size="19" font-weight="600" fill="#1e2a44" text-anchor="start">in silence</text><text x="522.445" y="189" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">will</text><rect x="559.4590000000001" y="171" width="171.072" height="28" rx="5" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="562.4590000000001" y="189" font-size="19" font-weight="600" fill="#1e2a44" text-anchor="start">recall more words</text><text x="54" y="223" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">than participants who learn the same list</text><rect x="423.837" y="205" width="168.887" height="28" rx="5" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><text x="426.837" y="223" font-size="19" font-weight="600" fill="#1e2a44" text-anchor="start">while music plays</text><text x="589.7239999999999" y="223" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">.</text><rect x="30" y="274" width="840" height="134" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="310" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">NULL: predicts no effect</text><text x="54" y="339" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">There will be no difference in the</text><rect x="358.268" y="321" width="241.448" height="28" rx="5" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="361.268" y="339" font-size="19" font-weight="600" fill="#1e2a44" text-anchor="start">number of words recalled</text><text x="607.394" y="339" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">between</text><text x="54" y="373" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">participants who learn</text><rect x="260.741" y="355" width="92.944" height="28" rx="5" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><text x="263.741" y="373" font-size="19" font-weight="600" fill="#1e2a44" text-anchor="start">in silence</text><text x="361.363" y="373" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">and those who learn</text><rect x="551.441" y="355" width="168.887" height="28" rx="5" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><text x="554.441" y="373" font-size="19" font-weight="600" fill="#1e2a44" text-anchor="start">while music plays</text><text x="717.328" y="373" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">.</text><rect x="30" y="424" width="176.848" height="30" rx="15" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><text x="118.424" y="444.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">IV: silence or music</text><rect x="220.848" y="424" width="256.86400000000003" height="30" rx="15" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="349.28000000000003" y="444.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">DV: number of words recalled</text>
</svg>