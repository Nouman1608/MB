<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 647" width="900" height="647" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="647" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Counterbalancing and random allocation</text>

<rect x="30" y="100" width="840" height="190" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="136" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">COUNTERBALANCING (repeated measures)</text><text x="54" y="187" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">Half the participants</text><rect x="300" y="156" width="150" height="48" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="375" y="187" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Condition A</text><line x1="456" y1="180" x2="512" y2="180" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="518" y="156" width="150" height="48" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="593" y="187" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Condition B</text><text x="54" y="251" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">The other half</text><rect x="300" y="220" width="150" height="48" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="375" y="251" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Condition B</text><line x1="456" y1="244" x2="512" y2="244" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="518" y="220" width="150" height="48" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="593" y="251" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Condition A</text><text x="700" y="182" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Practice and</text><text x="700" y="203" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">fatigue effects are</text><text x="700" y="224" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">spread</tspan> <tspan font-weight="700">evenly</tspan></text><rect x="30" y="312" width="840" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="348" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="start">RANDOM ALLOCATION (independent groups)</text><path d="M90,382 L190,382 L178,452 L102,452 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3"/><text x="140" y="424" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">names</text><line x1="198" y1="412" x2="300" y2="394" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="198" y1="422" x2="300" y2="440" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="310" y="374" width="115.744" height="30" rx="15" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="367.872" y="394.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Condition A</text><rect x="310" y="422" width="114.384" height="30" rx="15" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="367.192" y="442.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Condition B</text><text x="520" y="394" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Each participant has an <tspan font-weight="700">equal</tspan> <tspan font-weight="700">chance</tspan> of</text><text x="520" y="415" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">either condition, so participant variables</text><text x="520" y="436" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">should balance out.</text><rect x="30" y="504" width="840" height="111" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="538.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Do not confuse</text><text x="50" y="568.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Random</tspan> <tspan font-weight="700" fill="#1e2a44">allocation</tspan> puts participants into conditions. <tspan font-weight="700" fill="#1e2a44">Random</tspan> <tspan font-weight="700" fill="#1e2a44">sampling</tspan> selects people from a</text><text x="50" y="590.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">population.</text>
</svg>