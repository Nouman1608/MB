<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 597" width="900" height="597" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="597" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Working out a stratified sample</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">A school of 600 students; a sample of 50</text>
<text x="30" y="138" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">POPULATION (600)</text><rect x="30" y="148" width="504" height="74" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="282" y="181" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Girls 360</text><text x="282" y="205" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">60%</text><rect x="534" y="148" width="336" height="74" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="702" y="181" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Boys 240</text><text x="702" y="205" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">40%</text><text x="30" y="314" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">SAMPLE (50)</text><rect x="30" y="324" width="504" height="74" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="282" y="368" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">30 girls</text><rect x="534" y="324" width="336" height="74" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="702" y="368" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">20 boys</text><path d="M534,224 L534,320" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 5"/><text x="520" y="274" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end" font-style="italic">same proportions</text><line x1="60" y1="440" x2="60" y2="545" stroke="#c9d6d4" stroke-width="4"/><rect x="104" y="420" width="766" height="43" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="116" y="446.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Girls are 360 ÷ 600 = 60% of the population</text><circle cx="60" cy="441.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="450.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="104" y="471" width="766" height="43" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="116" y="497.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">60% of 50 = 30 girls, leaving 20 boys</text><circle cx="60" cy="492.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="501.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="104" y="522" width="766" height="43" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="116" y="548.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Choose each group at random</text><circle cx="60" cy="543.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="552.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text>
</svg>