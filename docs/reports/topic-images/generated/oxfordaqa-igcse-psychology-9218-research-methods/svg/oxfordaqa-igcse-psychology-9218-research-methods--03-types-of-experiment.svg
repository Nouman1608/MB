<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 554" width="900" height="554" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="554" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Laboratory, field and natural experiments</text>

<rect x="30" y="100" width="270.6666666666667" height="204" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">LABORATORY</text><text x="50" y="158.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Controlled setting</text><text x="50" y="187.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">IV manipulated by the</text><text x="50" y="208.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">researcher</text><text x="50" y="237.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">e.g.</tspan> <tspan font-style="italic">testing</tspan> <tspan font-style="italic">short-term</tspan></text><text x="50" y="258.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">memory</tspan> <tspan font-style="italic">capacity</tspan> <tspan font-style="italic">with</tspan> <tspan font-style="italic">digit</tspan></text><text x="50" y="279.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">strings</tspan></text><rect x="314.6666666666667" y="100" width="270.6666666666667" height="204" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="334.6666666666667" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FIELD</text><text x="334.6666666666667" y="158.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Natural setting</text><text x="334.6666666666667" y="187.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">IV still manipulated by the</text><text x="334.6666666666667" y="208.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">researcher</text><text x="334.6666666666667" y="237.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">e.g.</tspan> <tspan font-style="italic">changing</tspan> <tspan font-style="italic">a</tspan> <tspan font-style="italic">supermarket</tspan></text><text x="334.6666666666667" y="258.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">sign</tspan> <tspan font-style="italic">to</tspan> <tspan font-style="italic">test</tspan> <tspan font-style="italic">perceptual</tspan> <tspan font-style="italic">set</tspan></text><rect x="599.3333333333334" y="100" width="270.6666666666667" height="204" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="619.3333333333334" y="132" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">NATURAL</text><text x="619.3333333333334" y="158.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">IV varies naturally</text><text x="619.3333333333334" y="187.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Researcher only measures the</text><text x="619.3333333333334" y="208.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">DV</text><text x="619.3333333333334" y="237.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">e.g.</tspan> <tspan font-style="italic">comparing</tspan> <tspan font-style="italic">perception</tspan></text><text x="619.3333333333334" y="258.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">across</tspan> <tspan font-style="italic">cultures</tspan></text><defs><linearGradient id="gctl" x1="0" x2="1"><stop offset="0" stop-color="#b5d3cf"/><stop offset="1" stop-color="#f2e7b8"/></linearGradient></defs><rect x="30" y="326" width="840" height="44" rx="22" fill="url(#gctl)" stroke="#1e2a44" stroke-width="2"/><text x="54" y="355" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">◀ more control</text><text x="846" y="355" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="end">more true to life ▶</text><rect x="30" y="392" width="270.6666666666667" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="424" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">WEAKNESS</text><text x="50" y="455.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Artificial; participants may</text><text x="50" y="476.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">change behaviour because</text><text x="50" y="497.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">they know they are studied</text><rect x="314.6666666666667" y="392" width="270.6666666666667" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="334.6666666666667" y="424" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">WEAKNESS</text><text x="334.6666666666667" y="455.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Less control over extraneous</text><text x="334.6666666666667" y="476.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">variables; consent may be</text><text x="334.6666666666667" y="497.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">difficult</text><rect x="599.3333333333334" y="392" width="270.6666666666667" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="619.3333333333334" y="424" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">WEAKNESS</text><text x="619.3333333333334" y="455.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">No random allocation, so</text><text x="619.3333333333334" y="476.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">other differences between</text><text x="619.3333333333334" y="497.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">groups may explain results</text>
</svg>