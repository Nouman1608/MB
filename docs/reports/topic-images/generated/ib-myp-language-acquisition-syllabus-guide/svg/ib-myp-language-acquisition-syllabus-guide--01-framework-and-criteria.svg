stroke-width="3"/><text x="64" y="563.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">A</text><text x="94" y="562" font-size="15" font-weight="600" fill="#4a5568" text-anchor="start">Criterion A</text><text x="46" y="604" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Listening</text><text x="46" y="633" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">construct meaning</text><text x="46" y="652" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">from spoken</text><text x="46" y="671" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">multimodal text,</text><text x="46" y="690" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">including images</text><text x="46" y="709" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">alongside it</text><rect x="243" y="522" width="198" height="214" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="277" cy="556" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="277" y="563.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">B</text><text x="307" y="562" font-size="15" font-weight="600" fill="#4a5568" text-anchor="start">Criterion B</text><text x="259" y="604" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Reading</text><text x="259" y="633" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">construct meaning</text><text x="259" y="652" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">from written,</text><text x="259" y="671" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">spatial and visual</text><text x="259" y="690" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">aspects of texts</text><rect x="456" y="522" width="198" height="214" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="490" cy="556" r="20" fill="#d4b02e" stroke="