<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 923" width="900" height="923" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="923" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Reading quantitative data: TREND</text>

<rect x="30" y="104" width="840" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="67" cy="152" r="21" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="67" y="159.56" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">T</text><text x="104" y="143.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Title and units</text><text x="104" y="173.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">What is measured, where, when, in what units (percentages or numbers)?</text><line x1="450" y1="204" x2="450" y2="240" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="246" width="840" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="67" cy="294" r="21" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="67" y="301.56" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">R</text><text x="104" y="285.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Read extremes</text><text x="104" y="315.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Highest and lowest values.</text><line x1="450" y1="346" x2="450" y2="382" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="388" width="840" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="67" cy="436" r="21" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="67" y="443.56" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">E</text><text x="104" y="427.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Examine change and comparison</text><text x="104" y="457.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Differences between groups and over time.</text><line x1="450" y1="488" x2="450" y2="524" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="530" width="840" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="67" cy="578" r="21" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="67" y="585.56" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">N</text><text x="104" y="569.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Note the kind of change</text><text x="104" y="599.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Percentage points or relative terms?</text><line x1="450" y1="630" x2="450" y2="666" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="672" width="840" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="67" cy="720" r="21" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="67" y="727.56" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">D</text><text x="104" y="711.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Doubt</text><text x="104" y="741.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Who collected it, sample size, definitions, what is missing.</text><rect x="30" y="786" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="822" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Qualitative extracts</text><text x="56" y="851" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Identify what participants say and do, the meanings they appear to give, the</text><text x="56" y="873" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">researcher’s possible influence, and how far one setting can be generalised.</text>
</svg>