<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 830" width="900" height="830" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="830" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Methods that ask questions</text>

<rect x="228" y="104" width="317" height="44" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="386.5" y="131.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Strength</text><rect x="553" y="104" width="317" height="44" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="711.5" y="131.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Limitation</text><rect x="30" y="156" width="190" height="96" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="187.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Postal /</text><text x="42" y="209.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">telephone</text><text x="42" y="231.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">surveys</text><rect x="228" y="156" width="317" height="96" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="242" y="186.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Wide geographical reach; cheap per</text><text x="242" y="207.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">respondent</text><rect x="553" y="156" width="317" height="96" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="567" y="186.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Low postal response; phone</text><text x="567" y="207.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">excludes those without phones or</text><text x="567" y="228.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">who screen calls</text><rect x="30" y="260" width="190" height="93" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="311.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Online surveys</text><rect x="228" y="260" width="317" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="242" y="290.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Fast, cheap, large samples, easy</text><text x="242" y="311.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">analysis</text><rect x="553" y="260" width="317" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="567" y="290.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Excludes people offline;</text><text x="567" y="311.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">self-selection; hard to verify who</text><text x="567" y="332.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">answers</text><rect x="30" y="361" width="190" height="74" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="392.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Self-completion</text><text x="42" y="414.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">surveys</text><rect x="228" y="361" width="317" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="242" y="391.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Anonymity reduces social</text><text x="242" y="412.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">desirability; no interviewer bias</text><rect x="553" y="361" width="317" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="567" y="391.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Misunderstood questions cannot be</text><text x="567" y="412.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">clarified</text><rect x="30" y="443" width="190" height="74" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="474.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Structured</text><text x="42" y="496.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">interviews</text><rect x="228" y="443" width="317" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="242" y="473.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Reliable, comparable answers;</text><text x="242" y="494.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">higher response than postal</text><rect x="553" y="443" width="317" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="567" y="473.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Inflexible; interviewer bias still</text><text x="567" y="494.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">possible</text><rect x="30" y="525" width="190" height="74" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="556.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Unstructured</text><text x="42" y="578.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">interviews</text><rect x="228" y="525" width="317" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="242" y="555.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Valid, in-depth; respondents</text><text x="242" y="576.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">explain meanings</text><rect x="553" y="525" width="317" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="567" y="555.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Time-consuming; hard to compare;</text><text x="567" y="576.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">small samples</text><rect x="30" y="607" width="190" height="72" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="648.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Group interviews</text><rect x="228" y="607" width="317" height="72" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="242" y="637.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Show how views form in interaction</text><rect x="553" y="607" width="317" height="72" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="567" y="637.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Dominant voices; peer pressure</text><text x="567" y="658.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">distorts answers</text><rect x="30" y="695" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="731" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Survey questions</text><text x="56" y="760" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Closed</tspan> (fixed choices), <tspan font-weight="700">open</tspan> (own words), <tspan font-weight="700">scaled</tspan> (agree to disagree), multiple-choice or</text><text x="56" y="782" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">ranking. Avoid leading, double-barrelled or ambiguous questions.</text>
</svg>