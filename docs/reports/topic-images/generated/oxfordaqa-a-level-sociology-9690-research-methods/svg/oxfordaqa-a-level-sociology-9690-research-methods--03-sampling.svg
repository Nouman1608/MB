<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 617" width="900" height="617" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="617" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">From population to sample</text>

<rect x="30" y="110" width="253.33333333333334" height="127" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="156.66666666666669" y="152.8" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Population</text><text x="156.66666666666669" y="182.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">the whole group being</text><text x="156.66666666666669" y="203.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">studied</text><line x1="287.33333333333337" y1="173.5" x2="319.33333333333337" y2="173.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="323.33333333333337" y="110" width="253.33333333333334" height="127" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="450.00000000000006" y="142.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Sampling frame</text><text x="450.00000000000006" y="172.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">the list a sample is drawn</text><text x="450.00000000000006" y="193.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">from (a register, an</text><text x="450.00000000000006" y="214.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">electoral roll)</text><line x1="580.6666666666667" y1="173.5" x2="612.6666666666667" y2="173.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="616.6666666666667" y="110" width="253.33333333333334" height="127" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="743.3333333333334" y="163.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Sample</text><text x="743.3333333333334" y="193.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">the people actually studied</text><text x="450" y="263" font-size="16" font-weight="600" fill="#b5602e" text-anchor="middle" font-style="italic">a poor frame leaves people out</text><rect x="30" y="283" width="269.3333333333333" height="126" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,333 L31.25,297.25 Q31.25,284.25 44.25,284.25 L285.0833333333333,284.25 Q298.0833333333333,284.25 298.0833333333333,297.25 L298.0833333333333,333 Z" fill="#b5d3cf"/><line x1="31.25" y1="333" x2="298.0833333333333" y2="333" stroke="#c9d6d4" stroke-width="2"/><text x="164.66666666666666" y="313.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Random</text><text x="44" y="364.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">each member has an equal</text><text x="44" y="385.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">chance</text><rect x="315.3333333333333" y="283" width="269.3333333333333" height="126" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M316.5833333333333,333 L316.5833333333333,297.25 Q316.5833333333333,284.25 329.5833333333333,284.25 L570.4166666666666,284.25 Q583.4166666666666,284.25 583.4166666666666,297.25 L583.4166666666666,333 Z" fill="#b5d3cf"/><line x1="316.5833333333333" y1="333" x2="583.4166666666666" y2="333" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="313.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Systematic</text><text x="329.3333333333333" y="364.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">every nth name</text><rect x="600.6666666666666" y="283" width="269.3333333333333" height="126" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.9166666666666,333 L601.9166666666666,297.25 Q601.9166666666666,284.25 614.9166666666666,284.25 L855.75,284.25 Q868.75,284.25 868.75,297.25 L868.75,333 Z" fill="#b5d3cf"/><line x1="601.9166666666666" y1="333" x2="868.75" y2="333" stroke="#c9d6d4" stroke-width="2"/><text x="735.3333333333333" y="313.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Stratified random</text><text x="614.6666666666666" y="364.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">random within subgroups, in</text><text x="614.6666666666666" y="385.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">proportion</text><rect x="30" y="423" width="269.3333333333333" height="168" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,473 L31.25,437.25 Q31.25,424.25 44.25,424.25 L285.0833333333333,424.25 Q298.0833333333333,424.25 298.0833333333333,437.25 L298.0833333333333,473 Z" fill="#f2e7b8"/><line x1="31.25" y1="473" x2="298.0833333333333" y2="473" stroke="#c9d6d4" stroke-width="2"/><text x="164.66666666666666" y="453.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Quota</text><text x="44" y="504.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">interviewers fill set</text><text x="44" y="525.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">numbers with given</text><text x="44" y="546.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">characteristics, not</text><text x="44" y="567.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">randomly</text><rect x="315.3333333333333" y="423" width="269.3333333333333" height="168" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M316.5833333333333,473 L316.5833333333333,437.25 Q316.5833333333333,424.25 329.5833333333333,424.25 L570.4166666666666,424.25 Q583.4166666666666,424.25 583.4166666666666,437.25 L583.4166666666666,473 Z" fill="#f2e7b8"/><line x1="316.5833333333333" y1="473" x2="583.4166666666666" y2="473" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="453.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Multistage</text><text x="329.3333333333333" y="504.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">regions, then towns, then</text><text x="329.3333333333333" y="525.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">households</text><rect x="600.6666666666666" y="423" width="269.3333333333333" height="168" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.9166666666666,473 L601.9166666666666,437.25 Q601.9166666666666,424.25 614.9166666666666,424.25 L855.75,424.25 Q868.75,424.25 868.75,437.25 L868.75,473 Z" fill="#f2e7b8"/><line x1="601.9166666666666" y1="473" x2="868.75" y2="473" stroke="#c9d6d4" stroke-width="2"/><text x="735.3333333333333" y="453.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Snowball</text><text x="614.6666666666666" y="504.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">participants recruit others;</text><text x="614.6666666666666" y="525.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">for hidden groups</text>
</svg>