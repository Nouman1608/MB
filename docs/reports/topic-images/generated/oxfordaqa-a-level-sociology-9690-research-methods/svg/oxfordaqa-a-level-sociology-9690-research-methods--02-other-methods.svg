<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 993" width="900" height="993" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="993" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Observation, experiments and secondary data</text>

<rect x="228" y="104" width="317" height="44" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="386.5" y="131.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Strength</text><rect x="553" y="104" width="317" height="44" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="711.5" y="131.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Limitation</text><rect x="30" y="156" width="190" height="74" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="187.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Participant</text><text x="42" y="209.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">observation</text><rect x="228" y="156" width="317" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="242" y="186.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">High validity; natural setting</text><rect x="553" y="156" width="317" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="567" y="186.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Small, unrepresentative; risk of</text><text x="567" y="207.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">"going native"</text><rect x="30" y="238" width="190" height="74" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="269.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Covert / overt</text><text x="42" y="291.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">observation</text><rect x="228" y="238" width="317" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="242" y="268.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Covert avoids the Hawthorne</text><text x="242" y="289.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">effect; overt allows consent</text><rect x="553" y="238" width="317" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="567" y="268.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Covert is ethically problematic;</text><text x="567" y="289.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">overt may alter behaviour</text><rect x="30" y="320" width="190" height="74" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="351.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Non-participant</text><text x="42" y="373.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">observation</text><rect x="228" y="320" width="317" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="242" y="350.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Detachment; can use schedules</text><rect x="553" y="320" width="317" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="567" y="350.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Presence may change behaviour;</text><text x="567" y="371.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">meanings missed</text><rect x="30" y="402" width="190" height="74" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="433.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Laboratory</text><text x="42" y="455.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">experiments</text><rect x="228" y="402" width="317" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="242" y="432.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Establish cause and effect;</text><text x="242" y="453.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">replicable</text><rect x="553" y="402" width="317" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="567" y="432.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Artificial; ethical limits on</text><text x="567" y="453.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">manipulating people</text><rect x="30" y="484" width="190" height="74" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="515.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Field</text><text x="42" y="537.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">experiments</text><rect x="228" y="484" width="317" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="242" y="514.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">More realistic</text><rect x="553" y="484" width="317" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="567" y="514.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Less control; participants often</text><text x="567" y="535.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">unaware</text><rect x="30" y="566" width="190" height="74" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="597.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Longitudinal</text><text x="42" y="619.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">studies</text><rect x="228" y="566" width="317" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="242" y="596.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Show change and sequence</text><rect x="553" y="566" width="317" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="567" y="596.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Expensive; attrition reduces</text><text x="567" y="617.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">representativeness</text><rect x="30" y="648" width="190" height="74" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="679.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Qualitative</text><text x="42" y="701.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">secondary</text><rect x="228" y="648" width="317" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="242" y="678.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Diaries, letters: insight into</text><text x="242" y="699.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">meaning, including the past</text><rect x="553" y="648" width="317" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="567" y="678.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">May be unrepresentative or written</text><text x="567" y="699.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">for an audience</text><rect x="30" y="730" width="190" height="74" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="761.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Quantitative</text><text x="42" y="783.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">secondary</text><rect x="228" y="730" width="317" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="242" y="760.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Official statistics: cheap,</text><text x="242" y="781.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">large-scale, show trends</text><rect x="553" y="730" width="317" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="567" y="760.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Collected for state purposes;</text><text x="567" y="781.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">definitions shape them</text><rect x="30" y="820" width="840" height="149" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="856" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Classic examples</text><circle cx="61" cy="879.39" r="4.5" fill="#8a6d0d"/><text x="74" y="885" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Field experiment:</tspan> Rosenthal and Jacobson (1968), teacher expectations</text><circle cx="61" cy="909.39" r="4.5" fill="#8a6d0d"/><text x="74" y="915" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Covert observation:</tspan> Humphreys (1970), Tearoom Trade, contested ethics</text><circle cx="61" cy="939.39" r="4.5" fill="#8a6d0d"/><text x="74" y="945" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Letters:</tspan> Thomas and Znaniecki (1918–1920), The Polish Peasant</text>
</svg>