<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 729" width="900" height="729" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="729" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Measuring and explaining carefully</text>

<text x="30" y="116" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Operationalisation: turning a concept into something measurable</text><rect x="30" y="184" width="220" height="70" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="140" y="226" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">“Religiosity”</text><line x1="254" y1="219" x2="344" y2="159" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="350" y="134" width="250" height="50" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="475" y="166" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Frequency of worship</text><line x1="254" y1="219" x2="344" y2="219" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="350" y="194" width="250" height="50" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="475" y="226" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Prayer</text><line x1="254" y1="219" x2="344" y2="279" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="350" y="254" width="250" height="50" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="475" y="286" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Belief</text><text x="630" y="204" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Each choice gives a</text><text x="630" y="228" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">different result</text><text x="30" y="340" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Correlation is not causation</text><rect x="330" y="358" width="240" height="60" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="395" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">A third factor</text><rect x="80" y="478" width="220" height="56" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="190" y="512" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Variable A</text><rect x="600" y="478" width="220" height="56" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="710" y="512" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Variable B</text><line x1="380" y1="422" x2="240" y2="472" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="520" y1="422" x2="660" y2="472" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="306" y1="506" x2="594" y2="506" stroke="#b5602e" stroke-width="3" stroke-dasharray="9 7"/><text x="450" y="498" font-size="16" font-weight="600" fill="#b5602e" text-anchor="middle">move together</text><text x="450" y="528" font-size="16" font-weight="400" fill="#b5602e" text-anchor="middle">but A may not cause B</text><rect x="30" y="554" width="840" height="149" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="590" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Other threats to valid data</text><circle cx="61" cy="613.39" r="4.5" fill="#8a6d0d"/><text x="74" y="619" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Researcher / interviewer bias:</tspan> characteristics or wording influence answers</text><circle cx="61" cy="643.39" r="4.5" fill="#8a6d0d"/><text x="74" y="649" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Hawthorne effect:</tspan> people change behaviour when studied (Western Electric, 1920s–30s)</text><circle cx="61" cy="673.39" r="4.5" fill="#8a6d0d"/><text x="74" y="679" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Social desirability:</tspan> answers that make respondents look good</text>
</svg>