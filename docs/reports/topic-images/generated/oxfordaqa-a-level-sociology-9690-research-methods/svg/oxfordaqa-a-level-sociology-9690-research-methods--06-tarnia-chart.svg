<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 747" width="900" height="747" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="747" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Mobile money in Tarnia (fictional data)</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">households using mobile money, %, invented for practice</text>
<rect x="30" y="120" width="840" height="410" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><line x1="120" y1="470" x2="840" y2="470" stroke="#c9d6d4" stroke-width="1.5"/><text x="108" y="476" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">0</text><line x1="120" y1="400" x2="840" y2="400" stroke="#c9d6d4" stroke-width="1.5"/><text x="108" y="406" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">20</text><line x1="120" y1="330" x2="840" y2="330" stroke="#c9d6d4" stroke-width="1.5"/><text x="108" y="336" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">40</text><line x1="120" y1="260" x2="840" y2="260" stroke="#c9d6d4" stroke-width="1.5"/><text x="108" y="266" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">60</text><line x1="120" y1="190" x2="840" y2="190" stroke="#c9d6d4" stroke-width="1.5"/><text x="108" y="196" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">80</text><text x="58" y="310" font-size="15" fill="#4a5568" text-anchor="middle" transform="rotate(-90 58 310)">households (%)</text><rect x="230" y="365" width="90" height="105" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="275" y="355" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">30%</text><rect x="330" y="211" width="90" height="259" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="375" y="201" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">74%</text><text x="325" y="500" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Urban</text><text x="325" y="171" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="middle">+44 percentage points</text><rect x="560" y="428" width="90" height="42" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="605" y="418" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">12%</text><rect x="660" y="291.5" width="90" height="178.5" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="705" y="281.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">51%</text><text x="655" y="500" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Rural</text><text x="655" y="251.5" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="middle">+39 percentage points</text><line x1="120" y1="470" x2="840" y2="470" stroke="#1e2a44" stroke-width="2.5"/><rect x="640" y="136" width="18" height="18" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.5"/><text x="666" y="151" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">2015</text><rect x="740" y="136" width="18" height="18" fill="#b5d3cf" stroke="#1e2a44" stroke-width="1.5"/><text x="766" y="151" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">2025</text><rect x="30" y="550" width="840" height="171" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="586" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Two trends and a limitation</text><circle cx="61" cy="609.39" r="4.5" fill="#8a6d0d"/><text x="74" y="615" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Use rose in both areas: urban 30% to 74% (+44 points), rural 12% to 51% (+39 points)</text><circle cx="61" cy="639.39" r="4.5" fill="#8a6d0d"/><text x="74" y="645" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The urban-rural gap widened from 18 to 23 points, though rural use grew faster in</text><text x="74" y="667" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">relative terms (more than fourfold vs about 2.5 times)</text><circle cx="61" cy="691.39" r="4.5" fill="#8a6d0d"/><text x="74" y="697" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Limitation:</tspan> percentages hide sample size and how "using" was operationalised</text>
</svg>