<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 525" width="900" height="525" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="525" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why compromise stopped working after 1850</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Three changes removed the machinery for a deal</text>
<rect x="30" y="124" width="269.3333333333333" height="168" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="152" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CHANGE 1</text><text x="46" y="178.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Each deal left one side</text><text x="46" y="201.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">cheated</text><text x="46" y="229.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Fugitive Slave Act (1850) made</text><text x="46" y="250.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">slavery visible in Northern</text><text x="46" y="271.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">towns</text><rect x="315.3333333333333" y="124" width="269.3333333333333" height="168" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="331.3333333333333" y="152" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CHANGE 2</text><text x="331.3333333333333" y="178.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">National parties broke</text><text x="331.3333333333333" y="201.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">apart</text><text x="331.3333333333333" y="229.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Whigs collapse; Republicans</text><text x="331.3333333333333" y="250.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">(1854) Northern only;</text><text x="331.3333333333333" y="271.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Democrats split (April 1860)</text><rect x="600.6666666666666" y="124" width="269.3333333333333" height="168" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="616.6666666666666" y="163.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CHANGE 3</text><text x="616.6666666666666" y="189.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Positions hardened</text><text x="616.6666666666666" y="218.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Dred Scott (1857); Douglas at</text><text x="616.6666666666666" y="239.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Freeport (1858) loses Southern</text><text x="616.6666666666666" y="260.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">trust</text><rect x="150" y="356" width="600" height="137" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="388" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">DECEMBER 1860</text><text x="450" y="416.38" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Crittenden Compromise fails</text><text x="450" y="446.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Extend 36°30′ to the Pacific? Lincoln opposed any extension of</text><text x="450" y="468.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">slavery</text><line x1="164.66666666666666" y1="298" x2="300" y2="350" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="450" y1="298" x2="450" y2="350" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="735.3333333333333" y1="298" x2="600" y2="350" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/>
</svg>