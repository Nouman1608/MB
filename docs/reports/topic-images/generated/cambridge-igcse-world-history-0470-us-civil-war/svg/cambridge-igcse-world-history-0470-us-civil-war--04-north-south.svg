<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="600" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why the North won and the South lost</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Union strengths against Confederate weaknesses</text>
<polygon points="450,164 416,234 484,234" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><line x1="210" y1="130" x2="690" y2="198" stroke="#1e2a44" stroke-width="7" stroke-linecap="round"/><circle cx="450" cy="164" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><line x1="210" y1="130" x2="210" y2="170" stroke="#1e2a44" stroke-width="3"/><rect x="30" y="170" width="360" height="264" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="46" y="200.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Confederate weaknesses</text><text x="46" y="229.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="61.2" y="229.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">"King Cotton" failed: British stocks, India,</text><text x="61.2" y="250.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Egypt</text><text x="46" y="275.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="61.2" y="275.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">States' rights: governors resisted Davis</text><text x="46" y="300.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="61.2" y="300.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Inflation; Richmond bread riots (April</text><text x="61.2" y="321.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">1863)</text><text x="46" y="346.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="61.2" y="346.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">"A rich man's war and a poor man's</text><text x="61.2" y="367.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">fight"</text><text x="46" y="392.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="61.2" y="392.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Enslaved men enlisted only in March</text><text x="61.2" y="413.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">1865</text><line x1="690" y1="198" x2="690" y2="238" stroke="#1e2a44" stroke-width="3"/><rect x="510" y="238" width="360" height="197" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="526" y="268.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Union strengths</text><text x="526" y="297.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="541.2" y="297.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Factories, railways, food</text><text x="526" y="322.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="541.2" y="322.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Naval blockade: the Anaconda Plan</text><text x="526" y="347.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="541.2" y="347.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Emancipation: about 180,000 Black</text><text x="541.2" y="368.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">soldiers</text><text x="526" y="393.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="541.2" y="393.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Grant (from March 1864) and Sherman's</text><text x="541.2" y="414.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">March to the Sea</text><rect x="30" y="457" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="491.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Explain, don't list</text><text x="50" y="521.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Show how each advantage produced victory: e.g. the blockade cut cotton exports and weapon</text><text x="50" y="543.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">imports.</text>
</svg>