<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 675" width="900" height="675" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="675" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What Lincoln did</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">From saving the Union to a war for freedom</text>
<line x1="60" y1="144" x2="60" y2="623" stroke="#c9d6d4" stroke-width="4"/><rect x="104" y="124" width="766" height="83" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="156.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Kept the border states</text><text x="122" y="184.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Kentucky, Missouri, Maryland, Delaware: at first the war was to save the Union, not end slavery</text><circle cx="60" cy="165.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="174.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="104" y="215" width="766" height="83" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="247.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Changed generals</text><text x="122" y="275.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Until he found ones who would fight</text><circle cx="60" cy="256.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="265.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="104" y="306" width="766" height="107" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="122" y="336" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">1 JANUARY 1863</text><text x="122" y="362.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Emancipation Proclamation</text><text x="122" y="390.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A war for freedom: only in areas in rebellion</text><circle cx="60" cy="359.5" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="368.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="104" y="421" width="766" height="107" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="451" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">NOVEMBER 1863</text><text x="122" y="477.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Gettysburg Address</text><text x="122" y="505.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A democratic purpose for the war</text><circle cx="60" cy="474.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="483.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="104" y="536" width="766" height="107" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="566" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">JANUARY 1865</text><text x="122" y="592.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">13th Amendment through Congress</text><text x="122" y="620.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Assassinated in April 1865, before he could shape Reconstruction</text><circle cx="60" cy="589.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="598.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text>
</svg>