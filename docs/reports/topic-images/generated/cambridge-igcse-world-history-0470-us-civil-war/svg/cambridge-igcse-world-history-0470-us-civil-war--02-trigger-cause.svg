<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 621" width="900" height="621" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="621" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Lincoln's election: trigger, not cause</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">From November 1860 to Fort Sumter</text>
<rect x="30" y="124" width="840" height="113" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="450" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">UNDERLYING CAUSE</text><text x="450" y="183.6" font-size="20" font-weight="700" fill="#b5602e" text-anchor="middle">Slavery and its expansion</text><text x="450" y="212.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Without the long dispute, a Republican victory would not have led to secession</text><line x1="450" y1="245" x2="450" y2="279" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="301" width="189" height="155" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="43" y="356.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">NOV 1860</text><text x="43" y="381.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Lincoln elected</text><text x="43" y="408.5" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Won without the South</text><line x1="225" y1="378.5" x2="241" y2="378.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="247" y="301" width="189" height="155" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="260" y="326" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">20 DEC 1860</text><text x="260" y="351.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">South Carolina</text><text x="260" y="372.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">secedes</text><text x="260" y="399" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Seven states in the</text><text x="260" y="419" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Confederacy by</text><text x="260" y="439" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">February 1861</text><line x1="442" y1="378.5" x2="458" y2="378.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="464" y="301" width="189" height="155" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="356.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">4 MAR 1861</text><text x="477" y="381.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Inaugural</text><text x="477" y="408.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">The Union is perpetual</text><line x1="659" y1="378.5" x2="675" y2="378.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="681" y="301" width="189" height="155" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="694" y="336.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">12 APR 1861</text><text x="694" y="361.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Fort Sumter</text><text x="694" y="388.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">75,000 volunteers;</text><text x="694" y="408.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">four more states</text><text x="694" y="428.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">secede</text><rect x="30" y="478" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="512.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">What the election showed</text><text x="50" y="542.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The North could now govern the whole country without the South, and Lincoln was committed to</text><text x="50" y="564.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">stopping slavery's spread ("House Divided", 1858).</text>
</svg>