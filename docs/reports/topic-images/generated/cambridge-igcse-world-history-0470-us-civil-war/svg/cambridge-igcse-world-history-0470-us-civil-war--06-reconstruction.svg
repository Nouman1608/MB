ke-width="2.5"/><text x="450" y="601" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">14th</text><rect x="30" y="642" width="360" height="70" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="43" y="681.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Black men vote; Hiram Revels</text><line x1="390" y1="677" x2="408" y2="677" stroke="#1e2a44" stroke-width="2"/><rect x="510" y="642" width="360" height="70" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="523" y="668.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Klan violence</text><text x="523" y="695" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Black voters driven from the polls</text><line x1="492" y1="677" x2="510" y2="677" stroke="#1e2a44" stroke-width="2"/><rect x="408" y="660" width="84" height="34" rx="17" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="683" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">15th</text><rect x="30" y="724" width="360" height="70" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="43" y="750.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Freedmen's Bureau schools</text><text x="43" y="777" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">New Black colleges, churches</text><line x1="390" y1="759" x2="408" y2="759" stroke="#1e2a44" stroke-width="2"/><rect x="510" y="724" width="360" height="70" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="523" y="750.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">No redistribution</text><text x="523" y="777" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">"Forty acres" reversed</text><line x1="492" y1="759" x2="510" y2="759" stroke="#1e2a44" stroke-width="2"/><rect x="408" y="742" width="84" height="34" rx="17" fill="#ffffff" stroke="#1e2a44" strok