<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Five turning points, 1861-65</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Drawn to scale</text>
<line x1="70" y1="148" x2="70" y2="378" stroke="#c9d6d4" stroke-width="1.5"/><text x="70" y="138" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">1861</text><line x1="235.21739130435108" y1="148" x2="235.21739130435108" y2="378" stroke="#c9d6d4" stroke-width="1.5"/><text x="235.21739130435108" y="138" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">1862</text><line x1="400.43478260870216" y1="148" x2="400.43478260870216" y2="378" stroke="#c9d6d4" stroke-width="1.5"/><text x="400.43478260870216" y="138" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">1863</text><line x1="565.6521739130533" y1="148" x2="565.6521739130533" y2="378" stroke="#c9d6d4" stroke-width="1.5"/><text x="565.6521739130533" y="138" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">1864</text><line x1="730.8695652174043" y1="148" x2="730.8695652174043" y2="378" stroke="#c9d6d4" stroke-width="1.5"/><text x="730.8695652174043" y="138" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">1865</text><line x1="50" y1="264" x2="850" y2="264" stroke="#1e2a44" stroke-width="4" stroke-linecap="round"/><path d="M152.60869565217553,264 L152.60869565217553,248 L152.60869565217553,216" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="99.16069565217552" y="150" width="106.896" height="64" fill="#f4f6f6"/><text x="152.60869565217553" y="165" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">July 1861</text><text x="152.60869565217553" y="185" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Bull Run:</text><text x="152.60869565217553" y="205" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">no short war</text><path d="M400.43478260870216,264 L400.43478260870216,248 L400.43478260870216,216" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="343.41878260870214" y="150" width="114.032" height="64" fill="#f4f6f6"/><text x="400.43478260870216" y="165" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">1 Jan 1863</text><text x="400.43478260870216" y="185" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Emancipation</text><text x="400.43478260870216" y="205" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Proclamation</text><path d="M675.7971014492998,264 L675.7971014492998,248 L675.7971014492998,216" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="613.3891014492998" y="150" width="124.816" height="64" fill="#f4f6f6"/><text x="675.7971014492998" y="165" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">Sep 1864</text><text x="675.7971014492998" y="185" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Sherman takes</text><text x="675.7971014492998" y="205" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Atlanta</text><path d="M345.36231884059765,264 L345.36231884059765,280 L345.36231884059765,312" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="287.3783188405977" y="314" width="115.968" height="64" fill="#f4f6f6"/><text x="345.36231884059765" y="329" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">Sep 1862</text><text x="345.36231884059765" y="349" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Antietam: Lee</text><text x="345.36231884059765" y="369" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">halted</text><path d="M483.04347826087775,264 L483.04347826087775,280 L483.04347826087775,312" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="432.50747826087775" y="314" width="101.072" height="64" fill="#f4f6f6"/><text x="483.04347826087775" y="329" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">July 1863</text><text x="483.04347826087775" y="349" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Gettysburg;</text><text x="483.04347826087775" y="369" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Vicksburg</text><path d="M775.7852221430356,264 L775.7852221430356,280 L775.7852221430356,312" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="723.7692221430357" y="314" width="104.032" height="44" fill="#f4f6f6"/><text x="775.7852221430356" y="329" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">9 Apr 1865</text><text x="775.7852221430356" y="349" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Appomattox</text><circle cx="152.60869565217553" cy="264" r="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><circle cx="345.36231884059765" cy="264" r="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><circle cx="400.43478260870216" cy="264" r="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><circle cx="483.04347826087775" cy="264" r="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><circle cx="675.7971014492998" cy="264" r="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><circle cx="775.7852221430356" cy="264" r="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><clipPath id="tc404"><rect x="30" y="404" width="840" height="283" rx="14"/></clipPath><g clip-path="url(#tc404)"><rect x="30" y="404" width="240.00000000000003" height="48" fill="#b5d3cf"/><text x="44" y="431.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Turning point</text><rect x="270" y="404" width="600" height="48" fill="#b5d3cf"/><text x="284" y="431.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Why it mattered</text><rect x="30" y="452" width="240.00000000000003" height="47" fill="#dce9e7"/><text x="44" y="478.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Bull Run</text><rect x="270" y="452" width="600" height="47" fill="#ffffff"/><text x="284" y="478.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Ended Northern hopes of a short war</text><line x1="30" y1="499" x2="870" y2="499" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="499" width="240.00000000000003" height="47" fill="#dce9e7"/><text x="44" y="525.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Antietam</text><rect x="270" y="499" width="600" height="47" fill="#f8faf9"/><text x="284" y="525.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Gave Lincoln the victory he needed to announce emancipation</text><line x1="30" y1="546" x2="870" y2="546" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="546" width="240.00000000000003" height="47" fill="#dce9e7"/><text x="44" y="572.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Gettysburg, Vicksburg</text><rect x="270" y="546" width="600" height="47" fill="#ffffff"/><text x="284" y="572.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Lee never again invaded the North; the Mississippi split the Confederacy</text><line x1="30" y1="593" x2="870" y2="593" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="593" width="240.00000000000003" height="47" fill="#dce9e7"/><text x="44" y="619.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Atlanta</text><rect x="270" y="593" width="600" height="47" fill="#f8faf9"/><text x="284" y="619.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Northern morale; Lincoln re-elected in November 1864</text><line x1="30" y1="640" x2="870" y2="640" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="640" width="240.00000000000003" height="47" fill="#dce9e7"/><text x="44" y="666.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Appomattox</text><rect x="270" y="640" width="600" height="47" fill="#ffffff"/><text x="284" y="666.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Lee surrenders: the effective end of the war</text></g><line x1="270" y1="404" x2="270" y2="687" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="404" width="840" height="283" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/>
