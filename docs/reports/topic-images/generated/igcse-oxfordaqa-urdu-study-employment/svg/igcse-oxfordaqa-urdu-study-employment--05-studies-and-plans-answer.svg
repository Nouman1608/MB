<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Studies now, plans next</text>

<text x="450" y="128" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Task: your studies and your plans for after you finish school</text><rect x="30" y="150" width="840" height="64" rx="12" fill="#f6ece4" stroke="#b5602e" stroke-width="2.5"/><text x="54" y="190" font-size="21" font-weight="700" fill="#b5602e" text-anchor="start">Weak</text><text x="140" y="190" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">"I study many subjects. I want a good job." No opinion, no reason, one tense</text><text x="54" y="252" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="start">Strong</text><rect x="110" y="270" width="760" height="82" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="62" cy="311" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="319.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="134" y="304" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Subject + opinion + reason</text><text x="848" y="304" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end">present</text><text x="134" y="333" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">my favourite subject is science because I find experiments interesting</text><line x1="62" y1="336" x2="62" y2="370" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="110" y="374" width="760" height="82" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="62" cy="415" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="423.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="134" y="408" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Post-16 plan</text><text x="848" y="408" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end">future</text><text x="134" y="437" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">after school, I will continue my studies at college</text><line x1="62" y1="440" x2="62" y2="474" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="110" y="478" width="760" height="82" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="62" cy="519" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="62" y="527.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="134" y="512" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Justified ambition</text><text x="848" y="512" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end">would like to / because</text><text x="134" y="541" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">I would like to become a doctor because I want to help people</text><line x1="62" y1="544" x2="62" y2="578" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="110" y="582" width="760" height="82" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><circle cx="62" cy="623" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="631.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="134" y="616" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Conditional reflection</text><text x="848" y="616" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end">if ... will</text><text x="134" y="645" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">if I study hard, I will achieve my goal</text>
</svg>