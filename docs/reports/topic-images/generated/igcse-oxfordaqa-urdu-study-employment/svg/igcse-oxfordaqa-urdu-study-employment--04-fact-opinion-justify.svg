"21" font-weight="700" fill="#1e2a44" text-anchor="middle">Reason</text><text x="450" y="480" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">because ...</text><line x1="572" y1="466" x2="596" y2="466" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="600" y="406" width="240" height="120" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="720" y="448" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Personal link</text><text x="720" y="480" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">an interest or skill of yours</text>
