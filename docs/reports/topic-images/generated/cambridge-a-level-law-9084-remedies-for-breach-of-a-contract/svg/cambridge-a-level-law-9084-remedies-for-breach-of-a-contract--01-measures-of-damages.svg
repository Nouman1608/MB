<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 498" width="900" height="498" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="498" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Measuring damages</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Robinson v Harman (1848): the position as if the contract had been performed</text>
<rect x="30" y="124" width="270.6666666666667" height="262" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="46" y="152" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EXPECTATION LOSS</text><text x="46" y="178.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The benefit of the bargain</text><text x="46" y="206.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Difference</tspan> <tspan font-weight="700" fill="#1e2a44">in</tspan> <tspan font-weight="700" fill="#1e2a44">value:</tspan> contract</text><text x="46" y="227.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">price v market price when</text><text x="46" y="248.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">delivery was due (SGA 1979</text><text x="46" y="269.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">s51)</text><text x="46" y="296.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Cost</tspan> <tspan font-weight="700" fill="#1e2a44">of</tspan> <tspan font-weight="700" fill="#1e2a44">cure:</tspan> not if out of all</text><text x="46" y="317.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">proportion (<tspan font-style="italic">Ruxley</tspan>)</text><text x="46" y="344.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Loss</tspan> <tspan font-weight="700" fill="#1e2a44">of</tspan> <tspan font-weight="700" fill="#1e2a44">profit:</tspan> subject to</text><text x="46" y="365.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">remoteness</text><rect x="314.6666666666667" y="124" width="270.6666666666667" height="262" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="330.6666666666667" y="152" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">RELIANCE LOSS</text><text x="330.6666666666667" y="178.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Wasted expenditure</text><text x="330.6666666666667" y="206.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">When profit is too speculative:</text><text x="330.6666666666667" y="227.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Anglia</tspan> <tspan font-style="italic">TV</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Reed</tspan> (1972), even</text><text x="330.6666666666667" y="248.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">pre-contract spending</text><text x="330.6666666666667" y="275.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Not to escape a bad bargain: <tspan font-style="italic">C</tspan></text><text x="330.6666666666667" y="296.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">and</tspan> <tspan font-style="italic">P</tspan> <tspan font-style="italic">Haulage</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Middleton</tspan></text><text x="330.6666666666667" y="317.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(1983)</text><rect x="599.3333333333334" y="124" width="270.6666666666667" height="262" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="615.3333333333334" y="152" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">NON-PECUNIARY LOSS</text><text x="615.3333333333334" y="178.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Disappointment, distress</text><text x="615.3333333333334" y="206.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Rule: not recoverable (<tspan font-style="italic">Addis</tspan>,</text><text x="615.3333333333334" y="227.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">1909)</text><text x="615.3333333333334" y="254.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Except pleasure, relaxation or</text><text x="615.3333333333334" y="275.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">peace of mind: <tspan font-style="italic">Jarvis</tspan>;</text><text x="615.3333333333334" y="296.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Jackson</tspan>; <tspan font-style="italic">Farley</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Skinner</tspan>;</text><text x="615.3333333333334" y="317.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Watts</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Morrow</tspan> (discomfort)</text><rect x="30" y="408" width="840" height="58" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="441.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle"><tspan font-weight="700" fill="#1e2a44">Common</tspan> <tspan font-weight="700" fill="#1e2a44">mistake:</tspan> claiming both expectation and reliance damages for the same loss.</text>
</svg>