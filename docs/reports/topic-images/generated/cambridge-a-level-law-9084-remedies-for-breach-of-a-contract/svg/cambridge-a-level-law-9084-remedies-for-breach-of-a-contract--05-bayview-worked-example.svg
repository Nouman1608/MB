<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 647" width="900" height="647" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="647" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: Bayview’s coffee machine</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">BrewTech fails to deliver a £4,000 machine due on 1 May</text>
<line x1="130" y1="424" x2="560" y2="424" stroke="#1e2a44" stroke-width="2.5"/><line x1="130" y1="144" x2="130" y2="424" stroke="#1e2a44" stroke-width="2.5"/><line x1="130" y1="389" x2="560" y2="389" stroke="#c9d6d4" stroke-width="1.5" stroke-dasharray="4 5"/><text x="120" y="395" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">£4,000</text><line x1="130" y1="284" x2="560" y2="284" stroke="#c9d6d4" stroke-width="1.5" stroke-dasharray="4 5"/><text x="120" y="290" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">£4,600</text><line x1="130" y1="179" x2="560" y2="179" stroke="#c9d6d4" stroke-width="1.5" stroke-dasharray="4 5"/><text x="120" y="185" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">£5,200</text><text x="250" y="450" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">1 May</text><text x="480" y="450" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">1 July</text><line x1="130" y1="389" x2="560" y2="389" stroke="#2e6b62" stroke-width="3"/><text x="560" y="413" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="end">contract price</text><rect x="224" y="284" width="52" height="105" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><rect x="454" y="179" width="52" height="105" fill="#b5602e" opacity="0.85" stroke="#1e2a44" stroke-width="2"/><rect x="454" y="284" width="52" height="105" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="250" cy="284" r="7" fill="#1e2a44"/><circle cx="480" cy="179" r="7" fill="#1e2a44"/><path d="M250,284 L480,179" fill="none" stroke="#4a5568" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 5"/><text x="284" y="342.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">£600</text><text x="514" y="237.5" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">+£600</text><rect x="600" y="134" width="270" height="116" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="614" y="160" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">MARKET RULE (s51)</text><text x="614" y="185.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">£4,600 − £4,000 = £600</text><text x="614" y="212" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Measured at the date delivery</text><text x="614" y="232" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">was due</text><rect x="600" y="262" width="270" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="614" y="288" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">FAILURE TO MITIGATE</text><text x="614" y="313.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Extra £600 by July</text><text x="614" y="340" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Not recoverable</text><rect x="30" y="476" width="272" height="139" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="44" y="502" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">LOST PROFITS (£3,000)</text><text x="44" y="533.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Normal profits arise naturally</text><text x="44" y="554.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(Hadley, first limb), but only for</text><text x="44" y="575.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">a reasonable replacement</text><text x="44" y="596.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">period</text><rect x="314" y="476" width="272" height="139" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="328" y="502" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">CATERING CONTRACT (£10,000)</text><text x="328" y="533.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Never mentioned: too remote,</text><text x="328" y="554.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">like the dyeing contracts in</text><text x="328" y="575.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Victoria</tspan> <tspan font-style="italic">Laundry</tspan></text><rect x="598" y="476" width="272" height="139" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="612" y="502" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CONCLUSION</text><text x="612" y="533.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">£600 plus normal profits lost for</text><text x="612" y="554.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">a reasonable replacement</text><text x="612" y="575.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">period</text>
</svg>