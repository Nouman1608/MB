<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 468" width="900" height="468" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="468" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Ruxley Electronics v Forsyth (1995)</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">A pool built shallower than agreed, but perfectly usable</text>
<rect x="80" y="152" width="759.9999999999999" height="58" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="80" y="142" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Cost of cure: rebuild the pool (unreasonable, not awarded)</text><text x="827.9999999999999" y="189" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="end">£21,560</text><line x1="60" y1="142" x2="60" y2="334" stroke="#1e2a44" stroke-width="2.5"/><rect x="80" y="264" width="88.12615955473098" height="58" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="80" y="254" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Awarded: loss of amenity</text><text x="182.12615955473098" y="301" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">£2,500</text><text x="278.126159554731" y="301" font-size="17" font-weight="600" fill="#8a6d0d" text-anchor="start">← upheld by the House of Lords</text><rect x="30" y="356" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="389.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Cost of cure is not awarded where it would be out of all proportion to the benefit. <tspan font-weight="700" fill="#1e2a44">Common</tspan></text><text x="50" y="411.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">mistake:</tspan> awarding cost of cure automatically.</text>
</svg>