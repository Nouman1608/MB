<rect width="900" height="888" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Equitable remedies</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Discretionary, used where damages are inadequate</text>
<rect x="30" y="124" width="413" height="145" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="152" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SPECIFIC PERFORMANCE</text><text x="46" y="178.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Perform the contract</text><text x="46" y="206.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Land and unique goods: <tspan font-style="italic">Falcke</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Gray</tspan> (1859),</text><text x="46" y="227.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">rare china jars. <tspan font-style="italic">Beswick</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Beswick</tspan> (1968):</text><text x="46" y="248.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">damages would have been nominal</text><rect x="457" y="124" width="413" height="145" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="473" y="152" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SPECIFIC RESTITUTION</text><text x="473" y="178.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Return the specific property</text><text x="473" y="206.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Rather than its value, where money is not a</text><text x="473" y="227.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">sufficient substitute</text><rect x="30" y="283" width="413" height="124" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="311" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">RESCISSION</text><text x="46" y="337.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Set the contract aside</text><text x="46" y="365.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Restores pre-contract positions, e.g. after</text><text x="46" y="386.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">misrepresentation</text><rect x="457" y="283" width="413" height="124" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="473" y="311" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">INJUNCTION</text><text x="473" y="337.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Do not do something</text><text x="473" y="365.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Breaking a negative promise: <tspan font-style="italic">Warner</tspan> <tspan font-style="italic">Brothers</tspan> <tspan font-style="italic">v</tspan></text><text x="473" y="386.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Nelson</tspan> (1937)</text><text x="450" y="441" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">WHEN THE COURT WILL REFUSE</text><clipPath id="tc463"><rect x="30" y="463" width="840" height="393" rx="14"/></clipPath><g clip-path="url(#tc463)"><rect x="30" y="463" width="260.6896551724138" height="48" fill="#b5d3cf"/><text x="44" y="490.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Limitation</text><rect x="290.6896551724138" y="463" width="579.3103448275863" height="48" fill="#f2e7b8"/><text x="304.6896551724138" y="490.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Rule and case</text><rect x="30" y="511" width="260.6896551724138" height="47" fill="#dce9e7"/><text x="44" y="537.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Damages adequate</text><rect x="290.6896551724138" y="511" width="579.3103448275863" height="47" fill="#ffffff"/><text x="304.6896551724138" y="537.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Ordinary goods available elsewhere</text><line x1="30" y1="558" x2="870" y2="558" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="558" width="260.6896551724138" height="68" fill="#dce9e7"/><text x="44" y="584.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Personal services</text><rect x="290.6896551724138" y="558" width="579.3103448275863" height="68" fill="#f8faf9"/><text x="304.6896551724138" y="584.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">No forced work; nor an injunction that in practice forces it (<tspan font-style="italic">Page</tspan> <tspan font-style="italic">One</tspan></text><text x="304.6896551724138" y="605.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Records</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Britton</tspan>, 1968)</text><line x1="30" y1="626" x2="870" y2="626" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="626" width="260.6896551724138" height="47" fill="#dce9e7"/><text x="44" y="652.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Constant supervision</text><rect x="290.6896551724138" y="626" width="579.3103448275863" height="47" fill="#ffffff"/><text x="304.6896551724138" y="652.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Co-operative</tspan> <tspan font-style="italic">Insurance</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Argyll</tspan> <tspan font-style="italic">Stores</tspan> (1997): no order to keep trading</text><line x1="30" y1="673" x2="870" y2="673" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="673" width="260.6896551724138" height="68" fill="#dce9e7"/><text x="44" y="699.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Mutuality</text><rect x="290.6896551724138" y="673" width="579.3103448275863" height="68" fill="#f8faf9"/><text x="304.6896551724138" y="699.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Not against one party if not against the other: a minor cannot obtain it</text><text x="304.6896551724138" y="720.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(<tspan font-style="italic">Flight</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Bolland</tspan>, 1828)</text><line x1="30" y1="741" x2="870" y2="741" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="741" width="260.6896551724138" height="47" fill="#dce9e7"/><text x="44" y="767.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Conduct, delay, hardship</text><rect x="290.6896551724138" y="741" width="579.3103448275863" height="47" fill="#ffffff"/><text x="304.6896551724138" y="767.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Clean hands; delay defeats equity; hardship (<tspan font-style="italic">Patel</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Ali</tspan>, 1984)</text><line x1="30" y1="788" x2="870" y2="788" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="788" width="260.6896551724138" height="68" fill="#dce9e7"/><text x="44" y="814.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Bars to rescission</text><rect x="290.6896551724138" y="788" width="579.3103448275863" height="68" fill="#f8faf9"/><text x="304.6896551724138" y="814.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Affirmation (<tspan font-style="italic">Long</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Lloyd</tspan>); lapse of time (<tspan font-style="italic">Leaf</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">International</tspan> <tspan font-style="italic">Galleries</tspan>);</text><text x="304.6896551724138" y="835.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">restoration impossible; third-party rights</text></g><line x1="290.6896551724138" y1="463" x2="290.6896551724138" y2="856" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="463" width="840" height="393" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/>
</svg>