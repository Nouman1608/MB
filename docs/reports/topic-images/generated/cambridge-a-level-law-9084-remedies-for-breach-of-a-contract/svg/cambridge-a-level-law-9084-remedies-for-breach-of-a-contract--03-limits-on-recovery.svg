<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 736" width="900" height="736" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="736" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three limits on what can be recovered</text>

<line x1="60" y1="120" x2="60" y2="540" stroke="#c9d6d4" stroke-width="4"/><rect x="104" y="100" width="766" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="130" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CAUSATION</text><text x="122" y="157.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Was the breach an effective cause?</text><text x="122" y="186.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The claimant’s own unreasonable act may break the chain: <tspan font-style="italic">Quinn</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Burch</tspan> <tspan font-style="italic">Bros</tspan> (1966), unsafe</text><text x="122" y="207.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">trestle used instead of a stepladder.</text><circle cx="60" cy="165" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="173.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="104" y="242" width="766" height="176" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="122" y="272" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">REMOTENESS: HADLEY v BAXENDALE (1854)</text><text x="122" y="299.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Arises naturally, or in both parties’ reasonable contemplation when</text><text x="122" y="324.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">contracting?</text><text x="122" y="353.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Victoria</tspan> <tspan font-style="italic">Laundry</tspan> (1949): normal profits yes, unknown dyeing contracts no. <tspan font-style="italic">The</tspan> <tspan font-style="italic">Heron</tspan> <tspan font-style="italic">II</tspan> (1969):</text><text x="122" y="374.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">“not unlikely”. <tspan font-style="italic">Parsons</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Uttley</tspan> <tspan font-style="italic">Ingham</tspan> (1978): type, not extent. <tspan font-style="italic">The</tspan> <tspan font-style="italic">Achilleas</tspan> (2008): assumed</text><text x="122" y="395.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">responsibility.</text><circle cx="60" cy="330" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="338.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="104" y="430" width="766" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="460" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">MITIGATION</text><text x="122" y="487.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Could the loss reasonably have been avoided?</text><text x="122" y="516.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">British</tspan> <tspan font-style="italic">Westinghouse</tspan> (1912). <tspan font-style="italic">Payzu</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Saunders</tspan> (1919): should have accepted cash terms. Not</text><text x="122" y="537.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">demanding: <tspan font-style="italic">Pilkington</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Wood</tspan> (1953), no uncertain litigation needed.</text><circle cx="60" cy="495" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="503.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="30" y="582" width="413" height="122" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="610" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">+ DAMAGES</text><text x="46" y="641.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">As of right; predictable; money is adequate where</text><text x="46" y="662.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">a replacement can be bought</text><rect x="457" y="582" width="413" height="122" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="473" y="610" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">− DAMAGES</text><text x="473" y="641.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Loss hard to prove; non-pecuniary loss limited;</text><text x="473" y="662.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">remoteness leaves real losses; money cannot</text><text x="473" y="683.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">replace unique property</text>
</svg>