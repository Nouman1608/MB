orce × perpendicular distance</text><rect x="382" y="570" width="50" height="26" rx="6" fill="#8a6d0d" stroke="#8a6d0d" stroke-width="0"/><text x="407" y="589" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">P</text><rect x="455" y="560" width="415" height="106" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><rect x="471" y="582" width="120" height="60" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="531" y="619.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">kg m/s</text><text x="607" y="604" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">momentum</text><text x="607" y="634" font-size="16" font-weight="400" fill="#2b5a9a" text-anchor="start">mass × velocity</text><rect x="807" y="570" width="50" height="26" rx="6" fill="#8a6d0d" stroke="#8a6d0d" stroke-width="0"/><text x="832" y="589" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">P</text><text x="450" y="700" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="middle">P = Physics only (statement 1.2P, assessed on Paper 2P)</text>
