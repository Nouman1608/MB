<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 590" width="900" height="590" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="590" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Reading m/s²: per second, every second</text>

<rect x="30" y="110" width="840" height="460" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="148" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">An acceleration of 3 m/s²: the velocity rises by 3 m/s in each second</text><rect x="90" y="400" width="80" height="60" rx="4" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><text x="130" y="490" font-size="19" font-weight="700" fill="#2b5a9a" text-anchor="middle">u</text><text x="130" y="514" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">start</text><line x1="176" y1="392" x2="244" y2="338" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><text x="204" y="356" font-size="15" font-weight="700" fill="#b5602e" text-anchor="end">+3 m/s</text><rect x="250" y="346" width="80" height="114" rx="4" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><text x="290" y="490" font-size="19" font-weight="700" fill="#2b5a9a" text-anchor="middle">u + 3</text><text x="290" y="514" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">after 1 s</text><line x1="336" y1="338" x2="404" y2="284" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><text x="364" y="302" font-size="15" font-weight="700" fill="#b5602e" text-anchor="end">+3 m/s</text><rect x="410" y="292" width="80" height="168" rx="4" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><text x="450" y="490" font-size="19" font-weight="700" fill="#2b5a9a" text-anchor="middle">u + 6</text><text x="450" y="514" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">after 2 s</text><line x1="496" y1="284" x2="564" y2="230" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><text x="524" y="248" font-size="15" font-weight="700" fill="#b5602e" text-anchor="end">+3 m/s</text><rect x="570" y="238" width="80" height="222" rx="4" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><text x="610" y="490" font-size="19" font-weight="700" fill="#2b5a9a" text-anchor="middle">u + 9</text><text x="610" y="514" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">after 3 s</text><line x1="656" y1="230" x2="724" y2="176" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><text x="684" y="194" font-size="15" font-weight="700" fill="#b5602e" text-anchor="end">+3 m/s</text><rect x="730" y="184" width="80" height="276" rx="4" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><text x="770" y="490" font-size="19" font-weight="700" fill="#2b5a9a" text-anchor="middle">u + 12</text><text x="770" y="514" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">after 4 s</text><text x="450" y="548" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">Velocity in m/s divided by time in s gives (m/s)/s = m/s².</text>
</svg>