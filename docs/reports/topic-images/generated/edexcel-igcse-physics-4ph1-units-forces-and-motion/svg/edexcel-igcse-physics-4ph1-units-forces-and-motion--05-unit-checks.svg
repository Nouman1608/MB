<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" width="900" height="680" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="680" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Using units to check an equation</text>

<rect x="30" y="110" width="840" height="124" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="156" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="start">v² = u² + 2as</text><text x="840" y="158" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="end">✓ consistent</text><text x="60" y="202" font-size="18" font-weight="600" fill="#2b5a9a" text-anchor="start">left (m/s)² = m²/s²</text><text x="390" y="202" font-size="18" font-weight="600" fill="#2b5a9a" text-anchor="start">right m²/s² + (m/s²) × m = m²/s²</text><rect x="30" y="250" width="840" height="124" rx="14" fill="#fbeee6" stroke="#b5602e" stroke-width="2.5"/><text x="60" y="296" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="start">v = u² + 2as</text><text x="840" y="298" font-size="19" font-weight="700" fill="#b5602e" text-anchor="end">✗ units do not match</text><text x="60" y="342" font-size="18" font-weight="600" fill="#2b5a9a" text-anchor="start">left m/s</text><text x="390" y="342" font-size="18" font-weight="600" fill="#2b5a9a" text-anchor="start">right m²/s²</text><rect x="30" y="390" width="840" height="124" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="436" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="start">F = (mv − mu) ÷ t</text><text x="840" y="438" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="end">✓ consistent</text><text x="60" y="482" font-size="18" font-weight="600" fill="#2b5a9a" text-anchor="start">top kg × m/s = kg m/s</text><text x="390" y="482" font-size="18" font-weight="600" fill="#2b5a9a" text-anchor="start">÷ s gives kg m/s² = N</text><rect x="30" y="540" width="840" height="120" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="60" y="578" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Checks on answers</text><text x="60" y="610" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">"Acceleration" in m/s? You forgot to divide by a time.</text><text x="60" y="638" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">"Moment" in N? You forgot the distance.</text>
</svg>