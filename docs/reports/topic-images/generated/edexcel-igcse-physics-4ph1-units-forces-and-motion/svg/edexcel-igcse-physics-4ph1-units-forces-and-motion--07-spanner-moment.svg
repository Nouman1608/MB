<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="640" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: moment with centimetres</text>

<rect x="30" y="110" width="840" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M204.0,300.0 L187.0,329.4 L153.0,329.4 L136.0,300.0 L153.0,270.6 L187.0,270.6 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><circle cx="170" cy="300" r="5" fill="#1e2a44" stroke="#1e2a44" stroke-width="1"/><text x="170" y="362" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">nut (pivot)</text><rect x="200" y="284" width="470" height="32" rx="14" fill="#c9d3e3" stroke="#1e2a44" stroke-width="3"/><line x1="660" y1="415" x2="660" y2="320" stroke="#b5602e" stroke-width="6" marker-end="url(#ahR)"/><text x="676" y="395" font-size="22" font-weight="700" fill="#b5602e" text-anchor="start">40 N</text><path d="M644,316 L644,332 L657,332" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><line x1="170" y1="240" x2="660" y2="240" stroke="#1e2a44" stroke-width="2"/><line x1="170" y1="230" x2="170" y2="250" stroke="#1e2a44" stroke-width="2"/><line x1="660" y1="230" x2="660" y2="250" stroke="#1e2a44" stroke-width="2"/><text x="415" y="228" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">perpendicular distance 25 cm = 0.25 m</text><rect x="30" y="460" width="840" height="160" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="60" y="500" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">moment = force × perpendicular distance</text><text x="60" y="540" font-size="24" font-weight="700" fill="#2e6b62" text-anchor="start">= 40 × 0.25 = 10 Nm</text><text x="60" y="590" font-size="17" font-weight="600" fill="#b5602e" text-anchor="start">✗ 40 × 25 = 1000: that is newton centimetres, not Nm.</text>
</svg>