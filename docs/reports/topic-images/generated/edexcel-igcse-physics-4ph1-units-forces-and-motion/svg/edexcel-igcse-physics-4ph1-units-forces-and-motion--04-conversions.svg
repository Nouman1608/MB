l="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="534" y="248" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">1.6 km</text><line x1="605" y1="241" x2="733" y2="241" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="667" y="232" font-size="16" font-weight="700" fill="#2b5a9a" text-anchor="middle">× 1000</text><text x="855" y="248" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="end">1600 m</text><rect x="30" y="294" width="415" height="78" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><rect x="44" y="308" width="130" height="50" rx="8" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="109" y="340" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">2.5 min</text><line x1="180" y1="333" x2="308" y2="333" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="242" y="324" font-size="16" font-weight="700" fill="#2b5a9a" text-anchor="middle">× 60</text><text x="430" y="340" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="end">150 s</text><rect x="455" y="294" width="415" height="78" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><rect x="469" y="308" width="130" height="50" rx="8" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="534" y="340" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">1.5 h</text><line x1="605" y1="333" x2="733" y2="333" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="667" y="324" font-size="16" font-weight="700" fill="#2b5a9a" text-anchor="middle">× 3600</text><text x="855" y="340" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="end">5400 s</text><rect x="30" y="386" width="415" height="78" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><rect x="44" y="400" width="130" height="50" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="109" y="432" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">90 km/h</text><line x1="180" y1="425" x2="308" y2="425" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="242" y="416" font-size="16" font-weight="700" fill="#2b5a9a" text-anchor="middle">÷ 3.6</text><text x="430" y="432" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="end">25 m/s</text><rect x="455" y="386" width="415" height="78" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><rect x="469" y="400" width="130" height="50" rx="8" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="534" y="432" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">1.2 tonnes</text><line x1="605" y1="425" x2="733" y2="425" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="667" y="416" font-size="16" font-weight="700" fill="#2b5a9a" text-anchor="middle">× 1000</text><text x="855" y="432" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="end">1200 kg</text><rect x="30" y="490" width="840" height="150" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="60" y="528" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">km/h to m/s</text><text x="60" y="562" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">1 km/h = 1000 m ÷ 3600 s ≈ 0.28 m/s, so divide by 3.6.</text><text x="60" y="598" font-size="18" font-weight="600" fill="#8a6d0d" text-anchor="start">A speed in m/s is always a smaller number than the same speed in km/h.</text><text x="450" y="668" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">Convert first, then substitute, then calculate.</text>
