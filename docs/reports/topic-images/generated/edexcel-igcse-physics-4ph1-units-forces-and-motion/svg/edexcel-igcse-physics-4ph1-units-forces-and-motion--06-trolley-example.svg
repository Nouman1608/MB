<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 750" width="900" height="750" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="750" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: a chain of calculations</text>

<rect x="30" y="110" width="840" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="80" y="170" width="140" height="50" rx="6" fill="#b5602e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="105" cy="230" r="13" fill="#1e2a44" stroke="#1e2a44" stroke-width="1"/><circle cx="195" cy="230" r="13" fill="#1e2a44" stroke="#1e2a44" stroke-width="1"/><line x1="60" y1="243" x2="840" y2="243" stroke="#1e2a44" stroke-width="3"/><text x="150" y="202" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">600 g</text><line x1="240" y1="195" x2="400" y2="195" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><text x="320" y="180" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">from rest to 1.8 m/s</text><text x="470" y="170" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">in 1.2 s</text><text x="470" y="205" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">first: m = 600 g = 0.600 kg</text><rect x="30" y="300" width="840" height="104" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="340" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">(a) acceleration</text><text x="60" y="376" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">a = (v − u) / t = (1.8 − 0) / 1.2</text><rect x="610" y="326" width="240" height="52" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="730" y="361" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">1.5 m/s²</text><rect x="30" y="416" width="840" height="104" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="456" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">(b) resultant force</text><text x="60" y="492" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">F = m × a = 0.600 × 1.5</text><rect x="610" y="442" width="240" height="52" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="730" y="477" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">0.90 N</text><rect x="30" y="532" width="840" height="104" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="572" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">(c) momentum (P)</text><text x="60" y="608" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">p = m × v = 0.600 × 1.8 = 1.08</text><rect x="610" y="558" width="240" height="52" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="730" y="593" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">≈ 1.1 kg m/s</text><rect x="30" y="650" width="840" height="80" rx="14" fill="#fbeee6" stroke="#b5602e" stroke-width="2.5"/><text x="450" y="697" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">✗ Substituting 600: F = 900 N, a thousand times too large for a toy trolley</text>
</svg>