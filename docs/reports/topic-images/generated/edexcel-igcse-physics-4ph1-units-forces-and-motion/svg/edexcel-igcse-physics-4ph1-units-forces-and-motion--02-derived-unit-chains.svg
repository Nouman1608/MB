<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 670" width="900" height="670" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="670" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How the derived units are built</text>

<rect x="30" y="110" width="840" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="150" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">newton</text><text x="60" y="186" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">1 N = 1 kg × 1 m/s² = 1 kg m/s²</text><text x="840" y="150" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">resultant force giving 1 kg an acceleration of 1 m/s²</text><rect x="30" y="222" width="840" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="262" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">g</text><text x="60" y="298" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">N/kg = (kg m/s²) / kg = m/s²</text><text x="840" y="262" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">g = 10 N/kg near Earth; free fall at 10 m/s²</text><rect x="30" y="334" width="840" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="374" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">moment (P)</text><text x="60" y="410" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">N × m = Nm</text><text x="840" y="374" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">distances must be in metres</text><rect x="30" y="446" width="840" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="486" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">momentum (P)</text><text x="60" y="522" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">kg × m/s = kg m/s  (= N s)</text><text x="840" y="486" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">give kg m/s unless asked otherwise</text><rect x="30" y="560" width="840" height="90" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="598" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">N/kg and m/s² are the same unit.</text><text x="450" y="628" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Use N/kg for g in W = m × g; use m/s² when describing an acceleration.</text>
</svg>