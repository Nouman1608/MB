<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 543" width="900" height="543" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="543" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The whole argument in miniature</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Declaration of Sentiments, Seneca Falls, 1848</text>
<text x="30" y="134" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start" xml:space="preserve">Declaration of Independence (1776)</text><rect x="30" y="148" width="840" height="61.03999999999999" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="450" y="184.7" font-size="22" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">“...that all men are created equal”</text><text x="30" y="274" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start" xml:space="preserve">Declaration of Sentiments (1848)</text><rect x="140" y="292" width="173.38554000000002" height="40" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2" /><text x="226.69277" y="319.7" font-size="22" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">“...that all men</text><rect x="321.38554" y="292" width="144.94724000000002" height="40" rx="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2" /><text x="393.85916" y="319.7" font-size="22" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">and women</text><text x="393.85916" y="353.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">the added words</text><rect x="474.33278" y="292" width="217.75382000000002" height="40" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2" /><text x="583.20969" y="319.7" font-size="22" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">are created equal”</text><rect x="30" y="386.3" width="408" height="125.75999999999999" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5" /><text x="48" y="420.3" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Stated thesis</text><text x="48" y="448.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“We hold these truths to be self-evident: that all</text><text x="48" y="469.42" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">men and women are created equal.”</text><rect x="462" y="386.3" width="408" height="125.75999999999999" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="480" y="420.3" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Everything else serves it</text><text x="480" y="448.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">The list of grievances and the resolutions</text><text x="480" y="469.42" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">support the claim and demand its</text><text x="480" y="490.54" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">consequences in law.</text>
</svg>