t x="450" y="484.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">the main, overarching claim</text><rect x="30" y="352" width="270" height="74" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="165" y="386" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Branches</text><text x="165" y="414" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">each paragraph’s claim</text><rect x="600" y="352" width="270" height="74" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="735" y="386" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Leaves</text><text x="735" y="414" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">the evidence</text><line x1="300" y1="372" x2="330" y2="332" stroke="#1e2a44" stroke-width="2.5"/><line x1="600" y1="372" x2="690" y2="297" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="626" width="840" height="76.88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="450" y="658.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Also describe any indication of <tspan font-weight="700">structure</tspan>: some theses preview the order (“because of X, Y and</text><text x="450" y="680.8900000000001" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Z”); others leave you to work it out.</text>
