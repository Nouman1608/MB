<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 527" width="900" height="527" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="527" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A thesis that arrives last</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Worked example 1: Orchard Road (invented figures)</text>
<rect x="100" y="122" width="770" height="66.24000000000001" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="114" y="149.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700">The</tspan> <tspan font-weight="700">council</tspan> <tspan font-weight="700">has</tspan> <tspan font-weight="700">been</tspan> <tspan font-weight="700">removing</tspan> <tspan font-weight="700">trees;</tspan> <tspan font-weight="700">residents</tspan> <tspan font-weight="700">notice.</tspan></text><text x="114" y="170.72" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700" fill="#b5602e">fact:</tspan> “In 2019 there were forty-one; today there are twenty-six.”</text><rect x="30" y="122" width="56" height="66.24000000000001" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="58" y="162.12" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">¶1</text><line x1="485" y1="192.24" x2="485" y2="214.24" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="100" y="220.24" width="770" height="87.36000000000001" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="114" y="247.84" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700">The</tspan> <tspan font-weight="700">council’s</tspan> <tspan font-weight="700">objection</tspan> <tspan font-weight="700">(cost)</tspan> <tspan font-weight="700">is</tspan> <tspan font-weight="700">real</tspan> <tspan font-weight="700">but</tspan> <tspan font-weight="700">outweighed</tspan> <tspan font-weight="700">by</tspan> <tspan font-weight="700">the</tspan> <tspan font-weight="700">benefits.</tspan></text><text x="114" y="268.96" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700" fill="#b5602e">counterargument:</tspan> “The council says the trees lift paving and block drains...”</text><text x="114" y="290.08" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700" fill="#b5602e">sub-claim:</tspan> “The repairs come to about £3,000 a year...”</text><rect x="30" y="220.24" width="56" height="87.36000000000001" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="58" y="270.92" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">¶2</text><line x1="485" y1="311.6" x2="485" y2="333.6" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="100" y="339.6" width="770" height="107.27999999999997" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3" /><text x="118" y="373.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Thesis</text><text x="118" y="402.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“Orchard Road does not need fewer trees; it needs a council that counts what the trees</text><text x="118" y="424.89" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">give as carefully as it counts what they cost.”</text><rect x="30" y="339.6" width="56" height="107.27999999999997" rx="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5" /><text x="58" y="400.24" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">¶3</text><text x="450" y="474.88" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" xml:space="preserve">The loss, the objection, the answer, then the position: the delay lets the writer build evidence and</text><text x="450" y="496" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" xml:space="preserve">concede first.</text>
</svg>