<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 708" width="900" height="708" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="708" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Thesis or look-alike?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Examples on the topic of street trees</text>
<rect x="310" y="302" width="280" height="140" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3" /><text x="450" y="343.12" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Thesis</text><text x="450" y="371.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">the sentence every paragraph,</text><text x="450" y="392.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">taken together, is trying to</text><text x="450" y="413.36" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">prove</text><rect x="30" y="122" width="260" height="120" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="6 5"/><text x="42" y="164.58" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Topic</text><text x="42" y="190.17000000000002" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“Street trees.”</text><text x="42" y="209.97000000000003" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700" fill="#b5602e">asserts</tspan> <tspan font-weight="700" fill="#b5602e">nothing</tspan></text><rect x="610" y="122" width="260" height="120" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="6 5"/><text x="622" y="154.67999999999998" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Fact or summary</text><text x="622" y="180.26999999999998" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“The council removed fifteen</text><text x="622" y="200.07" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">trees between 2019 and now.”</text><text x="622" y="219.86999999999998" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700" fill="#b5602e">no</tspan> <tspan font-weight="700" fill="#b5602e">position</tspan></text><rect x="30" y="312" width="260" height="120" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="6 5"/><text x="42" y="344.68" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Sub-claim</text><text x="42" y="370.27" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“The repairs cost less than the</text><text x="42" y="390.07" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">newsletter.”</text><text x="42" y="409.87" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700" fill="#b5602e">supports</tspan> <tspan font-weight="700" fill="#b5602e">one</tspan> <tspan font-weight="700" fill="#b5602e">paragraph</tspan></text><rect x="610" y="312" width="260" height="120" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="6 5"/><text x="622" y="344.68" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Announcement</text><text x="622" y="370.27" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“This essay will discuss street</text><text x="622" y="390.07" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">trees.”</text><text x="622" y="409.87" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700" fill="#b5602e">what</tspan> <tspan font-weight="700" fill="#b5602e">it</tspan> <tspan font-weight="700" fill="#b5602e">will</tspan> <tspan font-weight="700" fill="#b5602e">do,</tspan> <tspan font-weight="700" fill="#b5602e">not</tspan> <tspan font-weight="700" fill="#b5602e">claim</tspan></text><rect x="30" y="482" width="260" height="120" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="6 5"/><text x="42" y="514.68" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Counterargument</text><text x="42" y="540.27" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“The council says trees cost too</text><text x="42" y="560.0699999999999" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">much.”</text><text x="42" y="579.87" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700" fill="#b5602e">the</tspan> <tspan font-weight="700" fill="#b5602e">view</tspan> <tspan font-weight="700" fill="#b5602e">to</tspan> <tspan font-weight="700" fill="#b5602e">be</tspan> <tspan font-weight="700" fill="#b5602e">answered</tspan></text><rect x="610" y="482" width="260" height="120" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="6 5"/><text x="622" y="524.5799999999999" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Question</text><text x="622" y="550.17" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“Are trees worth keeping?”</text><text x="622" y="569.9699999999999" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700" fill="#b5602e">raises</tspan> <tspan font-weight="700" fill="#b5602e">but</tspan> <tspan font-weight="700" fill="#b5602e">does</tspan> <tspan font-weight="700" fill="#b5602e">not</tspan> <tspan font-weight="700" fill="#b5602e">answer</tspan></text><rect x="30" y="622" width="840" height="76.88" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5" /><text x="450" y="654.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve"><tspan font-weight="700">Removal</tspan> <tspan font-weight="700">test:</tspan> if a sentence could be removed without changing the rest of the argument, it is</text><text x="450" y="676.8900000000001" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">probably not the thesis.</text>
</svg>