<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 496" width="900" height="496" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="496" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Narrator’s claim, writer’s thesis</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Swift, “A Modest Proposal”, 1729</text>
<rect x="30" y="122" width="380" height="170" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="7 5"/><text x="48" y="187.36" font-size="20" font-weight="700" fill="#b5602e" text-anchor="start" xml:space="preserve">What the narrator proposes</text><text x="48" y="216.21" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">Calmly: the poor of Ireland should sell</text><text x="48" y="238.65" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">their children as food.</text><rect x="490" y="122" width="380" height="170" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3" /><text x="508" y="176.14" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">What Swift implies</text><text x="508" y="204.98999999999998" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">Irish arrangements already treat the poor</text><text x="508" y="227.42999999999998" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">as a commodity; real reform, not callous</text><text x="508" y="249.86999999999998" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">projects, is required.</text><path d="M414,182 C450,152 450,152 484,182" fill="none" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><path d="M484,232 C450,262 450,262 414,232" fill="none" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="450" y="214" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle" xml:space="preserve">opposite</text><text x="450" y="322" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">How a thorough reading finds it</text><rect x="30" y="340" width="268" height="125.75999999999999" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="48" y="374" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Context</text><text x="48" y="402" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">Irish poverty under English</text><text x="48" y="423.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">policy and landlord</text><text x="48" y="444.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">indifference</text><rect x="316" y="340" width="268" height="125.75999999999999" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="334" y="374" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Target</text><text x="334" y="402" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">officials who treat the poor as</text><text x="334" y="423.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">an economic resource</text><rect x="602" y="340" width="268" height="125.75999999999999" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="620" y="374" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">The signal</text><text x="620" y="402" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">the narrator rejects real</text><text x="620" y="423.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">remedies, such as taxing</text><text x="620" y="444.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">absentee landlords</text>
</svg>