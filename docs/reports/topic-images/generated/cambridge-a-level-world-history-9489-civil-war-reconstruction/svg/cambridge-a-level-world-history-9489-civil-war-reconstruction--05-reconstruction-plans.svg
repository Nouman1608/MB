<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 810" width="900" height="810" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="810" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Who controlled Reconstruction?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Lincoln, Congress, Johnson, then the Radicals</text>
<line x1="60" y1="144" x2="60" y2="614" stroke="#c9d6d4" stroke-width="4"/><rect x="104" y="124" width="766" height="108" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="154" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">LINCOLN, 1863</text><text x="122" y="180.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Ten Percent Plan</text><text x="122" y="209.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Readmit a state once 10 per cent of 1860 voters swore loyalty</text><circle cx="60" cy="178" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="186.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="104" y="244" width="766" height="108" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="274" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CONGRESS, 1864</text><text x="122" y="300.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Wade-Davis Bill</text><text x="122" y="329.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A majority and an "ironclad oath"; Lincoln pocket-vetoed it</text><circle cx="60" cy="298" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="306.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="104" y="364" width="766" height="129" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="394" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">JOHNSON, FROM APRIL 1865</text><text x="122" y="420.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Pardons and Black Codes</text><text x="122" y="449.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Pardoned many Confederates; Black Codes allowed; vetoed the Freedmen's Bureau extension</text><text x="122" y="470.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">and the Civil Rights Act of 1866</text><circle cx="60" cy="428.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="437.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="104" y="505" width="766" height="129" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="122" y="535" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">RADICAL RECONSTRUCTION, AFTER THE 1866 ELECTIONS</text><text x="122" y="561.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Congress overrides Johnson</text><text x="122" y="590.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Five military districts (Reconstruction Acts, 1867); Johnson impeached in 1868 and acquitted by</text><text x="122" y="611.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">one vote</text><circle cx="60" cy="569.5" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="578.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="30" y="656" width="270.6666666666667" height="122" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="165.33333333333334" y="683" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">RADICAL REPUBLICANS</text><text x="165.33333333333334" y="709.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Transform the South</text><text x="165.33333333333334" y="737.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Stevens, Sumner: protect</text><text x="165.33333333333334" y="758.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">freedpeople</text><rect x="314.6666666666667" y="656" width="270.6666666666667" height="122" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="707.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">CONSERVATIVES</text><text x="450" y="733.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Rapid reunion</text><rect x="599.3333333333334" y="656" width="270.6666666666667" height="122" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="734.6666666666667" y="707.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">COPPERHEADS, DEMOCRATS</text><text x="734.6666666666667" y="733.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Opposed Black rights</text>
</svg>