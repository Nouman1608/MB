<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 726" width="900" height="726" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="726" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Slavery in the territories: four answers</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Each settlement reopened the question it tried to close</text>
<clipPath id="tc124"><rect x="30" y="124" width="840" height="384" rx="14"/></clipPath><g clip-path="url(#tc124)"><rect x="30" y="124" width="198.94736842105263" height="49" fill="#b5d3cf"/><text x="44" y="152.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Measure</text><rect x="228.94736842105263" y="124" width="342.6315789473684" height="49" fill="#b5d3cf"/><text x="242.94736842105263" y="152.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">What it decided</text><rect x="571.578947368421" y="124" width="298.4210526315789" height="49" fill="#f2e7b8"/><text x="585.578947368421" y="152.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Why it raised tension</text><rect x="30" y="173" width="198.94736842105263" height="89" fill="#dce9e7"/><text x="44" y="199.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Missouri</text><text x="44" y="220.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Compromise (1820)</text><rect x="228.94736842105263" y="173" width="342.6315789473684" height="89" fill="#ffffff"/><text x="242.94736842105263" y="199.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Missouri slave, Maine free; no slavery in</text><text x="242.94736842105263" y="220.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the rest of the Louisiana Purchase north</text><text x="242.94736842105263" y="241.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">of 36°30′</text><rect x="571.578947368421" y="173" width="298.4210526315789" height="89" fill="#ffffff"/><text x="585.578947368421" y="199.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Kept the Senate balanced, but</text><text x="585.578947368421" y="220.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">made every later territorial question</text><text x="585.578947368421" y="241.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">a question about slavery</text><line x1="30" y1="262" x2="870" y2="262" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="262" width="198.94736842105263" height="89" fill="#dce9e7"/><text x="44" y="288.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Compromise of 1850</text><rect x="228.94736842105263" y="262" width="342.6315789473684" height="89" fill="#f8faf9"/><text x="242.94736842105263" y="288.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">California free; popular sovereignty in</text><text x="242.94736842105263" y="309.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Utah and New Mexico; tougher Fugitive</text><text x="242.94736842105263" y="330.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Slave Act</text><rect x="571.578947368421" y="262" width="298.4210526315789" height="89" fill="#f8faf9"/><text x="585.578947368421" y="288.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Brought slavery into Northern</text><text x="585.578947368421" y="309.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">towns; Northern states passed</text><text x="585.578947368421" y="330.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">personal liberty laws</text><line x1="30" y1="351" x2="870" y2="351" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="351" width="198.94736842105263" height="68" fill="#dce9e7"/><text x="44" y="377.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Kansas-Nebraska</text><text x="44" y="398.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Act (1854)</text><rect x="228.94736842105263" y="351" width="342.6315789473684" height="68" fill="#ffffff"/><text x="242.94736842105263" y="377.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Popular sovereignty in land closed to</text><text x="242.94736842105263" y="398.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">slavery since 1820</text><rect x="571.578947368421" y="351" width="298.4210526315789" height="68" fill="#ffffff"/><text x="585.578947368421" y="377.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Effectively repealed the Missouri</text><text x="585.578947368421" y="398.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">line; "Bleeding Kansas"</text><line x1="30" y1="419" x2="870" y2="419" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="419" width="198.94736842105263" height="89" fill="#dce9e7"/><text x="44" y="445.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Dred Scott v.</text><text x="44" y="466.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Sandford (1857)</text><rect x="228.94736842105263" y="419" width="342.6315789473684" height="89" fill="#f8faf9"/><text x="242.94736842105263" y="445.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Congress could not ban slavery in the</text><text x="242.94736842105263" y="466.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">territories</text><rect x="571.578947368421" y="419" width="298.4210526315789" height="89" fill="#f8faf9"/><text x="585.578947368421" y="445.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Republicans saw a "slave power"</text><text x="585.578947368421" y="466.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">conspiracy; Southerners saw their</text><text x="585.578947368421" y="487.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">rights confirmed</text></g><line x1="228.94736842105263" y1="124" x2="228.94736842105263" y2="508" stroke="#c9d6d4" stroke-width="1.5"/><line x1="571.578947368421" y1="124" x2="571.578947368421" y2="508" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="124" width="840" height="384" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/><line x1="450" y1="526" x2="450" y2="560" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="150" y="582" width="600" height="112" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="617.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">From a fixed line to no limit at all</text><text x="450" y="647.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">By 1857 the Missouri line was gone and Congress had lost the power</text><text x="450" y="669.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">to draw one.</text>
</svg>