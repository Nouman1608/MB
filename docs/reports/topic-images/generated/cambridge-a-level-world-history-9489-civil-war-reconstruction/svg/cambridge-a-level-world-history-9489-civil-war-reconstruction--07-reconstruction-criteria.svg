<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 568" width="900" height="568" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="568" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">"Reconstruction was a failure"</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Set criteria first, then judge each one</text>
<rect x="30" y="124" width="412" height="130" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><rect x="340.875" y="138" width="85.125" height="29" rx="14.5" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="383.4375" y="157.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">success</text><text x="50" y="165" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CRITERION 1</text><text x="50" y="191.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Reunion</text><text x="50" y="220.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The Union restored</text><rect x="458" y="124" width="412" height="130" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><rect x="768.875" y="138" width="85.125" height="29" rx="14.5" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="811.4375" y="157.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">success</text><text x="478" y="165" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CRITERION 2</text><text x="478" y="191.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">End of slavery</text><text x="478" y="220.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">13th Amendment</text><rect x="30" y="270" width="412" height="133" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><rect x="357.15" y="284" width="68.85" height="29" rx="14.5" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="391.575" y="303.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">mixed</text><text x="50" y="302" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CRITERION 3</text><text x="50" y="328.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Civil and political rights</text><text x="50" y="357.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">14th and 15th Amendments, Black officeholding;</text><text x="50" y="378.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">but Klan terror, redemption and 1877</text><rect x="458" y="270" width="412" height="133" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><rect x="782.795" y="284" width="71.205" height="29" rx="14.5" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><text x="818.3974999999999" y="303.9" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">failure</text><text x="478" y="302" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CRITERION 4</text><text x="478" y="328.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Economic independence</text><text x="478" y="357.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">No land redistributed; most freedpeople became</text><text x="478" y="378.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">sharecroppers, often tied by debt</text><rect x="30" y="425" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="459.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">A possible judgement</text><text x="50" y="489.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A success in the aims Lincoln and moderate Republicans set; a failure in the aims the Radicals set,</text><text x="50" y="511.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">because Northern commitment did not last.</text>
</svg>