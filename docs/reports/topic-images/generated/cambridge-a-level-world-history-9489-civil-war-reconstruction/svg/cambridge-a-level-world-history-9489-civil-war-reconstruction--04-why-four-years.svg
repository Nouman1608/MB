<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 850" width="900" height="850" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="850" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why did the war last four years?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">What slowed the Union, and what finally told</text>
<clipPath id="tc124"><rect x="30" y="124" width="840" height="583" rx="14"/></clipPath><g clip-path="url(#tc124)"><rect x="30" y="124" width="161.7391304347826" height="49" fill="#b5d3cf"/><text x="44" y="152.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Factor</text><rect x="191.7391304347826" y="124" width="339.13043478260875" height="49" fill="#f2e7b8"/><text x="205.7391304347826" y="152.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Why victory took time</text><rect x="530.8695652173914" y="124" width="339.13043478260875" height="49" fill="#b5d3cf"/><text x="544.8695652173914" y="152.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">What favoured the Union</text><rect x="30" y="173" width="161.7391304347826" height="68" fill="#dce9e7"/><text x="44" y="199.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Strategy</text><rect x="191.7391304347826" y="173" width="339.13043478260875" height="68" fill="#ffffff"/><text x="205.7391304347826" y="199.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The Confederacy only had to survive</text><text x="205.7391304347826" y="220.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and fought mainly on the defensive</text><rect x="530.8695652173914" y="173" width="339.13043478260875" height="68" fill="#ffffff"/><text x="544.8695652173914" y="199.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Anaconda Plan: blockade the ports and</text><text x="544.8695652173914" y="220.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">take the Mississippi, but slow to work</text><line x1="30" y1="241" x2="870" y2="241" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="241" width="161.7391304347826" height="89" fill="#dce9e7"/><text x="44" y="267.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Generals</text><rect x="191.7391304347826" y="241" width="339.13043478260875" height="89" fill="#f8faf9"/><text x="205.7391304347826" y="267.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Lee and Jackson outfought a series of</text><text x="205.7391304347826" y="288.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Union commanders in the east</text><rect x="530.8695652173914" y="241" width="339.13043478260875" height="89" fill="#f8faf9"/><text x="544.8695652173914" y="267.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Grant took Vicksburg (July 1863);</text><text x="544.8695652173914" y="288.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Sherman took Atlanta (September 1864);</text><text x="544.8695652173914" y="309.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Grant general-in-chief in 1864</text><line x1="30" y1="330" x2="870" y2="330" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="330" width="161.7391304347826" height="89" fill="#dce9e7"/><text x="44" y="356.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Resources</text><rect x="191.7391304347826" y="330" width="339.13043478260875" height="89" fill="#ffffff"/><text x="205.7391304347826" y="356.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A defender needs fewer resources;</text><text x="205.7391304347826" y="377.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Northern advantages took time to</text><text x="205.7391304347826" y="398.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">mobilise</text><rect x="530.8695652173914" y="330" width="339.13043478260875" height="89" fill="#ffffff"/><text x="544.8695652173914" y="356.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Larger population, most of the industry,</text><text x="544.8695652173914" y="377.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">denser railways</text><line x1="30" y1="419" x2="870" y2="419" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="419" width="161.7391304347826" height="110" fill="#dce9e7"/><text x="44" y="445.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Politics and</text><text x="44" y="466.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">money</text><rect x="191.7391304347826" y="419" width="339.13043478260875" height="110" fill="#f8faf9"/><text x="205.7391304347826" y="445.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Lincoln moved cautiously on slavery to</text><text x="205.7391304347826" y="466.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">keep the Border States; conscription</text><text x="205.7391304347826" y="487.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">brought the New York draft riots</text><rect x="530.8695652173914" y="419" width="339.13043478260875" height="110" fill="#f8faf9"/><text x="544.8695652173914" y="445.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Border States kept; income tax,</text><text x="544.8695652173914" y="466.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">greenbacks and bonds, while the</text><text x="544.8695652173914" y="487.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Confederacy printed money and Davis</text><text x="544.8695652173914" y="508.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">faced resistant governors</text><line x1="30" y1="529" x2="870" y2="529" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="529" width="161.7391304347826" height="89" fill="#dce9e7"/><text x="44" y="555.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Emancipation</text><rect x="191.7391304347826" y="529" width="339.13043478260875" height="89" fill="#ffffff"/><text x="205.7391304347826" y="555.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Not until September 1862 (effective</text><text x="205.7391304347826" y="576.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">January 1863), and only in areas still in</text><text x="205.7391304347826" y="597.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">rebellion</text><rect x="530.8695652173914" y="529" width="339.13043478260875" height="89" fill="#ffffff"/><text x="544.8695652173914" y="555.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A war against slavery; about 180,000</text><text x="544.8695652173914" y="576.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Black soldiers; harder for Britain to back</text><text x="544.8695652173914" y="597.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the South</text><line x1="30" y1="618" x2="870" y2="618" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="618" width="161.7391304347826" height="89" fill="#dce9e7"/><text x="44" y="644.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Foreign powers</text><rect x="191.7391304347826" y="618" width="339.13043478260875" height="89" fill="#f8faf9"/><text x="205.7391304347826" y="644.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Southern hopes of "King Cotton"</text><text x="205.7391304347826" y="665.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">diplomacy; France sympathetic to the</text><text x="205.7391304347826" y="686.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">South</text><rect x="530.8695652173914" y="618" width="339.13043478260875" height="89" fill="#f8faf9"/><text x="544.8695652173914" y="644.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Britain neutral (stockpiles, other sources;</text><text x="544.8695652173914" y="665.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Trent affair resolved); Russia friendly to</text><text x="544.8695652173914" y="686.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the Union</text></g><line x1="191.7391304347826" y1="124" x2="191.7391304347826" y2="707" stroke="#c9d6d4" stroke-width="1.5"/><line x1="530.8695652173914" y1="124" x2="530.8695652173914" y2="707" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="124" width="840" height="583" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="729" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="763.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Avoid the one-factor answer</text><text x="450" y="793.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Resources explain who won; strategy and leadership explain why it took four years.</text>
</svg>