<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 765" width="900" height="765" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="765" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Secession in two stages</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">From Lincoln's election to Fort Sumter</text>
<rect x="30" y="124" width="840" height="141" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ELECTION OF 1860: A SPLIT FIELD</text><text x="50" y="188.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Lincoln</tspan> (Republican): about 40 per cent of the popular vote, a clear electoral college majority, no</text><text x="50" y="210.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Southern electoral votes</text><text x="50" y="240.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Douglas</tspan> (Northern Democrat) · <tspan font-weight="700" fill="#1e2a44">Breckinridge</tspan> (Southern Democrat) · <tspan font-weight="700" fill="#1e2a44">Bell</tspan> (Constitutional Union)</text><line x1="227" y1="271" x2="227" y2="305" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="30" y="311" width="395" height="124" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="46" y="339" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STAGE 1</text><text x="46" y="365.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">South Carolina, December 1860</text><text x="46" y="393.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">By February 1861: seven Deep South states</text><text x="46" y="414.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">form the Confederacy under Jefferson Davis</text><line x1="227.5" y1="440" x2="227.5" y2="470" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="475" width="395" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="505.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Compromise fails</text><text x="46" y="533.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Crittenden proposals: Lincoln would not accept</text><text x="46" y="554.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">slavery's expansion</text><rect x="475" y="311" width="395" height="124" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="491" y="339" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">TRIGGER</text><text x="491" y="365.04" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">Fort Sumter, 12 April 1861</text><text x="491" y="393.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Confederate forces fire on the fort; Lincoln</text><text x="491" y="414.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">calls for volunteers</text><line x1="672.5" y1="440" x2="672.5" y2="470" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="475" y="475" width="395" height="124" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="491" y="503" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STAGE 2</text><text x="491" y="529.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Four Upper South states</text><text x="491" y="557.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Virginia, Arkansas, Tennessee and North</text><text x="491" y="578.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Carolina secede rather than supply troops</text><path d="M427,525 L450,525 L450,361 L466,361" fill="none" stroke="#1e2a44" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><rect x="30" y="621" width="840" height="112" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="653" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STAYED IN THE UNION</text><text x="50" y="679.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Border States: Delaware, Maryland, Kentucky, Missouri</text><text x="50" y="708.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Lincoln kept them partly by moving cautiously on slavery.</text>
</svg>