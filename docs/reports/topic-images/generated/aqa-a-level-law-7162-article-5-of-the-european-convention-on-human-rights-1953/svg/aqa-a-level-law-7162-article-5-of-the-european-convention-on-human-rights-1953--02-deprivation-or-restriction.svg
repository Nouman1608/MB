<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 657" width="900" height="657" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="657" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Deprivation or restriction?</text>

<defs><linearGradient id="dr" x1="0" x2="1"><stop offset="0" stop-color="#dce9e7"/><stop offset="1" stop-color="#b5d3cf"/></linearGradient></defs><rect x="30" y="100" width="840" height="44" rx="22" fill="url(#dr)" stroke="#1e2a44" stroke-width="2.5"/><text x="50" y="129" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Restriction on movement</text><text x="850" y="129" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Deprivation of liberty</text><text x="450" y="176" font-size="16" font-weight="600" fill="#4a5568" text-anchor="middle">A difference of “degree or intensity”: type, duration, effects, manner (Guzzardi v Italy, 1980)</text><rect x="30" y="200" width="300" height="195" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="232" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">NOT A DEPRIVATION</text><text x="50" y="258.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Austin (2009; ECtHR 2012)</text><text x="50" y="286.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Crowd contained at Oxford Circus</text><text x="50" y="307.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">for about seven hours: good faith,</text><text x="50" y="328.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">proportionate to a real risk of</text><text x="50" y="349.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">serious disorder, no longer than</text><text x="50" y="370.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">necessary</text><text x="360" y="214" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DEPRIVATIONS OF LIBERTY</text><rect x="360" y="226" width="510" height="75" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="374" y="254.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Guzzardi v Italy (1980)</text><text x="374" y="282.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Confined to a small area of an island under close supervision</text><rect x="360" y="311" width="510" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="374" y="339.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">HL v UK (2004)</text><text x="374" y="367.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Informal patient; staff had complete control over care and</text><text x="374" y="388.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">movements</text><rect x="360" y="417" width="510" height="75" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="374" y="445.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">SSHD v JJ (2007)</text><text x="374" y="473.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Control orders with an 18-hour daily curfew</text><rect x="30" y="514" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="548.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The acid test: P v Cheshire West and Chester Council (2014)</text><text x="50" y="578.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Under <tspan font-weight="700" fill="#1e2a44">continuous</tspan> <tspan font-weight="700" fill="#1e2a44">supervision</tspan> <tspan font-weight="700" fill="#1e2a44">and</tspan> <tspan font-weight="700" fill="#1e2a44">control</tspan> and <tspan font-weight="700" fill="#1e2a44">not</tspan> <tspan font-weight="700" fill="#1e2a44">free</tspan> <tspan font-weight="700" fill="#1e2a44">to</tspan> <tspan font-weight="700" fill="#1e2a44">leave</tspan>: a deprivation, even if the</text><text x="50" y="600.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">arrangement is kind and the person does not object.</text>
</svg>