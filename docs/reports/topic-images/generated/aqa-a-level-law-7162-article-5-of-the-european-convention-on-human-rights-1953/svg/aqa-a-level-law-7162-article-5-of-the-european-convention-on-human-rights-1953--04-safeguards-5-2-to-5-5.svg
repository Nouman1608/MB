<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 570" width="900" height="570" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="570" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The safeguards after arrest</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Even a lawful arrest breaches Article 5 if these fail</text>
<line x1="60" y1="144" x2="60" y2="518" stroke="#c9d6d4" stroke-width="4"/><rect x="104" y="124" width="766" height="105" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="156.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Reasons, promptly</text><text x="122" y="185.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">In a language they understand: reasons for the arrest and any charge. <tspan font-style="italic">Fox</tspan>: reasons emerging in</text><text x="122" y="206.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">questioning within a few hours were prompt.</text><circle cx="60" cy="176.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="185.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">5.2</text><rect x="104" y="241" width="766" height="105" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="273.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Promptly before a judge (5.1(c) detainees)</text><text x="122" y="302.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">And trial within a reasonable time or release pending trial. <tspan font-style="italic">Brogan</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">UK</tspan> (1988): four days and six</text><text x="122" y="323.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">hours without judicial control breached 5.3.</text><circle cx="60" cy="293.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="302.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">5.3</text><rect x="104" y="358" width="766" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="390.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">A court decides speedily if detention is lawful</text><text x="122" y="419.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">And orders release if not. In England, the classic route is habeas corpus.</text><circle cx="60" cy="400" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="408.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">5.4</text><rect x="104" y="454" width="766" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="486.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Enforceable right to compensation</text><text x="122" y="515.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Met by damages under s8 Human Rights Act 1998 and the tort of false imprisonment.</text><circle cx="60" cy="496" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="504.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">5.5</text>
</svg>