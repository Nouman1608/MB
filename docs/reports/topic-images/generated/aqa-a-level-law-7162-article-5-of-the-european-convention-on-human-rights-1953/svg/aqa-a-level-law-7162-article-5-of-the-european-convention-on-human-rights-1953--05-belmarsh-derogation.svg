<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 690" width="900" height="690" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="690" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Derogation: A v Secretary of State (2004)</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Article 15: war or public emergency, only to the extent strictly required</text>
<rect x="30" y="124" width="840" height="84" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">ACCEPTED</text><text x="450" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">A public emergency after the attacks of 11 September 2001</text><line x1="450" y1="213" x2="450" y2="241" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="246" width="840" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="278" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">THE MEASURE</text><text x="450" y="304.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Indefinite detention of foreign nationals only</text><text x="450" y="333.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Anti-terrorism, Crime and Security Act 2001</text><line x1="450" y1="363" x2="450" y2="391" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="396" width="840" height="112" rx="14" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="450" y="428" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">HOUSE OF LORDS</text><text x="450" y="454.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Disproportionate and discriminatory</text><text x="450" y="483.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Derogation order quashed; detention power declared incompatible with Articles 5 and 14</text><line x1="450" y1="513" x2="450" y2="541" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="546" width="840" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="578" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">PARLIAMENT RESPONDS</text><text x="450" y="604.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Control orders: Prevention of Terrorism Act 2005</text><text x="450" y="633.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Later replaced by Terrorism Prevention and Investigation Measures</text>
</svg>