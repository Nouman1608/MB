<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 809" width="900" height="809" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="809" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: Priya’s arrest</text>

<rect x="30" y="100" width="840" height="133" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FACTS</text><text x="50" y="164.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A store detective says a woman “of her description” took a bracelet. PC Lane arrests Priya without</text><text x="50" y="186.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">saying why. She is told the reason three hours later at the station and released without charge after</text><text x="50" y="208.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">20 hours.</text><line x1="60" y1="275" x2="60" y2="757" stroke="#c9d6d4" stroke-width="4"/><rect x="104" y="255" width="766" height="86" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="288.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Deprivation?</text><text x="122" y="318.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Yes: arrest and custody are a clear deprivation of liberty (5.1).</text><circle cx="60" cy="298" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="306.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="104" y="353" width="766" height="108" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="386.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Ground?</text><text x="122" y="416.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">5.1(c): a specific report plus a matching description could satisfy an objective observer</text><text x="122" y="438.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">(<tspan font-style="italic">Fox</tspan>; <tspan font-style="italic">O’Hara</tspan>).</text><circle cx="60" cy="407" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="415.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="104" y="473" width="766" height="108" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="122" y="506.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Article 5.2?</text><text x="122" y="536.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Three hours with no reason at all is hard to justify; reasons are due at the time of arrest or</text><text x="122" y="558.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">as soon as practicable.</text><circle cx="60" cy="527" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="535.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="104" y="593" width="766" height="86" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="626.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Article 5.3?</text><text x="122" y="656.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Not reached: released without charge inside the normal time limits.</text><circle cx="60" cy="636" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="644.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="104" y="691" width="766" height="86" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="724.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Remedy?</text><text x="122" y="754.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">If unlawful for lack of reasons: false imprisonment and s8 damages (5.5).</text><circle cx="60" cy="734" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="742.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text>
</svg>