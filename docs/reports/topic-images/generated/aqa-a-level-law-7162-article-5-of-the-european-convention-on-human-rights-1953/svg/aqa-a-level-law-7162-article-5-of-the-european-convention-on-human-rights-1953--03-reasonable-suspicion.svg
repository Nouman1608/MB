<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 487" width="900" height="487" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="487" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Reasonable suspicion under Article 5.1(c)</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Both parts are needed: O’Hara (1997) and Fox (1990)</text>
<rect x="30" y="124" width="329.1666666666667" height="154" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="177" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SUBJECTIVE</text><text x="50" y="203.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The officer actually suspects</text><text x="50" y="232.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">An honest belief alone is not enough</text><rect x="409.1666666666667" y="124" width="460.83333333333337" height="154" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="429.1666666666667" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">OBJECTIVE</text><text x="429.1666666666667" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">There are reasonable grounds</text><text x="429.1666666666667" y="211.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Facts or information that would satisfy an objective</text><text x="429.1666666666667" y="232.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">observer that the person may have committed the</text><text x="429.1666666666667" y="253.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">offence (<tspan font-style="italic">Fox,</tspan> <tspan font-style="italic">Campbell</tspan> <tspan font-style="italic">and</tspan> <tspan font-style="italic">Hartley</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">UK</tspan>, 1990)</text><circle cx="384.1666666666667" cy="201" r="18" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="384.1666666666667" y="207.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">+</text><rect x="30" y="300" width="270.6666666666667" height="155" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="332" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ENOUGH</text><text x="50" y="358.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Grounds from a superior</text><text x="50" y="381.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">officer’s briefing</text><text x="50" y="409.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">O’Hara</tspan></text><rect x="314.6666666666667" y="300" width="270.6666666666667" height="155" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="334.6666666666667" y="332" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">NOT ENOUGH</text><text x="334.6666666666667" y="358.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">A bare instruction to</text><text x="334.6666666666667" y="381.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">arrest</text><text x="334.6666666666667" y="409.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">O’Hara</tspan></text><rect x="599.3333333333334" y="300" width="270.6666666666667" height="155" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="619.3333333333334" y="332" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">NOT ENOUGH</text><text x="619.3333333333334" y="358.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Previous convictions and</text><text x="619.3333333333334" y="381.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">undisclosed intelligence</text><text x="619.3333333333334" y="409.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Fox,</tspan> <tspan font-style="italic">Campbell</tspan> <tspan font-style="italic">and</tspan> <tspan font-style="italic">Hartley</tspan>:</text><text x="619.3333333333334" y="430.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">breach of 5.1</text>
</svg>