<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 694" width="900" height="694" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="694" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Article 5 in three steps</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">A limited right: no general balancing test</text>
<rect x="30" y="124" width="560" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STEP 1</text><text x="50" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Is there a deprivation of liberty?</text><text x="50" y="211.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Not a mere restriction on movement</text><rect x="650" y="139" width="220" height="80" rx="14" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="666" y="172.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">No: Article 5 is not</text><text x="666" y="193.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">engaged</text><line x1="594" y1="179" x2="646" y2="179" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><text x="620" y="170" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">no</text><line x1="310" y1="240" x2="310" y2="278" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="322" y="265" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">yes</text><rect x="30" y="282" width="560" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="314" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STEP 2</text><text x="50" y="340.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Does a ground in Article 5.1(a)–(c) apply?</text><text x="50" y="369.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Following “a procedure prescribed by law”</text><rect x="650" y="297" width="220" height="80" rx="14" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="666" y="341.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">No: breach of Article 5.1</text><line x1="594" y1="337" x2="646" y2="337" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><text x="620" y="328" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">no</text><line x1="310" y1="398" x2="310" y2="436" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="322" y="423" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">yes</text><rect x="30" y="440" width="560" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="472" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STEP 3</text><text x="50" y="498.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Were the safeguards in Articles 5.2–5.5 met?</text><text x="50" y="527.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Reasons, judge, review, compensation</text><rect x="650" y="455" width="220" height="80" rx="14" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="666" y="488.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">No: breach, even if the</text><text x="666" y="509.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">arrest was lawful</text><line x1="594" y1="495" x2="646" y2="495" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><text x="620" y="486" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">no</text><line x1="310" y1="556" x2="310" y2="594" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="322" y="581" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">yes</text><rect x="30" y="598" width="560" height="64" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="310" y="634.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Detention complies with Article 5</text>
</svg>