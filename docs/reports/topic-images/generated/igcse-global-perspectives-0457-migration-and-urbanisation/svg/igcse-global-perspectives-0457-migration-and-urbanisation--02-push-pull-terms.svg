<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="470" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Push, pull and the flows between places</text>

<rect x="30" y="120" width="240" height="130" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="150" y="165" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Place of origin</text><text x="150" y="194.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">push factors drive</text><text x="150" y="216.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">people away</text><rect x="630" y="120" width="240" height="130" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="750" y="165" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Destination</text><text x="750" y="194.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">pull factors attract</text><text x="750" y="216.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">people</text><line x1="280" y1="165" x2="620" y2="165" stroke="#1e2a44" stroke-width="6" marker-end="url(#ah)"/><text x="450" y="152" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">people move</text><line x1="620" y1="215" x2="280" y2="215" stroke="#8a6d0d" stroke-width="4" marker-end="url(#ahO)" stroke-dasharray="10 7"/><text x="450" y="242" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">remittances: money sent home</text><text x="450" y="295" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">internal (within a country) or international (across borders)</text><rect x="30" y="320" width="268" height="148" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="364" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">URBANISATION</text><text x="50" y="388.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">A rising share of</text><text x="50" y="410.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">people living in towns</text><text x="50" y="432.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">and cities</text><rect x="316" y="320" width="268" height="148" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="336" y="353" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">INFORMAL SETTLEMENT</text><text x="336" y="377.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Housing without</text><text x="336" y="399.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">planning permission or</text><text x="336" y="421.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">legal title, often</text><text x="336" y="443.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">lacking services</text><rect x="602" y="320" width="268" height="148" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="622" y="375" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">BRAIN DRAIN</text><text x="622" y="399.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Loss of skilled workers</text><text x="622" y="421.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">when they emigrate</text>
</svg>