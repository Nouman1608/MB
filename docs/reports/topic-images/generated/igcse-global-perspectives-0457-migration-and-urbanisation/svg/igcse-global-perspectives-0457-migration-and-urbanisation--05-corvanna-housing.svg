<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 802" width="900" height="802" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="802" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Is housing scarce, and why?</text>

<rect x="30" y="114" width="840" height="86" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="50" y="147" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FICTIONAL CITY OF CORVANNA</text><text x="50" y="174" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Claim: newcomers make it harder to find housing</text><rect x="30" y="220" width="410" height="330" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="253" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">EVIDENCE 1: STREET SURVEY</text><text x="50" y="278.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">72% of 400 residents (288) agreed</text><text x="50" y="306.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="306.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Evidence of opinion, not of cause</text><text x="50" y="332.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="332.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">One central district: may not represent the</text><text x="65.2" y="353.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">city</text><rect x="50" y="430" width="266.4" height="46" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><rect x="316.4" y="430" width="103.60000000000001" height="46" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="183.2" y="460" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">288 agreed</text><text x="368.2" y="460" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">112</text><text x="50" y="510" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">what residents believe, not why</text><text x="50" y="532" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">housing is scarce</text><rect x="460" y="220" width="410" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="480" y="254" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EVIDENCE 2: OFFICIAL DATA</text><text x="480" y="280" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Last five years</text><rect x="490" y="304" width="330" height="44" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="500" y="333" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">21,000 new households</text><rect x="490" y="360" width="141.42857142857142" height="44" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="641.4285714285714" y="389" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">9,000 new homes</text><line x1="631.4285714285714" y1="416" x2="820" y2="416" stroke="#b5602e" stroke-width="3" marker-start="url(#ahR)" marker-end="url(#ahR)"/><text x="725.7142857142858" y="440" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">gap: 12,000</text><text x="480" y="472" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Stronger: official and measurable. But slow</text><text x="480" y="493" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">building could explain the gap as much as</text><text x="480" y="514" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">arrivals.</text><rect x="30" y="570" width="840" height="108" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="603" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">TO TEST THE CLAIM</text><text x="50" y="628.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Find the share of new households formed by migrants, and the building rate in</text><text x="50" y="652.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">earlier years</text><rect x="30" y="690" width="840" height="90" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="726" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Judgement</text><text x="50" y="755.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Supports “housing is scarce”; does not establish that newcomers are the main cause.</text>
</svg>