<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="600" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Two chains: why people move, and what follows</text>

<text x="450" y="124" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="middle">Causes</text><rect x="30" y="150" width="144" height="76" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="102" y="172" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Drought</text><text x="102" y="192" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">reduces</text><text x="102" y="212" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">harvests</text><line x1="180" y1="188" x2="198" y2="188" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="204" y="150" width="144" height="76" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="276" y="182" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Farm incomes</text><text x="276" y="202" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">fall</text><line x1="354" y1="188" x2="372" y2="188" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="378" y="150" width="144" height="76" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="172" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Young adults</text><text x="450" y="192" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">move to the</text><text x="450" y="212" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">city for work</text><line x1="528" y1="188" x2="546" y2="188" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="552" y="150" width="144" height="76" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="624" y="172" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Population</text><text x="624" y="192" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">grows faster</text><text x="624" y="212" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">than housing</text><line x1="702" y1="188" x2="720" y2="188" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="726" y="150" width="144" height="76" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="798" y="172" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Informal</text><text x="798" y="192" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">settlements</text><text x="798" y="212" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">expand</text><text x="450" y="264" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">Consequences</text><rect x="30" y="290" width="253.33333333333334" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="156.66666666666669" y="334.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Remittances rise</text><line x1="289.33333333333337" y1="330" x2="317.33333333333337" y2="330" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="323.33333333333337" y="290" width="253.33333333333334" height="80" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450.00000000000006" y="323.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Families pay school</text><text x="450.00000000000006" y="345.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">fees</text><line x1="582.6666666666667" y1="330" x2="610.6666666666667" y2="330" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="616.6666666666667" y="290" width="253.33333333333334" height="80" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="743.3333333333334" y="323.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">More children stay in</text><text x="743.3333333333334" y="345.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">school</text><rect x="30" y="388" width="840" height="84" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="421" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">BUT</text><text x="50" y="446.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Villages may lose working-age adults, leaving older people to farm</text><rect x="30" y="490" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="523.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Separate causes at personal, national and global levels; say who gains and who loses; avoid</text><text x="50" y="545.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">single-cause stories.</text>
</svg>