<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 694" width="900" height="694" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="694" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Who thinks what about migration, and why</text>

<rect x="30" y="104" width="220" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="42" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Group</text><rect x="250" y="104" width="330" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="262" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">A perspective they might hold</text><rect x="580" y="104" width="290" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="592" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Why</text><rect x="30" y="150" width="220" height="64" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="175.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">A rural family</text><rect x="250" y="150" width="330" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="262" y="175.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Moving to the city offers better jobs</text><text x="262" y="196.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">and schools</text><rect x="580" y="150" width="290" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="592" y="175.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Low farm incomes, few local</text><text x="592" y="196.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">services</text><rect x="30" y="214" width="220" height="64" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="239.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Long-standing city</text><text x="42" y="260.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">residents</text><rect x="250" y="214" width="330" height="64" fill="#fbf8ea" stroke="#1e2a44" stroke-width="2"/><text x="262" y="239.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Rapid growth strains housing and</text><text x="262" y="260.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">transport</text><rect x="580" y="214" width="290" height="64" fill="#fbf8ea" stroke="#1e2a44" stroke-width="2"/><text x="592" y="239.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Rents rise and commutes lengthen</text><rect x="30" y="278" width="220" height="43" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="303.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Employers</text><rect x="250" y="278" width="330" height="43" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="262" y="303.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Migrant workers fill labour shortages</text><rect x="580" y="278" width="290" height="43" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="592" y="303.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Some sectors struggle to recruit</text><rect x="30" y="321" width="220" height="64" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="346.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Origin-country</text><text x="42" y="367.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">governments</text><rect x="250" y="321" width="330" height="64" fill="#fbf8ea" stroke="#1e2a44" stroke-width="2"/><text x="262" y="346.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Remittances in, but skills lost</text><rect x="580" y="321" width="290" height="64" fill="#fbf8ea" stroke="#1e2a44" stroke-width="2"/><text x="592" y="346.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Both effects show in national</text><text x="592" y="367.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">data</text><rect x="30" y="385" width="220" height="64" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="410.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Destination-country</text><text x="42" y="431.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">governments</text><rect x="250" y="385" width="330" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="262" y="410.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">From welcoming to restrictive</text><rect x="580" y="385" width="290" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="592" y="410.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Different priorities: economy,</text><text x="592" y="431.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">security, culture, services</text><rect x="30" y="449" width="220" height="85" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="474.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">International bodies</text><rect x="250" y="449" width="330" height="85" fill="#fbf8ea" stroke="#1e2a44" stroke-width="2"/><text x="262" y="474.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Migration should be safe and well</text><text x="262" y="495.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">managed</text><rect x="580" y="449" width="290" height="85" fill="#fbf8ea" stroke="#1e2a44" stroke-width="2"/><text x="592" y="474.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Global Compact adopted 2018; a</text><text x="592" y="495.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">few states voted against or</text><text x="592" y="516.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">abstained</text><rect x="30" y="552" width="840" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="588" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Empathy without agreement</text><text x="50" y="617.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">You can explain why a long-standing resident fears change without endorsing the fear, and</text><text x="50" y="639.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">why a migrant moved without ignoring pressures on the place.</text>
</svg>