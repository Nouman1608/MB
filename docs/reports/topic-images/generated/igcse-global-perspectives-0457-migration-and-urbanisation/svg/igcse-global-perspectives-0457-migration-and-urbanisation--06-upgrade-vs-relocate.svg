<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 559" width="900" height="559" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="559" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">An informal settlement: upgrade or relocate?</text>

<rect x="30" y="104" width="408" height="211" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="137" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">UPGRADE IN PLACE</text><text x="50" y="163.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Water, drains, legal title</text><text x="50" y="191.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="191.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Tackles unsafe water and flooding</text><text x="50" y="217.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="217.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Keeps residents near market jobs</text><text x="50" y="243.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="243.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Often cheaper than rebuilding</text><text x="50" y="269.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="269.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Can be slow; landowners may object</text><rect x="462" y="104" width="408" height="211" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="482" y="137" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">RELOCATE</text><text x="482" y="163.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">New planned housing</text><text x="482" y="191.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="497.2" y="191.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Safer, planned homes</text><text x="482" y="217.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="497.2" y="217.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">New site may be far from work</text><text x="482" y="243.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="497.2" y="243.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Social ties broken</text><text x="482" y="269.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="497.2" y="269.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Residents may return near the centre: the</text><text x="497.2" y="290.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">problem moves</text><rect x="160" y="333" width="580" height="110" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="450" y="366" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">CONDITION</text><text x="450" y="392.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Upgrading is stronger only if land rights can be</text><text x="450" y="417.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">secured first</text><rect x="139.17500000000007" y="461" width="161.075" height="42" rx="21" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="219.71250000000006" y="488.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Effectiveness</text><rect x="312.25000000000006" y="461" width="141.52499999999998" height="42" rx="21" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="383.01250000000005" y="488.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Feasibility</text><rect x="465.77500000000003" y="461" width="170.84999999999997" height="42" rx="21" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="551.2" y="488.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Sustainability</text><rect x="648.625" y="461" width="112.19999999999999" height="42" rx="21" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="704.725" y="488.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Fairness</text><text x="450" y="525" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">A conditional ending (“only if…”) is a sign of evaluation.</text>
</svg>