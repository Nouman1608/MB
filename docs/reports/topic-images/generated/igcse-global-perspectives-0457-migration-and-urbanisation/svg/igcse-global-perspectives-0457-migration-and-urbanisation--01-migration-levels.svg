<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 756" width="900" height="756" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="756" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Migration and urbanisation at four levels</text>

<circle cx="205" cy="350" r="185" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><circle cx="205" cy="350" r="138.75" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="205" cy="350" r="92.5" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><circle cx="205" cy="350" r="46.25" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="205" y="356" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Personal</text><text x="205" y="425.375" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Local</text><text x="205" y="471.625" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">National</text><text x="205" y="517.875" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Global</text><path d="M249.8,351 C334.9,351 334.9,155.5 416,155.5" fill="none" stroke="#1e2a44" stroke-width="2" stroke-dasharray="5 5"/><circle cx="249.8" cy="351" r="4" fill="#1e2a44"/><path d="M236,420.375 C328,420.375 328,270.5 416,270.5" fill="none" stroke="#1e2a44" stroke-width="2" stroke-dasharray="5 5"/><circle cx="236" cy="420.375" r="4" fill="#1e2a44"/><path d="M249.8,466.625 C334.9,466.625 334.9,396.5 416,396.5" fill="none" stroke="#1e2a44" stroke-width="2" stroke-dasharray="5 5"/><circle cx="249.8" cy="466.625" r="4" fill="#1e2a44"/><path d="M240.6,512.875 C330.3,512.875 330.3,533.5 416,533.5" fill="none" stroke="#1e2a44" stroke-width="2" stroke-dasharray="5 5"/><circle cx="240.6" cy="512.875" r="4" fill="#1e2a44"/><rect x="420" y="104" width="450" height="103" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="436" y="135.2" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="start">Personal</text><text x="436" y="164.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">A family member who moved for work, or a</text><text x="436" y="186.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">classmate who arrived recently.</text><rect x="420" y="219" width="450" height="103" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="436" y="250.2" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="start">Local</text><text x="436" y="279.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Rising rents, crowded schools, new businesses,</text><text x="436" y="301.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">new languages, pressure on green space.</text><rect x="420" y="334" width="450" height="125" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="436" y="365.2" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">National</text><text x="436" y="394.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Who may enter, work and settle; planning for</text><text x="436" y="416.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">growing cities. China’s hukou links some</text><text x="436" y="438.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">services to registered residence.</text><rect x="420" y="471" width="450" height="125" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="436" y="502.2" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Global</text><text x="436" y="531.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">55% urban in 2018, projected 68% by 2050 (UN);</text><text x="436" y="553.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">about 304 million international migrants in</text><text x="436" y="575.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">mid-2024 (UN DESA).</text><rect x="30" y="614" width="840" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="650" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Skill move</text><text x="50" y="679.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Ask how a fact at one level plays out at another: a national rule on work permits becomes</text><text x="50" y="701.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">local when a factory cannot fill shifts.</text>
</svg>