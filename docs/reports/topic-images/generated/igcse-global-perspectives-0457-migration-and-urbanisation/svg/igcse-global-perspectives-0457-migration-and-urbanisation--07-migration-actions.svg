<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 422" width="900" height="422" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="422" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three more actions and their trade-offs</text>

<rect x="30" y="104" width="280" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="42" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Action</text><rect x="310" y="104" width="260" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="322" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Possible benefits</text><rect x="570" y="104" width="300" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="582" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Possible drawbacks</text><rect x="30" y="150" width="280" height="66" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="176.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Investing in rural jobs</text><text x="42" y="198.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">and services</text><rect x="310" y="150" width="260" height="66" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="322" y="176.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Reduces pressure to move</text><rect x="570" y="150" width="300" height="66" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="582" y="176.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Long-term; may not stop moves</text><text x="582" y="198.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">for family or education</text><rect x="30" y="216" width="280" height="88" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="242.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Language and job-skills</text><text x="42" y="264.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">programmes for new</text><text x="42" y="286.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">arrivals</text><rect x="310" y="216" width="260" height="88" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="322" y="242.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Faster integration;</text><text x="322" y="264.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">employers gain</text><rect x="570" y="216" width="300" height="88" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="582" y="242.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Needs funding and staff</text><rect x="30" y="304" width="280" height="88" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="330.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Ethical recruitment rules</text><text x="42" y="352.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">for skilled workers</text><rect x="310" y="304" width="260" height="88" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="322" y="330.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Reduces brain drain from</text><text x="322" y="352.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">poorer countries</text><rect x="570" y="304" width="300" height="88" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="582" y="330.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Voluntary codes, such as the</text><text x="582" y="352.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">WHO Global Code (2010), are not</text><text x="582" y="374.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">binding</text>
</svg>