<rect width="900" height="725" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why eating lower in the food chain feeds more people</text>

<rect x="30" y="110" width="840" height="230" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="148" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Eat the crop directly</text><rect x="60" y="170" width="150" height="90" rx="8" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><line x1="75" y1="248" x2="75" y2="200" stroke="#8a6d0d" stroke-width="3"/><ellipse cx="75" cy="196" rx="4" ry="10" fill="#d4b02e"/><line x1="99" y1="248" x2="99" y2="200" stroke="#8a6d0d" stroke-width="3"/><ellipse cx="99" cy="196" rx="4" ry="10" fill="#d4b02e"/><line x1="123" y1="248" x2="123" y2="200" stroke="#8a6d0d" stroke-width="3"/><ellipse cx="123" cy="196" rx="4" ry="10" fill="#d4b02e"/><line x1="147" y1="248" x2="147" y2="200" stroke="#8a6d0d" stroke-width="3"/><ellipse cx="147" cy="196" rx="4" ry="10" fill="#d4b02e"/><line x1="171" y1="248" x2="171" y2="200" stroke="#8a6d0d" stroke-width="3"/><ellipse cx="171" cy="196" rx="4" ry="10" fill="#d4b02e"/><line x1="195" y1="248" x2="195" y2="200" stroke="#8a6d0d" stroke-width="3"/><ellipse cx="195" cy="196" rx="4" ry="10" fill="#d4b02e"/><text x="135" y="284" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">1 ha cereal</text><text x="135" y="304" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">40 150 MJ/yr</text><path d="M222.0,228.0 L326.6,228.0 L326.6,239.7 L350.0,215.0 L326.6,190.3 L326.6,202.0 L222.0,202.0 Z" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><circle cx="390" cy="182" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><path d="M377,210 Q390,186 403,210 Z" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="434" cy="182" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><path d="M421,210 Q434,186 447,210 Z" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="478" cy="182" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><path d="M465,210 Q478,186 491,210 Z" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="522" cy="182" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><path d="M509,210 Q522,186 535,210 Z" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="566" cy="182" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><path d="M553,210 Q566,186 579,210 Z" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="390" cy="244" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><path d="M377,272 Q390,248 403,272 Z" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="434" cy="244" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><path d="M421,272 Q434,248 447,272 Z" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="478" cy="244" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><path d="M465,272 Q478,248 491,272 Z" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="522" cy="244" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><path d="M509,272 Q522,248 535,272 Z" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="566" cy="244" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><path d="M553,272 Q566,248 579,272 Z" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="640" y="210" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">40 150 ÷ 4015</text><text x="640" y="244" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="start">= 10 people</text><rect x="30" y="360" width="840" height="230" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="398" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Feed the crop to livestock first</text><rect x="60" y="420" width="150" height="90" rx="8" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><line x1="75" y1="498" x2="75" y2="450" stroke="#8a6d0d" stroke-width="3"/><ellipse cx="75" cy="446" rx="4" ry="10" fill="#d4b02e"/><line x1="99" y1="498" x2="99" y2="450" stroke="#8a6d0d" stroke-width="3"/><ellipse cx="99" cy="446" rx="4" ry="10" fill="#d4b02e"/><line x1="123" y1="498" x2="123" y2="450" stroke="#8a6d0d" stroke-width="3"/><ellipse cx="123" cy="446" rx="4" ry="10" fill="#d4b02e"/><line x1="147" y1="498" x2="147" y2="450" stroke="#8a6d0d" stroke-width="3"/><ellipse cx="147" cy="446" rx="4" ry="10" fill="#d4b02e"/><line x1="171" y1="498" x2="171" y2="450" stroke="#8a6d0d" stroke-width="3"/><ellipse cx="171" cy="446" rx="4" ry="10" fill="#d4b02e"/><line x1="195" y1="498" x2="195" y2="450" stroke="#8a6d0d" stroke-width="3"/><ellipse cx="195" cy="446" rx="4" ry="10" fill="#d4b02e"/><text x="135" y="534" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">1 ha cereal</text><text x="135" y="554" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">40 150 MJ/yr</text><path d="M222.0,478.0 L276.6,478.0 L276.6,489.7 L300.0,465.0 L276.6,440.3 L276.6,452.0 L222.0,452.0 Z" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><ellipse cx="350" cy="465" rx="38" ry="24" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><circle cx="388" cy="450" r="13" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="350" y="520" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">livestock</text><text x="350" y="540" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">~10% passes on</text><path d="M410.0,467.5 L454.0,467.5 L454.0,477.0 L470.0,465.0 L454.0,453.0 L454.0,462.5 L410.0,462.5 Z" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><circle cx="500" cy="462" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><path d="M487,490 Q500,466 513,490 Z" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><path d="M372,440 Q382.3,442.6 376.0,434.1 Q369.6,425.5 379.9,428.1 Q390.2,430.7 383.9,422.2 Q377.5,413.7 387.8,416.2 Q398.1,418.8 391.8,410.3 L404,392" fill="none" stroke="#b5602e" stroke-width="3" stroke-linecap="round" marker-end="url(#ahR)"/><text x="560" y="455" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">4015 MJ ÷ 4015</text><text x="560" y="489" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="start">= 1 person</text><text x="410" y="398" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">heat</text><rect x="30" y="610" width="840" height="96" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="60" y="644" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">One person needs 11 MJ a day × 365 = 4015 MJ a year.</text><text x="60" y="672" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Eating lower in the food chain feeds ten times as many people from the same land,</text><text x="60" y="694" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">though some grazing land cannot grow crops.</text>
</svg>