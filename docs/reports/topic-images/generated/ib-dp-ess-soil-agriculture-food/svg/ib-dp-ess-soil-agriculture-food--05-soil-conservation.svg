<rect width="900" height="620" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Soil conservation: three ways it works</text>

<rect x="30" y="110" width="270" height="460" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="165" y="148" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Slow water</text><text x="165" y="172" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">or wind</text><path d="M55,320 L275,210 L275,320 Z" fill="#efdfa8" stroke="#1e2a44" stroke-width="2"/><path d="M120,287.5 a9,9 0 0 1 18,-9" fill="none" stroke="#8a6d0d" stroke-width="4"/><path d="M160,267.5 a9,9 0 0 1 18,-9" fill="none" stroke="#8a6d0d" stroke-width="4"/><path d="M200,247.5 a9,9 0 0 1 18,-9" fill="none" stroke="#8a6d0d" stroke-width="4"/><path d="M240,227.5 a9,9 0 0 1 18,-9" fill="none" stroke="#8a6d0d" stroke-width="4"/><line x1="100" y1="250" x2="100" y2="310" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><text x="70" y="240" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">runoff slowed</text><text x="50" y="360" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Contour ploughing</text><text x="50" y="382" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">furrows along contours slow</text><text x="50" y="400" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">runoff</text><text x="50" y="436" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Terracing</text><text x="50" y="458" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">steps reduce slope length and</text><text x="50" y="476" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">gradient</text><text x="50" y="512" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Windbreaks</text><text x="50" y="534" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">trees or hedges cut wind speed</text><rect x="315" y="110" width="270" height="460" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="148" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Keep the surface</text><text x="450" y="172" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">covered</text><rect x="340" y="290" width="220" height="30" fill="#efdfa8" stroke="#1e2a44" stroke-width="2"/><path d="M353,290 l-5,-18 M353,290 l0,-24 M353,290 l5,-18" fill="none" stroke="#6f9a52" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M374,290 l-5,-18 M374,290 l0,-24 M374,290 l5,-18" fill="none" stroke="#6f9a52" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M395,290 l-5,-18 M395,290 l0,-24 M395,290 l5,-18" fill="none" stroke="#6f9a52" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M416,290 l-5,-18 M416,290 l0,-24 M416,290 l5,-18" fill="none" stroke="#6f9a52" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M437,290 l-5,-18 M437,290 l0,-24 M437,290 l5,-18" fill="none" stroke="#6f9a52" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M458,290 l-5,-18 M458,290 l0,-24 M458,290 l5,-18" fill="none" stroke="#6f9a52" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M479,290 l-5,-18 M479,290 l0,-24 M479,290 l5,-18" fill="none" stroke="#6f9a52" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M500,290 l-5,-18 M500,290 l0,-24 M500,290 l5,-18" fill="none" stroke="#6f9a52" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M521,290 l-5,-18 M521,290 l0,-24 M521,290 l5,-18" fill="none" stroke="#6f9a52" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M542,290 l-5,-18 M542,290 l0,-24 M542,290 l5,-18" fill="none" stroke="#6f9a52" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><line x1="395" y1="210" x2="389" y2="240" stroke="#2b5a9a" stroke-width="3"/><line x1="445" y1="210" x2="439" y2="240" stroke="#2b5a9a" stroke-width="3"/><line x1="495" y1="210" x2="489" y2="240" stroke="#2b5a9a" stroke-width="3"/><text x="450" y="202" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">rain splash blocked</text><text x="335" y="360" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Cover crops, mulching</text><text x="335" y="382" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">cover soil between harvests</text><text x="335" y="436" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Reduced or no-till</text><text x="335" y="458" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">keeps structure and organic</text><text x="335" y="476" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">matter</text><text x="335" y="512" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Controlled grazing</text><text x="335" y="534" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">stocking low enough to keep</text><text x="335" y="552" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">cover</text><rect x="600" y="110" width="270" height="460" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="735" y="148" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Maintain organic</text><text x="735" y="172" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">matter and nutrients</text><circle cx="735" cy="262" r="62" fill="none" stroke="#8a6d0d" stroke-width="4" stroke-dasharray="12 8"/><rect x="689" y="185" width="92" height="30" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="735" y="204.95000000000002" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">crop A</text><rect x="742.6935750346352" y="278" width="92" height="30" rx="12" fill="#b5d3cf" stroke="#8a6d0d" stroke-width="2.5"/><text x="788.6935750346352" y="297.95000000000005" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">legume</text><rect x="635.3064249653648" y="278" width="92" height="30" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="681.3064249653648" y="297.95000000000005" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">crop B</text><text x="620" y="360" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Crop rotation</text><text x="620" y="382" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">legumes add nitrogen</text><text x="620" y="436" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Compost and manure</text><text x="620" y="458" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">improve structure, water,</text><text x="620" y="476" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">nutrients</text><text x="620" y="512" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Lime; drip irrigation</text><text x="620" y="534" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">raise pH; reduce salinization</text><text x="450" y="600" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Evaluate: benefit against cost, labour, yield effects and local suitability.</text>
</svg>