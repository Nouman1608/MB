<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 770" width="900" height="770" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="770" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Soil as a system</text>

<rect x="30" y="110" width="840" height="640" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="270" y="260" width="340" height="36" fill="#8a6d0d" stroke="#1e2a44" stroke-width="2"/><text x="254" y="276" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">O horizon</text><text x="254" y="296" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="end">leaf litter, partly</text><text x="254" y="313" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="end">decomposed</text><rect x="270" y="296" width="340" height="104" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><text x="254" y="346" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">A horizon</text><text x="254" y="366" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="end">topsoil: dark,</text><text x="254" y="383" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="end">humus-rich, most roots</text><rect x="270" y="400" width="340" height="100" fill="#efdfa8" stroke="#1e2a44" stroke-width="2"/><text x="254" y="448" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">B horizon</text><text x="254" y="468" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="end">subsoil: leached</text><text x="254" y="485" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="end">minerals collect</text><rect x="270" y="500" width="340" height="80" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2"/><text x="254" y="538" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">C horizon</text><text x="254" y="558" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="end">weathered parent</text><text x="254" y="575" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="end">material</text><rect x="270" y="580" width="340" height="50" fill="#8c8a80" stroke="#1e2a44" stroke-width="2"/><text x="254" y="603" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Bedrock</text><text x="254" y="623" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="end"></text><ellipse cx="300" cy="530" rx="16" ry="10" fill="#9c8f6e" stroke="#1e2a44" stroke-width="1.5"/><ellipse cx="360" cy="550" rx="16" ry="10" fill="#9c8f6e" stroke="#1e2a44" stroke-width="1.5"/><ellipse cx="430" cy="525" rx="16" ry="10" fill="#9c8f6e" stroke="#1e2a44" stroke-width="1.5"/><ellipse cx="520" cy="555" rx="16" ry="10" fill="#9c8f6e" stroke="#1e2a44" stroke-width="1.5"/><ellipse cx="570" cy="530" rx="16" ry="10" fill="#9c8f6e" stroke="#1e2a44" stroke-width="1.5"/><line x1="590" y1="260" x2="590" y2="180" stroke="#6f9a52" stroke-width="5"/><ellipse cx="570" cy="205" rx="22" ry="10" fill="#6f9a52" transform="rotate(-25 570 205)"/><ellipse cx="612" cy="190" rx="22" ry="10" fill="#6f9a52" transform="rotate(25 612 190)"/><path d="M590,260 l-18,50 M590,260 l4,70 M590,260 l14,45" fill="none" stroke="#e8dfc4" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><line x1="300" y1="150" x2="300" y2="254" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><line x1="360" y1="150" x2="360" y2="254" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><line x1="420" y1="150" x2="420" y2="254" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><text x="300" y="142" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">litter</text><text x="360" y="142" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">rain</text><text x="420" y="142" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">Sun, gases</text><line x1="480" y1="254" x2="480" y2="170" stroke="#b5602e" stroke-width="4" marker-end="url(#ahR)"/><text x="472" y="136" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">evaporation,</text><text x="472" y="155" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">respiration gases</text><text x="630" y="220" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">plant uptake</text><line x1="600" y1="258" x2="680" y2="258" stroke="#b5602e" stroke-width="4" marker-end="url(#ahR)"/><text x="690" y="254" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">erosion by</text><text x="690" y="272" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">wind, water</text><line x1="440" y1="640" x2="440" y2="586" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><text x="452" y="672" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">weathered rock in</text><line x1="330" y1="500" x2="330" y2="690" stroke="#b5602e" stroke-width="4" marker-end="url(#ahR)"/><text x="318" y="688" font-size="15" font-weight="700" fill="#b5602e" text-anchor="end">leaching out</text><line x1="390" y1="300" x2="390" y2="470" stroke="#2b5a9a" stroke-width="3.5" marker-end="url(#ah)"/><text x="398" y="360" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="start">percolation,</text><text x="398" y="378" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="start">leaching down</text><path d="M520,330 q12,-10 24,0 q12,10 24,0" fill="none" stroke="#b5602e" stroke-width="5" stroke-linecap="round"/><text x="544" y="360" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="middle">earthworm</text><text x="544" y="377" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="middle">mixing</text><rect x="650" y="320" width="200" height="300" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="668" y="350" font-size="17" font-weight="700" fill="#2b5a9a" text-anchor="start">Transfers</text><text x="668" y="374" font-size="14.5" font-weight="400" fill="#1e2a44" text-anchor="start">infiltration, percolation</text><text x="668" y="393" font-size="14.5" font-weight="400" fill="#1e2a44" text-anchor="start">leaching downwards</text><text x="668" y="412" font-size="14.5" font-weight="400" fill="#1e2a44" text-anchor="start">earthworm mixing</text><text x="668" y="431" font-size="14.5" font-weight="400" fill="#1e2a44" text-anchor="start">clay translocation</text><text x="668" y="474" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">Transformations</text><text x="668" y="498" font-size="14.5" font-weight="400" fill="#1e2a44" text-anchor="start">decomposition</text><text x="668" y="517" font-size="14.5" font-weight="400" fill="#1e2a44" text-anchor="start">humification</text><text x="668" y="536" font-size="14.5" font-weight="400" fill="#1e2a44" text-anchor="start">weathering of rock</text><text x="668" y="555" font-size="14.5" font-weight="400" fill="#1e2a44" text-anchor="start">nitrogen fixation</text><text x="668" y="574" font-size="14.5" font-weight="400" fill="#1e2a44" text-anchor="start">nutrient release</text><text x="450" y="728" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Soil forms very slowly, so it is effectively non-renewable on a human timescale.</text>
</svg>