<rect width="900" height="755" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Soil degradation</text>

<rect x="30" y="110" width="410" height="520" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="235" y="148" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Salinization</text><rect x="50" y="380" width="370" height="150" fill="#efdfa8" stroke="#1e2a44" stroke-width="2"/><rect x="50" y="400" width="370" height="60" fill="#b5d3cf" opacity="0.5"/><text x="235" y="438" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">irrigation water in the soil</text><circle cx="58" cy="377" r="4" fill="#ffffff" stroke="#1e2a44" stroke-width="1.2"/><circle cx="72" cy="377" r="4" fill="#ffffff" stroke="#1e2a44" stroke-width="1.2"/><circle cx="86" cy="377" r="4" fill="#ffffff" stroke="#1e2a44" stroke-width="1.2"/><circle cx="100" cy="377" r="4" fill="#ffffff" stroke="#1e2a44" stroke-width="1.2"/><circle cx="114" cy="377" r="4" fill="#ffffff" stroke="#1e2a44" stroke-width="1.2"/><circle cx="128" cy="377" r="4" fill="#ffffff" stroke="#1e2a44" stroke-width="1.2"/><circle cx="142" cy="377" r="4" fill="#ffffff" stroke="#1e2a44" stroke-width="1.2"/><circle cx="156" cy="377" r="4" fill="#ffffff" stroke="#1e2a44" stroke-width="1.2"/><circle cx="170" cy="377" r="4" fill="#ffffff" stroke="#1e2a44" stroke-width="1.2"/><circle cx="184" cy="377" r="4" fill="#ffffff" stroke="#1e2a44" stroke-width="1.2"/><circle cx="198" cy="377" r="4" fill="#ffffff" stroke="#1e2a44" stroke-width="1.2"/><circle cx="212" cy="377" r="4" fill="#ffffff" stroke="#1e2a44" stroke-width="1.2"/><circle cx="226" cy="377" r="4" fill="#ffffff" stroke="#1e2a44" stroke-width="1.2"/><circle cx="240" cy="377" r="4" fill="#ffffff" stroke="#1e2a44" stroke-width="1.2"/><circle cx="254" cy="377" r="4" fill="#ffffff" stroke="#1e2a44" stroke-width="1.2"/><circle cx="268" cy="377" r="4" fill="#ffffff" stroke="#1e2a44" stroke-width="1.2"/><circle cx="282" cy="377" r="4" fill="#ffffff" stroke="#1e2a44" stroke-width="1.2"/><circle cx="296" cy="377" r="4" fill="#ffffff" stroke="#1e2a44" stroke-width="1.2"/><circle cx="310" cy="377" r="4" fill="#ffffff" stroke="#1e2a44" stroke-width="1.2"/><circle cx="324" cy="377" r="4" fill="#ffffff" stroke="#1e2a44" stroke-width="1.2"/><circle cx="338" cy="377" r="4" fill="#ffffff" stroke="#1e2a44" stroke-width="1.2"/><circle cx="352" cy="377" r="4" fill="#ffffff" stroke="#1e2a44" stroke-width="1.2"/><circle cx="366" cy="377" r="4" fill="#ffffff" stroke="#1e2a44" stroke-width="1.2"/><circle cx="380" cy="377" r="4" fill="#ffffff" stroke="#1e2a44" stroke-width="1.2"/><circle cx="394" cy="377" r="4" fill="#ffffff" stroke="#1e2a44" stroke-width="1.2"/><circle cx="408" cy="377" r="4" fill="#ffffff" stroke="#1e2a44" stroke-width="1.2"/><circle cx="345" cy="205" r="26" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="345" y="250" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">hot, dry</text><path d="M110,366 Q120.0,361.9 110.0,357.9 Q100.0,353.8 110.0,349.7 Q120.0,345.6 110.0,341.6 Q100.0,337.5 110.0,333.4 Q120.0,329.4 110.0,325.3 Q100.0,321.2 110.0,317.1 Q120.0,313.1 110.0,309.0 Q100.0,304.9 110.0,300.9 Q120.0,296.8 110.0,292.7 Q100.0,288.6 110.0,284.6 Q120.0,280.5 110.0,276.4 Q100.0,272.4 110.0,268.3 Q120.0,264.2 110.0,260.1 Q100.0,256.1 110.0,252.0 L110,230" fill="none" stroke="#2e6b62" stroke-width="3" stroke-linecap="round" marker-end="url(#ahT)"/><path d="M170,366 Q180.0,361.9 170.0,357.9 Q160.0,353.8 170.0,349.7 Q180.0,345.6 170.0,341.6 Q160.0,337.5 170.0,333.4 Q180.0,329.4 170.0,325.3 Q160.0,321.2 170.0,317.1 Q180.0,313.1 170.0,309.0 Q160.0,304.9 170.0,300.9 Q180.0,296.8 170.0,292.7 Q160.0,288.6 170.0,284.6 Q180.0,280.5 170.0,276.4 Q160.0,272.4 170.0,268.3 Q180.0,264.2 170.0,260.1 Q160.0,256.1 170.0,252.0 L170,230" fill="none" stroke="#2e6b62" stroke-width="3" stroke-linecap="round" marker-end="url(#ahT)"/><path d="M230,366 Q240.0,361.9 230.0,357.9 Q220.0,353.8 230.0,349.7 Q240.0,345.6 230.0,341.6 Q220.0,337.5 230.0,333.4 Q240.0,329.4 230.0,325.3 Q220.0,321.2 230.0,317.1 Q240.0,313.1 230.0,309.0 Q220.0,304.9 230.0,300.9 Q240.0,296.8 230.0,292.7 Q220.0,288.6 230.0,284.6 Q240.0,280.5 230.0,276.4 Q220.0,272.4 230.0,268.3 Q240.0,264.2 230.0,260.1 Q220.0,256.1 230.0,252.0 L230,230" fill="none" stroke="#2e6b62" stroke-width="3" stroke-linecap="round" marker-end="url(#ahT)"/><text x="170" y="220" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">water evaporates</text><text x="345" y="340" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">salts left</text><text x="345" y="360" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">at the surface</text><text x="56" y="560" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Salts build up until crops cannot</text><text x="56" y="581" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">take up water.</text><rect x="460" y="110" width="410" height="520" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="665" y="148" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Soil loss as depth</text><text x="484" y="190" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">24.0 t per ha per year</text><text x="484" y="220" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">÷ 10 000 m² = 0.0024 t per m²</text><text x="484" y="250" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">÷ 1.2 t/m³ = 0.002 m</text><rect x="484" y="280" width="360" height="64" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="664" y="320" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">= 2.0 mm a year</text><rect x="520" y="380" width="300" height="40" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><line x1="520" y1="380" x2="520" y2="400" stroke="#1e2a44" stroke-width="1.5"/><line x1="550" y1="380" x2="550" y2="392" stroke="#1e2a44" stroke-width="1.5"/><line x1="580" y1="380" x2="580" y2="400" stroke="#1e2a44" stroke-width="1.5"/><line x1="610" y1="380" x2="610" y2="392" stroke="#1e2a44" stroke-width="1.5"/><line x1="640" y1="380" x2="640" y2="400" stroke="#1e2a44" stroke-width="1.5"/><line x1="670" y1="380" x2="670" y2="392" stroke="#1e2a44" stroke-width="1.5"/><line x1="700" y1="380" x2="700" y2="400" stroke="#1e2a44" stroke-width="1.5"/><line x1="730" y1="380" x2="730" y2="392" stroke="#1e2a44" stroke-width="1.5"/><line x1="760" y1="380" x2="760" y2="400" stroke="#1e2a44" stroke-width="1.5"/><line x1="790" y1="380" x2="790" y2="392" stroke="#1e2a44" stroke-width="1.5"/><line x1="820" y1="380" x2="820" y2="400" stroke="#1e2a44" stroke-width="1.5"/><rect x="520" y="402" width="300" height="18" fill="#b5602e" opacity="0.8"/><text x="670" y="444" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">50 mm lost over 25 years</text><text x="484" y="500" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Soil forms at a few centimetres</text><text x="484" y="521" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">over centuries, so this loss far</text><text x="484" y="542" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">exceeds replacement.</text><text x="450" y="668" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Main forms of soil degradation</text><rect x="30" y="686" width="132" height="52" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="96" y="716.9499999999999" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Erosion</text><rect x="172" y="686" width="132" height="52" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="238" y="716.9499999999999" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Salinization</text><rect x="314" y="686" width="132" height="52" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="380" y="707.8" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Nutrient</text><text x="380" y="726.1" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">depletion</text><rect x="456" y="686" width="132" height="52" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="522" y="716.9499999999999" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Compaction</text><rect x="598" y="686" width="132" height="52" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="664" y="716.9499999999999" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Contamination</text><rect x="740" y="686" width="132" height="52" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="806" y="716.9499999999999" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Desertification</text>
</svg>