<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 610" width="900" height="610" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="610" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: water and organic matter</text>

<rect x="30" y="120" width="250" height="100" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="155" y="155.47000000000003" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Fresh sample</text><text x="155" y="176.79000000000002" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">32.0 g</text><text x="155" y="197.59" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle"></text><rect x="325" y="120" width="250" height="100" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="155.47000000000003" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">After oven drying</text><text x="450" y="176.79000000000002" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">25.0 g</text><text x="450" y="197.59" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">water lost: 7.0 g</text><rect x="620" y="120" width="250" height="100" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="745" y="155.47000000000003" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">After ignition</text><text x="745" y="176.79000000000002" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">23.6 g</text><text x="745" y="197.59" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">organic matter lost: 1.4 g</text><line x1="282" y1="170" x2="321" y2="170" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><line x1="577" y1="170" x2="616" y2="170" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="30" y="250" width="840" height="210" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="290" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Make-up of the fresh sample (g)</text><rect x="100" y="310" width="519.2" height="56" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2"/><text x="359.6" y="344" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">mineral 23.6</text><rect x="619.2" y="310" width="30.799999999999997" height="56" fill="#8a6d0d" stroke="#1e2a44" stroke-width="2"/><rect x="650" y="310" width="154" height="56" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="727" y="344" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">water 7.0</text><line x1="634.6" y1="368" x2="634.6" y2="384" stroke="#1e2a44" stroke-width="2"/><text x="634.6" y="404" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">organic 1.4</text><line x1="100" y1="432" x2="650" y2="432" stroke="#1e2a44" stroke-width="2.5"/><line x1="100" y1="424" x2="100" y2="440" stroke="#1e2a44" stroke-width="2.5"/><line x1="650" y1="424" x2="650" y2="440" stroke="#1e2a44" stroke-width="2.5"/><text x="375" y="452" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">dry mass 25.0</text><rect x="30" y="480" width="410" height="110" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="235" y="516" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">Water content</text><text x="235" y="550" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">7.0 ÷ 32.0 × 100 = 21.9%</text><text x="235" y="576" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">of FRESH mass</text><rect x="460" y="480" width="410" height="110" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="665" y="516" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">Organic matter content</text><text x="665" y="550" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">1.4 ÷ 25.0 × 100 = 5.6%</text><text x="665" y="576" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">of DRY mass</text>
</svg>