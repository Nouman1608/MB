<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 675" width="900" height="675" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="675" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Where food is wasted</text>

<text x="120" y="140" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Field</text><line x1="172" y1="134" x2="233" y2="134" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="285" y="140" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Storage</text><line x1="337" y1="134" x2="398" y2="134" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="450" y="140" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Transport</text><line x1="502" y1="134" x2="563" y2="134" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="615" y="140" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Shops</text><line x1="667" y1="134" x2="728" y2="134" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="780" y="140" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Homes</text><rect x="30" y="160" width="840" height="220" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="198" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Lower-income countries: more lost early</text><line x1="120" y1="270" x2="780" y2="270" stroke="#c9d6d4" stroke-width="4"/><circle cx="120" cy="270" r="42" fill="#b5602e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="285" cy="270" r="42" fill="#b5602e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="450" cy="270" r="38" fill="#b5602e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="615" cy="270" r="18" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><circle cx="780" cy="270" r="18" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="356" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">pests, poor storage and weak cold chains</text><rect x="30" y="400" width="840" height="220" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="438" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Higher-income countries: more wasted late</text><line x1="120" y1="510" x2="780" y2="510" stroke="#c9d6d4" stroke-width="4"/><circle cx="120" cy="510" r="18" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><circle cx="285" cy="510" r="18" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><circle cx="450" cy="510" r="18" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><circle cx="615" cy="510" r="42" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="780" cy="510" r="42" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="596" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">cosmetic standards, large portions and over-buying</text><text x="450" y="650" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Circle size is schematic: it shows where most food is lost, not measured amounts.</text>
</svg>