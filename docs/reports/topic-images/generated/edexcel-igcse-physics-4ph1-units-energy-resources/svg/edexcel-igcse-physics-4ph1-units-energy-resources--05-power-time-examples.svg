<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="900" height="650" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="650" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked examples: kW, minutes and power</text>

<rect x="30" y="110" width="410" height="420" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="148" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Lift motor</text><text x="54" y="182" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">useful power 4.5 kW for 2.0 minutes;</text><text x="54" y="204" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">find the energy in MJ</text><text x="54" y="270" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">P = 4.5 kW = 4500 W</text><text x="54" y="304" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">t = 2.0 × 60 = 120 s</text><text x="54" y="338" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">E = P × t</text><text x="54" y="372" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">  = 4500 × 120</text><text x="54" y="406" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">  = 540 000 J</text><rect x="50" y="450" width="370" height="58" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="235" y="488" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">0.54 MJ</text><rect x="460" y="110" width="410" height="420" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="484" y="148" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Climber</text><text x="484" y="182" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">75 kg, gains 300 m in 25 minutes,</text><text x="484" y="204" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">g = 10 N/kg; find the average power</text><text x="484" y="270" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">GPE = m × g × h</text><text x="484" y="304" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">  = 75 × 10 × 300 = 225 000 J</text><text x="484" y="338" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">t = 25 × 60 = 1500 s</text><text x="484" y="372" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">P = W / t</text><text x="484" y="406" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">  = 225 000 / 1500</text><rect x="480" y="450" width="370" height="58" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="665" y="488" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">150 W</text><rect x="30" y="550" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="598" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">A rucksack of 8000 g would become 8.0 kg before entering the equation.</text>
</svg>