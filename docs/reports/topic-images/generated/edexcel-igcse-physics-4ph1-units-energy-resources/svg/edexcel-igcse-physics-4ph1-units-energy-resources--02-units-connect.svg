<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 740" width="900" height="740" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="740" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How the units connect</text>

<rect x="30" y="110" width="840" height="86" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="162" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">W = F × d</text><text x="320" y="162" font-size="20" font-weight="600" fill="#2b5a9a" text-anchor="start">1 J = 1 N × 1 m</text><text x="840" y="162" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">one newton metre</text><rect x="30" y="208" width="840" height="86" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="260" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">P = W / t</text><text x="320" y="260" font-size="20" font-weight="600" fill="#2b5a9a" text-anchor="start">1 W = 1 J / 1 s</text><text x="840" y="260" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">one joule per second</text><rect x="30" y="306" width="840" height="86" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="358" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">F = m × a</text><text x="320" y="358" font-size="20" font-weight="600" fill="#2b5a9a" text-anchor="start">1 N = 1 kg × 1 m/s²</text><rect x="30" y="404" width="840" height="86" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="60" y="456" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">KE = ½ × m × v²</text><text x="320" y="456" font-size="20" font-weight="600" fill="#2b5a9a" text-anchor="start">kg × (m/s)² = kg m²/s² = N m = J</text><rect x="30" y="502" width="840" height="86" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="60" y="554" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">GPE = m × g × h</text><text x="320" y="554" font-size="20" font-weight="600" fill="#2b5a9a" text-anchor="start">kg × m/s² × m = N × m = J</text><rect x="30" y="610" width="840" height="110" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="650" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">KE and GPE both come out in joules, so one store can transfer into the other.</text><text x="450" y="684" font-size="17" font-weight="400" fill="#b5602e" text-anchor="middle">An energy in kg m/s or kg m²/s means the equation was misused (e.g. v not squared).</text>
</svg>