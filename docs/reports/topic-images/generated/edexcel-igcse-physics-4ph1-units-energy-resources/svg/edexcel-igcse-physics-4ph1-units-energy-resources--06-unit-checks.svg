<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" width="900" height="680" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="680" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Checking with units</text>

<rect x="30" y="110" width="840" height="300" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="148" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Rearranging KE = ½ × m × v² for v</text><rect x="60" y="170" width="380" height="220" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="250" y="210" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="middle">✓ v = √(2 × KE / m)</text><text x="80" y="254" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">units inside the root: J/kg</text><text x="80" y="284" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">= (kg m²/s²) / kg = m²/s²</text><text x="80" y="314" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">√(m²/s²) = m/s</text><text x="250" y="370" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">a speed</text><rect x="460" y="170" width="380" height="220" rx="12" fill="#fbeee6" stroke="#b5602e" stroke-width="2.5"/><text x="650" y="210" font-size="21" font-weight="700" fill="#b5602e" text-anchor="middle">✗ v = √(KE × m / 2)</text><text x="480" y="254" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">units: √(kg m²/s² × kg)</text><text x="480" y="284" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">= kg m/s</text><text x="650" y="370" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">not a speed at all</text><rect x="30" y="430" width="840" height="230" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="60" y="468" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Energy and power: a rate is something per second</text><rect x="60" y="490" width="360" height="64" rx="10" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="240" y="531" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">J ÷ s = W</text><rect x="480" y="490" width="360" height="64" rx="10" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="660" y="531" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">W × s = J</text><text x="60" y="596" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A 2 kW heater transfers 2 kJ every second. kW is a power; kJ is an energy.</text><text x="60" y="630" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Efficiency is J ÷ J: no unit. Write 0.35 or 35%, never "35 J".</text>
</svg>