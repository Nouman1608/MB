<rect width="900" height="810" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Topic 4 quantities and their units</text>

<rect x="30" y="110" width="840" height="46" rx="10" fill="#1e2a44" stroke="#1e2a44" stroke-width="0"/><text x="50" y="140" font-size="17" font-weight="700" fill="#fff" text-anchor="start">Quantity</text><text x="250" y="140" font-size="17" font-weight="700" fill="#fff" text-anchor="start">Symbol</text><text x="340" y="140" font-size="17" font-weight="700" fill="#fff" text-anchor="start">Unit</text><text x="600" y="140" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">Unit symbol</text><text x="680" y="140" font-size="17" font-weight="700" fill="#fff" text-anchor="start">Used in</text><rect x="30" y="164" width="840" height="50" rx="8" fill="#f8faf9" stroke="#c9d6d4" stroke-width="1.5"/><text x="50" y="196" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">mass</text><text x="250" y="196" font-size="17" font-weight="400" fill="#2b5a9a" text-anchor="start" font-style="italic">m</text><text x="340" y="196" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">kilogram</text><text x="600" y="197" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle">kg</text><text x="680" y="196" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">GPE = mgh,  KE = ½mv²</text><rect x="30" y="220" width="840" height="50" rx="8" fill="#ffffff" stroke="#c9d6d4" stroke-width="1.5"/><text x="50" y="252" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">energy, work done</text><text x="250" y="252" font-size="17" font-weight="400" fill="#2b5a9a" text-anchor="start" font-style="italic">E, W</text><text x="340" y="252" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">joule</text><text x="600" y="253" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle">J</text><text x="680" y="252" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">stores, Sankey diagrams</text><rect x="30" y="276" width="840" height="50" rx="8" fill="#f8faf9" stroke="#c9d6d4" stroke-width="1.5"/><text x="50" y="308" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">distance, height</text><text x="250" y="308" font-size="17" font-weight="400" fill="#2b5a9a" text-anchor="start" font-style="italic">d, h</text><text x="340" y="308" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">metre</text><text x="600" y="309" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle">m</text><text x="680" y="308" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">W = F × d,  GPE = mgh</text><rect x="30" y="332" width="840" height="50" rx="8" fill="#ffffff" stroke="#c9d6d4" stroke-width="1.5"/><text x="50" y="364" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">speed</text><text x="250" y="364" font-size="17" font-weight="400" fill="#2b5a9a" text-anchor="start" font-style="italic">v</text><text x="340" y="364" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">metre/second</text><text x="600" y="365" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle">m/s</text><text x="680" y="364" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">KE = ½mv²</text><rect x="30" y="388" width="840" height="50" rx="8" fill="#f8faf9" stroke="#c9d6d4" stroke-width="1.5"/><text x="50" y="420" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">g (or acceleration)</text><text x="250" y="420" font-size="17" font-weight="400" fill="#2b5a9a" text-anchor="start" font-style="italic">g</text><text x="340" y="420" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">metre/second² (= N/kg)</text><text x="600" y="421" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle">m/s²</text><text x="680" y="420" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">GPE = mgh</text><rect x="30" y="444" width="840" height="50" rx="8" fill="#ffffff" stroke="#c9d6d4" stroke-width="1.5"/><text x="50" y="476" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">force</text><text x="250" y="476" font-size="17" font-weight="400" fill="#2b5a9a" text-anchor="start" font-style="italic">F</text><text x="340" y="476" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">newton</text><text x="600" y="477" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle">N</text><text x="680" y="476" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">W = F × d</text><rect x="30" y="500" width="840" height="50" rx="8" fill="#f8faf9" stroke="#c9d6d4" stroke-width="1.5"/><text x="50" y="532" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">time</text><text x="250" y="532" font-size="17" font-weight="400" fill="#2b5a9a" text-anchor="start" font-style="italic">t</text><text x="340" y="532" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">second</text><text x="600" y="533" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle">s</text><text x="680" y="532" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">P = W / t</text><rect x="30" y="556" width="840" height="50" rx="8" fill="#ffffff" stroke="#c9d6d4" stroke-width="1.5"/><text x="50" y="588" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">power</text><text x="250" y="588" font-size="17" font-weight="400" fill="#2b5a9a" text-anchor="start" font-style="italic">P</text><text x="340" y="588" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">watt</text><text x="600" y="589" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle">W</text><text x="680" y="588" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">P = W / t</text><rect x="30" y="612" width="840" height="50" rx="8" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="1.5"/><text x="50" y="644" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">efficiency</text><text x="250" y="644" font-size="17" font-weight="400" fill="#2b5a9a" text-anchor="start">—</text><text x="340" y="644" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">no unit</text><text x="600" y="645" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle">—</text><text x="680" y="644" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">decimal or %</text><rect x="30" y="680" width="840" height="110" rx="14" fill="#fbeee6" stroke="#b5602e" stroke-width="2.5"/><text x="60" y="716" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">Same letter, two jobs: read it from its position.</text><text x="60" y="748" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">W = work done in W = F × d, but W = watt after a number.</text><text x="60" y="774" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">m = mass in an equation, but m = metre after a number.</text>
</svg>