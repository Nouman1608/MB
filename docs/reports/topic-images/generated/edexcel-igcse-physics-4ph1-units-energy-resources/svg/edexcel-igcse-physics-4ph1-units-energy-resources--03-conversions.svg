<rect x="30" y="156" width="415" height="78" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><rect x="44" y="170" width="120" height="50" rx="8" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="104" y="202" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">250 mJ</text><line x1="170" y1="195" x2="292" y2="195" stroke="#1e2a44" stroke-width="3"/><path d="M292,188 L306,195 L292,202 Z" fill="#1e2a44"/><text x="236" y="186" font-size="16" font-weight="700" fill="#2b5a9a" text-anchor="middle">× 10⁻³</text><text x="430" y="202" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">0.25 J</text><rect x="30" y="248" width="415" height="78" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><rect x="44" y="262" width="120" height="50" rx="8" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="104" y="294" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">3.5 kJ</text><line x1="170" y1="287" x2="292" y2="287" stroke="#1e2a44" stroke-width="3"/><path d="M292,280 L306,287 L292,294 Z" fill="#1e2a44"/><text x="236" y="278" font-size="16" font-weight="700" fill="#2b5a9a" text-anchor="middle">× 10³</text><text x="430" y="294" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">3500 J</text><rect x="30" y="340" width="415" height="78" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><rect x="44" y="354" width="120" height="50" rx="8" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="104" y="386" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">2.2 kW</text><line x1="170" y1="379" x2="292" y2="379" stroke="#1e2a44" stroke-width="3"/><path d="M292,372 L306,379 L292,386 Z" fill="#1e2a44"/><text x="236" y="370" font-size="16" font-weight="700" fill="#2b5a9a" text-anchor="middle">× 10³</text><text x="430" y="386" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">2200 W</text><rect x="30" y="432" width="415" height="78" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><rect x="44" y="446" width="120" height="50" rx="8" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="104" y="478" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">1.8 MJ</text><line x1="170" y1="471" x2="292" y2="471" stroke="#1e2a44" stroke-width="3"/><path d="M292,464 L306,471 L292,478 Z" fill="#1e2a44"/><text x="236" y="462" font-size="16" font-weight="700" fill="#2b5a9a" text-anchor="middle">× 10⁶</text><text x="430" y="478" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">1.8 × 10⁶ J</text><rect x="455" y="110" width="415" height="78" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><rect x="469" y="124" width="120" height="50" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="529" y="156" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">500 g</text><line x1="595" y1="149" x2="717" y2="149" stroke="#1e2a44" stroke-width="3"/><path d="M717,142 L731,149 L717,156 Z" fill="#1e2a44"/><text x="661" y="140" font-size="16" font-weight="700" fill="#2b5a9a" text-anchor="middle">÷ 1000</text><text x="855" y="156" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">0.500 kg</text><rect x="455" y="202" width="415" height="78" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><rect x="469" y="216" width="120" height="50" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="529" y="248" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">45 cm</text><line x1="595" y1="241" x2="717" y2="241" stroke="#1e2a44" stroke-width="3"/><path d="M717,234 L731,241 L717,248 Z" fill="#1e2a44"/><text x="661" y="232" font-size="16" font-weight="700" fill="#2b5a9a" text-anchor="middle">÷ 100</text><text x="855" y="248" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">0.45 m</text><rect x="455" y="294" width="415" height="78" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><rect x="469" y="308" width="120" height="50" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="529" y="340" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">minutes</text><line x1="595" y1="333" x2="717" y2="333" stroke="#1e2a44" stroke-width="3"/><path d="M717,326 L731,333 L717,340 Z" fill="#1e2a44"/><text x="661" y="324" font-size="16" font-weight="700" fill="#2b5a9a" text-anchor="middle">× 60</text><text x="855" y="340" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">seconds</text><rect x="455" y="386" width="415" height="78" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><rect x="469" y="400" width="120" height="50" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="529" y="432" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">hours</text><line x1="595" y1="425" x2="717" y2="425" stroke="#1e2a44" stroke-width="3"/><path d="M717,418 L731,425 L717,432 Z" fill="#1e2a44"/><text x="661" y="416" font-size="16" font-weight="700" fill="#2b5a9a" text-anchor="middle">× 3600</text><text x="855" y="432" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">seconds</text><rect x="455" y="478" width="415" height="78" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><rect x="469" y="492" width="120" height="50" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="529" y="524" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">72 km/h</text><line x1="595" y1="517" x2="717" y2="517" stroke="#1e2a44" stroke-width="3"/><path d="M717,510 L731,517 L717,524 Z" fill="#1e2a44"/><text x="661" y="508" font-size="16" font-weight="700" fill="#2b5a9a" text-anchor="middle">÷ 3.6</text><text x="855" y="524" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">20 m/s</text><text x="235" y="140" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="middle">Prefixes</text><text x="235" y="532" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">m (milli) is tiny; M (mega) is huge.</text><text x="660" y="588" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">km/h → m/s: × 1000 ÷ 3600 = ÷ 3.6</text><rect x="30" y="610" width="840" height="70" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="652" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Convert every value to the base unit before you substitute.</text>
</svg>