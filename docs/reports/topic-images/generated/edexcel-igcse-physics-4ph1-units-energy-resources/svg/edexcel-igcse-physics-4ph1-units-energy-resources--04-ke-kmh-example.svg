<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 750" width="900" height="750" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="750" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: speed in km/h</text>

<rect x="30" y="110" width="840" height="300" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="148" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Car: m = 1200 kg, speed 72 km/h. Find KE in kJ.</text><text x="60" y="190" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">v = 72 / 3.6 = 20 m/s</text><text x="60" y="224" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">KE = ½ × m × v² = 0.5 × 1200 × 20²</text><text x="60" y="258" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">     = 0.5 × 1200 × 400 = 240 000 J</text><text x="60" y="292" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">240 000 J ÷ 1000</text><rect x="560" y="300" width="290" height="60" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="705" y="339" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">KE = 240 kJ</text><rect x="30" y="430" width="840" height="300" rx="14" fill="#fbeee6" stroke="#b5602e" stroke-width="2.5"/><text x="60" y="468" font-size="20" font-weight="700" fill="#b5602e" text-anchor="start">✗ Substituting 72 directly</text><text x="60" y="504" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">0.5 × 1200 × 72² = 3 110 400 J: almost thirteen times too big, because v is squared</text><text x="60" y="560" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">correct</text><rect x="60" y="570" width="58.64197530864198" height="34" rx="3" fill="#2e6b62" stroke="#2e6b62" stroke-width="0"/><text x="128.64197530864197" y="595" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">240 000 J</text><text x="60" y="640" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">wrong</text><rect x="60" y="650" width="760" height="34" rx="3" fill="#b5602e" stroke="#b5602e" stroke-width="0"/><text x="820" y="675" font-size="16" font-weight="700" fill="#ffffff" text-anchor="end">3 110 400 J</text><text x="450" y="715" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Bars drawn to scale.</text>
</svg>