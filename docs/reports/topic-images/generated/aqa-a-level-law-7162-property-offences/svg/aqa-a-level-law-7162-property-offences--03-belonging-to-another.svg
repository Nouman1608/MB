<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 515" width="900" height="515" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="515" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Belonging to another: s5</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Anyone with possession or control, or any proprietary right or interest</text>
<rect x="30" y="124" width="413" height="97" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="45" y="151" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">YOUR OWN PROPERTY</text><text x="45" y="182" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">R</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Turner</tspan> <tspan font-style="italic">(No</tspan> <tspan font-style="italic">2)</tspan> (1971): took his own car from the</text><text x="45" y="202" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">garage that had repaired it</text><rect x="457" y="124" width="413" height="97" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="472" y="151" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CONTROL WITHOUT KNOWLEDGE</text><text x="472" y="182" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">R</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Woodman</tspan> (1974): scrap metal on a sold site still</text><text x="472" y="202" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">controlled by the owner</text><rect x="30" y="233" width="413" height="97" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="45" y="260" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">NOT ABANDONED</text><text x="45" y="291" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Ricketts</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Basildon</tspan> (2010): bags left outside a charity</text><text x="45" y="311" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">shop belonged to the charity</text><rect x="457" y="233" width="413" height="97" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="472" y="260" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">MISTAKE, s5(4)</text><text x="472" y="291" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Legal obligation to restore, e.g. overpaid wages:</text><text x="472" y="311" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">A-G’s Ref (No 1 of 1983)</text><text x="450" y="370" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">s5(3): an obligation to deal with the property in a particular way?</text><rect x="30" y="386" width="411" height="97" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="45" y="413" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">YES: STILL BELONGS TO ANOTHER</text><text x="45" y="444" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Davidge</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Bunnett</tspan> (1984): gas-bill money spent on</text><text x="45" y="464" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">herself</text><rect x="459" y="386" width="411" height="97" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="474" y="413" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">NO: NOT THEFT</text><text x="474" y="444" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">R</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Hall</tspan> (1972): travel agent’s deposits, no duty to</text><text x="474" y="464" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">keep them separate</text>
</svg>