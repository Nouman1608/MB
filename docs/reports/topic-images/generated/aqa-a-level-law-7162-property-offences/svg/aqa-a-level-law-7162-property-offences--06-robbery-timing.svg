<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 588" width="900" height="588" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="588" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Robbery: theft plus force, at the right time</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">s8(1): maximum life, indictable only</text>
<line x1="60" y1="194" x2="840" y2="194" stroke="#1e2a44" stroke-width="3"/><rect x="60" y="176" width="500" height="36" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="310" y="200" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">force before or at the time, in order to steal: ROBBERY</text><rect x="560" y="176" width="280" height="36" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><text x="700" y="200" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">theft over: not robbery</text><line x1="400" y1="134" x2="400" y2="176" stroke="#1e2a44" stroke-width="2.5"/><text x="400" y="126" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">appropriation: theft complete</text><path d="M400,218 L400,234 L560,234 L560,218" fill="none" stroke="#8a6d0d" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><text x="480" y="256" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">continuing appropriation</text><text x="480" y="276" font-size="15" font-weight="400" fill="#8a6d0d" text-anchor="middle">(Hale, 1979; Lockley, 1995)</text><rect x="30" y="310" width="413" height="117" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="45" y="337" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">COMPLETED THEFT</text><text x="45" y="368" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">No theft, no robbery (<tspan font-style="italic">Robinson</tspan>). Theft complete on</text><text x="45" y="388" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">appropriation: tugging a bag (<tspan font-style="italic">Corcoran</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Anderton</tspan>,</text><text x="45" y="408" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">1980)</text><rect x="457" y="310" width="413" height="117" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="472" y="337" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FORCE</text><text x="472" y="368" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">An ordinary word for the jury; a slight push can be</text><text x="472" y="388" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">enough (<tspan font-style="italic">Dawson</tspan> <tspan font-style="italic">and</tspan> <tspan font-style="italic">James</tspan>, 1976)</text><rect x="30" y="439" width="413" height="117" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="45" y="466" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ON A PERSON</text><text x="45" y="497" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Through a bag if transmitted (<tspan font-style="italic">Clouden</tspan>, 1987); not</text><text x="45" y="517" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">snatching a cigarette without touching (<tspan font-style="italic">P</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">DPP</tspan>,</text><text x="45" y="537" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">2012)</text><rect x="457" y="439" width="413" height="117" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="472" y="466" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ANY PERSON, IN ORDER TO STEAL</text><text x="472" y="497" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Need not be the owner. Force for another reason,</text><text x="472" y="517" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">then a decision to steal, is not robbery</text>
</svg>