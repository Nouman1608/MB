<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 464" width="900" height="464" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="464" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Is it property? s4</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Money, real or personal property, things in action, intangibles</text>
<rect x="30" y="124" width="411" height="159" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="154" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">✓ PROPERTY</text><text x="48" y="185.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="185.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Money and personal property</text><text x="48" y="212.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="212.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Things</tspan> <tspan font-weight="700" fill="#1e2a44">in</tspan> <tspan font-weight="700" fill="#1e2a44">action</tspan>: a bank balance</text><text x="48" y="239.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="239.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Body</tspan> <tspan font-weight="700" fill="#1e2a44">parts</tspan> with skill applied (<tspan font-style="italic">Kelly</tspan> <tspan font-style="italic">and</tspan></text><text x="63.2" y="260.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Lindsay</tspan>, 1998)</text><rect x="459" y="124" width="411" height="159" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="477" y="154" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">✗ NOT PROPERTY</text><text x="477" y="185.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="492.2" y="185.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Confidential</tspan> <tspan font-weight="700" fill="#1e2a44">information</tspan> (<tspan font-style="italic">Oxford</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Moss</tspan>,</text><text x="492.2" y="206.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">1979: an exam paper read and returned)</text><text x="477" y="233.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="492.2" y="233.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Electricity</tspan>: separate offence, s13 (<tspan font-style="italic">Low</tspan> <tspan font-style="italic">v</tspan></text><text x="492.2" y="254.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Blease</tspan>, 1975)</text><text x="30" y="321" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="start">Only in some cases</text><rect x="30" y="337" width="272" height="95" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="44" y="363" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">LAND, s4(2)</text><text x="44" y="394" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Generally cannot be stolen, with</text><text x="44" y="414" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">exceptions</text><rect x="314" y="337" width="272" height="95" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="328" y="363" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">WILD PLANTS, s4(3)</text><text x="328" y="394" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Not stolen if picked for personal</text><text x="328" y="414" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">use; can be if picked for sale</text><rect x="598" y="337" width="272" height="95" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="612" y="363" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">WILD CREATURES, s4(4)</text><text x="612" y="394" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Only if tamed, kept in captivity or</text><text x="612" y="414" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">reduced into possession</text>
</svg>