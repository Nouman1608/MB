<rect width="900" height="398" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Intention to permanently deprive: s6</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Including treating property “as his own to dispose of regardless of the other’s rights”</text>
<rect x="30" y="124" width="272" height="135" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="44" y="150" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">✗ BORROWING</text><text x="44" y="181" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">R</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Lloyd</tspan> (1985): films copied and</text><text x="44" y="201" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">reels returned. Theft only if</text><text x="44" y="221" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">returned with “goodness, virtue</text><text x="44" y="241" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">and practical value” gone</text><rect x="314" y="124" width="272" height="135" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="328" y="150" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">✓ DISPOSAL</text><text x="328" y="181" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">DPP</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Lavender</tspan> (1994): swapping</text><text x="328" y="201" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">council doors</text><rect x="598" y="124" width="272" height="135" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="612" y="150" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">✓ RANSOM</text><text x="612" y="181" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">R</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Raphael</tspan> (2008): demanding</text><text x="612" y="201" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">payment for a car’s return</text><rect x="30" y="271" width="414" height="95" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="44" y="297" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">✓ MONEY</text><text x="44" y="328" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">R</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Velumyl</tspan> (1989): intending to repay with different</text><text x="44" y="348" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">notes</text><rect x="456" y="271" width="414" height="95" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="470" y="297" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">✗ CONDITIONAL INTENTION</text><text x="470" y="328" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">R</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Easom</tspan> (1971): searched a handbag, took nothing</text>
</svg>