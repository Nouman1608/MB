<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: Mo snatches Nina’s phone</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">He pushes her shoulder as he snatches it, and sells it the next day</text>
<rect x="30" y="124" width="66" height="64" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="63" y="163" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">s3</text><text x="110" y="160.5" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Appropriation</text><rect x="250" y="124" width="540" height="64" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="262" y="160.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Snatching: assuming the owner’s rights</text><circle cx="830" cy="156" r="20" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="830" y="163" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle">✓</text><rect x="30" y="202" width="66" height="64" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="63" y="241" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">s4</text><text x="110" y="238.5" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Property</text><rect x="250" y="202" width="540" height="64" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="262" y="238.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A phone: personal property</text><circle cx="830" cy="234" r="20" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="830" y="241" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle">✓</text><rect x="30" y="280" width="66" height="64" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="63" y="319" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">s5</text><text x="110" y="306" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Belonging to</text><text x="110" y="327" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">another</text><rect x="250" y="280" width="540" height="64" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="262" y="316.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Nina possesses and owns it</text><circle cx="830" cy="312" r="20" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="830" y="319" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle">✓</text><rect x="30" y="358" width="66" height="64" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="63" y="397" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">s2</text><text x="110" y="394.5" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Dishonest</text><rect x="250" y="358" width="540" height="64" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="262" y="394.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">No s2(1) belief; dishonest to ordinary decent people (<tspan font-style="italic">Ivey</tspan>)</text><circle cx="830" cy="390" r="20" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="830" y="397" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle">✓</text><rect x="30" y="436" width="66" height="64" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="63" y="475" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">s6</text><text x="110" y="451.5" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Intention to</text><text x="110" y="472.5" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">deprive</text><text x="110" y="493.5" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">permanently</text><rect x="250" y="436" width="540" height="64" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="262" y="472.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Selling it: treating it as his own to dispose of</text><circle cx="830" cy="468" r="20" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="830" y="475" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle">✓</text><line x1="30" y1="507" x2="870" y2="507" stroke="#8a6d0d" stroke-width="2" stroke-dasharray="8 6"/><rect x="30" y="514" width="66" height="64" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="63" y="553" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">s8</text><text x="110" y="550.5" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Robbery</text><rect x="250" y="514" width="540" height="64" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="262" y="539.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Theft plus a push on Nina, at the time, in order to steal (<tspan font-style="italic">Dawson</tspan> <tspan font-style="italic">and</tspan></text><text x="262" y="560.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">James</tspan>)</text><circle cx="830" cy="546" r="20" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="830" y="553" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle">✓</text>
