<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 556" width="900" height="556" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="556" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Dishonesty: check s2(1) first, then Ivey</text>

<rect x="30" y="100" width="840" height="159" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="132" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">NOT DISHONEST IF HE HONESTLY BELIEVED (need not be reasonable):</text><rect x="46" y="150" width="261.3333333333333" height="93" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="59" y="175" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">s2(1)(a)</text><text x="59" y="206" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Belief in a <tspan font-weight="700" fill="#1e2a44">legal</tspan> <tspan font-weight="700" fill="#1e2a44">right</tspan> to deprive</text><text x="59" y="226" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">(<tspan font-style="italic">Robinson</tspan>, 1977)</text><rect x="319.3333333333333" y="150" width="261.3333333333333" height="93" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="332.3333333333333" y="175" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">s2(1)(b)</text><text x="332.3333333333333" y="206" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Belief the owner <tspan font-weight="700" fill="#1e2a44">would</tspan> <tspan font-weight="700" fill="#1e2a44">consent</tspan></text><text x="332.3333333333333" y="226" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">if they knew</text><rect x="592.6666666666666" y="150" width="261.3333333333333" height="93" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="605.6666666666666" y="175" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">s2(1)(c)</text><text x="605.6666666666666" y="206" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Belief the owner <tspan font-weight="700" fill="#1e2a44">cannot</tspan> <tspan font-weight="700" fill="#1e2a44">be</tspan></text><text x="605.6666666666666" y="226" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">discovered</tspan> by reasonable steps</text><line x1="450" y1="263" x2="450" y2="283" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="462" y="277" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">none applies</text><rect x="30" y="299" width="400" height="141" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="327" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">IVEY STEP 1: SUBJECTIVE</text><text x="46" y="352.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">What did he actually know or believe about</text><text x="46" y="373.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">the facts?</text><text x="46" y="400" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Need not be reasonable; reasonableness is</text><text x="46" y="420" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">evidence</text><line x1="436" y1="369.5" x2="464" y2="369.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="470" y="299" width="400" height="141" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="486" y="327" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">IVEY STEP 2: OBJECTIVE</text><text x="486" y="352.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Dishonest by the standards of ordinary</text><text x="486" y="373.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">decent people?</text><text x="486" y="400" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Whether he realised it does not matter</text><rect x="30" y="460" width="412" height="64" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="236" y="486" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle"><tspan font-style="italic">Ivey</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Genting</tspan> <tspan font-style="italic">Casinos</tspan> (2017), confirmed in <tspan font-style="italic">Barton</tspan></text><text x="236" y="506" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle"><tspan font-style="italic">and</tspan> <tspan font-style="italic">Booth</tspan> (2020); replaced <tspan font-style="italic">Ghosh</tspan> (1982)</text><rect x="458" y="460" width="412" height="64" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="664" y="486" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">s2(2): willingness to pay does not stop it being</text><text x="664" y="506" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">dishonest</text>
</svg>