<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 491" width="900" height="491" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="491" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Appropriation: any assumption of an owner’s rights</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">s3(1) Theft Act 1968</text>
<rect x="30" y="124" width="413" height="117" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="45" y="151" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ANY ONE RIGHT</text><text x="45" y="182" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">R</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Morris</tspan> (1984): switching supermarket price labels</text><rect x="457" y="124" width="413" height="117" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="472" y="151" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">CONSENT IRRELEVANT</text><text x="472" y="182" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Lawrence</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">MPC</tspan> (1972): taxi driver took too much</text><text x="472" y="202" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">from an open wallet. <tspan font-style="italic">R</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Gomez</tspan> (1993): consent</text><text x="472" y="222" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">obtained by deception</text><rect x="30" y="253" width="413" height="97" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="45" y="280" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">EVEN A VALID GIFT</text><text x="45" y="311" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">R</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Hinks</tspan> (2000): large sums from a man of limited</text><text x="45" y="331" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">intelligence</text><rect x="457" y="253" width="413" height="97" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="472" y="280" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">OFFERING TO SELL</text><text x="472" y="311" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">R</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Pitham</tspan> <tspan font-style="italic">and</tspan> <tspan font-style="italic">Hehl</tspan> (1977): offering another’s</text><text x="472" y="331" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">property for sale</text><rect x="30" y="362" width="413" height="97" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="45" y="389" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">LATER ASSUMPTION</text><text x="45" y="420" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Finding a wallet, later deciding to keep it:</text><text x="45" y="440" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">appropriation at that moment</text><rect x="457" y="362" width="413" height="97" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="472" y="389" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">NOT: BONA FIDE PURCHASER, s3(2)</text><text x="472" y="420" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Paid in good faith for goods later found stolen:</text><text x="472" y="440" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">keeping them is not theft</text>
</svg>