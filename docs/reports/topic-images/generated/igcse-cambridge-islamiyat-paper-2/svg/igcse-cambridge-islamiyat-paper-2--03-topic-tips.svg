<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 624" width="900" height="624" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="624" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">One tip for each Paper 2 topic</text>

<rect x="30" y="110" width="840" height="74" rx="14" fill="#1e2a44" stroke="#1e2a44" stroke-width="0"/><text x="450" y="145" font-size="21" font-weight="700" fill="#ffffff" text-anchor="middle">Every topic: move from knowledge to significance</text><text x="450" y="171" font-size="16" font-weight="400" fill="#f2e7b8" text-anchor="middle">why it matters to individual Muslims, the community, or later history</text><rect x="30" y="204" width="120" height="90" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="90" y="259" font-size="28" font-weight="700" fill="#1e2a44" text-anchor="middle">2.1</text><rect x="162" y="204" width="708" height="90" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="184" y="243" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Revise the set passages with the Arabic and English side by side:</text><text x="184" y="267" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">questions can draw on the Arabic text directly.</text><rect x="30" y="306" width="120" height="90" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="90" y="361" font-size="28" font-weight="700" fill="#1e2a44" text-anchor="middle">2.2</text><rect x="162" y="306" width="708" height="90" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="184" y="345" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Keep the Hadiths and the Qur'an distinct, and always address the</text><text x="184" y="369" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">relationship with the Qur'an, ijma' and qiyas.</text><rect x="30" y="408" width="120" height="90" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="90" y="463" font-size="28" font-weight="700" fill="#1e2a44" text-anchor="middle">2.3</text><rect x="162" y="408" width="708" height="90" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="184" y="447" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Only the Caliphs' period of rule after the Prophet's death; their lives</text><text x="184" y="471" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">in his lifetime belong to Paper 1.</text><rect x="30" y="510" width="120" height="90" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="90" y="565" font-size="28" font-weight="700" fill="#1e2a44" text-anchor="middle">2.4</text><rect x="162" y="510" width="708" height="90" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="184" y="549" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">For each Pillar use one structure: what it is, how it is performed, why</text><text x="184" y="573" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">it matters.</text>
</svg>