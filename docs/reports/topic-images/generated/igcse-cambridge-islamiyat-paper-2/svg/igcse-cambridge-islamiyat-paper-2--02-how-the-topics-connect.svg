<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 594" width="900" height="594" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="594" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How the four Paper 2 topics connect</text>

<rect x="30" y="120" width="270" height="150" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="3"/><text x="52" y="164" font-size="26" font-weight="700" fill="#8a6d0d" text-anchor="start">2.1</text><text x="52" y="200" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Major teachings in</text><text x="52" y="224" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">the Hadiths</text><rect x="600" y="120" width="270" height="150" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="3"/><text x="622" y="164" font-size="26" font-weight="700" fill="#8a6d0d" text-anchor="start">2.4</text><text x="622" y="200" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Articles of Faith and</text><text x="622" y="224" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Pillars of Islam</text><rect x="30" y="400" width="270" height="150" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="3"/><text x="52" y="444" font-size="26" font-weight="700" fill="#2e6b62" text-anchor="start">2.2</text><text x="52" y="480" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">History and</text><text x="52" y="504" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">importance of the</text><text x="52" y="528" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Hadiths</text><rect x="600" y="400" width="270" height="150" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="3"/><text x="622" y="444" font-size="26" font-weight="700" fill="#2e6b62" text-anchor="start">2.3</text><text x="622" y="480" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The Rightly Guided</text><text x="622" y="504" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Caliphs</text><path d="M306,160 L594,160" fill="none" stroke="#8a6d0d" stroke-width="4" stroke-linejoin="round" marker-end="url(#ahO)"/><path d="M594,160 L306,160" fill="none" stroke="#8a6d0d" stroke-width="4" stroke-linejoin="round" marker-end="url(#ahO)"/><rect x="316" y="182" width="268" height="88" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="209.95" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">The set passages refer again</text><text x="450" y="231.95" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">and again to the Articles</text><text x="450" y="253.95" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">and Pillars</text><path d="M306,440 L594,440" fill="none" stroke="#2e6b62" stroke-width="4" stroke-linejoin="round" marker-end="url(#ahT)"/><rect x="316" y="460" width="268" height="110" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="498.95" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">The same scholarly tradition</text><text x="450" y="520.95" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">of isnad and early reports</text><text x="450" y="542.95" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">recorded the Caliphs' rule</text><text x="450" y="340" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle" font-style="italic">Revise them as connected, not as four separate units.</text>
</svg>