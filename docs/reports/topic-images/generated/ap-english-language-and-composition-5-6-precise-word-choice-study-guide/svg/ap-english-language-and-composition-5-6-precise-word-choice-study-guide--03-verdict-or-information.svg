<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 374" width="900" height="374" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="374" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A verdict, or information?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Precision affects how the reader sees the writer’s stance</text>
<rect x="30" y="122" width="400" height="170" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="230" y="174.16" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="middle" xml:space="preserve">Verdict</text><text x="230" y="203.86" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">“The policy failed.”</text><text x="230" y="227.62" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve"></text><text x="230" y="251.38000000000002" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">The writer has judged.</text><rect x="470" y="122" width="400" height="170" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="670" y="164.92" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">Information</text><text x="670" y="193.76999999999998" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">“The policy reduced waiting times by a</text><text x="670" y="216.20999999999998" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">minute but raised costs by a tenth.”</text><text x="670" y="238.64999999999998" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve"></text><text x="670" y="261.09" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">The writer trusts the reader to judge.</text><text x="450" y="214" font-size="18" font-weight="700" fill="#4a5568" text-anchor="middle" xml:space="preserve">or</text><text x="450" y="332" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" xml:space="preserve">In argument each can be right in its place; readers should know which they are getting.</text>
</svg>