<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 649" width="900" height="649" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="649" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A modifier does two jobs at once</text>

<rect x="250" y="116" width="180" height="60" rx="30" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3" /><text x="340" y="153" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">so-called</text><rect x="460" y="116" width="180" height="60" rx="30" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" /><text x="550" y="153" font-size="22" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">solution</text><path d="M380,114 C420,86 500,86 530,110" fill="none" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><rect x="30" y="206" width="400" height="90" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="230" y="243.24" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">1 Qualifies or modifies</text><text x="230" y="271.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">describes the thing: which solution, what kind</text><rect x="470" y="206" width="400" height="90" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="670" y="243.24" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">2 Conveys a perspective</text><text x="670" y="271.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">the writer doubts it is a solution at all</text><line x1="320" y1="180" x2="260" y2="202" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="360" y1="180" x2="620" y2="202" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="326" width="840" height="41.8" fill="#dce9e7"/><text x="42" y="350.3" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Phrase</text><text x="322" y="350.3" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Modifies</text><text x="552" y="350.3" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Conveys</text><rect x="30" y="367.8" width="840" height="41.8" fill="#ffffff"/><text x="42" y="392.1" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“a <tspan font-style="italic">modest</tspan> proposal”</text><text x="322" y="392.1" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">the proposal</text><text x="552" y="392.1" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">restraint, reasonableness (or irony)</text><line x1="30" y1="367.8" x2="870" y2="367.8" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="409.6" width="840" height="41.8" fill="#ffffff"/><text x="42" y="433.90000000000003" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“a <tspan font-style="italic">sweeping</tspan> reform”</text><text x="322" y="433.90000000000003" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">the reform</text><text x="552" y="433.90000000000003" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">ambition, perhaps recklessness</text><line x1="30" y1="409.6" x2="870" y2="409.6" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="451.40000000000003" width="840" height="41.8" fill="#ffffff"/><text x="42" y="475.70000000000005" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“<tspan font-style="italic">barely</tspan> adequate”</text><text x="322" y="475.70000000000005" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">the adjective</text><text x="552" y="475.70000000000005" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">disapproval</text><line x1="30" y1="451.40000000000003" x2="870" y2="451.40000000000003" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="493.20000000000005" width="840" height="41.8" fill="#ffffff"/><text x="42" y="517.5" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“<tspan font-style="italic">merely</tspan> a suggestion”</text><text x="322" y="517.5" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">the noun</text><text x="552" y="517.5" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">dismissal</text><line x1="30" y1="493.20000000000005" x2="870" y2="493.20000000000005" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="535" width="840" height="41.8" fill="#ffffff"/><text x="42" y="559.3" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“<tspan font-style="italic">fortunately</tspan>, the vote passed”</text><text x="322" y="559.3" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">the whole sentence</text><text x="552" y="559.3" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">approval of the result</text><line x1="30" y1="535" x2="870" y2="535" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="576.8" width="840" height="41.8" fill="#ffffff"/><text x="42" y="601.0999999999999" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“the <tspan font-style="italic">regrettably</tspan> necessary cuts”</text><text x="322" y="601.0999999999999" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">the adjective</text><text x="552" y="601.0999999999999" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">reluctance and justification</text><line x1="30" y1="576.8" x2="870" y2="576.8" stroke="#c9d6d4" stroke-width="1.5"/><line x1="310" y1="326" x2="310" y2="618.5999999999999" stroke="#c9d6d4" stroke-width="1.5"/><line x1="540" y1="326" x2="540" y2="618.5999999999999" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="326" width="840" height="292.5999999999999" rx="12" fill="none" stroke="#1e2a44" stroke-width="2.5" />
</svg>