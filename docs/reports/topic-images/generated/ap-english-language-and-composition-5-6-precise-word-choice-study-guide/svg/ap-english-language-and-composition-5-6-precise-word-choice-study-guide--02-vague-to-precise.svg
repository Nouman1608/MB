<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 663" width="900" height="663" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="663" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">From vague to precise</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Precise means exact, not fancy</text>
<rect x="30" y="122" width="320" height="54" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="6 5"/><text x="44" y="154.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“The meeting was bad.”</text><line x1="356" y1="149" x2="394" y2="149" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="400" y="122" width="470" height="54" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="414" y="149.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“The meeting ran two hours and ended without a</text><text x="414" y="170.72" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">decision.”</text><rect x="30" y="186" width="320" height="54" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="6 5"/><text x="44" y="218.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“The shop sells many things.”</text><line x1="356" y1="213" x2="394" y2="213" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="400" y="186" width="470" height="54" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="414" y="213.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“The shop sells bicycles, spare parts and secondhand</text><text x="414" y="234.72" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">maps.”</text><rect x="30" y="250" width="320" height="54" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="6 5"/><text x="44" y="282.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“She went quickly to the door.”</text><line x1="356" y1="277" x2="394" y2="277" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="400" y="250" width="470" height="54" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="414" y="282.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“She sprinted to the door.”</text><rect x="30" y="314" width="320" height="54" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="6 5"/><text x="44" y="346.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“The result was very good.”</text><line x1="356" y1="341" x2="394" y2="341" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="400" y="314" width="470" height="54" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="414" y="346.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“The result exceeded the target by a fifth.”</text><rect x="30" y="378" width="320" height="54" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="6 5"/><text x="44" y="410.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“A thing happened.”</text><line x1="356" y1="405" x2="394" y2="405" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="400" y="378" width="470" height="54" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="414" y="410.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“A pipe burst.”</text><text x="450" y="468" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Three habits</text><rect x="30" y="484" width="269.3333333333333" height="148.20000000000002" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="48" y="518" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Replace vague words</text><text x="48" y="545.15" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-style="italic">thing,</tspan> <tspan font-style="italic">stuff,</tspan> <tspan font-style="italic">good,</tspan> <tspan font-style="italic">bad,</tspan> <tspan font-style="italic">nice,</tspan></text><text x="48" y="564.9499999999999" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-style="italic">very,</tspan> <tspan font-style="italic">really,</tspan> <tspan font-style="italic">a</tspan> <tspan font-style="italic">lot</tspan> are signals to</text><text x="48" y="584.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">stop</text><rect x="315.3333333333333" y="484" width="269.3333333333333" height="148.20000000000002" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="333.3333333333333" y="518" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Strong verb, not verb</text><text x="333.3333333333333" y="544.4" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">+ adverb</text><text x="333.3333333333333" y="571.55" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“whispered” beats “said</text><text x="333.3333333333333" y="591.3499999999999" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">quietly”; “dashed” beats “ran</text><text x="333.3333333333333" y="611.15" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">quickly”</text><rect x="600.6666666666666" y="484" width="269.3333333333333" height="148.20000000000002" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="618.6666666666666" y="518" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Concrete nouns and</text><text x="618.6666666666666" y="544.4" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">numbers</text><text x="618.6666666666666" y="571.55" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">when you can</text>
</svg>