<rect width="900" height="562" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Sceptical modifiers, exact details</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Worked example 2: the council’s harbour brochure</text>
<rect x="30" y="128" width="130.27798" height="35" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2" /><text x="95.13899" y="151.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">The council’s</text><rect x="166.27798" y="128" width="100" height="35" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2" /><text x="216.27798" y="151.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">sleek</text><text x="216.27798" y="184.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">style over</text><text x="216.27798" y="202.8" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">substance</text><rect x="272.27798" y="128" width="230.85542" height="35" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2" /><text x="387.70569" y="151.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">new brochure promises a</text><rect x="509.13340000000005" y="128" width="100" height="35" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2" /><text x="559.1334" y="151.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">bold</text><text x="559.1334" y="184.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">its own</text><text x="559.1334" y="202.8" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">claim, with</text><text x="559.1334" y="221.1" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">irony</text><rect x="615.1334" y="128" width="218.35328" height="35" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2" /><text x="724.3100400000001" y="151.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">vision for the harbour. It</text><rect x="30" y="249.9" width="100" height="35" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2" /><text x="80" y="273.34999999999997" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">blandly</text><text x="80" y="306.4" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">uninformative</text><rect x="136" y="249.9" width="111.19208" height="35" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2" /><text x="191.59604000000002" y="273.34999999999997" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">announces</text><rect x="253.19208" y="249.9" width="121.78563" height="35" rx="8" fill="#dce9e7" stroke="#1e2a44" stroke-width="2" /><text x="314.084895" y="273.34999999999997" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">40 new jobs</text><text x="314.084895" y="306.4" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">exact detail</text><rect x="380.97771" y="249.9" width="369.81478000000004" height="35" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2" /><text x="565.8851" y="273.34999999999997" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">without saying where they will come from.</text><rect x="756.79249" y="249.9" width="100" height="35" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2" /><text x="806.79249" y="273.34999999999997" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Quietly,</text><text x="806.79249" y="306.4" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">concealment</text><rect x="30" y="335.2" width="40.85441" height="35" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2" /><text x="50.427205" y="358.65" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">on</text><rect x="76.85441" y="335.2" width="106.60445999999999" height="35" rx="8" fill="#dce9e7" stroke="#1e2a44" stroke-width="2" /><text x="130.15663999999998" y="358.65" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">page nine,</text><text x="130.15663999999998" y="391.7" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">exact detail</text><rect x="189.45887" y="335.2" width="126.54835" height="35" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2" /><text x="252.733045" y="358.65" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">it admits that</text><rect x="322.00721999999996" y="335.2" width="215.37658" height="35" rx="8" fill="#dce9e7" stroke="#1e2a44" stroke-width="2" /><text x="429.69550999999996" y="358.65" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">the fishermen’s slipway</text><text x="429.69550999999996" y="391.7" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">exact detail</text><rect x="543.3838" y="335.2" width="101.19386999999999" height="35" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2" /><text x="593.980735" y="358.65" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">will close.</text><rect x="30" y="426.5" width="408" height="104.64000000000001" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="48" y="460.5" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Modifiers</text><text x="48" y="488.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">tell the reader how to take the brochure: the</text><text x="48" y="509.62" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">writer distrusts it</text><rect x="462" y="426.5" width="408" height="104.64000000000001" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="480" y="460.5" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Exact details</text><text x="480" y="488.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">let the reader check the claims and give the</text><text x="480" y="509.62" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">scepticism a basis</text>
</svg>