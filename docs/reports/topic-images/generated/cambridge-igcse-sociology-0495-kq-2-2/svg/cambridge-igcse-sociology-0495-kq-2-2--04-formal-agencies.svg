fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="720" y="298.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Many offences never reported</text><line x1="214" y1="294" x2="244" y2="294" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="532" y1="294" x2="568" y2="294" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="5 4"/><line x1="120" y1="338" x2="120" y2="358" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><rect x="30" y="360" width="180" height="84" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="120" y="406.7" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Courts</text><rect x="250" y="360" width="280" height="84" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="390" y="406.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Trials and sentencing</text><rect x="570" y="360" width="300" height="84" rx="14" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="720" y="395.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Costly, slow; outcomes may vary</text><text x="720" y="416.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">by group</text><line x1="214" y1="402" x2="244" y2="402" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="532" y1="402" x2="568" y2="402" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="5 4"/><line x1="120" y1="446" x2="120" y2="466" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><rect x="30" y="468" width="180" height="84" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="120" y="514.7" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Penal system</text><rect x="250" y="468" width="280" height="84" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="390" y="503.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Imprisonment, probation,</text><text x="390" y="525.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">community sentences</text><rect x="570" y="468" width="300" height="84" rx="14" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="720" y="503.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Reoffending after release is</text><text x="720" y="524.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">common</text><line x1="214" y1="510" x2="244" y2="510" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="532" y1="510" x2="568" y2="510" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="5 4"/><rect x="30" y="582" width="840" height="112" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="50" y="615" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">IN EMERGENCIES</text><text x="50" y="641.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Armed forces: coercion</text><text x="50" y="669.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Can restore order quickly, but force against citizens risks loss of legitimacy.</text>
