6d0d" text-anchor="start">Modern versions</text><text x="490" y="442.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">CCTV, facial recognition, phone and</text><text x="490" y="463.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">internet monitoring, electronic tags.</text><rect x="30" y="548" width="840" height="58" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="581.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Critics raise concerns about privacy and about some groups being watched more than others.</text>
