<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 664" width="900" height="664" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="664" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four kinds of sanction</text>

<text x="385" y="136" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="middle">Positive sanctions</text><text x="385" y="160" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">reward conformity</text><text x="715" y="136" font-size="21" font-weight="700" fill="#b5602e" text-anchor="middle">Negative sanctions</text><text x="715" y="160" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">punish deviance</text><rect x="30" y="180" width="180" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="120" y="236.8" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Formal</text><text x="120" y="266" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">written laws,</text><text x="120" y="286" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">enforced by state</text><text x="120" y="306" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">agencies</text><rect x="230" y="180" width="310" height="170" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="250" y="231.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="266.15" y="231.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Reduced sentences for good</text><text x="266.15" y="253.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">behaviour</text><text x="250" y="280.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="266.15" y="280.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Honours and awards</text><text x="250" y="307.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="266.15" y="307.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Tax relief</text><rect x="560" y="180" width="310" height="170" rx="14" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="580" y="242.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="596.15" y="242.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Fines</text><text x="580" y="269.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="596.15" y="269.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Arrest</text><text x="580" y="296.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="596.15" y="296.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Prison</text><rect x="30" y="366" width="180" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="120" y="422.8" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Informal</text><text x="120" y="452" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">unwritten norms,</text><text x="120" y="472" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">enforced by</text><text x="120" y="492" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">everyday groups</text><rect x="230" y="366" width="310" height="170" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="250" y="428.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="266.15" y="428.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Praise, a smile</text><text x="250" y="455.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="266.15" y="455.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Social media “likes”</text><text x="250" y="482.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="266.15" y="482.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Pay rise, promotion</text><rect x="560" y="366" width="310" height="170" rx="14" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="580" y="428.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="596.15" y="428.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Gossip, a disapproving look</text><text x="580" y="455.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="596.15" y="455.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Exclusion, ostracism</text><text x="580" y="482.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="596.15" y="482.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Detention</text><rect x="30" y="556" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="589.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The difference is who enforces and whether the rules are written, not how harsh they are:</text><text x="50" y="611.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">ostracism can hurt more than a fine.</text>
</svg>