<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 670" width="900" height="670" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="670" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four kinds of resistance</text>

<rect x="30" y="104" width="410" height="134" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="137" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">PROTEST GROUPS</text><text x="50" y="164" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Suffragettes</text><text x="50" y="192.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">WSPU, founded 1903 by Emmeline Pankhurst:</text><text x="50" y="213.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">direct action for votes for women</text><rect x="460" y="104" width="410" height="134" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="480" y="137" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">PROTEST GROUPS</text><text x="480" y="164" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Extinction Rebellion</text><text x="480" y="192.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Founded in the UK in 2018: civil</text><text x="480" y="213.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">disobedience for climate action</text><rect x="30" y="256" width="410" height="155" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="289" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">YOUTH SUB-CULTURES</text><text x="50" y="316" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Mods, rockers, punks</text><text x="50" y="344.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Cohen (1972): media exaggeration of mods and</text><text x="50" y="365.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">rockers caused public fear and tougher</text><text x="50" y="386.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">policing</text><rect x="460" y="256" width="410" height="155" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="480" y="289" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ONLINE SUB-CULTURES</text><text x="480" y="316" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Gamers, fandoms, hackers</text><text x="480" y="344.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Their own language, rules and status systems</text><rect x="30" y="429" width="840" height="113" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="462" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">RELIGIOUS SUB-CULTURES</text><text x="50" y="489" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">The Amish, North America</text><text x="50" y="517.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Live by their own rules, limit modern technology and keep separate from wider society</text><rect x="30" y="560" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="593.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Which groups are labelled deviant depends on who has power: the suffragettes went from</text><text x="50" y="615.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">protesters to heroes.</text>
</svg>