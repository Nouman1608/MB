<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 652" width="900" height="652" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="652" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Formal or informal: which works better?</text>

<line x1="215" y1="143" x2="685" y2="165" stroke="#1e2a44" stroke-width="7" stroke-linecap="round"/><path d="M450,154 L420,246 L480,246 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><circle cx="450" cy="154" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><line x1="215" y1="143" x2="160" y2="198" stroke="#1e2a44" stroke-width="2.5"/><line x1="215" y1="143" x2="270" y2="198" stroke="#1e2a44" stroke-width="2.5"/><path d="M140,198 L290,198 Q275,225 215,225 Q155,225 140,198 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><line x1="685" y1="165" x2="630" y2="220" stroke="#1e2a44" stroke-width="2.5"/><line x1="685" y1="165" x2="740" y2="220" stroke="#1e2a44" stroke-width="2.5"/><path d="M610,220 L760,220 Q745,247 685,247 Q625,247 610,220 Z" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="215" y="247" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">FORMAL</text><text x="685" y="269" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">INFORMAL</text><rect x="30" y="282" width="405" height="210" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="318" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">For formal agencies</text><text x="50" y="347.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="347.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Coercion and imprisonment</text><text x="50" y="374.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="374.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Laws apply to everyone, even people</text><text x="66.15" y="396.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">with no ties</text><text x="50" y="423.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="423.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Digital surveillance encourages</text><text x="66.15" y="445.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">self-discipline</text><rect x="465" y="282" width="405" height="210" rx="14" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="485" y="318" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="start">For informal agencies</text><text x="485" y="347.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="501.15" y="347.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Most people conform without contact</text><text x="501.15" y="369.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">with police</text><text x="485" y="396.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="501.15" y="396.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Ostracism and dismissal are felt</text><text x="501.15" y="418.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">constantly</text><text x="485" y="445.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="501.15" y="445.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Much crime unreported; reoffending</text><text x="501.15" y="467.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">common</text><rect x="30" y="510" width="840" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="546" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Judgement</text><text x="50" y="575.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Informal agencies are more effective for everyday conformity; formal agencies are a</text><text x="50" y="597.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">necessary backstop for serious deviance and where informal ties are weak.</text>
</svg>