<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 414" width="900" height="414" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="414" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">When do sanctions produce conformity?</text>

<rect x="30" y="104" width="410" height="220" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="140" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Sanctions work best when…</text><text x="50" y="169.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="169.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">People value the reward or fear the</text><text x="66.15" y="191.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">punishment</text><text x="50" y="223.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="223.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">The rule is seen as legitimate: fair and</text><text x="66.15" y="245.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">rightful</text><text x="50" y="277.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="277.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Breaking the rule is likely to be</text><text x="66.15" y="299.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">noticed</text><rect x="460" y="104" width="410" height="220" rx="14" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="480" y="140" font-size="20" font-weight="700" fill="#b5602e" text-anchor="start">Sanctions work poorly when…</text><text x="480" y="169.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="496.15" y="169.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">People expect not to be caught</text><text x="480" y="201.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="496.15" y="201.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">A group rewards the behaviour society</text><text x="496.15" y="223.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">punishes</text><text x="480" y="255.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="496.15" y="255.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">People have little left to lose</text><rect x="103.52500000000003" y="342" width="131.75" height="42" rx="21" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="169.40000000000003" y="369.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">legitimacy</text><rect x="247.27500000000003" y="342" width="258.82499999999993" height="42" rx="21" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="376.6875" y="369.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">likelihood of detection</text><rect x="518.0999999999999" y="342" width="278.375" height="42" rx="21" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="657.2874999999999" y="369.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">what people value or fear</text>
</svg>