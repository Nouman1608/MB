<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 517" width="900" height="517" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="517" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Whose interests does social control serve?</text>

<rect x="30" y="104" width="269.3333333333333" height="236" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="137" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CONSENSUS</text><text x="50" y="164.8" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="start">Functionalism</text><text x="50" y="194.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="194.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Protects shared values</text><text x="50" y="223.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="223.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Durkheim: punishing crime</text><text x="65.2" y="244.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">reaffirms boundaries and</text><text x="65.2" y="265.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">unites others</text><text x="50" y="294.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="294.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Neutral; in everyone’s</text><text x="65.2" y="315.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">interest</text><rect x="315.3333333333333" y="104" width="269.3333333333333" height="236" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="335.3333333333333" y="137" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">CONFLICT</text><text x="335.3333333333333" y="164.8" font-size="21" font-weight="700" fill="#8a6d0d" text-anchor="start">Marxism</text><text x="335.3333333333333" y="194.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="350.5333333333333" y="194.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Serves the ruling class</text><text x="335.3333333333333" y="223.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="350.5333333333333" y="223.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Laws protect private</text><text x="350.5333333333333" y="244.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">property</text><text x="335.3333333333333" y="273.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="350.5333333333333" y="273.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Althusser: repressive</text><text x="350.5333333333333" y="294.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">state apparatus controls</text><text x="350.5333333333333" y="315.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">by force</text><rect x="600.6666666666666" y="104" width="269.3333333333333" height="236" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="620.6666666666666" y="137" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">CONFLICT</text><text x="620.6666666666666" y="164.8" font-size="21" font-weight="700" fill="#b5602e" text-anchor="start">Feminism</text><text x="620.6666666666666" y="194.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="635.8666666666667" y="194.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Maintains patriarchy</text><text x="620.6666666666666" y="223.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="635.8666666666667" y="223.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Heidensohn (1985): women</text><text x="635.8666666666667" y="244.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">controlled at home, in</text><text x="635.8666666666667" y="265.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">public and at work</text><text x="620.6666666666666" y="294.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="635.8666666666667" y="294.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Women judged harshly for</text><text x="635.8666666666667" y="315.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">breaking gender norms</text><rect x="30" y="358" width="269.3333333333333" height="129" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="391" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">BUT</text><text x="50" y="420.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Underplays the unequal</text><text x="50" y="441.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">application of control</text><rect x="315.3333333333333" y="358" width="269.3333333333333" height="129" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="335.3333333333333" y="391" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">BUT</text><text x="335.3333333333333" y="420.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Many laws, on murder or</text><text x="335.3333333333333" y="441.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">road safety, protect</text><text x="335.3333333333333" y="462.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">everyone</text><rect x="600.6666666666666" y="358" width="269.3333333333333" height="129" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="620.6666666666666" y="391" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">BUT</text><text x="620.6666666666666" y="420.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Women’s lives and freedoms</text><text x="620.6666666666666" y="441.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">have changed in many</text><text x="620.6666666666666" y="462.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">societies</text>
</svg>