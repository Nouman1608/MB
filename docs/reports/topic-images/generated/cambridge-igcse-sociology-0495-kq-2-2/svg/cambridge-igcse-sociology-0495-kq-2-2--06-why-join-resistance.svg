fill="#4a5568" text-anchor="start">or work</text></g><g transform="translate(0,21)"><rect x="600" y="104" width="270" height="79" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="616" y="134.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Excitement</text><text x="616" y="162.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">escape from routine</text><rect x="600" y="197" width="270" height="79" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="616" y="227.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Friends or family</text><text x="616" y="255.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">already involved</text><rect x="600" y="290" width="270" height="79" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="616" y="320.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Ignored</text><text x="616" y="348.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">formal politics ignores them</text></g><rect x="30" y="429" width="410" height="131" rx="14" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="465" font-size="20" font-weight="700" fill="#b5602e" text-anchor="start">Deviant</text><text x="50" y="493.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Breaks society’s norms and attracts negative</text><text x="50" y="514.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">sanctions</text><rect x="460" y="429" width="410" height="131" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="480" y="465" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Non-conformist</text><text x="480" y="493.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Rejects mainstream expectations without</text><text x="480" y="514.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">necessarily breaking rules, e.g. lifestyle,</text><text x="480" y="535.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">dress, diet</text>
