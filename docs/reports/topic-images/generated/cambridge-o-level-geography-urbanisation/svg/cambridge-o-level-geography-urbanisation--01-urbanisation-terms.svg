<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="640" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Urbanisation is not the same as urban growth</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Schematic bars, not data</text>
<rect x="30" y="110" width="410" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="55" y="146" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Urban growth only</text><text x="55" y="170" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">the city gets bigger, the share does not</text><rect x="120" y="205" width="70" height="44" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2"/><rect x="190" y="205" width="130" height="44" fill="#a9c48f" stroke="#1e2a44" stroke-width="2"/><text x="108" y="234" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">Before</text><rect x="120" y="285" width="101.5" height="44" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2"/><rect x="221.5" y="285" width="188.5" height="44" fill="#a9c48f" stroke="#1e2a44" stroke-width="2"/><text x="108" y="314" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">After</text><text x="120" y="360" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Both the city and the countryside grew</text><text x="120" y="382" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">at the same rate: no urbanisation.</text><rect x="460" y="110" width="410" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="485" y="146" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Urbanisation</text><text x="485" y="170" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">the share living in towns and cities rises</text><rect x="550" y="205" width="84" height="44" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2"/><rect x="634" y="205" width="156" height="44" fill="#a9c48f" stroke="#1e2a44" stroke-width="2"/><text x="538" y="234" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">Before</text><rect x="550" y="285" width="144" height="44" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2"/><rect x="694" y="285" width="96" height="44" fill="#a9c48f" stroke="#1e2a44" stroke-width="2"/><text x="538" y="314" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">After</text><text x="550" y="360" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Same total; a larger proportion</text><text x="550" y="382" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">now urban.</text><rect x="300" y="470" width="30" height="20" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2"/><text x="340" y="486" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">urban</text><rect x="430" y="470" width="30" height="20" fill="#a9c48f" stroke="#1e2a44" stroke-width="2"/><text x="470" y="486" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">rural</text><rect x="30" y="520" width="840" height="100" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="55" y="556" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="start">Rural depopulation: fewer people in the countryside, usually through out-migration.</text><text x="55" y="588" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Since around 2007 more than half the world’s people have lived in urban areas (UN estimate).</text>
</svg>