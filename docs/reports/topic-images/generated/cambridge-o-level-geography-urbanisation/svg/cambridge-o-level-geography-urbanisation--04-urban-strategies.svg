<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 745" width="900" height="745" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="745" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Strategies: tackle causes or manage effects?</text>

<rect x="30" y="115" width="270" height="520" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="150" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Reduce the causes</text><rect x="48" y="175" width="234" height="220" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="64" y="203" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Rural development</text><text x="64" y="230" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Irrigation, rural</text><text x="64" y="250" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">electrification, clinics</text><text x="64" y="270" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">and schools reduce push</text><text x="64" y="290" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">factors.</text><text x="64" y="330" font-size="15" font-weight="600" fill="#b5602e" text-anchor="start">Limit: slow, needs</text><text x="64" y="349" font-size="15" font-weight="600" fill="#b5602e" text-anchor="start">sustained funding</text><text x="165" y="440" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">tackles why people</text><text x="165" y="460" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">leave the countryside</text><rect x="320" y="115" width="550" height="520" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="338" y="150" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Manage the effects in the city</text><rect x="338" y="172" width="250" height="136" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="352" y="200" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="start">Self-help schemes</text><text x="352" y="226" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">materials, tools, loans</text><text x="352" y="276" font-size="15" font-weight="600" fill="#b5602e" text-anchor="start">Limit: quality varies</text><rect x="600" y="172" width="250" height="136" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="614" y="200" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="start">Site-and-service</text><text x="614" y="226" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">plots with water, sewers,</text><text x="614" y="244" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">roads</text><text x="614" y="276" font-size="15" font-weight="600" fill="#b5602e" text-anchor="start">Limit: far from jobs; may</text><text x="614" y="293" font-size="15" font-weight="600" fill="#b5602e" text-anchor="start">exclude poorest</text><rect x="338" y="322" width="250" height="136" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="352" y="350" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="start">In-situ upgrading</text><text x="352" y="376" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">e.g. Favela-Bairro, Rio</text><text x="352" y="394" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">(1990s)</text><text x="352" y="426" font-size="15" font-weight="600" fill="#b5602e" text-anchor="start">Limit: expensive; rents may</text><text x="352" y="443" font-size="15" font-weight="600" fill="#b5602e" text-anchor="start">rise</text><rect x="600" y="322" width="250" height="136" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="614" y="350" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="start">Community sanitation</text><text x="614" y="376" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Orangi Pilot Project,</text><text x="614" y="394" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Karachi (1980)</text><text x="614" y="426" font-size="15" font-weight="600" fill="#b5602e" text-anchor="start">Limit: needs strong</text><text x="614" y="443" font-size="15" font-weight="600" fill="#b5602e" text-anchor="start">organisation</text><rect x="338" y="472" width="250" height="136" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="352" y="500" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="start">Mass transit</text><text x="352" y="526" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">e.g. Lagos BRT (2008)</text><text x="352" y="576" font-size="15" font-weight="600" fill="#b5602e" text-anchor="start">Limit: costly; misses some</text><text x="352" y="593" font-size="15" font-weight="600" fill="#b5602e" text-anchor="start">districts</text><rect x="600" y="472" width="250" height="136" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="614" y="500" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="start">New towns</text><text x="614" y="526" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">take pressure off the city</text><text x="614" y="576" font-size="15" font-weight="600" fill="#b5602e" text-anchor="start">Limit: jobs may not follow</text><rect x="30" y="655" width="840" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="697" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Demolition usually moves the problem elsewhere rather than solving it.</text>
</svg>