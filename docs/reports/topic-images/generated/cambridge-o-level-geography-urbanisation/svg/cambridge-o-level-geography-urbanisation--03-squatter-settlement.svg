" fill="#1e2a44" text-anchor="middle">4</text><rect x="495" y="390.75" width="336" height="20.25" rx="5" fill="#ffffff" opacity="0.92"/><text x="825" y="405" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="end">beside railway, stream, rubbish dump</text><circle cx="80" cy="500" r="13" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="80" y="505.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><rect x="94" y="490.75" width="372" height="20.25" rx="5" fill="#ffffff" opacity="0.92"/><text x="100" y="505" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">very high density, narrow unpaved alleys</text><text x="450" y="570" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start"></text><rect x="30" y="568" width="410" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="596.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Insecure tenure</text><text x="44" y="619.7" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">residents do not own the land</text><rect x="460" y="568" width="410" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="474" y="596.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Few services</text><text x="474" y="619.7" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">little piped water, sanitation, power, rubbish</text><text x="474" y="639.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">collection</text><rect x="30" y="664" width="410" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="692.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Informal economy</text><text x="44" y="715.7" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">workshops, small shops, recycling</text><rect x="460" y="664" width="410" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="474" y="692.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Local names</text><text x="474" y="715.7" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">favelas (Brazil), katchi abadis (Pakistan),</text><text x="474" y="735.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">bustees (India)</text>
