<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 765" width="900" height="765" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="765" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why cities grow so fast</text>

<rect x="300" y="115" width="300" height="60" rx="14" fill="#1e2a44" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="152" font-size="21" font-weight="700" fill="#ffffff" text-anchor="middle">Rapid urban growth</text><rect x="30" y="205" width="410" height="120" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="239.15" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">1  Rural–urban migration</text><text x="48" y="263.95" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">People move from the countryside to the</text><text x="48" y="285.07" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">city.</text><rect x="460" y="205" width="410" height="120" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="478" y="239.15" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">2  Natural increase in the city</text><text x="478" y="263.95" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Migrants are mostly young adults: high birth</text><text x="478" y="285.07" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">rates, low death rates. Often forgotten.</text><line x1="235" y1="201" x2="360" y2="180" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><line x1="665" y1="201" x2="540" y2="180" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><text x="255" y="368" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">PUSH (rural areas)</text><text x="675" y="368" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">PULL (cities)</text><rect x="30" y="382" width="100" height="72" rx="10" fill="#1e2a44" stroke="#1e2a44" stroke-width="2"/><text x="80" y="424" font-size="15.5" font-weight="700" fill="#ffffff" text-anchor="middle">Physical</text><rect x="140" y="382" width="330" height="72" rx="10" fill="#f6e6dc" stroke="#b5602e" stroke-width="2"/><text x="156" y="412" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">drought, desertification, soil</text><text x="156" y="431" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">erosion, floods, crop failure</text><rect x="480" y="382" width="390" height="72" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="496" y="412" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">less risk of harvest failure; reliable water</text><text x="496" y="431" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">in some districts</text><rect x="30" y="466" width="100" height="72" rx="10" fill="#1e2a44" stroke="#1e2a44" stroke-width="2"/><text x="80" y="508" font-size="15.5" font-weight="700" fill="#ffffff" text-anchor="middle">Economic</text><rect x="140" y="466" width="330" height="72" rx="10" fill="#f6e6dc" stroke="#b5602e" stroke-width="2"/><text x="156" y="496" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">low, uncertain farm incomes;</text><text x="156" y="515" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">mechanisation; tiny plots; debt</text><rect x="480" y="466" width="390" height="72" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="496" y="496" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">jobs in factories, construction, services;</text><text x="496" y="515" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">higher wages</text><rect x="30" y="550" width="100" height="72" rx="10" fill="#1e2a44" stroke="#1e2a44" stroke-width="2"/><text x="80" y="592" font-size="15.5" font-weight="700" fill="#ffffff" text-anchor="middle">Social</text><rect x="140" y="550" width="330" height="72" rx="10" fill="#f6e6dc" stroke="#b5602e" stroke-width="2"/><text x="156" y="580" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">few schools or clinics; no</text><text x="156" y="599" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">electricity; conflict; isolation</text><rect x="480" y="550" width="390" height="72" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="496" y="580" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">education, health care; relatives there; hope</text><text x="496" y="599" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">of a better life</text><rect x="30" y="642" width="840" height="104" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="55" y="676" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Chain migration</text><rect x="260" y="700" width="27" height="21.6" fill="#ffffff" stroke="#1e2a44" stroke-width="2.2"/><path d="M257.3,700 L273.5,688.3 L289.7,700 Z" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><text x="275" y="728" font-size="14" font-weight="400" fill="#4a5568" text-anchor="middle">village</text><rect x="640" y="672" width="60" height="40" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2"/><text x="670" y="728" font-size="14" font-weight="400" fill="#4a5568" text-anchor="middle">city district</text><line x1="300" y1="682" x2="630" y2="682" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="465" y="674" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">migrants</text><line x1="630" y1="704" x2="300" y2="704" stroke="#8a6d0d" stroke-width="3" marker-end="url(#ahO)" stroke-dasharray="8 5"/><text x="465" y="724" font-size="14" font-weight="700" fill="#8a6d0d" text-anchor="middle">news, money, help with housing and work</text><text x="845" y="690" font-size="14.5" font-weight="600" fill="#1e2a44" text-anchor="end">more follow</text><text x="845" y="710" font-size="14.5" font-weight="600" fill="#1e2a44" text-anchor="end">from the same</text><text x="845" y="730" font-size="14.5" font-weight="600" fill="#1e2a44" text-anchor="end">village</text>
</svg>