<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" width="900" height="680" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="680" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Types of marriage</text>

<text x="450" y="124" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle">How is the partner chosen?</text><rect x="30" y="150" width="268" height="152" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="186" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Arranged</text><text x="50" y="214.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Families select or</text><text x="50" y="235.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">introduce partners; the</text><text x="50" y="256.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">couple consents.</text><rect x="316" y="150" width="268" height="152" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="336" y="186" font-size="20" font-weight="700" fill="#b5602e" text-anchor="start">Not forced</text><text x="336" y="214.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">In a forced marriage one or</text><text x="336" y="235.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">both do not consent; a</text><text x="336" y="256.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">crime in many countries.</text><rect x="602" y="150" width="268" height="152" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="622" y="186" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Love</text><text x="622" y="214.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Partners choose each other.</text><text x="622" y="235.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Fletcher: higher</text><text x="622" y="256.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">expectations make people</text><text x="622" y="277.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">readier to leave.</text><text x="450" y="340" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="middle">What is the relationship like?</text><rect x="30" y="366" width="840" height="110" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="402" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Empty shell</text><text x="50" y="430.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Together in name only, for children, money, religion or reputation. Divorce statistics miss</text><text x="50" y="451.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">these, so marriage may look more stable than it is.</text><text x="450" y="514" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">How many partners?</text><rect x="30" y="540" width="397" height="110" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="576" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Monogamy</text><text x="50" y="604.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">One partner at a time.</text><line x1="433" y1="595" x2="467" y2="595" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="473" y="540" width="397" height="110" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="493" y="576" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Serial monogamy</text><text x="493" y="604.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A sequence of marriages: one route into the</text><text x="493" y="625.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">reconstituted family.</text>
</svg>