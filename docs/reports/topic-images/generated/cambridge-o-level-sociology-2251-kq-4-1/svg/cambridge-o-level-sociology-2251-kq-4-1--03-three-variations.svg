<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 445" width="900" height="445" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="445" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three sources of family diversity</text>

<rect x="30" y="104" width="269.3333333333333" height="311" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="137" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CROSS-CULTURAL</text><text x="50" y="163.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Is the nuclear</text><text x="50" y="188.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">family universal?</text><text x="50" y="216.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="216.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Gough: the Nayar of</text><text x="65.2" y="237.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">southern India</text><text x="50" y="264.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="264.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Spiro (1958): the Israeli</text><text x="65.2" y="285.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">kibbutz, children raised</text><text x="65.2" y="306.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">in communal houses</text><text x="50" y="333.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="333.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Other arrangements can</text><text x="65.2" y="354.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">carry out Murdock’s</text><text x="65.2" y="375.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">functions</text><rect x="315.3333333333333" y="104" width="269.3333333333333" height="311" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="335.3333333333333" y="137" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SOCIAL CLASS</text><text x="335.3333333333333" y="163.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Close kin or kin at</text><text x="335.3333333333333" y="188.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">a distance</text><text x="335.3333333333333" y="216.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="350.5333333333333" y="216.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Young and Willmott</text><text x="350.5333333333333" y="237.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(1957): Bethnal Green</text><text x="350.5333333333333" y="258.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">daughters lived near</text><text x="350.5333333333333" y="279.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">mothers and saw them</text><text x="350.5333333333333" y="300.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">daily</text><text x="335.3333333333333" y="327.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="350.5333333333333" y="327.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Mobile middle class:</text><text x="350.5333333333333" y="348.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">modified extended family,</text><text x="350.5333333333333" y="369.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">in touch by phone,</text><text x="350.5333333333333" y="390.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">visits, money</text><rect x="600.6666666666666" y="104" width="269.3333333333333" height="311" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="620.6666666666666" y="137" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">ETHNICITY</text><text x="620.6666666666666" y="163.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Traditions and</text><text x="620.6666666666666" y="188.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">adaptation</text><text x="620.6666666666666" y="216.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="635.8666666666667" y="216.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">South Asian joint family:</text><text x="635.8666666666667" y="237.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">kin support in a new</text><text x="635.8666666666667" y="258.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">country</text><text x="620.6666666666666" y="285.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="635.8666666666667" y="285.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Over generations some</text><text x="635.8666666666667" y="306.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">families adapt; ethnicity</text><text x="635.8666666666667" y="327.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">interacts with class and</text><text x="635.8666666666667" y="348.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">time since migration</text>
</svg>