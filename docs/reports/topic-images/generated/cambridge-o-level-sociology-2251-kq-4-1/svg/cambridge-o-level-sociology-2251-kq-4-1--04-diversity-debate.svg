<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 547" width="900" height="547" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="547" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Is family diversity a problem or a choice?</text>

<rect x="30" y="104" width="408" height="283" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="140.8" font-size="21" font-weight="700" fill="#b5602e" text-anchor="start">New Right: a problem</text><text x="50" y="171.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="66.15" y="171.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The married two-parent nuclear family is</text><text x="66.15" y="193.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">best for raising children</text><text x="50" y="220.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="66.15" y="220.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Murray: benefits let women raise</text><text x="66.15" y="242.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">children without a male breadwinner</text><text x="50" y="269.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="66.15" y="269.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Lone parenthood linked to boys lacking a</text><text x="66.15" y="291.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">male role model</text><text x="50" y="318.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="66.15" y="318.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Dysfunctional family: fails to socialise</text><text x="66.15" y="340.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">children into conformity and</text><text x="66.15" y="362.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">self-reliance</text><rect x="462" y="104" width="408" height="283" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="482" y="140.8" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="start">Postmodernists: a choice</text><text x="482" y="171.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="498.15" y="171.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">No single “normal” family</text><text x="482" y="198.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="498.15" y="198.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">People build relationships that suit</text><text x="498.15" y="220.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">them</text><text x="482" y="247.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="498.15" y="247.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Stacey: the divorce-extended family,</text><text x="498.15" y="269.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">e.g. staying close to a former</text><text x="498.15" y="291.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">mother-in-law</text><rect x="30" y="405" width="840" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="441" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">How much diversity?</text><text x="50" y="470.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Census snapshots show many single-person and lone-parent households, but Chester: most</text><text x="50" y="492.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">people still pass through a nuclear family at some stage. Both can be true.</text>
</svg>