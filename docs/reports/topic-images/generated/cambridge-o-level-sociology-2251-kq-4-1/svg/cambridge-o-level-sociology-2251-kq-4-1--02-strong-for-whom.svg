<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="900" height="550" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="550" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Strong for whom? Judging family structures</text>

<rect x="30" y="104" width="150" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="42" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Structure</text><rect x="180" y="104" width="170" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="192" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Children</text><rect x="350" y="104" width="170" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="362" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Women</text><rect x="520" y="104" width="165" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="532" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Older relatives</text><rect x="685" y="104" width="185" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="697" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Society</text><rect x="30" y="150" width="150" height="82" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="174.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Nuclear</text><rect x="180" y="150" width="170" height="82" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="192" y="174.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Close attention</text><text x="192" y="194.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">from two parents</text><rect x="350" y="150" width="170" height="82" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="362" y="174.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">May carry most</text><text x="362" y="194.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">domestic work</text><rect x="520" y="150" width="165" height="82" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="532" y="174.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Can be isolated</text><rect x="685" y="150" width="185" height="82" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="697" y="174.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Mobile workforce</text><text x="697" y="194.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">(functionalist</text><text x="697" y="214.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">claim)</text><rect x="30" y="232" width="150" height="62" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="256.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Horizontal</text><text x="42" y="276.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">extended</text><rect x="180" y="232" width="170" height="62" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="192" y="256.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Many carers and</text><text x="192" y="276.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">role models</text><rect x="350" y="232" width="170" height="62" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="362" y="256.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Childcare shared</text><rect x="520" y="232" width="165" height="62" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="532" y="256.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Respect and a</text><text x="532" y="276.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">clear role</text><rect x="685" y="232" width="185" height="62" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="697" y="256.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Kin support reduces</text><text x="697" y="276.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">demands on the state</text><rect x="30" y="294" width="150" height="82" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="318.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Beanpole</text><rect x="180" y="294" width="170" height="82" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="192" y="318.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Close ties with</text><text x="192" y="338.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">grandparents</text><rect x="350" y="294" width="170" height="82" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="362" y="318.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">May care in both</text><text x="362" y="338.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">directions</text><rect x="520" y="294" width="165" height="82" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="532" y="318.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Support from adult</text><text x="532" y="338.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">children</text><rect x="685" y="294" width="185" height="82" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="697" y="318.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Fewer siblings and</text><text x="697" y="338.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">cousins to share</text><text x="697" y="358.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">care</text><rect x="30" y="376" width="150" height="82" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="400.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Reconstituted</text><rect x="180" y="376" width="170" height="82" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="192" y="400.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">A second stable</text><text x="192" y="420.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">home</text><rect x="350" y="376" width="170" height="82" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="362" y="400.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Possible</text><text x="362" y="420.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">step-parenting</text><text x="362" y="440.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">conflict</text><rect x="520" y="376" width="165" height="82" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="532" y="400.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Step-grandparent</text><text x="532" y="420.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">ties may be weak</text><rect x="685" y="376" width="185" height="82" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="697" y="400.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Family life</text><text x="697" y="420.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">continues after</text><text x="697" y="440.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">divorce</text><rect x="30" y="458" width="150" height="62" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="482.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Lone parent</text><rect x="180" y="458" width="170" height="62" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="192" y="482.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Escape from</text><text x="192" y="502.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">conflict</text><rect x="350" y="458" width="170" height="62" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="362" y="482.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Higher poverty</text><text x="362" y="502.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">risk; dual burden</text><rect x="520" y="458" width="165" height="62" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="532" y="482.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">May be relied on</text><text x="532" y="502.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">for childcare</text><rect x="685" y="458" width="185" height="62" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="697" y="482.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">New Right: weak base</text><text x="697" y="502.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">for socialisation</text>
</svg>