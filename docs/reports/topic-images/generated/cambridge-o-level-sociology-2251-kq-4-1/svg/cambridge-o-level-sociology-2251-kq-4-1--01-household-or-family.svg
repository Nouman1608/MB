<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 672" width="900" height="672" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="672" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Household or family?</text>

<ellipse cx="330" cy="320" rx="290" ry="190" fill="#dce9e7" stroke="#2e6b62" stroke-width="3"/><ellipse cx="570" cy="320" rx="290" ry="190" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="3" fill-opacity="0.6"/><ellipse cx="330" cy="320" rx="290" ry="190" fill="none" stroke="#2e6b62" stroke-width="3"/><text x="195" y="222" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">HOUSEHOLD</text><text x="195" y="244" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="middle">same address, shared living</text><text x="705" y="222" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="middle">FAMILY</text><text x="705" y="244" font-size="15" font-weight="400" fill="#8a6d0d" text-anchor="middle">linked by kinship</text><text x="450" y="222" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">BOTH</text><text x="180" y="290" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Single person</text><text x="180" y="312" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">household</text><text x="180" y="345" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Shared household of</text><text x="180" y="367" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">unrelated people</text><text x="180" y="410" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">(alternatives to the</text><text x="180" y="430" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">family)</text><text x="450" y="300" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">A family living</text><text x="450" y="322" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">together, e.g.</text><text x="450" y="344" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">a nuclear</text><text x="450" y="366" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">family at home</text><text x="715" y="290" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Relatives who live</text><text x="715" y="312" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">apart, e.g. a</text><text x="715" y="334" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">modified extended</text><text x="715" y="356" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">family</text><text x="715" y="390" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">blood, marriage,</text><text x="715" y="410" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">adoption or long-term</text><text x="715" y="430" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">partnership</text><rect x="30" y="530" width="840" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="566" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">A definition to criticise</text><text x="50" y="595.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Murdock (1949): common residence, economic cooperation and reproduction. Precise, but it</text><text x="50" y="617.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">excludes childless couples, lone parents and relatives who live apart.</text>
</svg>