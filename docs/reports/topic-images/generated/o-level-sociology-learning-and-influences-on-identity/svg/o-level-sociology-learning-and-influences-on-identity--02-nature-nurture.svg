<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 647" width="900" height="647" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="647" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Nature or nurture?</text>

<line x1="215" y1="132" x2="685" y2="176" stroke="#1e2a44" stroke-width="7" stroke-linecap="round"/><path d="M450,154 L420,246 L480,246 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><circle cx="450" cy="154" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><line x1="215" y1="132" x2="160" y2="187" stroke="#1e2a44" stroke-width="2.5"/><line x1="215" y1="132" x2="270" y2="187" stroke="#1e2a44" stroke-width="2.5"/><path d="M140,187 L290,187 Q275,214 215,214 Q155,214 140,187 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><line x1="685" y1="176" x2="630" y2="231" stroke="#1e2a44" stroke-width="2.5"/><line x1="685" y1="176" x2="740" y2="231" stroke="#1e2a44" stroke-width="2.5"/><path d="M610,231 L760,231 Q745,258 685,258 Q625,258 610,231 Z" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="215" y="236" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">NATURE</text><text x="685" y="280" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">NURTURE</text><rect x="30" y="282" width="405" height="227" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="318" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Nature: behaviour is inborn</text><text x="50" y="347.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="347.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Behaviour would be fixed by biology</text><rect x="465" y="282" width="405" height="227" rx="14" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="485" y="318" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="start">Nurture: behaviour is learned</text><text x="485" y="347.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="501.15" y="347.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Oxana Malaya, found in Ukraine in 1991</text><text x="501.15" y="369.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">after years living largely among dogs,</text><text x="501.15" y="391.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">showed dog-like behaviour and limited</text><text x="501.15" y="413.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">speech</text><text x="485" y="440.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="501.15" y="440.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Relativity of culture: what is polite,</text><text x="501.15" y="462.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">beautiful or moral varies between</text><text x="501.15" y="484.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">societies and over time</text><rect x="30" y="527" width="840" height="90" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="563" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Where sociologists stand</text><text x="50" y="592.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Sociologists stress nurture: human behaviour depends on socialisation.</text>
</svg>