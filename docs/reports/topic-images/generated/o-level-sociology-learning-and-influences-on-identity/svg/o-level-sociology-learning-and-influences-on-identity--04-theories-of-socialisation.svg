<rect width="900" height="704" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Consensus and conflict views of socialisation</text>

<rect x="300" y="110" width="300" height="64" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="146.8" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Socialisation</text><text x="160" y="222" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">CONSENSUS</text><text x="600" y="222" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">CONFLICT</text><path d="M450,168 L450,190 M160,190 L740,190 M160,190 L160,204 M600,190 L600,204" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><path d="M600,232 L600,244 M455,244 L745,244 M455,244 L455,256 M745,244 L745,256" fill="none" stroke="#b5602e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><rect x="30" y="256" width="270" height="250" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="289" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FUNCTIONALISM</text><text x="50" y="314.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Passes on shared</text><text x="50" y="338.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">values</text><text x="50" y="366.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="366.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Creates value consensus</text><text x="65.2" y="387.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">and social cohesion</text><text x="50" y="413.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="413.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Problems come from</text><text x="65.2" y="434.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">inadequate socialisation,</text><text x="65.2" y="455.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">e.g. families failing to</text><text x="65.2" y="476.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">teach norms</text><rect x="310" y="256" width="290" height="250" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="330" y="289" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">MARXISM</text><text x="330" y="314.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Teaches capitalist</text><text x="330" y="338.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">ideology</text><text x="330" y="366.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="345.2" y="366.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Accepting hierarchy and</text><text x="345.2" y="387.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">inequality as normal</text><text x="330" y="413.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="345.2" y="413.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Reproduces social class</text><text x="330" y="439.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="345.2" y="439.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Bowles and Gintis (1976):</text><text x="345.2" y="460.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">hidden curriculum prepares</text><text x="345.2" y="481.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">obedient workers</text><rect x="610" y="256" width="260" height="250" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="630" y="289" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">FEMINISM</text><text x="630" y="314.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Gender role</text><text x="630" y="338.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">socialisation</text><text x="630" y="366.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="645.2" y="366.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Teaches masculinity and</text><text x="645.2" y="387.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">femininity in ways that</text><text x="645.2" y="408.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">keep women subordinate</text><path d="M160,232 L160,256" fill="none" stroke="#2e6b62" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="30" y="546" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Sue Sharpe, Just Like a Girl: girls’ priorities changed</text><rect x="30" y="562" width="390" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="225" y="595" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">1976</text><text x="225" y="621.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Marriage and children</text><text x="225" y="649.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Working-class girls in London</text><line x1="426" y1="618" x2="474" y2="618" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="480" y="562" width="390" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="675" y="595" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">1990s REPEAT</text><text x="675" y="621.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Jobs and careers</text><text x="675" y="649.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Priorities had shifted</text>
</svg>