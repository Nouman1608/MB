<rect width="900" height="778" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Agencies of socialisation across life</text>

<path d="M294,150 L294,138 L431,138 L431,150" fill="none" stroke="#8a6d0d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="362.5" y="128" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">Primary</text><path d="M439,150 L439,138 L866,138 L866,150" fill="none" stroke="#2e6b62" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="652.5" y="128" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">Secondary socialisation: throughout life</text><rect x="292" y="158" width="141" height="40" rx="8" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="362.5" y="184" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Early childhood</text><rect x="437" y="158" width="141" height="40" rx="8" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="507.5" y="184" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Childhood</text><rect x="582" y="158" width="141" height="40" rx="8" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="652.5" y="184" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Teenage years</text><rect x="727" y="158" width="141" height="40" rx="8" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="797.5" y="184" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Adulthood</text><line x1="30" y1="292" x2="870" y2="292" stroke="#c9d6d4" stroke-width="1.5"/><text x="30" y="238" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Family</text><text x="30" y="260" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">canalisation, role modelling</text><text x="30" y="280" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="start" font-style="italic">very powerful in early years</text><rect x="294" y="236" width="137" height="34" rx="9" fill="#2e6b62" stroke="#1e2a44" stroke-width="2"/><rect x="439" y="236" width="427" height="34" rx="9" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><line x1="30" y1="376" x2="870" y2="376" stroke="#c9d6d4" stroke-width="1.5"/><text x="30" y="322" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Education</text><text x="30" y="344" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">hidden curriculum</text><text x="30" y="364" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="start" font-style="italic">reaches almost all children</text><rect x="439" y="320" width="282" height="34" rx="9" fill="#2e6b62" stroke="#1e2a44" stroke-width="2"/><line x1="30" y1="460" x2="870" y2="460" stroke="#c9d6d4" stroke-width="1.5"/><text x="30" y="406" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Peer group</text><text x="30" y="428" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">peer pressure</text><text x="30" y="448" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="start" font-style="italic">strong in teenage years</text><rect x="439" y="404" width="137" height="34" rx="9" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><rect x="584" y="404" width="137" height="34" rx="9" fill="#2e6b62" stroke="#1e2a44" stroke-width="2"/><rect x="729" y="404" width="137" height="34" rx="9" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><line x1="30" y1="544" x2="870" y2="544" stroke="#c9d6d4" stroke-width="1.5"/><text x="30" y="490" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Media</text><text x="30" y="512" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">media representations</text><text x="30" y="532" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="start" font-style="italic">constant exposure</text><rect x="294" y="488" width="572" height="34" rx="9" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><line x1="30" y1="628" x2="870" y2="628" stroke="#c9d6d4" stroke-width="1.5"/><text x="30" y="574" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Religion</text><text x="30" y="596" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">religious teachings</text><text x="30" y="616" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="start" font-style="italic">strong in religious communities</text><rect x="294" y="572" width="572" height="34" rx="9" fill="#dce9e7" stroke="#1e2a44" stroke-width="2" stroke-dasharray="6 5"/><line x1="30" y1="712" x2="870" y2="712" stroke="#c9d6d4" stroke-width="1.5"/><text x="30" y="658" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Workplace</text><text x="30" y="680" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">workplace training</text><text x="30" y="700" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="start" font-style="italic">adult occupational identity</text><rect x="729" y="656" width="137" height="34" rx="9" fill="#2e6b62" stroke="#1e2a44" stroke-width="2"/><rect x="190" y="732" width="40" height="22" rx="6" fill="#2e6b62" stroke="#1e2a44" stroke-width="2"/><text x="240" y="748" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">strongest influence</text><rect x="440" y="732" width="40" height="22" rx="6" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="490" y="748" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">ongoing influence</text><rect x="670" y="732" width="40" height="22" rx="6" fill="#dce9e7" stroke="#1e2a44" stroke-width="2" stroke-dasharray="6 5"/><text x="720" y="748" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">varies</text>
</svg>