<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Agencies of socialisation across life</text>

<path d="M274,150 L274,138 L413.5,138 L413.5,150" fill="none" stroke="#8a6d0d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="343.75" y="128" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">Primary</text><path d="M421.5,150 L421.5,138 L856,138 L856,150" fill="none" stroke="#2e6b62" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="638.75" y="128" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">Secondary socialisation: throughout life</text><rect x="272" y="158" width="143.5" height="40" rx="8" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="343.75" y="184" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Early childhood</text><rect x="419.5" y="158" width="143.5" height="40" rx="8" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="491.25" y="184" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Childhood</text><rect x="567" y="158" width="143.5" height="40" rx="8" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="638.75" y="184" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Teenage years</text><rect x="714.5" y="158" width="143.5" height="40" rx="8" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="786.25" y="184" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Adulthood</text><line x1="30" y1="280" x2="870" y2="280" stroke="#c9d6d4" stroke-width="1.5"/><text x="30" y="246" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Family</text><text x="30" y="268" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">canalisation, role modelling</text><rect x="274" y="232" width="139.5" height="34" rx="9" fill="#2e6b62" stroke="#1e2a44" stroke-width="2"/><rect x="421.5" y="232" width="434.5" height="34" rx="9" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="343.75" y="255" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">very powerful in early years</text><line x1="30" y1="350" x2="870" y2="350" stroke="#c9d6d4" stroke-width="1.5"/><text x="30" y="316" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Education</text><text x="30" y="338" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">hidden curriculum</text><rect x="421.5" y="302" width="287" height="34" rx="9" fill="#2e6b62" stroke="#1e2a44" stroke-width="2"/><text x="565" y="325" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">reaches almost all children</text><line x1="30" y1="420" x2="870" y2="420" stroke="#c9d6d4" stroke-width="1.5"/><text x="30" y="386" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Peer group</text><text x="30" y="408" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">peer pressure</text><rect x="421.5" y="372" width="139.5" height="34" rx="9" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><rect x="569" y="372" width="139.5" height="34" rx="9" fill="#2e6b62" stroke="#1e2a44" stroke-width="2"/><rect x="716.5" y="372" width="139.5" height="34" rx="9" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="638.75" y="395" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">strong in teenage years</text><line x1="30" y1="490" x2="870" y2="490" stroke="#c9d6d4" stroke-width="1.5"/><text x="30" y="456" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Media</text><text x="30" y="478" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">media representations</text><rect x="274" y="442" width="582" height="34" rx="9" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="565" y="465" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">constant exposure</text><line x1="30" y1="560" x2="870" y2="560" stroke="#c9d6d4" stroke-width="1.5"/><text x="30" y="526" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Religion</text><text x="30" y="548" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">religious teachings</text><rect x="274" y="512" width="582" height="34" rx="9" fill="#dce9e7" stroke="#1e2a44" stroke-width="2" stroke-dasharray="6 5"/><text x="565" y="535" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">strong in religious communities</text><line x1="30" y1="630" x2="870" y2="630" stroke="#c9d6d4" stroke-width="1.5"/><text x="30" y="596" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Workplace</text><text x="30" y="618" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">workplace training</text><rect x="716.5" y="582" width="139.5" height="34" rx="9" fill="#2e6b62" stroke="#1e2a44" stroke-width="2"/><text x="786.25" y="605" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">adult occupational identity</text><rect x="190" y="650" width="40" height="22" rx="6" fill="#2e6b62" stroke="#1e2a44" stroke-width="2"/><text x="240" y="666" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">strongest influence</text><rect x="440" y="650" width="40" height="22" rx="6" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="490" y="666" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">ongoing influence</text><rect x="670" y="650" width="40" height="22" rx="6" fill="#dce9e7" stroke="#1e2a44" stroke-width="2" stroke-dasharray="6 5"/><text x="720" y="666" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">varies</text>
</svg>