<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 563" width="900" height="563" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="563" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three ways globalisation affects identity</text>

<rect x="250" y="110" width="400" height="88" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="146" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Global media, brands and mixing</text><text x="450" y="172" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">cultures</text><rect x="30" y="260" width="260" height="173" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="296" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Homogenisation</text><text x="50" y="324.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Identities become more</text><text x="50" y="345.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">alike under global media</text><text x="50" y="366.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">and brands.</text><rect x="320" y="260" width="260" height="173" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="340" y="296" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Hybrid identities</text><text x="340" y="324.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Cultures mix, e.g. young</text><text x="340" y="345.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">people of South Asian</text><text x="340" y="366.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">heritage in the UK or Gulf</text><text x="340" y="387.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">states combining</text><text x="340" y="408.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">traditions.</text><rect x="610" y="260" width="260" height="173" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="630" y="296" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Cultural defence</text><text x="630" y="324.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Groups reinforce their</text><text x="630" y="345.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">language, dress or</text><text x="630" y="366.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">religion.</text><line x1="350" y1="202" x2="170" y2="252" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="450" y1="202" x2="450" y2="252" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="550" y1="202" x2="730" y2="252" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="453" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="486.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Multiculturalism and global culture can enrich identity and connect people, but may also</text><text x="50" y="508.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">cause tension and weaken local traditions.</text>
</svg>