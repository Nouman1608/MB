<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 751" width="900" height="751" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="751" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How culture shapes identity</text>

<rect x="30" y="104" width="840" height="250" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="55" y="140" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Culture: the shared way of life of a group</text><rect x="50" y="160" width="237.33333333333334" height="156" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="70" y="193" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">VALUES</text><text x="70" y="218.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">What is important</text><text x="70" y="246.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">e.g. respect for elders</text><line x1="293.33333333333337" y1="238" x2="325.33333333333337" y2="238" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="331.33333333333337" y="160" width="237.33333333333334" height="156" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="351.33333333333337" y="193" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">NORMS</text><text x="351.33333333333337" y="218.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Rules based on</text><text x="351.33333333333337" y="242.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">values</text><text x="351.33333333333337" y="270.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">e.g. removing shoes</text><text x="351.33333333333337" y="291.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">before entering a home</text><line x1="574.6666666666667" y1="238" x2="606.6666666666667" y2="238" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="612.6666666666667" y="160" width="237.33333333333334" height="156" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="632.6666666666667" y="193" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CUSTOMS</text><text x="632.6666666666667" y="218.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Long-established</text><text x="632.6666666666667" y="242.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">practices</text><text x="632.6666666666667" y="270.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">e.g. wedding rituals</text><text x="632.6666666666667" y="291.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">such as mehndi</text><rect x="30" y="372" width="269.3333333333333" height="177" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="405" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ROLES</text><text x="50" y="430.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Expected behaviour of</text><text x="50" y="454.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">a position</text><text x="50" y="482.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Prefect, elder sibling,</text><text x="50" y="503.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">shopkeeper</text><rect x="315.3333333333333" y="372" width="269.3333333333333" height="177" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="335.3333333333333" y="405" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STATUS</text><text x="335.3333333333333" y="430.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Ascribed at birth or</text><text x="335.3333333333333" y="454.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">achieved</text><text x="335.3333333333333" y="482.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Caste or royal birth</text><text x="335.3333333333333" y="503.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">(ascribed); doctor</text><text x="335.3333333333333" y="524.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">(achieved)</text><rect x="600.6666666666666" y="372" width="269.3333333333333" height="177" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="620.6666666666666" y="405" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STEREOTYPES</text><text x="620.6666666666666" y="430.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Fixed, oversimplified</text><text x="620.6666666666666" y="454.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">images</text><text x="620.6666666666666" y="482.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">“Boys don’t cry”</text><line x1="450" y1="559" x2="450" y2="593" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="30" y="607" width="840" height="114" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="643.8" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Identity</text><text x="450" y="674.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">People judge themselves by the roles and statuses they hold, and by how others respond to</text><text x="450" y="696.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">them.</text>
</svg>