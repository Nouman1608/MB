<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Is identity chosen?</text>

<rect x="30" y="110" width="840" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="55" y="150" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="start">Postmodernists: “pick and mix” your identity</text><rect x="190.35000000000002" y="174" width="147.85" height="46" rx="23" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="264.27500000000003" y="203.48" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">consumption</text><rect x="350.20000000000005" y="174" width="127.14999999999999" height="46" rx="23" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="413.77500000000003" y="203.48" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">lifestyle</text><rect x="489.35" y="174" width="220.29999999999998" height="46" rx="23" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="599.5" y="203.48" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">digital identities</text><text x="450" y="286" font-size="19" font-weight="700" fill="#b5602e" text-anchor="middle">Critics: choice is still limited by…</text><rect x="55" y="320" width="186" height="90" rx="10" fill="#f2e7b8" stroke="#b5602e" stroke-width="3"/><text x="148" y="371" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">money</text><rect x="257" y="320" width="186" height="90" rx="10" fill="#f2e7b8" stroke="#b5602e" stroke-width="3"/><text x="350" y="371" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">family expectations</text><rect x="459" y="320" width="186" height="90" rx="10" fill="#f2e7b8" stroke="#b5602e" stroke-width="3"/><text x="552" y="371" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">religion</text><rect x="661" y="320" width="186" height="90" rx="10" fill="#f2e7b8" stroke="#b5602e" stroke-width="3"/><text x="754" y="371" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">class</text><rect x="30" y="460" width="410" height="142" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="493" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DIGITAL SELF: POSITIVES</text><text x="50" y="523.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="523.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Self-expression</text><text x="50" y="550.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="550.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Connection with distant relatives</text><text x="50" y="577.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="577.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Support networks</text><rect x="460" y="460" width="410" height="142" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="480" y="493" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">DIGITAL SELF: NEGATIVES</text><text x="480" y="523.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="496.15" y="523.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Cyberbullying</text><text x="480" y="550.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="496.15" y="550.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Pressure to look perfect</text><text x="480" y="577.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="496.15" y="577.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Privacy risks</text>
