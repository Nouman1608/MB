<rect x="30" y="110" width="840" height="330" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="110" width="840" height="330" rx="14" fill="none" stroke="#b5602e" stroke-width="10" stroke-dasharray="2 0" opacity="0.25"/><text x="55" y="150" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="start">Postmodernists: “pick and mix” your identity</text><rect x="104.96250000000003" y="174" width="141.52499999999998" height="42" rx="21" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="175.72500000000002" y="201.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">consumption</text><rect x="258.4875" y="174" width="121.975" height="42" rx="21" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="319.475" y="201.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">lifestyle</text><rect x="392.4625" y="174" width="209.95" height="42" rx="21" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="497.4375" y="201.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">digital identities</text><rect x="614.4124999999999" y="174" width="180.62499999999997" height="42" rx="21" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="704.7249999999999" y="201.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">online profiles</text><rect x="340.13750000000005" y="226" width="219.72499999999997" height="42" rx="21" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="253.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">virtual communities</text><text x="450" y="296" font-size="19" font-weight="700" fill="#b5602e" text-anchor="middle">Critics: choice is still limited by…</text><rect x="60" y="320" width="180" height="90" rx="10" fill="#f2e7b8" stroke="#b5602e" stroke-width="3"/><text x="150" y="372" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">money</text><rect x="260" y="320" width="180" height="90" rx="10" fill="#f2e7b8" stroke="#b5602e" stroke-width="3"/><text x="350" y="372" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">family expectations</text><rect x="460" y="320" width="180" height="90" rx="10" fill="#f2e7b8" stroke="#b5602e" stroke-width="3"/><text x="550" y="372" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">religion</text><rect x="660" y="320" width="180" height="90" rx="10" fill="#f2e7b8" stroke="#b5602e" stroke-width="3"/><text x="750" y="372" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">class</text><rect x="30" y="460" width="410" height="142" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="493" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DIGITAL SELF: POSITIVES</text><text x="50" y="523.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="523.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Self-expression</text><text x="50" y="550.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="550.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Connection with distant relatives</text><text x="50" y="577.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="577.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Support networks</text><rect x="460" y="460" width="410" height="142" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="480" y="493" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">DIGITAL SELF: NEGATIVES</text><text x="480" y="523.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="496.15" y="523.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Cyberbullying</text><text x="480" y="550.6" font-size="17" font-weight="70