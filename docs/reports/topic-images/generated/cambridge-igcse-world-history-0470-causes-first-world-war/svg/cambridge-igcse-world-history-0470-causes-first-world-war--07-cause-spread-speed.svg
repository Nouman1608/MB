<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 443" width="900" height="443" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="443" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Was the Alliance System the main cause?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Separate why it began, why it spread and why so fast</text>
<rect x="30" y="124" width="270.6666666666667" height="154" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="165.33333333333334" y="166.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">WHY IT BEGAN</text><text x="165.33333333333334" y="193.32" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Balkan rivalry</text><text x="165.33333333333334" y="222.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Austria-Hungary against</text><text x="165.33333333333334" y="243.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Serbia, backed by Russia</text><rect x="314.6666666666667" y="124" width="270.6666666666667" height="154" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">HOW IT SPREAD</text><text x="450" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">The alliances</text><text x="450" y="211.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Blank cheque and Russian</text><text x="450" y="232.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">support drew in both blocs</text><text x="450" y="253.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">within a week</text><rect x="599.3333333333334" y="124" width="270.6666666666667" height="154" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="734.6666666666667" y="166.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">WHY SO FAST</text><text x="734.6666666666667" y="193.32" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Military plans</text><text x="734.6666666666667" y="222.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Schlieffen Plan left diplomacy</text><text x="734.6666666666667" y="243.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">little time</text><rect x="30" y="300" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="334.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">But the alliances did not make war certain</text><text x="50" y="364.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Italy stayed neutral and Britain was not obliged to fight: it entered because Germany invaded</text><text x="50" y="386.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Belgium.</text>
</svg>