<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 805" width="900" height="805" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="805" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">From Sarajevo to world war</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Each link in the chain, June-August 1914</text>
<line x1="60" y1="144" x2="60" y2="753" stroke="#c9d6d4" stroke-width="4"/><rect x="104" y="124" width="766" height="106" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="122" y="154" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">28 JUNE</text><text x="122" y="180.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Franz Ferdinand assassinated</text><text x="122" y="208" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">By Gavrilo Princip, linked to the Black Hand</text><circle cx="60" cy="177" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="185.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="104" y="238" width="766" height="106" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="268" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">5-6 JULY</text><text x="122" y="294.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Germany's "blank cheque"</text><text x="122" y="322" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Austria-Hungary confident</text><circle cx="60" cy="291" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="299.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="104" y="352" width="766" height="106" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="382" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">23-28 JULY</text><text x="122" y="408.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Ultimatum, then war on Serbia</text><text x="122" y="436" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Serbia accepted most terms but not all (25 July)</text><circle cx="60" cy="405" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="413.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="104" y="466" width="766" height="106" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="496" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">30 JULY</text><text x="122" y="522.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Russia mobilises</text><text x="122" y="550" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Sets off the Schlieffen Plan</text><circle cx="60" cy="519" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="527.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="104" y="580" width="766" height="79" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="610" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">1-3 AUGUST</text><text x="122" y="636.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Germany declares war on Russia, then France</text><circle cx="60" cy="619.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="628.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><rect x="104" y="667" width="766" height="106" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="122" y="697" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">4 AUGUST</text><text x="122" y="723.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Belgium invaded; Britain declares war</text><text x="122" y="751" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Belgian neutrality guaranteed by Britain in 1839</text><circle cx="60" cy="720" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="728.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">6</text>
</svg>