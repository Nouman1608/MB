<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The arms race</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Sea and land, 1898-1913</text>
<line x1="105.88235294117646" y1="148" x2="105.88235294117646" y2="378" stroke="#c9d6d4" stroke-width="1.5"/><text x="105.88235294117646" y="138" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">1898</text><line x1="197.64705882352942" y1="148" x2="197.64705882352942" y2="378" stroke="#c9d6d4" stroke-width="1.5"/><text x="197.64705882352942" y="138" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">1900</text><line x1="289.4117647058823" y1="148" x2="289.4117647058823" y2="378" stroke="#c9d6d4" stroke-width="1.5"/><text x="289.4117647058823" y="138" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">1902</text><line x1="381.1764705882353" y1="148" x2="381.1764705882353" y2="378" stroke="#c9d6d4" stroke-width="1.5"/><text x="381.1764705882353" y="138" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">1904</text><line x1="472.94117647058823" y1="148" x2="472.94117647058823" y2="378" stroke="#c9d6d4" stroke-width="1.5"/><text x="472.94117647058823" y="138" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">1906</text><line x1="564.7058823529412" y1="148" x2="564.7058823529412" y2="378" stroke="#c9d6d4" stroke-width="1.5"/><text x="564.7058823529412" y="138" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">1908</text><line x1="656.4705882352941" y1="148" x2="656.4705882352941" y2="378" stroke="#c9d6d4" stroke-width="1.5"/><text x="656.4705882352941" y="138" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">1910</text><line x1="748.2352941176471" y1="148" x2="748.2352941176471" y2="378" stroke="#c9d6d4" stroke-width="1.5"/><text x="748.2352941176471" y="138" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">1912</text><line x1="840" y1="148" x2="840" y2="378" stroke="#c9d6d4" stroke-width="1.5"/><text x="840" y="138" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">1914</text><line x1="40" y1="264" x2="860" y2="264" stroke="#1e2a44" stroke-width="4" stroke-linecap="round"/><path d="M105.88235294117646,264 L105.88235294117646,248 L105.88235294117646,216" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="56.83435294117646" y="150" width="98.096" height="64" fill="#f4f6f6"/><text x="105.88235294117646" y="165" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">1898, 1900</text><text x="105.88235294117646" y="185" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">German</text><text x="105.88235294117646" y="205" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Navy Laws</text><path d="M472.94117647058823,264 L472.94117647058823,248 L472.94117647058823,216" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="417.59717647058824" y="150" width="110.688" height="64" fill="#f4f6f6"/><text x="472.94117647058823" y="165" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">1906</text><text x="472.94117647058823" y="185" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">HMS</text><text x="472.94117647058823" y="205" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Dreadnought</text><path d="M610.5882352941177,264 L610.5882352941177,248 L614.7651764705882,216" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="536.2851764705882" y="150" width="156.96" height="64" fill="#f4f6f6"/><text x="614.7651764705882" y="165" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">1909</text><text x="614.7651764705882" y="185" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">"We want eight</text><text x="614.7651764705882" y="205" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">and we won't wait"</text><path d="M794.1176470588235,264 L794.1176470588235,280 L755.824,312" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="641.6479999999999" y="314" width="228.352" height="64" fill="#f4f6f6"/><text x="755.824" y="329" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">1913</text><text x="755.824" y="349" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">France: three years' service;</text><text x="755.824" y="369" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Russian army expansion</text><circle cx="105.88235294117646" cy="264" r="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><circle cx="472.94117647058823" cy="264" r="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><circle cx="610.5882352941177" cy="264" r="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><circle cx="794.1176470588235" cy="264" r="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><rect x="30" y="404" width="411" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="436" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SEA</text><text x="50" y="462.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Britain against Germany</text><text x="50" y="490.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Tirpitz's fleet to challenge Britain; Dreadnought</text><text x="50" y="511.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">made earlier designs obsolete</text><rect x="459" y="404" width="411" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="479" y="436" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">LAND</text><text x="479" y="462.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Conscript armies</text><text x="479" y="490.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">All continental powers; Schlieffen Plan: through</text><text x="479" y="511.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Belgium once Russia mobilised</text><rect x="30" y="558" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="592.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Effect</text><text x="450" y="622.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Did not start the war, but bred fear and mistrust: "better to fight sooner than later".</text>
</svg>