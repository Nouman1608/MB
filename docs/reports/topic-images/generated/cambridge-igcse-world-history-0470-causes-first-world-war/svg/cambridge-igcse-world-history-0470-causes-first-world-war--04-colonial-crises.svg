<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 673" width="900" height="673" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="673" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Colonial crises, 1896-1911</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Each German challenge pushed Britain and France closer</text>
<text x="210" y="140" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">CRISIS</text><text x="690" y="140" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">OUTCOME</text><line x1="450" y1="154" x2="450" y2="530" stroke="#1e2a44" stroke-width="3"/><rect x="30" y="154" width="360" height="70" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="43" y="180.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Kruger Telegram</text><text x="43" y="207" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Kaiser congratulates the Boers</text><line x1="390" y1="189" x2="396" y2="189" stroke="#1e2a44" stroke-width="2"/><rect x="510" y="154" width="360" height="70" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="523" y="193.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Britain angered</text><line x1="504" y1="189" x2="510" y2="189" stroke="#1e2a44" stroke-width="2"/><rect x="396" y="172" width="108" height="34" rx="17" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="195" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">1896</text><rect x="30" y="236" width="360" height="90" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="43" y="272.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Fashoda</text><text x="43" y="299" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Britain and France clash</text><line x1="390" y1="281" x2="396" y2="281" stroke="#1e2a44" stroke-width="2"/><rect x="510" y="236" width="360" height="90" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="523" y="262.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Anglo-French rivalry</text><text x="523" y="289" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Colonial disputes later settled in the Entente</text><text x="523" y="309" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Cordiale (1904)</text><line x1="504" y1="281" x2="510" y2="281" stroke="#1e2a44" stroke-width="2"/><rect x="396" y="264" width="108" height="34" rx="17" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="287" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">1898</text><rect x="30" y="338" width="360" height="90" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="43" y="374.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">First Moroccan Crisis</text><text x="43" y="401" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Wilhelm II at Tangier tests the Entente</text><line x1="390" y1="383" x2="396" y2="383" stroke="#1e2a44" stroke-width="2"/><rect x="510" y="338" width="360" height="90" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="523" y="364.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Algeciras (1906)</text><text x="523" y="391" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Only Austria-Hungary backs Germany; Entente</text><text x="523" y="411" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">stronger</text><line x1="504" y1="383" x2="510" y2="383" stroke="#1e2a44" stroke-width="2"/><rect x="396" y="366" width="108" height="34" rx="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="389" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">1905-06</text><rect x="30" y="440" width="360" height="90" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="43" y="476.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Agadir</text><text x="43" y="503" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Gunboat Panther sent</text><line x1="390" y1="485" x2="396" y2="485" stroke="#1e2a44" stroke-width="2"/><rect x="510" y="440" width="360" height="90" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="523" y="466.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Britain backs France</text><text x="523" y="493" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Germany takes French Congo land;</text><text x="523" y="513" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Anglo-French military co-operation grows</text><line x1="504" y1="485" x2="510" y2="485" stroke="#1e2a44" stroke-width="2"/><rect x="396" y="468" width="108" height="34" rx="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="491" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">1911</text><rect x="30" y="552" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="586.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">But</text><text x="50" y="616.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Colonial disputes were settled by negotiation; the war began in the <tspan font-weight="700" fill="#1e2a44">Balkans</tspan>, not over colonies.</text>
</svg>