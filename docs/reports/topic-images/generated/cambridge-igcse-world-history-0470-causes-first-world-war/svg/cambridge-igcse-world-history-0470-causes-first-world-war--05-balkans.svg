<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 523" width="900" height="523" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="523" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why the Balkans were so hard to solve</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Labelled schematic of rival interests, not a map</text>
<line x1="320" y1="195" x2="409" y2="234.9" stroke="#1e2a44" stroke-width="2.5"/><line x1="320" y1="309" x2="409" y2="269.1" stroke="#1e2a44" stroke-width="2.5"/><line x1="580" y1="174" x2="491" y2="228.6" stroke="#1e2a44" stroke-width="2.5"/><line x1="580" y1="309" x2="491" y2="269.1" stroke="#1e2a44" stroke-width="2.5"/><circle cx="450" cy="252" r="82" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="450" y="246.8" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Ottoman</text><text x="450" y="271.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">decline</text><rect x="30" y="145" width="290" height="100" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="46" y="175.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Austria-Hungary</text><text x="46" y="203.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Ruled millions of Slavs; annexed</text><text x="46" y="224.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Bosnia (1908-09)</text><rect x="30" y="259" width="290" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="289.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Germany</text><text x="46" y="317.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Backed Austria-Hungary in</text><text x="46" y="338.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">1908-09</text><rect x="580" y="124" width="290" height="100" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="596" y="154.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Serbia</text><text x="596" y="182.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Led Slav nationalism; nearly</text><text x="596" y="203.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">doubled in 1912-13; Black Hand</text><rect x="580" y="238" width="290" height="142" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="596" y="268.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Russia</text><text x="596" y="296.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Protector of Slavs; wanted the</text><text x="596" y="317.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Straits; backed down in 1909,</text><text x="596" y="338.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">determined not to be humiliated</text><text x="596" y="359.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">again</text><rect x="30" y="402" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="436.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Why no solution</text><text x="450" y="466.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">The great powers' interests were directly opposed, and each crisis left one side resentful.</text>
</svg>