<!-- place after: ## What are Pakistan's non-renewable power resources? -->
<figure class="topic-figure">
  <img src="https://img.marlbridge.com/igcse-cambridge-pakistan-studies-power--03-fuels-to-users.webp" width="900" height="801" alt="Three rows. Coal: low-grade Thar lignite is burned in power stations near the mine, while imported coal arrives at Karachi’s ports and moves inland by rail and road. Gas: from Sui and other fields it travels by trunk pipeline to cities, while areas off the network use costlier LPG cylinders. Oil: most is imported by tanker to Karachi, refined there or piped to Mahmood Kot near Multan, with rail and road tankers carrying the rest." loading="lazy">
  <figcaption>Pipelines reach the cities; everywhere else depends on costlier rail, road and cylinders.</figcaption>
</figure>

<!-- place after: ## How is electricity generated in Pakistan? -->

<!-- place after: ## Why are multi-purpose hydel schemes built where they are? -->
<figure class="topic-figure">

<!-- place after: ## Why is electricity supply not reliable in many parts of Pakistan? -->
<figure class="topic-figure">
