<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three ways Pakistan generates electricity</text>

<rect x="30" y="112" width="270" height="219" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="146.7" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Thermal</text><text x="48" y="176.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="176.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Burn oil, gas, coal or waste</text><text x="64" y="197.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">to raise steam that drives</text><text x="64" y="218.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">turbines.</text><rect x="315" y="112" width="270" height="219" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="333" y="146.7" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Nuclear</text><text x="333" y="176.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="349" y="176.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Heat from nuclear fission.</text><text x="333" y="200.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="349" y="200.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Chashma, Punjab</text><text x="333" y="224.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="349" y="224.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Coast near Karachi</text><rect x="600" y="112" width="270" height="219" rx="12" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><text x="618" y="146.7" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Renewables</text><text x="618" y="176.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="634" y="176.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Hydel: Tarbela, Mangla,</text><text x="634" y="197.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Warsak; run-of-river</text><text x="634" y="218.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">schemes</text><text x="618" y="242.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="634" y="242.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Wind: Gharo–Jhimpir</text><text x="634" y="263.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">corridor, Sindh</text><text x="618" y="287.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="634" y="287.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Solar: Quaid-e-Azam Solar</text><text x="634" y="308.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Park near Bahawalpur</text><text x="30" y="367" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="start">INSIDE A THERMAL STATION</text><rect x="30" y="381" width="196" height="60" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="128" y="418" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Fuel burned</text><line x1="228" y1="411" x2="242" y2="411" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="244" y="381" width="196" height="60" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="342" y="418" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Water → steam</text><line x1="442" y1="411" x2="456" y2="411" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="458" y="381" width="196" height="60" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="556" y="418" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Steam drives turbines</text><line x1="656" y1="411" x2="670" y2="411" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="672" y="381" width="196" height="60" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="770" y="418" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Electricity</text><rect x="30" y="465" width="840" height="53" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="495.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Non-renewable fuels are running out and rising in price.</text>
