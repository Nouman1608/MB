<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Drilling for oil and gas</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">simple cross-section, not to scale</text>
<rect x="30" y="112" width="840" height="430" rx="14" fill="#e6eef0"/><rect x="30" y="252" width="840" height="290" fill="#efdfa8"/><line x1="30" y1="252" x2="870" y2="252" stroke="#1e2a44" stroke-width="2.5"/><path d="M30,332 Q450,292 870,332" fill="none" stroke="#9c8f6e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><path d="M30,497 Q450,347 870,497 L870,542 L30,542 Z" fill="#cbbf9f"/><path d="M30,462 Q450,312 870,462 L870,497 Q450,347 30,497 Z" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><path d="M230,443 Q450,401 670,443 Q450,504 230,443 Z" fill="#2b2f3a"/><path d="M430,252 L450,152 L470,252" fill="none" stroke="#1e2a44" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><path d="M436,222 L464,222 M441,192 L459,192" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><line x1="450" y1="252" x2="450" y2="434" stroke="#1e2a44" stroke-width="5"/><line x1="462" y1="372" x2="462" y2="262" stroke="#8a6d0d" stroke-width="4" marker-end="url(#ahO)"/><rect x="110" y="226" width="50" height="26" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><path d="M105,256 A30,30 0 0 0 165,256" fill="none" stroke="#2e6b62" stroke-width="2.5"/><path d="M80,256 A55,55 0 0 0 190,256" fill="none" stroke="#2e6b62" stroke-width="2.5"/><path d="M55,256 A80,80 0 0 0 215,256" fill="none" stroke="#2e6b62" stroke-width="2.5"/><text x="135" y="192" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">seismic survey</text><text x="135" y="212" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="middle">locates trapped deposits</text><text x="480" y="182" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">rig drills a well</text><text x="480" y="312" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="start">oil or gas rises under</text><text x="480" y="332" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="start">pressure or is pumped</text><text x="860" y="392" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">cap rock seals it in</text><line x1="790" y1="400" x2="800" y2="444" stroke="#1e2a44" stroke-width="2"/><text x="560" y="528" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">oil or gas trapped in the reservoir rock</text><line x1="555" y1="522" x2="520" y2="464" stroke="#1e2a44" stroke-width="2"/><rect x="30" y="562" width="840" height="75" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="592.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Found in sedimentary basins such as the Potwar Plateau and Sindh. A labelled diagram should show</text><text x="48" y="614.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">the reservoir, the cap rock and the route to the surface.</text>
