<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 608" width="900" height="608" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="608" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three ways to mine coal</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">simple cross-sections, not to scale</text>
<rect x="30" y="112" width="270" height="330" rx="14" fill="#e6eef0"/><path d="M30,222 L90,222 L115,292 L215,292 L240,222 L300,222 L300,442 L30,442 Z" fill="#efdfa8" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><path d="M30,292 L115,292 L215,292 L300,292 L300,332 L30,332 Z" fill="#2b2f3a"/><path d="M240,222 L260,192 L292,192 L300,222" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2"/><text x="276" y="184" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">spoil</text><line x1="165" y1="284" x2="165" y2="192" stroke="#8a6d0d" stroke-width="4" marker-end="url(#ahO)"/><text x="46" y="320" font-size="16" font-weight="700" fill="#ffffff" text-anchor="start">seam near the surface</text><text x="46" y="262" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">overburden</text><text x="46" y="278" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">stripped</text><text x="46" y="146" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Open cast</text><text x="46" y="170" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">dug from the surface</text><rect x="315" y="112" width="270" height="330" rx="14" fill="#e6eef0"/><path d="M315,412 L385,412 L445,232 L585,202 L585,442 L315,442 Z" fill="#efdfa8" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><path d="M418,312 L585,312 L585,342 L408,342 Z" fill="#2b2f3a"/><rect x="413" y="318" width="140" height="18" fill="#e6eef0" stroke="#1e2a44" stroke-width="2"/><line x1="515" y1="327" x2="385" y2="327" stroke="#8a6d0d" stroke-width="4" marker-end="url(#ahO)"/><text x="455" y="372" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">seam exposed on</text><text x="455" y="390" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">the valley side</text><text x="465" y="292" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">horizontal tunnel</text><text x="331" y="146" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Adit</text><text x="331" y="170" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">into a hillside</text><rect x="600" y="112" width="270" height="330" rx="14" fill="#e6eef0"/><rect x="600" y="222" width="270" height="220" fill="#efdfa8" stroke="#1e2a44" stroke-width="2.5"/><rect x="600" y="362" width="270" height="30" fill="#2b2f3a"/><rect x="650" y="222" width="22" height="160" fill="#e6eef0" stroke="#1e2a44" stroke-width="2"/><rect x="672" y="368" width="170" height="16" fill="#e6eef0" stroke="#1e2a44" stroke-width="2"/><rect x="605" y="368" width="45" height="16" fill="#e6eef0" stroke="#1e2a44" stroke-width="2"/><path d="M640,222 L661,182 L682,222" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><circle cx="661" cy="182" r="7" fill="#1e2a44"/><line x1="661" y1="352" x2="661" y2="232" stroke="#8a6d0d" stroke-width="4" marker-end="url(#ahO)"/><text x="690" y="272" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">vertical shaft</text><text x="690" y="352" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">galleries</text><text x="690" y="418" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">deep seam</text><text x="616" y="146" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Shaft</text><text x="616" y="170" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">for deep seams</text><rect x="30" y="456" width="270" height="94" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="485.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Suits seams near the surface</text><text x="48" y="506.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">with large reserves, such as</text><text x="48" y="527.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the Thar coalfield.</text><rect x="315" y="456" width="270" height="94" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="333" y="485.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Suits seams exposed on valley</text><text x="333" y="506.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">sides, e.g. in the Salt Range.</text><rect x="600" y="456" width="270" height="94" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="618" y="485.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Reaches deep seams; costly</text><text x="618" y="506.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and more dangerous.</text><rect x="40" y="568" width="34" height="18" fill="#2b2f3a"/><text x="84" y="584" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">coal seam</text><line x1="220" y1="577" x2="270" y2="577" stroke="#8a6d0d" stroke-width="4" marker-end="url(#ahO)"/><text x="282" y="584" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">route the coal takes to the surface</text>
</svg>