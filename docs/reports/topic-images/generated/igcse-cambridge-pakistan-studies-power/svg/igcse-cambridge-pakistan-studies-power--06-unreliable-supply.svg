<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 581" width="900" height="581" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="581" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why the power supply is not reliable</text>

<rect x="30" y="112" width="156" height="200" rx="12" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="48" y="141.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Demand</text><text x="48" y="162.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">outgrows</text><text x="48" y="183.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">capacity</text><text x="48" y="209.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Demand has</text><text x="48" y="229.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">grown faster</text><text x="48" y="249.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">than generating</text><text x="48" y="269.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">capacity.</text><rect x="201" y="112" width="156" height="200" rx="12" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="219" y="141.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Costly</text><text x="219" y="162.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">imported fuel</text><text x="219" y="188.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Power stations</text><text x="219" y="208.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">depend on it.</text><rect x="372" y="112" width="156" height="200" rx="12" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="390" y="141.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Low hydel</text><text x="390" y="162.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">output in</text><text x="390" y="183.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">winter</text><text x="390" y="209.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">River flow falls.</text><rect x="543" y="112" width="156" height="200" rx="12" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="561" y="141.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">High network</text><text x="561" y="162.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">losses</text><text x="561" y="188.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">On transmission</text><text x="561" y="208.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">and distribution</text><text x="561" y="228.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">lines.</text><rect x="714" y="112" width="156" height="200" rx="12" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="732" y="141.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Remote areas</text><text x="732" y="162.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">far from the</text><text x="732" y="183.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">grid</text><text x="732" y="209.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Balochistan, the</text><text x="732" y="229.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">north and the</text><text x="732" y="249.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Thar desert cost</text><text x="732" y="269.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">a great deal to</text><text x="732" y="289.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">connect.</text><line x1="450" y1="318" x2="450" y2="356" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="170" y="362" width="560" height="60" rx="12" fill="#b5602e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="400" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">Load-shedding: planned power cuts are common</text><line x1="450" y1="426" x2="450" y2="460" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="30" y="466" width="840" height="85" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="499" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">More feasible than extending the grid</text><text x="48" y="528.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Small-scale schemes: micro-hydel on mountain streams, or village solar systems.</text>
</svg>