<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 801" width="900" height="801" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="801" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How coal, gas and oil reach their users</text>

<rect x="30" y="120" width="840" height="176" rx="12" fill="#f9fbfb" stroke="#c9d6d4" stroke-width="2.5"/><rect x="30" y="120" width="80" height="176" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text transform="translate(78,208) rotate(-90)" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">COAL</text><rect x="130" y="130" width="168" height="156" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="140" y="150.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Thar lignite</text><text x="140" y="176.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Low-grade: high</text><text x="140" y="196.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">ash, moisture,</text><text x="140" y="216.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">sulphur</text><line x1="301" y1="208" x2="321" y2="208" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="324" y="130" width="168" height="156" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="334" y="150.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Power stations at</text><text x="334" y="170.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">or near the mine</text><text x="334" y="196.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Low heat output:</text><text x="334" y="216.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">poor for long</text><text x="334" y="236.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">transport</text><rect x="518" y="130" width="168" height="156" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="528" y="150.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Imported coal, incl.</text><text x="528" y="170.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">coking coal</text><text x="528" y="196.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Arrives by sea at</text><text x="528" y="216.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Karachi’s ports</text><line x1="689" y1="208" x2="709" y2="208" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="712" y="130" width="168" height="156" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="722" y="150.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Rail and road inland</text><text x="722" y="176.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">e.g. to iron and steel</text><text x="722" y="196.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">making</text><rect x="30" y="310" width="840" height="176" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="30" y="310" width="80" height="176" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text transform="translate(78,398) rotate(-90)" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">GAS</text><rect x="130" y="320" width="168" height="156" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="140" y="340.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Sui (found 1952)</text><text x="140" y="360.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">and fields in Sindh</text><text x="140" y="380.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">and Balochistan</text><line x1="301" y1="398" x2="321" y2="398" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="324" y="320" width="168" height="156" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="334" y="340.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Trunk pipelines</text><text x="334" y="366.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">To cities of Sindh</text><text x="334" y="386.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">and Punjab and to</text><text x="334" y="406.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Peshawar</text><rect x="518" y="320" width="168" height="156" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="528" y="340.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Areas off the</text><text x="528" y="360.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">pipeline</text><text x="528" y="386.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Rural and hilly areas</text><line x1="689" y1="398" x2="709" y2="398" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="712" y="320" width="168" height="156" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="722" y="340.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">LPG cylinders</text><text x="722" y="366.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">More expensive;</text><text x="722" y="386.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">supply can be</text><text x="722" y="406.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">irregular</text><rect x="30" y="500" width="840" height="176" rx="12" fill="#f9fbfb" stroke="#c9d6d4" stroke-width="2.5"/><rect x="30" y="500" width="80" height="176" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text transform="translate(78,588) rotate(-90)" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">OIL</text><rect x="130" y="510" width="168" height="156" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="140" y="530.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Tankers to Karachi</text><text x="140" y="556.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Most crude and</text><text x="140" y="576.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">products imported,</text><text x="140" y="596.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">mainly from the Gulf</text><line x1="301" y1="588" x2="321" y2="588" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="324" y="510" width="168" height="156" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="334" y="530.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Refined at Karachi</text><text x="334" y="556.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">or piped to</text><text x="334" y="576.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Mahmood Kot near</text><text x="334" y="596.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Multan</text><rect x="518" y="510" width="168" height="156" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="528" y="530.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Domestic crude</text><text x="528" y="556.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Potwar Plateau and</text><text x="528" y="576.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Sindh: a small part</text><text x="528" y="596.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">of demand</text><line x1="689" y1="588" x2="709" y2="588" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="712" y="510" width="168" height="156" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="722" y="530.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Rail and road</text><text x="722" y="550.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">tankers</text><text x="722" y="576.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">carry the rest inland</text><line x1="505" y1="120" x2="505" y2="676" stroke="#c9d6d4" stroke-width="2" stroke-dasharray="6 6"/><rect x="30" y="696" width="840" height="75" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="726.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">LNG imports through terminals at Port Qasim now help meet gas demand as domestic output falls</text><text x="48" y="748.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">behind.</text>
</svg>