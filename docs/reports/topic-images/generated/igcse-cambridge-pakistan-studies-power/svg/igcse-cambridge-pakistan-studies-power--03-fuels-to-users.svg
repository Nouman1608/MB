<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 716" width="900" height="716" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="716" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How coal, gas and oil reach their users</text>

<rect x="30" y="120" width="840" height="141" rx="12" fill="#f9fbfb" stroke="#c9d6d4" stroke-width="2.5"/><rect x="30" y="120" width="80" height="141" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text transform="translate(78,190.5) rotate(-90)" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">COAL</text><line x1="498" y1="126" x2="498" y2="255" stroke="#c9d6d4" stroke-width="2" stroke-dasharray="6 6"/><rect x="130" y="130" width="168" height="121" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="140" y="150.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Thar lignite</text><text x="140" y="176.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Low-grade: high</text><text x="140" y="196.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">ash, moisture,</text><text x="140" y="216.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">sulphur</text><line x1="299" y1="190.5" x2="315" y2="190.5" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="316" y="130" width="168" height="121" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="326" y="150.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Power stations at</text><text x="326" y="170.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">or near the mine</text><text x="326" y="196.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Low heat output:</text><text x="326" y="216.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">poor for long</text><text x="326" y="236.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">transport</text><rect x="512" y="130" width="168" height="121" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="522" y="150.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Imported coal, incl.</text><text x="522" y="170.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">coking coal</text><text x="522" y="196.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Arrives by sea at</text><text x="522" y="216.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Karachi’s ports</text><line x1="681" y1="190.5" x2="697" y2="190.5" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="698" y="130" width="168" height="121" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="708" y="150.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Rail and road</text><text x="708" y="176.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Carry it inland</text><rect x="30" y="275" width="840" height="121" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="30" y="275" width="80" height="121" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text transform="translate(78,335.5) rotate(-90)" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">GAS</text><line x1="498" y1="281" x2="498" y2="390" stroke="#c9d6d4" stroke-width="2" stroke-dasharray="6 6"/><rect x="130" y="285" width="168" height="101" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="140" y="305.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Sui (found 1952)</text><text x="140" y="325.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">and fields in Sindh</text><text x="140" y="345.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">and Balochistan</text><line x1="299" y1="335.5" x2="315" y2="335.5" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="316" y="285" width="168" height="101" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="326" y="305.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Trunk pipelines</text><text x="326" y="331.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">To cities of Sindh</text><text x="326" y="351.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">and Punjab and to</text><text x="326" y="371.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Peshawar</text><rect x="512" y="285" width="168" height="101" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="522" y="305.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Areas off the</text><text x="522" y="325.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">pipeline</text><text x="522" y="351.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Rural and hilly areas</text><line x1="681" y1="335.5" x2="697" y2="335.5" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="698" y="285" width="168" height="101" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="708" y="305.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">LPG cylinders</text><text x="708" y="331.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">More expensive;</text><text x="708" y="351.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">supply can be</text><text x="708" y="371.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">irregular</text><rect x="30" y="410" width="840" height="181" rx="12" fill="#f9fbfb" stroke="#c9d6d4" stroke-width="2.5"/><rect x="30" y="410" width="80" height="181" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text transform="translate(78,500.5) rotate(-90)" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">OIL</text><line x1="498" y1="416" x2="498" y2="585" stroke="#c9d6d4" stroke-width="2" stroke-dasharray="6 6"/><rect x="130" y="420" width="168" height="161" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="140" y="440.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Tankers to Karachi</text><text x="140" y="466.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Most crude and</text><text x="140" y="486.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">products imported,</text><text x="140" y="506.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">mainly from the Gulf</text><line x1="299" y1="500.5" x2="315" y2="500.5" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="316" y="420" width="168" height="161" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="326" y="440.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Karachi</text><text x="326" y="466.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Refined there, or</text><text x="326" y="486.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">piped to the refinery</text><text x="326" y="506.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">at Mahmood Kot</text><text x="326" y="526.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">near Multan; rail and</text><text x="326" y="546.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">road tankers carry</text><text x="326" y="566.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">the rest</text><rect x="512" y="420" width="168" height="161" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="522" y="440.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Domestic crude</text><text x="522" y="466.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Potwar Plateau and</text><text x="522" y="486.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Sindh: only a small</text><text x="522" y="506.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">part of demand</text><rect x="30" y="611" width="840" height="75" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="641.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">LNG imports through terminals at Port Qasim now help meet gas demand as domestic output falls</text><text x="48" y="663.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">behind.</text>
</svg>