<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" width="900" height="660" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="660" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A multi-purpose hydel scheme</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">simple cross-section, not to scale</text>
<rect x="30" y="112" width="840" height="300" rx="14" fill="#e6eef0"/><path d="M30,262 Q200,262 300,312 L430,312 L430,402 L30,402 Z" fill="#b5d3cf"/><path d="M30,192 Q150,182 220,232 L300,312 L300,412 L30,412 Z" fill="none"/><path d="M30,412 L30,352 Q200,362 420,362 L870,382 L870,412 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.5"/><path d="M430,302 L470,302 L520,366 L430,366 Z" fill="#d6d6d6" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><line x1="30" y1="262" x2="300" y2="262" stroke="#2b5a9a" stroke-width="0"/><rect x="530" y="326" width="60" height="40" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="560" y="352" font-size="22" font-weight="400" fill="#1e2a44" text-anchor="middle">⚡</text><path d="M445,342 L530,346" fill="none" stroke="#2b5a9a" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><path d="M590,362 Q700,368 860,374" fill="none" stroke="#2b5a9a" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" /><text x="140" y="302" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">reservoir</text><text x="140" y="324" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="start">stores water</text><text x="450" y="288" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">dam</text><text x="600" y="312" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">power station</text><text x="860" y="356" font-size="15" font-weight="400" fill="#2b5a9a" text-anchor="end">river flows on downstream</text><rect x="620" y="132" width="230" height="40" rx="20" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="735" y="159" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Irrigation water</text><rect x="620" y="184" width="230" height="40" rx="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="735" y="211" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Electricity</text><rect x="620" y="236" width="230" height="40" rx="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="735" y="263" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Flood control</text><text x="600" y="158" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">multi-purpose:</text><rect x="30" y="432" width="410" height="198" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="465" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Physical conditions</text><text x="48" y="493.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="493.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Narrow, deep valley in hard rock for the dam</text><text x="48" y="517.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="517.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Large, reliable flow from snowmelt and</text><text x="64" y="538.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">monsoon rain</text><text x="48" y="562.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="562.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Large basin upstream to store water</text><rect x="460" y="432" width="410" height="198" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="478" y="465" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Human conditions</text><text x="478" y="493.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="494" y="493.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Capital, often from international lenders</text><text x="478" y="517.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="494" y="517.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Technical expertise</text><text x="478" y="541.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="494" y="541.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Downstream demand for irrigation water and</text><text x="494" y="562.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">electricity</text><text x="478" y="586.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="494" y="586.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Land that can be flooded with the fewest</text><text x="494" y="607.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">people resettled</text>
</svg>