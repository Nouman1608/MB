<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" width="900" height="660" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="660" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A multi-purpose hydel scheme</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">simple cross-section, not to scale</text>
<rect x="30" y="112" width="840" height="300" rx="14" fill="#e6eef0"/><path d="M30,282 L440,282 L440,374 L30,352 Z" fill="#b5d3cf"/><path d="M30,282 L440,282" fill="none" stroke="#2b5a9a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><path d="M30,352 L440,374 L870,380 L870,412 L30,412 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><path d="M520,374 L866,378" fill="none" stroke="#2b5a9a" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" /><path d="M430,262 L462,262 L520,378 L430,374 Z" fill="#d6d6d6" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><path d="M440,350 L540,358" fill="none" stroke="#2b5a9a" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><rect x="530" y="326" width="64" height="44" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="160" y="326" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">reservoir stores water</text><text x="446" y="250" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">dam</text><text x="604" y="342" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">power station</text><text x="860" y="402" font-size="15" font-weight="600" fill="#2b5a9a" text-anchor="end">river flows on downstream</text><rect x="620" y="130" width="230" height="40" rx="20" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="735" y="157" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Irrigation water</text><rect x="620" y="180" width="230" height="40" rx="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="735" y="207" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Electricity</text><rect x="620" y="230" width="230" height="40" rx="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="735" y="257" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Flood control</text><text x="606" y="156" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">multi-purpose:</text><rect x="30" y="432" width="410" height="198" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="465" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Physical conditions</text><text x="48" y="493.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="493.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Narrow, deep valley in hard rock for the dam</text><text x="48" y="517.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="517.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Large, reliable flow from snowmelt and</text><text x="64" y="538.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">monsoon rain</text><text x="48" y="562.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="562.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Large basin upstream to store water</text><rect x="460" y="432" width="410" height="198" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="478" y="465" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Human conditions</text><text x="478" y="493.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="494" y="493.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Capital, often from international lenders</text><text x="478" y="517.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="494" y="517.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Technical expertise</text><text x="478" y="541.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="494" y="541.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Downstream demand for irrigation water and</text><text x="494" y="562.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">electricity</text><text x="478" y="586.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="494" y="586.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Land that can be flooded with the fewest</text><text x="494" y="607.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">people resettled</text>
</svg>