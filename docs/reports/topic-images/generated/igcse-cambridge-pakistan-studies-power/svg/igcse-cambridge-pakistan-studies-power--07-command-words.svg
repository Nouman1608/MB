<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Answering Power questions</text>

<rect x="90" y="112" width="600" height="88" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="108" y="146.7" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Describe</text><text x="108" y="177.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Name a source, a place and a fact.</text><circle cx="56" cy="156" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="56" y="164.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="180" y="214" width="600" height="88" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="198" y="248.7" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Explain</text><text x="198" y="279.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Link a cause to an effect with “because” or “so”.</text><circle cx="146" cy="258" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="146" y="266.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="270" y="316" width="600" height="110" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="288" y="350.7" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Evaluate / assess</text><text x="288" y="381.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Give advantages and disadvantages, refer to Pakistan, then reach a</text><text x="288" y="403.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">judgement. Often the final part.</text><circle cx="236" cy="371" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="236" y="379.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text>
