<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 585" width="900" height="585" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="585" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">From structured to unstructured interviews</text>

<rect x="30" y="200" width="268" height="230" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,261.25 L31.25,215.25 Q31.25,201.25 45.25,201.25 L282.75,201.25 Q296.75,201.25 296.75,215.25 L296.75,261.25 Z" fill="#b5d3cf"/><text x="164" y="240" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Structured</text><text x="164" y="290" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="middle">fixed questions in a fixed</text><text x="164" y="311" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="middle">order</text><text x="48" y="336" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Clarification possible;</text><text x="48" y="358" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">interviewer effect; limited</text><text x="48" y="380" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">depth</text><rect x="316" y="200" width="268" height="230" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M317.25,261.25 L317.25,215.25 Q317.25,201.25 331.25,201.25 L568.75,201.25 Q582.75,201.25 582.75,215.25 L582.75,261.25 Z" fill="#dce9e7"/><text x="450" y="240" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Semi-structured</text><text x="450" y="290" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="middle">core questions plus</text><text x="450" y="311" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="middle">follow-ups</text><text x="334" y="336" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Combines comparability with</text><text x="334" y="358" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">flexibility</text><rect x="602" y="200" width="268" height="230" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M603.25,261.25 L603.25,215.25 Q603.25,201.25 617.25,201.25 L854.75,201.25 Q868.75,201.25 868.75,215.25 L868.75,261.25 Z" fill="#f2e7b8"/><text x="736" y="240" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Unstructured</text><text x="736" y="290" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="middle">a guided conversation</text><text x="620" y="336" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Rapport and depth (Oakley,</text><text x="620" y="358" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">1981); time, cost, small</text><text x="620" y="380" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">samples, hard to compare</text><defs><linearGradient id="rv" x1="0" x2="1"><stop offset="0" stop-color="#b5d3cf"/><stop offset="1" stop-color="#f2e7b8"/></linearGradient></defs><rect x="30" y="110" width="840" height="64" rx="32" fill="url(#rv)" stroke="#1e2a44" stroke-width="2.5"/><text x="60" y="150" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">More comparable, more reliable</text><text x="840" y="150" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">More depth, more valid</text><rect x="30" y="450" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="486" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Group interviews</text><text x="56" y="515" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Reveal how views are formed in interaction, but dominant voices and peer pressure can</text><text x="56" y="537" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">distort answers.</text>
</svg>