<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 646" width="900" height="646" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="646" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four types of data</text>

<rect x="210" y="108" width="322" height="54" rx="12" fill="#1e2a44"/><text x="371" y="136" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">Quantitative</text><text x="371" y="155" font-size="15" font-weight="400" fill="#ffffff" text-anchor="middle">numbers</text><rect x="540" y="108" width="322" height="54" rx="12" fill="#1e2a44"/><text x="701" y="136" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">Qualitative</text><text x="701" y="155" font-size="15" font-weight="400" fill="#ffffff" text-anchor="middle">words, images, meanings</text><rect x="30" y="170" width="172" height="170" rx="12" fill="#1e2a44"/><text x="116" y="251" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">Primary</text><text x="116" y="275" font-size="15" font-weight="400" fill="#ffffff" text-anchor="middle">collected by the</text><text x="116" y="295" font-size="15" font-weight="400" fill="#ffffff" text-anchor="middle">researcher</text><rect x="30" y="348" width="172" height="170" rx="12" fill="#1e2a44"/><text x="116" y="429" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">Secondary</text><text x="116" y="453" font-size="15" font-weight="400" fill="#ffffff" text-anchor="middle">already exists</text><rect x="210" y="170" width="322" height="170" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><circle cx="237" cy="206.06" r="4.5" fill="#1e2a44"/><text x="250" y="212" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Closed-question questionnaire</text><circle cx="237" cy="240.06" r="4.5" fill="#1e2a44"/><text x="250" y="246" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Structured interview</text><circle cx="237" cy="274.06" r="4.5" fill="#1e2a44"/><text x="250" y="280" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Experiment</text><rect x="540" y="170" width="322" height="170" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><circle cx="567" cy="221.06" r="4.5" fill="#1e2a44"/><text x="580" y="227" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Unstructured interview</text><circle cx="567" cy="255.06" r="4.5" fill="#1e2a44"/><text x="580" y="261" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Participant observation</text><rect x="210" y="348" width="322" height="170" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><circle cx="237" cy="399.06" r="4.5" fill="#1e2a44"/><text x="250" y="405" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Official statistics</text><circle cx="237" cy="433.06" r="4.5" fill="#1e2a44"/><text x="250" y="439" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Existing survey data</text><rect x="540" y="348" width="322" height="170" rx="12" fill="#efdfa8" stroke="#1e2a44" stroke-width="2"/><circle cx="567" cy="384.06" r="4.5" fill="#1e2a44"/><text x="580" y="390" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Diaries, letters</text><circle cx="567" cy="418.06" r="4.5" fill="#1e2a44"/><text x="580" y="424" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Social media posts</text><circle cx="567" cy="452.06" r="4.5" fill="#1e2a44"/><text x="580" y="458" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">News articles</text><rect x="30" y="540" width="840" height="82" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="576" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Quantitative data suits measuring patterns and testing hypotheses; qualitative data suits</text><text x="56" y="598" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">understanding meanings. Many studies combine both.</text>
</svg>