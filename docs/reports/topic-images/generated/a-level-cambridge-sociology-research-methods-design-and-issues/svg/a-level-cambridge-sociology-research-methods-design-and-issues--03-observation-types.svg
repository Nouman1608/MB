<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 476" width="900" height="476" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="476" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Choosing a type of observation</text>

<line x1="60" y1="146" x2="840" y2="146" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><text x="60" y="130" font-size="16" font-weight="600" fill="#4a5568" text-anchor="start">less involvement</text><text x="840" y="130" font-size="16" font-weight="600" fill="#4a5568" text-anchor="end">more involvement and more ethical risk</text><rect x="30" y="176" width="269.3333333333333" height="274" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,226 L31.25,190.25 Q31.25,177.25 44.25,177.25 L285.0833333333333,177.25 Q298.0833333333333,177.25 298.0833333333333,190.25 L298.0833333333333,226 Z" fill="#dce9e7"/><line x1="31.25" y1="226" x2="298.0833333333333" y2="226" stroke="#c9d6d4" stroke-width="2"/><text x="164.66666666666666" y="206.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Non-participant</text><text x="44" y="257.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">watches without joining in</text><circle cx="49" cy="278.92" r="4.5" fill="#2e6b62"/><text x="62" y="284.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Strength:</tspan> less risk of</text><text x="62" y="305.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“going native”</text><circle cx="49" cy="328.92" r="4.5" fill="#2e6b62"/><text x="62" y="334.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Limitation:</tspan> less insight</text><text x="62" y="355.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">into meaning</text><rect x="315.3333333333333" y="176" width="269.3333333333333" height="274" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M316.5833333333333,226 L316.5833333333333,190.25 Q316.5833333333333,177.25 329.5833333333333,177.25 L570.4166666666666,177.25 Q583.4166666666666,177.25 583.4166666666666,190.25 L583.4166666666666,226 Z" fill="#b5d3cf"/><line x1="316.5833333333333" y1="226" x2="583.4166666666666" y2="226" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="206.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Overt participant</text><text x="329.3333333333333" y="257.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">joins in; the group knows</text><circle cx="334.3333333333333" cy="278.92" r="4.5" fill="#2e6b62"/><text x="347.3333333333333" y="284.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Strength:</tspan> ethical</text><circle cx="334.3333333333333" cy="307.92" r="4.5" fill="#2e6b62"/><text x="347.3333333333333" y="313.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Limitation:</tspan> the group may</text><text x="347.3333333333333" y="334.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">change its behaviour</text><circle cx="334.3333333333333" cy="357.92" r="4.5" fill="#2e6b62"/><text x="347.3333333333333" y="363.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Whyte (1943): key informant</text><text x="347.3333333333333" y="384.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“Doc”</text><rect x="600.6666666666666" y="176" width="269.3333333333333" height="274" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.9166666666666,226 L601.9166666666666,190.25 Q601.9166666666666,177.25 614.9166666666666,177.25 L855.75,177.25 Q868.75,177.25 868.75,190.25 L868.75,226 Z" fill="#f2e7b8"/><line x1="601.9166666666666" y1="226" x2="868.75" y2="226" stroke="#c9d6d4" stroke-width="2"/><text x="735.3333333333333" y="206.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Covert participant</text><text x="614.6666666666666" y="257.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">joins in secretly</text><circle cx="619.6666666666666" cy="278.92" r="4.5" fill="#2e6b62"/><text x="632.6666666666666" y="284.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Strength:</tspan> access to closed</text><text x="632.6666666666666" y="305.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">or deviant groups; natural</text><text x="632.6666666666666" y="326.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">behaviour</text><circle cx="619.6666666666666" cy="349.92" r="4.5" fill="#2e6b62"/><text x="632.6666666666666" y="355.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Limitation:</tspan> deception and</text><text x="632.6666666666666" y="376.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">risk</text><circle cx="619.6666666666666" cy="399.92" r="4.5" fill="#2e6b62"/><text x="632.6666666666666" y="405.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Humphreys (1970): ethical</text><text x="632.6666666666666" y="426.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">controversy</text>
</svg>