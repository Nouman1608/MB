<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 745" width="900" height="745" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="745" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Eight stages of research design</text>

<rect x="30" y="120" width="192" height="198" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><circle cx="58" cy="150" r="17" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="58" y="156.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="44" y="194" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Research strategy</text><text x="44" y="220" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">survey, case study,</text><text x="44" y="241" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">ethnography</text><line x1="224" y1="219" x2="244" y2="219" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="246" y="120" width="192" height="198" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><circle cx="274" cy="150" r="17" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="274" y="156.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="260" y="194" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Questions and</text><text x="260" y="216" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">hypotheses</text><text x="260" y="242" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">a hypothesis is a</text><text x="260" y="263" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">testable prediction</text><line x1="440" y1="219" x2="460" y2="219" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="462" y="120" width="192" height="198" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><circle cx="490" cy="150" r="17" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="490" y="156.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="476" y="194" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Operationalisation</text><text x="476" y="220" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">make a concept</text><text x="476" y="241" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">measurable</text><line x1="656" y1="219" x2="676" y2="219" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="678" y="120" width="192" height="198" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><circle cx="706" cy="150" r="17" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="706" y="156.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="692" y="194" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Sampling frame</text><text x="692" y="220" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the list the sample</text><text x="692" y="241" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">is drawn from</text><line x1="774" y1="322" x2="774" y2="384" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="678" y="388" width="192" height="198" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><circle cx="706" cy="418" r="17" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="706" y="424.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="692" y="462" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Sampling</text><text x="692" y="484" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">technique</text><text x="692" y="510" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">random, systematic,</text><text x="692" y="531" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">stratified, quota,</text><text x="692" y="552" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">snowball,</text><text x="692" y="573" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">opportunity</text><line x1="676" y1="487" x2="656" y2="487" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="462" y="388" width="192" height="198" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><circle cx="490" cy="418" r="17" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="490" y="424.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">6</text><text x="476" y="462" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Pilot study</text><text x="476" y="488" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">small trial run of</text><text x="476" y="509" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">questions, timing,</text><text x="476" y="530" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">access</text><line x1="460" y1="487" x2="440" y2="487" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="246" y="388" width="192" height="198" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><circle cx="274" cy="418" r="17" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="274" y="424.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">7</text><text x="260" y="462" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Conducting</text><text x="260" y="484" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">research</text><text x="260" y="510" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">collect data; manage</text><text x="260" y="531" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">access and ethics</text><line x1="244" y1="487" x2="224" y2="487" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="388" width="192" height="198" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><circle cx="58" cy="418" r="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="58" y="424.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">8</text><text x="44" y="462" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Interpreting</text><text x="44" y="484" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">results</text><text x="44" y="510" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">analyse, check for</text><text x="44" y="531" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">bias, conclude</text><rect x="30" y="610" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="646" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Link each stage to a concept</text><text x="56" y="675" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A pilot study improves validity; a stratified sample improves representativeness. Linking</text><text x="56" y="697" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">stages to concepts turns description into analysis.</text>
</svg>