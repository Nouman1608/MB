<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 576" width="900" height="576" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="576" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How useful are secondary sources?</text>

<text x="375" y="136" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">Strength</text><text x="705" y="136" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">Limitation</text><rect x="30" y="150" width="200" height="120" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="130" y="204" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Official</text><text x="130" y="228" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">statistics</text><rect x="240" y="150" width="270" height="120" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><rect x="240" y="150" width="8" height="120" rx="3" fill="#2e6b62"/><text x="260" y="204" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Cheap, large-scale,</text><text x="260" y="226" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">comparable over time</text><rect x="520" y="150" width="350" height="120" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><rect x="520" y="150" width="8" height="120" rx="3" fill="#b5602e"/><text x="540" y="182" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Reflect agencies’ definitions and</text><text x="540" y="204" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">recording; Atkinson (1978): coroners</text><text x="540" y="226" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">decide what counts as suicide</text><rect x="30" y="280" width="200" height="76" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="130" y="324" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Personal documents</text><rect x="240" y="280" width="270" height="76" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><rect x="240" y="280" width="8" height="76" rx="3" fill="#2e6b62"/><text x="260" y="323" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Rich insight into meaning</text><rect x="520" y="280" width="350" height="76" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><rect x="520" y="280" width="8" height="76" rx="3" fill="#b5602e"/><text x="540" y="312" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">May be unrepresentative and written</text><text x="540" y="334" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">for an audience</text><rect x="30" y="366" width="200" height="98" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="130" y="421" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Digital content</text><rect x="240" y="366" width="270" height="98" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><rect x="240" y="366" width="8" height="98" rx="3" fill="#2e6b62"/><text x="260" y="409" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Plentiful and often</text><text x="260" y="431" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">unprompted</text><rect x="520" y="366" width="350" height="98" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><rect x="520" y="366" width="8" height="98" rx="3" fill="#b5602e"/><text x="540" y="398" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Authenticity; who is online; ethics</text><text x="540" y="420" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">of using public posts without consent</text><rect x="30" y="474" width="200" height="76" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="130" y="518" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Media sources</text><rect x="240" y="474" width="270" height="76" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><rect x="240" y="474" width="8" height="76" rx="3" fill="#2e6b62"/><text x="260" y="517" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Reveal how issues are framed</text><rect x="520" y="474" width="350" height="76" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><rect x="520" y="474" width="8" height="76" rx="3" fill="#b5602e"/><text x="540" y="506" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Show the media’s agenda as much as</text><text x="540" y="528" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">the event (Bad News, 1976)</text>
</svg>