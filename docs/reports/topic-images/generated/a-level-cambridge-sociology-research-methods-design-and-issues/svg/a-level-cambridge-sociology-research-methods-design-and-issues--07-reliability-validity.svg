<rect width="900" height="651" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Assessing the value of a method</text>

<defs><linearGradient id="rv2" x1="0" x2="1"><stop offset="0" stop-color="#b5d3cf"/><stop offset="1" stop-color="#f2e7b8"/></linearGradient></defs><rect x="30" y="110" width="840" height="64" rx="32" fill="url(#rv2)" stroke="#1e2a44" stroke-width="2.5"/><text x="60" y="150" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Positivist: quantitative</text><text x="840" y="150" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">Interpretivist: qualitative</text><rect x="30" y="196" width="410" height="300" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,246 L31.25,210.25 Q31.25,197.25 44.25,197.25 L425.75,197.25 Q438.75,197.25 438.75,210.25 L438.75,246 Z" fill="#b5d3cf"/><line x1="31.25" y1="246" x2="438.75" y2="246" stroke="#c9d6d4" stroke-width="2"/><text x="235" y="226.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Higher reliability</text><text x="235" y="278" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">same results if repeated; representativeness</text><circle cx="59" cy="310.06" r="4.5" fill="#2e6b62"/><text x="72" y="316" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Questionnaires</text><circle cx="59" cy="346.06" r="4.5" fill="#2e6b62"/><text x="72" y="352" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Structured interviews</text><circle cx="59" cy="382.06" r="4.5" fill="#2e6b62"/><text x="72" y="388" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Official statistics</text><circle cx="59" cy="418.06" r="4.5" fill="#2e6b62"/><text x="72" y="424" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Large random or stratified surveys</text><rect x="460" y="196" width="410" height="300" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M461.25,246 L461.25,210.25 Q461.25,197.25 474.25,197.25 L855.75,197.25 Q868.75,197.25 868.75,210.25 L868.75,246 Z" fill="#f2e7b8"/><line x1="461.25" y1="246" x2="868.75" y2="246" stroke="#c9d6d4" stroke-width="2"/><text x="665" y="226.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Higher validity</text><text x="665" y="278" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">a true picture of what is measured</text><circle cx="489" cy="310.06" r="4.5" fill="#2e6b62"/><text x="502" y="316" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Unstructured interviews</text><circle cx="489" cy="346.06" r="4.5" fill="#2e6b62"/><text x="502" y="352" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Participant observation</text><rect x="30" y="516" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="552" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Objectivity</text><text x="56" y="581" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Freedom from the researcher’s own values: claimed for standardised methods, though this is</text><text x="56" y="603" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">contested. Ethics: is the research morally acceptable?</text>
</svg>