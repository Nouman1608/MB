<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What shapes the choice of method?</text>

<rect x="30" y="108" width="269.3333333333333" height="218" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,158 L31.25,122.25 Q31.25,109.25 44.25,109.25 L285.0833333333333,109.25 Q298.0833333333333,109.25 298.0833333333333,122.25 L298.0833333333333,158 Z" fill="#b5d3cf"/><line x1="31.25" y1="158" x2="298.0833333333333" y2="158" stroke="#c9d6d4" stroke-width="2"/><text x="164.66666666666666" y="138.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Theoretical</text><circle cx="49" cy="184.54" r="4.5" fill="#2e6b62"/><text x="62" y="190.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Positivists prefer</text><text x="62" y="212.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">reliable, quantitative</text><text x="62" y="234.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">methods</text><circle cx="49" cy="258.53999999999996" r="4.5" fill="#2e6b62"/><text x="62" y="264.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Interpretivists prefer</text><text x="62" y="286.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">valid, qualitative methods</text><rect x="315.3333333333333" y="108" width="269.3333333333333" height="218" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M316.5833333333333,158 L316.5833333333333,122.25 Q316.5833333333333,109.25 329.5833333333333,109.25 L570.4166666666666,109.25 Q583.4166666666666,109.25 583.4166666666666,122.25 L583.4166666666666,158 Z" fill="#dce9e7"/><line x1="316.5833333333333" y1="158" x2="583.4166666666666" y2="158" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="138.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Practical</text><circle cx="334.3333333333333" cy="184.54" r="4.5" fill="#2e6b62"/><text x="347.3333333333333" y="190.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Time and cost</text><circle cx="334.3333333333333" cy="214.54" r="4.5" fill="#2e6b62"/><text x="347.3333333333333" y="220.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Access</text><circle cx="334.3333333333333" cy="244.54" r="4.5" fill="#2e6b62"/><text x="347.3333333333333" y="250.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The researcher’s skills</text><text x="347.3333333333333" y="272.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">and personal</text><text x="347.3333333333333" y="294.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">characteristics</text><rect x="600.6666666666666" y="108" width="269.3333333333333" height="218" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.9166666666666,158 L601.9166666666666,122.25 Q601.9166666666666,109.25 614.9166666666666,109.25 L855.75,109.25 Q868.75,109.25 868.75,122.25 L868.75,158 Z" fill="#f2e7b8"/><line x1="601.9166666666666" y1="158" x2="868.75" y2="158" stroke="#c9d6d4" stroke-width="2"/><text x="735.3333333333333" y="138.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Ethical</text><circle cx="619.6666666666666" cy="184.54" r="4.5" fill="#2e6b62"/><text x="632.6666666666666" y="190.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Informed consent</text><circle cx="619.6666666666666" cy="214.54" r="4.5" fill="#2e6b62"/><text x="632.6666666666666" y="220.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Confidentiality</text><circle cx="619.6666666666666" cy="244.54" r="4.5" fill="#2e6b62"/><text x="632.6666666666666" y="250.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Avoiding harm and</text><text x="632.6666666666666" y="272.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">deception</text><circle cx="619.6666666666666" cy="296.53999999999996" r="4.5" fill="#2e6b62"/><text x="632.6666666666666" y="302.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Vulnerable participants</text><line x1="165" y1="330" x2="364.5" y2="386" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="450" y1="330" x2="450" y2="386" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="735" y1="330" x2="535.5" y2="386" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="230" y="392" width="440" height="70" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="435" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Choice of topic and method</text><rect x="30" y="486" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="522" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Topic choice also depends on</text><text x="56" y="551" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Values, funding, and what is fashionable or newsworthy.</text>
</svg>