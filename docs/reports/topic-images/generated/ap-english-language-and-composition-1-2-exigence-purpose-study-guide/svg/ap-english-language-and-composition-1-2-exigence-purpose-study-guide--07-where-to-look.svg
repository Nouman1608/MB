<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Where to look under exam conditions</text>

<rect x="330" y="106" width="240" height="400" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" /><rect x="346" y="120" width="208" height="26" rx="4" fill="#f2e7b8"/><text x="450" y="138" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle" xml:space="preserve">source line: date, place</text><rect x="342" y="160" width="216" height="80" rx="6" fill="#dce9e7"/><rect x="350" y="172" width="200" height="7" rx="3" fill="#2e6b62"/><rect x="350" y="188" width="200" height="7" rx="3" fill="#2e6b62"/><rect x="350" y="204" width="200" height="7" rx="3" fill="#2e6b62"/><rect x="350" y="220" width="120" height="7" rx="3" fill="#2e6b62"/><rect x="350" y="256" width="200" height="7" rx="3" fill="#c9d6d4"/><rect x="350" y="272" width="200" height="7" rx="3" fill="#c9d6d4"/><rect x="350" y="288" width="200" height="7" rx="3" fill="#c9d6d4"/><rect x="350" y="304" width="120" height="7" rx="3" fill="#c9d6d4"/><rect x="350" y="332" width="200" height="7" rx="3" fill="#c9d6d4"/><rect x="350" y="348" width="200" height="7" rx="3" fill="#c9d6d4"/><rect x="350" y="364" width="200" height="7" rx="3" fill="#c9d6d4"/><rect x="350" y="380" width="120" height="7" rx="3" fill="#c9d6d4"/><rect x="342" y="402" width="216" height="90" rx="6" fill="#dce9e7"/><rect x="350" y="414" width="200" height="7" rx="3" fill="#2e6b62"/><rect x="350" y="430" width="200" height="7" rx="3" fill="#2e6b62"/><rect x="350" y="446" width="200" height="7" rx="3" fill="#2e6b62"/><rect x="350" y="462" width="120" height="7" rx="3" fill="#2e6b62"/><rect x="470" y="442" width="70" height="20" rx="4" fill="#d4b02e"/><rect x="30" y="106" width="270" height="115.12" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="44" y="134.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Use the source line</text><text x="44" y="161.35999999999999" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">A date, a place or a publication</text><text x="44" y="182.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">often supplies the exigence or</text><text x="44" y="203.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">context.</text><line x1="302" y1="142" x2="338" y2="133" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="235.12" width="270" height="96.63999999999999" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="44" y="263.52" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Read the first paragraph</text><text x="44" y="287.28" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">first</text><text x="44" y="314.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">It often signals the exigence.</text><line x1="302" y1="271.12" x2="338" y2="200" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="600" y="256" width="270" height="94" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="614" y="284.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Read the last paragraph</text><text x="614" y="311.36" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">It often states what the writer</text><text x="614" y="332.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">wants the audience to do.</text><line x1="598" y1="292" x2="562" y2="406" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="600" y="406" width="270" height="115.12" rx="14" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2.5" /><text x="614" y="434.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Look at request verbs</text><text x="614" y="461.36" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“Please sign”, “we must”, “let</text><text x="614" y="482.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">us resolve” signal an action</text><text x="614" y="503.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">purpose.</text><line x1="598" y1="442" x2="562" y2="452" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="526" width="840" height="76.88" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="450" y="558.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve"><tspan font-weight="700">Do</tspan> <tspan font-weight="700">not</tspan> <tspan font-weight="700">stop</tspan> <tspan font-weight="700">at</tspan> <tspan font-weight="700">the</tspan> <tspan font-weight="700">topic.</tspan> If your purpose could be written without mentioning the audience, add</text><text x="450" y="580.8900000000001" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">the audience.</text>
</svg>