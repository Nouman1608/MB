<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 629" width="900" height="629" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="629" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Purpose = verb + target</text>

<text x="160" y="104" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">VERB</text><text x="560" y="104" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle" xml:space="preserve">TARGET (the audience and the effect)</text><rect x="60" y="114" width="200" height="44" rx="22" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="160" y="143" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">persuade</text><text x="290" y="145" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">+</text><rect x="320" y="114" width="480" height="44" rx="22" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="560" y="143" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">the council to reverse a cut</text><rect x="60" y="172" width="200" height="44" rx="22" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="160" y="201" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">warn</text><text x="290" y="203" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">+</text><rect x="320" y="172" width="480" height="44" rx="22" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="560" y="201" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">residents of a hazard</text><rect x="60" y="230" width="200" height="44" rx="22" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="160" y="259" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">reassure</text><text x="290" y="261" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">+</text><rect x="320" y="230" width="480" height="44" rx="22" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="560" y="259" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">anxious parents</text><rect x="60" y="288" width="200" height="44" rx="22" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="160" y="317" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">mobilise</text><text x="290" y="319" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">+</text><rect x="320" y="288" width="480" height="44" rx="22" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="560" y="317" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">volunteers to act</text><rect x="30" y="384" width="840" height="43.120000000000005" fill="#dce9e7"/><text x="42" y="409.12" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Weak: names a topic</text><text x="342" y="409.12" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Strong: names the effect on the audience</text><rect x="30" y="427.12" width="840" height="43.120000000000005" fill="#ffffff"/><rect x="30" y="427.12" width="300" height="43.120000000000005" fill="#fbf3ee"/><text x="42" y="452.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“To talk about school uniforms.”</text><text x="342" y="452.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“To persuade parents to support a change to the uniform policy.”</text><line x1="30" y1="427.12" x2="870" y2="427.12" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="470.24" width="840" height="64.24000000000001" fill="#ffffff"/><rect x="30" y="470.24" width="300" height="64.24000000000001" fill="#fbf3ee"/><text x="42" y="495.36" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“To discuss the flood.”</text><text x="342" y="495.36" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“To reassure residents that the repair schedule is realistic, and to</text><text x="342" y="516.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">ask them to report new damage.”</text><line x1="30" y1="470.24" x2="870" y2="470.24" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="534.48" width="840" height="64.24000000000001" fill="#ffffff"/><rect x="30" y="534.48" width="300" height="64.24000000000001" fill="#fbf3ee"/><text x="42" y="559.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“To show how bad litter is.”</text><text x="342" y="559.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“To shame readers into joining the clean-up by describing what</text><text x="342" y="580.72" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">the beach looked like at dawn.”</text><line x1="30" y1="534.48" x2="870" y2="534.48" stroke="#c9d6d4" stroke-width="1.5"/><line x1="330" y1="384" x2="330" y2="598.72" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="384" width="840" height="214.72000000000003" rx="12" fill="none" stroke="#1e2a44" stroke-width="2.5" />
</svg>