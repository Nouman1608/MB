<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 582" width="900" height="582" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="582" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four kinds of exigence</text>

<rect x="30" y="96" width="410" height="119.28" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><rect x="30" y="96" width="10" height="119.28" rx="5" fill="#d4b02e"/><text x="54" y="136" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Event</text><text x="54" y="164.85" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">a vote, a disaster, an anniversary, a</text><text x="54" y="187.29" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">ceremony, a court case</text><rect x="460" y="96" width="410" height="119.28" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><rect x="460" y="96" width="10" height="119.28" rx="5" fill="#d4b02e"/><text x="484" y="136" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Problem</text><text x="484" y="164.85" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">a shortage, an injustice, a rising cost</text><rect x="30" y="235.28" width="410" height="119.28" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><rect x="30" y="235.28" width="10" height="119.28" rx="5" fill="#d4b02e"/><text x="54" y="275.28" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Question or controversy</text><text x="54" y="304.12999999999994" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“Should the school day start later?”</text><rect x="460" y="235.28" width="410" height="119.28" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><rect x="460" y="235.28" width="10" height="119.28" rx="5" fill="#d4b02e"/><text x="484" y="275.28" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Need or opportunity</text><text x="484" y="304.12999999999994" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">a deadline, an invitation to speak, a chance</text><text x="484" y="326.56999999999994" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">to change a decision</text><text x="450" y="384.56" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Where is the exigence in the text?</text><rect x="30" y="404.56" width="390" height="146.88" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="225" y="469.58000000000004" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Named</text><text x="225" y="498.43" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">“Last Tuesday the council voted...”</text><rect x="480" y="404.56" width="390" height="146.88" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="675" y="438.56" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Implicit</text><text x="675" y="466.56" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Infer it from dates, references to recent</text><text x="675" y="487.68" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">events, or a question the text answers</text><text x="675" y="508.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">without repeating. Say so and point to the</text><text x="675" y="529.92" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">clue.</text><text x="450" y="485" font-size="19" font-weight="700" fill="#4a5568" text-anchor="middle" xml:space="preserve">or</text>
</svg>