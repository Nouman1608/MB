<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 428" width="900" height="428" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="428" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">From exigence to choices</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">A flood notice from a parish clerk</text>
<rect x="30" y="122" width="250" height="174.60000000000002" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="155" y="156" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="middle" xml:space="preserve">Exigence</text><text x="155" y="184.85" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve"><tspan font-style="italic">what</tspan> <tspan font-style="italic">happened</tspan> <tspan font-style="italic">or</tspan> <tspan font-style="italic">is</tspan></text><text x="155" y="207.29" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve"><tspan font-style="italic">wrong</tspan></text><text x="155" y="229.73" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve"></text><text x="155" y="252.17000000000002" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">A flood damages the</text><text x="155" y="274.61" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">village’s road.</text><line x1="284" y1="209.3" x2="321" y2="209.3" stroke="#1e2a44" stroke-width="4.5" marker-end="url(#ah)"/><rect x="325" y="122" width="250" height="174.60000000000002" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="450" y="156" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">Writer’s goal</text><text x="450" y="184.85" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve"><tspan font-style="italic">what</tspan> <tspan font-style="italic">should</tspan> <tspan font-style="italic">change</tspan></text><text x="450" y="207.29" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve"></text><text x="450" y="229.73" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Residents report new</text><text x="450" y="252.17000000000002" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">cracks quickly so repairs</text><text x="450" y="274.61" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">can be prioritised.</text><line x1="579" y1="209.3" x2="616" y2="209.3" stroke="#1e2a44" stroke-width="4.5" marker-end="url(#ah)"/><rect x="620" y="122" width="250" height="174.60000000000002" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" /><text x="745" y="156" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Choices</text><text x="745" y="184.85" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve"><tspan font-style="italic">what</tspan> <tspan font-style="italic">will</tspan> <tspan font-style="italic">bring</tspan> <tspan font-style="italic">it</tspan> <tspan font-style="italic">about</tspan></text><text x="745" y="207.29" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve"></text><text x="745" y="229.73" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Short notice, phone</text><text x="745" y="252.17000000000002" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">number listed first, plain</text><text x="745" y="274.61" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">non-technical language.</text><rect x="30" y="320.6" width="840" height="76.88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="450" y="353.05" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Say what the exigence is and what the audience must do or think because of it: the purpose</text><text x="450" y="375.49" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">often follows, and the choices serve it.</text>
</svg>