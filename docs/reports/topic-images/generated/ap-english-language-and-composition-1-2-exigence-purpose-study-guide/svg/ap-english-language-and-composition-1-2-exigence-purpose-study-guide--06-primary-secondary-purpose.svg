<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 574" width="900" height="574" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="574" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Primary and secondary purpose</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">The Elm Court notice</text>
<text x="30" y="130" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Notice to residents of Elm Court</text><rect x="30" y="146" width="470" height="75.52000000000001" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" /><text x="46" y="177.76999999999998" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">On Monday the water company found a leak under</text><text x="46" y="200.20999999999998" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">the car park.</text><rect x="560" y="146" width="310" height="75.52000000000001" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" /><text x="574" y="176" font-size="20" font-weight="700" fill="#b5602e" text-anchor="start" xml:space="preserve">Exigence</text><text x="574" y="204" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">the discovery of the leak: an event</text><line x1="502" y1="183.76" x2="556" y2="183.76" stroke="#b5602e" stroke-width="3"/><rect x="30" y="237.52" width="470" height="117.76000000000002" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="46" y="279.19" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">The car park will be closed from Thursday for at</text><text x="46" y="301.63" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">least two weeks. Please do not park on Elm Road,</text><text x="46" y="324.07" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">which must stay clear for the repair lorries.</text><rect x="560" y="237.52" width="310" height="117.76000000000002" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5" /><text x="574" y="267.52" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start" xml:space="preserve">Primary purpose</text><text x="574" y="295.52000000000004" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">direct residents to change</text><text x="574" y="316.64000000000004" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">behaviour: most space, most direct</text><text x="574" y="337.76000000000005" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">language</text><line x1="502" y1="296.40000000000003" x2="556" y2="296.40000000000003" stroke="#2e6b62" stroke-width="3"/><rect x="30" y="371.28000000000003" width="470" height="96.63999999999999" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="46" y="402.39000000000004" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">A shuttle van will take anyone with limited mobility to</text><text x="46" y="424.83000000000004" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">and from the main gate. Thank you for your</text><text x="46" y="447.27000000000004" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">patience.</text><rect x="560" y="371.28000000000003" width="310" height="96.63999999999999" rx="14" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5" /><text x="574" y="401.28000000000003" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="start" xml:space="preserve">Secondary purpose</text><text x="574" y="429.28000000000003" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">reassure and keep goodwill: works</text><text x="574" y="450.40000000000003" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">through tone, comes at the end</text><line x1="502" y1="419.6" x2="556" y2="419.6" stroke="#8a6d0d" stroke-width="3"/><rect x="30" y="487.92" width="840" height="76.88000000000005" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="7 5"/><text x="450" y="520.37" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve"><tspan font-weight="700" fill="#b5602e">Trap:</tspan> “to inform residents about a leak” confuses the trigger with the purpose, because the leak</text><text x="450" y="542.8100000000001" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">is the exigence.</text>
</svg>