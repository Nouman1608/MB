<rect width="900" height="438" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Two questions that point opposite ways</text>

<rect x="30" y="96" width="380" height="100.64000000000001" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="46" y="128" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="start" xml:space="preserve">Exigence</text><text x="46" y="156" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700">Why</tspan> <tspan font-weight="700">was</tspan> <tspan font-weight="700">this</tspan> <tspan font-weight="700">written</tspan> <tspan font-weight="700">now?</tspan> The event,</text><text x="46" y="177.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">problem, question or need that provoked it.</text><rect x="490" y="96" width="380" height="100.64000000000001" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="506" y="128" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start" xml:space="preserve">Purpose</text><text x="506" y="156" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700">What</tspan> <tspan font-weight="700">does</tspan> <tspan font-weight="700">the</tspan> <tspan font-weight="700">writer</tspan> <tspan font-weight="700">hope</tspan> <tspan font-weight="700">to</tspan> <tspan font-weight="700">achieve?</tspan> The</text><text x="506" y="177.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">effect on the audience.</text><rect x="30" y="200" width="420" height="46" fill="#f2e7b8"/><rect x="450" y="200" width="420" height="46" fill="#dce9e7"/><line x1="40" y1="246" x2="872" y2="246" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><text x="240" y="230" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="middle" xml:space="preserve">← looks back or around</text><text x="660" y="230" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">looks forward →</text><circle cx="450" cy="246" r="16" fill="#1e2a44" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="286" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">the text</text><rect x="30" y="312" width="410" height="96" rx="14" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5" /><text x="50" y="348" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start" xml:space="preserve">Quick test</text><text x="50" y="386" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“Because</text><rect x="135.00511999999998" y="364" width="70" height="30" rx="6" fill="#ffffff" stroke="#8a6d0d" stroke-width="2" stroke-dasharray="5 4"/><text x="211.00511999999998" y="386" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">, the writer wrote.”</text><rect x="460" y="312" width="410" height="96" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5" /><text x="480" y="348" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start" xml:space="preserve">Quick test</text><text x="480" y="386" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“The writer wants the audience to</text><rect x="765.73976" y="364" width="70" height="30" rx="6" fill="#ffffff" stroke="#2e6b62" stroke-width="2" stroke-dasharray="5 4"/><text x="841.73976" y="386" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">.”</text>
</svg>