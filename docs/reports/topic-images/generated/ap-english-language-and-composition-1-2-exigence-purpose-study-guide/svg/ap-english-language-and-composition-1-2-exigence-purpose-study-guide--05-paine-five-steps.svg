<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 595" width="900" height="595" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="595" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Separating cause and goal</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Thomas Paine, The American Crisis, December 1776</text>
<rect x="30" y="122" width="840" height="107.28" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="50" y="157.3" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“These are the times that try men’s souls. The summer soldier and the sunshine patriot will,</text><text x="50" y="181.06" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-style="italic">in</tspan> <tspan font-style="italic">this</tspan> <tspan font-style="italic">crisis</tspan>, <tspan font-style="italic">shrink</tspan> <tspan font-style="italic">from</tspan> <tspan font-style="italic">the</tspan> <tspan font-style="italic">service</tspan> of their country; but he that <tspan font-style="italic">stands</tspan> <tspan font-style="italic">it</tspan> <tspan font-style="italic">now</tspan>, deserves</text><text x="50" y="204.82000000000002" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">the love and thanks of man and woman.”</text><text x="232.5" y="255.28" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle" xml:space="preserve">EXIGENCE: already exists</text><text x="667.5" y="255.28" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">PURPOSE: to be brought about</text><rect x="30" y="271.28" width="405" height="100.64000000000001" rx="14" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5" /><text x="76" y="303.28" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Look for the trigger</text><text x="46" y="331.28" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“in this crisis”: defeats, retreats, expiring</text><text x="46" y="352.4" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">enlistments, low morale.</text><circle cx="52" cy="299.28" r="15" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="52" y="304.67999999999995" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="465" y="271.28" width="405" height="100.64000000000001" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="511" y="303.28" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Look for the action wanted</text><text x="481" y="331.28" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“shrink from the service”, “stands it now”: keep</text><text x="481" y="352.4" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">serving.</text><circle cx="487" cy="299.28" r="15" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="487" y="304.67999999999995" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="30" y="387.91999999999996" width="405" height="100.64000000000001" rx="14" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5" /><text x="76" y="419.91999999999996" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Write the exigence</text><text x="46" y="447.91999999999996" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">The military crisis of late 1776 that tempted</text><text x="46" y="469.03999999999996" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">people to abandon the cause.</text><circle cx="52" cy="415.91999999999996" r="15" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="52" y="421.31999999999994" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="465" y="387.91999999999996" width="405" height="100.64000000000001" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="511" y="419.91999999999996" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Write purpose as verb + target</text><text x="481" y="447.91999999999996" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">To rally discouraged soldiers and citizens to</text><text x="481" y="469.03999999999996" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">continue the fight.</text><circle cx="487" cy="415.91999999999996" r="15" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="487" y="421.31999999999994" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><circle cx="52" cy="530.56" r="18" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="52" y="537.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="84" y="537.56" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700">Check</tspan> <tspan font-weight="700">the</tspan> <tspan font-weight="700">direction</tspan> <tspan font-weight="700">of</tspan> <tspan font-weight="700">time.</tspan> The crisis already exists; renewed commitment is what Paine</text><text x="84" y="560" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">wants to bring about.</text>
</svg>