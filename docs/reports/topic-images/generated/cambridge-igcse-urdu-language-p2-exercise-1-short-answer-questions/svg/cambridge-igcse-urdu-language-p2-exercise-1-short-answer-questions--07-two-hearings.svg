<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 602" width="900" height="602" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="602" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A routine for the two hearings</text>

<rect x="30" y="110" width="840" height="110" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="165" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="173.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="122" y="148" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">In the pause</text><text x="122" y="176" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Read all the questions for the text, circle the question word, predict the form:</text><text x="122" y="199" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">time, place or number?</text><rect x="30" y="232" width="840" height="110" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="287" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="295.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="122" y="270" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">First hearing</text><text x="122" y="298" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Note key words and figures only, beside each question, in the order you expect</text><text x="122" y="321" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">them.</text><rect x="30" y="354" width="840" height="110" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="409" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="417.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="122" y="392" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Second hearing</text><text x="122" y="420" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Confirm, listen for what you missed, and check any change signalled by a turn</text><text x="122" y="443" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">word.</text><rect x="30" y="476" width="840" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="524" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="532.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="122" y="514" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">After</text><text x="122" y="542" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Write each short answer clearly. Never leave a blank.</text>
</svg>