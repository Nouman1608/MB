<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 880" width="900" height="880" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="880" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: a flight announcement</text>

<rect x="30" y="110" width="840" height="92" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="54" y="146" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The announcement: an Islamabad flight from Karachi</text><text x="54" y="176" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">gate changed from seven to nine; new departure time; have boarding cards ready</text><rect x="30" y="222" width="840" height="200" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="846" y="272" font-size="26" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;پرواز کس گیٹ سے روانہ ہوگی؟&#x200F;</text><text x="54" y="262" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">Which gate will the flight leave from?</text><text x="54" y="288" font-size="15" font-weight="600" fill="#8a6d0d" text-anchor="start">first-hearing note: 7 → 9</text><rect x="340" y="310" width="510" height="92" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="368" y="362" font-size="26" font-weight="700" fill="#2e6b62" text-anchor="middle">✓</text><text x="830" y="366" font-size="27" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;گیٹ نمبر نو&#x200F;</text><rect x="50" y="310" width="270" height="92" rx="10" fill="#fbf1ea" stroke="#b5602e" stroke-width="2"/><text x="78" y="362" font-size="26" font-weight="700" fill="#b5602e" text-anchor="middle">✗</text><text x="102" y="360" font-size="15" font-weight="600" fill="#b5602e" text-anchor="start">the old gate</text><text x="300" y="366" font-size="27" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;سات&#x200F;</text><rect x="30" y="436" width="840" height="200" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="846" y="486" font-size="26" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;روانگی کا نیا وقت کیا ہے؟&#x200F;</text><text x="54" y="476" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">What is the new departure time?</text><text x="54" y="502" font-size="15" font-weight="600" fill="#8a6d0d" text-anchor="start">a quarter to four = 3:45</text><rect x="340" y="524" width="510" height="92" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="368" y="576" font-size="26" font-weight="700" fill="#2e6b62" text-anchor="middle">✓</text><text x="830" y="580" font-size="27" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;پونے چار بجے&#x200F;</text><rect x="50" y="524" width="270" height="92" rx="10" fill="#fbf1ea" stroke="#b5602e" stroke-width="2"/><text x="78" y="576" font-size="26" font-weight="700" fill="#b5602e" text-anchor="middle">✗</text><text x="102" y="574" font-size="15" font-weight="600" fill="#b5602e" text-anchor="start">the trap</text><text x="300" y="576" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="end">4:45</text><rect x="30" y="650" width="840" height="200" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="846" y="700" font-size="26" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;مسافروں سے کیا کرنے کو کہا گیا ہے؟&#x200F;</text><text x="54" y="690" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">What have passengers been asked to do?</text><text x="54" y="716" font-size="15" font-weight="600" fill="#8a6d0d" text-anchor="start">an instruction (L2)</text><rect x="50" y="738" width="800" height="92" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="78" y="790" font-size="26" font-weight="700" fill="#2e6b62" text-anchor="middle">✓</text><text x="830" y="794" font-size="27" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;بورڈنگ کارڈ تیار رکھیں&#x200F;</text>
</svg>