<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 644" width="900" height="644" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="644" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Spot the change, answer with the new detail</text>

<rect x="30" y="110" width="840" height="210" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="54" y="146" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The question nearly always wants the NEW detail</text><text x="846" y="204" font-size="27" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;گاڑی دس بجے کے بجائے گیارہ بجے روانہ ہوگی۔&#x200F;</text><text x="54" y="198" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">The train will leave at</text><text x="54" y="218" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">eleven instead of ten.</text><rect x="260" y="240" width="270" height="62" rx="10" fill="#fbf1ea" stroke="#b5602e" stroke-width="2"/><text x="280" y="278" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">old</text><text x="510" y="282" font-size="26" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;دس&#x200F;</text><rect x="560" y="240" width="290" height="62" rx="10" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="580" y="278" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">new: the answer</text><text x="830" y="282" font-size="26" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;گیارہ&#x200F;</text><text x="450" y="366" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Signals that a detail has changed</text><rect x="700" y="386" width="170" height="116" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="785" y="448" font-size="26" fill="#1e2a44" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;کے بجائے&#x200F;</text><text x="785" y="486" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">instead of</text><rect x="587" y="386" width="100" height="116" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="637" y="448" font-size="26" fill="#1e2a44" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;اب&#x200F;</text><text x="637" y="486" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">now</text><rect x="274" y="386" width="300" height="116" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="424" y="448" font-size="26" fill="#1e2a44" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;معاف کیجیے / میرا مطلب ہے&#x200F;</text><text x="424" y="486" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">sorry / I mean</text><rect x="31" y="386" width="230" height="116" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="146" y="448" font-size="26" fill="#1e2a44" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;پہلے ... تھا، لیکن&#x200F;</text><text x="146" y="486" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">it was ..., but</text><rect x="30" y="524" width="840" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="560" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">If the question asks for the original</text><text x="846" y="568" font-size="25" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;اصل میں، پہلے&#x200F;</text><text x="54" y="592" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">it tests whether you kept both facts apart: note them as old and new.</text>
</svg>