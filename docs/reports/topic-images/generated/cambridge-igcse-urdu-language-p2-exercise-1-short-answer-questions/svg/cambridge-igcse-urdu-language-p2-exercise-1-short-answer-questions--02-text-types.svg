<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 635" width="900" height="635" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="635" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Each text type has a familiar shape</text>

<rect x="30" y="110" width="840" height="495" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,160 L31.25,124 Q31.25,111.25 44,111.25 L856,111.25 Q868.75,111.25 868.75,124 L868.75,160 Z" fill="#b5d3cf"/><text x="234" y="142" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Text type</text><text x="564" y="142" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Typical opening</text><line x1="250" y1="110" x2="250" y2="605" stroke="#c9d6d4" stroke-width="2"/><text x="596" y="142" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Details usually given</text><line x1="580" y1="110" x2="580" y2="605" stroke="#c9d6d4" stroke-width="2"/><line x1="30" y1="160" x2="870" y2="160" stroke="#c9d6d4" stroke-width="2"/><text x="234" y="221" font-size="25" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;اعلان&#x200F;</text><text x="234" y="255" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">announcement</text><text x="564" y="232" font-size="25" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;مسافر توجہ فرمائیں ...&#x200F;</text><text x="596" y="207.7" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">destination, time, platform or</text><text x="596" y="229.7" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">gate, a change, an instruction</text><line x1="30" y1="269" x2="870" y2="269" stroke="#c9d6d4" stroke-width="2"/><text x="234" y="345.5" font-size="25" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;پیغام&#x200F;</text><text x="234" y="379.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">recorded phone message</text><text x="564" y="330" font-size="25" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;السلام علیکم، میں ...&#x200F;</text><text x="564" y="383" font-size="25" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;بات کر رہی ہوں&#x200F;</text><text x="596" y="321.2" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">who is calling, the reason, a</text><text x="596" y="343.2" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">new arrangement, what to do,</text><text x="596" y="365.2" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">when to call back</text><line x1="30" y1="409" x2="870" y2="409" stroke="#c9d6d4" stroke-width="2"/><text x="234" y="470" font-size="25" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;مکالمہ&#x200F;</text><text x="234" y="504" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">brief dialogue</text><text x="266" y="467.7" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">a question from one speaker</text><text x="596" y="456.7" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">a plan, a time, who will do</text><text x="596" y="478.7" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">what, a reason</text><line x1="30" y1="518" x2="870" y2="518" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="554.7" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Weather or travel</text><text x="46" y="576.7" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">report</text><text x="564" y="579" font-size="25" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;آج ... کا امکان ہے&#x200F;</text><text x="596" y="554.7" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">places, temperatures, warnings,</text><text x="596" y="576.7" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">advice</text>
</svg>