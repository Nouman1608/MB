<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Paper 2 Exercise 1 at a glance</text>

<rect x="30" y="110" width="195" height="124" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="127.5" y="154" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">8 questions</text><text x="127.5" y="184" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">8 marks, short</text><text x="127.5" y="205" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">answers</text><rect x="245" y="110" width="195" height="124" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="342.5" y="154" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">Heard twice</text><text x="342.5" y="184" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">with pauses to read</text><text x="342.5" y="205" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">and write</text><rect x="460" y="110" width="195" height="124" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="557.5" y="154" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">L1 and L2</text><text x="557.5" y="184" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">facts, then ideas</text><text x="557.5" y="205" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">and attitudes</text><rect x="675" y="110" width="195" height="124" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="772.5" y="154" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">In Urdu</text><text x="772.5" y="184" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">both questions and</text><text x="772.5" y="205" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">answers</text><text x="450" y="284" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">A series of short spoken texts, such as</text><rect x="30" y="304" width="268" height="116" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="164" y="362" font-size="30" fill="#1e2a44" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;اعلان&#x200F;</text><text x="164" y="404" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Travel announcement</text><rect x="316" y="304" width="268" height="116" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="450" y="362" font-size="30" fill="#1e2a44" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;پیغام&#x200F;</text><text x="450" y="404" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Recorded phone message</text><rect x="602" y="304" width="268" height="116" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="736" y="362" font-size="30" fill="#1e2a44" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;مکالمہ&#x200F;</text><text x="736" y="404" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Brief dialogue</text><rect x="30" y="440" width="840" height="92" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="54" y="476" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Mostly catching one stated fact</text><text x="54" y="506" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">A time, place, number, day, name or reason, written down briefly and clearly.</text>
</svg>