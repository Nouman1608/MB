<rect width="900" height="880" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Times and days that are easy to mishear</text>

<rect x="30" y="110" width="840" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="146" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Fractions of the hour</text><line x1="110" y1="300" x2="790" y2="300" stroke="#1e2a44" stroke-width="4"/><circle cx="110" cy="300" r="10" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="110" y="340" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">7:00</text><circle cx="280" cy="300" r="10" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="280" y="340" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">7:15</text><text x="280" y="220" font-size="25" fill="#1e2a44" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;سوا سات بجے&#x200F;</text><circle cx="450" cy="300" r="10" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="450" y="340" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">7:30</text><text x="450" y="252" font-size="25" fill="#1e2a44" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;ساڑھے سات بجے&#x200F;</text><circle cx="620" cy="300" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="620" y="340" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="middle">7:45</text><text x="620" y="220" font-size="25" fill="#8a6d0d" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;پونے آٹھ بجے&#x200F;</text><circle cx="790" cy="300" r="10" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="790" y="340" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">8:00</text><rect x="560" y="370" width="290" height="54" rx="10" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2"/><text x="705" y="404" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">a quarter TO eight, not 8:45</text><text x="250" y="404" font-size="25" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;ڈیڑھ بجے&#x200F;</text><text x="260" y="398" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">1:30</text><text x="470" y="404" font-size="25" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;ڈھائی بجے&#x200F;</text><text x="480" y="398" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">2:30</text><rect x="30" y="460" width="840" height="186" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="496" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Days that trip people up</text><rect x="702" y="516" width="128" height="104" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="766" y="566" font-size="26" fill="#1e2a44" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;جمعرات&#x200F;</text><text x="766" y="604" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Thursday</text><rect x="562" y="516" width="128" height="104" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="626" y="566" font-size="26" fill="#1e2a44" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;جمعہ&#x200F;</text><text x="626" y="604" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Friday</text><rect x="350" y="516" width="200" height="104" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="450" y="566" font-size="26" fill="#1e2a44" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;ہفتہ&#x200F;</text><text x="450" y="604" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Saturday, also "week"</text><rect x="210" y="516" width="128" height="104" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="274" y="566" font-size="26" fill="#1e2a44" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;پیر&#x200F;</text><text x="274" y="604" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Monday</text><rect x="70" y="516" width="128" height="104" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="134" y="566" font-size="26" fill="#1e2a44" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;سوموار&#x200F;</text><text x="134" y="604" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Monday</text><rect x="30" y="666" width="840" height="186" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="702" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Parts of the day: the question may need them</text><rect x="666" y="722" width="128" height="104" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="730" y="772" font-size="26" fill="#1e2a44" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;صبح&#x200F;</text><text x="730" y="810" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">morning</text><rect x="526" y="722" width="128" height="104" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="590" y="772" font-size="26" fill="#1e2a44" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;دوپہر&#x200F;</text><text x="590" y="810" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">midday</text><rect x="386" y="722" width="128" height="104" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="772" font-size="26" fill="#1e2a44" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;سہ پہر&#x200F;</text><text x="450" y="810" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">afternoon</text><rect x="246" y="722" width="128" height="104" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="310" y="772" font-size="26" fill="#1e2a44" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;شام&#x200F;</text><text x="310" y="810" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">evening</text><rect x="106" y="722" width="128" height="104" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="170" y="772" font-size="26" fill="#1e2a44" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;رات&#x200F;</text><text x="170" y="810" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">night</text>
</svg>