<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 788" width="900" height="788" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="788" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Numbers that sound alike</text>

<rect x="30" y="110" width="840" height="558" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,160 L31.25,124 Q31.25,111.25 44,111.25 L856,111.25 Q868.75,111.25 868.75,124 L868.75,160 Z" fill="#b5d3cf"/><text x="344" y="142" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Easily confused</text><text x="376" y="142" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Meaning</text><line x1="360" y1="110" x2="360" y2="668" stroke="#c9d6d4" stroke-width="2"/><text x="854" y="142" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">What to listen for</text><line x1="530" y1="110" x2="530" y2="668" stroke="#c9d6d4" stroke-width="2"/><line x1="30" y1="160" x2="870" y2="160" stroke="#c9d6d4" stroke-width="2"/><text x="344" y="229.8" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;سترہ / ستر&#x200F;</text><text x="376" y="217.65" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">17 / 70</text><text x="854" y="218.8" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;ہ&#x200F;</text><text x="854" y="252" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">the final sound of the teen number</text><line x1="30" y1="266" x2="870" y2="266" stroke="#c9d6d4" stroke-width="2"/><text x="344" y="324.8" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;اٹھارہ / اسی&#x200F;</text><text x="376" y="312.65" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">18 / 80</text><text x="546" y="301.15" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">different words, but both quick</text><text x="546" y="324.15" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">and soft at speed</text><line x1="30" y1="350" x2="870" y2="350" stroke="#c9d6d4" stroke-width="2"/><text x="344" y="419.8" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;اٹھائیس / اڑتیس / اڑتالیس&#x200F;</text><text x="376" y="407.65" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">28 / 38 / 48</text><text x="854" y="408.8" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;-ائیس, -تیس, -تالیس&#x200F;</text><text x="854" y="442" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">the ending decides the ten</text><line x1="30" y1="456" x2="870" y2="456" stroke="#c9d6d4" stroke-width="2"/><text x="344" y="525.8" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;انتیس / انتالیس / انچاس&#x200F;</text><text x="376" y="513.65" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">29 / 39 / 49</text><text x="854" y="514.8" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;ان-&#x200F;</text><text x="854" y="548" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">start means one less than the next ten</text><line x1="30" y1="562" x2="870" y2="562" stroke="#c9d6d4" stroke-width="2"/><text x="344" y="631.8" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;پچیس / پچاس / پچپن&#x200F;</text><text x="376" y="619.65" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">25 / 50 / 55</text><text x="854" y="620.8" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;پچ-&#x200F;</text><text x="854" y="654" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">all three begin the same way</text><rect x="30" y="690" width="840" height="70" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="54" y="733" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Writing the figure (38) is fine, and quicker, as long as the figure is right.</text>
</svg>