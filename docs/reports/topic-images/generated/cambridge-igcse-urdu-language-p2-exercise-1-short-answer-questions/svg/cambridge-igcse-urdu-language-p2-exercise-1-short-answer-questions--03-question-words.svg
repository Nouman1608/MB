<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 948" width="900" height="948" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="948" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The question word sets the answer form</text>

<rect x="30" y="110" width="840" height="638" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,160 L31.25,124 Q31.25,111.25 44,111.25 L856,111.25 Q868.75,111.25 868.75,124 L868.75,160 Z" fill="#b5d3cf"/><text x="314" y="142" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Question word</text><text x="346" y="142" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Asks for</text><line x1="330" y1="110" x2="330" y2="748" stroke="#c9d6d4" stroke-width="2"/><text x="576" y="142" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Answer form</text><line x1="560" y1="110" x2="560" y2="748" stroke="#c9d6d4" stroke-width="2"/><line x1="30" y1="160" x2="870" y2="160" stroke="#c9d6d4" stroke-width="2"/><text x="314" y="218.8" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;کب؟ / کس دن؟&#x200F;</text><text x="346" y="206.65" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">when, which day</text><text x="576" y="206.65" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">a day or date</text><line x1="30" y1="244" x2="870" y2="244" stroke="#c9d6d4" stroke-width="2"/><text x="314" y="302.8" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;کتنے بجے؟ / کس وقت؟&#x200F;</text><text x="346" y="290.65" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">at what time</text><text x="576" y="290.65" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">a clock time</text><line x1="30" y1="328" x2="870" y2="328" stroke="#c9d6d4" stroke-width="2"/><text x="314" y="386.8" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;کہاں؟&#x200F;</text><text x="346" y="374.65" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">where</text><text x="576" y="374.65" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">a place</text><line x1="30" y1="412" x2="870" y2="412" stroke="#c9d6d4" stroke-width="2"/><text x="314" y="470.8" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;کتنے؟ / کتنی؟&#x200F;</text><text x="346" y="458.65" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">how many, how much</text><text x="576" y="458.65" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">a number or amount</text><line x1="30" y1="496" x2="870" y2="496" stroke="#c9d6d4" stroke-width="2"/><text x="314" y="554.8" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;کون؟ / کن لوگوں کو؟&#x200F;</text><text x="346" y="542.65" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">who, which people</text><text x="576" y="542.65" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">a person or group</text><line x1="30" y1="580" x2="870" y2="580" stroke="#c9d6d4" stroke-width="2"/><text x="314" y="638.8" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;کیا؟&#x200F;</text><text x="346" y="626.65" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">what</text><text x="576" y="626.65" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">an object or action</text><line x1="30" y1="664" x2="870" y2="664" stroke="#c9d6d4" stroke-width="2"/><text x="314" y="722.8" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;کیوں؟&#x200F;</text><text x="346" y="710.65" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">why</text><text x="576" y="710.65" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">a reason</text><rect x="30" y="770" width="840" height="150" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="54" y="806" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Short, but complete enough to be unambiguous: the answer to "where?"</text><rect x="50" y="826" width="300" height="78" rx="10" fill="#fbf1ea" stroke="#b5602e" stroke-width="2"/><text x="78" y="872" font-size="26" font-weight="700" fill="#b5602e" text-anchor="middle">✗</text><text x="100" y="870" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">too little</text><text x="330" y="878" font-size="27" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;دو&#x200F;</text><rect x="370" y="826" width="480" height="78" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="398" y="872" font-size="26" font-weight="700" fill="#2e6b62" text-anchor="middle">✓</text><text x="420" y="870" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">the whole phrase</text><text x="830" y="878" font-size="27" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;پلیٹ فارم نمبر دو&#x200F;</text>
</svg>