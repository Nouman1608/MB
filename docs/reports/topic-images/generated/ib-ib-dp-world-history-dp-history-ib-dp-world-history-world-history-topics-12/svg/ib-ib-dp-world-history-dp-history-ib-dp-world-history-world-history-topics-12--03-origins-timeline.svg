<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 517" width="900" height="517" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="517" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">From allies to rivals, 1945-49</text>

<line x1="140" y1="108" x2="140" y2="477" stroke="#1e2a44" stroke-width="4"/><rect x="180" y="100" width="690" height="69" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="193" y="127.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Yalta (February) and Potsdam (July-August)</text><text x="193" y="151.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Disputes over Poland and Germany; atomic bomb used against Japan</text><circle cx="140" cy="134.5" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="120" y="140.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1945</text><rect x="180" y="179" width="690" height="69" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="193" y="206.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Kennan's "Long Telegram"; Churchill's "iron curtain" speech</text><text x="193" y="230.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A Western interpretation of Soviet behaviour takes shape</text><circle cx="140" cy="213.5" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="120" y="219.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1946</text><rect x="180" y="258" width="690" height="69" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="193" y="285.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Truman Doctrine (March); Marshall Plan announced (June)</text><text x="193" y="309.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Containment becomes US policy</text><circle cx="140" cy="292.5" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="120" y="298.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1947</text><rect x="180" y="337" width="690" height="69" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="193" y="364.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Berlin Blockade and airlift (June 1948 to May 1949)</text><text x="193" y="388.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Germany divided; NATO formed (April 1949)</text><circle cx="140" cy="371.5" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="120" y="377.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1948-49</text><rect x="180" y="416" width="690" height="69" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="193" y="443.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Soviet atomic test (August); People's Republic of China (October)</text><text x="193" y="467.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Rivalry extends to nuclear weapons and Asia</text><circle cx="140" cy="450.5" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="120" y="456.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1949</text>
</svg>