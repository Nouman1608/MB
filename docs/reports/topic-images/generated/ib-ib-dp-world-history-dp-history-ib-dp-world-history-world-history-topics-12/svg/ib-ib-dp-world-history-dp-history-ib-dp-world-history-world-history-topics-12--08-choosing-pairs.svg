<rect width="900" height="699" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Choosing your pairs</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Paper 2 often asks for two leaders, two countries or two crises</text>
<rect x="90" y="124" width="780" height="99" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="104" y="150" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">TWO CRISES</text><text x="104" y="176.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Berlin (1948-49) and Hungary (1956)</text><text x="104" y="204.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Both in Europe</text><circle cx="55" cy="173.5" r="18" fill="#b5602e"/><path d="M48.16,166.66 L61.84,180.34 M61.84,166.66 L48.16,180.34" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="90" y="235" width="780" height="99" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="104" y="261" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">TWO CRISES</text><text x="104" y="287.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Berlin Blockade and the Cuban Missile Crisis</text><text x="104" y="315.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Europe and the Americas</text><circle cx="55" cy="284.5" r="18" fill="#2e6b62"/><path d="M46.9,284.5 L53.2,291.34 L64,277.3" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="90" y="346" width="780" height="99" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="104" y="372" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">TWO COUNTRIES</text><text x="104" y="398.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The USA or the USSR</text><text x="104" y="426.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Excluded by the guide</text><circle cx="55" cy="395.5" r="18" fill="#b5602e"/><path d="M48.16,388.66 L61.84,402.34 M61.84,388.66 L48.16,402.34" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="90" y="457" width="780" height="99" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="104" y="483" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">TWO COUNTRIES</text><text x="104" y="509.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Choose from Korea, Vietnam, Cuba, Germany, Afghanistan</text><text x="104" y="537.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Countries shaped by Cold War tensions</text><circle cx="55" cy="506.5" r="18" fill="#2e6b62"/><path d="M46.9,506.5 L53.2,513.34 L64,499.3" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="90" y="568" width="780" height="99" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="104" y="594" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">TWO LEADERS</text><text x="104" y="620.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">One leader from each of two regions</text><text x="104" y="648.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Their impact on the course of the Cold War</text><circle cx="55" cy="617.5" r="18" fill="#2e6b62"/><path d="M46.9,617.5 L53.2,624.34 L64,610.3" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" />
</svg>