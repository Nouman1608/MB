<rect width="900" height="646" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The three parts of the Cold War topic</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Part 1 runs through three overlapping periods</text>
<line x1="70" y1="124" x2="70" y2="414" stroke="#c9d6d4" stroke-width="1.5" stroke-dasharray="4 6"/><line x1="70" y1="414" x2="70" y2="424" stroke="#1e2a44" stroke-width="2.5"/><text x="70" y="446" font-size="16" font-weight="600" fill="#4a5568" text-anchor="middle">1940</text><line x1="210" y1="124" x2="210" y2="414" stroke="#c9d6d4" stroke-width="1.5" stroke-dasharray="4 6"/><line x1="210" y1="414" x2="210" y2="424" stroke="#1e2a44" stroke-width="2.5"/><text x="210" y="446" font-size="16" font-weight="600" fill="#4a5568" text-anchor="middle">1950</text><line x1="350" y1="124" x2="350" y2="414" stroke="#c9d6d4" stroke-width="1.5" stroke-dasharray="4 6"/><line x1="350" y1="414" x2="350" y2="424" stroke="#1e2a44" stroke-width="2.5"/><text x="350" y="446" font-size="16" font-weight="600" fill="#4a5568" text-anchor="middle">1960</text><line x1="490" y1="124" x2="490" y2="414" stroke="#c9d6d4" stroke-width="1.5" stroke-dasharray="4 6"/><line x1="490" y1="414" x2="490" y2="424" stroke="#1e2a44" stroke-width="2.5"/><text x="490" y="446" font-size="16" font-weight="600" fill="#4a5568" text-anchor="middle">1970</text><line x1="630" y1="124" x2="630" y2="414" stroke="#c9d6d4" stroke-width="1.5" stroke-dasharray="4 6"/><line x1="630" y1="414" x2="630" y2="424" stroke="#1e2a44" stroke-width="2.5"/><text x="630" y="446" font-size="16" font-weight="600" fill="#4a5568" text-anchor="middle">1980</text><line x1="770" y1="124" x2="770" y2="414" stroke="#c9d6d4" stroke-width="1.5" stroke-dasharray="4 6"/><line x1="770" y1="414" x2="770" y2="424" stroke="#1e2a44" stroke-width="2.5"/><text x="770" y="446" font-size="16" font-weight="600" fill="#4a5568" text-anchor="middle">1990</text><line x1="50" y1="414" x2="860" y2="414" stroke="#1e2a44" stroke-width="3"/><rect x="112" y="150" width="84" height="24" rx="6" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="112" y="142" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Breakdown of the grand alliance, 1943-49</text><text x="112" y="196" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">ideology; fear and aggression; economic interests</text><rect x="168" y="242" width="448" height="24" rx="6" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="168" y="234" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">USA, USSR and China, 1947-79</text><text x="168" y="288" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">containment; co-existence; Sino-Soviet and Sino-US relations; détente</text><rect x="630" y="334" width="154" height="24" rx="6" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="784" y="326" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">Confrontation, reconciliation and the end, 1980-91</text><text x="784" y="380" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end">dissent; economic problems; arms race</text><rect x="30" y="476" width="410" height="138" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="506" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PART 2</text><text x="48" y="533.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Leaders and nations</text><text x="48" y="563.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="64.15" y="563.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Two leaders, each from a different region</text><text x="48" y="591.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="64.15" y="591.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Two countries, not the USA or the USSR</text><rect x="460" y="476" width="410" height="138" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="478" y="506" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PART 3</text><text x="478" y="533.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Cold War crises</text><text x="478" y="563.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="494.15" y="563.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Two crises from different regions</text><text x="478" y="591.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="494.15" y="591.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Causes, impact and significance compared</text>
</svg>