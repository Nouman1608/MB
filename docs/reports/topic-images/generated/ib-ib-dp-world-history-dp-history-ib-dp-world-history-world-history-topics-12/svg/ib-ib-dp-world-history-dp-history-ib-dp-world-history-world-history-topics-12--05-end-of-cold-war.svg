<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 672" width="900" height="672" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="672" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why the Cold War ended</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Weigh the three factors named in the guide</text>
<rect x="30" y="124" width="269.3333333333333" height="222" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="152" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FACTOR 1</text><text x="46" y="178.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Economic problems</text><text x="46" y="207.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="61.2" y="207.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Soviet stagnation</text><text x="46" y="233.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="61.2" y="233.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Cost of Afghanistan</text><text x="46" y="259.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="61.2" y="259.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Cost of the arms race</text><rect x="315.3333333333333" y="124" width="269.3333333333333" height="222" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="331.3333333333333" y="152" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FACTOR 2</text><text x="331.3333333333333" y="178.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Arms race</text><text x="331.3333333333333" y="207.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="346.5333333333333" y="207.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Reagan's military build-up</text><text x="331.3333333333333" y="233.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="346.5333333333333" y="233.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Strategic Defense Initiative</text><text x="346.5333333333333" y="254.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">(1983)</text><text x="331.3333333333333" y="280.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="346.5333333333333" y="280.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Then arms control: INF</text><text x="346.5333333333333" y="301.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Treaty (1987)</text><rect x="600.6666666666666" y="124" width="269.3333333333333" height="222" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="616.6666666666666" y="152" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FACTOR 3</text><text x="616.6666666666666" y="178.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Ideological challenges</text><text x="616.6666666666666" y="202.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">and dissent</text><text x="616.6666666666666" y="231.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="631.8666666666667" y="231.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Solidarity in Poland (from</text><text x="631.8666666666667" y="252.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">1980)</text><text x="616.6666666666666" y="278.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="631.8666666666667" y="278.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Glasnost and perestroika</text><text x="616.6666666666666" y="304.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="631.8666666666667" y="304.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Brezhnev Doctrine</text><text x="631.8666666666667" y="325.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">abandoned</text><line x1="164.66666666666666" y1="352" x2="330" y2="410" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="450" y1="352" x2="450" y2="410" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="735.3333333333333" y1="352" x2="570" y2="410" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="150" y="416" width="600" height="113" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="452.38" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">End of the Cold War</text><text x="450" y="482.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Fall of the Berlin Wall (9 November 1989); dissolution of the USSR</text><text x="450" y="504.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">(December 1991)</text><rect x="30" y="551" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="585.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Reach a judgement</text><text x="450" y="615.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">How far were Gorbachev's choices decisive, compared with the economic and military pressures?</text>
</svg>