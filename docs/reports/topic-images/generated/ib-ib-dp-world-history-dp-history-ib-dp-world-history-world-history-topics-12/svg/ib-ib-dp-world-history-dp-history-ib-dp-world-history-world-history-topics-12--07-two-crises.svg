<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" width="900" height="580" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="580" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Comparing two crises</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Berlin Blockade (Europe, 1948-49) and Cuban Missile Crisis (the Americas, 1962)</text>
<rect x="30" y="124" width="270.6666666666667" height="269" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="152" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">BERLIN ONLY</text><text x="46" y="178.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Berlin Blockade</text><text x="46" y="207.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="61.2" y="207.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Trigger: Western currency</text><text x="61.2" y="228.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">reform (June 1948)</text><text x="46" y="255.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="61.2" y="255.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Rooted in disagreement over</text><text x="61.2" y="276.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Germany and reparations</text><text x="46" y="303.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="61.2" y="303.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Airlift; lifted without fighting</text><text x="46" y="330.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="61.2" y="330.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Two German states (1949);</text><text x="61.2" y="351.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">NATO</text><rect x="314.6666666666667" y="124" width="270.6666666666667" height="269" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="330.6666666666667" y="152" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">BOTH</text><text x="330.6666666666667" y="178.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Similarities</text><text x="330.6666666666667" y="207.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="345.8666666666667" y="207.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">One side changed the status</text><text x="345.8666666666667" y="228.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">quo in a sensitive area</text><text x="330.6666666666667" y="255.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="345.8666666666667" y="255.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Rooted in security fears</text><text x="330.6666666666667" y="282.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="345.8666666666667" y="282.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Ended short of war</text><rect x="599.3333333333334" y="124" width="270.6666666666667" height="269" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="615.3333333333334" y="152" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CUBA ONLY</text><text x="615.3333333333334" y="178.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Cuban Missile Crisis</text><text x="615.3333333333334" y="207.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="630.5333333333334" y="207.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Trigger: US discovery of</text><text x="630.5333333333334" y="228.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">missile sites (October 1962)</text><text x="615.3333333333334" y="255.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="630.5333333333334" y="255.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Also reflected the nuclear</text><text x="630.5333333333334" y="276.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">balance</text><text x="615.3333333333334" y="303.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="630.5333333333334" y="303.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Came much closer to nuclear</text><text x="630.5333333333334" y="324.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">war</text><text x="615.3333333333334" y="351.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="630.5333333333334" y="351.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Hotline and Partial Test Ban</text><text x="630.5333333333334" y="372.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Treaty (1963)</text><rect x="30" y="415" width="840" height="133" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="449.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Thesis</text><text x="50" y="479.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Both crises arose from security fears and ended without war, but <tspan font-weight="700" fill="#1e2a44">Cuba</tspan> <tspan font-weight="700" fill="#1e2a44">was</tspan> <tspan font-weight="700" fill="#1e2a44">more</tspan> <tspan font-weight="700" fill="#1e2a44">significant</tspan>: it</text><text x="50" y="501.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">brought the superpowers to the edge of nuclear war and led to mechanisms for managing future</text><text x="50" y="523.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">confrontation.</text>
</svg>