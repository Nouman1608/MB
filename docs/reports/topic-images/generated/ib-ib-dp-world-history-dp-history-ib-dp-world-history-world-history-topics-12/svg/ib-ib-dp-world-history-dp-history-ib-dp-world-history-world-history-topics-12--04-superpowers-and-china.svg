<text x="215" y="140" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">USA AND USSR</text><text x="730" y="140" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">CHINA</text><line x1="450" y1="158" x2="450" y2="670" stroke="#1e2a44" stroke-width="4"/><rect x="415" y="167" width="70" height="30" rx="15" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="188" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">1950</text><rect x="146.984" y="158" width="252.016" height="48" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="272.992" y="188" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Korean War begins (1950-53)</text><rect x="501" y="158" width="177.872" height="48" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="589.936" y="188" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Sino-Soviet alliance</text><rect x="415" y="225" width="70" height="30" rx="15" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="246" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">1956</text><rect x="38.184000000000026" y="216" width="360.816" height="48" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="218.592" y="246" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Peaceful co-existence announced; Hungary</text><rect x="415" y="283" width="70" height="30" rx="15" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="304" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">1961</text><rect x="200.488" y="274" width="198.512" height="48" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="299.744" y="304" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Berlin Wall (13 August)</text><rect x="415" y="341" width="70" height="30" rx="15" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><te