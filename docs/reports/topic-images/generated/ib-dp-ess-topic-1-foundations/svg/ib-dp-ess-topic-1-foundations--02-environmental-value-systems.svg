<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three environmental value systems</text>

<rect x="30" y="110" width="840" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="148" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">An EVS is shaped by context</text><rect x="60" y="170" width="180" height="60" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="150" y="205.94000000000003" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">cultural</text><rect x="260" y="170" width="180" height="60" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="350" y="205.94000000000003" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">religious</text><rect x="460" y="170" width="180" height="60" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="550" y="205.94000000000003" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">economic</text><rect x="660" y="170" width="180" height="60" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="750" y="205.94000000000003" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">socio-political</text><line x1="450" y1="262" x2="450" y2="296" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="30" y="300" width="270" height="300" rx="12" fill="#cfe0c0" stroke="#1e2a44" stroke-width="2.5"/><text x="165" y="345" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Ecocentrism</text><text x="165" y="403.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">nature-centred: values</text><text x="165" y="425.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">the environment for</text><text x="165" y="447.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">its own sake</text><line x1="54" y1="480" x2="276" y2="480" stroke="#1e2a44" stroke-width="1.5" stroke-dasharray="5 5"/><text x="165" y="530.25" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">e.g. capping extraction</text><text x="165" y="550.25" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">at the recharge rate</text><rect x="315" y="300" width="270" height="300" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="345" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Anthropocentrism</text><text x="450" y="403.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">human-centred: manages</text><text x="450" y="425.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">the environment for</text><text x="450" y="447.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">humanity’s benefit</text><line x1="339" y1="480" x2="561" y2="480" stroke="#1e2a44" stroke-width="1.5" stroke-dasharray="5 5"/><text x="450" y="530.25" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">e.g. prioritising</text><text x="450" y="550.25" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">irrigation output</text><rect x="600" y="300" width="270" height="300" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="735" y="345" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Technocentrism</text><text x="735" y="403.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">technology and human</text><text x="735" y="425.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">ingenuity can solve</text><text x="735" y="447.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">environmental problems</text><line x1="624" y1="480" x2="846" y2="480" stroke="#1e2a44" stroke-width="1.5" stroke-dasharray="5 5"/><text x="735" y="530.25" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">look for trust in</text><text x="735" y="550.25" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">a technical fix</text><text x="450" y="636" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Justify a label with the specific words or actions in the case study.</text>
