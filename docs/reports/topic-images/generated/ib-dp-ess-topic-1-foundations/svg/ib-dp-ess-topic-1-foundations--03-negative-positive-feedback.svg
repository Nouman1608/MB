<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 770" width="900" height="770" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="770" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Negative and positive feedback</text>

<rect x="30" y="110" width="410" height="560" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="235" y="150" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="middle">Negative feedback</text><rect x="60" y="180" width="150" height="64" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="135" y="217.61" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Change</text><rect x="260" y="180" width="150" height="64" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="335" y="217.61" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Response</text><path d="M212,200 L256,200" fill="none" stroke="#2e6b62" stroke-width="4" stroke-linecap="round" marker-end="url(#ahT)"/><path d="M335,248 C335,320 135,320 135,252" fill="none" stroke="#2e6b62" stroke-width="4" stroke-linecap="round" marker-end="url(#ahT)"/><circle cx="235" cy="304" r="18" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="235" y="310.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">−</text><text x="235" y="346" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">output feeds back to input</text><line x1="80" y1="540" x2="410" y2="540" stroke="#1e2a44" stroke-width="2.5"/><line x1="80" y1="540" x2="80" y2="380" stroke="#1e2a44" stroke-width="2.5"/><text x="410" y="562" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">time →</text><line x1="80" y1="460" x2="410" y2="460" stroke="#4a5568" stroke-width="1.5" stroke-dasharray="6 5"/><path d="M80,460 L180,460 L190,400 C220,400 230,455 270,460 L410,460" fill="none" stroke="#2e6b62" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><text x="232" y="400" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">back to equilibrium</text><text x="235" y="609.6" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Stabilising: moves the system</text><text x="235" y="631.6" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">back towards equilibrium</text><rect x="460" y="110" width="410" height="560" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="665" y="150" font-size="21" font-weight="700" fill="#b5602e" text-anchor="middle">Positive feedback</text><rect x="490" y="180" width="150" height="64" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="565" y="217.61" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Change</text><rect x="690" y="180" width="150" height="64" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="765" y="217.61" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">More change</text><path d="M642,200 L686,200" fill="none" stroke="#b5602e" stroke-width="4" stroke-linecap="round" marker-end="url(#ahR)"/><path d="M765,248 C765,320 565,320 565,252" fill="none" stroke="#b5602e" stroke-width="4" stroke-linecap="round" marker-end="url(#ahR)"/><circle cx="665" cy="304" r="18" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="665" y="310.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">+</text><text x="665" y="346" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">output feeds back to input</text><line x1="510" y1="540" x2="840" y2="540" stroke="#1e2a44" stroke-width="2.5"/><line x1="510" y1="540" x2="510" y2="380" stroke="#1e2a44" stroke-width="2.5"/><text x="840" y="562" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">time →</text><path d="M510,520 L590,520 C640,520 700,480 750,420 C780,385 800,375 840,372" fill="none" stroke="#b5602e" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><text x="590" y="500" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">further from the</text><text x="590" y="518" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">original state</text><text x="665" y="609.6" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Amplifying: pushes the system</text><text x="665" y="631.6" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">further from its original state</text><rect x="30" y="690" width="840" height="60" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="728" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">“Negative” means stabilising, not bad; “positive” means amplifying, not good.</text>
</svg>