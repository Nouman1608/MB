<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 740" width="900" height="740" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="740" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Sustainability is a threshold</text>

<rect x="30" y="110" width="840" height="500" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><line x1="110" y1="500" x2="840" y2="500" stroke="#1e2a44" stroke-width="3"/><line x1="110" y1="500" x2="110" y2="170" stroke="#1e2a44" stroke-width="3"/><text x="840" y="530" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="end">time →</text><text x="72" y="335" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle" transform="rotate(-90 72 335)">rate of use</text><rect x="110" y="330" width="730" height="170" fill="#dce9e7"/><line x1="110" y1="330" x2="840" y2="330" stroke="#2e6b62" stroke-width="4"/><text x="122" y="318" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">natural income (sustainable yield)</text><path d="M110,440 C300,430 420,380 480,330 C540,280 640,230 840,210" fill="none" stroke="#b5602e" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><text x="200" y="470" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">within income: sustainable</text><text x="610" y="200" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">above income: capital</text><text x="610" y="222" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">depleted, unsustainable</text><circle cx="480" cy="330" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="492" y="360" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">threshold crossed</text><text x="400" y="410" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">consumption</text><rect x="30" y="630" width="410" height="90" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="235" y="666" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Natural capital</text><text x="235" y="694" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">the stock of natural resources</text><rect x="460" y="630" width="410" height="90" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="665" y="666" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Natural income</text><text x="665" y="694" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">the sustainable yield from that stock</text>
</svg>