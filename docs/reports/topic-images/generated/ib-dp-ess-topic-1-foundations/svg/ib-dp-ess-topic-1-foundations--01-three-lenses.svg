<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Topic 1 as a toolkit: three lenses</text>

<circle cx="450" cy="330" r="92" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="3"/><text x="450" y="324.65" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">A scenario</text><text x="450" y="348.65" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">from Topics 4–8</text><rect x="30" y="130" width="260" height="150" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="160" y="180.73000000000002" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Perspectives</text><text x="160" y="202.61" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Which environmental</text><text x="160" y="223.41" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">value system lies behind</text><text x="160" y="244.21" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">this policy position?</text><rect x="610" y="130" width="260" height="150" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="740" y="180.73000000000002" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Systems</text><text x="740" y="202.61" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">What are the inputs,</text><text x="740" y="223.41" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">outputs and feedback</text><text x="740" y="244.21" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">loops?</text><rect x="320" y="470" width="260" height="150" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="520.73" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Sustainability</text><text x="450" y="542.61" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Is use within natural</text><text x="450" y="563.4100000000001" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">income, or is capital</text><text x="450" y="584.21" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">being depleted?</text><line x1="368" y1="290" x2="294" y2="236" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><line x1="532" y1="290" x2="606" y2="236" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><line x1="450" y1="424" x2="450" y2="464" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="30" y="650" width="840" height="70" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="692" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Use all three lenses on the same scenario for analytical, not descriptive, answers.</text>
</svg>