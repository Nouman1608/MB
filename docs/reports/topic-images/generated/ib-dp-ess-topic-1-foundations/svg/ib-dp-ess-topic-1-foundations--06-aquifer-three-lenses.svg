<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="900" height="650" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="650" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: an over-used aquifer</text>

<rect x="30" y="110" width="540" height="520" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="148" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Systems framing</text><rect x="150" y="300" width="300" height="140" rx="16" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="300" y="360" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Aquifer</text><text x="300" y="388" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">stored water = natural capital</text><path d="M103.8,206.5 L192.1,291.3 L186.5,297.1 L210.0,296.0 L210.2,272.4 L204.5,278.3 L116.2,193.5 Z" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" stroke-linejoin="round"/><text x="60" y="190" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">Input: rainfall recharge</text><text x="60" y="210" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">= natural income</text><path d="M401.8,308.2 L489.8,223.5 L500.4,234.5 L500.0,190.0 L455.6,188.0 L466.2,199.0 L378.2,283.8 Z" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5" stroke-linejoin="round"/><text x="540" y="176" font-size="16" font-weight="700" fill="#b5602e" text-anchor="end">Output: extraction</text><text x="540" y="196" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">for irrigation</text><text x="410" y="270" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">extraction > recharge</text><rect x="60" y="480" width="140" height="70" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="130" y="510.53" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Water table</text><text x="130" y="530.01" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">falls</text><rect x="230" y="480" width="140" height="70" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="300" y="510.53" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Drill</text><text x="300" y="530.01" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">deeper</text><rect x="400" y="480" width="140" height="70" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="470" y="510.53" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Extract</text><text x="470" y="530.01" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">even faster</text><line x1="202" y1="515" x2="226" y2="515" stroke="#b5602e" stroke-width="3.5" marker-end="url(#ahR)"/><line x1="372" y1="515" x2="396" y2="515" stroke="#b5602e" stroke-width="3.5" marker-end="url(#ahR)"/><path d="M470,552 C470,600 130,600 130,554" fill="none" stroke="#b5602e" stroke-width="3.5" stroke-linecap="round" marker-end="url(#ahR)"/><circle cx="300" cy="588" r="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="300" y="593.04" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">+</text><text x="300" y="464" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">a possible positive feedback loop</text><rect x="590" y="110" width="280" height="250" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="610" y="148" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Sustainability</text><text x="610" y="180" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Extraction exceeds</text><text x="610" y="202" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">recharge, so capital is</text><text x="610" y="224" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">being depleted, not just</text><text x="610" y="246" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">income drawn down.</text><text x="610" y="290" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">UNSUSTAINABLE</text><rect x="590" y="380" width="280" height="250" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="610" y="418" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Perspectives</text><text x="610" y="450" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Prioritise irrigation</text><text x="610" y="471" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">output above all:</text><text x="610" y="494" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="start">anthropocentric</text><text x="610" y="530" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Cap extraction at the</text><text x="610" y="551" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">recharge rate: more</text><text x="610" y="574" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">ecocentric / precautionary</text>
</svg>