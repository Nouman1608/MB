<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 634" width="900" height="634" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="634" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The Parliament Acts: the Commons has the final say</text>

<rect x="30" y="100" width="253.33333333333334" height="129" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="145.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">NORMALLY</text><text x="50" y="170.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">A Bill must pass both</text><text x="50" y="191.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Houses</text><line x1="289.33333333333337" y1="164.5" x2="317.33333333333337" y2="164.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="323.33333333333337" y="100" width="253.33333333333334" height="129" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="343.33333333333337" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PARLIAMENT ACT 1911</text><text x="343.33333333333337" y="157.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Lords lose the veto over</text><text x="343.33333333333337" y="178.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">most public Bills</text><text x="343.33333333333337" y="205" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">leaving only a power to delay</text><line x1="582.6666666666667" y1="164.5" x2="610.6666666666667" y2="164.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="616.6666666666667" y="100" width="253.33333333333334" height="129" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="636.6666666666667" y="145.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PARLIAMENT ACT 1949</text><text x="636.6666666666667" y="170.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Delay cut to roughly one</text><text x="636.6666666666667" y="191.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">year</text><text x="30" y="265" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">HOW LONG THE LORDS CAN HOLD A BILL UP</text><rect x="90" y="287" width="730" height="38" rx="6" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="455" y="312" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">most public Bills: roughly one year</text><rect x="90" y="337" width="60.833333333333314" height="38" rx="6" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><text x="162.83333333333331" y="362" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">money Bill: law without Lords' consent after one month</text><rect x="30" y="401" width="272" height="101" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="429" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">USED RARELY</text><text x="46" y="460.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">War</tspan> <tspan font-style="italic">Crimes</tspan> <tspan font-style="italic">Act</tspan> <tspan font-style="italic">1991</tspan>; <tspan font-style="italic">Hunting</tspan></text><text x="46" y="481.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Act</tspan> <tspan font-style="italic">2004</tspan></text><rect x="314" y="401" width="272" height="101" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="330" y="429" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">UPHELD</text><text x="330" y="460.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Jackson</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Attorney</tspan> <tspan font-style="italic">General</tspan></text><text x="330" y="481.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">[2005]: the 1949 Act is valid</text><rect x="598" y="401" width="272" height="101" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="614" y="429" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ROYAL ASSENT ACT 1967</text><text x="614" y="460.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Assent can be notified to each</text><text x="614" y="481.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">House, not given in person</text><rect x="30" y="524" width="840" height="78" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="556.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Exam use: the elected House has the final say, which supports the democratic argument for Acts of</text><text x="450" y="577.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Parliament.</text>
</svg>