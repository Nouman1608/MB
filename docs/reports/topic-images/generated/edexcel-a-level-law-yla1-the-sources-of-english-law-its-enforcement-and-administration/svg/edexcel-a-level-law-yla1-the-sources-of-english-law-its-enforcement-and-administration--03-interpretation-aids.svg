<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 684" width="900" height="684" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="684" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Statutory interpretation: the extra pieces</text>

<rect x="30" y="100" width="840" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EJUSDEM GENERIS: POWELL v KEMPTON PARK RACECOURSE [1899]</text><rect x="60" y="156" width="78.27000000000001" height="32" rx="16" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="99.135" y="178.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">house</text><rect x="190" y="156" width="75.55199999999999" height="32" rx="16" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="227.776" y="178.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">office</text><rect x="320" y="156" width="69.828" height="32" rx="16" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="354.914" y="178.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">room</text><rect x="450" y="156" width="145.76999999999998" height="32" rx="16" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="522.885" y="178.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">or other place</text><path d="M520,200 C520,228 200,228 200,202" fill="none" stroke="#8a6d0d" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahO)"/><text x="620" y="180" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">→ indoor places only</text><text x="450" y="240" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">General words after a list take their meaning from the list: an outdoor enclosure was not covered</text><rect x="30" y="272" width="413" height="119" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="300" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PRESUMPTIONS</text><text x="46" y="331" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Mens rea required unless Parliament clearly says</text><text x="46" y="351" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">otherwise (<tspan font-style="italic">Sweet</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Parsley</tspan> [1970]); no retrospective</text><text x="46" y="371" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">effect.</text><rect x="457" y="272" width="413" height="119" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="473" y="300" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">INTRINSIC AIDS</text><text x="473" y="331" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Long title, definition sections, schedules.</text><rect x="30" y="403" width="413" height="99" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="431" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EXTRINSIC AIDS</text><text x="46" y="462" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Dictionaries, Law Commission reports, <tspan font-style="italic">Hansard</tspan> since</text><text x="46" y="482" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Pepper</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Hart</tspan> [1993].</text><rect x="457" y="403" width="413" height="99" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="473" y="431" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">INTERPRETATION ACT 1978</text><text x="473" y="462" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Unless the contrary appears: masculine includes</text><text x="473" y="482" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">feminine; singular includes plural.</text><rect x="30" y="524" width="395" height="128" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="556" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">HRA 1998 s 3</text><text x="50" y="581.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Read compatibly "so far as it is possible"</text><text x="50" y="608" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Ghaidan</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Godin-Mendoza</tspan> [2004]: "as his or her</text><text x="50" y="628" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">wife or husband" included a same-sex partner</text><line x1="431" y1="588" x2="469" y2="588" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="475" y="524" width="395" height="128" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="495" y="566" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">IF IMPOSSIBLE: s 4</text><text x="495" y="591.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Declaration of incompatibility</text><text x="495" y="618" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">by a higher court; it does not invalidate the Act</text>
</svg>