<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 419" width="900" height="419" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="419" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Equity in contract: discretionary remedies</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Where damages would not be adequate</text>
<rect x="30" y="124" width="411" height="153" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="166.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SPECIFIC PERFORMANCE</text><text x="50" y="192.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Orders a party to carry out the contract</text><text x="50" y="221.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Typically for unique items such as land; ordered</text><text x="50" y="242.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">in <tspan font-style="italic">Beswick</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Beswick</tspan> [1968]</text><rect x="459" y="124" width="411" height="153" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="479" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">RESCISSION</text><text x="479" y="182.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Sets the contract aside</text><text x="479" y="210.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Returns the parties to their original positions; can</text><text x="479" y="231.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">be lost through delay: <tspan font-style="italic">Leaf</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">International</tspan></text><text x="479" y="252.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Galleries</tspan> [1950]</text><rect x="30" y="299" width="840" height="88" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="333.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">"He who comes to equity must come with clean hands"</text><text x="450" y="362.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Because the remedies are discretionary, a claimant who has behaved unfairly may be refused them.</text>
</svg>