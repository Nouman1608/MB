<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 542" width="900" height="542" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="542" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Advising Amira: a £4,000 claim against her builder</text>

<line x1="60" y1="120" x2="60" y2="410" stroke="#c9d6d4" stroke-width="4"/><rect x="104" y="100" width="766" height="75" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="118" y="128.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Negotiation first</text><text x="118" y="156.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A letter before action is cheap and may settle it.</text><circle cx="60" cy="137.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="146.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="104" y="185" width="766" height="75" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="118" y="213.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">If not: mediation</text><text x="118" y="241.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Quick, private, keeps costs low.</text><circle cx="60" cy="222.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="231.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="104" y="270" width="766" height="75" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="118" y="298.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Court: the small claims track</text><text x="118" y="326.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">About £4,000 is within it; designed for litigants without lawyers; recoverable costs are limited.</text><circle cx="60" cy="307.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="316.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="104" y="355" width="766" height="75" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="118" y="383.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Funding</text><text x="118" y="411.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Legal aid unlikely after LASPO 2012; check home insurance for legal expenses cover.</text><circle cx="60" cy="392.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="401.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="30" y="452" width="840" height="58" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="485.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">A strong answer <tspan font-weight="700" fill="#1e2a44">applies</tspan> <tspan font-weight="700" fill="#1e2a44">each</tspan> <tspan font-weight="700" fill="#1e2a44">method</tspan> <tspan font-weight="700" fill="#1e2a44">to</tspan> <tspan font-weight="700" fill="#1e2a44">Amira's</tspan> <tspan font-weight="700" fill="#1e2a44">facts</tspan>, not just describes it.</text>
</svg>