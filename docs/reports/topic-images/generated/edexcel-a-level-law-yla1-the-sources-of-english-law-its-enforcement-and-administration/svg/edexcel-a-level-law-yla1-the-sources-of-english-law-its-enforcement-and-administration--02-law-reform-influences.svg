<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Five influences on law reform</text>

<clipPath id="tc100"><rect x="30" y="100" width="840" height="437" rx="14"/></clipPath><g clip-path="url(#tc100)"><rect x="30" y="100" width="155.21739130434784" height="47" fill="#b5d3cf"/><text x="44" y="126.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Influence</text><rect x="185.21739130434784" y="100" width="292.1739130434783" height="47" fill="#b5d3cf"/><text x="199.21739130434784" y="126.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Example</text><rect x="477.3913043478261" y="100" width="182.60869565217394" height="47" fill="#b5d3cf"/><text x="491.3913043478261" y="126.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Advantage</text><rect x="660" y="100" width="210" height="47" fill="#f2e7b8"/><text x="674" y="126.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Disadvantage</text><rect x="30" y="147" width="155.21739130434784" height="86" fill="#dce9e7"/><text x="44" y="173" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Political parties</text><rect x="185.21739130434784" y="147" width="292.1739130434783" height="86" fill="#ffffff"/><text x="199.21739130434784" y="173" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Manifesto commitments carried out</text><text x="199.21739130434784" y="193" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">by a government with a majority</text><rect x="477.3913043478261" y="147" width="182.60869565217394" height="86" fill="#ffffff"/><text x="491.3913043478261" y="173" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Democratic mandate</text><rect x="660" y="147" width="210" height="86" fill="#ffffff"/><text x="674" y="173" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">May follow party</text><text x="674" y="193" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">advantage; may be</text><text x="674" y="213" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">reversed</text><line x1="30" y1="233" x2="870" y2="233" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="233" width="155.21739130434784" height="86" fill="#dce9e7"/><text x="44" y="259" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Pressure groups</text><rect x="185.21739130434784" y="233" width="292.1739130434783" height="86" fill="#f8faf9"/><text x="199.21739130434784" y="259" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Snowdrop campaign after Dunblane</text><text x="199.21739130434784" y="279" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">→ Firearms (Amendment) Act 1997</text><rect x="477.3913043478261" y="233" width="182.60869565217394" height="86" fill="#f8faf9"/><text x="491.3913043478261" y="259" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Raise issues</text><text x="491.3913043478261" y="279" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">politicians ignore</text><rect x="660" y="233" width="210" height="86" fill="#f8faf9"/><text x="674" y="259" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Small, well-funded</text><text x="674" y="279" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">groups can gain outsized</text><text x="674" y="299" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">influence</text><line x1="30" y1="319" x2="870" y2="319" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="319" width="155.21739130434784" height="66" fill="#dce9e7"/><text x="44" y="345" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Law Commission</text><rect x="185.21739130434784" y="319" width="292.1739130434783" height="66" fill="#ffffff"/><text x="199.21739130434784" y="345" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Law Commissions Act 1965; work</text><text x="199.21739130434784" y="365" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">fed into the Fraud Act 2006</text><rect x="477.3913043478261" y="319" width="182.60869565217394" height="66" fill="#ffffff"/><text x="491.3913043478261" y="345" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Expert, independent,</text><text x="491.3913043478261" y="365" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">research-based</text><rect x="660" y="319" width="210" height="66" fill="#ffffff"/><text x="674" y="345" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Reports wait years for</text><text x="674" y="365" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">parliamentary time</text><line x1="30" y1="385" x2="870" y2="385" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="385" width="155.21739130434784" height="86" fill="#dce9e7"/><text x="44" y="411" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Judges</text><rect x="185.21739130434784" y="385" width="292.1739130434783" height="86" fill="#f8faf9"/><text x="199.21739130434784" y="411" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">R</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">R</tspan> [1991] removed the marital</text><text x="199.21739130434784" y="431" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">rape exemption before Parliament</text><text x="199.21739130434784" y="451" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">legislated</text><rect x="477.3913043478261" y="385" width="182.60869565217394" height="86" fill="#f8faf9"/><text x="491.3913043478261" y="411" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Respond quickly to</text><text x="491.3913043478261" y="431" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">injustice</text><rect x="660" y="385" width="210" height="86" fill="#f8faf9"/><text x="674" y="411" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Unelected; only act when</text><text x="674" y="431" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">a case arises</text><line x1="30" y1="471" x2="870" y2="471" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="471" width="155.21739130434784" height="66" fill="#dce9e7"/><text x="44" y="497" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Media</text><rect x="185.21739130434784" y="471" width="292.1739130434783" height="66" fill="#ffffff"/><text x="199.21739130434784" y="497" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Campaigning after the murder of</text><text x="199.21739130434784" y="517" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Sarah Payne → "Sarah's Law"</text><rect x="477.3913043478261" y="471" width="182.60869565217394" height="66" fill="#ffffff"/><text x="491.3913043478261" y="497" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Mobilises public</text><text x="491.3913043478261" y="517" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">opinion</text><rect x="660" y="471" width="210" height="66" fill="#ffffff"/><text x="674" y="497" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Can push hurried,</text><text x="674" y="517" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">emotional law making</text></g><line x1="185.21739130434784" y1="100" x2="185.21739130434784" y2="537" stroke="#c9d6d4" stroke-width="1.5"/><line x1="477.3913043478261" y1="100" x2="477.3913043478261" y2="537" stroke="#c9d6d4" stroke-width="1.5"/><line x1="660" y1="100" x2="660" y2="537" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="100" width="840" height="437" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/>
