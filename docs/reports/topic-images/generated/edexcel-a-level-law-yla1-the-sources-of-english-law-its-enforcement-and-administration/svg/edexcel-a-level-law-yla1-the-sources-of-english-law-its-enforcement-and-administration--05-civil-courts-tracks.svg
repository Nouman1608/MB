<rect width="900" height="687" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Civil courts and the CPR tracks</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Civil Procedure Rules 1998, after Lord Woolf's review</text>
<line x1="450" y1="212" x2="450" y2="184" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="300" y1="302" x2="400" y2="274" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="600" y1="302" x2="500" y2="274" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="450" y="386" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">most civil claims start here</text><rect x="300" y="124" width="300" height="59" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="158.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Supreme Court</text><rect x="300" y="214" width="300" height="59" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="248.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Court of Appeal</text><rect x="140" y="304" width="260" height="59" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="270" y="338.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">County Court</text><rect x="500" y="304" width="260" height="59" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="630" y="338.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">High Court</text><text x="30" y="428" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">TRACK BY VALUE AND COMPLEXITY (axis to scale up to £40,000; multi-track continues)</text><rect x="60" y="448" width="195" height="48" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="157.5" y="478" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">small claims</text><rect x="255" y="448" width="292.5" height="48" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="401.25" y="478" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">fast track</text><rect x="547.5" y="448" width="292.5" height="48" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="693.75" y="470" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">multi-track; intermediate</text><text x="693.75" y="489" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">track (2023) for some claims</text><text x="255" y="518" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">£10,000</text><text x="547.5" y="518" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">£25,000</text><text x="60" y="518" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">£0</text><rect x="30" y="546" width="413" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="588.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">OVERRIDING OBJECTIVE</text><text x="50" y="620.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Deal with cases justly and at proportionate cost.</text><rect x="457" y="546" width="413" height="109" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="477" y="578" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">TRIBUNALS (2007 ACT)</text><text x="477" y="609.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">First-tier Tribunal in chambers → Upper Tribunal</text><text x="477" y="630.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">hears appeals.</text>
