<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">ADR: who decides, and is it binding?</text>

<clipPath id="tc100"><rect x="30" y="100" width="840" height="388" rx="14"/></clipPath><g clip-path="url(#tc100)"><rect x="30" y="100" width="146.08695652173913" height="48" fill="#b5d3cf"/><text x="44" y="127.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Method</text><rect x="176.08695652173913" y="100" width="255.65217391304344" height="48" fill="#b5d3cf"/><text x="190.08695652173913" y="127.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Who decides</text><rect x="431.73913043478257" y="100" width="200.8695652173913" height="48" fill="#f2e7b8"/><text x="445.73913043478257" y="127.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Binding?</text><rect x="632.6086956521739" y="100" width="237.39130434782606" height="48" fill="#b5d3cf"/><text x="646.6086956521739" y="127.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Example</text><rect x="30" y="148" width="146.08695652173913" height="68" fill="#dce9e7"/><text x="44" y="174.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Negotiation</text><rect x="176.08695652173913" y="148" width="255.65217391304344" height="68" fill="#ffffff"/><text x="190.08695652173913" y="174.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The parties themselves</text><rect x="431.73913043478257" y="148" width="200.8695652173913" height="68" fill="#ffffff"/><text x="445.73913043478257" y="174.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Only if they agree</text><rect x="632.6086956521739" y="148" width="237.39130434782606" height="68" fill="#ffffff"/><text x="646.6086956521739" y="174.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Direct settlement between</text><text x="646.6086956521739" y="195.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">solicitors</text><line x1="30" y1="216" x2="870" y2="216" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="216" width="146.08695652173913" height="68" fill="#dce9e7"/><text x="44" y="242.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Mediation</text><rect x="176.08695652173913" y="216" width="255.65217391304344" height="68" fill="#f8faf9"/><text x="190.08695652173913" y="242.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The parties, helped by a</text><text x="190.08695652173913" y="263.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">neutral mediator</text><rect x="431.73913043478257" y="216" width="200.8695652173913" height="68" fill="#f8faf9"/><text x="445.73913043478257" y="242.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Only if they agree</text><rect x="632.6086956521739" y="216" width="237.39130434782606" height="68" fill="#f8faf9"/><text x="646.6086956521739" y="242.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Family and neighbour</text><text x="646.6086956521739" y="263.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">disputes</text><line x1="30" y1="284" x2="870" y2="284" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="284" width="146.08695652173913" height="68" fill="#dce9e7"/><text x="44" y="310.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Conciliation</text><rect x="176.08695652173913" y="284" width="255.65217391304344" height="68" fill="#ffffff"/><text x="190.08695652173913" y="310.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The parties; the conciliator</text><text x="190.08695652173913" y="331.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">may suggest terms</text><rect x="431.73913043478257" y="284" width="200.8695652173913" height="68" fill="#ffffff"/><text x="445.73913043478257" y="310.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Only if they agree</text><rect x="632.6086956521739" y="284" width="237.39130434782606" height="68" fill="#ffffff"/><text x="646.6086956521739" y="310.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">ACAS in employment</text><text x="646.6086956521739" y="331.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">disputes</text><line x1="30" y1="352" x2="870" y2="352" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="352" width="146.08695652173913" height="68" fill="#dce9e7"/><text x="44" y="378.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Arbitration</text><rect x="176.08695652173913" y="352" width="255.65217391304344" height="68" fill="#f8faf9"/><text x="190.08695652173913" y="378.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">An arbitrator</text><rect x="431.73913043478257" y="352" width="200.8695652173913" height="68" fill="#f2e7b8"/><text x="445.73913043478257" y="378.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Yes, under the</text><text x="445.73913043478257" y="399.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Arbitration Act 1996</text><rect x="632.6086956521739" y="352" width="237.39130434782606" height="68" fill="#f8faf9"/><text x="646.6086956521739" y="378.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Commercial and consumer</text><text x="646.6086956521739" y="399.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">scheme disputes</text><line x1="30" y1="420" x2="870" y2="420" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="420" width="146.08695652173913" height="68" fill="#dce9e7"/><text x="44" y="446.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Ombudsman</text><rect x="176.08695652173913" y="420" width="255.65217391304344" height="68" fill="#ffffff"/><text x="190.08695652173913" y="446.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Investigates complaints</text><rect x="431.73913043478257" y="420" width="200.8695652173913" height="68" fill="#ffffff"/><text x="445.73913043478257" y="446.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Depends on the</text><text x="445.73913043478257" y="467.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">scheme</text><rect x="632.6086956521739" y="420" width="237.39130434782606" height="68" fill="#ffffff"/><text x="646.6086956521739" y="446.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Financial Ombudsman</text><text x="646.6086956521739" y="467.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Service</text></g><line x1="176.08695652173913" y1="100" x2="176.08695652173913" y2="488" stroke="#c9d6d4" stroke-width="1.5"/><line x1="431.73913043478257" y1="100" x2="431.73913043478257" y2="488" stroke="#c9d6d4" stroke-width="1.5"/><line x1="632.6086956521739" y1="100" x2="632.6086956521739" y2="488" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="100" width="840" height="388" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/><line x1="80" y1="534" x2="820" y2="534" stroke="#8a6d0d" stroke-width="4" marker-end="url(#ahO)"/><text x="80" y="564" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">parties in control</text><text x="820" y="564" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">third party decides</text>
</svg>