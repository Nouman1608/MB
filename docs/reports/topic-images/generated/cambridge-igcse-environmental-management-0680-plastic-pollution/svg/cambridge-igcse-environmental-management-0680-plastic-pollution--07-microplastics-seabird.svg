<rect width="900" height="675" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How microplastics harm a seabird</text>

<rect x="30" y="110" width="840" height="110" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="70" cy="165" r="22" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="70" y="172.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="110" y="154" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Microplastics eaten</text><text x="340.6" y="154" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="start">[1 mark]</text><text x="110" y="184" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="start">plankton and small fish mistake them for food</text><circle cx="720" cy="165" r="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><circle cx="715" cy="160" r="2.8" fill="#b5602e" stroke="#b5602e" stroke-width="0.5"/><circle cx="718" cy="167" r="2.8" fill="#b5602e" stroke="#b5602e" stroke-width="0.5"/><path d="M770.8,165 Q790,153 806.8,165 Q790,177 770.8,165 Z M804.4,165 L818.8,155.4 L818.8,174.6 Z" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.6" stroke-linejoin="round"/><circle cx="778" cy="160" r="2.8" fill="#b5602e" stroke="#b5602e" stroke-width="0.5"/><circle cx="791" cy="167" r="2.8" fill="#b5602e" stroke="#b5602e" stroke-width="0.5"/><line x1="450" y1="222" x2="450" y2="238" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="240" width="840" height="110" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="70" cy="295" r="22" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="70" y="302.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="110" y="284" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Build-up in each fish</text><text x="363.4" y="284" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="start">[1 mark]</text><text x="110" y="314" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="start">toxic chemicals on the plastic accumulate over time</text><text x="110" y="335" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="start">(bioaccumulation)</text><path d="M718,295 Q750,275 778,295 Q750,315 718,295 Z M774,295 L798,279 L798,311 Z" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.6" stroke-linejoin="round"/><circle cx="728" cy="285" r="2.8" fill="#b5602e" stroke="#b5602e" stroke-width="0.5"/><circle cx="741" cy="292" r="2.8" fill="#b5602e" stroke="#b5602e" stroke-width="0.5"/><circle cx="754" cy="299" r="2.8" fill="#b5602e" stroke="#b5602e" stroke-width="0.5"/><circle cx="767" cy="286" r="2.8" fill="#b5602e" stroke="#b5602e" stroke-width="0.5"/><circle cx="740" cy="293" r="2.8" fill="#b5602e" stroke="#b5602e" stroke-width="0.5"/><circle cx="753" cy="300" r="2.8" fill="#b5602e" stroke="#b5602e" stroke-width="0.5"/><line x1="450" y1="352" x2="450" y2="368" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="370" width="840" height="110" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="70" cy="425" r="22" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="70" y="432.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="110" y="414" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Seabird eats many fish</text><text x="374.8" y="414" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="start">[1 mark]</text><text x="110" y="444" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="start">concentration in the bird is much higher than in any one</text><text x="110" y="465" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="start">fish (biomagnification)</text><path d="M700,440 q30,-40 70,-20 l40,-20 l-14,22 q30,10 10,30 q-50,10 -106,-12 z" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><circle cx="735" cy="425" r="2.8" fill="#b5602e" stroke="#b5602e" stroke-width="0.5"/><circle cx="748" cy="432" r="2.8" fill="#b5602e" stroke="#b5602e" stroke-width="0.5"/><circle cx="761" cy="439" r="2.8" fill="#b5602e" stroke="#b5602e" stroke-width="0.5"/><circle cx="774" cy="428" r="2.8" fill="#b5602e" stroke="#b5602e" stroke-width="0.5"/><circle cx="741" cy="435" r="2.8" fill="#b5602e" stroke="#b5602e" stroke-width="0.5"/><circle cx="754" cy="442" r="2.8" fill="#b5602e" stroke="#b5602e" stroke-width="0.5"/><circle cx="767" cy="431" r="2.8" fill="#b5602e" stroke="#b5602e" stroke-width="0.5"/><circle cx="780" cy="438" r="2.8" fill="#b5602e" stroke="#b5602e" stroke-width="0.5"/><circle cx="747" cy="427" r="2.8" fill="#b5602e" stroke="#b5602e" stroke-width="0.5"/><circle cx="760" cy="434" r="2.8" fill="#b5602e" stroke="#b5602e" stroke-width="0.5"/><circle cx="773" cy="441" r="2.8" fill="#b5602e" stroke="#b5602e" stroke-width="0.5"/><circle cx="740" cy="430" r="2.8" fill="#b5602e" stroke="#b5602e" stroke-width="0.5"/><line x1="450" y1="482" x2="450" y2="498" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="500" width="840" height="110" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="70" cy="555" r="22" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="70" y="562.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="110" y="544" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Harm to the bird</text><text x="306.4" y="544" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="start">[1 mark]</text><text x="110" y="574" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="start">damaged health and reduced breeding success</text><text x="450" y="650" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Each step names the organism and the process, and the answer ends with an effect on the bird.</text>
</svg>