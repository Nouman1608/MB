<rect width="900" height="695" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four impacts on marine ecosystems</text>

<rect x="30" y="110" width="410" height="270" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="60" cy="144" r="18" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="150.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="90" y="152" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Visual pollution</text><text x="54" y="296" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">litter spoils coasts, reduces tourism and</text><text x="54" y="317" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">coastal value; clean-ups cost councils</text><text x="54" y="338" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">money</text><rect x="60" y="180" width="350" height="50" fill="#dce9e7"/><rect x="60" y="230" width="350" height="34" fill="#efdfa8"/><rect x="100" y="240" width="16" height="10" rx="2" fill="#b5602e" stroke="#1e2a44" stroke-width="1.5"/><rect x="170" y="246" width="20" height="10" rx="2" fill="#2b5a9a" stroke="#1e2a44" stroke-width="1.5"/><rect x="250" y="238" width="24" height="10" rx="2" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.5"/><rect x="320" y="248" width="16" height="10" rx="2" fill="#2e6b62" stroke="#1e2a44" stroke-width="1.5"/><rect x="140" y="220" width="20" height="10" rx="2" fill="#ffffff" stroke="#1e2a44" stroke-width="1.5"/><rect x="290" y="206" width="24" height="10" rx="2" fill="#b5602e" stroke="#1e2a44" stroke-width="1.5"/><rect x="460" y="110" width="410" height="270" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="490" cy="144" r="18" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="490" y="150.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="520" y="152" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Entanglement</text><text x="484" y="296" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">nets, ropes, straps and loops trap</text><text x="484" y="317" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">turtles, seals, seabirds, fish and whales;</text><text x="484" y="338" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">lost nets keep catching for years</text><rect x="490" y="180" width="350" height="84" fill="#dce9e7"/><line x1="540" y1="184" x2="520" y2="260" stroke="#4a5568" stroke-width="1.5"/><line x1="580" y1="184" x2="564" y2="260" stroke="#4a5568" stroke-width="1.5"/><line x1="620" y1="184" x2="608" y2="260" stroke="#4a5568" stroke-width="1.5"/><line x1="660" y1="184" x2="652" y2="260" stroke="#4a5568" stroke-width="1.5"/><line x1="700" y1="184" x2="696" y2="260" stroke="#4a5568" stroke-width="1.5"/><line x1="740" y1="184" x2="740" y2="260" stroke="#4a5568" stroke-width="1.5"/><line x1="780" y1="184" x2="784" y2="260" stroke="#4a5568" stroke-width="1.5"/><path d="M500,200 Q660,230 830,196 M505,240 Q660,260 830,234" fill="none" stroke="#4a5568" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><ellipse cx="665" cy="222" rx="34" ry="21" fill="#6f9a52" stroke="#1e2a44" stroke-width="2"/><circle cx="704" cy="216" r="9" fill="#6f9a52" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="400" width="410" height="270" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="60" cy="434" r="18" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="440.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="90" y="442" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Mistaken for food</text><text x="54" y="586" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">bags look like jellyfish to turtles;</text><text x="54" y="607" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">fragments look like prey; swallowed</text><text x="54" y="628" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">plastic blocks the gut, so the animal</text><text x="54" y="649" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">feels full and starves</text><rect x="60" y="466" width="350" height="94" fill="#dce9e7"/><path d="M110,496 q30,-28 60,0 l0,8 q-30,6 -60,0 z" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><path d="M120,504 q-4,26 6,40 M140,504 q4,26 -4,40 M160,504 q-4,26 6,40" fill="none" stroke="#4a5568" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><path d="M285,496 q25,-26 50,0 l0,8 q-25,5 -50,0 z" fill="#b5602e" opacity="0.75" stroke="#1e2a44" stroke-width="2"/><path d="M293,504 q-3,26 5,40 M310,504 q3,26 -3,40 M327,504 q-3,26 5,40" fill="none" stroke="#b5602e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><text x="222" y="522" font-size="15.5" font-weight="600" fill="#1e2a44" text-anchor="middle">looks like</text><rect x="120.5" y="541.75" width="39" height="20.25" rx="5" fill="#dce9e7" opacity="1"/><text x="140" y="556" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">bag</text><rect x="263.5" y="541.75" width="93" height="20.25" rx="5" fill="#dce9e7" opacity="1"/><text x="310" y="556" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">jellyfish</text><rect x="460" y="400" width="410" height="270" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="490" cy="434" r="18" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="490" y="440.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="520" y="442" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Bioaccumulation, biomagnification</text><text x="484" y="586" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">plastic and absorbed toxic chemicals build</text><text x="484" y="607" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">up in an organism, then concentrate up the</text><text x="484" y="628" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">food chain to people who eat seafood</text><circle cx="510" cy="510" r="7" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><circle cx="505" cy="506" r="2.8" fill="#b5602e" stroke="#b5602e" stroke-width="0.5"/><line x1="522" y1="510" x2="552" y2="510" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><path d="M569,510 Q585,500 599,510 Q585,520 569,510 Z M597,510 L609,502 L609,518 Z" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.6" stroke-linejoin="round"/><circle cx="574" cy="506" r="2.8" fill="#b5602e" stroke="#b5602e" stroke-width="0.5"/><circle cx="587" cy="513" r="2.8" fill="#b5602e" stroke="#b5602e" stroke-width="0.5"/><circle cx="582" cy="512" r="2.8" fill="#b5602e" stroke="#b5602e" stroke-width="0.5"/><line x1="614" y1="510" x2="646" y2="510" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><path d="M664.4,510 Q690,494 712.4,510 Q690,526 664.4,510 Z M709.2,510 L728.4,497.2 L728.4,522.8 Z" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.6" stroke-linejoin="round"/><circle cx="670" cy="502" r="2.8" fill="#b5602e" stroke="#b5602e" stroke-width="0.5"/><circle cx="683" cy="509" r="2.8" fill="#b5602e" stroke="#b5602e" stroke-width="0.5"/><circle cx="696" cy="516" r="2.8" fill="#b5602e" stroke="#b5602e" stroke-width="0.5"/><circle cx="675" cy="507" r="2.8" fill="#b5602e" stroke="#b5602e" stroke-width="0.5"/><circle cx="688" cy="514" r="2.8" fill="#b5602e" stroke="#b5602e" stroke-width="0.5"/><circle cx="701" cy="505" r="2.8" fill="#b5602e" stroke="#b5602e" stroke-width="0.5"/><circle cx="680" cy="512" r="2.8" fill="#b5602e" stroke="#b5602e" stroke-width="0.5"/><circle cx="693" cy="503" r="2.8" fill="#b5602e" stroke="#b5602e" stroke-width="0.5"/><line x1="734" y1="510" x2="764" y2="510" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><circle cx="800" cy="494.6" r="7.700000000000001" fill="#1e2a44"/><path d="M790.1,532 L790.1,514.4 Q790.1,504.5 800,504.5 Q809.9,504.5 809.9,514.4 L809.9,532 Z" fill="#1e2a44"/><text x="510" y="552" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">plankton</text><text x="585" y="552" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">fish</text><text x="690" y="552" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">predator</text><text x="800" y="552" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">people</text>
