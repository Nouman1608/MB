<rect width="900" height="645" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Two routes to microplastics</text>

<rect x="30" y="110" width="410" height="330" rx="14" fill="#fbf1ea" stroke="#b5602e" stroke-width="2.5"/><text x="235" y="146" font-size="20" font-weight="700" fill="#b5602e" text-anchor="middle">Route 1: breakdown</text><rect x="70" y="190" width="56" height="120" rx="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><rect x="86" y="172" width="24" height="20" rx="4" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><line x1="140" y1="250" x2="190" y2="250" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><path d="M205,225 l26,-6 l6,24 l-24,10 z M245,260 l22,4 l-6,22 l-20,-6 z M210,275 l16,2 l-4,16 l-14,-4 z" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><line x1="282" y1="250" x2="320" y2="250" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="335" y="222" width="7" height="6" fill="#2e6b62"/><rect x="353" y="222" width="7" height="6" fill="#2e6b62"/><rect x="371" y="222" width="7" height="6" fill="#2e6b62"/><rect x="389" y="222" width="7" height="6" fill="#2e6b62"/><rect x="335" y="238" width="7" height="6" fill="#2e6b62"/><rect x="353" y="238" width="7" height="6" fill="#2e6b62"/><rect x="371" y="238" width="7" height="6" fill="#2e6b62"/><rect x="389" y="238" width="7" height="6" fill="#2e6b62"/><rect x="335" y="254" width="7" height="6" fill="#2e6b62"/><rect x="353" y="254" width="7" height="6" fill="#2e6b62"/><rect x="371" y="254" width="7" height="6" fill="#2e6b62"/><rect x="389" y="254" width="7" height="6" fill="#2e6b62"/><rect x="335" y="270" width="7" height="6" fill="#2e6b62"/><rect x="353" y="270" width="7" height="6" fill="#2e6b62"/><rect x="371" y="270" width="7" height="6" fill="#2e6b62"/><rect x="389" y="270" width="7" height="6" fill="#2e6b62"/><text x="235" y="352" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="middle">sunlight, waves and abrasion break</text><text x="235" y="374" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="middle">non-biodegradable plastics into</text><text x="235" y="396" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="middle">ever smaller fragments</text><rect x="460" y="110" width="410" height="330" rx="14" fill="#eef5f4" stroke="#2e6b62" stroke-width="2.5"/><text x="665" y="146" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle">Route 2: made small</text><rect x="520" y="200" width="70" height="100" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><rect x="532" y="182" width="46" height="20" rx="4" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><circle cx="534" cy="228" r="3.5" fill="#2e6b62" stroke="#2e6b62" stroke-width="1"/><circle cx="548" cy="228" r="3.5" fill="#2e6b62" stroke="#2e6b62" stroke-width="1"/><circle cx="562" cy="228" r="3.5" fill="#2e6b62" stroke="#2e6b62" stroke-width="1"/><circle cx="576" cy="228" r="3.5" fill="#2e6b62" stroke="#2e6b62" stroke-width="1"/><circle cx="534" cy="246" r="3.5" fill="#2e6b62" stroke="#2e6b62" stroke-width="1"/><circle cx="548" cy="246" r="3.5" fill="#2e6b62" stroke="#2e6b62" stroke-width="1"/><circle cx="562" cy="246" r="3.5" fill="#2e6b62" stroke="#2e6b62" stroke-width="1"/><circle cx="576" cy="246" r="3.5" fill="#2e6b62" stroke="#2e6b62" stroke-width="1"/><circle cx="534" cy="264" r="3.5" fill="#2e6b62" stroke="#2e6b62" stroke-width="1"/><circle cx="548" cy="264" r="3.5" fill="#2e6b62" stroke="#2e6b62" stroke-width="1"/><circle cx="562" cy="264" r="3.5" fill="#2e6b62" stroke="#2e6b62" stroke-width="1"/><circle cx="576" cy="264" r="3.5" fill="#2e6b62" stroke="#2e6b62" stroke-width="1"/><circle cx="720" cy="250" r="46" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><circle cx="720" cy="250" r="30" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><path d="M700,240 q10,-12 20,0 q10,12 20,0 M700,258 q10,-12 20,0 q10,12 20,0" fill="none" stroke="#2b5a9a" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><text x="545" y="326" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="middle">cosmetics, scrubs,</text><text x="545" y="345" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="middle">cleaning products</text><text x="745" y="326" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="middle">fibres shed when</text><text x="745" y="345" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="middle">washing synthetic clothes</text><text x="665" y="392" font-size="16.5" font-weight="600" fill="#1e2a44" text-anchor="middle">used in commercial products</text><rect x="30" y="460" width="840" height="160" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="60" y="498" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Microplastics: less than 5 mm long</text><line x1="70" y1="560" x2="270" y2="560" stroke="#1e2a44" stroke-width="3"/><line x1="70" y1="548" x2="70" y2="572" stroke="#1e2a44" stroke-width="3"/><line x1="270" y1="548" x2="270" y2="572" stroke="#1e2a44" stroke-width="3"/><text x="170" y="594" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="middle">5 mm (enlarged)</text><rect x="90" y="530" width="10" height="8" fill="#2e6b62"/><rect x="118" y="530" width="14" height="8" fill="#2e6b62"/><rect x="146" y="530" width="18" height="8" fill="#2e6b62"/><rect x="174" y="530" width="10" height="8" fill="#2e6b62"/><rect x="202" y="530" width="14" height="8" fill="#2e6b62"/><rect x="230" y="530" width="18" height="8" fill="#2e6b62"/><text x="330" y="538" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">small enough to pass through many filters</text><text x="330" y="562" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">and to be eaten by plankton</text>
</svg>