<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 665" width="900" height="665" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="665" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How biodegradable plastics break down</text>

<rect x="40" y="140" width="200" height="120" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="140" y="190" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Biodegradable</text><text x="140" y="216" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">plastic</text><text x="140" y="242" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">(designed to decompose)</text><line x1="244" y1="200" x2="330" y2="200" stroke="#1e2a44" stroke-width="6" marker-end="url(#ah)"/><rect x="336" y="140" width="210" height="120" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="441" y="182" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">bacteria</text><text x="441" y="208" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">and fungi</text><text x="441" y="238" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="middle">in water or soil</text><line x1="550" y1="200" x2="620" y2="200" stroke="#1e2a44" stroke-width="6" marker-end="url(#ah)"/><rect x="628" y="116" width="230" height="38" rx="19" fill="#eef5f4" stroke="#2e6b62" stroke-width="2.5"/><text x="743" y="140.94" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="middle">water</text><rect x="628" y="162" width="230" height="38" rx="19" fill="#eef5f4" stroke="#2e6b62" stroke-width="2.5"/><text x="743" y="186.94" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="middle">biomass</text><rect x="628" y="208" width="230" height="38" rx="19" fill="#eef5f4" stroke="#2e6b62" stroke-width="2.5"/><text x="743" y="232.94" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="middle">carbon dioxide</text><rect x="628" y="254" width="230" height="38" rx="19" fill="#eef5f4" stroke="#2e6b62" stroke-width="2.5"/><text x="743" y="278.94" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="middle">methane*</text><text x="860" y="316" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">*where oxygen is scarce, e.g. deep in landfill</text><text x="450" y="368" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">The RATE depends on biotic and abiotic factors</text><rect x="30" y="386" width="260" height="130" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="420.15" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Biotic</text><text x="48" y="445.72499999999997" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">the number and type of</text><text x="48" y="467.505" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">bacteria and fungi</text><text x="48" y="489.28499999999997" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">present</text><rect x="306" y="386" width="564" height="130" rx="14" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="324" y="420.15" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="start">Abiotic</text><text x="324" y="445.72499999999997" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">temperature, moisture, oxygen availability, light and the</text><text x="324" y="467.505" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">thickness of the item</text><rect x="30" y="536" width="410" height="106" rx="14" fill="#eef5f4" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="569.725" font-size="18.5" font-weight="700" fill="#2e6b62" text-anchor="start">Fast: industrial composting</text><text x="48" y="595.3000000000001" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">warm, moist, controlled conditions</text><rect x="460" y="536" width="410" height="106" rx="14" fill="#fbf1ea" stroke="#b5602e" stroke-width="2.5"/><text x="478" y="569.725" font-size="18.5" font-weight="700" fill="#b5602e" text-anchor="start">Slow: deep in the sea</text><text x="478" y="595.3000000000001" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">cold, dark, low oxygen: a “biodegradable”</text><text x="478" y="617.08" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">bag may persist a long time</text>
</svg>