0" x2="120" y2="170" stroke="#1e2a44" stroke-width="2.5"/><text x="106" y="176" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="end">70</text><line x1="122" y1="170" x2="530" y2="170" stroke="#e3e9e8" stroke-width="1.5"/><text x="58" y="350" font-size="16" fill="#4a5568" text-anchor="middle" transform="rotate(-90 58 350)">mass lost in 12 weeks (%)</text><rect x="150" y="220" width="66" height="300" fill="#2e6b62" stroke="#1e2a44" stroke-width="2.5"/><text x="183" y="210" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">60%</text><text x="183" y="546" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="middle">soil</text><rect x="230" y="470" width="66" height="50" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="263" y="460" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">10%</text><text x="263" y="546" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="middle">seawater</text><rect x="350" y="520" width="66" height="2" fill="#b5602e" stroke="#1e2a44" stroke-width="2.5"/><text x="383" y="510" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">0%</text><text x="383" y="546" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="middle">soil</text><rect x="430" y="520" width="66" height="2" fill="#b5602e" stroke="#1e2a44" stroke-width="2.5"/><text x="463" y="510" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">0%</text><text x="463" y="546" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="middle">seawater</text><text x="222" y="572" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Plastic A</text><text x="422" y="572" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Plastic B</text><text x="540" y="140" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">invented data</text><rect x="570" y="110" width="300" height="500" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="592" y="148" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Calculations</text><text x="592" y="178" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A in soil: (5.0 − 2.0) ÷ 5.0</text><text x="592" y="200" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">× 100 = 60%</text><text x="592" y="222" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A in seawater: (5.0 − 4.5)</text><text x="592" y="244" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">÷ 5.0 × 100 = 10%</text><text x="592" y="290" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Interpret</text><text x="592" y="318" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A is biodegradable: six times</text><text x="592" y="339" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">faster in soil, with more</text><text x="592" y="360" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">decomposers and warmth. B lost</text><text x="592" y="381" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">nothing: non-biodegradable.</text><text x="592" y="470" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">Evaluate</text><text x="592" y="498" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">one strip per condition:</text><text x="592" y="519" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">repeat; measure temperature in</text><text x="592" y="540" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">both</text>
</svg>