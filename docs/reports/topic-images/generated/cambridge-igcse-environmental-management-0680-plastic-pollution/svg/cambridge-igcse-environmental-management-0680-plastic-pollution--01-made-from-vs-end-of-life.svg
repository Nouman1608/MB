<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="900" height="650" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="650" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Two questions about any plastic</text>

<text x="550" y="132" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">What happens at end of life?</text><text x="400" y="158" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">biodegradable</text><text x="700" y="158" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">non-biodegradable</text><text x="58" y="340" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle" transform="rotate(-90 58 340)">What is it made from?</text><text x="160" y="249" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="middle">fossil fuels</text><text x="160" y="270" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="middle">(crude oil,</text><text x="160" y="291" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="middle">natural gas)</text><text x="160" y="419" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="middle">biological</text><text x="160" y="440" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="middle">materials (plant</text><text x="160" y="461" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="middle">starch, sugar)</text><rect x="256" y="176" width="288" height="158" rx="12" fill="#f4f6f6" stroke="#c9d6d4" stroke-width="2.5"/><rect x="556" y="176" width="288" height="158" rx="12" fill="#fbf1ea" stroke="#b5602e" stroke-width="2.5"/><rect x="256" y="346" width="288" height="158" rx="12" fill="#eef5f4" stroke="#2e6b62" stroke-width="2.5"/><rect x="556" y="346" width="288" height="158" rx="12" fill="#eef5f4" stroke="#2e6b62" stroke-width="2.5"/><text x="400" y="240" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="middle">conventional plastics</text><text x="400" y="260" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="middle">are generally</text><text x="400" y="280" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="middle">non-biodegradable</text><text x="700" y="234" font-size="19" font-weight="700" fill="#b5602e" text-anchor="middle">Conventional plastics</text><text x="700" y="264" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">made from fossil fuels;</text><text x="700" y="285" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">generally non-biodegradable</text><text x="400" y="404" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">Bioplastic</text><text x="400" y="434" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">that is biodegradable</text><text x="700" y="404" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">Bioplastic</text><text x="700" y="434" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">that is non-biodegradable,</text><text x="700" y="455" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">e.g. from sugar cane</text><rect x="252" y="342" width="596" height="166" rx="14" fill="none" stroke="#2e6b62" stroke-width="4" stroke-dasharray="12 7"/><rect x="30" y="530" width="840" height="95" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="568" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">“Bioplastic” does NOT mean “biodegradable”.</text><text x="450" y="600" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Bioplastics can be either: some are as persistent as conventional plastics.</text>
</svg>