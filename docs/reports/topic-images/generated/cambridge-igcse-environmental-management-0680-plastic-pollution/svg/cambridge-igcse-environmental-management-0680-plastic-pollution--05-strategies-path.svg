<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 625" width="900" height="625" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="625" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Where each strategy acts</text>

<rect x="40" y="140" width="220" height="70" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="150" y="183" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Plastic used</text><line x1="264" y1="175" x2="336" y2="175" stroke="#1e2a44" stroke-width="5" marker-end="url(#ah)"/><rect x="340" y="140" width="220" height="70" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="183" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Plastic waste</text><line x1="564" y1="175" x2="636" y2="175" stroke="#1e2a44" stroke-width="5" marker-end="url(#ah)"/><rect x="640" y="140" width="220" height="70" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="750" y="174" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Rivers</text><text x="750" y="196" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">and the sea</text><path d="M150,252 L150,216" fill="none" stroke="#2e6b62" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahT)"/><path d="M600,252 L600,180" fill="none" stroke="#2e6b62" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahT)"/><rect x="30" y="262" width="400" height="170" rx="14" fill="#eef5f4" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="296.15" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Reduce the total used</text><text x="50" y="330" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="66" y="330" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Alternative packaging: paper, card,</text><text x="66" y="351" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">glass, metal, reusable</text><text x="50" y="380" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="66" y="380" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Avoid single-use plastics: charges or</text><text x="66" y="401" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">bans on bags, straws, cutlery, cups</text><rect x="470" y="262" width="400" height="170" rx="14" fill="#eef5f4" stroke="#2e6b62" stroke-width="2.5"/><text x="488" y="296.15" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Stop it leaking out</text><text x="490" y="330" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="506" y="330" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Safe disposal: bins, collection, managed</text><text x="506" y="351" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">landfill, nets on drains</text><text x="490" y="380" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="506" y="380" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Recycling: collected, sorted, made into</text><text x="506" y="401" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">new products</text><rect x="30" y="452" width="840" height="90" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="60" y="488" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Legislation and enforcement backs all of these up</text><text x="60" y="516" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">e.g. bans on microbeads, dumping at sea or littering, with fines</text><text x="450" y="580" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Limits: behaviour change, cost and infrastructure, hard-to-recycle plastics,</text><text x="450" y="602" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">and plastic crosses borders on ocean currents.</text>
</svg>