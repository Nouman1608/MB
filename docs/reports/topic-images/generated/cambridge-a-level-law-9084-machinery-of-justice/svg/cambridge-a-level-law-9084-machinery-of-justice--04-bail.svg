<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="600" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Bail: police and court</text>

<rect x="30" y="100" width="412" height="221" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="130" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">POLICE BAIL (PACE)</text><text x="48" y="156.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Custody officer may release before or</text><text x="48" y="179.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">after charge</text><text x="48" y="207.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">CJPOA 1994: conditions can be attached</text><text x="48" y="234.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">s25:</tspan> murder, manslaughter, rape or other serious</text><text x="48" y="255.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">sexual offence with a previous such conviction:</text><text x="48" y="276.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">bail only in exceptional circumstances</text><rect x="458" y="100" width="412" height="221" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="476" y="130" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">COURT BAIL</text><text x="476" y="156.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">s4 Bail Act 1976: a general right to bail</text><text x="476" y="184.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Refused for an imprisonable offence only on</text><text x="476" y="205.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">substantial grounds for believing the defendant</text><text x="476" y="226.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">would:</text><text x="476" y="250.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">• abscond</text><text x="476" y="274.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">• offend on bail</text><text x="476" y="298.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">• interfere with witnesses</text><rect x="30" y="343" width="840" height="105" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="373" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FACTORS</text><text x="48" y="404.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Nature and seriousness of the offence and likely sentence; character, antecedents, associations and</text><text x="48" y="425.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">community ties; record of answering bail; strength of the evidence</text><text x="450" y="484" font-size="16" font-weight="700" fill="#4a5568" text-anchor="middle">POSSIBLE CONDITIONS</text><rect x="116.12800000000004" y="498" width="104.88" height="30" rx="15" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="168.56800000000004" y="518.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Residence</text><rect x="231.00800000000004" y="498" width="81.03999999999999" height="30" rx="15" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="271.528" y="518.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Curfew</text><rect x="322.048" y="498" width="240.192" height="30" rx="15" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="442.144" y="518.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Reporting to a police station</text><rect x="572.24" y="498" width="211.632" height="30" rx="15" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="678.056" y="518.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Surrendering a passport</text><rect x="249.32" y="538" width="189.6" height="30" rx="15" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="344.12" y="558.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Electronic monitoring</text><rect x="448.91999999999996" y="538" width="89.12" height="30" rx="15" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="493.47999999999996" y="558.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">A surety</text><rect x="548.04" y="538" width="102.64" height="30" rx="15" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="599.36" y="558.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">A security</text>
</svg>