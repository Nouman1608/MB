<rect width="900" height="720" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How long can the police detain a suspect?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Hours from arrival at the police station, to scale</text>
<rect x="60" y="184" width="195" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><rect x="255" y="184" width="97.5" height="46" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><rect x="352.5" y="184" width="487.5" height="46" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="157.5" y="214" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">s41</text><text x="303.75" y="214" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">s42</text><text x="596.25" y="214" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">ss43–44</text><line x1="60" y1="230" x2="60" y2="242" stroke="#1e2a44" stroke-width="2.5"/><text x="60" y="262" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">0h</text><line x1="255" y1="230" x2="255" y2="242" stroke="#1e2a44" stroke-width="2.5"/><text x="255" y="262" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">24h</text><line x1="352.5" y1="230" x2="352.5" y2="242" stroke="#1e2a44" stroke-width="2.5"/><text x="352.5" y="262" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">36h</text><line x1="840" y1="230" x2="840" y2="242" stroke="#1e2a44" stroke-width="2.5"/><text x="840" y="262" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">96h</text><text x="60" y="140" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Reviews (s40): first within 6 hours, then at least every 9 hours</text><path d="M108.75,180 l-7,-14 l14,0 z" fill="#2e6b62"/><path d="M181.875,180 l-7,-14 l14,0 z" fill="#2e6b62"/><path d="M255,180 l-7,-14 l14,0 z" fill="#2e6b62"/><path d="M328.125,180 l-7,-14 l14,0 z" fill="#2e6b62"/><path d="M401.25,180 l-7,-14 l14,0 z" fill="#2e6b62"/><path d="M474.375,180 l-7,-14 l14,0 z" fill="#2e6b62"/><path d="M547.5,180 l-7,-14 l14,0 z" fill="#2e6b62"/><path d="M620.625,180 l-7,-14 l14,0 z" fill="#2e6b62"/><path d="M693.75,180 l-7,-14 l14,0 z" fill="#2e6b62"/><path d="M766.875,180 l-7,-14 l14,0 z" fill="#2e6b62"/><rect x="30" y="286" width="270.6666666666667" height="97" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="44" y="312" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">UP TO 24 HOURS</text><text x="44" y="343.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">From arrival without charge</text><rect x="314.6666666666667" y="286" width="270.6666666666667" height="97" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="328.6666666666667" y="312" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">UP TO 36 HOURS</text><text x="328.6666666666667" y="343.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Indictable offence, on a</text><text x="328.6666666666667" y="364.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">superintendent’s authority</text><rect x="599.3333333333334" y="286" width="270.6666666666667" height="97" rx="14" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="613.3333333333334" y="312" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">UP TO 96 HOURS</text><text x="613.3333333333334" y="343.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">In total, with a magistrates’</text><text x="613.3333333333334" y="364.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">warrant</text><clipPath id="tc405"><rect x="30" y="405" width="840" height="283" rx="14"/></clipPath><g clip-path="url(#tc405)"><rect x="30" y="405" width="516.9230769230769" height="48" fill="#b5d3cf"/><text x="44" y="432.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Right while detained</text><rect x="546.9230769230769" y="405" width="323.07692307692304" height="48" fill="#b5d3cf"/><text x="560.9230769230769" y="432.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Source</text><rect x="30" y="453" width="516.9230769230769" height="47" fill="#dce9e7"/><text x="44" y="479.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Someone informed of the arrest</text><rect x="546.9230769230769" y="453" width="323.07692307692304" height="47" fill="#ffffff"/><text x="560.9230769230769" y="479.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">s56 and Code C</text><line x1="30" y1="500" x2="870" y2="500" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="500" width="516.9230769230769" height="47" fill="#dce9e7"/><text x="44" y="526.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Free, private legal advice</text><rect x="546.9230769230769" y="500" width="323.07692307692304" height="47" fill="#f8faf9"/><text x="560.9230769230769" y="526.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">s58 and Code C</text><line x1="30" y1="547" x2="870" y2="547" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="547" width="516.9230769230769" height="47" fill="#dce9e7"/><text x="44" y="573.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Appropriate adult for a juvenile or vulnerable person</text><rect x="546.9230769230769" y="547" width="323.07692307692304" height="47" fill="#ffffff"/><text x="560.9230769230769" y="573.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Code C</text><line x1="30" y1="594" x2="870" y2="594" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="594" width="516.9230769230769" height="47" fill="#dce9e7"/><text x="44" y="620.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Interviews audio-recorded, or visually recorded</text><rect x="546.9230769230769" y="594" width="323.07692307692304" height="47" fill="#f8faf9"/><text x="560.9230769230769" y="620.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">s60 (Code E), s60A (Code F)</text><line x1="30" y1="641" x2="870" y2="641" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="641" width="516.9230769230769" height="47" fill="#dce9e7"/><text x="44" y="667.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Eight hours’ continuous rest in any 24; meal breaks</text><rect x="546.9230769230769" y="641" width="323.07692307692304" height="47" fill="#ffffff"/><text x="560.9230769230769" y="667.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Code C</text></g><line x1="546.9230769230769" y1="405" x2="546.9230769230769" y2="688" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="405" width="840" height="283" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/>
</svg>