<rect width="900" height="697" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: advising Sami</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Each stage tested against PACE and the Codes</text>
<rect x="30" y="124" width="840" height="101" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="66" cy="174.5" r="18" fill="#ffffff" stroke="#b5602e" stroke-width="3"/><text x="66" y="182.5" font-size="22" font-weight="700" fill="#b5602e" text-anchor="middle">✗</text><text x="98" y="154.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Stop</text><text x="98" y="183.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">No reasonable suspicion: “young men round here carry knives” is a generalisation about age and</text><text x="98" y="204.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">locality</text><rect x="759.125" y="138" width="100.875" height="29" rx="14.5" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="809.5625" y="157.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">s1, Code A</text><rect x="30" y="235" width="840" height="80" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="66" cy="275" r="18" fill="#ffffff" stroke="#b5602e" stroke-width="3"/><text x="66" y="283" font-size="22" font-weight="700" fill="#b5602e" text-anchor="middle">✗</text><text x="98" y="265.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Arrest</text><text x="98" y="294.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Not told why; necessity doubtful</text><rect x="771.83" y="249" width="88.17" height="29" rx="14.5" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="815.9150000000001" y="268.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">s28, s24</text><rect x="30" y="325" width="840" height="80" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="66" cy="365" r="18" fill="#ffffff" stroke="#b5602e" stroke-width="3"/><text x="66" y="373" font-size="22" font-weight="700" fill="#b5602e" text-anchor="middle">✗</text><text x="98" y="355.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Detention</text><text x="98" y="384.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">30 hours: beyond 24 needs a superintendent’s authority for an indictable offence; none mentioned</text><rect x="808.01" y="339" width="51.989999999999995" height="29" rx="14.5" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="834.005" y="358.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">s42</text><rect x="30" y="415" width="840" height="80" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="66" cy="455" r="18" fill="#ffffff" stroke="#b5602e" stroke-width="3"/><text x="66" y="463" font-size="22" font-weight="700" fill="#b5602e" text-anchor="middle">✗</text><text x="98" y="445.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Legal advice</text><text x="98" y="474.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Request for a solicitor refused without proper authority</text><rect x="808.25" y="429" width="51.75" height="29" rx="14.5" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="834.125" y="448.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">s58</text><line x1="450" y1="509" x2="450" y2="535" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="541" width="412" height="124" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="46" y="569" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">s78: DISCRETION</text><text x="46" y="595.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Exclude if unfair</text><text x="46" y="623.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Likely here: <tspan font-style="italic">R</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Samuel</tspan> (1988), access to a</text><text x="46" y="644.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">solicitor wrongly refused</text><rect x="458" y="541" width="412" height="124" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="474" y="569" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">s76: MUST EXCLUDE</text><text x="474" y="595.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Oppression or unreliability</text><text x="474" y="623.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Possible if the conditions were oppressive (<tspan font-style="italic">R</tspan> <tspan font-style="italic">v</tspan></text><text x="474" y="644.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Paris,</tspan> <tspan font-style="italic">Abdullahi</tspan> <tspan font-style="italic">and</tspan> <tspan font-style="italic">Miller</tspan>, 1993)</text>
</svg>