<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 910" width="900" height="910" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="910" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Criminal appeal routes</text>

<rect x="300" y="100" width="300" height="90" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="126.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Supreme Court</text><text x="450" y="154" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">certified point of law of general public</text><text x="450" y="174" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">importance</text><rect x="480" y="260" width="390" height="70" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="675" y="286.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Court of Appeal (Criminal Division)</text><text x="675" y="314" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">quashes an unsafe conviction; may order a retrial</text><rect x="30" y="260" width="390" height="93" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="225" y="286.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Divisional Court of the King’s Bench</text><text x="225" y="309.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Division</text><text x="225" y="337" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">case stated on a point of law</text><rect x="480" y="443" width="390" height="70" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="675" y="469.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Crown Court</text><text x="675" y="497" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">trial on indictment</text><rect x="30" y="603" width="390" height="70" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="225" y="629.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Magistrates’ Court</text><text x="225" y="657" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">summary trial</text><line x1="675" y1="256" x2="560" y2="194" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="225" y1="256" x2="340" y2="194" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="675" y1="439" x2="675" y2="357" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="690" y="391" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">defendant, with</text><text x="690" y="410" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">permission</text><line x1="225" y1="599" x2="225" y2="357" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="240" y="405" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">either side:</text><text x="240" y="424" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">case stated</text><line x1="420" y1="638" x2="476" y2="488" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="440" y="672" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">defendant: against conviction</text><text x="440" y="691" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">(full rehearing) or sentence</text><rect x="30" y="743" width="272" height="135" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="44" y="769" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PROSECUTION</text><text x="44" y="800" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Attorney General refers an unduly</text><text x="44" y="820" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">lenient sentence</text><rect x="314" y="743" width="272" height="135" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="328" y="769" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">RETRIAL AFTER ACQUITTAL</text><text x="328" y="800" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">CJA 2003: serious offence, new</text><text x="328" y="820" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">and compelling evidence (Gary</text><text x="328" y="840" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Dobson)</text><rect x="598" y="743" width="272" height="135" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="612" y="769" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CCRC</text><text x="612" y="800" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Criminal Cases Review</text><text x="612" y="820" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Commission refers possible</text><text x="612" y="840" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">miscarriages of justice to the</text><text x="612" y="860" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Court of Appeal</text>
</svg>