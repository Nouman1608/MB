<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 764" width="900" height="764" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="764" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A civil claim: from letter to track</text>

<rect x="150" y="100" width="277" height="75" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="288.5" y="142.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Protocol letter of claim</text><line x1="433" y1="137.5" x2="467" y2="137.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="473" y="100" width="277" height="75" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="611.5" y="128.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Claim form</text><text x="611.5" y="156.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">and particulars of claim</text><text x="450" y="223" font-size="16" font-weight="700" fill="#4a5568" text-anchor="middle">THE DEFENDANT MAY…</text><line x1="450" y1="191" x2="450" y2="205" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="241" width="269.3333333333333" height="145" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="164.66666666666666" y="304" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">ADMIT</text><text x="164.66666666666666" y="330.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Admits the claim</text><rect x="315.3333333333333" y="241" width="269.3333333333333" height="145" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="269" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">DEFEND</text><text x="450" y="295.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Files a defence</text><text x="450" y="323.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">within 14 days of service of the</text><text x="450" y="344.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">particulars, or 28 after</text><text x="450" y="365.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">acknowledging service</text><rect x="600.6666666666666" y="241" width="269.3333333333333" height="145" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="735.3333333333333" y="304" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">NOTHING</text><text x="735.3333333333333" y="330.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Risks judgment in default</text><line x1="450" y1="414" x2="450" y2="442" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="250" y="448" width="400" height="108" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="482.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Directions questionnaire</text><text x="450" y="510.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">then allocation by value, complexity and</text><text x="450" y="531.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">evidence</text><line x1="450" y1="586" x2="130.5" y2="612" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="450" y1="586" x2="343.5" y2="612" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="450" y1="586" x2="556.5" y2="612" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="450" y1="586" x2="769.5" y2="612" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="618" width="201" height="114" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="130.5" y="646.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Small claims</text><text x="130.5" y="674" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">Up to £10,000; informal;</text><text x="130.5" y="694" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">costs generally not</text><text x="130.5" y="714" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">recoverable</text><rect x="243" y="618" width="201" height="114" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="343.5" y="646.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Fast track</text><text x="343.5" y="674" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">£10,000 to £25,000;</text><text x="343.5" y="694" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">fixed timetable; trial of</text><text x="343.5" y="714" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">no more than a day</text><rect x="456" y="618" width="201" height="114" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="556.5" y="646.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Intermediate</text><text x="556.5" y="674" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">Since October 2023;</text><text x="556.5" y="694" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">many claims up to</text><text x="556.5" y="714" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">£100,000</text><rect x="669" y="618" width="201" height="114" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="769.5" y="646.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Multi-track</text><text x="769.5" y="674" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">Higher value or</text><text x="769.5" y="694" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">complex claims</text>
</svg>