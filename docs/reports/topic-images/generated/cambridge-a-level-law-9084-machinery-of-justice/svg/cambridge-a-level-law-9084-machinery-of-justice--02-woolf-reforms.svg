<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The Woolf reforms</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Access to Justice (1996) and the Civil Procedure Rules 1998</text>
<rect x="30" y="124" width="840" height="84" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="450" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">THE PROBLEM</text><text x="450" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Civil justice too costly, slow and complex, with lawyers controlling the pace</text><line x1="450" y1="214" x2="450" y2="232" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="252" width="272" height="96" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="166" y="280.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Overriding objective</text><text x="166" y="308.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Deal with cases justly and at</text><text x="166" y="329.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">proportionate cost</text><rect x="314" y="252" width="272" height="96" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="290.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Judicial case management</text><text x="450" y="319.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Timetables and sanctions</text><rect x="598" y="252" width="272" height="96" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="734" y="290.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Pre-action protocols</text><text x="734" y="319.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Early exchange of information</text><rect x="30" y="360" width="272" height="117" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="166" y="388.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Part 36 offers</text><text x="166" y="416.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Costs pressure on a party</text><text x="166" y="437.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">refusing a reasonable</text><text x="166" y="458.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">settlement</text><rect x="314" y="360" width="272" height="117" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="423.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Single joint experts</text><rect x="598" y="360" width="272" height="117" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="734" y="423.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Encouraging ADR</text><line x1="60" y1="519" x2="60" y2="763" stroke="#c9d6d4" stroke-width="4"/><rect x="104" y="499" width="766" height="79" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="529" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">RESULT</text><text x="122" y="555.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Cases settle earlier, but costs stayed high</text><circle cx="60" cy="538.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="547.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="104" y="590" width="766" height="79" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="620" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">2010</text><text x="122" y="646.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Lord Justice Jackson’s costs review</text><circle cx="60" cy="629.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="638.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="104" y="681" width="766" height="102" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="711" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">2013 → 2014</text><text x="122" y="737.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Missed deadlines: strict in Mitchell v News Group, then more balanced in Denton v</text><text x="122" y="760.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">TH White</text><circle cx="60" cy="732" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="740.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text>
</svg>