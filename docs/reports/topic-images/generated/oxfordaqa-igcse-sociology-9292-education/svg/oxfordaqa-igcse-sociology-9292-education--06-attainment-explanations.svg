<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 661" width="900" height="661" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="661" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Explaining differences in attainment</text>

<rect x="30" y="108" width="840" height="420" rx="20" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="52" y="142" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="start">OUTSIDE SCHOOL</text><rect x="300" y="230" width="300" height="220" rx="16" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="266" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">INSIDE SCHOOL</text><text x="450" y="302" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">In-school</text><text x="450" y="332" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Labelling, setting and</text><text x="450" y="353" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">streaming, subcultures,</text><text x="450" y="374" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">ethnocentric curricula</text><rect x="52" y="172" width="236" height="134" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="68" y="202" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Material</text><text x="68" y="228" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Poverty: less money for</text><text x="68" y="248" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">books, devices, tuition and</text><text x="68" y="268" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">quiet study space</text><rect x="612" y="172" width="236" height="134" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="628" y="202" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Cultural</text><text x="628" y="228" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Cultural capital, language</text><text x="628" y="248" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">and attitudes to education</text><text x="628" y="268" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">(Bourdieu)</text><rect x="52" y="380" width="236" height="134" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="68" y="410" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Home and community</text><text x="68" y="436" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Parents’ education,</text><text x="68" y="456" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">expectations and support;</text><text x="68" y="476" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">local job opportunities</text><rect x="612" y="380" width="236" height="134" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="628" y="410" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">They intersect</text><text x="628" y="436" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Class, gender and ethnicity</text><text x="628" y="456" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">combine, so disadvantages</text><text x="628" y="476" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">can add up</text><rect x="30" y="548" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="584" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Common mistake</text><text x="56" y="613" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Explaining gaps only by in-school factors. Use material and cultural explanations too.</text>
</svg>