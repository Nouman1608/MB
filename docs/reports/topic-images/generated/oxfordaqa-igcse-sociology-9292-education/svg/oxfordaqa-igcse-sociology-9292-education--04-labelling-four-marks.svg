<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 879" width="900" height="879" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="879" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Teacher expectations: a four-mark chain</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Each step is one mark</text>
<rect x="30" y="120" width="840" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="67" cy="168" r="21" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="67" y="175.56" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="104" y="159.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Label</text><text x="104" y="189.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A teacher labels a pupil as less able, perhaps because of their accent or background.</text><line x1="450" y1="220" x2="450" y2="256" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="262" width="840" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="67" cy="310" r="21" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="67" y="317.56" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="104" y="301.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Treatment</text><text x="104" y="331.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The teacher gives them easier work and less attention.</text><line x1="450" y1="362" x2="450" y2="398" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="404" width="840" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="67" cy="452" r="21" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="67" y="459.56" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="104" y="443.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Self-image</text><text x="104" y="473.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The pupil comes to see themselves as less able and stops trying.</text><line x1="450" y1="504" x2="450" y2="540" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="546" width="840" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="67" cy="594" r="21" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="67" y="601.56" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="104" y="585.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Self-fulfilling prophecy</text><text x="104" y="615.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Low attainment fulfils the original expectation.</text><rect x="30" y="660" width="840" height="193" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="696" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Evidence and limits</text><circle cx="61" cy="719.39" r="4.5" fill="#8a6d0d"/><text x="74" y="725" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Rosenthal and Jacobson:</tspan> pupils randomly described as about to “spurt” often made greater</text><text x="74" y="747" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">gains</text><circle cx="61" cy="771.39" r="4.5" fill="#8a6d0d"/><text x="74" y="777" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Becker:</tspan> teachers judge pupils against an “ideal pupil”, which middle-class pupils fitted</text><text x="74" y="799" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">most closely</text><circle cx="61" cy="823.39" r="4.5" fill="#8a6d0d"/><text x="74" y="829" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Labelling does not always work: pupils can reject labels</text>
</svg>