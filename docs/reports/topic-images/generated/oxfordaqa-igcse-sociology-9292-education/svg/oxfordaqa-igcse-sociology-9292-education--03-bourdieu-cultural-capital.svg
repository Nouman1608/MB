<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 507" width="900" height="507" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="507" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Bourdieu: cultural capital</text>

<rect x="30" y="108" width="250.66666666666666" height="106" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="155.33333333333331" y="140.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Middle-class home</text><text x="155.33333333333331" y="170.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Knowledge, language and</text><text x="155.33333333333331" y="191.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">tastes</text><line x1="284.66666666666663" y1="161" x2="320.66666666666663" y2="161" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="324.66666666666663" y="108" width="250.66666666666666" height="106" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="449.99999999999994" y="140.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Cultural capital</text><text x="449.99999999999994" y="170.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">What schools value and</text><text x="449.99999999999994" y="191.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">reward</text><line x1="579.3333333333333" y1="161" x2="615.3333333333333" y2="161" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="619.3333333333333" y="108" width="250.66666666666666" height="106" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="744.6666666666666" y="140.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Higher attainment</text><text x="744.6666666666666" y="170.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Better results for</text><text x="744.6666666666666" y="191.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">middle-class pupils</text><rect x="30" y="244" width="404" height="130" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="52" y="280" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="start">Reproduces</text><text x="52" y="310" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Class inequality is passed on to the next</text><text x="52" y="332" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">generation</text><rect x="466" y="244" width="404" height="130" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="488" y="280" font-size="21" font-weight="700" fill="#8a6d0d" text-anchor="start">Legitimises</text><text x="488" y="310" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">It looks like the result of individual</text><text x="488" y="332" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">merit, so it seems fair</text><rect x="30" y="394" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="430" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Common mistake</text><text x="56" y="459" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Cultural capital is not money. It is knowledge, language and tastes valued by schools.</text>
</svg>