<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 646" width="900" height="646" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="646" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Inside the classroom</text>

<rect x="30" y="104" width="269.3333333333333" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,154 L31.25,118.25 Q31.25,105.25 44.25,105.25 L285.0833333333333,105.25 Q298.0833333333333,105.25 298.0833333333333,118.25 L298.0833333333333,154 Z" fill="#b5d3cf"/><line x1="31.25" y1="154" x2="298.0833333333333" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="164.66666666666666" y="135" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Ideal pupil</text><text x="46" y="187.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Becker: the image teachers</text><text x="46" y="208.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">judge pupils against;</text><text x="46" y="229.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">middle-class pupils fitted it</text><text x="46" y="250.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">most closely</text><rect x="315.3333333333333" y="104" width="269.3333333333333" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M316.5833333333333,154 L316.5833333333333,118.25 Q316.5833333333333,105.25 329.5833333333333,105.25 L570.4166666666666,105.25 Q583.4166666666666,105.25 583.4166666666666,118.25 L583.4166666666666,154 Z" fill="#dce9e7"/><line x1="316.5833333333333" y1="154" x2="583.4166666666666" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="135" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Stereotyping</text><text x="331.3333333333333" y="187.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Judging a pupil by</text><text x="331.3333333333333" y="208.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">assumptions about their group</text><rect x="600.6666666666666" y="104" width="269.3333333333333" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.9166666666666,154 L601.9166666666666,118.25 Q601.9166666666666,105.25 614.9166666666666,105.25 L855.75,105.25 Q868.75,105.25 868.75,118.25 L868.75,154 Z" fill="#f2e7b8"/><line x1="601.9166666666666" y1="154" x2="868.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="735.3333333333333" y="135" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Halo effect</text><text x="616.6666666666666" y="187.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">One positive impression</text><text x="616.6666666666666" y="208.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">colours how the teacher sees</text><text x="616.6666666666666" y="229.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the pupil in general</text><rect x="30" y="290" width="269.3333333333333" height="215" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,364 L31.25,304.25 Q31.25,291.25 44.25,291.25 L285.0833333333333,291.25 Q298.0833333333333,291.25 298.0833333333333,304.25 L298.0833333333333,364 Z" fill="#ffffff"/><line x1="31.25" y1="364" x2="298.0833333333333" y2="364" stroke="#c9d6d4" stroke-width="2"/><text x="164.66666666666666" y="333" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Sanctions</text><circle cx="51" cy="391.92" r="4.5" fill="#2e6b62"/><text x="64" y="397.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Positive:</tspan> praise, merits,</text><text x="64" y="418.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">prizes</text><circle cx="51" cy="441.92" r="4.5" fill="#2e6b62"/><text x="64" y="447.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Negative:</tspan> detentions,</text><text x="64" y="468.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">exclusion</text><rect x="315.3333333333333" y="290" width="269.3333333333333" height="215" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M316.5833333333333,364 L316.5833333333333,304.25 Q316.5833333333333,291.25 329.5833333333333,291.25 L570.4166666666666,291.25 Q583.4166666666666,291.25 583.4166666666666,304.25 L583.4166666666666,364 Z" fill="#b5d3cf"/><line x1="316.5833333333333" y1="364" x2="583.4166666666666" y2="364" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="333" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Pro-school subculture</text><text x="331.3333333333333" y="397.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Values achievement</text><rect x="600.6666666666666" y="290" width="269.3333333333333" height="215" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.9166666666666,364 L601.9166666666666,304.25 Q601.9166666666666,291.25 614.9166666666666,291.25 L855.75,291.25 Q868.75,291.25 868.75,304.25 L868.75,364 Z" fill="#efdfa8"/><line x1="601.9166666666666" y1="364" x2="868.75" y2="364" stroke="#c9d6d4" stroke-width="2"/><text x="735.3333333333333" y="320" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Anti-school</text><text x="735.3333333333333" y="346" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">subculture</text><text x="616.6666666666666" y="397.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Rejects school values.</text><text x="616.6666666666666" y="418.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Willis’s “lads” saw</text><text x="616.6666666666666" y="439.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">schoolwork as pointless,</text><text x="616.6666666666666" y="460.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">which led them into manual</text><text x="616.6666666666666" y="481.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">jobs</text><rect x="30" y="521" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="557" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Racism and sexism</text><text x="56" y="586" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Can work through labelling, low expectations and harsher sanctions; an ethnocentric</text><text x="56" y="608" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">curriculum centres one culture.</text>
</svg>