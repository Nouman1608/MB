<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 606" width="900" height="606" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="606" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four perspectives on education</text>

<rect x="30" y="104" width="412" height="236" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,154 L31.25,118.25 Q31.25,105.25 44.25,105.25 L427.75,105.25 Q440.75,105.25 440.75,118.25 L440.75,154 Z" fill="#b5d3cf"/><line x1="31.25" y1="154" x2="440.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="135" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Functionalism</text><circle cx="51" cy="181.92" r="4.5" fill="#2e6b62"/><text x="64" y="187.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Durkheim:</tspan> passes on shared values</text><circle cx="51" cy="210.92" r="4.5" fill="#2e6b62"/><text x="64" y="216.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Parsons:</tspan> a bridge from particularistic</text><text x="64" y="237.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(family) to universalistic (society)</text><text x="64" y="258.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">standards</text><circle cx="51" cy="281.92" r="4.5" fill="#2e6b62"/><text x="64" y="287.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Davis and Moore:</tspan> role allocation</text><circle cx="51" cy="310.92" r="4.5" fill="#2e6b62"/><text x="64" y="316.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Develops human capital</text><rect x="458" y="104" width="412" height="236" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,154 L459.25,118.25 Q459.25,105.25 472.25,105.25 L855.75,105.25 Q868.75,105.25 868.75,118.25 L868.75,154 Z" fill="#dce9e7"/><line x1="459.25" y1="154" x2="868.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="135" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Marxism</text><circle cx="479" cy="181.92" r="4.5" fill="#2e6b62"/><text x="492" y="187.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Bowles and Gintis:</tspan> prepares pupils for work;</text><text x="492" y="208.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">obeying teachers mirrors obeying bosses; the</text><text x="492" y="229.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">myth of meritocracy</text><circle cx="479" cy="252.92" r="4.5" fill="#2e6b62"/><text x="492" y="258.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Bourdieu:</tspan> cultural capital lets schools</text><text x="492" y="279.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">reproduce and legitimise class inequality</text><rect x="30" y="356" width="412" height="220" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,406 L31.25,370.25 Q31.25,357.25 44.25,357.25 L427.75,357.25 Q440.75,357.25 440.75,370.25 L440.75,406 Z" fill="#efdfa8"/><line x1="31.25" y1="406" x2="440.75" y2="406" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="387" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Radical critics</text><circle cx="51" cy="433.92" r="4.5" fill="#2e6b62"/><text x="64" y="439.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Illich:</tspan> schools teach dependence on</text><text x="64" y="460.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">institutions; calls for deschooling</text><circle cx="51" cy="483.92" r="4.5" fill="#2e6b62"/><text x="64" y="489.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Freire:</tspan> rejects “banking” education; wants</text><text x="64" y="510.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">critical consciousness</text><rect x="458" y="356" width="412" height="220" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,406 L459.25,370.25 Q459.25,357.25 472.25,357.25 L855.75,357.25 Q868.75,357.25 868.75,370.25 L868.75,406 Z" fill="#f2e7b8"/><line x1="459.25" y1="406" x2="868.75" y2="406" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="387" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Feminisms</text><circle cx="479" cy="433.92" r="4.5" fill="#2e6b62"/><text x="492" y="439.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Gender roles reinforced by subject choices,</text><text x="492" y="460.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">careers advice, textbooks and teacher</text><text x="492" y="481.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">expectations</text><circle cx="479" cy="504.92" r="4.5" fill="#2e6b62"/><text x="492" y="510.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Sharpe:</tspan> girls’ priorities shifted from</text><text x="492" y="531.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">marriage and family (1970s) to careers</text><text x="492" y="552.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(1990s)</text>
</svg>