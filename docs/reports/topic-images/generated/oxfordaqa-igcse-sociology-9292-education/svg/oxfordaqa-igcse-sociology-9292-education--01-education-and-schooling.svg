<rect width="900" height="687" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Education and schooling</text>

<rect x="30" y="108" width="412" height="128" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,158 L31.25,122.25 Q31.25,109.25 44.25,109.25 L427.75,109.25 Q440.75,109.25 440.75,122.25 L440.75,158 Z" fill="#b5d3cf"/><line x1="31.25" y1="158" x2="440.75" y2="158" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="139" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Formal education</text><text x="44" y="190.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">In institutions, with a planned curriculum</text><text x="44" y="212.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">and qualifications</text><rect x="458" y="108" width="412" height="128" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,158 L459.25,122.25 Q459.25,109.25 472.25,109.25 L855.75,109.25 Q868.75,109.25 868.75,122.25 L868.75,158 Z" fill="#f2e7b8"/><line x1="459.25" y1="158" x2="868.75" y2="158" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="139" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Informal education</text><text x="472" y="190.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Through everyday life: families, peers and</text><text x="472" y="212.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">the media</text><text x="450" y="276" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Levels of formal education</text><rect x="30" y="426" width="198" height="70" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="129" y="449.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Nursery or</text><text x="129" y="473.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">pre-school</text><rect x="244" y="386" width="198" height="110" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="343" y="421.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Primary</text><rect x="458" y="346" width="198" height="150" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="557" y="381.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Secondary</text><rect x="672" y="306" width="198" height="190" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="771" y="341.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Tertiary</text><text x="771" y="401" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">colleges and</text><text x="771" y="421" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">universities</text><rect x="30" y="516" width="269.3333333333333" height="147" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,566 L31.25,530.25 Q31.25,517.25 44.25,517.25 L285.0833333333333,517.25 Q298.0833333333333,517.25 298.0833333333333,530.25 L298.0833333333333,566 Z" fill="#ffffff"/><line x1="31.25" y1="566" x2="298.0833333333333" y2="566" stroke="#c9d6d4" stroke-width="2"/><text x="164.66666666666666" y="546.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Official curriculum</text><text x="44" y="597.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">What is formally taught</text><rect x="315.3333333333333" y="516" width="269.3333333333333" height="147" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M316.5833333333333,566 L316.5833333333333,530.25 Q316.5833333333333,517.25 329.5833333333333,517.25 L570.4166666666666,517.25 Q583.4166666666666,517.25 583.4166666666666,530.25 L583.4166666666666,566 Z" fill="#ffffff"/><line x1="316.5833333333333" y1="566" x2="583.4166666666666" y2="566" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="546.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Hidden curriculum</text><text x="329.3333333333333" y="597.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">What is learned from how</text><text x="329.3333333333333" y="618.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">school is run. Not the same as</text><text x="329.3333333333333" y="639.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">informal education.</text><rect x="600.6666666666666" y="516" width="269.3333333333333" height="147" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.9166666666666,566 L601.9166666666666,530.25 Q601.9166666666666,517.25 614.9166666666666,517.25 L855.75,517.25 Q868.75,517.25 868.75,530.25 L868.75,566 Z" fill="#ffffff"/><line x1="601.9166666666666" y1="566" x2="868.75" y2="566" stroke="#c9d6d4" stroke-width="2"/><text x="735.3333333333333" y="546.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Online learning</text><text x="614.6666666666666" y="597.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Widens access for some, but</text><text x="614.6666666666666" y="618.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">depends on devices and</text><text x="614.6666666666666" y="639.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">connection; less social</text>
</svg>