<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 710" width="900" height="710" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="710" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Legal frameworks, norms and institutions</text>

<defs><linearGradient id="hl" x1="0" x2="1"><stop offset="0" stop-color="#2e6b62"/><stop offset="1" stop-color="#dce9e7"/></linearGradient></defs><rect x="30" y="120" width="840" height="34" rx="17" fill="url(#hl)" stroke="#1e2a44" stroke-width="2"/><text x="50" y="143" font-size="16" font-weight="700" fill="#fff" text-anchor="start">binding</text><text x="850" y="143" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">not binding</text><rect x="30" y="175" width="270" height="200" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="48" y="211.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Hard law</text><text x="48" y="236.85000000000002" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">treaties; customary</text><text x="48" y="256.65000000000003" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">international law</text><text x="48" y="276.45000000000005" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">e.g. UN Charter Art. 2(4) and</text><text x="48" y="296.25" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">51; Vienna Convention on</text><text x="48" y="316.05" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Diplomatic Relations (1961)</text><rect x="315" y="175" width="270" height="200" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.2"/><text x="333" y="211.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Soft law</text><text x="333" y="236.85000000000002" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">declarations, guidelines,</text><text x="333" y="256.65000000000003" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">resolutions</text><text x="333" y="276.45000000000005" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">e.g. UDHR (1948): a GA</text><text x="333" y="296.25" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">resolution that shaped</text><text x="333" y="316.05" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">constitutions and later</text><text x="333" y="335.85" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">treaties</text><rect x="600" y="175" width="270" height="200" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="618" y="211.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Norms</text><text x="618" y="236.85000000000002" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">shared expectations, written or</text><text x="618" y="256.65000000000003" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">not</text><text x="618" y="276.45000000000005" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">e.g. no chemical weapons;</text><text x="618" y="296.25" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">regular elections</text><text x="618" y="316.05" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">work through legitimacy</text><text x="30" y="410" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Institutions: two senses</text><rect x="30" y="425" width="410" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="48" y="460.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">1 Formal organisations</text><text x="48" y="485.90000000000003" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">the UN, an electoral commission, an international</text><text x="48" y="505.70000000000005" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">court</text><rect x="460" y="425" width="410" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="478" y="469.6" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">2 Social structures of rules and norms</text><text x="478" y="495.40000000000003" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">sovereignty, diplomacy, elections, markets</text><text x="30" y="565" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Rules, norms and institutions can…</text><rect x="30" y="580" width="270" height="100" rx="12" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2.2"/><text x="165" y="625.45" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">shape</text><text x="165" y="651.25" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">define the options available</text><rect x="315" y="580" width="270" height="100" rx="12" fill="#fbeee6" stroke="#c9d6d4" stroke-width="2.2"/><text x="450" y="625.45" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">limit</text><text x="450" y="651.25" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">rule options out (a veto)</text><rect x="600" y="580" width="270" height="100" rx="12" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2.2"/><text x="735" y="617.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">cause</text><text x="735" y="643.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">be the problem itself (a border</text><text x="735" y="663.55" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">splitting a community)</text>
</svg>