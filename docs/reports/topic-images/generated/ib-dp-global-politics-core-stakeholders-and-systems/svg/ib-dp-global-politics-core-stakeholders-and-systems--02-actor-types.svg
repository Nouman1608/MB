width="2.2"/><text x="735" y="281.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Social movements</text><text x="735" y="306.95" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Fridays for Future (2018)</text><rect x="30" y="351" width="270" height="108" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="165" y="389.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Resistance movements</text><text x="165" y="414.95" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">label contested: say who uses</text><text x="165" y="434.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">which</text><rect x="315" y="351" width="270" height="108" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="450" y="399.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Political parties</text><text x="450" y="424.95" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">compete for office</text><rect x="600" y="351" width="270" height="108" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="735" y="379.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Interest and pressure</text><text x="735" y="401.59" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">groups</text><text x="735" y="427.39" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">trade unions, business</text><text x="735" y="447.19" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">associations</text><rect x="30" y="469" width="270" height="108" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="165" y="507.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Political leaders</text><text x="165" y="532.9499999999999" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">heads of state; party,</text><text x="165" y="552.7499999999999" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">religious, movement leaders</text><rect x="315" y="469" width="270" height="108" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="450" y="517.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Formal and informal forums</text><text x="450" y="542.9499999999999" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">UN General Assembly; G7, G20</text><rect x="600" y="469" width="270" height="108" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="735" y="507.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">The media</text><text x="735" y="532.9499999999999" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">news organisations, social media</text><text x="735" y="552.7499999999999" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">platforms</text><rect x="30" y="589" width="840" height="64" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="450" y="615.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Other individual and collective actors</text><text x="450" y="640.9499999999999" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">diasporas, activists, whistleblowers, expert networks, hacker collectives</text><rect x="30" y="672" width="840" height="51.120000000000005" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="702.2" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Same type, different power: ask what this actor can actually do in this system, and who accepts it.</text>
