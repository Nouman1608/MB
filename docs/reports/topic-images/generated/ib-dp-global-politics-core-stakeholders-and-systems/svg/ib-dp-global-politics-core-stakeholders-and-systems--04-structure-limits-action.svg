<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="560" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How structure limits what actors can do</text>

<rect x="30" y="110" width="410" height="420" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="235" y="148" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">UN Security Council</text><rect x="60" y="170" width="350" height="81" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="235" y="205.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Structure</text><text x="235" y="230.9" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">five permanent members hold a veto</text><line x1="235" y1="255" x2="235" y2="279" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="60" y="285" width="350" height="101" rx="12" fill="#fbeee6" stroke="#b5602e" stroke-width="2.2"/><text x="235" y="320.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Limit</text><text x="235" y="345.90000000000003" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">a resolution can fail even with wide</text><text x="235" y="365.70000000000005" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">support</text><line x1="235" y1="390" x2="235" y2="414" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="60" y="420" width="350" height="101" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="235" y="455.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Actors respond</text><text x="235" y="480.90000000000003" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">turn to the General Assembly or regional</text><text x="235" y="500.70000000000005" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">bodies</text><rect x="460" y="110" width="410" height="420" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="665" y="148" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">WTO dispute settlement</text><rect x="490" y="170" width="350" height="81" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="665" y="205.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Structure</text><text x="665" y="230.9" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">only member governments can be parties</text><line x1="665" y1="255" x2="665" y2="279" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="490" y="285" width="350" height="101" rx="12" fill="#fbeee6" stroke="#b5602e" stroke-width="2.2"/><text x="665" y="320.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Limit</text><text x="665" y="345.90000000000003" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">a harmed company cannot bring a case</text><text x="665" y="365.70000000000005" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">itself</text><line x1="665" y1="390" x2="665" y2="414" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="490" y="420" width="350" height="101" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="665" y="455.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Actors respond</text><text x="665" y="480.90000000000003" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">it must persuade its own government to</text><text x="665" y="500.70000000000005" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">act</text>
</svg>