<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 693" width="900" height="693" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="693" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Systems: scale, structure and dynamics</text>

<text x="150" y="136" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">Scales of a system</text><rect x="30" y="150" width="240" height="52" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="150" y="183.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">global</text><rect x="41" y="212" width="218" height="52" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.2"/><text x="150" y="245.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">international</text><rect x="52" y="274" width="196" height="52" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="150" y="307.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">regional</text><rect x="63" y="336" width="174" height="52" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.2"/><text x="150" y="369.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">national</text><rect x="74" y="398" width="152" height="52" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="150" y="431.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">subnational</text><rect x="85" y="460" width="130" height="52" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.2"/><text x="150" y="493.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">local</text><rect x="96" y="522" width="108" height="52" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="150" y="555.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">community</text><rect x="300" y="150" width="570" height="220" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="318" y="186.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Structure: the stable arrangement</text><text x="318" y="213.17000000000002" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">• who holds formal authority, at what level</text><text x="318" y="234.29000000000002" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">• how decisions are made: majority, consensus, veto</text><text x="318" y="255.41000000000003" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">• how power is distributed</text><text x="318" y="276.53000000000003" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">• is there any authority above? (no world government)</text><rect x="300" y="390" width="570" height="192" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="318" y="426.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Dynamics: how interactions change</text><text x="318" y="453.17" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">cooperation and competition; alliances form and break; new actors</text><text x="318" y="474.29" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">enter; rules tested or reformed; crises shift power</text><rect x="30" y="610" width="840" height="52.44" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="641.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Structures and dynamics regulate interactions and limit the courses of action open to actors.</text>
</svg>