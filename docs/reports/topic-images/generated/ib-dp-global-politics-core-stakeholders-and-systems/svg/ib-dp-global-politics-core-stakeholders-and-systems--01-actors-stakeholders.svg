<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 638" width="900" height="638" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="638" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Stakeholders and actors</text>

<ellipse cx="450" cy="330" rx="400" ry="200" fill="#dce9e7" stroke="#2e6b62" stroke-width="3"/><text x="450" y="175" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle">Stakeholders: anyone affected by the issue</text><ellipse cx="560" cy="350" rx="210" ry="120" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="560" y="320" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Actors</text><text x="560" y="348" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">agency and means to</text><text x="560" y="370" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">exercise power</text><text x="560" y="410" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">e.g. the ministry that</text><text x="560" y="430" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">approved the dam</text><text x="205" y="320" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">e.g. a child living</text><text x="205" y="340" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">downstream of a new dam</text><path d="M230,370 C260,440 330,460 380,430" fill="none" stroke="#b5602e" stroke-width="4" stroke-linecap="round" marker-end="url(#ahR)"/><text x="250" y="470" font-size="15" font-weight="600" fill="#b5602e" text-anchor="middle">residents organise, raise money,</text><text x="250" y="490" font-size="15" font-weight="600" fill="#b5602e" text-anchor="middle">go to court: become actors</text><rect x="30" y="555" width="840" height="52.44" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="586.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Every actor is a stakeholder on the issues it acts on; not every stakeholder is an actor.</text>
</svg>