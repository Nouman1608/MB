<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" width="900" height="660" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="660" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Mapping a real case: the Paris Agreement</text>

<line x1="450" y1="302" x2="155" y2="165" stroke="#1e2a44" stroke-width="2.5"/><line x1="450" y1="302" x2="450" y2="165" stroke="#1e2a44" stroke-width="2.5"/><line x1="450" y1="302" x2="745" y2="165" stroke="#1e2a44" stroke-width="2.5"/><line x1="450" y1="302" x2="155" y2="440" stroke="#1e2a44" stroke-width="2.5"/><line x1="450" y1="302" x2="450" y2="440" stroke="#1e2a44" stroke-width="2.5"/><line x1="450" y1="302" x2="745" y2="440" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="120" width="250" height="90" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="155" y="159.6" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">States</text><text x="155" y="185.4" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">negotiated and signed</text><rect x="325" y="120" width="250" height="90" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="450" y="159.6" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">IGO</text><text x="450" y="185.4" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">UN climate secretariat ran it</text><rect x="620" y="120" width="250" height="90" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="745" y="159.6" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Formal forum</text><text x="745" y="185.4" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Conference of the Parties</text><rect x="30" y="395" width="250" height="90" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="155" y="424.6" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Civil society</text><text x="155" y="450.40000000000003" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">accredited NGOs observing,</text><text x="155" y="470.20000000000005" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">lobbying</text><rect x="325" y="395" width="250" height="90" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="450" y="424.6" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Subnational</text><text x="450" y="450.40000000000003" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">cities and regions’ own</text><text x="450" y="470.20000000000005" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">pledges</text><rect x="620" y="395" width="250" height="90" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="745" y="424.6" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Private actors</text><text x="745" y="450.40000000000003" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">some pushing faster, some</text><text x="745" y="470.20000000000005" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">slower</text><circle cx="450" cy="302" r="72" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="284.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Paris</text><text x="450" y="308.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Agreement</text><text x="450" y="332.06" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">2015</text><rect x="30" y="230" width="230" height="140" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="145" y="294.6" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Media</text><text x="145" y="320.40000000000003" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">raised public attention</text><rect x="620" y="230" width="250" height="140" rx="12" fill="#fbeee6" stroke="#b5602e" stroke-width="2.2"/><text x="745" y="264.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Stakeholders with</text><text x="745" y="286.59" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">little voice</text><text x="745" y="312.39" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">low-lying coasts; future</text><text x="745" y="332.19" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">generations; fossil-fuel</text><text x="745" y="351.99" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">workers</text><line x1="260" y1="300" x2="378" y2="302" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="510" width="840" height="120" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="450" y="553.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Structure → outcome</text><text x="450" y="580.67" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">consensus decisions and guarded sovereignty → each state sets its own NDC; reporting required,</text><text x="450" y="601.79" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">targets not legally binding → near-universal participation, weak enforcement</text>
</svg>