<rect x="35" y="110" width="250" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="160" y="150" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Discrete</text><text x="160" y="180" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">course</text><rect x="325" y="110" width="250" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="150" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Modular</text><text x="450" y="180" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">course</text><rect x="615" y="110" width="250" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="740" y="150" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Integrated</text><text x="740" y="180" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">course</text><line x1="160" y1="212" x2="160" y2="262" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="450" y1="212" x2="450" y2="262" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="740" y1="212" x2="740" y2="262" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="270" width="840" height="360" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="310" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">The same framework in every model</text><text x="60" y="355" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Key concepts</text><rect x="60" y="370" width="250" height="46" rx="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.2"/><text x="185" y="399.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">change</text><rect x="330" y="370" width="250" height="46" rx="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.2"/><text x="455" y="399.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">relationships</text><rect x="600" y="370" width="250" height="46" rx="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.2"/><text x="725" y="399.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">systems</text><text x="60" y="455" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Related concepts, for example</text><rect x="60" y="470" width="185" height="44" rx="10" fill="#fff" stroke="#8a6d0d" stroke-width="2.2"/><text x="152.5" y="497.95" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">energy</text><rect x="260" y="470" width="185" height="44" rx="10" fill="#fff" stroke="#8a6d0d" stroke-width="2.2"/><text x="352.5" y="497.95" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">movement</text><rect x="460" y="470" width="185" height="44" rx="10" fill="#fff" stroke="#8a6d0d" stroke-width="2.2"/><text x="552.5" y="497.95" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">transformation</text><rect x="660" y="470" width="185" height="44" rx="10" fill="#fff" stroke="#8a6d0d" stroke-width="2.2"/><text x="752.5" y="497.95" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">models</text><text x="60" y="555" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Plus</text><rect x="115" y="530" width="250" height="44" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.2"/><text x="240" y="557.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">six global contexts</text><text x="390" y="548" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">and one investigation-skills task,</text><text x="390" y="570" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">identical whatever the course model.</text><text x="450" y="612" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="middle">Use these links to connect content from different modules.</text>
