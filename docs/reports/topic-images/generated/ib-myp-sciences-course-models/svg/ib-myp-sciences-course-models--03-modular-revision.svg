<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 710" width="900" height="710" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="710" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Revising after a modular year</text>

<rect x="30" y="110" width="840" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="148" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">What was taught</text><rect x="60" y="170" width="250" height="54" rx="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.2"/><text x="185" y="203.65" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Biology</text><text x="185" y="254" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Term 1</text><rect x="325" y="170" width="250" height="54" rx="10" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.2"/><text x="450" y="203.65" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Chemistry</text><text x="450" y="254" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Term 2</text><rect x="590" y="170" width="250" height="54" rx="10" fill="#c9d3e6" stroke="#1e2a44" stroke-width="2.2"/><text x="715" y="203.65" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Physics</text><text x="715" y="254" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Term 3</text><rect x="30" y="300" width="410" height="380" rx="14" fill="#fbeee6" stroke="#b5602e" stroke-width="2.5"/><text x="60" y="340" font-size="22" font-weight="700" fill="#b5602e" text-anchor="start">✗ Risky plan</text><text x="60" y="372" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Revise only physics, because</text><text x="60" y="395" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">it feels freshest; treat the</text><text x="60" y="418" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">earlier modules as “done”.</text><rect x="60" y="460" width="110" height="44" rx="10" fill="#eee" stroke="#c9d6d4" stroke-width="2.2"/><text x="115" y="487.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Bio</text><rect x="180" y="460" width="110" height="44" rx="10" fill="#eee" stroke="#c9d6d4" stroke-width="2.2"/><text x="235" y="487.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Chem</text><rect x="300" y="460" width="110" height="44" rx="10" fill="#c9d3e6" stroke="#1e2a44" stroke-width="2.2"/><text x="355" y="487.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Physics</text><path d="M70,482 L160,482 M190,482 L280,482" fill="none" stroke="#b5602e" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><text x="60" y="560" font-size="17" font-weight="600" fill="#b5602e" text-anchor="start">But the exam can draw on any</text><text x="60" y="584" font-size="17" font-weight="600" fill="#b5602e" text-anchor="start">content in your option’s scope,</text><text x="60" y="608" font-size="17" font-weight="600" fill="#b5602e" text-anchor="start">whenever it was taught.</text><rect x="460" y="300" width="410" height="380" rx="14" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.5"/><text x="490" y="340" font-size="22" font-weight="700" fill="#2e6b62" text-anchor="start">✓ Better plan</text><text x="490" y="372" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">One summary sheet per module,</text><text x="490" y="395" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">reviewed in rotation in the</text><text x="490" y="418" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">weeks before the exam.</text><rect x="620" y="443" width="90" height="40" rx="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.2"/><text x="665" y="468.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Bio</text><rect x="691.014083110324" y="566" width="90" height="40" rx="10" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.2"/><text x="736.014083110324" y="591.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Chem</text><rect x="548.985916889676" y="566" width="90" height="40" rx="10" fill="#c9d3e6" stroke="#1e2a44" stroke-width="2.2"/><text x="593.985916889676" y="591.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Physics</text><path d="M695,467 A80,80 0 0 1 737,540" fill="none" stroke="#2e6b62" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahT)"/><path d="M690,615 A80,80 0 0 1 630,617" fill="none" stroke="#2e6b62" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahT)"/><path d="M587,540 A80,80 0 0 1 625,470" fill="none" stroke="#2e6b62" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahT)"/><text x="665" y="551" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">repeat</text>
</svg>