<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 790" width="900" height="790" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="790" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three ways a school can run MYP Sciences</text>

<rect x="30" y="110" width="840" height="190" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="156" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="start">Discrete</text><text x="60" y="190" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Biology, chemistry and</text><text x="60" y="213" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">physics (or other</text><text x="60" y="236" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">disciplines) taught as</text><text x="60" y="259" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">separate subjects.</text><rect x="300" y="138" width="540" height="38" rx="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.2"/><text x="570" y="162.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Biology</text><rect x="300" y="184" width="540" height="38" rx="10" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.2"/><text x="570" y="208.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Chemistry</text><rect x="300" y="230" width="540" height="38" rx="10" fill="#c9d3e6" stroke="#1e2a44" stroke-width="2.2"/><text x="570" y="254.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Physics</text><rect x="30" y="314" width="840" height="190" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="360" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="start">Modular</text><text x="60" y="394" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Two or more discrete</text><text x="60" y="417" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">sciences taught in</text><text x="60" y="440" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">rotation across the year.</text><rect x="300" y="388" width="172" height="52" rx="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.2"/><text x="386" y="419.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Biology</text><rect x="480" y="388" width="172" height="52" rx="10" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.2"/><text x="566" y="419.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Chemistry</text><rect x="660" y="388" width="172" height="52" rx="10" fill="#c9d3e6" stroke="#1e2a44" stroke-width="2.2"/><text x="746" y="419.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Physics</text><rect x="30" y="518" width="840" height="190" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="564" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="start">Integrated</text><text x="60" y="598" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Disciplines blended</text><text x="60" y="621" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">together, not taught as</text><text x="60" y="644" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">separate strands.</text><defs><linearGradient id="mix" x1="0" x2="1"><stop offset="0" stop-color="#b5d3cf"/><stop offset="0.5" stop-color="#f2e7b8"/><stop offset="1" stop-color="#c9d3e6"/></linearGradient></defs><rect x="300" y="570" width="540" height="96" rx="12" fill="url(#mix)" stroke="#1e2a44" stroke-width="2.2"/><text x="570" y="625" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">one blended science course</text><line x1="300" y1="732" x2="840" y2="732" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="300" y="758" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">start of year</text><text x="840" y="758" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end">end of year</text><text x="60" y="740" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Ask your teacher</text><text x="60" y="762" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">which model you have.</text>
</svg>