<rect width="900" height="620" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Before you plan revision</text>

<rect x="30" y="110" width="840" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="90" cy="185" r="30" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="90" y="195.8" font-size="30" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="145" y="160" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="start">Confirm two things</text><text x="145" y="194" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">your course model (discrete, modular or integrated) and your</text><text x="145" y="217" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">eAssessment option (biology, chemistry, physics or integrated</text><text x="145" y="240" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">sciences).</text><rect x="30" y="275" width="840" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="90" cy="350" r="30" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="90" y="360.8" font-size="30" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="145" y="325" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="start">Schedule every module</text><text x="145" y="359" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">revisit every science module in your option’s scope, not just the</text><text x="145" y="382" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">most recent; all of it is equally examinable.</text><rect x="30" y="440" width="840" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="90" cy="515" r="30" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="90" y="525.8" font-size="30" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="145" y="490" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="start">Weight the skills task</text><text x="145" y="524" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">give investigation skills about half your time, matching their 50%</text><text x="145" y="547" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">share of the marks.</text><line x1="90" y1="217" x2="90" y2="318" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="90" y1="382" x2="90" y2="483" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/>
</svg>