<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Where the marks sit</text>

<rect x="30" y="110" width="840" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="150" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Marks in the on-screen examination (out of 100)</text><rect x="60" y="180" width="390" height="90" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><rect x="450" y="180" width="390" height="90" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="255" y="222" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Investigation skills</text><text x="255" y="250" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">criteria B and C: 50</text><text x="645" y="222" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">the other tasks</text><text x="645" y="250" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">50</text><text x="450" y="300" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">half the marks</text><path d="M450,284 L450,270" fill="none" stroke="#8a6d0d" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><text x="60" y="345" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start">So revision time should follow the same split:</text><text x="60" y="378" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">practise forming testable hypotheses and interpreting imperfect real data</text><text x="60" y="402" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">under exam conditions, not only content recall.</text>
