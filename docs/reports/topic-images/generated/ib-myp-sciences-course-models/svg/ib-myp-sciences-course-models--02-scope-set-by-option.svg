<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What decides your exam’s content?</text>

<rect x="30" y="110" width="400" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="470" y="110" width="400" height="330" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="230" y="150" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Course model</text><text x="230" y="176" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">how lessons were packaged</text><rect x="90" y="200" width="280" height="44" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.2"/><text x="230" y="227.95" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">discrete</text><rect x="90" y="258" width="280" height="44" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.2"/><text x="230" y="285.95" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">modular</text><rect x="90" y="316" width="280" height="44" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.2"/><text x="230" y="343.95" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">integrated</text><text x="670" y="150" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">eAssessment option</text><text x="670" y="176" font-size="16" font-weight="400" fill="#8a6d0d" text-anchor="middle">what you are entered for</text><rect x="530" y="196" width="280" height="44" rx="10" fill="#fff" stroke="#8a6d0d" stroke-width="2.2"/><text x="670" y="223.95" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">biology</text><rect x="530" y="252" width="280" height="44" rx="10" fill="#fff" stroke="#8a6d0d" stroke-width="2.2"/><text x="670" y="279.95" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">chemistry</text><rect x="530" y="308" width="280" height="44" rx="10" fill="#fff" stroke="#8a6d0d" stroke-width="2.2"/><text x="670" y="335.95" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">physics</text><rect x="530" y="364" width="280" height="44" rx="10" fill="#fff" stroke="#8a6d0d" stroke-width="2.2"/><text x="670" y="391.95" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">integrated sciences</text><line x1="230" y1="450" x2="230" y2="520" stroke="#b5602e" stroke-width="4" marker-end="url(#ahR)" stroke-dasharray="10 7"/><circle cx="230" cy="485" r="20" fill="#fff" stroke="#b5602e" stroke-width="3"/><path d="M220,475 L240,495 M240,475 L220,495" fill="none" stroke="#b5602e" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><text x="230" y="545" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">does NOT set</text><text x="230" y="567" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">the exam scope</text><line x1="670" y1="450" x2="670" y2="590" stroke="#8a6d0d" stroke-width="5" marker-end="url(#ahO)"/><text x="690" y="520" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="start">sets which topics</text><text x="690" y="542" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="start">your exam draws on</text><rect x="30" y="600" width="840" height="225" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="640" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Topics the examinations can draw on (all three disciplines)</text><rect x="60" y="665" width="287.59999999999997" height="40" rx="10" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2.2"/><text x="203.79999999999998" y="690.6" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">atomic structure and bonding</text><rect x="359.59999999999997" y="665" width="76" height="40" rx="10" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2.2"/><text x="397.59999999999997" y="690.6" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">cells</text><rect x="447.59999999999997" y="665" width="85.19999999999999" height="40" rx="10" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2.2"/><text x="490.19999999999993" y="690.6" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">cycles</text><rect x="544.8" y="665" width="177.2" height="40" rx="10" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2.2"/><text x="633.4" y="690.6" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">electromagnetism</text><rect x="734" y="665" width="112.8" height="40" rx="10" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2.2"/><text x="790.4" y="690.6" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">evolution</text><rect x="60" y="717" width="306" height="40" rx="10" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2.2"/><text x="213" y="742.6" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">interactions between organisms</text><rect x="378" y="717" width="85.19999999999999" height="40" rx="10" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2.2"/><text x="420.6" y="742.6" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">forces</text><rect x="475.2" y="717" width="315.2" height="40" rx="10" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2.2"/><text x="632.8" y="742.6" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">states and properties of matter</text><rect x="60" y="769" width="122" height="40" rx="10" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2.2"/><text x="121" y="794.6" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">metabolism</text><rect x="194" y="769" width="112.8" height="40" rx="10" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2.2"/><text x="250.4" y="794.6" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">organisms</text><rect x="318.8" y="769" width="76" height="40" rx="10" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2.2"/><text x="356.8" y="794.6" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">waves</text>
