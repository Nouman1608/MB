<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 810" width="900" height="810" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="810" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Decode the task before you write</text>

<rect x="30" y="110" width="268" height="560" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="30" y="110" width="268" height="78" rx="14" fill="#b5d3cf"/><text x="164" y="144" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Purpose</text><text x="164" y="172" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">why am I writing?</text><text x="278" y="238" font-size="25" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;دعوت دینا&#x200F;</text><text x="50" y="234" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">invite</text><text x="278" y="296" font-size="25" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;شکریہ ادا کرنا&#x200F;</text><text x="50" y="292" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">thank</text><text x="278" y="354" font-size="25" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;معذرت کرنا&#x200F;</text><text x="50" y="350" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">apologise</text><text x="278" y="412" font-size="25" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;معلومات دینا&#x200F;</text><text x="50" y="408" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">inform</text><text x="278" y="470" font-size="25" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;مشورہ دینا&#x200F;</text><text x="50" y="466" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">advise</text><text x="278" y="528" font-size="25" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;شکایت کرنا&#x200F;</text><text x="50" y="524" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">complain</text><rect x="42" y="590" width="244" height="68" rx="10" fill="#f2e7b8"/><text x="164" y="618" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">decides the content of</text><text x="164" y="637" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">every paragraph</text><rect x="316" y="110" width="268" height="560" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="316" y="110" width="268" height="78" rx="14" fill="#b5d3cf"/><text x="450" y="144" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Format</text><text x="450" y="172" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">what kind of text?</text><text x="564" y="238" font-size="25" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;ای میل&#x200F;</text><text x="336" y="234" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">email</text><text x="564" y="296" font-size="25" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;خط&#x200F;</text><text x="336" y="292" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">letter</text><text x="564" y="354" font-size="25" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;پیغام&#x200F;</text><text x="336" y="350" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">message</text><rect x="328" y="590" width="244" height="68" rx="10" fill="#f2e7b8"/><text x="450" y="618" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">decides opening, closing</text><text x="450" y="637" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">and layout</text><rect x="602" y="110" width="268" height="560" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="602" y="110" width="268" height="78" rx="14" fill="#b5d3cf"/><text x="736" y="144" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Audience</text><text x="736" y="172" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">who reads it?</text><text x="850" y="238" font-size="25" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;دوست&#x200F;</text><text x="622" y="234" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">friend</text><text x="850" y="296" font-size="25" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;بھائی&#x200F;</text><text x="622" y="292" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">brother</text><text x="850" y="354" font-size="25" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;استاد&#x200F;</text><text x="622" y="350" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">teacher</text><text x="850" y="412" font-size="25" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;پرنسپل&#x200F;</text><text x="622" y="408" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">principal</text><text x="850" y="470" font-size="25" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;مینیجر&#x200F;</text><text x="622" y="466" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">manager</text><rect x="614" y="590" width="244" height="68" rx="10" fill="#f2e7b8"/><text x="736" y="618" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">decides the register</text><rect x="30" y="690" width="840" height="92" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="54" y="726" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Then count the prompts</text><text x="54" y="756" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Each bullet is content you must cover. Pictures suggest what to write about: use them.</text>
</svg>