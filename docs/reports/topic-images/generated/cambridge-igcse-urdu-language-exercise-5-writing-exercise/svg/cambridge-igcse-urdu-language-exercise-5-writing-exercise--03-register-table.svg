<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 911" width="900" height="911" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="911" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Informal or formal: the set phrases</text>

<rect x="30" y="110" width="840" height="770.8" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,160 L31.25,124 Q31.25,111.25 44,111.25 L856,111.25 Q868.75,111.25 868.75,124 L868.75,160 Z" fill="#b5d3cf"/><text x="46" y="142" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start"></text><text x="504" y="142" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Informal: friend, sibling</text><line x1="190" y1="110" x2="190" y2="880.8" stroke="#c9d6d4" stroke-width="2"/><text x="854" y="142" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Formal: teacher, principal</text><line x1="520" y1="110" x2="520" y2="880.8" stroke="#c9d6d4" stroke-width="2"/><line x1="30" y1="160" x2="870" y2="160" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="201.85" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Address</text><text x="504" y="210.4" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;تم&#x200F;</text><text x="854" y="210.4" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;آپ&#x200F;</text><line x1="30" y1="234.4" x2="870" y2="234.4" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="301.25" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Opening</text><text x="504" y="284.8" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;پیارے احمد، /&#x200F;</text><text x="504" y="334.8" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;پیاری ثنا،&#x200F;</text><text x="854" y="284.8" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;محترم پرنسپل صاحب، /&#x200F;</text><text x="854" y="334.8" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;محترمہ…&#x200F;</text><line x1="30" y1="358.8" x2="870" y2="358.8" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="425.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Greeting</text><text x="504" y="434.20000000000005" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;السلام علیکم! کیسے ہو؟&#x200F;</text><text x="854" y="409.20000000000005" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;السلام علیکم۔ امید ہے&#x200F;</text><text x="854" y="459.20000000000005" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;آپ خیریت سے ہوں گے۔&#x200F;</text><line x1="30" y1="483.20000000000005" x2="870" y2="483.20000000000005" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="525.0500000000001" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Request</text><text x="504" y="533.6" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;مجھے بتاؤ، ضرور آنا&#x200F;</text><text x="854" y="533.6" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;مجھے بتائیے، تشریف لائیے گا&#x200F;</text><line x1="30" y1="557.6" x2="870" y2="557.6" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="599.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Thanks</text><text x="504" y="608" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;تمہارا بہت شکریہ&#x200F;</text><text x="854" y="608" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;میں آپ کا بے حد شکر گزار ہوں&#x200F;</text><line x1="30" y1="632" x2="870" y2="632" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="698.85" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Closing line</text><text x="504" y="682.4" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;جلدی جواب دینا۔&#x200F;</text><text x="504" y="732.4" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;اپنا خیال رکھنا۔&#x200F;</text><text x="854" y="682.4" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;آپ کے جواب کا منتظر&#x200F;</text><text x="854" y="732.4" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;رہوں گا / رہوں گی۔&#x200F;</text><line x1="30" y1="756.4" x2="870" y2="756.4" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="823.25" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Sign-off</text><text x="504" y="806.8" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;تمہارا دوست، /&#x200F;</text><text x="504" y="856.8" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;تمہاری سہیلی،&#x200F;</text><text x="854" y="806.8" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;والسلام، /&#x200F;</text><text x="854" y="856.8" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;آپ کا شاگرد،&#x200F;</text>
</svg>