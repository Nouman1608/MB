<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1060" width="900" height="1060" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="1060" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The model email, part by part</text>

<rect x="30" y="110" width="840" height="920" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><line x1="330" y1="130" x2="330" y2="1010" stroke="#c9d6d4" stroke-width="2" stroke-dasharray="6 6"/><text x="54" y="162" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Opening</text><text x="54" y="184" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">informal: friend</text><text x="846" y="168" font-size="27" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;پیارے سلمان،&#x200F;</text><text x="54" y="240" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Greeting</text><text x="846" y="246" font-size="23" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;السلام علیکم! امید ہے تم نئے شہر میں خوش ہو گے۔&#x200F;</text><rect x="345" y="290" width="510" height="170" rx="10" fill="#dce9e7"/><text x="54" y="330" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Prompt 1: the new club</text><text x="54" y="352" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">present habit</text><text x="840" y="348" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;فوٹوگرافی کلب میں داخلہ لے لیا ہے&#x200F;</text><text x="840" y="382" font-size="18" font-weight="400" fill="#4a5568" text-anchor="end">…</text><text x="840" y="432" font-size="24" fill="#2e6b62" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;ملتے ہیں، سکھاتے ہیں&#x200F;</text><rect x="345" y="480" width="510" height="170" rx="10" fill="#dce9e7"/><text x="54" y="520" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Prompt 2: last week</text><text x="54" y="542" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">past</text><text x="840" y="538" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;پچھلے ہفتے ہم پرانا قلعہ دیکھنے گئے تھے۔&#x200F;</text><text x="840" y="572" font-size="18" font-weight="400" fill="#4a5568" text-anchor="end">…</text><text x="840" y="622" font-size="24" fill="#2e6b62" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;مجھے خود یقین نہیں آیا&#x200F;</text><rect x="345" y="670" width="510" height="170" rx="10" fill="#dce9e7"/><text x="54" y="710" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Prompt 3: the invitation</text><text x="54" y="732" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">future and conditional</text><text x="840" y="728" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;کلب کی ایک نمائش ہو گی&#x200F;</text><text x="840" y="762" font-size="18" font-weight="400" fill="#4a5568" text-anchor="end">…</text><text x="840" y="812" font-size="24" fill="#2e6b62" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;اگر تم ان دنوں چھٹیوں پر یہاں آؤ تو ضرور آنا&#x200F;</text><text x="54" y="890" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Closing line</text><text x="54" y="912" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">a request</text><text x="846" y="896" font-size="27" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;جلدی جواب دینا۔&#x200F;</text><text x="54" y="966" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Sign-off</text><text x="846" y="960" font-size="27" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;تمہارا دوست،&#x200F;</text><text x="846" y="1010" font-size="27" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;بلال&#x200F;</text>
</svg>