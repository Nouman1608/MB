<rect x="30" y="110" width="380" height="61.6" rx="10" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="50" y="146.8" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Opening and greeting</text><text x="390" y="146.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end">10-15 words</text><rect x="30" y="179.6" width="380" height="116" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="50" y="243.6" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Prompt 1</text><text x="390" y="243.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end">about 30 words</text><rect x="30" y="303.6" width="380" height="116" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="50" y="367.6" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Prompt 2</text><text x="390" y="367.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end">about 30 words</text><rect x="30" y="427.6" width="380" height="116" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="50" y="491.6" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Prompt 3</text><text x="390" y="491.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end">about 30 words</text><rect x="30" y="551.6" width="380" height="61.6" rx="10" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="50" y="588.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Closing and sign-off</text><text x="390" y="588.4" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end">10-15 words</text><rect x="440" y="110" width="430" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="460" y="146" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Inside each prompt paragraph</text><rect x="460" y="166" width="390" height="50" rx="10" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="480" y="197" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">statement</text><rect x="460" y="228" width="390" height="50" rx="10" fill="#b5d3cf" stroke="#c9d6d4" stroke-width="2"/><text x="480" y="259" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">+ detail or reason</text><rect x="460" y="290" width="390" height="50" rx="10" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2"/><text x="480" y="321" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">+ feeling or comment</text><rect x="440" y="380" width="430" height="233.20000000000005" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="460" y="416" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Tense range comes from the prompts</text><text x="460" y="452" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">what happened</text><text x="640" y="452" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">→ past</text><text x="460" y="482" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">what you do now</text><text x="640" y="482" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">→ present</text><text x="460" y="512" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">invite or plan</text><text x="640" y="512" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">→ future or conditional</text><text x="850" y="580" font-size="26" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;اگر… تو…&#x200F;</text><text x="460" y="574" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">for example the conditional</text>
