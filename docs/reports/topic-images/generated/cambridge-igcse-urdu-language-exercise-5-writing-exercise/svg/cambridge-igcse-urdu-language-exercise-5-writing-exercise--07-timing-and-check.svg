<rect width="900" height="866" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Fifteen minutes, then a final check</text>

<rect x="60" y="115" width="104" height="84" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><text x="112" y="152" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">2 min</text><text x="112" y="180" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Plan</text><rect x="164" y="115" width="520" height="84" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="424" y="152" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">10 min</text><text x="424" y="180" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Write</text><rect x="684" y="115" width="156" height="84" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="762" y="152" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">3 min</text><text x="762" y="180" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Check</text><text x="60" y="226" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">about 15 minutes in all; keep more time for Exercise 6, worth twice as much</text><rect x="30" y="250" width="840" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="288" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">The two-minute final check</text><rect x="54" y="310" width="26" height="26" rx="5" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="67" y="331" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">✓</text><text x="96" y="330" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Every prompt covered?</text><rect x="54" y="351" width="26" height="26" rx="5" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="67" y="372" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">✓</text><text x="96" y="371" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">One register throughout?</text><rect x="54" y="392" width="26" height="26" rx="5" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="67" y="413" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">✓</text><text x="96" y="412" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Greeting, opening line, closing line, sign-off?</text><rect x="54" y="433" width="26" height="26" rx="5" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="67" y="454" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">✓</text><text x="96" y="453" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Your own verbs agree with your gender?</text><rect x="54" y="474" width="26" height="26" rx="5" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="67" y="495" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">✓</text><text x="146" y="498" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;نے&#x200F;</text><text x="156" y="494" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">with every transitive verb in a completed past tense?</text><rect x="54" y="515" width="26" height="26" rx="5" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="67" y="536" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">✓</text><text x="96" y="535" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Adjectives and verbs agree with their nouns?</text><text x="450" y="626" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Agreement in practice</text><rect x="30" y="646" width="410" height="90" rx="12" fill="#fbf1ea" stroke="#b5602e" stroke-width="2"/><text x="60" y="700" font-size="26" font-weight="700" fill="#b5602e" text-anchor="middle">✗</text><text x="420" y="704" font-size="26" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;نیا کتاب&#x200F;</text><rect x="30" y="748" width="410" height="90" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="60" y="802" font-size="26" font-weight="700" fill="#2e6b62" text-anchor="middle">✓</text><text x="420" y="806" font-size="26" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;نئی کتاب&#x200F;</text><rect x="460" y="646" width="410" height="90" rx="12" fill="#fbf1ea" stroke="#b5602e" stroke-width="2"/><text x="490" y="700" font-size="26" font-weight="700" fill="#b5602e" text-anchor="middle">✗</text><text x="850" y="704" font-size="26" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;میں نے کتاب خریدا&#x200F;</text><rect x="460" y="748" width="410" height="90" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="490" y="802" font-size="26" font-weight="700" fill="#2e6b62" text-anchor="middle">✓</text><text x="850" y="806" font-size="26" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;میں نے کتاب خریدی&#x200F;</text><text x="80" y="698" font-size="15" font-weight="400" fill="#b5602e" text-anchor="start">wrong adjective form</text><text x="510" y="698" font-size="15" font-weight="400" fill="#b5602e" text-anchor="start">wrong verb form</text><text x="80" y="800" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="start">adjective agrees</text><text x="510" y="800" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="start">verb agrees</text>
</svg>