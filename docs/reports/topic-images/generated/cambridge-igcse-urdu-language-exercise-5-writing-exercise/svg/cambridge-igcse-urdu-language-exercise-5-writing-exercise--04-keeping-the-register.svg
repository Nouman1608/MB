<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Keep one register: pronoun and verb agree</text>

<rect x="30" y="110" width="410" height="230" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><rect x="460" y="110" width="410" height="230" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="50" y="146" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Informal</text><text x="420" y="162" font-size="30" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;تم&#x200F;</text><text x="480" y="146" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Formal</text><text x="850" y="162" font-size="30" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;آپ&#x200F;</text><rect x="335" y="200" width="85" height="110" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="377.5" y="266" font-size="26" fill="#1e2a44" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;ہو&#x200F;</text><rect x="240" y="200" width="85" height="110" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="282.5" y="266" font-size="26" fill="#1e2a44" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;کرو&#x200F;</text><rect x="145" y="200" width="85" height="110" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="187.5" y="266" font-size="26" fill="#1e2a44" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;آؤ&#x200F;</text><rect x="50" y="200" width="85" height="110" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="92.5" y="266" font-size="26" fill="#1e2a44" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;تمہارا&#x200F;</text><rect x="765" y="200" width="85" height="110" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="807.5" y="266" font-size="26" fill="#1e2a44" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;ہیں&#x200F;</text><rect x="670" y="200" width="85" height="110" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="712.5" y="266" font-size="26" fill="#1e2a44" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;کیجیے&#x200F;</text><rect x="575" y="200" width="85" height="110" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="617.5" y="266" font-size="26" fill="#1e2a44" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;آئیے&#x200F;</text><rect x="480" y="200" width="85" height="110" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="522.5" y="266" font-size="26" fill="#1e2a44" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;آپ کا&#x200F;</text><text x="450" y="390" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">The most common error: mixing the two</text><rect x="30" y="410" width="410" height="96" rx="12" fill="#fbf1ea" stroke="#b5602e" stroke-width="2.5"/><text x="66" y="466" font-size="26" font-weight="700" fill="#b5602e" text-anchor="middle">✗</text><text x="420" y="470" font-size="28" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;آپ آؤ&#x200F;</text><text x="96" y="464" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">formal pronoun, informal verb</text><rect x="460" y="410" width="410" height="96" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="496" y="466" font-size="26" font-weight="700" fill="#2e6b62" text-anchor="middle">✓</text><text x="850" y="470" font-size="28" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;آپ آئیے&#x200F;</text><text x="526" y="464" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">pronoun and verb agree</text><text x="450" y="556" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Your own verbs agree with your gender, all the way through</text><rect x="30" y="576" width="410" height="110" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="235" y="634" font-size="26" fill="#1e2a44" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;لکھ رہا ہوں&#x200F;</text><text x="235" y="670" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">a boy writes</text><rect x="460" y="576" width="410" height="110" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="665" y="634" font-size="26" fill="#1e2a44" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;لکھ رہی ہوں&#x200F;</text><text x="665" y="670" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">a girl writes</text>
