<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Exercise 5 at a glance</text>

<rect x="30" y="110" width="268" height="120" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="164" y="154" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">8 marks</text><text x="164" y="184" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">first of two writing</text><text x="164" y="205" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">exercises</text><rect x="316" y="110" width="268" height="120" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="154" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">about 120 words</text><text x="450" y="184" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">for example an email</text><rect x="602" y="110" width="268" height="120" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="736" y="154" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">Prompts / pictures</text><text x="736" y="184" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">a stimulus to respond to</text><text x="450" y="280" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">The question sets three things</text><rect x="30" y="300" width="268" height="60" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="164" y="338" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Purpose</text><rect x="316" y="300" width="268" height="60" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="450" y="338" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Format</text><rect x="602" y="300" width="268" height="60" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="736" y="338" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Audience</text><text x="450" y="410" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">All five writing objectives are tested</text><rect x="30" y="430" width="156" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="108" y="462.7" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">W1</text><text x="108" y="491.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">clear, accurate</text><text x="108" y="511.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">communication</text><rect x="201" y="430" width="156" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="279" y="462.7" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">W2</text><text x="279" y="491.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">paragraphs and</text><text x="279" y="511.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">linking</text><rect x="372" y="430" width="156" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="462.7" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">W3</text><text x="450" y="491.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">range of</text><text x="450" y="511.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">structures and</text><text x="450" y="531.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">vocabulary</text><rect x="543" y="430" width="156" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="621" y="462.7" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">W4</text><text x="621" y="491.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">punctuation and</text><text x="621" y="511.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">spelling</text><rect x="714" y="430" width="156" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="792" y="462.7" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">W5</text><text x="792" y="491.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">register and</text><text x="792" y="511.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">format</text><rect x="30" y="586" width="840" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="622" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Site practice convention: up to 4 task and communication + up to 4 language</text><text x="54" y="652" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Cambridge does not publish how the eight marks divide.</text>
