<rect x="30" y="110" width="840" height="270" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><line x1="50" y1="330" x2="850" y2="330" stroke="#1e2a44" stroke-width="3"/><text x="846" y="352" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">horizon</text><path d="M90.0,330.0 L105.0,316.7 L120.0,303.4 L135.0,290.3 L150.0,277.5 L165.0,264.9 L180.0,252.8 L195.0,241.2 L210.0,230.1 L225.0,219.6 L240.0,209.8 L255.0,200.7 L270.0,192.5 L285.0,185.1 L300.0,178.5 L315.0,172.9 L330.0,168.3 L345.0,164.7 L360.0,162.1 L375.0,160.5 L390.0,160.0 L405.0,160.5 L420.0,162.1 L435.0,164.7 L450.0,168.3 L465.0,172.9 L480.0,178.5 L495.0,185.1 L510.0,192.5 L525.0,200.7 L540.0,209.8 L555.0,219.6 L570.0,230.1 L585.0,241.2 L600.0,252.8 L615.0,264.9 L630.0,277.5 L645.0,290.3 L660.0,303.4 L675.0,316.7 L690.0,330.0" fill="none" stroke="#d4b02e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 7"/><circle cx="114" cy="308.6933502940683" r="13" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="114" y="284.6933502940683" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Fajr</text><text x="114" y="362" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">dawn</text><circle cx="390" cy="160" r="13" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="390" y="136" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Zuhr</text><text x="390" y="362" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">midday</text><circle cx="522" cy="199.01274872811584" r="13" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="522" y="175.01274872811584" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Asr</text><text x="522" y="362" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">afternoon</text><circle cx="666" cy="308.69335029406824" r="13" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="666" y="284.69335029406824" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Maghrib</text><text x="666" y="362" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">sunset</text><circle cx="798" cy="300" r="13" fill="#1e2a44" stroke="#1e2a44" stroke-width="2.5"/><text x="798" y="276" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Isha</text><text x="798" y="362" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">night</text><rect x="30" y="400" width="272" height="96" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="431.58" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Qiblah</text><text x="46" y="459.82" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">face the direction of the</text><text x="46" y="480.94" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Ka'bah in Makkah</text><rect x="314" y="400" width="272" height="96" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="330" y="431.58" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Rak'ahs</text><text x="330" y="459.82" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">sequences of movements and</text><text x="330" y="480.94" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">recitations</text><rect x="598" y="400" width="272" height="96" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="614" y="431.58" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Wudu</text><text x="614" y="459.82" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">required before Salah</text><rect x="30" y="512" width="410" height="104" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="50" y="544" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Salah vs du'a</text><text x="50" y="572" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Salah is prescribed; du'a is personal</text><text x="50" y="592" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">supplication.</text><rect x="460" y="512" width="410" height="104" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="480" y="544" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Jummah (Friday)</text><text x="480" y="572" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Unites the community, with shared teaching in</text><text x="480" y="592" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the khutbah.</text>
</svg>