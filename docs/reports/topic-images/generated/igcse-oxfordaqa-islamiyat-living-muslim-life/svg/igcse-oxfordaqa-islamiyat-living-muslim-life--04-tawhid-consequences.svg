<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Tawhid in practice</text>

<rect x="250" y="112" width="400" height="86" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="3.5"/><text x="450" y="150" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">Tawhid</text><text x="450" y="180" font-size="17" font-weight="600" fill="#8a6d0d" text-anchor="middle">the oneness of God: the foundation</text><path d="M450,200 L450,222 L166,222 L166,244" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="30" y="250" width="272" height="92" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="166" y="290.8" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Worship directed to God</text><text x="166" y="313.8" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">alone</text><path d="M450,200 L450,222 L450,222 L450,244" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="314" y="250" width="272" height="92" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="302.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">No intermediaries</text><path d="M450,200 L450,222 L734,222 L734,244" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="598" y="250" width="272" height="92" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="734" y="290.8" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Equality of all</text><text x="734" y="313.8" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">believers before Him</text><rect x="30" y="370" width="840" height="92" rx="14" fill="#f3dccd" stroke="#b5602e" stroke-width="3"/><text x="56" y="406" font-size="21" font-weight="700" fill="#b5602e" text-anchor="start">Its opposite: shirk</text><text x="56" y="438" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Associating partners with God, the gravest sin: never treat it as a minor matter.</text><text x="450" y="498" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">The other five articles: angels · books · prophets · Day of Judgement · al-qadr</text>
</svg>