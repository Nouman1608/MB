<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 622" width="900" height="622" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="622" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The rites of Hajj and their meaning</text>

<rect x="30" y="112" width="260" height="118" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="62" cy="146" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="152.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="92" y="153" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Ihram</text><text x="50" y="192" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">state of purity; simple</text><text x="50" y="212" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">white garments</text><line x1="292" y1="171" x2="316" y2="171" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="320" y="112" width="260" height="118" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="352" cy="146" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="352" y="152.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="382" y="153" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Tawaf</text><text x="340" y="192" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">seven circuits of the Ka'bah</text><line x1="582" y1="171" x2="606" y2="171" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="610" y="112" width="260" height="118" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="642" cy="146" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="642" y="152.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="672" y="153" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Sa'i</text><text x="630" y="192" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">between the hills of Safa</text><text x="630" y="212" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">and Marwah</text><rect x="30" y="272" width="260" height="118" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="3.5"/><circle cx="62" cy="306" r="18" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="62" y="312.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="92" y="313" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Arafat</text><text x="50" y="352" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">standing: the essential rite</text><line x1="292" y1="331" x2="316" y2="331" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="320" y="272" width="260" height="118" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="352" cy="306" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="352" y="312.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="382" y="313" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Mina</text><text x="340" y="352" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">stone the pillars</text><line x1="582" y1="331" x2="606" y2="331" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="610" y="272" width="260" height="118" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="642" cy="306" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="642" y="312.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">6</text><text x="672" y="313" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Sacrifice</text><path d="M810,232 L810,252 L160,252 L160,268" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="30" y="428" width="840" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="56" y="464" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">The meaning behind every rite</text><rect x="56" y="486" width="240" height="86" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="176" y="524.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Identical white</text><text x="176" y="545.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">garments</text><line x1="298" y1="529" x2="326" y2="529" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="330" y="486" width="240" height="86" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="524.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Wealth and status</text><text x="450" y="545.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">become invisible</text><line x1="572" y1="529" x2="600" y2="529" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="604" y="486" width="240" height="86" rx="12" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><text x="724" y="524.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">All stand equal before</text><text x="724" y="545.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">God</text>
</svg>