<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 498" width="900" height="498" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="498" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why zakat matters</text>

<rect x="30" y="112" width="200" height="98" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="130" y="169" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Individual</text><rect x="240" y="112" width="630" height="98" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="264" cy="140" r="5" fill="#d4b02e"/><text x="280" y="146" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Purifies remaining wealth and guards against greed</text><circle cx="264" cy="174" r="5" fill="#d4b02e"/><text x="280" y="180" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Recognises wealth as held in trust from God</text><rect x="30" y="224" width="200" height="132" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="130" y="298" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Community</text><rect x="240" y="224" width="630" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="264" cy="252" r="5" fill="#2e6b62"/><text x="280" y="258" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Redistributes to the poor, orphans, travellers and the indebted</text><circle cx="264" cy="286" r="5" fill="#2e6b62"/><text x="280" y="292" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Reduces inequality and social resentment</text><circle cx="264" cy="320" r="5" fill="#2e6b62"/><text x="280" y="326" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Strengthens mutual responsibility</text><rect x="30" y="370" width="840" height="104" rx="14" fill="#1e2a44" stroke="#1e2a44" stroke-width="0"/><text x="56" y="410" font-size="20" font-weight="700" fill="#f2e7b8" text-anchor="start">Key point for full marks</text><text x="56" y="444" font-size="17" font-weight="400" fill="#ffffff" text-anchor="start">Zakat is an obligatory act of worship, not optional charity: that distinguishes it from sadaqah.</text>
</svg>