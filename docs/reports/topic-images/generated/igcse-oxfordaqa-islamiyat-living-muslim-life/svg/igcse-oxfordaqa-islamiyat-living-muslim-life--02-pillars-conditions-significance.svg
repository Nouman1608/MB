<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 618" width="900" height="618" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="618" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The Pillars: practice, conditions, significance</text>

<text x="42" y="130" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">Pillar</text><text x="202" y="130" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">Practice</text><text x="412" y="130" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">Condition</text><text x="632" y="130" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Why it matters</text><rect x="30" y="144" width="150" height="86" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="46" y="194" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Shahadah</text><rect x="190" y="144" width="200" height="86" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="202" y="172" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Declaration of faith</text><rect x="400" y="144" width="210" height="86" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="412" y="172" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">—</text><rect x="620" y="144" width="250" height="86" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="632" y="172" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Entry to Islam; states</text><text x="632" y="192" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">tawhid and prophethood</text><text x="632" y="212" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">together</text><rect x="30" y="240" width="150" height="86" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="46" y="290" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Salah</text><rect x="190" y="240" width="200" height="86" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="202" y="268" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Five daily prayers</text><rect x="400" y="240" width="210" height="86" rx="12" fill="#f3dccd" stroke="#b5602e" stroke-width="2"/><text x="412" y="268" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Prescribed times;</text><text x="412" y="288" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">requires wudu</text><rect x="620" y="240" width="250" height="86" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="632" y="268" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Direct connection with God;</text><text x="632" y="288" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">discipline and equality in</text><text x="632" y="308" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the rows</text><rect x="30" y="336" width="150" height="86" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="46" y="386" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Zakat</text><rect x="190" y="336" width="200" height="86" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="202" y="364" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Ordinarily 2.5% of</text><text x="202" y="384" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">qualifying wealth,</text><text x="202" y="404" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">yearly</text><rect x="400" y="336" width="210" height="86" rx="12" fill="#f3dccd" stroke="#b5602e" stroke-width="2"/><text x="412" y="364" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Only above the nisab</text><rect x="620" y="336" width="250" height="86" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="632" y="364" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Purifies wealth; reduces</text><text x="632" y="384" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">inequality; wealth as a</text><text x="632" y="404" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">trust</text><rect x="30" y="432" width="150" height="86" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="46" y="482" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Sawm</text><rect x="190" y="432" width="200" height="86" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="202" y="460" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Fasting in Ramadan,</text><text x="202" y="480" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">dawn to sunset</text><rect x="400" y="432" width="210" height="86" rx="12" fill="#f3dccd" stroke="#b5602e" stroke-width="2"/><text x="412" y="460" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Exempt: ill,</text><text x="412" y="480" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">travelling, pregnant,</text><text x="412" y="500" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">nursing, elderly</text><rect x="620" y="432" width="250" height="86" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="632" y="460" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Taqwa and self-restraint;</text><text x="632" y="480" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">empathy with the poor</text><rect x="30" y="528" width="150" height="66" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="46" y="568" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Hajj</text><rect x="190" y="528" width="200" height="66" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="202" y="556" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Pilgrimage to Makkah,</text><text x="202" y="576" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">once</text><rect x="400" y="528" width="210" height="66" rx="12" fill="#f3dccd" stroke="#b5602e" stroke-width="2"/><text x="412" y="556" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Only if physically and</text><text x="412" y="576" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">financially able</text><rect x="620" y="528" width="250" height="66" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="632" y="556" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Unity and equality; recalls</text><text x="632" y="576" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Ibrahim's family</text>
</svg>