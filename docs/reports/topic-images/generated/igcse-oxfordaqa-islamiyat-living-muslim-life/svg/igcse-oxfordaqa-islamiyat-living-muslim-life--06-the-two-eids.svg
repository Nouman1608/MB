<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 506" width="900" height="506" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="506" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The two Eids</text>

<rect x="30" y="112" width="410" height="290" rx="14" fill="#ffffff" stroke="#d4b02e" stroke-width="3"/><rect x="30" y="112" width="410" height="84" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="3"/><text x="235" y="148" font-size="25" font-weight="700" fill="#1e2a44" text-anchor="middle">Eid-ul-Fitr</text><text x="235" y="178" font-size="17" font-weight="600" fill="#8a6d0d" text-anchor="middle">marks the end of Ramadan</text><circle cx="58" cy="228" r="5" fill="#d4b02e"/><text x="72" y="234" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Zakat-ul-fitr is given before the prayer</text><rect x="460" y="112" width="410" height="290" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="3"/><rect x="460" y="112" width="410" height="84" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="3"/><text x="665" y="148" font-size="25" font-weight="700" fill="#1e2a44" text-anchor="middle">Eid-ul-Adha</text><text x="665" y="178" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="middle">falls during Hajj</text><circle cx="488" cy="228" r="5" fill="#2e6b62"/><text x="502" y="234" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Commemorates Ibrahim's willingness to</text><text x="502" y="256" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">sacrifice his son</text><circle cx="488" cy="286" r="5" fill="#2e6b62"/><text x="502" y="292" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Qurbani meat traditionally shared in</text><text x="502" y="314" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">three parts</text><rect x="484" y="336" width="114" height="46" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="541" y="365" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">family</text><rect x="606" y="336" width="114" height="46" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="663" y="365" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">relatives</text><rect x="728" y="336" width="114" height="46" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="785" y="365" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">the poor</text><rect x="30" y="422" width="840" height="60" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="459" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">A common mistake is confusing the two Eids: link each to its occasion.</text>
</svg>