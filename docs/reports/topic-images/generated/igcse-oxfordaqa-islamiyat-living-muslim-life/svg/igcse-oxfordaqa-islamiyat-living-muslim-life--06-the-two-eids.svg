<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 556" width="900" height="556" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="556" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The two Eids</text>

<rect x="30" y="112" width="840" height="110" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="3"/><text x="56" y="152" font-size="25" font-weight="700" fill="#1e2a44" text-anchor="start">Eid-ul-Fitr</text><text x="56" y="184" font-size="17" font-weight="600" fill="#8a6d0d" text-anchor="start">marks the end of Ramadan</text><rect x="390" y="136" width="456" height="62" rx="12" fill="#ffffff" stroke="#d4b02e" stroke-width="2"/><text x="618" y="174" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Zakat-ul-fitr is given before the prayer</text><rect x="30" y="242" width="840" height="210" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="3"/><text x="56" y="282" font-size="25" font-weight="700" fill="#1e2a44" text-anchor="start">Eid-ul-Adha</text><text x="56" y="314" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="start">falls during Hajj</text><rect x="390" y="266" width="456" height="62" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="618" y="292.45" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Commemorates Ibrahim's willingness to</text><text x="618" y="313.45" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">sacrifice his son</text><text x="390" y="362" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Qurbani meat traditionally shared in three parts:</text><rect x="390" y="378" width="144" height="52" rx="10" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="462" y="410" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">family</text><rect x="546" y="378" width="144" height="52" rx="10" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="618" y="410" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">relatives</text><rect x="702" y="378" width="144" height="52" rx="10" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="774" y="410" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">the poor</text><rect x="30" y="472" width="840" height="60" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="509" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">A common mistake is confusing the two Eids: link each to its occasion.</text>
</svg>