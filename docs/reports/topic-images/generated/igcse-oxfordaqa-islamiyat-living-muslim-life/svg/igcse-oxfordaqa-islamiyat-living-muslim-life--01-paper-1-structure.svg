<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Paper 1: Living the Muslim Life</text>

<rect x="30" y="112" width="414" height="300" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><rect x="30" y="112" width="414" height="84" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="52" y="146" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Section A</text><text x="422" y="146" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="end">25 marks</text><text x="52" y="178" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Islam: Beliefs and Teachings</text><text x="52" y="234" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">Explain what Muslims believe and why</text><rect x="52" y="258" width="116" height="64" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="110" y="295.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Belief</text><line x1="169" y1="290" x2="180" y2="290" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="182" y="258" width="116" height="64" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="240" y="295.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Evidence</text><line x1="299" y1="290" x2="310" y2="290" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="312" y="258" width="116" height="64" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="370" y="295.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Significance</text><text x="52" y="356" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Refer to the Qur'an or Hadith as evidence.</text><rect x="456" y="112" width="414" height="300" rx="14" fill="#ffffff" stroke="#d4b02e" stroke-width="2.5"/><rect x="456" y="112" width="414" height="84" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="478" y="146" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Section B</text><text x="848" y="146" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="end">25 marks</text><text x="478" y="178" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Islam: Practices</text><text x="478" y="234" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">Connect each belief to lived practice</text><rect x="478" y="258" width="175" height="64" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2"/><text x="565.5" y="295.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Belief</text><line x1="654" y1="290" x2="665" y2="290" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="667" y="258" width="175" height="64" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2"/><text x="754.5" y="286.1" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Practice in daily</text><text x="754.5" y="305.1" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">life</text><text x="478" y="356" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Give concrete, specific detail of how it is</text><text x="478" y="377" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">done.</text><rect x="30" y="428" width="840" height="70" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="450" y="470" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">In each section, short questions build to a 12-mark extended response on a set passage.</text><rect x="30" y="514" width="840" height="70" rx="14" fill="#1e2a44" stroke="#1e2a44" stroke-width="0"/><text x="450" y="557" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">1 hour 30 minutes  ·  50 marks  ·  50% of the GCSE</text>
