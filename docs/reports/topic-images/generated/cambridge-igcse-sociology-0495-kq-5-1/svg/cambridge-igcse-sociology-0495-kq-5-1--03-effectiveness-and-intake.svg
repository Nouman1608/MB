<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 710" width="900" height="710" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="710" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What makes a school “effective”?</text>

<rect x="60.400000000000034" y="110" width="144.39999999999998" height="42" rx="21" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="132.60000000000002" y="136.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">exam results</text><rect x="216.8" y="110" width="135.2" height="42" rx="21" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="284.4" y="136.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">value added</text><rect x="364" y="110" width="218" height="42" rx="21" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="473" y="136.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">personal development</text><rect x="594" y="110" width="245.6" height="42" rx="21" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="716.8" y="136.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">equality of opportunity</text><rect x="341" y="162" width="218" height="42" rx="21" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="188.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">preparation for work</text><text x="450" y="238" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Raw results can mislead: look at progress from the starting point</text><rect x="30" y="258" width="410" height="300" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="235" y="294" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Selective or private school</text><line x1="70" y1="528" x2="400" y2="528" stroke="#1e2a44" stroke-width="2.5"/><rect x="110" y="376" width="90" height="152" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="155" y="550" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">intake</text><rect x="270" y="360" width="90" height="168" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="315" y="550" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">results</text><line x1="202" y1="370" x2="266" y2="354" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><text x="235" y="320" font-size="16" font-weight="600" fill="#b5602e" text-anchor="middle">high results, small progress</text><rect x="460" y="258" width="410" height="300" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="665" y="294" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Non-selective school</text><line x1="500" y1="528" x2="830" y2="528" stroke="#1e2a44" stroke-width="2.5"/><rect x="540" y="464" width="90" height="64" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="585" y="550" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">intake</text><rect x="700" y="408" width="90" height="120" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="745" y="550" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">results</text><line x1="632" y1="458" x2="696" y2="402" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><text x="665" y="320" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="middle">lower results, big progress</text><text x="450" y="584" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Illustration only: bar heights are not real data</text><rect x="30" y="602" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="635.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Key evaluation point: intake. A school with high exam results may simply admit pupils who</text><text x="50" y="657.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">were already likely to do well. Always say which meaning of effectiveness you are using.</text>
</svg>