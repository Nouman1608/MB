<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 632" width="900" height="632" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="632" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How the hidden curriculum teaches</text>

<text x="154.66666666666669" y="124" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">How school is organised</text><text x="450.00000000000006" y="124" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">What pupils learn</text><text x="745.3333333333334" y="124" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Element</text><rect x="30" y="140" width="249.33333333333334" height="91" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="168.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Teachers’ authority;</text><text x="46" y="189.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">grades and prizes</text><line x1="285.33333333333337" y1="185.5" x2="319.33333333333337" y2="185.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="325.33333333333337" y="140" width="249.33333333333334" height="91" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="341.33333333333337" y="168.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Respect for authority;</text><text x="341.33333333333337" y="189.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">competition; individual</text><text x="341.33333333333337" y="210.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">achievement</text><line x1="580.6666666666667" y1="185.5" x2="614.6666666666667" y2="185.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="620.6666666666667" y="140" width="249.33333333333334" height="91" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="636.6666666666667" y="168.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Norms and values</text><rect x="30" y="245" width="249.33333333333334" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="273.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Bells, registers,</text><text x="46" y="294.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">penalties for lateness</text><line x1="285.33333333333337" y1="280" x2="319.33333333333337" y2="280" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="325.33333333333337" y="245" width="249.33333333333334" height="70" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="341.33333333333337" y="273.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Readiness for timed work</text><line x1="580.6666666666667" y1="280" x2="614.6666666666667" y2="280" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="620.6666666666667" y="245" width="249.33333333333334" height="70" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="636.6666666666667" y="273.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Punctuality</text><rect x="30" y="329" width="249.33333333333334" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="357.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Uniforms, queuing, rules</text><text x="46" y="378.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">about speaking</text><line x1="285.33333333333337" y1="364" x2="319.33333333333337" y2="364" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="325.33333333333337" y="329" width="249.33333333333334" height="70" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="341.33333333333337" y="357.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Acceptance of rules made</text><text x="341.33333333333337" y="378.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">by others</text><line x1="580.6666666666667" y1="364" x2="614.6666666666667" y2="364" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="620.6666666666667" y="329" width="249.33333333333334" height="70" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="636.6666666666667" y="357.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Conformity</text><rect x="30" y="413" width="249.33333333333334" height="91" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="441.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Different expectations in</text><text x="46" y="462.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">behaviour, sport, subject</text><text x="46" y="483.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">choice</text><line x1="285.33333333333337" y1="458.5" x2="319.33333333333337" y2="458.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="325.33333333333337" y="413" width="249.33333333333334" height="91" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="341.33333333333337" y="441.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">What is “right” for boys</text><text x="341.33333333333337" y="462.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and for girls</text><line x1="580.6666666666667" y1="458.5" x2="614.6666666666667" y2="458.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="620.6666666666667" y="413" width="249.33333333333334" height="91" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="636.6666666666667" y="441.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Gender roles</text><rect x="30" y="522" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="555.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The term was popularised by Philip Jackson (1968). Pupils learn these lessons from how</text><text x="50" y="577.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">school runs, not from the timetable.</text>
</svg>