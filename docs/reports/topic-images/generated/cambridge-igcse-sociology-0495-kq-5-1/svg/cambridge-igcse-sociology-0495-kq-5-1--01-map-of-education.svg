<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 730" width="900" height="730" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="730" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Formal, informal, official and hidden</text>

<rect x="250" y="110" width="400" height="76" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="139.6" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Education</text><text x="450" y="169.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">learning knowledge, skills, norms and values</text><line x1="360" y1="190" x2="250" y2="234" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="540" y1="190" x2="650" y2="234" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="240" width="500" height="362" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="276" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Formal education = schooling</text><text x="50" y="304.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">In schools, colleges, universities; planned; trained</text><text x="50" y="325.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">teachers; assessed for qualifications. e.g. a chemistry</text><text x="50" y="346.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">lesson</text><rect x="560" y="240" width="310" height="362" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="580" y="276" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="start">Informal education</text><text x="580" y="304.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Everyday life: home, friends,</text><text x="580" y="325.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">media, work; unplanned; no</text><text x="580" y="346.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">certificates. e.g. learning to</text><text x="580" y="367.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">cook by watching a grandparent</text><rect x="50" y="398" width="220" height="186" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="70" y="432.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Official</text><text x="70" y="456.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">curriculum</text><text x="70" y="484.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="85.2" y="484.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Subjects</text><text x="70" y="510.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="85.2" y="510.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Syllabus content</text><text x="70" y="536.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="85.2" y="536.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Testing</text><rect x="290" y="398" width="220" height="186" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="310" y="432.4" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">Hidden curriculum</text><text x="310" y="460.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="325.2" y="460.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Norms and values</text><text x="310" y="486.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="325.2" y="486.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Punctuality</text><text x="310" y="512.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="325.2" y="512.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Conformity</text><text x="310" y="538.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="325.2" y="538.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Gender roles</text><text x="715" y="408" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">Informal learning in the family</text><text x="715" y="429" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">shapes how well a child does in</text><text x="715" y="450" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">formal education (see 5.3)</text><line x1="610" y1="494" x2="536" y2="494" stroke="#8a6d0d" stroke-width="4" marker-end="url(#ahO)"/><rect x="30" y="622" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="655.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The hidden curriculum is part of formal schooling, not the same thing as informal</text><text x="50" y="677.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">education.</text>
</svg>