<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" width="900" height="760" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="760" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Five alternatives to conventional school</text>

<text x="170" y="128" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Approach</text><text x="450" y="128" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Strength</text><text x="730" y="128" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">Limitation</text><rect x="30" y="142" width="273.3333333333333" height="108" rx="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="44" y="200.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Online learning</text><rect x="313.3333333333333" y="142" width="273.3333333333333" height="108" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="327.3333333333333" y="189.8" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">+ Flexible; reaches remote</text><text x="327.3333333333333" y="210.8" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">learners; wide choice</text><rect x="596.6666666666666" y="142" width="273.3333333333333" height="108" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="610.6666666666666" y="168.8" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">− Needs devices and</text><text x="610.6666666666666" y="189.8" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">internet: digital divide;</text><text x="610.6666666666666" y="210.8" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">self-discipline; less</text><text x="610.6666666666666" y="231.8" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">social</text><rect x="30" y="260" width="273.3333333333333" height="87" rx="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="44" y="307.9" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Vocational learning</text><rect x="313.3333333333333" y="260" width="273.3333333333333" height="87" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="327.3333333333333" y="297.3" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">+ Practical skills</text><text x="327.3333333333333" y="318.3" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">employers need</text><rect x="596.6666666666666" y="260" width="273.3333333333333" height="87" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="610.6666666666666" y="286.8" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">− Lower status; may</text><text x="610.6666666666666" y="307.8" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">channel working-class</text><text x="610.6666666666666" y="328.8" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">pupils into low pay</text><rect x="30" y="357" width="273.3333333333333" height="87" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="44" y="404.9" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Homeschooling</text><rect x="313.3333333333333" y="357" width="273.3333333333333" height="87" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="327.3333333333333" y="383.8" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">+ Tailored; can suit</text><text x="327.3333333333333" y="404.8" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">special needs or bullied</text><text x="327.3333333333333" y="425.8" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">children</text><rect x="596.6666666666666" y="357" width="273.3333333333333" height="87" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="610.6666666666666" y="383.8" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">− Depends on parents’</text><text x="610.6666666666666" y="404.8" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">time, knowledge, income;</text><text x="610.6666666666666" y="425.8" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">fewer peers</text><rect x="30" y="454" width="273.3333333333333" height="87" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="44" y="501.9" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Progressive schooling</text><rect x="313.3333333333333" y="454" width="273.3333333333333" height="87" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="327.3333333333333" y="480.8" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">+ Summerhill (A. S. Neill,</text><text x="327.3333333333333" y="501.8" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">1921): confidence,</text><text x="327.3333333333333" y="522.8" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">democratic skills</text><rect x="596.6666666666666" y="454" width="273.3333333333333" height="87" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="610.6666666666666" y="491.3" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">− May not suit all;</text><text x="610.6666666666666" y="512.3" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">outcomes hard to compare</text><rect x="30" y="551" width="273.3333333333333" height="87" rx="14" fill="#efdfa8" stroke="#1e2a44" stroke-width="2.5"/><text x="44" y="598.9" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Unschooling</text><rect x="313.3333333333333" y="551" width="273.3333333333333" height="87" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="327.3333333333333" y="577.8" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">+ No set curriculum (John</text><text x="327.3333333333333" y="598.8" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Holt): intrinsic</text><text x="327.3333333333333" y="619.8" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">motivation</text><rect x="596.6666666666666" y="551" width="273.3333333333333" height="87" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="610.6666666666666" y="588.3" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">− Knowledge gaps; may lack</text><text x="610.6666666666666" y="609.3" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">qualifications</text><rect x="30" y="652" width="840" height="80" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="685.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Illich, Deschooling Society (1971): schools teach dependence on institutions; people learn</text><text x="50" y="707.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">best through chosen, real-life activities.</text>
</svg>