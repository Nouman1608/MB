<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 605" width="900" height="605" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="605" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Description with a purpose</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Dickens, Bleak House, 1853</text>
<rect x="30" y="128" width="159.88738999999998" height="35" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2" /><text x="109.94369499999999" y="151.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Fog everywhere.</text><text x="109.94369499999999" y="184.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">one stark word</text><rect x="197.88738999999998" y="128" width="156.17527" height="35" rx="8" fill="#dce9e7" stroke="#1e2a44" stroke-width="2" /><text x="275.97502499999996" y="151.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Fog up the river,</text><text x="275.97502499999996" y="184.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">parallel structure</text><rect x="362.06266" y="128" width="411.13838000000004" height="35" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2" /><text x="567.63185" y="151.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">where it flows among green aits and meadows;</text><text x="567.63185" y="184.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">a clean setting</text><rect x="30" y="213.3" width="177.15224999999998" height="35" rx="8" fill="#dce9e7" stroke="#1e2a44" stroke-width="2" /><text x="118.57612499999999" y="236.75" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">fog down the river,</text><text x="118.57612499999999" y="269.8" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">parallel structure</text><rect x="215.15224999999998" y="213.3" width="188.00845" height="35" rx="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2" /><text x="309.156475" y="236.75" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">where it rolls defiled</text><text x="309.156475" y="269.8" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">the verb changes</text><rect x="30" y="298.6" width="484.36519999999996" height="35" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2" /><text x="272.1826" y="322.05" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">among the tiers of shipping and the waterside pollutions</text><text x="272.1826" y="355.1" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">a polluted setting</text><rect x="522.3652" y="298.6" width="230.15502000000004" height="35" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2" /><text x="637.44271" y="322.05" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">of a great (and dirty) city.</text><text x="637.44271" y="355.1" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">the narrator’s judgement in a</text><text x="637.44271" y="373.40000000000003" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">whisper</text><rect x="30" y="408.20000000000005" width="840" height="90" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><path d="M40,468.20000000000005 C200,448.20000000000005 300,483.20000000000005 450,463.20000000000005 C600,446.20000000000005 700,480.20000000000005 860,463.20000000000005" fill="none" stroke="#2b5a9a" stroke-width="8" stroke-linecap="round"/><rect x="40" y="418.20000000000005" width="380" height="30" rx="15" fill="#dce9e7"/><text x="230" y="439.20000000000005" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">up the river: flows, green meadows</text><rect x="480" y="418.20000000000005" width="380" height="30" rx="15" fill="#cbbf9f"/><text x="670" y="439.20000000000005" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">down the river: rolls defiled, pollution</text><rect x="30" y="518.2" width="840" height="74.24000000000001" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="450" y="549.8000000000001" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve"><tspan font-weight="700">Purpose:</tspan> fog that nothing escapes sets the atmosphere for a slow court case, and becomes a figure</text><text x="450" y="570.9200000000001" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">for confusion and corruption.</text>
</svg>