<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Boundaries or features?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Two methods that make an idea visible</text>
<rect x="30" y="122" width="405" height="300" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="232" y="156" font-size="22" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">Definition</text><text x="232" y="182" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic" xml:space="preserve">“What is it, exactly?”</text><circle cx="232" cy="292" r="78" fill="#dce9e7" stroke="#2e6b62" stroke-width="3" stroke-dasharray="8 5"/><circle cx="205" cy="272" r="9" fill="#2e6b62" stroke="#1e2a44" stroke-width="1.5"/><circle cx="250" cy="262" r="9" fill="#2e6b62" stroke="#1e2a44" stroke-width="1.5"/><circle cx="230" cy="312" r="9" fill="#2e6b62" stroke="#1e2a44" stroke-width="1.5"/><circle cx="265" cy="302" r="9" fill="#2e6b62" stroke="#1e2a44" stroke-width="1.5"/><circle cx="200" cy="317" r="9" fill="#2e6b62" stroke="#1e2a44" stroke-width="1.5"/><circle cx="110" cy="232" r="9" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><circle cx="355" cy="242" r="9" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><circle cx="120" cy="362" r="9" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><circle cx="350" cy="367" r="9" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><text x="232" y="397" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" xml:space="preserve">sets boundaries: what counts and what does not</text><rect x="465" y="122" width="405" height="300" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="667" y="156" font-size="22" font-weight="700" fill="#8a6d0d" text-anchor="middle" xml:space="preserve">Description</text><text x="667" y="182" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic" xml:space="preserve">“What is it like?”</text><line x1="667" y1="287" x2="560" y2="232" stroke="#8a6d0d" stroke-width="2"/><rect x="520" y="217" width="80" height="30" rx="15" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2" /><text x="560" y="238" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">sight</text><line x1="667" y1="287" x2="775" y2="232" stroke="#8a6d0d" stroke-width="2"/><rect x="735" y="217" width="80" height="30" rx="15" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2" /><text x="775" y="238" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">sound</text><line x1="667" y1="287" x2="540" y2="327" stroke="#8a6d0d" stroke-width="2"/><rect x="500" y="312" width="80" height="30" rx="15" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2" /><text x="540" y="333" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">smell</text><line x1="667" y1="287" x2="795" y2="327" stroke="#8a6d0d" stroke-width="2"/><rect x="755" y="312" width="80" height="30" rx="15" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2" /><text x="795" y="333" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">touch</text><line x1="667" y1="287" x2="667" y2="372" stroke="#8a6d0d" stroke-width="2"/><rect x="627" y="357" width="80" height="30" rx="15" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2" /><text x="667" y="378" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">taste</text><circle cx="667" cy="287" r="44" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="667" y="293" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">the thing</text><rect x="30" y="442" width="840" height="74.24000000000001" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" /><text x="450" y="473.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Both relate characteristics, features or sensory details, often with <tspan font-weight="700">examples</tspan> <tspan font-weight="700">or</tspan> <tspan font-weight="700">illustrations</tspan>, so the</text><text x="450" y="494.72" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">reader can trace the reasoning.</text>
