<!-- place after: ## The scope of the claim sets the standard -->
<figure class="topic-figure">
  <img src="https://img.marlbridge.com/ap-english-language-2-5-sufficient-evidence-study-guide--02-scope-sets-the-standard.webp" width="900" height="552" alt="A staircase of claims about the timetable: “some pupils” needs a few cases, “most pupils” a representative sample, and “all pupils” is almost impossible to support. Side cards show that “causes” needs evidence of cause and “the worst in the country” needs a comparison. Below, a narrowed claim is easier to defend." loading="lazy">
  <figcaption>Narrow the claim to what the evidence can support.</figcaption>
</figure>

<!-- place after: ## Common ways evidence falls short -->
<figure class="topic-figure">
  <img src="https://img.marlbridge.com/ap-english-language-2-5-sufficient-evidence-study-guide--03-where-evidence-falls-short.webp" width="900" height="544" alt="Seven numbered cards list how evidence falls short: too little, unrepresentative, irrelevant, out of date, from an unreliable source, of only one type, or left unexplained. An eighth card warns that too much can also bury the strongest example." loading="lazy">
  <figcaption>Check quantity, representativeness, relevance, currency, source, variety and explanation.</figcaption>
</figure>

<!-- place after: ## Sufficiency depends on the audience too -->
<figure class="topic-figure">
  <img src="https://img.marlbridge.com/ap-english-language-2-5-sufficient-evidence-study-guide--04-audience-sets-the-bar.webp" width="900" height="550" alt="Four audiences ranked by how much evidence they need: one already inclined to agree needs less, a general audience a clear example and trusted statistic, a specialist audience rigorous sources, and a sceptical or hostile audience more and more varied evidence. A side note recommends several types of evidence when resistance is likely." loading="lazy">
  <figcaption>A sceptical audience needs more, and more varied, evidence than a friendly one.</figcaption>
</figure>

<!-- place after: ## A public-domain example: "Let Facts be submitted" -->
<figure class="topic-figure">
  <img src="https://img.marlbridge.com/ap-english-language-2-5-sufficient-evidence-study-guide--06-pattern-needs-quantity.webp" width="900" height="594" alt="Two panels. A single grievance is one point with no direction, insufficient for a broad claim. Dozens of “He has...” grievances line up into a pattern, which is what the Declaration’s claim about a design of despotism asserts. The framing sentence “let Facts be submitted to a candid world” signals awareness that proof is needed." loading="lazy">
