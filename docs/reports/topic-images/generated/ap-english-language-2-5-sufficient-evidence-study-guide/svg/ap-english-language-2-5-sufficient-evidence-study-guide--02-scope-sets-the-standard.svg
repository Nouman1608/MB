<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 688" width="900" height="688" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="688" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The scope of the claim sets the standard</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">The stronger the wording, the more the claim demands</text>
<rect x="30" y="450" width="600" height="72" rx="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5" /><text x="44" y="480.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700">“Some</tspan> <tspan font-weight="700">pupils</tspan> <tspan font-weight="700">find</tspan> <tspan font-weight="700">the</tspan> <tspan font-weight="700">timetable</tspan> <tspan font-weight="700">stressful.”</tspan></text><text x="44" y="501.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">a few clear cases</text><rect x="80" y="368" width="600" height="72" rx="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5" /><text x="94" y="398.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700">“Most</tspan> <tspan font-weight="700">pupils</tspan> <tspan font-weight="700">find</tspan> <tspan font-weight="700">the</tspan> <tspan font-weight="700">timetable</tspan> <tspan font-weight="700">stressful.”</tspan></text><text x="94" y="419.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">a representative sample showing a majority</text><rect x="130" y="286" width="600" height="72" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5" /><text x="144" y="316.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700">“The</tspan> <tspan font-weight="700">timetable</tspan> <tspan font-weight="700">causes</tspan> <tspan font-weight="700">stress.”</tspan></text><text x="144" y="337.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">evidence of cause, not just co-occurrence</text><rect x="180" y="204" width="600" height="72" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5" /><text x="194" y="234.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700">“The</tspan> <tspan font-weight="700">timetable</tspan> <tspan font-weight="700">is</tspan> <tspan font-weight="700">the</tspan> <tspan font-weight="700">worst</tspan> <tspan font-weight="700">in</tspan> <tspan font-weight="700">the</tspan> <tspan font-weight="700">country.”</tspan></text><text x="194" y="255.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">a comparison with others</text><rect x="230" y="122" width="600" height="72" rx="14" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5" /><text x="244" y="152.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700">“All</tspan> <tspan font-weight="700">pupils</tspan> <tspan font-weight="700">find</tspan> <tspan font-weight="700">the</tspan> <tspan font-weight="700">timetable</tspan> <tspan font-weight="700">stressful.”</tspan></text><text x="244" y="173.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">almost impossible: one contrary case breaks it</text><line x1="860" y1="522" x2="860" y2="126" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><text x="845" y="322" font-size="16" font-weight="700" fill="#4a5568" text-anchor="middle" transform="rotate(-90 845 322)">evidence demanded</text><rect x="30" y="548" width="840" height="104.63999999999999" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5" /><text x="48" y="582" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start" xml:space="preserve">Narrow the claim to fit the evidence</text><text x="48" y="610" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“Most pupils in Years 10 and 11 report that the timetable leaves too little time to eat” is easier to defend</text><text x="48" y="631.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">than “The timetable is unbearable.”</text>
</svg>