<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 969" width="900" height="969" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="969" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Sales or profit: the exporter’s choice</text>

<rect x="30" y="110" width="840" height="520" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="56" y="146" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Velden Ceramics: annual profit on exported vases (cost $18 a vase)</text><line x1="120" y1="560" x2="850" y2="560" stroke="#c9d6d4" stroke-width="1.5"/><text x="110" y="566" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">$0</text><line x1="120" y1="440" x2="850" y2="440" stroke="#c9d6d4" stroke-width="1.5"/><text x="110" y="446" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">$40,000</text><line x1="120" y1="320" x2="850" y2="320" stroke="#c9d6d4" stroke-width="1.5"/><text x="110" y="326" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">$80,000</text><line x1="120" y1="200" x2="850" y2="200" stroke="#c9d6d4" stroke-width="1.5"/><text x="110" y="206" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">$120,000</text><rect x="160" y="200" width="110" height="360" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="215" y="190" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">$120,000</text><text x="215" y="588" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Before</text><text x="215" y="610" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">10,000 × $12</text><rect x="335" y="254" width="110" height="306" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="390" y="244" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">$102,000</text><text x="390" y="588" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Option A</text><text x="390" y="610" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">keep $30</text><rect x="510" y="290" width="110" height="270" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="565" y="280" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">$90,000</text><text x="565" y="588" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Option B</text><text x="565" y="610" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">cut to $27</text><rect x="685" y="308" width="110" height="252" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" stroke-dasharray="8 5"/><text x="740" y="298" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">$84,000</text><text x="740" y="588" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Option A</text><text x="740" y="610" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">if sales 7,000</text><line x1="120" y1="560" x2="850" y2="560" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="650" width="270" height="160" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="684" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">A: keep price at $30</text><text x="48" y="714" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Foreign buyers pay more</text><text x="48" y="738" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Sales fall to 8,500</text><text x="48" y="762" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">8,500 × $12 = $102,000</text><rect x="315" y="650" width="270" height="160" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="333" y="684" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">B: cut price to $27</text><text x="333" y="714" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Buyers pay about the same</text><text x="333" y="738" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Profit per vase $27 − $18 = $9</text><text x="333" y="762" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">10,000 × $9 = $90,000</text><rect x="600" y="650" width="270" height="160" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="618" y="684" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">A, if sales fall to 7,000</text><text x="618" y="714" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">7,000 × $12 = $84,000</text><text x="618" y="738" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Now B is better</text><text x="618" y="762" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"></text><rect x="30" y="830" width="840" height="109" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="870" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Either way, the stronger currency hurts.</text><text x="56" y="897" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Keeping the price loses less here, but it depends on how price-sensitive foreign buyers</text><text x="56" y="920" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">are, and on long-term customers the figures do not show.</text>
</svg>