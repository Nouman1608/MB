<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 880" width="900" height="880" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="880" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">When exchange rates swing sharply</text>

<rect x="30" y="110" width="840" height="90" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="148" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Severe fluctuation: a large or sudden swing</text><text x="450" y="178" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">A small, gradual change can be planned for.</text><path d="M60,270 L150,262 L220,276 L280,232 L330,300 L380,226 L430,296 L470,250" fill="none" stroke="#b5602e" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><path d="M500,262 L600,258 L700,254 L800,250 L850,248" fill="none" stroke="#2e6b62" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><text x="260" y="330" font-size="16" font-weight="600" fill="#b5602e" text-anchor="middle">severe swing</text><text x="680" y="290" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="middle">small, gradual change</text><rect x="30" y="356" width="410" height="124" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="48" y="392" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">Uncertain costs and revenues</text><text x="48" y="423" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">An importer may find goods cost far more by</text><text x="48" y="444" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the time it pays</text><rect x="460" y="356" width="410" height="124" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="478" y="392" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">Difficult pricing</text><text x="478" y="423" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Exporters cannot set price lists with</text><text x="478" y="444" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">confidence</text><rect x="30" y="496" width="410" height="124" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="48" y="532" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">Harder planning</text><text x="48" y="563" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Investment, borrowing and hiring are harder</text><text x="48" y="584" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">to plan</text><rect x="460" y="496" width="410" height="124" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="478" y="532" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">Lost contracts</text><text x="478" y="563" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A sharp rise in the home currency can make an</text><text x="478" y="584" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">exporter uncompetitive overnight</text><rect x="30" y="650" width="840" height="200" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="56" y="686" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Ways to reduce the risk</text><rect x="56" y="704" width="252" height="124" rx="10" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="74" y="748" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Agree prices in their</text><text x="74" y="771" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">own currency where</text><text x="74" y="794" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">customers accept it</text><rect x="328" y="704" width="252" height="124" rx="10" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="346" y="759" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Buy from suppliers at</text><text x="346" y="782" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">home</text><rect x="600" y="704" width="252" height="124" rx="10" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="618" y="748" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Sell in several</text><text x="618" y="771" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">countries, so one</text><text x="618" y="794" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">currency matters less</text>
</svg>