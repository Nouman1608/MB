<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 926" width="900" height="926" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="926" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Globalisation from four viewpoints</text>

<text x="285" y="132" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Businesses</text><text x="695" y="132" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Economies</text><text transform="translate(56,330) rotate(-90)" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Developed</text><text transform="translate(56,660) rotate(-90)" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Developing</text><rect x="80" y="150" width="395" height="315" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="98" y="184" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">+ Benefits</text><text x="98" y="210" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="start">•</text><text x="114" y="210" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Larger markets to sell to</text><text x="98" y="235" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="start">•</text><text x="114" y="235" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Cheaper inputs</text><text x="98" y="260" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="start">•</text><text x="114" y="260" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Can move production to lower-cost</text><text x="114" y="281" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">countries</text><line x1="98" y1="304" x2="457" y2="304" stroke="#c9d6d4" stroke-width="1.5"/><text x="98" y="328" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">− Drawbacks</text><text x="98" y="354" font-size="16" font-weight="400" fill="#b5602e" text-anchor="start">•</text><text x="114" y="354" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Low-cost foreign rivals</text><text x="98" y="379" font-size="16" font-weight="400" fill="#b5602e" text-anchor="start">•</text><text x="114" y="379" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">May need to cut prices</text><text x="98" y="404" font-size="16" font-weight="400" fill="#b5602e" text-anchor="start">•</text><text x="114" y="404" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Long supply chains disrupted</text><rect x="490" y="150" width="395" height="315" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="508" y="184" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">+ Benefits</text><text x="508" y="210" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="start">•</text><text x="524" y="210" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Cheaper goods and wider choice</text><text x="508" y="235" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="start">•</text><text x="524" y="235" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Firms find export markets</text><line x1="508" y1="258" x2="867" y2="258" stroke="#c9d6d4" stroke-width="1.5"/><text x="508" y="282" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">− Drawbacks</text><text x="508" y="308" font-size="16" font-weight="400" fill="#b5602e" text-anchor="start">•</text><text x="524" y="308" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Jobs lost in industries that move abroad</text><text x="508" y="333" font-size="16" font-weight="400" fill="#b5602e" text-anchor="start">•</text><text x="524" y="333" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Workers need retraining</text><rect x="80" y="480" width="395" height="315" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="98" y="514" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">+ Benefits</text><text x="98" y="540" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="start">•</text><text x="114" y="540" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Wins export orders on cost</text><text x="98" y="565" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="start">•</text><text x="114" y="565" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Gains skills and technology from foreign</text><text x="114" y="586" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">partners</text><line x1="98" y1="609" x2="457" y2="609" stroke="#c9d6d4" stroke-width="1.5"/><text x="98" y="633" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">− Drawbacks</text><text x="98" y="659" font-size="16" font-weight="400" fill="#b5602e" text-anchor="start">•</text><text x="114" y="659" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Large foreign brands at home</text><text x="98" y="684" font-size="16" font-weight="400" fill="#b5602e" text-anchor="start">•</text><text x="114" y="684" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">May depend on a few overseas buyers</text><rect x="490" y="480" width="395" height="315" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="508" y="514" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">+ Benefits</text><text x="508" y="540" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="start">•</text><text x="524" y="540" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">New jobs and incomes; more tax</text><text x="508" y="565" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="start">•</text><text x="524" y="565" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Investment in roads and factories</text><line x1="508" y1="588" x2="867" y2="588" stroke="#c9d6d4" stroke-width="1.5"/><text x="508" y="612" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">− Drawbacks</text><text x="508" y="638" font-size="16" font-weight="400" fill="#b5602e" text-anchor="start">•</text><text x="524" y="638" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Local firms may close</text><text x="508" y="663" font-size="16" font-weight="400" fill="#b5602e" text-anchor="start">•</text><text x="524" y="663" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Skilled workers may emigrate</text><text x="508" y="688" font-size="16" font-weight="400" fill="#b5602e" text-anchor="start">•</text><text x="524" y="688" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Foreign firms’ profits may leave</text><rect x="30" y="810" width="840" height="86" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="850" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">State the viewpoint first.</text><text x="56" y="877" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">The same change can help a developed-country consumer and harm a developed-country worker.</text>
</svg>