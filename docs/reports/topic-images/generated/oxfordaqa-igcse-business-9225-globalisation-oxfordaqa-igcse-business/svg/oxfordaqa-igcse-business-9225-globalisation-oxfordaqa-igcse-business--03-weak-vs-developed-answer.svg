<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" width="900" height="660" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="660" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">From a claim to a developed chain</text>

<rect x="30" y="110" width="840" height="120" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="56" y="146" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">Earns little</text><text x="56" y="192" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“Globalisation is good.”</text><text x="846" y="192" font-size="16" font-weight="400" fill="#b5602e" text-anchor="end">no viewpoint, no chain</text><rect x="30" y="250" width="840" height="380" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="56" y="286" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">A developed chain</text><rect x="56" y="306" width="788" height="52" rx="10" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="76" y="339" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Viewpoint</text><text x="310" y="339" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">a developing-country garment maker</text><line x1="250" y1="358" x2="250" y2="384" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="56" y="386" width="788" height="52" rx="10" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="76" y="419" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Cause</text><text x="310" y="419" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">its labour costs are lower</text><line x1="250" y1="438" x2="250" y2="464" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="56" y="466" width="788" height="52" rx="10" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="76" y="499" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Effect on the business</text><text x="310" y="499" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">it wins large export orders</text><line x1="250" y1="518" x2="250" y2="544" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="56" y="546" width="788" height="52" rx="10" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="76" y="579" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Wider effect</text><text x="310" y="579" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">creates local jobs</text>
</svg>