<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 784" width="900" height="784" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="784" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Five forms of globalisation as chains</text>

<rect x="30" y="110" width="200" height="116" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="130" y="158.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Specialisation</text><text x="130" y="182.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">by country</text><rect x="256" y="110" width="186" height="116" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="349" y="159.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Ideal growing</text><text x="349" y="180.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">conditions for tea</text><line x1="444" y1="168" x2="464" y2="168" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="466" y="110" width="186" height="116" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="559" y="159.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Specialises: very</text><text x="559" y="180.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">large volumes</text><line x1="654" y1="168" x2="674" y2="168" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="676" y="110" width="186" height="116" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="769" y="159.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Lower cost per kg;</text><text x="769" y="180.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">sells worldwide</text><line x1="230" y1="168" x2="254" y2="168" stroke="#8a6d0d" stroke-width="3"/><rect x="30" y="242" width="200" height="116" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="130" y="290.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Relative cost</text><text x="130" y="314.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">advantage</text><rect x="256" y="242" width="186" height="116" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="349" y="280.7" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Assembly costs much</text><text x="349" y="301.7" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">less in a</text><text x="349" y="322.7" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">developing country</text><line x1="444" y1="300" x2="464" y2="300" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="466" y="242" width="186" height="116" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="559" y="280.7" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Furniture maker</text><text x="559" y="301.7" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">moves assembly</text><text x="559" y="322.7" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">there</text><line x1="654" y1="300" x2="674" y2="300" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="676" y="242" width="186" height="116" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="769" y="280.7" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Lower costs, but</text><text x="769" y="301.7" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">home-factory jobs</text><text x="769" y="322.7" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">lost</text><line x1="230" y1="300" x2="254" y2="300" stroke="#8a6d0d" stroke-width="3"/><rect x="30" y="374" width="200" height="116" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="130" y="422.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Movement of</text><text x="130" y="446.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">labour</text><rect x="256" y="374" width="186" height="116" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="349" y="423.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Hospital short of</text><text x="349" y="444.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">skilled staff</text><line x1="444" y1="432" x2="464" y2="432" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="466" y="374" width="186" height="116" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="559" y="423.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Recruits workers</text><text x="559" y="444.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">from abroad</text><line x1="654" y1="432" x2="674" y2="432" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="676" y="374" width="186" height="116" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="769" y="412.7" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Fills vacancies;</text><text x="769" y="433.7" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">home country loses</text><text x="769" y="454.7" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">skills</text><line x1="230" y1="432" x2="254" y2="432" stroke="#8a6d0d" stroke-width="3"/><rect x="30" y="506" width="200" height="116" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="130" y="566.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Larger markets</text><rect x="256" y="506" width="186" height="116" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="349" y="544.7" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Cosmetics firm</text><text x="349" y="565.7" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">exports to ten</text><text x="349" y="586.7" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">countries</text><line x1="444" y1="564" x2="464" y2="564" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="466" y="506" width="186" height="116" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="559" y="555.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Sales rise;</text><text x="559" y="576.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">economies of scale</text><line x1="654" y1="564" x2="674" y2="564" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="676" y="506" width="186" height="116" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="769" y="565.7" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Lower cost per unit</text><line x1="230" y1="564" x2="254" y2="564" stroke="#8a6d0d" stroke-width="3"/><rect x="30" y="638" width="200" height="116" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="130" y="686.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">International</text><text x="130" y="710.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">competition</text><rect x="256" y="638" width="186" height="116" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="349" y="687.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Cheaper imported</text><text x="349" y="708.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">bikes arrive</text><line x1="444" y1="696" x2="464" y2="696" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="466" y="638" width="186" height="116" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="559" y="676.7" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Must cut costs,</text><text x="559" y="697.7" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">improve quality or</text><text x="559" y="718.7" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">find a niche</text><line x1="654" y1="696" x2="674" y2="696" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="676" y="638" width="186" height="116" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="769" y="687.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Or it loses market</text><text x="769" y="708.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">share</text><line x1="230" y1="696" x2="254" y2="696" stroke="#8a6d0d" stroke-width="3"/>
</svg>