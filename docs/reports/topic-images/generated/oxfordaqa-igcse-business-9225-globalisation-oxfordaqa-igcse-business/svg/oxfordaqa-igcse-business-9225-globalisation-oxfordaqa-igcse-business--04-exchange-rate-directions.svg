<rect width="900" height="705" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Exchange rates: who gains, who loses</text>

<text x="410" y="132" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Exporter</text><text x="720" y="132" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Importer</text><rect x="30" y="150" width="220" height="230" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="140" y="220" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">Home currency</text><text x="140" y="250" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">strengthens</text><text x="50" y="290" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">each unit buys more</text><text x="50" y="311" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">foreign currency</text><rect x="270" y="150" width="290" height="230" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="290" y="190" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Goods cost more for foreign</text><text x="290" y="213" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">buyers</text><text x="380" y="315" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">Sales abroad</text><text x="380" y="340" font-size="17" font-weight="400" fill="#b5602e" text-anchor="start">tend to fall</text><line x1="320" y1="298" x2="320" y2="342" stroke="#b5602e" stroke-width="6" marker-end="url(#ahR)"/><rect x="580" y="150" width="290" height="230" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="600" y="190" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Imports and materials cost</text><text x="600" y="213" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">less</text><text x="690" y="327" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Costs fall</text><line x1="630" y1="298" x2="630" y2="342" stroke="#2e6b62" stroke-width="6" marker-end="url(#ahT)"/><rect x="30" y="400" width="220" height="230" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="140" y="470" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">Home currency</text><text x="140" y="500" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">weakens</text><text x="50" y="540" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">each unit buys less</text><text x="50" y="561" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">foreign currency</text><rect x="270" y="400" width="290" height="230" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="290" y="440" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Goods cost less for foreign</text><text x="290" y="463" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">buyers</text><text x="380" y="565" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Sales abroad</text><text x="380" y="590" font-size="17" font-weight="400" fill="#2e6b62" text-anchor="start">tend to rise</text><line x1="320" y1="592" x2="320" y2="548" stroke="#2e6b62" stroke-width="6" marker-end="url(#ahT)"/><rect x="580" y="400" width="290" height="230" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="600" y="440" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Imports and materials cost</text><text x="600" y="463" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">more</text><text x="690" y="577" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">Costs rise</text><line x1="630" y1="592" x2="630" y2="548" stroke="#b5602e" stroke-width="6" marker-end="url(#ahR)"/><text x="450" y="680" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Teal = helps the business; rust = hurts it.</text>
</svg>