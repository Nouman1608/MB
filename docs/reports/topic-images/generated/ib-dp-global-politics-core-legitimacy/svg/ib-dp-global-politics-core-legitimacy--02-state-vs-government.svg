<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 543" width="900" height="543" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="543" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">State legitimacy and government legitimacy</text>

<rect x="30" y="110" width="400" height="330" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="146" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">State legitimacy</text><text x="50" y="170" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">borders, institutions, right to exist</text><rect x="70" y="200" width="320" height="200" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="230" y="283.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Government legitimacy</text><text x="230" y="310.67" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">the people or party in office, and</text><text x="230" y="331.79" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">how they gained and use power</text><rect x="450" y="110" width="420" height="100" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="462" y="139.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Sri Lanka, 2022</text><text x="462" y="164.9" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">protests forced the president to flee and resign;</text><text x="462" y="184.70000000000002" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">nobody questioned the state</text><rect x="450" y="222" width="420" height="100" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.2"/><text x="462" y="251.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Kosovo, 2008</text><text x="462" y="276.9" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">declared independence; Serbia, Russia and China do</text><text x="462" y="296.7" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">not recognise it; not a UN member</text><rect x="450" y="334" width="420" height="100" rx="12" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.2"/><text x="462" y="363.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Afghanistan, 2021</text><text x="462" y="388.90000000000003" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Taliban hold effective control, but very limited</text><text x="462" y="408.70000000000005" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">formal recognition</text><rect x="30" y="460" width="840" height="52.44" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="491.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Write “the government lost legitimacy” when only the government did; the state can keep it.</text>
</svg>