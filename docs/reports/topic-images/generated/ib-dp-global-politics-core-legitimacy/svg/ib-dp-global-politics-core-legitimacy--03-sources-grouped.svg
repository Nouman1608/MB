<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 603" width="900" height="603" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="603" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Sources of legitimacy, grouped</text>

<rect x="30" y="115" width="410" height="175" rx="14" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.5"/><text x="52" y="155" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="start">Process</text><text x="52" y="183" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start" font-style="italic">Did power come from the people, openly?</text><text x="52" y="219" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">free and fair elections; representation;</text><text x="52" y="241" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">consent of governed people; transparency</text><rect x="460" y="115" width="410" height="175" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="482" y="155" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="start">Performance</text><text x="482" y="183" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="start" font-style="italic">Does the government deliver?</text><text x="482" y="219" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">government performance; citizen welfare;</text><text x="482" y="241" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">order and stability; development; sustained</text><text x="482" y="263" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">development; quality of governance</text><rect x="30" y="305" width="410" height="175" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="345" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="start">Identity</text><text x="52" y="373" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start" font-style="italic">Does rule fit a shared story or belief?</text><text x="52" y="409" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">history; ideology; national identity</text><rect x="460" y="305" width="410" height="175" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="482" y="345" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="start">Recognition</text><text x="482" y="373" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start" font-style="italic">Do others accept these leaders and this state?</text><text x="482" y="409" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">leadership recognition; international</text><text x="482" y="431" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">recognition</text><rect x="30" y="500" width="840" height="72.24000000000001" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="530.2" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Fifteen sources in the guide; this grouping is a study aid, not an IB classification. Most</text><text x="450" y="551.32" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">governments combine several.</text>
</svg>