<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 625" width="900" height="625" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="625" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What legitimacy is, and is not</text>

<rect x="250" y="115" width="400" height="120" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.2"/><text x="450" y="160.3" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">Legitimacy</text><text x="450" y="187.42000000000002" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">a population broadly accepts an actor or</text><text x="450" y="208.54000000000002" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">action as proper</text><rect x="30" y="290" width="400" height="130" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.2"/><text x="48" y="326.05" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">not the same as power</text><text x="48" y="353.17" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">power is the ability to effect change; a</text><text x="48" y="374.29" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">government can rule by coercion and still</text><text x="48" y="395.41" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">lack legitimacy, at high cost</text><rect x="470" y="290" width="400" height="130" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.2"/><text x="488" y="326.05" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">not the same as legality</text><text x="488" y="353.17" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">a legal law can be widely rejected; an</text><text x="488" y="374.29" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">illegal protest can be widely seen as</text><text x="488" y="395.41" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">justified</text><line x1="330" y1="239" x2="230" y2="286" stroke="#1e2a44" stroke-width="2.5" stroke-dasharray="6 5"/><line x1="570" y1="239" x2="670" y2="286" stroke="#1e2a44" stroke-width="2.5" stroke-dasharray="6 5"/><rect x="30" y="445" width="840" height="150" rx="14" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="480" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="middle">Always ask: legitimate in whose eyes?</text><rect x="60" y="505" width="180" height="60" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="150" y="542.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">citizens</text><rect x="260" y="505" width="180" height="60" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="350" y="542.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">other states</text><rect x="460" y="505" width="180" height="60" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="550" y="542.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">regional bodies</text><rect x="660" y="505" width="180" height="60" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="750" y="542.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">UN bodies</text>
</svg>