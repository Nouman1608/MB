<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 663" width="900" height="663" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="663" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Judging a non-state actor’s legitimacy</text>

<rect x="30" y="115" width="410" height="125" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="48" y="161.9" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Representation</text><text x="48" y="189.02" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">how far it represents the interests of groups</text><text x="48" y="210.14000000000001" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">in society</text><rect x="460" y="115" width="410" height="125" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="478" y="172.4" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Interaction</text><text x="478" y="199.52" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">how it relates to state and non-state actors</text><rect x="30" y="255" width="410" height="125" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="48" y="312.4" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Ability</text><text x="48" y="339.52" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">what means it has to exert influence</text><rect x="460" y="255" width="410" height="125" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="478" y="312.4" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Efficacy</text><text x="478" y="339.52" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">how far it achieves its goals</text><text x="30" y="430" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Example: Médecins Sans Frontières (NGO)</text><rect x="30" y="445" width="200" height="96" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="40" y="470.2" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Representation</text><text x="40" y="495.34" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="start">claims no group;</text><text x="40" y="514.48" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="start">humanitarian principles</text><rect x="243" y="445" width="200" height="96" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="253" y="470.2" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Interaction</text><text x="253" y="495.34" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="start">negotiates access;</text><text x="253" y="514.48" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="start">stresses neutrality</text><rect x="456" y="445" width="200" height="96" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="466" y="470.2" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Ability</text><text x="466" y="495.34" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="start">medical expertise;</text><text x="466" y="514.48" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="start">private donations</text><rect x="669" y="445" width="200" height="96" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="679" y="470.2" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Efficacy</text><text x="679" y="495.34" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="start">visible outcomes:</text><text x="679" y="514.48" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="start">patients treated</text><rect x="30" y="560" width="840" height="72.24000000000001" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="590.2" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">The same actor can be legitimate to one audience and illegitimate to another: present contested</text><text x="450" y="611.32" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">cases in balance.</text>
</svg>