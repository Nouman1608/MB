<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 743" width="900" height="743" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="743" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How legitimacy is gained and lost</text>

<circle cx="450" cy="370" r="80" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="365" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Actor’s</text><text x="450" y="390" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">legitimacy</text><rect x="250" y="115" width="400" height="120" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="450" y="159.6" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">1 Formal recognition (top down)</text><text x="450" y="185.4" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">South Sudan: independent July 2011, admitted to</text><text x="450" y="205.20000000000002" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">the UN days later</text><line x1="450" y1="239" x2="450" y2="284" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><rect x="30" y="310" width="300" height="130" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="42" y="339.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">2 Self-legitimation</text><text x="42" y="364.24" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="start">elections, referendums, symbols; can</text><text x="42" y="383.38" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="start">fail, e.g. 2022 Russian-run</text><text x="42" y="402.52" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="start">referendums ruled invalid by the UNGA</text><line x1="334" y1="370" x2="366" y2="370" stroke="#8a6d0d" stroke-width="4" marker-end="url(#ahO)"/><rect x="570" y="310" width="300" height="130" rx="12" fill="#fbeee6" stroke="#b5602e" stroke-width="2.2"/><text x="582" y="339.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">4 (De)legitimation by rivals</text><text x="582" y="364.24" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="start">opposition boycotts, NGO</text><text x="582" y="383.38" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="start">name-and-shame reports, rival claims</text><line x1="566" y1="370" x2="534" y2="370" stroke="#b5602e" stroke-width="4" marker-end="url(#ahR)"/><rect x="250" y="505" width="400" height="110" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="450" y="554.6" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">3 Organic recognition (from below)</text><text x="450" y="580.4" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">turnout, membership, donations, public trust</text><line x1="450" y1="501" x2="450" y2="456" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><rect x="30" y="640" width="840" height="72.24000000000001" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="670.2" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Legitimacy is not fixed: it is gained, strengthened, reduced or lost through actions, interactions</text><text x="450" y="691.32" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">and outcomes.</text>
</svg>