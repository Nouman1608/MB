<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 740" width="900" height="740" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="740" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Tracing a legitimacy crisis: Sri Lanka</text>

<rect x="30" y="110" width="840" height="91.52000000000001" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="80" cy="155.76" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="80" y="164.39999999999998" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="128" y="149" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Case</text><text x="128" y="173.4" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Sri Lanka, 2022</text><rect x="30" y="211.52" width="840" height="91.52000000000001" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="80" cy="257.28000000000003" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="80" y="265.92" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="128" y="250.52" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Source damaged: performance</text><text x="128" y="274.92" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the government could not secure fuel, food or medicine</text><rect x="30" y="313.04" width="840" height="91.52000000000001" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="80" cy="358.8" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="80" y="367.44" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="128" y="352.04" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Audience: citizens</text><text x="128" y="376.44" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">protested in large numbers</text><rect x="30" y="414.56000000000006" width="840" height="91.52000000000001" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="80" cy="460.32000000000005" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="80" y="468.96000000000004" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="128" y="453.56000000000006" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Outcome</text><text x="128" y="477.96000000000004" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the president fled and resigned in July 2022; parliament chose Ranil Wickremesinghe</text><rect x="30" y="516.08" width="840" height="91.52000000000001" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="80" cy="561.84" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="80" y="570.48" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="128" y="555.08" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">State legitimacy: intact</text><text x="128" y="579.48" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the constitution was used to transfer power</text><rect x="30" y="617.6" width="840" height="91.52000000000001" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="80" cy="663.36" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="80" y="672" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">6</text><text x="128" y="656.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Recovery through process</text><text x="128" y="681" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">presidential election, September 2024, won by Anura Kumara Dissanayake</text>
</svg>