<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 575" width="900" height="575" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="575" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How family roles are changing</text>

<rect x="30" y="104" width="270.6666666666667" height="273" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="137" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PARTNERS</text><text x="50" y="163.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Segregated → more</text><text x="50" y="188.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">joint roles</text><text x="50" y="216.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="216.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Willmott and Young (1973):</text><text x="65.2" y="237.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">couples share tasks and</text><text x="65.2" y="258.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">decisions</text><text x="50" y="284.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="284.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Dual-worker families now</text><text x="65.2" y="305.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">common</text><text x="50" y="331.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="331.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Feminists: women still do</text><text x="65.2" y="352.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">most domestic work</text><rect x="314.6666666666667" y="104" width="270.6666666666667" height="273" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="334.6666666666667" y="137" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CHILDREN</text><text x="334.6666666666667" y="163.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Economic asset →</text><text x="334.6666666666667" y="188.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">economic cost</text><text x="334.6666666666667" y="216.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="349.8666666666667" y="216.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Families more</text><text x="349.8666666666667" y="237.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">child-centred</text><text x="334.6666666666667" y="263.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="349.8666666666667" y="263.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Boomerang children return</text><text x="349.8666666666667" y="284.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">home as adults (housing</text><text x="349.8666666666667" y="305.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">costs, unemployment)</text><rect x="599.3333333333334" y="104" width="270.6666666666667" height="273" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="619.3333333333334" y="137" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">GRANDPARENTS</text><text x="619.3333333333334" y="163.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Givers and receivers</text><text x="619.3333333333334" y="188.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">of care</text><text x="619.3333333333334" y="216.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="634.5333333333334" y="216.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Childcare, economic</text><text x="634.5333333333334" y="237.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">support, wisdom and advice</text><text x="619.3333333333334" y="263.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="634.5333333333334" y="263.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Some become dependent and</text><text x="634.5333333333334" y="284.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">need care</text><rect x="30" y="395" width="840" height="150" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="428" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">THE PIVOT OR SANDWICH GENERATION</text><line x1="176" y1="489" x2="214" y2="489" stroke="#1e2a44" stroke-width="2.2"/><g opacity="1"><circle cx="165" cy="471" r="8" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.2"/><rect x="154" y="481" width="22" height="19" rx="8" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.2"/></g><g opacity="1"><circle cx="225" cy="471" r="8" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.2"/><rect x="214" y="481" width="22" height="19" rx="8" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.2"/></g><text x="195" y="531" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">elderly parents</text><line x1="385" y1="481" x2="262" y2="481" stroke="#8a6d0d" stroke-width="3.5" marker-end="url(#ahO)"/><line x1="431" y1="489" x2="469" y2="489" stroke="#1e2a44" stroke-width="2.2"/><g opacity="1"><circle cx="420" cy="471" r="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.2"/><rect x="409" y="481" width="22" height="19" rx="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.2"/></g><g opacity="1"><circle cx="480" cy="471" r="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.2"/><rect x="469" y="481" width="22" height="19" rx="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.2"/></g><text x="450" y="531" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">cares for both</text><line x1="515" y1="481" x2="640" y2="481" stroke="#8a6d0d" stroke-width="3.5" marker-end="url(#ahO)"/><g opacity="1"><circle cx="680" cy="475.1" r="6.8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.2"/><rect x="670.65" y="483.6" width="18.7" height="16.15" rx="6.8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.2"/></g><g opacity="1"><circle cx="720" cy="475.1" r="6.8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.2"/><rect x="710.65" y="483.6" width="18.7" height="16.15" rx="6.8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.2"/></g><text x="700" y="531" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">children</text>
</svg>