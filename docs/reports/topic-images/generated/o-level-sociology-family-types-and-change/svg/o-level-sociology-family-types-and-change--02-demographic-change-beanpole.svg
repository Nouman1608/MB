<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How demographic change reshapes families</text>

<rect x="30" y="110" width="400" height="380" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="470" y="110" width="400" height="380" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="230" y="146" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Wide and short</text><text x="230" y="172" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">many children, fewer generations</text><text x="670" y="146" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="middle">Long and thin: beanpole</text><text x="670" y="172" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">few children, more generations</text><line x1="211" y1="264" x2="249" y2="264" stroke="#1e2a44" stroke-width="2.2"/><g opacity="1"><circle cx="200" cy="246" r="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.2"/><rect x="189" y="256" width="22" height="19" rx="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.2"/></g><g opacity="1"><circle cx="260" cy="246" r="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.2"/><rect x="249" y="256" width="22" height="19" rx="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.2"/></g><g opacity="1"><line x1="230" y1="264" x2="230" y2="322.8" stroke="#1e2a44" stroke-width="2.2"/><line x1="90" y1="322.8" x2="370" y2="322.8" stroke="#1e2a44" stroke-width="2.2"/><line x1="90" y1="322.8" x2="90" y2="331.3" stroke="#1e2a44" stroke-width="2.2"/><line x1="145" y1="322.8" x2="145" y2="331.3" stroke="#1e2a44" stroke-width="2.2"/><line x1="200" y1="322.8" x2="200" y2="331.3" stroke="#1e2a44" stroke-width="2.2"/><line x1="260" y1="322.8" x2="260" y2="331.3" stroke="#1e2a44" stroke-width="2.2"/><line x1="315" y1="322.8" x2="315" y2="331.3" stroke="#1e2a44" stroke-width="2.2"/><line x1="370" y1="322.8" x2="370" y2="331.3" stroke="#1e2a44" stroke-width="2.2"/><g opacity="1"><circle cx="90" cy="338.1" r="6.8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.2"/><rect x="80.65" y="346.6" w