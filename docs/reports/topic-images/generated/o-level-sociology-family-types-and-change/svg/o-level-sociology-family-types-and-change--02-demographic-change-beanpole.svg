tart">children, women’s education</text><text x="50" y="636.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">and careers.</text><rect x="315.3333333333333" y="510" width="269.3333333333333" height="151" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="335.3333333333333" y="545.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Longer life</text><text x="335.3333333333333" y="573.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Longer life expectancy and</text><text x="335.3333333333333" y="594.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">an ageing population: more</text><text x="335.3333333333333" y="615.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">grandparents and</text><text x="335.3333333333333" y="636.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">great-grandparents.</text><rect x="600.6666666666666" y="510" width="269.3333333333333" height="151" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="620.6666666666666" y="545.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Children later</text><text x="620.6666666666666" y="573.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Longer education and</text><text x="620.6666666666666" y="594.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">careers delay parenthood.</text>
