<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 497" width="900" height="497" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="497" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Is family diversity a good thing?</text>

<rect x="30" y="104" width="410" height="207" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="137" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">NEW RIGHT</text><text x="50" y="164" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">No: the nuclear family is best</text><text x="50" y="193.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="193.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">The married two-parent family is best</text><text x="66.15" y="215.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">for children and society</text><text x="50" y="242.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="242.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Lone-parent and other “non-traditional”</text><text x="66.15" y="264.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">families are linked to poor</text><text x="66.15" y="286.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">socialisation and dysfunctional families</text><rect x="460" y="104" width="410" height="207" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="480" y="137" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">POSTMODERNISTS</text><text x="480" y="164" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Yes: people choose what suits</text><text x="480" y="190" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">them</text><text x="480" y="219.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="496.15" y="219.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Diversity is positive</text><text x="480" y="246.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="496.15" y="246.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Judith Stacey (1990): women created new</text><text x="496.15" y="268.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">family forms after divorce</text><rect x="30" y="329" width="840" height="138" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="362" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">HOW DOMINANT IS THE NUCLEAR FAMILY?</text><text x="50" y="388.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Robert Chester (1985): most people still spend part of their lives in a</text><text x="50" y="413.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">nuclear family</text><text x="50" y="442.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Often a “neo-conventional” one, where both partners work.</text>
</svg>