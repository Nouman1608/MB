<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="640" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Did industrialisation create the nuclear family?</text>

<rect x="30" y="110" width="840" height="110" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="143" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">PARSONS’ CLAIM</text><text x="50" y="169.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The isolated nuclear family “fits” industrial society because it is</text><text x="50" y="194.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">geographically mobile</text><line x1="60" y1="280" x2="850" y2="280" stroke="#1e2a44" stroke-width="5" marker-end="url(#ah)"/><rect x="60" y="258" width="370" height="44" rx="10" fill="#dce9e7"/><text x="245" y="287" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Pre-industrial</text><rect x="470" y="258" width="360" height="44" rx="10" fill="#efdfa8"/><text x="650" y="287" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="middle">Industrial</text><line x1="245" y1="302" x2="245" y2="330" stroke="#1e2a44" stroke-width="2.2"/><line x1="650" y1="302" x2="650" y2="330" stroke="#1e2a44" stroke-width="2.2"/><rect x="30" y="330" width="410" height="182" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="363" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">PETER LASLETT (1972)</text><text x="50" y="389.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Nuclear households were already</text><text x="50" y="414.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">common</text><text x="50" y="443.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">in pre-industrial England, before</text><text x="50" y="465.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">industrialisation.</text><rect x="460" y="330" width="410" height="182" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="480" y="363" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">MICHAEL ANDERSON (1971)</text><text x="480" y="389.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Families shared homes with</text><text x="480" y="414.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">relatives</text><text x="480" y="443.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">1851 census, Preston: working-class</text><text x="480" y="465.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">families did this to cope with industrial</text><text x="480" y="487.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">hardship.</text><rect x="30" y="530" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="563.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Both findings challenge Parsons: the nuclear family came before industry, and industry did</text><text x="50" y="585.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">not end extended living.</text>
</svg>