<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 579" width="900" height="579" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="579" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What is changing marriage, divorce and cohabitation?</text>

<rect x="30" y="104" width="560" height="287" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="137" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">LOOSENING MARRIAGE</text><text x="50" y="163.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Less pressure to marry or stay married</text><text x="50" y="192.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="192.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Legislation: easier divorce, women’s rights in divorce</text><text x="66.15" y="214.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">(e.g. Pakistan’s 1961 ordinance)</text><text x="50" y="241.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="241.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Attitudes and values: less stigma on divorce and</text><text x="66.15" y="263.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">cohabitation</text><text x="50" y="290.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="290.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Secularisation: declining religious influence</text><text x="50" y="317.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="317.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Female empowerment: education and income let women leave</text><text x="66.15" y="339.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">unhappy marriages</text><text x="50" y="366.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="366.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">The internet: dating apps widen partner choice</text><rect x="610" y="104" width="260" height="287" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="630" y="189.5" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">HOLDING TRADITION</text><text x="630" y="215.7" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Cultural</text><text x="630" y="240.7" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">expectations</text><text x="630" y="270.1" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Some cultures still</text><text x="630" y="292.1" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">expect early, arranged</text><text x="630" y="314.1" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">marriage.</text><text x="450" y="429" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Alternatives to marriage</text><rect x="206.16250000000002" y="455" width="151.29999999999998" height="42" rx="21" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="281.8125" y="482.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">cohabitation</text><rect x="369.4625" y="455" width="131.75" height="42" rx="21" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="435.3375" y="482.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">singlehood</text><rect x="513.2125" y="455" width="180.62499999999997" height="42" rx="21" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="603.525" y="482.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">lone parenthood</text><rect x="276.6" y="507" width="346.79999999999995" height="42" rx="21" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="534.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">civil partnerships (where legal)</text>
</svg>