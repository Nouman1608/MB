<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 732" width="900" height="732" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="732" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Bandwidth and transmission errors</text>

<rect x="30" y="110" width="840" height="270" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="52" y="146" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Worked example: 50 MB file, bandwidth 20 Mbps</text><rect x="52" y="170" width="130" height="58" rx="8" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="117" y="206" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">bytes → bits</text><text x="206" y="207" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">50 × 8</text><line x1="500" y1="199" x2="540" y2="199" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="548" y="170" width="300" height="58" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="698" y="207" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">400 megabits</text><rect x="52" y="246" width="130" height="58" rx="8" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="117" y="282" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">time</text><text x="206" y="283" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">400 ÷ 20</text><line x1="500" y1="275" x2="540" y2="275" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="548" y="246" width="300" height="58" rx="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="698" y="283" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">20 seconds</text><text x="698" y="340" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle" font-style="italic">at best</text><text x="52" y="340" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Bandwidth = the maximum rate, in bits per second.</text><text x="52" y="362" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Congestion and protocol overheads make actual speed lower.</text><text x="450" y="420" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Common causes of transmission error</text><rect x="30" y="438" width="410" height="48" rx="10" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="468" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">electromagnetic interference</text><rect x="460" y="438" width="410" height="48" rx="10" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="480" y="468" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">attenuation: signal weakens over distance</text><rect x="30" y="498" width="410" height="48" rx="10" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="528" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">physical damage to cables</text><rect x="460" y="498" width="410" height="48" rx="10" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="480" y="528" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">congestion: routers drop packets</text><rect x="30" y="558" width="840" height="48" rx="10" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="588" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">wireless collisions or interference</text><line x1="450" y1="620" x2="450" y2="646" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><rect x="30" y="652" width="840" height="56" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="687" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">Protocols respond with error detection (such as checksums) and retransmission.</text>
</svg>