ht="400" fill="#1e2a44" text-anchor="middle">header</text><text x="632" y="331" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="end" font-style="italic">segment</text><line x1="140" y1="376" x2="140" y2="390" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="392" width="220" height="100" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="48" y="428" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Internet</text><text x="48" y="454" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">IP addresses; routes</text><text x="48" y="472" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">packets</text><rect x="760" y="418" width="110" height="50" rx="0" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="815" y="449" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">data</text><rect x="644" y="418" width="116" height="50" rx="0" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="702" y="440" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">transport</text><text x="702" y="459" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">header</text><rect x="528" y="418" width="116" height="50" rx="0" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="586" y="440" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">IP</text><text x="586" y="459" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">header</text><text x="516" y="449" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="end" font-style="italic">packet</text><line x1="140" y1="494" x2="140" y2="508" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="510" width="220" height="100" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="48" y="546" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Network interface</text><text x="48" y="572" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">frames over the physical</text><text x="48" y="590" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">medium</text><rect x="760" y="536" width="110" height="50" rx="0" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="815" y="567" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">data</text><rect x="644" y="536" width="116" height="50" rx="0" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="702" y="558" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">transport</text><text x="702" y="577" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">header</text><rect x="528" y="536" width="116" height="50" rx="0" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="586" y="558" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">IP</text><text x="586" y="577" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">header</text><rect x="412" y="536" width="116" height="50" rx="0" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="470" y="558" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">frame</text><text x="470" y="577" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">header</text><text x="400" y="567" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="end" font-style="italic">frame</text><path d="M880,170 L880,500" fill="none" stroke="#2e6b62" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahT)"/><rect x="30" y="636" width="410" height="92" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="52" y="668" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Sending: encapsulation</text><text x="52" y="694" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">each layer adds its header on the way down</text><rect x="460" y="636" width="410" height="92" rx="12" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="482" y="668" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="start">Receiving</text><text x="482" y="694" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">each layer reads and removes its header</text><rect x="30" y="744" width="840" height="70" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="772" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Reliability: the internet layer delivers on a best-effort basis;</text><text x="450" y="796" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">TCP detects missing or damaged segments and requests them again.</text>
