<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 726" width="900" height="726" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="726" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Loading a web page, end to end</text>

<rect x="30" y="140" width="640" height="200" rx="16" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" stroke-dasharray="8 6"/><text x="50" y="168" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">School network</text><path d="M106,256 q35,-24 60,0" fill="none" stroke="#2e6b62" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="4 5"/><line x1="260" y1="260" x2="290" y2="260" stroke="#1e2a44" stroke-width="3"/><line x1="390" y1="260" x2="420" y2="260" stroke="#1e2a44" stroke-width="3"/><line x1="520" y1="260" x2="550" y2="260" stroke="#1e2a44" stroke-width="3"/><line x1="650" y1="260" x2="690" y2="260" stroke="#1e2a44" stroke-width="3"/><line x1="770" y1="260" x2="816" y2="260" stroke="#1e2a44" stroke-width="3"/><rect x="58" y="242" width="44" height="30" rx="4" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><rect x="72" y="272" width="16" height="6" fill="#1e2a44"/><rect x="64" y="277" width="32" height="4" rx="2" fill="#1e2a44"/><rect x="165" y="238" width="90" height="44" rx="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="210" y="266" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">WAP</text><rect x="290" y="238" width="100" height="44" rx="8" fill="#f6e3d6" stroke="#1e2a44" stroke-width="2.5"/><text x="340" y="266" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Firewall</text><rect x="420" y="238" width="100" height="44" rx="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="470" y="266" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Router</text><rect x="550" y="238" width="100" height="44" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="600" y="266" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Modem</text><path d="M691.5,281 a13.200000000000001,13.200000000000001 0 0 1 4.4,-24.200000000000003 a18.700000000000003,18.700000000000003 0 0 1 34.1,-7.700000000000001 a16.5,16.5 0 0 1 30.800000000000004,5.5 a13.200000000000001,13.200000000000001 0 0 1 7.700000000000001,26.400000000000002 z" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><text x="730" y="266" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">routers</text><rect x="818" y="230" width="44" height="60" rx="5" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><line x1="826" y1="244" x2="854" y2="244" stroke="#8a6d0d" stroke-width="3"/><line x1="826" y1="260" x2="854" y2="260" stroke="#8a6d0d" stroke-width="3"/><line x1="826" y1="276" x2="854" y2="276" stroke="#8a6d0d" stroke-width="3"/><text x="840" y="312" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">web server</text><text x="80" y="312" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">laptop</text><circle cx="140" cy="210" r="15" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="140" y="215.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><circle cx="340" cy="210" r="15" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="340" y="215.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><circle cx="470" cy="210" r="15" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="470" y="215.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><circle cx="730" cy="200" r="15" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="730" y="205.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><rect x="30" y="362" width="840" height="43" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="62" cy="383.5" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="389.26" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="96" y="388" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The laptop joins the Wi-Fi through a WAP; DHCP gives it an IP address.</text><rect x="30" y="413" width="840" height="43" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="62" cy="434.5" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="440.26" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="96" y="439" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The browser sends an HTTPS request to the web server.</text><rect x="30" y="464" width="840" height="43" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="62" cy="485.5" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="491.26" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="96" y="490" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">TCP establishes a connection and splits the request into segments.</text><rect x="30" y="515" width="840" height="64" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="62" cy="547" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="552.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="96" y="541" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The firewall checks the traffic is allowed; the router forwards packets towards</text><text x="96" y="562" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the internet through the modem.</text><rect x="30" y="587" width="840" height="64" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="62" cy="619" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="624.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="96" y="613" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Routers across the internet forward packets by IP address; the reply returns the</text><text x="96" y="634" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">same way.</text><rect x="30" y="659" width="840" height="43" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="62" cy="680.5" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="686.26" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">6</text><text x="96" y="685" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">TCP reassembles the response in order and the browser displays the page.</text>
</svg>