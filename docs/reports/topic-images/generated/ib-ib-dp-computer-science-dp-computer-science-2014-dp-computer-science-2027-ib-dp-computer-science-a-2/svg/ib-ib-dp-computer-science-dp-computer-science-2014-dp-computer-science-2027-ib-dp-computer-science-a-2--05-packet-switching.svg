<rect width="900" height="728" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Packet switching</text>

<text x="52" y="128" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Each packet has a header</text><rect x="52" y="142" width="170" height="46" rx="0" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="137" y="171" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">source address</text><rect x="222" y="142" width="200" height="46" rx="0" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="322" y="171" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">destination address</text><rect x="422" y="142" width="140" height="46" rx="0" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="492" y="171" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">sequence no.</text><rect x="562" y="142" width="120" height="46" rx="0" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="622" y="171" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">data</text><rect x="30" y="214" width="840" height="300" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><line x1="260" y1="330" x2="430" y2="260" stroke="#c9d6d4" stroke-width="4"/><line x1="260" y1="330" x2="430" y2="420" stroke="#c9d6d4" stroke-width="4"/><line x1="430" y1="260" x2="600" y2="300" stroke="#c9d6d4" stroke-width="4"/><line x1="430" y1="420" x2="600" y2="440" stroke="#c9d6d4" stroke-width="4"/><line x1="430" y1="260" x2="430" y2="420" stroke="#c9d6d4" stroke-width="4"/><line x1="600" y1="300" x2="600" y2="440" stroke="#c9d6d4" stroke-width="4"/><line x1="130" y1="330" x2="260" y2="330" stroke="#c9d6d4" stroke-width="4"/><line x1="600" y1="300" x2="760" y2="370" stroke="#c9d6d4" stroke-width="4"/><line x1="600" y1="440" x2="760" y2="370" stroke="#c9d6d4" stroke-width="4"/><path d="M130,322 L260,322 L430,252 L600,292 L760,362" fill="none" stroke="#2e6b62" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="9 6"/><path d="M130,338 L260,338 L430,428 L600,448 L760,378" fill="none" stroke="#8a6d0d" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="9 6"/><circle cx="260" cy="330" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="260" y="335" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">R</text><circle cx="430" cy="260" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="430" y="265" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">R</text><circle cx="430" cy="420" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="430" y="425" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">R</text><circle cx="600" cy="300" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="600" y="305" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">R</text><circle cx="600" cy="440" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="600" y="445" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">R</text><rect x="78" y="312" width="44" height="30" rx="4" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><rect x="92" y="342" width="16" height="6" fill="#1e2a44"/><rect x="84" y="347" width="32" height="4" rx="2" fill="#1e2a44"/><text x="100" y="372" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">sender</text><rect x="768" y="352" width="44" height="30" rx="4" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><rect x="782" y="382" width="16" height="6" fill="#1e2a44"/><rect x="774" y="387" width="32" height="4" rx="2" fill="#1e2a44"/><text x="790" y="412" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">destination</text><rect x="327" y="254" width="36" height="32" rx="5" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="345" y="276" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="497" y="242" width="36" height="32" rx="5" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="515" y="264" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="327" y="384" width="36" height="32" rx="5" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="345" y="406" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="497" y="436" width="36" height="32" rx="5" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="515" y="458" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="52" y="246" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">each router chooses the best available path</text><text x="450" y="498" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">R = router · packets of one message may take different routes</text><text x="52" y="556" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Arrive</text><rect x="172" y="534" width="36" height="32" rx="5" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="190" y="556" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="222" y="534" width="36" height="32" rx="5" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="240" y="556" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="272" y="534" width="36" height="32" rx="5" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="290" y="556" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="322" y="534" width="36" height="32" rx="5" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="340" y="556" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="370" y="556" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">out of order</text><line x1="490" y1="550" x2="540" y2="550" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="556" y="556" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Reassembled</text><rect x="682" y="534" width="36" height="32" rx="5" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="700" y="556" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="728" y="534" width="36" height="32" rx="5" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="746" y="556" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="774" y="534" width="36" height="32" rx="5" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="792" y="556" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="820" y="534" width="36" height="32" rx="5" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="838" y="556" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="560" y="596" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="middle">using sequence numbers; with TCP, missing packets are requested again</text><rect x="30" y="620" width="840" height="84" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="52" y="652" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Why it is used</text><text x="52" y="682" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">lines are shared efficiently · traffic routes around broken links or busy routers · it scales</text>
</svg>