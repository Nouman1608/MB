<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 732" width="900" height="732" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="732" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Network devices and the layers they work at</text>

<rect x="30" y="130" width="840" height="110" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="52" y="168" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Transport</text><text x="52" y="194" font-size="15" font-weight="600" fill="#8a6d0d" text-anchor="start" font-style="italic">reads port numbers</text><rect x="30" y="250" width="840" height="110" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="52" y="288" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Internet</text><text x="52" y="314" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start" font-style="italic">reads IP addresses</text><rect x="30" y="370" width="840" height="110" rx="12" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><text x="52" y="408" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Network interface</text><text x="52" y="434" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start" font-style="italic">reads MAC addresses</text><rect x="275" y="403" width="110" height="44" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="330" y="431" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">NIC</text><rect x="405" y="403" width="110" height="44" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="460" y="431" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Switch</text><rect x="535" y="403" width="110" height="44" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="590" y="431" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">WAP</text><rect x="665" y="403" width="110" height="44" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="720" y="431" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Modem</text><rect x="265" y="283" width="130" height="44" rx="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="330" y="311" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Router</text><rect x="470" y="278" width="140" height="44" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="540" y="306" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Gateway</text><text x="540" y="346" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">often here; may span layers</text><rect x="730" y="152" width="120" height="200" rx="10" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="790" y="240" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">Hardware</text><text x="790" y="260" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">firewall</text><text x="790" y="290" font-size="15" font-weight="400" fill="#b5602e" text-anchor="middle">ports and</text><text x="790" y="308" font-size="15" font-weight="400" fill="#b5602e" text-anchor="middle">IP addresses</text><text x="52" y="518" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">NIC</text><text x="150" y="518" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">connects a device to a network; has a unique MAC address</text><text x="52" y="548" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Switch</text><text x="150" y="548" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">forwards frames within a LAN to the matching MAC address</text><text x="52" y="578" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">WAP</text><text x="150" y="578" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">lets wireless devices join a wired network</text><text x="52" y="608" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Modem</text><text x="150" y="608" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">converts digital signals for the line, and back</text><text x="52" y="638" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Router</text><text x="150" y="638" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">forwards packets between networks by IP address</text><text x="52" y="668" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Gateway</text><text x="150" y="668" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">connects networks using different protocols</text><text x="52" y="698" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Firewall</text><text x="150" y="698" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">blocks traffic by rules such as IP addresses and ports</text>
</svg>