<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 684" width="900" height="684" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="684" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">TCP, UDP and the application protocols</text>

<rect x="30" y="110" width="410" height="420" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="52" y="146" font-size="22" font-weight="700" fill="#2e6b62" text-anchor="start">TCP</text><text x="52" y="172" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">connection-based</text><rect x="460" y="110" width="410" height="420" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="482" y="146" font-size="22" font-weight="700" fill="#8a6d0d" text-anchor="start">UDP</text><text x="482" y="172" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">connectionless</text><line x1="80" y1="190" x2="80" y2="420" stroke="#1e2a44" stroke-width="2.5"/><line x1="380" y1="190" x2="380" y2="420" stroke="#1e2a44" stroke-width="2.5"/><text x="80" y="438" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">sender</text><text x="380" y="438" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">receiver</text><line x1="80" y1="200" x2="376" y2="214" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="230" y="201" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">set up connection</text><line x1="80" y1="240" x2="376" y2="254" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="230" y="241" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">segment 1</text><line x1="380" y1="270" x2="84" y2="284" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><text x="230" y="271" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="middle">ack 1</text><line x1="80" y1="302" x2="230" y2="310" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><text x="250" y="316" font-size="20" font-weight="700" fill="#b5602e" text-anchor="start">✗</text><text x="150" y="296" font-size="15" font-weight="600" fill="#b5602e" text-anchor="start">segment 2</text><line x1="80" y1="350" x2="376" y2="364" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="230" y="351" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">segment 2 resent</text><line x1="380" y1="380" x2="84" y2="394" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><text x="230" y="381" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="middle">ack 2</text><text x="52" y="472" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">numbered, checked, acknowledged:</text><text x="52" y="492" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">arrives complete and in order</text><text x="52" y="516" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">web pages · email · file transfer</text><line x1="510" y1="190" x2="510" y2="420" stroke="#1e2a44" stroke-width="2.5"/><line x1="810" y1="190" x2="810" y2="420" stroke="#1e2a44" stroke-width="2.5"/><text x="510" y="438" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">sender</text><text x="810" y="438" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">receiver</text><line x1="510" y1="210" x2="806" y2="222" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="560" y="206" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">datagram</text><line x1="510" y1="254" x2="806" y2="266" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="560" y="250" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">datagram</text><line x1="510" y1="298" x2="680" y2="306" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><text x="700" y="312" font-size="20" font-weight="700" fill="#b5602e" text-anchor="start">✗</text><text x="560" y="294" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">datagram</text><line x1="510" y1="342" x2="806" y2="354" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="560" y="338" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">datagram</text><line x1="510" y1="386" x2="806" y2="398" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="560" y="382" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">datagram</text><text x="482" y="472" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">no acknowledgements or resending:</text><text x="482" y="492" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">faster, less overhead, may lose data</text><text x="482" y="516" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">live video calls · online games · streaming</text><rect x="30" y="550" width="270" height="110" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="584" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">HTTP</text><text x="50" y="612" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">browsers request web pages;</text><text x="50" y="631" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">servers send them</text><rect x="315" y="550" width="270" height="110" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="335" y="584" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">HTTPS</text><text x="335" y="612" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">HTTP with TLS encryption and a</text><text x="335" y="631" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">certificate check</text><rect x="600" y="550" width="270" height="110" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="620" y="584" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">DHCP</text><text x="620" y="612" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">gives a joining device an IP</text><text x="620" y="631" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">address and settings</text>
</svg>