<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 606" width="900" height="606" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="606" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Musannaf or musnad?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Two ways of arranging a collection</text>
<rect x="30" y="124" width="405" height="450" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="164" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="start">Musannaf</text><text x="54" y="190" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="start">arranged by subject</text><rect x="54" y="210" width="357" height="42" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="70" y="237" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">Purification</text><rect x="54" y="262" width="357" height="42" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="70" y="289" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">Prayer</text><rect x="54" y="314" width="357" height="42" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="70" y="341" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">Zakat</text><text x="54" y="388" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">EXAMPLE</text><text x="54" y="412" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">al-Muwatta</tspan> of Imam Malik ibn Anas of</text><text x="54" y="434" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Madinah</text><text x="54" y="484" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">+</tspan> A judge or student can find the rulings on</text><text x="54" y="505" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">one topic</text><text x="54" y="532" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Also includes Companion reports and the</text><text x="54" y="553" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">practice of the people of Madinah</text><rect x="465" y="124" width="405" height="450" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="489" y="164" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="start">Musnad</text><text x="489" y="190" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">arranged by narrating Companion</text><rect x="489" y="210" width="357" height="42" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="505" y="237" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">Abu Bakr's narrations</text><rect x="489" y="262" width="357" height="42" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="505" y="289" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">Umar's narrations</text><rect x="489" y="314" width="357" height="42" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="505" y="341" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">and so on…</text><text x="489" y="388" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">EXAMPLE</text><text x="489" y="412" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">the <tspan font-weight="700">Musnad</tspan> of Ahmad ibn Hanbal, a very</text><text x="489" y="434" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">large collection</text><text x="489" y="484" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">+</tspan> Easier to study each Companion's reports</text><text x="489" y="505" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and check chains</text><text x="489" y="532" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">−</tspan> Harder to find rulings on a subject</text>
</svg>