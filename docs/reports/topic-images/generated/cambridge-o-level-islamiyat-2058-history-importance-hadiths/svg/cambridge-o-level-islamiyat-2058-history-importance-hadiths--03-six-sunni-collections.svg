<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 712" width="900" height="712" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="712" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The six Sunni collections (al-Kutub al-Sitta)</text>

<rect x="18" y="88" width="864" height="209" rx="18" fill="none" stroke="#8a6d0d" stroke-width="2.5" stroke-dasharray="8 6"/><text x="450" y="285" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">al-Sahihayn: regarded by Sunni scholars as the most reliable books after the Qur'an</text><rect x="30" y="100" width="412" height="155" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SAHIH · d. 870</text><text x="50" y="159.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">al-Bukhari</text><text x="50" y="188.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Strictest conditions: narrators must be proven to</text><text x="50" y="209.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">have met; chapter headings show his legal</text><text x="50" y="230.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">reasoning</text><rect x="458" y="100" width="412" height="155" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="478" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SAHIH · d. 875</text><text x="478" y="159.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Muslim ibn al-Hajjaj</text><text x="478" y="188.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Strict conditions; all versions of a Hadith in one</text><text x="478" y="209.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">place; introduction on method</text><rect x="30" y="319" width="412" height="133" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="351" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SUNAN</text><text x="50" y="377.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Abu Dawud al-Sijistani</text><text x="50" y="406.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Focus on Hadiths used for legal rulings</text><rect x="458" y="319" width="412" height="133" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="478" y="351" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">JAMI'</text><text x="478" y="377.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">al-Tirmidhi</text><text x="478" y="406.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Comments on the grade of Hadiths and on</text><text x="478" y="427.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">scholars' legal views</text><rect x="30" y="466" width="412" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="498" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SUNAN</text><text x="50" y="524.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">al-Nasa'i</text><text x="50" y="553.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Careful about narrators; legal arrangement</text><rect x="458" y="466" width="412" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="478" y="498" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SUNAN</text><text x="478" y="524.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Ibn Majah</text><text x="478" y="553.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Includes Hadiths not found in the other five</text><rect x="30" y="600" width="840" height="80" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="633.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">A <tspan font-weight="700" fill="#1e2a44">sunan</tspan> work concentrates on Hadiths about legal practice. "Main features" means arrangement,</text><text x="450" y="655.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">conditions and purpose.</text>
</svg>