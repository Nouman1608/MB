<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 597" width="900" height="597" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="597" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The Qur'an gives principles; the Hadiths apply them</text>

<text x="195" y="114" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">THE QUR'AN</text><text x="645" y="114" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">THE HADITHS</text><rect x="30" y="130" width="330" height="78" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="173.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Prayer is commanded</text><rect x="420" y="130" width="450" height="78" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="440" y="173.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Times, units and actions come from the Sunna</text><line x1="366" y1="169" x2="412" y2="169" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="220" width="330" height="78" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="263.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Zakat is commanded</text><rect x="420" y="220" width="450" height="80" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="440" y="253.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The Hadiths give the rates and the minimum</text><text x="440" y="275.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">amounts</text><line x1="366" y1="259" x2="412" y2="259" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="310" width="330" height="78" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="353.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The Qur'an is silent</text><rect x="420" y="310" width="450" height="80" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="440" y="343.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A Hadith can give a ruling, e.g. forbidding gold and</text><text x="440" y="365.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">silk clothing for men</text><line x1="366" y1="349" x2="412" y2="349" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="410" width="270.6666666666667" height="155" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="442" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">IJMA'</text><text x="50" y="468.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Consensus</text><text x="50" y="496.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Must agree with both sources</text><rect x="314.6666666666667" y="410" width="270.6666666666667" height="155" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="334.6666666666667" y="442" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">QIYAS</text><text x="334.6666666666667" y="468.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Analogy</text><text x="334.6666666666667" y="496.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Extends their rulings to new</text><text x="334.6666666666667" y="517.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">cases</text><rect x="599.3333333333334" y="410" width="270.6666666666667" height="155" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="619.3333333333334" y="442" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SURA 59.7</text><text x="619.3333333333334" y="468.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">"Take what the</text><text x="619.3333333333334" y="491.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Messenger gives you"</text><text x="619.3333333333334" y="519.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The basis for treating the</text><text x="619.3333333333334" y="540.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Sunna as binding</text>
</svg>