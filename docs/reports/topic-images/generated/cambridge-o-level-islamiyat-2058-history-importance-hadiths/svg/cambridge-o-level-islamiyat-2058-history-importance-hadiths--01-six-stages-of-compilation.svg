<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 664" width="900" height="664" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="664" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">From memory to the great collections</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Six stages in the history of the Hadiths</text>
<line x1="60" y1="144" x2="60" y2="612" stroke="#c9d6d4" stroke-width="4"/><rect x="104" y="124" width="766" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="116" y="150.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The Prophet's (pbuh) lifetime</text><text x="116" y="178.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Companions heard, watched and noted what he approved; mainly memory, with some writing</text><text x="116" y="199.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">such as al-Sahifa al-Sadiqa</text><circle cx="60" cy="170" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="178.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="104" y="224" width="766" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="116" y="250.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The Companions (after 632)</text><text x="116" y="278.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Became teachers and spread to Kufa, Basra, Damascus, Egypt and beyond; Umar asked for a</text><text x="116" y="299.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">witness</text><circle cx="60" cy="270" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="278.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="104" y="324" width="766" height="71" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="116" y="350.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The Successors (tabi'un)</text><text x="116" y="378.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Travelled to collect Hadiths; notebooks (sahifas) such as that of Hammam ibn Munabbih</text><circle cx="60" cy="359.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="368.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="104" y="403" width="766" height="71" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="116" y="429.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">First official collection: Umar ibn Abd al-Aziz (717–720)</text><text x="116" y="457.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Ordered Hadiths written down before scholars died; Ibn Shihab al-Zuhri of Madinah took part</text><circle cx="60" cy="438.5" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="447.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="104" y="482" width="766" height="71" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="116" y="508.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Musannaf, then musnad collections</text><text x="116" y="536.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">By subject (al-Muwatta of Malik); by narrator (the Musnad of Ahmad ibn Hanbal)</text><circle cx="60" cy="517.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="526.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><rect x="104" y="561" width="766" height="71" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="116" y="587.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Sahih and sunan collections (third Islamic century)</text><text x="116" y="615.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Chosen strictly for reliability: the six Sunni books, including al-Bukhari and Muslim</text><circle cx="60" cy="596.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="605.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">6</text>
</svg>