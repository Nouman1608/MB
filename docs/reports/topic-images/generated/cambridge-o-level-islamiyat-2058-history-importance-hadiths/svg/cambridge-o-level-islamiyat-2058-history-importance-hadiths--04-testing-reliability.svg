<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 588" width="900" height="588" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="588" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How scholars tested a Hadith</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">A response to fabrication</text>
<rect x="30" y="124" width="412" height="235" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ISNAD TESTS: THE CHAIN</text><text x="50" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Every narrator and every link</text><text x="50" y="211.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="211.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">'adala:</tspan> good character and practice</text><text x="50" y="238.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="238.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">dabt:</tspan> accurate memory</text><text x="50" y="265.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="265.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Unbroken chain: each narrator able to have</text><text x="65.2" y="286.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">met the one before</text><text x="50" y="313.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="313.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Checked in biographical dictionaries (<tspan font-weight="700" fill="#1e2a44">'ilm</tspan></text><text x="65.2" y="334.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">al-rijal</tspan>)</text><rect x="458" y="124" width="412" height="235" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="478" y="156" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">MATN TESTS: THE TEXT</text><text x="478" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">What the report says</text><text x="478" y="211.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="493.2" y="211.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Does not contradict the Qur'an or</text><text x="493.2" y="232.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">well-established Sunna</text><text x="478" y="259.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="493.2" y="259.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Not contrary to reason or known history</text><text x="478" y="286.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="493.2" y="286.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Sounds like the Prophet's (pbuh) way of</text><text x="493.2" y="307.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">speaking, not exaggerated promises</text><line x1="240" y1="365" x2="240" y2="403" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="660" y1="365" x2="660" y2="403" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="450" y="391" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">GRADED</text><rect x="30" y="411" width="199.5" height="89" rx="14" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><text x="129.75" y="446.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Sahih</text><text x="129.75" y="475.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">sound</text><rect x="243.5" y="411" width="199.5" height="89" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="343.25" y="446.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Hasan</text><text x="343.25" y="475.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">good</text><rect x="457" y="411" width="199.5" height="89" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="556.75" y="446.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Da'if</text><text x="556.75" y="475.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">weak</text><rect x="670.5" y="411" width="199.5" height="89" rx="14" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5"/><text x="770.25" y="446.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Mawdu'</text><text x="770.25" y="475.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">fabricated</text><path d="M30,514 L30,526 L443,526 L443,514" fill="none" stroke="#2e6b62" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><text x="236.5" y="550" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">only these establish rulings</text>
</svg>