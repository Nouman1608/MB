<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Answer plan: testing isnad and matn</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Explain how the isnad and matn of a Hadith were examined [10]</text>
<line x1="60" y1="144" x2="60" y2="514" stroke="#c9d6d4" stroke-width="4"/><rect x="104" y="124" width="766" height="71" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="116" y="150.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Define isnad and matn</text><text x="116" y="178.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Give an example of a chain</text><circle cx="60" cy="159.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="168.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="104" y="203" width="766" height="71" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="116" y="229.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Why tests were needed</text><text x="116" y="257.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Fabrication after political disputes</text><circle cx="60" cy="238.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="247.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="104" y="282" width="766" height="71" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="116" y="308.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Isnad: character, memory, continuity, meeting</text><text x="116" y="336.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">al-Bukhari: narrators had actually met. Muslim: lived at the same time and could have met</text><circle cx="60" cy="317.5" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="326.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="104" y="361" width="766" height="71" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="116" y="387.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Biographical dictionaries</text><text x="116" y="415.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Teachers, students, dates and reliability of narrators</text><circle cx="60" cy="396.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="405.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="104" y="440" width="766" height="43" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="116" y="466.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Matn: Qur'an and Sunna, reason, the Prophet's style</text><circle cx="60" cy="461.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="470.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><rect x="104" y="491" width="766" height="43" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="116" y="517.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Grades from sahih to mawdu'</text><circle cx="60" cy="512.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="521.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">6</text><rect x="30" y="556" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="590.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Why it reaches Level 4</text><text x="50" y="620.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Technical terms explained, examples given, and the reason for the tests included.</text>
</svg>