<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 775" width="900" height="775" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="775" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: power running up stairs</text>

<rect x="30" y="110" width="840" height="360" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M120,430 v-36 h60 v-36 h60 v-36 h60 v-36 h60 v-36 h60 v-36 h60 V430 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><circle cx="450" cy="151.6" r="12.8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><line x1="450" y1="164.4" x2="450" y2="198" stroke="#1e2a44" stroke-width="4"/><line x1="450" y1="198" x2="438.8" y2="230" stroke="#1e2a44" stroke-width="4"/><line x1="450" y1="198" x2="461.2" y2="230" stroke="#1e2a44" stroke-width="4"/><line x1="520" y1="430" x2="520" y2="214" stroke="#1e2a44" stroke-width="2.5"/><line x1="510" y1="430" x2="530" y2="430" stroke="#1e2a44" stroke-width="2.5"/><line x1="510" y1="214" x2="530" y2="214" stroke="#1e2a44" stroke-width="2.5"/><text x="536" y="322" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">vertical height 4.5 m</text><text x="536" y="346" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">(not the slope length)</text><text x="120" y="170" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">60 kg student, 5.4 s</text><rect x="30" y="490" width="410" height="230" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="60" y="528" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Calculation</text><text x="60" y="566" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">W = m × g × h</text><text x="60" y="598" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">  = 60 × 10 × 4.5 = 2700 J</text><text x="60" y="630" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">P = W / t = 2700 / 5.4</text><rect x="50" y="660" width="370" height="46" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="235" y="691" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">P = 500 W</text><rect x="460" y="490" width="410" height="230" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="490" y="528" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Measure it yourself</text><text x="490" y="566" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">bathroom scale: mass</text><text x="490" y="596" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">tape measure: vertical height</text><text x="490" y="626" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">stopwatch: time</text><text x="490" y="666" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">This is the power to gain GPE; the</text><text x="490" y="686" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">body's total power is higher.</text><text x="450" y="750" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Power = energy transferred per second: 1 W = 1 J/s.</text>
</svg>