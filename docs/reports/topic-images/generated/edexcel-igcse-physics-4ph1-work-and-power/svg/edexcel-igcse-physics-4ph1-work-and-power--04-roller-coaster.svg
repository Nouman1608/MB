<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 740" width="900" height="740" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="740" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: when friction does work</text>

<rect x="30" y="110" width="840" height="290" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M60,170 L120,170 Q260,170 330,330 Q360,370 420,370 L840,370" fill="none" stroke="#1e2a44" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><rect x="90" y="146" width="50" height="24" rx="5" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><text x="115" y="136" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">at rest</text><rect x="700" y="346" width="50" height="24" rx="5" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><line x1="756" y1="352" x2="820" y2="352" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><text x="780" y="336" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">18 m/s</text><line x1="500" y1="170" x2="500" y2="370" stroke="#1e2a44" stroke-width="2"/><line x1="490" y1="170" x2="510" y2="170" stroke="#1e2a44" stroke-width="2"/><line x1="490" y1="370" x2="510" y2="370" stroke="#1e2a44" stroke-width="2"/><line x1="140" y1="170" x2="490" y2="170" stroke="#4a5568" stroke-width="1.5" stroke-dasharray="5 5"/><text x="512" y="276" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">20 m drop</text><text x="600" y="160" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">mass 500 kg</text><text x="600" y="186" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">track 250 m long</text><text x="600" y="212" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">g = 10 N/kg</text><rect x="30" y="420" width="840" height="300" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="60" y="458" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Where the 100 000 J went (bar to scale)</text><rect x="60" y="478" width="780" height="48" rx="4" fill="#8a6d0d" stroke="#1e2a44" stroke-width="2"/><text x="75" y="509" font-size="17" font-weight="700" fill="#fff" text-anchor="start">GPE lost = 500 × 10 × 20 = 100 000 J</text><rect x="60" y="538" width="631.8" height="48" rx="4" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><rect x="691.8" y="538" width="148.2" height="48" rx="4" fill="#f3d5cc" stroke="#b5602e" stroke-width="2"/><text x="75" y="569" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">KE gained = ½ × 500 × 18² = 81 000 J</text><text x="765.9" y="569" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">19 000 J</text><text x="60" y="620" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">work done against friction = 100 000 − 81 000 = 19 000 J  (to the thermal store)</text><text x="60" y="660" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">average friction force = W / d = 19 000 / 250 =</text><text x="540" y="660" font-size="22" font-weight="700" fill="#b5602e" text-anchor="start">76 N</text><text x="60" y="698" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Energy is conserved: none is destroyed.</text>
</svg>