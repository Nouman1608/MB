<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 705" width="900" height="705" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="705" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">When is work done?</text>

<rect x="30" y="110" width="840" height="220" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="148" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">1. Pushing a trolley 15 m with a steady 120 N force</text><line x1="60" y1="275" x2="840" y2="275" stroke="#1e2a44" stroke-width="3"/><rect x="130" y="215" width="110" height="50" rx="6" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.5"/><circle cx="150" cy="268" r="8" fill="#1e2a44" stroke="#1e2a44" stroke-width="1"/><circle cx="220" cy="268" r="8" fill="#1e2a44" stroke="#1e2a44" stroke-width="1"/><line x1="70" y1="240" x2="126" y2="240" stroke="#b5602e" stroke-width="5" marker-end="url(#ahR)"/><text x="70" y="226" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">120 N</text><line x1="250" y1="300" x2="700" y2="300" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><text x="475" y="320" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="middle">moves 15 m in the direction of the force</text><rect x="560" y="175" width="280" height="70" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="700" y="218" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">W = 120 × 15 = 1800 J</text><rect x="30" y="350" width="410" height="300" rx="14" fill="#fbeee6" stroke="#b5602e" stroke-width="2.5"/><text x="54" y="388" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">2. Holding a bag still</text><circle cx="150" cy="462" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><line x1="150" y1="478" x2="150" y2="520" stroke="#1e2a44" stroke-width="4"/><line x1="150" y1="520" x2="136" y2="560" stroke="#1e2a44" stroke-width="4"/><line x1="150" y1="520" x2="164" y2="560" stroke="#1e2a44" stroke-width="4"/><rect x="185" y="470" width="50" height="40" rx="4" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><line x1="150" y1="490" x2="185" y2="490" stroke="#1e2a44" stroke-width="4"/><line x1="260" y1="505" x2="260" y2="445" stroke="#b5602e" stroke-width="4" marker-end="url(#ahR)"/><text x="275" y="480" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">force up</text><text x="330" y="525" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">no movement</text><line x1="50" y1="560" x2="430" y2="560" stroke="#1e2a44" stroke-width="2"/><text x="54" y="590" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The bag does not move, so no work is</text><text x="54" y="612" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">done on it (even though your arm tires).</text><rect x="460" y="350" width="410" height="300" rx="14" fill="#fbeee6" stroke="#b5602e" stroke-width="2.5"/><text x="484" y="388" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">3. Carrying it along a level floor</text><circle cx="560" cy="462" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><line x1="560" y1="478" x2="560" y2="520" stroke="#1e2a44" stroke-width="4"/><line x1="560" y1="520" x2="546" y2="560" stroke="#1e2a44" stroke-width="4"/><line x1="560" y1="520" x2="574" y2="560" stroke="#1e2a44" stroke-width="4"/><rect x="595" y="470" width="50" height="40" rx="4" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><line x1="560" y1="490" x2="595" y2="490" stroke="#1e2a44" stroke-width="4"/><line x1="620" y1="465" x2="620" y2="420" stroke="#b5602e" stroke-width="4" marker-end="url(#ahR)"/><text x="635" y="432" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">force up</text><line x1="670" y1="490" x2="830" y2="490" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><text x="750" y="478" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">motion</text><text x="750" y="520" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">at 90°</text><line x1="470" y1="560" x2="860" y2="560" stroke="#1e2a44" stroke-width="2"/><text x="484" y="590" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Your upward force is at right angles to</text><text x="484" y="612" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the motion: no work on the bag.</text><text x="450" y="680" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Work is done only when a force moves something in the direction of the force.</text>
</svg>