<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 790" width="900" height="790" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="790" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">GPE and KE: falling and rising</text>

<rect x="30" y="110" width="410" height="560" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="235" y="148" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Dropped from 5.0 m</text><line x1="70" y1="520" x2="410" y2="520" stroke="#1e2a44" stroke-width="3"/><circle cx="150" cy="200" r="16" fill="#b5602e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="150" cy="504" r="16" fill="#f0c9b6" stroke="#1e2a44" stroke-width="2.5"/><line x1="150" y1="224" x2="150" y2="480" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)" stroke-dasharray="6 6"/><line x1="90" y1="200" x2="90" y2="520" stroke="#1e2a44" stroke-width="2"/><line x1="80" y1="200" x2="100" y2="200" stroke="#1e2a44" stroke-width="2"/><line x1="80" y1="520" x2="100" y2="520" stroke="#1e2a44" stroke-width="2"/><text x="84" y="360" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">5.0 m</text><text x="180" y="206" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="start">GPE</text><text x="180" y="510" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">KE</text><text x="230" y="250" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">m × g × h = ½ × m × v²</text><text x="230" y="280" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">m cancels:</text><text x="230" y="310" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">g × h = ½ × v²</text><text x="230" y="340" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">10 × 5.0 = 0.5 × v²</text><text x="230" y="370" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">v² = 100</text><rect x="50" y="560" width="370" height="56" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="235" y="596" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">v = √100 = 10 m/s</text><text x="235" y="645" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">g = 10 N/kg; air resistance ignored</text><rect x="460" y="110" width="410" height="560" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="665" y="148" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Thrown up at 8.0 m/s</text><line x1="500" y1="520" x2="840" y2="520" stroke="#1e2a44" stroke-width="3"/><circle cx="580" cy="504" r="16" fill="#f0c9b6" stroke="#1e2a44" stroke-width="2.5"/><circle cx="580" cy="200" r="16" fill="#b5602e" stroke="#1e2a44" stroke-width="2.5"/><line x1="580" y1="480" x2="580" y2="224" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)" stroke-dasharray="6 6"/><line x1="520" y1="200" x2="520" y2="520" stroke="#1e2a44" stroke-width="2"/><line x1="510" y1="200" x2="530" y2="200" stroke="#1e2a44" stroke-width="2"/><line x1="510" y1="520" x2="530" y2="520" stroke="#1e2a44" stroke-width="2"/><text x="514" y="360" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">h ?</text><text x="610" y="510" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">KE</text><text x="610" y="206" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="start">GPE</text><text x="660" y="250" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">½ × v² = g × h</text><text x="660" y="280" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">h = v² / (2 × g)</text><text x="660" y="310" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">  = 8.0² / 20</text><text x="660" y="340" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">  = 64 / 20</text><rect x="480" y="560" width="370" height="56" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="665" y="596" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">h = 3.2 m</text><text x="665" y="645" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">top of the rise: all KE now GPE</text><rect x="30" y="690" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="737" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Loss in GPE = gain in KE. Mass cancels, so all objects dropped from one height match speed.</text>
</svg>