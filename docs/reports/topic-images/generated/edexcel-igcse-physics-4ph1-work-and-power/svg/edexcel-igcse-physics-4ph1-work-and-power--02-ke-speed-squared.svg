<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="640" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Kinetic energy and speed squared</text>

<rect x="30" y="110" width="840" height="400" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="100" y="380" width="150" height="60" rx="4" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="175" y="368" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">1 × KE</text><text x="175" y="470" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">starting point</text><text x="175" y="494" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">mass m, speed v</text><rect x="370" y="320" width="150" height="120" rx="4" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="445" y="308" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">2 × KE</text><text x="445" y="470" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">double the mass</text><text x="445" y="494" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">2m, v</text><rect x="640" y="200" width="150" height="240" rx="4" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="715" y="188" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">4 × KE</text><text x="715" y="470" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">double the speed</text><text x="715" y="494" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">m, 2v</text><line x1="80" y1="440" x2="820" y2="440" stroke="#1e2a44" stroke-width="3"/><text x="450" y="160" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">KE = ½ × m × v²</text><rect x="30" y="530" width="840" height="90" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="570" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Speed is squared: doubling the speed multiplies the KE by four;</text><text x="450" y="598" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">doubling the mass only doubles it.</text>
</svg>