<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="640" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Choosing the right equation</text>

<rect x="30" y="110" width="840" height="46" rx="10" fill="#1e2a44" stroke="#1e2a44" stroke-width="0"/><text x="60" y="140" font-size="17" font-weight="700" fill="#fff" text-anchor="start">The question gives you…</text><text x="600" y="140" font-size="17" font-weight="700" fill="#fff" text-anchor="start">Use</text><rect x="30" y="166" width="840" height="62" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="60" y="204" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">a force and a distance in its direction</text><line x1="520" y1="197" x2="580" y2="197" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="600" y="205" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">W = F × d</text><rect x="30" y="238" width="840" height="62" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="60" y="276" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">a mass and a change in height</text><line x1="520" y1="269" x2="580" y2="269" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="600" y="277" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">GPE = m × g × h</text><rect x="30" y="310" width="840" height="62" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="60" y="348" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">a mass and a speed</text><line x1="520" y1="341" x2="580" y2="341" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="600" y="349" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">KE = ½ × m × v²</text><rect x="30" y="382" width="840" height="62" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="60" y="420" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">energy or work and a time</text><line x1="520" y1="413" x2="580" y2="413" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="600" y="421" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">P = W / t</text><rect x="30" y="454" width="840" height="62" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="60" y="492" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">a fall or rise; find a speed or height</text><line x1="520" y1="485" x2="580" y2="485" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="600" y="493" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">m × g × h = ½ × m × v²</text><rect x="30" y="526" width="840" height="62" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="60" y="564" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">speed lost to braking or friction over a distance</text><line x1="520" y1="557" x2="580" y2="557" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="600" y="565" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">F × d = ½ × m × v²</text><text x="450" y="618" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Work, GPE and KE are in joules (J); power is in watts (W).</text>
</svg>