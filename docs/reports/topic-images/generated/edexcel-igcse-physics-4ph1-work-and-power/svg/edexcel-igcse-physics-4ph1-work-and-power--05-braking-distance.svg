<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 670" width="900" height="670" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="670" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: braking distance</text>

<rect x="30" y="110" width="840" height="270" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="148" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">1000 kg car at 15 m/s, constant braking force 4500 N</text><text x="60" y="190" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">KE = ½ × 1000 × 15² = 112 500 J</text><text x="60" y="224" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">work done by brakes = KE:  F × d = 112 500</text><text x="60" y="258" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">d = 112 500 / 4500</text><rect x="580" y="270" width="260" height="60" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="710" y="309" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">d = 25 m</text><rect x="30" y="400" width="840" height="250" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="60" y="438" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Same force, double the speed: braking distance (bars to scale)</text><text x="60" y="494" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">15 m/s</text><rect x="160" y="470" width="160" height="40" rx="4" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><text x="330" y="497" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">25 m</text><text x="60" y="564" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">30 m/s</text><rect x="160" y="540" width="640" height="40" rx="4" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><text x="790" y="567" font-size="18" font-weight="700" fill="#fff" text-anchor="end">100 m</text><text x="60" y="624" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="start">KE depends on v², so 2 × speed gives 4 × KE and 4 × the distance.</text>
</svg>