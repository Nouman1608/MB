<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Six guiding lines of inquiry</text>

<rect x="30" y="115" width="410" height="96" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><circle cx="74" cy="163" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="74" y="171.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="116" y="169" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Links to the core topics</text><rect x="460" y="115" width="410" height="96" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><circle cx="504" cy="163" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="504" y="171.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="546" y="169" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Links to the thematic studies</text><rect x="30" y="225" width="410" height="96" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><circle cx="74" cy="273" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="74" y="281.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="116" y="267" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">How far challenges are</text><text x="116" y="291" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">interconnected</text><rect x="460" y="225" width="410" height="96" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><circle cx="504" cy="273" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="504" y="281.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="546" y="255" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">How they are perceived and</text><text x="546" y="279" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">addressed in different</text><text x="546" y="303" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">contexts</text><rect x="30" y="335" width="410" height="96" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><circle cx="74" cy="383" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="74" y="391.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="116" y="365" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Frameworks, systems,</text><text x="116" y="389" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">organisations and mechanisms</text><text x="116" y="413" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">that address them</text><rect x="460" y="335" width="410" height="96" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><circle cx="504" cy="383" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="504" y="391.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">6</text><text x="546" y="377" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">How cases from different topic</text><text x="546" y="401" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">areas change the view</text><rect x="30" y="455" width="840" height="52.44" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="486.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Paper 3 question 3 is based on these: prepare evidence for each line from each case.</text>
