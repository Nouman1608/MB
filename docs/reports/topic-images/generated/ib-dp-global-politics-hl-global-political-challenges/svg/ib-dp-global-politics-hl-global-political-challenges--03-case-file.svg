<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 747" width="900" height="747" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="747" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Building a case file</text>

<rect x="30" y="110" width="840" height="116.6" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="84" cy="168.3" r="28" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="84" y="178.38000000000002" font-size="28" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="136" y="149.85" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Background, data and issues</text><text x="136" y="175.57" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">What is happening? Who are the actors and stakeholders? How valid are the data?</text><text x="136" y="198.01" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Key terms? Similar cases?</text><rect x="30" y="240.6" width="840" height="116.6" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="84" cy="298.9" r="28" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="84" y="308.97999999999996" font-size="28" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="136" y="280.45" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Causes, impact and responses</text><text x="136" y="306.17" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Causes? Political, social and economic impacts at different levels? How do actors</text><text x="136" y="328.61" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">respond and interpret it?</text><rect x="30" y="371.2" width="840" height="116.6" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="84" cy="429.5" r="28" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="84" y="439.58" font-size="28" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="136" y="411.05" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Reflection</text><text x="136" y="436.77000000000004" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Which concepts and theories explain it? Wider trends? Why does it matter? Other</text><text x="136" y="459.21000000000004" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">views?</text><rect x="30" y="511.79999999999995" width="410" height="110" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="48" y="560.8499999999999" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Topic area first</text><text x="48" y="587.9699999999999" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">pick an area (e.g. health), then find a case</text><rect x="460" y="511.79999999999995" width="410" height="110" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="478" y="550.3499999999999" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Case first</text><text x="478" y="577.4699999999999" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">start from a situation, then map it onto every</text><text x="478" y="598.5899999999999" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">area it touches</text><rect x="30" y="641.8" width="840" height="74.88" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="672.9499999999999" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Minimum: at least two case studies AND at least two topic areas. Record who produced each</text><text x="450" y="695.39" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">source.</text>
</svg>