<text x="30" y="140" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Marks (28)</text><rect x="30" y="152" width="90" height="56" rx="4" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="75" y="187" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Q1: 3</text><rect x="120" y="152" width="120" height="56" rx="4" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="180" y="187" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Q2a: 4</text><rect x="240" y="152" width="180" height="56" rx="4" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="330" y="187" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Q2b: 6</text><rect x="420" y="152" width="450" height="56" rx="4" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="645" y="187" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Q3: 15</text><text x="30" y="250" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Minutes (90)</text><rect x="30" y="262" width="93.33333333333334" height="56" rx="4" fill="#eaf3f1" stroke="#c9d6d4" stroke-width="2"/><text x="76.66666666666667" y="297" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">10 min</text><rect x="123.33333333333334" y="262" width="121.33333333333334" height="56" rx="4" fill="#eaf3f1" stroke="#c9d6d4" stroke-width="2"/><text x="184" y="297" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">13 min</text><rect x="244.66666666666669" y="262" width="177.33333333333334" height="56" rx="4" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2"/><text x="333.33333333333337" y="297" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">19 min</text><rect x="422" y="262" width="448" height="56" rx="4" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2"/><text x="646" y="297" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">48 min</text><rect x="30" y="345" width="840" height="51.760000000000005" rx="12" fill="#2e6b62"/><text x="42" y="373.2" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">Q</text><text x="132" y="373.2" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">AO</text><text x="222" y="373.2" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">Marks</text><text x="312" y="373.2" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">What it requires</text><rect x="30" y="392.76" width="840" height="42.44" fill="#ffffff"/><text x="42" y="419.21" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Q1</text><text x="132" y="419.21" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">AO2</text><text x="222" y="419.21" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">3</text><text x="312" y="419.21" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">analyse the stimulus with challenge knowledge</text><rect x="30" y="435.2" width="840" height="42.44" fill="#f7f9f9"/><text x="42" y="461.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Q2a</text><text x="132" y="461.65" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">AO2</text><text x="222" y="461.65" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">4</text><text x="312" y="461.65" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">analyse an identified political issue</text><line x1="30" y1="435.2" x2="870" y2="435.2" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="477.64" width="840" height="42.44" fill="#ffffff"/><text x="42" y="504.09" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Q2b</text><text x="132" y="504.09" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">AO3</text><text x="222" y="504.09" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">6</text><text x="312" y="504.09" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">recommend a course of action</text><line x1="30" y1="477.64" x2="870" y2="477.64" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="520.0799999999999" width="840" height="42.44" fill="#f7f9f9"/><text x="42" y="546.53" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Q3</text><text x="132" y="546.53" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">AO3</text><text x="222" y="546.53" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">15</text><text x="312" y="546.53" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">synthesise and evaluate your cases</text><line x1="30" y1="520.0799999999999" x2="870" y2="520.0799999999999" stroke="#c9d6d4" stroke-width="1.5"/><line x1="120" y1="392.76" x2="120" y2="562.52" stroke="#c9d6d4" stroke-width="1.5"/><line x1="210" y1="392.76" x2="210" y2="562.52" stroke="#c9d6d4" stroke-width="1.5"/><line x1="300" y1="392.76" x2="300" y2="562.52" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="345" width="840" height="217.51999999999998" rx="12" fill="none" stroke="#1e2a44" stroke-width="2.2"/><rect x="30" y="582.52" width="840" height="72.24000000000001" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="612.72" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Q3 is 15 of 28 marks, about 16% of the whole HL grade. The stimulus focuses you; the marks come from</text><text x="450" y="633.84" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">your own cases.</text>
