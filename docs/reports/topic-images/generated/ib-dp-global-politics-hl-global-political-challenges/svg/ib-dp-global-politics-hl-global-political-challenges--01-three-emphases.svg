<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 618" width="900" height="618" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="618" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The HL extension: three emphases</text>

<rect x="30" y="130" width="253.33333333333334" height="150" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="156.66666666666669" y="189" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Interconnection</text><text x="156.66666666666669" y="216.12" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">challenges overlap and feed</text><text x="156.66666666666669" y="237.24" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">each other</text><line x1="286.33333333333337" y1="205" x2="318.33333333333337" y2="205" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="323.33333333333337" y="130" width="253.33333333333334" height="150" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="450.00000000000006" y="165" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Complexity and</text><text x="450.00000000000006" y="191.4" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">tension</text><text x="450.00000000000006" y="218.52" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">addressing one challenge can</text><text x="450.00000000000006" y="239.64000000000001" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">create costs or conflicts</text><text x="450.00000000000006" y="260.76" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">elsewhere</text><line x1="579.6666666666667" y1="205" x2="611.6666666666667" y2="205" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="616.6666666666667" y="130" width="253.33333333333334" height="150" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.2"/><text x="743.3333333333334" y="189" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Solutions</text><text x="743.3333333333334" y="216.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">look for possible courses of</text><text x="743.3333333333334" y="237.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">action, not just causes</text><text x="30" y="330" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Three ways to connect with the common syllabus</text><rect x="30" y="345" width="270" height="150" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="48" y="380.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Explicit mention</text><text x="48" y="405.90000000000003" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">identity as a cause of</text><text x="48" y="425.70000000000005" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">conflict; conceptions of</text><text x="48" y="445.50000000000006" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">poverty</text><rect x="315" y="345" width="270" height="150" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="333" y="380.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Expanding a topic</text><text x="333" y="405.90000000000003" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">environmental rights as part of</text><text x="333" y="425.70000000000005" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">human rights</text><rect x="600" y="345" width="270" height="150" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="618" y="380.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Integrating thematic</text><text x="618" y="403.86" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">elements</text><text x="618" y="429.66" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">identity as a right, a marker</text><text x="618" y="449.46000000000004" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">of development and a source of</text><text x="618" y="469.26000000000005" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">conflict</text><rect x="30" y="515" width="840" height="72.24000000000001" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="545.2" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">80 of 240 HL hours, no extra prescribed content: it builds on the key concepts, core and thematic</text><text x="450" y="566.32" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">studies.</text>
</svg>