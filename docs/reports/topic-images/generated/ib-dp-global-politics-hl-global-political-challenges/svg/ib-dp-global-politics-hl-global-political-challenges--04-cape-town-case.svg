<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 798" width="900" height="798" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="798" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Mapping a case: the Cape Town drought</text>

<line x1="450" y1="330" x2="165" y2="180" stroke="#1e2a44" stroke-width="2.5"/><line x1="450" y1="330" x2="735" y2="180" stroke="#1e2a44" stroke-width="2.5"/><line x1="450" y1="330" x2="165" y2="470" stroke="#1e2a44" stroke-width="2.5"/><line x1="450" y1="330" x2="735" y2="470" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="120" width="270" height="120" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="165" y="174.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Environment</text><text x="165" y="200.35000000000002" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">drought, climate variability</text><rect x="600" y="120" width="270" height="120" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="735" y="174.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Security</text><text x="735" y="200.35000000000002" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">water security</text><rect x="30" y="400" width="270" height="140" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="165" y="445.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Equality and poverty</text><text x="165" y="470.85" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">wealthier households bought</text><text x="165" y="490.65000000000003" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">boreholes, tanks, bottled water;</text><text x="165" y="510.45000000000005" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">poorer could not</text><rect x="600" y="400" width="270" height="140" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="735" y="445.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Concepts</text><text x="735" y="470.85" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">legitimacy (trust in crisis),</text><text x="735" y="490.65000000000003" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">power (who controls bulk water),</text><text x="735" y="510.45000000000005" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">interdependence</text><circle cx="450" cy="330" r="110" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="311.57" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Cape Town</text><text x="450" y="336.65" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">drought</text><text x="450" y="361.73" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">2016–2018</text><rect x="30" y="565" width="840" height="110" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.2"/><text x="450" y="602.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">“Day Zero” warning → 50 litres per person per day from February 2018 → demand fell,</text><text x="450" y="625.09" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">rain returned, taps never shut off</text><text x="450" y="652.21" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">open question for evaluation: did the burden fall fairly?</text><rect x="30" y="695" width="840" height="72.24000000000001" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="725.2" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Pair it with a case from another area, such as Ebola in Liberia (2014–2015), to compare crisis</text><text x="450" y="746.32" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">responses.</text>
</svg>