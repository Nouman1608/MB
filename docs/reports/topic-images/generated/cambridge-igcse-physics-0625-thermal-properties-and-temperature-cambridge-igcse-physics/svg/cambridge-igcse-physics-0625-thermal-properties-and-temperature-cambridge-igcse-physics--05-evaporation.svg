<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="540" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Evaporation causes cooling</text>

<rect x="30" y="110" width="840" height="400" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="80" y="300" width="340" height="150" rx="4" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><line x1="80" y1="300" x2="420" y2="300" stroke="#2e6b62" stroke-width="3" stroke-linecap="round"/><circle cx="120" cy="340" r="9" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><line x1="130" y1="340" x2="158" y2="324" stroke="#8a6d0d" stroke-width="2" marker-end="url(#ahO)"/><circle cx="180" cy="380" r="9" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><line x1="190" y1="380" x2="204" y2="372" stroke="#8a6d0d" stroke-width="2" marker-end="url(#ahO)"/><circle cx="240" cy="350" r="9" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><line x1="250" y1="350" x2="264" y2="342" stroke="#8a6d0d" stroke-width="2" marker-end="url(#ahO)"/><circle cx="300" cy="410" r="9" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><line x1="310" y1="410" x2="338" y2="394" stroke="#8a6d0d" stroke-width="2" marker-end="url(#ahO)"/><circle cx="360" cy="360" r="9" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><line x1="370" y1="360" x2="384" y2="352" stroke="#8a6d0d" stroke-width="2" marker-end="url(#ahO)"/><circle cx="150" cy="420" r="9" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><line x1="160" y1="420" x2="174" y2="412" stroke="#8a6d0d" stroke-width="2" marker-end="url(#ahO)"/><circle cx="260" cy="430" r="9" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><line x1="270" y1="430" x2="298" y2="414" stroke="#8a6d0d" stroke-width="2" marker-end="url(#ahO)"/><circle cx="380" cy="425" r="9" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><line x1="390" y1="425" x2="404" y2="417" stroke="#8a6d0d" stroke-width="2" marker-end="url(#ahO)"/><circle cx="210" cy="320" r="9" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><line x1="220" y1="320" x2="234" y2="312" stroke="#8a6d0d" stroke-width="2" marker-end="url(#ahO)"/><circle cx="330" cy="325" r="9" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><line x1="340" y1="325" x2="354" y2="317" stroke="#8a6d0d" stroke-width="2" marker-end="url(#ahO)"/><circle cx="200" cy="255" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><line x1="200" y1="245" x2="208" y2="210" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><circle cx="320" cy="235" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><line x1="320" y1="225" x2="328" y2="190" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><text x="250" y="165" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">most energetic particles escape from the surface</text><text x="250" y="480" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">average KE of those left falls: liquid cools</text><text x="480" y="165" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Faster evaporation (Extended):</text><rect x="480" y="185" width="370" height="50" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="500" y="217" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">higher temperature</text><rect x="480" y="247" width="370" height="50" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="500" y="279" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">larger surface area</text><rect x="480" y="309" width="370" height="50" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="500" y="341" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">air moving over the surface</text><text x="480" y="395" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Cooling an object (Extended): the liquid</text><text x="480" y="418" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">cools, then the warmer object conducts</text><text x="480" y="441" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">energy to it, e.g. sweat on skin.</text>
</svg>