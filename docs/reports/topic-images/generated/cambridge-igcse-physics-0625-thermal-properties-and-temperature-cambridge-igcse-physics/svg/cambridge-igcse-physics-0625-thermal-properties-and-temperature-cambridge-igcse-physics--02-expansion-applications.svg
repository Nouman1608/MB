<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 610" width="900" height="610" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="610" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Allowing for expansion</text>

<rect x="30" y="110" width="410" height="230" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="144" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Gaps in railway tracks</text><rect x="60" y="220" width="160" height="26" rx="0" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.5"/><rect x="236" y="220" width="170" height="26" rx="0" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.5"/><line x1="228" y1="290" x2="228" y2="252" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><text x="228" y="306" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">gap</text><text x="235" y="196" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">rails lengthen on hot days</text><text x="235" y="330" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">without gaps the rails would buckle</text><rect x="460" y="110" width="410" height="230" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="480" y="144" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Bimetallic strip (thermostat)</text><rect x="480" y="180" width="20" height="90" rx="0" fill="#1e2a44" stroke="#1e2a44" stroke-width="1"/><path d="M500,200 Q640,200 760,255" fill="none" stroke="#b5602e" stroke-width="12" stroke-linejoin="round" stroke-linecap="round" /><path d="M500,212 Q635,212 754,266" fill="none" stroke="#2b5a9a" stroke-width="12" stroke-linejoin="round" stroke-linecap="round" /><path d="M500,206 L780,206" fill="none" stroke="#4a5568" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 5"/><text x="790" y="210" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">cold</text><text x="640" y="275" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">hot: bends</text><text x="560" y="305" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">top metal expands more, so the strip</text><text x="560" y="325" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">bends and opens or closes a switch</text><rect x="30" y="355" width="410" height="230" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="389" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Liquid-in-glass thermometer</text><rect x="90" y="470" width="280" height="20" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><circle cx="85" cy="480" r="22" fill="#b5602e" stroke="#1e2a44" stroke-width="2.5"/><rect x="85" y="474" width="170" height="12" rx="4" fill="#b5602e" stroke="#b5602e" stroke-width="1"/><line x1="260" y1="452" x2="320" y2="452" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><text x="235" y="530" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">liquid expands more than the glass</text><text x="235" y="552" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">and rises up the narrow tube</text><rect x="460" y="355" width="410" height="230" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="480" y="389" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Overhead power cables</text><rect x="500" y="420" width="12" height="120" rx="0" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><rect x="818" y="420" width="12" height="120" rx="0" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><path d="M512,425 Q665,505 818,425" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><path d="M512,425 Q665,450 818,425" fill="none" stroke="#4a5568" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 5"/><text x="665" y="522" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">hung slack</text><text x="665" y="565" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">contract on cold days: tight cables could snap</text>
</svg>