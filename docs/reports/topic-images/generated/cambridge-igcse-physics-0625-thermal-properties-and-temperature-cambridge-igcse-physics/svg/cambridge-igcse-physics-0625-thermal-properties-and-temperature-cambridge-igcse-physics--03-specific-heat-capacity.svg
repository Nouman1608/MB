<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 508" width="900" height="508" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="508" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Specific heat capacity: ΔE = m c Δθ</text>

<text x="450" y="100" font-size="18" font-weight="400" fill="#4a5568" text-anchor="middle">c = energy per unit mass per unit temperature increase, J/(kg °C)</text><rect x="30" y="150" width="410" height="218" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="186" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Worked example 1</text><text x="50" y="220" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">0.50 kg of water, 20 °C → 80 °C</text><text x="50" y="252" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">c = 4200 J/(kg °C)</text><text x="50" y="284" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Δθ = 80 − 20 = 60 °C</text><text x="50" y="316" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">ΔE = m c Δθ = 0.50 × 4200 × 60</text><text x="50" y="348" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">= 126 000 J</text><rect x="460" y="150" width="410" height="218" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="480" y="186" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Worked example 2</text><text x="480" y="220" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">2.0 kg metal, c = 450 J/(kg °C)</text><text x="480" y="252" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">receives 18 000 J</text><text x="480" y="284" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Δθ = ΔE / (m c)</text><text x="480" y="316" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">= 18 000 / (2.0 × 450)</text><text x="480" y="348" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">= 20 °C</text><rect x="30" y="388" width="840" height="90" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="425.3" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">Use the temperature change Δθ and mass in kg.</text><text x="450" y="453.3" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">Water (about 4200 J/(kg °C)) needs far more energy per °C than metals.</text>
</svg>