<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="600" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Thermal expansion: gas > liquid > solid</text>

<rect x="30" y="110" width="840" height="260" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="145" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">same temperature rise, constant pressure (sizes illustrative)</text><text x="60" y="195" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">solid</text><rect x="200" y="171" width="300" height="36" rx="6" fill="#c9d6d4" stroke="#1e2a44" stroke-width="2"/><rect x="200" y="171" width="308" height="36" rx="6" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2"/><rect x="200" y="171" width="300" height="36" rx="6" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-dasharray="6 4"/><text x="526" y="196" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">least</text><text x="60" y="255" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">liquid</text><rect x="200" y="231" width="300" height="36" rx="6" fill="#c9d6d4" stroke="#1e2a44" stroke-width="2"/><rect x="200" y="231" width="340" height="36" rx="6" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><rect x="200" y="231" width="300" height="36" rx="6" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-dasharray="6 4"/><text x="558" y="256" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">more</text><text x="60" y="315" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">gas</text><rect x="200" y="291" width="300" height="36" rx="6" fill="#c9d6d4" stroke="#1e2a44" stroke-width="2"/><rect x="200" y="291" width="450" height="36" rx="6" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><rect x="200" y="291" width="300" height="36" rx="6" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-dasharray="6 4"/><text x="668" y="316" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">most</text><rect x="30" y="385" width="148.8" height="30" rx="15" fill="#8a6d0d"/><text x="42" y="406" font-size="16" font-weight="700" fill="#ffffff" text-anchor="start">Extended only</text><rect x="30" y="425" width="840" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="465" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Solid: strong forces hold particles in fixed positions; they vibrate further apart only slightly.</text><text x="60" y="499" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Liquid: particles close but forces weaker, so they move apart more easily.</text><text x="60" y="533" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Gas: particles far apart, very weak forces; they push the walls or a piston out much more.</text>
</svg>