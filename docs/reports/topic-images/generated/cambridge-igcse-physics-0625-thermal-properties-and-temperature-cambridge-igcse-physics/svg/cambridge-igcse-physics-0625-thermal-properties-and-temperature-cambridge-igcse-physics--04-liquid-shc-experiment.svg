<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="640" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Measuring the specific heat capacity of water</text>

<rect x="30" y="72" width="148.8" height="30" rx="15" fill="#8a6d0d"/><text x="42" y="93" font-size="16" font-weight="700" fill="#ffffff" text-anchor="start">Extended only</text><rect x="30" y="110" width="545" height="400" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M110,260 L130,470 L290,470 L310,260" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><path d="M118,300 L132,465 L288,465 L302,300 Z" fill="#b5d3cf"/><rect x="100" y="248" width="220" height="14" rx="4" fill="#efdfa8" stroke="#1e2a44" stroke-width="2"/><text x="210" y="244" font-size="14" font-weight="400" fill="#4a5568" text-anchor="middle">lid</text><rect x="160" y="200" width="16" height="240" rx="4" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><text x="150" y="196" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="end">heater</text><rect x="240" y="180" width="10" height="250" rx="5" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><circle cx="245" cy="432" r="9" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><rect x="242" y="330" width="6" height="100" rx="0" fill="#b5602e" stroke="#b5602e" stroke-width="1"/><text x="260" y="190" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">thermometer</text><rect x="400" y="220" width="150" height="80" rx="8" fill="#1e2a44" stroke="#1e2a44" stroke-width="2"/><text x="475" y="268" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">12 600 J</text><text x="475" y="320" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">joulemeter</text><path d="M168,200 L168,160 L475,160 L475,220" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="330" y="400" width="170" height="60" rx="6" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="415" y="437" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">balance</text><text x="415" y="490" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">mass of water = 0.40 kg</text><rect x="590" y="140" width="280" height="238" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="610" y="176" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Sample results</text><text x="610" y="210" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">ΔE = 12 600 J</text><text x="610" y="240" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">m = 0.40 kg</text><text x="610" y="270" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Δθ = 7.2 °C</text><text x="610" y="300" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">c = 12 600 / (0.40 × 7.2)</text><text x="610" y="330" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">= 4375 J/(kg °C)</text><text x="610" y="360" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">≈ 4400 J/(kg °C)</text><rect x="30" y="525" width="840" height="90" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="562.6" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Stir; record the highest temperature after switching off. The value is above 4200 J/(kg °C)</text><text x="450" y="588.6" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">because some energy heated the beaker and surroundings: use a lid and insulation.</text>
</svg>