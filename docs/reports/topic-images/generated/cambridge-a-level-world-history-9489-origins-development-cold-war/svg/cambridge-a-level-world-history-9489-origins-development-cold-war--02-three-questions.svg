<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 710" width="900" height="710" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="710" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three questions behind every interpretation</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Locate an extract on each before naming its school</text>
<circle cx="52" cy="146" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="52" y="153.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="90" y="154" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Inherent tensions?</text><rect x="90" y="186" width="770" height="20" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="90" y="236" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">Bound to resurface</text><text x="860" y="236" font-size="16" font-weight="700" fill="#b5602e" text-anchor="end">Real co-operation broke down</text><text x="90" y="258" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Allied intervention in the Russian Civil War,</text><text x="90" y="278" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">non-recognition to 1933, Nazi-Soviet Pact, the late</text><text x="90" y="298" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">second front</text><text x="860" y="258" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">Lend-Lease, Tehran (1943), Yalta (February 1945)</text><circle cx="52" cy="316" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="52" y="323.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="90" y="324" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Personalities?</text><rect x="90" y="356" width="770" height="20" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="90" y="406" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">Leaders decisive</text><text x="860" y="406" font-size="16" font-weight="700" fill="#b5602e" text-anchor="end">Leaders secondary</text><text x="90" y="428" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Roosevelt's personal diplomacy against Truman's</text><text x="90" y="448" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">bluntness; Stalin's suspicion</text><text x="860" y="428" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">Different leaders would have changed little</text><circle cx="52" cy="498" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="52" y="505.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="90" y="506" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Ideology, security or economics: which does it weight?</text><rect x="30" y="542" width="270.6666666666667" height="136" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="45" y="591.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Ideology</text><text x="45" y="619" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Marxism-Leninism against</text><text x="45" y="639" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">American liberal universalism</text><rect x="314.6666666666667" y="542" width="270.6666666666667" height="136" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="329.6666666666667" y="571.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Security</text><text x="329.6666666666667" y="599" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">USSR: about 27 million dead,</text><text x="329.6666666666667" y="619" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">friendly western border; USA: no</text><text x="329.6666666666667" y="639" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">hostile power over Europe's</text><text x="329.6666666666667" y="659" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">industry</text><rect x="599.3333333333334" y="542" width="270.6666666666667" height="136" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="614.3333333333334" y="581.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Economics</text><text x="614.3333333333334" y="609" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Bretton Woods (1944);</text><text x="614.3333333333334" y="629" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Lend-Lease ended (1945);</text><text x="614.3333333333334" y="649" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Marshall Plan (1947)</text>
</svg>