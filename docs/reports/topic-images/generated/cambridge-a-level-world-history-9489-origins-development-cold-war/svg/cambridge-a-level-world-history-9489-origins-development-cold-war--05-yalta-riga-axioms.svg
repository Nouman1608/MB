<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 445" width="900" height="445" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="445" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Yergin's two views of the USSR</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Shattered Peace (1977): Truman's administration moved from one to the other</text>
<rect x="30" y="124" width="385" height="114" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="222.5" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">YALTA AXIOMS</text><text x="222.5" y="183.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">A traditional great power</text><text x="222.5" y="213.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">Deals with it were possible</text><line x1="421" y1="181" x2="479" y2="181" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="485" y="124" width="385" height="114" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="677.5" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">RIGA AXIOMS</text><text x="677.5" y="183.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">A revolutionary state</text><text x="677.5" y="213.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">Ideologically driven</text><rect x="30" y="260" width="411" height="153" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="292" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">GADDIS (1972)</text><text x="50" y="318.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Domestic constraint</text><text x="50" y="346.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Public opinion constrained US policy-makers;</text><text x="50" y="367.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Stalin, unconstrained at home, had more</text><text x="50" y="388.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">freedom to choose</text><rect x="459" y="260" width="411" height="153" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="479" y="302.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">LEFFLER (1992)</text><text x="479" y="328.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">A preponderance of power</text><text x="479" y="357.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A broad definition of US security intensified the</text><text x="479" y="378.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">conflict</text>
</svg>