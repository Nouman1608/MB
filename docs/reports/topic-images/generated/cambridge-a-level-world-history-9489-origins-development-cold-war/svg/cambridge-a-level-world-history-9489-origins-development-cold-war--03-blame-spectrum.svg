<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Who was to blame? A spectrum of views</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Where each school and historian sits</text>
<text x="40" y="140" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">THE USSR TO BLAME</text><text x="860" y="140" font-size="17" font-weight="700" fill="#b5602e" text-anchor="end">THE USA TO BLAME</text><defs><linearGradient id="sg124" x1="0" x2="1"><stop offset="0" stop-color="#b5d3cf"/><stop offset="1" stop-color="#f2e7b8"/></linearGradient></defs><rect x="60" y="169" width="780" height="26" rx="13" fill="url(#sg124)" stroke="#1e2a44" stroke-width="2.5"/><path d="M99,195 L99,218 L110,232 L110,252" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="99" cy="182" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><path d="M450,195 L450,218 L280,232 L280,252" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="450" cy="182" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><path d="M621.6,195 L621.6,218 L450,232 L450,252" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="621.6" cy="182" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><path d="M723,195 L723,218 L620,232 L620,252" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="723" cy="182" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><path d="M816.6,195 L816.6,218 L790,232 L790,252" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="816.6" cy="182" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><rect x="30" y="252" width="160" height="130" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="110" y="277.7" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Traditionalists</text><text x="110" y="304" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Feis; Schlesinger</text><text x="110" y="324" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">(1967); Gaddis's</text><text x="110" y="344" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">We Now Know</text><text x="110" y="364" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">(1997)</text><rect x="200" y="252" width="160" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="280" y="287.7" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Post-revisionists</text><text x="280" y="314" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Gaddis (1972),</text><text x="280" y="334" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Yergin, Leffler:</text><text x="280" y="354" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">both or neither</text><rect x="370" y="252" width="160" height="130" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="287.7" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Roberts (2006)</text><text x="450" y="314" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Stalin hoped for</text><text x="450" y="334" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">continued</text><text x="450" y="354" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">co-operation</text><rect x="540" y="252" width="160" height="130" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="620" y="297.7" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Revisionists</text><text x="620" y="324" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Williams,</text><text x="620" y="344" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Alperovitz, Kolko</text><rect x="710" y="252" width="160" height="130" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="790" y="277.7" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Soviet line</text><text x="790" y="304" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Western</text><text x="790" y="324" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">imperialism,</text><text x="790" y="344" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">atomic diplomacy,</text><text x="790" y="364" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Fulton</text><rect x="30" y="404" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="438.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Positions, not labels</text><text x="50" y="468.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Paper 3 rewards explaining an extract's interpretation and approach; naming the school earns little</text><text x="50" y="490.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">on its own.</text>
</svg>