<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four exercises, 30 marks</text>

<rect x="30" y="110" width="840" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="70" cy="156" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="70" y="163.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="108" y="148" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Short answer questions</text><text x="108" y="176" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">short texts: announcement, phone message, brief dialogue</text><rect x="600" y="136" width="160" height="40" rx="6" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="680" y="162" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">8 marks</text><text x="850" y="162" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="end">L1, L2</text><rect x="30" y="214" width="840" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="70" cy="260" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="70" y="267.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="108" y="252" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Gap-fill sentences</text><text x="108" y="280" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">one longer text: conversation, interview, monologue, talk</text><rect x="600" y="240" width="160" height="40" rx="6" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="680" y="266" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">8 marks</text><text x="850" y="266" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="end">L1, L2</text><rect x="30" y="318" width="840" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="70" cy="364" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="70" y="371.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="108" y="356" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Multiple matching</text><text x="108" y="384" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">six short extracts: match each speaker to content</text><rect x="600" y="344" width="120" height="40" rx="6" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="660" y="370" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">6 marks</text><text x="850" y="370" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="end">L3, L4</text><rect x="30" y="422" width="840" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="70" cy="468" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="70" y="475.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="108" y="460" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Multiple-choice questions</text><text x="108" y="488" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">a discussion between two speakers</text><rect x="600" y="448" width="160" height="40" rx="6" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="680" y="474" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">8 marks</text><text x="850" y="474" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="end">L1-L4</text><text x="450" y="548" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Total 30 marks. Questions and answers in Urdu; no dictionaries.</text>
