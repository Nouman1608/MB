<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Which exercise tests which objective</text>

<text x="485" y="136" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Ex. 1</text><text x="595" y="136" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Ex. 2</text><text x="705" y="136" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Ex. 3</text><text x="815" y="136" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Ex. 4</text><rect x="30" y="152" width="840" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="188" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">L1</text><text x="100" y="186" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">identify and select relevant</text><text x="100" y="205" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">information</text><circle cx="485" cy="194" r="18" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="595" cy="194" r="18" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="705" cy="194" r="6" fill="#c9d6d4"/><circle cx="815" cy="194" r="18" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="248" width="840" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="284" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">L2</text><text x="100" y="282" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">understand ideas, opinions and</text><text x="100" y="301" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">attitudes</text><circle cx="485" cy="290" r="18" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="595" cy="290" r="18" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="705" cy="290" r="6" fill="#c9d6d4"/><circle cx="815" cy="290" r="18" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="344" width="840" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="380" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">L3</text><text x="100" y="378" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">connections between ideas, opinions,</text><text x="100" y="397" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">attitudes</text><circle cx="485" cy="386" r="6" fill="#c9d6d4"/><circle cx="595" cy="386" r="6" fill="#c9d6d4"/><circle cx="705" cy="386" r="18" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="815" cy="386" r="18" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="440" width="840" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="476" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">L4</text><text x="100" y="474" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">what is implied: gist, purpose,</text><text x="100" y="493" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">intention, feelings</text><circle cx="485" cy="482" r="6" fill="#c9d6d4"/><circle cx="595" cy="482" r="6" fill="#c9d6d4"/><circle cx="705" cy="482" r="18" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="815" cy="482" r="18" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="548" width="840" height="70" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="54" y="591" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">Only Exercise 4 tests all four objectives; Exercise 3 tests only L3 and L4.</text>
</svg>