<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 498" width="900" height="498" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="498" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Use each hearing for a different job</text>

<rect x="30" y="110" width="400" height="236" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="144" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">HEARING 1</text><text x="50" y="173" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">First hearing</text><text x="50" y="202.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Get the overall gist.</text><text x="50" y="235.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Locate roughly where each answer sits.</text><text x="50" y="268.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Take notes; do not write final answers</text><text x="50" y="291.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">yet.</text><line x1="436" y1="228" x2="464" y2="228" stroke="#1e2a44" stroke-width="5" marker-end="url(#ah)"/><rect x="470" y="110" width="400" height="236" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="490" y="144" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">HEARING 2</text><text x="490" y="173" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Second hearing</text><text x="490" y="202.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Fill in precise details.</text><text x="490" y="235.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Check what you noted.</text><text x="490" y="268.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Confirm, then write the answer.</text><rect x="30" y="366" width="840" height="104" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="402" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Speaking practice helps listening too</text><text x="54" y="432" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Component 5 skills, such as recognising register and following a conversation's turns,</text><text x="54" y="454" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">overlap closely with what Paper 2 tests.</text>
</svg>