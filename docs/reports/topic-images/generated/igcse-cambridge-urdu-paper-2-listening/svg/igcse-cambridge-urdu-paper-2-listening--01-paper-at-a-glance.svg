<rect width="900" height="548" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Paper 2 Listening at a glance</text>

<rect x="30" y="110" width="195" height="124" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="127.5" y="154" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">33%</text><text x="127.5" y="184" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">of the</text><text x="127.5" y="205" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">qualification</text><rect x="245" y="110" width="195" height="124" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="342.5" y="154" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">35-45 min</text><text x="342.5" y="184" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">approximately</text><rect x="460" y="110" width="195" height="124" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="557.5" y="154" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">30 marks</text><text x="557.5" y="184" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">four exercises</text><rect x="675" y="110" width="195" height="124" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="772.5" y="154" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">Heard twice</text><text x="772.5" y="184" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">pauses to read and</text><text x="772.5" y="205" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">write</text><text x="450" y="284" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Fewer marks than Paper 1, but a third of the grade</text><rect x="60" y="304" width="522.6" height="80" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><text x="321.3" y="340" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Paper 1: 60 marks</text><text x="321.3" y="366" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">67%, 2 hours</text><rect x="582.6" y="304" width="257.40000000000003" height="80" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="711.3" y="340" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Paper 2: 30 marks</text><text x="711.3" y="366" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">33%</text><rect x="30" y="410" width="840" height="110" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="54" y="446" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Do not under-prepare: listening needs its own practice</text><text x="54" y="476" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Exam audio is released only to centres, so practise with Urdu news broadcasts,</text><text x="54" y="500" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">interviews and radio dialogues of a similar style and register.</text>
</svg>