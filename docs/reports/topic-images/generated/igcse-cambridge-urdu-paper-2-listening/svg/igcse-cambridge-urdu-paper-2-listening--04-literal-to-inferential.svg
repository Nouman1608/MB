<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 492" width="900" height="492" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="492" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">From literal to inferential listening</text>

<line x1="70" y1="140" x2="830" y2="140" stroke="#2e6b62" stroke-width="6" marker-end="url(#ahT)"/><text x="70" y="124" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">stated facts</text><text x="830" y="124" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="end">implied meaning</text><circle cx="164" cy="140" r="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><line x1="164" y1="154" x2="164" y2="180" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="184" width="268" height="280" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="218" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">Ex. 1-2</text><text x="50" y="247" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Catch the fact</text><text x="50" y="275.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">• a time, a place, a name,</text><text x="50" y="297.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">a reason</text><text x="50" y="329.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">• over-prepare numbers,</text><text x="50" y="351.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">times, dates and place</text><text x="50" y="373.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">names</text><text x="50" y="405.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">• take notes while</text><text x="50" y="427.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">listening</text><circle cx="450" cy="140" r="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><line x1="450" y1="154" x2="450" y2="180" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="316" y="184" width="268" height="280" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="336" y="218" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">Ex. 3</text><text x="336" y="247" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Tell views apart</text><text x="336" y="275.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">• several speakers, a</text><text x="336" y="297.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">similar topic</text><text x="336" y="329.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">• listen for tone and</text><text x="336" y="351.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">opinion words, not topic</text><text x="336" y="373.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">keywords</text><circle cx="736" cy="140" r="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><line x1="736" y1="154" x2="736" y2="180" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="602" y="184" width="268" height="280" rx="14" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><text x="622" y="218" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">Ex. 4</text><text x="622" y="247" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Infer</text><text x="622" y="275.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">• sarcasm, hesitation, a</text><text x="622" y="297.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">change of mind</text><text x="622" y="329.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">• an opinion that shifts</text><text x="622" y="351.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">partway through a turn</text>
</svg>