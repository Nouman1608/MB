<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 630" width="900" height="630" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="630" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Then, now and next year</text>

<line x1="70" y1="140" x2="70" y2="560" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><circle cx="70" cy="184" r="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><rect x="110" y="120" width="760" height="128" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="134" y="160" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Before</text><text x="846" y="196" font-family="Noto Nastaliq Urdu" font-size="28" font-weight="400" fill="#1e2a44" text-anchor="end">‏پہلے مجھے ریاضی مشکل لگتی تھی،‏</text><text x="846" y="232" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">Maths used to seem hard to me,</text><circle cx="70" cy="330" r="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><rect x="110" y="266" width="760" height="128" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="134" y="306" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Now</text><text x="846" y="342" font-family="Noto Nastaliq Urdu" font-size="28" font-weight="400" fill="#1e2a44" text-anchor="end">‏لیکن اب یہ آسان لگتی ہے۔‏</text><text x="846" y="378" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">but now it seems easy.</text><circle cx="70" cy="476" r="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><rect x="110" y="412" width="760" height="128" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="134" y="452" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Next year</text><text x="846" y="488" font-family="Noto Nastaliq Urdu" font-size="28" font-weight="400" fill="#1e2a44" text-anchor="end">‏اگلے سال میں حیاتیات پڑھوں گا۔‏</text><text x="846" y="524" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">Next year I will study biology.</text><text x="450" y="600" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">One sentence on a change of view, or on next year, adds a second time frame</text>
</svg>