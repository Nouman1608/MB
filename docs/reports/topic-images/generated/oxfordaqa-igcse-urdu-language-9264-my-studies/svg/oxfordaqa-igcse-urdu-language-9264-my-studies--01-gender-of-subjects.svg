<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 776" width="900" height="776" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="776" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Agreement with school subjects</text>

<rect x="30" y="110" width="840" height="136" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="148" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Masculine noun</text><text x="52" y="174" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">subject</text><text x="150" y="222" font-family="Noto Nastaliq Urdu" font-size="28" font-weight="400" fill="#2e6b62" text-anchor="middle">‏مضمون‏</text><text x="846" y="180" font-family="Noto Nastaliq Urdu" font-size="27" font-weight="400" fill="#1e2a44" text-anchor="end">‏یہ مضمون اچھا لگتا ہے‏</text><text x="846" y="222" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">This subject seems good.</text><rect x="30" y="260" width="840" height="136" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="52" y="298" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Feminine subjects</text><text x="52" y="324" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">maths, science, history, English, Urdu</text><text x="150" y="372" font-family="Noto Nastaliq Urdu" font-size="28" font-weight="400" fill="#2e6b62" text-anchor="middle">‏ریاضی‏</text><text x="846" y="330" font-family="Noto Nastaliq Urdu" font-size="27" font-weight="400" fill="#1e2a44" text-anchor="end">‏مجھے ریاضی اچھی لگتی ہے‏</text><text x="846" y="372" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">I like maths.</text><rect x="30" y="410" width="840" height="136" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="52" y="448" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Plural thing liked</text><text x="52" y="474" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">science experiments</text><text x="150" y="522" font-family="Noto Nastaliq Urdu" font-size="28" font-weight="400" fill="#2e6b62" text-anchor="middle">‏تجربات‏</text><text x="846" y="480" font-family="Noto Nastaliq Urdu" font-size="27" font-weight="400" fill="#1e2a44" text-anchor="end">‏مجھے سائنس کے تجربات پسند ہیں۔‏</text><text x="846" y="522" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">I like science experiments.</text><rect x="30" y="566" width="840" height="66" rx="12" fill="#f6ece4" stroke="#b5602e" stroke-width="2.5"/><circle cx="66" cy="599" r="15" fill="#f6ece4" stroke="#b5602e" stroke-width="2.5"/><path d="M60,593 l12,12 m0,-12 l-12,12" fill="none" stroke="#b5602e" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><text x="320" y="608" font-family="Noto Nastaliq Urdu" font-size="25" font-weight="400" fill="#b5602e" text-anchor="middle">‏مجھے ریاضی اچھا لگتا ہے‏</text><text x="470" y="604" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">maths is feminine, so the feminine form</text><rect x="30" y="646" width="840" height="104" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="690" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Singular and plural</text><text x="560" y="700" font-family="Noto Nastaliq Urdu" font-size="26" font-weight="400" fill="#1e2a44" text-anchor="middle">‏مضمون‏</text><text x="560" y="736" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">one subject</text><text x="760" y="700" font-family="Noto Nastaliq Urdu" font-size="26" font-weight="400" fill="#1e2a44" text-anchor="middle">‏مضامین‏</text><text x="760" y="736" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">subjects</text>
</svg>