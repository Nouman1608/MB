<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 706" width="900" height="706" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="706" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How an opinion changed</text>

<text x="450" y="128" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">How has the writer’s opinion of maths changed, and why? [3]</text><rect x="30" y="150" width="840" height="118" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="184" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Old view</text><text x="160" y="184" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="start">[1]</text><text x="846" y="228" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="end">‏مجھے ریاضی ہمیشہ مشکل لگتی تھی،‏</text><text x="846" y="256" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">always used to find maths difficult</text><rect x="30" y="282" width="840" height="118" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="52" y="316" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Reason</text><text x="160" y="316" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="start">[1]</text><text x="846" y="360" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="end">‏لیکن اس سال ہمارے نئے استاد ہر سبق کو آسان مثالوں سے سمجھاتے ہیں۔‏</text><text x="846" y="388" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">the new teacher explains every lesson with easy examples</text><rect x="30" y="414" width="840" height="118" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="52" y="448" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">New view</text><text x="160" y="448" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="start">[1]</text><text x="846" y="492" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="end">‏اب مجھے ریاضی سب سے زیادہ پسند ہے۔‏</text><text x="846" y="520" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">now the subject they like most</text><rect x="30" y="556" width="840" height="124" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="590" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Time markers show the change</text><text x="400" y="638" font-family="Noto Nastaliq Urdu" font-size="25" font-weight="400" fill="#2e6b62" text-anchor="middle">‏لگتی تھی‏</text><text x="400" y="668" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">used to seem</text><text x="560" y="638" font-family="Noto Nastaliq Urdu" font-size="25" font-weight="400" fill="#2e6b62" text-anchor="middle">‏لیکن‏</text><text x="560" y="668" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">but</text><text x="720" y="638" font-family="Noto Nastaliq Urdu" font-size="25" font-weight="400" fill="#2e6b62" text-anchor="middle">‏اب‏</text><text x="720" y="668" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">now</text>
</svg>