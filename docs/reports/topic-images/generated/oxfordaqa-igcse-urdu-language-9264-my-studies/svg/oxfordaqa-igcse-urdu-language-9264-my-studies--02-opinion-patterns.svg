<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 770" width="900" height="770" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="770" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Two ways to say you like a subject</text>

<rect x="30" y="110" width="410" height="190" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="52" y="146" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Pattern 1: to me + like</text><text x="418" y="224" font-family="Noto Nastaliq Urdu" font-size="30" font-weight="400" fill="#1e2a44" text-anchor="end">‏مجھے ریاضی پسند ہے۔‏</text><text x="418" y="272" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">I like maths.</text><rect x="460" y="110" width="410" height="190" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="482" y="146" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Pattern 2: I + like + do</text><text x="848" y="224" font-family="Noto Nastaliq Urdu" font-size="30" font-weight="400" fill="#1e2a44" text-anchor="end">‏میں ریاضی پسند کرتا ہوں‏</text><text x="848" y="272" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">I like maths.</text><rect x="30" y="316" width="840" height="74" rx="12" fill="#f6ece4" stroke="#b5602e" stroke-width="2.5"/><circle cx="66" cy="353" r="15" fill="#f6ece4" stroke="#b5602e" stroke-width="2.5"/><path d="M60,347 l12,12 m0,-12 l-12,12" fill="none" stroke="#b5602e" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><text x="260" y="362" font-family="Noto Nastaliq Urdu" font-size="26" font-weight="400" fill="#b5602e" text-anchor="middle">‏میں ریاضی پسند ہے‏</text><text x="380" y="358" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start">mixes the two patterns</text><text x="54" y="432" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Vary it with the same structure</text><rect x="30" y="448" width="840" height="140" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="486" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">With seem / find</text><text x="320" y="490" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#2e6b62" text-anchor="middle">‏لگنا‏</text><text x="846" y="536" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="end">‏مجھے تاریخ دلچسپ لگتی ہے۔‏</text><text x="846" y="572" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">I find history interesting.</text><rect x="30" y="600" width="840" height="140" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="52" y="638" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Always add a reason</text><text x="320" y="642" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#8a6d0d" text-anchor="middle">‏کیونکہ‏</text><text x="846" y="688" font-family="Noto Nastaliq Urdu" font-size="23" font-weight="400" fill="#1e2a44" text-anchor="end">‏مجھے جغرافیہ زیادہ پسند نہیں کیونکہ اس میں بہت سے نقشے یاد کرنے پڑتے ہیں۔‏</text><text x="846" y="724" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">I don’t much like geography because you have to memorise a lot of maps.</text>
</svg>