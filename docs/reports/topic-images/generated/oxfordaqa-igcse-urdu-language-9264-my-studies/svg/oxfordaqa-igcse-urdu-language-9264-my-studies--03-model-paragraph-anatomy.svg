<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What the model paragraph does</text>

<text x="450" y="128" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Task: favourite and least favourite subjects with reasons, and a comparison</text><rect x="30" y="150" width="840" height="86" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="64" cy="193" r="19" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="64" y="199.84" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="96" y="200" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Favourite + reason</text><text x="846" y="206" font-family="Noto Nastaliq Urdu" font-size="25" font-weight="400" fill="#1e2a44" text-anchor="end">‏میرا پسندیدہ مضمون ... ہے کیونکہ ...‏</text><rect x="30" y="250" width="840" height="86" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="64" cy="293" r="19" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="64" y="299.84" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="96" y="300" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Timetable fact</text><text x="846" y="306" font-family="Noto Nastaliq Urdu" font-size="25" font-weight="400" fill="#1e2a44" text-anchor="end">‏ہر ہفتے ... چار پیریڈ ہوتے ہیں‏</text><rect x="30" y="350" width="840" height="86" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="64" cy="393" r="19" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="64" y="399.84" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="96" y="400" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Contrast + dislike</text><text x="846" y="406" font-family="Noto Nastaliq Urdu" font-size="25" font-weight="400" fill="#1e2a44" text-anchor="end">‏اس کے برعکس ... پسند نہیں کیونکہ ...‏</text><rect x="30" y="450" width="840" height="86" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="64" cy="493" r="19" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="64" y="499.84" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="96" y="500" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Superlative + concession</text><text x="846" y="506" font-family="Noto Nastaliq Urdu" font-size="25" font-weight="400" fill="#1e2a44" text-anchor="end">‏سب سے مفید ... اگرچہ یہ مشکل ہے‏</text><rect x="30" y="560" width="840" height="84" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="54" y="594" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Connectives beyond because:</text><text x="420" y="600" font-family="Noto Nastaliq Urdu" font-size="25" font-weight="400" fill="#8a6d0d" text-anchor="middle">‏اس کے برعکس‏</text><text x="420" y="630" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">by contrast</text><text x="640" y="600" font-family="Noto Nastaliq Urdu" font-size="25" font-weight="400" fill="#8a6d0d" text-anchor="middle">‏اگرچہ‏</text><text x="640" y="630" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">although</text>
</svg>