<rect width="900" height="622" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How an export processing zone works</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">schematic, not to scale</text>
<rect x="30" y="112" width="840" height="300" rx="14" fill="#e6eef0"/><rect x="30" y="112" width="150" height="300" rx="14" fill="#b5d3cf"/><rect x="160" y="112" width="20" height="300" fill="#b5d3cf"/><text x="105" y="152" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">OVERSEAS</text><text x="105" y="176" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="middle">suppliers</text><text x="105" y="196" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="middle">and buyers</text><rect x="350" y="152" width="360" height="220" rx="6" fill="#ffffff" stroke="#1e2a44" stroke-width="3" stroke-dasharray="4 6"/><text x="530" y="142" font-size="16" font-weight="700" fill="#4a5568" text-anchor="middle">secure, fenced site</text><path d="M375,262 L375,212 L405,192 L405,212 L435,192 L435,212 L460,212 L460,262 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><path d="M488,262 L488,212 L518,192 L518,212 L548,192 L548,212 L573,212 L573,262 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><path d="M601,262 L601,212 L631,192 L631,212 L661,192 L661,212 L686,212 L686,262 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><text x="530" y="302" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">factories producing mainly for export</text><text x="530" y="326" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">good infrastructure: power, roads, water</text><line x1="190" y1="222" x2="342" y2="222" stroke="#2e6b62" stroke-width="5" marker-end="url(#ahT)"/><text x="195" y="204" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">duty-free imports</text><text x="195" y="254" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="start">raw materials</text><text x="195" y="272" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="start">and machinery</text><path d="M720,262 L800,262 L800,392 L190,392" fill="none" stroke="#8a6d0d" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahO)"/><text x="812" y="252" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="end">exports</text><rect x="30" y="432" width="410" height="160" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="465" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Why build EPZs?</text><text x="48" y="494.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="494.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Attract foreign investment</text><text x="48" y="519.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="519.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Earn foreign exchange</text><text x="48" y="544.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="544.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Create jobs</text><text x="48" y="569.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="569.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Bring in new technology</text><rect x="460" y="432" width="410" height="160" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="478" y="465" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Examples</text><text x="478" y="494.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="494" y="494.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">EPZs: Karachi (best known), Sialkot, Gwadar</text><text x="478" y="519.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="494" y="519.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Industrial estates: SITE in Karachi, Hattar in</text><text x="494" y="541.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Khyber Pakhtunkhwa</text>
