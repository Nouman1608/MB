<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 636" width="900" height="636" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="636" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Formal and informal sectors</text>

<rect x="30" y="112" width="410" height="185" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="146.7" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Formal sector</text><text x="48" y="171.75" font-size="15" font-weight="600" fill="#4a5568" text-anchor="start">registered with government</text><text x="48" y="199.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="199.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Pays taxes and keeps accounts</text><text x="48" y="224.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="224.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Regular wages</text><text x="48" y="249.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="249.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Often some protection for workers</text><rect x="460" y="112" width="410" height="185" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="478" y="146.7" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Informal sector</text><text x="478" y="171.75" font-size="15" font-weight="600" fill="#4a5568" text-anchor="start">unregistered</text><text x="478" y="199.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="494" y="199.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Street vendors</text><text x="478" y="224.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="494" y="224.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Roadside mechanics</text><text x="478" y="249.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="494" y="249.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Small workshops</text><text x="478" y="274.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="494" y="274.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Domestic workers</text><rect x="30" y="313" width="410" height="185" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="346" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Informal: advantages</text><text x="48" y="375.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="375.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Cheap services</text><text x="48" y="400.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="400.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Many jobs for people without qualifications</text><text x="48" y="425.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="425.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Needs little capital</text><text x="48" y="450.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="450.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Recycles materials</text><rect x="460" y="313" width="410" height="185" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="478" y="346" font-size="20" font-weight="700" fill="#b5602e" text-anchor="start">Informal: disadvantages</text><text x="478" y="375.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="494" y="375.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Low and irregular pay</text><text x="478" y="400.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="494" y="400.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">No job security</text><text x="478" y="425.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="494" y="425.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Poor working conditions</text><text x="478" y="450.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="494" y="450.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Use of child labour</text><text x="478" y="475.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="494" y="475.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Lost tax revenue</text><text x="450" y="528" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Both sectors matter: cotton garments and sports goods often pass through both</text><rect x="30" y="546" width="260" height="60" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="160" y="582" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Small informal workshops</text><line x1="294" y1="576" x2="316" y2="576" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="320" y="546" width="260" height="60" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="582" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Formal-sector exporters</text><line x1="584" y1="576" x2="606" y2="576" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="610" y="546" width="260" height="60" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="740" y="582" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Export markets</text>
</svg>