<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 687" width="900" height="687" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="687" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Adding value: from raw cotton to shirts</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">bar heights are schematic</text>
<rect x="70" y="340" width="110" height="40" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5" rx="4"/><rect x="30" y="400" width="190" height="110" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="431.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Raw cotton</text><text x="48" y="454.75" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start">raw material</text><rect x="30" y="526" width="190" height="36" rx="18" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="125" y="550" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Primary: farming</text><line x1="223" y1="455" x2="242" y2="455" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="286" y="295" width="110" height="85" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5" rx="4"/><rect x="246" y="400" width="190" height="110" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="264" y="431.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Ginned and spun</text><text x="264" y="455.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">into yarn</text><text x="264" y="478.75" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start">processed</text><rect x="246" y="526" width="190" height="36" rx="18" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="341" y="550" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Secondary</text><line x1="439" y1="455" x2="458" y2="455" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="502" y="250" width="110" height="130" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5" rx="4"/><rect x="462" y="400" width="190" height="110" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="480" y="431.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Cloth</text><text x="480" y="454.75" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start">processed</text><rect x="462" y="526" width="190" height="36" rx="18" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="557" y="550" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Secondary</text><line x1="655" y1="455" x2="674" y2="455" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="720" y="205" width="110" height="175" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5" rx="4"/><rect x="680" y="400" width="190" height="110" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="698" y="431.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Shirts</text><text x="698" y="454.75" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start">manufactured</text><rect x="680" y="526" width="190" height="36" rx="18" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="775" y="550" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Secondary</text><line x1="30" y1="380" x2="870" y2="380" stroke="#1e2a44" stroke-width="2.5"/><line x1="60" y1="170" x2="830" y2="170" stroke="#8a6d0d" stroke-width="4" marker-end="url(#ahO)"/><text x="60" y="146" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="start">VALUE-ADDED: extra value gained at each stage of processing</text><rect x="30" y="582" width="840" height="75" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="612.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Tertiary industry provides services such as banking and transport. Exporting cloth or garments</text><text x="48" y="634.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">rather than raw cotton earns more foreign exchange.</text>
</svg>