<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three scales of industry</text>

<rect x="30" y="112" width="270" height="332" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><line x1="50" y1="262" x2="280" y2="262" stroke="#1e2a44" stroke-width="2.5"/><path d="M70,262 L70,202 L110,177 L110,202 L150,177 L150,202 L190,177 L190,202 L260,202 L260,262 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><rect x="220" y="147" width="22" height="55" fill="#9c8f6e" stroke="#1e2a44" stroke-width="3"/><rect x="95" y="220" width="22" height="18" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><rect x="135" y="220" width="22" height="18" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><rect x="175" y="220" width="22" height="18" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><rect x="215" y="220" width="22" height="18" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="165" y="296" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="middle">●●●●●●●●●●●●</text><text x="48" y="342" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Large-scale</text><text x="48" y="374" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Many workers, heavy</text><text x="48" y="396" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">machinery and large capital,</text><text x="48" y="418" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">in factories.</text><rect x="315" y="112" width="270" height="332" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><line x1="335" y1="262" x2="565" y2="262" stroke="#1e2a44" stroke-width="2.5"/><rect x="395" y="202" width="110" height="60" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3"/><path d="M385,202 L515,202 L505,184 L395,184 Z" fill="#9c8f6e" stroke="#1e2a44" stroke-width="3"/><rect x="436" y="228" width="28" height="34" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="450" y="296" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="middle">●●●●●</text><text x="333" y="342" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Small-scale</text><text x="333" y="374" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Fewer workers in small units.</text><rect x="600" y="112" width="270" height="332" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><line x1="620" y1="262" x2="850" y2="262" stroke="#1e2a44" stroke-width="2.5"/><rect x="690" y="207" width="90" height="55" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><path d="M677,207 L735,162 L793,207 Z" fill="#b5602e" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><rect x="723" y="230" width="24" height="32" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><text x="735" y="296" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="middle">●●</text><text x="618" y="342" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Cottage</text><text x="618" y="374" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Carried out in homes, often</text><text x="618" y="396" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">by family members using</text><text x="618" y="418" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">simple tools.</text><text x="450" y="478" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">● = workers (schematic)</text>
