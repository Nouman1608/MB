<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Can global communications create service jobs?</text>

<rect x="30" y="112" width="840" height="85" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="145" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">What call centres and IT services need</text><text x="48" y="174.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Fast internet links  ·  Reliable power  ·  English-speaking, computer-literate workers</text><path d="M450,235 L436,267 L464,267 Z" fill="#1e2a44"/><line x1="235" y1="235" x2="665" y2="235" stroke="#1e2a44" stroke-width="5" stroke-linecap="round"/><line x1="235" y1="235" x2="235" y2="279" stroke="#1e2a44" stroke-width="2.5"/><line x1="665" y1="235" x2="665" y2="279" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="279" width="410" height="135" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="312" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Advantages for Pakistan</text><text x="48" y="341.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="341.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Large young workforce</text><text x="48" y="366.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="366.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Lower wage costs</text><rect x="460" y="279" width="410" height="135" rx="12" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="478" y="312" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Barriers</text><text x="478" y="341.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="494" y="341.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Power cuts</text><text x="478" y="366.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="494" y="366.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Uneven broadband outside big cities</text><text x="478" y="391.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="494" y="391.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Competition from other countries</text><rect x="30" y="434" width="840" height="53" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="464.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Feasibility: weigh the advantages against the barriers, then reach a judgement.</text>
</svg>