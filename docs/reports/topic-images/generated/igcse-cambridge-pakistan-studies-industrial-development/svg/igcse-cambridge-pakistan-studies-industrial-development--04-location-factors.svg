<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What pulls each industry to its location?</text>

<rect x="30" y="112" width="840" height="612" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="46" y="208" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Industry and main locations</text><text x="716" y="208" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Market</text><text transform="translate(373,212) rotate(-50)" font-size="16" font-weight="700" fill="#1e2a44">Raw materials</text><text transform="translate(447,212) rotate(-50)" font-size="16" font-weight="700" fill="#1e2a44">Power / fuel</text><text transform="translate(521,212) rotate(-50)" font-size="16" font-weight="700" fill="#1e2a44">Labour and skills</text><text transform="translate(595,212) rotate(-50)" font-size="16" font-weight="700" fill="#1e2a44">Port or links</text><text transform="translate(669,212) rotate(-50)" font-size="16" font-weight="700" fill="#1e2a44">Nearby market</text><rect x="32" y="224" width="836" height="50" fill="#dce9e7"/><text x="46" y="246" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Cotton textiles</text><text x="46" y="266" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Faisalabad, Karachi, Lahore, Multan</text><circle cx="367" cy="249" r="13" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="441" cy="249" r="4" fill="#c9d6d4"/><circle cx="515" cy="249" r="13" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="589" cy="249" r="13" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="663" cy="249" r="4" fill="#c9d6d4"/><text x="716" y="255" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">Domestic + major export</text><text x="46" y="296" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Sugar refining</text><text x="46" y="316" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Near cane fields</text><circle cx="367" cy="299" r="13" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="441" cy="299" r="4" fill="#c9d6d4"/><circle cx="515" cy="299" r="4" fill="#c9d6d4"/><circle cx="589" cy="299" r="4" fill="#c9d6d4"/><circle cx="663" cy="299" r="4" fill="#c9d6d4"/><text x="716" y="305" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Mainly domestic</text><rect x="32" y="324" width="836" height="50" fill="#dce9e7"/><text x="46" y="346" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Cement</text><text x="46" y="366" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Near limestone and gypsum</text><circle cx="367" cy="349" r="13" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="441" cy="349" r="13" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="515" cy="349" r="4" fill="#c9d6d4"/><circle cx="589" cy="349" r="4" fill="#c9d6d4"/><circle cx="663" cy="349" r="4" fill="#c9d6d4"/><text x="716" y="355" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">Domestic + export</text><text x="46" y="396" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Fertiliser</text><text x="46" y="416" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Near gas fields and pipelines</text><circle cx="367" cy="399" r="13" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="441" cy="399" r="13" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="515" cy="399" r="4" fill="#c9d6d4"/><circle cx="589" cy="399" r="4" fill="#c9d6d4"/><circle cx="663" cy="399" r="4" fill="#c9d6d4"/><text x="716" y="405" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Domestic</text><rect x="32" y="424" width="836" height="50" fill="#dce9e7"/><text x="46" y="446" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Iron and steel</text><text x="46" y="466" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Pipri, near Port Qasim</text><circle cx="367" cy="449" r="4" fill="#c9d6d4"/><circle cx="441" cy="449" r="4" fill="#c9d6d4"/><circle cx="515" cy="449" r="4" fill="#c9d6d4"/><circle cx="589" cy="449" r="13" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="663" cy="449" r="4" fill="#c9d6d4"/><text x="716" y="455" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Domestic</text><text x="46" y="496" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Oil refining</text><text x="46" y="516" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Karachi, Attock, near Multan</text><circle cx="367" cy="499" r="13" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="441" cy="499" r="4" fill="#c9d6d4"/><circle cx="515" cy="499" r="4" fill="#c9d6d4"/><circle cx="589" cy="499" r="13" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="663" cy="499" r="13" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="716" y="505" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Domestic</text><rect x="32" y="524" width="836" height="50" fill="#dce9e7"/><text x="46" y="546" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Sports goods</text><text x="46" y="566" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Sialkot</text><circle cx="367" cy="549" r="4" fill="#c9d6d4"/><circle cx="441" cy="549" r="4" fill="#c9d6d4"/><circle cx="515" cy="549" r="13" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="589" cy="549" r="13" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="663" cy="549" r="4" fill="#c9d6d4"/><text x="716" y="555" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">Mainly export</text><text x="46" y="596" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Surgical instruments</text><text x="46" y="616" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Sialkot</text><circle cx="367" cy="599" r="4" fill="#c9d6d4"/><circle cx="441" cy="599" r="4" fill="#c9d6d4"/><circle cx="515" cy="599" r="13" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="589" cy="599" r="4" fill="#c9d6d4"/><circle cx="663" cy="599" r="4" fill="#c9d6d4"/><text x="716" y="605" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">Mainly export</text><rect x="32" y="624" width="836" height="50" fill="#dce9e7"/><text x="46" y="646" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Brick</text><text x="46" y="666" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Edge of most towns</text><circle cx="367" cy="649" r="13" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="441" cy="649" r="4" fill="#c9d6d4"/><circle cx="515" cy="649" r="13" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="589" cy="649" r="4" fill="#c9d6d4"/><circle cx="663" cy="649" r="13" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="716" y="655" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Domestic</text><text x="46" y="696" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Crafts</text><text x="46" y="716" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Throughout</text><circle cx="367" cy="699" r="4" fill="#c9d6d4"/><circle cx="441" cy="699" r="4" fill="#c9d6d4"/><circle cx="515" cy="699" r="13" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="589" cy="699" r="4" fill="#c9d6d4"/><circle cx="663" cy="699" r="4" fill="#c9d6d4"/><text x="716" y="705" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">Domestic + export</text><line x1="30" y1="224" x2="870" y2="224" stroke="#1e2a44" stroke-width="2"/><line x1="330" y1="224" x2="330" y2="724" stroke="#c9d6d4" stroke-width="2"/><line x1="700" y1="224" x2="700" y2="724" stroke="#c9d6d4" stroke-width="2"/><circle cx="60" cy="754" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="80" y="760" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">key location factor named in the table above</text>
