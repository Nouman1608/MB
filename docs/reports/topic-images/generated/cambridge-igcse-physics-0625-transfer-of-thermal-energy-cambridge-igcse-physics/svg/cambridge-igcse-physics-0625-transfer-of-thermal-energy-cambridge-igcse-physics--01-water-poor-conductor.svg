<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" width="900" height="680" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="680" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Water is a poor conductor</text>

<rect x="30" y="110" width="840" height="440" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M330,140 L330,490 Q330,520 365,520 Q400,520 400,490 L400,140" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><rect x="344" y="458" width="42" height="34" rx="4" fill="#ffffff" stroke="#2b5a9a" stroke-width="2.5"/><path d="M344,470 l42,0 M344,480 l42,0 M358,458 l0,34 M372,458 l0,34" fill="none" stroke="#4a5568" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M310,260 q-15.400000000000002,-19.8 0,-50.6 q15.400000000000002,30.800000000000004 0,50.6 z" fill="#d4b02e" stroke="#b5602e" stroke-width="2.5"/><text x="290" y="290" font-size="16" font-weight="700" fill="#b5602e" text-anchor="end">heat near the top</text><circle cx="350" cy="180" r="6" fill="#ffffff" stroke="#2e6b62" stroke-width="1.5"/><circle cx="375" cy="165" r="6" fill="#ffffff" stroke="#2e6b62" stroke-width="1.5"/><circle cx="360" cy="210" r="6" fill="#ffffff" stroke="#2e6b62" stroke-width="1.5"/><text x="420" y="190" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">water boils here</text><text x="420" y="480" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">ice in wire gauze stays</text><text x="420" y="502" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">unmelted for some time</text><rect x="30" y="565" width="840" height="92" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="602.95" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Heating at the top stops convection: hot water stays up there.</text><text x="450" y="630.95" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Energy can reach the ice only by conduction through the water, and it does so very slowly.</text>
</svg>