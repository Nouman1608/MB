<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" width="900" height="580" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="580" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Convection in air</text>

<rect x="30" y="110" width="580" height="420" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="140" y="260" width="440" height="220" rx="4" fill="#eef2f4" stroke="#1e2a44" stroke-width="3"/><rect x="200" y="170" width="60" height="90" rx="0" fill="#eef2f4" stroke="#1e2a44" stroke-width="3"/><rect x="460" y="170" width="60" height="90" rx="0" fill="#eef2f4" stroke="#1e2a44" stroke-width="3"/><rect x="482" y="420" width="16" height="50" rx="0" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><path d="M490,418 q-11.200000000000001,-14.4 0,-36.800000000000004 q11.200000000000001,22.400000000000002 0,36.800000000000004 z" fill="#d4b02e" stroke="#b5602e" stroke-width="2.5"/><text x="490" y="500" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">candle</text><rect x="195" y="120" width="70" height="14" rx="0" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><text x="275" y="131" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">smouldering paper</text><path d="M230,138 q-8,-10 0,-20 q8,-10 0,-20" fill="none" stroke="#4a5568" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M230,150 L230,380 Q230,420 280,420 L440,420 Q490,420 490,370 L490,150" fill="none" stroke="#4a5568" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><text x="240" y="330" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">cool air</text><text x="530" y="220" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">warm air</text><rect x="620" y="110" width="250" height="420" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="640" cy="180" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="640" y="185.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="666" y="174" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">air above the candle</text><text x="666" y="195" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">is heated and expands</text><circle cx="640" cy="260" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="640" y="265.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="666" y="254" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">its density decreases,</text><text x="666" y="275" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">so it rises</text><circle cx="640" cy="340" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="640" y="345.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="666" y="334" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">cooler, denser air</text><text x="666" y="355" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">sinks to replace it</text><circle cx="640" cy="420" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="640" y="425.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="666" y="414" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">a convection current</text><text x="666" y="435" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">forms</text><text x="320" y="555" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">smoke is drawn down one chimney and up the other</text>
</svg>