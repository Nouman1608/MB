<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 510" width="900" height="510" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="510" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Heating a room by convection</text>

<rect x="80" y="140" width="520" height="340" rx="2" fill="#ffffff" stroke="#1e2a44" stroke-width="4"/><rect x="100" y="400" width="70" height="60" rx="4" fill="#b5602e" stroke="#1e2a44" stroke-width="2.5"/><text x="135" y="437" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">heater</text><path d="M135,390 L135,190 Q135,165 165,165 L530,165 Q570,165 570,200 L570,420 Q570,450 540,450 L210,450" fill="none" stroke="#b5602e" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahR)"/><text x="150" y="290" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">warm air rises</text><text x="340" y="195" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">moves across the ceiling</text><text x="555" y="310" font-size="16" font-weight="700" fill="#2b5a9a" text-anchor="end">cools and sinks</text><text x="380" y="440" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">returns along the floor</text><rect x="620" y="140" width="250" height="340" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="745" y="185.6" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Heater low down:</text><text x="745" y="211.6" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">air next to it is</text><text x="745" y="237.6" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">heated, expands,</text><text x="745" y="263.6" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">becomes less dense</text><text x="745" y="289.6" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">and rises; cooler,</text><text x="745" y="315.6" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">denser air sinks</text><text x="745" y="341.6" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">to replace it.</text><text x="745" y="367.6" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle"></text><text x="745" y="393.6" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Air conditioner</text><text x="745" y="419.6" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">high up: cool, dense</text><text x="745" y="445.6" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">air sinks.</text>
</svg>