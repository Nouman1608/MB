<rect x="30" y="72" width="148.8" height="30" rx="15" fill="#8a6d0d"/><text x="42" y="93" font-size="16" font-weight="700" fill="#ffffff" text-anchor="start">Extended only</text><rect x="30" y="110" width="840" height="460" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="180" y="200" width="260" height="340" rx="30" fill="#eef2f4" stroke="#1e2a44" stroke-width="3"/><rect x="210" y="220" width="200" height="300" rx="22" fill="#ffffff" stroke="#4a5568" stroke-width="4"/><rect x="226" y="236" width="168" height="268" rx="14" fill="#b5d3cf" stroke="#4a5568" stroke-width="4"/><rect x="260" y="170" width="100" height="60" rx="8" fill="#9c8f6e" stroke="#1e2a44" stroke-width="3"/><path d="M211,290 L225,290" fill="none" stroke="#1e2a44" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" /><line x1="500" y1="200" x2="365" y2="200" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><text x="510" y="206" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">stopper</text><text x="510" y="228" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">reduces convection and evaporation</text><line x1="500" y1="300" x2="418" y2="300" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><text x="510" y="306" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">vacuum between double walls</text><text x="510" y="328" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">stops conduction and convection</text><line x1="500" y1="400" x2="402" y2="400" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><text x="510" y="406" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">silvered walls</text><text x="510" y="428" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">reflect infrared: reduce radiation</text>
