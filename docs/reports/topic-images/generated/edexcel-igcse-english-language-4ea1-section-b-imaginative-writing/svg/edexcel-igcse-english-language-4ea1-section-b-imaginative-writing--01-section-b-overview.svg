<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 603" width="900" height="603" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="603" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Section B: one imaginative piece</text>

<rect x="130" y="100" width="180" height="60" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="220" y="137" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Prompt 1</text><rect x="360" y="100" width="180" height="60" rx="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="450" y="137" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Prompt 2</text><rect x="590" y="100" width="180" height="60" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="680" y="137" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Prompt 3</text><line x1="450" y1="164" x2="450" y2="200" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="470" y="188" font-size="16" font-weight="600" fill="#4a5568" text-anchor="start">choose one</text><rect x="250" y="204" width="400" height="56" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="239" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">About 45 minutes · 30 marks</text><rect x="30" y="282" width="411" height="162" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="315" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">AO4 · 18 MARKS</text><text x="50" y="342" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Communicate effectively and</text><text x="50" y="368" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">imaginatively</text><text x="50" y="397.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Adapt form, tone and register for specific</text><text x="50" y="419.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">purposes and audiences.</text><rect x="459" y="282" width="411" height="162" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="479" y="315" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">AO5 · 12 MARKS</text><text x="479" y="342" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Write clearly and accurately</text><text x="479" y="371.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Range of vocabulary and sentence</text><text x="479" y="393.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">structures, paragraphing, accurate</text><text x="479" y="415.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">spelling, grammar and punctuation.</text><rect x="30" y="466" width="840" height="107" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="499.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Reading feeds writing</text><text x="450" y="528.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">Use what you have learned about the writer’s craft in your reading of fiction to inspire</text><text x="450" y="550.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">and influence your own writing.</text>
</svg>