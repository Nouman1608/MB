<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Shapes that work in 45 minutes</text>

<rect x="30" y="100" width="268" height="268" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="134" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Single moment, zooming in</text><path d="M70,156 L260,156 L175,226 L155,226 Z" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><circle cx="165" cy="234" r="6" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="48" y="272" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Wide, then one detail or</text><text x="48" y="293" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">decision</text><text x="48" y="322" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start">Helps: focus and a natural</text><text x="48" y="342" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start">climax</text><rect x="316" y="100" width="268" height="268" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="334" y="134" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">In medias res</text><line x1="356" y1="196" x2="546" y2="196" stroke="#c9d6d4" stroke-width="6" stroke-linecap="round"/><circle cx="451" cy="196" r="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><path d="M441,182 C416,162 396,166 386,184" fill="none" stroke="#8a6d0d" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahO)"/><text x="451" y="236" font-size="15" font-weight="600" fill="#8a6d0d" text-anchor="middle">start here</text><text x="334" y="272" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Start mid-action, then a</text><text x="334" y="293" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">little background</text><text x="334" y="322" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start">Helps: instant engagement</text><rect x="602" y="100" width="268" height="268" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="620" y="134" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Cyclical</text><circle cx="737" cy="196" r="34" fill="none" stroke="#8a6d0d" stroke-width="3" stroke-dasharray="160 54" marker-end="url(#ahO)"/><circle cx="737" cy="162" r="7" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="620" y="272" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">End with the opening image,</text><text x="620" y="293" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">changed in meaning</text><text x="620" y="322" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start">Helps: a satisfying,</text><text x="620" y="342" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start">deliberate ending</text><rect x="173" y="384" width="268" height="268" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="191" y="418" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Time shift</text><rect x="213" y="480" width="190" height="20" rx="6" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><rect x="278" y="446" width="60" height="22" rx="6" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><path d="M308,468 L308,480" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><text x="308" y="520" font-size="15" font-weight="600" fill="#8a6d0d" text-anchor="middle">one memory</text><text x="191" y="556" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Present scene interrupted by</text><text x="191" y="577" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">one memory</text><text x="191" y="606" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start">Helps: depth without a long</text><text x="191" y="626" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start">plot</text><rect x="459" y="384" width="268" height="268" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="418" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Delayed revelation</text><rect x="499" y="470" width="30" height="26" rx="5" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><rect x="537" y="470" width="30" height="26" rx="5" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><rect x="575" y="470" width="30" height="26" rx="5" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><rect x="613" y="470" width="30" height="26" rx="5" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><rect x="651" y="470" width="30" height="26" rx="5" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="666" y="489" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">!</text><text x="594" y="520" font-size="15" font-weight="600" fill="#8a6d0d" text-anchor="middle">key fact withheld</text><text x="477" y="556" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Withhold one key fact until</text><text x="477" y="577" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">late</text><text x="477" y="606" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start">Helps: tension and a final</text><text x="477" y="626" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start">shift</text><rect x="30" y="674" width="840" height="85" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="707.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Four to six paragraphs, each with a job</text><text x="450" y="736.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">Establish, develop, turn, then resolve or deliberately leave open.</text>
</svg>