<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 667" width="900" height="667" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="667" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Improving a weak paragraph</text>

<rect x="30" y="100" width="840" height="108" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="133" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">BEFORE: TELLS</text><text x="50" y="158.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">“It was a dark and scary night and I was very scared. I walked down the road</text><text x="50" y="182.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">and it was very quiet and I heard a noise and I was even more scared.”</text><rect x="30" y="226" width="840" height="132" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="259" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">AFTER: SHOWS</text><text x="50" y="284.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">“The road was quiet in the way that makes you listen harder. My footsteps</text><text x="50" y="308.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">sounded borrowed. Somewhere behind the hedge, something shifted its weight,</text><text x="50" y="332.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">and I discovered that I had stopped breathing.”</text><rect x="30" y="376" width="300" height="47" fill="#1e2a44"/><text x="180" y="405.3" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Change</text><rect x="330" y="376" width="540" height="47" fill="#1e2a44"/><text x="600" y="405.3" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Example</text><rect x="30" y="423" width="300" height="48" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="449.94" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Repetition removed</text><rect x="330" y="423" width="540" height="48" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="344" y="449.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">“scared” and “very” are gone</text><rect x="30" y="471" width="300" height="70" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="497.94" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Telling replaced by physical</text><text x="44" y="519.94" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">detail</text><rect x="330" y="471" width="540" height="70" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="344" y="508.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">“I had stopped breathing”</text><rect x="30" y="541" width="300" height="48" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="567.94" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Sentence length varied</text><rect x="330" y="541" width="540" height="48" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="344" y="567.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A short sentence between two longer ones</text><rect x="30" y="589" width="300" height="48" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="615.94" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">An unusual image</text><rect x="330" y="589" width="540" height="48" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="344" y="615.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">“borrowed” does the work of three adjectives</text><rect x="30" y="376" width="840" height="261" rx="4" fill="none" stroke="#1e2a44" stroke-width="2.5"/>
</svg>