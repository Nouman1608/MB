<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="700" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked plan: a phone ringing in an empty house</text>

<rect x="30" y="100" width="358" height="32" rx="16" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="209" y="121.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Shape: delayed revelation + cyclical</text><rect x="402" y="100" width="477" height="32" rx="16" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="640.5" y="121.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Voice: first person, past tense, teenage narrator</text><line x1="62" y1="170" x2="62" y2="527" stroke="#c9d6d4" stroke-width="4"/><rect x="108" y="150" width="762" height="73" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="121" y="177.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The phone ringing</text><text x="121" y="205.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The narrator outside, key in hand, hesitating</text><circle cx="62" cy="186.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="195.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="108" y="231" width="762" height="73" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="121" y="258.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The house described through absence</text><text x="121" y="286.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A removal van has just left</text><circle cx="62" cy="267.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="276.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="108" y="312" width="762" height="73" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="121" y="339.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Memory</text><text x="121" y="367.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The last call on this phone, years ago</text><circle cx="62" cy="348.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="357.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="108" y="393" width="762" height="73" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="121" y="420.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">She answers</text><text x="121" y="448.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Silence, then a wrong number; she laughs, then cries</text><circle cx="62" cy="429.5" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="62" y="438.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="108" y="474" width="762" height="73" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="121" y="501.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The phone off the hook on the bare floor</text><text x="121" y="529.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The ending echoes the opening</text><circle cx="62" cy="510.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="519.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><rect x="30" y="563" width="840" height="107" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="596.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Model opening: “Eleven rings. Twelve.”</text><text x="48" y="625.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Fragments build tension; personification of the phone and the door reflects the narrator’s</text><text x="48" y="647.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">mood; “Mum used to say” hints at loss without explaining it.</text>
</svg>