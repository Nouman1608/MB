<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 579" width="900" height="579" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="579" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Slow time at the moment that matters</text>

<rect x="30" y="100" width="840" height="100" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="54" y="134" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">FAST</text><text x="54" y="170" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“I opened the letter and it said I had failed.”</text><rect x="30" y="222" width="186" height="132" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="123" y="256.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Small physical</text><text x="123" y="280.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">steps</text><text x="123" y="308.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">break the action</text><text x="123" y="329.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">down</text><line x1="220" y1="277" x2="244" y2="277" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="248" y="222" width="186" height="110" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="341" y="266.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">One sensory</text><text x="341" y="290.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">detail</text><line x1="438" y1="277" x2="462" y2="277" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="466" y="222" width="186" height="110" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="559" y="278.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">One thought</text><line x1="656" y1="277" x2="680" y2="277" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="684" y="222" width="186" height="111" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="777" y="256.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Then the</text><text x="777" y="280.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">outcome</text><text x="777" y="308.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">only now revealed</text><text x="450" y="374" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Where the words go across the piece</text><rect x="30" y="390" width="134" height="48" rx="8" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="97" y="420" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">faster</text><rect x="170" y="390" width="134" height="48" rx="8" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="237" y="420" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">faster</text><rect x="310" y="390" width="414" height="48" rx="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="517" y="420" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">key moment: slowed</text><rect x="730" y="390" width="134" height="48" rx="8" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="797" y="420" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">faster</text><rect x="30" y="464" width="840" height="85" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="497.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The contrast shows deliberate control of pace, which AO4 rewards.</text><text x="48" y="526.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">The reader’s attention is held exactly where the tension is highest.</text>
</svg>