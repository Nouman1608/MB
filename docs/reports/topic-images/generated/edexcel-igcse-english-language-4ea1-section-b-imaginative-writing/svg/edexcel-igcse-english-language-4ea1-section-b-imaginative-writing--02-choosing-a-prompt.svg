<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 732" width="900" height="732" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="732" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Take a minute to choose the prompt</text>

<line x1="62" y1="120" x2="62" y2="362" stroke="#c9d6d4" stroke-width="4"/><rect x="108" y="100" width="762" height="86" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="126" y="134" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">A single, clear situation?</text><text x="126" y="163.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Can you picture it in under a minute?</text><circle cx="62" cy="143" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="151.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="108" y="198" width="762" height="86" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="126" y="232" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">A turning point and an ending?</text><text x="126" y="261.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Can you see where it changes and how it finishes?</text><circle cx="62" cy="241" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="249.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="108" y="296" width="762" height="86" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="126" y="330" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">A voice you write well in?</text><text x="126" y="359.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">First-person reflection, close third person, or description</text><circle cx="62" cy="339" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="347.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="30" y="404" width="408" height="114" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="234" y="439.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Small situation, written with</text><text x="234" y="464.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">precision</text><text x="234" y="493.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">usually scores higher</text><rect x="462" y="404" width="408" height="114" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="666" y="439.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Large plot, rushed</text><text x="666" y="468.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">the most dramatic prompt is often the</text><text x="666" y="490.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">hardest to control in 45 minutes</text><rect x="30" y="540" width="411" height="162" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="573" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">NARRATIVE</text><text x="50" y="600" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">A character, a situation, a</text><text x="50" y="626" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">change</text><text x="50" y="655.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">If it asks for a story, make sure</text><text x="50" y="677.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">something changes.</text><rect x="459" y="540" width="411" height="162" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="479" y="573" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DESCRIPTIVE</text><text x="479" y="600" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Place, moment or person through</text><text x="479" y="626" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">detail and mood</text><text x="479" y="655.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">If it asks you to describe, keep plot</text><text x="479" y="677.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">minimal.</text>
</svg>