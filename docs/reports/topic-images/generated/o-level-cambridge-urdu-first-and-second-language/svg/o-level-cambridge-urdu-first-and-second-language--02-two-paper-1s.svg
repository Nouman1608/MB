<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Paper 1 is a different paper in each syllabus</text>

<rect x="30" y="110" width="840" height="200" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="54" y="148" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">3247 First Language: 1 hour 30 minutes, two parts</text><rect x="54" y="174" width="325" height="90" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="216.5" y="212" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Part 1 Reading</text><text x="216.5" y="240" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">25 marks</text><rect x="379" y="174" width="325" height="90" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="541.5" y="212" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Part 2 Writing</text><text x="541.5" y="240" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">25 marks</text><text x="720" y="226" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">= 50</text><rect x="30" y="330" width="840" height="220" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="54" y="368" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">3248 Second Language: 1 hour 45 minutes, five exercises</text><text x="54" y="394" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">no longer divided into parts</text><rect x="54" y="414" width="104" height="90" fill="#efdfa8" stroke="#1e2a44" stroke-width="2.5"/><text x="106" y="452" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Ex. 1</text><text x="106" y="480" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">8 marks</text><rect x="158" y="414" width="117" height="90" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="216.5" y="452" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Ex. 2</text><text x="216.5" y="480" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">9 marks</text><rect x="275" y="414" width="117" height="90" fill="#efdfa8" stroke="#1e2a44" stroke-width="2.5"/><text x="333.5" y="452" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Ex. 3</text><text x="333.5" y="480" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">9 marks</text><rect x="392" y="414" width="130" height="90" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="457" y="452" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Ex. 4</text><text x="457" y="480" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">10 marks</text><rect x="522" y="414" width="182" height="90" fill="#efdfa8" stroke="#1e2a44" stroke-width="2.5"/><text x="613" y="452" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Ex. 5</text><text x="613" y="480" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">14 marks</text><text x="720" y="466" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">= 50</text><text x="54" y="532" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Includes an explicit summary exercise, marked on relevant points and concision.</text><rect x="30" y="570" width="840" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="613" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Only the paper title and the 50% weighting are shared.</text>
