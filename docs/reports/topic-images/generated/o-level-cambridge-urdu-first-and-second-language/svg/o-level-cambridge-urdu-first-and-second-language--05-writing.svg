<rect width="900" height="598" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Writing: formats, composition types and planning</text>

<text x="450" y="124" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Directed writing formats</text><rect x="30" y="142" width="156" height="54" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="108" y="176" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">letters</text><rect x="201" y="142" width="156" height="54" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="279" y="176" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">speeches</text><rect x="372" y="142" width="156" height="54" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="450" y="176" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">reports</text><rect x="543" y="142" width="156" height="54" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="621" y="176" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">articles</text><rect x="714" y="142" width="156" height="54" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="792" y="176" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">dialogues</text><text x="450" y="240" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">3247 Part 2 composition: a choice of title from four types</text><rect x="30" y="258" width="195" height="54" rx="10" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2"/><text x="127" y="292" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">argumentative</text><rect x="245" y="258" width="195" height="54" rx="10" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2"/><text x="342" y="292" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">discursive</text><rect x="460" y="258" width="195" height="54" rx="10" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2"/><text x="557" y="292" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">descriptive</text><rect x="675" y="258" width="195" height="54" rx="10" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2"/><text x="772" y="292" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">narrative</text><rect x="30" y="340" width="410" height="140" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="377" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Plan a discursive piece</text><text x="50" y="405.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Decide the line of argument and two or three</text><text x="50" y="427.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">supporting points before writing.</text><rect x="460" y="340" width="410" height="140" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="480" y="377" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Plan a narrative</text><text x="480" y="405.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Decide the ending before you start.</text><text x="480" y="435.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Unplanned writing drifts, and organisation</text><text x="480" y="457.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">marks go with it.</text><rect x="30" y="500" width="840" height="70" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="54" y="543" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">Register is heavily credited: the wrong level costs marks even with faultless grammar.</text>
</svg>