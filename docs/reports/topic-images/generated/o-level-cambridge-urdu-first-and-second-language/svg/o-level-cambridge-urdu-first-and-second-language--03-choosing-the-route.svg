<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 610" width="900" height="610" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="610" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Which route? It depends on the candidate</text>

<rect x="260" y="110" width="380" height="80" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="158" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Is Urdu your main language?</text><path d="M350,190 L200,250" fill="none" stroke="#1e2a44" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><polygon points="196,242 188,256 204,252" fill="#1e2a44"/><path d="M550,190 L700,250" fill="none" stroke="#1e2a44" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><polygon points="704,242 712,256 696,252" fill="#1e2a44"/><text x="250" y="214" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="end">yes</text><text x="650" y="214" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="start">no: learned in addition</text><rect x="30" y="260" width="410" height="166" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="297" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">3247 First Language</text><text x="50" y="325.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Assumes fluency.</text><text x="50" y="357.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Sophisticated comprehension and composition;</text><text x="50" y="379.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">response to literary texts in Paper 2.</text><rect x="460" y="260" width="410" height="166" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="480" y="297" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">3248 Second Language</text><text x="480" y="325.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Practical communication at a learner's</text><text x="480" y="347.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">level.</text><text x="480" y="379.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Reading for information, functional and</text><text x="480" y="401.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">creative writing, grammar and translation.</text><text x="450" y="472" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">The risk of the wrong route</text><rect x="30" y="492" width="410" height="90" rx="12" fill="#fbf1ea" stroke="#b5602e" stroke-width="2"/><text x="50" y="528" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">A fluent speaker entered for Second</text><text x="50" y="549" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">Language is capped.</text><rect x="460" y="492" width="410" height="90" rx="12" fill="#fbf1ea" stroke="#b5602e" stroke-width="2"/><text x="480" y="528" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">A learner entered for First Language</text><text x="480" y="549" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">faces literary demands they have not</text><text x="480" y="570" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">been taught.</text>
</svg>