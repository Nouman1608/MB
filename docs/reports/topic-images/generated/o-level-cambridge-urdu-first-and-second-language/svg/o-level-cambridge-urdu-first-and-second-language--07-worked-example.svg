<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 726" width="900" height="726" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="726" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: choosing the register</text>

<rect x="30" y="110" width="840" height="80" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="54" y="146" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Task: a letter to the head teacher requesting permission for a trip</text><text x="54" y="172" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Formal register required</text><rect x="30" y="210" width="840" height="87" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="253.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="262.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="122" y="248" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Respectful address and closing</text><text x="122" y="276" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Open and close as the reader's position requires.</text><rect x="30" y="307" width="840" height="87" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="350.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="359.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="122" y="345" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">aap throughout, never tum</text><text x="122" y="373" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">One respect level from start to finish.</text><rect x="30" y="404" width="840" height="87" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="447.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="456.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="122" y="442" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Formal vocabulary</text><text x="122" y="470" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Avoid colloquialisms.</text><rect x="30" y="501" width="840" height="87" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="544.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="553.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="122" y="539" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">A clear, structured request</text><text x="122" y="567" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">State what you are asking for and give reasons.</text><rect x="30" y="606" width="840" height="92" rx="14" fill="#fbf1ea" stroke="#b5602e" stroke-width="2.5"/><text x="54" y="642" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">Common error: drifting into informal address partway through</text><text x="54" y="672" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">It breaks consistency and costs marks even if every sentence is correct on its own.</text>
</svg>