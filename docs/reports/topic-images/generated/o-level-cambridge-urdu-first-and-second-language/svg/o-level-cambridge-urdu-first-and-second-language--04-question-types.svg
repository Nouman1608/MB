<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 654" width="900" height="654" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="654" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Reading: know the question type</text>

<rect x="30" y="110" width="840" height="80" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="30" y="110" width="250" height="80" rx="14" fill="#b5d3cf"/><text x="155" y="158" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">What?</text><text x="304" y="144" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">located detail</text><text x="304" y="170" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">find it in the passage</text><rect x="30" y="202" width="840" height="80" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="30" y="202" width="250" height="80" rx="14" fill="#b5d3cf"/><text x="155" y="250" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Why?</text><text x="304" y="236" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">inference</text><text x="304" y="262" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">answers rarely sit in one sentence</text><rect x="30" y="294" width="840" height="80" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="30" y="294" width="250" height="80" rx="14" fill="#b5d3cf"/><text x="155" y="342" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Writer's attitude</text><text x="304" y="328" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">evidence from word choice and tone</text><text x="304" y="354" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">not plot summary</text><rect x="30" y="386" width="840" height="80" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="30" y="386" width="250" height="80" rx="14" fill="#b5d3cf"/><text x="155" y="434" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">"In your own words"</text><text x="304" y="420" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">rephrase</text><text x="304" y="446" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">lifted phrasing will not score</text><rect x="30" y="490" width="410" height="136" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="50" y="527" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">3248: a summary exercise</text><text x="50" y="555.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Every required point; no examples or</text><text x="50" y="577.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">repetition; within the word limit.</text><rect x="460" y="490" width="410" height="136" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="480" y="527" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">3247: no separate summary</text><text x="480" y="555.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Comprehension questions of varying length,</text><text x="480" y="577.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">though a question can still ask you to draw</text><text x="480" y="599.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">points together.</text>
</svg>