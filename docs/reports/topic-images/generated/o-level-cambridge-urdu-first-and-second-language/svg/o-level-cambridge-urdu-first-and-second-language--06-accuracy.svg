<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 584" width="900" height="584" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="584" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Six features where accuracy marks are lost</text>

<rect x="30" y="110" width="410" height="110" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="50" y="147" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Gender agreement</text><text x="50" y="175.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">between noun, adjective and verb</text><rect x="460" y="110" width="410" height="110" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="480" y="147" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Verb forms</text><text x="480" y="175.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">tense, person, and respect levels (tu, tum,</text><text x="480" y="197.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">aap) used consistently</text><rect x="30" y="234" width="410" height="110" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="50" y="271" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Postpositions</text><text x="50" y="299.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">ne, ko, se, mein, par; ergative ne with</text><text x="50" y="321.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">transitive perfective verbs</text><rect x="460" y="234" width="410" height="110" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="480" y="271" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Izafat and compounds</text><text x="480" y="299.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">in formal writing</text><rect x="30" y="358" width="410" height="110" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="395" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Script accuracy</text><text x="50" y="423.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">dots and diacritics: a misplaced dot changes</text><text x="50" y="445.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the word</text><rect x="460" y="358" width="410" height="110" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="480" y="395" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Punctuation</text><text x="480" y="423.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">appropriate to Urdu conventions</text><rect x="30" y="486" width="840" height="70" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="54" y="529" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">Always reserve time at the end to check agreement and script.</text>
</svg>