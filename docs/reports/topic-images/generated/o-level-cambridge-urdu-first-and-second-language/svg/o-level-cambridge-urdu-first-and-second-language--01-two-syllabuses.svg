ht="400" fill="#2e6b62" text-anchor="middle" font-style="italic">Urdu as a learned additional language</text><rect x="480" y="226" width="370" height="76" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="665" y="258" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Paper 1 Reading and Writing</text><text x="665" y="284" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">50%</text><rect x="480" y="312" width="370" height="96" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="665" y="344" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Paper 2 Grammar, Writing and</text><text x="665" y="366" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Translation</text><text x="665" y="394" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">50%</text><text x="480" y="444" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">Paper 2 priority</text><text x="480" y="470" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">translation and grammar accuracy: regular,</text><text x="480" y="491" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">structured Urdu-English translation practice</text><rect x="30" y="540" width="840" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="583" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Candidates take one syllabus or the other, never both in the same series.</text>
