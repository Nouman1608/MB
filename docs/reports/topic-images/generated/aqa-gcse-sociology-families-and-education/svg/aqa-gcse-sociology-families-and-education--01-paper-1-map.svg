<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 634" width="900" height="634" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="634" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Paper 1 at a glance</text>

<rect x="30" y="108" width="840" height="96" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="140" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">The toolkit: revisit throughout</text><rect x="60" y="152" width="380" height="40" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="250" y="178" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">3.1 The sociological approach</text><rect x="460" y="152" width="380" height="40" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="650" y="178" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">3.2 Structures, processes, issues</text><line x1="250" y1="210" x2="250" y2="244" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="650" y1="210" x2="650" y2="244" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="250" width="410" height="150" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="235" y="290" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3.3 Families</text><text x="235" y="322" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Structure, functions and diversity of</text><text x="235" y="344" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">family life</text><rect x="460" y="250" width="410" height="150" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="665" y="290" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3.4 Education</text><text x="665" y="322" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Role, structure and impact of the</text><text x="665" y="344" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">education system</text><rect x="30" y="424" width="840" height="84" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="458" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">3.7 Research methods</text><text x="450" y="486" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">examined across both papers: apply it to families and education too</text><line x1="235" y1="404" x2="235" y2="420" stroke="#1e2a44" stroke-width="3"/><line x1="665" y1="404" x2="665" y2="420" stroke="#1e2a44" stroke-width="3"/><rect x="30" y="528" width="840" height="82" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="564" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Exam questions ask you to use a named perspective to explain a real social pattern, not to</text><text x="56" y="586" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">describe it neutrally.</text>
</svg>