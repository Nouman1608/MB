<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 703" width="900" height="703" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="703" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Young and Willmott: the symmetrical family</text>

<rect x="130" y="130" width="400" height="84" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="330" y="179" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Higher social classes</text><rect x="50" y="250" width="560" height="84" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="330" y="299" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Lower social classes</text><line x1="600" y1="140" x2="600" y2="330" stroke="#2e6b62" stroke-width="8" marker-end="url(#ahT)"/><text x="630" y="190" font-size="17" font-weight="400" fill="#2e6b62" text-anchor="start"><tspan font-weight="700">Stratified diffusion:</tspan></text><text x="630" y="212" font-size="17" font-weight="400" fill="#2e6b62" text-anchor="start">changes spread downward from</text><text x="630" y="234" font-size="17" font-weight="400" fill="#2e6b62" text-anchor="start">higher to lower classes over</text><text x="630" y="256" font-size="17" font-weight="400" fill="#2e6b62" text-anchor="start">time</text><text x="450" y="410" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Young and Willmott: what spreads down?</text><rect x="30" y="430" width="380" height="110" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="220" y="468" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Segregated roles</text><text x="220" y="498" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">clearly divided</text><line x1="418" y1="485" x2="482" y2="485" stroke="#1e2a44" stroke-width="5" marker-end="url(#ah)"/><rect x="490" y="430" width="380" height="110" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="680" y="468" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Joint roles</text><text x="680" y="498" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">symmetrical, home-centred family</text><rect x="30" y="560" width="840" height="119" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="596" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">But…</text><circle cx="61" cy="619.39" r="4.5" fill="#8a6d0d"/><text x="74" y="625" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Oakley:</tspan> women still did most domestic labour, the “dual burden”</text><circle cx="61" cy="649.39" r="4.5" fill="#8a6d0d"/><text x="74" y="655" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Duncombe and Marsden:</tspan> add emotional work, the “triple shift”</text>
</svg>