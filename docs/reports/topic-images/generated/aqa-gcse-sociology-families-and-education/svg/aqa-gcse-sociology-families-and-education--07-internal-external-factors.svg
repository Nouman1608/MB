text-anchor="middle">deprivation</text><rect x="40" y="330" width="190" height="70" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="135" y="370.15" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Cultural capital</text><rect x="670" y="240" width="190" height="70" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="765" y="280.15" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Parental attitudes</text><rect x="670" y="330" width="190" height="70" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="765" y="370.15" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Language codes</text><rect x="250" y="420" width="400" height="96" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="450" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Ball sits on both sides</text><text x="450" y="476" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">Teacher expectations (internal); parental choice</text><text x="450" y="496" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">and competition (external)</text><rect x="30" y="540" width="269.3333333333333" height="126" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,590 L31.25,554.25 Q31.25,541.25 44.25,541.25 L285.0833333333333,541.25 Q298.0833333333333,541.25 298.0833333333333,554.25 L298.0833333333333,590 Z" fill="#b5d3cf"/><line x1="31.25" y1="590" x2="298.0833333333333" y2="590" stroke="#c9d6d4" stroke-width="2"/><text x="164.66666666666666" y="570.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Class</text><text x="44" y="621.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Persistently the strongest</text><text x="44" y="642.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">predictor (Halsey)</text><rect x="315.3333333333333" y="540" width="269.3333333333333" height="126" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M316.5833333333333,590 L316.5833333333333,554.25 Q316.5833333333333,541.25 329.5833333333333,541.25 L570.4166666666666,541.25 Q583.4166666666666,541.25 583.4166666666666,554.25 L583.4166666666666,590 Z" fill="#dce9e7"/><line x1="316.5833333333333" y1="590" x2="583.4166666666666" y2="590" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="570.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Gender</text><text x="329.3333333333333" y="621.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Girls outperform boys at most</text><text x="329.3333333333333" y="642.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">levels</text><rect x="600.6666666666666" y="540" width="269.3333333333333" height="126" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.9166666666666,590 L601.9166666666666,554.25 Q601.9166666666666,541.25 614.9166666666666,541.25 L855.75,541.25 Q868.75,541.25 868.75,554.25 L868.75,590 Z" fill="#f2e7b8"/><line x1="601.9166666666666" y1="590" x2="868.75" y2="590" stroke="#c9d6d4" stroke-width="2"/><text x="735.3333333333333" y="570.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Ethnicity</text><text x="614.6666666666666" y="621.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Varies widely; institutional</text><text x="614.6666666666666" y="642.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">racism and material factors</text>
