<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="470" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What is the family for?</text>

<rect x="30" y="104" width="269.3333333333333" height="336" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,154 L31.25,118.25 Q31.25,105.25 44.25,105.25 L285.0833333333333,105.25 Q298.0833333333333,105.25 298.0833333333333,118.25 L298.0833333333333,154 Z" fill="#b5d3cf"/><line x1="31.25" y1="154" x2="298.0833333333333" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="164.66666666666666" y="135" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Functionalist</text><text x="46" y="187.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Murdock, Parsons</text><circle cx="51" cy="210.92" r="4.5" fill="#2e6b62"/><text x="64" y="216.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Primary socialisation</text><circle cx="51" cy="239.92" r="4.5" fill="#2e6b62"/><text x="64" y="245.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Stabilisation of adult</text><text x="64" y="266.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">personalities</text><circle cx="51" cy="289.92" r="4.5" fill="#2e6b62"/><text x="64" y="295.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Reproduction</text><circle cx="51" cy="318.92" r="4.5" fill="#2e6b62"/><text x="64" y="324.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Economic support</text><circle cx="51" cy="347.92" r="4.5" fill="#2e6b62"/><text x="64" y="353.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Parsons: the nuclear family</text><text x="64" y="374.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">is geographically mobile,</text><text x="64" y="395.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">so it suits industrial</text><text x="64" y="416.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">society</text><rect x="315.3333333333333" y="104" width="269.3333333333333" height="336" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M316.5833333333333,154 L316.5833333333333,118.25 Q316.5833333333333,105.25 329.5833333333333,105.25 L570.4166666666666,105.25 Q583.4166666666666,105.25 583.4166666666666,118.25 L583.4166666666666,154 Z" fill="#dce9e7"/><line x1="316.5833333333333" y1="154" x2="583.4166666666666" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="135" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Marxist</text><text x="331.3333333333333" y="187.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">The family serves</text><text x="331.3333333333333" y="208.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">capitalism</text><circle cx="336.3333333333333" cy="231.92" r="4.5" fill="#2e6b62"/><text x="349.3333333333333" y="237.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Reproduces labour power</text><circle cx="336.3333333333333" cy="260.92" r="4.5" fill="#2e6b62"/><text x="349.3333333333333" y="266.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Passes on private property</text><text x="349.3333333333333" y="287.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">through inheritance</text><circle cx="336.3333333333333" cy="310.92" r="4.5" fill="#2e6b62"/><text x="349.3333333333333" y="316.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Acts as a unit of</text><text x="349.3333333333333" y="337.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">consumption</text><rect x="600.6666666666666" y="104" width="269.3333333333333" height="336" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.9166666666666,154 L601.9166666666666,118.25 Q601.9166666666666,105.25 614.9166666666666,105.25 L855.75,105.25 Q868.75,105.25 868.75,118.25 L868.75,154 Z" fill="#f2e7b8"/><line x1="601.9166666666666" y1="154" x2="868.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="735.3333333333333" y="135" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Feminist</text><text x="616.6666666666666" y="187.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Focus on patriarchy</text><circle cx="621.6666666666666" cy="210.92" r="4.5" fill="#2e6b62"/><text x="634.6666666666666" y="216.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Liberal:</tspan> gradual progress</text><text x="634.6666666666666" y="237.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">towards equality</text><circle cx="621.6666666666666" cy="260.92" r="4.5" fill="#2e6b62"/><text x="634.6666666666666" y="266.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Radical:</tspan> the family is the</text><text x="634.6666666666666" y="287.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">central site of women’s</text><text x="634.6666666666666" y="308.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">oppression</text><circle cx="621.6666666666666" cy="331.92" r="4.5" fill="#2e6b62"/><text x="634.6666666666666" y="337.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Marxist feminist:</tspan> unpaid</text><text x="634.6666666666666" y="358.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">domestic labour meets</text><text x="634.6666666666666" y="379.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">capitalism’s needs</text>
</svg>