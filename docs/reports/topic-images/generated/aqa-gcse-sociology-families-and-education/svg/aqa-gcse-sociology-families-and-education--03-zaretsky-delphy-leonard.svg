<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 699" width="900" height="699" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="699" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Criticising the family: capitalism or patriarchy?</text>

<rect x="30" y="108" width="404" height="436" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,158 L31.25,122.25 Q31.25,109.25 44.25,109.25 L419.75,109.25 Q432.75,109.25 432.75,122.25 L432.75,158 Z" fill="#b5d3cf"/><line x1="31.25" y1="158" x2="432.75" y2="158" stroke="#c9d6d4" stroke-width="2"/><text x="232" y="138.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Zaretsky</text><text x="232" y="196" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Marxist</text><circle cx="232" cy="268" r="60" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="232" y="260" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">benefits:</text><text x="232" y="284" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">capitalism</text><circle cx="57" cy="356.72" r="4.5" fill="#2e6b62"/><text x="70" y="362" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The “private life” of the family separate</text><text x="70" y="383" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">from the economy is an illusion</text><circle cx="57" cy="406.72" r="4.5" fill="#2e6b62"/><text x="70" y="412" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Cushions people from capitalism but cannot</text><text x="70" y="433" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">meet all their needs</text><circle cx="57" cy="456.72" r="4.5" fill="#2e6b62"/><text x="70" y="462" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Props capitalism up: unpaid domestic</text><text x="70" y="483" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">labour, unit of consumption</text><circle cx="57" cy="506.72" r="4.5" fill="#2e6b62"/><text x="70" y="512" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Only socialism would end the separation</text><rect x="466" y="108" width="404" height="436" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M467.25,158 L467.25,122.25 Q467.25,109.25 480.25,109.25 L855.75,109.25 Q868.75,109.25 868.75,122.25 L868.75,158 Z" fill="#f2e7b8"/><line x1="467.25" y1="158" x2="868.75" y2="158" stroke="#c9d6d4" stroke-width="2"/><text x="668" y="138.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Delphy and Leonard</text><text x="668" y="196" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Feminist</text><circle cx="668" cy="268" r="60" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="668" y="260" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">benefits:</text><text x="668" y="284" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">men</text><circle cx="493" cy="356.72" r="4.5" fill="#2e6b62"/><text x="506" y="362" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The family is an economic system</text><circle cx="493" cy="385.72" r="4.5" fill="#2e6b62"/><text x="506" y="391" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Men, rather than capitalists, exploit</text><text x="506" y="412" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">women’s work</text><circle cx="493" cy="435.72" r="4.5" fill="#2e6b62"/><text x="506" y="441" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Wives with paid jobs still do household</text><text x="506" y="462" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">tasks not equally shared</text><circle cx="493" cy="485.72" r="4.5" fill="#2e6b62"/><text x="506" y="491" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The family maintains patriarchy</text><circle cx="450" cy="318" r="24" fill="#1e2a44"/><text x="450" y="325" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">vs</text><rect x="30" y="564" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="600" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Other criticisms the specification lists</text><text x="56" y="629" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Isolation and unrealistic idealisation; loss of traditional functions; lack of contact with</text><text x="56" y="651" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">wider kin; the status and role of women; marital breakdown; dysfunctional families.</text>
</svg>