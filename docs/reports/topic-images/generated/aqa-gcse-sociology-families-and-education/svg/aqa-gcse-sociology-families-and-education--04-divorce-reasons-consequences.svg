<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="640" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why divorce rose, and what followed</text>

<rect x="30" y="108" width="198" height="74" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="129" y="150.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Changes in the law</text><line x1="129" y1="186" x2="369.75" y2="226" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="244" y="108" width="198" height="74" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="343" y="128.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Changes in social</text><text x="343" y="150.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">attitudes and</text><text x="343" y="172.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">values</text><line x1="343" y1="186" x2="423.25" y2="226" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="458" y="108" width="198" height="74" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="557" y="150.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Secularisation</text><line x1="557" y1="186" x2="476.75" y2="226" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="672" y="108" width="198" height="74" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="771" y="139.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Changing status of</text><text x="771" y="161.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">women</text><line x1="771" y1="186" x2="530.25" y2="226" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="250" y="232" width="400" height="66" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="273" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Rise in divorce since 1945</text><rect x="30" y="318" width="840" height="66" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="345" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle"><tspan font-weight="700">Divorce Reform Act 1969</tspan> (in force 1971): divorce on the ground of irretrievable breakdown,</text><text x="450" y="367" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">followed by a sharp rise</text><line x1="450" y1="300" x2="450" y2="314" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="450" y="422" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Consequences for…</text><rect x="30" y="440" width="268" height="56" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="164" y="475" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Husbands and wives</text><rect x="316" y="440" width="268" height="56" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="475" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Children</text><rect x="602" y="440" width="268" height="56" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="736" y="475" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">The extended family</text><text x="450" y="530" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="middle">including the growth in the number of lone-parent families</text><rect x="30" y="556" width="840" height="60" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="592" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Then interpret the changes from functionalist, feminist and Marxist perspectives.</text>
</svg>