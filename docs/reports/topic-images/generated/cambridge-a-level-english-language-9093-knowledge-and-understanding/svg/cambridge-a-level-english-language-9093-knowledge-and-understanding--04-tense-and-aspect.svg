<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 670" width="900" height="670" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="670" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Tense and aspect are different things</text>

<rect x="40" y="115" width="820" height="200" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="64" y="150" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Progressive aspect</text><text x="290" y="150" font-size="19" font-weight="600" fill="#1e2a44" text-anchor="start" font-style="italic">"was walking"</text><text x="64" y="178" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the action is ongoing and unfinished</text><line x1="120" y1="260" x2="820" y2="260" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="830" y="266" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start"></text><rect x="280" y="242" width="380" height="36" rx="18" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><text x="470" y="266" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">walking, in progress</text><path d="M660,242 l18,18 l-18,18" fill="none" stroke="#2e6b62" stroke-width="2.5" stroke-dasharray="5 4"/><text x="140" y="300" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">past</text><rect x="40" y="335" width="820" height="220" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="64" y="370" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="start">Perfect aspect</text><text x="250" y="370" font-size="19" font-weight="600" fill="#1e2a44" text-anchor="start" font-style="italic">"has walked", "had walked"</text><text x="64" y="398" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">links an earlier action to a later moment</text><line x1="120" y1="490" x2="820" y2="490" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="830" y="496" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start"></text><circle cx="320" cy="490" r="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="320" y="462" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">earlier action</text><line x1="640" y1="470" x2="640" y2="510" stroke="#8a6d0d" stroke-width="4"/><text x="640" y="462" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">later moment</text><path d="M336,482 C430,440 540,440 632,482" fill="none" stroke="#8a6d0d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahO)"/><text x="480" y="530" font-size="15" font-weight="400" fill="#8a6d0d" text-anchor="middle">still relevant at the later moment</text><rect x="40" y="575" width="820" height="70" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="450" y="607" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Tense locates an action in time; aspect describes how it unfolds.</text><text x="450" y="632" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Learn them separately.</text>
</svg>