<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 610" width="900" height="610" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="610" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Sorting linguistic features by level</text>

<rect x="40" y="115" width="150" height="98" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="115" y="171" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Word</text><rect x="200" y="115" width="450" height="98" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="218" y="137" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">word classes; vocabulary: register, connotation,</text><text x="218" y="159" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">semantic field; morphology: affixation</text><text x="218" y="181" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">("unmissable"), compounding ("feelgood"),</text><text x="218" y="203" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">blending</text><rect x="40" y="227" width="150" height="98" rx="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="115" y="283" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Sentence</text><rect x="200" y="227" width="450" height="98" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="218" y="271" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">sentence types; fronting and end-focus; voice</text><text x="218" y="293" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(active or passive); tense and aspect; modality</text><rect x="40" y="339" width="150" height="98" rx="10" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="115" y="395" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Text</text><rect x="200" y="339" width="450" height="98" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="218" y="383" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">openings, endings, shifts in time or focus,</text><text x="218" y="405" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">paragraph length; narrative perspective</text><line x1="20" y1="125" x2="20" y2="425" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><rect x="670" y="115" width="190" height="322" rx="12" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="765" y="160" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="middle">Sound</text><text x="765" y="205" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">alliteration,</text><text x="765" y="228" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">assonance, sibilance,</text><text x="765" y="251" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">rhythm, rhyme</text><text x="765" y="330" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">matters most in</text><text x="765" y="349" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">speeches, podcasts</text><text x="765" y="368" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">and slogans</text><rect x="40" y="455" width="820" height="130" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="64" y="490" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Across levels</text><text x="64" y="522" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">figurative language · rhetorical devices · authorial voice · formality of tone · pragmatics</text><text x="64" y="556" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">"Voice" means two things: grammatical voice (active, passive) or authorial voice. Say which.</text>
</svg>