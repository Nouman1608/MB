<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 645" width="900" height="645" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="645" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Knowledge and understanding: four strands</text>

<rect x="40" y="115" width="400" height="122" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="78" cy="155" r="20" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="78" y="162.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="112" y="162" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Conventions</text><text x="64" y="201" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">of a wide range of written textual forms</text><rect x="460" y="115" width="400" height="122" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><circle cx="498" cy="155" r="20" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="498" y="162.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="532" y="162" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Linguistic and literary</text><text x="484" y="201" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">elements and features of texts</text><rect x="40" y="255" width="400" height="122" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><circle cx="78" cy="295" r="20" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="78" y="302.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="112" y="302" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Audience</text><text x="64" y="341" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">in both the design and the reception of</text><text x="64" y="362" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">texts</text><rect x="460" y="255" width="400" height="122" rx="12" fill="#efdfa8" stroke="#1e2a44" stroke-width="2.5"/><circle cx="498" cy="295" r="20" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="498" y="302.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="532" y="302" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Genre, purpose, context</text><text x="484" y="341" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and how they contribute to meaning</text><text x="450" y="445" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Knowledge and understanding serves both AS papers</text><line x1="330" y1="455" x2="240" y2="490" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="570" y1="455" x2="660" y2="490" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="40" y="495" width="400" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="240" y="530" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Paper 1 Reading</text><text x="240" y="560" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">why a text looks and sounds as it does</text><rect x="460" y="495" width="400" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="660" y="530" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Paper 2 Writing</text><text x="660" y="560" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">draws on exactly the same knowledge</text><text x="450" y="620" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">The syllabus example lists are suggested, not prescribed, and not exhaustive.</text>
</svg>