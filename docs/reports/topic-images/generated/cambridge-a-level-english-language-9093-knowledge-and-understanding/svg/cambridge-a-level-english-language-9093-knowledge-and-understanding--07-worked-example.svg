<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 715" width="900" height="715" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="715" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Knowledge in use: the island passage</text>

<rect x="40" y="112" width="820" height="120" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="64" y="145" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"By the third morning I had stopped checking my phone. The ferry left when it was full,</text><text x="64" y="171" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">not when the timetable said, and nobody on the quay seemed to mind. You learn quickly</text><text x="64" y="197" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">here: the island keeps its own time, and it is generous with it."</text><rect x="40" y="250" width="200" height="58" rx="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="140" y="277" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Form</text><text x="140" y="297" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">strand 1</text><line x1="242" y1="279" x2="268" y2="279" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="272" y="250" width="588" height="58" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="290" y="285" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">travel writing: first-person observer</text><rect x="40" y="320" width="200" height="58" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="140" y="347" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Aspect</text><text x="140" y="367" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">strand 2</text><line x1="242" y1="349" x2="268" y2="349" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="272" y="320" width="588" height="58" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="290" y="345" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">"had stopped": a change already complete; the</text><text x="290" y="365" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">narrator has adjusted</text><rect x="40" y="390" width="200" height="58" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="140" y="417" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Pronoun shift</text><text x="140" y="437" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">strand 2</text><line x1="242" y1="419" x2="268" y2="419" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="272" y="390" width="588" height="58" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="290" y="425" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">"I" to generic "you": experience becomes advice</text><rect x="40" y="460" width="200" height="58" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="140" y="487" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Personification</text><text x="140" y="507" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">strand 2</text><line x1="242" y1="489" x2="268" y2="489" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="272" y="460" width="588" height="58" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="290" y="485" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">"the island keeps its own time": a place with</text><text x="290" y="505" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">character</text><rect x="40" y="530" width="200" height="58" rx="10" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="140" y="557" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Audience</text><text x="140" y="577" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">strand 3</text><line x1="242" y1="559" x2="268" y2="559" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="272" y="530" width="588" height="58" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="290" y="555" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">implied reader is busy, tied to a phone: the text</text><text x="290" y="575" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">sells escape</text><rect x="40" y="600" width="200" height="58" rx="10" fill="#efdfa8" stroke="#1e2a44" stroke-width="2"/><text x="140" y="627" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Purpose</text><text x="140" y="647" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">strand 4</text><line x1="242" y1="629" x2="268" y2="629" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="272" y="600" width="588" height="58" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="290" y="635" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">describes, entertains and quietly persuades</text><text x="450" y="690" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="middle">Each label is joined to an effect and to the reader.</text>
</svg>