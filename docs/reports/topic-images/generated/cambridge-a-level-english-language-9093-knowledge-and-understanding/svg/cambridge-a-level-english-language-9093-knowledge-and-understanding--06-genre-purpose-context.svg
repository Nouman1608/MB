<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Genre, purpose and context make meaning</text>

<rect x="250" y="115" width="400" height="70" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="450" y="158" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle" font-style="italic">"The water is not safe"</text><line x1="450" y1="185" x2="170" y2="232" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="40" y="238" width="260" height="110" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="170" y="274" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">on a sign</text><text x="170" y="312" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">a warning</text><line x1="450" y1="185" x2="450" y2="232" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="320" y="238" width="260" height="110" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="274" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">in a story</text><text x="450" y="312" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">a plot point</text><line x1="450" y1="185" x2="730" y2="232" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="600" y="238" width="260" height="110" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="730" y="274" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">in an editorial</text><text x="730" y="312" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">a political accusation</text><text x="450" y="392" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Genre, purpose and context explain meaning together</text><rect x="40" y="410" width="820" height="120" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="64" y="445" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Purposes stack: one usually serves another</text><rect x="64" y="462" width="200" height="50" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="164" y="493" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">informs</text><text x="330" y="493" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">in order to</text><line x1="390" y1="487" x2="420" y2="487" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="426" y="462" width="200" height="50" rx="10" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2"/><text x="526" y="493" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">persuade</text><text x="745" y="493" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">a charity leaflet</text>
