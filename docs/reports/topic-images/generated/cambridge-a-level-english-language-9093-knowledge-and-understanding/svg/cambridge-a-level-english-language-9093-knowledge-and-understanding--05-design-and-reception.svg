<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 635" width="900" height="635" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="635" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Audience in design and reception</text>

<rect x="40" y="160" width="180" height="90" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="3"/><text x="130" y="200" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Writer</text><text x="130" y="226" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">designs</text><line x1="222" y1="205" x2="352" y2="205" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="358" y="160" width="184" height="90" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="450" y="212" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Text</text><line x1="544" y1="205" x2="674" y2="205" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="680" y="160" width="180" height="90" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="3"/><text x="770" y="200" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Readers</text><text x="770" y="226" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">receive</text><text x="287" y="145" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">DESIGN</text><text x="609" y="145" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">RECEPTION</text><rect x="40" y="275" width="400" height="175" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="64" y="308" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Design choices</text><text x="64" y="338" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">register</text><text x="64" y="359" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">assumed knowledge</text><text x="64" y="380" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">forms of address</text><text x="64" y="401" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">what is explained, what is taken</text><text x="64" y="422" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">for granted</text><rect x="460" y="275" width="400" height="175" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="484" y="308" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="start">Reception can differ from intention</text><text x="484" y="338" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">a text read years later, or in a</text><text x="484" y="359" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">different country, can be received</text><text x="484" y="380" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">in a way its writer never planned</text><rect x="40" y="470" width="260" height="140" rx="14" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2.5"/><text x="58" y="502" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Primary and secondary</text><text x="58" y="524" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">audiences</text><text x="58" y="554" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">a school newsletter is for</text><text x="58" y="574" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">parents, but pupils read it</text><text x="58" y="594" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">too</text><rect x="320" y="470" width="260" height="140" rx="14" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2.5"/><text x="338" y="502" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Implied reader</text><text x="338" y="532" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"You already know the</text><text x="338" y="552" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">feeling of a Monday morning</text><text x="338" y="572" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">commute": a working adult</text><rect x="600" y="470" width="260" height="140" rx="14" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2.5"/><text x="618" y="502" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Assumed knowledge</text><text x="618" y="532" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">unexplained references</text><text x="618" y="552" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">reveal who the writer</text><text x="618" y="572" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">expects to understand</text>
</svg>