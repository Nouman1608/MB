<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 740" width="900" height="740" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="740" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Conventions exist to do a job</text>

<text x="140" y="130" font-size="16" font-weight="700" fill="#4a5568" text-anchor="middle">Form</text><text x="405" y="130" font-size="16" font-weight="700" fill="#4a5568" text-anchor="middle">Typical conventions</text><text x="720" y="130" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">The job they do for a reader</text><rect x="40" y="145" width="200" height="58" rx="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="140" y="180" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Editorial</text><rect x="252" y="145" width="306" height="58" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="268" y="170" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">institutional "we", a clear</text><text x="268" y="190" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">stance</text><line x1="560" y1="174" x2="586" y2="174" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="590" y="145" width="270" height="58" rx="10" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2"/><text x="606" y="170" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">present the view as</text><text x="606" y="190" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">considered and collective</text><rect x="40" y="215" width="200" height="58" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="140" y="250" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Review</text><rect x="252" y="215" width="306" height="58" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="268" y="240" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">criteria, a verdict, often a</text><text x="268" y="260" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">rating</text><line x1="560" y1="244" x2="586" y2="244" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="590" y="215" width="270" height="58" rx="10" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2"/><text x="606" y="240" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">help a reader decide; build</text><text x="606" y="260" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">authority</text><rect x="40" y="285" width="200" height="58" rx="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="140" y="320" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Travel writing</text><rect x="252" y="285" width="306" height="58" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="268" y="320" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">first person, sensory detail</text><line x1="560" y1="314" x2="586" y2="314" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="590" y="285" width="270" height="58" rx="10" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2"/><text x="606" y="310" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">experience a place through</text><text x="606" y="330" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">one observer</text><rect x="40" y="355" width="200" height="58" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="140" y="390" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Investigative</text><rect x="252" y="355" width="306" height="58" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="268" y="380" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">attributed sources, a withheld</text><text x="268" y="400" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">revelation</text><line x1="560" y1="384" x2="586" y2="384" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="590" y="355" width="270" height="58" rx="10" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2"/><text x="606" y="380" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">build credibility and</text><text x="606" y="400" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">suspense together</text><rect x="40" y="425" width="200" height="58" rx="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="140" y="460" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Speech or podcast</text><rect x="252" y="425" width="306" height="58" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="268" y="460" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">signposting, repetition, threes</text><line x1="560" y1="454" x2="586" y2="454" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="590" y="425" width="270" height="58" rx="10" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2"/><text x="606" y="450" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">help a listener who cannot</text><text x="606" y="470" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">reread</text><rect x="40" y="495" width="200" height="58" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="140" y="530" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Diary</text><rect x="252" y="495" width="306" height="58" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="268" y="530" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">dated entries, private reference</text><line x1="560" y1="524" x2="586" y2="524" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="590" y="495" width="270" height="58" rx="10" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2"/><text x="606" y="520" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">signal a reader not meant to</text><text x="606" y="540" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">be there</text><rect x="40" y="565" width="200" height="58" rx="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="140" y="600" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Leaflet</text><rect x="252" y="565" width="306" height="58" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="268" y="600" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">headings, bullets, imperatives</text><line x1="560" y1="594" x2="586" y2="594" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="590" y="565" width="270" height="58" rx="10" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2"/><text x="606" y="600" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">let a reader scan and act</text><rect x="40" y="645" width="820" height="70" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="676" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Notice when a writer follows a convention, and when they break it:</text><text x="450" y="700" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">a travel blog that switches to bullet points has moved from storytelling to advice.</text>
</svg>