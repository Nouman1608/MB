<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 702" width="900" height="702" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="702" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Actions at three levels</text>

<rect x="30" y="104" width="268" height="240" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="133" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">GLOBAL</text><text x="46" y="159.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Paris Agreement</text><text x="46" y="187.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="61.2" y="187.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Almost every country takes</text><text x="61.2" y="208.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">part.</text><text x="46" y="234.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="61.2" y="234.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Targets set nationally, so</text><text x="61.2" y="255.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">it depends on countries</text><text x="61.2" y="276.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">keeping promises.</text><text x="46" y="302.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="61.2" y="302.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">COP27 (2022): a fund for</text><text x="61.2" y="323.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">“loss and damage”.</text><rect x="316" y="104" width="268" height="240" rx="14" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><text x="332" y="133" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">NATIONAL</text><text x="332" y="159.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Policy tools</text><text x="332" y="187.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="347.2" y="187.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Carbon taxes</text><text x="332" y="213.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="347.2" y="213.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Subsidies for renewables</text><text x="332" y="239.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="347.2" y="239.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Building codes</text><rect x="602" y="104" width="268" height="240" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="618" y="133" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">LOCAL</text><text x="618" y="159.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Community action</text><text x="618" y="187.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="633.2" y="187.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Community solar</text><text x="618" y="213.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="633.2" y="213.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Insulation schemes</text><text x="618" y="239.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="633.2" y="239.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">School energy audits</text><text x="450" y="386" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Judging a rooftop solar subsidy: speed or fairness?</text><rect x="30" y="408" width="408" height="156" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="443.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Subsidy for everyone</text><text x="50" y="471.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="471.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Cuts total emissions.</text><text x="50" y="497.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="497.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Wealthier districts install most panels;</text><text x="65.2" y="518.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">poorer families still pay full price for</text><text x="65.2" y="539.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">grid power.</text><rect x="462" y="408" width="408" height="156" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="482" y="443.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Targeted at low-income homes</text><text x="482" y="471.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="497.2" y="471.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Fairer.</text><text x="482" y="497.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="497.2" y="497.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Costs more per panel installed.</text><rect x="30" y="582" width="840" height="90" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="618" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Judgement</text><text x="50" y="647.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The best choice depends on whether the government values speed or fairness more.</text>
</svg>