<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">One decision, two readings: Germany’s nuclear closure</text>

<rect x="160" y="104" width="580" height="86" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="139.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">15 April 2023: Germany shuts its last three</text><text x="450" y="164.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">nuclear power stations</text><line x1="215" y1="258" x2="685" y2="258" stroke="#1e2a44" stroke-width="7" stroke-linecap="round"/><path d="M450,258 L420,350 L480,350 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><circle cx="450" cy="258" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><line x1="215" y1="258" x2="160" y2="313" stroke="#1e2a44" stroke-width="2.5"/><line x1="215" y1="258" x2="270" y2="313" stroke="#1e2a44" stroke-width="2.5"/><path d="M140,313 L290,313 Q275,340 215,340 Q155,340 140,313 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><line x1="685" y1="258" x2="630" y2="313" stroke="#1e2a44" stroke-width="2.5"/><line x1="685" y1="258" x2="740" y2="313" stroke="#1e2a44" stroke-width="2.5"/><path d="M610,313 L760,313 Q745,340 685,340 Q625,340 610,313 Z" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="215" y="362" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">supporters</text><text x="685" y="362" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">critics</text><rect x="30" y="386" width="405" height="139" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="422" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Supporters pointed to</text><text x="50" y="451.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="451.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Safety risks</text><text x="50" y="478.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="478.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Nuclear waste risks</text><rect x="465" y="386" width="405" height="139" rx="14" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="485" y="422" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="start">Critics argued</text><text x="485" y="451.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="501.15" y="451.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Nuclear is a low-carbon source</text><text x="485" y="478.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="501.15" y="478.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Closing it could mean burning more</text><text x="501.15" y="500.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">fossil fuel</text><rect x="30" y="543" width="840" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="579" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Your evaluation</text><text x="50" y="608.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">What evidence does each side use, does its reasoning hold, and does it have a vested</text><text x="50" y="630.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">interest?</text>
</svg>