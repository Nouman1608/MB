<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 667" width="900" height="667" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="667" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Narrowing climate and energy into issues</text>

<rect x="30" y="104" width="840" height="137" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="137" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">GLOBAL</text><text x="450" y="163.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">How fast should countries cut greenhouse gas emissions, and who should</text><text x="450" y="188.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">pay?</text><text x="450" y="216.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Paris Agreement (2015): well below 2°C, pursuing 1.5°C</text><line x1="450" y1="245" x2="450" y2="275" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="90" y="279" width="720" height="112" rx="14" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="312" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">NATIONAL</text><text x="450" y="338.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">How should a country produce its electricity?</text><text x="450" y="366.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Coal, gas, nuclear, hydro, solar, wind: different costs, risks and emissions</text><line x1="450" y1="395" x2="450" y2="425" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="150" y="429" width="600" height="110" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="462" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">LOCAL</text><text x="450" y="488.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Rising family energy bills, a new mine or wind farm</text><text x="450" y="513.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">near a town, or a school wasting electricity</text><rect x="30" y="557" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="590.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Look for a problem at each level: the topic is too broad to analyse until it is narrowed</text><text x="50" y="612.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">into issues.</text>
</svg>