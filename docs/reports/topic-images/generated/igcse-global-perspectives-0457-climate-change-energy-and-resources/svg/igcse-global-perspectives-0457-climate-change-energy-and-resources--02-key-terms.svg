<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 509" width="900" height="509" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="509" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Two pairs of terms not to mix up</text>

<rect x="30" y="104" width="408" height="138" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="137" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">MITIGATION</text><text x="50" y="164.8" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Reduce the causes</text><text x="50" y="195.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Action that tackles why climate change</text><text x="50" y="217.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">happens, such as cutting emissions.</text><rect x="462" y="104" width="408" height="138" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="482" y="137" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">ADAPTATION</text><text x="482" y="164.8" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Cope with the effects</text><text x="482" y="195.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Action to live with the changes, such as</text><text x="482" y="217.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">flood defences.</text><rect x="30" y="260" width="408" height="116" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="293" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">RENEWABLE</text><text x="50" y="320.8" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Replaced naturally</text><text x="50" y="351.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Wind, sunlight.</text><rect x="462" y="260" width="408" height="116" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="482" y="293" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">NON-RENEWABLE</text><text x="482" y="320.8" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Runs out once used</text><text x="482" y="351.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Coal, oil, gas.</text><rect x="30" y="394" width="840" height="85" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="427" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ENERGY SECURITY</text><text x="50" y="453.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Reliable, affordable energy without depending too much on others</text>
</svg>