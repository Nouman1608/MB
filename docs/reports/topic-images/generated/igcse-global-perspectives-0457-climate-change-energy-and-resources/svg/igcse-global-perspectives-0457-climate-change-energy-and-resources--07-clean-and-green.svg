<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 524" width="900" height="524" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="524" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A weak source and a strong one</text>

<rect x="30" y="104" width="408" height="236" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="137" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">WEAKER</text><text x="50" y="163.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Energy company leaflet</text><text x="50" y="188.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">(fictional)</text><text x="50" y="216.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="216.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Calls its new gas plant “clean and green”.</text><text x="50" y="242.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="242.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Profits if the plant is approved: vested</text><text x="65.2" y="263.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">interest.</text><text x="50" y="289.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="289.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Emotive language, not data.</text><text x="50" y="315.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="315.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">No emissions figures to compare.</text><rect x="462" y="104" width="408" height="236" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="482" y="137" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STRONGER, BUT WITH LIMITS</text><text x="482" y="163.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">IPCC assessment reports</text><text x="482" y="191.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="497.2" y="191.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Summarise many published studies.</text><text x="482" y="217.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="497.2" y="217.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Go through review.</text><text x="482" y="243.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="497.2" y="243.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Projections are ranges that depend on</text><text x="497.2" y="264.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">future emissions.</text><text x="482" y="290.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="497.2" y="290.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Do not quote one figure as a certainty.</text><text x="450" y="378" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Reliability checklist</text><rect x="170.8" y="404" width="337.59999999999997" height="40" rx="20" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="339.6" y="429.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Who wrote it, and their expertise</text><rect x="520.4" y="404" width="208.79999999999998" height="40" rx="20" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="624.8" y="429.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">When it was written</text><rect x="69.60000000000002" y="454" width="282.4" height="40" rx="20" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="210.8" y="479.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">How the data were collected</text><rect x="364" y="454" width="208.79999999999998" height="40" rx="20" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="468.4" y="479.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Any vested interest</text><rect x="584.8" y="454" width="245.6" height="40" rx="20" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="707.5999999999999" y="479.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Do other sources agree?</text>
</svg>