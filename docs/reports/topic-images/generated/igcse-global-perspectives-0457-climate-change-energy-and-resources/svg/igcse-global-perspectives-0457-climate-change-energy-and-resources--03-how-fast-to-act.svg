<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 698" width="900" height="698" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="698" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Same science, different views on speed</text>

<line x1="70" y1="240" x2="830" y2="240" stroke="#1e2a44" stroke-width="4" marker-start="url(#ah)" marker-end="url(#ah)"/><text x="60" y="282" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Strong, fast cuts</text><text x="840" y="282" font-size="18" font-weight="700" fill="#b5602e" text-anchor="end">Stress the cost of fast change</text><circle cx="114" cy="240" r="11" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><line x1="114" y1="229" x2="114" y2="216" stroke="#1e2a44" stroke-width="2.5"/><g transform="translate(0,128)"><rect x="30" y="0" width="250" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="155" y="25.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Low-lying island states</text><text x="155" y="52" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Rising seas threaten their</text><text x="155" y="72" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">land.</text></g><circle cx="450" cy="240" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><line x1="450" y1="251" x2="450" y2="310" stroke="#1e2a44" stroke-width="2.5"/><g transform="translate(0,310)"><rect x="325" y="0" width="250" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="25.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Many developing</text><text x="450" y="47.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">countries</text><text x="450" y="74" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Those who industrialised and</text><text x="450" y="94" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">emitted first should do more</text><text x="450" y="114" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">and pay more.</text></g><circle cx="786" cy="240" r="11" fill="#b5602e" stroke="#1e2a44" stroke-width="3"/><line x1="786" y1="229" x2="786" y2="216" stroke="#1e2a44" stroke-width="2.5"/><g transform="translate(0,106)"><rect x="620" y="0" width="250" height="110" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="745" y="25.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Oil, gas and coal</text><text x="745" y="47.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">earners</text><text x="745" y="74" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Lost jobs and lost government</text><text x="745" y="94" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">income.</text></g><rect x="30" y="458" width="840" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="494" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Why they differ</text><text x="50" y="523.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Who carries the cost, and when. A mining region loses jobs now; an island state risks</text><text x="50" y="545.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">losing homes later. The disagreement is not about the science.</text><rect x="30" y="588" width="840" height="80" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="621.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A group with a vested interest can still be well supported. Judge the reasoning, not just</text><text x="50" y="643.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">the speaker.</text>
</svg>