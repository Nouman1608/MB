<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 583" width="900" height="583" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="583" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Consent, confidentiality, harm</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Name the issue, say where it is hard, say how to address it</text>
<rect x="168" y="120" width="228.66666666666666" height="44" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="282.3333333333333" y="147.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Consent</text><rect x="404.66666666666663" y="120" width="228.66666666666666" height="44" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="519" y="147.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Confidentiality</text><rect x="641.3333333333333" y="120" width="228.66666666666666" height="44" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="755.6666666666666" y="147.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Harm</text><rect x="30" y="172" width="130" height="114" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="223.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">What it</text><text x="42" y="245.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">means</text><rect x="168" y="172" width="228.66666666666666" height="114" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="182" y="202.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Agreeing freely, knowing</text><text x="182" y="223.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the aims, tasks, use of</text><text x="182" y="244.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">data and right to</text><text x="182" y="265.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">withdraw</text><rect x="404.66666666666663" y="172" width="228.66666666666666" height="114" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="418.66666666666663" y="202.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Information kept private;</text><text x="418.66666666666663" y="223.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">not shared in a way that</text><text x="418.66666666666663" y="244.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">identifies people</text><rect x="641.3333333333333" y="172" width="228.66666666666666" height="114" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="655.3333333333333" y="202.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">No physical, emotional,</text><text x="655.3333333333333" y="223.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">social or legal damage</text><rect x="30" y="294" width="130" height="114" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="345.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Hardest</text><text x="42" y="367.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">with</text><rect x="168" y="294" width="228.66666666666666" height="114" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="182" y="324.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Children; vulnerable</text><text x="182" y="345.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">people; covert research;</text><text x="182" y="366.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">institutions; newcomers</text><text x="182" y="387.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">to observed groups</text><rect x="404.66666666666663" y="294" width="228.66666666666666" height="114" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="418.66666666666663" y="324.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Small communities; focus</text><text x="418.66666666666663" y="345.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">groups; data storage;</text><text x="418.66666666666663" y="366.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">disclosures of serious</text><text x="418.66666666666663" y="387.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">harm</text><rect x="641.3333333333333" y="294" width="228.66666666666666" height="114" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="655.3333333333333" y="324.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Sensitive topics;</text><text x="655.3333333333333" y="345.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">criminal groups;</text><text x="655.3333333333333" y="366.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">labelling; covert</text><text x="655.3333333333333" y="387.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">research</text><rect x="30" y="416" width="130" height="135" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="477.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">How to</text><text x="42" y="499.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">address</text><rect x="168" y="416" width="228.66666666666666" height="135" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="182" y="446.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Information sheets;</text><text x="182" y="467.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">written consent; parental</text><text x="182" y="488.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">consent for under-18s;</text><text x="182" y="509.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">right to withdraw; check</text><text x="182" y="530.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">again if research changes</text><rect x="404.66666666666663" y="416" width="228.66666666666666" height="135" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="418.66666666666663" y="446.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Pseudonyms; secure</text><text x="418.66666666666663" y="467.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">storage under data</text><text x="418.66666666666663" y="488.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">protection law; anonymous</text><text x="418.66666666666663" y="509.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">questionnaires; explain</text><text x="418.66666666666663" y="530.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">limits first</text><rect x="641.3333333333333" y="416" width="228.66666666666666" height="135" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="655.3333333333333" y="446.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Pilot questions; let</text><text x="655.3333333333333" y="467.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">people skip or stop;</text><text x="655.3333333333333" y="488.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">debrief; support</text><text x="655.3333333333333" y="509.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">contacts; protect</text><text x="655.3333333333333" y="530.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">identities</text>
</svg>