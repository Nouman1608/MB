<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 809" width="900" height="809" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="809" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Covert research: the central debate</text>

<path d="M410,300 L450,216 L490,300 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><rect x="150" y="203" width="600" height="14" rx="6" fill="#1e2a44"/><text x="250" y="190" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Value of the knowledge</text><text x="650" y="190" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">Ethical costs</text><text x="450" y="130" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Covert observation breaks informed consent and often involves deception</text><rect x="30" y="320" width="405" height="276" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,370 L31.25,334.25 Q31.25,321.25 44.25,321.25 L420.75,321.25 Q433.75,321.25 433.75,334.25 L433.75,370 Z" fill="#b5d3cf"/><line x1="31.25" y1="370" x2="433.75" y2="370" stroke="#c9d6d4" stroke-width="2"/><text x="232.5" y="351" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">For</text><circle cx="49" cy="395.92" r="4.5" fill="#2e6b62"/><text x="62" y="401.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Some groups would never allow open study: it</text><text x="62" y="422.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">may be the only way</text><circle cx="49" cy="445.92" r="4.5" fill="#2e6b62"/><text x="62" y="451.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">People behave naturally: high validity, no</text><text x="62" y="472.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">observer effect</text><circle cx="49" cy="495.92" r="4.5" fill="#2e6b62"/><text x="62" y="501.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Knowledge may benefit society, e.g. revealing</text><text x="62" y="522.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">harmful practices</text><rect x="465" y="320" width="405" height="276" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M466.25,370 L466.25,334.25 Q466.25,321.25 479.25,321.25 L855.75,321.25 Q868.75,321.25 868.75,334.25 L868.75,370 Z" fill="#f2e7b8"/><line x1="466.25" y1="370" x2="868.75" y2="370" stroke="#c9d6d4" stroke-width="2"/><text x="667.5" y="351" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Against</text><circle cx="484" cy="395.92" r="4.5" fill="#2e6b62"/><text x="497" y="401.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Deception breaks trust and ignores the right</text><text x="497" y="422.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">to choose</text><circle cx="484" cy="445.92" r="4.5" fill="#2e6b62"/><text x="497" y="451.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Researcher may witness or be drawn into</text><text x="497" y="472.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">illegal acts</text><circle cx="484" cy="495.92" r="4.5" fill="#2e6b62"/><text x="497" y="501.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Participants may be harmed if identified or</text><text x="497" y="522.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">feel betrayed</text><circle cx="484" cy="545.9200000000001" r="4.5" fill="#2e6b62"/><text x="497" y="551.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Can make other groups less willing to take</text><text x="497" y="572.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">part</text><rect x="30" y="614" width="840" height="171" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="650" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Possible compromises</text><circle cx="61" cy="673.39" r="4.5" fill="#8a6d0d"/><text x="74" y="679" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Protect identities carefully</text><circle cx="61" cy="703.39" r="4.5" fill="#8a6d0d"/><text x="74" y="709" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Seek consent after the observation ends, before publishing</text><circle cx="61" cy="733.39" r="4.5" fill="#8a6d0d"/><text x="74" y="739" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Use covert methods only when no open method could work and the benefits are significant</text><text x="74" y="761" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">(many ethics committees allow it only in exceptional cases)</text>
</svg>