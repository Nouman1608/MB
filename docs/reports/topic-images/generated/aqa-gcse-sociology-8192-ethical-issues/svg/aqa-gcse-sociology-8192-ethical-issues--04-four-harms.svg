<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 518" width="900" height="518" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="518" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four kinds of harm to participants</text>

<rect x="30" y="108" width="201" height="189" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,158 L31.25,122.25 Q31.25,109.25 44.25,109.25 L216.75,109.25 Q229.75,109.25 229.75,122.25 L229.75,158 Z" fill="#b5d3cf"/><line x1="31.25" y1="158" x2="229.75" y2="158" stroke="#c9d6d4" stroke-width="2"/><text x="130.5" y="138.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Physical</text><text x="44" y="189.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Danger, for example</text><text x="44" y="210.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">if an abusive partner</text><text x="44" y="231.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">finds out about a</text><text x="44" y="252.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">domestic violence</text><text x="44" y="273.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">study</text><rect x="243" y="108" width="201" height="189" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M244.25,158 L244.25,122.25 Q244.25,109.25 257.25,109.25 L429.75,109.25 Q442.75,109.25 442.75,122.25 L442.75,158 Z" fill="#dce9e7"/><line x1="244.25" y1="158" x2="442.75" y2="158" stroke="#c9d6d4" stroke-width="2"/><text x="343.5" y="138.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Emotional</text><text x="257" y="189.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Distressing memories</text><text x="257" y="210.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">on sensitive topics:</text><text x="257" y="231.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">bereavement, divorce,</text><text x="257" y="252.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">bullying, self-harm</text><rect x="456" y="108" width="201" height="189" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M457.25,158 L457.25,122.25 Q457.25,109.25 470.25,109.25 L642.75,109.25 Q655.75,109.25 655.75,122.25 L655.75,158 Z" fill="#f2e7b8"/><line x1="457.25" y1="158" x2="655.75" y2="158" stroke="#c9d6d4" stroke-width="2"/><text x="556.5" y="138.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Social</text><text x="470" y="189.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Harm to relationships</text><text x="470" y="210.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">or reputation, e.g. a</text><text x="470" y="231.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">study labelling</text><text x="470" y="252.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“bottom set” pupils</text><text x="470" y="273.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">as failures</text><rect x="669" y="108" width="201" height="189" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M670.25,158 L670.25,122.25 Q670.25,109.25 683.25,109.25 L855.75,109.25 Q868.75,109.25 868.75,122.25 L868.75,158 Z" fill="#d4b02e"/><line x1="670.25" y1="158" x2="868.75" y2="158" stroke="#c9d6d4" stroke-width="2"/><text x="769.5" y="138.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Legal</text><text x="683" y="189.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Exposure to arrest,</text><text x="683" y="210.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">e.g. criminal groups</text><text x="683" y="231.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">identified and</text><text x="683" y="252.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">punished</text><rect x="30" y="315" width="840" height="179" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="351" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">How harm can be reduced</text><circle cx="61" cy="374.39" r="4.5" fill="#8a6d0d"/><text x="74" y="380" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Avoid unnecessary distressing questions; pilot questions first</text><circle cx="61" cy="404.39" r="4.5" fill="#8a6d0d"/><text x="74" y="410" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Let participants skip questions or stop at any time</text><circle cx="61" cy="434.39" r="4.5" fill="#8a6d0d"/><text x="74" y="440" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Debrief</tspan> at the end; give contacts for helplines or counsellors</text><circle cx="61" cy="464.39" r="4.5" fill="#8a6d0d"/><text x="74" y="470" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Protect identities; consider harm to the researcher too</text>
</svg>