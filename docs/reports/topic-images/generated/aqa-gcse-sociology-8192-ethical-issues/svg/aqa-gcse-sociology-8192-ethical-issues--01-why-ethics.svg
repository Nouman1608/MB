<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 603" width="900" height="603" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="603" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why ethics matter</text>

<rect x="250" y="112" width="400" height="70" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="145" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Ethical guidelines</text><text x="450" y="170" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">protect three things</text><line x1="360" y1="186" x2="170" y2="222" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="450" y1="186" x2="450" y2="222" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="540" y1="186" x2="730" y2="222" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="226" width="269.3333333333333" height="194" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,298 L31.25,240.25 Q31.25,227.25 44.25,227.25 L285.0833333333333,227.25 Q298.0833333333333,227.25 298.0833333333333,240.25 L298.0833333333333,298 Z" fill="#b5d3cf"/><line x1="31.25" y1="298" x2="298.0833333333333" y2="298" stroke="#c9d6d4" stroke-width="2"/><text x="164.66666666666666" y="267.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Participants</text><text x="44" y="330.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Their wellbeing, reputations</text><text x="44" y="352.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">and relationships, often in</text><text x="44" y="374.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">private, painful or illegal</text><text x="44" y="396.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">parts of life</text><rect x="315.3333333333333" y="226" width="269.3333333333333" height="194" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M316.5833333333333,298 L316.5833333333333,240.25 Q316.5833333333333,227.25 329.5833333333333,227.25 L570.4166666666666,227.25 Q583.4166666666666,227.25 583.4166666666666,240.25 L583.4166666666666,298 Z" fill="#dce9e7"/><line x1="316.5833333333333" y1="298" x2="583.4166666666666" y2="298" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="255.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">The reputation of</text><text x="450" y="280.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">research</text><text x="329.3333333333333" y="330.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">So that people continue to</text><text x="329.3333333333333" y="352.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">take part</text><rect x="600.6666666666666" y="226" width="269.3333333333333" height="194" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.9166666666666,298 L601.9166666666666,240.25 Q601.9166666666666,227.25 614.9166666666666,227.25 L855.75,227.25 Q868.75,227.25 868.75,240.25 L868.75,298 Z" fill="#f2e7b8"/><line x1="601.9166666666666" y1="298" x2="868.75" y2="298" stroke="#c9d6d4" stroke-width="2"/><text x="735.3333333333333" y="267.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Researchers</text><text x="614.6666666666666" y="330.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Who may also face risks</text><rect x="30" y="438" width="840" height="141" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="474" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">In the UK</text><circle cx="61" cy="497.39" r="4.5" fill="#8a6d0d"/><text x="74" y="503" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Sociologists follow the British Sociological Association’s <tspan font-weight="700">Statement of Ethical Practice</tspan></text><circle cx="61" cy="527.39" r="4.5" fill="#8a6d0d"/><text x="74" y="533" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Universities usually require an <tspan font-weight="700">ethics committee</tspan> to approve research plans before work</text><text x="74" y="555" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">begins</text>
</svg>