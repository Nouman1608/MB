<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 591" width="900" height="591" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="591" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">An “explain how” answer, mapped</text>

<text x="450" y="96" font-size="20" font-weight="400" fill="#4a5568" text-anchor="middle">Interviewing teenagers about cyberbullying</text><rect x="30" y="122" width="230" height="84" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="145" y="171" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Consent</text><line x1="264" y1="164" x2="290" y2="164" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="294" y="122" width="576" height="84" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="310" y="158.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Information sheet for teenagers and parents; written consent from</text><text x="310" y="180.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">both; can withdraw at any time</text><rect x="30" y="218" width="230" height="84" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="145" y="267" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Confidentiality</text><line x1="264" y1="260" x2="290" y2="260" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="294" y="218" width="576" height="84" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="310" y="243.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Pseudonyms; do not name the school; store recordings securely</text><text x="310" y="265.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">under data protection law; explain she must pass on a serious</text><text x="310" y="287.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">risk</text><rect x="30" y="314" width="230" height="84" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="145" y="363" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Harm</text><line x1="264" y1="356" x2="290" y2="356" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="294" y="314" width="576" height="84" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="310" y="350.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Let them skip painful questions; debrief at the end; give</text><text x="310" y="372.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">contacts for support services</text><rect x="30" y="418" width="840" height="149" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="454" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Why it works</text><circle cx="61" cy="477.39" r="4.5" fill="#8a6d0d"/><text x="74" y="483" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Covers all three issues the specification names</text><circle cx="61" cy="507.39" r="4.5" fill="#8a6d0d"/><text x="74" y="513" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Gives specific actions, not just the issue</text><circle cx="61" cy="537.39" r="4.5" fill="#8a6d0d"/><text x="74" y="543" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Fits each action to the topic and the group (under-18s)</text>
</svg>