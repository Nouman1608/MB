<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 714" width="900" height="714" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="714" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Self-defence in English law and Article 2</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">s76 Criminal Justice and Immigration Act 2008</text>
<line x1="60" y1="144" x2="60" y2="401" stroke="#c9d6d4" stroke-width="4"/><rect x="104" y="124" width="766" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="156.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Judge the facts as D genuinely believed them</text><text x="122" y="185.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Even if the belief was mistaken.</text><circle cx="60" cy="166" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="174.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="104" y="220" width="766" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="252.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Was the force reasonable in those circumstances?</text><text x="122" y="281.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Disproportionate force is not reasonable.</text><circle cx="60" cy="262" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="270.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="104" y="316" width="766" height="105" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="348.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Householder cases</text><text x="122" y="377.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Only <tspan font-weight="700" fill="#1e2a44">grossly</tspan> disproportionate force is excluded. <tspan font-style="italic">R</tspan> <tspan font-style="italic">(Collins)</tspan> (2016): compatible with Article 2, as</text><text x="122" y="398.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">force must still be reasonable in all the circumstances.</text><circle cx="60" cy="368.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="377.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="30" y="443" width="412" height="108" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="487" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ENGLISH TEST</text><text x="50" y="513.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Honest belief; reasonable force</text><rect x="458" y="443" width="412" height="108" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="478" y="475" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ARTICLE 2.2</text><text x="478" y="501.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Lethal force only where “absolutely</text><text x="478" y="525.8199999999999" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">necessary”</text><rect x="30" y="573" width="840" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="607.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Da Silva v UK (2016): the de Menezes shooting</text><text x="50" y="636.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The Grand Chamber held the English honest belief test was <tspan font-weight="700" fill="#1e2a44">not</tspan> <tspan font-weight="700" fill="#1e2a44">significantly</tspan> <tspan font-weight="700" fill="#1e2a44">different</tspan> from the</text><text x="50" y="657.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Convention standard; not prosecuting individual officers did not breach the procedural duty.</text>
</svg>