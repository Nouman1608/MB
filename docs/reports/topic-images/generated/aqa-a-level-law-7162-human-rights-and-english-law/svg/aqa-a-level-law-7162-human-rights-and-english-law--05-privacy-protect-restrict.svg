<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 575" width="900" height="575" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="575" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Privacy: provisions that protect and restrict</text>

<rect x="130" y="100" width="370" height="40" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="315" y="127" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Protecting privacy</text><rect x="500" y="100" width="370" height="40" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="685" y="127" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Restricting privacy</text><rect x="30" y="140" width="100" height="136" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="80" y="214" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Criminal</text><text x="80" y="236" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">law</text><rect x="130" y="140" width="370" height="136" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><rect x="500" y="140" width="370" height="136" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="144" y="166" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="158.25" y="166" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Unlawful interception: Investigatory Powers</text><text x="158.25" y="186" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Act 2016</text><text x="144" y="210" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="158.25" y="210" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Computer Misuse Act 1990 s1</text><text x="144" y="234" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="158.25" y="234" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Protection from Harassment Act 1997</text><text x="144" y="258" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="158.25" y="258" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Data Protection Act 2018</text><text x="514" y="166" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="528.25" y="166" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">PACE entry, search and seizure (s8 warrants;</text><text x="528.25" y="186" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">s17, s18)</text><text x="514" y="210" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="528.25" y="210" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Stop and search</text><rect x="30" y="276" width="100" height="136" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="80" y="350" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Civil law</text><rect x="130" y="276" width="370" height="136" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><rect x="500" y="276" width="370" height="136" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="144" y="302" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="158.25" y="302" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Misuse of private information (<tspan font-style="italic">Campbell</tspan>;</text><text x="158.25" y="322" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Vidal-Hall</tspan>)</text><text x="144" y="346" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="158.25" y="346" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Breach of confidence</text><text x="144" y="370" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="158.25" y="370" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Damages and injunctions (<tspan font-style="italic">Mosley</tspan>; <tspan font-style="italic">PJS</tspan>)</text><text x="144" y="394" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="158.25" y="394" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Harassment and data protection claims</text><text x="514" y="302" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="528.25" y="302" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Investigatory Powers Act 2016 warrants</text><text x="528.25" y="322" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">approved by a Judicial Commissioner</text><text x="514" y="346" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="528.25" y="346" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Directed surveillance under RIPA 2000</text><rect x="30" y="434" width="840" height="109" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="468.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">PJS v News Group Newspapers (2016)</text><text x="50" y="497.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Injunction kept although the claimant’s identity was widely available online: further tabloid publication</text><text x="50" y="518.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">would still cause intrusion and distress.</text>
</svg>