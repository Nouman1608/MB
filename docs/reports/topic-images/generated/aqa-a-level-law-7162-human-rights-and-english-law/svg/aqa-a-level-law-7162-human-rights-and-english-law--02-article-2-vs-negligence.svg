<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 542" width="900" height="542" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="542" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Police failures: Article 2 or negligence?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">The Convention can reach further than tort</text>
<rect x="30" y="124" width="412" height="253" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ARTICLE 2 (HRA)</text><text x="50" y="182.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Operational duty: Osman v UK (1998)</text><text x="50" y="210.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="210.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Knew or ought to have known of a <tspan font-weight="700" fill="#1e2a44">real</tspan> <tspan font-weight="700" fill="#1e2a44">and</tspan></text><text x="65.2" y="231.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">immediate</tspan> <tspan font-weight="700" fill="#1e2a44">risk</tspan> to an identified individual, and</text><text x="65.2" y="252.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">failed to take reasonable measures</text><text x="50" y="281.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="281.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Van</tspan> <tspan font-style="italic">Colle</tspan> (2008): risk not reasonably</text><text x="65.2" y="302.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">knowable; no breach</text><text x="50" y="331.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="331.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Rabone</tspan> (2012): extended to a voluntary</text><text x="65.2" y="352.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">psychiatric patient</text><rect x="458" y="124" width="412" height="253" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="478" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">NEGLIGENCE (TORT)</text><text x="478" y="182.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">No general duty to protect the public from</text><text x="478" y="205.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">criminals</text><text x="478" y="233.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="493.2" y="233.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Hill</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">CC</tspan> <tspan font-style="italic">West</tspan> <tspan font-style="italic">Yorkshire</tspan> (1989)</text><text x="478" y="262.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="493.2" y="262.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Robinson</tspan> (2018): a duty where police positive</text><text x="493.2" y="283.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">acts cause physical injury</text><text x="478" y="312.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="493.2" y="312.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Dependants: Fatal Accidents Act 1976</text><rect x="30" y="399" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="433.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Michael v CC South Wales (2015)</text><text x="450" y="463.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Delayed response to a 999 call: <tspan font-weight="700" fill="#1e2a44">no</tspan> <tspan font-weight="700" fill="#1e2a44">duty</tspan> <tspan font-weight="700" fill="#1e2a44">in</tspan> <tspan font-weight="700" fill="#1e2a44">negligence</tspan>, but the <tspan font-weight="700" fill="#1e2a44">Article</tspan> <tspan font-weight="700" fill="#1e2a44">2</tspan> <tspan font-weight="700" fill="#1e2a44">claim</tspan> was allowed to go</text><text x="450" y="485.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">to trial.</text>
</svg>