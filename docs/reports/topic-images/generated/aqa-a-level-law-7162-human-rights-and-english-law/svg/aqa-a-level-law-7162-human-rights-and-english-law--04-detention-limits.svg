<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 685" width="900" height="685" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="685" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Deprivation of liberty: how long without charge?</text>

<rect x="40" y="100" width="58.57142857142858" height="40" rx="6" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="110.57142857142858" y="127" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">24 hours: PACE: detention without charge</text><rect x="40" y="154" width="87.85714285714286" height="40" rx="6" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="139.85714285714286" y="181" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">36 hours: with a superintendent’s authority</text><rect x="40" y="208" width="234.2857142857143" height="40" rx="6" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="286.28571428571433" y="235" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">96 hours: with magistrates’ warrants (PACE ss41–44)</text><rect x="40" y="262" width="820.0000000000001" height="40" rx="6" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="54" y="289" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">14 days: Terrorism Act 2000 Sch 8, with judicial extensions</text><text x="860" y="324" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">pre-charge detention limits; bars to scale</text><rect x="30" y="350" width="414" height="153" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="382" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STOP AND SEARCH</text><text x="50" y="408.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">PACE s1 and Code A</text><text x="50" y="436.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Reasonable grounds to suspect; s60 CJPOA</text><text x="50" y="457.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">1994 allows authorised searches without</text><text x="50" y="478.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">suspicion</text><rect x="456" y="350" width="414" height="153" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="476" y="382" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ARREST</text><text x="476" y="408.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">PACE s24 and s28</text><text x="476" y="436.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Reasonable grounds and necessity; told the fact</text><text x="476" y="457.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">of and grounds for arrest</text><rect x="30" y="521" width="414" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="553" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SAFEGUARD</text><text x="50" y="579.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">PACE s58</text><text x="50" y="607.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Right to consult a solicitor privately</text><rect x="456" y="521" width="414" height="132" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="476" y="553" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">REMEDIES</text><text x="476" y="579.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Habeas corpus; false imprisonment</text><text x="476" y="607.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Actionable without fault: <tspan font-style="italic">ex</tspan> <tspan font-style="italic">parte</tspan> <tspan font-style="italic">Evans</tspan> <tspan font-style="italic">(No</tspan> <tspan font-style="italic">2)</tspan></text><text x="476" y="628.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">(2001)</text>
</svg>