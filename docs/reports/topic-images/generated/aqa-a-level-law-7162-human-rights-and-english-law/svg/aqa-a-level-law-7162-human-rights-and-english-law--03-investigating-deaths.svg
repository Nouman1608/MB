<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Investigating deaths involving the state</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Meeting the Jordan v UK (2001) requirements</text>
<rect x="30" y="124" width="270.6666666666667" height="310" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">INQUESTS</text><text x="50" y="182.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Coroners and Justice Act</text><text x="50" y="205.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">2009</text><text x="50" y="233.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="233.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Jury where a death in state</text><text x="65.2" y="254.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">detention was violent,</text><text x="65.2" y="275.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">unnatural or of unknown</text><text x="65.2" y="296.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">cause</text><text x="50" y="325.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="325.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">R</tspan> <tspan font-style="italic">(Middleton)</tspan> (2004):</text><text x="65.2" y="346.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">examine <tspan font-weight="700" fill="#1e2a44">in</tspan> <tspan font-weight="700" fill="#1e2a44">what</tspan></text><text x="65.2" y="367.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">circumstances</tspan> the person</text><text x="65.2" y="388.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">died, not just by what</text><text x="65.2" y="409.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">means</text><rect x="314.6666666666667" y="124" width="270.6666666666667" height="310" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="334.6666666666667" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">POLICE CONTACT</text><text x="334.6666666666667" y="182.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Independent Office for</text><text x="334.6666666666667" y="205.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Police Conduct</text><text x="334.6666666666667" y="233.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="349.8666666666667" y="233.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Investigates deaths</text><text x="349.8666666666667" y="254.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">following police contact</text><rect x="599.3333333333334" y="124" width="270.6666666666667" height="310" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="619.3333333333334" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PUBLIC INQUIRIES</text><text x="619.3333333333334" y="182.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Inquiries Act 2005</text><text x="619.3333333333334" y="210.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="634.5333333333334" y="210.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">R</tspan> <tspan font-style="italic">(Amin)</tspan> (2003): a young</text><text x="634.5333333333334" y="231.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">prisoner murdered by his</text><text x="634.5333333333334" y="252.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">cellmate required an</text><text x="634.5333333333334" y="273.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">independent public</text><text x="634.5333333333334" y="294.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">investigation</text><rect x="30" y="456" width="413" height="176" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="488" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PLANNING (McCANN v UK, 1995)</text><text x="50" y="514.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The state answers for planning and</text><text x="50" y="537.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">control</text><text x="50" y="565.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">After the de Menezes shooting the Metropolitan</text><text x="50" y="586.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Police was convicted under the Health and</text><text x="50" y="607.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Safety at Work etc. Act 1974</text><rect x="457" y="456" width="413" height="176" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="488" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CRIMINAL LAW</text><text x="477" y="514.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Homicide offences protect life</text><text x="477" y="542.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Murder, voluntary and involuntary manslaughter;</text><text x="477" y="563.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Corporate Manslaughter and Corporate</text><text x="477" y="584.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Homicide Act 2007; Suicide Act 1961 s2</text>
</svg>