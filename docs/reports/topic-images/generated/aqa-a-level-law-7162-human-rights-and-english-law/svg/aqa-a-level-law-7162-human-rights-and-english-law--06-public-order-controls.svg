<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Expression, assembly and association</text>

<rect x="30" y="100" width="412" height="253" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">RESTRICTING EXPRESSION</text><text x="50" y="163.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="163.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Public Order Act 1986 ss4, 4A, 5; Parts 3 and</text><text x="65.2" y="184.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">3A</text><text x="50" y="211.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="211.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Communications Act 2003 s127 (<tspan font-style="italic">Chambers</tspan> <tspan font-style="italic">v</tspan></text><text x="65.2" y="232.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">DPP</tspan>: joke tweet, conviction quashed)</text><text x="50" y="259.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="259.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Contempt of Court Act 1981; Obscene</text><text x="65.2" y="280.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Publications Act 1959</text><text x="50" y="307.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="307.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Official Secrets Act 1989 (<tspan font-style="italic">R</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Shayler</tspan>: no</text><text x="65.2" y="328.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">public interest defence)</text><rect x="458" y="100" width="412" height="253" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="478" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PROTECTING EXPRESSION</text><text x="478" y="163.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="493.2" y="163.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">HRA 1998 s12</text><text x="478" y="190.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="493.2" y="190.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Defamation Act 2013: serious harm threshold</text><text x="493.2" y="211.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(s1), truth (s2), honest opinion (s3), public</text><text x="493.2" y="232.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">interest (s4)</text><clipPath id="tc375"><rect x="30" y="375" width="840" height="247" rx="14"/></clipPath><g clip-path="url(#tc375)"><rect x="30" y="375" width="298.0645161290323" height="42" fill="#b5d3cf"/><text x="41" y="399.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Assembly: Public Order Act 1986</text><rect x="328.0645161290323" y="375" width="541.9354838709677" height="42" fill="#b5d3cf"/><text x="339.0645161290323" y="399.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Power</text><rect x="30" y="417" width="298.0645161290323" height="41" fill="#dce9e7"/><text x="41" y="440.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">s11</text><rect x="328.0645161290323" y="417" width="541.9354838709677" height="41" fill="#ffffff"/><text x="339.0645161290323" y="440.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Advance notice of processions</text><line x1="30" y1="458" x2="870" y2="458" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="458" width="298.0645161290323" height="41" fill="#dce9e7"/><text x="41" y="481.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">s12 / s14</text><rect x="328.0645161290323" y="458" width="541.9354838709677" height="41" fill="#f8faf9"/><text x="339.0645161290323" y="481.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Conditions on processions / assemblies</text><line x1="30" y1="499" x2="870" y2="499" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="499" width="298.0645161290323" height="41" fill="#dce9e7"/><text x="41" y="522.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">s13</text><rect x="328.0645161290323" y="499" width="541.9354838709677" height="41" fill="#ffffff"/><text x="339.0645161290323" y="522.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Banning processions</text><line x1="30" y1="540" x2="870" y2="540" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="540" width="298.0645161290323" height="41" fill="#dce9e7"/><text x="41" y="563.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">s14A</text><rect x="328.0645161290323" y="540" width="541.9354838709677" height="41" fill="#f8faf9"/><text x="339.0645161290323" y="563.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Prohibiting trespassory assemblies</text><line x1="30" y1="581" x2="870" y2="581" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="581" width="298.0645161290323" height="41" fill="#dce9e7"/><text x="41" y="604.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Highways Act 1980 s137</text><rect x="328.0645161290323" y="581" width="541.9354838709677" height="41" fill="#ffffff"/><text x="339.0645161290323" y="604.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Obstruction offence, subject to lawful excuse (<tspan font-style="italic">DPP</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Ziegler</tspan>, 2021)</text></g><line x1="328.0645161290323" y1="375" x2="328.0645161290323" y2="622" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="375" width="840" height="247" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="644" width="840" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="678.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Association</text><text x="50" y="707.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Terrorism Act 2000: proscribed organisations, membership an offence. Public Order Act 1936: political</text><text x="50" y="728.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">uniforms and quasi-military organisations.</text>
