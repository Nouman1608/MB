<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 549" width="900" height="549" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="549" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: choosing the right route</text>

<rect x="30" y="100" width="840" height="111" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FACTS</text><text x="50" y="164.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Police receive repeated warnings that Carl has threatened to kill his former partner, Lena. They</text><text x="50" y="186.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">take no action. Carl attacks and kills her.</text><rect x="30" y="233" width="413" height="133" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="265" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CRIMINAL LAW</text><text x="50" y="291.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Carl: murder</text><text x="50" y="320.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Intention to kill or cause GBH</text><rect x="457" y="233" width="413" height="133" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="477" y="265" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ARTICLE 2</text><text x="477" y="291.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Osman test: points towards yes</text><text x="477" y="320.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Repeated specific threats point to a real and</text><text x="477" y="341.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">immediate risk to an identified person</text><rect x="30" y="384" width="413" height="133" rx="14" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="416" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">NEGLIGENCE</text><text x="50" y="442.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Weak claim</text><text x="50" y="471.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Hill</tspan> and <tspan font-style="italic">Michael</tspan>: no general duty; the Article 2</text><text x="50" y="492.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">claim under s7 HRA may proceed</text><rect x="457" y="384" width="413" height="133" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="416" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">INVESTIGATION</text><text x="477" y="442.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Inquest and IOPC</text><text x="477" y="471.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Inquest into in what circumstances she died</text><text x="477" y="492.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">(<tspan font-style="italic">Middleton</tspan>); IOPC investigation of police contact</text>
</svg>