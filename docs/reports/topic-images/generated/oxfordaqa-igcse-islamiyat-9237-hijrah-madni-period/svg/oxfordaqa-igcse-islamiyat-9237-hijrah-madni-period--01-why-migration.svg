<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 356" width="900" height="356" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="356" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why a migration was needed</text>

<rect x="30" y="104" width="408" height="222" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="140.8" font-size="21" font-weight="700" fill="#b5602e" text-anchor="start">In Makkah</text><text x="50" y="171.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="66.15" y="171.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Persecution of the Muslims</text><text x="50" y="198.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="66.15" y="198.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The boycott of Banu Hashim</text><text x="50" y="225.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="66.15" y="225.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The Year of Sorrow: Hazrat Khadija (RA)</text><text x="66.15" y="247.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">and Abu Talib died</text><text x="50" y="274.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="66.15" y="274.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Loss of his uncle’s protection</text><text x="50" y="301.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="66.15" y="301.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Rejection at Ta’if</text><rect x="462" y="104" width="408" height="222" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="482" y="140.8" font-size="21" font-weight="700" fill="#8a6d0d" text-anchor="start">In Yathrib, to the north</text><text x="482" y="171.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="498.15" y="171.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">An oasis town</text><text x="482" y="198.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="498.15" y="198.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Divided by years of conflict between the</text><text x="498.15" y="220.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Aws and the Khazraj</text><text x="482" y="247.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="498.15" y="247.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Home also to Jewish tribes</text><text x="482" y="274.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="498.15" y="274.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A place where Muslims could worship</text><text x="498.15" y="296.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">freely and live as a community</text>
</svg>