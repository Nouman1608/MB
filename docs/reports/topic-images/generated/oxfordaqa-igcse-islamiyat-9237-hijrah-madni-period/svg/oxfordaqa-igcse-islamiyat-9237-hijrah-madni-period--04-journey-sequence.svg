<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 558" width="900" height="558" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="558" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The journey, step by step</text>

<rect x="30" y="104" width="253.33333333333334" height="154" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="137" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">NIGHT</text><text x="50" y="163.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Leave Makkah</text><text x="50" y="191.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Heading south, not north</text><line x1="289.33333333333337" y1="181" x2="317.33333333333337" y2="181" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="323.33333333333337" y="104" width="253.33333333333334" height="154" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="343.33333333333337" y="137" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">THREE DAYS</text><text x="343.33333333333337" y="163.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Cave of Thawr</text><text x="343.33333333333337" y="191.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“Do not grieve; indeed</text><text x="343.33333333333337" y="212.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Allah is with us” (9:40)</text><line x1="582.6666666666667" y1="181" x2="610.6666666666667" y2="181" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="616.6666666666667" y="104" width="253.33333333333334" height="154" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="636.6666666666667" y="137" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PURSUIT</text><text x="636.6666666666667" y="163.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Suraqa ibn Malik</text><text x="636.6666666666667" y="191.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">His horse stumbled; he</text><text x="636.6666666666667" y="212.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">asked for a promise of</text><text x="636.6666666666667" y="233.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">safety and turned back</text><rect x="30" y="276" width="253.33333333333334" height="154" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="309" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">622 CE</text><text x="50" y="335.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Quba</text><text x="50" y="363.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Stayed some days; founded</text><text x="50" y="384.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the first mosque in Islam</text><line x1="289.33333333333337" y1="353" x2="317.33333333333337" y2="353" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="323.33333333333337" y="276" width="253.33333333333334" height="154" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="343.33333333333337" y="309" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ON THE WAY</text><text x="343.33333333333337" y="335.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">First Jummah prayer</text><text x="343.33333333333337" y="363.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Led on the way into the</text><text x="343.33333333333337" y="384.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">city</text><line x1="582.6666666666667" y1="353" x2="610.6666666666667" y2="353" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="616.6666666666667" y="276" width="253.33333333333334" height="154" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="636.6666666666667" y="309" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ARRIVAL</text><text x="636.6666666666667" y="335.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Madinah</text><text x="636.6666666666667" y="363.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Al-Qaswa knelt on land of</text><text x="636.6666666666667" y="384.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">two orphans; the Prophet</text><text x="636.6666666666667" y="405.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(pbuh) paid for it</text><rect x="30" y="448" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="481.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Tradition says a spider’s web and a nesting dove at the cave mouth convinced the searchers</text><text x="50" y="503.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">no one was inside.</text>
</svg>