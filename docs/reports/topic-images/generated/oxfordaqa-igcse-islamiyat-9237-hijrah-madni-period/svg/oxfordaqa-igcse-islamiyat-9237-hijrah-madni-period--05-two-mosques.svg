<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 517" width="900" height="517" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="517" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The first two mosques</text>

<rect x="30" y="104" width="408" height="253" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="140.8" font-size="21" font-weight="700" fill="#8a6d0d" text-anchor="start">Mosque of Quba</text><text x="50" y="170.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="170.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The first mosque built in Islam</text><text x="50" y="196.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="196.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Founded at Quba, on the edge of Madinah,</text><text x="65.2" y="217.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">in 622 CE</text><text x="50" y="243.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="243.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The Prophet (pbuh) worked on it himself</text><text x="50" y="269.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="269.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Many scholars identify it with 9:108:</text><text x="65.2" y="290.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“founded on righteousness from the first</text><text x="65.2" y="311.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">day”</text><rect x="462" y="104" width="408" height="253" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="482" y="140.8" font-size="21" font-weight="700" fill="#8a6d0d" text-anchor="start">Masjid an-Nabawi</text><text x="482" y="170.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="497.2" y="170.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Mud brick, palm-trunk pillars, palm-leaf</text><text x="497.2" y="191.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">roof</text><text x="482" y="217.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="497.2" y="217.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The suffah: where poor companions lived</text><text x="497.2" y="238.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and studied</text><text x="482" y="264.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="497.2" y="264.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Centre for teaching, judging disputes,</text><text x="497.2" y="285.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">receiving visitors and planning</text><text x="482" y="311.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="497.2" y="311.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Meanwhile he stayed with Abu Ayyub Ansari</text><text x="497.2" y="332.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(RA)</text><rect x="30" y="375" width="840" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="411" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Lesson</text><text x="50" y="440.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">9:107 contrasts a mosque built by hypocrites to divide believers. A mosque’s value lies in</text><text x="50" y="462.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">the intention and righteousness of those who build and use it.</text>
</svg>