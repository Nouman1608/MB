<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 636" width="900" height="636" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="636" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">From first contact to the second pledge</text>

<line x1="62" y1="124" x2="62" y2="456" stroke="#c9d6d4" stroke-width="4"/><rect x="108" y="104" width="762" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="139.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">First contact</text><text x="128" y="167.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A small group from the Khazraj met the Prophet (pbuh) in the pilgrimage season and</text><text x="128" y="188.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">accepted Islam.</text><circle cx="62" cy="158.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="167.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="108" y="225" width="762" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="260.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">First pledge of Aqaba: belief and conduct</text><text x="128" y="288.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Twelve men pledged not to associate anything with Allah, steal, commit adultery, kill</text><text x="128" y="309.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">their children, slander, or disobey him in what is right. Mus’ab ibn Umair (RA) went</text><text x="128" y="330.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">back to teach.</text><circle cx="62" cy="290" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="298.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="108" y="367" width="762" height="109" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="128" y="402.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Second pledge of Aqaba: protection</text><text x="128" y="430.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">More than seventy men and two women, secretly at night, pledged to protect the Prophet</text><text x="128" y="451.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">(pbuh) as they protected their own families, and invited him to Yathrib.</text><circle cx="62" cy="421.5" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="62" y="430.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="30" y="494" width="840" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="530" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Importance</text><text x="50" y="559.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The pledges show Islam spreading by teaching and conviction, created the Ansar, and set the</text><text x="50" y="581.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">pattern of bay’ah between a leader and his community.</text>
</svg>