<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 488" width="900" height="488" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="488" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Brotherhood (mu’akhat)</text>

<rect x="30" y="104" width="330" height="120" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="195" y="156.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Muhajir: migrant who had lost</text><text x="195" y="180.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">everything</text><rect x="540" y="104" width="330" height="120" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="705" y="168.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Ansari: helper from Madinah</text><line x1="366" y1="164" x2="534" y2="164" stroke="#1e2a44" stroke-width="4" marker-start="url(#ah)" marker-end="url(#ah)"/><text x="450" y="152" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">paired as brothers</text><text x="450" y="190" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">shared homes, work</text><text x="450" y="208" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">and property</text><rect x="30" y="242" width="840" height="108" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="275" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EXAMPLE</text><text x="50" y="300.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Sa’d ibn al-Rabi’ (RA) offered half his wealth to Abdur Rahman ibn Awf (RA),</text><text x="50" y="324.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">who asked only to be shown the market so he could trade.</text><rect x="30" y="368" width="840" height="90" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="404" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Why it mattered</text><text x="50" y="433.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Migrants were given homes and work, solving a social and economic crisis without conflict.</text>
</svg>