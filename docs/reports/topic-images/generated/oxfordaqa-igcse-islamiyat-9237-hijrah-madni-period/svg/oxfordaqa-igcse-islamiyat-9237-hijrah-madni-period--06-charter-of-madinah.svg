<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" width="900" height="660" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="660" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The Charter of Madinah: what each term did</text>

<text x="228.5" y="124" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Term</text><text x="671.5" y="124" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">What it achieved</text><rect x="30" y="140" width="397" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="168.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Muslims of Quraysh and Yathrib form one</text><text x="46" y="189.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Ummah</text><line x1="433" y1="175" x2="467" y2="175" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="473" y="140" width="397" height="70" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="489" y="168.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Ended the long Aws and Khazraj conflict</text><rect x="30" y="224" width="397" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="252.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Jewish tribes who joined keep their own</text><text x="46" y="273.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">religion and equal protection</text><line x1="433" y1="259" x2="467" y2="259" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="473" y="224" width="397" height="70" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="489" y="252.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Protected religious freedom</text><rect x="30" y="308" width="397" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="336.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">All defend Madinah together; no separate</text><text x="46" y="357.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">alliance with the Quraysh</text><line x1="433" y1="343" x2="467" y2="343" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="473" y="308" width="397" height="70" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="489" y="336.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Security for everyone in the city</text><rect x="30" y="392" width="397" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="420.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Each group pays its own blood money; the</text><text x="46" y="441.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">oppressed must be helped</text><line x1="433" y1="427" x2="467" y2="427" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="473" y="392" width="397" height="70" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="489" y="420.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Justice above tribal loyalty</text><rect x="30" y="476" width="397" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="504.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Disputes referred to Allah and to Muhammad</text><text x="46" y="525.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(pbuh)</text><line x1="433" y1="511" x2="467" y2="511" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="473" y="476" width="397" height="70" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="489" y="504.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">One system of law; 4:59 put into practice</text><rect x="30" y="560" width="397" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="588.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The valley of Madinah is a sacred, protected</text><text x="46" y="609.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">area</text><line x1="433" y1="595" x2="467" y2="595" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="473" y="560" width="397" height="70" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="489" y="588.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The city itself given protected status</text>
</svg>