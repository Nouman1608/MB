<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 513" width="900" height="513" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="513" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Two companions, two roles</text>

<rect x="30" y="104" width="840" height="108" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="450" y="137" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">THE PLOT</text><text x="450" y="162.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">A young man from each clan would strike together, so the blame would be</text><text x="450" y="186.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">shared.</text><rect x="30" y="230" width="408" height="253" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="266.8" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="start">Hazrat Ali (RA)</text><text x="50" y="296.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="296.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Slept in the Prophet’s bed, wrapped in his</text><text x="65.2" y="317.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">cloak, so watchers thought he was still</text><text x="65.2" y="338.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">there</text><text x="50" y="364.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="364.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Stayed behind to return the goods left</text><text x="65.2" y="385.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">with the Prophet (pbuh) for safekeeping,</text><text x="65.2" y="406.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">even to enemies</text><text x="50" y="432.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="432.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Then travelled to Madinah on foot</text><rect x="462" y="230" width="408" height="253" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="482" y="266.8" font-size="21" font-weight="700" fill="#8a6d0d" text-anchor="start">Hazrat Abu Bakr (RA)</text><text x="482" y="296.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="497.2" y="296.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Prepared two camels and hired a guide,</text><text x="497.2" y="317.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Abdullah ibn Urayqit</text><text x="482" y="343.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="497.2" y="343.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Left by night with the Prophet (pbuh),</text><text x="497.2" y="364.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">heading south to mislead pursuers</text><text x="482" y="390.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="497.2" y="390.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Hid three days in the Cave of Thawr; “the</text><text x="497.2" y="411.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">second of two” (9:40)</text><text x="482" y="437.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="497.2" y="437.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">His family helped: Abdullah brought news,</text><text x="497.2" y="458.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Asma (RA) brought food</text>
</svg>