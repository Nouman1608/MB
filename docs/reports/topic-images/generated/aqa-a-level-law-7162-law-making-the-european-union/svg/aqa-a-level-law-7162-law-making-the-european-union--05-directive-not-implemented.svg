<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 419" width="900" height="419" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="419" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A directive has not been implemented: what now?</text>

<rect x="220" y="100" width="460" height="52" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="130.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">State failed to implement a directive properly</text><line x1="330" y1="158" x2="160" y2="178" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="450" y1="158" x2="450" y2="178" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="570" y1="158" x2="740" y2="178" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="200" width="270.6666666666667" height="187" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="228" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">AGAINST THE STATE</text><text x="46" y="254.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Vertical direct effect</text><text x="46" y="282.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Clear, unconditional directive</text><text x="46" y="303.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">relied on against the state or an</text><text x="46" y="324.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">emanation of it. <tspan font-style="italic">Marshall</tspan></text><text x="46" y="345.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(1986); test in <tspan font-style="italic">Foster</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">British</tspan></text><text x="46" y="366.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Gas</tspan> (1990)</text><rect x="314.6666666666667" y="200" width="270.6666666666667" height="187" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="330.6666666666667" y="228" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">AGAINST A PRIVATE PARTY</text><text x="330.6666666666667" y="254.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">No horizontal direct effect</text><text x="330.6666666666667" y="282.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Faccini</tspan> <tspan font-style="italic">Dori</tspan> (1994). But</text><text x="330.6666666666667" y="303.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">indirect</tspan> <tspan font-weight="700" fill="#1e2a44">effect</tspan>: read national</text><text x="330.6666666666667" y="324.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">law in the light of the directive.</text><text x="330.6666666666667" y="345.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Von</tspan> <tspan font-style="italic">Colson</tspan> (1984); <tspan font-style="italic">Marleasing</tspan></text><text x="330.6666666666667" y="366.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(1990)</text><rect x="599.3333333333334" y="200" width="270.6666666666667" height="187" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="615.3333333333334" y="228" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">LOSS CAUSED</text><text x="615.3333333333334" y="254.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">State liability</text><text x="615.3333333333334" y="282.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Damages from the state for</text><text x="615.3333333333334" y="303.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">failure to implement.</text><text x="615.3333333333334" y="324.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Francovich</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Italy</tspan> (1991)</text>
</svg>