<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 778" width="900" height="778" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="778" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">EU law in England and Wales over time</text>

<line x1="98" y1="136.5" x2="98" y2="557" stroke="#c9d6d4" stroke-width="4"/><rect x="186" y="100" width="684" height="73" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="199" y="127.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">European Communities Act</text><text x="199" y="155.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">s2(1) gives EU law effect; s2(4) national law read subject to it</text><rect x="30" y="116.5" width="136" height="40" rx="20" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="98" y="142.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">1972</text><rect x="186" y="182" width="684" height="73" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="199" y="209.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Factortame</tspan></text><text x="199" y="237.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Lords disapply parts of the Merchant Shipping Act 1988: EU law supreme</text><rect x="30" y="198.5" width="136" height="40" rx="20" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="98" y="224.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">1990</text><rect x="186" y="264" width="684" height="73" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="199" y="291.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">European Union (Withdrawal) Act</text><text x="199" y="319.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Repeals the 1972 Act from exit day</text><rect x="30" y="280.5" width="136" height="40" rx="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="98" y="306.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">2018</text><rect x="186" y="346" width="684" height="73" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="199" y="373.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Exit day</text><text x="199" y="401.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Implementation period runs to 31 December 2020</text><rect x="30" y="362.5" width="136" height="40" rx="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="98" y="388.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">31 Jan 2020</text><rect x="186" y="428" width="684" height="73" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="199" y="455.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Retained EU law</text><text x="199" y="483.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">EU-derived law kept, e.g. Working Time Regulations 1998</text><rect x="30" y="444.5" width="136" height="40" rx="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="98" y="470.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">End 2020</text><rect x="186" y="510" width="684" height="94" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="199" y="537.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Assimilated law</text><text x="199" y="565.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Retained EU Law (Revocation and Reform) Act 2023 ends supremacy and general</text><text x="199" y="586.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">principles</text><rect x="30" y="537" width="136" height="40" rx="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="98" y="563" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">1 Jan 2024</text><rect x="30" y="624" width="412" height="122" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="652" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DURING MEMBERSHIP</text><text x="46" y="683.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Purposive interpretation; equal pay, working time,</text><text x="46" y="704.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">consumer, data and environmental law;</text><text x="46" y="725.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">references to the CJEU</text><rect x="458" y="624" width="412" height="122" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="474" y="652" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">AFTER WITHDRAWAL</text><text x="474" y="683.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Court of Appeal and Supreme Court may depart</text><text x="474" y="704.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">from retained EU case law; new CJEU decisions</text><text x="474" y="725.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">do not bind</text>
</svg>