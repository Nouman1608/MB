<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Direct effect: who can be sued?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Clear, precise and unconditional provisions give rights enforceable in national courts</text>
<rect x="30" y="124" width="410" height="410" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="235" y="162" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Treaty articles</text><rect x="165" y="186" width="140" height="54" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="235" y="219" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">THE STATE</text><circle cx="120" cy="324" r="13" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><path d="M120,337 L120,368 M104,348 L136,348 M120,368 L107,390 M120,368 L133,390" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><text x="120" y="416" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">individual</text><circle cx="350" cy="324" r="13" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><path d="M350,337 L350,368 M334,348 L366,348 M350,368 L337,390 M350,368 L363,390" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><text x="350" y="416" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">private party</text><line x1="135" y1="314" x2="190" y2="248" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><text x="132" y="274" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="end">vertical</text><text x="142" y="274" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">✓</text><line x1="152" y1="352" x2="318" y2="352" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><text x="235" y="340" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">horizontal ✓</text><text x="52" y="454" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Defrenne</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Sabena</tspan> <tspan font-style="italic">(No</tspan> <tspan font-style="italic">2)</tspan> (1976): equal pay article</text><text x="52" y="474" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">relied on against a private employer</text><text x="52" y="496" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Macarthys</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Smith</tspan> (1980): relied on in the English</text><text x="52" y="516" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">courts</text><rect x="460" y="124" width="410" height="410" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="665" y="162" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Directives</text><rect x="595" y="186" width="140" height="54" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="665" y="219" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">THE STATE</text><circle cx="550" cy="324" r="13" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><path d="M550,337 L550,368 M534,348 L566,348 M550,368 L537,390 M550,368 L563,390" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><text x="550" y="416" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">individual</text><circle cx="780" cy="324" r="13" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><path d="M780,337 L780,368 M764,348 L796,348 M780,368 L767,390 M780,368 L793,390" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><text x="780" y="416" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">private party</text><line x1="565" y1="314" x2="620" y2="248" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><text x="562" y="274" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="end">vertical</text><text x="572" y="274" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">✓</text><line x1="582" y1="352" x2="748" y2="352" stroke="#b5602e" stroke-width="4" marker-end="url(#ahR)" stroke-dasharray="9 7"/><text x="665" y="340" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">horizontal ✗</text><text x="482" y="454" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Marshall</tspan> (1986): against the state or an emanation</text><text x="482" y="474" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">of the state (<tspan font-style="italic">Foster</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">British</tspan> <tspan font-style="italic">Gas</tspan>)</text><text x="482" y="496" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Faccini</tspan> <tspan font-style="italic">Dori</tspan> (1994): not against a private individual</text><text x="482" y="516" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">or company</text>
