<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 610" width="900" height="610" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="610" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Regulations and directives reach national law differently</text>

<rect x="30" y="100" width="410" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="460" y="100" width="410" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="235" y="138" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Regulation</text><text x="665" y="138" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Directive</text><rect x="135" y="158" width="200" height="50" rx="8" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="235" y="189" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">EU regulation</text><line x1="235" y1="246" x2="106" y2="296" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><line x1="235" y1="246" x2="224" y2="296" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><line x1="235" y1="246" x2="342" y2="296" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><text x="235" y="234" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">automatically</text><rect x="54" y="300" width="104" height="60" rx="8" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="106" y="336" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">state law</text><rect x="172" y="300" width="104" height="60" rx="8" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="224" y="336" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">state law</text><rect x="290" y="300" width="104" height="60" rx="8" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="342" y="336" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">state law</text><text x="54" y="392" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Binding <tspan font-weight="700">entirely</tspan>; directly applicable. Same rule</text><text x="54" y="413" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">everywhere at once.</text><rect x="565" y="158" width="200" height="50" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="665" y="189" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">EU directive</text><line x1="665" y1="246" x2="536" y2="296" stroke="#8a6d0d" stroke-width="3" marker-end="url(#ahO)" stroke-dasharray="8 6"/><line x1="665" y1="246" x2="654" y2="296" stroke="#8a6d0d" stroke-width="3" marker-end="url(#ahO)" stroke-dasharray="8 6"/><line x1="665" y1="246" x2="772" y2="296" stroke="#8a6d0d" stroke-width="3" marker-end="url(#ahO)" stroke-dasharray="8 6"/><text x="665" y="234" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">each state implements</text><rect x="484" y="300" width="104" height="60" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="536" y="336" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">own method</text><rect x="602" y="300" width="104" height="60" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="654" y="336" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">own method</text><rect x="720" y="300" width="104" height="60" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="772" y="336" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">own method</text><text x="484" y="392" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Binding <tspan font-weight="700">as</tspan> <tspan font-weight="700">to</tspan> <tspan font-weight="700">result</tspan>; form and method left to</text><text x="484" y="413" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">each state, by a deadline.</text><rect x="30" y="452" width="410" height="126" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="482" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EXAMPLE</text><text x="48" y="513.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Leonesio</tspan> (1972): a farmer got a payment under a</text><text x="48" y="534.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">regulation although Italy had passed no law to</text><text x="48" y="555.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">fund it. Also the tachograph regulation.</text><rect x="460" y="452" width="410" height="126" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="478" y="482" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EXAMPLE</text><text x="478" y="513.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Working Time Directive implemented in the UK</text><text x="478" y="534.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">by the Working Time Regulations 1998 (a</text><text x="478" y="555.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">statutory instrument).</text>
</svg>