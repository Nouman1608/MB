<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 393" width="900" height="393" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="393" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A preliminary ruling under Article 267 TFEU</text>

<rect x="30" y="100" width="184.5" height="111" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="126" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">NATIONAL COURT</text><text x="44" y="151.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Meets a question</text><text x="44" y="172.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">on the meaning of</text><text x="44" y="193.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">EU law</text><line x1="220.5" y1="155.5" x2="242.5" y2="155.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="248.5" y="100" width="184.5" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="262.5" y="126" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">REFERENCE</text><text x="262.5" y="151.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Refers the</text><text x="262.5" y="172.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">question to the</text><text x="262.5" y="193.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">CJEU</text><line x1="439" y1="155.5" x2="461" y2="155.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="467" y="100" width="184.5" height="111" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="481" y="136.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CJEU</text><text x="481" y="161.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Interprets the EU</text><text x="481" y="182.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">law</text><line x1="657.5" y1="155.5" x2="679.5" y2="155.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="685.5" y="100" width="184.5" height="111" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="699.5" y="136.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">NATIONAL COURT</text><text x="699.5" y="161.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Applies the ruling</text><text x="699.5" y="182.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">to the facts</text><rect x="30" y="235" width="412" height="126" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="265" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CILFIT (1982)</text><text x="48" y="296.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A national court of <tspan font-weight="700" fill="#1e2a44">final</tspan> <tspan font-weight="700" fill="#1e2a44">appeal</tspan> must normally</text><text x="48" y="317.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">refer, unless the answer is already clear or</text><text x="48" y="338.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">settled.</text><rect x="458" y="235" width="412" height="126" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="476" y="265" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">BULMER v BOLLINGER (1974)</text><text x="476" y="296.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Lord Denning set out guidelines for when English</text><text x="476" y="317.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">courts should refer.</text>
</svg>