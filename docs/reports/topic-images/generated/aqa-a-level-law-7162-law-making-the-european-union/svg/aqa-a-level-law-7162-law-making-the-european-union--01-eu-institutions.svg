<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 758" width="900" height="758" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="758" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four EU institutions and how a law is made</text>

<rect x="220" y="100" width="460" height="146" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="128" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">COMMISSION</text><text x="450" y="154.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Proposes legislation</text><text x="450" y="183.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">One commissioner per state, independent of</text><text x="450" y="204.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">governments. Also implements policy and is “guardian</text><text x="450" y="225.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">of the treaties”.</text><line x1="380" y1="250" x2="250" y2="272" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="520" y1="250" x2="650" y2="272" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="450" y="266" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">proposal</text><rect x="30" y="290" width="360" height="167" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="318" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PARLIAMENT</text><text x="46" y="344.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Co-legislator</text><text x="46" y="373.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">MEPs directly elected every five years.</text><text x="46" y="394.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Can amend or reject; approves budget;</text><text x="46" y="415.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">supervises and can dismiss the</text><text x="46" y="436.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Commission.</text><rect x="510" y="290" width="360" height="167" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="526" y="318" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">COUNCIL</text><text x="526" y="344.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Co-legislator</text><text x="526" y="373.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">One minister per state, by subject.</text><text x="526" y="394.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Qualified majority voting; unanimity for</text><text x="526" y="415.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">sensitive areas such as tax. Presidency</text><text x="526" y="436.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">rotates every six months.</text><line x1="398" y1="373.5" x2="502" y2="373.5" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)" marker-start="url(#ahT)"/><text x="450" y="359.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">ordinary</text><text x="450" y="401.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">legislative</text><text x="450" y="419.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">procedure</text><line x1="450" y1="461" x2="450" y2="481" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="501" width="840" height="125" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="529" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">COURT OF JUSTICE OF THE EU</text><text x="450" y="555.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Interprets and enforces the law</text><text x="450" y="584.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">One judge per state, assisted by Advocates General; includes the General Court. Preliminary rulings,</text><text x="450" y="605.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">enforcement actions, review of the institutions’ acts.</text><rect x="30" y="648" width="840" height="78" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="680.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Not to be confused: the <tspan font-weight="700" fill="#1e2a44">European</tspan> <tspan font-weight="700" fill="#1e2a44">Council</tspan> (heads of state or government) sets direction but passes no</text><text x="450" y="701.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">legislation.</text>
</svg>