<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="900" height="550" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="550" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The refraction practical: three block shapes</text>

<rect x="30" y="110" width="270" height="420" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="165" y="146" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Rectangular block</text><rect x="70" y="210" width="200" height="150" rx="0" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><line x1="130" y1="160" x2="130" y2="260" stroke="#1e2a44" stroke-width="2" stroke-linecap="round" stroke-dasharray="7 6"/><line x1="219.0996775848245" y1="310" x2="219.0996775848245" y2="410" stroke="#1e2a44" stroke-width="2" stroke-linecap="round" stroke-dasharray="7 6"/><line x1="76.37688898167156" y1="165.00486732194224" x2="130" y2="210" stroke="#8a6d0d" stroke-width="3.5" stroke-linecap="round"/><line x1="100.50728893991936" y1="185.25267702706824" x2="105.8696000417522" y2="189.75219029487403" stroke="#8a6d0d" stroke-width="0.1" marker-end="url(#ahO)"/><line x1="130" y1="210" x2="219.0996775848245" y2="360" stroke="#8a6d0d" stroke-width="3.5" stroke-linecap="round"/><line x1="170.09485491317102" y1="277.5" x2="179.00482267165347" y2="292.5" stroke="#8a6d0d" stroke-width="0.1" marker-end="url(#ahO)"/><line x1="219.0996775848245" y1="360" x2="280.3832330343427" y2="411.4230087749231" stroke="#8a6d0d" stroke-width="3.5" stroke-linecap="round"/><line x1="246.67727753710773" y1="383.1403539487154" x2="252.80563308205953" y2="388.2826548262077" stroke="#8a6d0d" stroke-width="0.1" marker-end="url(#ahO)"/><line x1="130" y1="210" x2="279.37866640820073" y2="335.3435838888752" stroke="#4a5568" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 5"/><text x="48" y="440" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Emerging ray is parallel to</text><text x="48" y="460" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">the incident ray, shifted</text><text x="48" y="480" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">sideways.</text><rect x="315" y="110" width="270" height="420" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="146" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Semi-circular block</text><path d="M350,300 A100,100 0 0 0 550,300 Z" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><line x1="450" y1="180" x2="450" y2="410" stroke="#1e2a44" stroke-width="2" stroke-linecap="round" stroke-dasharray="7 6"/><line x1="387.5" y1="408.25317547305485" x2="450" y2="300" stroke="#8a6d0d" stroke-width="3.5" stroke-linecap="round"/><line x1="415.625" y1="359.5392465101802" x2="421.875" y2="348.71392896287466" stroke="#8a6d0d" stroke-width="0.1" marker-end="url(#ahO)"/><line x1="450" y1="300" x2="540" y2="220.62746066806227" stroke="#8a6d0d" stroke-width="3.5" stroke-linecap="round"/><line x1="490.5" y1="264.282357300628" x2="499.5" y2="256.34510336743426" stroke="#8a6d0d" stroke-width="0.1" marker-end="url(#ahO)"/><circle cx="450" cy="300" r="4" fill="#1e2a44" stroke="#1e2a44" stroke-width="0"/><text x="522" y="412" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">no bend: enters</text><text x="522" y="430" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">along a radius</text><text x="333" y="455" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">All the refraction is at the</text><text x="333" y="475" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">flat face; at the critical</text><text x="333" y="495" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">angle the ray disappears into</text><text x="333" y="515" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">TIR.</text><rect x="600" y="110" width="270" height="420" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="735" y="146" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Triangular prism</text><path d="M735,190 L640,370 L830,370 Z" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><line x1="612" y1="300" x2="690" y2="276" stroke="#1e2a44" stroke-width="4" stroke-linecap="round"/><line x1="647.1" y1="289.2" x2="654.9000000000001" y2="286.8" stroke="#1e2a44" stroke-width="0.1" marker-end="url(#ah)"/><line x1="690" y1="276" x2="789.8888888888889" y2="294" stroke="#b5602e" stroke-width="2.5" stroke-linecap="round"/><line x1="789.8888888888889" y1="294" x2="860" y2="314" stroke="#b5602e" stroke-width="3.5" stroke-linecap="round"/><line x1="690" y1="276" x2="792.5277777777778" y2="299" stroke="#d4b02e" stroke-width="2.5" stroke-linecap="round"/><line x1="792.5277777777778" y1="299" x2="860" y2="334" stroke="#d4b02e" stroke-width="3.5" stroke-linecap="round"/><line x1="690" y1="276" x2="795.1666666666666" y2="304" stroke="#6f9a52" stroke-width="2.5" stroke-linecap="round"/><line x1="795.1666666666666" y1="304" x2="860" y2="354" stroke="#6f9a52" stroke-width="3.5" stroke-linecap="round"/><line x1="690" y1="276" x2="797.8055555555555" y2="309" stroke="#2b5a9a" stroke-width="2.5" stroke-linecap="round"/><line x1="797.8055555555555" y1="309" x2="860" y2="374" stroke="#2b5a9a" stroke-width="3.5" stroke-linecap="round"/><text x="616" y="322" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">white</text><text x="858" y="302" font-size="15" font-weight="600" fill="#b5602e" text-anchor="end">red</text><text x="845" y="412" font-size="15" font-weight="600" fill="#2b5a9a" text-anchor="end">violet</text><text x="618" y="440" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Two non-parallel faces:</text><text x="618" y="460" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">deviated towards the base.</text><text x="618" y="480" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">White light spreads into</text><text x="618" y="500" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">colours.</text>
</svg>