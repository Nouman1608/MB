<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="900" height="550" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="550" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The refraction practical: three block shapes</text>

<rect x="30" y="110" width="270" height="420" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="165" y="146" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Rectangular block</text><rect x="70" y="210" width="200" height="150" rx="0" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><line x1="130" y1="160" x2="130" y2="260" stroke="#1e2a44" stroke-width="2" stroke-linecap="round" stroke-dasharray="7 6"/><line x1="219.0996775848245" y1="310" x2="219.0996775848245" y2="410" stroke="#1e2a44" stroke-width="2" stroke-linecap="round" stroke-dasharray="7 6"/><line x1="53.395555688102206" y1="145.72123903134604" x2="130" y2="210" stroke="#8a6d0d" stroke-width="3.5" stroke-linecap="round"/><line x1="87.86755562845622" y1="174.64668146724034" x2="95.52800005964599" y2="181.07455756410573" stroke="#8a6d0d" stroke-width="0.1" marker-end="url(#ahO)"/><line x1="130" y1="210" x2="219.0996775848245" y2="360" stroke="#8a6d0d" stroke-width="3.5" stroke-linecap="round"/><line x1="170.09485491317102" y1="277.5" x2="179.00482267165347" y2="292.5" stroke="#8a6d0d" stroke-width="0.1" marker-end="url(#ahO)"/><line x1="219.0996775848245" y1="360" x2="303.3645663279121" y2="430.7066370655193" stroke="#8a6d0d" stroke-width="3.5" stroke-linecap="round"/><line x1="257.0188775192139" y1="391.81798667948374" x2="265.4453663935227" y2="398.88865038603564" stroke="#8a6d0d" stroke-width="0.1" marker-end="url(#ahO)"/><line x1="130" y1="210" x2="306.19022191736497" y2="357.841150227904" stroke="#4a5568" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 5"/><text x="48" y="440" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Emerging ray is parallel to</text><text x="48" y="460" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">the incident ray, shifted</text><text x="48" y="480" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">sideways.</text><rect x="315" y="110" width="270" height="420" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="146" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Semi-circular block</text><path d="M350,300 A100,100 0 0 0 550,300 Z" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><line x1="450" y1="180" x2="450" y2="410" stroke="#1e2a44" stroke-width="2" stroke-linecap="round" stroke-dasharray="7 6"/><line x1="365.00000000000006" y1="447.2243186433546" x2="450" y2="300" stroke="#8a6d0d" stroke-width="3.5" stroke-linecap="round"/><line x1="403.25000000000006" y1="380.973375253845" x2="411.75000000000006" y2="366.25094338950953" stroke="#8a6d0d" stroke-width="0.1" marker-end="url(#ahO)"/><line x1="450" y1="300" x2="540" y2="220.62746066806227" stroke="#8a6d0d" stroke-width="3.5" stroke-linecap="round"/><line x1="490.5" y1="264.282357300628" x2="499.5" y2="256.34510336743426" stroke="#8a6d0d" stroke-width="0.1" marker-end="url(#ahO)"/><circle cx="450" cy="300" r="4" fill="#1e2a44" stroke="#1e2a44" stroke-width="0"/><text x="376" y="428" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">no bend: enters</text><text x="376" y="446" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">along a radius</text><text x="333" y="455" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">All the refraction is at the</text><text x="333" y="475" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">flat face; at the critical</text><text x="333" y="495" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">angle the ray disappears into</text><text x="333" y="515" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">TIR.</text><rect x="600" y="110" width="270" height="420" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="735" y="146" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Triangular prism</text><path d="M735,190 L640,370 L830,370 Z" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><line x1="612" y1="300" x2="690" y2="276" stroke="#1e2a44" stroke-width="4" stroke-linecap="round"/><line x1="647.1" y1="289.2" x2="654.9000000000001" y2="286.8" stroke="#1e2a44" stroke-width="0.1" marker-end="url(#ah)"/><line x1="690" y1="276" x2="770" y2="300" stroke="#9aa5a5" stroke-width="6" stroke-linecap="round"/><line x1="770" y1="300" x2="860" y2="330" stroke="#b5602e" stroke-width="3.5" stroke-linecap="round"/><line x1="770" y1="300" x2="860" y2="348" stroke="#d4b02e" stroke-width="3.5" stroke-linecap="round"/><line x1="770" y1="300" x2="860" y2="366" stroke="#6f9a52" stroke-width="3.5" stroke-linecap="round"/><line x1="770" y1="300" x2="860" y2="386" stroke="#2b5a9a" stroke-width="3.5" stroke-linecap="round"/><text x="616" y="290" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">white</text><text x="855" y="322" font-size="15" font-weight="600" fill="#b5602e" text-anchor="end">red</text><text x="845" y="412" font-size="15" font-weight="600" fill="#2b5a9a" text-anchor="end">violet</text><text x="618" y="440" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Two non-parallel faces:</text><text x="618" y="460" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">deviated towards the base.</text><text x="618" y="480" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">White light spreads into</text><text x="618" y="500" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">colours.</text>
</svg>