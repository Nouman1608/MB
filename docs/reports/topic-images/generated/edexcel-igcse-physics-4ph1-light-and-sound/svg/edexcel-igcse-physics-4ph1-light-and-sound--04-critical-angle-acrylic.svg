<rect width="900" height="620" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: the critical angle of acrylic</text>

<rect x="30" y="110" width="840" height="67.6" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="54" y="151.1" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">sin c = 1 ÷ n = 1 ÷ 1.49 = 0.671        c = 42.2°</text><g transform="translate(0 70)"><rect x="30" y="110" width="410" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="235" y="146" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Ray at 40° inside the acrylic</text><rect x="50" y="160" width="370" height="90" rx="0" fill="#ffffff" stroke="none" stroke-width="0" /><text x="60" y="180" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">air</text><path d="M105,250 A130,130 0 0 0 365,250 Z" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><line x1="235" y1="165" x2="235" y2="395" stroke="#1e2a44" stroke-width="2" stroke-linecap="round" stroke-dasharray="7 6"/><text x="117" y="290" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start">acrylic</text><line x1="151.4376107407499" y1="349.5857776054671" x2="235" y2="250" stroke="#8a6d0d" stroke-width="3.5" stroke-linecap="round"/><line x1="189.04068590741247" y1="304.77217768300693" x2="197.39692483333747" y2="294.8135999224602" stroke="#8a6d0d" stroke-width="0.1" marker-end="url(#ahO)"/><path d="M235.0,300.0 A50,50 0 0 1 202.9,288.3" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><text x="211" y="322" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">40°</text><line x1="235" y1="250" x2="388.240566149271" y2="203.98555785135596" stroke="#8a6d0d" stroke-width="3.5" stroke-linecap="round"/><line x1="303.958254767172" y1="229.2935010331102" x2="319.28231138209907" y2="224.6920568182458" stroke="#8a6d0d" stroke-width="0.1" marker-end="url(#ahO)"/><line x1="235" y1="250" x2="315.99123882050395" y2="346.5215998329912" stroke="#8a6d0d" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 5"/><text x="420" y="205" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="end">refracts out,</text><text x="420" y="225" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="end">bends away</text><text x="235" y="425" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">40° is less than 42.2°</text><rect x="460" y="110" width="410" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="665" y="146" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Ray at 50° inside the acrylic</text><rect x="480" y="160" width="370" height="90" rx="0" fill="#ffffff" stroke="none" stroke-width="0" /><text x="490" y="180" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">air</text><path d="M535,250 A130,130 0 0 0 795,250 Z" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><line x1="665" y1="165" x2="665" y2="395" stroke="#1e2a44" stroke-width="2" stroke-linecap="round" stroke-dasharray="7 6"/><text x="547" y="290" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start">acrylic</text><line x1="565.4142223945329" y1="333.56238925925015" x2="665" y2="250" stroke="#8a6d0d" stroke-width="3.5" stroke-linecap="round"/><line x1="610.2278223169931" y1="295.9593140925876" x2="620.1864000775399" y2="287.60307516666256" stroke="#8a6d0d" stroke-width="0.1" marker-end="url(#ahO)"/><path d="M665.0,300.0 A50,50 0 0 1 626.7,282.1" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><text x="641" y="322" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">50°</text><line x1="665" y1="250" x2="764.5857776054671" y2="333.5623892592501" stroke="#b5602e" stroke-width="3.5" stroke-linecap="round"/><line x1="709.8135999224603" y1="287.6030751666625" x2="719.7721776830069" y2="295.95931409258753" stroke="#b5602e" stroke-width="0.1" marker-end="url(#ahR)"/><text x="850" y="205" font-size="16" font-weight="700" fill="#b5602e" text-anchor="end">total internal</text><text x="850" y="225" font-size="16" font-weight="700" fill="#b5602e" text-anchor="end">reflection</text><text x="665" y="425" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">50° is greater than 42.2°</text></g><rect x="30" y="530" width="840" height="70" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="560" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Both needed: light going from the higher refractive index towards the lower</text><text x="450" y="584" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">(acrylic or glass towards air), and an angle of incidence greater than c.</text>
</svg>