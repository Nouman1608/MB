<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 675" width="900" height="675" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="675" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Measuring the speed of sound in air</text>

<rect x="30" y="110" width="840" height="270" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="55" y="146" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Echo method</text><circle cx="100" cy="244" r="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><path d="M100,258 L100,296 M100,268 L120,256 M100,268 L82,284 M100,296 L88,326 M100,296 L112,326" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><rect x="780" y="160" width="40" height="166" rx="0" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2.5" /><line x1="50" y1="326" x2="850" y2="326" stroke="#1e2a44" stroke-width="3" stroke-linecap="round"/><line x1="140" y1="215" x2="770" y2="215" stroke="#8a6d0d" stroke-width="3.5" marker-end="url(#ahO)"/><text x="455" y="205" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">clap</text><line x1="770" y1="255" x2="140" y2="255" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><text x="455" y="280" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">echo</text><line x1="400" y1="355" x2="120" y2="355" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><line x1="510" y1="355" x2="790" y2="355" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><text x="455" y="361" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">80 m</text><rect x="30" y="395" width="410" height="230" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="55" y="430" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Two microphones</text><circle cx="80" cy="470" r="20" fill="#d4b02e" stroke="#8a6d0d" stroke-width="2"/><text x="80" y="515" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">source</text><rect x="162" y="455" width="16" height="34" rx="8" fill="#1e2a44" stroke="#1e2a44" stroke-width="0" /><line x1="170" y1="489" x2="170" y2="505" stroke="#1e2a44" stroke-width="3" stroke-linecap="round"/><rect x="362" y="455" width="16" height="34" rx="8" fill="#1e2a44" stroke="#1e2a44" stroke-width="0" /><line x1="370" y1="489" x2="370" y2="505" stroke="#1e2a44" stroke-width="3" stroke-linecap="round"/><line x1="170" y1="530" x2="370" y2="530" stroke="#8a6d0d" stroke-width="2" stroke-linecap="round"/><text x="270" y="524" font-size="15" font-weight="600" fill="#8a6d0d" text-anchor="middle">measured distance</text><text x="55" y="565" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Time delay between the two signals = time to</text><text x="55" y="585" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">travel the gap.</text><rect x="460" y="395" width="410" height="223.6" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="484" y="435.2" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">20 intervals in 9.6 s</text><text x="484" y="473.2" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">one interval = 9.6 ÷ 20 = 0.48 s</text><text x="484" y="511.2" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">distance = 2 × 80 = 160 m</text><text x="484" y="549.2" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">speed = 160 ÷ 0.48</text><text x="506" y="587.2" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">= 330 m/s (2 s.f.)</text><text x="450" y="655" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Timing twenty intervals cuts the effect of human reaction time. The sound goes there AND back.</text>
</svg>