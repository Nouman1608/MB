<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 555" width="900" height="555" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="555" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Optical fibres trap light by total internal reflection</text>

<rect x="30" y="110" width="840" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="40" y="190" width="820" height="100" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="3" /><line x1="60" y1="240" x2="110" y2="190" stroke="#8a6d0d" stroke-width="3" stroke-linecap="round"/><line x1="110" y1="190" x2="210" y2="290" stroke="#8a6d0d" stroke-width="3" stroke-linecap="round"/><line x1="155" y1="235" x2="165" y2="245" stroke="#8a6d0d" stroke-width="0.1" marker-end="url(#ahO)"/><line x1="210" y1="290" x2="310" y2="190" stroke="#8a6d0d" stroke-width="3" stroke-linecap="round"/><line x1="310" y1="190" x2="410" y2="290" stroke="#8a6d0d" stroke-width="3" stroke-linecap="round"/><line x1="355" y1="235" x2="365" y2="245" stroke="#8a6d0d" stroke-width="0.1" marker-end="url(#ahO)"/><line x1="410" y1="290" x2="510" y2="190" stroke="#8a6d0d" stroke-width="3" stroke-linecap="round"/><line x1="510" y1="190" x2="610" y2="290" stroke="#8a6d0d" stroke-width="3" stroke-linecap="round"/><line x1="555" y1="235" x2="565" y2="245" stroke="#8a6d0d" stroke-width="0.1" marker-end="url(#ahO)"/><line x1="610" y1="290" x2="710" y2="190" stroke="#8a6d0d" stroke-width="3" stroke-linecap="round"/><line x1="710" y1="190" x2="810" y2="290" stroke="#8a6d0d" stroke-width="3" stroke-linecap="round"/><line x1="755" y1="235" x2="765" y2="245" stroke="#8a6d0d" stroke-width="0.1" marker-end="url(#ahO)"/><line x1="310" y1="150" x2="310" y2="240" stroke="#1e2a44" stroke-width="2" stroke-linecap="round" stroke-dasharray="7 6"/><path d="M338.3,218.3 A40,40 0 0 1 310.0,230.0" fill="none" stroke="#b5602e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><path d="M310.0,236.0 A46,46 0 0 1 277.5,222.5" fill="none" stroke="#b5602e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><text x="330" y="165" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">angle greater than the critical angle</text><text x="330" y="183" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start"></text><text x="450" y="335" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">total internal reflection at every bounce, so the light stays inside</text><text x="450" y="365" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="middle">thin strand of glass</text><text x="450" y="410" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Pulses of light carry information along the fibre, even round gentle bends, with very little escaping.</text><rect x="30" y="455" width="840" height="82" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="488" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Right-angled prism: light meets the long face at 45°. This needs 45° > c, so n > 1/sin 45° = 1.41.</text><text x="450" y="514" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Glass (about 1.5) qualifies: one reflection turns the ray through 90°, two turn it through 180°.</text>
</svg>