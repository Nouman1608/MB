<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="900" height="650" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="650" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Injunctions: weighing conflicting interests</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">An equitable, discretionary remedy</text>
<rect x="30" y="124" width="270.6666666666667" height="75" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="165.33333333333334" y="152" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">CLAIMANT</text><text x="165.33333333333334" y="178.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Use and enjoyment of land</text><rect x="314.6666666666667" y="124" width="270.6666666666667" height="75" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="152" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">DEFENDANT</text><text x="450" y="178.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Their activity</text><rect x="599.3333333333334" y="124" width="270.6666666666667" height="75" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="734.6666666666667" y="152" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">SOMETIMES</text><text x="734.6666666666667" y="178.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">The wider community</text><rect x="30" y="221" width="840" height="140" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="253" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">POSSIBLE OUTCOMES ONCE A NUISANCE IS PROVED</text><rect x="60" y="273" width="250" height="56" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="185" y="308" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Full injunction</text><rect x="320" y="273" width="250" height="56" rx="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="445" y="308" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Limited injunction</text><rect x="580" y="273" width="250" height="56" rx="10" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="705" y="308" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Damages instead</text><text x="445" y="351" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Kennaway</text><text x="705" y="351" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Miller</text><rect x="30" y="383" width="412" height="122" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="411" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">MILLER v JACKSON (1977)</text><text x="46" y="442.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Nuisance from cricket balls, but injunction</text><text x="46" y="463.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">refused: weight given to the village’s cricket</text><text x="46" y="484.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">ground</text><rect x="458" y="383" width="412" height="122" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="474" y="411" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">KENNAWAY v THOMPSON (1981)</text><text x="474" y="442.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Limited injunction on the number and type of</text><text x="474" y="463.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">powerboat events: claimant protected, club kept</text><text x="474" y="484.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">open</text><rect x="30" y="517" width="412" height="101" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="46" y="545" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">COVENTRY v LAWRENCE (2014)</text><text x="46" y="576.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Shelfer</tspan> (1895) not applied mechanically; public</text><text x="46" y="597.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">benefit and planning permission can be relevant</text><rect x="458" y="517" width="412" height="101" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="474" y="545" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EVALUATION</text><text x="474" y="576.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Flexible compromise, but can look like the</text><text x="474" y="597.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">defendant buying a right to commit a wrong</text>
</svg>