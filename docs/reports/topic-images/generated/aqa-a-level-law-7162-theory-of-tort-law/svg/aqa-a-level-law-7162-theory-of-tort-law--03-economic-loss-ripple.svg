<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Pure economic loss: why the courts hold back</text>

<rect x="30" y="100" width="840" height="300" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="230" cy="268" r="118" fill="none" stroke="#2e6b62" stroke-width="2.5" stroke-dasharray="8 7" opacity="0.5"/><circle cx="230" cy="268" r="88" fill="none" stroke="#2e6b62" stroke-width="2.5" stroke-dasharray="0" opacity="0.7"/><circle cx="230" cy="268" r="56" fill="none" stroke="#2e6b62" stroke-width="2.5" stroke-dasharray="0" opacity="0.9"/><circle cx="230" cy="268" r="26" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><path d="M218,264 l8,-6 l4,10 l8,-6" fill="none" stroke="#b5602e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><rect x="174" y="301" width="112" height="24" rx="6" fill="#ffffff"/><text x="230" y="319" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">one cut cable</text><path d="M312.75538942328,313.3184741679115 L312.75538942328,297.3184741679115 L322.75538942328,291.3184741679115 L322.75538942328,297.3184741679115 L332.75538942328,291.3184741679115 L332.75538942328,297.3184741679115 L340.75538942328,293.3184741679115 L340.75538942328,313.3184741679115 Z" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><path d="M267.4166508213488,367.2486863674502 L267.4166508213488,351.2486863674502 L277.4166508213488,345.2486863674502 L277.4166508213488,351.2486863674502 L287.4166508213488,345.2486863674502 L287.4166508213488,351.2486863674502 L295.4166508213488,347.2486863674502 L295.4166508213488,367.2486863674502 Z" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><path d="M198.01948986768616,379.418446326996 L198.01948986768616,363.418446326996 L208.01948986768616,357.418446326996 L208.01948986768616,363.418446326996 L218.01948986768616,357.418446326996 L218.01948986768616,363.418446326996 L226.01948986768616,359.418446326996 L226.01948986768616,379.418446326996 Z" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><path d="M137.03560943604418,344.1333881096609 L137.03560943604418,328.1333881096609 L147.03560943604418,322.1333881096609 L147.03560943604418,328.1333881096609 L157.03560943604418,322.1333881096609 L157.03560943604418,328.1333881096609 L165.03560943604418,324.1333881096609 L165.03560943604418,344.1333881096609 Z" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><path d="M113.00004494072381,277.90378260507697 L113.00004494072381,261.90378260507697 L123.00004494072381,255.90378260507697 L123.00004494072381,261.90378260507697 L133.0000449407238,255.90378260507697 L133.0000449407238,261.90378260507697 L141.0000449407238,257.90378260507697 L141.0000449407238,277.90378260507697 Z" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><path d="M137.15930413462985,211.71919828891473 L137.15930413462985,195.71919828891473 L147.15930413462985,189.71919828891473 L147.15930413462985,195.71919828891473 L157.15930413462985,189.71919828891473 L157.15930413462985,195.71919828891473 L165.15930413462985,191.71919828891473 L165.15930413462985,211.71919828891473 Z" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><path d="M198.20900114067572,176.54813772242758 L198.20900114067572,160.54813772242758 L208.20900114067572,154.54813772242758 L208.20900114067572,160.54813772242758 L218.20900114067572,154.54813772242758 L218.20900114067572,160.54813772242758 L226.20900114067572,156.54813772242758 L226.20900114067572,176.54813772242758 Z" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><path d="M267.58330423792734,188.84753102747277 L267.58330423792734,172.84753102747277 L277.58330423792734,166.84753102747277 L277.58330423792734,172.84753102747277 L287.58330423792734,166.84753102747277 L287.58330423792734,172.84753102747277 L295.58330423792734,168.84753102747277 L295.58330423792734,188.84753102747277 Z" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><path d="M312.821205997684,242.86235538408926 L312.821205997684,226.86235538408926 L322.821205997684,220.86235538408926 L322.821205997684,226.86235538408926 L332.821205997684,220.86235538408926 L332.821205997684,226.86235538408926 L340.821205997684,222.86235538408926 L340.821205997684,242.86235538408926 Z" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="230" y="126" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">production stops in factory after factory</text><text x="400" y="150" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" font-style="italic">“Liability in an indeterminate amount for an</text><text x="400" y="174" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" font-style="italic">indeterminate time to an indeterminate class”</text><text x="400" y="236" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Cardozo J, Ultramares v Touche (1931, United States)</text><text x="400" y="276" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Spartan</tspan> <tspan font-weight="700">Steel</tspan> <tspan font-weight="700">v</tspan> <tspan font-weight="700">Martin</tspan> (1973): businesses can insure</text><text x="400" y="297" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">against interruptions; the loss is spread thinly across</text><text x="400" y="318" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">many claimants.</text><rect x="30" y="422" width="270.6666666666667" height="143" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="450" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">RECOVERY ALLOWED</text><text x="46" y="475.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">A special relationship</text><text x="46" y="502.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Hedley</tspan> <tspan font-style="italic">Byrne</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Heller</tspan> (1964)</text><rect x="314.6666666666667" y="422" width="270.6666666666667" height="143" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="330.6666666666667" y="450" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">REFUSED</text><text x="330.6666666666667" y="475.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Negligent acts</text><text x="330.6666666666667" y="502.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Loss not following physical</text><text x="330.6666666666667" y="523.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">damage</text><rect x="599.3333333333334" y="422" width="270.6666666666667" height="143" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="615.3333333333334" y="450" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EVALUATION</text><text x="615.3333333333334" y="475.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Clear and predictable</text><text x="615.3333333333334" y="502.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">but can be arbitrary: depends</text><text x="615.3333333333334" y="523.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">on whether the loss followed</text><text x="615.3333333333334" y="544.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">physical damage</text>
</svg>