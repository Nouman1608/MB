<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 635" width="900" height="635" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="635" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Psychiatric injury: why the controls exist</text>

<rect x="30" y="100" width="270.6666666666667" height="100" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="46" y="130.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Vast numbers</text><text x="46" y="158.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Many can witness an accident,</text><text x="46" y="179.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">especially on television</text><rect x="314.6666666666667" y="100" width="270.6666666666667" height="100" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="330.6666666666667" y="130.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Fraud and exaggeration</text><text x="330.6666666666667" y="158.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Fear of false or inflated claims</text><rect x="599.3333333333334" y="100" width="270.6666666666667" height="100" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="615.3333333333334" y="130.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Proportion</text><text x="615.3333333333334" y="158.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Burden on defendants out of</text><text x="615.3333333333334" y="179.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">proportion to fault</text><rect x="30" y="222" width="840" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><line x1="70" y1="292" x2="830" y2="292" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><circle cx="140" cy="292" r="11" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="140" y="270" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">1992</text><text x="140" y="330" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle"><tspan font-style="italic">Alcock</tspan></text><text x="140" y="392" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">Control mechanisms for</text><text x="140" y="411" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">secondary victims</text><circle cx="345" cy="292" r="11" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="345" y="270" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">1998</text><text x="345" y="330" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle"><tspan font-style="italic">White</tspan></text><text x="345" y="392" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">Police officers failed:</text><text x="345" y="411" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">unfair if relatives in</text><text x="345" y="430" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">Alcock had not</text><circle cx="555" cy="292" r="11" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><text x="555" y="270" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">1998</text><text x="555" y="330" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Law Commission</text><text x="555" y="392" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">Relax proximity for close</text><text x="555" y="411" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">ties; not enacted</text><circle cx="760" cy="292" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="760" y="270" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">2024</text><text x="760" y="330" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle"><tspan font-style="italic">Paul</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Royal</tspan></text><text x="760" y="349" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle"><tspan font-style="italic">Wolverhampton</tspan></text><text x="760" y="392" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">Courts will not widen the</text><text x="760" y="411" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">categories</text><rect x="30" y="494" width="840" height="109" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="528.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Evaluation</text><text x="450" y="557.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Fair in its predictability, but not in individual results: a brother may fail where a fiancée succeeds,</text><text x="450" y="578.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">depending on proof of a close tie.</text>
</svg>