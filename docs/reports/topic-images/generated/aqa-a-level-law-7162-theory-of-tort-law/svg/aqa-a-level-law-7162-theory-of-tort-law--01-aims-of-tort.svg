<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 634" width="900" height="634" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="634" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What tort law is trying to do</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Name the aim before you judge the rule against it</text>
<line x1="330" y1="174" x2="412" y2="253.8" stroke="#1e2a44" stroke-width="2.5"/><line x1="330" y1="288" x2="412" y2="288" stroke="#1e2a44" stroke-width="2.5"/><line x1="330" y1="402" x2="412" y2="322.2" stroke="#1e2a44" stroke-width="2.5"/><line x1="570" y1="220.5" x2="488" y2="267.75" stroke="#1e2a44" stroke-width="2.5"/><line x1="570" y1="355.5" x2="488" y2="308.25" stroke="#1e2a44" stroke-width="2.5"/><circle cx="450" cy="288" r="76" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="282.8" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Aims of</text><text x="450" y="307.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">tort</text><rect x="30" y="124" width="300" height="100" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="154.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Compensation</text><text x="46" y="182.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Restore the position before the</text><text x="46" y="203.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">tort: compensatory damages</text><rect x="30" y="238" width="300" height="100" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="46" y="268.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Corrective justice</text><text x="46" y="296.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The wrongdoer, not the victim,</text><text x="46" y="317.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">bears loss caused by fault</text><rect x="30" y="352" width="300" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="382.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Deterrence</text><text x="46" y="410.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Threat of liability encourages care:</text><text x="46" y="431.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">breach factors; employers</text><rect x="570" y="160" width="300" height="121" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="586" y="190.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Loss spreading</text><text x="586" y="218.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Insurers spread losses: vicarious</text><text x="586" y="239.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">liability; compulsory motor</text><text x="586" y="260.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">insurance</text><rect x="570" y="295" width="300" height="121" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="586" y="325.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Protecting interests in land</text><text x="586" y="353.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Neighbours tolerate each other</text><text x="586" y="374.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">within limits: nuisance and</text><text x="586" y="395.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">injunctions</text><text x="450" y="492" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">THE AIMS PULL AGAINST EACH OTHER</text><rect x="30" y="506" width="270.6666666666667" height="96" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="165.33333333333334" y="544.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Compensation</text><text x="165.33333333333334" y="573.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">favours wide liability</text><rect x="314.6666666666667" y="506" width="270.6666666666667" height="96" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="544.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Corrective justice</text><text x="450" y="573.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">liability only for real fault</text><rect x="599.3333333333334" y="506" width="270.6666666666667" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="734.6666666666667" y="534.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Fear of over-burdening</text><text x="734.6666666666667" y="562.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">defendants and courts: narrow</text><text x="734.6666666666667" y="583.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">liability</text>
</svg>