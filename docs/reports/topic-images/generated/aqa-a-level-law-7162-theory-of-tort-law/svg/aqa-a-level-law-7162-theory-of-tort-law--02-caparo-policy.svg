<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 558" width="900" height="558" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="558" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Caparo’s third limb: fair, just and reasonable?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Caparo Industries v Dickman (1990): openly a policy question</text>
<rect x="30" y="124" width="412" height="122" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="46" y="152" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">DEFENSIVE PRACTICE; DIVERTED RESOURCES</text><text x="46" y="177.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Hill v CC of West Yorkshire (1989)</text><text x="46" y="204.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">No duty to a future victim of a serial killer police</text><text x="46" y="225.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">had failed to catch</text><rect x="458" y="124" width="412" height="122" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="474" y="152" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">WHO SHOULD CARRY THE LOSS</text><text x="474" y="177.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Marc Rich v Bishop Rock (1995)</text><text x="474" y="204.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">No duty from a classification society to cargo</text><text x="474" y="225.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">owners: shipowner and insurers carried the risk</text><rect x="30" y="260" width="412" height="143" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="46" y="288" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">OMISSIONS STILL LIMITED</text><text x="46" y="313.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Michael v CC of South Wales (2015)</text><text x="46" y="340.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">No negligence duty for a mishandled emergency</text><text x="46" y="361.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">call; a human rights claim could continue</text><rect x="458" y="260" width="412" height="143" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="474" y="288" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">LIMITS ON THE LIMIT</text><text x="474" y="313.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Robinson v CC of West Yorkshire (2018)</text><text x="474" y="340.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">No general police immunity: officers who knocked</text><text x="474" y="361.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">over a pedestrian in an arrest were liable.</text><text x="474" y="382.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Established duties applied directly</text><rect x="30" y="425" width="412" height="101" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="46" y="453" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SUPPORTERS</text><text x="46" y="484.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A policy filter keeps the law workable and stops</text><text x="46" y="505.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">liability spreading to every careless public service</text><rect x="458" y="425" width="412" height="101" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="474" y="453" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CRITICS</text><text x="474" y="484.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“Policy” is vague; no evidence defensive practice</text><text x="474" y="505.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">follows liability; the claimant in <tspan font-style="italic">Hill</tspan> had no remedy</text>
</svg>