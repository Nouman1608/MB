<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 585" width="900" height="585" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="585" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why make an employer liable without fault?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Lord Phillips, Various Claimants v Catholic Child Welfare Society (2012)</text>
<line x1="60" y1="144" x2="60" y2="389" stroke="#c9d6d4" stroke-width="4"/><rect x="104" y="124" width="766" height="45" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="117" y="151.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">More likely to be able to pay, and to be insured</text><circle cx="60" cy="146.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="155.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="104" y="177" width="766" height="45" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="117" y="204.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The tort arose from an activity carried out on the employer’s behalf</text><circle cx="60" cy="199.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="208.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="104" y="230" width="766" height="45" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="117" y="257.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">That activity is part of the employer’s business</text><circle cx="60" cy="252.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="261.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="104" y="283" width="766" height="73" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="117" y="310.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">By employing the person, the employer created the risk</text><text x="117" y="338.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Cox</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Ministry</tspan> <tspan font-style="italic">of</tspan> <tspan font-style="italic">Justice</tspan> (2016), Lord Reed: “enterprise risk” is central</text><circle cx="60" cy="319.5" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="328.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="104" y="364" width="766" height="45" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="117" y="391.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The employee was under the employer’s control to some degree</text><circle cx="60" cy="386.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="395.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><rect x="30" y="431" width="412" height="122" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="459" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FOR</text><text x="46" y="490.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Secures compensation; encourages careful</text><text x="46" y="511.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">recruitment and supervision</text><rect x="458" y="431" width="412" height="122" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="474" y="459" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">AGAINST</text><text x="474" y="490.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Liability for a party who did nothing wrong;</text><text x="474" y="511.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">uncertain boundaries, limited in <tspan font-style="italic">Barclays</tspan> <tspan font-style="italic">Bank</tspan></text><text x="474" y="532.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(2020)</text>
</svg>