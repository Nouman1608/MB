<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 794" width="900" height="794" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="794" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The objective standard as a cost-benefit judgement</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Would a reasonable person have taken the precaution?</text>
<rect x="30" y="124" width="840" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><polygon points="450,214 416,354 484,354" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><line x1="160" y1="214" x2="740" y2="214" stroke="#1e2a44" stroke-width="5"/><path d="M200,214 L130,264 M200,214 L270,264" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M95,264 L305,264 Q200,334 95,264 Z" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="200" y="170" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Risk: take the precaution</text><text x="200" y="354" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Probability  ·  Seriousness</text><path d="M700,214 L630,264 M700,214 L770,264" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M595,264 L805,264 Q700,334 595,264 Z" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><text x="700" y="170" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Against the precaution</text><text x="700" y="354" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Cost  ·  Social utility</text><rect x="30" y="396" width="412" height="101" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="424" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CERTAINTY AND EQUALITY</text><text x="46" y="455.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Everyone knows the standard; claimants</text><text x="46" y="476.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">protected equally</text><rect x="458" y="396" width="412" height="101" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="474" y="424" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">INSURANCE</text><text x="474" y="455.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Nettleship</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Weston</tspan> (1971): learner judged as</text><text x="474" y="476.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">competent; motor insurance is compulsory</text><rect x="30" y="509" width="412" height="122" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="537" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ADJUSTED WHERE JUSTIFIED</text><text x="46" y="568.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Children (<tspan font-style="italic">Mullin</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Richards</tspan>, 1998); professionals</text><text x="46" y="589.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(<tspan font-style="italic">Bolam</tspan>, 1957; <tspan font-style="italic">Bolitho</tspan>, 1997)</text><rect x="458" y="509" width="412" height="122" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="474" y="537" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SOCIAL UTILITY</text><text x="474" y="568.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Daborn</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Bath</tspan> <tspan font-style="italic">Tramways</tspan> (1946): wartime</text><text x="474" y="589.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">ambulance. Compensation Act 2006 s1; the 2015</text><text x="474" y="610.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Act</text><rect x="30" y="653" width="840" height="109" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="687.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Evaluation</text><text x="450" y="716.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Harsh on the inexperienced doing their honest best: better seen as allocating risk than moral blame. The</text><text x="450" y="737.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">2006 and 2015 Acts may only restate what courts already did.</text>
</svg>