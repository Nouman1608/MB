<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Explaining any factor</text>

<text x="450" y="128" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Link all three in one sentence chain</text><rect x="30" y="150" width="246.66666666666666" height="152" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="153.33333333333331" y="215.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Factor</text><text x="153.33333333333331" y="245.3" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Social class</text><line x1="280.66666666666663" y1="226" x2="322.66666666666663" y2="226" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="326.66666666666663" y="150" width="246.66666666666666" height="152" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="449.99999999999994" y="182.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Mechanism</text><text x="449.99999999999994" y="212.3" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Low income: damp,</text><text x="449.99999999999994" y="234.3" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">overcrowded housing; a</text><text x="449.99999999999994" y="256.3" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">healthy diet is hard to</text><text x="449.99999999999994" y="278.3" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">afford</text><line x1="577.3333333333333" y1="226" x2="619.3333333333333" y2="226" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="623.3333333333333" y="150" width="246.66666666666666" height="152" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="746.6666666666666" y="204.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Outcome</text><text x="746.6666666666666" y="234.3" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Higher risk of illness:</text><text x="746.6666666666666" y="256.3" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">poorer health</text><text x="450" y="338" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">More chains from the specification’s factors</text><rect x="30" y="358" width="170" height="58" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="115" y="394" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Gender</text><line x1="204" y1="387" x2="226" y2="387" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="230" y="358" width="420" height="58" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="244" y="391.7" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Unpaid caring, part-time work, the glass ceiling</text><line x1="654" y1="387" x2="676" y2="387" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="680" y="358" width="190" height="58" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="775" y="391.7" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Income, employment</text><rect x="30" y="426" width="170" height="58" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="115" y="462" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Age</text><line x1="204" y1="455" x2="226" y2="455" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="230" y="426" width="420" height="58" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="244" y="459.7" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Ageism: young job seekers and older workers</text><line x1="654" y1="455" x2="676" y2="455" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="680" y="426" width="190" height="58" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="775" y="459.7" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Employment, income</text><rect x="30" y="494" width="170" height="58" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="115" y="530" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Disability</text><line x1="204" y1="523" x2="226" y2="523" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="230" y="494" width="420" height="58" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="244" y="527.7" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Physical barriers and employer attitudes</text><line x1="654" y1="523" x2="676" y2="523" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="680" y="494" width="190" height="58" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="775" y="527.7" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Employment, income</text><rect x="30" y="562" width="170" height="58" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="115" y="598" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Sexuality</text><line x1="204" y1="591" x2="226" y2="591" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="230" y="562" width="420" height="58" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="244" y="595.7" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Prejudice and bullying at school or work</text><line x1="654" y1="591" x2="676" y2="591" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="680" y="562" width="190" height="58" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="775" y="595.7" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Education, health</text>
