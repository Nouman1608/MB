<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 482" width="900" height="482" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="482" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The Equality Act 2010</text>

<rect x="30" y="108" width="404" height="350" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,158 L31.25,122.25 Q31.25,109.25 44.25,109.25 L419.75,109.25 Q432.75,109.25 432.75,122.25 L432.75,158 Z" fill="#b5d3cf"/><line x1="31.25" y1="158" x2="432.75" y2="158" stroke="#c9d6d4" stroke-width="2"/><text x="232" y="138.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">What it protects</text><rect x="52" y="184" width="172" height="54" rx="27" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="138" y="217" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Age</text><rect x="238" y="184" width="172" height="54" rx="27" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="324" y="217" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Disability</text><rect x="52" y="254" width="172" height="54" rx="27" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="138" y="287" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Race</text><rect x="238" y="254" width="172" height="54" rx="27" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="324" y="287" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Religion or belief</text><rect x="52" y="324" width="172" height="54" rx="27" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="138" y="357" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Sex</text><rect x="238" y="324" width="172" height="54" rx="27" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="324" y="357" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Sexual orientation</text><text x="232" y="420" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Brought earlier equality laws together</text><rect x="466" y="108" width="404" height="350" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M467.25,158 L467.25,122.25 Q467.25,109.25 480.25,109.25 L855.75,109.25 Q868.75,109.25 868.75,122.25 L868.75,158 Z" fill="#f2e7b8"/><line x1="467.25" y1="158" x2="868.75" y2="158" stroke="#c9d6d4" stroke-width="2"/><text x="668" y="138.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Its limits</text><circle cx="493" cy="184.39" r="4.5" fill="#2e6b62"/><text x="506" y="190" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Discrimination can be <tspan font-weight="700">hard to prove</tspan></text><circle cx="493" cy="220.39" r="4.5" fill="#2e6b62"/><text x="506" y="226" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Some inequalities, such as <tspan font-weight="700">unpaid</tspan></text><text x="506" y="248" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">caring</tspan>, are not covered by</text><text x="506" y="270" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">anti-discrimination law at all</text><circle cx="493" cy="300.39" r="4.5" fill="#2e6b62"/><text x="506" y="306" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Prejudice and harassment, for example</text><text x="506" y="328" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">over sexuality, have not disappeared</text>
</svg>