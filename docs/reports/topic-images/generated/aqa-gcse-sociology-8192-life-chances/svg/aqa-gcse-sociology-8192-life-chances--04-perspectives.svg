<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 466" width="900" height="466" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="466" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Perspectives on life chances</text>

<rect x="30" y="112" width="300" height="330" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="180" y="150" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Functionalist</text><text x="180" y="178" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="middle">differences are fair outcomes</text><circle cx="55" cy="214.72" r="4.5" fill="#2e6b62"/><text x="68" y="220" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Reflect talent and effort in a</text><text x="68" y="241" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">broadly meritocratic society</text><circle cx="55" cy="264.72" r="4.5" fill="#2e6b62"/><text x="68" y="270" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Social mobility lets able</text><text x="68" y="291" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">people improve their chances</text><circle cx="55" cy="314.72" r="4.5" fill="#2e6b62"/><text x="68" y="320" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Inequality motivates hard work</text><rect x="370" y="112" width="500" height="330" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="620" y="150" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Structured inequality</text><text x="620" y="178" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="middle">but which cause matters most?</text><rect x="390" y="200" width="220" height="222" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="500" y="230" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Marxist: class</text><circle cx="409" cy="256.885" r="4.5" fill="#2e6b62"/><text x="422" y="262" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Capitalism</text><text x="422" y="282" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">concentrates wealth</text><text x="422" y="302" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">with owners</text><circle cx="409" cy="322.885" r="4.5" fill="#2e6b62"/><text x="422" y="328" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Workers face low pay</text><text x="422" y="348" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">and insecurity</text><circle cx="409" cy="368.885" r="4.5" fill="#2e6b62"/><text x="422" y="374" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Racism divides</text><text x="422" y="394" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">workers</text><rect x="630" y="200" width="220" height="222" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="740" y="230" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Feminist: gender</text><circle cx="649" cy="256.885" r="4.5" fill="#2e6b62"/><text x="662" y="262" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Patriarchy: unpaid</text><text x="662" y="282" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">work, lower pay,</text><text x="662" y="302" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">glass ceiling, male</text><text x="662" y="322" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">violence</text><circle cx="649" cy="342.885" r="4.5" fill="#2e6b62"/><text x="662" y="348" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Outcomes differ</text><text x="662" y="368" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">between women by</text><text x="662" y="388" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">class and ethnicity</text><circle cx="350" cy="277" r="22" fill="#1e2a44"/><text x="350" y="284" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">vs</text>
</svg>