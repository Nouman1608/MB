<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 630" width="900" height="630" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="630" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Pyramids of numbers and energy</text>

<rect x="30" y="110" width="410" height="470" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="460" y="110" width="410" height="470" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="235" y="148" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Pyramid of numbers</text><text x="235" y="172" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">woodland: can be inverted</text><text x="665" y="148" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Pyramid of energy</text><text x="665" y="172" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">always pyramid-shaped</text><rect x="210" y="210" width="50" height="52" rx="0" fill="#b5602e" stroke="#1e2a44" stroke-width="2.5"/><text x="272" y="242" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">2 hawks</text><rect x="165" y="280" width="140" height="52" rx="0" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="317" y="312" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">40 small birds</text><rect x="70" y="350" width="330" height="52" rx="0" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="235" y="382" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">2,000 caterpillars</text><rect x="220" y="420" width="30" height="52" rx="0" fill="#6f9a52" stroke="#1e2a44" stroke-width="2.5"/><text x="262" y="452" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">1 oak tree</text><rect x="640" y="210" width="50" height="52" rx="0" fill="#b5602e" stroke="#1e2a44" stroke-width="2.5"/><text x="700" y="242" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">tertiary</text><rect x="600" y="280" width="130" height="52" rx="0" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="740" y="312" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">secondary</text><rect x="550" y="350" width="230" height="52" rx="0" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="665" y="382" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">primary consumers</text><rect x="490" y="420" width="350" height="52" rx="0" fill="#6f9a52" stroke="#1e2a44" stroke-width="2.5"/><text x="665" y="452" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">producers</text><text x="54" y="506" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">One large producer feeds thousands of</text><text x="54" y="527" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">small consumers, so the bottom bar is</text><text x="54" y="548" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">narrower.</text><text x="484" y="506" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Only about 10% passes on at each level, so</text><text x="484" y="527" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">every bar is smaller than the one below.</text><text x="450" y="606" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Bar widths are not to scale.</text>
</svg>