e x1="134" y1="371" x2="134" y2="393" stroke="#1e2a44" stroke-width="2"/><ellipse cx="200" cy="382" rx="22" ry="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><line x1="192" y1="372" x2="192" y2="392" stroke="#1e2a44" stroke-width="2"/><line x1="204" y1="371" x2="204" y2="393" stroke="#1e2a44" stroke-width="2"/><ellipse cx="270" cy="382" rx="22" ry="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><line x1="262" y1="372" x2="262" y2="392" stroke="#1e2a44" stroke-width="2"/><line x1="274" y1="371" x2="274" y2="393" stroke="#1e2a44" stroke-width="2"/><ellipse cx="340" cy="382" rx="22" ry="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><line x1="332" y1="372" x2="332" y2="392" stroke="#1e2a44" stroke-width="2"/><line x1="344" y1="371" x2="344" y2="393" stroke="#1e2a44" stroke-width="2"/><circle cx="470" cy="260" r="12" fill="#6f9a52" stroke="#1e2a44" stroke-width="2"/><text x="492" y="266" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">grasses</text><circle cx="650" cy="260" r="12" fill="#6f9a52" stroke="#1e2a44" stroke-width="2"/><text x="672" y="266" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">trees</text><circle cx="470" cy="324" r="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="492" y="330" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">lions</text><circle cx="650" cy="324" r="12" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><text x="672" y="330" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">termites</text><circle cx="470" cy="388" r="12" fill="#2b5a9a" stroke="#1e2a44" stroke-width="2"/><text x="492" y="394" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">birds</text><text x="84" y="480" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start"></text><text x="54" y="506" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Species: zebras can breed together to produce fertile offspring</text><