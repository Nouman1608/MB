<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 670" width="900" height="670" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="670" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Energy along a pond food chain</text>

<rect x="30" y="110" width="190" height="76" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="125" y="138.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Algae</text><text x="125" y="170.82" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">producer</text><rect x="75" y="257.5428574869561" width="100" height="182.4571425130439" rx="0" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="125" y="241.5428574869561" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">60,000 kJ</text><line x1="222" y1="148" x2="243" y2="148" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="233" y="300" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">10%</text><line x1="210" y1="318" x2="250" y2="318" stroke="#8a6d0d" stroke-width="3" marker-end="url(#ahO)"/><line x1="233" y1="452" x2="233" y2="496" stroke="#b5602e" stroke-width="3.5" marker-end="url(#ahR)"/><rect x="246" y="110" width="190" height="76" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="341" y="138.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Water flea</text><text x="341" y="170.82" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">primary consumer</text><rect x="291" y="291.5428574869561" width="100" height="148.4571425130439" rx="0" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="341" y="275.5428574869561" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">6,000 kJ</text><line x1="438" y1="148" x2="459" y2="148" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="449" y="300" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">10%</text><line x1="426" y1="318" x2="466" y2="318" stroke="#8a6d0d" stroke-width="3" marker-end="url(#ahO)"/><line x1="449" y1="452" x2="449" y2="496" stroke="#b5602e" stroke-width="3.5" marker-end="url(#ahR)"/><rect x="462" y="110" width="190" height="76" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="557" y="138.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Small fish</text><text x="557" y="170.82" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">secondary consumer</text><rect x="507" y="325.5428574869561" width="100" height="114.45714251304388" rx="0" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="557" y="309.5428574869561" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">600 kJ</text><line x1="654" y1="148" x2="675" y2="148" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="665" y="300" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">10%</text><line x1="642" y1="318" x2="682" y2="318" stroke="#8a6d0d" stroke-width="3" marker-end="url(#ahO)"/><line x1="665" y1="452" x2="665" y2="496" stroke="#b5602e" stroke-width="3.5" marker-end="url(#ahR)"/><rect x="678" y="110" width="190" height="76" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="773" y="138.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Heron</text><text x="773" y="170.82" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">tertiary consumer</text><rect x="723" y="359.5428574869561" width="100" height="80.45714251304389" rx="0" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="773" y="343.5428574869561" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">60 kJ</text><line x1="30" y1="440" x2="870" y2="440" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="534" font-size="16" font-weight="600" fill="#b5602e" text-anchor="middle">Lost at each step (90%): respiration (as heat), movement, digestion (faeces) and excretion</text><rect x="30" y="560" width="840" height="60" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="594.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Algae to water fleas: 60,000 × 10 ÷ 100 = 6,000 kJ passed on, so 54,000 kJ is lost.</text><text x="450" y="646" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Energy in kJ per square metre per year. Bar heights use a log scale so all four fit.</text>
</svg>