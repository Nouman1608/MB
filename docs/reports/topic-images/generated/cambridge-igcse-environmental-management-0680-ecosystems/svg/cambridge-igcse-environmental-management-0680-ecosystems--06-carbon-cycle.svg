<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" width="900" height="720" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="720" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The carbon cycle</text>

<rect x="300" y="110" width="300" height="70" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="138.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Carbon dioxide in air or</text><text x="450" y="161.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">water</text><rect x="40" y="330" width="210" height="70" rx="12" fill="#6f9a52" stroke="#1e2a44" stroke-width="2.5"/><text x="145" y="358.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Producers</text><text x="145" y="381.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">(glucose)</text><rect x="345" y="330" width="210" height="70" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="369.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Consumers</text><rect x="650" y="330" width="210" height="70" rx="12" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.5"/><text x="755" y="358.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Dead organisms and</text><text x="755" y="381.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">waste</text><rect x="345" y="560" width="210" height="70" rx="12" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="588.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Fossil fuels:</text><text x="450" y="611.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">coal, oil, gas</text><polyline points="300,150 145,150 145,324" fill="none" stroke="#2e6b62" stroke-width="4" stroke-linejoin="round" marker-end="url(#ahT)"/><text x="150" y="140" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">photosynthesis</text><line x1="255" y1="365" x2="339" y2="365" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><text x="297" y="355" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">feeding</text><polyline points="195,326 195,260 330,260 400,186" fill="none" stroke="#b5602e" stroke-width="3.5" stroke-linejoin="round" marker-end="url(#ahR)"/><line x1="450" y1="326" x2="450" y2="186" stroke="#b5602e" stroke-width="3.5" marker-end="url(#ahR)"/><text x="462" y="250" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">respiration</text><polyline points="145,404 145,450 700,450 700,405" fill="none" stroke="#1e2a44" stroke-width="3.5" stroke-linejoin="round" marker-end="url(#ah)"/><line x1="450" y1="404" x2="450" y2="444" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="560" y="442" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">death and waste</text><polyline points="755,326 755,145 606,145" fill="none" stroke="#b5602e" stroke-width="3.5" stroke-linejoin="round" marker-end="url(#ahR)"/><text x="765" y="230" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">decomposition</text><text x="765" y="250" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">(decomposers</text><text x="765" y="268" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">respire)</text><polyline points="800,404 800,595 561,595" fill="none" stroke="#1e2a44" stroke-width="3.5" stroke-linejoin="round" marker-end="url(#ah)" stroke-dasharray="10 6"/><text x="680" y="588" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">buried, not decomposed:</text><text x="680" y="620" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">millions of years</text><polyline points="340,595 80,595 80,200 294,170" fill="none" stroke="#b5602e" stroke-width="5" stroke-linejoin="round" marker-end="url(#ahR)"/><text x="90" y="520" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">combustion</text><text x="90" y="540" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">(and burning wood)</text><text x="450" y="672" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Carbon is recycled; energy is not.</text><text x="450" y="694" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Combustion and deforestation add carbon dioxide faster than photosynthesis removes it.</text>
</svg>