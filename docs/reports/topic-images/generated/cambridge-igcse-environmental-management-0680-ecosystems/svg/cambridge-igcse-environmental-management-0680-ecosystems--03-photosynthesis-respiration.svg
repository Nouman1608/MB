<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="620" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Two reactions, reversed</text>

<rect x="40" y="260" width="260" height="80" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="170" y="292.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">carbon dioxide +</text><text x="170" y="317.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">water</text><rect x="600" y="260" width="260" height="80" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="730" y="305.1" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">glucose + oxygen</text><path d="M300,270 Q450,170 596,270" fill="none" stroke="#2e6b62" stroke-width="6" marker-end="url(#ahT)"/><path d="M600,330 Q450,430 304,330" fill="none" stroke="#b5602e" stroke-width="6" marker-end="url(#ahR)"/><text x="450" y="158" font-size="22" font-weight="700" fill="#2e6b62" text-anchor="middle">Photosynthesis</text><circle cx="450" cy="244" r="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="290" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">sunlight energy,</text><text x="450" y="310" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">captured by chlorophyll</text><text x="450" y="446" font-size="22" font-weight="700" fill="#b5602e" text-anchor="middle">Aerobic respiration</text><text x="450" y="412" font-size="16" font-weight="600" fill="#b5602e" text-anchor="middle">releases energy</text><rect x="30" y="500" width="410" height="90" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="535.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Photosynthesis</text><text x="48" y="566.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">producers only, and only in light</text><rect x="460" y="500" width="410" height="90" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="478" y="524.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Aerobic respiration</text><text x="478" y="555.54" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">all living organisms, including plants, day</text><text x="478" y="576.54" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and night</text>
</svg>