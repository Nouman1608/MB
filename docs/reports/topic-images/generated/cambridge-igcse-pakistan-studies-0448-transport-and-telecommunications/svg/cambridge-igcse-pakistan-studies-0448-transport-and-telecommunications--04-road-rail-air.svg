<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 555" width="900" height="555" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="555" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Road, rail or air? Choose for the purpose</text>

<text x="228.5" y="124" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Task</text><text x="671.5" y="124" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Best choice and reason</text><rect x="30" y="140" width="397" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="168.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Fresh mangoes, Multan to Lahore market</text><line x1="433" y1="175" x2="467" y2="175" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="473" y="140" width="397" height="70" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="489" y="168.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Road: door-to-door, quick, flexible for</text><text x="489" y="189.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">perishable goods</text><rect x="30" y="224" width="397" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="252.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Bulk coal or cement, long distance</text><line x1="433" y1="259" x2="467" y2="259" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="473" y="224" width="397" height="70" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="489" y="252.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Rail: cheaper per tonne for heavy, bulky</text><text x="489" y="273.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">loads</text><rect x="30" y="308" width="397" height="49" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="336.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Business trip, Karachi to Islamabad</text><line x1="433" y1="332.5" x2="467" y2="332.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="473" y="308" width="397" height="49" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="489" y="336.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Air: time matters more than cost</text><rect x="30" y="371" width="397" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="399.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Supplies to a mountain village</text><line x1="433" y1="406" x2="467" y2="406" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="473" y="371" width="397" height="70" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="489" y="399.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Road (jeep): the only option on narrow</text><text x="489" y="420.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">tracks</text><rect x="30" y="455" width="397" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="483.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Passengers to Skardu</text><line x1="433" y1="490" x2="467" y2="490" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="473" y="455" width="397" height="70" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="489" y="483.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Air, weather permitting: avoids a long,</text><text x="489" y="504.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">difficult road</text>
</svg>