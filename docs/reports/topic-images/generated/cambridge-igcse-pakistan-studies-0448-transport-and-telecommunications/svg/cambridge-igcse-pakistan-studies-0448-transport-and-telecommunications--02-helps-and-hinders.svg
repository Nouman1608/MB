<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 758" width="900" height="758" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="758" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What helps and hinders transport?</text>

<rect x="30" y="104" width="210" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="42" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Factor</text><rect x="240" y="104" width="300" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="252" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Helps</text><rect x="540" y="104" width="330" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="552" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Hinders</text><rect x="30" y="150" width="210" height="64" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="175.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Relief</text><rect x="240" y="150" width="300" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="252" y="175.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Flat Indus Plain: cheap to build</text><rect x="540" y="150" width="330" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="552" y="175.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Steep mountains: costly cuttings,</text><text x="552" y="196.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">tunnels, bridges</text><rect x="30" y="214" width="210" height="64" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="239.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Rivers</text><rect x="240" y="214" width="300" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="252" y="239.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Valleys give natural routes</text><rect x="540" y="214" width="330" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="552" y="239.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Long bridges needed; floods wash out</text><text x="552" y="260.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">roads and track</text><rect x="30" y="278" width="210" height="64" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="303.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Climate</text><rect x="240" y="278" width="300" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="252" y="303.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Dry weather in much of the south</text><rect x="540" y="278" width="330" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="552" y="303.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Monsoon floods; snow and avalanches;</text><text x="552" y="324.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">heat damages roads</text><rect x="30" y="342" width="210" height="64" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="367.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Ground</text><rect x="240" y="342" width="300" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="252" y="367.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Firm alluvial soils</text><rect x="540" y="342" width="330" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="552" y="367.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Landslides in mountains; shifting</text><text x="552" y="388.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">sand in deserts</text><rect x="30" y="406" width="210" height="64" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="431.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Population and</text><text x="42" y="452.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">economy</text><rect x="240" y="406" width="300" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="252" y="431.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Many people, farms and industry</text><text x="252" y="452.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">create demand</text><rect x="540" y="406" width="330" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="552" y="431.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Sparse population: low traffic and</text><text x="552" y="452.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">revenue</text><rect x="30" y="470" width="210" height="64" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="495.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Finance</text><rect x="240" y="470" width="300" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="252" y="495.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Loans and foreign investment</text><rect x="540" y="470" width="330" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="552" y="495.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">High building and maintenance costs;</text><text x="552" y="516.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">debt</text><rect x="30" y="534" width="210" height="64" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="559.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Security</text><rect x="240" y="534" width="300" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="252" y="559.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Stable areas attract investment</text><rect x="540" y="534" width="330" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="552" y="559.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Unrest raises costs and deters</text><text x="552" y="580.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">building</text><rect x="30" y="616" width="840" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="652" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Maintenance matters too</text><text x="50" y="681.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Overloaded lorries break road surfaces, floods destroy embankments, and old track and</text><text x="50" y="703.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">locomotives slow the railways.</text>
</svg>