<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 678" width="900" height="678" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="678" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Describing the pattern of the networks</text>

<text x="450" y="120" text-anchor="middle" font-size="16" fill="#4a5568" font-style="italic">schematic line diagram, not a map: order of places only</text><line x1="80" y1="210" x2="820" y2="210" stroke="#1e2a44" stroke-width="8" stroke-linecap="round"/><line x1="80" y1="226" x2="820" y2="226" stroke="#2e6b62" stroke-width="4" stroke-dasharray="14 8"/><circle cx="80" cy="218" r="13" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="80" y="186" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Karachi</text><circle cx="265" cy="218" r="13" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="265" y="186" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Hyderabad</text><circle cx="450" cy="218" r="13" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="186" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Multan</text><circle cx="635" cy="218" r="13" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="635" y="186" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Lahore</text><circle cx="820" cy="218" r="13" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="820" y="186" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Peshawar</text><text x="80" y="268" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">south-west</text><text x="820" y="268" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">north-east</text><line x1="300" y1="262" x2="360" y2="262" stroke="#1e2a44" stroke-width="8"/><text x="370" y="268" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">N-5 road</text><line x1="470" y1="262" x2="530" y2="262" stroke="#2e6b62" stroke-width="4" stroke-dasharray="14 8"/><text x="540" y="268" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">main railway line</text><text x="450" y="302" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">Linear: along the flat Indus valley, following the rivers</text><rect x="30" y="326" width="270.6666666666667" height="172" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="359" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DENSEST</text><text x="50" y="383.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Indus Plain of Punjab</text><text x="50" y="405.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">and northern Sindh</text><text x="50" y="432" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">A close network linking</text><text x="50" y="452" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Lahore, Faisalabad, Multan,</text><text x="50" y="472" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Gujranwala and Rawalpindi</text><rect x="314.6666666666667" y="326" width="270.6666666666667" height="172" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="334.6666666666667" y="359" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">SPARSE</text><text x="334.6666666666667" y="383.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Balochistan, Thar,</text><text x="334.6666666666667" y="405.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Cholistan, the northern</text><text x="334.6666666666667" y="427.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">mountains</text><text x="334.6666666666667" y="454" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">A few routes follow valleys</text><text x="334.6666666666667" y="474" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">and passes</text><rect x="599.3333333333334" y="326" width="270.6666666666667" height="172" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="619.3333333333334" y="359" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">AIR</text><text x="619.3333333333334" y="383.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Large cities plus</text><text x="619.3333333333334" y="405.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">remote northern towns</text><text x="619.3333333333334" y="432" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Gilgit, Skardu and Chitral:</text><text x="619.3333333333334" y="452" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">saves long road journeys</text><rect x="30" y="514" width="840" height="134" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="550" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Key routes</text><text x="50" y="579.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Also know: N-55 Indus Highway (west bank), N-25 Karachi–Quetta–Chaman, N-35 Karakoram</text><text x="50" y="601.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Highway, M-2 Lahore–Islamabad, M-1 Islamabad–Peshawar, and the railway to Quetta through</text><text x="50" y="623.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">the Bolan Pass.</text>
</svg>