<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 666" width="900" height="666" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="666" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Telecommunications and development</text>

<rect x="30" y="104" width="411" height="130" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="139.2" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Education</text><text x="50" y="167.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Radio, TV and online courses reach distant</text><text x="50" y="188.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">students: Allama Iqbal Open University, the</text><text x="50" y="209.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Virtual University</text><rect x="459" y="104" width="411" height="130" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="479" y="139.2" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Industry</text><text x="479" y="167.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Orders, designs and payments sent instantly;</text><text x="479" y="188.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">contact with buyers abroad</text><rect x="30" y="248" width="411" height="109" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="283.2" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Services</text><text x="50" y="311.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Mobile banking, call centres, software,</text><text x="50" y="332.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">freelancing, online health advice</text><rect x="459" y="248" width="411" height="109" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="479" y="283.2" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Trade</text><text x="479" y="311.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Email and internet link exporters to buyers;</text><text x="479" y="332.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">farmers check prices by phone</text><rect x="30" y="375" width="840" height="109" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="410.2" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">Problems of providing them</text><text x="50" y="438.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Mountains block signals and make masts and cables costly · scattered villages mean few customers</text><text x="50" y="459.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">per mast · power cuts · low incomes and literacy · flood damage · insecurity</text><rect x="30" y="502" width="840" height="134" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="538" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Role in development</text><text x="50" y="567.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">They lower costs, create IT jobs and spread education, but the gap between connected cities</text><text x="50" y="589.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">and poorly served rural areas can widen inequality, and they cannot replace roads for</text><text x="50" y="611.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">moving goods.</text>
</svg>