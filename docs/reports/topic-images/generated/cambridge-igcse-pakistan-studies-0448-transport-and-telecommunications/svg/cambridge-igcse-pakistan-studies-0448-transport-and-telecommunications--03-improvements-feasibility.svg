<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Recent improvements and their feasibility</text>

<line x1="176" y1="142" x2="176" y2="488" stroke="#1e2a44" stroke-width="4"/><rect x="206" y="104" width="664" height="76" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="220" y="133.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">M-2 Lahore–Islamabad motorway</text><text x="220" y="161.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Followed by the M-1, M-4, M-9 and CPEC links.</text><circle cx="176" cy="142" r="11" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="152" y="149" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="end">1990s</text><rect x="206" y="192" width="664" height="97" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="220" y="221.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Attabad landslide forms a lake</text><text x="220" y="249.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Karakoram Highway upgraded and partly realigned, with tunnels around the</text><text x="220" y="270.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">lake.</text><circle cx="176" cy="240.5" r="11" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="152" y="247.5" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="end">2010</text><rect x="206" y="301" width="664" height="49" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="220" y="330.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Islamabad International Airport opens</text><circle cx="176" cy="325.5" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="152" y="332.5" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="end">2018</text><rect x="206" y="362" width="664" height="76" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="220" y="391.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Urban transport</text><text x="220" y="419.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Bus rapid transit in Lahore and Peshawar; Lahore’s Orange Line metro.</text><circle cx="176" cy="400" r="11" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="152" y="407" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="end">Cities</text><rect x="206" y="450" width="664" height="76" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="220" y="479.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Main Karachi–Peshawar railway upgrade</text><text x="220" y="507.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">For faster, heavier trains.</text><circle cx="176" cy="488" r="11" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="152" y="495" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="end">Planned</text><rect x="113.30000000000007" y="544" width="219.72499999999997" height="42" rx="21" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="223.16250000000005" y="571.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Cost, and who pays?</text><rect x="345.02500000000003" y="544" width="180.62499999999997" height="42" rx="21" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="435.33750000000003" y="571.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Enough traffic?</text><rect x="537.65" y="544" width="249.04999999999995" height="42" rx="21" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="662.175" y="571.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Difficulty of the land</text><rect x="131.41250000000002" y="596" width="385.9" height="42" rx="21" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="324.3625" y="623.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Environment and people who lose land</text><rect x="529.3125" y="596" width="239.27499999999998" height="42" rx="21" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="648.95" y="623.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Can it be maintained?</text>
