<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 735" width="900" height="735" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="735" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Descriptive writing: build a picture and a mood</text>

<text x="45" y="135" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Move the camera to give description a structure</text><rect x="30" y="150" width="840" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="80" y="170" width="180" height="90" rx="6" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="170" y="286" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">wide view</text><line x1="270" y1="215" x2="380" y2="215" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="405" y="195" width="70" height="40" rx="6" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="440" y="261" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">detail</text><line x1="485" y1="215" x2="590" y2="215" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="600" y="165" width="200" height="100" rx="6" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="700" y="291" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">wider again</text><rect x="30" y="318" width="420" height="140" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="450" y="318" width="420" height="140" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="240" y="350" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Outside → inside</text><path d="M110,430 L110,385 L150,360 L190,385 L190,430 Z" fill="#dce9e7" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><rect x="140" y="402" width="20" height="28" fill="#1e2a44"/><line x1="215" y1="398" x2="275" y2="398" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="295" y="360" width="100" height="70" rx="4" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><rect x="320" y="388" width="50" height="16" fill="#8a6d0d"/><text x="660" y="350" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Same place, two times</text><rect x="520" y="365" width="110" height="64" rx="4" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><circle cx="605" cy="382" r="12" fill="#d4b02e"/><text x="575" y="452" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">earlier</text><line x1="640" y1="397" x2="685" y2="397" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="695" y="365" width="110" height="64" rx="4" fill="#2b5a9a" stroke="#1e2a44" stroke-width="2.5"/><circle cx="780" cy="382" r="9" fill="#ffffff"/><text x="750" y="452" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">later</text><rect x="30" y="478" width="410" height="104" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="516" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Narrow the focus</text><text x="52" y="544" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">One place at one moment, or one person in one</text><text x="52" y="565" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">action.</text><rect x="460" y="478" width="410" height="104" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="482" y="516" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Use the senses, but select</text><text x="482" y="544" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">One precise sound beats five vague ones.</text><rect x="30" y="598" width="410" height="104" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="52" y="636" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Exact nouns and verbs</text><text x="52" y="664" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">“the shutters rattled” beats “the very loud</text><text x="52" y="685" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">windows”</text><rect x="460" y="598" width="410" height="104" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="482" y="636" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Let the mood develop</text><text x="482" y="664" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Calm to tense, or the reverse, gives shape.</text>
</svg>