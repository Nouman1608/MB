<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 815" width="900" height="815" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="815" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three questions before you choose</text>

<rect x="30" y="110" width="840" height="110" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="70" cy="150" r="22" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="70" y="157.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="108" y="158" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Can I plan an ending for it right now?</text><text x="108" y="192" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">If you cannot see the end, you will drift.</text><rect x="30" y="238" width="840" height="230" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="70" cy="278" r="22" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="70" y="285.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="108" y="286" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Which task suits my strengths?</text><rect x="108" y="310" width="290" height="40" rx="20" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="253" y="336.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">precise vocabulary</text><line x1="405" y1="330" x2="455" y2="330" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="462" y="310" width="200" height="40" rx="20" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="562" y="336.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">description</text><rect x="108" y="360" width="290" height="40" rx="20" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="253" y="386.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">strong sense of shape</text><line x1="405" y1="380" x2="455" y2="380" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="462" y="360" width="200" height="40" rx="20" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="562" y="386.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">narrative</text><rect x="108" y="410" width="290" height="40" rx="20" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="253" y="436.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">clear opinions and evidence</text><line x1="405" y1="430" x2="455" y2="430" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="462" y="410" width="200" height="40" rx="20" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="562" y="436.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">argument</text><rect x="30" y="486" width="840" height="270" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="70" cy="526" r="22" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="70" y="533.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="108" y="534" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">What exactly does the task ask?</text><rect x="108" y="552" width="300" height="56" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="258" y="587" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">“Describe a moment when…”</text><text x="450" y="589" font-size="30" font-weight="700" fill="#b5602e" text-anchor="middle">≠</text><rect x="492" y="552" width="300" height="56" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="642" y="587" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">“Write a story about…”</text><rect x="108" y="630" width="140" height="40" rx="20" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="178" y="656.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">“discuss”</text><line x1="255" y1="650" x2="300" y2="650" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="310" y="656" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">a balanced exploration</text><rect x="108" y="686" width="140" height="40" rx="20" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="178" y="712.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">“argue”</text><line x1="255" y1="706" x2="300" y2="706" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="310" y="712" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">a position</text><text x="450" y="790" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Spend the first minutes deciding, not writing.</text>
</svg>