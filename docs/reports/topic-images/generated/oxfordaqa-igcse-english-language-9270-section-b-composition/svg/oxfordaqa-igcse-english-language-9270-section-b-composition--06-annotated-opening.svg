<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 699" width="900" height="699" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="699" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">An annotated descriptive opening</text>

<text x="450" y="128" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Task: Describe a railway station late at night.</text><rect x="30" y="150" width="450" height="106" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="52" y="184" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">The last train has gone.</text><line x1="484" y1="203" x2="522" y2="203" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="528" y="150" width="342" height="106" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="562" cy="188" r="22" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="562" y="195.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">W2</text><text x="596" y="184" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Short opening sentence sets</text><text x="596" y="206" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the moment and a mood of</text><text x="596" y="228" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">absence.</text><rect x="30" y="270" width="450" height="115" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="52" y="304" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">Under the station clock, a single pigeon</text><text x="52" y="329" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">walks in careful circles, as if it has</text><text x="52" y="354" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">lost something small.</text><line x1="484" y1="327.5" x2="522" y2="327.5" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="528" y="270" width="342" height="115" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="562" cy="308" r="22" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="562" y="315.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">W1</text><text x="596" y="304" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Precise, unusual detail;</text><text x="596" y="326" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the simile suggests</text><text x="596" y="348" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">searching and loneliness.</text><rect x="30" y="399" width="450" height="106" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="52" y="433" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">The vending machine hums to itself.</text><line x1="484" y1="452" x2="522" y2="452" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="528" y="399" width="342" height="106" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="548" y="433" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Personification makes the</text><text x="548" y="455" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">station feel alive but</text><text x="548" y="477" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">deserted.</text><rect x="30" y="519" width="450" height="150" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="52" y="553" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">Somewhere above the empty platform a</text><text x="52" y="578" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">loose sign creaks, settles, creaks again</text><text x="52" y="603" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">— the only conversation left in the</text><text x="52" y="628" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">building.</text><line x1="484" y1="594" x2="522" y2="594" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="528" y="519" width="342" height="150" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="562" cy="557" r="22" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="562" y="564.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">W3</text><text x="596" y="553" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Personification</text><text x="596" y="575" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(“conversation”); the dash</text><text x="596" y="597" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">isolates the final phrase,</text><text x="596" y="619" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">an image that could return</text><text x="596" y="641" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">at the end.</text>
</svg>