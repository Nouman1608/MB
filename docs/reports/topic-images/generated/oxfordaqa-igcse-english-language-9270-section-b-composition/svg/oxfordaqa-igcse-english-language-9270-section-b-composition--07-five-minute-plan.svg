<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 730" width="900" height="730" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="730" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Planning in five minutes</text>

<rect x="30" y="112" width="840" height="80" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="78" cy="152" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="78" y="160.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="124" y="148" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Task type and form</text><text x="124" y="174" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">in one line</text><rect x="30" y="204" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="78" cy="244" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="78" y="252.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="124" y="240" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Ending</text><text x="124" y="266" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">the final image, realisation or conclusion</text><rect x="30" y="296" width="840" height="80" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="78" cy="336" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="78" y="344.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="124" y="332" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Four or five paragraph headings</text><text x="124" y="358" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">in order</text><rect x="30" y="388" width="840" height="80" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="78" cy="428" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="78" y="436.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="124" y="424" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Three ambitious but accurate words or images</text><text x="124" y="450" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">to use</text><rect x="30" y="480" width="840" height="80" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="78" cy="520" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="78" y="528.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="124" y="516" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">One structural device</text><text x="124" y="542" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">cyclical ending, time shift, change of focus</text><rect x="30" y="582" width="840" height="120" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="55" y="616" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Final minutes: check for W4</text><text x="55" y="646" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Sentence boundaries (no comma splices), apostrophes, homophones, consistent tense,</text><text x="55" y="670" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">capital letters, punctuation of speech.</text>
</svg>