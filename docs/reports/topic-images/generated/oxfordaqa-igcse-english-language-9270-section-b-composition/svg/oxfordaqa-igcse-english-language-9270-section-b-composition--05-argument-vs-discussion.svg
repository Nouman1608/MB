<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 645" width="900" height="645" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="645" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Argue or discuss? Two openings</text>

<rect x="30" y="108" width="840" height="58" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="144" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Task: “Teenagers should be paid for doing well at school.”</text><rect x="30" y="186" width="410" height="392" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><rect x="30" y="186" width="410" height="54" rx="14" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><text x="235" y="221" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Argumentative</text><circle cx="60" cy="270" r="5" fill="#2e6b62"/><text x="76" y="276" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">takes a clear position</text><circle cx="60" cy="304" r="5" fill="#2e6b62"/><text x="76" y="310" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">raises counter-arguments to rebut</text><circle cx="60" cy="338" r="5" fill="#2e6b62"/><text x="76" y="344" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">confident, committed tone</text><circle cx="60" cy="372" r="5" fill="#2e6b62"/><text x="76" y="378" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">call to action or firm conclusion</text><text x="54" y="422" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Opening</text><text x="54" y="450" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“Imagine working for five years with no wages,</text><text x="54" y="473" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">no promotion and a report card as your only</text><text x="54" y="496" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">reward. That is school. Yet paying students for</text><text x="54" y="519" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">grades would be one of the worst ideas a</text><text x="54" y="542" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">government could adopt.”</text><rect x="460" y="186" width="410" height="392" rx="14" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><rect x="460" y="186" width="410" height="54" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="665" y="221" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Discursive</text><circle cx="490" cy="270" r="5" fill="#8a6d0d"/><text x="506" y="276" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">explores several viewpoints</text><circle cx="490" cy="304" r="5" fill="#8a6d0d"/><text x="506" y="310" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">weighs counter-arguments fairly</text><circle cx="490" cy="338" r="5" fill="#8a6d0d"/><text x="506" y="344" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">measured, reflective tone</text><circle cx="490" cy="372" r="5" fill="#8a6d0d"/><text x="506" y="378" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">considered, maybe qualified, judgement</text><text x="484" y="422" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="start">Opening</text><text x="484" y="450" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“Few questions divide parents more quickly than</text><text x="484" y="473" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">whether children should be rewarded for</text><text x="484" y="496" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">success. Supporters see money as motivation;</text><text x="484" y="519" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">critics fear it teaches students to value</text><text x="484" y="542" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">learning only for what it pays.”</text><text x="450" y="616" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Both are effective; decide which the task wants before you begin.</text>
</svg>