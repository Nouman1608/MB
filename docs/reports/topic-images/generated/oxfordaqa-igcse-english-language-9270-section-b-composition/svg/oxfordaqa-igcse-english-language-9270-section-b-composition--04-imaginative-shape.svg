<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 710" width="900" height="710" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="710" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Imaginative writing: control the story</text>

<text x="45" y="135" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Keep it small</text><rect x="45" y="152" width="195" height="42" rx="21" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="142.5" y="179.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">one main character</text><rect x="252" y="152" width="195" height="42" rx="21" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="349.5" y="179.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">one setting</text><rect x="459" y="152" width="195" height="42" rx="21" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="556.5" y="179.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">one problem</text><rect x="666" y="152" width="195" height="42" rx="21" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="763.5" y="179.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">a short time span</text><line x1="50" y1="330" x2="200" y2="330" stroke="#4a5568" stroke-width="4" stroke-dasharray="8 7"/><text x="115" y="300" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">waking up</text><path d="M100,315 l30,30 m0,-30 l-30,30" fill="none" stroke="#b5602e" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><line x1="200" y1="330" x2="440" y2="330" stroke="#1e2a44" stroke-width="5"/><rect x="440" y="304" width="240" height="52" rx="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="560" y="337" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">key moment</text><line x1="680" y1="330" x2="850" y2="330" stroke="#1e2a44" stroke-width="5" marker-end="url(#ah)"/><circle cx="200" cy="330" r="11" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="200" y="376" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">Start late</text><text x="200" y="400" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">close to the moment</text><text x="200" y="420" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">of change</text><text x="320" y="284" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">summarise less important</text><text x="320" y="306" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">time in a sentence</text><text x="560" y="386" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">slow down here:</text><text x="560" y="408" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">action, detail, brief dialogue</text><text x="850" y="308" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">planned ending</text><rect x="30" y="465" width="840" height="175" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="55" y="503" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Plan the ending first. Any of these works if it is deliberate:</text><rect x="55" y="525" width="130" height="42" rx="21" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="120" y="552.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">a twist</text><rect x="195" y="525" width="170" height="42" rx="21" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="280" y="552.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">a realisation</text><rect x="375" y="525" width="370" height="42" rx="21" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="560" y="552.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">a circular return to the opening image</text><rect x="55" y="580" width="170" height="42" rx="21" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="140" y="607.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">an open ending</text><text x="450" y="680" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="middle">Show, don’t summarise: reveal feelings through action, detail and brief dialogue.</text>
</svg>