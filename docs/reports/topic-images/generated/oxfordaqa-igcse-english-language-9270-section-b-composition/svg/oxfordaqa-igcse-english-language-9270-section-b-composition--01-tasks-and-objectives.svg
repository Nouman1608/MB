<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 830" width="900" height="830" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="830" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Section B: one composition, four objectives</text>

<rect x="30" y="110" width="840" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="55" y="146" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Three tasks are set</text><rect x="55" y="170" width="170" height="46" rx="23" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="140" y="199.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Descriptive</text><rect x="240" y="170" width="170" height="46" rx="23" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="325" y="199.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Imaginative</text><rect x="425" y="170" width="270" height="46" rx="23" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="560" y="199.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Argumentative / discursive</text><line x1="705" y1="193" x2="745" y2="193" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><circle cx="800" cy="193" r="48" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="800" y="188" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Write</text><text x="800" y="210" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">ONE</text><text x="450" y="300" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Every task is marked on the same four writing objectives (AO2)</text><rect x="30" y="322" width="840" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="82" cy="368" r="28" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="82" y="378.08" font-size="28" font-weight="700" fill="#1e2a44" text-anchor="middle">W1</text><text x="130" y="360" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Content, voice, vocabulary and engagement</text><text x="130" y="388" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Communicate clearly, effectively and imaginatively for the task and purpose.</text><rect x="30" y="426" width="840" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="82" cy="472" r="28" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="82" y="482.08" font-size="28" font-weight="700" fill="#1e2a44" text-anchor="middle">W2</text><text x="130" y="464" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Varied, controlled sentences</text><text x="130" y="492" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A range of sentence structures for clarity, purpose and effect.</text><rect x="30" y="530" width="840" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="82" cy="576" r="28" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="82" y="586.08" font-size="28" font-weight="700" fill="#1e2a44" text-anchor="middle">W3</text><text x="130" y="568" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Shape, paragraphing, links, a planned whole</text><text x="130" y="596" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Organise ideas; use features that support cohesion and coherence.</text><rect x="30" y="634" width="840" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="82" cy="680" r="28" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="82" y="690.08" font-size="28" font-weight="700" fill="#1e2a44" text-anchor="middle">W4</text><text x="130" y="672" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Correct, secure written English</text><text x="130" y="700" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Technical accuracy in grammar, punctuation and spelling.</text><rect x="30" y="744" width="840" height="56" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="779" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">AO2 writing is worth 30% of the qualification through Paper 1.</text>
</svg>