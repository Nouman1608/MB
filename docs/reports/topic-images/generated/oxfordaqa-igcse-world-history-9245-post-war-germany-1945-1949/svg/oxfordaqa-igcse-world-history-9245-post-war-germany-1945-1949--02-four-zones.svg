<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 609" width="900" height="609" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="609" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Allied control: four zones</text>

<rect x="30" y="100" width="840" height="430" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="60" y="150" width="275" height="110" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="197.5" y="212" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">British zone</text><rect x="60" y="260" width="275" height="110" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="197.5" y="322" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">American zone</text><rect x="60" y="370" width="275" height="110" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="197.5" y="432" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">French zone</text><rect x="335" y="150" width="225" height="330" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="447.5" y="450" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Soviet zone</text><text x="197.5" y="136" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">western zones</text><text x="447.5" y="136" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">east</text><rect x="387.5" y="220" width="60" height="60" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><rect x="387.5" y="280" width="60" height="60" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><rect x="447.5" y="280" width="60" height="60" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><rect x="447.5" y="220" width="60" height="60" fill="#efdfa8" stroke="#1e2a44" stroke-width="2"/><rect x="387.5" y="220" width="120" height="120" fill="none" stroke="#1e2a44" stroke-width="4"/><text x="447.5" y="210" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Berlin</text><text x="402.5" y="256" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">US</text><text x="477.5" y="256" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Sov.</text><text x="417.5" y="316" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">UK</text><text x="477.5" y="316" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Fr.</text><text x="600" y="170" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Four</tspan> <tspan font-weight="700">zones</tspan> agreed at Yalta and</text><text x="600" y="191" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Potsdam; <tspan font-weight="700">Berlin</tspan>, inside the</text><text x="600" y="212" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Soviet zone, split into four</text><text x="600" y="233" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">sectors.</text><text x="600" y="290" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Allied</tspan> <tspan font-weight="700">Control</tspan> <tspan font-weight="700">Council</tspan> meant to</text><text x="600" y="311" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">govern Germany as a whole, but</text><text x="600" y="332" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">each power ran its zone its own</text><text x="600" y="353" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">way.</text><text x="600" y="410" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The western zones and the</text><text x="600" y="431" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Soviet zone increasingly</text><text x="600" y="452" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">developed differently.</text><text x="560" y="514" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">Schematic: zone sizes and positions not to scale</text><rect x="124.63900000000001" y="546" width="154.611" height="31" rx="15.5" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="201.9445" y="567.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Demilitarisation</text><rect x="289.25" y="546" width="144.309" height="31" rx="15.5" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="361.4045" y="567.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Denazification</text><rect x="443.55899999999997" y="546" width="161.207" height="31" rx="15.5" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="524.1624999999999" y="567.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Democratisation</text><rect x="614.766" y="546" width="160.595" height="31" rx="15.5" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="695.0635" y="567.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Decentralisation</text>
</svg>