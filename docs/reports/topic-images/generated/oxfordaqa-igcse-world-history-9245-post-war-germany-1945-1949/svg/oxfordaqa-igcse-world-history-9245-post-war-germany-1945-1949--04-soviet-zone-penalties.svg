<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 494" width="900" height="494" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="494" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Penalties on the Soviet zone</text>

<rect x="30" y="100" width="183" height="185" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="136.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">WHY</text><text x="44" y="162.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Enormous Soviet</text><text x="44" y="185.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">losses</text><text x="44" y="214.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The USSR</text><text x="44" y="235.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">demanded heavy</text><text x="44" y="256.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">reparations.</text><line x1="219" y1="192.5" x2="243" y2="192.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="249" y="100" width="183" height="185" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="263" y="126" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">POTSDAM</text><text x="263" y="152.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Mainly from its</text><text x="263" y="175.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">own zone</text><text x="263" y="203.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Plus a share of</text><text x="263" y="224.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">industrial equipment</text><text x="263" y="245.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">from the western</text><text x="263" y="266.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">zones.</text><line x1="438" y1="192.5" x2="462" y2="192.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="468" y="100" width="183" height="185" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="482" y="126" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">HOW</text><text x="482" y="152.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Dismantled and</text><text x="482" y="175.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">shipped east</text><text x="482" y="203.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Whole factories,</text><text x="482" y="224.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">railway lines,</text><text x="482" y="245.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">machinery; later</text><text x="482" y="266.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">current production.</text><line x1="657" y1="192.5" x2="681" y2="192.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="687" y="100" width="183" height="185" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="701" y="157.5" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">RESULT</text><text x="701" y="183.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Recovery held</text><text x="701" y="206.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">back</text><text x="701" y="235.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">In the Soviet zone.</text><text x="30" y="315" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">LIFE UNDER SOVIET RULE ALSO MEANT</text><rect x="30" y="333" width="268" height="129" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="367.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Military rule</text><text x="50" y="395.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">And widespread violence by</text><text x="50" y="416.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Soviet soldiers, especially</text><text x="50" y="437.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">against women, in 1945.</text><rect x="316" y="333" width="268" height="129" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="336" y="388.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Special camps</text><text x="336" y="416.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">For suspected opponents.</text><rect x="602" y="333" width="268" height="129" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="622" y="377.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">SED, April 1946</text><text x="622" y="406.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Communists and Social</text><text x="622" y="427.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Democrats forced to merge.</text>
</svg>