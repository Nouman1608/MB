<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 663" width="900" height="663" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="663" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The Cold War divides Germany, 1947-49</text>

<line x1="140" y1="108" x2="140" y2="577" stroke="#1e2a44" stroke-width="4"/><rect x="180" y="100" width="690" height="69" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="193" y="127.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Marshall Plan announced</text><text x="193" y="151.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">American aid for the western zones; the USSR refuses it for its zone.</text><circle cx="140" cy="134.5" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="120" y="140.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Jun 1947</text><rect x="180" y="179" width="690" height="69" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="193" y="206.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Deutsche Mark introduced</text><text x="193" y="230.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Erhard lifts price controls; hoarded goods reappear; black market declines.</text><circle cx="140" cy="213.5" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="120" y="219.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Jun 1948</text><rect x="180" y="258" width="690" height="90" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="193" y="285.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Berlin Blockade begins</text><text x="193" y="309.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Road, rail and canal routes to West Berlin cut; about two million West Berliners rely on</text><text x="193" y="330.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the airlift.</text><circle cx="140" cy="303" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="120" y="309" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Jun 1948</text><rect x="180" y="358" width="690" height="69" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="193" y="385.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Life during the airlift</text><text x="193" y="409.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Rationed food, power cuts, little fuel; a new runway at Tegel; pilots dropped sweets.</text><circle cx="140" cy="392.5" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="120" y="398.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1948-49</text><rect x="180" y="437" width="690" height="69" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="193" y="464.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Blockade ends; Basic Law</text><text x="193" y="488.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Federal Republic of Germany created, capital Bonn; Adenauer chancellor in September.</text><circle cx="140" cy="471.5" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="120" y="477.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">May 1949</text><rect x="180" y="516" width="690" height="69" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="193" y="543.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">German Democratic Republic</text><text x="193" y="567.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">One-party state dominated by the SED. Germany divided until 1990.</text><circle cx="140" cy="550.5" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="120" y="556.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Oct 1949</text><rect x="30" y="601" width="64.96000000000001" height="30" rx="15" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="62.480000000000004" y="621.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">West</text><rect x="106.96000000000001" y="601" width="163.2" height="30" rx="15" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="188.56" y="621.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">East / Berlin crisis</text>
</svg>