<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 466" width="900" height="466" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="466" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A 9-mark "explain two ways" answer</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">How the Cold War affected people in Germany, 1947-49</text>
<rect x="30" y="124" width="411" height="230" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">WAY 1</text><text x="50" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Economic recovery in the western</text><text x="50" y="206.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">zones</text><text x="50" y="235.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="235.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Why: the USA wanted a strong Western</text><text x="65.2" y="256.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Europe to resist communism</text><text x="50" y="282.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="282.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Marshall Aid; Deutsche Mark, June 1948</text><text x="50" y="308.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="308.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Effect: shops stocked; food and goods bought</text><text x="65.2" y="329.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">legally, not on the black market</text><rect x="459" y="124" width="411" height="230" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="479" y="156" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">WAY 2</text><text x="479" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Division of Berlin, then Germany</text><text x="479" y="211.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="494.2" y="211.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Stalin blockaded West Berlin in response to</text><text x="494.2" y="232.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the new currency</text><text x="479" y="258.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="494.2" y="258.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Effect: almost a year of airlift supplies,</text><text x="494.2" y="279.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">rationing and power cuts</text><text x="479" y="305.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="494.2" y="305.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">1949: two states; east one-party, west</text><text x="494.2" y="326.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">democratic</text><rect x="30" y="376" width="840" height="58" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="409.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Each way: name it, explain the Cold War cause, then show the effect on people's lives.</text>
</svg>