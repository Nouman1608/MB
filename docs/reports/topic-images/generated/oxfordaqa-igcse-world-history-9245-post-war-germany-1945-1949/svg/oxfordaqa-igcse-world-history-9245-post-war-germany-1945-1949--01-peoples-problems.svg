<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="560" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">People's problems after "zero hour"</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Unconditional surrender, 7-8 May 1945</text>
<rect x="30" y="124" width="411" height="206" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">LIVING CONDITIONS</text><text x="50" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Ruins and hunger</text><text x="50" y="211.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="211.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Very low rations; cellars and ruins</text><text x="50" y="237.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="237.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Black market; cigarettes as currency</text><text x="50" y="263.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="263.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Trümmerfrauen cleared rubble by hand</text><text x="50" y="289.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="289.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Bitter winter of 1946-47</text><rect x="459" y="124" width="411" height="206" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="479" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">REFUGEES AND EXPELLEES</text><text x="479" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Twelve million or more</text><text x="479" y="211.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="494.2" y="211.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Refugees</tspan> fled west from East Prussia, Silesia,</text><text x="494.2" y="232.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Pomerania (1944-45)</text><text x="479" y="258.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="494.2" y="258.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Expellees</tspan> forced out after the war: east of the</text><text x="494.2" y="279.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Oder-Neisse line, Sudetenland, Hungary</text><text x="479" y="305.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="494.2" y="305.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Often resented on arrival</text><rect x="30" y="348" width="411" height="180" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="380" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FORCED LABOUR</text><text x="50" y="406.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Displaced persons</text><text x="50" y="435.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="435.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Millions of foreign forced labourers and</text><text x="65.2" y="456.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">prisoners</text><text x="50" y="482.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="482.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Cared for in Allied and relief camps until they</text><text x="65.2" y="503.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">could go home or emigrate</text><rect x="459" y="348" width="411" height="180" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="479" y="380" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PRISONERS</text><text x="479" y="406.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Germans held abroad</text><text x="479" y="435.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="494.2" y="435.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Millions of German soldiers were POWs</text><text x="479" y="461.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="494.2" y="461.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Many held by the USSR used as forced labour</text><text x="494.2" y="482.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">for years</text>
</svg>