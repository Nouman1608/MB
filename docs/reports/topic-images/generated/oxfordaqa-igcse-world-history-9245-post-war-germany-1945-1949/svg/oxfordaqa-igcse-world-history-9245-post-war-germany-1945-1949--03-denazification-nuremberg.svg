<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 609" width="900" height="609" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="609" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Dealing with Nazism</text>

<rect x="30" y="100" width="411" height="227" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">WESTERN ZONES (e.g. American)</text><text x="50" y="158.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Questionnaires and tribunals</text><text x="50" y="187.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="187.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Categories from major offenders to followers</text><text x="65.2" y="208.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">and the exonerated</text><text x="50" y="234.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="234.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Many teachers, judges and officials lost jobs,</text><text x="65.2" y="255.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">at least for a time</text><text x="50" y="281.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="281.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Slow and inconsistent; many reinstated as the</text><text x="65.2" y="302.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Cold War grew</text><rect x="459" y="100" width="411" height="227" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="479" y="132" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">SOVIET ZONE</text><text x="479" y="158.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Removing the old elites</text><text x="479" y="187.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="494.2" y="187.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Denazification used against the old elites</text><text x="479" y="213.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="494.2" y="213.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Big estates broken up in the 1945 land reform</text><rect x="30" y="343" width="840" height="130" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="50" y="377.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Nuremberg: International Military Tribunal, November 1945 - October 1946</text><text x="50" y="406.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Leading Nazis, including Göring, tried for crimes against peace, war crimes and crimes against humanity.</text><text x="50" y="427.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Twelve</tspan> sentenced to death; <tspan font-weight="700" fill="#1e2a44">three</tspan> acquitted; Göring killed himself before execution. Further trials of</text><text x="50" y="448.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">doctors, industrialists and others followed.</text><rect x="30" y="489" width="411" height="88" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="235.5" y="523.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Impact 1</text><text x="235.5" y="552.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">Following orders was no defence.</text><rect x="459" y="489" width="411" height="88" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="664.5" y="523.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Impact 2</text><text x="664.5" y="552.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">Evidence of the Holocaust made public.</text>
</svg>