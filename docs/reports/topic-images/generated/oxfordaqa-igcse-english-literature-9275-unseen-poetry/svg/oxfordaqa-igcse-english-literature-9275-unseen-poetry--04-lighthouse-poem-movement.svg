<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 494" width="900" height="494" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="494" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How the poem moves</text>

<rect x="30" y="160" width="260" height="210" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="196" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">Stanza 1</text><text x="50" y="224" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Heroic</text><text x="50" y="256" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">He climbs “to tell the</text><text x="50" y="277" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">dark where it should end”;</text><text x="50" y="298" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the child counts his</text><text x="50" y="319" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">steps.</text><line x1="294" y1="265" x2="316" y2="265" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="320" y="160" width="260" height="210" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="340" y="196" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="start">Stanza 2</text><text x="340" y="224" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Domestic, tender</text><text x="340" y="256" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Careful hands at</text><text x="340" y="277" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">breakfast, as if he</text><text x="340" y="298" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">carries the light home.</text><line x1="584" y1="265" x2="606" y2="265" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="610" y="160" width="260" height="210" rx="14" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="630" y="196" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">Stanza 3</text><text x="630" y="224" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Loss</text><text x="630" y="256" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The tower closes; a</text><text x="630" y="277" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">machine does his work; he</text><text x="630" y="298" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">sits and counts.</text><path d="M740,156 C740,114 160,114 160,154" fill="none" stroke="#8a6d0d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 6" marker-end="url(#ahO)"/><text paint-order="stroke" stroke="#f4f6f6" stroke-width="6" x="450" y="126" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">counting: the poem comes full circle</text><rect x="30" y="390" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="423.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The speaker’s feelings are never stated directly: the reader infers sympathy and sadness</text><text x="50" y="445.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">from what she notices.</text>
</svg>