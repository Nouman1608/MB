<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 776" width="900" height="776" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="776" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four points through one poem</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">How does the poet present the speaker’s feelings about her father?</text>
<rect x="30" y="126" width="476" height="478" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="154" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The Lighthouse Keeper’s Daughter</text><text x="52" y="190" font-size="17" fill="#1e2a44" xml:space="preserve"><tspan>Each night my father climbed the stairs</tspan></text><text x="52" y="220" font-size="17" fill="#1e2a44" xml:space="preserve"><tspan fill="#b5602e" font-weight="700">to tell the dark where it should end</tspan><tspan>.</tspan></text><text x="52" y="250" font-size="17" fill="#1e2a44" xml:space="preserve"><tspan fill="#b5602e" font-weight="700">I counted steps</tspan><tspan>. </tspan><tspan fill="#b5602e" font-weight="700">One hundred and four</tspan><tspan>.</tspan></text><text x="52" y="280" font-size="17" fill="#1e2a44" xml:space="preserve"><tspan>I never heard him come back down.</tspan></text><text x="52" y="324" font-size="17" fill="#1e2a44" xml:space="preserve"><tspan>At breakfast he was always there,</tspan></text><text x="52" y="354" font-size="17" fill="#1e2a44" xml:space="preserve"><tspan>salt in his beard, his hands </tspan><tspan fill="#b5602e" font-weight="700">too careful</tspan></text><text x="52" y="384" font-size="17" fill="#1e2a44" xml:space="preserve"><tspan fill="#b5602e" font-weight="700">with the cups</tspan><tspan>, </tspan><tspan fill="#b5602e" font-weight="700">as if the light</tspan></text><text x="52" y="414" font-size="17" fill="#1e2a44" xml:space="preserve"><tspan fill="#b5602e" font-weight="700">were still in them and might go out</tspan><tspan>.</tspan></text><text x="52" y="458" font-size="17" fill="#1e2a44" xml:space="preserve"><tspan fill="#b5602e" font-weight="700">They closed the tower in the spring.</tspan></text><text x="52" y="488" font-size="17" fill="#1e2a44" xml:space="preserve"><tspan fill="#b5602e" font-weight="700">A machine does now what he did.</tspan></text><text x="52" y="518" font-size="17" fill="#1e2a44" xml:space="preserve"><tspan>He sits by the window every evening</tspan></text><text x="52" y="548" font-size="17" fill="#1e2a44" xml:space="preserve"><tspan>watching it turn, </tspan><tspan fill="#b5602e" font-weight="700">and</tspan><tspan> says nothing,</tspan></text><text x="52" y="578" font-size="17" fill="#1e2a44" xml:space="preserve"><tspan fill="#b5602e" font-weight="700">and counts.</tspan></text><line x1="458" y1="204" x2="458" y2="254" stroke="#8a6d0d" stroke-width="4" stroke-linecap="round"/><circle cx="482" cy="229" r="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="482" y="234.04" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><line x1="458" y1="338" x2="458" y2="418" stroke="#2e6b62" stroke-width="4" stroke-linecap="round"/><circle cx="482" cy="378" r="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><text x="482" y="383.04" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><line x1="458" y1="442" x2="458" y2="492" stroke="#b5602e" stroke-width="4" stroke-linecap="round"/><circle cx="482" cy="467" r="14" fill="#f6e3d6" stroke="#1e2a44" stroke-width="3"/><text x="482" y="472.04" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><line x1="458" y1="532" x2="458" y2="582" stroke="#1e2a44" stroke-width="4" stroke-linecap="round"/><circle cx="482" cy="557" r="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="482" y="562.04" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="520" y="126" width="350" height="110" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="532" y="151" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">POINT 1 · HEROIC FIGURE</text><text x="532" y="180" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Metaphor: he commands the night. The</text><text x="532" y="200" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">child’s counting and the precise number</text><text x="532" y="220" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">show her awe.</text><rect x="520" y="246" width="350" height="90" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="532" y="271" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">POINT 2 · TENDERNESS AND FRAGILITY</text><text x="532" y="300" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Enjambment holds “careful” at the line</text><text x="532" y="320" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">end; the simile links the job to his body.</text><rect x="520" y="346" width="350" height="90" rx="14" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="532" y="371" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">POINT 3 · LOSS THROUGH STRUCTURE</text><text x="532" y="400" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">A blunt, end-stopped sentence arrives</text><text x="532" y="420" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">suddenly; “a machine” reduces his role.</text><rect x="520" y="446" width="350" height="130" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="532" y="471" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">POINT 4 · THE ENDING</text><text x="532" y="500" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">The shortest line, isolated: counting</text><text x="532" y="520" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">links back to the child, so the poem comes</text><text x="532" y="540" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">full circle; repeated “and” slows the</text><text x="532" y="560" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">pace.</text><rect x="30" y="620" width="840" height="110" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="653" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">ONE-SENTENCE INTERPRETATION</text><text x="50" y="683.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Admiration and tenderness; the poem gradually reveals how much of his identity depended on</text><text x="50" y="705.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">his work.</text><text x="30" y="756" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Original poem written for the guide.</text>
</svg>