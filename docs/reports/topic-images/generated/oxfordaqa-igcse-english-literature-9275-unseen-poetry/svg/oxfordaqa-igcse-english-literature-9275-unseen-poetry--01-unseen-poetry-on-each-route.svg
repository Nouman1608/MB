" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="449.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Same skill, same marks: one 30-mark question on a poem you have not seen before, printed on</text><text x="50" y="471.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">the paper. No background knowledge about the poet is needed.</text>
