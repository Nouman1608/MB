<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 826" width="900" height="826" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="826" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A method that works under pressure</text>

<text x="30" y="138" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">Minutes (about 45)</text><rect x="30" y="150" width="56" height="56" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="58" y="175" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Sense</text><text x="58" y="196" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">3</text><rect x="86" y="150" width="56" height="56" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="114" y="175" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Shape</text><text x="114" y="196" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">3</text><rect x="142" y="150" width="74.66666666666667" height="56" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="179.33333333333334" y="175" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Detail</text><text x="179.33333333333334" y="196" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">4</text><rect x="216.66666666666669" y="150" width="74.66666666666667" height="56" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="254.00000000000003" y="175" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Plan</text><text x="254.00000000000003" y="196" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">3–5</text><rect x="291.33333333333337" y="150" width="578.6666666666666" height="56" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="580.6666666666667" y="175" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Write</text><text x="580.6666666666667" y="196" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">about 30</text><line x1="62" y1="250" x2="62" y2="782" stroke="#c9d6d4" stroke-width="4"/><rect x="108" y="230" width="762" height="108" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="264.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Read for sense</text><text x="128" y="292.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Title, then the whole poem, without annotating. Who speaks, to whom, about what? Sum it</text><text x="128" y="313.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">up in one sentence.</text><circle cx="62" cy="284" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="292.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="108" y="346" width="762" height="108" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="128" y="380.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Read for shape</text><text x="128" y="408.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Stanzas, line lengths, rhyme and where it breaks. Mark the turn: many poems shift in</text><text x="128" y="429.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">their final lines.</text><circle cx="62" cy="400" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="62" y="408.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="108" y="462" width="762" height="108" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="496.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Read for detail</text><text x="128" y="524.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Underline striking images, circle repeated words. Choose the five or six details you</text><text x="128" y="545.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">will use.</text><circle cx="62" cy="516" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="524.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="108" y="578" width="762" height="108" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="612.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Plan</text><text x="128" y="640.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A one-sentence interpretation, then three or four points moving through the poem, each</text><text x="128" y="661.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">a method plus its effect.</text><circle cx="62" cy="632" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="640.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="108" y="694" width="762" height="108" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="728.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Write</text><text x="128" y="756.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Open with the interpretation, write three or four paragraphs, end on the poem’s overall</text><text x="128" y="777.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">effect, often the ending.</text><circle cx="62" cy="748" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="756.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text>
</svg>