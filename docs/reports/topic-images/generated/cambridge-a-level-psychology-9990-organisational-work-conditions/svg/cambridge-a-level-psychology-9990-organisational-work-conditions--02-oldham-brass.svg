<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 602" width="900" height="602" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="602" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Moving to open-plan: Oldham and Brass (1979)</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Newspaper employees, measured before and after the move</text>
<rect x="30" y="124" width="330" height="110" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="195" y="168.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">BEFORE</text><text x="195" y="196.1" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Conventional office</text><rect x="540" y="124" width="330" height="132" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="705" y="156" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">AFTER</text><text x="705" y="183.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Open-plan office</text><text x="705" y="212" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">no walls or private offices; cheaper;</text><text x="705" y="232" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">meant to increase communication</text><line x1="368" y1="179" x2="532" y2="179" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><text x="450" y="168" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">the move</text><rect x="30" y="278" width="410" height="140" rx="14" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="338" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">FELL</text><text x="50" y="364.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Satisfaction and internal motivation</text><rect x="460" y="278" width="410" height="140" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="480" y="310" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PROBLEMS</text><text x="480" y="341.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="495.2" y="341.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">more distraction and interruptions</text><text x="480" y="367.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="495.2" y="367.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">less privacy</text><text x="480" y="393.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="495.2" y="393.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">difficulty concentrating</text><rect x="30" y="440" width="413" height="130" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="472" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">+ STRENGTHS</text><text x="50" y="503.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Real employees in a naturally occurring</text><text x="50" y="524.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">quasi-experiment: high ecological validity; shows</text><text x="50" y="545.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">change over time.</text><rect x="457" y="440" width="413" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="472" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">− WEAKNESSES</text><text x="477" y="503.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The move was not randomly assigned, so other</text><text x="477" y="524.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">changes could have contributed; questionnaires</text><text x="477" y="545.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">may reflect general feelings about the company.</text>
</svg>