<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 671" width="900" height="671" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="671" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four working-time patterns</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Examples from the lesson</text>
<rect x="30" y="124" width="840" height="120" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">RAPID ROTATION</text><text x="50" y="178" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">shifts change every few days</text><rect x="300" y="146" width="66" height="40" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="333" y="172" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">morn</text><rect x="366" y="146" width="66" height="40" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="399" y="172" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">morn</text><rect x="432" y="146" width="66" height="40" fill="#efdfa8" stroke="#1e2a44" stroke-width="2"/><text x="465" y="172" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">aft</text><rect x="498" y="146" width="66" height="40" fill="#efdfa8" stroke="#1e2a44" stroke-width="2"/><text x="531" y="172" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">aft</text><rect x="564" y="146" width="66" height="40" fill="#1e2a44" stroke="#1e2a44" stroke-width="2"/><text x="597" y="172" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">night</text><rect x="630" y="146" width="66" height="40" fill="#1e2a44" stroke="#1e2a44" stroke-width="2"/><text x="663" y="172" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">night</text><rect x="696" y="146" width="66" height="40" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="729" y="172" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">off</text><rect x="762" y="146" width="66" height="40" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="795" y="172" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">off</text><text x="564" y="216" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">days →</text><rect x="30" y="256" width="840" height="120" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="288" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SLOW ROTATION</text><text x="50" y="310" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">same shift for weeks</text><rect x="300" y="278" width="264" height="40" fill="#1e2a44" stroke="#1e2a44" stroke-width="2"/><text x="432" y="304" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">three weeks of nights</text><rect x="564" y="278" width="264" height="40" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="696" y="304" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">three weeks of days</text><text x="564" y="348" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">weeks →</text><rect x="30" y="388" width="840" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="420" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FLEXITIME</text><text x="50" y="442" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">choose start and finish around</text><text x="50" y="462" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">core hours</text><rect x="337.7142857142857" y="410" width="113.14285714285717" height="40" fill="#dce9e7" stroke="#2e6b62" stroke-width="2" stroke-dasharray="6 4"/><text x="394.28571428571433" y="436" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">start 7–10 a.m.</text><rect x="450.8571428571429" y="410" width="188.57142857142856" height="40" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="545.1428571428571" y="436" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">core hours: all present</text><line x1="337.7142857142857" y1="452" x2="337.7142857142857" y2="462" stroke="#1e2a44" stroke-width="2"/><text x="337.7142857142857" y="482" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">7 a.m.</text><line x1="450.8571428571429" y1="452" x2="450.8571428571429" y2="462" stroke="#1e2a44" stroke-width="2"/><text x="450.8571428571429" y="482" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">10 a.m.</text><line x1="639.4285714285714" y1="452" x2="639.4285714285714" y2="462" stroke="#1e2a44" stroke-width="2"/><text x="639.4285714285714" y="482" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">3 p.m.</text><rect x="30" y="530" width="840" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="562" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ON-CALL</text><text x="50" y="593.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Available to work at short notice outside normal hours, e.g. a doctor who can be called into hospital</text><text x="50" y="614.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">overnight.</text>
</svg>