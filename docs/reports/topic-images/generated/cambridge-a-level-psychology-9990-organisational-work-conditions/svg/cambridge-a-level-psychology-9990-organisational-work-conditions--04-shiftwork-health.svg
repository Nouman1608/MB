<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 607" width="900" height="607" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="607" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Shiftwork, body clocks and accidents</text>

<rect x="30" y="100" width="253.33333333333334" height="129" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="156.66666666666669" y="155.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Shiftwork</text><text x="156.66666666666669" y="183.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">night work, rotating shifts</text><line x1="289.33333333333337" y1="164.5" x2="317.33333333333337" y2="164.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="323.33333333333337" y="100" width="253.33333333333334" height="129" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450.00000000000006" y="135.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Circadian disruption</text><text x="450.00000000000006" y="163.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">~24-hour cycles of sleep,</text><text x="450.00000000000006" y="183.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">body temperature and</text><text x="450.00000000000006" y="203.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">hormones</text><line x1="582.6666666666667" y1="164.5" x2="610.6666666666667" y2="164.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="616.6666666666667" y="100" width="253.33333333333334" height="129" rx="14" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5"/><text x="743.3333333333334" y="134.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Shorter, poorer daytime</text><text x="743.3333333333334" y="157.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">sleep</text><text x="743.3333333333334" y="185" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">sleeping when the body clock</text><text x="743.3333333333334" y="205" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">is set for waking</text><rect x="30" y="251" width="270.6666666666667" height="172" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="283" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">RAPID ROTATION</text><text x="50" y="314.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The body clock <tspan font-weight="700" fill="#1e2a44">never</tspan> <tspan font-weight="700" fill="#1e2a44">fully</tspan></text><text x="50" y="335.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">adjusts</tspan>.</text><rect x="314.6666666666667" y="251" width="270.6666666666667" height="172" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="334.6666666666667" y="283" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SLOW ROTATION</text><text x="334.6666666666667" y="314.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Partial adjustment, but each</text><text x="334.6666666666667" y="335.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">change causes a <tspan font-weight="700" fill="#1e2a44">longer</tspan></text><text x="334.6666666666667" y="356.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">period of disruption.</text><rect x="599.3333333333334" y="251" width="270.6666666666667" height="172" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="619.3333333333334" y="283" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DIRECTION</text><text x="619.3333333333334" y="314.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Forwards</tspan> (mornings →</text><text x="619.3333333333334" y="335.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">afternoons → nights) is easier</text><text x="619.3333333333334" y="356.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">than backwards: the clock</text><text x="619.3333333333334" y="377.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">adapts more readily to a later</text><text x="619.3333333333334" y="398.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">schedule.</text><rect x="30" y="445" width="840" height="130" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="479.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Gold et al. (1992): US hospital nurses</text><text x="50" y="508.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Nurses on <tspan font-weight="700" fill="#1e2a44">rotating</tspan> shifts reported poorer sleep and more sleepiness-related accidents, errors and</text><text x="50" y="529.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">near-misses than nurses on <tspan font-weight="700" fill="#1e2a44">fixed</tspan> day or evening shifts. Self-report: efficient for large samples, but open</text><text x="50" y="550.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">to memory and honesty problems.</text>
</svg>