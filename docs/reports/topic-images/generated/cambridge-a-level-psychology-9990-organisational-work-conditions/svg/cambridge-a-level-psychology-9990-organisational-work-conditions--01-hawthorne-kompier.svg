<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 794" width="900" height="794" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="794" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The Hawthorne effect: fact or myth?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Western Electric Hawthorne Works, near Chicago, 1920s and early 1930s</text>
<rect x="30" y="124" width="410" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ILLUMINATION EXPERIMENTS</text><text x="50" y="187.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Productivity seemed to rise whether lighting was</text><text x="50" y="208.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">increased</tspan> <tspan font-weight="700" fill="#1e2a44">or</tspan> <tspan font-weight="700" fill="#1e2a44">decreased</tspan>.</text><rect x="460" y="124" width="410" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="480" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SMALL-GROUP STUDIES</text><text x="480" y="187.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Output rose over a series of changes to <tspan font-weight="700" fill="#1e2a44">breaks</tspan></text><text x="480" y="208.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">and</tspan> <tspan font-weight="700" fill="#1e2a44">hours</tspan>.</text><line x1="450" y1="239" x2="450" y2="291" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="170" y="299" width="560" height="106" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="331" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">THE POPULAR CONCLUSION</text><text x="450" y="357.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">People change their behaviour because they know they</text><text x="450" y="380.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">are observed or receiving attention</text><line x1="450" y1="411" x2="450" y2="463" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="471" width="840" height="160" rx="14" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5"/><text x="460" y="529" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">So the rise in output <tspan font-weight="700">cannot</tspan> <tspan font-weight="700">be</tspan> <tspan font-weight="700">attributed</tspan> <tspan font-weight="700">to</tspan></text><text x="460" y="550" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">attention</tspan> <tspan font-weight="700">alone</tspan>. Why does the story persist in</text><text x="460" y="571" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">textbooks?</text><text x="50" y="503" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">KOMPIER (2006): THE EVIDENCE IS WEAK</text><text x="50" y="534.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="534.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">small groups</text><text x="50" y="558.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="558.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">many changes at once</text><text x="50" y="582.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="582.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">no proper control conditions</text><text x="50" y="606.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="606.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">changes in workers' pay and supervision</text><rect x="30" y="653" width="840" height="109" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="687.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Still a threat to validity</text><text x="50" y="716.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Workers who know they are studied may change their behaviour. Reduce this with <tspan font-weight="700" fill="#1e2a44">longer</tspan> <tspan font-weight="700" fill="#1e2a44">study</tspan> <tspan font-weight="700" fill="#1e2a44">periods</tspan></text><text x="50" y="737.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(novelty wears off) or <tspan font-weight="700" fill="#1e2a44">routinely</tspan> <tspan font-weight="700" fill="#1e2a44">collected</tspan> <tspan font-weight="700" fill="#1e2a44">data</tspan>, such as output records.</text>
</svg>