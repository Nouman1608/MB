<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 675" width="900" height="675" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="675" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Human errors and system errors</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Two different causes of accidents at work</text>
<text x="30" y="138" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">HUMAN ERRORS: MISTAKES BY THE PERSON</text><rect x="30" y="164" width="201" height="137" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="200.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">OMISSION</text><text x="44" y="225.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">A step left out</text><text x="44" y="252.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">a nurse forgets to</text><text x="44" y="272.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">record a dose</text><rect x="243" y="164" width="201" height="137" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="257" y="200.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">COMMISSION</text><text x="257" y="225.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">A wrong action</text><text x="257" y="252.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">pressing "delete"</text><text x="257" y="272.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">instead of "save"</text><rect x="456" y="164" width="201" height="137" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="470" y="190" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SEQUENCING</text><text x="470" y="215.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Steps in the wrong</text><text x="470" y="236.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">order</text><text x="470" y="263" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">starting a machine</text><text x="470" y="283" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">before fitting the guard</text><rect x="669" y="164" width="201" height="137" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="683" y="200.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">TIMING</text><text x="683" y="225.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Too early or too late</text><text x="683" y="252.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">braking too late on a</text><text x="683" y="272.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">forklift</text><text x="30" y="337" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">SYSTEM ERRORS: POOR DESIGN OF OPERATOR–MACHINE SYSTEMS</text><rect x="30" y="363" width="413" height="200" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="395" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">DISPLAYS</text><text x="50" y="421.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Information to the operator</text><text x="50" y="449.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="449.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">small-font warnings; the same colour for safe</text><text x="65.2" y="470.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and unsafe</text><text x="50" y="496.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="496.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Three Mile Island (1979): an indicator showed a</text><text x="65.2" y="517.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">signal had been <tspan font-weight="700" fill="#1e2a44">sent</tspan> to close a valve, not</text><text x="65.2" y="538.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">whether it <tspan font-weight="700" fill="#1e2a44">had</tspan> closed</text><rect x="457" y="363" width="413" height="200" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="477" y="395" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">CONTROLS</text><text x="477" y="421.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">How the operator acts</text><text x="477" y="449.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="492.2" y="449.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">look-alike, close together or moving</text><text x="492.2" y="470.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">unexpectedly</text><text x="477" y="496.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="492.2" y="496.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">fixes: shape-coding, colour-coding, separating</text><text x="492.2" y="517.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">critical controls</text><rect x="30" y="585" width="840" height="58" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="450" y="618.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Blaming individuals for system errors leaves the poor design in place for the next operator.</text>
</svg>