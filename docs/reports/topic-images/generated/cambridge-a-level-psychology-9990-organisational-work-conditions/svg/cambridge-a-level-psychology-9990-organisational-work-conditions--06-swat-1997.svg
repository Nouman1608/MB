<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 847" width="900" height="847" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="847" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Key study: Swat (1997)</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Monitoring accidents and risk events in industrial plants</text>
<rect x="30" y="124" width="270.6666666666667" height="137" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="165.33333333333334" y="166" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">DATA</text><text x="165.33333333333334" y="196.72" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">83 accidents</text><text x="165.33333333333334" y="227" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">recorded in 1993</text><rect x="314.6666666666667" y="124" width="270.6666666666667" height="137" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">PLANTS</text><text x="450" y="186.72" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="450" y="217" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">foundry · machinery ·</text><text x="450" y="237" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">meat-processing · furniture</text><rect x="599.3333333333334" y="124" width="270.6666666666667" height="137" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="734.6666666666667" y="166" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">WORKERS</text><text x="734.6666666666667" y="196.72" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2,964</text><text x="734.6666666666667" y="227" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">employed in the four plants</text><text x="450" y="295.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Accidents classified by frequency, severity, and direct and indirect causes.</text><text x="60" y="342" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">ACCIDENTS INVOLVING BREACHES OF BASIC HOUSEKEEPING</text><rect x="60" y="354" width="780" height="50" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><rect x="60" y="354" width="357.24" height="50" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="238.62" y="386" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">at least 45.8%</text><text x="431.24" y="386" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">cluttered or poorly maintained work areas</text><text x="60" y="442" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">1994 FOLLOW-UP, MEAT-PROCESSING PLANT: INCIDENTS</text><rect x="60" y="454" width="39" height="50" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><rect x="99" y="454" width="741" height="50" fill="#f6e3d8" stroke="#1e2a44" stroke-width="2.5"/><text x="469.5" y="486" font-size="19" font-weight="700" fill="#b5602e" text-anchor="middle">estimated 95% never reported</text><text x="79.5" y="526" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start">reported</text><rect x="30" y="554" width="840" height="109" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="588.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Conclusion</text><text x="50" y="617.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Record minor injuries, especially first-aid cases, and the circumstances of accidents; include</text><text x="50" y="638.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">housekeeping</tspan> in safety monitoring.</text><rect x="30" y="685" width="413" height="130" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="717" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">+ STRENGTHS</text><text x="50" y="748.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Records over time give objective, longitudinal</text><text x="50" y="769.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">data; supports a situational explanation of</text><text x="50" y="790.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">accidents.</text><rect x="457" y="685" width="413" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="717" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">− WEAKNESSES</text><text x="477" y="748.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Official records underestimate risk; four plants in</text><text x="477" y="769.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">one country limit generalisation.</text>
</svg>