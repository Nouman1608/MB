<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 516" width="900" height="516" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="516" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four tests for any document</text>

<rect x="30" y="104" width="411" height="134" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="135" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">TEST 1</text><text x="48" y="162.8" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Authenticity</text><text x="48" y="193.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Is it genuine, and is it what it claims to</text><text x="48" y="215.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">be?</text><rect x="459" y="104" width="411" height="134" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="477" y="135" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">TEST 2</text><text x="477" y="162.8" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Credibility</text><text x="477" y="193.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Is it sincere and accurate, free from</text><text x="477" y="215.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">distortion?</text><rect x="30" y="254" width="411" height="134" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="285" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">TEST 3</text><text x="48" y="312.8" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Representativeness</text><text x="48" y="343.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Is it typical of documents of its kind,</text><text x="48" y="365.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">and do enough survive?</text><rect x="459" y="254" width="411" height="134" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="477" y="285" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">TEST 4</text><text x="477" y="312.8" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Meaning</text><text x="477" y="343.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Can the researcher understand what it</text><text x="477" y="365.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">meant to the people who produced it?</text><rect x="30" y="406" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="439.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">From John Scott, A Matter of Record (1990). Apply all four questions to each type of</text><text x="50" y="461.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">secondary evidence.</text>
</svg>