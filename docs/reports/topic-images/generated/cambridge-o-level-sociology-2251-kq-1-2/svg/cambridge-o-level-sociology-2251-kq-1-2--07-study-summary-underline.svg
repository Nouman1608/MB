<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four things to underline in a study summary</text>

<rect x="30" y="104" width="199.5" height="189" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="133" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">UNDERLINE</text><text x="46" y="160" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Method</text><text x="46" y="188.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">How was the data</text><text x="46" y="209.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">collected?</text><rect x="243.5" y="104" width="199.5" height="189" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="259.5" y="133" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">UNDERLINE</text><text x="259.5" y="160" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Sample</text><text x="259.5" y="188.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Its size and how it</text><text x="259.5" y="209.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">was chosen.</text><rect x="457" y="104" width="199.5" height="189" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="473" y="133" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">UNDERLINE</text><text x="473" y="160" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Findings</text><text x="473" y="188.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">What was found?</text><rect x="670.5" y="104" width="199.5" height="189" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="686.5" y="133" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">UNDERLINE</text><text x="686.5" y="160" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Problem detail</text><text x="686.5" y="188.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">e.g. a researcher</text><text x="686.5" y="209.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">known to</text><text x="686.5" y="230.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">participants, or a</text><text x="686.5" y="251.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">sample from one</text><text x="686.5" y="272.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">place.</text><rect x="30" y="311" width="840" height="58" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="344.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Most "explain a problem" marks come from the fourth item.</text>
</svg>