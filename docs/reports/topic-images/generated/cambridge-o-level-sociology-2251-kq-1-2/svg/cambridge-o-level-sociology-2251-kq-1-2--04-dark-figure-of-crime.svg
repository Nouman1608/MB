<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 591" width="900" height="591" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="591" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why crime statistics are incomplete</text>

<rect x="60" y="120" width="780" height="74" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="165" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">All offences committed</text><rect x="150" y="212" width="600" height="74" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="257" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Offences reported to the police</text><text x="764" y="256" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">not reported</text><rect x="240" y="304" width="420" height="74" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="349" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Offences recorded by the police</text><text x="674" y="348" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">not recorded</text><rect x="30" y="410" width="405" height="151" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="445.2" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">The dark figure of crime</text><text x="50" y="473.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Offences never reported to or recorded by</text><text x="50" y="494.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the police. They never appear in the</text><text x="50" y="515.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">statistics.</text><rect x="465" y="410" width="405" height="151" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="485" y="445.2" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Socially constructed</text><text x="485" y="473.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Interpretivists argue the figures are made</text><text x="485" y="494.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">by officials’ recording decisions, so they</text><text x="485" y="515.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">show how institutions work as much as how</text><text x="485" y="536.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">people behave.</text>
</svg>