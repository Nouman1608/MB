<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 590" width="900" height="590" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="590" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">From table to answer: pattern, detail, problem</text>

<rect x="30" y="110" width="560" height="450" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><line x1="110" y1="490" x2="560" y2="490" stroke="#c9d6d4" stroke-width="1.5"/><text x="100" y="496" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">0%</text><line x1="110" y1="370" x2="560" y2="370" stroke="#c9d6d4" stroke-width="1.5"/><text x="100" y="376" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">20%</text><line x1="110" y1="250" x2="560" y2="250" stroke="#c9d6d4" stroke-width="1.5"/><text x="100" y="256" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">40%</text><line x1="110" y1="130" x2="560" y2="130" stroke="#c9d6d4" stroke-width="1.5"/><text x="100" y="136" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">60%</text><rect x="150" y="286" width="48" height="204" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="174" y="278" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">34%</text><rect x="202" y="322" width="48" height="168" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="226" y="314" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">28%</text><text x="200" y="516" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Age 13</text><rect x="295" y="214" width="48" height="276" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="319" y="206" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">46%</text><rect x="347" y="268" width="48" height="222" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="371" y="260" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">37%</text><text x="345" y="516" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Age 15</text><rect x="440" y="178" width="48" height="312" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="464" y="170" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">52%</text><rect x="492" y="244" width="48" height="246" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="516" y="236" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">41%</text><text x="490" y="516" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Age 17</text><line x1="110" y1="490" x2="560" y2="490" stroke="#1e2a44" stroke-width="2.5"/><rect x="120" y="132" width="18" height="18" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="146" y="147" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Girls</text><rect x="220" y="132" width="18" height="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="246" y="147" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Boys</text><text x="310" y="546" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">More than 3 hours a day on social media (invented data)</text><rect x="610" y="110" width="260" height="118" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="626" y="139" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PATTERN</text><text x="626" y="163.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Rises with age for</text><text x="626" y="185.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">both; girls higher at</text><text x="626" y="207.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">every age</text><rect x="610" y="242" width="260" height="144" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="626" y="271" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">DETAIL</text><text x="626" y="295.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Gap widens from 6 to 11</text><text x="626" y="317.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">percentage points</text><text x="626" y="344.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">52% − 41% = 11 points, not</text><text x="626" y="365.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">11%</text><rect x="610" y="400" width="260" height="118" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="626" y="429" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">PROBLEM</text><text x="626" y="453.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Self-reported; one</text><text x="626" y="475.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">town; about 65 to 70</text><text x="626" y="497.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">pupils per group</text>
</svg>