<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 676" width="900" height="676" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="676" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Reading a table, chart or graph: five steps</text>

<line x1="62" y1="124" x2="62" y2="626" stroke="#c9d6d4" stroke-width="4"/><rect x="108" y="104" width="762" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="140" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Title, source, date</text><text x="128" y="169.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">What is being measured, by whom, and when?</text><circle cx="62" cy="149" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="157.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="108" y="206" width="762" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="242" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Units</text><text x="128" y="271.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Percentages, numbers, rates per 1,000 or index values? Percentages hide how many</text><text x="128" y="293.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">people are behind each figure.</text><circle cx="62" cy="262" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="270.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="108" y="330" width="762" height="90" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="128" y="366" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">The overall pattern first</text><text x="128" y="395.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Rising, falling, stable, or different between groups?</text><circle cx="62" cy="375" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="62" y="383.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="108" y="432" width="762" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="468" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">The precise detail second</text><text x="128" y="497.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Quote exact figures, with units, to support the pattern.</text><circle cx="62" cy="477" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="485.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="108" y="534" width="762" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="570" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">The problem</text><text x="128" y="599.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Sample size, who is missing, how terms were defined, how data was collected, a</text><text x="128" y="621.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">correlation presented as a cause.</text><circle cx="62" cy="590" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="598.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text>
</svg>