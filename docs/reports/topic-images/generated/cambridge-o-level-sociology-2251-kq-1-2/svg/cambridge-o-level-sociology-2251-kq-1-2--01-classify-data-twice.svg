<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 646" width="900" height="646" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="646" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Every piece of data is classified twice</text>

<text x="550" y="134" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="middle">What form does it take?</text><text x="400" y="172" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Quantitative (numbers)</text><text x="700" y="172" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Qualitative (words, images, sound)</text><rect x="30" y="190" width="205" height="160" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="44" y="241.7" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Primary</text><text x="44" y="269.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">collected by the</text><text x="44" y="289.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">researcher for this</text><text x="44" y="309.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">study</text><rect x="30" y="360" width="205" height="160" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="44" y="411.7" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Secondary</text><text x="44" y="439.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">already exists, made</text><text x="44" y="459.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">by someone else for</text><text x="44" y="479.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">another reason</text><rect x="250" y="190" width="300" height="160" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="400" y="248" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">PRIMARY QUANTITATIVE</text><text x="400" y="274.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">A researcher’s own</text><text x="400" y="299.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">survey</text><rect x="560" y="190" width="300" height="160" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="710" y="248" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">PRIMARY QUALITATIVE</text><text x="710" y="274.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Your own unstructured</text><text x="710" y="299.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">interview transcript</text><rect x="250" y="360" width="300" height="160" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="400" y="418" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">SECONDARY QUANTITATIVE</text><text x="400" y="444.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">A government household</text><text x="400" y="469.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">survey</text><rect x="560" y="360" width="300" height="160" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="710" y="430.5" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">SECONDARY QUALITATIVE</text><text x="710" y="456.7" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">A diary</text><text x="140" y="172" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">Who collected it?</text><rect x="30" y="538" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="571.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Classify both ways before you evaluate: secondary data saves time and money but was not</text><text x="50" y="593.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">designed for your aims; quantitative data is easy to compare but rarely explains why.</text>
</svg>