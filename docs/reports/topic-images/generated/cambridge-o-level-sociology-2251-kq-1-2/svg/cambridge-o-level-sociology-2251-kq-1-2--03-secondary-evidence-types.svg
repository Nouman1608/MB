<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 521" width="900" height="521" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="521" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Five kinds of secondary evidence</text>

<rect x="30" y="104" width="210" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="42" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Type</text><rect x="240" y="104" width="315" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="252" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Key strength</text><rect x="555" y="104" width="315" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="567" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Key limitation</text><rect x="30" y="150" width="210" height="64" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="175.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Official statistics</text><rect x="240" y="150" width="315" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="252" y="175.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Large coverage; regular, so trends</text><text x="252" y="196.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">can be compared</text><rect x="555" y="150" width="315" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="567" y="175.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Categories change; dark figure;</text><text x="567" y="196.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">socially constructed</text><rect x="30" y="214" width="210" height="85" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="239.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Historical documents</text><rect x="240" y="214" width="315" height="85" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="252" y="239.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Often the only evidence about the</text><text x="252" y="260.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">past; no observer effect</text><rect x="555" y="214" width="315" height="85" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="567" y="239.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Authenticity hard to establish;</text><text x="567" y="260.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">records of the powerful</text><text x="567" y="281.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">over-represented</text><rect x="30" y="299" width="210" height="64" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="324.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Personal documents</text><rect x="240" y="299" width="315" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="252" y="324.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Rich detail in the person’s own</text><text x="252" y="345.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">words; supports verstehen</text><rect x="555" y="299" width="315" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="567" y="324.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">May exaggerate; rarely</text><text x="567" y="345.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">representative; privacy</text><rect x="30" y="363" width="210" height="64" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="388.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Digital sources</text><rect x="240" y="363" width="315" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="252" y="388.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Vast, current; reach hidden or</text><text x="252" y="409.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">scattered groups</text><rect x="555" y="363" width="315" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="567" y="388.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">May be fake or automated; users not</text><text x="567" y="409.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">representative</text><rect x="30" y="427" width="210" height="64" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="452.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Media content</text><rect x="240" y="427" width="315" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="252" y="452.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Cheap, plentiful; content analysis</text><text x="252" y="473.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">can be repeated</text><rect x="555" y="427" width="315" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="567" y="452.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Reflects owners and editors; says</text><text x="567" y="473.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">little about audiences</text>
</svg>