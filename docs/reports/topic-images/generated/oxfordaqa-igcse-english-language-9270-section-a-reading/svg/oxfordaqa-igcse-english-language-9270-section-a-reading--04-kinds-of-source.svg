<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 805" width="900" height="805" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="805" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What to look for in each kind of source</text>

<text x="45" y="128" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Kind of source</text><text x="335" y="128" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Look for</text><rect x="30" y="142" width="840" height="98" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="184" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Opinion</text><text x="50" y="212" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">columns, blogs, speeches</text><rect x="335" y="171" width="105.60000000000001" height="40" rx="20" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="387.8" y="196.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">viewpoint</text><rect x="450.6" y="171" width="181.20000000000002" height="40" rx="20" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="541.2" y="196.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">persuasive methods</text><rect x="641.8000000000001" y="171" width="63.6" height="40" rx="20" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="673.6" y="196.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">tone</text><rect x="30" y="254" width="840" height="98" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="296" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Informative</text><text x="50" y="324" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">reports, factual articles, leaflets</text><rect x="335" y="283" width="164.4" height="40" rx="20" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="417.2" y="308.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">what comes first</text><rect x="509.4" y="283" width="164.4" height="40" rx="20" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="591.6" y="308.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">details included</text><rect x="683.8" y="283" width="139.2" height="40" rx="20" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="753.4" y="308.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">voices quoted</text><rect x="30" y="366" width="840" height="98" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="408" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Fiction extract</text><text x="50" y="436" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the issue shown through a story</text><rect x="335" y="395" width="105.60000000000001" height="40" rx="20" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="387.8" y="420.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">character</text><rect x="450.6" y="395" width="88.80000000000001" height="40" rx="20" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="495" y="420.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">setting</text><rect x="549.4000000000001" y="395" width="105.60000000000001" height="40" rx="20" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="602.2" y="420.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">situation</text><rect x="30" y="478" width="840" height="98" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="520" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Brief text</text><text x="50" y="548" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">slogans, short notices, posts</text><rect x="335" y="507" width="122.4" height="40" rx="20" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="396.2" y="532.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">compression</text><rect x="467.4" y="507" width="97.2" height="40" rx="20" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="516" y="532.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">wordplay</text><rect x="574.6" y="507" width="147.60000000000002" height="40" rx="20" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="648.4000000000001" y="532.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">direct address</text><rect x="30" y="590" width="840" height="98" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="632" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Visual text</text><text x="50" y="660" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">posters, adverts, infographics</text><rect x="335" y="619" width="80.4" height="40" rx="20" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="375.2" y="644.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">layout</text><rect x="425.4" y="619" width="80.4" height="40" rx="20" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="465.59999999999997" y="644.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">images</text><rect x="515.8" y="619" width="156" height="40" rx="20" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="593.8" y="644.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">colour and type</text><rect x="681.8" y="619" width="139.2" height="40" rx="20" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="751.4" y="644.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">image + words</text><rect x="30" y="712" width="840" height="66" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="752" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Even factual writing has a perspective; in fiction the message is implied.</text>
</svg>