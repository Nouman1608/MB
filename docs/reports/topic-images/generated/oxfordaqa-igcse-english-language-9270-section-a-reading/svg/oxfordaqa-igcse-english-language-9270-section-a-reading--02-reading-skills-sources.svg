<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four reading skills across a source pack</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">AO1 reading, applied to five or six texts</text>
<rect x="30" y="125" width="840" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="90" cy="181" r="32" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="90" y="192.52" font-size="32" font-weight="700" fill="#1e2a44" text-anchor="middle">R1</text><text x="145" y="169" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Select and use</text><text x="145" y="199" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Choose the right source and the right details for each question.</text><rect x="30" y="253" width="840" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="90" cy="309" r="32" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="90" y="320.52" font-size="32" font-weight="700" fill="#1e2a44" text-anchor="middle">R2</text><text x="145" y="297" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Collate and synthesise</text><text x="145" y="327" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Combine information from two texts; compare ideas or methods.</text><rect x="30" y="381" width="840" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="90" cy="437" r="32" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="90" y="448.52" font-size="32" font-weight="700" fill="#1e2a44" text-anchor="middle">R3</text><text x="145" y="425" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Interpret perspectives</text><text x="145" y="455" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Explain each writer’s attitude to the issue and how it differs.</text><rect x="30" y="509" width="840" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="90" cy="565" r="32" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="90" y="576.52" font-size="32" font-weight="700" fill="#1e2a44" text-anchor="middle">R4</text><text x="145" y="553" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Explain and evaluate methods</text><text x="145" y="583" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Analyse language, structure and layout, including in visual texts.</text>
