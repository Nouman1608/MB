<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 790" width="900" height="790" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="790" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Analysing a visual text</text>

<rect x="330" y="120" width="240" height="470" rx="6" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><rect x="342" y="132" width="216" height="223" fill="#dce9e7"/><circle cx="450" cy="250" r="78" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><circle cx="423" cy="238" r="8" fill="#1e2a44"/><circle cx="477" cy="238" r="8" fill="#1e2a44"/><path d="M428,282 Q450,292 472,282" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><rect x="354" y="388" width="192" height="26" fill="#d4b02e"/><rect x="354" y="422" width="150" height="26" fill="#d4b02e"/><line x1="354" y1="490" x2="546" y2="490" stroke="#c9d6d4" stroke-width="5" stroke-linecap="round"/><line x1="354" y1="508" x2="546" y2="508" stroke="#c9d6d4" stroke-width="5" stroke-linecap="round"/><line x1="354" y1="526" x2="486" y2="526" stroke="#c9d6d4" stroke-width="5" stroke-linecap="round"/><rect x="354" y="552" width="192" height="18" fill="#b5d3cf"/><rect x="30" y="120" width="260" height="108" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="152" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Layout and placement</text><text x="48" y="178" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">What is largest, central or</text><text x="48" y="199" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">at the top?</text><line x1="290" y1="174" x2="350" y2="160" stroke="#2e6b62" stroke-width="2.5"/><circle cx="350" cy="160" r="5" fill="#2e6b62"/><rect x="30" y="268" width="260" height="108" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="300" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Colour and typography</text><text x="48" y="326" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Associations, emphasis,</text><text x="48" y="347" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">contrast.</text><line x1="290" y1="322" x2="360" y2="402" stroke="#2e6b62" stroke-width="2.5"/><circle cx="360" cy="402" r="5" fill="#2e6b62"/><rect x="30" y="416" width="260" height="108" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="448" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">What is left out</text><text x="48" y="474" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Framing always selects.</text><line x1="290" y1="470" x2="330" y2="540" stroke="#2e6b62" stroke-width="2.5"/><circle cx="330" cy="540" r="5" fill="#2e6b62"/><rect x="610" y="120" width="260" height="130" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="628" y="152" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Images</text><text x="628" y="178" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Who or what is shown, from</text><text x="628" y="199" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">what angle, with what</text><text x="628" y="220" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">expression?</text><line x1="610" y1="185" x2="510" y2="220" stroke="#2e6b62" stroke-width="2.5"/><circle cx="510" cy="220" r="5" fill="#2e6b62"/><rect x="610" y="316" width="260" height="130" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="628" y="348" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Image and words</text><text x="628" y="374" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Does the caption reinforce</text><text x="628" y="395" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">or change the image’s</text><text x="628" y="416" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">meaning?</text><line x1="610" y1="380" x2="546" y2="561" stroke="#2e6b62" stroke-width="2.5"/><circle cx="546" cy="561" r="5" fill="#2e6b62"/><rect x="30" y="620" width="840" height="140" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="55" y="655" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">For a visual text, a precise description is your quotation:</text><text x="55" y="688" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“The child’s face fills the top half of the poster, looking directly at the viewer, so</text><text x="55" y="713" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">the reader feels personally addressed.”</text>
</svg>