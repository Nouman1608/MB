<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 838" width="900" height="838" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="838" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Two texts, one point</text>

<rect x="30" y="110" width="840" height="230" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="55" y="148" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="start">Synthesis: combine information</text><rect x="55" y="168" width="300" height="70" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="75" y="198" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">The report</text><text x="75" y="222" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">details of noise from lorries</text><rect x="55" y="252" width="300" height="70" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="75" y="282" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">The resident’s blog</text><text x="75" y="306" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">woken at four every morning</text><line x1="358" y1="203" x2="470" y2="238" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="358" y1="287" x2="470" y2="252" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="478" y="196" width="370" height="100" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="498" y="228" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Together:</text><text x="498" y="254" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">the problem is constant, not</text><text x="498" y="277" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">occasional.</text><rect x="30" y="360" width="410" height="300" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="398" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="start">Compare perspectives</text><rect x="52" y="418" width="366" height="82" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="70" y="446" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Council leaflet: progress</text><text x="70" y="472" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">“faster journeys”</text><text x="235" y="534" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="middle" font-style="italic">whereas…</text><rect x="52" y="556" width="366" height="82" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="70" y="584" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Blogger: a loss</text><text x="70" y="610" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the field she walked through as a</text><text x="70" y="631" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">child</text><rect x="460" y="360" width="410" height="300" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="482" y="398" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="start">Compare methods</text><rect x="482" y="418" width="366" height="82" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="500" y="446" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Leaflet: reassures</text><text x="500" y="472" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">cheerful tone, bullet points</text><text x="665" y="534" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="middle" font-style="italic">whereas…</text><rect x="482" y="556" width="366" height="82" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="500" y="584" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Blog: provokes sympathy, anger</text><text x="500" y="610" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">personal anecdote, rhetorical</text><text x="500" y="631" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">questions</text><text x="450" y="702" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Comparative connectives</text><rect x="30" y="718" width="113" height="38" rx="19" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="86.5" y="742.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">similarly</text><rect x="153" y="718" width="104" height="38" rx="19" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="205" y="742.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">likewise</text><rect x="267" y="718" width="68" height="38" rx="19" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="301" y="742.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">both</text><rect x="345" y="718" width="95" height="38" rx="19" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="392.5" y="742.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">whereas</text><rect x="450" y="718" width="77" height="38" rx="19" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="488.5" y="742.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">while</text><rect x="537" y="718" width="131" height="38" rx="19" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="602.5" y="742.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">in contrast</text><rect x="678" y="718" width="95" height="38" rx="19" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="725.5" y="742.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">however</text><rect x="30" y="768" width="185" height="38" rx="19" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="122.5" y="792.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">on the other hand</text><rect x="225" y="768" width="86" height="38" rx="19" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="268" y="792.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">unlike</text>
</svg>