<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 870" width="900" height="870" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="870" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: the new library</text>

<rect x="30" y="110" width="410" height="226" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="142" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Source X: school newsletter</text><text x="50" y="172" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“Our new Quiet Library opens on Monday. With</text><text x="50" y="194" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">forty study spaces, free printing and staff</text><text x="50" y="216" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">on hand to help, it is the perfect place to</text><text x="50" y="238" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">revise for exams.”</text><rect x="460" y="110" width="410" height="226" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="480" y="142" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Source Y: a student’s blog</text><text x="480" y="172" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“They’ve taken away the noisy library. That</text><text x="480" y="194" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">was where we argued about books, where I</text><text x="480" y="216" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">learned chess, where nobody told you to be</text><text x="480" y="238" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">quiet unless you deserved it. Now it’s</text><text x="480" y="260" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">‘Quiet’. Capital Q. Perfect for revision.</text><text x="480" y="282" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">Perfect for nothing else.”</text><text x="450" y="372" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Compare how the two writers present the new library.</text><rect x="30" y="392" width="150" height="84" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="105" y="440" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">View</text><rect x="190" y="392" width="320" height="84" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="206" y="440" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">a practical resource</text><text x="538" y="440" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">vs</text><rect x="565" y="392" width="305" height="84" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="581" y="440" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">a loss</text><rect x="30" y="488" width="150" height="84" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="105" y="536" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Lists</text><rect x="190" y="488" width="320" height="84" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="206" y="524" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“forty study spaces, free</text><text x="206" y="546" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">printing…” piles up benefits</text><text x="538" y="536" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">vs</text><rect x="565" y="488" width="305" height="84" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="581" y="524" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“where we argued… where I</text><text x="581" y="546" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">learned chess” values community</text><rect x="30" y="584" width="150" height="84" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="105" y="632" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">“Perfect”</text><rect x="190" y="584" width="320" height="84" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="206" y="620" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">confident adjective assumes</text><text x="206" y="642" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">readers agree</text><text x="538" y="632" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">vs</text><rect x="565" y="584" width="305" height="84" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="581" y="620" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">repeated mockingly to turn the</text><text x="581" y="642" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">school’s word against it</text><rect x="30" y="680" width="150" height="84" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="105" y="728" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Minor sentence</text><text x="350" y="728" font-size="18" font-weight="400" fill="#4a5568" text-anchor="middle">—</text><text x="538" y="728" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">vs</text><rect x="565" y="680" width="305" height="84" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="581" y="716" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“Capital Q” treats the name as</text><text x="581" y="738" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">pompous</text><rect x="30" y="782" width="840" height="60" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="819" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Both texts appear in every point: methods and perspectives are compared.</text>
</svg>