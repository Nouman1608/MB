cle cx="816.3157894736842" cy="746" r="7" fill="#1e2a44"/><rect x="482.95578947368415" y="734" width="321.36" height="24" fill="#f4f6f6"/><text x="800.3157894736842" y="752" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">1990  De Klerk speech; Mandela released</text><circle cx="850" cy="790" r="7" fill="#1e2a44"/><rect x="648.752" y="778" width="189.248" height="24" fill="#f4f6f6"/><text x="834" y="796" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">1994  Elections, 27 April</text>
