<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 549" width="900" height="549" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="549" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why Europeans partitioned Africa</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Four kinds of explanation, then rules for claiming land</text>
<line x1="310" y1="184.5" x2="407" y2="224.4" stroke="#1e2a44" stroke-width="2.5"/><line x1="310" y1="298.5" x2="407" y2="258.6" stroke="#1e2a44" stroke-width="2.5"/><line x1="590" y1="174" x2="493" y2="221.25" stroke="#1e2a44" stroke-width="2.5"/><line x1="590" y1="298.5" x2="493" y2="258.6" stroke="#1e2a44" stroke-width="2.5"/><circle cx="450" cy="241.5" r="86" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="236.04" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Partition</text><text x="450" y="261.66" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">of Africa</text><rect x="30" y="134.5" width="280" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="164.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Economic motives</text><text x="46" y="193.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Raw materials, markets and</text><text x="46" y="214.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">investment</text><rect x="30" y="248.5" width="280" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="278.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Strategic rivalry</text><text x="46" y="307.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Britain's route to India through</text><text x="46" y="328.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Egypt and the Suez Canal</text><rect x="590" y="124" width="280" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="606" y="154.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Nationalism and prestige</text><text x="606" y="182.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Colonies as a sign of national</text><text x="606" y="203.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">standing</text><rect x="590" y="238" width="280" height="121" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="606" y="268.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Technology</text><text x="606" y="296.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Quinine against malaria,</text><text x="606" y="317.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">steamships and the machine</text><text x="606" y="338.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">gun made conquest cheaper</text><rect x="30" y="381" width="390" height="136" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="413" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">1884-85</text><text x="50" y="440.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Berlin Conference</text><text x="50" y="470.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Set rules for claims, including "effective</text><text x="50" y="492.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">occupation"</text><line x1="426" y1="449" x2="474" y2="449" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="480" y="381" width="390" height="136" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="500" y="424" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">BY 1914</text><text x="500" y="451.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Only two states left</text><text x="500" y="481.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Ethiopia and Liberia remained independent</text>
</svg>