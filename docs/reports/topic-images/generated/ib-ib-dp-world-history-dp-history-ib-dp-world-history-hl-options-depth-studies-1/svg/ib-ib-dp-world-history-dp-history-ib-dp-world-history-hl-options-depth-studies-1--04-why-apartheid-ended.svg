<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why did apartheid end?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Four factors to balance in a Paper 3 answer</text>
<rect x="30" y="124" width="198" height="168" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="163.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">INTERNAL</text><text x="46" y="189.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Resistance</text><text x="46" y="218.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Township uprisings,</text><text x="46" y="239.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">unions, the United</text><text x="46" y="260.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Democratic Front</text><rect x="244" y="124" width="198" height="168" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="260" y="163.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ECONOMIC</text><text x="260" y="189.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Pressure</text><text x="260" y="218.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Sanctions,</text><text x="260" y="239.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">disinvestment,</text><text x="260" y="260.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">recession</text><rect x="458" y="124" width="198" height="168" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="474" y="152" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">INTERNATIONAL</text><text x="474" y="178.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">End of the Cold</text><text x="474" y="201.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">War</text><text x="474" y="229.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Removed the</text><text x="474" y="250.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">"communist threat"</text><text x="474" y="271.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">argument</text><rect x="672" y="124" width="198" height="168" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="688" y="174" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">LEADERSHIP</text><text x="688" y="200.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Decisions</text><text x="688" y="228.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Of de Klerk and</text><text x="688" y="249.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Mandela</text><rect x="150" y="362" width="600" height="91" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="398.38" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Apartheid ends</text><text x="450" y="428.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">Mandela released 11 February 1990; elections 27 April 1994</text><line x1="129" y1="298" x2="300" y2="356" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="343" y1="298" x2="400" y2="356" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="557" y1="298" x2="500" y2="356" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="771" y1="298" x2="600" y2="356" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/>
</svg>