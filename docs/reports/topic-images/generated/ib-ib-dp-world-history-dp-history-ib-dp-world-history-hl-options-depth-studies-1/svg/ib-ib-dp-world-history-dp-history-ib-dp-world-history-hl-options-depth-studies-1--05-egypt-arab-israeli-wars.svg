<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 751" width="900" height="751" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="751" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Egypt and the Arab-Israeli conflict</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Gold dots mark the four wars: learn each separately</text>
<line x1="150" y1="134" x2="150" y2="709" stroke="#1e2a44" stroke-width="4"/><rect x="184" y="124" width="686" height="90" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="197" y="151.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">State of Israel declared, 14 May</text><text x="197" y="175.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">British mandate ends; war of 1948-49; several hundred thousand Palestinians become</text><text x="197" y="196.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">refugees</text><line x1="150" y1="169" x2="184" y2="169" stroke="#1e2a44" stroke-width="2.5"/><circle cx="150" cy="169" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="130" y="175" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1948</text><rect x="184" y="224" width="686" height="69" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="197" y="251.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Free Officers' coup, July</text><text x="197" y="275.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Monarchy overthrown; Nasser becomes the dominant figure</text><line x1="150" y1="258.5" x2="184" y2="258.5" stroke="#1e2a44" stroke-width="2.5"/><circle cx="150" cy="258.5" r="9" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="130" y="264.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1952</text><rect x="184" y="303" width="686" height="69" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="197" y="330.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Suez Canal Company nationalized, July</text><text x="197" y="354.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Political victory for Nasser in the Suez crisis that followed</text><line x1="150" y1="337.5" x2="184" y2="337.5" stroke="#1e2a44" stroke-width="2.5"/><circle cx="150" cy="337.5" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="130" y="343.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1956</text><rect x="184" y="382" width="686" height="45" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="197" y="409.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">United Arab Republic with Syria</text><line x1="150" y1="404.5" x2="184" y2="404.5" stroke="#1e2a44" stroke-width="2.5"/><circle cx="150" cy="404.5" r="9" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="130" y="410.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1958-61</text><rect x="184" y="437" width="686" height="69" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="197" y="464.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Six-Day War, June</text><text x="197" y="488.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Defeat for Egypt</text><line x1="150" y1="471.5" x2="184" y2="471.5" stroke="#1e2a44" stroke-width="2.5"/><circle cx="150" cy="471.5" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="130" y="477.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1967</text><rect x="184" y="516" width="686" height="69" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="197" y="543.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">October war</text><text x="197" y="567.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Followed by the Arab oil embargo</text><line x1="150" y1="550.5" x2="184" y2="550.5" stroke="#1e2a44" stroke-width="2.5"/><circle cx="150" cy="550.5" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="130" y="556.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1973</text><rect x="184" y="595" width="686" height="69" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="197" y="622.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Camp David Accords; Egypt-Israel peace treaty</text><text x="197" y="646.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Sadat's diplomacy</text><line x1="150" y1="629.5" x2="184" y2="629.5" stroke="#1e2a44" stroke-width="2.5"/><circle cx="150" cy="629.5" r="9" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="130" y="625" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1978</text><text x="130" y="646" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1979</text><rect x="184" y="674" width="686" height="45" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="197" y="701.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Sadat assassinated, October</text><line x1="150" y1="696.5" x2="184" y2="696.5" stroke="#1e2a44" stroke-width="2.5"/><circle cx="150" cy="696.5" r="9" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="130" y="702.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1981</text>
</svg>