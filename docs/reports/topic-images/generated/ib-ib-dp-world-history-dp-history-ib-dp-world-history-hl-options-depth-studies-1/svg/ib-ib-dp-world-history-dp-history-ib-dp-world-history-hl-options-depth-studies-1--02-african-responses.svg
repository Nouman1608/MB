<rect x="172.11149999999998" y="124" width="168.704" height="31" rx="15.5" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="256.46349999999995" y="145.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">armed resistance</text><rect x="350.8155" y="124" width="110.683" height="31" rx="15.5" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="406.157" y="145.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">diplomacy</text><rect x="471.4985" y="124" width="133.276" height="31" rx="15.5" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="538.1365" y="145.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">collaboration</text><rect x="614.7745" y="124" width="113.114" height="31" rx="15.5" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="671.3315" y="145.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">adaptation</text><rect x="30" y="175" width="840" height="530" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><line x1="320" y1="221" x2="320" y2="687" stroke="#c9d6d4" stroke-width="2" stroke-dasharray="5 6"/><text x="320" y="209" font-size="16" font-weight="700" fill="#4a5568" text-anchor="middle">1880</text><line x1="433.3333333333333" y1="221" x2="433.3333333333333" y2="687" stroke="#c9d6d4" stroke-width="2" stroke-dasharray="5 6"/><text x="433.3333333333333" y="209" font-size="16" font-weight="700" fill="#4a5568" text-anchor="middle">1890</text><line x1="546.6666666666666" y1="221" x2="546.6666666666666" y2="687" stroke="#c9d6d4" stroke-width="2" stroke-dasharray="5 6"/><text x="546.6666666666666" y="209" font-size="16" font-weight="700" fill="#4a5568" text-anchor="middle">1900</text><line x1="660" y1="221" x2="660" y2="687" stroke="#c9d6d4" stroke-width="2" stroke-dasharray="5 6"/><text x="660" y="209" font-size="16" font-weight="700" fill="#4a5568" text-anchor="middle">1910</text><text x="50" y="261" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Mahdist state (Sudan)</text><text x="50" y="285" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Islamic state</text><rect x="376.6666666666667" y="247" width="147.33333333333331" height="24" rx="6" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><rect x="538" y="247" width="259.12" height="24" fill="#ffffff"/><text x="542" y="265" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">✗</text><text x="564" y="265" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">defeated at Omdurman, 1898</text><text x="50" y="353" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Ethiopia (Menelik II)</text><text x="50" y="377" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">army and diplomacy</text><line x1="501.33333333333337" y1="351" x2="660" y2="351" stroke="#2e6b62" stroke-width="6" marker-end="url(#ahT)"/><circle cx="501.33333333333337" cy="351" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><rect x="316.25333333333333" y="367" width="366.16" height="22" fill="#ffffff"/><text x="499.33333333333337" y="383" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="middle">Adwa, 1 March 1896: independence preserved</text><text x="50" y="445" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Samori Touré</text><text x="50" y="469" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">mobile resistance to France</text><defs><linearGradient id="fade2" x1="0" x2="1"><stop offset="0" stop-color="#f2e7b8" stop-opacity="0"/><stop offset="0.6" stop-color="#f2e7b8"/></linearGradient></defs><rect x="376.6666666666667" y="431" width="147.33333333333331" height="24" fill="url(#fade2)"/><text x="516" y="449" font-size="15" font-weight="600" fill="#8a6d0d" text-anchor="end">prolonged</text><rect x="538" y="431" width="145.248" height="24" fill="#ffffff"/><text x="542" y="449" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">✗</text><text x="564" y="449" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">captured 1898</text><text x="50" y="537" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Herero and Nama</text><text x="50" y="561" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">rising from 1904</text><rect x="592" y="523" width="45.33333333333326" height="24" rx="6" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><rect x="651.3333333333333" y="523" width="188.416" height="24" fill="#ffffff"/><text x="655.3333333333333" y="541" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">✗</text><text x="677.3333333333333" y="541" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">destroyed, 1904-08</text><text x="50" y="629" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Maji Maji</text><text x="50" y="653" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">multi-ethnic rising</text><rect x="603.3333333333333" y="615" width="22.666666666666742" height="24" rx="6" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><rect x="640" y="615" width="224.832" height="24" fill="#ffffff"/><text x="644" y="633" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">✗</text><text x="666" y="633" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">suppressed, with famine</text><rect x="30" y="725" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="759.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Why did some resistance succeed while most failed? Weigh:</text><text x="50" y="789.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">firepower · African unity or division · leadership · terrain · the resources of the European power</text>
