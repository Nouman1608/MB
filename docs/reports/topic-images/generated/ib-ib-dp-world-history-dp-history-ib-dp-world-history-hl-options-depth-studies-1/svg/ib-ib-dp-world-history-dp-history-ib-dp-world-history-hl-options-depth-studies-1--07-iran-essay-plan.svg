<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 791" width="900" height="791" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="791" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A Paper 3 plan: the Iranian Revolution</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">"To what extent was the Shah's modernization programme responsible?"</text>
<rect x="30" y="124" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="158.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Thesis</text><text x="450" y="188.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Modernization was a <tspan font-weight="700" fill="#1e2a44">necessary</tspan> <tspan font-weight="700" fill="#1e2a44">but</tspan> <tspan font-weight="700" fill="#1e2a44">not</tspan> <tspan font-weight="700" fill="#1e2a44">sufficient</tspan> cause: repression, economic crisis and</text><text x="450" y="210.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Khomeini's leadership turned discontent into revolution.</text><rect x="130" y="257" width="740" height="99" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="145" y="286.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Modernization's effects</text><text x="145" y="315.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Land reform drove migration to Tehran; secularizing measures alienated the clergy; inequality</text><text x="145" y="336.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">widened</text><circle cx="62" cy="298.5" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="62" y="307.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="62" y="342.5" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">10 min</text><rect x="733.005" y="269" width="121.995" height="29" rx="14.5" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="794.0025" y="288.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">named factor</text><rect x="130" y="368" width="740" height="78" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="145" y="397.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Repression and exclusion</text><text x="145" y="426.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">SAVAK; the Rastakhiz system (1975); no legal outlet for opposition</text><circle cx="62" cy="399" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="407.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="62" y="443" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">10 min</text><rect x="752.13" y="380" width="102.87" height="29" rx="14.5" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="803.565" y="399.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">alternative</text><rect x="130" y="458" width="740" height="78" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="145" y="487.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Economic crisis</text><text x="145" y="516.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Inflation after the oil boom; austerity from 1976; anger of bazaar merchants</text><circle cx="62" cy="489" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="497.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="62" y="533" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">10 min</text><rect x="752.13" y="470" width="102.87" height="29" rx="14.5" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="803.565" y="489.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">alternative</text><rect x="130" y="548" width="740" height="78" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="145" y="577.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Leadership and ideology</text><text x="145" y="606.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Khomeini from exile; the mosque network; mourning protests through 1978</text><circle cx="62" cy="579" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="587.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="62" y="623" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">10 min</text><rect x="752.13" y="560" width="102.87" height="29" rx="14.5" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="803.565" y="579.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">alternative</text><rect x="30" y="648" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="682.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Conclusion</text><text x="50" y="712.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Return to "necessary but not sufficient"; the coalition of opposition groups made 1978-79 different</text><text x="50" y="734.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">from earlier protests.</text>
</svg>