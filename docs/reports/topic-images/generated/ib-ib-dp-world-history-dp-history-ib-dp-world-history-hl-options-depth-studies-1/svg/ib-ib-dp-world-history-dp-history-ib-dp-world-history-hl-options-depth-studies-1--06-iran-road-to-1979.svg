<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 725" width="900" height="725" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="725" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Iran: from oil nationalization to revolution</text>

<line x1="170" y1="106" x2="170" y2="683" stroke="#1e2a44" stroke-width="4"/><rect x="204" y="96" width="666" height="45" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="217" y="123.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Mosaddegh nationalizes the oil industry</text><line x1="170" y1="118.5" x2="204" y2="118.5" stroke="#1e2a44" stroke-width="2.5"/><circle cx="170" cy="118.5" r="9" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="150" y="124.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1951</text><rect x="204" y="150" width="666" height="69" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="217" y="177.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Coup backed by Britain and the USA</text><text x="217" y="201.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Mosaddegh overthrown</text><line x1="170" y1="184.5" x2="204" y2="184.5" stroke="#1e2a44" stroke-width="2.5"/><circle cx="170" cy="184.5" r="9" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="150" y="190.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1953</text><rect x="204" y="228" width="666" height="69" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="217" y="255.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Shah's White Revolution</text><text x="217" y="279.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Land reform and modernization, alongside repression by the SAVAK secret police</text><line x1="170" y1="262.5" x2="204" y2="262.5" stroke="#1e2a44" stroke-width="2.5"/><circle cx="170" cy="262.5" r="9" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="150" y="268.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">from 1963</text><rect x="204" y="306" width="666" height="69" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="217" y="333.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Single-party Rastakhiz system</text><text x="217" y="357.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">No legal outlet for liberals, the left or the clergy</text><line x1="170" y1="340.5" x2="204" y2="340.5" stroke="#1e2a44" stroke-width="2.5"/><circle cx="170" cy="340.5" r="9" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="150" y="346.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1975</text><rect x="204" y="384" width="666" height="69" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="217" y="411.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Economic crisis</text><text x="217" y="435.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Inflation after the oil boom; austerity from 1976</text><line x1="170" y1="418.5" x2="204" y2="418.5" stroke="#1e2a44" stroke-width="2.5"/><circle cx="170" cy="418.5" r="9" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="150" y="424.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">after 1975</text><rect x="204" y="462" width="666" height="69" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="217" y="489.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Mass protest</text><text x="217" y="513.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Cycle of mourning protests through the year</text><line x1="170" y1="496.5" x2="204" y2="496.5" stroke="#1e2a44" stroke-width="2.5"/><circle cx="170" cy="496.5" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="150" y="502.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1978</text><rect x="204" y="540" width="666" height="45" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="217" y="567.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The Shah leaves Iran</text><line x1="170" y1="562.5" x2="204" y2="562.5" stroke="#1e2a44" stroke-width="2.5"/><circle cx="170" cy="562.5" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="150" y="568.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Jan 1979</text><rect x="204" y="594" width="666" height="45" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="217" y="621.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Khomeini returns</text><line x1="170" y1="616.5" x2="204" y2="616.5" stroke="#1e2a44" stroke-width="2.5"/><circle cx="170" cy="616.5" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="150" y="622.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1 Feb 1979</text><rect x="204" y="648" width="666" height="45" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="217" y="675.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Islamic Republic established after a referendum</text><line x1="170" y1="670.5" x2="204" y2="670.5" stroke="#1e2a44" stroke-width="2.5"/><circle cx="170" cy="670.5" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="150" y="676.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">spring 1979</text>
</svg>