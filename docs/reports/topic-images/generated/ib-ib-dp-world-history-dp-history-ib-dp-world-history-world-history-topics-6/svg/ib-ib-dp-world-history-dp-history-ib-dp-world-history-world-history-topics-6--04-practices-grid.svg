<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 575" width="900" height="575" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="575" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How Early Modern wars were fought</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Four practices and their effect on the outcome</text>
<rect x="30" y="124" width="412" height="146" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="152" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FORTIFICATION</text><text x="46" y="178.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The trace italienne</text><text x="46" y="207.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Artillery made medieval walls obsolete; low, thick</text><text x="46" y="228.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">walls with angled bastions made sieges long and</text><text x="46" y="249.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">expensive.</text><rect x="458" y="124" width="412" height="146" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="474" y="152" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">TACTICS AND DRILL</text><text x="474" y="178.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Maurice and Gustavus</text><text x="474" y="207.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Maurice of Nassau: drill and volley fire by ranks.</text><text x="474" y="228.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Gustavus Adolphus: infantry, mobile field artillery</text><text x="474" y="249.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">and cavalry; Breitenfeld (1631).</text><rect x="30" y="286" width="412" height="146" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="46" y="314" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">MONEY AND MANPOWER</text><text x="46" y="340.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Paying for bigger armies</text><text x="46" y="369.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Wallenstein financed huge armies by levies on</text><text x="46" y="390.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">occupied land. After 1688 Britain used Parliament,</text><text x="46" y="411.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the Bank of England (1694) and a national debt.</text><rect x="458" y="286" width="412" height="146" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="474" y="314" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">LEADERSHIP AND COALITIONS</text><text x="474" y="340.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Blenheim (1704)</text><text x="474" y="369.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Marlborough and Prince Eugene defeat a</text><text x="474" y="390.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Franco-Bavarian army, ending the threat to</text><text x="474" y="411.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Vienna.</text><rect x="30" y="454" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="488.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Do not overstate technology</text><text x="50" y="518.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Rank military, economic and political factors when you explain an outcome.</text>
</svg>