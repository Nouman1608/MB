<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 736" width="900" height="736" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="736" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Thirty Years' War: a local revolt widens</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Long-term causes, a trigger, then escalation</text>
<text x="30" y="138" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">LONG-TERM</text><rect x="30" y="162" width="270.6666666666667" height="121" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="192.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Peace of Augsburg (1555)</text><text x="46" y="220.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Recognised Lutheranism and</text><text x="46" y="241.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Catholicism, not Calvinism;</text><text x="46" y="262.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">church lands unresolved</text><rect x="314.6666666666667" y="162" width="270.6666666666667" height="121" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="330.6666666666667" y="192.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Rival alliances</text><text x="330.6666666666667" y="220.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Protestant Union (1608);</text><text x="330.6666666666667" y="241.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Catholic League (1609)</text><rect x="599.3333333333334" y="162" width="270.6666666666667" height="121" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="615.3333333333334" y="192.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Habsburg ambitions</text><text x="615.3333333333334" y="220.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Alarmed Protestant princes and</text><text x="615.3333333333334" y="241.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">foreign powers</text><line x1="450" y1="295" x2="450" y2="331" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><text x="30" y="359" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">SHORT-TERM</text><rect x="30" y="383" width="395" height="145" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="46" y="411" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">MAY 1618</text><text x="46" y="437.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Defenestration of Prague</text><text x="46" y="465.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Bohemian Protestants, fearing Ferdinand of</text><text x="46" y="486.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Styria, throw two governors and a secretary</text><text x="46" y="507.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">from a castle window</text><line x1="431" y1="455.5" x2="469" y2="455.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="475" y="383" width="395" height="145" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="491" y="432" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">1619</text><text x="491" y="458.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Frederick V elected king of Bohemia</text><text x="491" y="486.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The Calvinist Elector Palatine</text><line x1="450" y1="540" x2="450" y2="576" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><text x="30" y="604" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">ESCALATION: FOREIGN POWERS INTERVENE, EACH FOR ITS OWN REASONS</text><rect x="256.374" y="628" width="73.68" height="32" rx="16" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="293.21400000000006" y="650.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Spain</text><rect x="340.05400000000003" y="628" width="103.596" height="32" rx="16" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="391.85200000000003" y="650.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Denmark</text><rect x="453.65000000000003" y="628" width="95.1" height="32" rx="16" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="501.20000000000005" y="650.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Sweden</text><rect x="558.75" y="628" width="84.876" height="32" rx="16" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="601.188" y="650.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">France</text><text x="450" y="695.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">France, a Catholic power, fought the Catholic Habsburgs: the war was not purely religious.</text>
</svg>