<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 734" width="900" height="734" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="734" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The Imjin War: cause and outcome</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Korea, 1592-1598</text>
<text x="30" y="138" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">CAUSE</text><rect x="30" y="162" width="184.5" height="121" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="201.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">1590</text><text x="44" y="227.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Hideyoshi unifies</text><text x="44" y="250.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Japan</text><line x1="220.5" y1="222.5" x2="242.5" y2="222.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="248.5" y="162" width="184.5" height="121" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="262.5" y="190.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Demands</text><text x="262.5" y="213.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">passage through</text><text x="262.5" y="236.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Korea</text><text x="262.5" y="264.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">to attack Ming China</text><line x1="439" y1="222.5" x2="461" y2="222.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="467" y="162" width="184.5" height="121" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="481" y="227.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Korea refuses</text><line x1="657.5" y1="222.5" x2="679.5" y2="222.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="685.5" y="162" width="184.5" height="121" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="699.5" y="201.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">1592</text><text x="699.5" y="227.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Japanese land at</text><text x="699.5" y="250.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Busan</text><text x="30" y="319" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">MOTIVES DEBATED BY HISTORIANS</text><rect x="30" y="343" width="251.184" height="30" rx="15" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="155.59199999999998" y="363.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Ambition for an Asian empire</text><rect x="291.18399999999997" y="343" width="336.432" height="30" rx="15" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="459.4" y="363.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Employ and reward a large warrior class</text><rect x="637.616" y="343" width="167.424" height="30" rx="15" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="721.328" y="363.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Prestige and trade</text><text x="30" y="421" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">WHY JAPAN DID NOT WIN</text><rect x="30" y="445" width="270.6666666666667" height="117" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="44" y="473.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Naval power</text><text x="44" y="501.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Yi Sun-sin's fleet, with "turtle</text><text x="44" y="522.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">ships", cut supply lines; Hansan</text><text x="44" y="543.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Island (1592)</text><rect x="314.6666666666667" y="445" width="270.6666666666667" height="117" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="328.6666666666667" y="473.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Ming intervention</text><text x="328.6666666666667" y="501.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Ming armies intervened from</text><text x="328.6666666666667" y="522.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">1593</text><rect x="599.3333333333334" y="445" width="270.6666666666667" height="117" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="613.3333333333334" y="473.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Righteous armies</text><text x="613.3333333333334" y="501.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Korean volunteers harassed the</text><text x="613.3333333333334" y="522.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">invaders</text><line x1="165.33333333333334" y1="568" x2="350" y2="612" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="450" y1="568" x2="450" y2="612" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="734.6666666666667" y1="568" x2="550" y2="612" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="200" y="618" width="500" height="84" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="650" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">1598</text><text x="450" y="676.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Japanese withdrawal after Hideyoshi's death</text>
</svg>