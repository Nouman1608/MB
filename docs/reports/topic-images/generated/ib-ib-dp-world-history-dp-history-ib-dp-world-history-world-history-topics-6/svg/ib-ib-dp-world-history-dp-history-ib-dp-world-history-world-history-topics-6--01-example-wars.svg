#4a5568" text-anchor="middle">1700</text><line x1="743.75" y1="124" x2="743.75" y2="522" stroke="#c9d6d4" stroke-width="1.5" stroke-dasharray="4 6"/><line x1="743.75" y1="522" x2="743.75" y2="532" stroke="#1e2a44" stroke-width="2.5"/><text x="743.75" y="554" font-size="16" font-weight="600" fill="#4a5568" text-anchor="middle">1725</text><line x1="840" y1="124" x2="840" y2="522" stroke="#c9d6d4" stroke-width="1.5" stroke-dasharray="4 6"/><line x1="840" y1="522" x2="840" y2="532" stroke="#1e2a44" stroke-width="2.5"/><text x="840" y="554" font-size="16" font-weight="600" fill="#4a5568" text-anchor="middle">1750</text><line x1="50" y1="522" x2="860" y2="522" stroke="#1e2a44" stroke-width="3"/><rect x="139.3" y="150" width="308" height="24" rx="6" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="139.3" y="142" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Dutch Revolt, 1568-1648</text><rect x="231.7" y="214" width="23.100000000000023" height="24" rx="6" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="231.7" y="206" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Imjin War in Korea, 1592-1598</text><rect x="331.8" y="278" width="115.5" height="24" rx="6" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="331.8" y="270" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Thirty Years' War, 1618-1648</text><rect x="424.2" y="342" width="34.650000000000034" height="24" rx="6" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="424.2" y="334" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">English Civil Wars, 1642-1651</text><rect x="647.5" y="406" width="80.85000000000002" height="24" rx="6" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="728.35" y="398" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">Great Northern War, 1700-1721</text><rect x="651.35" y="470" width="50.049999999999955" height="24" rx="6" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="701.4" y="462" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">War of the Spanish Succession, 1701-1714</text><rect x="30" y="584" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="618.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Stay inside the period</text><text x="50" y="648.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The Seven Years' War (1756-1763) falls outside 1500-1750, so do not use it for this topic.</text>
