<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 511" width="900" height="511" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="511" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The military revolution debate</text>

<rect x="30" y="100" width="256" height="185" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="45" y="137.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ROBERTS, 1955 LECTURE</text><text x="45" y="163.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Tactics, 1560-1660</text><text x="45" y="192.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Changes in tactics caused</text><text x="45" y="213.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">larger armies, longer wars</text><text x="45" y="234.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">and the growth of state</text><text x="45" y="255.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">power to pay for them.</text><line x1="292" y1="192.5" x2="316" y2="192.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="322" y="100" width="256" height="185" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="337" y="127" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PARKER, 1988</text><text x="337" y="153.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Fortification and siege</text><text x="337" y="181.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Put the trace italienne and</text><text x="337" y="202.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">siege warfare at the centre;</text><text x="337" y="223.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">extended the argument to</text><text x="337" y="244.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">European expansion</text><text x="337" y="265.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">overseas.</text><line x1="584" y1="192.5" x2="608" y2="192.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="614" y="100" width="256" height="185" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="629" y="148" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CRITICS</text><text x="629" y="174.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Two questions</text><text x="629" y="202.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Revolutionary or gradual? Did</text><text x="629" y="223.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">war build states, or did states</text><text x="629" y="244.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">build armies?</text><text x="30" y="321" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">THE CHAIN AT THE HEART OF THE ARGUMENT</text><rect x="30" y="345" width="246.66666666666666" height="74" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="153.33333333333331" y="375.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">New tactics and</text><text x="153.33333333333331" y="398.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">fortification</text><line x1="282.66666666666663" y1="382" x2="320.66666666666663" y2="382" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="326.66666666666663" y="345" width="246.66666666666666" height="74" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="449.99999999999994" y="375.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Larger armies, longer</text><text x="449.99999999999994" y="398.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">wars</text><line x1="579.3333333333333" y1="382" x2="617.3333333333333" y2="382" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="623.3333333333333" y="345" width="246.66666666666666" height="74" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="746.6666666666666" y="386.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Growth of state power</text><path d="M746.6666666666666,423 L746.6666666666666,453 L153.33333333333331,453 L153.33333333333331,429" fill="none" stroke="#b5602e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="9 7" marker-end="url(#ahR)"/><rect x="260" y="438" width="380" height="30" fill="#f4f6f6"/><text x="450" y="459" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">or did states build the armies?</text>
</svg>