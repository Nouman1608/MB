<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 418" width="900" height="418" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="418" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The English Civil Wars, 1642-1651</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">The topic's three parts inside one state</text>
<rect x="30" y="124" width="256" height="262" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="45" y="151" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CAUSES</text><text x="45" y="177.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Religion, money, the</text><text x="45" y="200.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">constitution</text><text x="45" y="228.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="60.2" y="228.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Fear of Catholic influence;</text><text x="60.2" y="249.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">opposition to Laud's church</text><text x="60.2" y="270.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">policies</text><text x="45" y="297.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="60.2" y="297.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Charles I's taxes raised</text><text x="60.2" y="318.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">without Parliament</text><text x="45" y="345.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="60.2" y="345.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Conflict over control of the</text><text x="60.2" y="366.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">army</text><line x1="292" y1="255" x2="316" y2="255" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="322" y="124" width="256" height="262" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="337" y="151" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PRACTICES</text><text x="337" y="177.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">New Model Army (1645)</text><text x="337" y="205.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="352.2" y="205.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A professional force</text><text x="337" y="232.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="352.2" y="232.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Promotion by merit</text><text x="337" y="259.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="352.2" y="259.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Decisive victory at Naseby</text><text x="352.2" y="280.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">(1645)</text><line x1="584" y1="255" x2="608" y2="255" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="614" y="124" width="256" height="262" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="629" y="151" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EFFECTS</text><text x="629" y="177.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">King, monarchy, republic</text><text x="629" y="205.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="644.2" y="205.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Execution of Charles I</text><text x="644.2" y="226.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">(1649)</text><text x="629" y="253.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="644.2" y="253.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Monarchy abolished; a</text><text x="644.2" y="274.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">republic under Cromwell</text><text x="629" y="301.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="644.2" y="301.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Monarchy restored in 1660</text>
</svg>