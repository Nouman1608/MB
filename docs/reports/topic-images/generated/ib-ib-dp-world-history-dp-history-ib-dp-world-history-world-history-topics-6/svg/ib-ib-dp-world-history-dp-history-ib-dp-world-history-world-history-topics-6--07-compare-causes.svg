<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 610" width="900" height="610" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="610" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Comparing causes of two wars</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Thirty Years' War (Europe) and Imjin War (Asia and Oceania)</text>
<clipPath id="tc124"><rect x="30" y="124" width="840" height="321" rx="14"/></clipPath><g clip-path="url(#tc124)"><rect x="30" y="124" width="202.02531645569618" height="49" fill="#b5d3cf"/><text x="44" y="152.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Theme</text><rect x="232.02531645569618" y="124" width="318.98734177215186" height="49" fill="#b5d3cf"/><text x="246.02531645569618" y="152.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Thirty Years' War</text><rect x="551.0126582278481" y="124" width="318.98734177215186" height="49" fill="#f2e7b8"/><text x="565.0126582278481" y="152.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Imjin War</text><rect x="30" y="173" width="202.02531645569618" height="68" fill="#dce9e7"/><text x="44" y="199.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Long-term instability</text><rect x="232.02531645569618" y="173" width="318.98734177215186" height="68" fill="#ffffff"/><text x="246.02531645569618" y="199.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Augsburg's unresolved settlement;</text><text x="246.02531645569618" y="220.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">confessional alliances</text><rect x="551.0126582278481" y="173" width="318.98734177215186" height="68" fill="#ffffff"/><text x="565.0126582278481" y="199.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Unification left a large military class</text><text x="565.0126582278481" y="220.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">with no enemy at home</text><line x1="30" y1="241" x2="870" y2="241" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="241" width="202.02531645569618" height="68" fill="#dce9e7"/><text x="44" y="267.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Ambition of rulers</text><rect x="232.02531645569618" y="241" width="318.98734177215186" height="68" fill="#ffffff"/><text x="246.02531645569618" y="267.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Habsburg ambitions</text><rect x="551.0126582278481" y="241" width="318.98734177215186" height="68" fill="#ffffff"/><text x="565.0126582278481" y="267.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Hideyoshi's plan to conquer Ming</text><text x="565.0126582278481" y="288.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">China</text><line x1="30" y1="309" x2="870" y2="309" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="309" width="202.02531645569618" height="68" fill="#dce9e7"/><text x="44" y="335.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Ideology</text><rect x="232.02531645569618" y="309" width="318.98734177215186" height="68" fill="#ffffff"/><text x="246.02531645569618" y="335.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Religion central in Bohemia</text><rect x="551.0126582278481" y="309" width="318.98734177215186" height="68" fill="#ffffff"/><text x="565.0126582278481" y="335.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Little religious motive, though Japan</text><text x="565.0126582278481" y="356.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">was presented as a land of the gods</text><line x1="30" y1="377" x2="870" y2="377" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="377" width="202.02531645569618" height="68" fill="#dce9e7"/><text x="44" y="403.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Trigger and</text><text x="44" y="424.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">escalation</text><rect x="232.02531645569618" y="377" width="318.98734177215186" height="68" fill="#ffffff"/><text x="246.02531645569618" y="403.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Defenestration of Prague; foreign</text><text x="246.02531645569618" y="424.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">intervention</text><rect x="551.0126582278481" y="377" width="318.98734177215186" height="68" fill="#ffffff"/><text x="565.0126582278481" y="403.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Korea refuses passage; Ming</text><text x="565.0126582278481" y="424.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">intervene to protect a tributary</text></g><line x1="232.02531645569618" y1="124" x2="232.02531645569618" y2="445" stroke="#c9d6d4" stroke-width="1.5"/><line x1="551.0126582278481" y1="124" x2="551.0126582278481" y2="445" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="124" width="840" height="321" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="467" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="501.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Judgement</text><text x="50" y="531.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Multiple causes <tspan font-weight="700" fill="#1e2a44">combined</tspan> <tspan font-weight="700" fill="#1e2a44">and</tspan> <tspan font-weight="700" fill="#1e2a44">escalated</tspan> in the Thirty Years' War; the Imjin War is better explained</text><text x="50" y="553.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">by <tspan font-weight="700" fill="#1e2a44">one</tspan> <tspan font-weight="700" fill="#1e2a44">decision-maker</tspan>. Both widened when neighbouring powers intervened.</text>
</svg>