<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="620" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Six tools of academic register</text>

<rect x="30" y="110" width="410" height="124" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="148" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Hedging</text><text x="52" y="180" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="start">“suggests”, “may indicate”,</text><text x="52" y="203" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="start">“appears to”, “to some extent”</text><rect x="460" y="110" width="410" height="124" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="482" y="148" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Reporting verbs</text><text x="482" y="180" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="start">“found” for evidence,</text><text x="482" y="203" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="start">“claims” for a contested view</text><rect x="30" y="250" width="410" height="124" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="288" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Impersonal constructions</text><text x="52" y="320" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="start">“It could be argued that…”</text><text x="52" y="343" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="start">“The data suggest…”</text><rect x="460" y="250" width="410" height="124" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="482" y="288" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Precise terminology</text><text x="482" y="320" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="start">“asymmetrical address”, not “talking down”</text><text x="482" y="343" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="start">“covert prestige”, not “being cool”</text><rect x="30" y="390" width="410" height="124" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="428" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Cohesion</text><text x="52" y="460" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="start">“however”, “consequently”,</text><text x="52" y="483" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="start">“this complicates”</text><rect x="460" y="390" width="410" height="124" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="482" y="428" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Citation</text><text x="482" y="460" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="start">researcher and date in brackets:</text><text x="482" y="483" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="start">“(Labov, 1966)”, finding summarised accurately</text><rect x="30" y="538" width="840" height="58" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="574" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Data from one text cannot prove a general claim: hedge accordingly.</text>
</svg>