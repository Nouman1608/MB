<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 715" width="900" height="715" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="715" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The parts of an academic argument</text>

<rect x="30" y="110" width="230" height="66" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="145" y="150" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Thesis</text><rect x="272" y="110" width="598" height="66" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="292" y="150" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">a one-sentence answer, in the introduction</text><rect x="80" y="190" width="180" height="66" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="170" y="230" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Claims</text><rect x="272" y="190" width="598" height="66" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="292" y="230" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">each paragraph’s topic sentence advances the thesis</text><rect x="80" y="270" width="180" height="66" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="170" y="310" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Evidence</text><rect x="272" y="270" width="598" height="66" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="292" y="310" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">quoted Section A data and accurate study findings</text><rect x="80" y="350" width="180" height="66" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="170" y="390" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Analysis</text><rect x="272" y="350" width="598" height="66" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="292" y="390" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">how the evidence supports the claim</text><rect x="80" y="430" width="180" height="66" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="170" y="470" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Counter-argument</text><rect x="272" y="430" width="598" height="66" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="292" y="470" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">a limitation, alternative explanation or contrary study</text><rect x="80" y="510" width="180" height="66" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="170" y="550" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Evaluation</text><rect x="272" y="510" width="598" height="66" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="292" y="550" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">a weighed judgement of how far the claim holds</text><rect x="30" y="590" width="230" height="66" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="145" y="630" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Conclusion</text><rect x="272" y="590" width="598" height="66" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="292" y="630" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">a direct answer, refined by the argument</text><path d="M58,186 L58,546" fill="none" stroke="#8a6d0d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 6"/><text x="450" y="690" font-size="16.5" font-weight="700" fill="#2e6b62" text-anchor="middle">Every main paragraph begins with a claim that answers the question.</text>
</svg>