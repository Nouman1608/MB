<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Research worth knowing accurately</text>

<rect x="30" y="110" width="840" height="290" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="55" y="146" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Social variation</text><rect x="55" y="162" width="170" height="44" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="140" y="190" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Labov (1966)</text><text x="242" y="190" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">New York stores: post-vocalic /r/ linked to store status</text><rect x="55" y="218" width="170" height="44" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="140" y="246" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Trudgill (1974)</text><text x="242" y="246" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Norwich: some men over-reported non-standard forms; covert prestige</text><rect x="55" y="274" width="170" height="44" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="140" y="302" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Milroy (1980)</text><text x="242" y="302" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Belfast: close-knit, dense networks kept local vernacular forms</text><rect x="55" y="330" width="170" height="44" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="140" y="358" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Eckert (1989)</text><text x="242" y="358" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Detroit-area school: “jocks” and “burnouts” differed in language</text><rect x="30" y="418" width="840" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="55" y="454" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Interaction</text><rect x="55" y="470" width="250" height="40" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="180" y="496" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Giles</text><text x="322" y="496" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">communication accommodation: convergence and divergence</text><rect x="55" y="520" width="250" height="40" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="180" y="546" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Brown and Levinson (1987)</text><text x="322" y="546" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">politeness and face</text><rect x="30" y="586" width="840" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="55" y="622" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">The gender and language debate</text><rect x="55" y="642" width="240" height="72" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="175" y="671" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Lakoff (1975)</text><text x="175" y="697" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">deficit</text><line x1="299" y1="678" x2="326" y2="678" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="330" y="642" width="240" height="72" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="671" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Tannen (1990)</text><text x="450" y="697" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">difference</text><line x1="574" y1="678" x2="601" y2="678" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="605" y="642" width="240" height="72" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="725" y="671" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Cameron (2007)</text><text x="725" y="697" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">critique of both</text><rect x="30" y="754" width="840" height="58" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="790" font-size="16.5" font-weight="700" fill="#2e6b62" text-anchor="middle">Use a study only if you can state its finding: it should confirm, extend or challenge your data.</text>
