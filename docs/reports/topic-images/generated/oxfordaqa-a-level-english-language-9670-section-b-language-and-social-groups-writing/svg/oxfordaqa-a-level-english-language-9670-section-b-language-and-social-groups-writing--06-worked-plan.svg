<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 810" width="900" height="810" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="810" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: planning the essay</text>

<rect x="30" y="108" width="840" height="84" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="140" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle" font-style="italic">“Discuss the view that people use language mainly to show</text><text x="450" y="168" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle" font-style="italic">which groups they belong to.”</text><text x="450" y="222" font-size="17" font-weight="600" fill="#4a5568" text-anchor="middle">Section A data: a teenage football team’s group chat</text><rect x="30" y="240" width="170" height="82" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="115" y="288" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Thesis</text><line x1="204" y1="281" x2="224" y2="281" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="230" y="240" width="640" height="82" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="250" y="288" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Language often marks membership, but “mainly” overstates it.</text><rect x="30" y="336" width="170" height="82" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="115" y="384" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Support</text><line x1="204" y1="377" x2="224" y2="377" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="230" y="336" width="640" height="82" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="250" y="370" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">In-group nicknames and banter in the chat mark membership.</text><rect x="250" y="382" width="290.40000000000003" height="28" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="395.20000000000005" y="401.4" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">communities of practice, Eckert</text><rect x="30" y="432" width="170" height="82" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="115" y="480" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Complicate</text><line x1="204" y1="473" x2="224" y2="473" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="230" y="432" width="640" height="82" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="250" y="466" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The captain’s imperatives build hierarchy inside the group.</text><rect x="250" y="478" width="256.8" height="28" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="378.4" y="497.4" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">Wareing: instrumental power</text><rect x="30" y="528" width="170" height="82" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="115" y="576" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Counter</text><line x1="204" y1="569" x2="224" y2="569" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="230" y="528" width="640" height="82" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="250" y="562" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The coach’s formal register marks a different role.</text><rect x="250" y="574" width="198" height="28" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="349" y="593.4" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">accommodation theory</text><rect x="30" y="624" width="170" height="82" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="115" y="672" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Conclusion</text><line x1="204" y1="665" x2="224" y2="665" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="230" y="624" width="640" height="82" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="250" y="672" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Partly true but too narrow: language also negotiates position.</text><rect x="30" y="726" width="840" height="60" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="763" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">The key word “mainly” is the point to evaluate, not decoration.</text>
</svg>