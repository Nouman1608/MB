<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="900" height="550" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="550" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Moving Section A data up a level</text>

<rect x="30" y="110" width="400" height="160" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="52" y="144" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="start">Section A observation</text><text x="52" y="178" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">The friends’ messages use the in-group</text><text x="52" y="202" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">nickname “Captain” for one member and</text><text x="52" y="226" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">an abbreviation only they understand.</text><line x1="436" y1="190" x2="466" y2="190" stroke="#1e2a44" stroke-width="5" marker-end="url(#ah)"/><rect x="470" y="110" width="400" height="160" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="492" y="144" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Section B evidence</text><text x="492" y="178" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">In-group lexis shows that language can</text><text x="492" y="202" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">mark the boundary of a group, signalling</text><text x="492" y="226" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">who belongs and who does not.</text><text x="450" y="310" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Choose data that does three jobs</text><rect x="30" y="330" width="268" height="92" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="164" y="368" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Supports</text><text x="164" y="396" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">the thesis</text><rect x="316" y="330" width="268" height="92" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="368" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Complicates</text><text x="450" y="396" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">the thesis</text><rect x="602" y="330" width="268" height="92" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="736" y="368" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Contradicts</text><text x="736" y="396" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">the thesis, if possible</text><path d="M450,430 L450,450" fill="none" stroke="#8a6d0d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><line x1="450" y1="450" x2="450" y2="458" stroke="#8a6d0d" stroke-width="3" marker-end="url(#ahO)"/><rect x="30" y="464" width="840" height="58" rx="12" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="500" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="middle">Complicating evidence is where evaluation happens.</text>
</svg>