<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What academic argument is, and is not</text>

<text x="450" y="128" font-size="19" font-weight="700" fill="#4a5568" text-anchor="middle">Often confused with academic argument</text><rect x="30" y="146" width="268" height="210" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="164" y="184" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">A summary</text><text x="164" y="208" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="middle">of the Section A analysis</text><path d="M56,250 l6,7 l11,-14" fill="none" stroke="#2e6b62" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><text x="88" y="256" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">restates features</text><path d="M57,289 l14,14 m0,-14 l-14,14" fill="none" stroke="#b5602e" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><text x="88" y="302" font-size="17" font-weight="600" fill="#b5602e" text-anchor="start">no claim</text><rect x="316" y="146" width="268" height="210" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="450" y="184" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">An opinion piece</text><path d="M342,250 l6,7 l11,-14" fill="none" stroke="#2e6b62" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><text x="374" y="256" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">makes claims</text><path d="M343,289 l14,14 m0,-14 l-14,14" fill="none" stroke="#b5602e" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><text x="374" y="302" font-size="17" font-weight="600" fill="#b5602e" text-anchor="start">no linguistic evidence</text><rect x="602" y="146" width="268" height="210" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="736" y="184" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">A list of theories</text><path d="M628,250 l6,7 l11,-14" fill="none" stroke="#2e6b62" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><text x="660" y="256" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">describes research</text><path d="M629,289 l14,14 m0,-14 l-14,14" fill="none" stroke="#b5602e" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><text x="660" y="302" font-size="17" font-weight="600" fill="#b5602e" text-anchor="start">not applied</text><line x1="450" y1="366" x2="450" y2="404" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="30" y="410" width="840" height="210" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="450" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="middle">Academic argument</text><text x="450" y="478" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">a reasoned answer to a question, supported by evidence and aware of other views</text><rect x="50" y="500" width="190" height="96" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><path d="M137,528 l6,7 l11,-14" fill="none" stroke="#2e6b62" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><text x="145" y="560" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">a claim that answers</text><text x="145" y="580" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="middle">the question</text><rect x="255" y="500" width="190" height="96" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><path d="M342,528 l6,7 l11,-14" fill="none" stroke="#2e6b62" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><text x="350" y="560" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">linguistic evidence</text><text x="350" y="580" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="middle">from data and studies</text><rect x="460" y="500" width="190" height="96" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><path d="M547,528 l6,7 l11,-14" fill="none" stroke="#2e6b62" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><text x="555" y="560" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">research applied</text><text x="555" y="580" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="middle">to the question</text><rect x="665" y="500" width="190" height="96" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><path d="M752,528 l6,7 l11,-14" fill="none" stroke="#2e6b62" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><text x="760" y="560" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">other views</text><text x="760" y="580" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="middle">weighed</text>
