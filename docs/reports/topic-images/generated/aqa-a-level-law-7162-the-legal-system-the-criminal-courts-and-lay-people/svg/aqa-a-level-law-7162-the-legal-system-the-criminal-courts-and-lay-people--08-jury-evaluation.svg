<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 563" width="900" height="563" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="563" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Evaluating juries</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Weigh the points, then reach a judgement</text>
<rect x="30" y="124" width="412" height="276" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="154" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ADVANTAGES</text><text x="48" y="185.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="185.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Public</tspan> <tspan font-weight="700" fill="#1e2a44">confidence:</tspan> citizens decide guilt in</text><text x="63.2" y="206.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">serious cases</text><text x="48" y="233.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="233.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Jury</tspan> <tspan font-weight="700" fill="#1e2a44">equity:</tspan> <tspan font-style="italic">Bushell’s</tspan> <tspan font-style="italic">Case</tspan> (1670)</text><text x="48" y="260.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="260.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Random</tspan> <tspan font-weight="700" fill="#1e2a44">selection:</tspan> a cross-section; not</text><text x="63.2" y="281.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">case-hardened</text><text x="48" y="308.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="308.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Open</tspan> <tspan font-weight="700" fill="#1e2a44">justice:</tspan> law explained in open court</text><text x="48" y="335.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="335.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Research:</tspan> Thomas (2010), no evidence of</text><text x="63.2" y="356.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">discrimination against ethnic minority</text><text x="63.2" y="377.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">defendants</text><rect x="458" y="124" width="412" height="276" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="476" y="154" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">DISADVANTAGES</text><text x="476" y="185.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="491.2" y="185.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Perverse</tspan> <tspan font-weight="700" fill="#1e2a44">verdicts:</tspan> <tspan font-style="italic">Ponting</tspan> (1985), <tspan font-style="italic">Kronlid</tspan></text><text x="491.2" y="206.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(1996)</text><text x="476" y="233.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="491.2" y="233.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Secrecy:</tspan> no reasons can be checked (<tspan font-style="italic">Mirza</tspan>,</text><text x="491.2" y="254.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">2004)</text><text x="476" y="281.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="491.2" y="281.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Misconduct:</tspan> <tspan font-style="italic">Young</tspan> (1995) ouija board; <tspan font-style="italic">Fraill</tspan></text><text x="491.2" y="302.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(2011) internet</text><text x="476" y="329.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="491.2" y="329.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Media:</tspan> <tspan font-style="italic">Taylor</tspan> <tspan font-style="italic">and</tspan> <tspan font-style="italic">Taylor</tspan> (1993)</text><text x="476" y="356.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="491.2" y="356.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Bias:</tspan> <tspan font-style="italic">Sander</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">UK</tspan> (2000); some jurors</text><text x="491.2" y="377.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">misunderstood directions</text><rect x="30" y="422" width="840" height="109" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="456.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Exceptions already exist</text><text x="450" y="485.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">s44 Criminal Justice Act 2003: judge alone where there is a real danger of jury tampering, first used in <tspan font-style="italic">R</tspan></text><text x="450" y="506.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle"><tspan font-style="italic">v</tspan> <tspan font-style="italic">Twomey</tspan> (2009).</text>
</svg>