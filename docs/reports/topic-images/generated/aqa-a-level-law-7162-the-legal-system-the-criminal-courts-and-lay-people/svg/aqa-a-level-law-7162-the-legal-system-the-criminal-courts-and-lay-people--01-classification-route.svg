<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 687" width="900" height="687" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="687" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Which court tries the case?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Every adult defendant first appears in the magistrates’ court</text>
<rect x="250" y="124" width="400" height="52" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="154.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">First appearance: magistrates’ court</text><line x1="370" y1="184" x2="164.66666666666666" y2="228" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="450" y1="184" x2="450" y2="228" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="530" y1="184" x2="735.3333333333333" y2="228" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="232" width="269.3333333333333" height="147" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="260" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SUMMARY</text><text x="46" y="286.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Magistrates’ court only</text><text x="46" y="314.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Common assault and battery;</text><text x="46" y="335.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">most driving offences</text><rect x="315.3333333333333" y="232" width="269.3333333333333" height="147" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="331.3333333333333" y="260" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">TRIABLE EITHER WAY</text><text x="331.3333333333333" y="286.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Magistrates’ or Crown</text><text x="331.3333333333333" y="309.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Court</text><text x="331.3333333333333" y="337.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Theft; s47 and s20 OAPA 1861</text><rect x="600.6666666666666" y="232" width="269.3333333333333" height="147" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="616.6666666666666" y="260" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">INDICTABLE ONLY</text><text x="616.6666666666666" y="286.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Sent straight to the Crown</text><text x="616.6666666666666" y="309.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Court</text><text x="616.6666666666666" y="337.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Murder; manslaughter;</text><text x="616.6666666666666" y="358.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">robbery; s18</text><rect x="30" y="405" width="840" height="250" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><line x1="450" y1="387" x2="450" y2="407" stroke="#8a6d0d" stroke-width="3.5" marker-end="url(#ahO)"/><text x="50" y="437" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">EITHER-WAY: PLEA BEFORE VENUE</text><rect x="60" y="461" width="250" height="52" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="185" y="483" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Guilty plea</text><rect x="60" y="565" width="250" height="52" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="185" y="587" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Magistrates sentence, or</text><text x="185" y="606" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">commit to Crown Court</text><line x1="185" y1="515" x2="185" y2="561" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="360" y="461" width="230" height="52" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="475" y="483" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Not-guilty plea</text><rect x="360" y="565" width="230" height="52" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="475" y="587" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Allocation: suitable for</text><text x="475" y="606" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">summary trial?</text><line x1="475" y1="515" x2="475" y2="561" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="640" y="461" width="210" height="52" rx="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="745" y="483" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Yes: defendant may still</text><text x="745" y="502" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">elect jury trial</text><rect x="640" y="565" width="210" height="52" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="745" y="587" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">No: Crown Court</text><line x1="592" y1="580" x2="636" y2="497" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="592" y1="597" x2="636" y2="593" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/>
</svg>