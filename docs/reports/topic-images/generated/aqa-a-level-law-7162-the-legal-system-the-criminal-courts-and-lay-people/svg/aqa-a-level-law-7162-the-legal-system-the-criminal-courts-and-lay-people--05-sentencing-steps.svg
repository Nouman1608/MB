<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 769" width="900" height="769" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="769" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How the court reaches a sentence</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Follow Sentencing Council guidelines unless contrary to the interests of justice</text>
<line x1="60" y1="144" x2="60" y2="470" stroke="#c9d6d4" stroke-width="4"/><rect x="104" y="124" width="766" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="156.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Assess culpability and harm</text><text x="122" y="185.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Finds the starting point and range</text><circle cx="60" cy="166" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="174.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="104" y="218" width="766" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="250.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Adjust for aggravating factors</text><text x="122" y="279.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">e.g. relevant previous convictions, offending on bail</text><circle cx="60" cy="260" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="268.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="104" y="312" width="766" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="344.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Adjust for mitigating factors</text><text x="122" y="373.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">e.g. genuine remorse, good character</text><circle cx="60" cy="354" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="362.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="104" y="406" width="766" height="84" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="122" y="438.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Credit for a guilty plea</text><text x="122" y="467.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Up to one third at the first stage; less for later pleas</text><circle cx="60" cy="448" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="456.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="450" y="530" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">TYPES OF SENTENCE</text><rect x="242.416" y="544" width="171.872" height="30" rx="15" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="328.352" y="564.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Immediate custody</text><rect x="424.288" y="544" width="233.296" height="30" rx="15" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="540.936" y="564.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Suspended sentence order</text><rect x="59.888000000000034" y="584" width="419.072" height="30" rx="15" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="269.42400000000004" y="604.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Community order (unpaid work, curfew, treatment)</text><rect x="488.96000000000004" y="584" width="56.848" height="30" rx="15" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="517.384" y="604.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Fine</text><rect x="555.808" y="584" width="284.304" height="30" rx="15" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="697.96" y="604.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Absolute or conditional discharge</text><rect x="30" y="636" width="412" height="101" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="664" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">MAGISTRATES</text><text x="46" y="695.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Limited custodial powers set by statute (check</text><text x="46" y="716.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the current limit); most fines unlimited since 2015</text><rect x="458" y="636" width="412" height="101" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="474" y="664" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CROWN COURT</text><text x="474" y="695.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Any sentence up to the statutory maximum;</text><text x="474" y="716.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">murder: mandatory life with a minimum term</text>
</svg>