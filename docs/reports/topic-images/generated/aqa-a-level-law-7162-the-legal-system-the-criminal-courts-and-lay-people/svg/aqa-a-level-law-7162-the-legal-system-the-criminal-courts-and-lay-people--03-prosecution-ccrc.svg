<rect width="900" height="381" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">After the verdict: prosecution rights and the CCRC</text>

<rect x="30" y="100" width="412" height="107" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="130" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ATTORNEY GENERAL’S REFERENCE</text><text x="48" y="156.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Point of law after an acquittal</text><text x="48" y="184.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The acquittal still stands</text><rect x="458" y="100" width="412" height="107" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="476" y="130" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ATTORNEY GENERAL’S REFERENCE</text><text x="476" y="156.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Unduly lenient sentence</text><text x="476" y="184.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Referred for review</text><rect x="30" y="221" width="412" height="128" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="251" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PART 10 CRIMINAL JUSTICE ACT 2003</text><text x="48" y="277.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Retrial for a serious offence</text><text x="48" y="305.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">New</tspan> <tspan font-weight="700" fill="#1e2a44">and</tspan> <tspan font-weight="700" fill="#1e2a44">compelling</tspan> <tspan font-weight="700" fill="#1e2a44">evidence</tspan>: <tspan font-style="italic">R</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Dobson</tspan></text><text x="48" y="326.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(2011), the murder of Stephen Lawrence</text><rect x="458" y="221" width="412" height="128" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="476" y="251" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CRIMINAL APPEAL ACT 1995</text><text x="476" y="277.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Criminal Cases Review Commission</text><text x="476" y="305.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Can refer a case back to the appeal courts after</text><text x="476" y="326.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">normal appeals have failed</text>
</svg>