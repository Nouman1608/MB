<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 606" width="900" height="606" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="606" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Magistrates</text>

<rect x="30" y="100" width="412" height="158" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="130" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">LAY MAGISTRATES (JPs)</text><text x="48" y="156.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Unpaid volunteers</text><text x="48" y="185.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="185.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">No legal qualification required</text><text x="48" y="210.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="210.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Sit as a bench of two or three</text><text x="48" y="235.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="235.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Advised by a qualified legal adviser</text><rect x="458" y="100" width="412" height="158" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="476" y="130" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DISTRICT JUDGES (MAGISTRATES’ COURTS)</text><text x="476" y="156.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Paid, legally qualified</text><text x="476" y="185.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="491.2" y="185.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Sit alone</text><rect x="30" y="280" width="840" height="184" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="310" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ROLE AND POWERS OF LAY MAGISTRATES</text><text x="48" y="341.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="341.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Try summary and either-way offences kept for summary trial: <tspan font-weight="700" fill="#1e2a44">verdict</tspan> <tspan font-weight="700" fill="#1e2a44">and</tspan> <tspan font-weight="700" fill="#1e2a44">sentence</tspan></text><text x="48" y="366.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="366.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Preliminary matters in all cases: bail or remand, legal aid, allocation, sending to the Crown Court</text><text x="48" y="391.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="391.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Issue search and arrest warrants</text><text x="48" y="416.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="416.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Sit with a judge in the Crown Court on appeals from the magistrates’ court</text><text x="48" y="441.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="441.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Sit in the youth court after extra training</text><rect x="30" y="486" width="840" height="88" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="520.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">The legal adviser</text><text x="450" y="549.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Advises on law and procedure, but must not take part in deciding guilt or sentence.</text>
</svg>