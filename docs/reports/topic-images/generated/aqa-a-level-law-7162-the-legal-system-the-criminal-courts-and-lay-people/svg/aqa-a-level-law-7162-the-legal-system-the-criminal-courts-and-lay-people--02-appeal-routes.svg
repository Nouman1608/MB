<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 768" width="900" height="768" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="768" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Criminal appeals: two routes</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Appeals follow the court of trial</text>
<rect x="225" y="124" width="450" height="64" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="152" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Supreme Court</text><text x="450" y="175" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">point of law of general public importance; permission</text><text x="225" y="244" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">FROM THE MAGISTRATES’ COURT</text><rect x="30" y="324" width="200" height="64" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="130" y="352" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Crown Court</text><text x="130" y="375" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">rehearing; or sentence</text><rect x="250" y="324" width="200" height="64" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="350" y="352" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">High Court</text><text x="350" y="375" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">case stated: law only</text><rect x="90" y="504" width="300" height="64" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="240" y="543" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Magistrates’ court</text><line x1="170" y1="500" x2="130" y2="392" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="310" y1="500" x2="350" y2="392" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="116" y="454" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">defendant</text><text x="362" y="454" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">either side</text><line x1="350" y1="320" x2="330" y2="192" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="765" y="244" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">FROM THE CROWN COURT</text><rect x="540" y="324" width="330" height="64" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="705" y="352" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Court of Appeal (Criminal)</text><text x="705" y="375" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">with leave; quash only if unsafe</text><rect x="555" y="504" width="300" height="64" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="705" y="543" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Crown Court</text><line x1="705" y1="500" x2="705" y2="392" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="680" y1="320" x2="600" y2="192" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="470" y1="234" x2="470" y2="574" stroke="#c9d6d4" stroke-width="2.5" stroke-dasharray="8 6"/><rect x="30" y="610" width="412" height="126" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="640" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">COURT OF APPEAL POWERS</text><text x="48" y="671.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Quash, order a retrial or dismiss. Unsafe test: s2</text><text x="48" y="692.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Criminal Appeal Act 1968, amended 1995. A</text><text x="48" y="713.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">sentence can be reduced, not increased.</text><rect x="458" y="610" width="412" height="126" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="476" y="640" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">HIGH COURT ON CASE STATED</text><text x="476" y="671.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A Divisional Court of the King’s Bench Division:</text><text x="476" y="692.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">confirm, reverse, vary, or send the case back.</text>
</svg>