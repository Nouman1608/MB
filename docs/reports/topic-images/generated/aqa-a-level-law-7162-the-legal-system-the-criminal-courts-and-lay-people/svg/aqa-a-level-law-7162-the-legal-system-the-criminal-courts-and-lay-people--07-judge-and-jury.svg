<rect width="900" height="584" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Judge and jury in the Crown Court</text>

<rect x="30" y="100" width="329.6" height="204" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="130" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">JURY OF 12</text><text x="48" y="156.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Decides the verdict</text><text x="48" y="185.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Guilty or not guilty</text><rect x="375.6" y="100" width="494.4" height="204" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="393.6" y="130" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">JUDGE</text><text x="393.6" y="156.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Decides the law</text><text x="393.6" y="185.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="408.8" y="185.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Points of law and admissibility of evidence</text><text x="393.6" y="210.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="408.8" y="210.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Sums up; directs the jury on the law</text><text x="393.6" y="235.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="408.8" y="235.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Passes sentence</text><text x="393.6" y="260.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="408.8" y="260.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">May direct an acquittal; <tspan font-weight="700" fill="#1e2a44">never</tspan> a conviction (<tspan font-style="italic">R</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Wang</tspan>,</text><text x="408.8" y="281.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">2005)</text><rect x="30" y="326" width="412" height="226" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="356" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">QUALIFICATION: JURIES ACT 1974</text><text x="48" y="387.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="387.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Aged 18 to 75</text><text x="48" y="412.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="412.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">On the electoral register</text><text x="48" y="437.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="437.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Resident in the UK 5+ years since age 13</text><text x="48" y="462.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="462.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Some disqualified; some excused</text><text x="48" y="487.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="487.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Police, lawyers and judges can serve since</text><text x="63.2" y="508.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">2003: bias questions in <tspan font-style="italic">Abdroikov</tspan> (2007),</text><text x="63.2" y="529.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Hanif</tspan> <tspan font-style="italic">and</tspan> <tspan font-style="italic">Khan</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">UK</tspan> (2011)</text><rect x="458" y="326" width="412" height="226" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="476" y="356" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">VERDICTS: s17 JURIES ACT 1974</text><text x="476" y="387.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="491.2" y="387.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Unanimous verdict asked for first</text><text x="476" y="412.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="491.2" y="412.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">After at least two hours: majority of 11–1 or 10–2</text><text x="476" y="437.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="491.2" y="437.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Deliberations secret; researching the case or</text><text x="491.2" y="458.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">disclosing deliberations an offence since 2015</text>
</svg>