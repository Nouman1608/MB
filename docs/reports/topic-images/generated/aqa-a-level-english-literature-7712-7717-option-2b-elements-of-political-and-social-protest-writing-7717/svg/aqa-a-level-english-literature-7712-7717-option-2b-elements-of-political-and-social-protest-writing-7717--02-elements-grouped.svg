<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 618" width="900" height="618" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="618" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The elements of protest writing, grouped</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Which features of protest writing does each text use?</text>
<rect x="30" y="120" width="840" height="108" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="153" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">AT THE CORE</text><text x="50" y="178.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">“Issues of power and powerlessness”, with protest “central to each text’s</text><text x="50" y="202.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">structure”; public and private settings.</text><rect x="30" y="244" width="270.6666666666667" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="281.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Type of text</text><text x="44" y="308" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Speculative fiction (Handmaid’s</text><text x="44" y="328" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Tale), history play (Henry IV),</text><text x="44" y="348" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">satire and elegy (Harrison).</text><rect x="314.6666666666667" y="244" width="270.6666666666667" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="328.6666666666667" y="271.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Settings for struggle</text><text x="328.6666666666667" y="298" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Gilead; Coketown; a village</text><text x="328.6666666666667" y="318" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">facing enclosure; Kabul;</text><text x="328.6666666666667" y="338" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Jaffna; the Helmers’ living</text><text x="328.6666666666667" y="358" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">room.</text><rect x="599.3333333333334" y="244" width="270.6666666666667" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="613.3333333333334" y="281.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Nature of the struggle</text><text x="613.3333333333334" y="308" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Rebellion, control, corruption:</text><text x="613.3333333333334" y="328" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Hotspur; Gradgrind and</text><text x="613.3333333333334" y="348" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Bounderby; the Commanders.</text><rect x="30" y="388" width="270.6666666666667" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="415.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Smaller world and larger</text><text x="44" y="442" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Home, workplace, government: a</text><text x="44" y="462" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">marriage; one child; a father’s</text><text x="44" y="482" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">working life.</text><rect x="314.6666666666667" y="388" width="270.6666666666667" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="328.6666666666667" y="415.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Gender and class</text><text x="328.6666666666667" y="442" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Nora; Offred; accent in “Them</text><text x="328.6666666666667" y="462" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">and [uz]”; Hassan as a Hazara</text><text x="328.6666666666667" y="482" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">servant.</text><rect x="599.3333333333334" y="388" width="270.6666666666667" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="613.3333333333334" y="415.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Structure and language</text><text x="613.3333333333334" y="442" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Gilead’s renamings; Gradgrind’s</text><text x="613.3333333333334" y="462" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">facts; Blake’s contraries; the</text><text x="613.3333333333334" y="482" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">final door.</text><rect x="30" y="514" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="547.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Comment and audience: protest writing comments on society “at particular historical</text><text x="50" y="569.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">periods” and invites readers to reflect “on our own world”.</text>
</svg>