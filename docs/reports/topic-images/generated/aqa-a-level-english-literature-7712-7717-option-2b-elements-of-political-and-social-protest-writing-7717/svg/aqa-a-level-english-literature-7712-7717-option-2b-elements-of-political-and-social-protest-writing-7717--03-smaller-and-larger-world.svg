<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 567" width="900" height="567" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="567" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The smaller world and the larger</text>

<circle cx="205" cy="276.5" r="166.5" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="205" cy="276.5" r="111" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><circle cx="205" cy="276.5" r="55.5" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="205" y="282.5" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">home</text><text x="205" y="365.75" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">work</text><text x="205" y="421.25" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">society</text><path d="M231.4,277.5 C330.7,277.5 330.7,161.5 426,161.5" fill="none" stroke="#1e2a44" stroke-width="2" stroke-dasharray="5 5"/><circle cx="231.4" cy="277.5" r="4" fill="#1e2a44"/><path d="M231.4,360.75 C330.7,360.75 330.7,276.5 426,276.5" fill="none" stroke="#1e2a44" stroke-width="2" stroke-dasharray="5 5"/><circle cx="231.4" cy="360.75" r="4" fill="#1e2a44"/><path d="M245.2,416.25 C337.6,416.25 337.6,391.5 426,391.5" fill="none" stroke="#1e2a44" stroke-width="2" stroke-dasharray="5 5"/><circle cx="245.2" cy="416.25" r="4" fill="#1e2a44"/><rect x="430" y="110" width="440" height="103" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="446" y="141.2" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="start">Domestic</text><text x="446" y="170.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">A Doll’s House shows the politics of a</text><text x="446" y="192.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">marriage.</text><rect x="430" y="225" width="440" height="103" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="446" y="256.2" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="start">The workplace</text><text x="446" y="285.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">“Marked with D” makes a father’s working life</text><text x="446" y="307.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">and death a question of class.</text><rect x="430" y="340" width="440" height="103" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="446" y="371.2" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Society and government</text><text x="446" y="400.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Blake’s “The Chimney Sweeper” poems link one</text><text x="446" y="422.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">child to a society’s cruelty.</text><rect x="30" y="463" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="496.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">AQA: “the connection of the smaller world to the larger world” and “human organisation:</text><text x="50" y="518.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">domestically, in the work place, in local and national governments”.</text>
</svg>