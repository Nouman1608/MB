<rect x="30" y="124" width="268" height="54" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="164" y="158" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Post-2000 prose</text><text x="164" y="204" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">choose one</text><rect x="30" y="218" width="268" height="61" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="244" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start" font-style="italic">Harvest</text><text x="44" y="265" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Jim Crace</text><rect x="30" y="287" width="268" height="61" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="313" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start" font-style="italic">Brotherless Night</text><text x="44" y="334" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">V. V. Ganeshananthan</text><rect x="30" y="356" width="268" height="61" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="382" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start" font-style="italic">The Kite Runner</text><text x="44" y="403" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Khaled Hosseini</text><rect x="316" y="124" width="268" height="54" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="158" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Poetry</text><text x="450" y="204" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">choose one</text><rect x="316" y="218" width="268" height="116" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="330" y="244" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start" font-style="italic">Songs of Innocence and of</text><text x="330" y="265" font-size="16" font-weight="700" fill="#1e2a44" tex