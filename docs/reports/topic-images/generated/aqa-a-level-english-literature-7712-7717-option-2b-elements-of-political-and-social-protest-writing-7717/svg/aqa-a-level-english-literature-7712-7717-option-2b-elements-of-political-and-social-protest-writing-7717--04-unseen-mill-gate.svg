<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 645" width="900" height="645" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="645" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Reading power and resistance</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Original extract: new rules on the mill gate</text>
<rect x="30" y="110" width="411" height="248" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="143" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">POWER: ORDER AND GENEROSITY</text><text x="50" y="169.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The rules on the gate</text><text x="50" y="197.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="197.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">“a kindness”: paternalism exposed as</text><text x="65.2" y="218.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">control</text><text x="50" y="244.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="244.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">“No talking at the looms”: clipped,</text><text x="65.2" y="265.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">verbless, no speaker, as if the gate</text><text x="65.2" y="286.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">commanded</text><text x="50" y="312.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="312.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Tokens for the company shop: control</text><text x="65.2" y="333.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">reaches the household</text><rect x="459" y="110" width="411" height="248" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="479" y="143" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">RESISTANCE: A HUMAN VOICE</text><text x="479" y="169.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The chalk</text><text x="479" y="197.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="494.2" y="197.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">“We are not looms” refuses the reduction of</text><text x="494.2" y="218.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">workers to machines</text><text x="479" y="244.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="494.2" y="244.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Italic, handwritten: a human voice against</text><text x="494.2" y="265.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">printed rules</text><text x="479" y="291.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="494.2" y="291.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">“three different hands”: one defiance</text><text x="494.2" y="312.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">becomes collective</text><text x="450" y="398" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">The final sentence enacts a cycle of repression and protest</text><rect x="30" y="416" width="249.33333333333334" height="75" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="154.66666666666669" y="444.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Monday</text><text x="154.66666666666669" y="472.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">rules go up</text><line x1="285.33333333333337" y1="453.5" x2="319.33333333333337" y2="453.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="325.33333333333337" y="416" width="249.33333333333334" height="75" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450.00000000000006" y="444.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Tuesday</text><text x="450.00000000000006" y="472.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">chalk scrubbed off</text><line x1="580.6666666666667" y1="453.5" x2="614.6666666666667" y2="453.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="620.6666666666667" y="416" width="249.33333333333334" height="75" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="745.3333333333334" y="444.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Wednesday</text><text x="745.3333333333334" y="472.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">back, in three hands</text><rect x="30" y="509" width="840" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="545" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">The argument</text><text x="50" y="574.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The extract does not resolve the struggle: its significance is that protest survives</text><text x="50" y="596.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">erasure.</text>
</svg>