<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 656" width="900" height="656" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="656" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Weighing the powerful and the powerless</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">A Doll’s House and The Handmaid’s Tale</text>
<line x1="215" y1="171" x2="685" y2="149" stroke="#1e2a44" stroke-width="7" stroke-linecap="round"/><path d="M450,160 L420,252 L480,252 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><circle cx="450" cy="160" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><line x1="215" y1="171" x2="160" y2="226" stroke="#1e2a44" stroke-width="2.5"/><line x1="215" y1="171" x2="270" y2="226" stroke="#1e2a44" stroke-width="2.5"/><path d="M140,226 L290,226 Q275,253 215,253 Q155,253 140,226 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><line x1="685" y1="149" x2="630" y2="204" stroke="#1e2a44" stroke-width="2.5"/><line x1="685" y1="149" x2="740" y2="204" stroke="#1e2a44" stroke-width="2.5"/><path d="M610,204 L760,204 Q745,231 685,231 Q625,231 610,204 Z" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="215" y="247" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">powerless</text><text x="685" y="225" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">powerful</text><rect x="30" y="275" width="405" height="205" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="333" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Focus on the powerless</text><text x="50" y="362.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="362.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Both centre on a woman within a system</text><text x="66.15" y="384.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">controlled by men</text><text x="50" y="411.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="411.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Both expose how power depends on the</text><text x="66.15" y="433.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">cooperation of the powerless</text><rect x="465" y="275" width="405" height="205" rx="14" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="485" y="311" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="start">Counter-view</text><text x="485" y="340.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="501.15" y="340.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Torvald and the Commander are carefully</text><text x="501.15" y="362.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">drawn</text><text x="485" y="389.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="501.15" y="389.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Atwood’s Historical Notes: a male</text><text x="501.15" y="411.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">academic discusses Offred’s account,</text><text x="501.15" y="433.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">shifting attention to institutions and</text><text x="501.15" y="455.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">interpreters</text><rect x="30" y="498" width="840" height="134" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="534" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Judgement</text><text x="50" y="563.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Both examine power through the experience of those without it, but end by questioning who</text><text x="50" y="585.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">controls the story. Contexts: nineteenth-century marriage law; the late twentieth-century</text><text x="50" y="607.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">politics Atwood was responding to.</text>
</svg>