<!-- place after: ## The unseen passage -->
<figure class="topic-figure">
  <img src="https://img.marlbridge.com/aqa-a-level-english-literature-7712-7717-option-2b-elements-of-political-and-social-protest-writing-7717--04-unseen-mill-gate.webp" width="900" height="645" alt="Two columns analyse the original extract. Power: the rules called a kindness, verbless commands with no speaker, and payment in company-shop tokens. Resistance: the chalked words We are not looms, a handwritten voice against print, and three different hands. Below, Monday, Tuesday and Wednesday show the rules posted, the chalk scrubbed off and the chalk back, a cycle in which protest survives erasure." loading="lazy">
  <figcaption>Power speaks through rules; resistance answers in a human voice that keeps returning.</figcaption>
</figure>
