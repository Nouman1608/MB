<rect width="900" height="1230" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Imperial crises and settlements, 1896-1911</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Drawn to scale: clashes on the left, agreements on the right</text>
<rect x="30" y="124" width="840" height="78" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="45" y="151" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">BEFORE THIS</text><text x="45" y="182.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Britain occupied Egypt in 1882; the Berlin Conference (1884-85) set rules for claims.</text><line x1="96" y1="268" x2="870" y2="268" stroke="#c9d6d4" stroke-width="1.2"/><text x="30" y="274" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">1896</text><line x1="96" y1="316" x2="870" y2="316" stroke="#c9d6d4" stroke-width="1.2"/><text x="30" y="322" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">1897</text><line x1="96" y1="364" x2="870" y2="364" stroke="#c9d6d4" stroke-width="1.2"/><text x="30" y="370" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">1898</text><line x1="96" y1="412" x2="870" y2="412" stroke="#c9d6d4" stroke-width="1.2"/><text x="30" y="418" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">1899</text><line x1="96" y1="460" x2="870" y2="460" stroke="#c9d6d4" stroke-width="1.2"/><text x="30" y="466" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">1900</text><line x1="96" y1="508" x2="870" y2="508" stroke="#c9d6d4" stroke-width="1.2"/><text x="30" y="514" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">1901</text><line x1="96" y1="556" x2="870" y2="556" stroke="#c9d6d4" stroke-width="1.2"/><text x="30" y="562" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">1902</text><line x1="96" y1="604" x2="870" y2="604" stroke="#c9d6d4" stroke-width="1.2"/><text x="30" y="610" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">1903</text><line x1="96" y1="652" x2="870" y2="652" stroke="#c9d6d4" stroke-width="1.2"/><text x="30" y="658" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">1904</text><line x1="96" y1="700" x2="870" y2="700" stroke="#c9d6d4" stroke-width="1.2"/><text x="30" y="706" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">1905</text><line x1="96" y1="748" x2="870" y2="748" stroke="#c9d6d4" stroke-width="1.2"/><text x="30" y="754" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">1906</text><line x1="96" y1="796" x2="870" y2="796" stroke="#c9d6d4" stroke-width="1.2"/><text x="30" y="802" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">1907</text><line x1="96" y1="844" x2="870" y2="844" stroke="#c9d6d4" stroke-width="1.2"/><text x="30" y="850" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">1908</text><line x1="96" y1="892" x2="870" y2="892" stroke="#c9d6d4" stroke-width="1.2"/><text x="30" y="898" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">1909</text><line x1="96" y1="940" x2="870" y2="940" stroke="#c9d6d4" stroke-width="1.2"/><text x="30" y="946" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">1910</text><line x1="96" y1="988" x2="870" y2="988" stroke="#c9d6d4" stroke-width="1.2"/><text x="30" y="994" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">1911</text><line x1="96" y1="1036" x2="870" y2="1036" stroke="#c9d6d4" stroke-width="1.2"/><text x="30" y="1042" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">1912</text><line x1="470" y1="268" x2="470" y2="1036" stroke="#1e2a44" stroke-width="4" stroke-linecap="round"/><text x="430" y="238" font-size="15" font-weight="700" fill="#b5602e" text-anchor="end">CLASHES AND CHALLENGES</text><text x="510" y="238" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">AGREEMENTS</text><path d="M470,268 L454,268 L436,268" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="188.488" y="253.39999999999998" width="246.512" height="46" fill="#f4f6f6"/><text x="430" y="272.2" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">1896</text><text x="430" y="293.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">Kruger Telegram angers Britain</text><path d="M470,316 L454,316 L436,320" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="226.344" y="305.4" width="208.656" height="46" fill="#f4f6f6"/><text x="430" y="324.2" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">1897</text><text x="430" y="345.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">German Weltpolitik begins</text><path d="M470,364 L454,364 L436,372" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="276.216" y="357.4" width="158.78400000000002" height="46" fill="#f4f6f6"/><text x="430" y="376.2" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">1898, 1900</text><text x="430" y="397.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">Tirpitz's Navy Laws</text><path d="M470,388 L454,388 L436,424" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="130.84000000000003" y="409.4" width="304.15999999999997" height="67" fill="#f4f6f6"/><text x="430" y="428.2" font-size="16" font-weight="700" fill="#b5602e" text-anchor="end">1898</text><text x="430" y="449.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">Fashoda: France and Britain clash over</text><text x="430" y="470.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">the Sudan</text><path d="M470,412 L454,412 L436,497" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="152.51999999999998" y="482.4" width="282.48" height="67" fill="#f4f6f6"/><text x="430" y="501.2" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">1899-1902</text><text x="430" y="522.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">Boer War: German sympathy for the</text><text x="430" y="543.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">Boers</text><path d="M470,556 L486,556 L504,556" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="505" y="541.4" width="343.808" height="67" fill="#f4f6f6"/><text x="510" y="560.1999999999999" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">1902</text><text x="510" y="581.1999999999999" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Anglo-Japanese Treaty: "splendid isolation"</text><text x="510" y="602.1999999999999" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">ends</text><path d="M470,652 L486,652 L504,652" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="505" y="637.4" width="342.912" height="67" fill="#f4f6f6"/><text x="510" y="656.1999999999999" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">1904</text><text x="510" y="677.1999999999999" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Entente Cordiale: Egypt for Britain, Morocco</text><text x="510" y="698.1999999999999" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">for France</text><path d="M470,700 L454,700 L436,700" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="266.82399999999996" y="685.4" width="168.17600000000002" height="46" fill="#f4f6f6"/><text x="430" y="704.1999999999999" font-size="16" font-weight="700" fill="#b5602e" text-anchor="end">1905-06</text><text x="430" y="725.1999999999999" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">First Moroccan crisis</text><path d="M470,748 L486,748 L504,748" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="505" y="733.4" width="299.77600000000007" height="67" fill="#f4f6f6"/><text x="510" y="752.1999999999999" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">1906</text><text x="510" y="773.1999999999999" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Algeciras: France and Spain supervise</text><text x="510" y="794.1999999999999" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Morocco; Germany isolated</text><path d="M470,988 L454,988 L436,988" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="185.44799999999998" y="973.4" width="249.55200000000002" height="46" fill="#f4f6f6"/><text x="430" y="992.1999999999999" font-size="16" font-weight="700" fill="#b5602e" text-anchor="end">1911</text><text x="430" y="1013.1999999999999" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">Agadir: second Moroccan crisis</text><path d="M470,1028.7999999999956 L486,1028.7999999999956 L504,1028.7999999999956" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="505" y="1014.1999999999956" width="349.248" height="67" fill="#f4f6f6"/><text x="510" y="1032.9999999999957" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">November 1911</text><text x="510" y="1053.9999999999957" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Convention: French protectorate in</text><text x="510" y="1074.9999999999957" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Morocco; Germany gains French Congo land</text><circle cx="470" cy="268" r="7" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="470" cy="316" r="7" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="470" cy="364" r="7" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="470" cy="388" r="7" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="470" cy="412" r="7" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="470" cy="556" r="7" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="470" cy="652" r="7" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="470" cy="700" r="7" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="470" cy="748" r="7" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="470" cy="988" r="7" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="470" cy="1028.7999999999956" r="7" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="1109.1999999999957" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="1144.0199999999957" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Settled, but at a cost</text><text x="50" y="1173.7999999999956" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Each agreement tied Britain closer to France and taught Germany that it was being "encircled".</text>
</svg>