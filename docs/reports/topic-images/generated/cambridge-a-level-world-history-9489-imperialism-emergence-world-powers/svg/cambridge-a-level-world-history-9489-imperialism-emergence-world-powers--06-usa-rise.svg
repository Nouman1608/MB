<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The USA becomes a world power, 1890-1917</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Drawn to scale: ideas and triggers on the left, actions on the right</text>
