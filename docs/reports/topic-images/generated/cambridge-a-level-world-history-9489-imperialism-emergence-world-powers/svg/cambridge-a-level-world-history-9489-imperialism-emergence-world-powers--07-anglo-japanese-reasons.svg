<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 659" width="900" height="659" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="659" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why did Britain sign a treaty with Japan in 1902?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Link the reasons, don't just list them</text>
<rect x="30" y="124" width="199.5" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="129.75" y="161.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Isolation</text><text x="129.75" y="188" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Exposed by the Boer</text><text x="129.75" y="208" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">War</text><rect x="243.5" y="124" width="199.5" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="343.25" y="161.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Naval overstretch</text><text x="343.25" y="188" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Could not match every</text><text x="343.25" y="208" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">naval rival everywhere</text><rect x="457" y="124" width="199.5" height="112" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="556.75" y="161.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Russia in Manchuria</text><text x="556.75" y="188" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">After the Boxer Rising:</text><text x="556.75" y="208" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">a threat in China</text><rect x="670.5" y="124" width="199.5" height="112" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="770.25" y="151.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">A credible partner</text><text x="770.25" y="178" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Japan recently</text><text x="770.25" y="198" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">modernised; strong</text><text x="770.25" y="218" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">after 1895</text><rect x="30" y="292" width="400" height="60" rx="14" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="230" y="326.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">An alliance was necessary</text><rect x="470" y="292" width="400" height="60" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="670" y="326.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Japan was the obvious ally</text><line x1="129.75" y1="242" x2="200" y2="286" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="343.25" y1="242" x2="260" y2="286" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="556.75" y1="242" x2="640" y2="286" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="770.25" y1="242" x2="700" y2="286" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="230" y1="358" x2="380" y2="402" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="670" y1="358" x2="520" y2="402" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="180" y="408" width="540" height="114" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="440" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">1902</text><text x="450" y="468.38" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Anglo-Japanese Treaty</text><text x="450" y="497.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Japan's fleet shares the burden in the Pacific</text><rect x="30" y="538" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="572.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">The link</text><text x="450" y="602.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Isolation plus naval overstretch made an alliance <tspan font-weight="700" fill="#1e2a44">necessary</tspan>; Russia made Japan the <tspan font-weight="700" fill="#1e2a44">obvious</tspan> ally.</text>
</svg>