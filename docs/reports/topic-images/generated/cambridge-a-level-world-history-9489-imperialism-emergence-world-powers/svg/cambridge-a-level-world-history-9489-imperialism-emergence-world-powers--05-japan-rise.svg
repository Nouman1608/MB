x="148.64799999999997" y="187.9" width="286.35200000000003" height="46" fill="#f4f6f6"/><text x="430" y="206.70000000000002" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">1853-54</text><text x="430" y="227.70000000000002" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">Perry's squadron forces Japan open</text><path d="M470,237 L454,237 L436,254.5" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="132.04000000000002" y="239.9" width="302.96" height="67" fill="#f4f6f6"/><text x="430" y="258.7" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">1854-58</text><text x="430" y="279.7" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">Unequal treaties: extraterritoriality, low</text><text x="430" y="300.7" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">tariffs</text><path d="M470,375 L454,375 L436,375" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="133.94399999999996" y="360.4" width="301.05600000000004" height="67" fill="#f4f6f6"/><text x="430" y="379.2" font-size="16" font-weight="700" fill="#b5602e" text-anchor="end">1868</text><text x="430" y="400.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">Meiji Restoration: "rich country, strong</text><text x="430" y="421.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">army"</text><path d="M470,432.5 L454,432.5 L436,448" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="166.632" y="433.4" width="268.368" height="46" fill="#f4f6f6"/><text x="430" y="452.2" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">1873</text><text x="430" y="473.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">Conscription replaces the samurai</text><path d="M470,616.5 L454,616.5 L436,616.5" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="280.024" y="601.9" width="154.976" height="46" fill="#f4f6f6"/><text x="430" y="620.6999999999999" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">1889</text><text x="430" y="641.6999999999999" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">Constitution issued</text><path d="M470,674 L486,674 L504,674" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="505" y="659.4" width="336.016" height="67" fill="#f4f6f6"/><text x="510" y="678.1999999999999" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">1894-95</text><text x="510" y="699.1999999999999" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">War with China: Taiwan; Triple Intervention</text><text x="510" y="720.1999999999999" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">takes Liaodong</text><path d="M470,766 L454,766 L436,766" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="246.99999999999997" y="751.4" width="188.00000000000003" height="46" fill="#f4f6f6"/><text x="430" y="770.1999999999999" font-size="16" font-weight="700" fill="#b5602e" text-anchor="end">1902</text><text x="430" y="791.1999999999999" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">Anglo-Japanese Treaty</text><path d="M470,789 L486,789 L504,789" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="505" y="774.4" width="292.608" height="46" fill="#f4f6f6"/><text x="510" y="793.1999999999999" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">1904-05</text><text x="510" y="814.1999999999999" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Defeats Russia: Treaty of Portsmouth</text><path d="M470,806.25 L486,806.25 L504,841" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="505" y="826.4" width="278.336" height="46" fill="#f4f6f6"/><text x="510" y="845.1999999999999" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">1905; 1910</text><text x="510" y="866.1999999999999" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Korea a protectorate, then annexed</text><path d="M470,869.5 L454,869.5 L436,869.5" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="204.37599999999998" y="854.9" width="230.62400000000002" height="46" fill="#f4f6f6"/><text x="430" y="873.6999999999999" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">1911</text><text x="430" y="894.6999999999999" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">Unequal treaties fully revised</text><path d="M470,904 L486,904 L504,904" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="505" y="889.4" width="274.736" height="67" fill="#f4f6f6"/><text x="510" y="908.1999999999999" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">1914-15</text><text x="510" y="929.1999999999999" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Takes Qingdao and Pacific islands;</text><text x="510" y="950.1999999999999" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Twenty-One Demands</text><path d="M470,950 L486,950 L504,977" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="505" y="962.4" width="292.992" height="46" fill="#f4f6f6"/><text x="510" y="981.1999999999999" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">1918</text><text x="510" y="1002.1999999999999" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Siberia; seat among the great powers</text><circle cx="470" cy="202.5" r="7" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="470" cy="237" r="7" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="470" cy="375" r="7" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="470" cy="432.5" r="7" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="470" cy="616.5" r="7" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="470" cy="674" r="7" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="470" cy="766" r="7" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="470" cy="789" r="7" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="470" cy="806.25" r="7" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="470" cy="869.5" r="7" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="470" cy="904" r="7" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="470" cy="950" r="7" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="1036.4" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="1071.22" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Date the rise from the Meiji reforms, not from 1904</text><text x="50" y="1101" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The band on the spine marks the reform era: 1868 Restoration to the 1889 constitution and 1890</text><text x="50" y="1123" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Rescript on Education.</text>
