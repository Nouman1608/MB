<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">African resistance compared</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Why did Adwa succeed where others failed?</text>
<clipPath id="tc124"><rect x="30" y="124" width="840" height="299" rx="14"/></clipPath><g clip-path="url(#tc124)"><rect x="30" y="124" width="239.99999999999997" height="48" fill="#b5d3cf"/><text x="44" y="151.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Resistance</text><rect x="270" y="124" width="413.3333333333333" height="48" fill="#b5d3cf"/><text x="284" y="151.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">What happened</text><rect x="683.3333333333333" y="124" width="186.66666666666666" height="48" fill="#b5d3cf"/><text x="697.3333333333333" y="151.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Outcome</text><rect x="30" y="172" width="239.99999999999997" height="47" fill="#dce9e7"/><text x="44" y="198.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Anglo-Zulu War (1879)</text><rect x="270" y="172" width="413.3333333333333" height="47" fill="#ffffff"/><text x="284" y="198.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Zulu destroyed a British column at Isandlwana</text><rect x="683.3333333333333" y="172" width="186.66666666666666" height="47" fill="#ffffff"/><text x="697.3333333333333" y="198.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Defeated at Ulundi</text><line x1="30" y1="219" x2="870" y2="219" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="219" width="239.99999999999997" height="68" fill="#dce9e7"/><text x="44" y="245.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Ndebele rebellion</text><text x="44" y="266.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">(1896-97)</text><rect x="270" y="219" width="413.3333333333333" height="68" fill="#f8faf9"/><text x="284" y="245.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Rose against the British South Africa Company's</text><text x="284" y="266.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">seizure of land and cattle</text><rect x="683.3333333333333" y="219" width="186.66666666666666" height="68" fill="#f8faf9"/><text x="697.3333333333333" y="245.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Crushed</text><line x1="30" y1="287" x2="870" y2="287" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="287" width="239.99999999999997" height="47" fill="#d4b02e"/><text x="44" y="313.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Adwa (March 1896)</text><rect x="270" y="287" width="413.3333333333333" height="47" fill="#f2e7b8"/><text x="284" y="313.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Menelik II's Ethiopian army defeated Italy</text><rect x="683.3333333333333" y="287" width="186.66666666666666" height="47" fill="#f2e7b8"/><text x="697.3333333333333" y="313.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Independence kept</text><line x1="30" y1="334" x2="870" y2="334" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="334" width="239.99999999999997" height="89" fill="#dce9e7"/><text x="44" y="360.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Herero War (1904-07)</text><rect x="270" y="334" width="413.3333333333333" height="89" fill="#f8faf9"/><text x="284" y="360.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Von Trotha ordered the Herero driven into the</text><text x="284" y="381.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">desert</text><rect x="683.3333333333333" y="334" width="186.66666666666666" height="89" fill="#f8faf9"/><text x="697.3333333333333" y="360.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Most Herero died;</text><text x="697.3333333333333" y="381.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Nama suffered</text><text x="697.3333333333333" y="402.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">heavily</text></g><line x1="270" y1="124" x2="270" y2="423" stroke="#c9d6d4" stroke-width="1.5"/><line x1="683.3333333333333" y1="124" x2="683.3333333333333" y2="423" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="124" width="840" height="299" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="445" width="269.3333333333333" height="51" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="164.66666666666666" y="475.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Modern rifles</text><rect x="315.3333333333333" y="445" width="269.3333333333333" height="51" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="475.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Unity</text><rect x="600.6666666666666" y="445" width="269.3333333333333" height="51" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="735.3333333333333" y="475.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Numbers</text><rect x="150" y="560" width="600" height="91" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="596.38" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Adwa: Ethiopia stays independent</text><text x="450" y="626.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">With Liberia, one of only two independent African states by 1914</text><line x1="164.66666666666666" y1="502" x2="300" y2="554" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="450" y1="502" x2="450" y2="554" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="735.3333333333333" y1="502" x2="600" y2="554" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/>
