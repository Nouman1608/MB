<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 630" width="900" height="630" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="630" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Two ways to rule a colony</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Direct and indirect rule compared</text>
<text x="230" y="140" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">e.g. FRENCH ASSIMILATION; CONGO FREE STATE</text><text x="230" y="166" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Direct rule</text><rect x="80" y="186" width="300" height="48" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="230" y="214.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Colonial power</text><rect x="80" y="274" width="300" height="76" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="230" y="302.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">European officials</text><text x="230" y="331.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Replace local rulers</text><rect x="80" y="390" width="300" height="48" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="230" y="418.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Colonised people</text><line x1="230" y1="238" x2="230" y2="270" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="230" y1="354" x2="230" y2="386" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="670" y="140" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">e.g. LUGARD IN NORTHERN NIGERIA</text><text x="670" y="166" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Indirect rule</text><rect x="520" y="186" width="300" height="97" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="670" y="214.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Colonial power</text><text x="670" y="243.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">A small number of officials</text><text x="670" y="264.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">supervise</text><rect x="520" y="323" width="300" height="76" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="670" y="351.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Existing chiefs and emirs</text><text x="670" y="380.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Keep their positions</text><rect x="520" y="439" width="300" height="48" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="670" y="467.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Colonised people</text><line x1="670" y1="287" x2="670" y2="319" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="670" y1="403" x2="670" y2="435" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="450" y1="184" x2="450" y2="487" stroke="#c9d6d4" stroke-width="2.5" stroke-dasharray="8 6"/><rect x="30" y="509" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="543.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Trade-off</text><text x="450" y="573.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Indirect rule was <tspan font-weight="700" fill="#1e2a44">cheaper</tspan>, but it <tspan font-weight="700" fill="#1e2a44">froze</tspan> <tspan font-weight="700" fill="#1e2a44">local</tspan> <tspan font-weight="700" fill="#1e2a44">hierarchies</tspan>.</text>
</svg>