<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 544" width="900" height="544" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="544" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why the Scramble for Africa?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">The syllabus groups motives under three headings</text>
<rect x="30" y="124" width="270.6666666666667" height="191" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="45" y="151" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ECONOMIC</text><text x="45" y="177.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Raw materials, markets,</text><text x="45" y="200.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">investment</text><text x="45" y="228" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="59.25" y="228" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Palm oil, rubber, cotton, later</text><text x="59.25" y="248" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">copper</text><text x="45" y="272" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="59.25" y="272" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Gold and diamonds in the south</text><text x="45" y="296" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="59.25" y="296" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Hobson (1902): surplus capital</text><rect x="314.6666666666667" y="124" width="270.6666666666667" height="191" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="329.6666666666667" y="162.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">RELIGIOUS AND CULTURAL</text><text x="329.6666666666667" y="188.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The "civilising mission"</text><text x="329.6666666666667" y="216.5" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="343.9166666666667" y="216.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Missionaries sought converts</text><text x="329.6666666666667" y="240.5" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="343.9166666666667" y="240.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Christianity, Western</text><text x="343.9166666666667" y="260.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">education, commerce</text><text x="329.6666666666667" y="284.5" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="343.9166666666667" y="284.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Bound up with racial ideas</text><rect x="599.3333333333334" y="124" width="270.6666666666667" height="191" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="614.3333333333334" y="164.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">NATIONAL AND STRATEGIC</text><text x="614.3333333333334" y="190.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Prestige and routes</text><text x="614.3333333333334" y="218.5" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="628.5833333333334" y="218.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Prestige for newly united</text><text x="628.5833333333334" y="238.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Germany and Italy</text><text x="614.3333333333334" y="262.5" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="628.5833333333334" y="262.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Strategy mattered most for</text><text x="628.5833333333334" y="282.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Britain</text><text x="30" y="353" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">BRITAIN'S STRATEGIC CHAIN</text><rect x="30" y="377" width="184.5" height="135" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122.25" y="424.1" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Route to India</text><text x="122.25" y="454.1" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">Suez Canal</text><text x="122.25" y="476.1" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">(opened 1869)</text><line x1="220.5" y1="444.5" x2="242.5" y2="444.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="248.5" y="377" width="184.5" height="135" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="340.75" y="409" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">1875</text><text x="340.75" y="436.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Buys the</text><text x="340.75" y="461.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Khedive's</text><text x="340.75" y="486.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">shares</text><line x1="439" y1="444.5" x2="461" y2="444.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="467" y="377" width="184.5" height="135" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="559.25" y="421.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">1882</text><text x="559.25" y="449.1" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Occupies</text><text x="559.25" y="474.1" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Egypt</text><line x1="657.5" y1="444.5" x2="679.5" y2="444.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="685.5" y="377" width="184.5" height="135" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="777.75" y="437.1" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Then the Nile</text><text x="777.75" y="462.1" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">and the Sudan</text>
</svg>