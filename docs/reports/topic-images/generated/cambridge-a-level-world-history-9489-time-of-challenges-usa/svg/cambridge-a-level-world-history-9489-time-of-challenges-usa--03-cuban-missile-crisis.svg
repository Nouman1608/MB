<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 611" width="900" height="611" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="611" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The Cuban Missile Crisis, October 1962</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Options, choice and settlement</text>
<rect x="30" y="124" width="395" height="101" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="45" y="151" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">APRIL 1961</text><text x="45" y="177.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Bay of Pigs</text><text x="45" y="205.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Fails; Castro moves closer to Moscow</text><line x1="431" y1="174.5" x2="469" y2="174.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="475" y="124" width="395" height="101" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="490" y="151" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">OCTOBER 1962</text><text x="490" y="177.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">U-2 photographs</text><text x="490" y="205.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Missile sites in Cuba</text><text x="450" y="263" font-size="17" font-weight="700" fill="#4a5568" text-anchor="middle">ExComm considers</text><rect x="72.983" y="277" width="109.034" height="31" rx="15.5" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="127.5" y="298.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Air strikes</text><rect x="295.20799999999997" y="277" width="94.584" height="31" rx="15.5" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="342.5" y="298.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Invasion</text><rect x="474.66949999999997" y="277" width="165.661" height="31" rx="15.5" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="557.5" y="298.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Naval quarantine</text><rect x="716.3765" y="277" width="112.247" height="31" rx="15.5" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="772.5" y="298.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Diplomacy</text><text x="557.5" y="337" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">Kennedy's choice</text><rect x="30" y="365" width="411" height="111" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="397" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PUBLIC</text><text x="50" y="423.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Missiles removed</text><text x="50" y="451.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">In return for a pledge not to invade Cuba</text><rect x="459" y="365" width="411" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="479" y="397" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PRIVATE</text><text x="479" y="423.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">US missiles out of Turkey</text><text x="479" y="451.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A secret promise</text><rect x="30" y="498" width="411" height="81" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="530" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">OUTCOMES</text><text x="50" y="555.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Hotline; Partial Test Ban Treaty (1963)</text><rect x="459" y="498" width="411" height="81" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="479" y="530" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">BUT</text><text x="479" y="555.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Soviet determination to catch up in missiles</text>
</svg>