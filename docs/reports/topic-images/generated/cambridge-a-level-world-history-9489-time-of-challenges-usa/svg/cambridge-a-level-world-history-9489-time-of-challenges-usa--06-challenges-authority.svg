<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 436" width="900" height="436" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="436" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Challenges to authority</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Four movements, and the authorities' reaction</text>
<rect x="30" y="124" width="412" height="132" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FEMINISM</text><text x="50" y="182.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Friedan (1963); NOW (1966)</text><text x="50" y="210.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Women's liberation; Roe v. Wade (1973);</text><text x="50" y="231.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">opposed by Schlafly</text><rect x="458" y="124" width="412" height="132" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="478" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">BLACK POWER</text><text x="478" y="182.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Malcolm X; Carmichael (1966)</text><text x="478" y="210.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Black Panthers: armed patrols and breakfast</text><text x="478" y="231.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">programmes; targeted by police and FBI</text><rect x="30" y="272" width="412" height="132" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="314.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">IDENTITY POLITICS</text><text x="50" y="340.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Stonewall (1969); AIM (1968)</text><text x="50" y="369.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Gay Liberation Front; Wounded Knee (1973)</text><rect x="458" y="272" width="412" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="478" y="304" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PROTEST AND REACTION</text><text x="478" y="330.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Chicago (1968); Kent State (1970)</text><text x="478" y="358.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Riots in Watts (1965) and after King's</text><text x="478" y="379.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">assassination (1968)</text>
</svg>