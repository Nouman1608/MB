<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 632" width="900" height="632" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="632" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Campaigns that produced laws</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Non-violent direct action aimed to provoke a federal response</text>
<text x="210" y="140" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">CAMPAIGN</text><text x="690" y="140" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">FEDERAL RESPONSE</text><line x1="450" y1="154" x2="450" y2="490" stroke="#1e2a44" stroke-width="3"/><rect x="30" y="154" width="360" height="70" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="43" y="180.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Freedom Riders</text><text x="43" y="207" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Test desegregated interstate travel</text><line x1="390" y1="189" x2="396" y2="189" stroke="#1e2a44" stroke-width="2"/><rect x="510" y="154" width="360" height="70" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="523" y="180.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Ole Miss (1962)</text><text x="523" y="207" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Marshals and troops</text><line x1="504" y1="189" x2="510" y2="189" stroke="#1e2a44" stroke-width="2"/><rect x="396" y="172" width="108" height="34" rx="17" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="195" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">1961</text><rect x="30" y="236" width="360" height="70" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="43" y="262.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Birmingham; March on Washington</text><text x="43" y="289" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Connor's dogs and hoses; support for the bill</text><line x1="390" y1="271" x2="396" y2="271" stroke="#1e2a44" stroke-width="2"/><rect x="510" y="236" width="360" height="70" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="523" y="275.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Kennedy proposes a bill (June 1963)</text><line x1="504" y1="271" x2="510" y2="271" stroke="#1e2a44" stroke-width="2"/><rect x="396" y="254" width="108" height="34" rx="17" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="277" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">1963</text><rect x="30" y="318" width="360" height="90" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="43" y="344.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Freedom Summer</text><text x="43" y="371" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Mississippi voter registration; three workers</text><text x="43" y="391" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">murdered</text><line x1="390" y1="363" x2="396" y2="363" stroke="#1e2a44" stroke-width="2"/><rect x="510" y="318" width="360" height="90" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="523" y="367.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Civil Rights Act (1964)</text><line x1="504" y1="363" x2="510" y2="363" stroke="#1e2a44" stroke-width="2"/><rect x="396" y="346" width="108" height="34" rx="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="369" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">1964</text><rect x="30" y="420" width="360" height="70" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="43" y="459.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Selma: Bloody Sunday</text><line x1="390" y1="455" x2="396" y2="455" stroke="#1e2a44" stroke-width="2"/><rect x="510" y="420" width="360" height="70" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="523" y="446.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Voting Rights Act (1965)</text><text x="523" y="473" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Black registration in the South rose sharply</text><line x1="504" y1="455" x2="510" y2="455" stroke="#1e2a44" stroke-width="2"/><rect x="396" y="438" width="108" height="34" rx="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="461" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Mar 1965</text><rect x="30" y="512" width="840" height="88" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="544" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">LIMITS</text><text x="50" y="575.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Northern ghettos, unemployment and housing discrimination persisted</text>
</svg>