<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How Watergate unravelled</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Drawn to scale, June 1972 to August 1974</text>
<line x1="107.40740740738248" y1="148" x2="107.40740740738248" y2="402" stroke="#c9d6d4" stroke-width="1.5"/><text x="107.40740740738248" y="138" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">Jul 1972</text><line x1="271.85185185182695" y1="148" x2="271.85185185182695" y2="402" stroke="#c9d6d4" stroke-width="1.5"/><text x="271.85185185182695" y="138" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">Jan 1973</text><line x1="436.29629629627135" y1="148" x2="436.29629629627135" y2="402" stroke="#c9d6d4" stroke-width="1.5"/><text x="436.29629629627135" y="138" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">Jul 1973</text><line x1="600.7407407407159" y1="148" x2="600.7407407407159" y2="402" stroke="#c9d6d4" stroke-width="1.5"/><text x="600.7407407407159" y="138" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">Jan 1974</text><line x1="765.1851851851602" y1="148" x2="765.1851851851602" y2="402" stroke="#c9d6d4" stroke-width="1.5"/><text x="765.1851851851602" y="138" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">Jul 1974</text><line x1="60" y1="266" x2="840" y2="266" stroke="#1e2a44" stroke-width="4" stroke-linecap="round"/><path d="M94.37765634484903,266 L94.37765634484903,250 L94.37765634484903,216" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="30.625656344849027" y="150" width="127.504" height="64" fill="#f4f6f6"/><text x="94.37765634484903" y="165" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">June 1972</text><text x="94.37765634484903" y="185" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Break-in at</text><text x="94.37765634484903" y="205" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Democratic HQ</text><path d="M535.5919854280485,266 L535.5919854280485,250 L535.5919854280485,216" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="469.5359854280485" y="150" width="132.112" height="64" fill="#f4f6f6"/><text x="535.5919854280485" y="165" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">October 1973</text><text x="535.5919854280485" y="185" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">"Saturday Night</text><text x="535.5919854280485" y="205" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Massacre"</text><path d="M799.7814207649673,266 L799.7814207649673,250 L799.7814207649673,216" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="737.6854207649673" y="150" width="124.192" height="64" fill="#f4f6f6"/><text x="799.7814207649673" y="165" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">9 August 1974</text><text x="799.7814207649673" y="185" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Nixon</text><text x="799.7814207649673" y="205" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">resigns</text><path d="M436.29629629627135,266 L436.29629629627135,282 L436.29629629627135,316" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="366.64029629627134" y="318" width="139.312" height="84" fill="#f4f6f6"/><text x="436.29629629627135" y="333" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">1973</text><text x="436.29629629627135" y="353" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Senate hearings;</text><text x="436.29629629627135" y="373" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">White House</text><text x="436.29629629627135" y="393" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">tapes revealed</text><path d="M785.8530661808901,266 L785.8530661808901,282 L785.8530661808901,316" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="733.3090661808901" y="318" width="105.088" height="64" fill="#f4f6f6"/><text x="785.8530661808901" y="333" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">July 1974</text><text x="785.8530661808901" y="353" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">US v. Nixon:</text><text x="785.8530661808901" y="373" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">unanimous</text><circle cx="94.37765634484903" cy="266" r="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><circle cx="436.29629629627135" cy="266" r="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><circle cx="535.5919854280485" cy="266" r="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><circle cx="785.8530661808901" cy="266" r="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><circle cx="799.7814207649673" cy="266" r="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><rect x="30" y="428" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="462.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">What brought him down</text><text x="450" y="492.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Press investigation, Congress, the tapes and the Supreme Court: the cover-up, not the break-in.</text>
