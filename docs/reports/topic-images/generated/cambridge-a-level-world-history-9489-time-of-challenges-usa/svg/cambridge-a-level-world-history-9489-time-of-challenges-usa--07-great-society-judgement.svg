<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 574" width="900" height="574" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="574" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">"The Great Society was a failure"</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Two criteria, two answers</text>
<polygon points="450,164 416,234 484,234" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><line x1="210" y1="130" x2="690" y2="198" stroke="#1e2a44" stroke-width="7" stroke-linecap="round"/><circle cx="450" cy="164" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><line x1="210" y1="130" x2="210" y2="170" stroke="#1e2a44" stroke-width="3"/><rect x="30" y="170" width="360" height="126" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="46" y="200.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Judged by its aim: ending poverty</text><text x="46" y="229.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="61.2" y="229.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Poverty persisted in cities and the rural</text><text x="61.2" y="250.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">South</text><text x="46" y="275.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="61.2" y="275.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Vietnam diverted resources</text><line x1="690" y1="198" x2="690" y2="238" stroke="#1e2a44" stroke-width="3"/><rect x="510" y="238" width="360" height="193" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="526" y="268.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Judged by lasting legislation</text><text x="526" y="297.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="541.2" y="297.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Medicare, Medicaid and school aid</text><text x="541.2" y="318.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">endured</text><text x="526" y="343.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="541.2" y="343.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Poverty fell from about 19% to about 11%</text><text x="541.2" y="364.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">by 1973</text><text x="526" y="389.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="541.2" y="389.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Civil Rights and Voting Rights Acts</text><text x="541.2" y="410.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">transformed the South</text><rect x="30" y="453" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="487.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Thesis</text><text x="450" y="517.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">The view <tspan font-weight="700" fill="#1e2a44">underestimates</tspan> the programme's permanent achievements.</text>
</svg>