<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three presidencies, 1961-74</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Domestic programmes compared</text>
<clipPath id="tc124"><rect x="30" y="124" width="840" height="306" rx="14"/></clipPath><g clip-path="url(#tc124)"><rect x="30" y="124" width="143.8674033149171" height="48" fill="#b5d3cf"/><rect x="173.8674033149171" y="124" width="232.04419889502762" height="48" fill="#dce9e7"/><text x="187.8674033149171" y="151.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Kennedy: New Frontier</text><rect x="405.9116022099447" y="124" width="232.04419889502762" height="48" fill="#b5d3cf"/><text x="419.9116022099447" y="151.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Johnson: Great Society</text><rect x="637.9558011049724" y="124" width="232.04419889502762" height="48" fill="#f2e7b8"/><text x="651.9558011049724" y="151.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Nixon</text><rect x="30" y="172" width="143.8674033149171" height="86" fill="#dce9e7"/><text x="44" y="198" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Won</text><rect x="173.8674033149171" y="172" width="232.04419889502762" height="86" fill="#ffffff"/><text x="187.8674033149171" y="198" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">1960: 303 to 219, a tiny</text><text x="187.8674033149171" y="218" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">popular margin</text><rect x="405.9116022099447" y="172" width="232.04419889502762" height="86" fill="#ffffff"/><text x="419.9116022099447" y="198" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">1964 landslide over</text><text x="419.9116022099447" y="218" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Goldwater</text><rect x="637.9558011049724" y="172" width="232.04419889502762" height="86" fill="#ffffff"/><text x="651.9558011049724" y="198" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">1968: "silent majority";</text><text x="651.9558011049724" y="218" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Wallace took five Southern</text><text x="651.9558011049724" y="238" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">states</text><line x1="30" y1="258" x2="870" y2="258" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="258" width="143.8674033149171" height="86" fill="#dce9e7"/><text x="44" y="284" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Key laws</text><rect x="173.8674033149171" y="258" width="232.04419889502762" height="86" fill="#f8faf9"/><text x="187.8674033149171" y="284" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Minimum wage $1.25; Area</text><text x="187.8674033149171" y="304" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Redevelopment (1961);</text><text x="187.8674033149171" y="324" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Equal Pay Act (1963)</text><rect x="405.9116022099447" y="258" width="232.04419889502762" height="86" fill="#f8faf9"/><text x="419.9116022099447" y="284" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Civil Rights (1964), Voting</text><text x="419.9116022099447" y="304" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Rights (1965), Medicare and</text><text x="419.9116022099447" y="324" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Medicaid, ESEA (1965)</text><rect x="637.9558011049724" y="258" width="232.04419889502762" height="86" fill="#f8faf9"/><text x="651.9558011049724" y="284" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">New Economic Policy (1971);</text><text x="651.9558011049724" y="304" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">New Federalism; EPA (1970)</text><line x1="30" y1="344" x2="870" y2="344" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="344" width="143.8674033149171" height="86" fill="#dce9e7"/><text x="44" y="370" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Limits</text><rect x="173.8674033149171" y="344" width="232.04419889502762" height="86" fill="#ffffff"/><text x="187.8674033149171" y="370" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Medical care and school aid</text><text x="187.8674033149171" y="390" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">blocked by the conservative</text><text x="187.8674033149171" y="410" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">coalition</text><rect x="405.9116022099447" y="344" width="232.04419889502762" height="86" fill="#ffffff"/><text x="419.9116022099447" y="370" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Cost, Southern resentment,</text><text x="419.9116022099447" y="390" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">underfunding; Vietnam</text><text x="419.9116022099447" y="410" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">drained money</text><rect x="637.9558011049724" y="344" width="232.04419889502762" height="86" fill="#ffffff"/><text x="651.9558011049724" y="370" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Opposed busing; Watergate</text></g><line x1="173.8674033149171" y1="124" x2="173.8674033149171" y2="430" stroke="#c9d6d4" stroke-width="1.5"/><line x1="405.9116022099447" y1="124" x2="405.9116022099447" y2="430" stroke="#c9d6d4" stroke-width="1.5"/><line x1="637.9558011049724" y1="124" x2="637.9558011049724" y2="430" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="124" width="840" height="306" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="452" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="486.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Poverty rate</text><text x="450" y="516.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">About <tspan font-weight="700" fill="#1e2a44">19</tspan> <tspan font-weight="700" fill="#1e2a44">per</tspan> <tspan font-weight="700" fill="#1e2a44">cent</tspan> in 1964 to about <tspan font-weight="700" fill="#1e2a44">11</tspan> <tspan font-weight="700" fill="#1e2a44">per</tspan> <tspan font-weight="700" fill="#1e2a44">cent</tspan> by 1973.</text>
