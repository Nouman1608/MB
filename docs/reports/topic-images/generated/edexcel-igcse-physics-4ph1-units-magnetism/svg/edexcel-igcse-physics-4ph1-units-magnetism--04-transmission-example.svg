<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="700" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: why transmit at high voltage (P)</text>

<rect x="30" y="110" width="840" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="146" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Invented figures for practice: 400 MW from a power station</text><rect x="50" y="170" width="150" height="90" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="125" y="208" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">generator</text><text x="125" y="236" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">at 25 kV</text><line x1="205" y1="215" x2="260" y2="215" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="265" y="170" width="150" height="90" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="340" y="208" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">step-up</text><text x="340" y="236" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">transformer</text><line x1="420" y1="215" x2="475" y2="215" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="480" y="170" width="170" height="90" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="565" y="208" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">cables</text><text x="565" y="236" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">at 400 kV</text><line x1="655" y1="215" x2="710" y2="215" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="715" y="170" width="135" height="90" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="782.5" y="208" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">step-down</text><text x="782.5" y="236" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">near homes</text><text x="450" y="300" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">voltage ratio = 400 / 25 = 16: the secondary has 16 times as many turns as the primary</text><text x="450" y="340" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">Same power, sixteen times smaller current: much less heating of the cables,</text><text x="450" y="366" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">so less energy is wasted.</text><text x="450" y="412" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Convert first: 400 MW = 400 × 10⁶ W;  25 kV = 25 × 10³ V;  400 kV = 400 × 10³ V</text><rect x="30" y="460" width="840" height="220" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="60" y="498" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Current I = P / V, bars to scale</text><text x="60" y="548" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">at 25 kV</text><text x="60" y="570" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">400 × 10⁶ / 25 × 10³</text><rect x="270" y="530" width="570" height="40" rx="4" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><text x="830" y="557" font-size="18" font-weight="700" fill="#fff" text-anchor="end">16 000 A</text><text x="60" y="628" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">at 400 kV</text><text x="60" y="650" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">400 × 10⁶ / 400 × 10³</text><rect x="270" y="610" width="35.625" height="40" rx="4" fill="#2e6b62" stroke="#1e2a44" stroke-width="2"/><text x="315.625" y="637" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">1000 A</text>
</svg>