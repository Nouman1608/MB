<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 490" width="900" height="490" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="490" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Power, energy and efficiency</text>

<rect x="30" y="110" width="410" height="360" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="235" y="148" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Example 3: a d.c. motor</text><circle cx="235" cy="230" r="44" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="235" y="238" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">M</text><text x="125" y="236" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">6.0 V</text><text x="345" y="236" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">0.50 A</text><text x="60" y="320" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">P = I × V = 0.50 × 6.0 = 3.0 W</text><text x="60" y="354" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">in 2.0 minutes: t = 120 s</text><text x="60" y="388" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">E = P × t = 3.0 × 120 = 360 J</text><rect x="460" y="110" width="410" height="360" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="665" y="148" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Example 4: a real transformer</text><rect x="490" y="190" width="340" height="46" rx="4" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><text x="505" y="220" font-size="18" font-weight="700" fill="#fff" text-anchor="start">input 12 W</text><rect x="490" y="250" width="306" height="46" rx="4" fill="#2e6b62" stroke="#1e2a44" stroke-width="2"/><text x="505" y="280" font-size="18" font-weight="700" fill="#fff" text-anchor="start">output 10.8 W</text><text x="846" y="283" font-size="15" font-weight="700" fill="#b5602e" text-anchor="end">heat</text><text x="490" y="340" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">efficiency = 10.8 / 12 × 100%</text><text x="490" y="380" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="start">= 90%</text><text x="490" y="420" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Output a little less than input:</text><text x="490" y="441" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the coils and core heat up.</text>
</svg>