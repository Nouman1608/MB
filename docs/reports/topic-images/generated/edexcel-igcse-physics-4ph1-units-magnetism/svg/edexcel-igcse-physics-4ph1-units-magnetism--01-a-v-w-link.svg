<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" width="900" height="680" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="680" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Ampere, volt and watt</text>

<rect x="30" y="110" width="840" height="260" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="70" y="150" width="200" height="90" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="170" y="192" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">ampere (A)</text><text x="170" y="222" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">current, I</text><text x="320" y="205" font-size="34" font-weight="700" fill="#1e2a44" text-anchor="middle">×</text><rect x="370" y="150" width="200" height="90" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="470" y="192" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">volt (V)</text><text x="470" y="222" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">voltage, V</text><text x="620" y="205" font-size="34" font-weight="700" fill="#1e2a44" text-anchor="middle">=</text><rect x="670" y="150" width="170" height="90" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="755" y="192" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">watt (W)</text><text x="755" y="222" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">power, P</text><text x="450" y="290" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1 W = 1 A × 1 V</text><text x="450" y="335" font-size="19" font-weight="600" fill="#2b5a9a" text-anchor="middle">(C/s) × (J/C) = J/s = W</text><rect x="30" y="390" width="410" height="270" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="235" y="428" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Transformer power (P)</text><text x="235" y="480" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">V<tspan baseline-shift="sub" font-size="0.7em">p</tspan> × I<tspan baseline-shift="sub" font-size="0.7em">p</tspan> = V<tspan baseline-shift="sub" font-size="0.7em">s</tspan> × I<tspan baseline-shift="sub" font-size="0.7em">s</tspan></text><text x="60" y="528" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">input power (W) = output power (W)</text><text x="60" y="554" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">for 100% efficiency</text><text x="235" y="620" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="middle">both sides are in watts</text><rect x="460" y="390" width="410" height="270" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="665" y="428" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Turns ratio: no unit</text><text x="665" y="480" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">V<tspan baseline-shift="sub" font-size="0.7em">p</tspan> / V<tspan baseline-shift="sub" font-size="0.7em">s</tspan> = N<tspan baseline-shift="sub" font-size="0.7em">p</tspan> / N<tspan baseline-shift="sub" font-size="0.7em">s</tspan></text><text x="490" y="528" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">turns ÷ turns is a pure number,</text><text x="490" y="554" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">so the voltage units cancel:</text><text x="490" y="580" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">both in V, or both in kV.</text>
</svg>