<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 670" width="900" height="670" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="670" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Prefixes in Topic 6</text>

<rect x="30" y="110" width="840" height="86" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="90" y="166" font-size="30" font-weight="700" fill="#1e2a44" text-anchor="middle">M</text><text x="150" y="148" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">mega</text><text x="150" y="176" font-size="19" font-weight="700" fill="#2b5a9a" text-anchor="start">× 10⁶</text><text x="840" y="164" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="end">MW: output of a power station</text><rect x="30" y="210" width="840" height="86" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="90" y="266" font-size="30" font-weight="700" fill="#1e2a44" text-anchor="middle">k</text><text x="150" y="248" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">kilo</text><text x="150" y="276" font-size="19" font-weight="700" fill="#2b5a9a" text-anchor="start">× 10³</text><text x="840" y="264" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="end">kV: transmission voltages;  kW: motors</text><rect x="30" y="310" width="840" height="86" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="90" y="366" font-size="30" font-weight="700" fill="#1e2a44" text-anchor="middle">—</text><text x="150" y="348" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">base</text><text x="150" y="376" font-size="19" font-weight="700" fill="#2b5a9a" text-anchor="start">× 1</text><text x="840" y="364" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="end">A, V, W</text><rect x="30" y="410" width="840" height="86" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="90" y="466" font-size="30" font-weight="700" fill="#1e2a44" text-anchor="middle">m</text><text x="150" y="448" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">milli</text><text x="150" y="476" font-size="19" font-weight="700" fill="#2b5a9a" text-anchor="start">× 10⁻³</text><text x="840" y="464" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="end">mA: small currents;  mV: induced in a small coil</text><rect x="30" y="520" width="410" height="130" rx="14" fill="#fbeee6" stroke="#b5602e" stroke-width="2.5"/><text x="60" y="560" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">m (milli) and M (mega) differ</text><text x="60" y="586" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">by a factor of a thousand</text><text x="60" y="612" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">million.</text><rect x="460" y="520" width="410" height="130" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="490" y="562" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">25 mV on a sensitive meter</text><text x="490" y="596" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">= 0.025 V</text>
</svg>