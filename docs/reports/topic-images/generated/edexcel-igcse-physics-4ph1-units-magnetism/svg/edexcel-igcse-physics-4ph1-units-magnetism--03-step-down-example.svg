idth="3.5"/><text x="450" y="400" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">soft-iron core</text><line x1="340" y1="190" x2="190" y2="190" stroke="#1e2a44" stroke-width="3"/><line x1="340" y1="330" x2="190" y2="330" stroke="#1e2a44" stroke-width="3"/><text x="180" y="250" font-size="24" font-weight="700" fill="#b5602e" text-anchor="end">230 V</text><text x="180" y="278" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">mains (primary)</text><line x1="560" y1="210" x2="710" y2="210" stroke="#1e2a44" stroke-width="3"/><line x1="560" y1="310" x2="710" y2="310" stroke="#1e2a44" stroke-width="3"/><text x="720" y="250" font-size="24" font-weight="700" fill="#2b5a9a" text-anchor="start">5.0 V</text><text x="720" y="278" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">output</text><text x="720" y="304" font-size="20" font-weight="700" fill="#2b5a9a" text-anchor="start">2.0 A</text><rect x="30" y="460" width="840" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="494" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">output power</text><text x="60" y="524" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">V<tspan baseline-shift="sub" font-size="0.7em">s</tspan> × I<tspan baseline-shift="sub" font-size="0.7em">s</tspan> = 5.0 × 2.0</text><rect x="620" y="476" width="230" height="52" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="735" y="510" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">10 W</text><rect x="30" y="556" width="840" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="590" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">input power (100% efficient)</text><text x="60" y="620" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">input power = output power</text><rect x="620" y="572" width="230" height="52" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="735" y="606" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">10 W</text><rect x="30" y="652" width="840" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="686" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">input current</text><text x="60" y="716" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">I<tspan baseline-shift="sub" font-size="0.7em">p</tspan> = 10 / 230 = 0.043 A</text><rect x="620" y="668" width="230" height="52" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="735" y="702" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">43 mA</text><rect x="30" y="748" width="840" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="782" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">turns ratio (no unit)</text><text x="60" y="812" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">V<tspan baseline-shift="sub" font-size="0.7em">p</tspan> / V<tspan baseline-shift="sub" font-size="0.7em">s</tspan> = 230 / 5.0</text><rect x="620" y="764" width="230" height="52" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="735" y="798" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">46</text><text x="450" y="870" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Voltage down by a factor of 46, so current up by the same factor (ideal transformer).</text>
</svg>