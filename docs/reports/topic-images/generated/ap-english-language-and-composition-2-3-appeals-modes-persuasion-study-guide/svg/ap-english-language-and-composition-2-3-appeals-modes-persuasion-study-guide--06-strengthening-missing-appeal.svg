<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 490" width="900" height="490" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="490" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Strengthening the missing appeal</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Worked example 2: a quiet study room</text>
<text x="330" y="130" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle" xml:space="preserve">Before</text><text x="690" y="130" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">After revision</text><rect x="30" y="146" width="110" height="87.36000000000001" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5" /><text x="85" y="196.68" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Logos</text><rect x="160" y="146" width="330" height="87.36000000000001" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="6 5"/><text x="174" y="173.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">Claim stated, no evidence: “Noisy</text><text x="174" y="194.72" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">corridors cause stress” is an</text><text x="174" y="215.84" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">assertion.</text><rect x="520" y="146" width="350" height="87.36000000000001" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="534" y="173.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">Survey: 87 of 120 pupils could not find a</text><text x="534" y="194.72" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">quiet place (invented); a measured point</text><text x="534" y="215.84" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">about cost.</text><line x1="494" y1="189.68" x2="514" y2="189.68" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="245.36" width="110" height="66.24000000000001" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5" /><text x="85" y="285.48" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Ethos</text><rect x="160" y="245.36" width="330" height="66.24000000000001" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="6 5"/><text x="174" y="283.52000000000004" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">Nothing shows credibility or fairness.</text><rect x="520" y="245.36" width="350" height="66.24000000000001" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="534" y="272.96000000000004" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">Local detail shows the writer knows the</text><text x="534" y="294.08000000000004" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">school; measured cost argument.</text><line x1="494" y1="278.48" x2="514" y2="278.48" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="323.6" width="110" height="66.24000000000001" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5" /><text x="85" y="363.72" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Pathos</text><rect x="160" y="323.6" width="330" height="66.24000000000001" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="6 5"/><text x="174" y="351.20000000000005" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">Mild: “needs somewhere calm”, no</text><text x="174" y="372.32000000000005" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">image or story.</text><rect x="520" y="323.6" width="350" height="66.24000000000001" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="534" y="351.20000000000005" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">Mock exam week: library full by 12.40,</text><text x="534" y="372.32000000000005" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">corridors too loud to revise.</text><line x1="494" y1="356.72" x2="514" y2="356.72" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="405.84000000000003" width="840" height="54.44" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="450" y="438.29" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Biggest gap: <tspan font-weight="700">logos</tspan>, so evidence is added first. The paragraph still makes a single claim.</text>
</svg>