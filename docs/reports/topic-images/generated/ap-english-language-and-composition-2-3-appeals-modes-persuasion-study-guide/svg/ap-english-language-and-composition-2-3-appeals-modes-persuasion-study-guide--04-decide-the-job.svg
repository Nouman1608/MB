<rect width="900" height="564" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Decide the job, not the label</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">The same kind of material can serve different appeals</text>
<rect x="30" y="192" width="220" height="64" rx="32" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3" /><text x="140" y="231" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">A statistic</text><path d="M252,224 C300,224 300,152 350,152" fill="none" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="356" y="128" width="104" height="48" rx="24" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="408" y="159" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">Logos</text><text x="480" y="158" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">supports a claim with evidence</text><path d="M252,224 C300,224 300,224 350,224" fill="none" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="356" y="200" width="104" height="48" rx="24" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="408" y="231" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">Pathos</text><text x="480" y="230" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">arouses fear</text><path d="M252,224 C300,224 300,296 350,296" fill="none" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="356" y="272" width="104" height="48" rx="24" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="408" y="303" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">Ethos</text><text x="480" y="302" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">quoted from a credible institution</text><line x1="30" y1="350" x2="870" y2="350" stroke="#c9d6d4" stroke-width="2" stroke-dasharray="6 6"/><rect x="30" y="444" width="220" height="64" rx="32" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3" /><text x="140" y="483" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Quoting an expert</text><path d="M252,476 C300,476 300,404 350,404" fill="none" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="356" y="380" width="104" height="48" rx="24" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="408" y="411" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">Ethos</text><text x="480" y="410" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">cited for authority: builds credibility</text><path d="M252,476 C300,476 300,476 350,476" fill="none" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="356" y="452" width="104" height="48" rx="24" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="408" y="483" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">Logos</text><text x="480" y="482" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">the expert’s reasoning, if explained</text>
</svg>