<rect width="900" height="498" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Where ethos is built</text>

<rect x="30" y="116" width="246.66666666666666" height="125.75999999999999" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="153.33333333333331" y="150" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">Before the argument</text><text x="153.33333333333331" y="178" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">a speaker’s title or</text><text x="153.33333333333331" y="199.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">reputation</text><rect x="326.66666666666663" y="116" width="246.66666666666666" height="125.75999999999999" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="449.99999999999994" y="150" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">Within the text</text><text x="449.99999999999994" y="178" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">an account of experience:</text><text x="449.99999999999994" y="199.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">“I have taught for thirty</text><text x="449.99999999999994" y="220.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">years.”</text><rect x="623.3333333333333" y="116" width="246.66666666666666" height="125.75999999999999" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="746.6666666666666" y="150" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">Through the style</text><text x="746.6666666666666" y="178" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">precision and courtesy;</text><text x="746.6666666666666" y="199.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">correct, measured</text><text x="746.6666666666666" y="220.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">language</text><text x="450" y="281.76" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">What builds trust in the text</text><rect x="30" y="301.76" width="232.25622" height="35" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2" /><text x="146.12811" y="325.21" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Knowledge or experience</text><rect x="274.25622" y="301.76" width="242.79724" height="35" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2" /><text x="395.65484" y="325.21" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Fairness: conceding points</text><rect x="529.05346" y="301.76" width="137.57965000000002" height="35" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2" /><text x="597.8432849999999" y="325.21" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Shared values</text><rect x="678.63311" y="301.76" width="96.74633" height="35" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2" /><text x="727.006275" y="325.21" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Good will</text><rect x="30" y="350.76" width="156.01767999999998" height="35" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2" /><text x="108.00883999999999" y="374.21" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Reliable sources</text><rect x="198.01767999999998" y="350.76" width="161.69092000000003" height="35" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2" /><text x="278.86314" y="374.21" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Careful language</text><rect x="30" y="411.76" width="840" height="55.75999999999999" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="7 5"/><text x="450" y="445.06" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve"><tspan font-weight="700" fill="#b5602e">Damaged</tspan> <tspan font-weight="700" fill="#b5602e">by</tspan> exaggeration or errors.</text>
</svg>