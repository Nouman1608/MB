<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 677" width="900" height="677" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="677" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Primary and secondary appeals</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Worked example 1: the paramedic (invented figures)</text>
<text x="640" y="130" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle" xml:space="preserve">primary</text><text x="760" y="130" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle" xml:space="preserve">also</text><rect x="30" y="144" width="540" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="44" y="173.92" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“I have worked as a paramedic in this county for twenty-two</text><text x="44" y="195.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">years.”</text><text x="44" y="216.16" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-style="italic">establishes</tspan> <tspan font-style="italic">experience</tspan> <tspan font-style="italic">and</tspan> <tspan font-style="italic">credibility</tspan></text><rect x="588" y="168" width="104" height="44" rx="22" fill="#dce9e7" stroke="#1e2a44" stroke-width="3" /><text x="640" y="197" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Ethos</text><rect x="30" y="248" width="540" height="108.48000000000002" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="44" y="275.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“Last year, fourteen of the seventeen cardiac arrests outside</text><text x="44" y="296.72" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">hospital happened more than five minutes from the nearest</text><text x="44" y="317.84000000000003" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">ambulance.”</text><text x="44" y="338.96000000000004" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-style="italic">a</tspan> <tspan font-style="italic">statistic:</tspan> <tspan font-style="italic">response</tspan> <tspan font-style="italic">times</tspan> <tspan font-style="italic">are</tspan> <tspan font-style="italic">a</tspan> <tspan font-style="italic">problem</tspan></text><rect x="588" y="280.24" width="104" height="44" rx="22" fill="#ffffff" stroke="#1e2a44" stroke-width="3" /><text x="640" y="309.24" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Logos</text><rect x="30" y="368.48" width="540" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="44" y="398.40000000000003" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“I have knelt beside a father on his own front path, and I can tell</text><text x="44" y="419.52000000000004" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">you that five minutes is a very long time.”</text><text x="44" y="440.64000000000004" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-style="italic">sympathy</tspan> <tspan font-style="italic">and</tspan> <tspan font-style="italic">urgency;</tspan> <tspan font-style="italic">first-hand</tspan> <tspan font-style="italic">experience</tspan></text><rect x="588" y="392.48" width="104" height="44" rx="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3" /><text x="640" y="421.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Pathos</text><rect x="710" y="394.48" width="100" height="40" rx="20" fill="#ffffff" stroke="#2e6b62" stroke-width="2" stroke-dasharray="6 4"/><text x="760" y="420.48" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">Ethos</text><rect x="30" y="472.48" width="540" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="44" y="502.40000000000003" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“A defibrillator in every village hall costs less than one new</text><text x="44" y="523.52" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">ambulance, and it would be there in seconds.”</text><text x="44" y="544.64" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-style="italic">cost</tspan> <tspan font-style="italic">and</tspan> <tspan font-style="italic">speed</tspan> <tspan font-style="italic">make</tspan> <tspan font-style="italic">the</tspan> <tspan font-style="italic">proposal</tspan> <tspan font-style="italic">reasonable</tspan></text><rect x="588" y="496.48" width="104" height="44" rx="22" fill="#ffffff" stroke="#1e2a44" stroke-width="3" /><text x="640" y="525.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Logos</text><rect x="30" y="580.48" width="840" height="74.24000000000001" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="450" y="612.08" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Name the <tspan font-weight="700">primary</tspan> appeal, note a secondary effect, then say what it does for the purpose: persuading</text><text x="450" y="633.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">villagers and councillors to fund defibrillators.</text>
</svg>