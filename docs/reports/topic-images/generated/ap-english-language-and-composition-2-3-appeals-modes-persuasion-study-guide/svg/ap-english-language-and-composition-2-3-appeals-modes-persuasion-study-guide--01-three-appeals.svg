<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three ways to persuade</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">The classical appeals, and the right moment</text>
<path d="M450,202 L170,572 L730,572 Z" fill="#dce9e7" stroke="#2e6b62" stroke-width="3" stroke-linejoin="round"/><rect x="300" y="142" width="300" height="116.44" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" /><text x="450" y="171.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Reason · logos</text><text x="450" y="198.68" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">logic, evidence, structure</text><text x="450" y="219.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve"><tspan font-style="italic">“Does</tspan> <tspan font-style="italic">this</tspan> <tspan font-style="italic">make</tspan> <tspan font-style="italic">sense</tspan> <tspan font-style="italic">and</tspan> <tspan font-style="italic">is</tspan> <tspan font-style="italic">it</tspan></text><text x="450" y="240.92000000000002" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve"><tspan font-style="italic">backed</tspan> <tspan font-style="italic">up?”</tspan></text><rect x="40" y="512" width="300" height="116.44000000000005" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" /><text x="190" y="541.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Credibility · ethos</text><text x="190" y="568.6800000000001" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">trustworthy, knowledgeable, fair</text><text x="190" y="589.8000000000001" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve"><tspan font-style="italic">“Why</tspan> <tspan font-style="italic">should</tspan> <tspan font-style="italic">I</tspan> <tspan font-style="italic">believe</tspan> <tspan font-style="italic">this</tspan></text><text x="190" y="610.9200000000001" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve"><tspan font-style="italic">person?”</tspan></text><rect x="560" y="512" width="300" height="116.44000000000005" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" /><text x="710" y="541.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Emotion and values · pathos</text><text x="710" y="568.6800000000001" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">feelings and what the audience</text><text x="710" y="589.8000000000001" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">holds dear</text><text x="710" y="610.9200000000001" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve"><tspan font-style="italic">“Does</tspan> <tspan font-style="italic">this</tspan> <tspan font-style="italic">matter</tspan> <tspan font-style="italic">to</tspan> <tspan font-style="italic">me?”</tspan></text><circle cx="450" cy="442" r="66" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="450" y="436" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">kairos</text><text x="450" y="458" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" xml:space="preserve">the right moment</text>
</svg>