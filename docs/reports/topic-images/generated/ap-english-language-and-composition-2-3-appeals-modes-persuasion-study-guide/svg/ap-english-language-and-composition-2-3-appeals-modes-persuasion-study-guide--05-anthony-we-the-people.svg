<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 554" width="900" height="554" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="554" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">“We, the whole people”</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Susan B. Anthony, 1873</text>
<text x="30" y="136" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic" xml:space="preserve">“It was we, the people; ...who formed the Union.”</text><rect x="210" y="162" width="480" height="54" rx="10" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="7 5"/><text x="450" y="196" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">not “we, the white male citizens”</text><line x1="220" y1="189" x2="680" y2="189" stroke="#b5602e" stroke-width="2.5"/><rect x="130" y="232" width="640" height="54" rx="10" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="7 5"/><text x="450" y="266" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">nor yet “we, the male citizens”</text><line x1="140" y1="259" x2="760" y2="259" stroke="#b5602e" stroke-width="2.5"/><rect x="30" y="302" width="840" height="54" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="450" y="336" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">but “we, the whole people”</text><text x="450" y="376" font-size="16" font-weight="700" fill="#4a5568" text-anchor="middle" xml:space="preserve">each narrowing is rejected; the scope expands</text><rect x="30" y="398" width="269.3333333333333" height="125.75999999999999" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="48" y="432" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Logos</text><text x="48" y="460" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">An argument from the</text><text x="48" y="481.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">founding text: “the people”</text><text x="48" y="502.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">includes everyone.</text><rect x="315.3333333333333" y="398" width="269.3333333333333" height="125.75999999999999" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="333.3333333333333" y="432" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Pathos</text><text x="333.3333333333333" y="460" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">The “not... nor yet... but”</text><text x="333.3333333333333" y="481.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">rhythm creates a rising</text><text x="333.3333333333333" y="502.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">feeling of justice.</text><rect x="600.6666666666666" y="398" width="269.3333333333333" height="125.75999999999999" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="618.6666666666666" y="432" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Ethos</text><text x="618.6666666666666" y="460" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">Places herself within the</text><text x="618.6666666666666" y="481.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">revered founding words,</text><text x="618.6666666666666" y="502.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">faithful to them.</text>
</svg>