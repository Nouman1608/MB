<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 646" width="900" height="646" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="646" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How are identities changing?</text>

<rect x="30" y="104" width="412" height="199" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,154 L31.25,118.25 Q31.25,105.25 44.25,105.25 L427.75,105.25 Q440.75,105.25 440.75,118.25 L440.75,154 Z" fill="#b5d3cf"/><line x1="31.25" y1="154" x2="440.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="135" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Class</text><circle cx="51" cy="181.92" r="4.5" fill="#2e6b62"/><text x="64" y="187.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Pakulski and Waters (1996):</tspan> consumption now</text><text x="64" y="208.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">matters more than occupation</text><circle cx="51" cy="231.92" r="4.5" fill="#2e6b62"/><text x="64" y="237.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Against:</tspan> Savage et al. (2013) still found</text><text x="64" y="258.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">clear class groupings based on economic,</text><text x="64" y="279.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">cultural and social capital</text><rect x="458" y="104" width="412" height="199" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,154 L459.25,118.25 Q459.25,105.25 472.25,105.25 L855.75,105.25 Q868.75,105.25 868.75,118.25 L868.75,154 Z" fill="#b5d3cf"/><line x1="459.25" y1="154" x2="868.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="135" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Gender</text><circle cx="479" cy="181.92" r="4.5" fill="#2e6b62"/><text x="492" y="187.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Connell (1987):</tspan> hegemonic masculinity</text><circle cx="479" cy="210.92" r="4.5" fill="#2e6b62"/><text x="492" y="216.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Mac an Ghaill (1994):</tspan> masculinity plural and</text><text x="492" y="237.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">contested</text><circle cx="479" cy="260.92" r="4.5" fill="#2e6b62"/><text x="492" y="266.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Butler (1990):</tspan> gender as performance</text><rect x="30" y="319" width="412" height="186" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,369 L31.25,333.25 Q31.25,320.25 44.25,320.25 L427.75,320.25 Q440.75,320.25 440.75,333.25 L440.75,369 Z" fill="#f2e7b8"/><line x1="31.25" y1="369" x2="440.75" y2="369" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="350" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Ethnicity</text><circle cx="51" cy="396.92" r="4.5" fill="#2e6b62"/><text x="64" y="402.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Hall:</tspan> diaspora identity</text><circle cx="51" cy="425.92" r="4.5" fill="#2e6b62"/><text x="64" y="431.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Bhabha (1994):</tspan> hybridity, new identities from</text><text x="64" y="452.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">more than one cultural source</text><circle cx="51" cy="475.92" r="4.5" fill="#2e6b62"/><text x="64" y="481.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Accelerated by globalisation and migration</text><rect x="458" y="319" width="412" height="186" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,369 L459.25,333.25 Q459.25,320.25 472.25,320.25 L855.75,320.25 Q868.75,320.25 868.75,333.25 L868.75,369 Z" fill="#f2e7b8"/><line x1="459.25" y1="369" x2="868.75" y2="369" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="350" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Age</text><circle cx="479" cy="396.92" r="4.5" fill="#2e6b62"/><text x="492" y="402.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Childhood, youth and old age are socially</text><text x="492" y="423.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">constructed</text><circle cx="479" cy="446.92" r="4.5" fill="#2e6b62"/><text x="492" y="452.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Consumer markets and longer life expectancy</text><text x="492" y="473.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">reshape each stage</text><rect x="30" y="521" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="557" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Increased choice?</text><text x="56" y="586" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Postmodernists: identities are now picked and mixed. Structural sociologists: class, gender</text><text x="56" y="608" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">and ethnicity still limit the menu.</text>
</svg>