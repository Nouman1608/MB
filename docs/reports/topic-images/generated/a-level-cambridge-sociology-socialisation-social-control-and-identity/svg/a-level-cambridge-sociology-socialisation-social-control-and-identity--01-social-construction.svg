<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 549" width="900" height="549" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="549" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How social reality is built</text>

<rect x="30" y="110" width="195" height="140" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><path d="M31.25,163.25 L31.25,125.25 Q31.25,111.25 45.25,111.25 L209.75,111.25 Q223.75,111.25 223.75,125.25 L223.75,163.25 Z" fill="#b5d3cf"/><text x="127.5" y="144" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Value</text><text x="127.5" y="190" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">general belief about</text><text x="127.5" y="211" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">what is good</text><rect x="30" y="290" width="195" height="80" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="127.5" y="320" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">respect for elders</text><line x1="227" y1="180" x2="243" y2="180" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="227" y1="330" x2="243" y2="330" stroke="#8a6d0d" stroke-width="2.5" marker-end="url(#ahO)"/><rect x="245" y="110" width="195" height="140" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><path d="M246.25,163.25 L246.25,125.25 Q246.25,111.25 260.25,111.25 L424.75,111.25 Q438.75,111.25 438.75,125.25 L438.75,163.25 Z" fill="#dce9e7"/><text x="342.5" y="144" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Norm</text><text x="342.5" y="190" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">specific rule that</text><text x="342.5" y="211" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">puts it into practice</text><rect x="245" y="290" width="195" height="80" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="342.5" y="320" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">standing when a</text><text x="342.5" y="341" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">grandparent enters</text><line x1="442" y1="180" x2="458" y2="180" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="442" y1="330" x2="458" y2="330" stroke="#8a6d0d" stroke-width="2.5" marker-end="url(#ahO)"/><rect x="460" y="110" width="195" height="140" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><path d="M461.25,163.25 L461.25,125.25 Q461.25,111.25 475.25,111.25 L639.75,111.25 Q653.75,111.25 653.75,125.25 L653.75,163.25 Z" fill="#dce9e7"/><text x="557.5" y="144" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Role and status</text><text x="557.5" y="190" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">expected behaviour</text><text x="557.5" y="211" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">attached to a</text><text x="557.5" y="232" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">position</text><rect x="460" y="290" width="195" height="80" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="557.5" y="320" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">grandchild and</text><text x="557.5" y="341" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">grandparent</text><line x1="657" y1="180" x2="673" y2="180" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="657" y1="330" x2="673" y2="330" stroke="#8a6d0d" stroke-width="2.5" marker-end="url(#ahO)"/><rect x="675" y="110" width="195" height="140" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><path d="M676.25,163.25 L676.25,125.25 Q676.25,111.25 690.25,111.25 L854.75,111.25 Q868.75,111.25 868.75,125.25 L868.75,163.25 Z" fill="#f2e7b8"/><text x="772.5" y="144" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Taken for granted</text><text x="772.5" y="190" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">learned so early it</text><text x="772.5" y="211" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">feels natural</text><rect x="675" y="290" width="195" height="80" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="772.5" y="320" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">“that’s just how it</text><text x="772.5" y="341" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">is”</text><text x="30" y="278" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">Example</text><rect x="30" y="392" width="840" height="133" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="428" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Who decides what is “normal”?</text><text x="56" y="457" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Ideology</tspan> (ideas serving a group’s interests, often disguising inequality) and <tspan font-weight="700">power</tspan> (getting</text><text x="56" y="479" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">others to act as you want) shape whose norms become normal. Berger and Luckmann (1966): the</text><text x="56" y="501" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">social world feels fixed only because we learn it and take it for granted.</text>
</svg>