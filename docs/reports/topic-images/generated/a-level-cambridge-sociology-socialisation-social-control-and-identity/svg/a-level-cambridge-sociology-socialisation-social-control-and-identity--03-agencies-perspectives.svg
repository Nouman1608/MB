<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Agencies of socialisation: three views</text>

<rect x="30" y="110" width="160" height="56" rx="28" fill="#1e2a44"/><text x="110" y="145" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Family</text><rect x="200" y="110" width="160" height="56" rx="28" fill="#1e2a44"/><text x="280" y="145" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Education</text><rect x="370" y="110" width="160" height="56" rx="28" fill="#1e2a44"/><text x="450" y="145" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Peer group</text><rect x="540" y="110" width="160" height="56" rx="28" fill="#1e2a44"/><text x="620" y="145" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Media</text><rect x="710" y="110" width="160" height="56" rx="28" fill="#1e2a44"/><text x="790" y="145" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Religion</text><text x="450" y="196" font-size="18" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">the same agencies, read three ways</text><line x1="273.3" y1="208" x2="165" y2="238" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="450" y1="208" x2="450" y2="238" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="626.7" y1="208" x2="735" y2="238" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="244" width="269.3333333333333" height="178" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,294 L31.25,258.25 Q31.25,245.25 44.25,245.25 L285.0833333333333,245.25 Q298.0833333333333,245.25 298.0833333333333,258.25 L298.0833333333333,294 Z" fill="#b5d3cf"/><line x1="31.25" y1="294" x2="298.0833333333333" y2="294" stroke="#c9d6d4" stroke-width="2"/><text x="164.66666666666666" y="274.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Functionalist</text><text x="44" y="326.15" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="start">Parsons</text><text x="44" y="354.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Agencies pass on shared</text><text x="44" y="376.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">values that hold society</text><text x="44" y="398.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">together.</text><rect x="315.3333333333333" y="244" width="269.3333333333333" height="178" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M316.5833333333333,294 L316.5833333333333,258.25 Q316.5833333333333,245.25 329.5833333333333,245.25 L570.4166666666666,245.25 Q583.4166666666666,245.25 583.4166666666666,258.25 L583.4166666666666,294 Z" fill="#f2e7b8"/><line x1="316.5833333333333" y1="294" x2="583.4166666666666" y2="294" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="274.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Marxist</text><text x="329.3333333333333" y="326.15" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="start">Althusser (1971)</text><text x="329.3333333333333" y="354.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Ideological state</tspan></text><text x="329.3333333333333" y="376.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">apparatuses</tspan> that make</text><text x="329.3333333333333" y="398.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">capitalism look fair.</text><rect x="600.6666666666666" y="244" width="269.3333333333333" height="178" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.9166666666666,294 L601.9166666666666,258.25 Q601.9166666666666,245.25 614.9166666666666,245.25 L855.75,245.25 Q868.75,245.25 868.75,258.25 L868.75,294 Z" fill="#dce9e7"/><line x1="601.9166666666666" y1="294" x2="868.75" y2="294" stroke="#c9d6d4" stroke-width="2"/><text x="735.3333333333333" y="274.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Feminist</text><text x="614.6666666666666" y="326.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The same agencies reproduce</text><text x="614.6666666666666" y="348.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">patriarchy.</text>
