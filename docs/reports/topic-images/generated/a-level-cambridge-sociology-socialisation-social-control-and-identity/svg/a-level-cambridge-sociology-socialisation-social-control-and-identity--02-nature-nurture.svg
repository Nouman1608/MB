<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 571" width="900" height="571" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="571" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Nature or nurture?</text>

<rect x="30" y="104" width="404" height="334" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,154 L31.25,118.25 Q31.25,105.25 44.25,105.25 L419.75,105.25 Q432.75,105.25 432.75,118.25 L432.75,154 Z" fill="#f2e7b8"/><line x1="31.25" y1="154" x2="432.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="232" y="134.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Nature</text><text x="48" y="190.4" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">Behaviour fixed by biology, instinct or genes</text><circle cx="53" cy="215.79" r="4.5" fill="#2e6b62"/><text x="66" y="221.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Sociobiological claims</text><circle cx="53" cy="245.79" r="4.5" fill="#2e6b62"/><text x="66" y="251.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Research on hormones</text><rect x="466" y="104" width="404" height="334" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M467.25,154 L467.25,118.25 Q467.25,105.25 480.25,105.25 L855.75,105.25 Q868.75,105.25 868.75,118.25 L868.75,154 Z" fill="#b5d3cf"/><line x1="467.25" y1="154" x2="868.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="668" y="134.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Nurture</text><text x="484" y="190.4" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">Behaviour is learned (broadly defended by</text><text x="484" y="211.4" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">sociology)</text><circle cx="489" cy="236.79" r="4.5" fill="#8a6d0d"/><text x="502" y="242.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Genie (1970):</tspan> after extreme isolation</text><text x="502" y="264.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">never fully acquired language</text><circle cx="489" cy="288.78999999999996" r="4.5" fill="#8a6d0d"/><text x="502" y="294.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Mead (1935):</tspan> gender behaviour in three</text><text x="502" y="316.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">New Guinea societies differed from</text><text x="502" y="338.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Western expectations (fieldwork since</text><text x="502" y="360.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">questioned)</text><circle cx="489" cy="384.78999999999996" r="4.5" fill="#8a6d0d"/><text x="502" y="390.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Oakley (1972):</tspan> parents use manipulation</text><text x="502" y="412.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">and canalisation</text><circle cx="450" cy="271" r="24" fill="#1e2a44"/><text x="450" y="278" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">vs</text><rect x="30" y="456" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="492" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Strongest conclusion</text><text x="56" y="521" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Biology sets possibilities, but socialisation decides which ones become normal.</text>
</svg>