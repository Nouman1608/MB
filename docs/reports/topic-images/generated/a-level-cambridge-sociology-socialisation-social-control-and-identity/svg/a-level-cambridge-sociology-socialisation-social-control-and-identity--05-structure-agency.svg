<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 741" width="900" height="741" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="741" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Structure or agency?</text>

<rect x="30" y="108" width="410" height="470" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,158 L31.25,122.25 Q31.25,109.25 44.25,109.25 L425.75,109.25 Q438.75,109.25 438.75,122.25 L438.75,158 Z" fill="#b5d3cf"/><line x1="31.25" y1="158" x2="438.75" y2="158" stroke="#c9d6d4" stroke-width="2"/><text x="235" y="138.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Structuralist</text><text x="235" y="186" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">starts from society</text><rect x="135" y="206" width="200" height="54" rx="12" fill="#1e2a44" stroke="#1e2a44" stroke-width="2.5"/><text x="235" y="240" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Society</text><rect x="135" y="336" width="200" height="54" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="235" y="370" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Individual</text><line x1="235" y1="266" x2="235" y2="330" stroke="#1e2a44" stroke-width="5" marker-end="url(#ah)"/><circle cx="57" cy="430.39" r="4.5" fill="#2e6b62"/><text x="70" y="436" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Functionalists</tspan> (Durkheim, Parsons):</text><text x="70" y="458" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">order rests on consensus around shared</text><text x="70" y="480" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">values</text><circle cx="57" cy="506.39" r="4.5" fill="#2e6b62"/><text x="70" y="512" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Marxists:</tspan> order rests on power: ideology</text><text x="70" y="534" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">wins consent (Gramsci’s hegemony); force</text><text x="70" y="556" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">when consent fails</text><rect x="460" y="108" width="410" height="470" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M461.25,158 L461.25,122.25 Q461.25,109.25 474.25,109.25 L855.75,109.25 Q868.75,109.25 868.75,122.25 L868.75,158 Z" fill="#f2e7b8"/><line x1="461.25" y1="158" x2="868.75" y2="158" stroke="#c9d6d4" stroke-width="2"/><text x="665" y="138.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Interactionist</text><text x="665" y="186" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">starts from individuals</text><rect x="565" y="206" width="200" height="54" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="665" y="240" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Society</text><rect x="565" y="336" width="200" height="54" rx="12" fill="#1e2a44" stroke="#1e2a44" stroke-width="2.5"/><text x="665" y="370" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Individuals</text><line x1="665" y1="330" x2="665" y2="266" stroke="#1e2a44" stroke-width="5" marker-end="url(#ah)"/><circle cx="487" cy="430.39" r="4.5" fill="#2e6b62"/><text x="500" y="436" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Mead:</tspan> the self develops by taking the</text><text x="500" y="458" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">role of others</text><circle cx="487" cy="484.39" r="4.5" fill="#2e6b62"/><text x="500" y="490" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Goffman (1959):</tspan> people actively manage</text><text x="500" y="512" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">impressions</text><circle cx="487" cy="538.39" r="4.5" fill="#2e6b62"/><text x="500" y="544" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Order is negotiated in everyday</text><text x="500" y="566" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">encounters</text><rect x="30" y="598" width="840" height="119" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="634" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Evaluation</text><circle cx="61" cy="657.39" r="4.5" fill="#8a6d0d"/><text x="74" y="663" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Structuralists can be accused of treating people as puppets</text><circle cx="61" cy="687.39" r="4.5" fill="#8a6d0d"/><text x="74" y="693" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Interactionists of ignoring the power that limits choice</text>
</svg>