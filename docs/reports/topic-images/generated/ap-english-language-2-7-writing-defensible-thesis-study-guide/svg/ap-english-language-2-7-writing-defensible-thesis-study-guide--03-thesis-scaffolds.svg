<rect width="900" height="760" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four thesis scaffolds</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Scaffolds, not scripts</text>
<text x="30" y="136" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start" xml:space="preserve">Claim + reason</text><rect x="30" y="152" width="356.26204" height="35" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2" /><text x="208.13102" y="175.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Cities should ban cars from their centres</text><text x="208.13102" y="208.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">claim</text><rect x="394.26204" y="152" width="90.56530000000001" height="35" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2" /><text x="439.54469" y="175.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">because</text><rect x="30" y="229.3" width="526.1440600000001" height="35" rx="8" fill="#dce9e7" stroke="#1e2a44" stroke-width="2" /><text x="293.07203000000004" y="252.75" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">the health benefits of cleaner air outweigh the inconvenience</text><text x="293.07203000000004" y="285.8" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">reason</text><text x="30" y="336.6" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start" xml:space="preserve">Concession + claim</text><rect x="30" y="352.6" width="298.67165" height="35" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2" /><text x="179.335825" y="376.05" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Although cars bring convenience,</text><text x="179.335825" y="409.1" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">concession</text><rect x="336.67165" y="352.6" width="330.73245999999995" height="35" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2" /><text x="502.03788" y="376.05" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">city centres should be closed to them</text><text x="502.03788" y="409.1" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">claim</text><rect x="675.40411" y="352.6" width="105.69394000000001" height="35" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2" /><text x="728.25108" y="376.05" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">because...</text><text x="30" y="459.90000000000003" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start" xml:space="preserve">Claim + qualification</text><rect x="30" y="475.90000000000003" width="394.67898" height="35" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2" /><text x="227.33949" y="499.35" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">City centres should be closed to private cars,</text><text x="227.33949" y="532.4000000000001" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">claim</text><rect x="432.67898" y="475.90000000000003" width="385.74888" height="35" rx="8" fill="#dce9e7" stroke="#1e2a44" stroke-width="2" /><text x="625.55342" y="499.35" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">with exceptions for residents and deliveries,</text><text x="625.55342" y="532.4000000000001" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">qualification</text><rect x="30" y="553.2" width="105.69394000000001" height="35" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2" /><text x="82.84697" y="576.6500000000001" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">because...</text><text x="30" y="632.2" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start" xml:space="preserve">Rhetorical analysis</text><rect x="30" y="648.2" width="83.36869000000002" height="35" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2" /><text x="71.68434500000001" y="671.6500000000001" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">[Writer]</text><rect x="121.36869000000002" y="648.2" width="158.5041" height="35" rx="8" fill="#dce9e7" stroke="#1e2a44" stroke-width="2" /><text x="200.62074" y="671.6500000000001" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">uses [strategies]</text><text x="200.62074" y="704.7" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">choices</text><rect x="287.87279" y="648.2" width="90" height="35" rx="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2" /><text x="332.87279" y="671.6500000000001" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">to</text><text x="332.87279" y="704.7" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">the key</text><text x="332.87279" y="723" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">word</text><rect x="385.87279" y="648.2" width="200.49308" height="35" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2" /><text x="486.11933" y="671.6500000000001" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">[accomplish purpose]</text><text x="486.11933" y="704.7" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">effect</text><rect x="594.36587" y="648.2" width="137.17692" height="35" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2" /><text x="662.95433" y="671.6500000000001" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">for [audience]</text>
</svg>