<!-- place after: ## What makes a thesis defensible -->
<figure class="topic-figure">
  <img src="https://img.marlbridge.com/ap-english-language-2-7-writing-defensible-thesis-study-guide--01-defensible-zone.webp" width="900" height="402" alt="A band with three zones. On the left, statements that need no defence, such as “Social media exists.” On the right, claims too vast to defend, such as “This policy will solve all of society’s problems.” In the middle, the defensible zone: “Social media has made teenagers better informed but less able to concentrate.”" loading="lazy">
  <figcaption>A good thesis needs defending and can be defended in the space available.</figcaption>
</figure>

<!-- place after: ## Shapes of thesis to avoid -->
<figure class="topic-figure">
  <img src="https://img.marlbridge.com/ap-english-language-2-7-writing-defensible-thesis-study-guide--02-thesis-shapes-to-avoid.webp" width="900" height="447" alt="Six crossed-out cards with examples: an announcement (“In this essay I will discuss pollution”), a fact, a restated prompt, a vague evaluation, an unconnected list of devices, and an overreach that cannot be defended." loading="lazy">
  <figcaption>A thesis is a position, not a plan, a fact, a restatement or a list.</figcaption>
</figure>

<!-- place after: ## Thesis formulas that work (and the danger of formulas) -->
<figure class="topic-figure">
  <img src="https://img.marlbridge.com/ap-english-language-2-7-writing-defensible-thesis-study-guide--03-thesis-scaffolds.webp" width="900" height="760" alt="Four scaffolds built from labelled blocks: claim plus reason; concession plus claim; claim plus qualification; and for rhetorical analysis, “[Writer] uses [strategies] to [accomplish purpose] for [audience]”, with “to” highlighted as the key word." loading="lazy">
  <figcaption>Use scaffolds to draft; in analysis, the key word is “to”: say what the choices accomplish.</figcaption>
</figure>

<!-- place after: ## Revising a weak thesis: four questions -->
<figure class="topic-figure">
  <img src="https://img.marlbridge.com/ap-english-language-2-7-writing-defensible-thesis-study-guide--04-four-revision-questions.webp" width="900" height="602" alt="A cycle of four questions around a working thesis: could a reasonable person disagree, is it specific, does it say why, and can I defend it in the time and space I have? Each comes with its fix." loading="lazy">
  <figcaption>Arguable, specific, reasoned and the right size: test and revise in a loop.</figcaption>
</figure>

<!-- place after: ## Worked example 1: from topic to thesis -->
<figure class="topic-figure">
  <img src="https://img.marlbridge.com/ap-english-language-2-7-writing-defensible-thesis-study-guide--05-topic-to-thesis.webp" width="900" height="671" alt="The vague draft “City centres and cars are a big problem today” becomes a thesis built from a position (close city centres to private cars), a qualification (exceptions for residents and deliveries) and a reason (air quality and pedestrian safety outweigh the inconvenience). Four ticks confirm it is arguable, specific, focused and responsive." loading="lazy">
  <figcaption>Take a position, add a reason, add a qualification, then test it.</figcaption>
</figure>

<!-- place after: ## Worked example 2: a rhetorical analysis thesis -->
<figure class="topic-figure">
  <img src="https://img.marlbridge.com/ap-english-language-2-7-writing-defensible-thesis-study-guide--06-analysis-thesis-anatomy.webp" width="900" height="543" alt="The model thesis on the Gettysburg Address split into labelled parts: the situation (“By stressing that the living cannot add...”), the strategies (humility, repetition and a turn to “us the living”), the key word “to”, and what the choices accomplish (a memorial becomes a call to continue the work). Below, a weak thesis only lists devices." loading="lazy">
  <figcaption>An analysis thesis says what the choices accomplish, not just which choices exist.</figcaption>
</figure>
