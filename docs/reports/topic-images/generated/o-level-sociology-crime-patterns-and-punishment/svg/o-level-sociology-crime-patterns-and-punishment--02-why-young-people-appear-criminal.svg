<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 602" width="900" height="602" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="602" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why do young people appear more criminal?</text>

<line x1="300" y1="164.5" x2="365" y2="245.425" stroke="#1e2a44" stroke-width="2.5"/><line x1="300" y1="299.5" x2="365" y2="292.675" stroke="#1e2a44" stroke-width="2.5"/><line x1="300" y1="424" x2="365" y2="336.25" stroke="#1e2a44" stroke-width="2.5"/><line x1="600" y1="175" x2="535" y2="249.1" stroke="#1e2a44" stroke-width="2.5"/><line x1="600" y1="289" x2="535" y2="289" stroke="#1e2a44" stroke-width="2.5"/><line x1="600" y1="403" x2="535" y2="328.9" stroke="#1e2a44" stroke-width="2.5"/><circle cx="450" cy="289" r="100" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="262.25" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Young people</text><text x="450" y="284.75" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">over-represented</text><text x="450" y="307.25" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">in recorded</text><text x="450" y="329.75" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">crime</text><g transform="translate(0,0)"><rect x="30" y="104" width="270" height="121" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="134.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Police targeting</text><text x="46" y="162.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Stop and search in public</text><text x="46" y="183.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">spaces where young people</text><text x="46" y="204.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">gather.</text><rect x="30" y="239" width="270" height="121" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="269.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Stereotyping</text><text x="46" y="297.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Youth are labelled as</text><text x="46" y="318.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">trouble, leading to a</text><text x="46" y="339.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">self-fulfilling prophecy.</text><rect x="30" y="374" width="270" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="404.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Gang culture</text><text x="46" y="432.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Gangs offer status and</text><text x="46" y="453.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">protection.</text></g><g transform="translate(0,21)"><rect x="600" y="104" width="270" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="616" y="134.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Weaker social control</text><text x="616" y="162.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Young people move away from</text><text x="616" y="183.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">family supervision.</text><rect x="600" y="218" width="270" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="616" y="248.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Lack of opportunity</text><text x="616" y="276.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Unemployment blocks</text><text x="616" y="297.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">legitimate routes.</text><rect x="600" y="332" width="270" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="616" y="362.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Status frustration</text><text x="616" y="390.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Albert Cohen, Delinquent</text><text x="616" y="411.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Boys (1955).</text></g><rect x="30" y="492" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="525.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Remember: recorded patterns reflect policing and reporting as well as offending, so some</text><text x="50" y="547.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">explanations are about how young people are seen and policed.</text>
</svg>