<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 538" width="900" height="538" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="538" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How effective is policing?</text>

<rect x="30" y="104" width="410" height="161" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="140" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Stop and search</text><text x="50" y="169.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">+ Detects weapons and drugs</text><text x="50" y="196.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">− May damage trust if groups are targeted</text><text x="50" y="218.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">unfairly</text><rect x="460" y="104" width="410" height="161" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="480" y="140" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Surveillance</text><text x="480" y="169.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">+ CCTV, phone data and facial recognition</text><text x="480" y="191.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">help detection</text><text x="480" y="218.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">− Privacy concerns; may displace crime</text><text x="480" y="240.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">elsewhere</text><rect x="30" y="283" width="410" height="117" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="319" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Community policing</text><text x="50" y="348.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">+ Builds trust and local intelligence</text><rect x="460" y="283" width="410" height="117" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="480" y="319" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Military-style policing</text><text x="480" y="348.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">+ May restore order quickly</text><text x="480" y="375.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">− Uses force; can alienate communities</text><rect x="30" y="418" width="840" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="454" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Crime prevention</text><text x="50" y="483.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Street lighting, design of housing, youth programmes.</text>
</svg>