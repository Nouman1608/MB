<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 566" width="900" height="566" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="566" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Two interactionist ideas as chains</text>

<text x="30" y="124" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">INTERACTIONISM: LABELLING</text><text x="30" y="150" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Howard Becker, Outsiders (1963)</text><rect x="30" y="166" width="246.66666666666666" height="72" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="153.33333333333331" y="195.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">An act is labelled</text><text x="153.33333333333331" y="217.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">deviant by others</text><line x1="282.66666666666663" y1="202" x2="320.66666666666663" y2="202" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="326.66666666666663" y="166" width="246.66666666666666" height="72" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="449.99999999999994" y="195.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Others react to the</text><text x="449.99999999999994" y="217.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">person as deviant</text><line x1="579.3333333333333" y1="202" x2="617.3333333333333" y2="202" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="623.3333333333333" y="166" width="246.66666666666666" height="72" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="746.6666666666666" y="195.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">A deviant career can</text><text x="746.6666666666666" y="217.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">follow</text><text x="30" y="286" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">INTERACTIONISM: MORAL PANIC</text><text x="30" y="312" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Stanley Cohen (1972)</text><rect x="30" y="328" width="246.66666666666666" height="72" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="153.33333333333331" y="357.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">The media exaggerate a</text><text x="153.33333333333331" y="379.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">group’s behaviour</text><line x1="282.66666666666663" y1="364" x2="320.66666666666663" y2="364" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="326.66666666666663" y="328" width="246.66666666666666" height="72" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="449.99999999999994" y="357.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">The group become folk</text><text x="449.99999999999994" y="379.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">devils</text><line x1="579.3333333333333" y1="364" x2="617.3333333333333" y2="364" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="623.3333333333333" y="328" width="246.66666666666666" height="72" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="746.6666666666666" y="357.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Tougher control follows</text><rect x="30" y="428" width="840" height="108" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="461" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">LIMITATION</text><text x="50" y="486.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Labelling explains the effect of reactions, but not why people commit the</text><text x="50" y="510.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">first deviant act.</text>
</svg>