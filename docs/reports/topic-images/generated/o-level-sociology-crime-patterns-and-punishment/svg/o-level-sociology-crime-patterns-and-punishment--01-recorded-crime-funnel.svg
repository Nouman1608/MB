<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 658" width="900" height="658" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="658" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">From crime committed to the official figures</text>

<path d="M30,110 L570,110 L537.5,202 L62.5,202 Z" fill="#dce9e7" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><text x="300" y="163" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">All crime committed</text><path d="M77.5,218 L522.5,218 L490,310 L110,310 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><text x="300" y="271" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Crime reported</text><rect x="610" y="178" width="260" height="68" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="624" y="205.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Much crime is never</text><text x="624" y="227.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">reported</text><line x1="604" y1="210" x2="551.5" y2="210" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><path d="M125,326 L475,326 L442.5,418 L157.5,418 Z" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><text x="300" y="379" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Crime recorded</text><rect x="610" y="286" width="260" height="68" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="624" y="313.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Some reports are not</text><text x="624" y="335.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">recorded</text><line x1="604" y1="318" x2="504" y2="318" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><path d="M172.5,434 L427.5,434 L395,526 L205,526 Z" fill="#d4b02e" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><text x="300" y="475.5" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Arrests and</text><text x="300" y="498.5" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">convictions</text><rect x="610" y="394" width="260" height="68" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="624" y="421.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Policing decides who is</text><text x="624" y="443.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">targeted and caught</text><line x1="604" y1="426" x2="456.5" y2="426" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><rect x="30" y="548" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="581.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Recorded patterns reflect reporting and policing as well as offending: official statistics</text><text x="50" y="603.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">may confuse who gets caught with who offends.</text>
</svg>