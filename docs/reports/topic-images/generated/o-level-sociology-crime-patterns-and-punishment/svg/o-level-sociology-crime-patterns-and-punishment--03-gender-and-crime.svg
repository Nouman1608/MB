<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 498" width="900" height="498" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="498" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why do men commit more recorded crime?</text>

<rect x="30" y="104" width="410" height="258" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="137" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">PUSHING MEN’S CRIME UP</text><text x="50" y="164.8" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Masculinity and misogyny</text><text x="50" y="195.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="195.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Culture of masculinity: crime</text><text x="66.15" y="217.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">“accomplishes” toughness and dominance</text><text x="50" y="244.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="244.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Walter Miller (1958): lower-class focal</text><text x="66.15" y="266.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">concerns such as toughness and</text><text x="66.15" y="288.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">excitement</text><text x="50" y="315.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="315.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Misogyny helps explain male violence</text><text x="66.15" y="337.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">against women</text><rect x="460" y="104" width="410" height="258" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="480" y="137" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">KEEPING WOMEN’S CRIME DOWN</text><text x="480" y="164.8" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Control and chivalry</text><text x="480" y="195.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="496.15" y="195.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Girls are more closely supervised at</text><text x="496.15" y="217.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">home and in public</text><text x="480" y="244.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="496.15" y="244.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Chivalry thesis, Otto Pollak (1950):</text><text x="496.15" y="266.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">lenient male police and judges hide</text><text x="496.15" y="288.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">female crime</text><text x="480" y="315.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="496.15" y="315.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Pat Carlen (1988): women offended when</text><text x="496.15" y="337.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">the rewards of conformity failed them</text><rect x="30" y="380" width="840" height="88" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="414.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Both sides</text><text x="50" y="443.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Stereotyping, gang culture and lack of opportunity also shape gender patterns.</text>
</svg>