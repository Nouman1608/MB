<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 586" width="900" height="586" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="586" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Which theory explains what?</text>

<rect x="30" y="104" width="210" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="42" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Theory</text><rect x="240" y="104" width="315" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="252" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Best at explaining</text><rect x="555" y="104" width="315" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="567" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">But…</text><rect x="30" y="150" width="210" height="66" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="176.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Strain and</text><text x="42" y="198.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">subculture</text><rect x="240" y="150" width="315" height="66" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="252" y="176.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Property crime by young</text><text x="252" y="198.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">working-class men</text><rect x="555" y="150" width="315" height="66" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="567" y="176.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Not middle-class or corporate</text><text x="567" y="198.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">crime</text><rect x="30" y="216" width="210" height="66" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="242.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Labelling</text><rect x="240" y="216" width="315" height="66" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="252" y="242.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">How reactions shape criminal</text><text x="252" y="264.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">careers</text><rect x="555" y="216" width="315" height="66" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="567" y="242.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Not why the first deviant act</text><text x="567" y="264.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">happens</text><rect x="30" y="282" width="210" height="66" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="308.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Marxism</text><rect x="240" y="282" width="315" height="66" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="252" y="308.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Corporate crime and crimes of the</text><text x="252" y="330.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">powerful</text><rect x="555" y="282" width="315" height="66" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="567" y="308.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Can romanticise offenders and</text><text x="567" y="330.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">neglect their victims</text><rect x="30" y="348" width="210" height="44" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="374.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Feminism</text><rect x="240" y="348" width="315" height="44" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="252" y="374.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Gender patterns in crime</text><rect x="555" y="348" width="315" height="44" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="567" y="374.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">May treat women as one group</text><rect x="30" y="392" width="210" height="66" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="418.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Postmodernism</text><rect x="240" y="392" width="315" height="66" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="252" y="418.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">New, varied crimes linked to</text><text x="252" y="440.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">consumer culture</text><rect x="555" y="392" width="315" height="66" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="567" y="418.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">No single cause, so policy is</text><text x="567" y="440.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">hard</text><rect x="30" y="476" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="509.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">No theory explains all crime. Match the theory to the type of crime in the question, then</text><text x="50" y="531.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">give its limitation.</text>
</svg>