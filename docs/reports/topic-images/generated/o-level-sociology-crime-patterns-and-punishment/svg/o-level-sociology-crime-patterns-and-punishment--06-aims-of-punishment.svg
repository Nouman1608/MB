<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="540" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Five aims of punishment</text>

<rect x="30" y="104" width="158.4" height="155" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="109.2" y="130.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Protection</text><text x="109.2" y="158.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Keep citizens</text><text x="109.2" y="179.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">safe</text><rect x="200.4" y="104" width="158.4" height="155" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="279.6" y="130.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Deterrence</text><text x="279.6" y="158.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Put off the</text><text x="279.6" y="179.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">offender</text><text x="279.6" y="200.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">(individual) and</text><text x="279.6" y="221.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">everyone else</text><text x="279.6" y="242.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">(general)</text><rect x="370.8" y="104" width="158.4" height="155" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="130.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Retribution</text><text x="450" y="158.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Give the</text><text x="450" y="179.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">punishment that</text><text x="450" y="200.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">is deserved</text><rect x="541.2" y="104" width="158.4" height="155" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="620.4000000000001" y="130.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Incapacitation</text><text x="620.4000000000001" y="158.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Remove the</text><text x="620.4000000000001" y="179.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">ability to</text><text x="620.4000000000001" y="200.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">offend</text><rect x="711.6" y="104" width="158.4" height="155" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="790.8000000000001" y="130.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Rehabilitation</text><text x="790.8000000000001" y="158.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Reform the</text><text x="790.8000000000001" y="179.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">offender</text><rect x="30" y="277" width="410" height="135" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="310" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">EXAMPLE</text><text x="50" y="336.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Prison</text><text x="50" y="365.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Incapacitates and is seen as just</text><text x="50" y="387.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">(retribution), but reoffending is high.</text><rect x="460" y="277" width="410" height="135" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="480" y="310" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EXAMPLE</text><text x="480" y="336.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Halden prison, Norway (2010)</text><text x="480" y="365.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Stresses rehabilitation; cited as evidence</text><text x="480" y="387.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">that humane regimes can lower reoffending.</text><rect x="30" y="430" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="463.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Evidence suggests the certainty of being caught matters more than the severity of</text><text x="50" y="485.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">punishment.</text>
</svg>