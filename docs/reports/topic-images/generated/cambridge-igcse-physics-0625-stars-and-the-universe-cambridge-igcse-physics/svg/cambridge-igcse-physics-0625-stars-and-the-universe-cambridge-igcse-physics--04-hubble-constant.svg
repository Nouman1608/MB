<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The Hubble constant</text>

<rect x="30" y="72" width="148.8" height="30" rx="15" fill="#8a6d0d"/><text x="42" y="93" font-size="16" font-weight="700" fill="#ffffff" text-anchor="start">Extended only</text><rect x="30" y="110" width="520" height="440" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><line x1="150" y1="470" x2="150" y2="170" stroke="#dde5e3" stroke-width="1.5" stroke-linecap="round"/><line x1="276.66666666666663" y1="470" x2="276.66666666666663" y2="170" stroke="#dde5e3" stroke-width="1.5" stroke-linecap="round"/><line x1="403.3333333333333" y1="470" x2="403.3333333333333" y2="170" stroke="#dde5e3" stroke-width="1.5" stroke-linecap="round"/><line x1="530" y1="470" x2="530" y2="170" stroke="#dde5e3" stroke-width="1.5" stroke-linecap="round"/><line x1="150" y1="470" x2="530" y2="470" stroke="#dde5e3" stroke-width="1.5" stroke-linecap="round"/><line x1="150" y1="379.0909090909091" x2="530" y2="379.0909090909091" stroke="#dde5e3" stroke-width="1.5" stroke-linecap="round"/><line x1="150" y1="288.1818181818182" x2="530" y2="288.1818181818182" stroke="#dde5e3" stroke-width="1.5" stroke-linecap="round"/><line x1="150" y1="197.27272727272725" x2="530" y2="197.27272727272725" stroke="#dde5e3" stroke-width="1.5" stroke-linecap="round"/><line x1="150" y1="470" x2="150" y2="148" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><line x1="150" y1="470" x2="552" y2="470" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><line x1="150" y1="470" x2="150" y2="477" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><text x="150" y="497" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">0</text><line x1="276.66666666666663" y1="470" x2="276.66666666666663" y2="477" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><text x="276.66666666666663" y="497" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">1</text><line x1="403.3333333333333" y1="470" x2="403.3333333333333" y2="477" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><text x="403.3333333333333" y="497" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">2</text><line x1="530" y1="470" x2="530" y2="477" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><text x="530" y="497" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">3</text><line x1="143" y1="470" x2="150" y2="470" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><text x="138" y="476" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end">0</text><line x1="143" y1="379.0909090909091" x2="150" y2="379.0909090909091" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><text x="138" y="385.0909090909091" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end">2</text><line x1="143" y1="288.1818181818182" x2="150" y2="288.1818181818182" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><text x="138" y="294.1818181818182" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end">4</text><line x1="143" y1="197.27272727272725" x2="150" y2="197.27272727272725" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><text x="138" y="203.27272727272725" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end">6</text><text x="340" y="528" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">distance d / 10²⁴ m</text><text x="88" y="320" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle" transform="rotate(-90 88 320)">speed v / 10⁶ m/s</text><line x1="150" y1="470" x2="530" y2="170" stroke="#2e6b62" stroke-width="4" stroke-linecap="round"/><circle cx="403.3333333333333" cy="270" r="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><line x1="403.3333333333333" y1="270" x2="403.3333333333333" y2="470" stroke="#b5602e" stroke-width="2" stroke-dasharray="6 5"/><line x1="150" y1="270" x2="403.3333333333333" y2="270" stroke="#b5602e" stroke-width="2" stroke-dasharray="6 5"/><text x="417.3333333333333" y="292" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">(2.0, 4.4)</text><text x="188" y="188.1818181818182" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">gradient = H₀ = v / d</text><rect x="560" y="130" width="310" height="238" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="580" y="166" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Worked example</text><text x="580" y="200" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">v = 4.4 × 10⁶ m/s</text><text x="580" y="230" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">d = v / H₀</text><text x="580" y="260" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">= 4.4 × 10⁶ / 2.2 × 10⁻¹⁸</text><text x="580" y="290" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">= 2.0 × 10²⁴ m</text><text x="580" y="320" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">÷ 9.5 × 10¹⁵ m per ly</text><text x="580" y="350" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">= 2.1 × 10⁸ light-years</text><rect x="560" y="382" width="310" height="168" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="715" y="445.95" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">v from redshift;</text><text x="715" y="471.95" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">d from supernova</text><text x="715" y="497.95" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">brightness</text><rect x="30" y="565" width="840" height="56" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="599.65" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Age of the Universe ≈ d / v = 1 / H₀ = 4.5 × 10¹⁷ s ≈ 1.4 × 10¹⁰ years</text>
</svg>