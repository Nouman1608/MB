<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 576" width="900" height="576" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="576" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Two measures of sufficiency</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Quantity and quality together provide apt support</text>
<rect x="140" y="312" width="360" height="170" rx="14" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5" /><text x="320" y="378.68" font-size="20" font-weight="700" fill="#b5602e" text-anchor="middle" xml:space="preserve">Few, weak</text><text x="320" y="406.68" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">One rumour or an outdated figure offered</text><text x="320" y="427.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">for a sweeping claim.</text><rect x="510" y="312" width="360" height="170" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" /><text x="690" y="378.68" font-size="20" font-weight="700" fill="#b5602e" text-anchor="middle" xml:space="preserve">Many, weak</text><text x="690" y="406.68" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Ten anecdotes. Ten weak pieces do not</text><text x="690" y="427.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">equal one strong one.</text><rect x="140" y="132" width="360" height="170" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="320" y="198.68" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="middle" xml:space="preserve">Few, strong</text><text x="320" y="226.68" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">A rigorous study of 5,000 people: quality</text><text x="320" y="247.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">compensates, but only up to a point.</text><rect x="510" y="132" width="360" height="170" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="690" y="188.12" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">Enough, strong</text><text x="690" y="216.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Several independent examples or a large,</text><text x="690" y="237.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">well-chosen sample from qualified</text><text x="690" y="258.36" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">sources.</text><line x1="140" y1="506" x2="890" y2="506" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="505" y="536" font-size="16" font-weight="700" fill="#4a5568" text-anchor="middle" xml:space="preserve">QUANTITY: is there enough for this claim?</text><line x1="116" y1="482" x2="116" y2="128" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="100" y="307" font-size="16" font-weight="700" fill="#4a5568" text-anchor="middle" transform="rotate(-90 100 307)">QUALITY: relevant, accurate, credible?</text>
</svg>