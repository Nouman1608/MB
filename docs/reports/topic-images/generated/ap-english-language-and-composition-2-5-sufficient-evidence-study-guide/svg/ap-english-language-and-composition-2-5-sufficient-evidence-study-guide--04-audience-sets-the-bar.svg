<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The audience sets the bar too</text>

<rect x="30" y="96" width="330" height="84" rx="14" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2.5" /><text x="44" y="130.24" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Already inclined to agree</text><text x="44" y="158.23999999999998" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">needs less</text><rect x="390" y="118" width="48" height="40" rx="8" fill="#2e6b62" stroke="#2e6b62" stroke-width="2" /><rect x="450" y="118" width="48" height="40" rx="8" fill="#ffffff" stroke="#2e6b62" stroke-width="2" /><rect x="510" y="118" width="48" height="40" rx="8" fill="#ffffff" stroke="#2e6b62" stroke-width="2" /><rect x="570" y="118" width="48" height="40" rx="8" fill="#ffffff" stroke="#2e6b62" stroke-width="2" /><rect x="30" y="192" width="330" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="44" y="226.24" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">General audience</text><text x="44" y="254.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">a clear example and a trusted statistic</text><rect x="390" y="214" width="48" height="40" rx="8" fill="#2e6b62" stroke="#2e6b62" stroke-width="2" /><rect x="450" y="214" width="48" height="40" rx="8" fill="#2e6b62" stroke="#2e6b62" stroke-width="2" /><rect x="510" y="214" width="48" height="40" rx="8" fill="#ffffff" stroke="#2e6b62" stroke-width="2" /><rect x="570" y="214" width="48" height="40" rx="8" fill="#ffffff" stroke="#2e6b62" stroke-width="2" /><rect x="30" y="288" width="330" height="84" rx="14" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2.5" /><text x="44" y="322.24" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Specialist audience</text><text x="44" y="350.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">expects rigorous sources</text><rect x="390" y="310" width="48" height="40" rx="8" fill="#2e6b62" stroke="#2e6b62" stroke-width="2" /><rect x="450" y="310" width="48" height="40" rx="8" fill="#2e6b62" stroke="#2e6b62" stroke-width="2" /><rect x="510" y="310" width="48" height="40" rx="8" fill="#2e6b62" stroke="#2e6b62" stroke-width="2" /><rect x="570" y="310" width="48" height="40" rx="8" fill="#ffffff" stroke="#2e6b62" stroke-width="2" /><rect x="30" y="384" width="330" height="84" rx="14" fill="#f6e3d8" stroke="#c9d6d4" stroke-width="2.5" /><text x="44" y="414" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Sceptical or hostile</text><text x="44" y="442" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">needs more, and more varied,</text><text x="44" y="463.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">evidence</text><rect x="390" y="406" width="48" height="40" rx="8" fill="#2e6b62" stroke="#2e6b62" stroke-width="2" /><rect x="450" y="406" width="48" height="40" rx="8" fill="#2e6b62" stroke="#2e6b62" stroke-width="2" /><rect x="510" y="406" width="48" height="40" rx="8" fill="#2e6b62" stroke="#2e6b62" stroke-width="2" /><rect x="570" y="406" width="48" height="40" rx="8" fill="#2e6b62" stroke="#2e6b62" stroke-width="2" /><line x1="390" y1="486" x2="630" y2="486" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="510" y="512" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle" xml:space="preserve">more demanding</text><rect x="660" y="96" width="210" height="372" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="678" y="197.68" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Sensing</text><text x="678" y="224.08" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">resistance?</text><text x="678" y="252.08" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">Add several types (a</text><text x="678" y="273.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">statistic, an example,</text><text x="678" y="294.32" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">an authority) so</text><text x="678" y="315.44" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">readers with different</text><text x="678" y="336.56" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">standards each find</text><text x="678" y="357.68" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">something</text><text x="678" y="378.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">persuasive.</text>
</svg>