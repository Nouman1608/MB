<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 594" width="900" height="594" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="594" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A pattern needs many points</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Declaration of Independence, 1776</text>
<rect x="30" y="122" width="380" height="290" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><rect x="490" y="122" width="380" height="290" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="220" y="154" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">One grievance</text><text x="680" y="154" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">“He has...” × dozens</text><circle cx="220" cy="272" r="12" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><text x="220" y="352" font-size="16" font-weight="400" fill="#b5602e" text-anchor="middle" xml:space="preserve">a fact, but no direction: insufficient for</text><text x="220" y="373.12" font-size="16" font-weight="400" fill="#b5602e" text-anchor="middle" xml:space="preserve">a broad claim</text><circle cx="550" cy="372" r="11" fill="#2e6b62" stroke="#1e2a44" stroke-width="2"/><circle cx="580" cy="347" r="11" fill="#2e6b62" stroke="#1e2a44" stroke-width="2"/><circle cx="605" cy="332" r="11" fill="#2e6b62" stroke="#1e2a44" stroke-width="2"/><circle cx="635" cy="312" r="11" fill="#2e6b62" stroke="#1e2a44" stroke-width="2"/><circle cx="660" cy="292" r="11" fill="#2e6b62" stroke="#1e2a44" stroke-width="2"/><circle cx="690" cy="277" r="11" fill="#2e6b62" stroke="#1e2a44" stroke-width="2"/><circle cx="715" cy="254" r="11" fill="#2e6b62" stroke="#1e2a44" stroke-width="2"/><circle cx="745" cy="240" r="11" fill="#2e6b62" stroke="#1e2a44" stroke-width="2"/><circle cx="770" cy="217" r="11" fill="#2e6b62" stroke="#1e2a44" stroke-width="2"/><circle cx="800" cy="200" r="11" fill="#2e6b62" stroke="#1e2a44" stroke-width="2"/><circle cx="825" cy="182" r="11" fill="#2e6b62" stroke="#1e2a44" stroke-width="2"/><path d="M520,390 L835,172" fill="none" stroke="#8a6d0d" stroke-width="3" marker-end="url(#ahO)" stroke-dasharray="8 6"/><text x="700" y="402" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" xml:space="preserve">each concrete and checkable</text><rect x="30" y="432" width="410" height="131.04000000000002" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5" /><text x="48" y="466" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Claim</text><text x="48" y="494" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">a “design” to impose “absolute Despotism”:</text><text x="48" y="515.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">about intent and pattern</text><rect x="460" y="432" width="410" height="131.04000000000002" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="478" y="466" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">“Let Facts be submitted to a candid</text><text x="478" y="492.4" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">world”</text><text x="478" y="520.4" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">announces that proof is needed and appeals to</text><text x="478" y="541.52" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">a fair-minded audience</text>
</svg>