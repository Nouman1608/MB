<rect width="900" height="547" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Closing the gap between claim and evidence</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Worked example 1: mobile phones (invented details)</text>
<text x="230" y="132" font-size="19" font-weight="700" fill="#b5602e" text-anchor="middle" xml:space="preserve">Before</text><rect x="30" y="148" width="400" height="108" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5" /><text x="48" y="183.68" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Claim</text><text x="48" y="211.68" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“Mobile phones should be banned in <tspan font-weight="700">all</tspan></text><text x="48" y="232.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700">schools</tspan>.”</text><rect x="210" y="256" width="40" height="120" fill="none" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="6 5"/><text x="266" y="322" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start" xml:space="preserve">wide gap</text><rect x="30" y="376" width="400" height="66.24000000000001" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="6 5"/><text x="42" y="401.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Anecdote</text><text x="42" y="427.19" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">my cousin’s grades improved (other causes?)</text><rect x="30" y="450.24" width="400" height="66.24000000000001" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="6 5"/><text x="42" y="475.84000000000003" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Anecdote</text><text x="42" y="501.43" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">one confiscation last week</text><text x="670" y="132" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">After</text><rect x="470" y="148" width="400" height="108" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5" /><text x="488" y="183.68" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Claim</text><text x="488" y="211.68" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“Schools should ban mobile phones <tspan font-weight="700">during</tspan></text><text x="488" y="232.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700">lessons</tspan>.”</text><rect x="650" y="256" width="40" height="24" fill="#2e6b62" stroke="#2e6b62" stroke-width="2.5" stroke-dasharray=""/><rect x="470" y="280" width="400" height="66.24000000000001" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="482" y="305.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Study</text><text x="482" y="331.19" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">12 schools: +4 marks with a lesson-time ban</text><rect x="470" y="354.24" width="400" height="66.24000000000001" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="482" y="379.84000000000003" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Survey</text><text x="482" y="405.43" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">71 of 90 teachers: phones the top interruption</text><rect x="470" y="428.48" width="400" height="66.24000000000001" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="482" y="454.08000000000004" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Concession</text><text x="482" y="479.67" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">no ban at break or in emergencies</text>
</svg>