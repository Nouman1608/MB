<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 552" width="900" height="552" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="552" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The scope of the claim sets the standard</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">The stronger the wording, the more the claim demands</text>
<rect x="30" y="306" width="470" height="80" rx="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5" /><text x="44" y="340.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700">“Some</tspan> <tspan font-weight="700">pupils</tspan> <tspan font-weight="700">find</tspan> <tspan font-weight="700">the</tspan> <tspan font-weight="700">timetable</tspan> <tspan font-weight="700">stressful.”</tspan></text><text x="44" y="361.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">a few clear cases</text><rect x="90" y="214" width="470" height="80" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5" /><text x="104" y="248.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700">“Most</tspan> <tspan font-weight="700">pupils</tspan> <tspan font-weight="700">find</tspan> <tspan font-weight="700">the</tspan> <tspan font-weight="700">timetable</tspan> <tspan font-weight="700">stressful.”</tspan></text><text x="104" y="269.59999999999997" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">a representative sample or survey showing a majority</text><rect x="150" y="122" width="470" height="80" rx="14" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5" /><text x="164" y="156.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700">“All</tspan> <tspan font-weight="700">pupils</tspan> <tspan font-weight="700">find</tspan> <tspan font-weight="700">the</tspan> <tspan font-weight="700">timetable</tspan> <tspan font-weight="700">stressful.”</tspan></text><text x="164" y="177.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">almost impossible: a single contrary case would break it</text><line x1="640" y1="386" x2="640" y2="126" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><text x="660" y="254" font-size="16" font-weight="700" fill="#4a5568" text-anchor="middle" transform="rotate(90 660 254)">more evidence demanded</text><rect x="680" y="122" width="190" height="105.84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="692" y="147.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">“...causes stress”</text><text x="692" y="173.19" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">evidence of cause,</text><text x="692" y="192.99" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">not only that the two</text><text x="692" y="212.79" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">occur together</text><rect x="680" y="239.84" width="190" height="128.28" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="692" y="265.44" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">“...the worst in the</text><text x="692" y="287.88" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">country”</text><text x="692" y="313.47" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">a comparison with</text><text x="692" y="333.27000000000004" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">others, not just local</text><text x="692" y="353.07000000000005" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">complaints</text><rect x="30" y="412" width="840" height="104.63999999999999" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5" /><text x="48" y="446" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start" xml:space="preserve">Narrow the claim to fit the evidence</text><text x="48" y="474" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“Most pupils in Years 10 and 11 report that the timetable leaves too little time to eat” is easier to defend</text><text x="48" y="495.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">than “The timetable is unbearable.”</text>
</svg>