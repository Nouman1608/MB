<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 544" width="900" height="544" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="544" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Seven ways evidence falls short</text>

<rect x="30" y="96" width="412" height="100.64000000000001" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="84" y="128" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Too little</text><text x="46" y="156" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">one example for a general claim: a hasty</text><text x="46" y="177.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">generalisation</text><rect x="458" y="96" width="412" height="100.64000000000001" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="512" y="128" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Unrepresentative</text><text x="474" y="156" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">unusual cases, or a self-selected sample</text><circle cx="60" cy="126" r="15" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="131.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><circle cx="488" cy="126" r="15" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="488" y="131.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="30" y="208.64000000000001" width="412" height="100.64000000000001" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="84" y="240.64000000000001" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Irrelevant</text><text x="46" y="268.64000000000004" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">true, but about cost when the claim is about</text><text x="46" y="289.76000000000005" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">safety</text><rect x="458" y="208.64000000000001" width="412" height="100.64000000000001" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="512" y="240.64000000000001" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Out of date</text><text x="474" y="268.64000000000004" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">a ten-year-old figure for a fast-changing</text><text x="474" y="289.76000000000005" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">situation</text><circle cx="60" cy="238.64000000000001" r="15" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="244.04000000000002" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><circle cx="488" cy="238.64000000000001" r="15" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="488" y="244.04000000000002" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="30" y="321.28000000000003" width="412" height="79.52000000000001" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="84" y="353.28000000000003" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Unreliable source</text><text x="46" y="381.28000000000003" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">unnamed, biased or unqualified</text><rect x="458" y="321.28000000000003" width="412" height="79.52000000000001" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="512" y="353.28000000000003" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Only one type</text><text x="474" y="381.28000000000003" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">all anecdote or all statistics leaves gaps</text><circle cx="60" cy="351.28000000000003" r="15" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="356.68" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><circle cx="488" cy="351.28000000000003" r="15" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="488" y="356.68" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">6</text><rect x="30" y="412.80000000000007" width="412" height="100.64000000000001" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="84" y="444.80000000000007" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Unexplained</text><text x="46" y="472.80000000000007" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">a good fact that never says why it supports the</text><text x="46" y="493.9200000000001" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">claim</text><rect x="458" y="412.80000000000007" width="412" height="100.64000000000001" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="474" y="444.80000000000007" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">And too much?</text><text x="474" y="472.80000000000007" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">nine near-identical examples bury the strongest:</text><text x="474" y="493.9200000000001" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">choose enough, then comment</text><circle cx="60" cy="442.80000000000007" r="15" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="448.20000000000005" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">7</text>
</svg>