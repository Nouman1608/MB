<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 605" width="900" height="605" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="605" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: composition of clean air</text>

<rect x="30" y="110" width="440" height="470" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M250,330 L250.0,160.0 A170,170 0 1 1 83.0,298.1 Z" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><path d="M250,330 L83.0,298.1 A170,170 0 0 1 239.3,160.3 Z" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><path d="M250,330 L239.3,160.3 A170,170 0 0 1 250.0,160.0 Z" fill="#b5602e" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><text x="290" y="370" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Nitrogen</text><text x="290" y="396" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">78% → 281°</text><text x="160" y="260" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Oxygen</text><text x="160" y="284" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="middle">21% → 76°</text><line x1="244" y1="162" x2="220" y2="132" stroke="#1e2a44" stroke-width="2"/><text x="216" y="140" font-size="15.5" font-weight="600" fill="#1e2a44" text-anchor="end">other gases 1% → 4°</text><text x="250" y="556" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Each 1% = 360 ÷ 100 = 3.6°</text><rect x="490" y="110" width="380" height="470" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="512" y="148" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">500 cm³ of clean air</text><text x="512" y="186" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Nitrogen = 500 × 78 ÷ 100</text><text x="512" y="211" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">= 390 cm³</text><text x="512" y="236" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"></text><text x="512" y="261" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Oxygen = 500 × 21 ÷ 100</text><text x="512" y="286" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">= 105 cm³</text><text x="512" y="311" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"></text><text x="512" y="336" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Other = 500 − 390 − 105</text><text x="512" y="361" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">= 5 cm³ (1%)</text><rect x="510" y="410" width="340" height="150" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="528" y="442" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Pie chart angles</text><text x="528" y="470" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">78 × 3.6 = 280.8° ≈ 281°</text><text x="528" y="492" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">21 × 3.6 = 75.6° ≈ 76°</text><text x="528" y="514" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">1 × 3.6 = 3.6° ≈ 4°</text><text x="528" y="536" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">check: 280.8 + 75.6 + 3.6 = 360</text>
</svg>