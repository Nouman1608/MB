<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 595" width="900" height="595" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="595" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Reading greenhouse diagrams</text>

<rect x="30" y="110" width="270" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="165" y="148" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Reflection</text><text x="165" y="380" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">arrows bouncing off clouds</text><text x="165" y="401" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">or ice</text><rect x="50" y="310" width="230" height="30" fill="#a77b52" stroke="#1e2a44" stroke-width="2"/><path d="M132,261 Q121,261 122.1,250 Q123.19999999999999,237.9 137.5,240.1 Q143,223.6 162.25,226.9 Q178.75,217 189.75,236.25 Q209,236.25 207.9,251.1 Q209,261 198,261 Z" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><line x1="70" y1="180" x2="140" y2="236" stroke="#d4b02e" stroke-width="4" marker-end="url(#ahO)"/><line x1="190" y1="236" x2="255" y2="180" stroke="#d4b02e" stroke-width="4" marker-end="url(#ahO)"/><rect x="315" y="110" width="270" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="148" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Absorption</text><text x="450" y="380" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">arrows ending at the ground</text><text x="450" y="401" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">or sea</text><rect x="335" y="310" width="230" height="30" fill="#a77b52" stroke="#1e2a44" stroke-width="2"/><line x1="380" y1="180" x2="450" y2="304" stroke="#d4b02e" stroke-width="4" marker-end="url(#ahO)"/><line x1="450" y1="180" x2="520" y2="304" stroke="#d4b02e" stroke-width="4" marker-end="url(#ahO)"/><rect x="600" y="110" width="270" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="735" y="148" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Absorbed and re-emitted</text><text x="735" y="380" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">arrows leave the surface,</text><text x="735" y="401" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">then turn back from the gas</text><text x="735" y="422" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">layer</text><rect x="620" y="310" width="230" height="30" fill="#a77b52" stroke="#1e2a44" stroke-width="2"/><rect x="620" y="180" width="230" height="34" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="2" stroke-dasharray="6 5"/><line x1="690" y1="306" x2="690" y2="220" stroke="#b5602e" stroke-width="4" marker-end="url(#ahR)"/><line x1="780" y1="220" x2="780" y2="304" stroke="#b5602e" stroke-width="4" marker-end="url(#ahR)"/><path d="M690,218 Q735,190 780,218" fill="none" stroke="#b5602e" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><rect x="30" y="460" width="840" height="110" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="60" y="498" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Greenhouse gases ABSORB and RE-EMIT heat; they do not “reflect” it.</text><text x="60" y="528" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">Roughly 30% of incoming solar radiation is reflected to space overall;</text><text x="60" y="552" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">if a question gives figures, use those, and check each stage adds up.</text>
</svg>