<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The natural greenhouse effect in five steps</text>

<rect x="30" y="110" width="840" height="490" rx="14" fill="#eef1f8"/><rect x="30" y="600" width="500" height="60" fill="#a77b52" stroke="#1e2a44" stroke-width="2.5"/><rect x="530" y="600" width="340" height="60" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="280" y="638" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">land</text><text x="700" y="638" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">ocean</text><line x1="126" y1="160" x2="135" y2="160" stroke="#8a6d0d" stroke-width="3"/><line x1="115.45584412271572" y1="185.45584412271572" x2="121.81980515339464" y2="191.81980515339464" stroke="#8a6d0d" stroke-width="3"/><line x1="90" y1="196" x2="90" y2="205" stroke="#8a6d0d" stroke-width="3"/><line x1="64.54415587728428" y1="185.45584412271572" x2="58.18019484660536" y2="191.81980515339464" stroke="#8a6d0d" stroke-width="3"/><line x1="54" y1="160" x2="45" y2="160" stroke="#8a6d0d" stroke-width="3"/><line x1="64.54415587728428" y1="134.54415587728428" x2="58.18019484660535" y2="128.18019484660536" stroke="#8a6d0d" stroke-width="3"/><line x1="90" y1="124" x2="89.99999999999999" y2="115" stroke="#8a6d0d" stroke-width="3"/><line x1="115.4558441227157" y1="134.54415587728428" x2="121.81980515339463" y2="128.18019484660536" stroke="#8a6d0d" stroke-width="3"/><circle cx="90" cy="160" r="30" fill="#d4b02e" stroke="#8a6d0d" stroke-width="2.5"/><rect x="40" y="274" width="820" height="52" rx="10" fill="#dce9e7" opacity="0.8" stroke="#2e6b62" stroke-width="2" stroke-dasharray="8 6"/><circle cx="60" cy="290" r="5" fill="#2e6b62" stroke="#2e6b62" stroke-width="1"/><circle cx="91" cy="310" r="5" fill="#2e6b62" stroke="#2e6b62" stroke-width="1"/><circle cx="122" cy="290" r="5" fill="#2e6b62" stroke="#2e6b62" stroke-width="1"/><circle cx="153" cy="310" r="5" fill="#2e6b62" stroke="#2e6b62" stroke-width="1"/><circle cx="184" cy="290" r="5" fill="#2e6b62" stroke="#2e6b62" stroke-width="1"/><circle cx="215" cy="310" r="5" fill="#2e6b62" stroke="#2e6b62" stroke-width="1"/><circle cx="246" cy="290" r="5" fill="#2e6b62" stroke="#2e6b62" stroke-width="1"/><circle cx="277" cy="310" r="5" fill="#2e6b62" stroke="#2e6b62" stroke-width="1"/><circle cx="308" cy="290" r="5" fill="#2e6b62" stroke="#2e6b62" stroke-width="1"/><circle cx="339" cy="310" r="5" fill="#2e6b62" stroke="#2e6b62" stroke-width="1"/><circle cx="370" cy="290" r="5" fill="#2e6b62" stroke="#2e6b62" stroke-width="1"/><circle cx="401" cy="310" r="5" fill="#2e6b62" stroke="#2e6b62" stroke-width="1"/><circle cx="432" cy="290" r="5" fill="#2e6b62" stroke="#2e6b62" stroke-width="1"/><circle cx="463" cy="310" r="5" fill="#2e6b62" stroke="#2e6b62" stroke-width="1"/><circle cx="494" cy="290" r="5" fill="#2e6b62" stroke="#2e6b62" stroke-width="1"/><circle cx="525" cy="310" r="5" fill="#2e6b62" stroke="#2e6b62" stroke-width="1"/><circle cx="556" cy="290" r="5" fill="#2e6b62" stroke="#2e6b62" stroke-width="1"/><circle cx="587" cy="310" r="5" fill="#2e6b62" stroke="#2e6b62" stroke-width="1"/><circle cx="618" cy="290" r="5" fill="#2e6b62" stroke="#2e6b62" stroke-width="1"/><circle cx="649" cy="310" r="5" fill="#2e6b62" stroke="#2e6b62" stroke-width="1"/><circle cx="680" cy="290" r="5" fill="#2e6b62" stroke="#2e6b62" stroke-width="1"/><circle cx="711" cy="310" r="5" fill="#2e6b62" stroke="#2e6b62" stroke-width="1"/><circle cx="742" cy="290" r="5" fill="#2e6b62" stroke="#2e6b62" stroke-width="1"/><circle cx="773" cy="310" r="5" fill="#2e6b62" stroke="#2e6b62" stroke-width="1"/><circle cx="804" cy="290" r="5" fill="#2e6b62" stroke="#2e6b62" stroke-width="1"/><circle cx="835" cy="310" r="5" fill="#2e6b62" stroke="#2e6b62" stroke-width="1"/><rect x="384.8" y="336.8" width="271.2" height="21.6" rx="5" fill="#eef1f8" opacity="1"/><text x="650" y="352" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="end">greenhouse gases and clouds</text><path d="M518,224 Q504,224 505.4,210 Q506.8,194.6 525,197.4 Q532,176.4 556.5,180.6 Q577.5,168 591.5,192.5 Q616,192.5 614.6,211.4 Q616,224 602,224 Z" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><line x1="130" y1="190" x2="300" y2="594" stroke="#d4b02e" stroke-width="6" marker-end="url(#ahO)"/><line x1="150" y1="180" x2="520" y2="198" stroke="#d4b02e" stroke-width="6" marker-end="url(#ahO)"/><line x1="560" y1="175" x2="640" y2="125" stroke="#d4b02e" stroke-width="4" marker-end="url(#ahO)"/><line x1="330" y1="590" x2="420" y2="130" stroke="#d4b02e" stroke-width="3.5" marker-end="url(#ahO)" stroke-dasharray="8 6"/><path d="M680,596 q-12,-40 0,-80 q12,-40 0,-80 q-12,-40 0,-114" fill="none" stroke="#b5602e" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahR)"/><line x1="760" y1="330" x2="760" y2="592" stroke="#b5602e" stroke-width="4" marker-end="url(#ahR)"/><circle cx="210" cy="380" r="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="210" y="386.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><circle cx="250" cy="566" r="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="250" y="572.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><circle cx="640" cy="160" r="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="640" y="166.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><circle cx="412" cy="400" r="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="412" y="406.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><circle cx="712" cy="460" r="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="712" y="466.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><circle cx="790" cy="470" r="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="790" y="476.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="860" y="130" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">not to scale</text><circle cx="52" cy="694" r="15" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="52" y="699.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="80" y="700" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Solar radiation passes through the atmosphere</text><circle cx="52" cy="730" r="15" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="52" y="735.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="80" y="736" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Some is absorbed by land and oceans, heating the Earth</text><circle cx="52" cy="766" r="15" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="52" y="771.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="80" y="772" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Some is reflected back into space (clouds, ice, light surfaces)</text><circle cx="52" cy="802" r="15" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="52" y="807.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="80" y="808" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Heat (infrared) from the surface is absorbed and re-emitted back to the surface by</text><text x="80" y="830" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">greenhouse gases and clouds</text><circle cx="52" cy="860" r="15" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="52" y="865.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="80" y="866" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">This natural process warms the Earth enough to support life</text><rect x="30" y="906" width="840" height="64" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="946" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Without it: about −18 °C average. With it: about 15 °C.</text>
</svg>