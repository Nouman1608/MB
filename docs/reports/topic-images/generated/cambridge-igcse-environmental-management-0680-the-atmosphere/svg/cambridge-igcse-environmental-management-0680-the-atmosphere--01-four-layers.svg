<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" width="900" height="720" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="720" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four layers of the atmosphere</text>

<rect x="30" y="110" width="840" height="130" fill="#e6e9f2" stroke="#c9d6d4" stroke-width="2"/><circle cx="70" cy="175" r="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="70" y="182.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="110" y="171" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Thermosphere</text><text x="110" y="197" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="start">the highest of the four</text><rect x="30" y="240" width="840" height="130" fill="#e9eef6" stroke="#c9d6d4" stroke-width="2"/><circle cx="70" cy="305" r="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="70" y="312.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="110" y="301" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Mesosphere</text><text x="110" y="327" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="start">above the stratosphere</text><rect x="30" y="370" width="840" height="130" fill="#eef3f7" stroke="#c9d6d4" stroke-width="2"/><circle cx="70" cy="435" r="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="70" y="442.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="110" y="431" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Stratosphere</text><text x="110" y="457" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="start">ozone layer in the LOWER stratosphere</text><rect x="30" y="500" width="840" height="130" fill="#f3f6f5" stroke="#c9d6d4" stroke-width="2"/><circle cx="70" cy="565" r="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="70" y="572.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="110" y="561" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Troposphere</text><text x="110" y="587" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="start">where we live; almost all weather</text><rect x="470" y="448" width="390" height="34" rx="6" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="665" y="471" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">ozone layer</text><line x1="560" y1="130" x2="560" y2="442" stroke="#8a6d0d" stroke-width="3.5" marker-end="url(#ahO)"/><line x1="640" y1="130" x2="640" y2="442" stroke="#8a6d0d" stroke-width="3.5" marker-end="url(#ahO)"/><line x1="720" y1="130" x2="720" y2="442" stroke="#8a6d0d" stroke-width="3.5" marker-end="url(#ahO)"/><line x1="800" y1="130" x2="800" y2="624" stroke="#8a6d0d" stroke-width="2.5" marker-end="url(#ahO)" stroke-dasharray="6 6"/><rect x="548.45" y="145.275" width="263.1" height="20.925" rx="5" fill="#ffffff" opacity="0.92"/><text x="680" y="160" font-size="15.5" font-weight="700" fill="#8a6d0d" text-anchor="middle">Sun’s ultraviolet radiation</text><rect x="532.9" y="545.275" width="263.1" height="20.925" rx="5" fill="#ffffff" opacity="0.92"/><text x="790" y="560" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="end">less UV reaches the surface</text><rect x="30" y="630" width="840" height="34" fill="#6f9a52" stroke="#1e2a44" stroke-width="2.5"/><path d="M434,572 Q422,572 423.2,560 Q424.4,546.8 440,549.2 Q446,531.2 467,534.8 Q485,524 497,545 Q518,545 516.8,561.2 Q518,572 506,572 Z" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><line x1="440" y1="575" x2="435" y2="589" stroke="#2b5a9a" stroke-width="2.5"/><line x1="456" y1="583" x2="451" y2="597" stroke="#2b5a9a" stroke-width="2.5"/><line x1="472" y1="575" x2="467" y2="589" stroke="#2b5a9a" stroke-width="2.5"/><line x1="488" y1="583" x2="483" y2="597" stroke="#2b5a9a" stroke-width="2.5"/><rect x="560" y="606" width="30" height="24" fill="#ffffff" stroke="#1e2a44" stroke-width="2.2"/><path d="M557,606 L575,593 L593,606 Z" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><rect x="527.3" y="613.8" width="5.4" height="16.2" fill="#9c8f6e" stroke="#1e2a44" stroke-width="1.8"/><circle cx="530" cy="603" r="14.4" fill="#6f9a52" stroke="#1e2a44" stroke-width="2"/><text x="450" y="696" font-size="16.5" font-weight="600" fill="#1e2a44" text-anchor="middle">Order from the surface up: Troposphere, Stratosphere, Mesosphere, Thermosphere (T, S, M, T).</text><text x="450" y="356" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">not to scale</text>
</svg>