<rect width="900" height="760" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Cliff retreat and the wave-cut platform</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Six linked steps</text>
<rect x="30" y="124" width="270" height="230" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="32" y="274" width="266" height="76" fill="#dce9e7"/><path d="M32,320 L190,316 L220,278 L220,174 L298,174 L298,350 L32,350 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><line x1="32" y1="274" x2="298" y2="274" stroke="#2e6b62" stroke-width="2"/><circle cx="54" cy="150" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="54" y="155.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="78" y="156" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Waves attack the base</text><text x="44" y="346" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">between high and low tide</text><rect x="315" y="124" width="270" height="230" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="317" y="274" width="266" height="76" fill="#dce9e7"/><path d="M317,320 L475,316 L505,278 L505,268 L505,268 L523,266 L523,248 L505,244 L505,174 L583,174 L583,350 L317,350 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><line x1="317" y1="274" x2="583" y2="274" stroke="#2e6b62" stroke-width="2"/><circle cx="339" cy="150" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="339" y="155.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="363" y="156" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Notch is cut</text><text x="329" y="346" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">hydraulic action, quarrying, abrasion</text><rect x="600" y="124" width="270" height="230" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="602" y="274" width="266" height="76" fill="#dce9e7"/><path d="M602,320 L720,316 L770,278 L770,174 L868,174 L868,350 L602,350 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><path d="M750,244 L770,244 L770,174 L750,174 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3" stroke-dasharray="7 5"/><circle cx="750" cy="276" r="7" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><circle cx="736" cy="270" r="7" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><circle cx="722" cy="276" r="7" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><circle cx="708" cy="270" r="7" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><line x1="602" y1="274" x2="868" y2="274" stroke="#2e6b62" stroke-width="2"/><circle cx="624" cy="150" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="624" y="155.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="648" y="156" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Overhang collapses</text><text x="614" y="346" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">mass movement</text><rect x="30" y="369" width="270" height="230" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="32" y="519" width="266" height="76" fill="#dce9e7"/><path d="M32,565 L90,561 L170,523 L170,419 L298,419 L298,595 L32,595 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><line x1="220" y1="419" x2="220" y2="519" stroke="#1e2a44" stroke-width="2" stroke-dasharray="6 5"/><line x1="32" y1="519" x2="298" y2="519" stroke="#2e6b62" stroke-width="2"/><circle cx="54" cy="395" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="54" y="400.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="78" y="401" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Debris removed</text><text x="44" y="591" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">the cliff retreats inland</text><rect x="315" y="369" width="270" height="230" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="317" y="519" width="266" height="76" fill="#dce9e7"/><path d="M317,565 L275,561 L405,523 L405,419 L583,419 L583,595 L317,595 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><line x1="505" y1="419" x2="505" y2="519" stroke="#1e2a44" stroke-width="2" stroke-dasharray="6 5"/><line x1="317" y1="519" x2="583" y2="519" stroke="#2e6b62" stroke-width="2"/><circle cx="339" cy="395" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="339" y="400.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="363" y="401" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Platform widens</text><text x="329" y="591" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">smoothed by abrasion</text><rect x="600" y="369" width="270" height="230" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="602" y="519" width="266" height="76" fill="#dce9e7"/><path d="M602,565 L520,561 L670,523 L670,419 L868,419 L868,595 L602,595 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><line x1="790" y1="419" x2="790" y2="519" stroke="#1e2a44" stroke-width="2" stroke-dasharray="6 5"/><line x1="602" y1="519" x2="868" y2="519" stroke="#2e6b62" stroke-width="2"/><circle cx="624" cy="395" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="624" y="400.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">6</text><text x="648" y="401" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Retreat slows</text><text x="614" y="591" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">negative feedback</text><text x="870" y="618" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">Schematic, not to scale; dashed line = original cliff</text><rect x="30" y="640" width="840" height="88" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="674.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Why retreat slows</text><text x="50" y="703.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">As the platform widens, waves break further offshore and lose energy before reaching the cliff.</text>
</svg>