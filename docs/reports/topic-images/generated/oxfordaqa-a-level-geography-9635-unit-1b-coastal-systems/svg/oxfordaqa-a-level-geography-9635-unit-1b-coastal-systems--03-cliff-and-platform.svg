<rect width="900" height="760" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Cliff retreat and the wave-cut platform</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Six linked steps</text>
<rect x="30" y="124" width="270" height="230" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="32" y="284" width="266" height="68" fill="#dce9e7"/><path d="M32,352 L32,338 L190,338 L220,314 L240,292 L240,198 L298,198 L298,352 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><line x1="32" y1="284" x2="240" y2="284" stroke="#2e6b62" stroke-width="2"/><circle cx="54" cy="150" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="54" y="155.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="78" y="156" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Waves attack the base</text><text x="46" y="182" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">between high and low tide</text><rect x="315" y="124" width="270" height="230" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="317" y="284" width="266" height="68" fill="#dce9e7"/><path d="M317,352 L317,338 L475,338 L505,314 L525,292 L525,280 L543,276 L543,260 L525,256 L525,198 L583,198 L583,352 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><line x1="317" y1="284" x2="525" y2="284" stroke="#2e6b62" stroke-width="2"/><circle cx="339" cy="150" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="339" y="155.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="363" y="156" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Notch is cut</text><text x="331" y="182" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">hydraulic action, quarrying, abrasion</text><rect x="600" y="124" width="270" height="230" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="602" y="284" width="266" height="68" fill="#dce9e7"/><path d="M602,352 L602,338 L722,338 L752,314 L792,292 L792,198 L868,198 L868,352 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><path d="M772,256 L792,256 L792,198 L772,198 Z" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-dasharray="7 5"/><circle cx="778" cy="298" r="7" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><circle cx="763" cy="302" r="7" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><circle cx="748" cy="306" r="7" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><circle cx="733" cy="310" r="7" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><line x1="602" y1="284" x2="792" y2="284" stroke="#2e6b62" stroke-width="2"/><circle cx="624" cy="150" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="624" y="155.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="648" y="156" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Overhang collapses</text><text x="616" y="182" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">mass movement</text><rect x="30" y="369" width="270" height="230" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="32" y="529" width="266" height="68" fill="#dce9e7"/><path d="M32,597 L32,583 L85,583 L115,559 L195,537 L195,443 L298,443 L298,597 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><line x1="240" y1="443" x2="240" y2="529" stroke="#1e2a44" stroke-width="2" stroke-dasharray="6 5"/><line x1="32" y1="529" x2="195" y2="529" stroke="#2e6b62" stroke-width="2"/><circle cx="54" cy="395" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="54" y="400.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="78" y="401" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Debris removed</text><text x="46" y="427" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">the cliff retreats inland</text><rect x="315" y="369" width="270" height="230" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="317" y="529" width="266" height="68" fill="#dce9e7"/><path d="M317,597 L317,583 L325,583 L355,559 L440,537 L440,443 L583,443 L583,597 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><line x1="525" y1="443" x2="525" y2="529" stroke="#1e2a44" stroke-width="2" stroke-dasharray="6 5"/><line x1="317" y1="529" x2="440" y2="529" stroke="#2e6b62" stroke-width="2"/><circle cx="339" cy="395" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="339" y="400.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="363" y="401" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Platform widens</text><text x="331" y="427" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">smoothed by abrasion</text><rect x="600" y="369" width="270" height="230" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="602" y="529" width="266" height="68" fill="#dce9e7"/><path d="M602,597 L602,583 L610,583 L640,559 L710,537 L710,443 L868,443 L868,597 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><line x1="810" y1="443" x2="810" y2="529" stroke="#1e2a44" stroke-width="2" stroke-dasharray="6 5"/><line x1="602" y1="529" x2="710" y2="529" stroke="#2e6b62" stroke-width="2"/><circle cx="624" cy="395" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="624" y="400.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">6</text><text x="648" y="401" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Retreat slows</text><text x="616" y="427" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">negative feedback</text><text x="870" y="618" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">Schematic, not to scale; dashed line = original cliff</text><rect x="30" y="640" width="840" height="88" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="674.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Why retreat slows</text><text x="50" y="703.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">As the platform widens, waves break further offshore and lose energy before reaching the cliff.</text>
</svg>