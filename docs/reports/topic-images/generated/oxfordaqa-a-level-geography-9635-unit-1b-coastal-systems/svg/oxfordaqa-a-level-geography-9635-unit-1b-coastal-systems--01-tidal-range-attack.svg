<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 623" width="900" height="623" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="623" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Tides set where waves attack</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Small and large tidal ranges compared</text>
<g transform="translate(0,124)"><rect x="30" y="0" width="410" height="300" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="32" y="150" width="298" height="146" fill="#dce9e7"/><path d="M330,40 L438,40 L438,298 L32,298 L32,294 L290,246 L330,240 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><rect x="324" y="170" width="12" height="0" fill="none"/><line x1="32" y1="150" x2="330" y2="150" stroke="#2e6b62" stroke-width="2.5" stroke-dasharray="8 6"/><line x1="32" y1="170" x2="330" y2="170" stroke="#2e6b62" stroke-width="2.5" stroke-dasharray="8 6"/><text x="44" y="142" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start">high tide</text><text x="44" y="190" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start">low tide</text><rect x="322" y="150" width="16" height="20" fill="#b5602e" opacity="0.75"/><text x="50" y="30" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Small tidal range</text><rect x="460" y="0" width="410" height="300" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="462" y="110" width="298" height="186" fill="#dce9e7"/><path d="M760,40 L868,40 L868,298 L462,298 L462,294 L580,246 L760,240 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><rect x="754" y="220" width="12" height="0" fill="none"/><line x1="462" y1="110" x2="760" y2="110" stroke="#2e6b62" stroke-width="2.5" stroke-dasharray="8 6"/><line x1="462" y1="220" x2="760" y2="220" stroke="#2e6b62" stroke-width="2.5" stroke-dasharray="8 6"/><text x="474" y="102" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start">high tide</text><text x="474" y="240" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start">low tide</text><rect x="752" y="110" width="16" height="110" fill="#b5602e" opacity="0.75"/><text x="480" y="30" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Large tidal range</text></g><text x="250" y="249" font-size="15" font-weight="700" fill="#b5602e" text-anchor="end">attack focused:</text><text x="250" y="267" font-size="15" font-weight="700" fill="#b5602e" text-anchor="end">a notch forms</text><text x="480" y="299" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">attack spread over a wide zone:</text><text x="480" y="318" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">a broad wave-cut platform forms</text><path d="M580,386 L580,394 L760,394 L760,386" fill="none" stroke="#8a6d0d" stroke-width="2.5"/><text x="670" y="414" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">broad platform</text><path d="M290,386 L290,394 L330,394 L330,386" fill="none" stroke="#8a6d0d" stroke-width="2.5"/><text x="250" y="414" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">narrow platform</text><text x="870" y="442" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">Schematic, not to scale</text><rect x="30" y="462" width="268" height="129" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="506.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Wave energy</text><text x="50" y="535.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Depends on wind speed,</text><text x="50" y="556.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">wind duration and fetch.</text><rect x="316" y="462" width="268" height="129" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="336" y="506.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Tides</text><text x="336" y="535.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Set the height at which waves</text><text x="336" y="556.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">attack.</text><rect x="602" y="462" width="268" height="129" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="622" y="496.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Currents</text><text x="622" y="524.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Longshore and rip currents</text><text x="622" y="545.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">move sediment once</text><text x="622" y="566.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">released.</text>
</svg>