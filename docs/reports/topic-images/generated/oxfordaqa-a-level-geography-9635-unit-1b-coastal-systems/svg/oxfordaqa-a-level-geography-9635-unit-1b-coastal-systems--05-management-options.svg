<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" width="900" height="680" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="680" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Evaluating coastal management</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Judge effectiveness, cost, environmental impact and effects on the sediment cell</text>
<rect x="30" y="124" width="411" height="201" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">TRADITIONAL</text><text x="50" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Hard engineering</text><text x="50" y="211" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="64.25" y="211" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Sea walls, groynes, rip-rap, revetments</text><text x="50" y="236" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="64.25" y="236" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">+ immediate, visible protection</text><text x="50" y="261" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="64.25" y="261" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">- costly to maintain; can reflect energy and lower</text><text x="64.25" y="281" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">beaches; interrupts sediment supply</text><rect x="459" y="124" width="411" height="201" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="479" y="156" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">TRADITIONAL</text><text x="479" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Soft engineering</text><text x="479" y="211" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="493.25" y="211" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Beach nourishment, dune stabilisation, managed</text><text x="493.25" y="231" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">realignment</text><text x="479" y="256" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="493.25" y="256" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">+ works with natural processes</text><text x="479" y="281" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="493.25" y="281" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Sand Motor, Netherlands (2011): about 21.5 million</text><text x="493.25" y="301" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">m³ of sand spread by waves and currents</text><text x="30" y="355" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">SUSTAINABLE APPROACHES</text><rect x="30" y="373" width="840" height="150" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="405" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Shoreline management plan: a policy for each stretch, based on the whole sediment cell</text><rect x="50" y="429" width="190" height="72" rx="10" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="145" y="470" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle"><tspan font-weight="700">Hold</tspan> <tspan font-weight="700">the</tspan> <tspan font-weight="700">line</tspan></text><rect x="253" y="429" width="190" height="72" rx="10" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="348" y="470" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle"><tspan font-weight="700">Advance</tspan> <tspan font-weight="700">the</tspan> <tspan font-weight="700">line</tspan></text><rect x="456" y="429" width="190" height="72" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="551" y="460" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle"><tspan font-weight="700">Managed</tspan></text><text x="551" y="480" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle"><tspan font-weight="700">realignment</tspan></text><rect x="659" y="429" width="190" height="72" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="754" y="460" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle"><tspan font-weight="700">No</tspan> <tspan font-weight="700">active</tspan></text><text x="754" y="480" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle"><tspan font-weight="700">intervention</tspan></text><rect x="30" y="539" width="840" height="109" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="573.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Integrated coastal zone management</text><text x="50" y="602.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Coordinates all users and agencies over a whole coastline, so decisions in one place do not damage</text><text x="50" y="623.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">another.</text>
</svg>