<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="620" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Geology shapes the cliff profile</text>

<rect x="30" y="100" width="410" height="300" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="132" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Beds dip seawards</text><rect x="32" y="340" width="406" height="58" fill="#dce9e7"/><clipPath id="cpsea"><path d="M150,396 L150,340 L330,180 L436,180 L436,396 Z"/></clipPath><path d="M150,396 L150,340 L330,180 L436,180 L436,396 Z" fill="#cbbf9f"/><g clip-path="url(#cpsea)"><line x1="90" y1="400" x2="330" y2="120" stroke="#9c8f6e" stroke-width="2"/><line x1="140" y1="400" x2="380" y2="120" stroke="#9c8f6e" stroke-width="2"/><line x1="190" y1="400" x2="430" y2="120" stroke="#9c8f6e" stroke-width="2"/><line x1="240" y1="400" x2="480" y2="120" stroke="#9c8f6e" stroke-width="2"/><line x1="290" y1="400" x2="530" y2="120" stroke="#9c8f6e" stroke-width="2"/><line x1="340" y1="400" x2="580" y2="120" stroke="#9c8f6e" stroke-width="2"/><line x1="390" y1="400" x2="630" y2="120" stroke="#9c8f6e" stroke-width="2"/><line x1="440" y1="400" x2="680" y2="120" stroke="#9c8f6e" stroke-width="2"/><line x1="490" y1="400" x2="730" y2="120" stroke="#9c8f6e" stroke-width="2"/></g><path d="M150,396 L150,340 L330,180 L436,180 L436,396 Z" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><line x1="292" y1="212" x2="235" y2="268" stroke="#b5602e" stroke-width="4" marker-end="url(#ahR)"/><text x="50" y="164" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">blocks slide along bedding;</text><text x="50" y="184" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">slope ≈ angle of dip</text><text x="430" y="164" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">land</text><text x="60" y="370" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="start">sea</text><rect x="460" y="100" width="410" height="300" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="480" y="132" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Beds dip landwards</text><rect x="462" y="340" width="406" height="58" fill="#dce9e7"/><clipPath id="cpland"><path d="M710,396 L710,180 L866,180 L866,396 Z"/></clipPath><path d="M710,396 L710,180 L866,180 L866,396 Z" fill="#cbbf9f"/><g clip-path="url(#cpland)"><line x1="710" y1="110" x2="866" y2="140" stroke="#9c8f6e" stroke-width="2"/><line x1="710" y1="145" x2="866" y2="175" stroke="#9c8f6e" stroke-width="2"/><line x1="710" y1="180" x2="866" y2="210" stroke="#9c8f6e" stroke-width="2"/><line x1="710" y1="215" x2="866" y2="245" stroke="#9c8f6e" stroke-width="2"/><line x1="710" y1="250" x2="866" y2="280" stroke="#9c8f6e" stroke-width="2"/><line x1="710" y1="285" x2="866" y2="315" stroke="#9c8f6e" stroke-width="2"/><line x1="710" y1="320" x2="866" y2="350" stroke="#9c8f6e" stroke-width="2"/><line x1="710" y1="355" x2="866" y2="385" stroke="#9c8f6e" stroke-width="2"/><line x1="710" y1="390" x2="866" y2="420" stroke="#9c8f6e" stroke-width="2"/></g><path d="M710,396 L710,180 L866,180 L866,396 Z" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><text x="480" y="164" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">steep cliff</text><text x="860" y="164" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">land</text><text x="490" y="370" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="start">sea</text><text x="870" y="418" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">Schematic, not to scale</text><rect x="30" y="438" width="268" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="493.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Strong, well-jointed rock</text><text x="50" y="521.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">High vertical faces, caves</text><text x="50" y="542.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">along joints.</text><rect x="316" y="438" width="268" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="336" y="503.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Weak clays</text><text x="336" y="532.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Slump into rounded profiles.</text><rect x="602" y="438" width="268" height="150" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="622" y="472.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Two sets of processes</text><text x="622" y="500.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Sub-aerial weathering and</text><text x="622" y="521.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">runoff lower the upper face;</text><text x="622" y="542.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">marine erosion steepens the</text><text x="622" y="563.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">base.</text>
</svg>