<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="620" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Geology shapes the cliff profile</text>

<rect x="30" y="100" width="410" height="300" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="132" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Beds dip seawards</text><rect x="32" y="340" width="406" height="58" fill="#dce9e7"/><path d="M150,340 L330,180 L438,180 L438,398 L150,398 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><line x1="200" y1="360" x2="380" y2="200" stroke="#9c8f6e" stroke-width="2"/><line x1="250" y1="360" x2="430" y2="200" stroke="#9c8f6e" stroke-width="2"/><line x1="300" y1="360" x2="480" y2="200" stroke="#9c8f6e" stroke-width="2"/><line x1="350" y1="360" x2="530" y2="200" stroke="#9c8f6e" stroke-width="2"/><line x1="400" y1="360" x2="580" y2="200" stroke="#9c8f6e" stroke-width="2"/><line x1="290" y1="220" x2="230" y2="280" stroke="#b5602e" stroke-width="4" marker-end="url(#ahR)"/><text x="180" y="220" font-size="15" font-weight="700" fill="#b5602e" text-anchor="end">blocks slide</text><text x="180" y="238" font-size="15" font-weight="700" fill="#b5602e" text-anchor="end">along bedding</text><text x="50" y="390" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">slope ≈ angle of dip</text><text x="430" y="164" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">land</text><text x="60" y="370" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="start">sea</text><rect x="460" y="100" width="410" height="300" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="480" y="132" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Beds dip landwards</text><rect x="462" y="340" width="406" height="58" fill="#dce9e7"/><path d="M710,340 L710,180 L868,180 L868,398 L710,398 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><line x1="712" y1="210" x2="866" y2="180" stroke="#9c8f6e" stroke-width="2"/><line x1="712" y1="245" x2="866" y2="215" stroke="#9c8f6e" stroke-width="2"/><line x1="712" y1="280" x2="866" y2="250" stroke="#9c8f6e" stroke-width="2"/><line x1="712" y1="315" x2="866" y2="285" stroke="#9c8f6e" stroke-width="2"/><line x1="712" y1="350" x2="866" y2="320" stroke="#9c8f6e" stroke-width="2"/><text x="480" y="390" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">steep cliff</text><text x="860" y="164" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">land</text><text x="490" y="370" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="start">sea</text><text x="870" y="418" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">Schematic, not to scale</text><rect x="30" y="438" width="268" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="493.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Strong, well-jointed rock</text><text x="50" y="521.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">High vertical faces, caves</text><text x="50" y="542.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">along joints.</text><rect x="316" y="438" width="268" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="336" y="503.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Weak clays</text><text x="336" y="532.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Slump into rounded profiles.</text><rect x="602" y="438" width="268" height="150" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="622" y="472.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Two sets of processes</text><text x="622" y="500.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Sub-aerial weathering and</text><text x="622" y="521.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">runoff lower the upper face;</text><text x="622" y="542.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">marine erosion steepens the</text><text x="622" y="563.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">base.</text>
</svg>