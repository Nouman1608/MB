<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 704" width="900" height="704" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="704" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A sediment budget, before and after a sea wall</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Invented figures from the lesson (m³ a year)</text>
<rect x="30" y="124" width="840" height="200" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="158" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Natural bay</text><text x="286" y="206" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">Inputs</text><text x="286" y="256" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">Outputs</text><rect x="300" y="182" width="312" height="34" fill="#efdfa8" stroke="#1e2a44" stroke-width="2"/><text x="456" y="205" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">cliff 12,000</text><rect x="612" y="182" width="104" height="34" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="664" y="205" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">river 4,000</text><rect x="300" y="232" width="234" height="34" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="417" y="255" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">drift 9,000</text><rect x="534" y="232" width="65" height="34" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="566.5" y="255" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">storms</text><text x="50" y="308" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">(12,000 + 4,000) - (9,000 + 2,500) = +4,500 m³ a year: the beach widens</text><rect x="30" y="344" width="840" height="200" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="378" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">After a sea wall stops cliff erosion</text><text x="286" y="426" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">Inputs</text><text x="286" y="476" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">Outputs</text><rect x="300" y="402" width="104" height="34" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="352" y="425" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">river 4,000</text><rect x="300" y="452" width="234" height="34" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="417" y="475" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">drift 9,000</text><rect x="534" y="452" width="65" height="34" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="566.5" y="475" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">storms</text><text x="50" y="528" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">4,000 - 11,500 = -7,500 m³ a year: the beach narrows</text><text x="870" y="564" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">Bars to scale; storms = 2,500</text><rect x="30" y="584" width="840" height="88" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="618.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Evaluation point</text><text x="450" y="647.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Protecting a cliff can starve beaches within the same sediment cell.</text>
</svg>