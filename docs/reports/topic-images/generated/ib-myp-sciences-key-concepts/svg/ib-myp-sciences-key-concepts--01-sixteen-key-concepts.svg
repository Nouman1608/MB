<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The sixteen MYP key concepts</text>

<rect x="30" y="110" width="840" height="400" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="50" y="135" width="190" height="70" rx="10" fill="#fff" stroke="#c9d6d4" stroke-width="2.4"/><text x="145" y="176.3" font-size="18" font-weight="500" fill="#1e2a44" text-anchor="middle">Aesthetics</text><rect x="255" y="135" width="190" height="70" rx="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.4"/><text x="350" y="176.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Change</text><rect x="460" y="135" width="190" height="70" rx="10" fill="#fff" stroke="#c9d6d4" stroke-width="2.4"/><text x="555" y="176.3" font-size="18" font-weight="500" fill="#1e2a44" text-anchor="middle">Communication</text><rect x="665" y="135" width="190" height="70" rx="10" fill="#fff" stroke="#c9d6d4" stroke-width="2.4"/><text x="760" y="176.3" font-size="18" font-weight="500" fill="#1e2a44" text-anchor="middle">Communities</text><rect x="50" y="227" width="190" height="70" rx="10" fill="#fff" stroke="#c9d6d4" stroke-width="2.4"/><text x="145" y="268.3" font-size="18" font-weight="500" fill="#1e2a44" text-anchor="middle">Connections</text><rect x="255" y="227" width="190" height="70" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.4" stroke-dasharray="7 5"/><text x="350" y="268.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Creativity</text><rect x="460" y="227" width="190" height="70" rx="10" fill="#fff" stroke="#c9d6d4" stroke-width="2.4"/><text x="555" y="268.3" font-size="18" font-weight="500" fill="#1e2a44" text-anchor="middle">Culture</text><rect x="665" y="227" width="190" height="70" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.4" stroke-dasharray="7 5"/><text x="760" y="268.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Development</text><rect x="50" y="319" width="190" height="70" rx="10" fill="#fff" stroke="#c9d6d4" stroke-width="2.4"/><text x="145" y="360.3" font-size="1