<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 800" width="900" height="800" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="800" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">From concepts to a statement of inquiry</text>

<rect x="30" y="110" width="260" height="140" rx="14" fill="#d4b02e" stroke="#8a6d0d" stroke-width="2.5"/><text x="160" y="150" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Key concept</text><text x="160" y="190" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">change</text><text x="305" y="190" font-size="30" font-weight="700" fill="#1e2a44" text-anchor="middle">+</text><rect x="320" y="110" width="260" height="140" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="150" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Related concepts</text><text x="450" y="190" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">conditions,</text><text x="450" y="212" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">consequences</text><text x="595" y="190" font-size="30" font-weight="700" fill="#1e2a44" text-anchor="middle">+</text><rect x="610" y="110" width="260" height="140" rx="14" fill="#dce9e7" stroke="#8a6d0d" stroke-width="2.5"/><text x="740" y="150" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Global context</text><text x="740" y="190" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">globalization and</text><text x="740" y="212" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">sustainability</text><text x="450" y="285" font-size="17" font-weight="600" fill="#4a5568" text-anchor="middle">Unit topic: acid rain and limestone buildings (chemistry)</text><rect x="30" y="305" width="840" height="100" rx="14" fill="#fbeee6" stroke="#b5602e" stroke-width="2.5"/><text x="55" y="342" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">✗ Weak</text><text x="160" y="342" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“Acid rain damages limestone.”</text><text x="55" y="378" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A fact about one topic: no concept, no global context.</text><rect x="30" y="420" width="840" height="150" rx="14" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.5"/><text x="55" y="457" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">✓ Better</text><text x="160" y="457" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“The conditions humans create in the environment can</text><text x="160" y="483" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">cause changes whose consequences reach far beyond</text><text x="160" y="509" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">their source.”</text><text x="55" y="552" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Uses change, conditions and consequences; would also fit ocean acidification.</text><text x="60" y="610" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Questions it generates</text><rect x="60" y="628" width="150" height="42" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="135" y="655" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Factual</text><text x="226" y="655" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">What gas forms when acid reacts with calcium carbonate?</text><rect x="60" y="680" width="150" height="42" rx="10" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="135" y="707" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Conceptual</text><text x="226" y="707" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">How do changes in conditions alter the rate of a chemical change?</text><rect x="60" y="732" width="150" height="42" rx="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="135" y="759" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Debatable</text><text x="226" y="759" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Should countries that cause acid rain pay for damage in neighbouring countries?</text>
</svg>