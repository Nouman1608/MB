<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 815" width="900" height="815" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="815" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Kinds of change in science</text>

<text x="320" y="140" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Biology</text><text x="540" y="140" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Chemistry</text><text x="760" y="140" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Physics</text><rect x="30" y="160" width="170" height="150" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.2"/><text x="115" y="241" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Reversible</text><rect x="210" y="160" width="210" height="150" rx="12" fill="#fff" stroke="#c9d6d4" stroke-width="2"/><text x="224" y="219" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Blood glucose rises</text><text x="224" y="241" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">after a meal, then</text><text x="224" y="263" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">falls back</text><rect x="430" y="160" width="210" height="150" rx="12" fill="#fff" stroke="#c9d6d4" stroke-width="2"/><text x="444" y="197" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Blue hydrated</text><text x="444" y="219" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">copper(II) sulfate</text><text x="444" y="241" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">turns white when</text><text x="444" y="263" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">heated; water turns it</text><text x="444" y="285" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">blue</text><rect x="650" y="160" width="210" height="150" rx="12" fill="#fff" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="230" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Ice melts and can be</text><text x="664" y="252" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">refrozen</text><rect x="30" y="320" width="170" height="150" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.2"/><text x="115" y="401" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Irreversible</text><rect x="210" y="320" width="210" height="150" rx="12" fill="#fff" stroke="#c9d6d4" stroke-width="2"/><text x="224" y="390" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A tadpole becomes a</text><text x="224" y="412" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">frog</text><rect x="430" y="320" width="210" height="150" rx="12" fill="#fff" stroke="#c9d6d4" stroke-width="2"/><text x="444" y="379" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Methane burns to</text><text x="444" y="401" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">carbon dioxide and</text><text x="444" y="423" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">water</text><rect x="650" y="320" width="210" height="150" rx="12" fill="#fff" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="379" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A spring stretched</text><text x="664" y="401" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">past its elastic limit</text><text x="664" y="423" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">stays longer</text><rect x="30" y="480" width="170" height="150" rx="12" fill="#f6d9c6" stroke="#1e2a44" stroke-width="2.2"/><text x="115" y="550" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle"></text><text x="115" y="572" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Self-perpetuating</text><rect x="210" y="480" width="210" height="150" rx="12" fill="#fff" stroke="#c9d6d4" stroke-width="2"/><text x="224" y="550" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Bacteria: each new</text><text x="224" y="572" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">cell can divide again</text><rect x="430" y="480" width="210" height="150" rx="12" fill="#fff" stroke="#c9d6d4" stroke-width="2"/><text x="444" y="550" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A fire: heat released</text><text x="444" y="572" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">ignites more fuel</text><rect x="650" y="480" width="210" height="150" rx="12" fill="#fff" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="539" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Fission chain</text><text x="664" y="561" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">reaction: neutrons</text><text x="664" y="583" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">split more nuclei</text><rect x="30" y="650" width="410" height="110" rx="14" fill="#fff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="686" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Qualitative: a difference in kind</text><text x="50" y="714" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">tadpole grows legs, loses its tail</text><rect x="460" y="650" width="410" height="110" rx="14" fill="#fff" stroke="#c9d6d4" stroke-width="2.5"/><text x="480" y="686" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Quantitative: a number or rate</text><text x="480" y="714" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">a falling ball’s speed rising</text><text x="450" y="790" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Change in science: the difference in a system’s state observed at two times.</text>
</svg>