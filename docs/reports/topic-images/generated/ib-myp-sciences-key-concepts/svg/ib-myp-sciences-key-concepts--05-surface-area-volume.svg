ze="15" font-weight="400" fill="#4a5568" text-anchor="middle">SA 96 cm²  V 64 cm³</text><rect x="540" y="450" width="120" height="38" rx="10" fill="#d4b02e" stroke="#8a6d0d" stroke-width="2"/><text x="600" y="476" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">1.5 : 1</text><text x="60" y="150" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Cells modelled as cubes</text><text x="60" y="176" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">SA:V = surface area ÷ volume</text><rect x="30" y="570" width="840" height="100" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="610" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Side doubles → SA:V halves</text><text x="450" y="642" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">so large animals need exchange surfaces such as alveoli</text>
</svg>