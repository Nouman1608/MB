<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 690" width="900" height="690" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="690" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Spoken multimodal text: heard, saw, music</text>

<line x1="150" y1="200" x2="850" y2="200" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="850" y="186" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">time</text><rect x="30" y="230" width="105" height="80" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.2"/><text x="82.5" y="275.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">HEARD</text><rect x="150" y="230" width="340" height="80" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="168" y="274" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“Our library is quiet.” (calm)</text><rect x="505" y="230" width="340" height="80" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="523" y="274" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“But it’s never boring.”</text><rect x="30" y="330" width="105" height="80" rx="10" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.2"/><text x="82.5" y="375.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">SAW</text><rect x="150" y="330" width="340" height="80" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="168" y="364" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">teenagers laughing round a game</text><text x="168" y="385" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">table</text><rect x="505" y="330" width="340" height="80" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="523" y="374" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">–</text><rect x="30" y="430" width="105" height="80" rx="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.2"/><text x="82.5" y="475.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">MUSIC</text><rect x="150" y="430" width="340" height="80" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="168" y="474" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">–</text><rect x="505" y="430" width="340" height="80" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="523" y="474" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">upbeat music starts on “but”</text><line x1="497" y1="180" x2="497" y2="525" stroke="#b5602e" stroke-width="3" stroke-dasharray="8 6"/><text x="497" y="172" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">the turn</text><rect x="30" y="545" width="840" height="120" rx="14" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.5"/><text x="55" y="580" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Interpretation</text><text x="55" y="610" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The image contrasts with “quiet”; the music marks the turn. Aimed at young people who think</text><text x="55" y="632" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">libraries are dull: it keeps quiet study and adds a social space.</text><text x="450" y="140" font-size="18" font-weight="600" fill="#4a5568" text-anchor="middle">Note what you SAW at the moment you HEARD a key phrase</text>
</svg>