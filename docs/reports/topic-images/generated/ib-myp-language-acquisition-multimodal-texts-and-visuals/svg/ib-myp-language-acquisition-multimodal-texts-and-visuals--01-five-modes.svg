<rect width="900" height="620" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Five modes that carry meaning</text>

<rect x="30" y="110" width="158" height="260" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="109" y="148" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Written</text><text x="109" y="186" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">headlines, body</text><text x="109" y="206" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">text, captions,</text><text x="109" y="226" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">labels</text><line x1="44" y1="268" x2="174" y2="268" stroke="#1e2a44" stroke-width="1.2" opacity="0.4"/><text x="109" y="296" font-size="14.5" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">e.g. the slogan</text><text x="109" y="315" font-size="14.5" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">on a poster</text><rect x="202" y="110" width="158" height="260" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="281" y="148" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Spoken</text><text x="281" y="186" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">voice, tone,</text><text x="281" y="206" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">pace, accent,</text><text x="281" y="226" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">pauses</text><line x1="216" y1="268" x2="346" y2="268" stroke="#1e2a44" stroke-width="1.2" opacity="0.4"/><text x="281" y="296" font-size="14.5" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">e.g. a presenter</text><text x="281" y="315" font-size="14.5" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">in a video</text><rect x="374" y="110" width="158" height="260" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="453" y="148" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Visual</text><text x="453" y="186" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">photos, drawings,</text><text x="453" y="206" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">colour, icons,</text><text x="453" y="226" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">logos</text><line x1="388" y1="268" x2="518" y2="268" stroke="#1e2a44" stroke-width="1.2" opacity="0.4"/><text x="453" y="296" font-size="14.5" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">e.g. a photo of a</text><text x="453" y="315" font-size="14.5" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">crowded beach</text><rect x="546" y="110" width="158" height="260" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="625" y="148" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Spatial</text><text x="625" y="186" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">layout, position,</text><text x="625" y="206" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">size, white</text><text x="625" y="226" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">space, order</text><line x1="560" y1="268" x2="690" y2="268" stroke="#1e2a44" stroke-width="1.2" opacity="0.4"/><text x="625" y="296" font-size="14.5" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">e.g. a headline</text><text x="625" y="315" font-size="14.5" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">placed above a</text><text x="625" y="334" font-size="14.5" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">photo</text><rect x="718" y="110" width="158" height="260" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="797" y="148" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Aural</text><text x="797" y="186" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">music, sound</text><text x="797" y="206" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">effects, silence</text><line x1="732" y1="268" x2="862" y2="268" stroke="#1e2a44" stroke-width="1.2" opacity="0.4"/><text x="797" y="296" font-size="14.5" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">e.g. traffic</text><text x="797" y="315" font-size="14.5" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">noise under a</text><text x="797" y="334" font-size="14.5" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">voice-over</text><rect x="30" y="390" width="840" height="92" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="428" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Multimodal = two or more modes combined</text><text x="450" y="458" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">posters, leaflets, web pages, infographics, adverts, video clips, comics</text><rect x="30" y="500" width="840" height="96" rx="14" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.5"/><text x="55" y="534" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">In the brief</text><text x="55" y="564" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">A: images and spatial aspects with oral text · B: written, spatial and visual aspects</text>
</svg>