"430" height="128" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2"/><text x="460" y="570" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">4 Values and attitudes</text><text x="460" y="598" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">values community and mutual support;</text><text x="460" y="618" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">encouraging to a reader who may feel isolated</text>
