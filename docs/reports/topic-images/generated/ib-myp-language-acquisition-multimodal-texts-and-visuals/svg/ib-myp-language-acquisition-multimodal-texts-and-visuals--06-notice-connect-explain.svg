<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 690" width="900" height="690" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="690" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Notice, connect, explain</text>

<rect x="30" y="110" width="265" height="150" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="162.5" y="148" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Notice</text><text x="162.5" y="178" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">one specific detail</text><text x="162.5" y="197" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">(denotation)</text><text x="162.5" y="238" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">“In the foreground …”</text><line x1="297" y1="185" x2="313" y2="185" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="315" y="110" width="265" height="150" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="447.5" y="148" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Connect</text><text x="447.5" y="178" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">to the words or the sound</text><text x="447.5" y="238" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">“This contrasts with …”</text><line x1="582" y1="185" x2="598" y2="185" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="600" y="110" width="265" height="150" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="732.5" y="148" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Explain</text><text x="732.5" y="178" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">effect on the audience;</text><text x="732.5" y="197" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">idea, value or attitude</text><text x="732.5" y="238" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">“This suggests … because …”</text><text x="450" y="300" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">How far you take it depends on your level (a rough guide)</text><rect x="30" y="318" width="190" height="102" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.2"/><text x="125" y="376" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Emergent</text><rect x="234" y="318" width="636" height="102" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="254" y="350" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">describe and give one simple reason</text><text x="254" y="378" font-size="15.5" font-weight="400" fill="#2e6b62" text-anchor="start" font-style="italic">“There is a man. He is happy. The poster is positive.”</text><rect x="30" y="434" width="190" height="102" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.2"/><text x="125" y="492" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Capable</text><rect x="234" y="434" width="636" height="102" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="254" y="466" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">link the visual to the words; explain the purpose</text><text x="254" y="494" font-size="15.5" font-weight="400" fill="#2e6b62" text-anchor="start" font-style="italic">“The man is smiling because the poster wants to show that repairing is</text><text x="254" y="514" font-size="15.5" font-weight="400" fill="#2e6b62" text-anchor="start" font-style="italic">fun.”</text><rect x="30" y="550" width="190" height="102" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.2"/><text x="125" y="608" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Proficient</text><rect x="234" y="550" width="636" height="102" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="254" y="582" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">implicit attitudes, effect on an audience, compare modes</text><text x="254" y="610" font-size="15.5" font-weight="400" fill="#2e6b62" text-anchor="start" font-style="italic">“The smiling faces soften the command in the headline, so the message</text><text x="254" y="630" font-size="15.5" font-weight="400" fill="#2e6b62" text-anchor="start" font-style="italic">feels like an invitation rather than a rule.”</text>
</svg>