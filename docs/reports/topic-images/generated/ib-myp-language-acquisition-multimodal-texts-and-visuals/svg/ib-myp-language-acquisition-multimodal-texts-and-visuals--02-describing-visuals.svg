<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 695" width="900" height="695" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="695" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Describing a visual: what to notice</text>

<rect x="30" y="110" width="270" height="110" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="148" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Subject</text><text x="50" y="176" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">who is the focus? what are</text><text x="50" y="195" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">they doing?</text><rect x="315" y="110" width="270" height="110" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="335" y="148" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Foreground / background</text><text x="335" y="176" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">what is placed first?</text><rect x="600" y="110" width="270" height="110" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="620" y="148" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Shot distance</text><text x="620" y="176" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">close-up, mid or long: why?</text><rect x="30" y="234" width="270" height="110" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="272" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Angle</text><text x="50" y="300" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">high, eye-level, low:</text><text x="50" y="319" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">powerful or small?</text><rect x="315" y="234" width="270" height="110" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="335" y="272" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Gaze</text><text x="335" y="300" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">invited in, or watching from</text><text x="335" y="319" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">outside?</text><rect x="600" y="234" width="270" height="110" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="620" y="272" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Colour</text><text x="620" y="300" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">what does it suggest in this</text><text x="620" y="319" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">culture?</text><rect x="30" y="358" width="270" height="110" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="396" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Typography</text><text x="50" y="424" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">which words shout, which</text><text x="50" y="443" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">whisper?</text><rect x="315" y="358" width="270" height="110" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="335" y="396" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Layout</text><text x="335" y="424" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">what does the eye see first,</text><text x="335" y="443" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">second, third?</text><rect x="600" y="358" width="270" height="110" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="620" y="396" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Symbols</text><text x="620" y="424" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">what does each icon or sign</text><text x="620" y="443" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">stand for?</text><rect x="30" y="490" width="840" height="180" rx="14" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.5"/><rect x="55" y="516" width="300" height="130" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="205" y="548" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Denotation</text><text x="205" y="572" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">what is literally there</text><text x="205" y="612" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">“a green headline”</text><line x1="360" y1="581" x2="420" y2="581" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><text x="390" y="566" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">then</text><rect x="425" y="516" width="420" height="130" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="635" y="548" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Connotation</text><text x="635" y="572" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">what it suggests: depends on culture</text><text x="635" y="612" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">nature, recycling or “go”</text>
</svg>