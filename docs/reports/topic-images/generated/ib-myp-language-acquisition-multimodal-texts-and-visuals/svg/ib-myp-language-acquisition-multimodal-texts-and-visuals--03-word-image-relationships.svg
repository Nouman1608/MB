<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" width="900" height="660" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="660" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four ways words and images work together</text>

<rect x="30" y="110" width="210" height="118" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="135" y="178" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="middle">Anchor</text><rect x="254" y="110" width="616" height="118" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="276" y="150" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">words fix the meaning of an open image</text><text x="276" y="182" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="start" font-style="italic">empty beach + “Escape the crowds” = peace; + “Where did the</text><text x="276" y="203" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="start" font-style="italic">tourists go?” = loss</text><rect x="30" y="244" width="210" height="118" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="135" y="312" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="middle">Reinforce</text><rect x="254" y="244" width="616" height="118" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="276" y="284" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">words and image say the same thing</text><text x="276" y="316" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="start" font-style="italic">the message gets stronger</text><rect x="30" y="378" width="210" height="118" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="135" y="446" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="middle">Extend</text><rect x="254" y="378" width="616" height="118" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="276" y="418" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">one mode adds what the other does not give</text><text x="276" y="450" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="start" font-style="italic">infographic chart shows the scale; text gives the reason</text><rect x="30" y="512" width="210" height="118" rx="12" fill="#f4d9c8" stroke="#1e2a44" stroke-width="2.5"/><text x="135" y="580" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="middle">Contrast</text><rect x="254" y="512" width="616" height="118" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="276" y="552" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">words and image pull against each other</text><text x="276" y="584" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="start" font-style="italic">often for humour, irony or shock</text>
</svg>