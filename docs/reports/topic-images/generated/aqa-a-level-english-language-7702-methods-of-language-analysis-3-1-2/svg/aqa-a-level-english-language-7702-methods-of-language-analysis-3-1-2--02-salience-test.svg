<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 710" width="900" height="710" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="710" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Is this feature salient?</text>

<rect x="320" y="115" width="260" height="56" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="150" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">A feature you notice</text><line x1="450" y1="171" x2="450" y2="200" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><polygon points="450,205 720,275 450,345 180,275" fill="#f2e7b8" stroke="#d4b02e" stroke-width="3"/><text x="450" y="262" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">If it were changed, would the</text><text x="450" y="285" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">representation or relationship change?</text><path d="M180,275 L120,275 L120,375" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><text x="150" y="262" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">yes</text><path d="M720,275 L780,275 L780,375" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><text x="750" y="262" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">no</text><rect x="40" y="385" width="300" height="80" rx="12" fill="#b5d3cf" stroke="#2e6b62" stroke-width="3"/><text x="190" y="418" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Salient</text><text x="190" y="446" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">analyse it</text><rect x="560" y="385" width="300" height="80" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="710" y="418" font-size="21" font-weight="700" fill="#4a5568" text-anchor="middle">Not salient</text><text x="710" y="446" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">leave it out</text><text x="450" y="520" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Usually more salient</text><rect x="40" y="540" width="400" height="110" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="64" y="575" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Repeated patterns</text><text x="64" y="605" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">a semantic field running through</text><text x="64" y="628" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">a text; a run of imperatives</text><rect x="460" y="540" width="400" height="110" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="484" y="575" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Marked choices</text><text x="484" y="605" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">a sudden shift in register;</text><text x="484" y="628" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">a single minor sentence</text><text x="450" y="685" font-size="18" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">than isolated features</text>
</svg>