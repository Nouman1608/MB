<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" width="900" height="760" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="760" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The six levels of language analysis</text>

<text x="170" y="130" font-size="17" font-weight="700" fill="#4a5568" text-anchor="middle">Level</text><text x="455" y="130" font-size="17" font-weight="700" fill="#4a5568" text-anchor="middle">Specification wording</text><text x="722" y="130" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">What it gives you in Paper 1</text><rect x="40" y="148" width="820" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="52" y="158" width="236" height="68" rx="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="170" y="187" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Phonetics, phonology</text><text x="170" y="208" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">and prosodics</text><text x="312" y="181.5" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">How speech sounds and effects</text><text x="312" y="202.5" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">are articulated and analysed</text><text x="592" y="171" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Sound patterning in written</text><text x="592" y="192" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">texts; stress, pitch, pace</text><text x="592" y="213" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and pauses in transcripts</text><rect x="40" y="248" width="820" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="52" y="258" width="236" height="68" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="170" y="298" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Graphology</text><text x="312" y="281.5" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">The visual aspects of textual</text><text x="312" y="302.5" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">design and appearance</text><text x="592" y="271" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Layout, typography, colour,</text><text x="592" y="292" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">images and their relation</text><text x="592" y="313" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">to words</text><rect x="40" y="348" width="820" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="52" y="358" width="236" height="68" rx="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="170" y="398" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Lexis and semantics</text><text x="312" y="371" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">The vocabulary of English,</text><text x="312" y="392" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">including social and</text><text x="312" y="413" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">historical variation</text><text x="592" y="371" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Word choice, connotation,</text><text x="592" y="392" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">semantic fields, register,</text><text x="592" y="413" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">older lexis</text><rect x="40" y="448" width="820" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="52" y="458" width="236" height="68" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="170" y="487" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Grammar, including</text><text x="170" y="508" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">morphology</text><text x="312" y="471" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">Structural patterns at</text><text x="312" y="492" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">sentence, clause, phrase and</text><text x="312" y="513" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">word level</text><text x="592" y="471" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Sentence functions, clause</text><text x="592" y="492" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">structure, noun and verb</text><text x="592" y="513" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">phrases, word formation</text><rect x="40" y="548" width="820" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="52" y="558" width="236" height="68" rx="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="170" y="598" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Pragmatics</text><text x="312" y="581.5" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">The contextual aspects of</text><text x="312" y="602.5" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">language use</text><text x="592" y="571" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Implied meaning,</text><text x="592" y="592" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">politeness, speech acts,</text><text x="592" y="613" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">assumed knowledge</text><rect x="40" y="648" width="820" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="52" y="658" width="236" height="68" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="170" y="698" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Discourse</text><text x="312" y="671" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">Extended stretches of</text><text x="312" y="692" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">communication in different</text><text x="312" y="713" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">genres, modes and contexts</text><text x="592" y="671" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Overall structure,</text><text x="592" y="692" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">cohesion, openings and</text><text x="592" y="713" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">closings, turn-taking</text>
</svg>