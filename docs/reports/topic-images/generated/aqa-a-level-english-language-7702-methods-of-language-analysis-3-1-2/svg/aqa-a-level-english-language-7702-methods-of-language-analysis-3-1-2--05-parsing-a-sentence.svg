<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 750" width="900" height="750" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="750" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Describing grammar precisely</text>

<rect x="60" y="130" width="120" height="50" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="120" y="163" font-size="20" font-weight="600" fill="#1e2a44" text-anchor="middle">The</text><rect x="194" y="130" width="130" height="50" rx="10" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="259" y="163" font-size="20" font-weight="600" fill="#1e2a44" text-anchor="middle">tired</text><rect x="338" y="130" width="140" height="50" rx="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="408" y="163" font-size="20" font-weight="600" fill="#1e2a44" text-anchor="middle">volunteers</text><rect x="492" y="130" width="296.8" height="50" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="640.4" y="163" font-size="20" font-weight="600" fill="#1e2a44" text-anchor="middle">who had worked all night</text><text x="120" y="208" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">determiner</text><text x="259" y="208" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">pre-modifier</text><text x="408" y="208" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">head</text><text x="640.4" y="208" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">post-modifier</text><text x="640.4" y="230" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">(relative clause)</text><path d="M60,246 L60,258 L788.8,258 L788.8,246" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><text x="424.4" y="284" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">noun phrase</text><rect x="60" y="320" width="170" height="50" rx="10" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="145" y="353" font-size="20" font-weight="600" fill="#1e2a44" text-anchor="middle">finally</text><rect x="244" y="320" width="240" height="50" rx="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="364" y="353" font-size="20" font-weight="600" fill="#1e2a44" text-anchor="middle">closed</text><rect x="498" y="320" width="140" height="50" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="568" y="353" font-size="20" font-weight="600" fill="#1e2a44" text-anchor="middle">the doors.</text><text x="145" y="398" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="middle">adverbial:</text><text x="145" y="418" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="middle">end of a long</text><text x="145" y="438" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="middle">effort</text><text x="364" y="398" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="middle">simple past, main verb;</text><text x="364" y="418" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="middle">dynamic, material process</text><rect x="40" y="462" width="820" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="64" y="496" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Two verb phrases</text><text x="300" y="496" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">"had worked": past perfect, placing the work before the closing</text><text x="300" y="528" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">"closed": simple past, the main verb</text><rect x="40" y="572" width="820" height="150" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="64" y="607" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">Not</text><text x="110" y="607" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"a long sentence"</text><text x="64" y="640" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">But</text><text x="110" y="640" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">a complex sentence with a post-modifying relative clause that delays</text><text x="110" y="665" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">the verb, so the volunteers' effort is foregrounded before the action,</text><text x="110" y="690" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">building sympathy and admiration.</text>
</svg>