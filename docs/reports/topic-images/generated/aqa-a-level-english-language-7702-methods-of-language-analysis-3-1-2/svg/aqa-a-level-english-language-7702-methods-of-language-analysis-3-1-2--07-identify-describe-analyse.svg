<rect width="900" height="650" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Identify, describe, analyse</text>

<rect x="40" y="115" width="820" height="104" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="80" cy="167" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="80" y="174.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="120" y="157" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Identify</text><text x="240" y="157" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">name the feature accurately</text><text x="120" y="193" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"a relative clause"</text><rect x="90" y="235" width="770" height="104" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="130" cy="287" r="22" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="130" y="294.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="170" y="277" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Describe</text><text x="290" y="277" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">say what it is and how it is formed</text><text x="170" y="313" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"a post-modifying relative clause in the noun phrase"</text><rect x="140" y="355" width="720" height="104" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><circle cx="180" cy="407" r="22" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="180" y="414.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="220" y="397" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Analyse</text><text x="340" y="397" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">explain how it creates meaning in context</text><text x="220" y="433" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"it delays the verb, so effort is foregrounded"</text><text x="450" y="495" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">Paper 1 analysis questions need all three</text><rect x="40" y="520" width="820" height="100" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="64" y="556" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Plan by meaning first, then select levels</text><text x="64" y="588" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Decide what the text represents, then find the salient features that build it.</text>
</svg>