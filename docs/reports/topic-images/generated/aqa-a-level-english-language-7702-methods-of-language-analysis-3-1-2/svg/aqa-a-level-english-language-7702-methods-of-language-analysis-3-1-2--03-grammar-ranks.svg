<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 543" width="900" height="543" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="543" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Grammar: work up through the ranks</text>

<rect x="110" y="115" width="750" height="82" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="126" y="127" width="130" height="58" rx="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="191" y="163" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Sentence</text><text x="276" y="147" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">functions: declarative, interrogative, imperative, exclamative</text><text x="276" y="171" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">structures: simple, compound, complex, compound-complex, minor</text><rect x="110" y="211" width="750" height="82" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="126" y="223" width="130" height="58" rx="10" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="191" y="259" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Clause</text><text x="276" y="243" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">elements: subject, verb, object, complement, adverbial</text><text x="276" y="267" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">main and subordinate clauses; fronted adverbials</text><rect x="110" y="307" width="750" height="82" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="126" y="319" width="130" height="58" rx="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="191" y="355" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Phrase</text><text x="276" y="339" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">noun phrase: determiner, pre-modifier, head, post-modifier</text><text x="276" y="363" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">verb phrase: tense, aspect, modality, voice</text><rect x="110" y="403" width="750" height="106" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="126" y="415" width="130" height="82" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="191" y="463" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Word</text><text x="276" y="435" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">word classes: concrete and abstract nouns, dynamic and stative verbs,</text><text x="276" y="459" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">modal verbs, adverbs of degree; morphology: prefixes, suffixes,</text><text x="276" y="483" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">compounds, coinages such as "staycation"</text><line x1="70" y1="503" x2="70" y2="130" stroke="#2e6b62" stroke-width="5" marker-end="url(#ahT)"/><text x="58" y="316.5" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle" transform="rotate(-90 52 316.5)">work up through the ranks</text>
</svg>