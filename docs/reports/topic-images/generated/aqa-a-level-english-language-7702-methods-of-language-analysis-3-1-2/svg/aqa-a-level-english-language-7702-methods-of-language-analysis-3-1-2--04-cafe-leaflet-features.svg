<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 729" width="900" height="729" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="729" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Salient features in a café leaflet</text>

<text x="330" y="128" font-size="16" font-weight="700" fill="#4a5568" text-anchor="middle">The text (original, written for the lesson)</text><text x="705" y="128" font-size="16" font-weight="700" fill="#4a5568" text-anchor="middle">Salient feature</text><rect x="150" y="145" width="360" height="64" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="168" y="183.5" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">Pull up a chair.</text><line x1="512" y1="177" x2="540" y2="177" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="548" y="145" width="312" height="64" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="564" y="173" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Grammar: opening imperative</text><text x="564" y="194" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Lexis: domestic, informal</text><rect x="150" y="221" width="360" height="76" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="168" y="253" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">At The Kettle, nobody's a</text><text x="168" y="278" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">stranger for long.</text><line x1="512" y1="259" x2="540" y2="259" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="548" y="221" width="312" height="76" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="564" y="255" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Pragmatics: implies newcomers</text><text x="564" y="276" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">are welcomed quickly</text><rect x="150" y="309" width="360" height="126" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="168" y="341" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">Our volunteers bake fresh every</text><text x="168" y="366" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">morning, our tea is always</text><text x="168" y="391" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">brewing, and every penny goes</text><text x="168" y="416" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">back into the neighbourhood.</text><line x1="512" y1="372" x2="540" y2="372" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="548" y="309" width="312" height="126" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="564" y="368" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Grammar: tricolon of parallel</text><text x="564" y="389" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">clauses with "our" as determiner</text><rect x="150" y="447" width="360" height="64" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="168" y="485.5" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">Pop in.</text><line x1="512" y1="479" x2="540" y2="479" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="548" y="447" width="312" height="64" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="564" y="475" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Grammar: closing imperative</text><text x="564" y="496" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Lexis: domestic, informal</text><rect x="150" y="523" width="360" height="64" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="168" y="561.5" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">You'll be glad you did.</text><line x1="512" y1="555" x2="540" y2="555" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="548" y="523" width="312" height="64" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="564" y="551" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Pragmatics: presupposes</text><text x="564" y="572" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the reader will visit</text><path d="M130,149 L118,149 L118,583 L130,583" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="60" y="183" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">Invitation</text><text x="60" y="334" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">Reasons</text><text x="60" y="523" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">Invitation</text><rect x="40" y="607" width="820" height="96" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="64" y="643" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Discourse: circular structure, invitation, reasons, invitation</text><text x="64" y="675" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Overall: the café is represented as an extension of home.</text>
</svg>