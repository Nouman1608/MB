<rect width="900" height="594" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Two approaches to studying society</text>

<text x="195" y="126" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="middle">Positivism</text><text x="705" y="126" font-size="21" font-weight="700" fill="#8a6d0d" text-anchor="middle">Interpretivism</text><rect x="30" y="144" width="330" height="68" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="195" y="171.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Macro: social facts shape</text><text x="195" y="193.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">behaviour</text><rect x="540" y="144" width="330" height="68" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="705" y="171.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Micro: society made through</text><text x="705" y="193.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">interaction</text><rect x="378" y="159" width="144" height="38" rx="19" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="184" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">View</text><line x1="360" y1="178" x2="378" y2="178" stroke="#1e2a44" stroke-width="2.5"/><line x1="522" y1="178" x2="540" y2="178" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="224" width="330" height="46" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="195" y="251.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Patterns, trends, causes</text><rect x="540" y="224" width="330" height="46" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="705" y="251.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Meanings and motivations</text><rect x="378" y="228" width="144" height="38" rx="19" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="253" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Focus</text><line x1="360" y1="247" x2="378" y2="247" stroke="#1e2a44" stroke-width="2.5"/><line x1="522" y1="247" x2="540" y2="247" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="282" width="330" height="46" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="195" y="309.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Quantitative</text><rect x="540" y="282" width="330" height="46" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="705" y="309.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Qualitative, in-depth</text><rect x="378" y="286" width="144" height="38" rx="19" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="311" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Data</text><line x1="360" y1="305" x2="378" y2="305" stroke="#1e2a44" stroke-width="2.5"/><line x1="522" y1="305" x2="540" y2="305" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="340" width="330" height="46" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="195" y="367.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Objectivity and reliability</text><rect x="540" y="340" width="330" height="46" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="705" y="367.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Validity and verstehen</text><rect x="378" y="344" width="144" height="38" rx="19" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="369" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Aim</text><line x1="360" y1="363" x2="378" y2="363" stroke="#1e2a44" stroke-width="2.5"/><line x1="522" y1="363" x2="540" y2="363" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="398" width="330" height="68" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="195" y="425.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Townsend (1979): large household</text><text x="195" y="447.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">survey</text><rect x="540" y="398" width="330" height="68" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="705" y="425.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Goffman, Asylums (1961): fieldwork</text><text x="705" y="447.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">in a psychiatric hospital</text><rect x="378" y="413" width="144" height="38" rx="19" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="438" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Example</text><line x1="360" y1="432" x2="378" y2="432" stroke="#1e2a44" stroke-width="2.5"/><line x1="522" y1="432" x2="540" y2="432" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="484" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="517.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Verstehen: Max Weber’s term for empathetic understanding. Interpretivists accept some</text><text x="50" y="539.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">subjectivity in return for greater validity.</text>
</svg>