<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 546" width="900" height="546" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="546" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The positivist route: sociology as a science</text>

<rect x="30" y="104" width="180" height="108" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="120" y="150.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Form a</text><text x="120" y="174.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">hypothesis</text><line x1="216" y1="158" x2="244" y2="158" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="250" y="104" width="180" height="108" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="340" y="138.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Collect</text><text x="340" y="162.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">quantitative</text><text x="340" y="186.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">data</text><line x1="436" y1="158" x2="464" y2="158" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="470" y="104" width="180" height="108" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="560" y="138.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Look for</text><text x="560" y="162.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">patterns and</text><text x="560" y="186.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">trends</text><line x1="656" y1="158" x2="684" y2="158" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="690" y="104" width="180" height="108" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="780" y="138.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Test</text><text x="780" y="162.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">correlation</text><text x="780" y="186.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">and causation</text><rect x="30" y="230" width="410" height="133" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="263" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">VIEW</text><text x="50" y="289.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Macro</text><text x="50" y="317.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Society as a structure of social facts, such</text><text x="50" y="338.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">as the class system, that shape behaviour</text><rect x="460" y="230" width="410" height="133" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="480" y="263" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">GOOD RESEARCH IS</text><text x="480" y="289.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Objective and reliable</text><text x="480" y="317.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Free from the researcher’s values, and</text><text x="480" y="338.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">repeatable</text><rect x="30" y="381" width="840" height="135" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="414" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">EXAMPLE</text><text x="50" y="440.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Peter Townsend, Poverty in the United Kingdom (1979)</text><text x="50" y="469.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">A large household survey with standardised questions measured how many people lacked items</text><text x="50" y="491.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">most of society regarded as normal, and allowed comparison between groups.</text>
</svg>