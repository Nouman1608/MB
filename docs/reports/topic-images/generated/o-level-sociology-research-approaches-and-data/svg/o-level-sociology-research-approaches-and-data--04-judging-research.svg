<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 568" width="900" height="568" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="568" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Seven questions to ask about any research</text>

<rect x="30" y="104" width="410" height="159" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="137" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">THE RESEARCHER</text><text x="50" y="167.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="167.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Bias: have the researcher’s values</text><text x="66.15" y="189.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">affected questions or conclusions?</text><text x="50" y="216.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="216.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Interviewer effect: does who asks change</text><text x="66.15" y="238.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">the answer?</text><rect x="460" y="104" width="410" height="159" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="480" y="137" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">THE PEOPLE STUDIED</text><text x="480" y="167.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="496.15" y="167.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Hawthorne / observer effect: are people</text><text x="496.15" y="189.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">acting differently because they are</text><text x="496.15" y="211.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">watched?</text><text x="480" y="238.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="496.15" y="238.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Validity: is this a true picture?</text><rect x="30" y="281" width="410" height="159" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="314" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">THE RESULTS</text><text x="50" y="344.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="344.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Reliability: would the same results come</text><text x="66.15" y="366.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">again?</text><rect x="460" y="281" width="410" height="159" rx="14" fill="#ffffff" stroke="#2b5a9a" stroke-width="2.5"/><text x="480" y="314" font-size="15" font-weight="700" fill="#2b5a9a" text-anchor="start">THE SAMPLE</text><text x="480" y="344.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="496.15" y="344.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Representativeness: is the sample</text><text x="496.15" y="366.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">typical?</text><text x="480" y="393.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="496.15" y="393.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Generalisability: can findings apply</text><text x="496.15" y="415.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">more widely?</text><rect x="30" y="458" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="491.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Validity example: students say they study three hours a night when they do not, so the</text><text x="50" y="513.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">answers are not a true picture.</text>
</svg>