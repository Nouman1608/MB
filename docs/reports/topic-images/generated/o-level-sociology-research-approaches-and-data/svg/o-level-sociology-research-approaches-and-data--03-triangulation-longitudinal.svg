<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Two ways to combine and extend research</text>

<rect x="30" y="110" width="410" height="400" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="460" y="110" width="410" height="400" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="55" y="148" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Triangulation</text><text x="55" y="172" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Several methods cross-check one topic</text><circle cx="235" cy="325" r="60" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="235" y="322" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Why join</text><text x="235" y="340" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">the church?</text><rect x="163" y="188" width="144" height="60" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="235" y="214" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Participant</text><text x="235" y="234" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">observation</text><line x1="235" y1="254" x2="235" y2="259" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><rect x="43" y="400" width="144" height="60" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="115" y="426" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">In-depth</text><text x="115" y="446" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">interviews</text><line x1="146.60822117768888" y1="406.29383411673336" x2="185.32993814934608" y2="368.4613041193222" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><rect x="283" y="400" width="144" height="60" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="355" y="426" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Question-</text><text x="355" y="446" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">naires</text><line x1="323.39177882231115" y1="406.29383411673336" x2="284.67006185065395" y2="368.4613041193222" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><text x="235" y="490" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Eileen Barker, The Making of a Moonie (1984)</text><text x="485" y="148" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Longitudinal study</text><text x="485" y="172" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The same people followed over time</text><line x1="490" y1="380" x2="850" y2="380" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><text x="850" y="366" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end">time</text><circle cx="518" cy="306" r="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><rect x="508" y="316" width="20" height="22" rx="7" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="562" cy="306" r="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><rect x="552" y="316" width="20" height="22" rx="7" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="540" cy="380" r="7" fill="#1e2a44"/><text x="540" y="406" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">start</text><circle cx="638" cy="295.8" r="10.4" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><rect x="625" y="308.8" width="26" height="28.6" rx="9.1" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="682" cy="295.8" r="10.4" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><rect x="669" y="308.8" width="26" height="28.6" rx="9.1" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="660" cy="380" r="7" fill="#1e2a44"/><text x="660" y="406" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">later</text><circle cx="758" cy="285.6" r="12.8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><rect x="742" y="301.6" width="32" height="35.2" rx="11.200000000000001" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="780" cy="380" r="7" fill="#1e2a44"/><text x="780" y="406" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">later still</text><circle cx="802" cy="296" r="22" fill="none" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="4 3"/><text x="802" y="262" font-size="15" font-weight="600" fill="#b5602e" text-anchor="middle">drop-out</text><text x="485" y="440" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">Young Lives (from 2002): about 12,000</text><text x="485" y="460" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">children in Ethiopia, India, Peru, Vietnam</text><text x="485" y="218" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="start">+ shows change and sequence</text><text x="485" y="242" font-size="17" font-weight="600" fill="#b5602e" text-anchor="start">− costly; participants drop out</text>
