<rect width="900" height="606" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Five steps for data questions</text>

<rect x="30" y="110" width="470" height="420" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="60" y="140" width="410" height="40" rx="6" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="265" y="166" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Title</text><line x1="110" y1="210" x2="110" y2="440" stroke="#1e2a44" stroke-width="3"/><line x1="110" y1="440" x2="450" y2="440" stroke="#1e2a44" stroke-width="3"/><rect x="140" y="320" width="50" height="120" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><rect x="220" y="280" width="50" height="160" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><rect x="300" y="265" width="50" height="175" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><rect x="380" y="225" width="50" height="215" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><path d="M165,305 L245,265 L325,250 L405,210" fill="none" stroke="#b5602e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 6"/><text x="100" y="230" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">% or</text><text x="100" y="248" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">number?</text><rect x="60" y="470" width="410" height="40" rx="6" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="265" y="496" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Source and date</text><text x="215" y="235" font-size="15" font-weight="600" fill="#b5602e" text-anchor="middle">overall trend</text><line x1="547" y1="130" x2="547" y2="556" stroke="#c9d6d4" stroke-width="4"/><rect x="593" y="110" width="277" height="58" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="613" y="143.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Read title, source, date</text><circle cx="547" cy="139" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="547" y="147.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="593" y="176" width="277" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="613" y="209.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">What is measured?</text><text x="613" y="236" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Percentages or numbers?</text><circle cx="547" cy="218" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="547" y="226.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="593" y="268" width="277" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="613" y="301.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Quote figures accurately</text><text x="613" y="328" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">With units</text><circle cx="547" cy="310" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="547" y="318.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="593" y="360" width="277" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="613" y="393.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Overall trend first</text><text x="613" y="420" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Then detail</text><circle cx="547" cy="402" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="547" y="410.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="593" y="452" width="277" height="124" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="613" y="485.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Explain a limitation</text><text x="613" y="512" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Sample size, date, missing</text><text x="613" y="532" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">groups, definitions,</text><text x="613" y="552" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">correlation vs causation</text><circle cx="547" cy="514" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="547" y="522.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text>
</svg>