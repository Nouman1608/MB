<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 705" width="900" height="705" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="705" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four kinds of data</text>

<text x="372.5" y="136" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">Quantitative (numbers)</text><text x="712.5" y="136" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="middle">Qualitative (words, images)</text><text x="30" y="241" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Primary</text><text x="30" y="265" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">collected first-hand</text><text x="30" y="446" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Secondary</text><text x="30" y="470" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">already exists</text><rect x="210" y="150" width="325" height="190" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="372.5" y="213.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Townsend’s household survey</text><text x="372.5" y="237.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">(1979)</text><text x="372.5" y="265.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Large; standardised questions</text><text x="372.5" y="286.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">allow comparison</text><rect x="550" y="150" width="325" height="190" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="712.5" y="213.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Goffman’s fieldwork in</text><text x="712.5" y="237.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Asylums (1961)</text><text x="712.5" y="265.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Rich detail on patients’</text><text x="712.5" y="286.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">experiences</text><rect x="210" y="355" width="325" height="190" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="372.5" y="418.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Official statistics, e.g.</text><text x="372.5" y="442.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Pakistan’s 2023 census</text><text x="372.5" y="470.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">National coverage, collected</text><text x="372.5" y="491.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">regularly</text><rect x="550" y="355" width="325" height="190" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="712.5" y="418.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Personal documents:</text><text x="712.5" y="442.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">diaries, letters</text><text x="712.5" y="470.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Reveal meaning; may be</text><text x="712.5" y="491.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">unrepresentative</text><rect x="30" y="565" width="410" height="110" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="599.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Primary data</text><text x="50" y="627.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">+ fits the research aims; up to date</text><text x="50" y="650.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">− time-consuming, costly; access difficult</text><rect x="460" y="565" width="410" height="110" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="480" y="599.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Secondary data</text><text x="480" y="627.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">+ cheap; large populations or the past</text><text x="480" y="650.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">− not designed for the research</text>
</svg>