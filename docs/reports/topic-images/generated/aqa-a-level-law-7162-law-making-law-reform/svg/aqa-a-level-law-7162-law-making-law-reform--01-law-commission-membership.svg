<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 609" width="900" height="609" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="609" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Who makes up the Law Commission?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Independent body created by the Law Commissions Act 1965</text>
<rect x="250" y="124" width="400" height="76" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="152" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">CHAIR</text><text x="450" y="178.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">A High Court or Court of Appeal judge</text><line x1="450" y1="206" x2="450" y2="226" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="248" width="840" height="76" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="276" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">FOUR OTHER COMMISSIONERS</text><text x="450" y="302.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Chosen from judges, practising lawyers and legal academics</text><line x1="450" y1="330" x2="450" y2="350" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="170" y="372" width="270" height="71" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="305" y="398" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">SUPPORTED BY</text><text x="305" y="424.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Research lawyers</text><rect x="460" y="372" width="270" height="71" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="595" y="398" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">SUPPORTED BY</text><text x="595" y="424.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Parliamentary draftsmen</text><text x="450" y="489" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Section 3 duty: review the law “with a view to its systematic development and reform”, including</text><rect x="31.384000000000015" y="507" width="115.552" height="30" rx="15" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="89.16000000000003" y="527.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">codification</text><rect x="156.93600000000004" y="507" width="192" height="30" rx="15" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="252.93600000000004" y="527.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">eliminating anomalies</text><rect x="358.93600000000004" y="507" width="263.168" height="30" rx="15" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="490.52000000000004" y="527.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">repealing obsolete enactments</text><rect x="632.104" y="507" width="236.512" height="30" rx="15" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="750.36" y="527.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">fewer separate enactments</text><rect x="313.344" y="547" width="128.048" height="30" rx="15" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="377.368" y="567.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">simplification</text><rect x="451.392" y="547" width="135.264" height="30" rx="15" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="519.024" y="567.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">modernisation</text>
</svg>