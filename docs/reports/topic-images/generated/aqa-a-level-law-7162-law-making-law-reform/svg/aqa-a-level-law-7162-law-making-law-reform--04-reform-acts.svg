<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 798" width="900" height="798" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="798" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Reform in action: Acts from Commission reports</text>

<line x1="80" y1="136.5" x2="80" y2="649.5" stroke="#c9d6d4" stroke-width="4"/><rect x="152" y="100" width="718" height="73" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="165" y="127.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Computer Misuse Act 1990</text><text x="165" y="155.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">offences of unauthorised access to computers</text><rect x="30" y="116.5" width="100" height="40" rx="20" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="80" y="143.5" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">1990</text><rect x="152" y="182" width="718" height="73" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="165" y="209.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Law Reform (Year and a Day Rule) Act 1996</text><text x="165" y="237.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">abolished the year and a day rule for murder</text><rect x="30" y="198.5" width="100" height="40" rx="20" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="80" y="225.5" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">1996</text><rect x="152" y="264" width="718" height="73" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="165" y="291.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Contracts (Rights of Third Parties) Act 1999</text><text x="165" y="319.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">third parties can enforce terms made for their benefit</text><rect x="30" y="280.5" width="100" height="40" rx="20" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="80" y="307.5" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">1999</text><rect x="152" y="346" width="718" height="73" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="165" y="373.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Fraud Act 2006</text><text x="165" y="401.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">a general offence of fraud replaced complex deception offences</text><rect x="30" y="362.5" width="100" height="40" rx="20" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="80" y="389.5" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">2006</text><rect x="152" y="428" width="718" height="94" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="165" y="455.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Coroners and Justice Act 2009</text><text x="165" y="483.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">partly implemented <tspan font-style="italic">Murder,</tspan> <tspan font-style="italic">Manslaughter</tspan> <tspan font-style="italic">and</tspan> <tspan font-style="italic">Infanticide</tspan> (2006): loss of control replaced</text><text x="165" y="504.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">provocation; diminished responsibility redefined</text><rect x="30" y="455" width="100" height="40" rx="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="80" y="482" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">2009</text><rect x="152" y="531" width="718" height="73" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="165" y="558.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Electronic Trade Documents Act 2023</text><text x="165" y="586.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">electronic trade documents given the same status as paper</text><rect x="30" y="547.5" width="100" height="40" rx="20" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="80" y="574.5" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">2023</text><rect x="152" y="613" width="718" height="73" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="165" y="640.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Automated Vehicles Act 2024</text><text x="165" y="668.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">joint report with the Scottish Law Commission on self-driving vehicles</text><rect x="30" y="629.5" width="100" height="40" rx="20" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="80" y="656.5" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">2024</text><rect x="30" y="708" width="840" height="58" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="741.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle"><tspan font-weight="700" fill="#1e2a44">Partial</tspan> <tspan font-weight="700" fill="#1e2a44">implementation</tspan> (as in 2009) can leave gaps in the law.</text>
</svg>