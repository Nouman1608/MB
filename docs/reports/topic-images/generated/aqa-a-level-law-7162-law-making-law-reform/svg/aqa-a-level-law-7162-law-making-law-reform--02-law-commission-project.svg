<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 797" width="900" height="797" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="797" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How a Law Commission project works</text>

<line x1="60" y1="120" x2="60" y2="542" stroke="#c9d6d4" stroke-width="4"/><rect x="104" y="100" width="766" height="97" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="118" y="128.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Choosing the work</text><text x="118" y="157.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Programmes of law reform (after public consultation, approved by the Lord Chancellor) or</text><text x="118" y="178.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">references from government departments</text><circle cx="60" cy="148.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="157.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="104" y="207" width="766" height="76" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="118" y="235.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Research and scoping</text><text x="118" y="264.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Current law, its problems, and how other legal systems deal with the issue</text><circle cx="60" cy="245" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="253.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="104" y="293" width="766" height="97" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="118" y="321.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Consultation paper</text><text x="118" y="350.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Provisional proposals; responses from judges, lawyers, academics, interest groups and the</text><text x="118" y="371.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">public</text><circle cx="60" cy="341.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="350.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="104" y="400" width="766" height="76" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="118" y="428.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Final report</text><text x="118" y="457.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Recommendations, usually with a draft Bill</text><circle cx="60" cy="438" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="446.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="104" y="486" width="766" height="76" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="118" y="514.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Government response and implementation</text><text x="118" y="543.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Government decides whether to accept and whether to find parliamentary time for a Bill</text><circle cx="60" cy="524" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="532.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="30" y="606" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Later changes to improve implementation</text><rect x="30" y="622" width="270.6666666666667" height="143" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="650" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">LAW COMMISSION ACT 2009</text><text x="46" y="681.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Lord Chancellor reports to</text><text x="46" y="702.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Parliament each year on</text><text x="46" y="723.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">implementation</text><rect x="314.6666666666667" y="622" width="270.6666666666667" height="143" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="330.6666666666667" y="650" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">2010 PROTOCOL</text><text x="330.6666666666667" y="681.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Department must support a</text><text x="330.6666666666667" y="702.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">project before it starts;</text><text x="330.6666666666667" y="723.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">ministers must respond to the</text><text x="330.6666666666667" y="744.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">report</text><rect x="599.3333333333334" y="622" width="270.6666666666667" height="143" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="615.3333333333334" y="650" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">HOUSE OF LORDS</text><text x="615.3333333333334" y="681.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Special committee procedure</text><text x="615.3333333333334" y="702.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">for uncontroversial</text><text x="615.3333333333334" y="723.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Commission Bills</text>
</svg>