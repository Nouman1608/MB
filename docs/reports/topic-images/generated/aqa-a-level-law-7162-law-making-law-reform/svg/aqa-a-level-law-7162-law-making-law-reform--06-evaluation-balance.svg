<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 558" width="900" height="558" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="558" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Weighing reform through the Law Commission</text>

<rect x="30" y="100" width="410" height="293" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ADVANTAGES</text><text x="50" y="164.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="66.15" y="164.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Independent</tspan> of political parties</text><text x="50" y="193.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="66.15" y="193.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Expert</tspan> and thoroughly researched</text><text x="50" y="222.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="66.15" y="222.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Wide</tspan> <tspan font-weight="700" fill="#1e2a44">consultation</tspan> adds quality and</text><text x="66.15" y="244.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">legitimacy</text><text x="50" y="273.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="66.15" y="273.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Draft</tspan> <tspan font-weight="700" fill="#1e2a44">Bills</tspan> save government time</text><text x="50" y="302.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="66.15" y="302.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Whole-area</tspan> <tspan font-weight="700" fill="#1e2a44">review</tspan>, unlike judges</text><text x="50" y="331.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="66.15" y="331.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Handles <tspan font-weight="700" fill="#1e2a44">technical,</tspan> <tspan font-weight="700" fill="#1e2a44">low-profile</tspan> areas</text><text x="50" y="360.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="66.15" y="360.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Clearer</tspan> <tspan font-weight="700" fill="#1e2a44">statute</tspan> <tspan font-weight="700" fill="#1e2a44">book</tspan></text><rect x="460" y="100" width="410" height="293" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="480" y="132" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">DISADVANTAGES</text><text x="480" y="164.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="496.15" y="164.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">No</tspan> <tspan font-weight="700" fill="#1e2a44">power</tspan> <tspan font-weight="700" fill="#1e2a44">to</tspan> <tspan font-weight="700" fill="#1e2a44">implement</tspan>: Offences Against</text><text x="496.15" y="186.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">the Person reports and draft Criminal Code</text><text x="496.15" y="208.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">shelved</text><text x="480" y="237.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="496.15" y="237.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Delay</tspan>, and partial implementation</text><text x="480" y="266.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="496.15" y="266.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Political</tspan> <tspan font-weight="700" fill="#1e2a44">reluctance</tspan> on controversial crime</text><text x="496.15" y="288.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">reforms</text><text x="480" y="317.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="496.15" y="317.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Codification</tspan> <tspan font-weight="700" fill="#1e2a44">has</tspan> <tspan font-weight="700" fill="#1e2a44">failed</tspan></text><text x="480" y="346.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="496.15" y="346.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Selection</tspan> <tspan font-weight="700" fill="#1e2a44">of</tspan> <tspan font-weight="700" fill="#1e2a44">work</tspan> depends on government</text><text x="496.15" y="368.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">support (2010 protocol)</text><rect x="30" y="415" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="449.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Balancing point</text><text x="50" y="479.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Annual implementation reports, the 2010 protocol and the Lords procedure have raised the rate at</text><text x="50" y="501.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">which reports become law, so the main disadvantage is <tspan font-weight="700" fill="#1e2a44">reduced</tspan> <tspan font-weight="700" fill="#1e2a44">but</tspan> <tspan font-weight="700" fill="#1e2a44">not</tspan> <tspan font-weight="700" fill="#1e2a44">removed</tspan>.</text>
</svg>