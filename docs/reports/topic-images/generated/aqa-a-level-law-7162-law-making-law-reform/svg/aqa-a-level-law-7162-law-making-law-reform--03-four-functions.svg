<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 406" width="900" height="406" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="406" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The four functions of the Law Commission</text>

<rect x="30" y="100" width="412" height="129" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="130" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">REFORM</text><text x="48" y="156.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Change the law to improve it</text><text x="48" y="185.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Usually a new Act based on a Commission report,</text><text x="48" y="206.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">e.g. Fraud Act 2006</text><rect x="458" y="100" width="412" height="129" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="476" y="130" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">CODIFICATION</text><text x="476" y="156.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">All the law on a topic in one code</text><text x="476" y="185.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Statute and case law together. Draft Criminal</text><text x="476" y="206.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Code 1989: never enacted</text><rect x="30" y="245" width="412" height="129" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="275" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CONSOLIDATION</text><text x="48" y="301.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Several Acts into one Act</text><text x="48" y="330.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">No change in substance. Sentencing Act 2020,</text><text x="48" y="351.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the Sentencing Code</text><rect x="458" y="245" width="412" height="129" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="476" y="275" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">REPEAL</text><text x="476" y="301.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Remove obsolete and unnecessary laws</text><text x="476" y="330.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Statute Law (Repeals) Bills: thousands of spent</text><text x="476" y="351.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">provisions removed</text>
</svg>