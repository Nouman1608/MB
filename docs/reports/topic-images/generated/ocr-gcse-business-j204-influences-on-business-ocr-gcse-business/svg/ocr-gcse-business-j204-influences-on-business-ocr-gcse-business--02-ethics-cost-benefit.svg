<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" width="900" height="760" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="760" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Ethics: a cost now, a possible benefit later</text>

<text x="410" y="132" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">Possible cost</text><text x="720" y="132" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Possible benefit</text><rect x="30" y="148" width="220" height="86" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="140" y="193.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Workers</text><rect x="266" y="148" width="290" height="86" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="284" y="180.2" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Higher wages, training, safer</text><text x="284" y="203.2" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">equipment</text><text x="572" y="200" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">→</text><rect x="590" y="148" width="280" height="86" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="608" y="180.2" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Motivation, lower turnover,</text><text x="608" y="203.2" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">easier recruitment</text><rect x="30" y="248" width="220" height="86" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="140" y="293.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Suppliers</text><rect x="266" y="248" width="290" height="86" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="284" y="291.7" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Fair prices, paid on time</text><text x="572" y="300" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">→</text><rect x="590" y="248" width="280" height="86" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="608" y="280.2" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Reliable supply, better</text><text x="608" y="303.2" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">quality, goodwill</text><rect x="30" y="348" width="220" height="86" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="140" y="393.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Customers</text><rect x="266" y="348" width="290" height="86" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="284" y="380.2" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Honest labelling, no hidden</text><text x="284" y="403.2" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">charges</text><text x="572" y="400" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">→</text><rect x="590" y="348" width="280" height="86" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="608" y="380.2" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Trust, repeat custom, fewer</text><text x="608" y="403.2" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">complaints</text><rect x="30" y="448" width="220" height="86" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="140" y="481.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Sourcing of</text><text x="140" y="505.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">materials</text><rect x="266" y="448" width="290" height="86" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="284" y="480.2" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Certified or traceable inputs</text><text x="284" y="503.2" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">cost more</text><text x="572" y="500" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">→</text><rect x="590" y="448" width="280" height="86" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="608" y="480.2" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A selling point that may</text><text x="608" y="503.2" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">justify a higher price</text><rect x="30" y="548" width="220" height="86" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="140" y="581.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Marketing</text><text x="140" y="605.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">decisions</text><rect x="266" y="548" width="290" height="86" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="284" y="580.2" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Giving up misleading claims</text><text x="284" y="603.2" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">or pressure selling</text><text x="572" y="600" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">→</text><rect x="590" y="548" width="280" height="86" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="608" y="580.2" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A reputation that protects</text><text x="608" y="603.2" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">long-term sales</text><rect x="30" y="660" width="840" height="70" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="703" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">The balance between cost and benefit depends on the business.</text>
</svg>