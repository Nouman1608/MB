<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 789" width="900" height="789" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="789" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Pennant Cycles: facing cheaper imports</text>

<rect x="30" y="110" width="410" height="110" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="235" y="150" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Pennant Cycles</text><text x="235" y="190" font-size="22" font-weight="700" fill="#2e6b62" text-anchor="middle">UK-built bikes at £410</text><rect x="460" y="110" width="410" height="110" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="665" y="150" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Multinational</text><text x="665" y="190" font-size="22" font-weight="700" fill="#b5602e" text-anchor="middle">imported bikes at £320</text><text x="395" y="266" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">Reward</text><text x="710" y="266" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">Risk</text><rect x="30" y="280" width="840" height="106" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="324" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Cut price towards</text><text x="50" y="348" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">£320</text><text x="270" y="320" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Keeps price-sensitive</text><text x="270" y="341" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">customers</text><text x="560" y="320" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Margins may disappear; cannot match</text><text x="560" y="341" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">a multinational’s scale</text><rect x="30" y="400" width="840" height="106" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="444" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Compete on quality</text><text x="50" y="468" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">and brand</text><text x="270" y="440" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Hand-built, local repairs:</text><text x="270" y="461" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">keeps customers who value</text><text x="270" y="482" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">service</text><text x="560" y="440" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Smaller market</text><rect x="730" y="464" width="120" height="26" rx="13" fill="#2e6b62" stroke="#2e6b62" stroke-width="2.5"/><text x="790" y="483" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">recommended</text><rect x="30" y="520" width="840" height="106" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="564" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Sell online abroad</text><text x="270" y="560" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">New markets</text><text x="560" y="560" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Delivery costs; many competing</text><text x="560" y="581" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">sellers</text><rect x="30" y="650" width="840" height="109" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="690" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Recommend one option and justify it from the case.</text><text x="56" y="717" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Pennant should compete on quality and service, because it cannot win on price against a</text><text x="56" y="740" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">business with much larger scale.</text>
</svg>