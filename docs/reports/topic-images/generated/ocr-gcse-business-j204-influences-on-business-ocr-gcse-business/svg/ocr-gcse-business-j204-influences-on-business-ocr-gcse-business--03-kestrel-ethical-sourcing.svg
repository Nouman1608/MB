250" y="548" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Before</text><text x="250" y="570" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">4,000 × £6.00</text><rect x="410" y="389.44" width="140" height="130.56" fill="#b5602e" stroke="#1e2a44" stroke-width="2.5"/><rect x="410" y="212.8" width="140" height="176.64" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="480" y="460.72" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">cost £10,200</text><text x="480" y="297.12" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">GP £13,800</text><text x="480" y="321.12" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">margin 57.5%</text><text x="480" y="202.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">£24,000</text><text x="480" y="548" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Certified, same price</text><text x="480" y="570" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">4,000 × £6.00</text><rect x="640" y="395.968" width="140" height="124.032" fill="#b5602e" stroke="#1e2a44" stroke-width="2.5"/><rect x="640" y="203.83999999999997" width="140" height="192.128" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="710" y="463.984" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">cost £9,690</text><text x="710" y="295.904" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">GP £15,010</text><text x="710" y="319.904" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">margin 60.8%</text><text x="710" y="193.83999999999997" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">£24,700</text><text x="710" y="548" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Certified, £6.50</text><text x="710" y="570" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">3,800 packs</text><line x1="120" y1="520" x2="850" y2="520" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="630" width="270" height="150" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="664" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">Before (tea £2.10)</text><text x="48" y="692" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">GP = 24,000 − 8,400</text><text x="48" y="716" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">= £15,600</text><text x="48" y="740" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">15,600 ÷ 24,000 = 65.0%</text><rect x="315" y="630" width="270" height="150" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="333" y="664" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">Certified (£2.55)</text><text x="333" y="692" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">GP = 24,000 − 10,200</text><text x="333" y="716" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">= £13,800</text><text x="333" y="740" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">13,800 ÷ 24,000 = 57.5%</text><rect x="600" y="630" width="270" height="150" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="618" y="664" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">Price £6.50, 3,800 sold</text><text x="618" y="692" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">GP = 24,700 − 9,690</text><text x="618" y="716" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">= £15,010</text><text x="618" y="740" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">15,010 ÷ 24,700 = 60.8%</text><rect x="30" y="800" width="840" height="109" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="840" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Absorbing the cost cuts the margin by 