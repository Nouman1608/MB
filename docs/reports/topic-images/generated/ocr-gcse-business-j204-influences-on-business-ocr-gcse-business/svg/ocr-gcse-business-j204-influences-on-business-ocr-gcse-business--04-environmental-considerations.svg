<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Environmental considerations and responses</text>

<rect x="30" y="110" width="410" height="224" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="148" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Sustainability</text><text x="50" y="180" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Using resources so they are not used up,</text><text x="50" y="203" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">e.g. replanted timber, reusable packaging</text><rect x="46" y="240" width="378" height="80" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="62" y="266" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">Impact</text><text x="62" y="290" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Raises input costs now; protects future</text><text x="62" y="311" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">supply</text><rect x="460" y="110" width="410" height="224" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="480" y="148" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Waste disposal</text><text x="480" y="180" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Waste must be collected and disposed of,</text><text x="480" y="203" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">which costs money</text><rect x="476" y="240" width="378" height="80" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="492" y="266" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">Impact</text><text x="492" y="290" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Cutting waste lowers costs: green and</text><text x="492" y="311" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">financial aims agree</text><rect x="30" y="350" width="410" height="224" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="388" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Pollution</text><text x="50" y="420" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Noise, fumes or spills harm the local</text><text x="50" y="443" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">community</text><rect x="46" y="480" width="378" height="80" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="62" y="506" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">Impact</text><text x="62" y="530" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Can damage the business’s image</text><rect x="460" y="350" width="410" height="224" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="480" y="388" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Climate change</text><text x="480" y="420" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Extreme weather disrupts supply chains and</text><text x="480" y="443" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">harvests</text><rect x="476" y="480" width="378" height="80" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="492" y="506" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">Impact</text><text x="492" y="530" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Customers may switch to lower-carbon</text><text x="492" y="551" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">products; energy costs matter more</text><rect x="30" y="600" width="840" height="190" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="56" y="636" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">How businesses respond</text><rect x="56" y="656" width="186" height="80" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="149" y="697.7" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Redesign products</text><rect x="258" y="656" width="186" height="80" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="351" y="697.7" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Change suppliers</text><rect x="460" y="656" width="186" height="80" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="553" y="687.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Energy-efficient</text><text x="553" y="708.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">equipment</text><rect x="662" y="656" width="186" height="80" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="755" y="687.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Use the record in</text><text x="755" y="708.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">marketing</text><text x="56" y="770" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="start" font-style="italic">Each response involves operations, finance and marketing: the link to section 7.</text>
