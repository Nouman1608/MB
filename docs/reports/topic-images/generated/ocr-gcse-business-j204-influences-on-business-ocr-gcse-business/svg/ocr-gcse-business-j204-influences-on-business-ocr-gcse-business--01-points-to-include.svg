<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Section 6: the points to include</text>

<rect x="30" y="110" width="410" height="310" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><rect x="30" y="110" width="410" height="58" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="147" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">6.1 Ethical considerations</text><rect x="50" y="184" width="26" height="26" rx="6" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><path d="M55,198 l6,6 l11,-12" fill="none" stroke="#2e6b62" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="88" y="203" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Treatment of workers</text><rect x="50" y="229" width="26" height="26" rx="6" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><path d="M55,243 l6,6 l11,-12" fill="none" stroke="#2e6b62" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="88" y="248" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Treatment of suppliers</text><rect x="50" y="274" width="26" height="26" rx="6" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><path d="M55,288 l6,6 l11,-12" fill="none" stroke="#2e6b62" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="88" y="293" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Treatment of customers</text><rect x="50" y="319" width="26" height="26" rx="6" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><path d="M55,333 l6,6 l11,-12" fill="none" stroke="#2e6b62" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="88" y="338" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Sourcing of materials</text><rect x="50" y="364" width="26" height="26" rx="6" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><path d="M55,378 l6,6 l11,-12" fill="none" stroke="#2e6b62" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="88" y="383" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Marketing decisions</text><rect x="460" y="110" width="410" height="310" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><rect x="460" y="110" width="410" height="58" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="480" y="147" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">6.1 Environmental considerations</text><rect x="480" y="184" width="26" height="26" rx="6" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><path d="M485,198 l6,6 l11,-12" fill="none" stroke="#2e6b62" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="518" y="203" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Sustainability</text><rect x="480" y="229" width="26" height="26" rx="6" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><path d="M485,243 l6,6 l11,-12" fill="none" stroke="#2e6b62" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="518" y="248" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Waste disposal</text><rect x="480" y="274" width="26" height="26" rx="6" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><path d="M485,288 l6,6 l11,-12" fill="none" stroke="#2e6b62" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="518" y="293" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Pollution</text><rect x="480" y="319" width="26" height="26" rx="6" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><path d="M485,333 l6,6 l11,-12" fill="none" stroke="#2e6b62" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="518" y="338" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Climate change</text><rect x="30" y="440" width="410" height="310" rx="12" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><rect x="30" y="440" width="410" height="58" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="477" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">6.2 The economic climate</text><rect x="50" y="514" width="26" height="26" rx="6" fill="#ffffff" stroke="#8a6d0d" stroke-width="2"/><path d="M55,528 l6,6 l11,-12" fill="none" stroke="#8a6d0d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="88" y="533" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Changing levels of consumer income</text><rect x="50" y="559" width="26" height="26" rx="6" fill="#ffffff" stroke="#8a6d0d" stroke-width="2"/><path d="M55,573 l6,6 l11,-12" fill="none" stroke="#8a6d0d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="88" y="578" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Unemployment</text><rect x="460" y="440" width="410" height="310" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><rect x="460" y="440" width="410" height="58" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="480" y="477" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">6.3 Globalisation</text><rect x="480" y="514" width="26" height="26" rx="6" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><path d="M485,528 l6,6 l11,-12" fill="none" stroke="#b5602e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="518" y="533" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Growth of multinational companies</text><rect x="480" y="559" width="26" height="26" rx="6" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><path d="M485,573 l6,6 l11,-12" fill="none" stroke="#b5602e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="518" y="578" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Influences on business location</text><rect x="480" y="604" width="26" height="26" rx="6" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><path d="M485,618 l6,6 l11,-12" fill="none" stroke="#b5602e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="518" y="623" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">International branding</text><rect x="480" y="649" width="26" height="26" rx="6" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><path d="M485,663 l6,6 l11,-12" fill="none" stroke="#b5602e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="518" y="668" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">How businesses compete internationally</text><rect x="30" y="780" width="840" height="109" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="820" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Two halves to every point: the influence, and how the business responds.</text><text x="56" y="847" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Naming the exact point, such as “sourcing of materials” rather than “being nice”, shows</text><text x="56" y="870" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">precise knowledge.</text>
