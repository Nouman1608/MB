<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 800" width="900" height="800" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="800" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Globalisation: the four points</text>

<rect x="30" y="110" width="840" height="70" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="140" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start">Globalisation: goods, services, money, people and ideas move more freely</text><text x="56" y="164" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start">between countries</text><rect x="30" y="200" width="410" height="230" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="236" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Growth of multinationals</text><rect x="50" y="256" width="175" height="156" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="62" y="286" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">Threat</text><text x="62" y="315" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Strong brands; low</text><text x="62" y="335" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">prices from</text><text x="62" y="355" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">large-scale buying</text><rect x="245" y="256" width="175" height="156" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="257" y="286" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Opportunity</text><text x="257" y="315" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">A large customer,</text><text x="257" y="335" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">or a supplier</text><rect x="460" y="200" width="410" height="230" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="480" y="236" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Influences on location</text><text x="480" y="266" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Costs, proximity to market, labour and</text><text x="480" y="287" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">materials, now including sites abroad</text><rect x="480" y="330" width="370" height="82" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="496" y="360" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Low wages are only one factor: distance,</text><text x="496" y="380" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">supply-chain length and reputation matter</text><text x="496" y="400" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">too</text><rect x="30" y="450" width="840" height="150" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="486" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">International branding</text><line x1="80" y1="530" x2="820" y2="530" stroke="#1e2a44" stroke-width="4"/><line x1="450" y1="530" x2="90" y2="530" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><line x1="450" y1="530" x2="810" y2="530" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><text x="80" y="562" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">One global brand</text><text x="80" y="584" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">saves marketing costs, builds recognition</text><text x="820" y="562" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">Adapt to local markets</text><text x="820" y="584" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">name, product or message</text><text x="450" y="512" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="middle">most do some of each</text><rect x="30" y="620" width="840" height="150" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="656" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">How businesses compete internationally</text><rect x="50" y="674" width="150" height="80" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="125" y="706.2" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">Price: efficient,</text><text x="125" y="726.2" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">large scale</text><rect x="212" y="674" width="150" height="80" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="287" y="706.2" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">Quality and</text><text x="287" y="726.2" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">design</text><rect x="374" y="674" width="150" height="80" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="449" y="716.2" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">Brand image</text><rect x="536" y="674" width="150" height="80" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="611" y="716.2" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">Customer service</text><rect x="698" y="674" width="150" height="80" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="773" y="706.2" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">E-commerce: reach</text><text x="773" y="726.2" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">customers abroad</text>
</svg>