<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 866" width="900" height="866" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="866" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Larkspur Bistro: a squeeze on two sides</text>

<rect x="30" y="110" width="840" height="500" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="56" y="146" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">Width = meals a week; height = average spend</text><rect x="100" y="272" width="372" height="288" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="286" y="412" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">£14,400</text><text x="286" y="438" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">a week</text><text x="286" y="588" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">600 meals</text><text x="92" y="422" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="end">£24</text><text x="286" y="258" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Before</text><rect x="530" y="296" width="316.2" height="264" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="688.1" y="424" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">£11,220</text><text x="688.1" y="450" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">a week</text><text x="688.1" y="588" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">510 meals</text><text x="522" y="434" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="end">£22</text><text x="688.1" y="282" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">After unemployment rises</text><line x1="60" y1="560" x2="850" y2="560" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="630" width="270" height="100" rx="12" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="165" y="664" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Meals</text><text x="165" y="704" font-size="22" font-weight="700" fill="#8a6d0d" text-anchor="middle">−15%</text><rect x="315" y="630" width="270" height="100" rx="12" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="664" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Average spend</text><text x="450" y="704" font-size="22" font-weight="700" fill="#8a6d0d" text-anchor="middle">£24 → £22</text><rect x="600" y="630" width="270" height="100" rx="12" fill="#fbf3ee" stroke="#b5602e" stroke-width="2.5"/><text x="735" y="664" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Revenue: 3,180 ÷ 14,400</text><text x="735" y="704" font-size="22" font-weight="700" fill="#b5602e" text-anchor="middle">−22.1%</text><rect x="30" y="750" width="840" height="86" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="790" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Revenue falls further than meals, because quantity and spend both fall.</text><text x="56" y="817" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Larkspur could respond with a cheaper set menu, mid-week offers or fewer opening hours.</text>
</svg>