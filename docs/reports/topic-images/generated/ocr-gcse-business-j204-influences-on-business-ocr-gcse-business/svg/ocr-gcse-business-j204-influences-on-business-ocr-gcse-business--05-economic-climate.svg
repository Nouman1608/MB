<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="900" height="650" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="650" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Income, unemployment and business</text>

<rect x="30" y="110" width="260" height="100" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="160" y="162.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Unemployment rises</text><line x1="292" y1="160" x2="318" y2="160" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="320" y="110" width="260" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="150.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Total household income</text><text x="450" y="174.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">falls</text><line x1="582" y1="160" x2="608" y2="160" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="610" y="110" width="260" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="740" y="150.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Those still in work</text><text x="740" y="174.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">spend more cautiously</text><line x1="450" y1="212" x2="450" y2="240" stroke="#1e2a44" stroke-width="3"/><line x1="165" y1="240" x2="735" y2="240" stroke="#1e2a44" stroke-width="3"/><line x1="165" y1="240" x2="165" y2="268" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="450" y1="240" x2="450" y2="268" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="735" y1="240" x2="735" y2="268" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="272" width="270" height="190" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="48" y="310" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">Non-essentials</text><text x="48" y="341" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Restaurants, holidays,</text><text x="48" y="364" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">furniture: tend to lose</text><text x="48" y="387" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">sales first</text><rect x="315" y="272" width="270" height="190" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="333" y="310" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Essentials and budget</text><text x="333" y="335" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">versions</text><text x="333" y="366" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">May lose less; some gain</text><text x="333" y="389" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">as customers trade down</text><rect x="600" y="272" width="270" height="190" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="618" y="310" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">As an employer</text><text x="618" y="341" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">More applicants for each</text><text x="618" y="364" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">job; less pressure for pay</text><text x="618" y="387" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">rises</text><rect x="30" y="490" width="840" height="130" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="56" y="526" font-size="18" font-weight="700" fill="#4a5568" text-anchor="start">Analyse as a chain</text><rect x="50" y="544" width="144" height="60" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="122" y="566.2" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">Unemployment</text><text x="122" y="586.2" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">rises</text><line x1="196" y1="574" x2="212" y2="574" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="214" y="544" width="144" height="60" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="286" y="576.2" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">Incomes fall</text><line x1="360" y1="574" x2="376" y2="574" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="378" y="544" width="144" height="60" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="576.2" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">Fewer meals out</text><line x1="524" y1="574" x2="540" y2="574" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="542" y="544" width="144" height="60" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="614" y="576.2" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">Revenue falls</text><line x1="688" y1="574" x2="704" y2="574" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="706" y="544" width="144" height="60" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="778" y="566.2" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">Fixed costs</text><text x="778" y="586.2" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">harder to cover</text>
</svg>