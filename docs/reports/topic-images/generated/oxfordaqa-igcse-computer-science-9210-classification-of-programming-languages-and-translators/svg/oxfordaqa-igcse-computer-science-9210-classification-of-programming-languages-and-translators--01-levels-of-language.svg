<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 664" width="900" height="664" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="664" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Levels of programming language</text>

<rect x="30" y="110" width="560" height="124" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="52" y="142" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">HIGH-LEVEL</text><text x="52" y="172" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Python, C#, Visual Basic</text><text x="52" y="200" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Close to English and maths; one statement becomes many machine</text><text x="52" y="221" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">code instructions</text><rect x="30" y="260" width="560" height="124" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="52" y="292" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">LOW-LEVEL</text><text x="52" y="322" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Assembly language</text><text x="52" y="350" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Mnemonics and named memory locations; 1:1 with machine code</text><rect x="30" y="410" width="560" height="124" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="52" y="442" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">LOW-LEVEL</text><text x="52" y="472" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Machine code</text><text x="52" y="500" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Binary instructions from one processor’s instruction set</text><path d="M592,172 L780,172 L780,500 L598,500" fill="none" stroke="#2e6b62" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahT)"/><path d="M592,322 L640,322 L640,452 L598,452" fill="none" stroke="#8a6d0d" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahO)"/><rect x="660" y="230" width="200" height="64" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="760" y="268" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle"></text><text x="760" y="256" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">compiler or</text><text x="760" y="280" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">interpreter</text><rect x="656" y="366" width="112" height="44" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="712" y="394" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">assembler</text><rect x="30" y="572" width="840" height="62" rx="14" fill="#1e2a44"/><text x="450" y="611" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">A processor runs only machine code, so all other code must be translated.</text>
</svg>