<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 822" width="900" height="822" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="822" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Compiler, interpreter and assembler</text>

<rect x="30" y="110" width="840" height="190" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="30" y="110" width="12" height="190" rx="6" fill="#2e6b62"/><text x="60" y="146" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Compiler</text><text x="167.261" y="146" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">high-level language</text><rect x="60" y="172" width="170" height="64" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="145" y="210" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">whole program</text><line x1="234" y1="204" x2="274" y2="204" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="280" y="172" width="150" height="64" rx="12" fill="#1e2a44" stroke="#1e2a44" stroke-width="2.5"/><text x="355" y="210" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Compiler</text><line x1="434" y1="204" x2="474" y2="204" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="480" y="172" width="170" height="64" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="565" y="210" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">executable file</text><line x1="654" y1="204" x2="694" y2="204" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="700" y="172" width="150" height="64" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="775" y="210" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">run, again</text><text x="60" y="276" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Translates everything before it runs; machine code generated directly; run again without translating.</text><rect x="30" y="320" width="840" height="262" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="30" y="320" width="12" height="262" rx="6" fill="#2b5a9a"/><text x="60" y="356" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Interpreter</text><text x="184.775" y="356" font-size="16" font-weight="600" fill="#2b5a9a" text-anchor="start">high-level language</text><rect x="60" y="378" width="170" height="44" rx="12" fill="#ffffff" stroke="#2b5a9a" stroke-width="2.5"/><text x="145" y="406" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">statement 1</text><rect x="60" y="430" width="170" height="44" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="145" y="458" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">statement 2</text><rect x="60" y="482" width="170" height="44" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="145" y="510" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">statement 3</text><line x1="234" y1="400" x2="274" y2="428" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="280" y="378" width="320" height="140" rx="12" fill="#1e2a44"/><text x="440" y="410" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Interpreter</text><text x="440" y="434" font-size="15" font-weight="400" fill="#b5d3cf" text-anchor="middle">itself a machine code program</text><rect x="300" y="452" width="86" height="46" rx="8" fill="#dce9e7"/><text x="343" y="481" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">routine</text><rect x="398" y="452" width="86" height="46" rx="8" fill="#dce9e7"/><text x="441" y="481" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">routine</text><rect x="496" y="452" width="86" height="46" rx="8" fill="#dce9e7"/><text x="539" y="481" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">routine</text><line x1="604" y1="448" x2="644" y2="448" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="650" y="416" width="200" height="64" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="750" y="454" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">statement carried out</text><text x="60" y="564" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Each statement in turn, using its own machine code routines: no machine code generated, no executable.</text><rect x="30" y="602" width="840" height="190" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="30" y="602" width="12" height="190" rx="6" fill="#8a6d0d"/><text x="60" y="638" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Assembler</text><text x="184.88" y="638" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="start">assembly language</text><rect x="60" y="664" width="220" height="64" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="170" y="702" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">assembly instruction</text><line x1="284" y1="696" x2="344" y2="696" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="350" y="664" width="160" height="64" rx="12" fill="#1e2a44" stroke="#1e2a44" stroke-width="2.5"/><text x="430" y="702" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Assembler</text><line x1="514" y1="696" x2="574" y2="696" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="580" y="664" width="270" height="64" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="715" y="702" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">one machine code instruction</text><text x="60" y="768" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Converts each assembly instruction into exactly one machine code instruction.</text>
</svg>