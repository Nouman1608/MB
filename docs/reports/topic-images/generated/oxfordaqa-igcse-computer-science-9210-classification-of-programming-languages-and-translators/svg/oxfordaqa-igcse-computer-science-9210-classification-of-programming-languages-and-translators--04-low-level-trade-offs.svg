<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 670" width="900" height="670" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="670" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">When low-level code is worth it</text>

<rect x="30" y="110" width="411" height="410" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="54" y="148" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Advantages of low-level</text><rect x="50" y="178" width="371" height="98" rx="10" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="68" y="208" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Direct control of the hardware</text><text x="68" y="234" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">work with specific memory locations and</text><text x="68" y="255" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">device components</text><rect x="50" y="290" width="371" height="98" rx="10" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="68" y="320" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Very efficient code</text><text x="68" y="346" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">small and fast: suits limited memory or</text><text x="68" y="367" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">processing power</text><rect x="50" y="402" width="371" height="98" rx="10" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="68" y="432" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Precise control of what runs</text><text x="68" y="458" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">each instruction chosen by the</text><text x="68" y="479" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">programmer, nothing added by a translator</text><rect x="459" y="110" width="411" height="410" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="483" y="148" font-size="20" font-weight="700" fill="#b5602e" text-anchor="start">Disadvantages</text><rect x="479" y="178" width="371" height="98" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="497" y="234" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Harder and slower to write</text><rect x="479" y="290" width="371" height="98" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="497" y="346" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Harder to read, debug and maintain</text><rect x="479" y="402" width="371" height="98" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="497" y="442" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Not portable</text><text x="497" y="468" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">tied to one processor’s instruction set</text><rect x="30" y="544" width="840" height="96" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="54" y="582" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">So assembly is used for:</text><text x="54" y="614" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">embedded systems and controlling specific hardware components</text><text x="846" y="614" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="end">not for most software</text>
</svg>