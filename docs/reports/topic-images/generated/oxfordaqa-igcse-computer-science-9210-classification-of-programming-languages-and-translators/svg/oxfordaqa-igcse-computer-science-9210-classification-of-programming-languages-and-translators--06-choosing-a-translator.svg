<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 538" width="900" height="538" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="538" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Which translator, when?</text>

<rect x="30" y="110" width="268" height="310" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="30" y="110" width="268" height="92" rx="14" fill="#2b5a9a"/><rect x="30" y="180" width="268" height="22" fill="#2b5a9a"/><text x="164" y="144" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">DEVELOPMENT</text><text x="164" y="180" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">Interpreter</text><text x="50" y="236" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="236" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Run as soon as a statement</text><text x="65.2" y="257" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">is written</text><text x="50" y="290" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="290" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Stops at the statement with</text><text x="65.2" y="311" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the error, so it is easy to</text><text x="65.2" y="332" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">locate</text><text x="50" y="365" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="365" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Changes can be tested</text><text x="65.2" y="386" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">immediately</text><rect x="316" y="110" width="268" height="310" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="316" y="110" width="268" height="92" rx="14" fill="#2e6b62"/><rect x="316" y="180" width="268" height="22" fill="#2e6b62"/><text x="450" y="144" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">DISTRIBUTION</text><text x="450" y="180" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">Compiler</text><text x="336" y="236" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="351.2" y="236" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Executable runs without the</text><text x="351.2" y="257" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">translator</text><text x="336" y="290" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="351.2" y="290" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Usually runs faster:</text><text x="351.2" y="311" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">translation already done</text><text x="336" y="344" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="351.2" y="344" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Customers do not get the</text><text x="351.2" y="365" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">source code</text><rect x="602" y="110" width="268" height="310" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="602" y="110" width="268" height="92" rx="14" fill="#8a6d0d"/><rect x="602" y="180" width="268" height="22" fill="#8a6d0d"/><text x="736" y="144" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">ASSEMBLY CODE</text><text x="736" y="180" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">Assembler</text><text x="622" y="236" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="637.2" y="236" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Needed whenever any part</text><text x="637.2" y="257" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">is written in assembly</text><text x="622" y="290" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="637.2" y="290" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">For example, a routine that</text><text x="637.2" y="311" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">controls a device’s</text><text x="637.2" y="332" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">hardware</text><rect x="30" y="444" width="840" height="64" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="484" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">In an answer, tie the choice to the situation and give the benefit.</text>
</svg>