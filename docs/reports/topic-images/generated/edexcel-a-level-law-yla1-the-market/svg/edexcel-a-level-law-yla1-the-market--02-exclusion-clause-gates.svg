<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 862" width="900" height="862" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="862" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Will an exclusion clause work?</text>

<rect x="30" y="100" width="412" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">TERM TYPE</text><text x="50" y="158.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Condition: goes to the root of the contract</text><text x="50" y="186.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A singer missing the opening nights broke a</text><text x="50" y="207.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">condition: <tspan font-style="italic">Poussard</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Spiers</tspan> [1876]</text><rect x="458" y="100" width="412" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="478" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">TERM TYPE</text><text x="478" y="158.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Warranty</text><text x="478" y="186.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Missing rehearsals broke only a warranty: <tspan font-style="italic">Bettini</tspan></text><text x="478" y="207.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">v</tspan> <tspan font-style="italic">Gye</tspan> [1876]</text><line x1="60" y1="274" x2="60" y2="484" stroke="#c9d6d4" stroke-width="4"/><rect x="104" y="254" width="766" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="116" y="280.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Incorporated?</text><text x="116" y="308.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">By signature (<tspan font-style="italic">L'Estrange</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Graucob</tspan>), reasonable notice before or at the time of contract (<tspan font-style="italic">Olley</tspan>;</text><text x="116" y="329.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Thornton</tspan>), or a consistent course of dealing.</text><circle cx="60" cy="300" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="308.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="104" y="354" width="766" height="71" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="116" y="380.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Which statute?</text><text x="116" y="408.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">UCTA</tspan> <tspan font-weight="700" fill="#1e2a44">1977</tspan>: business-to-business. <tspan font-weight="700" fill="#1e2a44">CRA</tspan> <tspan font-weight="700" fill="#1e2a44">2015</tspan>: trader and consumer.</text><circle cx="60" cy="389.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="398.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="104" y="433" width="766" height="71" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="116" y="459.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Does it survive the statute?</text><text x="116" y="487.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">See the table below.</text><circle cx="60" cy="468.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="477.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><clipPath id="tc526"><rect x="30" y="526" width="840" height="304" rx="14"/></clipPath><g clip-path="url(#tc526)"><rect x="30" y="526" width="240.00000000000003" height="48" fill="#b5d3cf"/><text x="44" y="553.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Provision</text><rect x="270" y="526" width="600" height="48" fill="#b5d3cf"/><text x="284" y="553.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Effect</text><rect x="30" y="574" width="240.00000000000003" height="47" fill="#dce9e7"/><text x="44" y="600.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">UCTA s 2(1)</text><rect x="270" y="574" width="600" height="47" fill="#ffffff"/><text x="284" y="600.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Cannot exclude liability for death or personal injury caused by negligence</text><line x1="30" y1="621" x2="870" y2="621" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="621" width="240.00000000000003" height="68" fill="#dce9e7"/><text x="44" y="647.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">UCTA s 2(2), s 3</text><rect x="270" y="621" width="600" height="68" fill="#f8faf9"/><text x="284" y="647.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Other negligence and standard-terms clauses must be reasonable (s 11</text><text x="284" y="668.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">test)</text><line x1="30" y1="689" x2="870" y2="689" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="689" width="240.00000000000003" height="47" fill="#f2e7b8"/><text x="44" y="715.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">CRA s 31 / s 57</text><rect x="270" y="689" width="600" height="47" fill="#ffffff"/><text x="284" y="715.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Cannot exclude the implied terms in goods / services contracts</text><line x1="30" y1="736" x2="870" y2="736" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="736" width="240.00000000000003" height="47" fill="#f2e7b8"/><text x="44" y="762.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">CRA s 62</text><rect x="270" y="736" width="600" height="47" fill="#f8faf9"/><text x="284" y="762.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">An unfair term is not binding on the consumer</text><line x1="30" y1="783" x2="870" y2="783" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="783" width="240.00000000000003" height="47" fill="#f2e7b8"/><text x="44" y="809.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">CRA s 65</text><rect x="270" y="783" width="600" height="47" fill="#ffffff"/><text x="284" y="809.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Cannot exclude liability for death or personal injury caused by negligence</text></g><line x1="270" y1="526" x2="270" y2="830" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="526" width="840" height="304" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/>
</svg>