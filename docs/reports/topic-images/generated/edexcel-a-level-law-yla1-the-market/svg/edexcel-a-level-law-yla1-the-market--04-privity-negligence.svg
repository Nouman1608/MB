<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 526" width="900" height="526" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="526" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">When privity blocks a claim, sue in negligence</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Donoghue v Stevenson [1932]</text>
<line x1="316" y1="254" x2="584" y2="254" stroke="#b5602e" stroke-width="4" stroke-dasharray="10 8"/><circle cx="450" cy="254" r="16" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="450" y="260" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">✗</text><text x="450" y="290" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">no contract</text><path d="M170,210 C250,134 650,134 730,208" fill="none" stroke="#2e6b62" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahT)"/><text x="450" y="146" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">yet a duty of care in negligence</text><rect x="30" y="214" width="280" height="87" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="170" y="248.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Manufacturer</text><text x="170" y="277" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">made the ginger beer</text><rect x="590" y="214" width="280" height="87" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="730" y="248.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Consumer</text><text x="730" y="277" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">drank it</text><rect x="30" y="326" width="413" height="168" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="358" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PRIVITY AT COMMON LAW</text><text x="50" y="383.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Only a party can enforce a contract</text><text x="50" y="410" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Tweddle</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Atkinson</tspan> [1861]; <tspan font-style="italic">Dunlop</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Selfridge</tspan> [1915]</text><rect x="457" y="326" width="413" height="168" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="477" y="358" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">THIRD PARTIES ACT 1999</text><text x="477" y="383.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">A third party can enforce a term</text><text x="477" y="410" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Contracts (Rights of Third Parties) Act 1999: if the</text><text x="477" y="430" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">contract expressly allows it or the term purports to</text><text x="477" y="450" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">benefit them, and they are identified by name, class</text><text x="477" y="470" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">or description</text>
</svg>