<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 638" width="900" height="638" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="638" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Advising Leila: a laptop screen fails after three weeks</text>

<line x1="70" y1="160" x2="830" y2="160" stroke="#1e2a44" stroke-width="4"/><rect x="70" y="144" width="570" height="32" rx="6" fill="#b5d3cf" opacity="0.7"/><text x="355" y="204" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">short-term right to reject: generally within 30 days (s 20)</text><circle cx="70" cy="160" r="10" fill="#1e2a44"/><text x="70" y="130" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">bought</text><circle cx="469" cy="160" r="12" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><text x="469" y="130" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">screen fails (3 weeks)</text><text x="640" y="130" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">30 days</text><line x1="640" y1="140" x2="640" y2="184" stroke="#1e2a44" stroke-width="2" stroke-dasharray="5 4"/><line x1="60" y1="254" x2="60" y2="543" stroke="#c9d6d4" stroke-width="4"/><rect x="104" y="234" width="766" height="71" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="116" y="260.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Rule</text><text x="116" y="288.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Goods must be of satisfactory quality (s 9).</text><circle cx="60" cy="269.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="278.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="104" y="313" width="766" height="71" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="116" y="339.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Apply</text><text x="116" y="367.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A screen failing after three weeks suggests it was not of satisfactory quality.</text><circle cx="60" cy="348.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="357.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="104" y="392" width="766" height="92" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="116" y="418.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Remedy</text><text x="116" y="446.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Within 30 days: short-term right to reject for a refund (s 20). Or repair or replacement (s 23); if</text><text x="116" y="467.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">that fails, price reduction or final rejection (s 24).</text><circle cx="60" cy="438" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="446.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="104" y="492" width="766" height="71" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="116" y="518.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Exclusion</text><text x="116" y="546.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Any term excluding s 9 is not binding (s 31).</text><circle cx="60" cy="527.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="536.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="450" y="597.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Do not skip straight to s 24 without the s 20 and s 23 stages.</text>
</svg>