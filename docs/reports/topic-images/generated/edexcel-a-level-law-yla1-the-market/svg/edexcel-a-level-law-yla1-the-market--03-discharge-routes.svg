<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 674" width="900" height="674" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="674" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How a contract ends: four routes</text>

<rect x="30" y="100" width="413" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PERFORMANCE</text><text x="50" y="158.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Traditionally exact</text><text x="50" y="186.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Cutter</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Powell</tspan> [1795]; softened by substantial</text><text x="50" y="207.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">performance: <tspan font-style="italic">Hoenig</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Isaacs</tspan> [1952]</text><rect x="457" y="100" width="413" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">AGREEMENT</text><text x="477" y="158.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Both sides agree to end it</text><rect x="30" y="246" width="413" height="174" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="278" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">BREACH</text><text x="50" y="304.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Including anticipatory breach</text><text x="50" y="332.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">before performance is due: <tspan font-style="italic">Hochster</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">De</tspan> <tspan font-style="italic">La</tspan></text><text x="50" y="353.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Tour</tspan> [1853]</text><rect x="457" y="246" width="413" height="174" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="477" y="278" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FRUSTRATION</text><text x="477" y="304.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Impossible or purpose defeated</text><text x="477" y="332.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Taylor</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Caldwell</tspan> [1863]; <tspan font-style="italic">Krell</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Henry</tspan> [1903].</text><text x="477" y="353.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Not just more expensive: <tspan font-style="italic">Davis</tspan> <tspan font-style="italic">Contractors</tspan></text><text x="477" y="374.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">[1956]. 1943 Act: money paid can be recovered,</text><text x="477" y="395.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">subject to expenses.</text><text x="30" y="456" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">VALIDITY: MISREPRESENTATION, A FALSE STATEMENT OF FACT THAT INDUCES THE CONTRACT</text><rect x="30" y="470" width="272" height="108" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="166" y="514.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Fraudulent</text><text x="166" y="543.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle"><tspan font-style="italic">Derry</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Peek</tspan> [1889]</text><rect x="314" y="470" width="272" height="108" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="504.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Negligent</text><text x="450" y="532.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">s 2(1) Misrepresentation Act</text><text x="450" y="553.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">1967</text><rect x="598" y="470" width="272" height="108" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="734" y="528.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Innocent</text><text x="450" y="612.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Opinion is not fact (<tspan font-style="italic">Bisset</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Wilkinson</tspan>). Remedies: rescission and damages, which may be reduced for the</text><text x="450" y="633.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">claimant's fault (1945 Act).</text>
</svg>