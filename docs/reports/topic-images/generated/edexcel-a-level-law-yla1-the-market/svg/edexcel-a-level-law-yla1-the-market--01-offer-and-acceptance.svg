<rect width="900" height="732" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">From invitation to treat to acceptance</text>

<rect x="30" y="100" width="449.4545454545454" height="140" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">INVITATION TO TREAT (NOT AN OFFER)</text><text x="50" y="163.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="163.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Goods on a shop shelf: <tspan font-style="italic">Boots</tspan> [1953]</text><text x="50" y="189.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="189.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Goods in a window: <tspan font-style="italic">Fisher</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Bell</tspan> [1961]</text><text x="50" y="215.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="215.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Most advertisements: <tspan font-style="italic">Partridge</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Crittenden</tspan> [1968]</text><rect x="495.4545454545454" y="100" width="374.5454545454545" height="140" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="515.4545454545454" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">UNILATERAL OFFER TO THE WORLD</text><text x="515.4545454545454" y="163.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">An advertisement showing a clear intention</text><text x="515.4545454545454" y="184.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">to be bound: <tspan font-style="italic">Carlill</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Carbolic</tspan> <tspan font-style="italic">Smoke</tspan> <tspan font-style="italic">Ball</tspan></text><text x="515.4545454545454" y="205.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Co</tspan> [1893]</text><rect x="330" y="262" width="240" height="61" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="297.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Offer made</text><line x1="450" y1="327" x2="131.25" y2="366" stroke="#b5602e" stroke-width="2.5" marker-end="url(#ahR)"/><line x1="450" y1="327" x2="343.75" y2="366" stroke="#b5602e" stroke-width="2.5" marker-end="url(#ahR)"/><line x1="450" y1="327" x2="556.25" y2="366" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><line x1="450" y1="327" x2="768.75" y2="366" stroke="#2e6b62" stroke-width="2.5" marker-end="url(#ahT)"/><rect x="30" y="372" width="202.5" height="195" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="398" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">ENDS</text><text x="44" y="422.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Counter-offer</text><text x="44" y="449" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Hyde</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Wrench</tspan> [1840]</text><rect x="242.5" y="372" width="202.5" height="195" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="256.5" y="398" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">ENDS</text><text x="256.5" y="422.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Revocation,</text><text x="256.5" y="442.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">communicated</text><text x="256.5" y="469" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">before acceptance:</text><text x="256.5" y="489" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Routledge</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Grant</tspan>;</text><text x="256.5" y="509" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Byrne</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Van</tspan> <tspan font-style="italic">Tienhoven</tspan>;</text><text x="256.5" y="529" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">via a reliable third party:</text><text x="256.5" y="549" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Dickinson</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Dodds</tspan></text><rect x="455" y="372" width="202.5" height="195" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="469" y="398" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DOES NOT END</text><text x="469" y="422.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Request for</text><text x="469" y="442.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">information</text><text x="469" y="469" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Stevenson</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">McLean</tspan></text><text x="469" y="489" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">[1880]</text><rect x="667.5" y="372" width="202.5" height="195" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="681.5" y="398" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CONTRACT FORMED</text><text x="681.5" y="422.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Acceptance</text><text x="681.5" y="449" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Unconditional and</text><text x="681.5" y="469" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">communicated; silence</text><text x="681.5" y="489" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">is not acceptance:</text><text x="681.5" y="509" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Felthouse</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Bindley</tspan></text><rect x="30" y="589" width="412" height="111" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="621" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">POSTAL RULE</text><text x="50" y="647.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Effective when posted</text><text x="50" y="675.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Adams</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Lindsell</tspan> [1818]</text><rect x="458" y="589" width="412" height="111" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="478" y="621" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">INSTANTANEOUS</text><text x="478" y="647.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Effective when received</text><text x="478" y="675.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Entores</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Miles</tspan> <tspan font-style="italic">Far</tspan> <tspan font-style="italic">East</tspan> [1955]</text>
</svg>