<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 753" width="900" height="753" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="753" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Mexico and Peru: key events</text>

<text x="235" y="114" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle">MEXICO</text><rect x="30" y="130" width="410" height="118" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="44" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">1519</text><text x="44" y="182.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Cortés sails from Cuba</text><text x="44" y="210" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Against the governor's orders; alliances with</text><text x="44" y="230" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Totonacs and Tlaxcala</text><line x1="235" y1="251" x2="235" y2="273" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="276" width="410" height="98" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="44" y="302" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">NOV 1519</text><text x="44" y="328.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Enters Tenochtitlan</text><text x="44" y="356" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Moctezuma II taken hostage</text><line x1="235" y1="377" x2="235" y2="399" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="402" width="410" height="98" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="44" y="428" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">1520</text><text x="44" y="454.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Alvarado's massacre; the city rises</text><text x="44" y="482" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Moctezuma dies; Spanish flight on the Noche Triste</text><line x1="235" y1="503" x2="235" y2="525" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="528" width="410" height="94" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="44" y="556.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Smallpox strikes the city</text><text x="44" y="584" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Besiegers rebuild with Tlaxcalan support and</text><text x="44" y="604" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">brigantines</text><line x1="235" y1="625" x2="235" y2="647" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="650" width="410" height="71" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="44" y="676" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">AUG 1521</text><text x="44" y="702.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Tenochtitlan taken</text><text x="665" y="114" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="middle">PERU</text><rect x="460" y="130" width="410" height="98" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="474" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">BEFORE</text><text x="474" y="182.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Inca civil war</text><text x="474" y="210" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Huáscar against Atahualpa after Huayna Capac dies</text><line x1="665" y1="231" x2="665" y2="253" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="460" y="256" width="410" height="98" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="474" y="282" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">NOV 1532</text><text x="474" y="308.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Atahualpa captured at Cajamarca</text><text x="474" y="336" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">A vast ransom in gold and silver</text><line x1="665" y1="357" x2="665" y2="379" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="460" y="382" width="410" height="71" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="474" y="408" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">1533</text><text x="474" y="434.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Atahualpa executed; Cusco taken</text><line x1="665" y1="456" x2="665" y2="478" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="460" y="481" width="410" height="98" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="474" y="507" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">1536</text><text x="474" y="533.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Manco Inca rebels</text><text x="474" y="561" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Later rules a neo-Inca state from Vilcabamba</text><line x1="665" y1="582" x2="665" y2="604" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="460" y="607" width="410" height="98" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="474" y="633" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">1538-1541</text><text x="474" y="659.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Conquerors fight each other</text><text x="474" y="687" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Almagro executed (1538); Pizarro assassinated (1541)</text>
</svg>