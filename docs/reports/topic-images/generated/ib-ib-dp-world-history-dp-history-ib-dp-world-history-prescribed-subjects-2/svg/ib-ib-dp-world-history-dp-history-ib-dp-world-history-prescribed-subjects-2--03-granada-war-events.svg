<rect width="900" height="625" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The war for Granada, 1482-1492</text>

<line x1="160" y1="106" x2="160" y2="539" stroke="#1e2a44" stroke-width="4"/><rect x="194" y="96" width="676" height="69" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="207" y="123.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Alhama seized after a Granadan raid on Zahara</text><text x="207" y="147.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Open war begins</text><line x1="160" y1="130.5" x2="194" y2="130.5" stroke="#1e2a44" stroke-width="2.5"/><circle cx="160" cy="130.5" r="9" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="140" y="136.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1482</text><rect x="194" y="176" width="676" height="69" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="207" y="203.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Boabdil captured at Lucena</text><text x="207" y="227.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Released as a Castilian vassal, deepening Granada's civil war</text><line x1="160" y1="210.5" x2="194" y2="210.5" stroke="#1e2a44" stroke-width="2.5"/><circle cx="160" cy="210.5" r="9" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="140" y="216.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1483</text><rect x="194" y="256" width="676" height="69" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="207" y="283.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Ronda falls; Málaga taken (1487)</text><text x="207" y="307.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Much of Málaga's population enslaved; artillery made long sieges decisive</text><line x1="160" y1="290.5" x2="194" y2="290.5" stroke="#1e2a44" stroke-width="2.5"/><circle cx="160" cy="290.5" r="9" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="140" y="296.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1485-1487</text><rect x="194" y="336" width="676" height="45" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="207" y="363.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Baza falls; al-Zaghal surrenders his lands</text><line x1="160" y1="358.5" x2="194" y2="358.5" stroke="#1e2a44" stroke-width="2.5"/><circle cx="160" cy="358.5" r="9" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="140" y="364.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1489</text><rect x="194" y="392" width="676" height="45" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="207" y="419.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Granada besieged from the camp of Santa Fe</text><line x1="160" y1="414.5" x2="194" y2="414.5" stroke="#1e2a44" stroke-width="2.5"/><circle cx="160" cy="414.5" r="9" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="140" y="420.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1490-1491</text><rect x="194" y="448" width="676" height="45" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="207" y="475.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Treaty (Capitulations) of Granada</text><line x1="160" y1="470.5" x2="194" y2="470.5" stroke="#1e2a44" stroke-width="2.5"/><circle cx="160" cy="470.5" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="140" y="476.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Nov 1491</text><rect x="194" y="504" width="676" height="45" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="207" y="531.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The city surrenders</text><line x1="160" y1="526.5" x2="194" y2="526.5" stroke="#1e2a44" stroke-width="2.5"/><circle cx="160" cy="526.5" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="140" y="532.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">2 Jan 1492</text><rect x="30" y="563" width="314.595" height="29" rx="14.5" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><text x="187.2975" y="582.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">red edge: Granada's divisions exploited</text>
</svg>