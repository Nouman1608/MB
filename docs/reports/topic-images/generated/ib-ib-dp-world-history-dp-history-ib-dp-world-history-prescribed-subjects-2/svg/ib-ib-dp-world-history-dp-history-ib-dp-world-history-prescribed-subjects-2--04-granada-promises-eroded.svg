<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 688" width="900" height="688" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="688" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">From promises to forced conversion</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Impact on Muslims and Jews in Castile</text>
<rect x="30" y="124" width="560" height="102" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="45" y="151" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">NOV 1491</text><text x="45" y="177.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The Capitulations promise</text><text x="45" y="206.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Religion, mosques, property and law kept</text><line x1="310" y1="231" x2="310" y2="255" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="260" width="560" height="102" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="45" y="287" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">AFTER 1492</text><text x="45" y="313.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Talavera, first archbishop</text><text x="45" y="342.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Conversion by persuasion</text><line x1="310" y1="367" x2="310" y2="391" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="396" width="560" height="102" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="45" y="423" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FROM 1499</text><text x="45" y="449.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Cisneros presses mass baptisms</text><text x="45" y="478.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Revolts in the Albaicín and the Alpujarras (1499-1501)</text><line x1="310" y1="503" x2="310" y2="527" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="532" width="560" height="102" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="45" y="559" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">1502</text><text x="45" y="585.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Muslims in Castile: convert or leave</text><text x="45" y="614.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Those who stayed became moriscos</text>
<rect x="620" y="110" width="250" height="101" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="635" y="137" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FROM 1478</text><text x="635" y="163.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Inquisition in Castile</text><text x="635" y="191.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Policed converts</text><rect x="620" y="300" width="250" height="122" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="635" y="327" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">MARCH 1492</text><text x="635" y="353.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Alhambra Decree</text><text x="635" y="381.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Expelled Jews who would</text><text x="635" y="402.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">not convert</text><rect x="620" y="490" width="250" height="119" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="635" y="519.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Also</text><text x="635" y="547.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The conquest freed Castilian</text><text x="635" y="568.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">resources and confidence</text><text x="635" y="589.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">for expansion overseas</text></svg>