<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 648" width="900" height="648" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="648" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why Granada's survival ended</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Two centuries of balance, broken by two changes</text>
<rect x="30" y="124" width="840" height="114" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">BEFORE THE 1480s</text><text x="450" y="183.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Granada survives</text><text x="450" y="213.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">It pays tribute to Castile, and Castile is often divided</text><rect x="30" y="260" width="410" height="160" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="292" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CHANGE 1</text><text x="50" y="318.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Christian kingdoms united</text><text x="50" y="347.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="347.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Isabella of Castile marries Ferdinand of Aragon</text><text x="65.2" y="368.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">(1469)</text><text x="50" y="395.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="395.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Castilian succession war won (1475-1479)</text><rect x="460" y="260" width="410" height="160" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="480" y="292" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CHANGE 2</text><text x="480" y="318.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Granada divided</text><text x="480" y="347.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="495.2" y="347.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Dynastic struggle: emir Abu'l-Hasan Ali, his</text><text x="495.2" y="368.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">son Boabdil and his brother al-Zaghal</text><line x1="235" y1="244" x2="235" y2="258" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="665" y1="244" x2="665" y2="258" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="235" y1="442" x2="330" y2="476" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="665" y1="442" x2="570" y2="476" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="150" y="482" width="600" height="134" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="514" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">1482-1492</text><text x="450" y="541.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">War on Granada</text><text x="450" y="570.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Motives: religious crusade, backed by papal crusade taxes, and royal</text><text x="450" y="591.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">authority strengthened by directing the nobility against an external enemy</text>
</svg>