<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 731" width="900" height="731" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="731" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why did Mexico and Peru fall?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Not "guns and horses" alone: rank the factors and show how they interacted</text>
<line x1="320" y1="196.5" x2="410" y2="300.45" stroke="#1e2a44" stroke-width="2.5"/><line x1="320" y1="355.5" x2="410" y2="348.15" stroke="#1e2a44" stroke-width="2.5"/><line x1="320" y1="504" x2="410" y2="392.7" stroke="#1e2a44" stroke-width="2.5"/><line x1="580" y1="276" x2="490" y2="324.3" stroke="#1e2a44" stroke-width="2.5"/><line x1="580" y1="424.5" x2="490" y2="368.85" stroke="#1e2a44" stroke-width="2.5"/><circle cx="450" cy="345" r="80" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="339.54" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Spanish</text><text x="450" y="365.16" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">conquest</text><rect x="30" y="124" width="290" height="145" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="152" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ALLIES</text><text x="46" y="178.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Indigenous allies</text><text x="46" y="206.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Totonacs and Tlaxcalans;</text><text x="46" y="227.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">peoples who resented Mexica</text><text x="46" y="248.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">tribute</text><rect x="30" y="283" width="290" height="145" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="311" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DISEASE</text><text x="46" y="337.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Epidemics</text><text x="46" y="365.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Smallpox in Tenochtitlan; disease</text><text x="46" y="386.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">reached the Andes ahead of the</text><text x="46" y="407.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Spanish</text><rect x="30" y="442" width="290" height="124" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="470" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">INTERPRETERS</text><text x="46" y="496.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Malinche and Aguilar</text><text x="46" y="524.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Between Nahuatl, Maya and</text><text x="46" y="545.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Spanish</text><rect x="580" y="203.5" width="290" height="145" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="596" y="231.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">INDIGENOUS POLITICS</text><text x="596" y="257.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Inca civil war</text><text x="596" y="286.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Huáscar against Atahualpa</text><text x="596" y="307.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">decided who met Pizarro at</text><text x="596" y="328.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Cajamarca</text><rect x="580" y="362.5" width="290" height="124" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="596" y="390.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SPANISH ACTIONS</text><text x="596" y="416.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Seizing rulers; brigantines</text><text x="596" y="445.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Moctezuma and Atahualpa taken;</text><text x="596" y="466.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">a fleet on the lake for the siege</text><rect x="30" y="588" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="622.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Restall, Seven Myths of the Spanish Conquest (2003)</text><text x="50" y="652.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A few hundred Spaniards conquering empires is a myth: indigenous allies supplied most of the</text><text x="50" y="674.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">fighting forces, and disease and indigenous politics shaped the outcome.</text>
</svg>