<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 702" width="900" height="702" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="702" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Question 3: compare point by point</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Two sources on the fall of Tenochtitlan</text>
<rect x="30" y="124" width="360" height="153" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="210" y="191" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">SOURCE 1</text><text x="210" y="217.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Letter from Cortés to Charles V</text><rect x="510" y="124" width="360" height="153" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="690" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">SOURCE 2</text><text x="690" y="182.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Indigenous account compiled</text><text x="690" y="205.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">decades later</text><text x="690" y="233" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Under a Franciscan friar, like the Florentine</text><text x="690" y="253" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Codex</text><rect x="30" y="299" width="360" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="327.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The siege ended in the destruction of the</text><text x="44" y="348.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">city</text><rect x="510" y="299" width="360" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="524" y="327.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The siege ended in the destruction of the</text><text x="524" y="348.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">city</text><line x1="396" y1="334" x2="504" y2="334" stroke="#2e6b62" stroke-width="4" marker-start="url(#ahT)" marker-end="url(#ahT)"/><text x="450" y="322" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">SIMILARITY</text><rect x="30" y="383" width="360" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="411.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Victory from Spanish courage and divine</text><text x="44" y="432.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">favour</text><rect x="510" y="383" width="360" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="524" y="411.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Emphasises disease and the hunger of the</text><text x="524" y="432.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">besieged</text><line x1="396" y1="418" x2="504" y2="418" stroke="#b5602e" stroke-width="4" marker-start="url(#ahR)" marker-end="url(#ahR)"/><text x="450" y="406" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">DIFFERENCE</text><rect x="30" y="467" width="360" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="506.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Allies treated as auxiliaries</text><rect x="510" y="467" width="360" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="524" y="506.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Allies named as fighting their old overlords</text><line x1="396" y1="502" x2="504" y2="502" stroke="#b5602e" stroke-width="4" marker-start="url(#ahR)" marker-end="url(#ahR)"/><text x="450" y="490" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">DIFFERENCE</text><rect x="30" y="559" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="593.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Aim for</text><text x="50" y="623.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Two or three similarities and three or four differences, each sentence linking the two sources</text><text x="50" y="645.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">directly ("whereas", "similarly", "yet").</text>
</svg>