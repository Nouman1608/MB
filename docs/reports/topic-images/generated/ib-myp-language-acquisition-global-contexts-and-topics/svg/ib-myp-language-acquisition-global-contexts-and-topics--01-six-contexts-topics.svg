<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Six global contexts, many topics</text>

<rect x="30" y="110" width="415" height="136" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="60" cy="144" r="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="150.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="88" y="150" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Identities and relationships</text><text x="52" y="196" font-size="15.5" font-weight="400" fill="#2e6b62" text-anchor="start">friendship, family roles, healthy</text><text x="52" y="217" font-size="15.5" font-weight="400" fill="#2e6b62" text-anchor="start">routines, online life</text><rect x="455" y="110" width="415" height="136" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="485" cy="144" r="17" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="485" y="150.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="513" y="150" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Orientation in space and time</text><text x="477" y="196" font-size="15.5" font-weight="400" fill="#2e6b62" text-anchor="start">moving house, my town then and now,</text><text x="477" y="217" font-size="15.5" font-weight="400" fill="#2e6b62" text-anchor="start">travel, migration stories</text><rect x="30" y="260" width="415" height="136" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="60" cy="294" r="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="300.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="88" y="300" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Personal and cultural expression</text><text x="52" y="346" font-size="15.5" font-weight="400" fill="#2e6b62" text-anchor="start">music, festivals, fashion, hobbies,</text><text x="52" y="367" font-size="15.5" font-weight="400" fill="#2e6b62" text-anchor="start">celebrations</text><rect x="455" y="260" width="415" height="136" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="485" cy="294" r="17" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="485" y="300.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="513" y="300" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Scientific and technical</text><text x="513" y="322" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">innovation</text><text x="477" y="346" font-size="15.5" font-weight="400" fill="#2e6b62" text-anchor="start">phones, social media, online learning,</text><text x="477" y="367" font-size="15.5" font-weight="400" fill="#2e6b62" text-anchor="start">transport inventions</text><rect x="30" y="410" width="415" height="136" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="60" cy="444" r="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="450.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="88" y="450" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Globalization and sustainability</text><text x="52" y="496" font-size="15.5" font-weight="400" fill="#2e6b62" text-anchor="start">food waste, recycling, fast fashion,</text><text x="52" y="517" font-size="15.5" font-weight="400" fill="#2e6b62" text-anchor="start">tourism</text><rect x="455" y="410" width="415" height="136" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="485" cy="444" r="17" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="485" y="450.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">6</text><text x="513" y="450" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Fairness and development</text><text x="477" y="496" font-size="15.5" font-weight="400" fill="#2e6b62" text-anchor="start">access to education, volunteering, school</text><text x="477" y="517" font-size="15.5" font-weight="400" fill="#2e6b62" text-anchor="start">rules, fair trade</text><text x="450" y="580" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Example topics are Marlbridge suggestions, not an IB list; ask your teacher for the topic list.</text>
