<rect width="900" height="750" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A layered word bank: food waste</text>

<text x="450" y="130" font-size="16" font-weight="600" fill="#4a5568" text-anchor="middle">Topic: food waste (Globalization and sustainability). Aim for 8–10 items per layer.</text><rect x="30" y="148" width="230" height="72" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.2"/><circle cx="58" cy="184" r="15" fill="#fff" stroke="#1e2a44" stroke-width="3"/><text x="58" y="189.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="82" y="190" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Core nouns</text><rect x="274" y="148" width="596" height="72" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="292" y="190" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">leftovers, packaging, sell-by date, compost, landfill, portion, canteen</text><rect x="30" y="232" width="230" height="72" rx="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.2"/><circle cx="58" cy="268" r="15" fill="#fff" stroke="#1e2a44" stroke-width="3"/><text x="58" y="273.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="82" y="274" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Verbs</text><rect x="274" y="232" width="596" height="72" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="292" y="264" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">throw away food, reduce waste, recycle packaging, donate surplus food,</text><text x="292" y="284" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">plan meals</text><rect x="30" y="316" width="230" height="72" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.2"/><circle cx="58" cy="352" r="15" fill="#fff" stroke="#1e2a44" stroke-width="3"/><text x="58" y="357.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="82" y="358" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Describing words</text><rect x="274" y="316" width="596" height="72" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="292" y="358" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">wasteful, fresh, out of date, avoidable, harmful, extremely, slightly</text><rect x="30" y="400" width="230" height="72" rx="10" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.2"/><circle cx="58" cy="436" r="15" fill="#fff" stroke="#1e2a44" stroke-width="3"/><text x="58" y="441.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="82" y="442" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Opinion and linking</text><rect x="274" y="400" width="596" height="72" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="292" y="442" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">in my view, I am convinced that, as a result, whereas, above all</text><rect x="30" y="484" width="230" height="72" rx="10" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.2"/><circle cx="58" cy="520" r="15" fill="#fff" stroke="#1e2a44" stroke-width="3"/><text x="58" y="525.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="82" y="526" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Chunks</text><rect x="274" y="484" width="596" height="72" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="292" y="516" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">make a difference, it is a shame that, the problem is that, on the other</text><text x="292" y="536" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">hand</text><rect x="30" y="574" width="840" height="150" rx="14" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.5"/><text x="52" y="608" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">6  Scale (from the Criterion C wording)</text><rect x="52" y="624" width="258" height="86" rx="10" fill="#ffffff" stroke="#2e6b62" stroke-width="1.8"/><text x="66" y="650" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Personal</text><text x="66" y="674" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">I plan my lunch so I finish</text><text x="66" y="692" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">it.</text><rect x="324" y="624" width="258" height="86" rx="10" fill="#ffffff" stroke="#2e6b62" stroke-width="1.8"/><text x="338" y="650" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Local</text><text x="338" y="674" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">our canteen gives unsold bread</text><text x="338" y="692" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">to a food bank</text><rect x="596" y="624" width="258" height="86" rx="10" fill="#ffffff" stroke="#2e6b62" stroke-width="1.8"/><text x="610" y="650" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Global</text><text x="610" y="674" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">food waste links to wider</text><text x="610" y="692" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">environmental harm</text>
</svg>