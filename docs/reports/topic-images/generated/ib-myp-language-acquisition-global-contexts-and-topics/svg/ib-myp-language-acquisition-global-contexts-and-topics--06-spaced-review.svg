<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A review routine that works</text>

<rect x="30" y="110" width="840" height="260" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="55" y="146" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Space your reviews</text><line x1="80" y1="260" x2="830" y2="260" stroke="#1e2a44" stroke-width="2.5"/><line x1="80" y1="255" x2="80" y2="265" stroke="#4a5568" stroke-width="1.5"/><line x1="133.57142857142856" y1="255" x2="133.57142857142856" y2="265" stroke="#4a5568" stroke-width="1.5"/><line x1="187.14285714285714" y1="255" x2="187.14285714285714" y2="265" stroke="#4a5568" stroke-width="1.5"/><line x1="240.7142857142857" y1="255" x2="240.7142857142857" y2="265" stroke="#4a5568" stroke-width="1.5"/><line x1="294.2857142857143" y1="255" x2="294.2857142857143" y2="265" stroke="#4a5568" stroke-width="1.5"/><line x1="347.8571428571429" y1="255" x2="347.8571428571429" y2="265" stroke="#4a5568" stroke-width="1.5"/><line x1="401.4285714285714" y1="255" x2="401.4285714285714" y2="265" stroke="#4a5568" stroke-width="1.5"/><line x1="455" y1="255" x2="455" y2="265" stroke="#4a5568" stroke-width="1.5"/><line x1="508.57142857142856" y1="255" x2="508.57142857142856" y2="265" stroke="#4a5568" stroke-width="1.5"/><line x1="562.1428571428571" y1="255" x2="562.1428571428571" y2="265" stroke="#4a5568" stroke-width="1.5"/><line x1="615.7142857142858" y1="255" x2="615.7142857142858" y2="265" stroke="#4a5568" stroke-width="1.5"/><line x1="669.2857142857142" y1="255" x2="669.2857142857142" y2="265" stroke="#4a5568" stroke-width="1.5"/><line x1="722.8571428571428" y1="255" x2="722.8571428571428" y2="265" stroke="#4a5568" stroke-width="1.5"/><line x1="776.4285714285714" y1="255" x2="776.4285714285714" y2="265" stroke="#4a5568" stroke-width="1.5"/><line x1="830" y1="255" x2="830" y2="265" stroke="#4a5568" stroke-width="1.5"/><circle cx="80" cy="260" r="22" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="80" y="266" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="80" y="222" font-size="15" font-weight="600" fill="#8a6d0d" text-anchor="middle">learn</text><circle cx="133.57142857142856" cy="260" r="18" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="133.57142857142856" y="266" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="133.57142857142856" y="222" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="middle">review</text><circle cx="240.7142857142857" cy="260" r="18" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="240.7142857142857" y="266" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="240.7142857142857" y="222" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="middle">review</text><circle cx="455" cy="260" r="18" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="455" y="266" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">8</text><text x="455" y="222" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="middle">review</text><circle cx="830" cy="260" r="18" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="830" y="266" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">15</text><text x="830" y="222" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="middle">review</text><text x="455" y="316" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">day</text><text x="455" y="348" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">words fade if you meet them only once</text><rect x="30" y="390" width="410" height="140" rx="14" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.5"/><text x="52" y="426" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Each review</text><text x="52" y="456" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">test from English first</text><text x="52" y="478" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(productive), then check;</text><text x="52" y="500" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">missed items go in a “tricky” column</text><rect x="460" y="390" width="410" height="140" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="482" y="426" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="start">Before an assessed task</text><text x="482" y="456" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">five minutes rebuilding the</text><text x="482" y="478" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">bank for that topic from</text><text x="482" y="500" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">memory</text>
</svg>