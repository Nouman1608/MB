<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 695" width="900" height="695" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="695" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Receptive and productive vocabulary</text>

<circle cx="450" cy="300" r="190" fill="#dce9e7" stroke="#2e6b62" stroke-width="3"/><circle cx="450" cy="380" r="100" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="160" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="middle">Receptive (R)</text><text x="450" y="186" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">words you recognise</text><text x="450" y="216" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="middle">listening A, reading B</text><text x="450" y="370" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Productive (P)</text><text x="450" y="394" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">words you can use</text><text x="450" y="418" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">speaking C, writing D</text><rect x="30" y="510" width="410" height="130" rx="14" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.5"/><text x="52" y="546" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">For A and B: breadth</text><text x="52" y="576" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">many words, including synonyms,</text><text x="52" y="598" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">to spot an idea however it is put</text><rect x="460" y="510" width="410" height="130" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="482" y="546" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="start">For C and D: depth</text><text x="482" y="576" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">fewer words, with correct gender,</text><text x="482" y="598" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">spelling, forms and collocations</text><text x="450" y="672" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Test both ways: target language → English checks R; English → target language checks P.</text>
</svg>