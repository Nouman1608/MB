<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 740" width="900" height="740" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="740" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">One bank, four skills</text>

<rect x="330" y="290" width="240" height="110" rx="16" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="334" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">One word bank</text><text x="450" y="362" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">e.g. “keep in touch with”</text><rect x="30" y="110" width="400" height="130" rx="14" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.5"/><text x="52" y="148" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">A Listening</text><text x="52" y="178" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">predict words and synonyms: “throw away” →</text><text x="52" y="199" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">waste, get rid of, bin</text><rect x="470" y="110" width="400" height="130" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="492" y="148" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">B Reading</text><text x="492" y="178" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">word families (waste → wasteful); context;</text><text x="492" y="199" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">watch for false friends</text><rect x="30" y="460" width="400" height="130" rx="14" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.5"/><text x="52" y="498" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">C Speaking</text><text x="52" y="528" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">recycle chunks; move personal → local →</text><text x="52" y="549" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">global; describe a lost word</text><rect x="470" y="460" width="400" height="130" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="492" y="498" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">D Writing</text><text x="492" y="528" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">opinion and linking layer for structure;</text><text x="492" y="549" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">precise verbs; steady register</text><line x1="380" y1="288" x2="300" y2="244" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="520" y1="288" x2="600" y2="244" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="380" y1="402" x2="300" y2="456" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="520" y1="402" x2="600" y2="456" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="610" width="840" height="106" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="55" y="644" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Speaking with one chunk at three scales</text><text x="55" y="672" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“Personally, I keep in touch with my cousin by video call. … Globally, it means</text><text x="55" y="693" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">people can have friends in other countries.”</text>
</svg>