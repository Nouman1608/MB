<rect x="55" y="124" width="140" height="84" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="125" y="160" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Source A</text><text x="125" y="186" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="middle">pre-released</text><line x1="125" y1="214" x2="352.5" y2="270" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="217" y="124" width="140" height="84" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="287" y="160" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Source B</text><text x="287" y="186" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="middle">pre-released</text><line x1="287" y1="214" x2="401.1" y2="270" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="379" y="124" width="140" height="84" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="449" y="160" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Source C</text><text x="449" y="186" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="middle">pre-released</text><line x1="449" y1="214" x2="449.7" y2="270" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="541" y="124" width="140" height="84" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="611" y="160" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Source D</text><text x="611" y="186" font-size="15" font-weight="600" fill="#8a6d0d" text-anchor="middle">unseen</text><line x1="611" y1="214" x2="498.3" y2="270" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="703" y="124" width="140" height="84" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="773" y="160" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Source E</text><text x="773" y="186" font-size="15" font-weight="600" fill="#8a6d0d" text-anchor="middle">unseen</text><line x1="773" y1="214" x2="546.9" y2="270" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="250" y="276" width="400" height="110" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="311.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Your judgement on the issue</text><text x="450" y="340.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Usually a statement ("The main reason...</text><text x="450" y="361.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">was...") or "how far"</text><rect x="690" y="276" width="180" height="110" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="780" y="324.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Own</text><text x="780" y="347.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">knowledge</text><line x1="684" y1="331" x2="656" y2="331" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="30" y="416" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">WHAT IT REWARDS</text><rect x="30" y="434" width="268" height="155" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="476.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">1</text><text x="50" y="504.1" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Range</text><text x="50" y="533.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Several sources, both</text><text x="50" y="554.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">pre-released and unseen.</text><rect x="316" y="434" width="268" height="155" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="336" y="466" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">2</text><text x="336" y="493.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Linking</text><text x="336" y="522.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">How sources support,</text><text x="336" y="543.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">contradict or explain one</text><text x="336" y="564.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">another.</text><rect x="602" y="434" width="268" height="155" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="622" y="466" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">3</text><text x="622" y="493.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Judgement</text><text x="622" y="522.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">An overall conclusion,</text><text x="622" y="543.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">supported by sources and</text><text x="622" y="564.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">own knowledge.</text>
