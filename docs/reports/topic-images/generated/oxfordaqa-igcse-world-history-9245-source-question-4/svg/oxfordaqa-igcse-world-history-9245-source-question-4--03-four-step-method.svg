<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 578" width="900" height="578" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="578" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four steps in the exam</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Suggested timings (bar widths to scale)</text>
<rect x="30" y="124" width="46.666666666666664" height="80" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="53.33333333333333" y="160" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="53.33333333333333" y="184" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">1 min</text><rect x="76.66666666666666" y="124" width="140" height="80" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="146.66666666666666" y="160" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">2 · Sort</text><text x="146.66666666666666" y="184" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">3 min</text><rect x="216.66666666666666" y="124" width="560" height="80" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="496.66666666666663" y="160" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">3 · Write linked paragraphs</text><text x="496.66666666666663" y="184" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">about 12 minutes</text><rect x="776.6666666666666" y="124" width="93.33333333333333" height="80" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="823.3333333333333" y="160" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">4 · Judge</text><text x="823.3333333333333" y="184" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">2 min</text><rect x="30" y="220" width="411" height="154" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="252" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STEP 1</text><text x="50" y="278.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Read the issue precisely</text><text x="50" y="307.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Underline key words ("main reason",</text><text x="50" y="328.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">"successful", "1920s"). What counts as agreeing</text><text x="50" y="349.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">or disagreeing?</text><rect x="459" y="220" width="411" height="154" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="479" y="262.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STEP 2</text><text x="479" y="289.32" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Sort the sources</text><text x="479" y="318.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Quick grid: supports / challenges / either way,</text><text x="479" y="339.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">each with a one-word reason.</text><rect x="30" y="392" width="411" height="154" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="424" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">STEP 3</text><text x="50" y="450.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Organise by argument, not by source</text><text x="50" y="479.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Each paragraph: a point, two or more sources</text><text x="50" y="500.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">together, provenance where it matters, own</text><text x="50" y="521.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">knowledge.</text><rect x="459" y="392" width="411" height="154" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="479" y="434.5" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">STEP 4</text><text x="479" y="461.32" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Judge</text><text x="479" y="490.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A clear answer: which evidence is weightier, and</text><text x="479" y="511.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">why.</text>
</svg>