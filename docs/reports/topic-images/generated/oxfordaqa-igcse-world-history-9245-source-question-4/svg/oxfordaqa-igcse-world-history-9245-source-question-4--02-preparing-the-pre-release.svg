<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 645" width="900" height="645" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="645" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Preparing the pre-release</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Released 1 February (May/June) or 1 July (October/November); no notes in the exam</text>
<line x1="60" y1="144" x2="60" y2="593" stroke="#c9d6d4" stroke-width="4"/><rect x="104" y="124" width="766" height="105" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="156.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">List the issues each source could serve</text><text x="122" y="185.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A Corfu cartoon could serve the League's weaknesses, great-power behaviour or Mussolini's</text><text x="122" y="206.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">foreign policy.</text><circle cx="60" cy="176.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="185.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="104" y="241" width="766" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="273.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Decide which side of likely debates it supports</text><text x="122" y="302.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">E.g. support or challenge "the League succeeded in the 1920s"?</text><circle cx="60" cy="283" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="291.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="104" y="337" width="766" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="369.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Learn the provenance and its consequences</text><text x="122" y="398.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Who made it, when, and what that makes it good evidence of.</text><circle cx="60" cy="379" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="387.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="104" y="433" width="766" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="465.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Rehearse links</text><text x="122" y="494.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Which sources agree, which disagree, and why.</text><circle cx="60" cy="475" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="483.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="104" y="529" width="766" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="561.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Learn knowledge that extends each source</text><text x="122" y="590.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">One or two precise facts per source, ready to add.</text><circle cx="60" cy="571" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="579.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text>
</svg>