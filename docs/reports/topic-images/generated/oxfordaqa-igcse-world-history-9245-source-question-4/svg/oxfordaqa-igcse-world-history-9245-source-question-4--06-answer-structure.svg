<rect width="900" height="698" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The worked answer, paragraph by paragraph</text>

<rect x="30" y="100" width="840" height="134" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PARAGRAPH 1: REAL SUCCESSES</text><text x="50" y="159.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Sources A + D + C</text><text x="50" y="188.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Aaland Islands; Greek-Bulgarian dispute (1925); health and refugee work. Own knowledge: Upper Silesia</text><text x="50" y="209.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">plebiscite (1921).</text><line x1="450" y1="239" x2="450" y2="269" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="274" width="840" height="134" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="306" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">PARAGRAPH 2: THE LIMITS</text><text x="50" y="333.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Sources D + B + E</text><text x="50" y="362.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Success only when "both parties were small"; Corfu (1923); Poland kept Vilna. Own knowledge: Locarno</text><text x="50" y="383.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">(1925) and Kellogg-Briand (1928) outside the League; the USA never joined.</text><line x1="450" y1="413" x2="450" y2="443" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="448" width="840" height="134" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="50" y="480" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">JUDGEMENT</text><text x="50" y="507.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Largely disagree</text><text x="50" y="536.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Success in minor disputes between small powers; failure when a great power or a determined state used</text><text x="50" y="557.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">force.</text><rect x="136.01749999999998" y="598" width="174.825" height="29" rx="14.5" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="223.42999999999998" y="617.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">all five sources used</text><rect x="320.8425" y="598" width="204.54" height="29" rx="14.5" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="423.11249999999995" y="617.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">linked in each paragraph</text><rect x="535.3824999999999" y="598" width="228.6" height="29" rx="14.5" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="649.6824999999999" y="617.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">provenance weighs A and D</text><rect x="244.435" y="637" width="225.6" height="29" rx="14.5" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="357.235" y="656.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">own knowledge throughout</text><rect x="480.03499999999997" y="637" width="175.53" height="29" rx="14.5" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="567.8" y="656.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">judgement says why</text>
</svg>