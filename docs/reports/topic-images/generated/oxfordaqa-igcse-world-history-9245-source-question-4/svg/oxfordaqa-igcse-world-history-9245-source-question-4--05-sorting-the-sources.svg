<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Step 2 in action: sorting the sources</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">"The League was successful in keeping peace in the 1920s" (invented sources)</text>
<clipPath id="tc124"><rect x="30" y="124" width="840" height="185" rx="14"/></clipPath><g clip-path="url(#tc124)"><rect x="30" y="124" width="280" height="49" fill="#b5d3cf"/><text x="44" y="152.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Supports the view</text><rect x="310" y="124" width="280" height="49" fill="#f2e7b8"/><text x="324" y="152.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Challenges the view</text><rect x="590" y="124" width="280" height="49" fill="#efdfa8"/><text x="604" y="152.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Used both ways</text><rect x="30" y="173" width="280" height="68" fill="#ffffff"/><text x="44" y="199.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">A</tspan> · Aaland settled; Swedish</text><text x="44" y="220.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">paper shows Swedes accepting</text><rect x="310" y="173" width="280" height="68" fill="#ffffff"/><text x="324" y="199.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">B</tspan> · Corfu: Greece paid; "size of</text><text x="324" y="220.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">your navy"</text><rect x="590" y="173" width="280" height="68" fill="#ffffff"/><text x="604" y="199.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">D</tspan> · Bulgaria (1925) went well...</text><line x1="30" y1="241" x2="870" y2="241" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="241" width="280" height="68" fill="#f8faf9"/><text x="44" y="267.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">C</tspan> · health and refugee work</text><text x="44" y="288.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(League official, would praise)</text><rect x="310" y="241" width="280" height="68" fill="#f8faf9"/><text x="324" y="267.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">E</tspan> · Poland kept Vilna; League not</text><text x="324" y="288.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">even mentioned</text><rect x="590" y="241" width="280" height="68" fill="#f8faf9"/><text x="604" y="267.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">...but only "because both parties</text><text x="604" y="288.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">were small"</text></g><line x1="310" y1="124" x2="310" y2="309" stroke="#c9d6d4" stroke-width="1.5"/><line x1="590" y1="124" x2="590" y2="309" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="124" width="840" height="185" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/><text x="30" y="339" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">USE PROVENANCE TO WEIGH</text><rect x="30" y="357" width="268" height="150" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="412.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Source A: strong</text><text x="50" y="440.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">From the losing side, yet</text><text x="50" y="461.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">shows the decision accepted.</text><rect x="316" y="357" width="268" height="150" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="336" y="391.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Source C: check it</text><text x="336" y="419.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A League official would want</text><text x="336" y="440.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">to praise its work; own</text><text x="336" y="461.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">knowledge confirms the</text><text x="336" y="482.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">health work.</text><rect x="602" y="357" width="268" height="150" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="622" y="401.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Source D: weighty</text><text x="622" y="430.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A private letter by a diplomat</text><text x="622" y="451.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">with no reason to flatter the</text><text x="622" y="472.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">League.</text>
