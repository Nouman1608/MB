s the overall policy; D shows how it worked in one case.</text><rect x="30" y="460" width="205" height="78" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="50" y="479" width="52" height="40" rx="7" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="76" y="506" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">A</text><rect x="110" y="479" width="52" height="40" rx="7" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5" stroke-dasharray="6 4"/><text x="136" y="506" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="middle">?</text><rect x="170" y="479" width="52" height="40" rx="7" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="196" y="506" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">B</text><rect x="250" y="460" width="620" height="78" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="264" y="489.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Context fills a gap</text><text x="264" y="518.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">No source mentions something important; own knowledge supplies it.</text>
