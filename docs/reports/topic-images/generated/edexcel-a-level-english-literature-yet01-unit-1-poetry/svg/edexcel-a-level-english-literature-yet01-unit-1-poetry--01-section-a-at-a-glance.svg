<rect width="900" height="673" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Unit 1 Section A at a glance</text>

<text x="30" y="118" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">Unit 1 · 2 hours · 50 marks</text><rect x="30" y="130" width="420" height="74" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="240" y="162" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Section A: Post-2000 Poetry</text><text x="240" y="188" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">25 marks · one comparative essay</text><rect x="450" y="130" width="420" height="74" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="660" y="162" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Section B</text><text x="660" y="188" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">25 marks</text><rect x="30" y="130" width="840" height="74" fill="none" stroke="#1e2a44" stroke-width="3"/><path d="M70,228 L158,228 L180,250 L180,368 L70,368 Z" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><path d="M158,228 L158,250 L180,250" fill="#c9d6d4" stroke="#1e2a44" stroke-width="2"/><line x1="82" y1="258" x2="143.12" y2="258" stroke="#c9d6d4" stroke-width="5" stroke-linecap="round"/><line x1="82" y1="272" x2="161.12" y2="272" stroke="#c9d6d4" stroke-width="5" stroke-linecap="round"/><line x1="82" y1="286" x2="146.5" y2="286" stroke="#c9d6d4" stroke-width="5" stroke-linecap="round"/><line x1="82" y1="300" x2="161.12" y2="300" stroke="#c9d6d4" stroke-width="5" stroke-linecap="round"/><line x1="82" y1="314" x2="161.12" y2="314" stroke="#c9d6d4" stroke-width="5" stroke-linecap="round"/><line x1="82" y1="328" x2="146.5" y2="328" stroke="#c9d6d4" stroke-width="5" stroke-linecap="round"/><line x1="82" y1="342" x2="161.12" y2="342" stroke="#c9d6d4" stroke-width="5" stroke-linecap="round"/><line x1="82" y1="356" x2="161.12" y2="356" stroke="#c9d6d4" stroke-width="5" stroke-linecap="round"/><text x="125" y="394" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">named poem</text><line x1="196" y1="298" x2="254" y2="298" stroke="#1e2a44" stroke-width="3" marker-start="url(#ah)" marker-end="url(#ah)"/><path d="M270,228 L358,228 L380,250 L380,368 L270,368 Z" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><path d="M358,228 L358,250 L380,250" fill="#c9d6d4" stroke="#1e2a44" stroke-width="2"/><line x1="282" y1="258" x2="343.12" y2="258" stroke="#c9d6d4" stroke-width="5" stroke-linecap="round"/><line x1="282" y1="272" x2="361.12" y2="272" stroke="#c9d6d4" stroke-width="5" stroke-linecap="round"/><line x1="282" y1="286" x2="346.5" y2="286" stroke="#c9d6d4" stroke-width="5" stroke-linecap="round"/><line x1="282" y1="300" x2="361.12" y2="300" stroke="#c9d6d4" stroke-width="5" stroke-linecap="round"/><line x1="282" y1="314" x2="361.12" y2="314" stroke="#c9d6d4" stroke-width="5" stroke-linecap="round"/><line x1="282" y1="328" x2="346.5" y2="328" stroke="#c9d6d4" stroke-width="5" stroke-linecap="round"/><line x1="282" y1="342" x2="361.12" y2="342" stroke="#c9d6d4" stroke-width="5" stroke-linecap="round"/><line x1="282" y1="356" x2="361.12" y2="356" stroke="#c9d6d4" stroke-width="5" stroke-linecap="round"/><text x="325" y="394" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">your choice</text><rect x="420" y="222" width="450" height="180" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="440" y="269.3" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="455.2" y="269.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">One essay from a choice of two.</text><text x="440" y="295.3" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="455.2" y="295.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The second poem is a free choice from the</text><text x="455.2" y="316.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">prescribed list.</text><text x="440" y="342.3" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="455.2" y="342.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Open book: the list of prescribed poems is</text><text x="455.2" y="363.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">printed in a Source Booklet.</text><rect x="30" y="420" width="270.6666666666667" height="125" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="452.8" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="start">AO1</text><text x="46" y="482.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A clear thesis, a sustained</text><text x="46" y="503.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">argument, precise</text><text x="46" y="524.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">terminology.</text><rect x="314.6666666666667" y="420" width="270.6666666666667" height="125" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="330.6666666666667" y="452.8" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="start">AO2</text><text x="330.6666666666667" y="482.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Close analysis of form,</text><text x="330.6666666666667" y="503.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">structure, language, sound</text><text x="330.6666666666667" y="524.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">and voice in both poems.</text><rect x="599.3333333333334" y="420" width="270.6666666666667" height="125" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="615.3333333333334" y="452.8" font-size="21" font-weight="700" fill="#8a6d0d" text-anchor="start">AO4</text><text x="615.3333333333334" y="482.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Similarities and differences</text><text x="615.3333333333334" y="503.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">explored throughout, in</text><text x="615.3333333333334" y="524.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">ideas and methods.</text><rect x="30" y="563" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="596.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">AO3 is not assessed in this section. AO4 is assessed in Unit 1 only in Section A, so all of</text><text x="50" y="618.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">the unit’s comparison credit rests on this essay.</text>
</svg>