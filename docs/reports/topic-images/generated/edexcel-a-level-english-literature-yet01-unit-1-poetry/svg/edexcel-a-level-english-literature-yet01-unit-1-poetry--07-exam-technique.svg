<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 530" width="900" height="530" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="530" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Exam technique and the open book</text>

<text x="30" y="126" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">Unit 1: two hours</text><rect x="30" y="134" width="35" height="60" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><rect x="65" y="134" width="385" height="60" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="257.5" y="171" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">write Section A</text><rect x="450" y="134" width="420" height="60" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="660" y="171" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Section B</text><path d="M47.5,196 L47.5,218" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><text x="30" y="238" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="start">about five minutes: decide the second poem and a four-row grid</text><path d="M30,252 L30,262 L450,262 L450,252" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><text x="240" y="286" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">roughly an hour for Section A</text><rect x="30" y="312" width="201" height="194" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="339.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Read both</text><text x="44" y="361.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">questions</text><text x="44" y="388" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">One may suit your</text><text x="44" y="408" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">strongest pairing</text><text x="44" y="428" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">better.</text><rect x="243" y="312" width="201" height="194" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="257" y="339.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Navigate the open</text><text x="257" y="361.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">book</text><text x="257" y="388" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Know where key lines</text><text x="257" y="408" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">are. Check with your</text><text x="257" y="428" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">centre which copies</text><text x="257" y="448" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">are allowed and</text><text x="257" y="468" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">whether they may be</text><text x="257" y="488" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">annotated.</text><rect x="456" y="312" width="201" height="194" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="470" y="339.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Quote briefly</text><text x="470" y="366" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">A few words analysed</text><text x="470" y="386" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">closely earn more than</text><text x="470" y="406" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">a stanza copied out.</text><rect x="669" y="312" width="201" height="194" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="683" y="339.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Key word every</text><text x="683" y="361.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">time</text><text x="683" y="388" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Keep the question’s</text><text x="683" y="408" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">key word in every</text><text x="683" y="428" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">topic sentence.</text>
</svg>