<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 801" width="900" height="801" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="801" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Modelling the method on two original poems</text>

<rect x="30" y="116" width="412" height="212" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="150" font-size="19" font-weight="700" fill="#1e2a44">Poem A: Inventory <tspan font-weight="400" font-style="italic" fill="#4a5568" font-size="15">(original)</tspan></text><text x="50" y="190" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Three coats, one with a button missing.</text><text x="50" y="224" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A tin of keys to doors we no longer own.</text><text x="50" y="258" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Her reading glasses, folded, as if</text><text x="50" y="292" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">she has only stepped into the garden.</text><rect x="458" y="116" width="412" height="212" rx="14" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="478" y="150" font-size="19" font-weight="700" fill="#1e2a44">Poem B: Clearing the House <tspan font-weight="400" font-style="italic" fill="#4a5568" font-size="15">(original)</tspan></text><text x="478" y="190" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">We worked in silence, room by room,</text><text x="478" y="224" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">deciding what to keep and what to give,</text><text x="478" y="258" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and when the van had gone I stood</text><text x="478" y="292" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">in the bare kitchen, and the kitchen stood in me.</text><text x="450" y="360" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle" font-style="italic">Compare the ways in which the poets present the possessions of the dead.</text><rect x="30" y="380" width="160" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="42" y="410" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start"></text><rect x="190" y="380" width="340" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="202" y="410" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Inventory</text><rect x="530" y="380" width="340" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="542" y="410" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Clearing the House</text><rect x="30" y="426" width="160" height="85" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="451.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Form</text><rect x="190" y="426" width="340" height="85" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="202" y="451.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A list without a main verb until its</text><text x="202" y="472.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">final sentence: she is present only</text><text x="202" y="493.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">through things.</text><rect x="530" y="426" width="340" height="85" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="542" y="451.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">One long sentence; verbs of work</text><text x="542" y="472.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">(“worked”, “deciding”) delay grief.</text><rect x="30" y="511" width="160" height="106" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="536.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Key moment</text><rect x="190" y="511" width="340" height="106" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="202" y="536.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The simile “as if / she has only</text><text x="202" y="557.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">stepped into the garden”: a moment of</text><text x="202" y="578.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">denial; enjambment after “as if” makes</text><text x="202" y="599.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">us hesitate.</text><rect x="530" y="511" width="340" height="106" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="542" y="536.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The chiasmus “I stood / in the bare</text><text x="542" y="557.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">kitchen, and the kitchen stood in me”.</text><rect x="30" y="617" width="160" height="64" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="642.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Where grief</text><text x="42" y="663.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">sits</text><rect x="190" y="617" width="340" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="202" y="642.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Kept outside the speaker: we observe</text><text x="202" y="663.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">an absence.</text><rect x="530" y="617" width="340" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="542" y="642.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Turned inward: we feel it.</text><rect x="30" y="697" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="730.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Methods (list form, simile, enjambment, syntax, chiasmus) and attitudes (denial,</text><text x="50" y="752.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">internalised grief) are compared in the same sentences, showing AO4 and AO2 together.</text>
</svg>