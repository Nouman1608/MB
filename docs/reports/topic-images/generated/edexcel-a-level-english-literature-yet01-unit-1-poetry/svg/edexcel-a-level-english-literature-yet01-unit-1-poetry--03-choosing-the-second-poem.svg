<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 516" width="900" height="516" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="516" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Choosing the second poem</text>

<rect x="30" y="120" width="250" height="120" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="170" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">GIVEN</text><text x="50" y="197" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">The named poem</text><line x1="288" y1="180" x2="340" y2="180" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="350" y="120" width="470" height="54" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="364" y="151.7" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">The one you know best</text><circle cx="846" cy="147" r="16" fill="#b5602e"/><path d="M839.6,140.6 l12.8,12.8 m0,-12.8 l-12.8,12.8" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="350" y="188" width="470" height="54" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="364" y="219.7" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The one that lets you argue</text><circle cx="846" cy="215" r="16" fill="#2e6b62"/><path d="M838.8,215.32 l5.12,5.44 l9.6,-10.56" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><text x="30" y="276" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">A good second poem</text><rect x="30" y="292" width="270.6666666666667" height="126" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="335.7" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Shares the focus</text><text x="46" y="364.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Clearly enough to compare in</text><text x="46" y="385.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">every paragraph.</text><rect x="314.6666666666667" y="292" width="270.6666666666667" height="126" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="330.6666666666667" y="335.7" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Treats it differently</text><text x="330.6666666666667" y="364.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">In attitude, voice or</text><text x="330.6666666666667" y="385.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">method.</text><rect x="599.3333333333334" y="292" width="270.6666666666667" height="126" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="615.3333333333334" y="323.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Offers formal</text><text x="615.3333333333334" y="348.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">contrast</text><text x="615.3333333333334" y="376.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Stanza shape, rhyme, voice,</text><text x="615.3333333333334" y="397.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">address.</text><rect x="30" y="434" width="840" height="58" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="467.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Spend about five minutes deciding the second poem and sketching a four-row comparison grid.</text>
</svg>