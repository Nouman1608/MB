<rect x="30" y="116" width="270" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="42" y="146" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Broad theme</text><rect x="300" y="116" width="570" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="312" y="146" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Poems you could group</text><rect x="30" y="162" width="270" height="43" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="187.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Memory and childhood</text><rect x="300" y="162" width="570" height="43" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="312" y="187.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">To My Nine-Year-Old Self · Material · Out of the Bag · Genetics</text><rect x="30" y="205" width="270" height="43" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="230.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Parents, loss and grief</text><rect x="300" y="205" width="570" height="43" fill="#fbf8ea" stroke="#1e2a44" stroke-width="2"/><text x="312" y="230.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Effects · Material · On Her Blindness · Genetics</text><rect x="30" y="248" width="270" height="43" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="273.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Identity and belonging</text><rect x="300" y="248" width="570" height="43" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="312" y="273.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Look We Have Coming to Dover · The Deliverer · The Map Woman</text><rect x="30" y="291" width="270" height="64" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="316.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Violence, power and</text><text x="42" y="337.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">control</text><rect x="300" y="291" width="570" height="64" fill="#fbf8ea" stroke="#1e2a44" stroke-width="2"/><text x="312" y="316.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The Gun · Chainsaw Versus the Pampas Grass · The Lammas Hireling ·</text><text x="312" y="337.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Eat Me · Giuseppe</text><rect x="30" y="355" width="270" height="43" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="380.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">History and public events</text><rect x="300" y="355" width="570" height="43" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="312" y="380.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">History · Giuseppe</text><rect x="30" y="398" width="270" height="64" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="423.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Modern life and</text><text x="42" y="444.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">frustration</text><rect x="300" y="398" width="570" height="64" fill="#fbf8ea" stroke="#1e2a44" stroke-width="2"/><text x="312" y="423.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Please Hold · Ode on a Grayson Perry Urn · From the Journal of a</text><text x="312" y="444.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Disappointed Man</text><rect x="30" y="462" width="270" height="43" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="487.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Illness and the body</text><rect x="300" y="462" width="570" height="43" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="312" y="487.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A Minor Role · On Her Blindness · Eat Me</text><rect x="30" y="505" width="270" height="43" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="530.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Leaving, travel and risk</text><rect x="300" y="505" width="570" height="43" fill="#fbf8ea" stroke="#1e2a44" stroke-width="2"/><text x="312" y="530.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The Furthest Distances I’ve Travelled · An Easy Passage</text><rect x="30" y="566" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="599.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A starting point, not a rule: most poems fit several themes. For each poem add two or three</text><text x="50" y="621.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">methods to compare, such as its speaker, stanza form, a key image or its ending.</text>
