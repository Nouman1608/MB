<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 669" width="900" height="669" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="669" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A reliable comparative paragraph</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">The shape of one paragraph</text>
<rect x="110" y="128" width="760" height="82" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="126" y="160" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Comparative point</text><text x="126" y="189.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">About the focus, naming both poems.</text><circle cx="62" cy="169" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="62" y="177.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="110" y="218" width="760" height="82" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="126" y="250" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Poem A</text><text x="126" y="279.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Method, short reference, effect.</text><circle cx="62" cy="259" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="62" y="267.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="110" y="308" width="760" height="82" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="126" y="340" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Poem B</text><text x="126" y="369.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Method, short reference, effect.</text><circle cx="62" cy="349" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="62" y="357.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="110" y="398" width="760" height="82" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="126" y="430" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Connection</text><text x="126" y="459.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Why the poets differ or converge, and what that difference means.</text><circle cx="62" cy="439" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="62" y="447.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><path d="M96,132 L88,132 L88,476 L96,476" fill="none" stroke="#1e2a44" stroke-width="0"/><text x="30" y="522" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">The whole answer</text><rect x="30" y="540" width="253.33333333333334" height="105" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="583.7" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Introduction</text><text x="46" y="612.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A comparative thesis.</text><line x1="289.33333333333337" y1="592.5" x2="317.33333333333337" y2="592.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="323.33333333333337" y="540" width="253.33333333333334" height="105" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="339.33333333333337" y="571.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Four or five</text><text x="339.33333333333337" y="596.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">paragraphs</text><text x="339.33333333333337" y="624.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Each in the shape above.</text><line x1="582.6666666666667" y1="592.5" x2="610.6666666666667" y2="592.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="616.6666666666667" y="540" width="253.33333333333334" height="105" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="632.6666666666667" y="573.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Conclusion</text><text x="632.6666666666667" y="601.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Judges the two poems’</text><text x="632.6666666666667" y="622.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">different perspectives.</text>
</svg>