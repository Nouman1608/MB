<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What the specification asks you to learn</text>

<line x1="280" y1="142" x2="365" y2="214.15" stroke="#1e2a44" stroke-width="2.5"/><line x1="280" y1="208" x2="365" y2="237.25" stroke="#1e2a44" stroke-width="2.5"/><line x1="280" y1="286" x2="365" y2="264.55" stroke="#1e2a44" stroke-width="2.5"/><line x1="280" y1="364" x2="365" y2="291.85" stroke="#1e2a44" stroke-width="2.5"/><line x1="620" y1="187" x2="535" y2="229.9" stroke="#1e2a44" stroke-width="2.5"/><line x1="620" y1="253" x2="535" y2="253" stroke="#1e2a44" stroke-width="2.5"/><line x1="620" y1="319" x2="535" y2="276.1" stroke="#1e2a44" stroke-width="2.5"/><circle cx="450" cy="253" r="100" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="247.5" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Key features</text><text x="450" y="272.5" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">of poetry</text><g transform="translate(0,0)"><rect x="30" y="116" width="250" height="52" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="146.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Form and structure</text><rect x="30" y="182" width="250" height="52" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="212.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Language choice</text><rect x="30" y="248" width="250" height="76" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="278.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Imagery, symbols and</text><text x="46" y="302.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">motifs</text><rect x="30" y="338" width="250" height="52" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="368.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Rhyme and rhythm</text></g><g transform="translate(0,45)"><rect x="620" y="116" width="250" height="52" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="636" y="146.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Theme</text><rect x="620" y="182" width="250" height="52" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="636" y="212.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Tone and mood</text><rect x="620" y="248" width="250" height="52" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="636" y="278.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Voice</text></g><text x="30" y="436" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Learning outcomes</text><rect x="30" y="452" width="201" height="87" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="478.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">How poets use and</text><text x="44" y="499.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">adapt language, form</text><text x="44" y="520.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and structure</text><rect x="243" y="452" width="201" height="87" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="257" y="478.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Connections and</text><text x="257" y="499.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">relationships</text><text x="257" y="520.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">between poems</text><rect x="456" y="452" width="201" height="87" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="470" y="489.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">How attitudes and</text><text x="470" y="510.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">values are expressed</text><rect x="669" y="452" width="201" height="87" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="683" y="478.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Critical terms used</text><text x="683" y="499.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">with understanding</text><text x="683" y="520.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and discrimination</text><rect x="30" y="555" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="588.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">“With discrimination”: a term earns credit when it is the right term and leads to an</text><text x="50" y="610.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">insight, not when it decorates a sentence.</text>
