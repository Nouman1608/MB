<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 576" width="900" height="576" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="576" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Agency Theory: from autonomous to agentic</text>

<rect x="30" y="100" width="385" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">AUTONOMOUS STATE</text><text x="50" y="158.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Act on your own conscience</text><text x="50" y="187.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">You feel responsible for what you do</text><line x1="421" y1="156" x2="479" y2="156" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="485" y="100" width="385" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="505" y="132" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">AGENTIC STATE</text><text x="505" y="158.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Carry out someone else's wishes</text><text x="505" y="187.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Responsibility is passed upward</text><rect x="30" y="234" width="202.5" height="135" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="260" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">AGENCY</text><text x="44" y="291" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Many carried on once</text><text x="44" y="311" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">told the experimenter,</text><text x="44" y="331" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">not they, was</text><text x="44" y="351" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">responsible.</text><rect x="242.5" y="234" width="202.5" height="135" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="256.5" y="260" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">AUTHORITY</text><text x="256.5" y="291" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Moving from Yale to a</text><text x="256.5" y="311" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">run-down office</text><text x="256.5" y="331" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">building reduced</text><text x="256.5" y="351" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">obedience.</text><rect x="455" y="234" width="202.5" height="135" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="469" y="260" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CULTURE</text><text x="469" y="291" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Replications in different</text><text x="469" y="311" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">countries found</text><text x="469" y="331" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">different levels of</text><text x="469" y="351" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">obedience.</text><rect x="667.5" y="234" width="202.5" height="135" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="681.5" y="260" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PROXIMITY</text><text x="681.5" y="291" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Closer to the learner, or</text><text x="681.5" y="311" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">a more distant</text><text x="681.5" y="331" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">experimenter, reduced</text><text x="681.5" y="351" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">obedience.</text><text x="30" y="405" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PROXIMITY: OBEDIENCE FELL AS…</text><rect x="30" y="419" width="253.33333333333334" height="125" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="156.66666666666669" y="475.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Teacher in the same</text><text x="156.66666666666669" y="496.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">room as the learner</text><line x1="289.33333333333337" y1="481.5" x2="317.33333333333337" y2="481.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="323.33333333333337" y="419" width="253.33333333333334" height="125" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450.00000000000006" y="465.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Teacher pressed the</text><text x="450.00000000000006" y="486.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">learner's hand onto a</text><text x="450.00000000000006" y="507.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">shock plate</text><line x1="582.6666666666667" y1="481.5" x2="610.6666666666667" y2="481.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="616.6666666666667" y="419" width="253.33333333333334" height="125" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="743.3333333333334" y="452.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Experimenter gave</text><text x="743.3333333333334" y="473.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">orders by telephone</text><text x="743.3333333333334" y="500" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">obedience fell to around a</text><text x="743.3333333333334" y="520" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">fifth</text>
</svg>