<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 583" width="900" height="583" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="583" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Adorno: the Authoritarian Personality</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">The dispositional explanation of obedience</text>
<rect x="30" y="124" width="253.33333333333334" height="169" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="189.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CHILDHOOD</text><text x="50" y="214.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Harsh, strict discipline</text><text x="50" y="235.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">and conditional love</text><line x1="289.33333333333337" y1="208.5" x2="317.33333333333337" y2="208.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="323.33333333333337" y="124" width="253.33333333333334" height="169" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="343.33333333333337" y="179" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FEELINGS</text><text x="343.33333333333337" y="204.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Hostility that cannot be</text><text x="343.33333333333337" y="225.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">expressed towards</text><text x="343.33333333333337" y="246.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">parents</text><line x1="582.6666666666667" y1="208.5" x2="610.6666666666667" y2="208.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="616.6666666666667" y="124" width="253.33333333333334" height="169" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="636.6666666666667" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">AS AN ADULT</text><text x="636.6666666666667" y="181.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Rigid, black-and-white</text><text x="636.6666666666667" y="202.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">thinking</text><text x="636.6666666666667" y="229" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">respect for higher status,</text><text x="636.6666666666667" y="249" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">contempt for those seen as</text><text x="636.6666666666667" y="269" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">lower</text><rect x="250" y="315" width="400" height="84" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="347" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">MEASURED WITH</text><text x="450" y="373.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">The F-scale questionnaire</text><rect x="30" y="421" width="413" height="130" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="463.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">+ SUPPORT</text><text x="50" y="495.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Fully obedient participants in Milgram-type</text><text x="50" y="516.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">research tended to score higher on the F-scale.</text><rect x="457" y="421" width="413" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="453" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">− WEAKNESS</text><text x="477" y="484.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Cannot explain why whole populations with very</text><text x="477" y="505.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">different upbringings obeyed in the same</text><text x="477" y="526.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">historical situation.</text>
</svg>