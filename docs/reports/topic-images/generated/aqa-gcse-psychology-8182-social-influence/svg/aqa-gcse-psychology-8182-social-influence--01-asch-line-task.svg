<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Asch: an easy task, a wrong majority</text>

<rect x="30" y="100" width="840" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="150" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Standard line</text><line x1="150" y1="160" x2="150" y2="300" stroke="#1e2a44" stroke-width="8"/><text x="450" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Comparison lines</text><line x1="370" y1="300" x2="370" y2="190" stroke="#1e2a44" stroke-width="8"/><text x="370" y="330" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">A</text><line x1="450" y1="300" x2="450" y2="160" stroke="#2e6b62" stroke-width="8"/><text x="450" y="330" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle">B</text><line x1="530" y1="300" x2="530" y2="130" stroke="#1e2a44" stroke-width="8"/><text x="530" y="330" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">C</text><text x="450" y="346" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start"></text><circle cx="640" cy="220" r="15" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><rect x="623" y="238" width="34" height="40" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><rect x="623" y="166" width="34" height="28" rx="8" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><text x="640" y="187" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">C</text><circle cx="690" cy="220" r="15" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><rect x="673" y="238" width="34" height="40" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><rect x="673" y="166" width="34" height="28" rx="8" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><text x="690" y="187" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">C</text><circle cx="740" cy="220" r="15" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><rect x="723" y="238" width="34" height="40" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><rect x="723" y="166" width="34" height="28" rx="8" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><text x="740" y="187" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">C</text><circle cx="790" cy="220" r="15" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><rect x="773" y="238" width="34" height="40" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><rect x="773" y="166" width="34" height="28" rx="8" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><text x="790" y="187" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">C</text><circle cx="840" cy="220" r="15" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><rect x="823" y="238" width="34" height="40" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><rect x="823" y="166" width="34" height="28" rx="8" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><text x="840" y="187" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">?</text><text x="715" y="306" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">confederates</text><text x="840" y="306" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="end">real</text><text x="840" y="324" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="end">participant</text><text x="450" y="385.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">On <tspan font-weight="700">critical</tspan> <tspan font-weight="700">trials</tspan> every confederate gave the same wrong answer. Alone, people made almost no errors.</text><rect x="30" y="416" width="270.6666666666667" height="134" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="165.33333333333334" y="458.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">CRITICAL TRIALS</text><text x="165.33333333333334" y="486.1" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Roughly a third</text><text x="165.33333333333334" y="515.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">conformed on</text><rect x="314.6666666666667" y="416" width="270.6666666666667" height="134" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="458.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">AT LEAST ONCE</text><text x="450" y="486.1" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">About three-quarters</text><text x="450" y="515.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">of participants conformed</text><rect x="599.3333333333334" y="416" width="270.6666666666667" height="134" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="734.6666666666667" y="448" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">NEVER</text><text x="734.6666666666667" y="475.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">About a quarter</text><text x="734.6666666666667" y="504.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">of participants never</text><text x="734.6666666666667" y="525.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">conformed</text><rect x="30" y="572" width="413" height="130" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="614.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">+ STRENGTH</text><text x="50" y="646.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Standardised, tightly controlled: the effect of</text><text x="50" y="667.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">each factor can be isolated.</text><rect x="457" y="572" width="413" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="604" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">− WEAKNESSES</text><text x="477" y="635.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Artificial task (ecological validity); only male</text><text x="477" y="656.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">American students in the 1950s; participants</text><text x="477" y="677.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">deceived.</text>
</svg>