<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 677" width="900" height="677" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="677" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Piliavin: weighing the costs of helping</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Field experiment on New York subway trains</text>
<rect x="30" y="124" width="411" height="106" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CANE VICTIM (APPEARED ILL)</text><text x="50" y="182.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Spontaneous help on the great majority of</text><text x="50" y="205.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">trials</text><rect x="459" y="124" width="411" height="106" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="479" y="167.5" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">DRUNK VICTIM (BOTTLE, SMELL OF ALCOHOL)</text><text x="479" y="193.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Help on about half of trials</text><line x1="215" y1="272" x2="685" y2="312" stroke="#1e2a44" stroke-width="7" stroke-linecap="round"/><path d="M450,292 L420,384 L480,384 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><circle cx="450" cy="292" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><line x1="215" y1="272" x2="155" y2="322" stroke="#1e2a44" stroke-width="2.5"/><line x1="215" y1="272" x2="275" y2="322" stroke="#1e2a44" stroke-width="2.5"/><path d="M125,322 L305,322 Q287,352 215,352 Q143,352 125,322 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><line x1="685" y1="312" x2="625" y2="362" stroke="#1e2a44" stroke-width="2.5"/><line x1="685" y1="312" x2="745" y2="362" stroke="#1e2a44" stroke-width="2.5"/><path d="M595,362 L775,362 Q757,392 685,392 Q613,392 595,362 Z" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="215" y="344" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">cost of not helping</text><text x="685" y="384" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">cost of helping</text><rect x="30" y="402" width="380" height="46" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="220" y="429.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">guilt, blame</text><rect x="490" y="402" width="380" height="46" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="680" y="429.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">effort, danger, embarrassment, disgust</text><text x="450" y="483.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Helping a drunk person seems <tspan font-weight="700">more</tspan> <tspan font-weight="700">costly</tspan>, so people helped less. More bystanders did <tspan font-weight="700">not</tspan> lead to less</text><text x="450" y="505.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">helping here.</text><rect x="30" y="536" width="413" height="109" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="568" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">+ STRENGTH</text><text x="50" y="599.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Natural setting: high ecological validity; many</text><text x="50" y="620.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">trials made findings reliable.</text><rect x="457" y="536" width="413" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="568" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">− WEAKNESS</text><text x="477" y="599.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">No consent or debrief for passengers; no control</text><text x="477" y="620.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">over who was in each carriage.</text>
</svg>