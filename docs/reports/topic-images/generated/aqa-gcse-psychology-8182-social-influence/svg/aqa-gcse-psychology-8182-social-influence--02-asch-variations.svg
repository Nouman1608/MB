<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 619" width="900" height="619" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="619" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What changed conformity in Asch's variations</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Schematic directions, not data</text>
<rect x="30" y="124" width="270" height="290" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="165" y="152" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Group size</text><line x1="70" y1="294" x2="280" y2="294" stroke="#1e2a44" stroke-width="2.5"/><line x1="70" y1="294" x2="70" y2="164" stroke="#1e2a44" stroke-width="2.5"/><text x="56" y="230" font-size="15" fill="#4a5568" text-anchor="middle" transform="rotate(-90 56 230)">conformity</text><path d="M80,282 L120,274 C140,204 160,194 190,190 L270,188" fill="none" stroke="#2e6b62" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><text x="165" y="318" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">confederates →</text><text x="165" y="346" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">Very low with one; rises sharply</text><text x="165" y="366" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">with two and three; then levels</text><text x="165" y="386" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">off</text><rect x="315" y="124" width="270" height="290" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="152" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Anonymity</text><line x1="355" y1="294" x2="565" y2="294" stroke="#1e2a44" stroke-width="2.5"/><line x1="355" y1="294" x2="355" y2="164" stroke="#1e2a44" stroke-width="2.5"/><text x="341" y="230" font-size="15" fill="#4a5568" text-anchor="middle" transform="rotate(-90 341 230)">conformity</text><rect x="395" y="184" width="60" height="110" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><rect x="485" y="249" width="60" height="45" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="425" y="314" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">aloud</text><text x="515" y="314" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">written</text><text x="450" y="346" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">Writing answers privately</text><text x="450" y="366" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">reduced conformity considerably</text><rect x="600" y="124" width="270" height="290" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="735" y="152" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Task difficulty</text><line x1="640" y1="294" x2="850" y2="294" stroke="#1e2a44" stroke-width="2.5"/><line x1="640" y1="294" x2="640" y2="164" stroke="#1e2a44" stroke-width="2.5"/><text x="626" y="230" font-size="15" fill="#4a5568" text-anchor="middle" transform="rotate(-90 626 230)">conformity</text><rect x="680" y="234" width="60" height="60" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><rect x="770" y="179" width="60" height="115" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="710" y="314" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">easy</text><text x="800" y="314" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">harder</text><text x="735" y="346" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">More similar lines increased</text><text x="735" y="366" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">conformity: less sure, so look to</text><text x="735" y="386" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">others</text><rect x="30" y="436" width="413" height="151" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="468" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DISPOSITIONAL: PERSONALITY</text><text x="50" y="499.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A strong need for social approval or low</text><text x="50" y="520.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">confidence → more likely to conform. Believing</text><text x="50" y="541.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">you control your own behaviour → more likely to</text><text x="50" y="562.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">resist.</text><rect x="457" y="436" width="413" height="151" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="468" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DISPOSITIONAL: EXPERTISE</text><text x="477" y="499.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Someone who knows the task well, such as an</text><text x="477" y="520.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">architect judging lengths, has less reason to</text><text x="477" y="541.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">doubt their answer.</text>
</svg>