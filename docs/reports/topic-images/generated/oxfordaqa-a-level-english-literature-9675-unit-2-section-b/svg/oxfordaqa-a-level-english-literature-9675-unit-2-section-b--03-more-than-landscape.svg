<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 432" width="900" height="432" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="432" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Place as more than landscape</text>

<line x1="350" y1="191.5" x2="390.5" y2="235.375" stroke="#1e2a44" stroke-width="2.5"/><line x1="350" y1="326.5" x2="390.5" y2="282.625" stroke="#1e2a44" stroke-width="2.5"/><line x1="550" y1="181" x2="509.5" y2="231.7" stroke="#1e2a44" stroke-width="2.5"/><line x1="550" y1="337" x2="509.5" y2="286.3" stroke="#1e2a44" stroke-width="2.5"/><circle cx="450" cy="259" r="70" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="266" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Place</text><g transform="translate(0,21)"><rect x="30" y="110" width="320" height="121" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="140.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Home and homeland</text><text x="46" y="168.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The farm in “Michael”, lost when</text><text x="46" y="189.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Luke leaves for the city; Heaney’s</text><text x="46" y="210.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">rural Derry childhood.</text><rect x="30" y="245" width="320" height="121" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="275.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Relationships</text><text x="46" y="303.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Neighbours and the wall in</text><text x="46" y="324.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">“Mending Wall”; Hardy’s places of</text><text x="46" y="345.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">courtship.</text></g><g transform="translate(0,0)"><rect x="550" y="110" width="320" height="142" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="566" y="140.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Political space</text><text x="566" y="168.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">“The Toome Road”: armoured</text><text x="566" y="189.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">vehicles in his home district;</text><text x="566" y="210.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">“Act of Union”: a relationship as</text><text x="566" y="231.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Britain and Ireland.</text><rect x="550" y="266" width="320" height="142" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="566" y="296.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">History in the ground</text><text x="566" y="324.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Bog poems link Iron Age Jutland to</text><text x="566" y="345.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">violence in Northern Ireland;</text><text x="566" y="366.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">“Requiem for the Croppies” on</text><text x="566" y="387.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">1798.</text></g>
</svg>