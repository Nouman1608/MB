<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 629" width="900" height="629" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="629" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Reading place and time in one poem</text>

<rect x="30" y="110" width="520" height="294" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="146" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The Ford (original poem)</text><text x="52" y="182" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">We crossed here, the summer you were ten,</text><circle cx="522" cy="177" r="13" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="522" y="183" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">a</text><text x="52" y="214" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">your boots tied round your neck, the water loud.</text><circle cx="522" cy="209" r="13" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="522" y="215" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">b</text><text x="52" y="246" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">Now there’s a bridge. I drive across it, then</text><circle cx="522" cy="241" r="13" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="522" y="247" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">a</text><text x="52" y="278" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">pull in and walk back down. The river’s proud</text><circle cx="522" cy="273" r="13" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="522" y="279" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">b</text><text x="52" y="310" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">and narrow, quieter than then. A plaque</text><circle cx="522" cy="305" r="13" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="522" y="311" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">c</text><text x="52" y="342" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">explains the bridge. Nobody explains the ford.</text><circle cx="522" cy="337" r="13" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="522" y="343" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">✕</text><text x="52" y="374" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">I stand where the stones were. I don’t go back.</text><circle cx="522" cy="369" r="13" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="522" y="375" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">c</text><rect x="570" y="110" width="300" height="129" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="590" y="144.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The form marks the loss</text><text x="590" y="172.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The rhyme scheme holds firm</text><text x="590" y="193.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">until “ford” fails to find a</text><text x="590" y="214.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">rhyme.</text><rect x="570" y="260" width="300" height="108" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="590" y="294.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">“I don’t go back”</text><text x="590" y="322.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Final monosyllables turn a</text><text x="590" y="343.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">statement into a refusal.</text><rect x="30" y="430" width="160" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="42" y="460" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start"></text><rect x="190" y="430" width="340" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="202" y="460" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Then: the ford</text><rect x="530" y="430" width="340" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="542" y="460" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Now: the bridge</text><rect x="30" y="476" width="160" height="43" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="501.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Crossing</text><rect x="190" y="476" width="340" height="43" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="202" y="501.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Shared, the summer you were ten</text><rect x="530" y="476" width="340" height="43" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="542" y="501.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Solitary: “I drive across it”</text><rect x="30" y="519" width="160" height="43" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="544.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">The river</text><rect x="190" y="519" width="340" height="43" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="202" y="544.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The water loud</text><rect x="530" y="519" width="340" height="43" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="542" y="544.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">“quieter than then”</text><rect x="30" y="562" width="160" height="43" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="587.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">History</text><rect x="190" y="562" width="340" height="43" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="202" y="587.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Nobody explains it: private memory</text><rect x="530" y="562" width="340" height="43" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="542" y="587.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A plaque explains it: public history</text>
</svg>