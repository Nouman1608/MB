<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 608" width="900" height="608" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="608" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Five ways poems make place</text>

<rect x="30" y="110" width="250" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="42" y="140" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Method</text><rect x="280" y="110" width="590" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="292" y="140" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Example from the selections</text><rect x="30" y="156" width="250" height="66" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="182.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Naming</text><rect x="280" y="156" width="590" height="66" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="292" y="182.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Heaney’s “Anahorish” builds a poem from an Irish place-name;</text><text x="292" y="204.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Hardy’s titles fix grief to Cornish places.</text><rect x="30" y="222" width="250" height="66" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="248.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">The speaker’s position</text><rect x="280" y="222" width="590" height="66" fill="#fbf8ea" stroke="#1e2a44" stroke-width="2"/><text x="292" y="248.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">“Tintern Abbey”: above the Wye after five years away. “Composed</text><text x="292" y="270.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Upon Westminster Bridge”: one point, at dawn.</text><rect x="30" y="288" width="250" height="66" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="314.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Time layered on place</text><rect x="280" y="288" width="590" height="66" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="292" y="314.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Hardy’s poems of 1912–13 return to places of courtship: two</text><text x="292" y="336.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">times at once. Watch verb tense.</text><rect x="30" y="354" width="250" height="66" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="380.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Nature and its</text><text x="42" y="402.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">despoliation</text><rect x="280" y="354" width="590" height="66" fill="#fbf8ea" stroke="#1e2a44" stroke-width="2"/><text x="292" y="380.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Frost’s brook buried under city building; Hardy’s naval gunnery</text><text x="292" y="402.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">against a quiet churchyard.</text><rect x="30" y="420" width="250" height="66" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="446.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Form</text><rect x="280" y="420" width="590" height="66" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="292" y="446.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Tight rhyme can contain a wild landscape; a loose form can</text><text x="292" y="468.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">mirror a moving mind; line breaks trace a path.</text><rect x="30" y="504" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="537.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A novel describes a place over pages; a poem does it in a few lines, so every choice is</text><text x="50" y="559.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">concentrated.</text>
</svg>