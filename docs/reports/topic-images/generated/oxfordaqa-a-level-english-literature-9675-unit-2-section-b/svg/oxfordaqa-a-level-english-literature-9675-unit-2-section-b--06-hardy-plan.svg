<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 644" width="900" height="644" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="644" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Testing a view across a selection</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">“Places matter because of the people who are absent from them.”</text>
<line x1="215" y1="183.2" x2="685" y2="156.8" stroke="#1e2a44" stroke-width="7" stroke-linecap="round"/><path d="M450,170 L420,262 L480,262 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><circle cx="450" cy="170" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><line x1="215" y1="183.2" x2="160" y2="238.2" stroke="#1e2a44" stroke-width="2.5"/><line x1="215" y1="183.2" x2="270" y2="238.2" stroke="#1e2a44" stroke-width="2.5"/><path d="M140,238.2 L290,238.2 Q275,265.2 215,265.2 Q155,265.2 140,238.2 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><line x1="685" y1="156.8" x2="630" y2="211.8" stroke="#1e2a44" stroke-width="2.5"/><line x1="685" y1="156.8" x2="740" y2="211.8" stroke="#1e2a44" stroke-width="2.5"/><path d="M610,211.8 L760,211.8 Q745,238.8 685,238.8 Q625,238.8 610,211.8 Z" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="215" y="259.2" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">supports</text><text x="685" y="232.8" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">tests it</text><rect x="30" y="285" width="405" height="205" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="321" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Absence matters</text><text x="50" y="350.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="350.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">“At Castle Boterel”: the road valued</text><text x="66.15" y="372.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">because it once held them both; the</text><text x="66.15" y="394.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">phantom shrinks as he drives away</text><text x="50" y="421.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="421.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">“Beeny Cliff”: vivid sea and cliff,</text><text x="66.15" y="443.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">then her absence; the landscape</text><text x="66.15" y="465.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">survives the person</text><rect x="465" y="285" width="405" height="205" rx="14" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="485" y="345.5" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="start">Counter-poem</text><text x="485" y="375.1" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="501.15" y="375.1" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">“Channel Firing”: the churchyard</text><text x="501.15" y="397.1" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">matters because of the dead who are</text><text x="501.15" y="419.1" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">present and the guns of 1914 that wake</text><text x="501.15" y="441.1" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">them</text><rect x="30" y="508" width="840" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="544" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Conclusion</text><text x="50" y="573.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Largely true of the 1912–13 poems, less so where places are shaped by history, war or</text><text x="50" y="595.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">chance. Hardy’s places matter most when they outlast people.</text>
</svg>