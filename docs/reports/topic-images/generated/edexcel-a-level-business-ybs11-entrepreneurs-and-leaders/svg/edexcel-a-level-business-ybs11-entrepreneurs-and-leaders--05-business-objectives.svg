<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 786" width="900" height="786" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="786" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Choosing business objectives</text>

<line x1="60" y1="140" x2="840" y2="140" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="60" y="128" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">new business, or a crisis</text><text x="840" y="128" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end">established, able to grow</text><rect x="30" y="160" width="400" height="100" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="196" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Survival</text><text x="48" y="229" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Cover costs; keep enough cash to pay bills</text><rect x="470" y="160" width="400" height="100" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="488" y="196" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Profit maximisation</text><text x="488" y="229" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Once established with capacity to grow</text><text x="56" y="302" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Other objectives, and how they sit with profit</text><rect x="30" y="322" width="270" height="124" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="48" y="356" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Sales maximisation</text><text x="48" y="386" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Low prices cut profit per</text><text x="48" y="407" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">unit</text><rect x="315" y="322" width="270" height="124" rx="12" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="333" y="356" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Market share</text><text x="333" y="386" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Heavy promotion now for</text><text x="333" y="407" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">profit later</text><rect x="600" y="322" width="270" height="124" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="618" y="356" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Cost efficiency</text><text x="618" y="386" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Lower unit cost supports</text><text x="618" y="407" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">profit and pricing</text><rect x="30" y="462" width="270" height="124" rx="12" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="496" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Employee welfare</text><text x="48" y="526" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Better morale and retention,</text><text x="48" y="547" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">higher costs</text><rect x="315" y="462" width="270" height="124" rx="12" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="333" y="496" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Customer satisfaction</text><text x="333" y="526" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Loyalty, but extra staff or</text><text x="333" y="547" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">refunds</text><rect x="600" y="462" width="270" height="124" rx="12" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="618" y="496" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Social objectives</text><text x="618" y="526" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Community or environment,</text><text x="618" y="547" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">e.g. local sourcing</text><rect x="30" y="616" width="840" height="140" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="56" y="652" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">The choice depends on</text><rect x="56" y="672" width="186" height="60" rx="10" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="149" y="709" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Size and stage</text><rect x="258" y="672" width="186" height="60" rx="10" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="351" y="709" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Ownership</text><rect x="460" y="672" width="186" height="60" rx="10" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="553" y="709" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Market and economy</text><rect x="662" y="672" width="186" height="60" rx="10" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="755" y="709" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Leaders’ values</text>
</svg>