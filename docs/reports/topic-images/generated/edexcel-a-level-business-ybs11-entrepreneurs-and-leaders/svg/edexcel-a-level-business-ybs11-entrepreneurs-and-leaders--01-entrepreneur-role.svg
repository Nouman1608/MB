<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 770" width="900" height="770" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="770" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How an entrepreneur’s role changes</text>

<rect x="30" y="110" width="260" height="330" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="70" cy="154" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="70" y="161.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="104" y="162" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Create and set</text><text x="104" y="189" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">up</text><text x="50" y="230" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Spot a gap or a better</text><text x="50" y="253" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">way to meet a need; test</text><text x="50" y="276" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">the idea; raise finance;</text><text x="50" y="299" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">organise premises,</text><text x="50" y="322" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">suppliers and staff</text><line x1="292" y1="275" x2="318" y2="275" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="320" y="110" width="260" height="330" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="360" cy="154" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="360" y="161.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="394" y="162" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Run the</text><text x="394" y="189" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">business</text><text x="340" y="230" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Day-to-day decisions on</text><text x="340" y="253" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">customers, cash, quality</text><text x="340" y="276" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">and people; often harder</text><text x="340" y="299" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">than the start-up as</text><text x="340" y="322" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">excitement gives way to</text><text x="340" y="345" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">routine</text><line x1="582" y1="275" x2="608" y2="275" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="610" y="110" width="260" height="330" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="650" cy="154" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="650" y="161.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="684" y="162" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Expand or</text><text x="684" y="189" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">develop</text><text x="630" y="230" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Add products, locations</text><text x="630" y="253" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">or markets; employ</text><text x="630" y="276" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">managers and delegate</text><rect x="30" y="470" width="840" height="270" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="56" y="508" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Intrapreneurship: an employee acting like an entrepreneur inside an existing business</text><rect x="56" y="530" width="250" height="110" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="74" y="560" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">How</text><text x="74" y="589" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Develops a new product or</text><text x="74" y="610" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">process using the firm’s</text><text x="74" y="631" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">resources</text><rect x="325" y="530" width="250" height="110" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="343" y="560" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">The firm gains</text><text x="343" y="589" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Innovation, without the</text><text x="343" y="610" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">employee leaving to</text><text x="343" y="631" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">compete</text><rect x="594" y="530" width="250" height="110" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="612" y="560" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">The employee gains</text><text x="612" y="589" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Freedom, with less</text><text x="612" y="610" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">personal risk</text><text x="450" y="690" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">It needs a culture that tolerates some failure.</text><text x="450" y="718" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Entrepreneur: starts a new firm.  Intrapreneur: innovates inside an existing one.</text>
</svg>