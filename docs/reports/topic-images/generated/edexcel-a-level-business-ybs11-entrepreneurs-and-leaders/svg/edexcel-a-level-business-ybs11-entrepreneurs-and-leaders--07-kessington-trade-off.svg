<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 879" width="900" height="879" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="879" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Kessington Dairy: share or profit?</text>

<rect x="30" y="110" width="840" height="500" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="56" y="146" font-size="18" font-weight="700" fill="#4a5568" text-anchor="start">Contribution per litre (height) × litres sold (width)</text><rect x="140" y="260" width="280" height="300" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="280" y="404" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">$80,000</text><text x="280" y="430" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">contribution a month</text><text x="280" y="588" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">200,000 litres</text><text x="130" y="416" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="end">$0.40</text><text x="280" y="200" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Now: $1.20 − $0.80</text><rect x="510" y="335" width="336" height="225" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="678" y="441.5" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">$72,000</text><text x="678" y="467.5" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">contribution a month</text><text x="678" y="588" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">240,000 litres</text><text x="500" y="453.5" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="end">$0.30</text><text x="678" y="200" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">After cut: $1.10 − $0.80</text><line x1="80" y1="560" x2="850" y2="560" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="630" width="410" height="90" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="235" y="668" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">Sales volume</text><text x="235" y="700" font-size="24" font-weight="700" fill="#2e6b62" text-anchor="middle">+20%</text><rect x="460" y="630" width="410" height="90" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="665" y="668" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">Contribution</text><text x="665" y="700" font-size="24" font-weight="700" fill="#b5602e" text-anchor="middle">−$8,000 a month</text><rect x="30" y="740" width="840" height="109" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="780" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Short-term profit traded for market share.</text><text x="56" y="807" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Wise only if the larger share brings later gains, such as lower unit costs or the power to</text><text x="56" y="830" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">raise prices again.</text>
</svg>