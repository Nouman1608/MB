<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 799" width="900" height="799" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="799" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Amara: the opportunity cost of starting up</text>

<rect x="30" y="110" width="500" height="520" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="56" y="146" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Year one, in money terms</text><line x1="140" y1="560" x2="505" y2="560" stroke="#c9d6d4" stroke-width="1.5"/><text x="130" y="566" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">$0</text><line x1="140" y1="467.5" x2="505" y2="467.5" stroke="#c9d6d4" stroke-width="1.5"/><text x="130" y="473.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">$10,000</text><line x1="140" y1="375" x2="505" y2="375" stroke="#c9d6d4" stroke-width="1.5"/><text x="130" y="381" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">$20,000</text><line x1="140" y1="282.5" x2="505" y2="282.5" stroke="#c9d6d4" stroke-width="1.5"/><text x="130" y="288.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">$30,000</text><line x1="140" y1="190" x2="505" y2="190" stroke="#c9d6d4" stroke-width="1.5"/><text x="130" y="196" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">$40,000</text><rect x="180" y="208.5" width="130" height="351.5" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><rect x="180" y="199.25" width="130" height="9.25" fill="#2e6b62" stroke="#1e2a44" stroke-width="2.5"/><rect x="360" y="282.5" width="130" height="277.5" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><rect x="360" y="199.25" width="130" height="83.25" fill="none" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="7 5"/><text x="425" y="246.875" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">−$9,000</text><text x="245" y="189.25" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">$39,000</text><text x="425" y="310.5" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">$30,000</text><text x="245" y="384.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">salary</text><text x="245" y="404.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">$38,000</text><line x1="140" y1="560" x2="505" y2="560" stroke="#1e2a44" stroke-width="2.5"/><text x="245" y="588" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Given up</text><text x="245" y="610" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">best alternative</text><text x="425" y="588" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Studio profit</text><text x="425" y="610" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">year one</text><rect x="550" y="110" width="320" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="570" y="142" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">Salary given up</text><text x="570" y="172" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">$38,000</text><rect x="550" y="225" width="320" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="570" y="257" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">Interest given up</text><text x="570" y="287" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">4% × $25,000 = $1,000</text><rect x="550" y="340" width="320" height="100" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="570" y="372" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">Opportunity cost</text><text x="570" y="402" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">$38,000 + $1,000 = $39,000</text><rect x="550" y="455" width="320" height="175" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="570" y="487" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">Shortfall</text><text x="570" y="517" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">$39,000 − $30,000</text><text x="570" y="544" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">= $9,000 worse off</text><text x="570" y="571" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">than staying employed</text><rect x="30" y="660" width="840" height="109" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="700" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">She may still be right to continue.</text><text x="56" y="727" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Her motives include independence, the studio may grow, and the opportunity cost changes as</text><text x="56" y="750" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">profit rises.</text>
</svg>