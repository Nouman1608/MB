<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="700" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Barriers, risk and uncertainty</text>

<rect x="30" y="110" width="400" height="560" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="56" y="148" font-size="20" font-weight="700" fill="#b5602e" text-anchor="start">Barriers to entrepreneurship</text><rect x="50" y="170" width="360" height="84" rx="10" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><text x="68" y="204" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Raising finance without a track</text><text x="68" y="227" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">record</text><rect x="50" y="268" width="360" height="84" rx="10" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><text x="68" y="316" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Lack of experience or business skills</text><rect x="50" y="366" width="360" height="84" rx="10" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><text x="68" y="414" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Regulations and paperwork</text><rect x="50" y="464" width="360" height="84" rx="10" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><text x="68" y="498" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Established rivals with brand loyalty</text><text x="68" y="521" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">and economies of scale</text><rect x="50" y="562" width="360" height="84" rx="10" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><text x="68" y="596" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Personal risk: losing savings and a</text><text x="68" y="619" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">secure income</text><rect x="450" y="110" width="420" height="290" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="474" y="148" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Reduce risk</text><rect x="470" y="168" width="380" height="46" rx="10" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="490" y="198" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Research the market</text><rect x="470" y="224" width="380" height="46" rx="10" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="490" y="254" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Write a business plan</text><rect x="470" y="280" width="380" height="46" rx="10" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="490" y="310" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Start small</text><rect x="470" y="336" width="380" height="46" rx="10" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="490" y="366" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Test before committing large sums</text><rect x="450" y="420" width="420" height="250" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="474" y="458" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="start">Cope with uncertainty</text><text x="474" y="486" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">it cannot be removed, so keep:</text><rect x="470" y="504" width="380" height="64" rx="10" fill="#ffffff" stroke="#8a6d0d" stroke-width="2"/><text x="490" y="542" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Financial reserves</text><rect x="470" y="580" width="380" height="64" rx="10" fill="#ffffff" stroke="#8a6d0d" stroke-width="2"/><text x="490" y="606" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Flexibility, e.g. rent rather than buy</text><text x="490" y="629" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">equipment at first</text>
</svg>