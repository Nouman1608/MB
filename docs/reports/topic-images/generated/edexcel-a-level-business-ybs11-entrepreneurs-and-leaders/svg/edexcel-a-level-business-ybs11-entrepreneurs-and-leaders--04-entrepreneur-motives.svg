<rect width="900" height="780" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why people set up businesses</text>

<rect x="330" y="110" width="240" height="70" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="148.1" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Motives</text><path d="M400,180 L400,200 L190,200 L190,222" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M500,180 L500,200 L625,200 L625,222" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="30" y="226" width="320" height="50" rx="10" fill="#2e6b62" stroke="#2e6b62" stroke-width="2.5"/><text x="190" y="258" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">Financial</text><rect x="380" y="226" width="490" height="50" rx="10" fill="#1e2a44" stroke="#1e2a44" stroke-width="2.5"/><text x="625" y="258" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">Non-financial</text><rect x="30" y="296" width="320" height="120" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="330" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Profit maximisation</text><text x="48" y="360" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Aim for the largest profit</text><text x="48" y="381" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">possible</text><rect x="30" y="432" width="320" height="140" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="466" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Profit satisficing</text><text x="48" y="496" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A satisfactory profit while</text><text x="48" y="517" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">pursuing other goals, such as free</text><text x="48" y="538" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">time</text><rect x="380" y="296" width="240" height="130" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="398" y="330" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Ethical stance</text><text x="398" y="360" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Personal values, e.g.</text><text x="398" y="381" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">fair treatment of</text><text x="398" y="402" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">suppliers</text><rect x="630" y="296" width="240" height="130" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="648" y="330" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Social</text><text x="648" y="354" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">entrepreneurship</text><text x="648" y="384" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Tackle a social or</text><text x="648" y="405" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">environmental problem</text><rect x="380" y="442" width="240" height="130" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="398" y="476" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Independence</text><text x="398" y="506" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Be one’s own boss</text><rect x="630" y="442" width="240" height="130" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="648" y="476" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Home working</text><text x="648" y="506" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Fit work around family</text><text x="648" y="527" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">commitments</text><rect x="30" y="600" width="840" height="150" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="636" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Satisficing in practice</text><rect x="56" y="656" width="230" height="70" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="171" y="698" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Open 7 days: more profit</text><rect x="320" y="656" width="230" height="70" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="435" y="698" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Open 5 days: chosen</text><line x1="288" y1="691" x2="316" y2="691" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="580" y="676" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The owner values family time more</text><text x="580" y="697" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">than the extra profit: a rational</text><text x="580" y="718" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">choice.</text>
</svg>