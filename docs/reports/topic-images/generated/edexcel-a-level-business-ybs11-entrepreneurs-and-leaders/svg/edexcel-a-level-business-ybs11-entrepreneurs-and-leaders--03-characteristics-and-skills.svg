<rect width="900" height="640" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What makes an entrepreneur</text>

<rect x="30" y="110" width="410" height="230" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="148" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Characteristics</text><text x="56" y="186" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">• Determination and resilience</text><text x="56" y="222" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">• Willing to take calculated risks</text><text x="56" y="258" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">• Creativity and initiative</text><text x="56" y="294" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">• Self-confidence</text><rect x="460" y="110" width="410" height="230" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="478" y="148" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Skills</text><text x="486" y="182" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">• Planning</text><text x="486" y="213" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">• Communication</text><text x="486" y="244" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">• Financial understanding</text><text x="486" y="275" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">• Selling</text><text x="486" y="306" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">• Building a team</text><text x="450" y="386" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">In an exam, link each one to a situation in the source</text><rect x="30" y="410" width="250" height="90" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="155" y="457.7" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Resilience</text><line x1="284" y1="455" x2="380" y2="455" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="332" y="443" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">matters when</text><rect x="384" y="410" width="486" height="90" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="402" y="455.2" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Early sales disappoint</text><rect x="30" y="520" width="250" height="90" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="155" y="567.7" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Communication</text><line x1="284" y1="565" x2="380" y2="565" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="332" y="553" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">matters when</text><rect x="384" y="520" width="486" height="90" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="402" y="565.2" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Persuading a bank or a supplier</text>
</svg>