<!-- place after: ## Four lenses for analysing an audience -->
<figure class="topic-figure">
  <img src="https://img.marlbridge.com/ap-english-language-and-composition-2-1-audience-beliefs-values-needs-study-guide--02-four-lenses-governors.webp" width="900" height="632" alt="Four boxes around a central label, governors: beliefs (money should help pupils directly), values (safety, fairness, reputation), needs (a defensible decision and a balanced budget) and background (volunteers, not teachers). Below, a belief is about what is true and a value about what matters." loading="lazy">
  <figcaption>Use all four lenses, and tie each to a specific choice in the text.</figcaption>
</figure>

<!-- place after: ## Common ground and concession -->
<figure class="topic-figure">
  <img src="https://img.marlbridge.com/ap-english-language-and-composition-2-1-audience-beliefs-values-needs-study-guide--03-common-ground-concession.webp" width="900" height="524" alt="Three descending steps. Common ground: “We all want our children to arrive at school safely.” Concession: “It is true that the shelter would cost money...” Refutation: the writer shows why the granted point does not settle the question." loading="lazy">
  <figcaption>Grant what is reasonable, then show why it does not settle the question.</figcaption>
</figure>

<!-- place after: ## A public-domain example: Lincoln's First Inaugural (1861) -->
<figure class="topic-figure">
  <img src="https://img.marlbridge.com/ap-english-language-and-composition-2-1-audience-beliefs-values-needs-study-guide--04-lincoln-first-inaugural.webp" width="900" height="468" alt="Lincoln’s audience, including the people of the seceded states, feared he would attack slavery where it existed. He answers their need for reassurance (“I have no purpose... to interfere”) and appeals to common ground (“We are not enemies, but friends”), then presses his claim that the Union is perpetual." loading="lazy">
  <figcaption>Read the fear, name it, answer it, then press the claim.</figcaption>
</figure>

<!-- place after: ## Worked example 1: audience analysis for a writing task -->
<figure class="topic-figure">
  <img src="https://img.marlbridge.com/ap-english-language-and-composition-2-1-audience-beliefs-values-needs-study-guide--05-lens-to-choice.webp" width="900" height="613" alt="Three links from audience lens to writing choice: the value of safety leads to an opening of common ground; the need for a costed, defensible case leads to a supplier quote, a survey and a fuel comparison; the belief about use leads to a concession and answer. A note warns that “use formal language because they are adults” names no lens." loading="lazy">

<!-- place after: ## Worked example 2: reading an audience in a short passage -->
<figure class="topic-figure">
  <img src="https://img.marlbridge.com/ap-english-language-and-composition-2-1-audience-beliefs-values-needs-study-guide--06-reading-the-passage.webp" width="900" height="510" alt="The speech to parents split into four parts, numbered against three notes. Being told for years that the crossing will be fixed shows the audience’s sceptical belief; giving up an evening shows a value and need; and the photographs and petition are the choices that follow." loading="lazy">
