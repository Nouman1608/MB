<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 510" width="900" height="510" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="510" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Reading an audience in a passage</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Worked example 2: a speech to parents</text>
<rect x="30" y="122" width="520" height="68.88" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="44" y="150.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">Parents, I know that most of you gave up an evening to be</text><text x="44" y="172.89" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">here,</text><circle cx="570" cy="156.44" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="570" y="162.2" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="30" y="198.88" width="520" height="91.32" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="44" y="227.32999999999998" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">and that many of you have been told for years that the bus</text><text x="44" y="249.76999999999998" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">company will fix this road crossing. I have been told that</text><text x="44" y="272.21" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">too.</text><circle cx="570" cy="244.54" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="570" y="250.29999999999998" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="30" y="298.2" width="520" height="91.32" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" /><text x="44" y="326.65" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">I am not asking you to trust the company’s promises. I am</text><text x="44" y="349.09" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">asking you to look at the three photographs on the board,</text><text x="44" y="371.53" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">each taken in the last month,</text><circle cx="570" cy="343.86" r="16" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="570" y="349.62" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="30" y="397.52" width="520" height="46.44" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" /><text x="44" y="425.96999999999997" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">and then to sign the petition by the door.</text><circle cx="570" cy="420.74" r="16" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="570" y="426.5" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="600" y="122" width="270" height="125.63999999999999" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="612" y="147.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">1 Belief</text><text x="612" y="173.19" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">They have heard promises</text><text x="612" y="192.99" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">before and may be sceptical; the</text><text x="612" y="212.79" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">speaker sides with that</text><text x="612" y="232.59" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">scepticism.</text><rect x="600" y="257.64" width="270" height="105.84000000000003" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="612" y="283.24" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">2 Value / need</text><text x="612" y="308.83" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">Acknowledging their time builds</text><text x="612" y="328.63" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">goodwill and signals a</text><text x="612" y="348.43" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">reasonable request.</text><rect x="600" y="373.48" width="270" height="105.84000000000003" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="612" y="399.08000000000004" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">3 Choice that follows</text><text x="612" y="424.67" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">Visible, recent evidence instead</text><text x="612" y="444.47" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">of trust, and a concrete, easy</text><text x="612" y="464.27000000000004" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">action.</text>
</svg>