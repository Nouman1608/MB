<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 486" width="900" height="486" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="486" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Perceptions guide choices</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">A writer cannot read minds, so the text rests on inferences</text>
<rect x="30" y="122" width="240" height="125.75999999999999" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" /><text x="150" y="156" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Writer infers</text><text x="150" y="184" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">what the group believes,</text><text x="150" y="205.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">cares about, lacks and</text><text x="150" y="226.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">has experienced</text><line x1="276" y1="184.88" x2="324" y2="184.88" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="330" y="122" width="240" height="125.75999999999999" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="450" y="166.56" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Perceptions</text><text x="450" y="194.56" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">of beliefs, values, needs</text><text x="450" y="215.68" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">and background</text><line x1="576" y1="184.88" x2="624" y2="184.88" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="630" y="122" width="240" height="125.75999999999999" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="750" y="156" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Choices</text><text x="750" y="184" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">evidence, vocabulary,</text><text x="750" y="205.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">tone, handling of</text><text x="750" y="226.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">opposition, the ask</text><path d="M750,251.76 C750,297.76 720,327.76 690,343.76" fill="none" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><path d="M690,251.76 C560,287.76 330,297.76 260,343.76" fill="none" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)" stroke-dasharray="8 6"/><rect x="30" y="347.76" width="400" height="107.28" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" /><text x="230" y="381.76" font-size="20" font-weight="700" fill="#b5602e" text-anchor="middle" xml:space="preserve">Inferences wrong</text><text x="230" y="410.60999999999996" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">The argument misfires.</text><rect x="470" y="347.76" width="400" height="107.28" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="670" y="381.76" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">Inferences good</text><text x="670" y="410.60999999999996" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">The audience feels understood and is more</text><text x="670" y="433.04999999999995" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">ready to listen.</text>
</svg>