<rect width="900" height="632" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four lenses on one audience</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Audience: school governors</text>
<rect x="30" y="122" width="380" height="146.88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="48" y="156" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start" xml:space="preserve">Beliefs</text><text x="48" y="184" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-style="italic">What</tspan> <tspan font-style="italic">does</tspan> <tspan font-style="italic">this</tspan> <tspan font-style="italic">group</tspan> <tspan font-style="italic">hold</tspan> <tspan font-style="italic">to</tspan> <tspan font-style="italic">be</tspan> <tspan font-style="italic">true?</tspan></text><text x="48" y="205.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">Schools should spend money where it helps</text><text x="48" y="226.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">pupils directly.</text><rect x="490" y="122" width="380" height="146.88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="508" y="156" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start" xml:space="preserve">Values</text><text x="508" y="184" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-style="italic">What</tspan> <tspan font-style="italic">does</tspan> <tspan font-style="italic">it</tspan> <tspan font-style="italic">care</tspan> <tspan font-style="italic">about</tspan> <tspan font-style="italic">and</tspan> <tspan font-style="italic">treat</tspan> <tspan font-style="italic">as</tspan> <tspan font-style="italic">right?</tspan></text><text x="508" y="205.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">Safety, fairness, a good reputation for the</text><text x="508" y="226.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">school.</text><rect x="30" y="344.88" width="380" height="146.88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="48" y="378.88" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start" xml:space="preserve">Needs</text><text x="48" y="406.88" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-style="italic">What</tspan> <tspan font-style="italic">does</tspan> <tspan font-style="italic">it</tspan> <tspan font-style="italic">lack,</tspan> <tspan font-style="italic">fear</tspan> <tspan font-style="italic">or</tspan> <tspan font-style="italic">want?</tspan></text><text x="48" y="428" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">A decision it can defend to parents; a</text><text x="48" y="449.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">budget that balances.</text><rect x="490" y="344.88" width="380" height="146.88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="508" y="378.88" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start" xml:space="preserve">Background</text><text x="508" y="406.88" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-style="italic">What</tspan> <tspan font-style="italic">experience</tspan> <tspan font-style="italic">and</tspan> <tspan font-style="italic">knowledge</tspan> <tspan font-style="italic">does</tspan> <tspan font-style="italic">it</tspan></text><text x="508" y="428" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-style="italic">bring?</tspan></text><text x="508" y="449.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">Volunteers with jobs and families; not</text><text x="508" y="470.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">teachers.</text><rect x="330" y="274.88" width="240" height="64" rx="32" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3" /><text x="450" y="313.88" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Governors</text><rect x="30" y="517.76" width="408" height="83.52000000000001" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="234" y="551.76" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Belief: what is true</text><text x="234" y="579.76" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">“Bikes are safer than cars for short trips.”</text><rect x="462" y="517.76" width="408" height="83.52000000000001" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="666" y="551.76" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Value: what matters</text><text x="666" y="579.76" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">“Children’s safety comes first.”</text>
</svg>