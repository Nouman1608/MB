<rect width="900" height="524" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Common ground, then concession</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Two moves that appear constantly in effective arguments</text>
<rect x="30" y="122" width="660" height="100.64000000000001" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="46" y="154" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start" xml:space="preserve">Common ground</text><text x="46" y="182" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“We all want our children to arrive at school safely.”</text><text x="46" y="203.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700" fill="#2e6b62">→</tspan> <tspan font-weight="700" fill="#2e6b62">Signals</tspan> <tspan font-weight="700" fill="#2e6b62">the</tspan> <tspan font-weight="700" fill="#2e6b62">writer</tspan> <tspan font-weight="700" fill="#2e6b62">is</tspan> <tspan font-weight="700" fill="#2e6b62">not</tspan> <tspan font-weight="700" fill="#2e6b62">an</tspan> <tspan font-weight="700" fill="#2e6b62">opponent;</tspan> <tspan font-weight="700" fill="#2e6b62">gives</tspan> <tspan font-weight="700" fill="#2e6b62">a</tspan> <tspan font-weight="700" fill="#2e6b62">reason</tspan> <tspan font-weight="700" fill="#2e6b62">to</tspan> <tspan font-weight="700" fill="#2e6b62">listen.</tspan></text><line x1="130" y1="224.64000000000001" x2="130" y2="244.64000000000001" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="90" y="246.64000000000001" width="660" height="142.87999999999997" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="106" y="278.64" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="start" xml:space="preserve">Concession</text><text x="106" y="306.64" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“It is true that the shelter would cost money, and governors are right to count</text><text x="106" y="327.76" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">every pound.”</text><text x="106" y="348.88" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700" fill="#2e6b62">→</tspan> <tspan font-weight="700" fill="#2e6b62">Shows</tspan> <tspan font-weight="700" fill="#2e6b62">fairness,</tspan> <tspan font-weight="700" fill="#2e6b62">lowers</tspan> <tspan font-weight="700" fill="#2e6b62">resistance,</tspan> <tspan font-weight="700" fill="#2e6b62">makes</tspan> <tspan font-weight="700" fill="#2e6b62">the</tspan> <tspan font-weight="700" fill="#2e6b62">later</tspan> <tspan font-weight="700" fill="#2e6b62">disagreement</tspan> <tspan font-weight="700" fill="#2e6b62">more</tspan></text><text x="106" y="370" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700" fill="#2e6b62">credible.</tspan></text><line x1="190" y1="391.52" x2="190" y2="411.52" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="150" y="413.52" width="660" height="79.51999999999998" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" /><text x="166" y="445.52" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Refutation or “but”</text><text x="166" y="473.52" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">The writer shows why the granted point does not settle the question.</text>
</svg>