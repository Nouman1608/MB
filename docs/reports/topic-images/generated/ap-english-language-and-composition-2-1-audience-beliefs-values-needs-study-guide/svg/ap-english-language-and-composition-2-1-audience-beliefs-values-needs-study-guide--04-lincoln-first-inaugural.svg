<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 468" width="900" height="468" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="468" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Reading the audience’s fear</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Lincoln’s First Inaugural, 4 March 1861</text>
<rect x="30" y="122" width="260" height="200" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="160" y="182.56" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Audience</text><text x="160" y="210.56" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">including the people of the</text><text x="160" y="231.68" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">seceded states, who feared</text><text x="160" y="252.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">he would attack slavery</text><text x="160" y="273.92" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">where it existed</text><rect x="370" y="122" width="500" height="92" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="388" y="156" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="start" xml:space="preserve">Need: reassurance</text><text x="388" y="184" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“I have no purpose, directly or indirectly, to interfere with</text><text x="388" y="205.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">the institution of slavery in the States where it exists.”</text><line x1="294" y1="222" x2="364" y2="168" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="370" y="230" width="500" height="92" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="388" y="264" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start" xml:space="preserve">Common ground: a shared past</text><text x="388" y="292" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“We are not enemies, but friends. We must not be</text><text x="388" y="313.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">enemies.”</text><line x1="294" y1="222" x2="364" y2="276" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="346" width="143.67313000000001" height="35" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2" /><text x="101.83656500000001" y="369.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">1. read the fear</text><rect x="207.67313000000001" y="346" width="101.26391000000001" height="35" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2" /><text x="258.305085" y="369.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">2. name it</text><rect x="342.93704" y="346" width="116.21745000000001" height="35" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2" /><text x="401.045765" y="369.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">3. answer it</text><rect x="30" y="403" width="462.00493" height="35" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2" /><text x="261.00246500000003" y="426.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">4. then press the central claim: the Union is perpetual</text>
</svg>