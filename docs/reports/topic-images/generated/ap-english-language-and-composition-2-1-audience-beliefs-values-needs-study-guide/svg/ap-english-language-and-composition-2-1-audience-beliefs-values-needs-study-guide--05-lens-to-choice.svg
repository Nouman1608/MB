<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 613" width="900" height="613" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="613" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Each choice answers a lens</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Worked example 1: proposing a covered bike shelter</text>
<text x="150" y="128" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">LENS</text><text x="620" y="128" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle" xml:space="preserve">CHOICE</text><rect x="30" y="144" width="240" height="96.64000000000001" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="44" y="174" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Value</text><text x="44" y="202" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">safety, fairness,</text><text x="44" y="223.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">responsible spending</text><rect x="400" y="144" width="470" height="96.64000000000001" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="414" y="174" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Open with common ground</text><text x="414" y="202" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“Every governor wants pupils to arrive at school safely</text><text x="414" y="223.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">and dry.”</text><line x1="276" y1="192.32" x2="394" y2="192.32" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="30" y="256.64" width="240" height="117.75999999999999" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="44" y="286.64" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Need</text><text x="44" y="314.64" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">a costed proposal,</text><text x="44" y="335.76" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">defensible to parents and</text><text x="44" y="356.88" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">the local authority</text><rect x="400" y="256.64" width="470" height="117.75999999999999" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="414" y="286.64" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Evidence that fits</text><text x="414" y="314.64" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">a £4,200 supplier quote; 91 of 160 cyclists would cycle</text><text x="414" y="335.76" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">more if covered; less than a month of minibus fuel</text><text x="414" y="356.88" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">(invented figures)</text><line x1="276" y1="315.52" x2="394" y2="315.52" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="30" y="390.4" width="240" height="117.75999999999999" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="44" y="420.4" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Belief</text><text x="44" y="448.4" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">money should benefit</text><text x="44" y="469.52" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">pupils; long-term savings</text><text x="44" y="490.64" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">count</text><rect x="400" y="390.4" width="470" height="117.75999999999999" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="414" y="430.96" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Concede and answer</text><text x="414" y="458.96" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“Some governors may worry that a shelter will be little</text><text x="414" y="480.08" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">used. The survey suggests otherwise.”</text><line x1="276" y1="449.28" x2="394" y2="449.28" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="30" y="528.16" width="840" height="54.440000000000055" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="7 5"/><text x="450" y="560.61" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve"><tspan font-weight="700" fill="#b5602e">Earns</tspan> <tspan font-weight="700" fill="#b5602e">little:</tspan> “use formal language because they are adults”: it names no belief, value or need.</text>
</svg>