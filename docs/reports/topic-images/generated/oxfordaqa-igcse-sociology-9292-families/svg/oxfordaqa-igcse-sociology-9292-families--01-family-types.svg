<rect width="900" height="581" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Family types: vertical or horizontal?</text>

<rect x="30" y="108" width="160" height="280" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><line x1="88" y1="170" x2="132" y2="170" stroke="#1e2a44" stroke-width="2.5"/><circle cx="88" cy="170" r="13" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="132" cy="170" r="13" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><line x1="110" y1="170" x2="110" y2="220" stroke="#1e2a44" stroke-width="2.5"/><line x1="88" y1="220" x2="132" y2="220" stroke="#1e2a44" stroke-width="2.5"/><circle cx="88" cy="226" r="13" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="132" cy="226" r="13" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="110" y="268" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Nuclear</text><text x="110" y="294" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">two generations:</text><text x="110" y="314" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">parents and</text><text x="110" y="334" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">dependent children</text><rect x="200" y="108" width="160" height="280" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><line x1="258" y1="140" x2="302" y2="140" stroke="#1e2a44" stroke-width="2.5"/><circle cx="258" cy="140" r="13" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><circle cx="302" cy="140" r="13" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><line x1="280" y1="140" x2="280" y2="180" stroke="#1e2a44" stroke-width="2.5"/><line x1="258" y1="180" x2="302" y2="180" stroke="#1e2a44" stroke-width="2.5"/><circle cx="258" cy="180" r="13" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="302" cy="180" r="13" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><line x1="280" y1="180" x2="280" y2="220" stroke="#1e2a44" stroke-width="2.5"/><circle cx="280" cy="226" r="13" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="280" y="268" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Vertically</text><text x="280" y="290" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">extended</text><text x="280" y="316" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">three or more</text><text x="280" y="336" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">generations</text><rect x="370" y="108" width="160" height="280" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><line x1="396" y1="190" x2="428" y2="190" stroke="#1e2a44" stroke-width="2.5"/><circle cx="396" cy="190" r="11" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="428" cy="190" r="11" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><line x1="472" y1="190" x2="504" y2="190" stroke="#1e2a44" stroke-width="2.5"/><circle cx="472" cy="190" r="11" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="504" cy="190" r="11" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><line x1="428" y1="164" x2="472" y2="164" stroke="#1e2a44" stroke-width="2.5" stroke-dasharray="5 4"/><line x1="428" y1="164" x2="428" y2="179" stroke="#1e2a44" stroke-width="2.5" stroke-dasharray="5 4"/><line x1="472" y1="164" x2="472" y2="179" stroke="#1e2a44" stroke-width="2.5" stroke-dasharray="5 4"/><text x="450" y="268" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Horizontally</text><text x="450" y="290" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">extended</text><text x="450" y="316" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">same generation,</text><text x="450" y="336" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">e.g. brothers and</text><text x="450" y="356" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">their wives</text><rect x="540" y="108" width="160" height="280" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="620" cy="170" r="13" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><line x1="620" y1="183" x2="620" y2="220" stroke="#1e2a44" stroke-width="2.5"/><line x1="598" y1="220" x2="642" y2="220" stroke="#1e2a44" stroke-width="2.5"/><circle cx="598" cy="226" r="13" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="642" cy="226" r="13" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="620" y="268" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Single parent</text><text x="620" y="294" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">one parent with</text><text x="620" y="314" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">dependent children</text><rect x="710" y="108" width="160" height="280" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><line x1="768" y1="170" x2="812" y2="170" stroke="#1e2a44" stroke-width="2.5"/><circle cx="768" cy="170" r="13" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="812" cy="170" r="13" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><line x1="768" y1="183" x2="768" y2="213" stroke="#1e2a44" stroke-width="2.5"/><line x1="812" y1="183" x2="812" y2="213" stroke="#1e2a44" stroke-width="2.5" stroke-dasharray="5 4"/><circle cx="768" cy="226" r="13" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="812" cy="226" r="13" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="790" y="268" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Reconstituted</text><text x="790" y="294" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">a couple with</text><text x="790" y="314" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">children from a</text><text x="790" y="334" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">previous</text><text x="790" y="354" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">relationship</text><circle cx="230" cy="414" r="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="246" y="420" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">adult</text><circle cx="330" cy="414" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="346" y="420" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">child</text><circle cx="430" cy="414" r="10" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="446" y="420" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">grandparent</text><line x1="580" y1="414" x2="620" y2="414" stroke="#1e2a44" stroke-width="2.5" stroke-dasharray="5 4"/><text x="630" y="420" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">sibling or step link</text><rect x="30" y="446" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="482" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Alternatives to families</text><text x="56" y="511" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Communes (unrelated adults share property and childcare), living alone, foster care and</text><text x="56" y="533" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">children’s homes.</text>
</svg>