<rect width="900" height="593" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">From separate roles to the triple shift</text>

<rect x="30" y="108" width="404" height="300" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,158 L31.25,122.25 Q31.25,109.25 44.25,109.25 L419.75,109.25 Q432.75,109.25 432.75,122.25 L432.75,158 Z" fill="#b5d3cf"/><line x1="31.25" y1="158" x2="432.75" y2="158" stroke="#c9d6d4" stroke-width="2"/><text x="232" y="139" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Parsons: traditional roles</text><rect x="52" y="186" width="172" height="196" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="138" y="268" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Instrumental</text><text x="138" y="296" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">male breadwinner</text><rect x="240" y="186" width="172" height="196" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="326" y="256" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Expressive</text><text x="326" y="284" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">female, emotional</text><text x="326" y="306" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">and caring</text><rect x="466" y="108" width="404" height="300" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M467.25,158 L467.25,122.25 Q467.25,109.25 480.25,109.25 L855.75,109.25 Q868.75,109.25 868.75,122.25 L868.75,158 Z" fill="#d4b02e"/><line x1="467.25" y1="158" x2="868.75" y2="158" stroke="#c9d6d4" stroke-width="2"/><text x="668" y="139" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">The triple shift</text><rect x="500" y="186" width="336" height="56" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="668" y="222" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Paid work</text><rect x="500" y="252" width="336" height="56" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="668" y="288" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Domestic work</text><rect x="500" y="318" width="336" height="56" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="668" y="354" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Emotional work</text><text x="668" y="400" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Duncombe and Marsden</text><line x1="438" y1="258" x2="462" y2="258" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="30" y="428" width="840" height="141" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="464" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Power inside families</text><circle cx="61" cy="487.39" r="4.5" fill="#8a6d0d"/><text x="74" y="493" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Even where tasks are shared, men often make the biggest financial decisions</text><circle cx="61" cy="517.39" r="4.5" fill="#8a6d0d"/><text x="74" y="523" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Dobash and Dobash: domestic violence is linked to male power; the WHO estimates about 1 in</text><text x="74" y="545" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">3 women worldwide have experienced physical or sexual violence</text>
</svg>