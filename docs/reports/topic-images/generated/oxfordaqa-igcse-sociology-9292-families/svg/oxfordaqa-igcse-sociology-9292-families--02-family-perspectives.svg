<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 566" width="900" height="566" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="566" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three perspectives on families</text>

<rect x="148" y="104" width="235.33333333333334" height="64" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="265.6666666666667" y="128.74" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Functionalism</text><text x="265.6666666666667" y="152.74" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">(Parsons)</text><rect x="391.33333333333337" y="104" width="235.33333333333334" height="64" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="509.00000000000006" y="140.74" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Marxism (Engels)</text><rect x="634.6666666666667" y="104" width="235.33333333333334" height="64" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="752.3333333333334" y="140.74" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Feminisms (Oakley)</text><rect x="30" y="176" width="110" height="114" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="238.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Main idea</text><rect x="148" y="176" width="235.33333333333334" height="114" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="162" y="206.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Two functions: primary</text><text x="162" y="227.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">socialisation and</text><text x="162" y="248.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">stabilisation of adult</text><text x="162" y="269.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">personalities</text><rect x="391.33333333333337" y="176" width="235.33333333333334" height="114" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="405.33333333333337" y="206.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Monogamy developed with</text><text x="405.33333333333337" y="227.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">private property, so men</text><text x="405.33333333333337" y="248.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">knew their legitimate</text><text x="405.33333333333337" y="269.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">heirs</text><rect x="634.6666666666667" y="176" width="235.33333333333334" height="114" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="648.6666666666667" y="206.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Families shape the unequal</text><text x="648.6666666666667" y="227.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">position of men and women</text><rect x="30" y="298" width="110" height="93" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="349.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Key point</text><rect x="148" y="298" width="235.33333333333334" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="162" y="328.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The small, mobile nuclear</text><text x="162" y="349.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">family “fits” industrial</text><text x="162" y="370.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">society</text><rect x="391.33333333333337" y="298" width="235.33333333333334" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="405.33333333333337" y="328.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Families are agents of</text><text x="405.33333333333337" y="349.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">social control and units</text><text x="405.33333333333337" y="370.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">of consumption</text><rect x="634.6666666666667" y="298" width="235.33333333333334" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="648.6666666666667" y="328.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">London housewives: women</text><text x="648.6666666666667" y="349.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">did most housework; men’s</text><text x="648.6666666666667" y="370.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“help” was limited</text><rect x="30" y="399" width="110" height="135" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="471.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Criticism</text><rect x="148" y="399" width="235.33333333333334" height="135" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="162" y="429.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Laslett: most</text><text x="162" y="450.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">pre-industrial English</text><text x="162" y="471.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">households were already</text><text x="162" y="492.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">nuclear; ignores conflict</text><text x="162" y="513.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and abuse</text><rect x="391.33333333333337" y="399" width="235.33333333333334" height="135" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="405.33333333333337" y="429.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Ignores benefits to</text><text x="405.33333333333337" y="450.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">members; families vary</text><text x="405.33333333333337" y="471.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">across classes and</text><text x="405.33333333333337" y="492.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">societies</text><rect x="634.6666666666667" y="399" width="235.33333333333334" height="135" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="648.6666666666667" y="429.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">May understate change and</text><text x="648.6666666666667" y="450.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the variety of women’s</text><text x="648.6666666666667" y="471.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">experiences</text>
</svg>