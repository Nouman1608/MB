324.25 Q31.25,311.25 44.25,311.25 L427.75,311.25 Q440.75,311.25 440.75,324.25 L440.75,360 Z" fill="#dce9e7"/><line x1="31.25" y1="360" x2="440.75" y2="360" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="340.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Effects of the one-child policy</text><circle cx="49" cy="386.53999999999996" r="4.5" fill="#2e6b62"/><text x="62" y="392.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Reduced family size</text><circle cx="49" cy="416.53999999999996" r="4.5" fill="#2e6b62"/><text x="62" y="422.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Contributed to an ageing population</text><rect x="458" y="310" width="412" height="166" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,360 L459.25,324.25 Q459.25,311.25 472.25,311.25 L855.75,311.25 Q868.75,311.25 868.75,324.25 L868.75,360 Z" fill="#ffffff"/><line x1="459.25" y1="360" x2="868.75" y2="360" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="340.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Other policies that shape families</text><circle cx="477" cy="386.53999999999996" r="4.5" fill="#2e6b62"/><text x="490" y="392.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Divorce laws</text><circle cx="477" cy="416.53999999999996" r="4.5" fill="#2e6b62"/><text x="490" y="422.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Welfare benefits</text><circle cx="477" cy="446.53999999999996" r="4.5" fill="#2e6b62"/><text x="490" y="452.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Childcare provision</text>
