<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 548" width="900" height="548" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="548" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">One point, developed in three steps</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Explain one way families act as agents of social control [3]</text>
<rect x="30" y="120" width="840" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="67" cy="168" r="21" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="67" y="175.56" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="104" y="159.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Point (1 mark)</text><text x="104" y="189.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Marxists argue that families teach children to obey parental authority.</text><line x1="450" y1="220" x2="450" y2="256" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="262" width="840" height="118" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="67" cy="321" r="21" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="67" y="328.56" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="104" y="301.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Develop (1 mark)</text><text x="104" y="331.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">This prepares them to accept the authority of employers and the state without</text><text x="104" y="353.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">questioning it.</text><line x1="450" y1="384" x2="450" y2="420" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="426" width="840" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="67" cy="474" r="21" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="67" y="481.56" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="104" y="465.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Consequence (1 mark)</text><text x="104" y="495.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">This helps keep an unequal capitalist society stable.</text>
</svg>