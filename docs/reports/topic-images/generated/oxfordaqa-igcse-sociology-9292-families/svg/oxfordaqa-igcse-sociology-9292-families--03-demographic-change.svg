<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 675" width="900" height="675" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="675" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Demographic change and its causes</text>

<text x="225" y="124" font-size="18" font-weight="700" fill="#4a5568" text-anchor="middle">Explanations</text><text x="675" y="124" font-size="18" font-weight="700" fill="#4a5568" text-anchor="middle">Demographic change</text><rect x="30" y="140" width="400" height="92" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="180.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Contraception; more education and paid work</text><text x="48" y="201.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">for women; children an economic cost</text><line x1="436" y1="186" x2="474" y2="186" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="480" y="140" width="390" height="92" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="498" y="179.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Falling birth rates and smaller</text><text x="498" y="203.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">families</text><rect x="30" y="244" width="400" height="92" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="284.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Better nutrition, clean water, sanitation,</text><text x="48" y="305.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">vaccination and healthcare</text><line x1="436" y1="290" x2="474" y2="290" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="480" y="244" width="390" height="92" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="498" y="283.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Falling death rates, including</text><text x="498" y="307.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">infant and child mortality</text><rect x="30" y="348" width="400" height="92" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="398.7" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Longer life expectancy plus fewer births</text><line x1="436" y1="394" x2="474" y2="394" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="480" y="348" width="390" height="92" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="498" y="399.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Ageing populations (e.g. Japan)</text><rect x="30" y="452" width="400" height="92" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="502.7" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Moving to cities, or abroad, for work</text><line x1="436" y1="498" x2="474" y2="498" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="480" y="452" width="390" height="92" rx="12" fill="#efdfa8" stroke="#1e2a44" stroke-width="2.5"/><text x="498" y="491.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Migration, internal and</text><text x="498" y="515.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">international</text><rect x="30" y="562" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="598" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Common mistake</text><text x="56" y="627" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Describing demographic change without explaining its causes.</text>
</svg>