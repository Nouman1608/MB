5568" text-anchor="middle">2006</text><line x1="356.25" y1="230" x2="356.25" y2="242" stroke="#1e2a44" stroke-width="2"/><text x="356.25" y="260" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">2008</text><line x1="422.0833333333333" y1="230" x2="422.0833333333333" y2="242" stroke="#1e2a44" stroke-width="2"/><text x="422.0833333333333" y="260" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">2010</text><line x1="487.9166666666667" y1="230" x2="487.9166666666667" y2="242" stroke="#1e2a44" stroke-width="2"/><text x="487.9166666666667" y="260" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">2012</text><line x1="553.75" y1="230" x2="553.75" y2="242" stroke="#1e2a44" stroke-width="2"/><text x="553.75" y="260" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">2014</text><line x1="619.5833333333334" y1="230" x2="619.5833333333334" y2="242" stroke="#1e2a44" stroke-width="2"/><text x="619.5833333333334" y="260" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">2016</text><line x1="685.4166666666666" y1="230" x2="685.4166666666666" y2="242" stroke="#1e2a44" stroke-width="2"/><text x="685.4166666666666" y="260" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">2018</text><line x1="751.25" y1="230" x2="751.25" y2="242" stroke="#1e2a44" stroke-width="2"/><text x="751.25" y="260" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">2020</text><line x1="817.0833333333334" y1="230" x2="817.0833333333334" y2="242" stroke="#1e2a44" stroke-width="2"/><text x="817.0833333333334" y="260" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">2022</text><circle cx="323.3333333333333" cy="236" r="7" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><line x1="323.3333333333333" y1="266" x2="323.3333333333333" y2="272" stroke="#1e2a44" stroke-width="1.5"/><text x="327.3333333333333" y="288" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="end">2007: Lawyers’ Movement</text><circle cx="422.0833333333333" cy="236" r="7" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><line x1="422.0833333333333" y1="266" x2="422.0833333333333" y2="306" stroke="#1e2a44" stroke-width="1.5"/><text x="422.0833333333333" y="322" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">2010: 18th Amendment</text><circle cx="520.8333333333333" cy="236" r="7" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><line x1="520.8333333333333" y1="266" x2="520.8333333333333" y2="340" stroke="#1e2a44" stroke-width="1.5"/><text x="520.8333333333333" y="356" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">2013: first elected handover</text><circle cx="652.5" cy="236" r="7" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><line x1="652.5" y1="266" x2="652.5" y2="272" stroke="#1e2a44" stroke-width="1.5"/><text x="652.5" y="288" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">2017: Sharif disqualified</text><circle cx="826.9583333333318" cy="236" r="7" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><line x1="826.9583333333318" y1="266" x2="826.9583333333318" y2="306" stroke="#1e2a44" stroke-width="1.5"/><text x="830.9583333333318" y="322" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="end">Apr 2022: no-confidence vote</text><rect x="30" y="412" width="410" height="164" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="443.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Musharraf, 1999–2008</text><text x="48" y="470.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="470.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Growth in the mid-2000s; local government;</text><text x="64" y="490.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">private TV; reserved seats for women</text><text x="48" y="513.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="513.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Joined the US-led campaign after 2001; dismissed</text><text x="64" y="533.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">the Chief Justice 2007; emergency Nov 2007;</text><text x="64" y="553.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">resigned 2008</text><rect x="460" y="412" width="410" height="164" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="478" y="443.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Zardari, 2008–13</text><text x="478" y="470.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="494" y="470.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">18th Amendment (2010): no presidential</text><text x="494" y="490.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">dissolution; subjects devolved; NWFP renamed</text><text x="494" y="510.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Khyber Pakhtunkhwa; free education aged 5–16</text><text x="478" y="533.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="494" y="533.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">19th Amendment: judicial appointments</text><rect x="30" y="590" width="410" height="164" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="621.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">PML-N, 2013–18</text><text x="48" y="648.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="648.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Energy projects to end load-shedding</text><text x="48" y="671.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="671.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">CPEC</text><text x="48" y="694.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="694.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Operations against militancy after the 2014</text><text x="64" y="714.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Peshawar school attack</text><rect x="460" y="590" width="410" height="164" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="478" y="621.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">PTI, 2018–22</text><text x="478" y="648.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="494" y="648.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Ehsaas; health insurance cards; tree planting</text><text x="478" y="671.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="494" y="671.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">IMF programme 2019</text><text x="478" y="694.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="494" y="694.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Covid-19 response: smart lockdowns, Ehsaas</text><text x="494" y="714.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">cash, vaccination from 2021</text>
