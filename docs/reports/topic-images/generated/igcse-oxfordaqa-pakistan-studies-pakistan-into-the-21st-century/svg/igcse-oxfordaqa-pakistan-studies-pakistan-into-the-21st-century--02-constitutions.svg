<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="560" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How Pakistan’s constitution developed</text>

<line x1="90" y1="130" x2="90" y2="520" stroke="#1e2a44" stroke-width="4"/><rect x="172" y="120" width="698" height="104" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="190" y="152.15" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Objectives Resolution</text><text x="190" y="180.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Sovereignty belongs to Allah; democracy and Islamic principles; minorities protected.</text><text x="190" y="201.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Later made part of the constitution.</text><rect x="172" y="236" width="698" height="83" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="190" y="268.15" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">First constitution</text><text x="190" y="296.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Islamic Republic; parliamentary system; the President must be a Muslim.</text><rect x="172" y="331" width="698" height="83" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="190" y="363.15" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Ayub Khan’s constitution</text><text x="190" y="391.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Presidential system; indirect elections.</text><rect x="172" y="426" width="698" height="104" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="190" y="458.15" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Current constitution</text><text x="190" y="486.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Federal parliamentary system; two-house parliament; Islam the state religion. Still in</text><text x="190" y="507.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">force, with amendments.</text><rect x="30" y="134" width="120" height="40" rx="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="90" y="161" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">1949</text><line x1="150" y1="154" x2="172" y2="154" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="250" width="120" height="40" rx="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="90" y="277" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">1956</text><line x1="150" y1="270" x2="172" y2="270" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="345" width="120" height="40" rx="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="90" y="372" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">1962</text><line x1="150" y1="365" x2="172" y2="365" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="440" width="120" height="40" rx="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="90" y="467" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">1973</text><line x1="150" y1="460" x2="172" y2="460" stroke="#1e2a44" stroke-width="2.5"/>
</svg>