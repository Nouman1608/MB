<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 513" width="900" height="513" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="513" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Democratic concepts and political parties</text>

<rect x="30" y="112" width="270" height="105" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="145" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Transparency</text><text x="48" y="173.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Government decisions are</text><text x="48" y="194.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">open to scrutiny</text><rect x="315" y="112" width="270" height="105" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="333" y="145" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Rule of law</text><text x="333" y="173.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Everyone, including leaders, is</text><text x="333" y="194.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">subject to the law and courts</text><rect x="600" y="112" width="270" height="105" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="618" y="145" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Accountability</text><text x="618" y="173.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Officials can be questioned</text><text x="618" y="194.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and removed</text><text x="30" y="245" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="start">MAJOR PARTIES</text><rect x="30" y="257" width="270" height="131" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="290" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Pakistan Muslim</text><text x="48" y="316" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">League factions</text><text x="48" y="344.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Descended from the All-India</text><text x="48" y="365.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Muslim League</text><rect x="315" y="257" width="270" height="131" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="333" y="290" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Pakistan People’s</text><text x="333" y="316" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Party</text><text x="333" y="344.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Founded 1967 by Zulfikar Ali</text><text x="333" y="365.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Bhutto</text><rect x="600" y="257" width="270" height="131" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="618" y="290" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Pakistan</text><text x="618" y="316" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Tehreek-e-Insaf</text><text x="618" y="344.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Founded 1996 by Imran Khan</text><rect x="30" y="408" width="840" height="75" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="438.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Alongside regional and religious parties. Parties organise voters, form governments and act as</text><text x="48" y="460.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">opposition.</text>
</svg>