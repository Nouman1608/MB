<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 552" width="900" height="552" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="552" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How government works under the 1973 Constitution</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">a simplified diagram</text>
<rect x="60" y="112" width="300" height="90" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="210" y="150" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">President</text><text x="210" y="178" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">head of state</text><rect x="540" y="112" width="300" height="90" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="690" y="150" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Prime Minister</text><text x="690" y="178" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">leads the government</text><line x1="364" y1="157" x2="536" y2="157" stroke="#b5602e" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#ahR)" marker-start="url(#ahR)"/><text x="450" y="236" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">amendments have shifted</text><text x="450" y="255" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">power between them</text><rect x="30" y="292" width="840" height="150" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="324" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Parliament (two houses)</text><rect x="470" y="342" width="370" height="84" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="655" y="376" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">National Assembly</text><text x="655" y="402" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">the Prime Minister answers to it</text><rect x="60" y="342" width="370" height="84" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="245" y="376" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Senate</text><text x="245" y="402" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">equal representation for each province</text><line x1="690" y1="206" x2="690" y2="336" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="704" y="252" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">answers to</text><text x="450" y="460" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">FEDERALISM: power shared between the federal government and the provinces</text><rect x="100" y="472" width="300" height="54" rx="27" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="250" y="506" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Federal government</text><rect x="500" y="472" width="300" height="54" rx="27" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="650" y="506" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Provinces</text><line x1="408" y1="499" x2="492" y2="499" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)" marker-start="url(#ah)"/>
</svg>