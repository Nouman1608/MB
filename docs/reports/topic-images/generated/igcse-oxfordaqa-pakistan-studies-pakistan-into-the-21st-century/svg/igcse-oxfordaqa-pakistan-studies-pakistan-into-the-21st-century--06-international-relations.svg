<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 645" width="900" height="645" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="645" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Pakistan’s international relations since 2000</text>

<rect x="330" y="261" width="240" height="64" rx="32" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="301" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Pakistan</text><line x1="230" y1="233" x2="390" y2="261" stroke="#c9d6d4" stroke-width="4"/><rect x="30" y="112" width="400" height="121" rx="12" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="48" y="143.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">India</text><text x="48" y="170.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Kashmir the core dispute; 2019 tensions after</text><text x="48" y="190.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Pulwama and the change to Kashmir’s status;</text><text x="48" y="210.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Kartarpur Corridor (2019) as goodwill</text><line x1="670" y1="233" x2="510" y2="261" stroke="#c9d6d4" stroke-width="4"/><rect x="470" y="112" width="400" height="121" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="488" y="143.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">China</text><text x="488" y="170.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">“All-weather” partner; JF-17 aircraft; CPEC: roads,</text><text x="488" y="190.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">power, Gwadar, agriculture</text><line x1="230" y1="353" x2="390" y2="325" stroke="#c9d6d4" stroke-width="4"/><rect x="30" y="353" width="400" height="121" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="384.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Muslim world</text><text x="48" y="411.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Close ties with Turkey; Saudi Arabia and the UAE</text><text x="48" y="431.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">give financial support and employ many Pakistani</text><text x="48" y="451.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">workers</text><line x1="670" y1="353" x2="510" y2="325" stroke="#c9d6d4" stroke-width="4"/><rect x="470" y="353" width="400" height="121" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="488" y="384.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">USA</text><text x="488" y="411.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Key ally after 2001 and aid; tension over drone</text><text x="488" y="431.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">strikes and the 2011 Abbottabad raid</text><line x1="450" y1="494" x2="450" y2="325" stroke="#c9d6d4" stroke-width="4"/><rect x="250" y="494" width="400" height="121" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="268" y="525.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">IMF and UN</text><text x="268" y="552.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">IMF support after the 2008 crisis and since; a</text><text x="268" y="572.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">leading contributor of UN peacekeeping troops</text>
</svg>