<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 474" width="900" height="474" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="474" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Pakistan in 1947: challenges and opportunities</text>

<rect x="30" y="112" width="410" height="207" rx="12" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="48" y="146.7" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Challenges</text><text x="48" y="176.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="176.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Unfavourable boundary award</text><text x="48" y="200.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="200.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Refugee crisis</text><text x="48" y="224.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="224.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Delayed division of assets</text><text x="48" y="248.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="248.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Indus tributary waters dispute</text><text x="48" y="272.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="272.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Princely states, above all Kashmir</text><text x="48" y="296.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="296.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A government built from scratch in Karachi</text><rect x="460" y="112" width="410" height="207" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="478" y="146.7" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Opportunities</text><text x="478" y="176.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="494" y="176.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A strong sense of national purpose</text><text x="478" y="200.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="494" y="200.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Agricultural land in Punjab and Sindh</text><text x="478" y="224.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="494" y="224.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">International recognition</text><rect x="30" y="339" width="840" height="105" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="372" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Jinnah as Governor-General</text><text x="48" y="400.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Organised the new administration, appealed for refugee relief, founded the State Bank (1948) and set out a</text><text x="48" y="421.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">vision of a tolerant state. Died September 1948.</text>
</svg>