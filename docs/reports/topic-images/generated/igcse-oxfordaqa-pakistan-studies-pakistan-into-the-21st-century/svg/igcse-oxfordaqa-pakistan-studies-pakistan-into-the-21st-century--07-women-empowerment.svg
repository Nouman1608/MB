<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 693" width="900" height="693" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="693" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How far have women been empowered?</text>

<line x1="90" y1="130" x2="90" y2="497" stroke="#1e2a44" stroke-width="4"/><rect x="172" y="120" width="698" height="82" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="190" y="151.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Benazir Bhutto becomes Prime Minister</text><text x="190" y="179.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">First woman elected to lead a Muslim-majority country.</text><rect x="172" y="212" width="698" height="54" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="190" y="243.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Protection of Women Act</text><rect x="172" y="276" width="698" height="54" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="190" y="307.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Protection against Harassment of Women at the Workplace Act</text><rect x="172" y="340" width="698" height="54" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="190" y="371.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Law against so-called honour killings</text><rect x="172" y="404" width="698" height="103" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="190" y="435.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Dr Sania Nishtar leads the Ehsaas programme</text><text x="190" y="463.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Cash support paid directly to women. She earlier founded the health think-tank</text><text x="190" y="484.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Heartfile.</text><rect x="30" y="134" width="120" height="40" rx="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="90" y="161" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">1988</text><line x1="150" y1="154" x2="172" y2="154" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="219" width="120" height="40" rx="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="90" y="246" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">2006</text><line x1="150" y1="239" x2="172" y2="239" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="283" width="120" height="40" rx="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="90" y="310" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">2010</text><line x1="150" y1="303" x2="172" y2="303" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="347" width="120" height="40" rx="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="90" y="374" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">2016</text><line x1="150" y1="367" x2="172" y2="367" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="418" width="120" height="40" rx="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="90" y="445" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Ehsaas</text><line x1="150" y1="438" x2="172" y2="438" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="531" width="410" height="132" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="564" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">By 2022: rising</text><text x="48" y="592.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="592.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Girls’ school enrolment</text><text x="48" y="616.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="616.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Women’s political representation (women have</text><text x="64" y="637.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">served as Speaker and Foreign Minister)</text><rect x="460" y="531" width="410" height="132" rx="12" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="478" y="564" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">By 2022: still lagging</text><text x="478" y="592.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="494" y="592.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Literacy</text><text x="478" y="616.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="494" y="616.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Workforce participation</text><text x="478" y="640.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="494" y="640.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Legal protection, especially in rural areas</text>
</svg>