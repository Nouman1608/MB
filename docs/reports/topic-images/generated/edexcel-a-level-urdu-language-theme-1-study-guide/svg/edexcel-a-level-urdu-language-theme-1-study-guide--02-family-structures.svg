<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Family: two structures, one balanced view</text>

<rect x="30" y="110" width="410" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="416" y="162" font-family="Noto Nastaliq Urdu" font-size="28" font-weight="400" fill="#1e2a44" text-anchor="end">‏مشترکہ خاندانی نظام‏</text><text x="52" y="204" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">joint family system</text><text x="52" y="250" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">offers</text><circle cx="70" cy="284" r="15" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><path d="M63,284 l5,6 l10,-12" fill="none" stroke="#2e6b62" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><text x="98" y="290" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">support</text><circle cx="70" cy="324" r="15" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><path d="M63,324 l5,6 l10,-12" fill="none" stroke="#2e6b62" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><text x="98" y="330" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">shared costs</text><rect x="460" y="110" width="410" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="846" y="162" font-family="Noto Nastaliq Urdu" font-size="28" font-weight="400" fill="#1e2a44" text-anchor="end">‏الگ گھرانا / چھوٹا خاندان‏</text><text x="482" y="204" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">separate or smaller household</text><text x="482" y="250" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">offers</text><circle cx="500" cy="284" r="15" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><path d="M493,284 l5,6 l10,-12" fill="none" stroke="#2e6b62" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><text x="528" y="290" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">privacy</text><circle cx="500" cy="324" r="15" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><path d="M493,324 l5,6 l10,-12" fill="none" stroke="#2e6b62" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><text x="528" y="330" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">independence</text><rect x="30" y="376" width="840" height="70" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="408" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Strongest: a balanced position</text><text x="450" y="432" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">society is changing, without presenting either form as simply right or wrong</text><text x="54" y="486" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Key words</text><rect x="30" y="502" width="96" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="78" y="548" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="middle">‏بزرگ‏</text><text x="78" y="586" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">elder</text><rect x="132" y="502" width="110" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="187" y="548" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="middle">‏رشتے دار‏</text><text x="187" y="586" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">relative</text><rect x="248" y="502" width="96" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="296" y="548" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="middle">‏شادی‏</text><text x="296" y="586" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">marriage</text><rect x="350" y="502" width="116" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="408" y="548" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="middle">‏ذمہ داری‏</text><text x="408" y="586" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">responsibility</text><rect x="472" y="502" width="100" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="522" y="548" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="middle">‏روایت‏</text><text x="522" y="586" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">tradition</text><rect x="578" y="502" width="100" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="628" y="548" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="middle">‏نسل‏</text><text x="628" y="586" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">generation</text><rect x="684" y="502" width="110" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="739" y="548" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="middle">‏دیکھ بھال‏</text><text x="739" y="586" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">care</text>
