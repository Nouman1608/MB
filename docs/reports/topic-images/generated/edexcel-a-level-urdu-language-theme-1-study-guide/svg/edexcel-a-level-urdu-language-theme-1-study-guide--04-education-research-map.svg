<rect width="900" height="744" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Researching equal access to education</text>

<line x1="450" y1="360" x2="170" y2="170" stroke="#1e2a44" stroke-width="2.5"/><line x1="450" y1="360" x2="730" y2="170" stroke="#1e2a44" stroke-width="2.5"/><line x1="450" y1="360" x2="130" y2="360" stroke="#1e2a44" stroke-width="2.5"/><line x1="450" y1="360" x2="770" y2="360" stroke="#1e2a44" stroke-width="2.5"/><line x1="450" y1="360" x2="190" y2="550" stroke="#1e2a44" stroke-width="2.5"/><line x1="450" y1="360" x2="710" y2="550" stroke="#1e2a44" stroke-width="2.5"/><circle cx="450" cy="360" r="96" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="3"/><text x="450" y="354" font-family="Noto Nastaliq Urdu" font-size="28" font-weight="400" fill="#1e2a44" text-anchor="middle">‏مساوی مواقع‏</text><text x="450" y="394" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">equal access</text><text x="450" y="416" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">in Pakistan</text><rect x="50" y="110" width="240" height="120" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="170" y="140" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Girls and boys</text><text x="170" y="188" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#2e6b62" text-anchor="middle">‏صنفی امتیاز‏</text><text x="170" y="218" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">gender discrimination</text><rect x="610" y="110" width="240" height="120" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="730" y="140" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Rural and urban</text><text x="730" y="188" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#2e6b62" text-anchor="middle">‏دیہی / شہری‏</text><text x="730" y="218" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">rural / urban</text><rect x="10" y="300" width="240" height="120" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="130" y="330" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Public and private</text><text x="130" y="378" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#2e6b62" text-anchor="middle">‏سرکاری / نجی‏</text><text x="130" y="408" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">public / private</text><rect x="650" y="315" width="240" height="90" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="770" y="345" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Language of instruction</text><text x="770" y="372" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">and its effect on</text><text x="770" y="391" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">opportunity</text><rect x="70" y="505" width="240" height="90" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="190" y="535" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Barriers</text><text x="190" y="562" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">poverty, distance, child</text><text x="190" y="581" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">labour, cost</text><rect x="590" y="505" width="240" height="90" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="710" y="535" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Article 25A (2010)</text><text x="710" y="562" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">free and compulsory</text><text x="710" y="581" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">education</text><rect x="30" y="640" width="840" height="80" rx="12" fill="#f6ece4" stroke="#b5602e" stroke-width="2.5"/><text x="54" y="674" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Keep a research file of named sources, dates and figures you have checked</text><text x="54" y="700" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">check the wording and age range of Article 25A before quoting it; never quote an untraceable statistic</text>
</svg>