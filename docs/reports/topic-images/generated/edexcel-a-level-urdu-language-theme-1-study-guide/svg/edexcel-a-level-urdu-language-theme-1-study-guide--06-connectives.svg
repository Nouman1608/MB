<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 512" width="900" height="512" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="512" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Connectives that carry an argument</text>

<text x="450" y="128" font-size="17" font-weight="600" fill="#4a5568" text-anchor="middle">Build each paragraph around one link so the argument can be followed</text><rect x="30" y="150" width="410" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="420" y="202" font-family="Noto Nastaliq Urdu" font-size="28" font-weight="400" fill="#1e2a44" text-anchor="end">‏اس کے برعکس‏</text><text x="420" y="236" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end">in contrast</text><rect x="460" y="150" width="410" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="850" y="202" font-family="Noto Nastaliq Urdu" font-size="28" font-weight="400" fill="#1e2a44" text-anchor="end">‏اس کے علاوہ‏</text><text x="850" y="236" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end">in addition</text><rect x="30" y="266" width="410" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="420" y="318" font-family="Noto Nastaliq Urdu" font-size="28" font-weight="400" fill="#1e2a44" text-anchor="end">‏نتیجتاً‏</text><text x="420" y="352" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end">as a result</text><rect x="460" y="266" width="410" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="850" y="318" font-family="Noto Nastaliq Urdu" font-size="28" font-weight="400" fill="#1e2a44" text-anchor="end">‏میرے خیال میں‏</text><text x="850" y="352" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end">in my opinion</text><rect x="30" y="382" width="410" height="100" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="420" y="434" font-family="Noto Nastaliq Urdu" font-size="28" font-weight="400" fill="#1e2a44" text-anchor="end">‏ایک طرف ... دوسری طرف‏</text><text x="420" y="468" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end">on one hand ... on the other</text><rect x="460" y="382" width="410" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="850" y="434" font-family="Noto Nastaliq Urdu" font-size="28" font-weight="400" fill="#1e2a44" text-anchor="end">‏آخر میں‏</text><text x="850" y="468" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end">finally</text>
</svg>