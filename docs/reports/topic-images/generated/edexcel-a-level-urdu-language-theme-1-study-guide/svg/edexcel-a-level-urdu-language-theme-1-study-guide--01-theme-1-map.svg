<rect width="900" height="550" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Theme 1 at a glance</text>

<rect x="200" y="108" width="500" height="100" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="3"/><text x="450" y="160" font-family="Noto Nastaliq Urdu" font-size="30" font-weight="400" fill="#1e2a44" text-anchor="middle">‏پاکستانی معاشرے کا ارتقا‏</text><text x="450" y="194" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Theme 1: Evolving Pakistani society</text><path d="M450,208 V230 H163 V250" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><rect x="30" y="256" width="266" height="230" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="290" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">1.1</text><text x="276" y="312" font-family="Noto Nastaliq Urdu" font-size="32" font-weight="400" fill="#1e2a44" text-anchor="end">‏خاندان‏</text><text x="50" y="360" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Family</text><text x="50" y="420" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">structures, elders,</text><text x="50" y="442" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">roles, marriage,</text><text x="50" y="464" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">migration</text><path d="M450,208 V230 H450 V250" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><rect x="317" y="256" width="266" height="230" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="337" y="290" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">1.2</text><text x="563" y="312" font-family="Noto Nastaliq Urdu" font-size="32" font-weight="400" fill="#1e2a44" text-anchor="end">‏کام‏</text><text x="337" y="360" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Work</text><text x="337" y="420" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">types of work, women’s</text><text x="337" y="442" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">employment, unemployment,</text><text x="337" y="464" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">technology</text><path d="M450,208 V230 H737 V250" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><rect x="604" y="256" width="266" height="230" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="3"/><text x="624" y="290" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">1.3</text><text x="850" y="312" font-family="Noto Nastaliq Urdu" font-size="32" font-weight="400" fill="#1e2a44" text-anchor="end">‏تعلیم‏</text><text x="624" y="360" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Equal access to</text><text x="624" y="384" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">education</text><text x="624" y="420" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the research subject:</text><text x="624" y="442" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">research must be</text><text x="624" y="464" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">about Pakistan</text><text x="450" y="522" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Learn the theme in Urdu, not only through English notes</text>
</svg>