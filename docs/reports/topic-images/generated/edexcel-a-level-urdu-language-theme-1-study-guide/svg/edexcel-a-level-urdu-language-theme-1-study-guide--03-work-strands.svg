<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Work: four strands to discuss</text>

<rect x="30" y="110" width="410" height="160" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="148" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Types of work</text><text x="50" y="182" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">agriculture, industry, services,</text><text x="50" y="204" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">informal and self-employment,</text><text x="50" y="226" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">work abroad</text><rect x="460" y="110" width="410" height="160" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="480" y="148" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Women’s employment</text><text x="850" y="192" font-family="Noto Nastaliq Urdu" font-size="28" font-weight="400" fill="#1e2a44" text-anchor="end">‏خواتین کی ملازمت‏</text><text x="480" y="222" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">barriers and opportunities</text><rect x="30" y="286" width="410" height="160" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="324" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Unemployment</text><text x="420" y="368" font-family="Noto Nastaliq Urdu" font-size="28" font-weight="400" fill="#1e2a44" text-anchor="end">‏بے روزگاری‏</text><text x="50" y="398" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">pressure on young people;</text><text x="50" y="420" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">role of skills and training</text><rect x="460" y="286" width="410" height="160" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="480" y="324" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Technology</text><text x="480" y="358" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">freelancing; changes in how</text><text x="480" y="380" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">and where people work</text><text x="54" y="486" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Key words</text><rect x="30" y="502" width="99" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="79.5" y="548" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="middle">‏روزگار‏</text><text x="79.5" y="586" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">livelihood</text><rect x="136" y="502" width="99" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="185.5" y="548" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="middle">‏ملازمت‏</text><text x="185.5" y="586" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">job, service</text><rect x="242" y="502" width="99" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="291.5" y="548" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="middle">‏تنخواہ‏</text><text x="291.5" y="586" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">salary</text><rect x="348" y="502" width="99" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="397.5" y="548" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="middle">‏مزدور‏</text><text x="397.5" y="586" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">labourer</text><rect x="454" y="502" width="99" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="503.5" y="548" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="middle">‏ہنر‏</text><text x="503.5" y="586" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">skill</text><rect x="560" y="502" width="99" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="609.5" y="548" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="middle">‏دفتر‏</text><text x="609.5" y="586" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">office</text><rect x="666" y="502" width="99" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="715.5" y="548" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="middle">‏کاروبار‏</text><text x="715.5" y="586" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">business</text><rect x="772" y="502" width="99" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="821.5" y="548" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="middle">‏ترقی‏</text><text x="821.5" y="586" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">progress</text>
</svg>