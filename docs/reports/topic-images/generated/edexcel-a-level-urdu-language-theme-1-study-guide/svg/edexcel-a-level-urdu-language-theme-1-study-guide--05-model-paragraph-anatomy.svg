<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 866" width="900" height="866" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="866" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What the model paragraph does</text>

<text x="450" y="128" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Task: a short opinion on how family life in Pakistan is changing</text><rect x="30" y="148" width="840" height="124" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="64" cy="182" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="64" y="188.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="96" y="188" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Statement of the change</text><text x="846" y="240" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="end">‏پاکستان میں خاندان کا ڈھانچہ بدل رہا ہے۔‏</text><rect x="30" y="286" width="840" height="174" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="64" cy="320" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="64" y="326.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="96" y="326" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Contrast: then and now</text><text x="846" y="326" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">ergative: verb agrees with the object (m pl)</text><text x="846" y="378" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="end">‏پہلے زیادہ تر لوگ مشترکہ خاندان میں رہتے تھے،‏</text><text x="846" y="428" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="end">‏لیکن اب شہروں میں روزگار کی وجہ سے بہت سے جوڑوں نے الگ گھر بنا لیے ہیں۔‏</text><rect x="30" y="474" width="840" height="174" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="64" cy="508" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="64" y="514.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="96" y="514" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">A benefit and a cost</text><text x="846" y="514" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">feminine agreement with the noun for care</text><text x="846" y="566" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="end">‏اس تبدیلی کا ایک فائدہ یہ ہے کہ میاں بیوی اپنے فیصلے خود کر سکتے ہیں،‏</text><text x="846" y="616" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="end">‏مگر بزرگوں کی دیکھ بھال مشکل ہو گئی ہے۔‏</text><rect x="30" y="662" width="840" height="174" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="64" cy="696" r="18" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="64" y="702.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="96" y="702" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Reasoned opinion</text><text x="846" y="754" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="end">‏میری رائے میں سب سے بہتر راستہ یہ ہے کہ نئی نسل الگ رہ کر بھی‏</text><text x="846" y="804" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="end">‏اپنے بزرگوں سے رابطہ اور ان کی خدمت جاری رکھے۔‏</text>
</svg>