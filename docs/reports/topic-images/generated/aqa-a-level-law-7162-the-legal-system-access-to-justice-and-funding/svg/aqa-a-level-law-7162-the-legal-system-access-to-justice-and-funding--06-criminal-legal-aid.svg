<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 431" width="900" height="431" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="431" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Criminal legal aid: two stages</text>

<rect x="30" y="100" width="330.83333333333337" height="219" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="130" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">AT THE POLICE STATION</text><text x="48" y="156.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Free to anyone detained</text><text x="48" y="185.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="185.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Whatever their means: <tspan font-weight="700" fill="#1e2a44">not</tspan></text><text x="63.2" y="206.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">means-tested</text><text x="48" y="233.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="233.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Duty solicitor scheme</text><text x="48" y="260.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="260.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Right to consult a solicitor: s58 PACE</text><text x="63.2" y="281.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">1984</text><line x1="366.83333333333337" y1="209.5" x2="400.83333333333337" y2="209.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="406.83333333333337" y="100" width="463.16666666666663" height="219" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="424.83333333333337" y="130" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">REPRESENTATION IN COURT</text><text x="424.83333333333337" y="156.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Two tests</text><text x="424.83333333333337" y="185.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="440.03333333333336" y="185.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Interests</tspan> <tspan font-weight="700" fill="#1e2a44">of</tspan> <tspan font-weight="700" fill="#1e2a44">justice:</tspan> loss of liberty or livelihood,</text><text x="440.03333333333336" y="206.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">serious damage to reputation, a substantial question</text><text x="440.03333333333336" y="227.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">of law, can the defendant understand or present their</text><text x="440.03333333333336" y="248.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">case?</text><text x="424.83333333333337" y="275.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="440.03333333333336" y="275.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Means</tspan> <tspan font-weight="700" fill="#1e2a44">test:</tspan> in the Crown Court, contributions from</text><text x="440.03333333333336" y="296.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">income, and from capital if convicted</text><rect x="30" y="341" width="840" height="58" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="374.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">A <tspan font-weight="700" fill="#1e2a44">duty</tspan> <tspan font-weight="700" fill="#1e2a44">solicitor</tspan> at the magistrates’ court can help unrepresented defendants on the day.</text>
</svg>