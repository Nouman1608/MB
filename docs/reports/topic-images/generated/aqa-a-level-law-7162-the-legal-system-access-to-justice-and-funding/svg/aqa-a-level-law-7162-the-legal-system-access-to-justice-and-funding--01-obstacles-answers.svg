<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 527" width="900" height="527" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="527" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Access to justice: two obstacles, three answers</text>

<rect x="100" y="100" width="342" height="151" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="271" y="130" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">OBSTACLE</text><text x="271" y="157.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Knowledge</text><text x="271" y="186.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">People may not realise their problem is</text><text x="271" y="207.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">legal</text><rect x="458" y="100" width="342" height="151" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="629" y="130" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">OBSTACLE</text><text x="629" y="157.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Cost</text><text x="629" y="186.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Lawyers’ fees, court fees, and the risk</text><text x="629" y="207.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">of paying the other side’s costs if a civil</text><text x="629" y="228.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">claim fails</text><line x1="260" y1="257" x2="160" y2="283" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="450" y1="257" x2="450" y2="283" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="640" y1="257" x2="740" y2="283" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="309" width="269.3333333333333" height="106" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="164.66666666666666" y="342.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Free advice</text><text x="164.66666666666666" y="371.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Help lines, Citizens Advice,</text><text x="164.66666666666666" y="392.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">law centres, trade unions</text><rect x="315.3333333333333" y="309" width="269.3333333333333" height="106" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="342.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Private funding</text><text x="450" y="371.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Own resources, insurance,</text><text x="450" y="392.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">conditional fee agreements</text><rect x="600.6666666666666" y="309" width="269.3333333333333" height="106" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="735.3333333333333" y="342.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">State funding</text><text x="735.3333333333333" y="371.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Civil and criminal legal aid</text><rect x="30" y="437" width="840" height="58" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="470.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Goal: find out your rights, get advice and, if necessary, be represented, <tspan font-weight="700" fill="#1e2a44">whatever</tspan> <tspan font-weight="700" fill="#1e2a44">your</tspan> <tspan font-weight="700" fill="#1e2a44">means</tspan>.</text>
</svg>