<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 648" width="900" height="648" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="648" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Conditional fee agreements: “no win, no fee”</text>

<rect x="300" y="100" width="300" height="48" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="128.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Case outcome</text><line x1="380" y1="152" x2="260" y2="188" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="520" y1="152" x2="640" y2="188" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="60" y="192" width="360" height="104" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="240" y="234" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">LOST</text><text x="240" y="260.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">No fee, or a reduced fee</text><rect x="480" y="192" width="360" height="104" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="660" y="220" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">WON</text><text x="660" y="246.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Normal fee + success fee</text><text x="660" y="275.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Uplift of up to 100% of the normal fee</text><rect x="30" y="318" width="840" height="196" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="350" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">WHO PAYS THE SUCCESS FEE?</text><line x1="70" y1="406" x2="830" y2="406" stroke="#1e2a44" stroke-width="3"/><circle cx="170" cy="406" r="11" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="170" y="388" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">1990</text><text x="170" y="442" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">CLSA 1990</text><text x="170" y="463" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">CFAs permitted</text><text x="170" y="484" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">not criminal or family</text><circle cx="450" cy="406" r="11" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><text x="450" y="388" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">1999</text><text x="450" y="442" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Access to Justice Act</text><text x="450" y="463" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">success fee and ATE premium</text><text x="450" y="484" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">recoverable from the loser</text><circle cx="720" cy="406" r="11" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="720" y="388" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">April 2013</text><text x="720" y="442" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">LASPO 2012</text><text x="720" y="463" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">success fee from damages</text><text x="720" y="484" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">PI cap 25%, excl. future losses</text><rect x="30" y="536" width="840" height="80" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="569.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">LASPO also permitted <tspan font-weight="700" fill="#1e2a44">damages-based</tspan> <tspan font-weight="700" fill="#1e2a44">agreements</tspan>: the lawyer takes a percentage of the</text><text x="450" y="591.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">damages won.</text>
</svg>