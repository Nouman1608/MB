<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: Ayo’s unfair dismissal</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Little money; a trade union member</text>
<text x="40" y="140" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ADVICE</text><rect x="30" y="152" width="270.6666666666667" height="123" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="46" y="182.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Trade union</text><text x="46" y="210.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Free advice, possibly</text><text x="46" y="231.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">representation. <tspan font-weight="700" fill="#1e2a44">Best</tspan> <tspan font-weight="700" fill="#1e2a44">first</tspan> <tspan font-weight="700" fill="#1e2a44">step</tspan></text><rect x="314.6666666666667" y="152" width="270.6666666666667" height="123" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="330.6666666666667" y="182.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Citizens Advice or law</text><text x="330.6666666666667" y="205.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">centre</text><text x="330.6666666666667" y="233.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Free advice on employment</text><text x="330.6666666666667" y="254.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">rights</text><rect x="599.3333333333334" y="152" width="270.6666666666667" height="123" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="615.3333333333334" y="182.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Help line</text><text x="615.3333333333334" y="210.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Acas: workplace disputes</text><text x="40" y="313" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FUNDING</text><rect x="30" y="325" width="413" height="100" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="355.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Union-funded solicitor</text><text x="46" y="383.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The most realistic route</text><rect x="457" y="325" width="413" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="473" y="355.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Civil legal aid</text><text x="473" y="383.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Unlikely: most employment matters out of scope</text><text x="473" y="404.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">after LASPO</text><rect x="30" y="437" width="413" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="467.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Own resources or a CFA</text><text x="46" y="495.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Possible; a CFA lawyer will look at prospects of</text><text x="46" y="516.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">success first</text><rect x="457" y="437" width="413" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="473" y="467.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">BTE insurance</text><text x="473" y="495.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Check any home insurance policy for legal cover</text><rect x="30" y="559" width="840" height="88" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="593.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Conclusion: Ayo should contact his union first</text><text x="450" y="622.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Name the source, say what it gives Ayo, apply it to his facts.</text>
