<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 629" width="900" height="629" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="629" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Civil legal aid: three questions</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Administered by the Legal Aid Agency (Ministry of Justice)</text>
<rect x="100" y="124" width="530" height="122" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="116" y="154.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Is the matter in scope?</text><text x="116" y="183.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">In: care proceedings, domestic abuse protection, home at risk,</text><text x="116" y="204.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">asylum, mental health tribunals. Mostly out: private family law,</text><text x="116" y="225.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">clinical negligence, employment, welfare benefits, debt</text><circle cx="60" cy="185" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="193.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><line x1="636" y1="185" x2="680" y2="185" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><text x="658" y="175" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">no</text><line x1="60" y1="211" x2="60" y2="276" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="74" y="272" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">yes</text><rect x="688" y="124" width="182" height="122" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="779" y="163" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">Exceptional case</text><text x="779" y="183" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">funding (LASPO s10)</text><text x="779" y="203" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">if refusal would</text><text x="779" y="223" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">breach human rights</text><rect x="100" y="286" width="530" height="101" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="116" y="316.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Does the person pass the means test?</text><text x="116" y="345.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Disposable income and capital below set limits; some pay a</text><text x="116" y="366.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">contribution</text><circle cx="60" cy="336.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="345.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><line x1="636" y1="336.5" x2="680" y2="336.5" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><text x="658" y="326.5" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">no</text><line x1="60" y1="362.5" x2="60" y2="417" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="74" y="413" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">yes</text><rect x="688" y="286" width="182" height="101" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="779" y="343.5" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">No legal aid</text><rect x="100" y="427" width="530" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="116" y="459.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Does the case pass the merits test?</text><text x="116" y="488.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Prospects of success and likely benefit justify the cost</text><circle cx="60" cy="469" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="477.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><line x1="636" y1="469" x2="680" y2="469" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><text x="658" y="459" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">no</text><rect x="688" y="427" width="182" height="84" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="779" y="476" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">No legal aid</text><rect x="100" y="541" width="530" height="48" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="365" y="569.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Civil legal aid granted</text><line x1="60" y1="521" x2="60" y2="565" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="74" y="543" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">yes</text><line x1="60" y1="565" x2="96" y2="565" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/>
</svg>