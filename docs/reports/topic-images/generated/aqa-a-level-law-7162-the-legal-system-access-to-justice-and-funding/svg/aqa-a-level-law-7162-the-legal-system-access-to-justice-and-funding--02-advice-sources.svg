<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 659" width="900" height="659" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="659" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four sources of free or low-cost advice</text>

<rect x="30" y="100" width="412" height="216" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="130" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">HELP LINES</text><text x="48" y="155.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Government services, charities, insurers,</text><text x="48" y="176.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Acas</text><text x="48" y="203.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Offers:</tspan> telephone and online advice, e.g. Civil</text><text x="48" y="224.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Legal Advice line, Acas for workplace disputes</text><text x="48" y="251.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Limits:</tspan> advice only; may signpost elsewhere;</text><text x="48" y="272.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">quality varies</text><rect x="458" y="100" width="412" height="216" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="476" y="130" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CITIZENS ADVICE</text><text x="476" y="155.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">National charity, local offices, trained</text><text x="476" y="176.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">volunteers</text><text x="476" y="203.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Offers:</tspan> free, confidential advice on debt,</text><text x="476" y="224.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">benefits, housing, employment, consumer</text><text x="476" y="245.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">problems</text><text x="476" y="272.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Limits:</tspan> volunteers generally not lawyers;</text><text x="476" y="293.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">complex cases referred on</text><rect x="30" y="330" width="412" height="195" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="360" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">LAW CENTRES</text><text x="48" y="385.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Independent not-for-profit; first in North</text><text x="48" y="406.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Kensington, 1970</text><text x="48" y="433.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Offers:</tspan> advice and often representation by</text><text x="48" y="454.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">solicitors in social welfare law</text><text x="48" y="481.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Limits:</tspan> concentrated in some areas; many closed</text><text x="48" y="502.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">or reduced</text><rect x="458" y="330" width="412" height="195" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="476" y="360" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">TRADE UNIONS</text><text x="476" y="385.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Unions, for their members</text><text x="476" y="412.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Offers:</tspan> advice and representation in employment</text><text x="476" y="433.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">disputes and workplace injury claims</text><text x="476" y="460.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Limits:</tspan> members only; usually work problems</text><text x="476" y="481.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">only</text><rect x="30" y="547" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="580.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Much free advice depends on charitable or local authority funding, so provision is uneven: some</text><text x="450" y="602.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">areas are <tspan font-weight="700" fill="#1e2a44">“advice</tspan> <tspan font-weight="700" fill="#1e2a44">deserts”</tspan>.</text>
</svg>