<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 534" width="900" height="534" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="534" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Legal expenses insurance: before or after?</text>

<rect x="30" y="100" width="840" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><line x1="60" y1="220" x2="840" y2="220" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="450" y1="150" x2="450" y2="290" stroke="#b5602e" stroke-width="4" stroke-dasharray="10 7"/><text x="450" y="140" font-size="19" font-weight="700" fill="#b5602e" text-anchor="middle">Dispute arises</text><rect x="90" y="194" width="300" height="52" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="240" y="227" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Before-the-event (BTE)</text><rect x="510" y="194" width="300" height="52" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="660" y="227" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">After-the-event (ATE)</text><text x="240" y="280" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">taken out before any dispute</text><text x="660" y="280" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">bought once a dispute exists</text><rect x="30" y="372" width="412" height="130" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="404.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">BTE</text><text x="48" y="433.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="433.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Often a cheap add-on to home or motor</text><text x="63.2" y="454.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">insurance</text><text x="48" y="479.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="479.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Many people have it without realising</text><rect x="458" y="372" width="412" height="130" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="476" y="404.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">ATE</text><text x="476" y="433.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="491.2" y="433.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Mainly covers the risk of paying the other</text><text x="491.2" y="454.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">side’s costs if the claim fails</text><text x="476" y="479.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="491.2" y="479.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Premiums can be high</text>
</svg>