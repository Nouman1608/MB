<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 583" width="900" height="583" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="583" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Listening: you cannot scan back</text>

<rect x="30" y="100" width="270.6666666666667" height="197" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">BEFORE</text><text x="50" y="158.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Read and predict</text><text x="50" y="186.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Read every question,</text><text x="50" y="207.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">underline question words,</text><text x="50" y="228.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">predict the answer type</text><text x="50" y="249.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">(number, place, feeling,</text><text x="50" y="270.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">reason) and likely words.</text><rect x="314.6666666666667" y="100" width="270.6666666666667" height="197" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="334.6666666666667" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DURING</text><text x="334.6666666666667" y="158.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Note, don't write</text><text x="334.6666666666667" y="181.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">sentences</text><text x="334.6666666666667" y="209.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Symbols: ↑ rise, ↓ fall, →</text><text x="334.6666666666667" y="230.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">leads to, ✗ not. Answer in</text><text x="334.6666666666667" y="251.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">order; if you miss one, move</text><text x="334.6666666666667" y="272.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">on.</text><rect x="599.3333333333334" y="100" width="270.6666666666667" height="197" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="619.3333333333334" y="132" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">DISTRACTORS</text><text x="619.3333333333334" y="158.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Changes of mind</text><text x="619.3333333333334" y="186.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Speakers correct themselves,</text><text x="619.3333333333334" y="207.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">give two numbers or mention</text><text x="619.3333333333334" y="228.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">an option only to reject it.</text><rect x="30" y="319" width="840" height="76" rx="14" fill="#eef1f0" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="350.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">When</tspan> <tspan font-weight="700" fill="#1e2a44">did</tspan> <tspan font-weight="700" fill="#1e2a44">the</tspan> <tspan font-weight="700" fill="#1e2a44">device</tspan> <tspan font-weight="700" fill="#1e2a44">first</tspan> <tspan font-weight="700" fill="#1e2a44">work</tspan> <tspan font-weight="700" fill="#1e2a44">for</tspan> <tspan font-weight="700" fill="#1e2a44">a</tspan> <tspan font-weight="700" fill="#1e2a44">whole</tspan> <tspan font-weight="700" fill="#1e2a44">day?</tspan> ARJUN: "We thought we'd have it running in</text><text x="48" y="372.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">March, but the battery kept failing, so it was actually May before it lasted a full day."</text><line x1="100" y1="479" x2="800" y2="479" stroke="#1e2a44" stroke-width="4"/><circle cx="250" cy="479" r="14" fill="#ffffff" stroke="#b5602e" stroke-width="3"/><text x="250" y="485" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">✗</text><text x="250" y="521" font-size="20" font-weight="700" fill="#4a5568" text-anchor="middle">March</text><text x="250" y="545" font-size="16" font-weight="400" fill="#b5602e" text-anchor="middle">"we thought": a plan</text><text x="430" y="469" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">"but" · "actually"</text><circle cx="620" cy="479" r="16" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="620" y="485" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">✓</text><text x="620" y="521" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">May</text><text x="620" y="545" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">the result: the answer</text><line x1="290" y1="479" x2="590" y2="479" stroke="#8a6d0d" stroke-width="3" marker-end="url(#ahO)" stroke-dasharray="8 6"/>
</svg>