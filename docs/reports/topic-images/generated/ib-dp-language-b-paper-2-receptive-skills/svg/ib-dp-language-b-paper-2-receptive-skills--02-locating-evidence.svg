<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 860" width="900" height="860" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="860" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Locating evidence in the text</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">What shows that the writer had gained the owner's trust by the end of the week? [1]</text>
<rect x="30" y="124" width="840" height="209" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="166" font-size="20" font-weight="400" fill="#1e2a44" text-anchor="start">My first week at the harbour café was a disaster. On Monday I </text><text x="60" y="201" font-size="20" font-weight="400" fill="#4a5568" text-anchor="start">dropped a tray of glasses</text><line x1="60" y1="194.6" x2="301.48" y2="194.6" stroke="#b5602e" stroke-width="2.5"/><text x="301.48" y="201" font-size="20" font-weight="400" fill="#1e2a44" text-anchor="start">. On Tuesday I mixed up two orders and a </text><text x="60" y="236" font-size="20" font-weight="400" fill="#1e2a44" text-anchor="start">customer walked out. </text><rect x="266.34000000000003" y="217" width="96.64" height="29" rx="5" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><text x="269.34000000000003" y="236" font-size="20" font-weight="600" fill="#1e2a44" text-anchor="start">By Friday</text><text x="359.98" y="236" font-size="20" font-weight="400" fill="#1e2a44" text-anchor="start">, though, Mrs Adebayo was </text><rect x="57" y="252" width="299.2" height="29" rx="5" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="60" y="271" font-size="20" font-weight="600" fill="#1e2a44" text-anchor="start">letting me close up on my own</text><text x="353.2" y="271" font-size="20" font-weight="400" fill="#1e2a44" text-anchor="start">, which she had never allowed a new </text><text x="60" y="306" font-size="20" font-weight="400" fill="#1e2a44" text-anchor="start">worker to do.</text><line x1="60" y1="375" x2="60" y2="651" stroke="#c9d6d4" stroke-width="4"/><rect x="104" y="355" width="766" height="73" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="116" y="381.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Underline the key words</text><text x="116" y="411.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">trust</tspan>, <tspan font-style="italic">end</tspan> <tspan font-style="italic">of</tspan> <tspan font-style="italic">the</tspan> <tspan font-style="italic">week</tspan></text><circle cx="60" cy="391.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="400.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="104" y="436" width="766" height="73" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="116" y="462.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Think of synonyms first</text><text x="116" y="492.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Expect <tspan font-style="italic">by</tspan> <tspan font-style="italic">Friday</tspan>, <tspan font-style="italic">allowed</tspan>, <tspan font-style="italic">let</tspan>.</text><circle cx="60" cy="472.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="481.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="104" y="517" width="766" height="73" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="116" y="543.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Scan</text><text x="116" y="573.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">"<tspan font-weight="700" fill="#1e2a44">By</tspan> <tspan font-weight="700" fill="#1e2a44">Friday</tspan>" matches <tspan font-style="italic">end</tspan> <tspan font-style="italic">of</tspan> <tspan font-style="italic">the</tspan> <tspan font-style="italic">week</tspan>.</text><circle cx="60" cy="553.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="562.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="104" y="598" width="766" height="73" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="116" y="624.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Read the whole sentence</text><text x="116" y="654.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">The answer sits one clause on: "letting me close up on my own".</text><circle cx="60" cy="634.5" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="643.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="30" y="693" width="448.3636363636363" height="135" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="750.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ANSWER</text><text x="50" y="777.32" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">She let the writer close the café alone.</text><rect x="496.3636363636363" y="693" width="373.6363636363636" height="135" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="516.3636363636363" y="725" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">DISTRACTOR</text><text x="516.3636363636363" y="751.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The dropped tray</text><text x="516.3636363636363" y="781.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Same paragraph, but it answers a</text><text x="516.3636363636363" y="803.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">different question.</text>
</svg>