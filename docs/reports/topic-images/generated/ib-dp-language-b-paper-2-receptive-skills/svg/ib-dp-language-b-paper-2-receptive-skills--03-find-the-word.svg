<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 597" width="900" height="597" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="597" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Find the word that means "delay"</text>

<rect x="30" y="100" width="840" height="133" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="141" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">The council has </text><text x="207.288" y="141" font-size="19" font-weight="400" fill="#4a5568" text-anchor="start">decided</text><line x1="207.288" y1="134.92" x2="279.773" y2="134.92" stroke="#b5602e" stroke-width="2.5"/><text x="285.112" y="141" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">to </text><rect x="305.064" y="123" width="92.849" height="28" rx="5" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="308.064" y="141" font-size="19" font-weight="600" fill="#1e2a44" text-anchor="start">postpone</text><text x="400.252" y="141" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">the new parking rules until spring.</text><text x="60" y="174" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">Residents had complained that the plan was introduced </text><rect x="559.9300000000001" y="156" width="75.16" height="28" rx="5" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><text x="562.9300000000001" y="174" font-size="19" font-weight="600" fill="#1e2a44" text-anchor="start">without</text><rect x="57" y="189" width="119.81" height="28" rx="5" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><text x="60" y="207" font-size="19" font-weight="600" fill="#1e2a44" text-anchor="start">consultation</text><text x="173.81" y="207" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">, and several shopkeepers feared they would lose customers.</text><rect x="30" y="255" width="270.6666666666667" height="153" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="297.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CHECK 1</text><text x="50" y="323.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Match the word class</text><text x="50" y="352.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">"delay" here is a verb, so the</text><text x="50" y="373.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">answer is a verb.</text><rect x="314.6666666666667" y="255" width="270.6666666666667" height="153" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="334.6666666666667" y="287" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CHECK 2</text><text x="334.6666666666667" y="313.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Match the form</text><text x="334.6666666666667" y="341.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">decided</tspan> is past tense, wrong</text><text x="334.6666666666667" y="362.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">form and wrong meaning.</text><text x="334.6666666666667" y="383.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">postpone</tspan> is the base form.</text><rect x="599.3333333333334" y="255" width="270.6666666666667" height="153" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="619.3333333333334" y="287" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CHECK 3</text><text x="619.3333333333334" y="313.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Test it</text><text x="619.3333333333334" y="341.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Put it in the question's</text><text x="619.3333333333334" y="362.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">sentence. If the sentence</text><text x="619.3333333333334" y="383.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">breaks, the word is wrong.</text><rect x="30" y="430" width="395" height="135" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="473.5" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">COPYING</text><text x="50" y="499.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">"introduced without consultation"</text><text x="50" y="529.1" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Shows you found the line.</text><line x1="431" y1="497.5" x2="469" y2="497.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="475" y="430" width="395" height="135" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="495" y="462" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PARAPHRASE</text><text x="495" y="488.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">"Nobody asked them before the plan</text><text x="495" y="511.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">was made."</text><text x="495" y="540.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Shows you understood it.</text>
</svg>