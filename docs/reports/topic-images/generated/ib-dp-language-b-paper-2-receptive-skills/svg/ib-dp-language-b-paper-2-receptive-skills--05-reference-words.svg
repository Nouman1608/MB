<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 538" width="900" height="538" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="538" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What does "they" refer to?</text>

<rect x="30" y="100" width="840" height="230" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="183" font-size="21" font-weight="400" fill="#4a5568" text-anchor="start">Residents</text><line x1="60" y1="176.28" x2="157.398" y2="176.28" stroke="#b5602e" stroke-width="2.5"/><text x="163.299" y="183" font-size="21" font-weight="400" fill="#1e2a44" text-anchor="start">had complained that the plan was introduced without consultation,</text><text x="60" y="247" font-size="21" font-weight="400" fill="#1e2a44" text-anchor="start">and </text><rect x="99.96600000000001" y="227" width="218.289" height="30" rx="5" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="102.96600000000001" y="247" font-size="21" font-weight="600" fill="#1e2a44" text-anchor="start">several shopkeepers</text><text x="321.156" y="247" font-size="21" font-weight="400" fill="#1e2a44" text-anchor="start">feared </text><rect x="388.863" y="227" width="51.024" height="30" rx="5" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><text x="391.863" y="247" font-size="21" font-weight="600" fill="#1e2a44" text-anchor="start">they</text><text x="442.788" y="247" font-size="21" font-weight="400" fill="#1e2a44" text-anchor="start">would lose customers.</text><path d="M414.375,259 C414.375,297 209.1105,297 209.1105,261" fill="none" stroke="#8a6d0d" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahO)"/><text x="466.887" y="293" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="start">✓ they = several shopkeepers</text><path d="M424.375,225 C431.863,129 148.699,129 108.699,159" fill="none" stroke="#b5602e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 6"/><text x="60" y="123" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">✗ not the residents</text><rect x="30" y="352" width="253.33333333333334" height="154" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="156.66666666666669" y="405" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">1</text><text x="156.66666666666669" y="431.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Look before the word</text><text x="156.66666666666669" y="460.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Same or previous sentence</text><line x1="289.33333333333337" y1="429" x2="317.33333333333337" y2="429" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="323.33333333333337" y="352" width="253.33333333333334" height="154" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450.00000000000006" y="384" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">2</text><text x="450.00000000000006" y="410.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Find what agrees</text><text x="450.00000000000006" y="439.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">A plural for <tspan font-style="italic">they</tspan>; use</text><text x="450.00000000000006" y="460.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">gender and number</text><text x="450.00000000000006" y="481.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">endings</text><line x1="582.6666666666667" y1="429" x2="610.6666666666667" y2="429" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="616.6666666666667" y="352" width="253.33333333333334" height="154" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="743.3333333333334" y="394.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">3</text><text x="743.3333333333334" y="421.32" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Replace and reread</text><text x="743.3333333333334" y="450.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">If the meaning holds, you</text><text x="743.3333333333334" y="471.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">are right</text>
</svg>