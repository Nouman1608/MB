<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 551" width="900" height="551" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="551" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Budget time by marks</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Example: a 50-minute practice on a 40-mark reading set</text>
<rect x="50" y="144" width="720" height="56" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><rect x="770" y="144" width="80" height="56" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="410" y="179" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">45 minutes answering</text><text x="850" y="258" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="end">5 minutes checking</text><line x1="50" y1="200" x2="50" y2="210" stroke="#1e2a44" stroke-width="2"/><text x="50" y="230" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">0</text><line x1="210" y1="200" x2="210" y2="210" stroke="#1e2a44" stroke-width="2"/><text x="210" y="230" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">10</text><line x1="370" y1="200" x2="370" y2="210" stroke="#1e2a44" stroke-width="2"/><text x="370" y="230" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">20</text><line x1="530" y1="200" x2="530" y2="210" stroke="#1e2a44" stroke-width="2"/><text x="530" y="230" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">30</text><line x1="690" y1="200" x2="690" y2="210" stroke="#1e2a44" stroke-width="2"/><text x="690" y="230" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">40</text><line x1="850" y1="200" x2="850" y2="210" stroke="#1e2a44" stroke-width="2"/><text x="850" y="230" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">50</text><rect x="30" y="286" width="840" height="62" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="322" font-size="20" font-weight="400" fill="#1e2a44" text-anchor="middle">minutes per mark = (time allowed − checking time) ÷ marks = (50 − 5) ÷ 40 = <tspan font-weight="700" fill="#1e2a44">1.125</tspan></text><rect x="30" y="370" width="270.6666666666667" height="106" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="165.33333333333334" y="413.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">A 4-MARK QUESTION</text><text x="165.33333333333334" y="439.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">4 × 1.125 = 4.5 minutes</text><rect x="314.6666666666667" y="370" width="270.6666666666667" height="106" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="402" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">DO NOT STALL</text><text x="450" y="428.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">After twice its budget,</text><text x="450" y="451.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">mark it and move on</text><rect x="599.3333333333334" y="370" width="270.6666666666667" height="106" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="734.6666666666667" y="402" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">LEAVE NOTHING BLANK</text><text x="734.6666666666667" y="428.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">A reasoned attempt can</text><text x="734.6666666666667" y="451.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">earn a mark</text><text x="450" y="510.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Use your teacher's real timings for your level once you have them.</text>
</svg>