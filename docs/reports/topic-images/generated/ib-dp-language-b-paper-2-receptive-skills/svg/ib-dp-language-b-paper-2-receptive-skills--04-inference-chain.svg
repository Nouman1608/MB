<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Every inference needs three links</text>

<rect x="30" y="100" width="249.33333333333334" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="144" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">QUOTATION</text><text x="50" y="170.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">"I nodded and kept</text><text x="50" y="194.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">smiling"</text><line x1="285.33333333333337" y1="166" x2="319.33333333333337" y2="166" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="325.33333333333337" y="100" width="249.33333333333334" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="345.33333333333337" y="144" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">WHAT IT SAYS</text><text x="345.33333333333337" y="170.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">She agreed on the</text><text x="345.33333333333337" y="194.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">surface</text><line x1="580.6666666666667" y1="166" x2="614.6666666666667" y2="166" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="620.6666666666667" y="100" width="249.33333333333334" height="132" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="640.6666666666667" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">WHAT IT IMPLIES</text><text x="640.6666666666667" y="158.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">She is hiding</text><text x="640.6666666666667" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">disagreement or</text><text x="640.6666666666667" y="206.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">discomfort</text><text x="450" y="268.4" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle"><tspan font-weight="700">Worked</tspan> <tspan font-weight="700">example:</tspan> What does the writer suggest about how official systems treat his identity? [2]</text><rect x="30" y="300" width="249.33333333333334" height="165" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="332" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">QUOTATIONS</text><text x="50" y="357.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">"that is what the register</text><text x="50" y="378.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">says" · "no form has</text><text x="50" y="399.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">ever had room for" ·</text><text x="50" y="420.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">"stopped correcting</text><text x="50" y="441.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">anyone"</text><line x1="285.33333333333337" y1="382.5" x2="319.33333333333337" y2="382.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="325.33333333333337" y="300" width="249.33333333333334" height="165" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="345.33333333333337" y="363.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">LITERAL</text><text x="345.33333333333337" y="388.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">The school list and forms</text><text x="345.33333333333337" y="409.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">use a different name</text><line x1="580.6666666666667" y1="382.5" x2="614.6666666666667" y2="382.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="620.6666666666667" y="300" width="249.33333333333334" height="165" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="640.6666666666667" y="342.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">INFERENCE</text><text x="640.6666666666667" y="367.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Official systems leave no</text><text x="640.6666666666667" y="388.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">space for his real name</text><text x="640.6666666666667" y="409.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">[1]; he has given up</text><text x="640.6666666666667" y="430.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">resisting [1]</text><rect x="30" y="487" width="411" height="108" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="521.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Weaker: "he has two names"</text><text x="50" y="549.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">True, but literal, not an inference about official</text><text x="50" y="570.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">systems.</text><rect x="459" y="487" width="411" height="108" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="479" y="521.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Tone words change attitude</text><text x="479" y="549.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">still,</tspan> <tspan font-style="italic">even,</tspan> <tspan font-style="italic">only,</tspan> <tspan font-style="italic">finally,</tspan> <tspan font-style="italic">supposedly</tspan>: "my</text><text x="479" y="570.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">grandmother <tspan font-weight="700" fill="#1e2a44">still</tspan> calls me" shows loyalty.</text>
</svg>