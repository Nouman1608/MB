<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 646" width="900" height="646" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="646" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Explaining ethnic differences</text>

<rect x="30" y="104" width="410" height="220" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="140.8" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="start">Inside school</text><text x="50" y="170.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="170.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Institutional racism: Gillborn and Youdell</text><text x="65.2" y="191.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(2000), lower exam tiers; Coard (1971)</text><text x="50" y="220.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="220.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Ethnocentric curriculum</text><text x="50" y="249.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="249.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Few role models</text><text x="50" y="278.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="278.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Labelling: more discipline, lower</text><text x="65.2" y="299.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">expectations</text><rect x="460" y="104" width="410" height="220" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="480" y="140.8" font-size="21" font-weight="700" fill="#8a6d0d" text-anchor="start">Outside school</text><text x="480" y="170.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="495.2" y="170.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Linguistic: learning in a second language,</text><text x="495.2" y="191.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">though many catch up</text><text x="480" y="220.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="495.2" y="220.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Higher poverty in some groups limits</text><text x="495.2" y="241.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">resources</text><text x="480" y="270.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="495.2" y="270.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Strong family expectations raise</text><text x="495.2" y="291.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">achievement in others</text><text x="450" y="362" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Ethnic subcultures: pupils respond differently</text><rect x="30" y="388" width="410" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="423.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Fuller (1984)</text><text x="50" y="451.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Black girls in a London school worked hard</text><text x="50" y="472.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">while appearing not to conform</text><rect x="460" y="388" width="410" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="480" y="423.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Sewell (1997)</text><text x="480" y="451.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Black boys ranged from conformists to</text><text x="480" y="472.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">rebels; peer pressure towards tough</text><text x="480" y="493.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">masculinity</text><rect x="30" y="536" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="569.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Patterns vary within groups by class and gender, so ethnicity alone explains little.</text><text x="50" y="591.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Home-based explanations risk cultural stereotyping.</text>
</svg>