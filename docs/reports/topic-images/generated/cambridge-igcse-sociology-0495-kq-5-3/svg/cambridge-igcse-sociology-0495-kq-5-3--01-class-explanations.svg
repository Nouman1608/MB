<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 905" width="900" height="905" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="905" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Explaining class differences in achievement</text>

<text x="232" y="132" font-size="21" font-weight="700" fill="#8a6d0d" text-anchor="middle">Outside school</text><text x="667" y="132" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="middle">Inside school</text><rect x="30" y="150" width="405" height="108" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="184.4" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="start">Material factors</text><text x="50" y="212.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Less digital technology, books, study space;</text><text x="50" y="233.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">diet, housing, caring or work</text><rect x="30" y="268" width="405" height="108" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="302.4" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="start">Cultural capital</text><text x="50" y="330.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Bourdieu: knowledge, tastes and attitudes</text><text x="50" y="351.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">schools reward</text><rect x="30" y="386" width="405" height="108" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="420.4" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="start">Home, community, social factors</text><text x="50" y="448.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Douglas (1964): parental interest; social</text><text x="50" y="469.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">capital such as contacts</text><rect x="30" y="504" width="405" height="87" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="538.4" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="start">Linguistic factors</text><text x="50" y="566.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Bernstein: restricted and elaborated codes</text><rect x="465" y="150" width="405" height="108" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="485" y="184.4" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Labelling theory</text><text x="485" y="212.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Becker: the “ideal pupil”; self-fulfilling</text><text x="485" y="233.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">prophecy</text><rect x="465" y="268" width="405" height="108" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="485" y="302.4" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Pro- and anti-school subcultures</text><text x="485" y="330.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Hargreaves (1967): lower-stream boys gained</text><text x="485" y="351.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">status by rejecting school</text><rect x="465" y="386" width="405" height="108" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="485" y="420.4" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Selective and private education</text><text x="485" y="448.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Tests and fees favour money and cultural</text><text x="485" y="469.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">capital</text><rect x="465" y="504" width="405" height="108" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="485" y="538.4" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Marxist explanations</text><text x="485" y="566.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Bowles and Gintis: class reproduced behind</text><text x="485" y="587.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the myth of meritocracy</text><rect x="30" y="628" width="272" height="129" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="661" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">LIMITATION</text><text x="50" y="690.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Material and cultural</text><text x="50" y="711.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">explanations risk blaming</text><text x="50" y="732.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the home</text><rect x="314" y="628" width="272" height="129" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="334" y="661" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">LIMITATION</text><text x="334" y="690.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Labelling is deterministic:</text><text x="334" y="711.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">some pupils reject the label</text><rect x="598" y="628" width="272" height="129" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="618" y="661" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">EVALUATION</text><text x="618" y="690.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Factors interact: poverty</text><text x="618" y="711.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">limits cultural capital as</text><text x="618" y="732.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">well as resources</text><rect x="30" y="769" width="840" height="108" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="803.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Compensatory education</text><text x="50" y="831.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Head Start (United States) and Sure Start (United Kingdom) aimed to offset early disadvantage</text><text x="50" y="852.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">with extra support for young children and families.</text>
</svg>