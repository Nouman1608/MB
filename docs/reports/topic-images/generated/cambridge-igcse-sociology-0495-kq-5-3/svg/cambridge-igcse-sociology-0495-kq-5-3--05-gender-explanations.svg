<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 579" width="900" height="579" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="579" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why girls often outperform boys at school</text>

<rect x="30" y="104" width="410" height="220" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="140.8" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="start">Helping girls</text><text x="50" y="170.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="170.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Socialisation: encouraged to be quiet,</text><text x="65.2" y="191.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">careful, to read</text><text x="50" y="220.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="220.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Labelled as hard-working</text><text x="50" y="249.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="249.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Sharpe: 1990s girls put careers and</text><text x="65.2" y="270.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">independence first</text><text x="50" y="299.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="299.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Equal access to education</text><rect x="460" y="104" width="410" height="220" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="480" y="140.8" font-size="21" font-weight="700" fill="#8a6d0d" text-anchor="start">Holding some boys back</text><text x="480" y="170.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="495.2" y="170.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">More freedom outside the home</text><text x="480" y="199.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="495.2" y="199.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Teachers may tolerate disruption, expect</text><text x="495.2" y="220.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">less written work</text><text x="480" y="249.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="495.2" y="249.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Mac an Ghaill (1994): “macho lads” saw</text><text x="495.2" y="270.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">schoolwork as unmasculine</text><rect x="30" y="342" width="840" height="109" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="377.2" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">Feminist explanations</text><text x="50" y="405.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Patriarchy still shapes subject choice and careers; high school achievement does not always bring</text><text x="50" y="426.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">equal pay or leadership. Where girls are kept out of school, they achieve less.</text><rect x="30" y="469" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="502.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Evaluation: working-class and minority girls may underachieve, and middle-class boys still</text><text x="50" y="524.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">do well.</text>
</svg>