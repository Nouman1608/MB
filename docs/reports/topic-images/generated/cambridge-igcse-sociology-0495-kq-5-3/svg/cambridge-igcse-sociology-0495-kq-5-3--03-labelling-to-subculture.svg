<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 702" width="900" height="702" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="702" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">From label to subculture</text>

<rect x="30" y="104" width="840" height="89" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="139.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Teacher judges against the “ideal pupil”</text><text x="450" y="168.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">Becker: middle-class pupils fit the image most closely</text><line x1="450" y1="198" x2="450" y2="226" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="231" width="840" height="89" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="266.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Label applied</text><text x="450" y="295.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">Pupils are seen and treated in terms of the label</text><line x1="450" y1="325" x2="450" y2="353" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="358" width="840" height="89" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="393.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Self-fulfilling prophecy</text><text x="450" y="422.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">Pupils live up, or down, to the label</text><line x1="450" y1="452" x2="450" y2="480" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="485" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="450" y="520.2" font-size="19" font-weight="700" fill="#b5602e" text-anchor="middle">Anti-school subculture</text><text x="450" y="549.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">Hargreaves (1967): lower-stream boys gained status by rejecting school values</text><rect x="30" y="592" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="625.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Limitation: labelling theory is criticised for determinism, since some labelled pupils</text><text x="50" y="647.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">reject the label.</text>
</svg>