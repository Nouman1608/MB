<rect width="900" height="584" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Global differences in achievement</text>

<line x1="310" y1="166" x2="371.8" y2="240.1" stroke="#1e2a44" stroke-width="2.5"/><line x1="310" y1="280" x2="371.8" y2="280" stroke="#1e2a44" stroke-width="2.5"/><line x1="310" y1="394" x2="371.8" y2="319.9" stroke="#1e2a44" stroke-width="2.5"/><line x1="590" y1="154" x2="528.2" y2="235.9" stroke="#1e2a44" stroke-width="2.5"/><line x1="590" y1="268" x2="528.2" y2="275.8" stroke="#1e2a44" stroke-width="2.5"/><line x1="590" y1="394" x2="528.2" y2="319.9" stroke="#1e2a44" stroke-width="2.5"/><circle cx="450" cy="280" r="92" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="255.125" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Lower</text><text x="450" y="276.375" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">enrolment,</text><text x="450" y="297.625" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">completion and</text><text x="450" y="318.875" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">literacy</text><g transform="translate(0,12)"><rect x="30" y="104" width="280" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="134.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Availability of schools</text><text x="46" y="162.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Long distances in rural areas</text><text x="46" y="183.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">reduce attendance</text><rect x="30" y="218" width="280" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="248.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Poverty and wealth</text><text x="46" y="276.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Fees, uniforms, lost income</text><text x="46" y="297.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">from child labour</text><rect x="30" y="332" width="280" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="362.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Access for girls</text><text x="46" y="390.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Early marriage, domestic work,</text><text x="46" y="411.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">safety concerns</text></g><g transform="translate(0,0)"><rect x="590" y="104" width="280" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="606" y="134.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Class sizes</text><text x="606" y="162.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Very large classes limit</text><text x="606" y="183.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">individual attention</text><rect x="590" y="218" width="280" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="606" y="248.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Norms and values</text><text x="606" y="276.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Beliefs about education and</text><text x="606" y="297.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">girls’ roles</text><rect x="590" y="332" width="280" height="124" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="606" y="362.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Internet and digital</text><text x="606" y="386.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">resources</text><text x="606" y="414.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The digital divide limits</text><text x="606" y="435.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">online learning</text></g><rect x="30" y="474" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="507.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Evaluation: global explanations can overgeneralise. There are large inequalities within</text><text x="50" y="529.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">countries, and some lower-income societies achieve strong outcomes.</text>
</svg>