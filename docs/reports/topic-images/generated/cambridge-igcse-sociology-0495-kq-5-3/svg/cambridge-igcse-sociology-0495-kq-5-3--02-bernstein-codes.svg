<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 510" width="900" height="510" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="510" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Bernstein: speech codes and school</text>

<rect x="30" y="110" width="405" height="110" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="154" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">RESTRICTED CODE</text><text x="50" y="181.8" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Short, context-bound speech</text><rect x="465" y="110" width="405" height="110" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="485" y="154" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ELABORATED CODE</text><text x="485" y="181.8" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Detailed, explicit speech</text><line x1="667" y1="226" x2="667" y2="276" stroke="#2e6b62" stroke-width="5" marker-end="url(#ahT)"/><rect x="30" y="282" width="840" height="70" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="322" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Schools use the elaborated code</text><line x1="450" y1="356" x2="450" y2="396" stroke="#1e2a44" stroke-width="5" marker-end="url(#ah)"/><rect x="30" y="402" width="840" height="80" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="433.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Middle-class children are more likely to learn it at home</text><text x="450" y="461.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">so they start with an advantage in the classroom</text>
</svg>