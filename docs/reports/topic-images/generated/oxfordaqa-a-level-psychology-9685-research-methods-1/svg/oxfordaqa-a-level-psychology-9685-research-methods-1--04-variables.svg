<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 692" width="900" height="692" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="692" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Variables and operationalisation</text>

<rect x="30" y="120" width="250" height="100" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="155" y="160" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">IV: MANIPULATED</text><text x="155" y="186.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Music or silence</text><rect x="620" y="120" width="250" height="100" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="745" y="160" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">DV: MEASURED</text><text x="745" y="186.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Words recalled</text><line x1="286" y1="170" x2="614" y2="170" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><text x="450" y="158" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">effect?</text><rect x="300" y="250" width="300" height="128" rx="14" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5"/><text x="450" y="282" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">EXTRANEOUS VARIABLES</text><text x="450" y="307.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Could also affect the DV</text><text x="450" y="334" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">control: standardised instructions,</text><text x="450" y="354" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">same room, same time of day</text><line x1="500" y1="246" x2="640" y2="226" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)" stroke-dasharray="7 5"/><rect x="30" y="400" width="250" height="90" rx="14" fill="#eef1f0" stroke="#c9d6d4" stroke-width="2.5"/><text x="155" y="450.16" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">“Memory”</text><rect x="340" y="400" width="530" height="106" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="360" y="432" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">OPERATIONALISED</text><text x="360" y="458.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The number of words correctly recalled from a list of 20</text><text x="360" y="481.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">within two minutes</text><line x1="286" y1="445" x2="334" y2="445" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="30" y="528" width="413" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="560" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DEMAND CHARACTERISTICS</text><text x="50" y="586.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Cues that let participants guess the aim</text><text x="50" y="614.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Reduce: keep the aim until the debrief;</text><text x="50" y="635.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">independent groups so each sees one condition</text><rect x="457" y="528" width="413" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="560" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">BEHAVIOURAL CATEGORIES</text><text x="477" y="586.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">“Aggression” → hitting, pushing, shouting</text><text x="477" y="614.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Clearly defined, observable, not overlapping</text>
</svg>