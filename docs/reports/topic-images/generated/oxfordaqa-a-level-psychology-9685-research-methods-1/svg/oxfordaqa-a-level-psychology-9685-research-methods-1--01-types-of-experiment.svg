<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 677" width="900" height="677" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="677" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three types of experiment</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Who controls the IV, and where?</text>
<rect x="30" y="124" width="270.6666666666667" height="226" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">LABORATORY</text><text x="50" y="182.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Controlled setting;</text><text x="50" y="205.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">researcher manipulates</text><text x="50" y="228.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">the IV</text><text x="50" y="256.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">+ High control: cause and</text><text x="50" y="277.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">effect; easy to replicate</text><text x="50" y="304.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">− Artificial; demand</text><text x="50" y="325.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">characteristics</text><rect x="314.6666666666667" y="124" width="270.6666666666667" height="226" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="334.6666666666667" y="156" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">FIELD</text><text x="334.6666666666667" y="182.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Natural setting;</text><text x="334.6666666666667" y="205.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">researcher still</text><text x="334.6666666666667" y="228.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">manipulates the IV</text><text x="334.6666666666667" y="256.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">+ More natural behaviour</text><text x="334.6666666666667" y="283.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">− Less control; consent may</text><text x="334.6666666666667" y="304.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">be difficult</text><rect x="599.3333333333334" y="124" width="270.6666666666667" height="226" rx="14" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5"/><text x="619.3333333333334" y="156" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">NATURAL</text><text x="619.3333333333334" y="182.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The IV varies naturally,</text><text x="619.3333333333334" y="205.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">e.g. a new school policy</text><text x="619.3333333333334" y="233.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">+ Variables that could not</text><text x="619.3333333333334" y="254.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">ethically be manipulated</text><text x="619.3333333333334" y="281.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">− No random allocation:</text><text x="619.3333333333334" y="302.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">groups may differ</text><line x1="80" y1="402" x2="820" y2="402" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ah)"/><text x="80" y="434" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">more control</text><text x="820" y="434" font-size="16" font-weight="700" fill="#b5602e" text-anchor="end">more natural</text><text x="450" y="476" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">OTHER METHODS</text><rect x="30" y="498" width="272" height="147" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="526" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">OBSERVATION</text><text x="46" y="557" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="60.25" y="557" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Naturalistic or controlled</text><text x="46" y="581" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="60.25" y="581" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Covert or overt</text><text x="46" y="605" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="60.25" y="605" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Participant or non-participant</text><rect x="314" y="498" width="272" height="147" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="330" y="526" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SELF-REPORT</text><text x="330" y="557" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="344.25" y="557" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Questionnaires: quick, many</text><text x="344.25" y="577" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">people; social desirability</text><text x="330" y="601" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="344.25" y="601" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Structured interviews: easy to</text><text x="344.25" y="621" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">compare; unstructured: richer</text><rect x="598" y="498" width="272" height="147" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="614" y="526" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CORRELATION</text><text x="614" y="557" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="628.25" y="557" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Two co-variables measured,</text><text x="628.25" y="577" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">not manipulated</text><text x="614" y="601" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="628.25" y="601" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Positive, negative or zero</text><text x="614" y="625" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="628.25" y="625" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">No cause and effect</text>
</svg>