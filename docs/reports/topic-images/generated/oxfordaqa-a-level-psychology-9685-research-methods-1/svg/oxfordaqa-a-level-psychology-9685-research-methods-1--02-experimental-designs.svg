<rect width="900" height="634" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three experimental designs</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Each has a strength and a weakness</text>
<rect x="30" y="124" width="840" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="158" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Independent groups</text><text x="80" y="194" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">A</text><text x="80" y="240" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">B</text><circle cx="110" cy="188" r="11" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><circle cx="110" cy="234" r="11" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><circle cx="142" cy="188" r="11" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><circle cx="142" cy="234" r="11" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><circle cx="174" cy="188" r="11" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><circle cx="174" cy="234" r="11" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><circle cx="206" cy="188" r="11" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><circle cx="206" cy="234" r="11" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><circle cx="238" cy="188" r="11" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><circle cx="238" cy="234" r="11" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><circle cx="270" cy="188" r="11" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><circle cx="270" cy="234" r="11" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="470" y="158" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">WEAKNESS</text><text x="470" y="180" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Participant variables may differ between groups</text><text x="470" y="222" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FIX</text><text x="470" y="244" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Random</tspan> <tspan font-weight="700">allocation</tspan></text><rect x="30" y="288" width="840" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="322" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Repeated measures</text><text x="80" y="358" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">A</text><text x="80" y="404" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">B</text><circle cx="110" cy="352" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="110" cy="398" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="142" cy="352" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="142" cy="398" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="174" cy="352" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="174" cy="398" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="206" cy="352" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="206" cy="398" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="238" cy="352" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="238" cy="398" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="270" cy="352" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="270" cy="398" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><path d="M300,358 q20,22 0,40" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><text x="320" y="384" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">same people</text><text x="470" y="322" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">WEAKNESS</text><text x="470" y="344" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Order effects: practice, fatigue</text><text x="470" y="386" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FIX</text><text x="470" y="408" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Counterbalancing</tspan>: half A then B, half B then A</text><rect x="30" y="452" width="840" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="486" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Matched pairs</text><text x="80" y="522" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">A</text><text x="80" y="568" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">B</text><line x1="110" y1="527" x2="110" y2="551" stroke="#1e2a44" stroke-width="2" stroke-dasharray="4 3"/><circle cx="110" cy="516" r="11" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><circle cx="110" cy="562" r="11" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><line x1="142" y1="527" x2="142" y2="551" stroke="#1e2a44" stroke-width="2" stroke-dasharray="4 3"/><circle cx="142" cy="516" r="11" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><circle cx="142" cy="562" r="11" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><line x1="174" y1="527" x2="174" y2="551" stroke="#1e2a44" stroke-width="2" stroke-dasharray="4 3"/><circle cx="174" cy="516" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="174" cy="562" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><line x1="206" y1="527" x2="206" y2="551" stroke="#1e2a44" stroke-width="2" stroke-dasharray="4 3"/><circle cx="206" cy="516" r="11" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><circle cx="206" cy="562" r="11" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><line x1="238" y1="527" x2="238" y2="551" stroke="#1e2a44" stroke-width="2" stroke-dasharray="4 3"/><circle cx="238" cy="516" r="11" fill="#efdfa8" stroke="#1e2a44" stroke-width="2"/><circle cx="238" cy="562" r="11" fill="#efdfa8" stroke="#1e2a44" stroke-width="2"/><line x1="270" y1="527" x2="270" y2="551" stroke="#1e2a44" stroke-width="2" stroke-dasharray="4 3"/><circle cx="270" cy="516" r="11" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2"/><circle cx="270" cy="562" r="11" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2"/><text x="300" y="548" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">matched, e.g. on IQ</text><text x="470" y="486" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">WEAKNESS</text><text x="470" y="508" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Time-consuming; matching never perfect</text><text x="470" y="550" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STRENGTH</text><text x="470" y="572" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Reduces participant variables <tspan font-weight="700">without</tspan> <tspan font-weight="700">order</tspan></text><text x="470" y="593" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">effects</tspan></text>
</svg>