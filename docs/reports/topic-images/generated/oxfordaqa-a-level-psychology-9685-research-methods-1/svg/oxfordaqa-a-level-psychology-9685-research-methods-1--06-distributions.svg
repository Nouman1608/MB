<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 870" width="900" height="870" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="870" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Normal and skewed distributions</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Illustrative curves: where the mean, median and mode fall</text>
<rect x="30" y="124" width="268" height="300" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="164" y="158" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Normal</text><line x1="54" y1="344" x2="274" y2="344" stroke="#1e2a44" stroke-width="2.5"/><path d="M54,344 C114,344 134,204 164,204 C194,204 214,344 274,344 Z" fill="#dce9e7" stroke="#2e6b62" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><line x1="164" y1="344" x2="164" y2="194" stroke="#1e2a44" stroke-width="2.5" stroke-dasharray="6 4"/><text x="164" y="374" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">mean = median = mode</text><text x="164" y="398" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">symmetrical, bell-shaped</text><rect x="316" y="124" width="268" height="300" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="158" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Positive skew</text><line x1="340" y1="344" x2="560" y2="344" stroke="#1e2a44" stroke-width="2.5"/><path d="M340,344 C360,344 380,204 400,204 C440,204 470,324 560,344 Z" fill="#dce9e7" stroke="#2e6b62" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><line x1="400" y1="344" x2="400" y2="194" stroke="#8a6d0d" stroke-width="2.5" stroke-dasharray="6 4"/><line x1="422" y1="344" x2="422" y2="200" stroke="#1e2a44" stroke-width="2.5" stroke-dasharray="6 4"/><line x1="444" y1="344" x2="444" y2="206" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="6 4"/><text x="450" y="374" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">tail of high scores (right)</text><text x="450" y="398" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">mean above the median</text><rect x="602" y="124" width="268" height="300" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="736" y="158" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Negative skew</text><line x1="626" y1="344" x2="846" y2="344" stroke="#1e2a44" stroke-width="2.5"/><path d="M626,344 C716,324 746,204 786,204 C806,204 826,344 846,344 Z" fill="#dce9e7" stroke="#2e6b62" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><line x1="786" y1="344" x2="786" y2="194" stroke="#8a6d0d" stroke-width="2.5" stroke-dasharray="6 4"/><line x1="764" y1="344" x2="764" y2="200" stroke="#1e2a44" stroke-width="2.5" stroke-dasharray="6 4"/><line x1="742" y1="344" x2="742" y2="206" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="6 4"/><text x="736" y="374" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">tail of low scores (left)</text><text x="736" y="398" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">mean below the median</text><line x1="250" y1="458" x2="284" y2="458" stroke="#8a6d0d" stroke-width="3" stroke-dasharray="6 4"/><text x="294" y="464" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">mode</text><line x1="400" y1="458" x2="434" y2="458" stroke="#1e2a44" stroke-width="3" stroke-dasharray="6 4"/><text x="444" y="464" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">median</text><line x1="550" y1="458" x2="584" y2="458" stroke="#b5602e" stroke-width="3" stroke-dasharray="6 4"/><text x="594" y="464" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">mean</text><clipPath id="tc492"><rect x="30" y="492" width="840" height="346" rx="14"/></clipPath><g clip-path="url(#tc492)"><rect x="30" y="492" width="200" height="48" fill="#b5d3cf"/><text x="44" y="519.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Measure</text><rect x="230" y="492" width="320" height="48" fill="#b5d3cf"/><text x="244" y="519.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">What it is</text><rect x="550" y="492" width="320" height="48" fill="#b5d3cf"/><text x="564" y="519.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Point to remember</text><rect x="30" y="540" width="200" height="68" fill="#dce9e7"/><text x="44" y="566.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Mean</text><rect x="230" y="540" width="320" height="68" fill="#ffffff"/><text x="244" y="566.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Total divided by number of scores</text><rect x="550" y="540" width="320" height="68" fill="#ffffff"/><text x="564" y="566.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Uses all the data; distorted by extreme</text><text x="564" y="587.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">scores</text><line x1="30" y1="608" x2="870" y2="608" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="608" width="200" height="47" fill="#dce9e7"/><text x="44" y="634.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Median</text><rect x="230" y="608" width="320" height="47" fill="#f8faf9"/><text x="244" y="634.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Middle value when ordered</text><rect x="550" y="608" width="320" height="47" fill="#f8faf9"/><text x="564" y="634.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Unaffected by extreme scores</text><line x1="30" y1="655" x2="870" y2="655" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="655" width="200" height="68" fill="#dce9e7"/><text x="44" y="681.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Mode</text><rect x="230" y="655" width="320" height="68" fill="#ffffff"/><text x="244" y="681.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Most frequent value</text><rect x="550" y="655" width="320" height="68" fill="#ffffff"/><text x="564" y="681.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Suits categorical data; may not be</text><text x="564" y="702.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">unique</text><line x1="30" y1="723" x2="870" y2="723" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="723" width="200" height="47" fill="#dce9e7"/><text x="44" y="749.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Range</text><rect x="230" y="723" width="320" height="47" fill="#f8faf9"/><text x="244" y="749.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Highest minus lowest</text><rect x="550" y="723" width="320" height="47" fill="#f8faf9"/><text x="564" y="749.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Quick; distorted by extreme scores</text><line x1="30" y1="770" x2="870" y2="770" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="770" width="200" height="68" fill="#dce9e7"/><text x="44" y="796.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Standard deviation</text><rect x="230" y="770" width="320" height="68" fill="#ffffff"/><text x="244" y="796.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Average spread around the mean</text><rect x="550" y="770" width="320" height="68" fill="#ffffff"/><text x="564" y="796.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Larger value = scores more spread</text><text x="564" y="817.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">out</text></g><line x1="230" y1="492" x2="230" y2="838" stroke="#c9d6d4" stroke-width="1.5"/><line x1="550" y1="492" x2="550" y2="838" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="492" width="840" height="346" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/>
</svg>