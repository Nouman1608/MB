<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 604" width="900" height="604" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="604" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Seven ethical issues</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Named in the specification</text>
<rect x="30" y="124" width="413" height="103" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="152" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CONSENT</text><text x="46" y="178.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Agree, knowing what is involved</text><text x="46" y="206.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">consent form; parental consent for children</text><rect x="457" y="124" width="413" height="103" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="473" y="152" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">DECEPTION</text><text x="473" y="178.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Misleading about the aim</text><text x="473" y="206.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">only when necessary; full debrief</text><rect x="30" y="239" width="413" height="103" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="267" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DEBRIEF</text><text x="46" y="293.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Explain the true aim at the end</text><text x="46" y="321.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">reassure; offer to withdraw data</text><rect x="457" y="239" width="413" height="103" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="473" y="267" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">RIGHT TO WITHDRAW</text><text x="473" y="293.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Leave at any time, no penalty</text><text x="473" y="321.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">stated clearly at the start</text><rect x="30" y="354" width="413" height="103" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="382" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PROTECTION FROM HARM</text><text x="46" y="408.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">No more risk than everyday life</text><text x="46" y="436.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">stop if distressed; offer support</text><rect x="457" y="354" width="413" height="103" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="473" y="382" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CONFIDENTIALITY</text><text x="473" y="408.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Data secure, not identifiable</text><text x="473" y="436.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">numbers instead of names</text><rect x="30" y="469" width="413" height="103" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="497" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PRIVACY</text><text x="46" y="523.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Not where people expect privacy</text><text x="46" y="551.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">observe only in public places</text><rect x="457" y="469" width="413" height="103" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="473" y="497" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">FOR EACH ISSUE, KNOW</text><text x="473" y="523.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">What it means</text><text x="473" y="551.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">and how researchers deal with it</text>
</svg>