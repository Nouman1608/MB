<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 740" width="900" height="740" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="740" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Command terms: a rising ladder</text>

<rect x="40" y="438" width="205" height="92" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="142.5" y="470" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">state / define</text><text x="142.5" y="496" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">a precise recalled</text><text x="142.5" y="515" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">fact</text><rect x="245" y="346" width="205" height="184" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="347.5" y="378" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">describe</text><text x="347.5" y="404" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">an accurate account of</text><text x="347.5" y="423" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">a pattern or process,</text><text x="347.5" y="442" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">without explanation</text><rect x="450" y="254" width="205" height="276" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="552.5" y="286" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">explain</text><text x="552.5" y="312" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">a reasoned account of</text><text x="552.5" y="331" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">why it happens, often</text><text x="552.5" y="350" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">backed by a named law</text><text x="552.5" y="369" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">or principle</text><rect x="655" y="162" width="205" height="368" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="757.5" y="194" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">evaluate / discuss</text><text x="757.5" y="220" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">weigh the strength of</text><text x="757.5" y="239" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">a model, method or</text><text x="757.5" y="258" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">conclusion, including</text><text x="757.5" y="277" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">its limitations</text><line x1="40" y1="560" x2="860" y2="560" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="450" y="588" font-size="17" font-weight="600" fill="#4a5568" text-anchor="middle">rising demand of the question</text><rect x="40" y="610" width="820" height="108" rx="14" fill="#fbeee6" stroke="#b5602e" stroke-width="2.5"/><text x="64" y="644" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">Common error with “explain”</text><text x="64" y="672" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Stating and applying a formula is not enough: full marks typically also need</text><text x="64" y="695" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">the physical reasoning the formula represents, not just the calculation.</text>
</svg>