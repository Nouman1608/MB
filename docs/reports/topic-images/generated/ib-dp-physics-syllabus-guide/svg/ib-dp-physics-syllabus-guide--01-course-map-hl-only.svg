<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The five themes and their sub-topics</text>

<rect x="250" y="107" width="70" height="26" rx="8" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="1.8" stroke-dasharray="6 4"/><rect x="256" y="109" width="32.379999999999995" height="22" rx="11" fill="#d4b02e" stroke="#8a6d0d" stroke-width="1.5"/><text x="272.19" y="125" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">HL</text><text x="332" y="125" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">HL-only sub-topic (not part of SL)</text><rect x="30" y="150" width="840" height="147" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="188" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">A  Space, time and motion</text><rect x="46" y="205" width="156.56" height="34" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="1.8"/><text x="59" y="227.76" font-size="16" font-weight="500" fill="#1e2a44" text-anchor="start">A.1 Kinematics</text><rect x="212.56" y="205" width="237.92" height="34" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="1.8"/><text x="225.56" y="227.76" font-size="16" font-weight="500" fill="#1e2a44" text-anchor="start">A.2 Forces and momentum</text><rect x="460.48" y="205" width="265.03999999999996" height="34" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="1.8"/><text x="473.48" y="227.76" font-size="16" font-weight="500" fill="#1e2a44" text-anchor="start">A.3 Work, energy and power</text><rect x="46" y="249" width="285.34" height="34" rx="8" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="1.8" stroke-dasharray="6 4"/><rect x="55" y="255" width="32.379999999999995" height="22" rx="11" fill="#d4b02e" stroke="#8a6d0d" stroke-width="1.5"/><text x="71.19" y="271" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">HL</text><text x="97.38" y="271.76" font-size="16" font-weight="500" fill="#1e2a44" text-anchor="start">A.4 Rigid body mechanics</text><rect x="341.34" y="249" width="384.78" height="34" rx="8" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="1.8" stroke-dasharray="6 4"/><rect x="350.34" y="255" width="32.379999999999995" height="22" rx="11" fill="#d4b02e" stroke="#8a6d0d" stroke-width="1.5"/><text x="366.53" y="271" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">HL</text><text x="392.71999999999997" y="271.76" font-size="16" font-weight="500" fill="#1e2a44" text-anchor="start">A.5 Galilean and special relativity</text><rect x="30" y="313" width="840" height="147" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="351" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">B  The particulate nature of matter</text><rect x="46" y="368" width="283.12" height="34" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="1.8"/><text x="59" y="390.76" font-size="16" font-weight="500" fill="#1e2a44" text-anchor="start">B.1 Thermal energy transfers</text><rect x="339.12" y="368" width="219.83999999999997" height="34" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="1.8"/><text x="352.12" y="390.76" font-size="16" font-weight="500" fill="#1e2a44" text-anchor="start">B.2 Greenhouse effect</text><rect x="568.96" y="368" width="138.48" height="34" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="1.8"/><text x="581.96" y="390.76" font-size="16" font-weight="500" fill="#1e2a44" text-anchor="start">B.3 Gas laws</text><rect x="46" y="412" width="231.09999999999997" height="34" rx="8" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="1.8" stroke-dasharray="6 4"/><rect x="55" y="418" width="32.379999999999995" height="22" rx="11" fill="#d4b02e" stroke="#8a6d0d" stroke-width="1.5"/><text x="71.19" y="434" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">HL</text><text x="97.38" y="434.76" font-size="16" font-weight="500" fill="#1e2a44" text-anchor="start">B.4 Thermodynamics</text><rect x="287.09999999999997" y="412" width="246.95999999999998" height="34" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="1.8"/><text x="300.09999999999997" y="434.76" font-size="16" font-weight="500" fill="#1e2a44" text-anchor="start">B.5 Current and circuits</text><rect x="30" y="476" width="840" height="147" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="514" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">C  Wave behaviour</text><rect x="46" y="531" width="265.03999999999996" height="34" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="1.8"/><text x="59" y="553.76" font-size="16" font-weight="500" fill="#1e2a44" text-anchor="start">C.1 Simple harmonic motion</text><rect x="321.03999999999996" y="531" width="156.56" height="34" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="1.8"/><text x="334.03999999999996" y="553.76" font-size="16" font-weight="500" fill="#1e2a44" text-anchor="start">C.2 Wave model</text><rect x="487.59999999999997" y="531" width="192.71999999999997" height="34" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="1.8"/><text x="500.59999999999997" y="553.76" font-size="16" font-weight="500" fill="#1e2a44" text-anchor="start">C.3 Wave phenomena</text><rect x="46" y="575" width="319.28" height="34" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="1.8"/><text x="59" y="597.76" font-size="16" font-weight="500" fill="#1e2a44" text-anchor="start">C.4 Standing waves and resonance</text><rect x="375.28" y="575" width="192.71999999999997" height="34" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="1.8"/><text x="388.28" y="597.76" font-size="16" font-weight="500" fill="#1e2a44" text-anchor="start">C.5 Doppler effect</text><rect x="30" y="639" width="840" height="147" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="677" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">D  Fields</text><rect x="46" y="694" width="246.95999999999998" height="34" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="1.8"/><text x="59" y="716.76" font-size="16" font-weight="500" fill="#1e2a44" text-anchor="start">D.1 Gravitational fields</text><rect x="302.96" y="694" width="319.28" height="34" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="1.8"/><text x="315.96" y="716.76" font-size="16" font-weight="500" fill="#1e2a44" text-anchor="start">D.2 Electric and magnetic fields</text><rect x="46" y="738" width="355.43999999999994" height="34" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="1.8"/><text x="59" y="760.76" font-size="16" font-weight="500" fill="#1e2a44" text-anchor="start">D.3 Motion in electromagnetic fields</text><rect x="411.43999999999994" y="738" width="185.89999999999998" height="34" rx="8" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="1.8" stroke-dasharray="6 4"/><rect x="420.43999999999994" y="744" width="32.379999999999995" height="22" rx="11" fill="#d4b02e" stroke="#8a6d0d" stroke-width="1.5"/><text x="436.62999999999994" y="760" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">HL</text><text x="462.81999999999994" y="760.76" font-size="16" font-weight="500" fill="#1e2a44" text-anchor="start">D.4 Induction</text><rect x="30" y="802" width="840" height="147" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="840" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">E  Nuclear and quantum physics</text><rect x="46" y="857" width="255.99999999999997" height="34" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="1.8"/><text x="59" y="879.76" font-size="16" font-weight="500" fill="#1e2a44" text-anchor="start">E.1 Structure of the atom</text><rect x="312" y="857" width="240.14" height="34" rx="8" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="1.8" stroke-dasharray="6 4"/><rect x="321" y="863" width="32.379999999999995" height="22" rx="11" fill="#d4b02e" stroke="#8a6d0d" stroke-width="1.5"/><text x="337.19" y="879" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">HL</text><text x="363.38" y="879.76" font-size="16" font-weight="500" fill="#1e2a44" text-anchor="start">E.2 Quantum physics</text><rect x="562.14" y="857" width="219.83999999999997" height="34" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="1.8"/><text x="575.14" y="879.76" font-size="16" font-weight="500" fill="#1e2a44" text-anchor="start">E.3 Radioactive decay</text><rect x="46" y="901" width="129.44" height="34" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="1.8"/><text x="59" y="923.76" font-size="16" font-weight="500" fill="#1e2a44" text-anchor="start">E.4 Fission</text><rect x="185.44" y="901" width="210.79999999999998" height="34" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="1.8"/><text x="198.44" y="923.76" font-size="16" font-weight="500" fill="#1e2a44" text-anchor="start">E.5 Fusion and stars</text><text x="450" y="983" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">HL extensions also run inside other sub-topics.</text>
