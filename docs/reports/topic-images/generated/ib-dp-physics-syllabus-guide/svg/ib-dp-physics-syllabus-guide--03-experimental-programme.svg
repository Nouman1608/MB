<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The experimental programme</text>

<rect x="30" y="112" width="840" height="64" rx="14" fill="#efdfa8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="152" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Experimental programme: 40 hours SL / 60 hours HL</text><rect x="30" y="200" width="264" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="162" y="236" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Practical work</text><text x="162" y="262" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">hands-on</text><line x1="162" y1="334" x2="162" y2="368" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="318" y="200" width="264" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="236" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Collaborative</text><text x="450" y="260" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">sciences project</text><text x="450" y="288" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">shared with other</text><text x="450" y="309" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">group 4 subjects</text><line x1="450" y1="334" x2="450" y2="368" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="606" y="200" width="264" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="738" y="236" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Scientific</text><text x="738" y="260" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">investigation</text><text x="738" y="288" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">internally assessed</text><line x1="738" y1="334" x2="738" y2="368" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="374" width="840" height="150" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="408" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle">Practical skills it builds</text><rect x="40" y="428" width="210" height="70" rx="10" fill="#fff" stroke="#2e6b62" stroke-width="2"/><text x="145" y="468" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">designing a fair test</text><rect x="260" y="428" width="350" height="70" rx="10" fill="#fff" stroke="#2e6b62" stroke-width="2"/><text x="435" y="458" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">identifying and reducing sources of</text><text x="435" y="478" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">uncertainty</text><rect x="620" y="428" width="210" height="70" rx="10" fill="#fff" stroke="#2e6b62" stroke-width="2"/><text x="725" y="458" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">interpreting</text><text x="725" y="478" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">unfamiliar data</text><line x1="300" y1="528" x2="230" y2="566" stroke="#8a6d0d" stroke-width="3.5" marker-end="url(#ahO)"/><line x1="600" y1="528" x2="670" y2="566" stroke="#8a6d0d" stroke-width="3.5" marker-end="url(#ahO)"/><rect x="40" y="572" width="380" height="92" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="230" y="608" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Written papers</text><text x="230" y="636" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">including the data-based paper</text><rect x="480" y="572" width="380" height="92" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="670" y="608" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Internal assessment</text><text x="670" y="636" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">the scientific investigation</text><text x="450" y="700" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">A parallel strand through the whole course, not an add-on to the five themes.</text>
