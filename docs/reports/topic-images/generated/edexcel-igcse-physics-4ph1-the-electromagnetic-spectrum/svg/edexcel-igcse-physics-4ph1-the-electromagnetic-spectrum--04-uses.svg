<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 824" width="900" height="824" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="824" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Uses of electromagnetic waves</text>

<rect x="30" y="110" width="840" height="46" rx="10" fill="#1e2a44" stroke="#1e2a44" stroke-width="0"/><text x="50" y="140" font-size="17" font-weight="700" fill="#fff" text-anchor="start">Radiation</text><text x="215" y="140" font-size="17" font-weight="700" fill="#fff" text-anchor="start">Use</text><text x="500" y="140" font-size="17" font-weight="700" fill="#fff" text-anchor="start">Property that makes it work</text><rect x="30" y="164" width="840" height="58" rx="8" fill="#dfe7ef" stroke="#c9d6d4" stroke-width="1.5"/><text x="50" y="200" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">radio waves</text><text x="215" y="200" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">broadcasting, communications</text><text x="500" y="189" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">travel long distances through the</text><text x="500" y="209" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">atmosphere; can carry information</text><rect x="30" y="228" width="840" height="58" rx="8" fill="#e2ecee" stroke="#c9d6d4" stroke-width="1.5"/><text x="50" y="264" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">microwaves</text><text x="215" y="264" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">cooking</text><text x="500" y="253" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">penetrate a few cm into food; absorbed by</text><text x="500" y="273" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">water molecules</text><rect x="30" y="292" width="840" height="58" rx="8" fill="#e2ecee" stroke="#c9d6d4" stroke-width="1.5"/><text x="50" y="328" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">microwaves</text><text x="215" y="328" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">satellite transmissions</text><text x="500" y="317" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">pass through the atmosphere and cloud;</text><text x="500" y="337" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">sent as narrow beams</text><rect x="30" y="356" width="840" height="58" rx="8" fill="#f3d5cc" stroke="#c9d6d4" stroke-width="1.5"/><text x="50" y="392" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">infrared</text><text x="215" y="392" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">heaters</text><text x="500" y="381" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">hot objects emit it; objects that absorb</text><text x="500" y="401" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">it warm up</text><rect x="30" y="420" width="840" height="58" rx="8" fill="#f3d5cc" stroke="#c9d6d4" stroke-width="1.5"/><text x="50" y="456" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">infrared</text><text x="215" y="456" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">night vision</text><text x="500" y="445" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">warm bodies emit more infrared than</text><text x="500" y="465" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">cooler surroundings</text><rect x="30" y="484" width="840" height="58" rx="8" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="1.5"/><text x="50" y="520" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">visible light</text><text x="215" y="520" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">optical fibres</text><text x="500" y="509" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">travels along glass fibres by total</text><text x="500" y="529" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">internal reflection</text><rect x="30" y="548" width="840" height="58" rx="8" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="1.5"/><text x="50" y="584" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">visible light</text><text x="215" y="584" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">photography</text><text x="500" y="573" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">a lens focuses it onto a sensor or film</text><text x="500" y="593" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">that responds to it</text><rect x="30" y="612" width="840" height="58" rx="8" fill="#e8e0f2" stroke="#c9d6d4" stroke-width="1.5"/><text x="50" y="648" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">ultraviolet</text><text x="215" y="648" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">fluorescent lamps</text><text x="500" y="637" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">a coating absorbs ultraviolet and emits</text><text x="500" y="657" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">visible light</text><rect x="30" y="676" width="840" height="58" rx="8" fill="#e3e6ea" stroke="#c9d6d4" stroke-width="1.5"/><text x="50" y="712" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">x-rays</text><text x="215" y="712" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">internal structure, medical</text><text x="500" y="701" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">pass through soft tissue; absorbed by</text><text x="500" y="721" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">bone or metal</text><rect x="30" y="740" width="840" height="58" rx="8" fill="#dce9e7" stroke="#c9d6d4" stroke-width="1.5"/><text x="50" y="776" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">gamma rays</text><text x="215" y="776" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">sterilising food, equipment</text><text x="500" y="765" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">penetrate packaging and kill bacteria,</text><text x="500" y="785" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">without heating</text>
</svg>