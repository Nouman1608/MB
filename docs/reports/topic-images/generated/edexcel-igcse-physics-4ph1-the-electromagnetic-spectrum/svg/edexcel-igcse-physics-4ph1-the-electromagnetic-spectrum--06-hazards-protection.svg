<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 686" width="900" height="686" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="686" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Harmful effects and protection</text>

<rect x="30" y="110" width="840" height="46" rx="10" fill="#1e2a44" stroke="#1e2a44" stroke-width="0"/><text x="50" y="140" font-size="17" font-weight="700" fill="#fff" text-anchor="start">Radiation</text><text x="210" y="140" font-size="17" font-weight="700" fill="#fff" text-anchor="start">Harm from excessive exposure</text><text x="530" y="140" font-size="17" font-weight="700" fill="#fff" text-anchor="start">Simple protection</text><rect x="30" y="164" width="840" height="96" rx="8" fill="#e2ecee" stroke="#c9d6d4" stroke-width="1.5"/><text x="50" y="218" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">microwaves</text><text x="210" y="192" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">internal heating of body</text><text x="210" y="214" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">tissue</text><text x="530" y="192" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">metal case and metal mesh in the</text><text x="530" y="214" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">oven door; switches off when the</text><text x="530" y="236" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">door opens</text><rect x="30" y="268" width="840" height="74" rx="8" fill="#f3d5cc" stroke="#c9d6d4" stroke-width="1.5"/><text x="50" y="311" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">infrared</text><text x="210" y="296" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">skin burns</text><text x="530" y="296" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">keep a safe distance; guards on</text><text x="530" y="318" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">heaters; heat-resistant gloves</text><rect x="30" y="350" width="840" height="96" rx="8" fill="#e8e0f2" stroke="#c9d6d4" stroke-width="1.5"/><text x="50" y="404" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">ultraviolet</text><text x="210" y="378" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">damage to surface cells</text><text x="210" y="400" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">(sunburn, skin cancer risk)</text><text x="210" y="422" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">and blindness</text><text x="530" y="378" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">sunscreen, covering clothing,</text><text x="530" y="400" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">hats, UV-blocking sunglasses;</text><text x="530" y="422" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">limit time in strong sun</text><rect x="30" y="454" width="840" height="74" rx="8" fill="#dce9e7" stroke="#c9d6d4" stroke-width="1.5"/><text x="50" y="497" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">gamma rays</text><text x="210" y="482" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">cancer and mutation (damage</text><text x="210" y="504" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">to DNA)</text><text x="530" y="482" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">lead or thick concrete shielding;</text><text x="530" y="504" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">distance; limit time; dose badges</text><rect x="30" y="544" width="840" height="120" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="60" y="580" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">X-rays have similar effects to gamma rays: radiographers stand behind shielding.</text><text x="60" y="610" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Broadly, higher frequency is more harmful: ultraviolet affects surface cells;</text><text x="60" y="636" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">x-rays and gamma rays penetrate and can damage cells inside the body.</text>
</svg>