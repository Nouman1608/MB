<rect width="900" height="570" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How an x-ray image is made</text>

<rect x="30" y="110" width="840" height="440" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="60" y="230" width="80" height="120" rx="8" fill="#e3e6ea" stroke="#1e2a44" stroke-width="2.5"/><text x="100" y="380" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">x-ray</text><text x="100" y="400" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">source</text><ellipse cx="420" cy="290" rx="90" ry="150" fill="#f2d9c4" stroke="#1e2a44" stroke-width="2.5"/><ellipse cx="420" cy="290" rx="30" ry="120" fill="#f4f1e6" stroke="#1e2a44" stroke-width="2.5"/><text x="420" y="132" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">soft tissue</text><text x="420" y="385" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">bone</text><rect x="690" y="140" width="40" height="300" rx="4" fill="#3a4458" stroke="#1e2a44" stroke-width="2.5"/><text x="710" y="470" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">detector</text><rect x="690" y="170" width="40" height="240" fill="#f4f1e6" opacity="0.9"/><line x1="145" y1="246" x2="685" y2="180" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><line x1="145" y1="262" x2="685" y2="220" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><line x1="145" y1="318" x2="685" y2="360" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><line x1="145" y1="334" x2="685" y2="400" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><line x1="145" y1="278" x2="392" y2="260" stroke="#b5602e" stroke-width="3"/><text x="398" y="266" font-size="18" font-weight="700" fill="#b5602e">✕</text><line x1="145" y1="290" x2="392" y2="290" stroke="#b5602e" stroke-width="3"/><text x="398" y="296" font-size="18" font-weight="700" fill="#b5602e">✕</text><line x1="145" y1="302" x2="392" y2="320" stroke="#b5602e" stroke-width="3"/><text x="398" y="326" font-size="18" font-weight="700" fill="#b5602e">✕</text><text x="750" y="210" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start">dark where</text><text x="750" y="229" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start">x-rays</text><text x="750" y="248" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start">pass through</text><text x="750" y="290" font-size="15" font-weight="600" fill="#b5602e" text-anchor="start">light where</text><text x="750" y="309" font-size="15" font-weight="600" fill="#b5602e" text-anchor="start">bone stops</text><text x="750" y="328" font-size="15" font-weight="600" fill="#b5602e" text-anchor="start">them</text><text x="450" y="528" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">The same principle checks welds and baggage.</text>
