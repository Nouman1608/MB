<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 570" width="900" height="570" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="570" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: comparing frequencies</text>

<rect x="30" y="110" width="410" height="270" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="148" font-size="21" font-weight="700" fill="#2b5a9a" text-anchor="start">Radio wave</text><text x="54" y="182" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">λ = 1500 m</text><text x="54" y="226" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">f = v / λ</text><text x="54" y="258" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">  = 3.0 × 10⁸ / 1500</text><rect x="50" y="302" width="370" height="56" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="235" y="338" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">f = 2.0 × 10⁵ Hz</text><rect x="460" y="110" width="410" height="270" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="484" y="148" font-size="21" font-weight="700" fill="#b5602e" text-anchor="start">X-ray</text><text x="484" y="182" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">λ = 1.0 × 10⁻¹⁰ m</text><text x="484" y="226" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">f = v / λ</text><text x="484" y="258" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">  = 3.0 × 10⁸ / 1.0 × 10⁻¹⁰</text><rect x="480" y="302" width="370" height="56" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="665" y="338" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">f = 3.0 × 10¹⁸ Hz</text><rect x="30" y="400" width="840" height="150" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="445" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">3.0 × 10¹⁸ ÷ 2.0 × 10⁵ = 1.5 × 10¹³</text><text x="450" y="485" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">The x-ray frequency is 1.5 × 10¹³ times larger,</text><text x="450" y="515" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">because its wavelength is that many times shorter.</text>
</svg>