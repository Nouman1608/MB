<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="900" height="550" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="550" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The colours of the visible spectrum</text>

<rect x="30" y="110" width="840" height="420" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="50" y="200" width="110" height="90" rx="10" fill="#f3d5cc" stroke="#b5602e" stroke-width="2"/><text x="105" y="238" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">infrared</text><text x="105" y="266" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">next to red</text><rect x="740" y="200" width="110" height="90" rx="10" fill="#e8e0f2" stroke="#8a4bb0" stroke-width="2"/><text x="795" y="238" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">ultraviolet</text><text x="795" y="266" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">next to violet</text><rect x="170" y="200" width="80" height="90" fill="#c8443a"/><text x="210" y="320" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">red</text><rect x="250" y="200" width="80" height="90" fill="#e0812f"/><text x="290" y="320" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">orange</text><rect x="330" y="200" width="80" height="90" fill="#e3c234"/><text x="370" y="320" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">yellow</text><rect x="410" y="200" width="80" height="90" fill="#4f9a4a"/><text x="450" y="320" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">green</text><rect x="490" y="200" width="80" height="90" fill="#3b6fc0"/><text x="530" y="320" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">blue</text><rect x="570" y="200" width="80" height="90" fill="#4b3f9e"/><text x="610" y="320" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">indigo</text><rect x="650" y="200" width="80" height="90" fill="#8a4bb0"/><text x="690" y="320" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">violet</text><rect x="170" y="200" width="560" height="90" fill="none" stroke="#1e2a44" stroke-width="2.5"/><text x="170" y="180" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">about 700 nm</text><text x="730" y="180" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">about 400 nm</text><text x="450" y="150" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Visible light: the only part the eye detects</text><line x1="170" y1="370" x2="730" y2="370" stroke="#b5602e" stroke-width="4" marker-end="url(#ahR)"/><text x="450" y="400" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">decreasing wavelength</text><line x1="170" y1="430" x2="730" y2="430" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><text x="450" y="460" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">increasing frequency</text><text x="450" y="505" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">"infra" = below (red);  "ultra" = beyond (violet)</text>
</svg>