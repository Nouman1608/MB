<rect width="900" height="547" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The three topics and their key questions</text>

<rect x="30" y="104" width="269.3333333333333" height="315" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="137" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">TOPIC 4</text><text x="50" y="163.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Family</text><text x="50" y="191.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="191.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">4.1 What are the</text><text x="65.2" y="212.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">different types of</text><text x="65.2" y="233.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">families?</text><text x="50" y="259.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="259.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">4.2 What is the role of</text><text x="65.2" y="280.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the family for the</text><text x="65.2" y="301.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">individual and society?</text><text x="50" y="327.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="327.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">4.3 How is family life</text><text x="65.2" y="348.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">changing?</text><rect x="315.3333333333333" y="104" width="269.3333333333333" height="315" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="335.3333333333333" y="137" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">TOPIC 5</text><text x="335.3333333333333" y="163.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Education</text><text x="335.3333333333333" y="191.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="350.5333333333333" y="191.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">5.1 What is education and</text><text x="350.5333333333333" y="212.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">schooling?</text><text x="335.3333333333333" y="238.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="350.5333333333333" y="238.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">5.2 What are the roles</text><text x="350.5333333333333" y="259.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">and functions of</text><text x="350.5333333333333" y="280.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">education?</text><text x="335.3333333333333" y="306.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="350.5333333333333" y="306.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">5.3 What factors help to</text><text x="350.5333333333333" y="327.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">explain differences in</text><text x="350.5333333333333" y="348.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">educational achievement</text><text x="350.5333333333333" y="369.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">and experience?</text><rect x="600.6666666666666" y="104" width="269.3333333333333" height="315" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="620.6666666666666" y="137" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">TOPIC 6</text><text x="620.6666666666666" y="163.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Crime, Deviance and</text><text x="620.6666666666666" y="188.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Social Control</text><text x="620.6666666666666" y="216.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="635.8666666666667" y="216.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">6.1 What are crime,</text><text x="635.8666666666667" y="237.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">deviance and social</text><text x="635.8666666666667" y="258.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">control?</text><text x="620.6666666666666" y="284.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="635.8666666666667" y="284.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">6.2 What are the patterns</text><text x="635.8666666666667" y="305.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">of and explanations for</text><text x="635.8666666666667" y="326.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">crime and deviance?</text><text x="620.6666666666666" y="352.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="635.8666666666667" y="352.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">6.3 How is crime dealt</text><text x="635.8666666666667" y="373.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">with in different</text><text x="635.8666666666667" y="394.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">societies?</text><rect x="30" y="437" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="470.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Topics are numbered 4, 5 and 6, continuing on from Paper 1. The numbers 2.1–2.3 belong to</text><text x="50" y="492.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Paper 1’s Identity topic, not to Paper 2.</text>
</svg>