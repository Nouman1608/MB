<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Revise three, then focus on two</text>

<line x1="60" y1="150" x2="840" y2="150" stroke="#1e2a44" stroke-width="5" marker-end="url(#ah)"/><text x="60" y="134" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Early in the course</text><text x="840" y="134" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="end">Closer to the exam</text><rect x="30" y="180" width="400" height="230" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="230" y="216" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Prepare all three</text><text x="230" y="242" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">to a reasonable standard</text><rect x="44" y="270" width="118" height="70" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="103" y="312" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Family</text><rect x="171" y="270" width="118" height="70" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="230" y="312" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Education</text><rect x="298" y="270" width="118" height="70" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="357" y="312" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Crime</text><text x="230" y="380" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="middle" font-style="italic">all three kept open</text><line x1="440" y1="305" x2="462" y2="305" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="470" y="180" width="400" height="230" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="670" y="216" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Revise two in depth</text><text x="670" y="242" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">the two you will answer on</text><rect x="484" y="270" width="118" height="70" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="543" y="312" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Family</text><rect x="611" y="270" width="118" height="70" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="670" y="312" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Education</text><rect x="738" y="270" width="118" height="70" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="797" y="312" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Crime</text><text x="670" y="380" font-size="16" font-weight="400" fill="#8a6d0d" text-anchor="middle" font-style="italic">example choice</text><rect x="30" y="430" width="840" height="135" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="463" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">RISK</text><text x="50" y="489.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Dropping a topic too early</text><text x="50" y="518.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">You may be caught out if the questions on your other two topics are less comfortable than</text><text x="50" y="540.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">you expected.</text>
</svg>