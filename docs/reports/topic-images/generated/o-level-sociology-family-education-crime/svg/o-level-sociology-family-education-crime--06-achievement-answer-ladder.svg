<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="540" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Building a stronger answer on achievement</text>

<rect x="30" y="104" width="840" height="86" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="137" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">QUESTION</text><text x="50" y="164" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Why do some students achieve more highly than others?</text><rect x="30" y="208" width="180" height="50" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="120" y="240" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Weak</text><rect x="224" y="208" width="646" height="50" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="240" y="237.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">“Some students work harder than others.” Common sense, then stops.</text><rect x="30" y="270" width="180" height="72" rx="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="120" y="313" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Name a factor</text><rect x="224" y="270" width="646" height="72" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="240" y="299.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Cultural capital: homes with more books, parental help with homework,</text><text x="240" y="321.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">familiarity with school vocabulary and expectations.</text><rect x="30" y="354" width="180" height="72" rx="14" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="120" y="397" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Explain how</text><rect x="224" y="354" width="646" height="72" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="240" y="383.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">In your own words, explain the mechanism by which that advantage</text><text x="240" y="405.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">affects achievement.</text><rect x="30" y="438" width="180" height="72" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="120" y="481" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Weigh and judge</text><rect x="224" y="438" width="646" height="72" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="240" y="467.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Weigh two factors (e.g. home background and school resources) and</text><text x="240" y="489.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">judge which matters more in this case.</text>
</svg>