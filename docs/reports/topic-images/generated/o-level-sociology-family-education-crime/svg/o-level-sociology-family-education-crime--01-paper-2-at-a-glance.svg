<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Paper 2 at a glance</text>

<rect x="30" y="110" width="270" height="110" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="165" y="166" font-size="34" font-weight="700" fill="#1e2a44" text-anchor="middle">1 h 45 min</text><text x="165" y="198" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">exam length</text><rect x="315" y="110" width="270" height="110" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="166" font-size="34" font-weight="700" fill="#1e2a44" text-anchor="middle">80 marks</text><text x="450" y="198" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">total</text><rect x="600" y="110" width="270" height="110" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="735" y="166" font-size="34" font-weight="700" fill="#1e2a44" text-anchor="middle">50%</text><text x="735" y="198" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">of the qualification</text><text x="450" y="272" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Answer 2 structured questions from a choice of 3 topics</text><rect x="30" y="294" width="270" height="96" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="70" cy="342" r="22" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="70" y="349.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="106" y="348" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Family</text><rect x="315" y="294" width="270" height="96" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="355" cy="342" r="22" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="355" y="349.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="391" y="348" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Education</text><rect x="600" y="294" width="270" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="640" cy="342" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="640" y="349.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">6</text><text x="676" y="326" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Crime, Deviance</text><text x="676" y="348" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">and Social</text><text x="676" y="370" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Control</text><text x="450" y="418" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">e.g. you might choose 4 and 5, but any 2 of the 3</text><rect x="30" y="446" width="840" height="114" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="479" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STILL NEEDED FROM PAPER 1</text><text x="50" y="506" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Research Methods</text><text x="50" y="535.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">You are expected to apply Paper 1’s research methods to whichever two topics you choose.</text>
</svg>