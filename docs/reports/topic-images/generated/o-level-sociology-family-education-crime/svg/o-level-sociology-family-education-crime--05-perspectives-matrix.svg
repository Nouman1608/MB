<rect width="900" height="533" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three perspectives across Family and Education</text>

<rect x="30" y="104" width="240" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="42" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Perspective</text><rect x="270" y="104" width="300" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="282" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">On the family</text><rect x="570" y="104" width="300" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="582" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">On education</text><rect x="30" y="150" width="240" height="85" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="175.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Functionalism:</text><text x="42" y="196.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">institutions meet</text><text x="42" y="217.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">society’s needs</text><rect x="270" y="150" width="300" height="85" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="282" y="175.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Functions of the family; “warm</text><text x="282" y="196.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">bath” theory; loss of functions;</text><text x="282" y="217.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the nuclear family</text><rect x="570" y="150" width="300" height="85" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="582" y="175.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Socialisation, social control,</text><text x="582" y="196.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">role allocation, value consensus,</text><text x="582" y="217.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">meritocracy</text><rect x="30" y="235" width="240" height="85" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="260.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Marxism: institutions</text><text x="42" y="281.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">serve capitalism</text><rect x="270" y="235" width="300" height="85" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="282" y="260.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Unit of consumption; reproduces</text><text x="282" y="281.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">class inequality; ideological</text><text x="282" y="302.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">control</text><rect x="570" y="235" width="300" height="85" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="582" y="260.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Reproduces class inequality;</text><text x="582" y="281.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">cultural capital; the “myth of</text><text x="582" y="302.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">meritocracy”</text><rect x="30" y="320" width="240" height="85" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="345.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Feminism: institutions</text><text x="42" y="366.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">reproduce patriarchy</text><rect x="270" y="320" width="300" height="85" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="282" y="345.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Domestic division of labour; dual</text><text x="282" y="366.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">burden and triple shift; domestic</text><text x="282" y="387.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">violence</text><rect x="570" y="320" width="300" height="85" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="582" y="345.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Patriarchal school culture;</text><text x="582" y="366.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">gendered subject choice; teacher</text><text x="582" y="387.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">expectations</text><rect x="30" y="423" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="456.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Learn one specific argument per perspective per topic, plus a strength and a limitation for</text><text x="50" y="478.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">each.</text>
</svg>