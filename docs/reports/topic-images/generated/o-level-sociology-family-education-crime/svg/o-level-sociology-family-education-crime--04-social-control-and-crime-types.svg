<rect x="30" y="104" width="410" height="116" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="235" y="151" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">FORMAL SOCIAL CONTROL</text><text x="235" y="178.8" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Police, courts, laws</text><rect x="460" y="104" width="410" height="116" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="665" y="137" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">INFORMAL SOCIAL CONTROL</text><text x="665" y="164.8" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Family disapproval, peer</text><text x="665" y="192.8" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">pressure, community norms</text><text x="450" y="258" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">The eleven named crime types</text><rect x="42.86250000000007" y="284" width="102.42499999999998" height="42" rx="21" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="94.07500000000006" y="311.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">violent</text><rect x="157.28750000000005" y="284" width="112.19999999999999" height="42" rx="21" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="213.38750000000005" y="311.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">property</text><rect x="281.48750000000007" y="284" width="268.59999999999997" height="42" rx="21" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="415.7875" y="311.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">white-collar / corporate</text><rect x="562.0875000000001" y="284" width="131.75" height="42" rx="21" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="627.9625000000001" y="311.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">expressive</text><rect x="705.8375000000001" y="284" width="151.29999999999998" height="42" rx="21" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="781.4875000000001" y="311.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">instrumental</text><rect x="102.95000000000005" y="336" width="73.1" height="42" rx="21" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="139.50000000000006" y="363.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">gang</text><rect x="188.05000000000004" y="336" width="82.875" height="42" rx="21" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="229.48750000000004" y="363.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">green</text><rect x="282.92500000000007" y="336" width="209.95" height="42" rx="21" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="387.9000000000001" y="363.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">organised / global</text><rect x="504.87500000000006" y="336" width="82.875" height="42" rx="21" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="546.3125" y="363.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">cyber</text><rect x="599.75" y="336" width="73.1" height="42" rx="21" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="636.3" y="363.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">hate</text><rect x="684.85" y="336" width="112.19999999999999" height="42" rx="21" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="740.95" y="363.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">domestic</text><rect x="250" y="402" width="26" height="22" rx="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="288" y="419" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">most likely in a contemporary stimulus</text>
