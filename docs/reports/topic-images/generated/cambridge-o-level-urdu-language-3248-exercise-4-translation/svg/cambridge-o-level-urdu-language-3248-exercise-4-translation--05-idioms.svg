<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 604" width="900" height="604" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="604" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Idioms: translate the meaning</text>

<rect x="30" y="110" width="840" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="172" font-size="19" font-weight="600" fill="#1e2a44" text-anchor="start" font-style="italic">It was raining cats and dogs.</text><line x1="392" y1="166" x2="432" y2="166" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="440" y="126" width="406" height="80" rx="10" fill="#dce9e7"/><text x="830" y="170" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;موسلا دھار بارش ہو رہی تھی&#x200F;</text><text x="830" y="192" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="end" font-style="italic">the meaning</text><rect x="30" y="236" width="840" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="298" font-size="19" font-weight="600" fill="#1e2a44" text-anchor="start" font-style="italic">I am over the moon.</text><line x1="392" y1="292" x2="432" y2="292" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="440" y="252" width="406" height="80" rx="10" fill="#dce9e7"/><text x="830" y="296" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;میں بے حد خوش ہوں&#x200F;</text><text x="830" y="318" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="end" font-style="italic">the meaning</text><rect x="30" y="362" width="840" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="424" font-size="19" font-weight="600" fill="#1e2a44" text-anchor="start" font-style="italic">He kept his word.</text><line x1="392" y1="418" x2="432" y2="418" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="440" y="378" width="406" height="80" rx="10" fill="#dce9e7"/><text x="830" y="422" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;اس نے اپنا وعدہ پورا کیا&#x200F;</text><text x="830" y="444" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="end" font-style="italic">the meaning</text><rect x="30" y="492" width="840" height="84" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="450" y="528" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">A word-for-word idiom is the clearest sign of literal translation.</text><text x="450" y="556" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Ask what the English means, then say that in Urdu.</text>
</svg>