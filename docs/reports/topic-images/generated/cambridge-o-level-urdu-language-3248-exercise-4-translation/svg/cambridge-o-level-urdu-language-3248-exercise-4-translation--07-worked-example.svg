<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1096" width="900" height="1096" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="1096" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: a trip to Murree</text>

<rect x="30" y="110" width="840" height="164" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="62" cy="144" r="17" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="150.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="92" y="150" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">Last summer my family visited Murree for the first time.</text><text x="846" y="202" font-size="23" fill="#2e6b62" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;پچھلی گرمیوں میں میرے گھر والے پہلی بار مری گئے۔&#x200F;</text><text x="846" y="260" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">a family is a plural group; "went to" sounds more natural than a literal "visit"</text><rect x="30" y="284" width="840" height="214" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="62" cy="318" r="17" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="324.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="92" y="324" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">The roads were narrow and crowded, but the view from the hills was breathtaking.</text><text x="846" y="376" font-size="23" fill="#2e6b62" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;سڑکیں تنگ تھیں اور ان پر بہت رش تھا، لیکن&#x200F;</text><text x="846" y="426" font-size="23" fill="#2e6b62" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;پہاڑوں سے نظارہ دم بخود کر دینے والا تھا۔&#x200F;</text><text x="846" y="484" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">"crowded" expanded into a clause; "breathtaking" given an Urdu expression of the same force</text><rect x="30" y="508" width="840" height="214" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="62" cy="542" r="17" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="548.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="92" y="548" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">My little sister, who had never seen clouds so close, kept trying to catch them.</text><text x="846" y="600" font-size="23" fill="#2e6b62" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;میری چھوٹی بہن نے، جس نے پہلے کبھی بادل اتنے قریب سے نہیں دیکھے تھے،&#x200F;</text><text x="846" y="650" font-size="23" fill="#2e6b62" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;انھیں پکڑنے کی بار بار کوشش کی۔&#x200F;</text><text x="846" y="708" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">the relative clause kept; the verb agrees with "clouds", masculine plural</text><rect x="30" y="732" width="840" height="164" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="62" cy="766" r="17" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="772.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="92" y="772" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">In the evening we drank hot tea at a small roadside café.</text><text x="846" y="824" font-size="23" fill="#2e6b62" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;شام کو ہم نے سڑک کنارے ایک چھوٹے سے ڈھابے پر گرم چائے پی۔&#x200F;</text><text x="846" y="882" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">the natural word for a roadside café, in the oblique; the verb agrees with feminine "tea"</text><rect x="30" y="906" width="840" height="164" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="62" cy="940" r="17" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="946.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="92" y="946" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">I have been to many places since then, but I will never forget that trip.</text><text x="846" y="998" font-size="23" fill="#2e6b62" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;اس کے بعد میں بہت سی جگہوں پر جا چکا ہوں، مگر وہ سفر کبھی نہیں بھولوں گا۔&#x200F;</text><text x="846" y="1056" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">perfect for "have been"; the future negative keeps the promise-like tone</text>
</svg>