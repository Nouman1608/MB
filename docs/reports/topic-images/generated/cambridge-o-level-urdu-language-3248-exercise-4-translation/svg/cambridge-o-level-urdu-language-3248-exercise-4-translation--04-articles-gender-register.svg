<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 842" width="900" height="842" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="842" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Articles, gender and register</text>

<rect x="30" y="110" width="840" height="246" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="148" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Articles</text><text x="160" y="148" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">"the" is not translated; "a" only when it introduces something new</text><text x="54" y="202" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">A man knocked at the door.</text><rect x="400" y="166" width="446" height="70" rx="10" fill="#dce9e7"/><text x="830" y="212" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;ایک آدمی نے دروازہ کھٹکھٹایا&#x200F;</text><text x="54" y="284" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">The door was open.</text><rect x="400" y="248" width="446" height="70" rx="10" fill="#dce9e7"/><text x="830" y="294" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;دروازہ کھلا تھا&#x200F;</text><text x="54" y="330" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">not</text><text x="130" y="334" font-size="22" fill="#b5602e" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;وہ&#x200F;</text><text x="160" y="330" font-size="15" font-weight="400" fill="#b5602e" text-anchor="start">for "the" everywhere</text><rect x="30" y="376" width="840" height="168" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="414" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Gender: choose the noun, then make every word agree</text><text x="54" y="468" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">the old house</text><rect x="200" y="432" width="220" height="92" rx="10" fill="#dce9e7"/><text x="404" y="480" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;پرانا مکان&#x200F;</text><text x="404" y="510" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="end" font-style="italic">masculine</text><text x="470" y="468" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">the old building</text><rect x="626" y="432" width="220" height="92" rx="10" fill="#f2e7b8"/><text x="830" y="480" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;پرانی عمارت&#x200F;</text><text x="830" y="510" font-size="15" font-weight="400" fill="#8a6d0d" text-anchor="end" font-style="italic">feminine</text><rect x="30" y="564" width="840" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="602" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">You and they: English hides register</text><text x="54" y="656" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">you, to a friend</text><rect x="230" y="620" width="190" height="70" rx="10" fill="#dce9e7"/><text x="404" y="668" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;تم&#x200F;</text><text x="470" y="656" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">you, to a teacher</text><rect x="656" y="620" width="190" height="70" rx="10" fill="#f2e7b8"/><text x="830" y="668" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;آپ&#x200F;</text><text x="54" y="740" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">My grandfather says...</text><rect x="330" y="704" width="250" height="70" rx="10" fill="#dce9e7"/><text x="564" y="750" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;میرے دادا کہتے ہیں&#x200F;</text><text x="612" y="742" font-size="26" font-weight="700" fill="#2e6b62" text-anchor="middle">✓</text><rect x="646" y="704" width="200" height="70" rx="10" fill="#fbf1ea"/><text x="830" y="750" font-size="24" fill="#b5602e" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;کہتا ہے&#x200F;</text><text x="54" y="800" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Keep the same form for the same person throughout.</text>
</svg>