<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" width="900" height="680" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="680" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Exercise 4: what is assessed</text>

<rect x="30" y="110" width="268" height="116" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="164" y="154" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">~150 words</text><text x="164" y="184" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">English passage</text><rect x="316" y="110" width="268" height="116" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="154" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">15 marks</text><text x="450" y="184" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">answer written in Urdu</text><rect x="602" y="110" width="268" height="116" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="736" y="154" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">W1 to W5</text><text x="736" y="184" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">all five writing objectives</text><rect x="30" y="250" width="840" height="400" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,300 L31.25,264 Q31.25,251.25 44,251.25 L856,251.25 Q868.75,251.25 868.75,264 L868.75,300 Z" fill="#b5d3cf"/><text x="46" y="282" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Objective</text><text x="346" y="282" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">In translation</text><line x1="330" y1="250" x2="330" y2="650" stroke="#c9d6d4" stroke-width="2"/><line x1="30" y1="300" x2="870" y2="300" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="328.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">W1 communicate clearly and</text><text x="46" y="351.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">accurately</text><text x="346" y="339.65" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">every idea of the English is present, nothing added</text><line x1="30" y1="370" x2="870" y2="370" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="398.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">W2 coherent paragraphs,</text><text x="46" y="421.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">linking devices</text><text x="346" y="398.15" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">English links (but, so, because) survive as Urdu</text><text x="346" y="421.15" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">connectives</text><line x1="30" y1="440" x2="870" y2="440" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="468.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">W3 manipulate the language</text><text x="46" y="491.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">accurately</text><text x="346" y="479.65" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">tenses, agreement, postpositions and word order correct</text><line x1="30" y1="510" x2="870" y2="510" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="549.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">W4 punctuation and spelling</text><text x="346" y="549.65" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Urdu punctuation; correct spelling, including names</text><line x1="30" y1="580" x2="870" y2="580" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="619.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">W5 register and style</text><text x="346" y="619.65" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">the English tone (friendly, formal) carried into Urdu</text>
</svg>