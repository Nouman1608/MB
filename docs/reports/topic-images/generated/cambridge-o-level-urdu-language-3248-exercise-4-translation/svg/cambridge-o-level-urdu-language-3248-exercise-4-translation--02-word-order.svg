<rect width="900" height="576" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Word order: the verb goes last</text>

<text x="54" y="140" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">English: subject, verb, object</text><rect x="54" y="158" width="120" height="62" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="114" y="197" font-size="20" font-weight="600" fill="#1e2a44" text-anchor="middle">She</text><rect x="188" y="158" width="120" height="62" rx="10" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="248" y="197" font-size="20" font-weight="600" fill="#1e2a44" text-anchor="middle">gave</text><rect x="322" y="158" width="180" height="62" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="412" y="197" font-size="20" font-weight="600" fill="#1e2a44" text-anchor="middle">the book</text><rect x="516" y="158" width="230" height="62" rx="10" fill="#ffffff" stroke="#2b5a9a" stroke-width="2.5"/><text x="631" y="197" font-size="20" font-weight="600" fill="#1e2a44" text-anchor="middle">to her brother</text><text x="846" y="300" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="end">Urdu: subject, object, verb last</text><rect x="696" y="318" width="150" height="72" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="771" y="362" font-size="27" fill="#1e2a44" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;اس نے&#x200F;</text><rect x="562" y="318" width="120" height="72" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="622" y="362" font-size="27" fill="#1e2a44" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;کتاب&#x200F;</text><rect x="328" y="318" width="220" height="72" rx="10" fill="#ffffff" stroke="#2b5a9a" stroke-width="2.5"/><text x="438" y="362" font-size="27" fill="#1e2a44" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;اپنے بھائی کو&#x200F;</text><rect x="204" y="318" width="110" height="72" rx="10" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="259" y="362" font-size="27" fill="#1e2a44" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;دی۔&#x200F;</text><path d="M114,222 C114,268 771,270 771,314" fill="none" stroke="#4a5568" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 5"/><path d="M248,222 C248,268 259,270 259,314" fill="none" stroke="#4a5568" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 5"/><path d="M412,222 C412,268 622,270 622,314" fill="none" stroke="#4a5568" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 5"/><path d="M631,222 C631,268 438,270 438,314" fill="none" stroke="#4a5568" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 5"/><text x="450" y="432" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">Urdu reads right to left: the verb comes last, postpositions follow their nouns.</text><rect x="30" y="456" width="840" height="92" rx="14" fill="#fbf1ea" stroke="#b5602e" stroke-width="2.5"/><text x="54" y="494" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">English order with Urdu words</text><text x="54" y="522" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">a common mistake</text><text x="846" y="512" font-size="27" fill="#b5602e" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;میں گیا بازار کل&#x200F;</text><text x="620" y="506" font-size="26" font-weight="700" fill="#b5602e" text-anchor="middle">✗</text>
</svg>