<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 668" width="900" height="668" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="668" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Punctuation, dates and "there is"</text>

<rect x="30" y="110" width="840" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="148" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Punctuation changes</text><rect x="54" y="168" width="250" height="74" rx="10" fill="#dce9e7"/><text x="104" y="220" font-size="36" font-weight="700" fill="#1e2a44" text-anchor="middle">.</text><line x1="134" y1="205" x2="174" y2="205" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="204" y="222" font-size="32" fill="#1e2a44" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;۔&#x200F;</text><text x="240" y="212" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="start">full stop</text><rect x="324" y="168" width="250" height="74" rx="10" fill="#dce9e7"/><text x="374" y="220" font-size="36" font-weight="700" fill="#1e2a44" text-anchor="middle">,</text><line x1="404" y1="205" x2="444" y2="205" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="474" y="222" font-size="32" fill="#1e2a44" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;،&#x200F;</text><text x="510" y="212" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="start">comma</text><rect x="594" y="168" width="250" height="74" rx="10" fill="#dce9e7"/><text x="644" y="220" font-size="36" font-weight="700" fill="#1e2a44" text-anchor="middle">?</text><line x1="674" y1="205" x2="714" y2="205" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="744" y="222" font-size="32" fill="#1e2a44" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;؟&#x200F;</text><text x="780" y="212" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="start">question mark</text><rect x="30" y="280" width="840" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="318" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Days and times</text><rect x="54" y="338" width="250" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="70" y="382" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">on Monday</text><text x="290" y="386" font-size="25" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;پیر کو&#x200F;</text><rect x="324" y="338" width="250" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="340" y="382" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">at five o'clock</text><text x="560" y="386" font-size="25" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;پانچ بجے&#x200F;</text><rect x="594" y="338" width="250" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="610" y="382" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">in 2025</text><text x="830" y="386" font-size="25" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;2025 میں&#x200F;</text><rect x="30" y="450" width="840" height="190" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="54" y="488" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">"There is / there are": place first, then the thing, then the verb</text><text x="54" y="526" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">There is a park near my house.</text><rect x="596" y="544" width="250" height="82" rx="10" fill="#dce9e7" stroke="#8a6d0d" stroke-width="1.5"/><text x="721" y="584" font-size="25" fill="#1e2a44" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;میرے گھر کے قریب&#x200F;</text><text x="721" y="614" font-size="15" font-weight="400" fill="#8a6d0d" text-anchor="middle" font-style="italic">place</text><rect x="424" y="544" width="160" height="82" rx="10" fill="#ffffff" stroke="#8a6d0d" stroke-width="1.5"/><text x="504" y="584" font-size="25" fill="#1e2a44" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;ایک پارک&#x200F;</text><text x="504" y="614" font-size="15" font-weight="400" fill="#8a6d0d" text-anchor="middle" font-style="italic">thing</text><rect x="312" y="544" width="100" height="82" rx="10" fill="#b5d3cf" stroke="#8a6d0d" stroke-width="1.5"/><text x="362" y="584" font-size="25" fill="#1e2a44" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;ہے۔&#x200F;</text><text x="362" y="614" font-size="15" font-weight="400" fill="#8a6d0d" text-anchor="middle" font-style="italic">verb</text>
</svg>