<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 758" width="900" height="758" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="758" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A six-step translation process</text>

<rect x="30" y="110" width="840" height="87" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="153.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="162.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="122" y="148" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Read the whole English passage</text><text x="122" y="176" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">For meaning, tone, and who is speaking to whom.</text><rect x="30" y="207" width="840" height="87" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="250.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="259.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="122" y="245" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Mark difficulties before writing</text><text x="122" y="273" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Idioms, tricky tenses, words you do not know.</text><rect x="30" y="304" width="840" height="110" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="359" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="367.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="122" y="342" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Translate sentence by sentence</text><text x="122" y="370" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Keep the sentence boundaries unless Urdu needs two short ones joined or a long one</text><text x="122" y="393" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">split.</text><rect x="30" y="424" width="840" height="110" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="479" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="76" y="487.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="122" y="462" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Never leave a gap</text><text x="122" y="490" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Use a simpler word or phrase: a close paraphrase keeps the meaning, a blank loses</text><text x="122" y="513" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">it.</text><rect x="30" y="544" width="840" height="87" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="587.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="596.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="122" y="582" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Read the Urdu alone</text><text x="122" y="610" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">As if there were no English: does it sound like Urdu? Does every verb agree?</text><rect x="30" y="641" width="840" height="87" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="684.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="693.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">6</text><text x="122" y="679" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Check names, numbers and punctuation</text><text x="122" y="707" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Last of all.</text>
</svg>