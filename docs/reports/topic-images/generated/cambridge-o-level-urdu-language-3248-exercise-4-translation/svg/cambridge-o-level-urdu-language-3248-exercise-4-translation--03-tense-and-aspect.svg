<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 851" width="900" height="851" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="851" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Tense: map meaning, not verb shapes</text>

<rect x="30" y="110" width="840" height="596.4" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,160 L31.25,124 Q31.25,111.25 44,111.25 L856,111.25 Q868.75,111.25 868.75,124 L868.75,160 Z" fill="#b5d3cf"/><text x="46" y="142" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">English</text><text x="854" y="142" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Urdu</text><line x1="390" y1="110" x2="390" y2="706.4" stroke="#c9d6d4" stroke-width="2"/><line x1="30" y1="160" x2="870" y2="160" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="201.85" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">I walk to school every day.</text><text x="854" y="210.4" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;میں روزانہ پیدل اسکول جاتا ہوں۔&#x200F;</text><line x1="30" y1="234.4" x2="870" y2="234.4" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="276.25" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">I am walking to school.</text><text x="854" y="284.8" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;میں پیدل اسکول جا رہا ہوں۔&#x200F;</text><line x1="30" y1="308.8" x2="870" y2="308.8" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="375.65" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">I have finished my homework.</text><text x="854" y="359.20000000000005" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;میں نے اپنا ہوم ورک ختم کر لیا ہے۔&#x200F;</text><text x="854" y="409.20000000000005" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;میں ہوم ورک کر چکا ہوں۔&#x200F;</text><line x1="30" y1="433.20000000000005" x2="870" y2="433.20000000000005" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="475.05" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">I had already left.</text><text x="854" y="483.6" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;میں پہلے ہی جا چکا تھا۔&#x200F;</text><line x1="30" y1="507.6" x2="870" y2="507.6" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="574.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">I used to play cricket.</text><text x="854" y="558" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;میں کرکٹ کھیلا کرتا تھا۔&#x200F;</text><text x="854" y="608" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;کھیلتا تھا۔&#x200F;</text><rect x="32" y="632" width="836" height="74.4" fill="#f2e7b8"/><line x1="30" y1="632" x2="870" y2="632" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="662.35" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">I have been learning Urdu for two</text><text x="46" y="685.35" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">years.</text><text x="854" y="682.4" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;میں دو سال سے اردو سیکھ رہا ہوں۔&#x200F;</text><rect x="30" y="726.4" width="840" height="96" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="54" y="764.4" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The classic trap: "for two years"</text><text x="54" y="796.4" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">becomes a continuous present with</text><text x="846" y="786.4" font-size="28" fill="#8a6d0d" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;دو سال سے&#x200F;</text>
</svg>