<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How energy use changes with development</text>

<line x1="60" y1="128" x2="840" y2="128" stroke="#8a6d0d" stroke-width="5" marker-end="url(#ahO)"/><rect x="306.3" y="117.85" width="287.4" height="22.950000000000003" rx="5" fill="#f4f6f6" opacity="1"/><text x="450" y="134" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">energy use per person rises</text><rect x="30" y="160" width="260" height="520" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="30" y="160" width="260" height="14" rx="7" fill="#d4b02e"/><rect x="46" y="186" width="228" height="96" rx="8" fill="#dce9e7"/><path d="M98,270 l44,-8 M98,262 l44,8" stroke="#9c8f6e" stroke-width="6" stroke-linecap="round"/><path d="M120,260 q-16,-14 -6,-34 q2,12 8,14 q-2,-16 10,-26 q-2,20 8,30 q4,10 -4,16 z" fill="#b5602e" stroke="#1e2a44" stroke-width="1.6"/><rect x="190" y="252" width="33" height="26.400000000000002" fill="#ffffff" stroke="#1e2a44" stroke-width="2.2"/><path d="M186.7,252 L206.5,237.7 L226.3,252 Z" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><text x="48" y="312" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Low income</text><text x="48" y="344" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PATTERN</text><text x="48" y="368" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="368" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Fuelwood and charcoal are</text><text x="64" y="388" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">the main household fuels</text><text x="48" y="414" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="414" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Low use per person</text><text x="48" y="440" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="440" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Many without mains</text><text x="64" y="460" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">electricity</text><text x="48" y="498" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">WHY</text><text x="48" y="522" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="522" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Wood is free or cheap to</text><text x="64" y="542" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">collect</text><text x="48" y="568" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="568" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Grids do not reach many</text><text x="64" y="588" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">villages</text><text x="48" y="614" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="614" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Little industry</text><line x1="293" y1="234" x2="317" y2="234" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="320" y="160" width="260" height="520" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="320" y="160" width="260" height="14" rx="7" fill="#b5d3cf"/><rect x="336" y="186" width="228" height="96" rx="8" fill="#dce9e7"/><path d="M360,275 L360,245 L380,233 L380,245 L400,233 L400,245 L420,233 L420,275 Z" fill="#ffffff" stroke="#1e2a44" stroke-width="2.2" stroke-linejoin="round"/><rect x="405" y="209" width="9" height="30" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><path d="M410,210 q-8,-12 0,-24 q8,-12 0,-24" fill="none" stroke="#4a5568" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><rect x="470" y="256" width="50" height="16" rx="6" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><circle cx="482" cy="274" r="6" fill="#1e2a44" stroke="#1e2a44" stroke-width="2.5"/><circle cx="509" cy="274" r="6" fill="#1e2a44" stroke="#1e2a44" stroke-width="2.5"/><text x="338" y="312" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Middle income,</text><text x="338" y="335" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">industrialising</text><text x="338" y="367" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PATTERN</text><text x="338" y="391" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="354" y="391" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Demand grows fast</text><text x="338" y="417" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="354" y="417" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Heavy use of coal and oil</text><text x="354" y="437" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">in factories and power</text><text x="354" y="457" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">stations</text><text x="338" y="483" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="354" y="483" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">More cars</text><text x="338" y="521" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">WHY</text><text x="338" y="545" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="354" y="545" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Industrialisation and</text><text x="354" y="565" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">urbanisation</text><text x="338" y="591" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="354" y="591" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Coal often local and</text><text x="354" y="611" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">cheap</text><line x1="583" y1="234" x2="607" y2="234" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="610" y="160" width="260" height="520" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="610" y="160" width="260" height="14" rx="7" fill="#2e6b62"/><rect x="626" y="186" width="228" height="96" rx="8" fill="#dce9e7"/><line x1="680" y1="278" x2="680" y2="212" stroke="#1e2a44" stroke-width="3.3000000000000003"/><line x1="680" y1="212" x2="680" y2="179" stroke="#1e2a44" stroke-width="3.8500000000000005" stroke-linecap="round"/><line x1="680" y1="212" x2="708.5788383248865" y2="228.5" stroke="#1e2a44" stroke-width="3.8500000000000005" stroke-linecap="round"/><line x1="680" y1="212" x2="651.4211616751135" y2="228.5" stroke="#1e2a44" stroke-width="3.8500000000000005" stroke-linecap="round"/><circle cx="680" cy="212" r="4.4" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.5"/><rect x="740" y="255" width="36" height="28.799999999999997" fill="#ffffff" stroke="#1e2a44" stroke-width="2.2"/><path d="M736.4,255 L758,239.4 L779.6,255 Z" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><rect x="800" y="240" width="40" height="30" fill="#2b5a9a" stroke="#1e2a44" stroke-width="2" transform="skewX(-12)"/><text x="628" y="312" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">High income</text><text x="628" y="344" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PATTERN</text><text x="628" y="368" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="644" y="368" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">High use per person</text><text x="628" y="394" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="644" y="394" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Fossil fuels still</text><text x="644" y="414" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">important</text><text x="628" y="440" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="644" y="440" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Rising share of</text><text x="644" y="460" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">renewables; nuclear in</text><text x="644" y="480" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">some</text><text x="628" y="518" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">WHY</text><text x="628" y="542" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="644" y="542" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Wealth to invest in new</text><text x="644" y="562" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">technology</text><text x="628" y="588" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="644" y="588" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Concern about climate</text><text x="644" y="608" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">change and energy</text><text x="644" y="628" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">security</text><rect x="30" y="700" width="840" height="70" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="742" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">The mix changes too: fuelwood → electricity and gas → nuclear and renewables</text>
</svg>