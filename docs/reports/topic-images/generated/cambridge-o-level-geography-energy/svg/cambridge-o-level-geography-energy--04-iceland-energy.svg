<rect width="900" height="762" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Case study: energy supply in Iceland</text>

<rect x="30" y="110" width="840" height="420" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="45" y="125" width="810" height="255" rx="10" fill="#dce9e7"/><rect x="45" y="360" width="60" height="135" fill="#b5d3cf"/><rect x="795" y="360" width="60" height="135" fill="#b5d3cf"/><path d="M105,360 L105,380 L380,380 L470,320 L560,230 L640,320 L720,370 L795,370 L795,515 L105,515 Z" fill="#d8e3c6" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><path d="M520,270 L560,230 L600,270 Q560,282 520,270 Z" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><rect x="107" y="455" width="420" height="58" fill="#d9772f"/><text x="317" y="492" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">hot rocks close to the surface</text><line x1="260" y1="380" x2="260" y2="456" stroke="#9c8f6e" stroke-width="5"/><line x1="290" y1="380" x2="290" y2="456" stroke="#9c8f6e" stroke-width="5"/><rect x="240" y="336" width="72" height="44" fill="#ffffff" stroke="#1e2a44" stroke-width="2.2"/><path d="M258,330 q-8,-12 0,-24 q8,-12 0,-24" fill="none" stroke="#4a5568" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><path d="M284,330 q-8,-12 0,-24 q8,-12 0,-24" fill="none" stroke="#4a5568" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><path d="M240,368 L170,368" fill="none" stroke="#b5602e" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><rect x="120" y="354" width="30" height="24" fill="#ffffff" stroke="#1e2a44" stroke-width="2.2"/><path d="M117,354 L135,341 L153,354 Z" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><rect x="165" y="330" width="24" height="19.200000000000003" fill="#ffffff" stroke="#1e2a44" stroke-width="2.2"/><path d="M162.6,330 L177,319.6 L191.4,330 Z" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><path d="M575,268 Q600,310 650,340" fill="none" stroke="#2b5a9a" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><path d="M640,322 L672,348 L672,372 Q640,360 628,338 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="1.8"/><rect x="672" y="340" width="12" height="36" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2"/><line x1="690" y1="350" x2="740" y2="330" stroke="#1e2a44" stroke-width="2.5" stroke-dasharray="6 4"/><path d="M735,370 L735,344.5 L752,334.3 L752,344.5 L769,334.3 L769,344.5 L786,334.3 L786,370 Z" fill="#ffffff" stroke="#1e2a44" stroke-width="2.2" stroke-linejoin="round"/><rect x="773.25" y="313.9" width="7.6499999999999995" height="25.5" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><rect x="144" y="133.85" width="195.6" height="22.950000000000003" rx="5" fill="#ffffff" opacity="0.92"/><text x="150" y="150" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">Mid-Atlantic Ridge</text><rect x="144" y="157.75" width="276" height="20.25" rx="5" fill="#ffffff" opacity="0.92"/><text x="150" y="172" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">plate boundary, active volcanoes</text><rect x="514" y="133.85" width="236.4" height="22.950000000000003" rx="5" fill="#ffffff" opacity="0.92"/><text x="520" y="150" font-size="17" font-weight="700" fill="#2b5a9a" text-anchor="start">Wet climate, glaciers,</text><rect x="514" y="155.85" width="205.79999999999998" height="22.950000000000003" rx="5" fill="#ffffff" opacity="0.92"/><text x="520" y="172" font-size="17" font-weight="700" fill="#2b5a9a" text-anchor="start">steep river valleys</text><rect x="216" y="269.8" width="117.6" height="21.6" rx="5" fill="#ffffff" opacity="0.92"/><text x="222" y="285" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Hellisheiði</text><rect x="216" y="289.75" width="210.00000000000003" height="20.25" rx="5" fill="#ffffff" opacity="0.92"/><text x="222" y="304" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">geothermal power station</text><rect x="54" y="220.8" width="165.6" height="21.6" rx="5" fill="#ffffff" opacity="0.92"/><text x="60" y="236" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Reykjavík homes:</text><rect x="54" y="240.75" width="177" height="20.25" rx="5" fill="#ffffff" opacity="0.92"/><text x="60" y="255" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">geothermal hot water</text><rect x="594" y="232.8" width="156" height="21.6" rx="5" fill="#ffffff" opacity="0.92"/><text x="600" y="248" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Kárahnjúkar HEP</text><rect x="594" y="252.75" width="185.25" height="20.25" rx="5" fill="#ffffff" opacity="0.92"/><text x="600" y="267" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">dams flooded highland</text><rect x="694" y="303.75" width="165" height="20.25" rx="5" fill="#ffffff" opacity="0.92"/><text x="700" y="318" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">aluminium smelter</text><rect x="694" y="284.8" width="136.8" height="21.6" rx="5" fill="#ffffff" opacity="0.92"/><text x="700" y="300" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Reyðarfjörður</text><text x="450" y="548" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Schematic, not to scale: west on the left, east on the right</text><rect x="30" y="570" width="201" height="172" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="30" y="570" width="201" height="10" rx="5" fill="#b5d3cf"/><text x="46" y="608" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">HEP</text><text x="46" y="634" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">supplies the larger</text><text x="46" y="654" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">share of electricity</text><rect x="243" y="570" width="201" height="172" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="243" y="570" width="201" height="10" rx="5" fill="#d9772f"/><text x="259" y="608" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Geothermal</text><text x="259" y="634" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">most of the rest;</text><text x="259" y="654" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">heats most homes</text><rect x="456" y="570" width="201" height="172" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="456" y="570" width="201" height="10" rx="5" fill="#b5602e"/><text x="472" y="608" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Drawbacks</text><text x="472" y="634" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">flooded wilderness</text><text x="472" y="654" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">opposed; plants</text><text x="472" y="674" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">release gases such</text><text x="472" y="694" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">as hydrogen sulphide</text><rect x="669" y="570" width="201" height="172" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="669" y="570" width="201" height="10" rx="5" fill="#9c8f6e"/><text x="685" y="608" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Still imports oil</text><text x="685" y="634" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">for cars, aircraft</text><text x="685" y="654" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">and the fishing</text><text x="685" y="674" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">fleet</text>
</svg>