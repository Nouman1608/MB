<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 670" width="900" height="670" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="670" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: Taravia’s energy mix</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">A fictional country producing 80 units of electricity a year</text>
<rect x="30" y="110" width="840" height="540" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M250,370 L250,180 A190,190 0 0 1 308.71322893124,550.7007380960791 Z" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2.5"/><text x="362.5964708278457" y="358.1664709854137" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">Coal 36</text><path d="M250,370 L308.71322893124,550.7007380960791 A190,190 0 0 1 69.29926190392084,428.71322893124 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.5"/><text x="198.24508302969167" y="477.5747437574739" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Natural gas 20</text><path d="M250,370 L69.29926190392084,428.71322893124 A190,190 0 0 1 96.28677106875998,258.32080206443015 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="137.4035291721543" y="358.1664709854137" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">HEP 12</text><path d="M250,370 L96.28677106875998,258.32080206443015 A190,190 0 0 1 191.28677106875995,189.29926190392084 Z" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><line x1="149.48872185798706" y1="231.658093961884" x2="120.68724449565588" y2="192.01626123751157" stroke="#1e2a44" stroke-width="2"/><text x="114.68724449565588" y="198.01626123751157" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">Nuclear 8</text><path d="M250,370 L191.28677106875995,189.29926190392084 A190,190 0 0 1 249.99999999999997,180 Z" fill="#6f9a52" stroke="#1e2a44" stroke-width="2.5"/><line x1="223.2497064781205" y1="201.10529375823145" x2="215.58441769114916" y2="152.70856506906972" stroke="#1e2a44" stroke-width="2"/><text x="209.58441769114916" y="158.70856506906972" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">Wind and solar 4</text><text x="250" y="615" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Total: 80 units (illustrative)</text><rect x="500" y="140" width="345" height="110" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="522" y="172" font-size="17.5" font-weight="700" fill="#1e2a44" text-anchor="start">Share from fossil fuels</text><text x="522" y="206" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">(36 + 20) ÷ 80 × 100</text><text x="825" y="236" font-size="22" font-weight="700" fill="#2e6b62" text-anchor="end">= 70%</text><rect x="500" y="268" width="345" height="110" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="522" y="300" font-size="17.5" font-weight="700" fill="#1e2a44" text-anchor="start">Share from renewables</text><text x="522" y="334" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">(12 + 4) ÷ 80 × 100</text><text x="825" y="364" font-size="22" font-weight="700" fill="#2e6b62" text-anchor="end">= 20%</text><rect x="500" y="396" width="345" height="110" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="522" y="428" font-size="17.5" font-weight="700" fill="#1e2a44" text-anchor="start">Pie chart angle for coal</text><text x="522" y="462" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">36 ÷ 80 × 360</text><text x="825" y="492" font-size="22" font-weight="700" fill="#2e6b62" text-anchor="end">= 162°</text><text x="500" y="545" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Wind could replace coal: cleaner, but</text><text x="500" y="566" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">output varies and needs back-up such as</text><text x="500" y="587" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">gas or HEP.</text>
</svg>