<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" width="900" height="660" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="660" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Nuclear power: how it works, how to judge it</text>

<rect x="30" y="115" width="192" height="92" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="126" y="158" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="middle">Uranium atoms</text><text x="126" y="179" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="middle">split, giving heat</text><line x1="225" y1="161" x2="243" y2="161" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="246" y="115" width="192" height="92" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="342" y="158" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="middle">Heat boils water</text><text x="342" y="179" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="middle">to steam</text><line x1="441" y1="161" x2="459" y2="161" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="462" y="115" width="192" height="92" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="558" y="158" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="middle">Steam drives</text><text x="558" y="179" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="middle">turbines</text><line x1="657" y1="161" x2="675" y2="161" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="678" y="115" width="192" height="92" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="774" y="158" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="middle">Generators make</text><text x="774" y="179" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="middle">electricity</text><rect x="30" y="232" width="410" height="300" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="55" y="270" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="start">+ Benefits</text><text x="55" y="306" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="71" y="306" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">Very large, steady output, whatever the</text><text x="71" y="327" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">weather</text><text x="55" y="360" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="71" y="360" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">Very low CO₂ emissions while operating</text><text x="55" y="393" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="71" y="393" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">A little fuel gives a lot of energy</text><text x="55" y="426" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="71" y="426" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">Less dependence on imported oil and gas</text><rect x="460" y="232" width="410" height="300" rx="14" fill="#f6e6dc" stroke="#b5602e" stroke-width="2.5"/><text x="485" y="270" font-size="21" font-weight="700" fill="#b5602e" text-anchor="start">– Disadvantages</text><text x="485" y="306" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="501" y="306" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">Very high building and decommissioning</text><text x="501" y="327" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">costs; long build times</text><text x="485" y="360" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="501" y="360" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">Radioactive waste dangerous for</text><text x="501" y="381" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">thousands of years</text><text x="485" y="414" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="501" y="414" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">Rare but severe accidents: Chernobyl</text><text x="501" y="435" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">(1986), Fukushima (2011)</text><text x="485" y="468" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="501" y="468" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">Needs high skill, strict regulation;</text><text x="501" y="489" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">public opposition</text><rect x="30" y="552" width="840" height="84" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="55" y="586" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Its drawbacks are cost, waste and accident risk, not the weather.</text><text x="55" y="614" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">France generates most of its electricity from nuclear: the scale a wealthy country can reach.</text>
</svg>