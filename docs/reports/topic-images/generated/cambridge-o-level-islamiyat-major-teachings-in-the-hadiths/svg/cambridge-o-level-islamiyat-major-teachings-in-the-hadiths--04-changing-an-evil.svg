<rect width="900" height="642" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Hand, tongue, heart</text>

<text x="450" y="132" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle" font-style="italic">"Whoever sees an evil, let him change it with his hand, then his tongue, then his heart"</text><rect x="30" y="160" width="840" height="104" rx="14" fill="#b5d3cf" stroke="#2e6b62" stroke-width="3"/><circle cx="80" cy="212" r="26" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="80" y="221.36" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="128" y="206" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="start">Hand</text><text x="128" y="238" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Change it by action</text><rect x="120" y="284" width="660" height="104" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="3"/><circle cx="170" cy="336" r="26" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="170" y="345.36" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="218" y="330" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="start">Tongue</text><text x="218" y="362" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Then by speaking out</text><rect x="210" y="408" width="480" height="104" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="3"/><circle cx="260" cy="460" r="26" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="260" y="469.36" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="308" y="454" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="start">Heart</text><text x="308" y="486" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Then within the heart</text><rect x="30" y="548" width="840" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="590" font-size="19" font-weight="600" fill="#1e2a44" text-anchor="middle">Every Muslim is responsible for society, according to ability.</text>
</svg>