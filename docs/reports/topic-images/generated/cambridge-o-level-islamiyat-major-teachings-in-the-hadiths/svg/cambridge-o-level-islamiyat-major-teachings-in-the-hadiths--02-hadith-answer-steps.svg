<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Writing a high-scoring Hadith answer</text>

<rect x="30" y="112" width="840" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="80" cy="160" r="26" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><text x="80" y="169.36" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="130" y="168" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="start">Identify</text><text x="270" y="166" font-size="18" font-weight="400" fill="#4a5568" text-anchor="start">the teaching in one sentence, using a key phrase from the Hadith</text><rect x="30" y="224" width="840" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="80" cy="272" r="26" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><text x="80" y="281.36" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="130" y="280" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="start">Explain</text><text x="270" y="278" font-size="18" font-weight="400" fill="#4a5568" text-anchor="start">what belief or attitude lies behind it</text><rect x="30" y="336" width="840" height="96" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><circle cx="80" cy="384" r="26" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="80" y="393.36" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="130" y="392" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="start">Apply</text><text x="270" y="390" font-size="18" font-weight="400" fill="#4a5568" text-anchor="start">it with a specific modern example</text><rect x="30" y="448" width="840" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="80" cy="496" r="26" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><text x="80" y="505.36" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="130" y="504" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="start">Support</text><text x="270" y="490" font-size="18" font-weight="400" fill="#4a5568" text-anchor="start">with a related Qur'an verse or Hadith, such as 49.10 on</text><text x="270" y="514" font-size="18" font-weight="400" fill="#4a5568" text-anchor="start">brotherhood or 2.177 on giving to orphans and the needy</text><rect x="30" y="566" width="840" height="64" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="606" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Four passages set, two answered, 8 marks in total.</text>
</svg>