<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 906" width="900" height="906" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="906" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The set Hadiths in six themes</text>

<rect x="30" y="110" width="414" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="62" cy="142" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="148.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="92" y="149" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">What true faith looks like</text><circle cx="54" cy="182" r="4.5" fill="#1e2a44"/><text x="68" y="188" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Religion is sincerity</text><circle cx="54" cy="209" r="4.5" fill="#1e2a44"/><text x="68" y="215" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Want for your brother what you want for yourself</text><circle cx="54" cy="236" r="4.5" fill="#1e2a44"/><text x="68" y="242" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Obligations done faithfully: "Yes"</text><circle cx="54" cy="263" r="4.5" fill="#1e2a44"/><text x="68" y="269" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Hearts and deeds, not forms</text><rect x="40" y="290" width="394" height="60" rx="10" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2"/><text x="52" y="314" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Use:</text><text x="92" y="314" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">intention in worship, honest friendship,</text><text x="92" y="334" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">avoiding showing off</text><rect x="456" y="110" width="414" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="488" cy="142" r="18" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><text x="488" y="148.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="518" y="149" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Speech and behaviour</text><circle cx="480" cy="182" r="4.5" fill="#1e2a44"/><text x="494" y="188" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Speak good or keep silent</text><circle cx="480" cy="209" r="4.5" fill="#1e2a44"/><text x="494" y="215" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Modesty produces nothing but good</text><circle cx="480" cy="236" r="4.5" fill="#1e2a44"/><text x="494" y="242" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The mustard seed</text><circle cx="480" cy="263" r="4.5" fill="#1e2a44"/><text x="494" y="269" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The world is the believer's prison</text><rect x="466" y="290" width="394" height="60" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="478" y="314" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Use:</text><text x="518" y="314" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">avoiding gossip and social-media insults,</text><text x="518" y="334" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">humility, patience</text><rect x="30" y="372" width="414" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="62" cy="404" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="410.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="92" y="411" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Charity and good work</text><circle cx="54" cy="444" r="4.5" fill="#1e2a44"/><text x="68" y="450" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Every joint must perform a charity</text><circle cx="54" cy="471" r="4.5" fill="#1e2a44"/><text x="68" y="477" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Eating from the work of one's hand</text><circle cx="54" cy="498" r="4.5" fill="#1e2a44"/><text x="68" y="504" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Striving with person and property</text><rect x="40" y="552" width="394" height="60" rx="10" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2"/><text x="52" y="576" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Use:</text><text x="92" y="576" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">volunteering, clearing litter, honest work,</text><text x="92" y="596" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">donating</text><rect x="456" y="372" width="414" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="488" cy="404" r="18" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><text x="488" y="410.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="518" y="411" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Treating the vulnerable</text><circle cx="480" cy="444" r="4.5" fill="#1e2a44"/><text x="494" y="450" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The widow and the poor</text><circle cx="480" cy="471" r="4.5" fill="#1e2a44"/><text x="494" y="477" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Bringing up an orphan</text><circle cx="480" cy="498" r="4.5" fill="#1e2a44"/><text x="494" y="504" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Mercy to others</text><rect x="466" y="552" width="394" height="60" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="478" y="576" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Use:</text><text x="518" y="576" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">orphan sponsorship, visiting the elderly,</text><text x="518" y="596" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">kindness to animals</text><rect x="30" y="634" width="414" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="62" cy="666" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="672.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="92" y="673" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Community and leaders</text><circle cx="54" cy="706" r="4.5" fill="#1e2a44"/><text x="68" y="712" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Change an evil: hand, tongue, heart</text><circle cx="54" cy="733" r="4.5" fill="#1e2a44"/><text x="68" y="739" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The believers are like a single man</text><circle cx="54" cy="760" r="4.5" fill="#1e2a44"/><text x="68" y="766" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Be gentle, do not be hard</text><circle cx="54" cy="787" r="4.5" fill="#1e2a44"/><text x="68" y="793" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Kindly in selling, buying, repayment</text><rect x="40" y="814" width="394" height="60" rx="10" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2"/><text x="52" y="838" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Use:</text><text x="92" y="838" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">standing up to injustice, fair business,</text><text x="92" y="858" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">gentle teaching</text><rect x="456" y="634" width="414" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="488" cy="666" r="18" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><text x="488" y="672.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">6</text><text x="518" y="673" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Knowledge and martyrdom</text><circle cx="480" cy="706" r="4.5" fill="#1e2a44"/><text x="494" y="712" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Studying the Qur'an: tethered camels</text><circle cx="480" cy="733" r="4.5" fill="#1e2a44"/><text x="494" y="739" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The many kinds of martyr</text><rect x="466" y="814" width="394" height="60" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="478" y="838" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Key:</text><text x="518" y="838" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Qur'an knowledge must be maintained;</text><text x="518" y="858" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">martyrdom is wider than battle</text>
</svg>