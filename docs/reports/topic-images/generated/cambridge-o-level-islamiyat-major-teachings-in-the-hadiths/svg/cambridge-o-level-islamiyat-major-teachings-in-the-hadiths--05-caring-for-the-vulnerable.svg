<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 542" width="900" height="542" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="542" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Caring for the vulnerable</text>

<rect x="30" y="112" width="230" height="126" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="145" y="169.5" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">The widow and the</text><text x="145" y="194.5" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">poor</text><rect x="272" y="112" width="360" height="126" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="290" y="159" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Managing their affairs is like</text><text x="290" y="181" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">striving in the way of Allah, praying</text><text x="290" y="203" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">at night or fasting by day.</text><line x1="634" y1="175" x2="652" y2="175" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="656" y="112" width="214" height="126" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="763" y="169.95" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">ranked with devoted</text><text x="763" y="191.95" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">worship</text><rect x="30" y="252" width="230" height="126" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="145" y="322" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">The orphan</text><rect x="272" y="252" width="360" height="126" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="290" y="299" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">"I and the one who brings up an orphan</text><text x="290" y="321" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">will be in paradise like this": two</text><text x="290" y="343" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">fingers held together.</text><line x1="634" y1="315" x2="652" y2="315" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="656" y="252" width="214" height="126" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="763" y="298.95" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">closeness to the</text><text x="763" y="320.95" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Prophet (pbuh),</text><text x="763" y="342.95" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">himself an orphan</text><rect x="30" y="392" width="230" height="126" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="145" y="462" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Everyone</text><rect x="272" y="392" width="360" height="126" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="290" y="450" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">"God will not show mercy to him who</text><text x="290" y="472" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">does not show mercy to others."</text><line x1="634" y1="455" x2="652" y2="455" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="656" y="392" width="214" height="126" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="763" y="438.95" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">mercy given is the</text><text x="763" y="460.95" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">condition for mercy</text><text x="763" y="482.95" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">received</text>
</svg>