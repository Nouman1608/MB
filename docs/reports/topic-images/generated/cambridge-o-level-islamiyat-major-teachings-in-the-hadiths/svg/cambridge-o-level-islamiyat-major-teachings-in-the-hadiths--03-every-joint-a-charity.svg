<rect width="900" height="622" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Charity in everyday acts</text>

<rect x="150" y="108" width="600" height="76" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="3"/><text x="450" y="142" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">"Every joint must perform a charity every day"</text><text x="450" y="170" font-size="17" font-weight="600" fill="#8a6d0d" text-anchor="middle">charity is wider than giving money</text><rect x="30" y="232" width="272" height="112" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="166" y="294.65" font-size="19" font-weight="600" fill="#1e2a44" text-anchor="middle">Justice between people</text><rect x="314" y="232" width="272" height="112" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="282.15" font-size="19" font-weight="600" fill="#1e2a44" text-anchor="middle">Helping someone with</text><text x="450" y="307.15" font-size="19" font-weight="600" fill="#1e2a44" text-anchor="middle">their mount or luggage</text><rect x="598" y="232" width="272" height="112" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="734" y="294.65" font-size="19" font-weight="600" fill="#1e2a44" text-anchor="middle">A good word</text><rect x="172" y="372" width="272" height="112" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="308" y="434.65" font-size="19" font-weight="600" fill="#1e2a44" text-anchor="middle">Every step to prayer</text><rect x="456" y="372" width="272" height="112" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="592" y="422.15" font-size="19" font-weight="600" fill="#1e2a44" text-anchor="middle">Removing harm from the</text><text x="592" y="447.15" font-size="19" font-weight="600" fill="#1e2a44" text-anchor="middle">road</text><path d="M450,186 L450,208 L166,208 L166,228" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M450,208 L734,208 L734,228" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M450,186 L450,228" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="30" y="514" width="840" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="56" y="548" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Exam use:</text><text x="158" y="548" font-size="18" font-weight="400" fill="#4a5568" text-anchor="start">volunteering, clearing litter, part-time honest work</text><text x="158" y="576" font-size="18" font-weight="400" fill="#4a5568" text-anchor="start">and donating to charities.</text>
</svg>