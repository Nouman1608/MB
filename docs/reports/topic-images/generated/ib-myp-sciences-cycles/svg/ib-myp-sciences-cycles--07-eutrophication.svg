62" width="300" height="12" fill="#6f9a52"/><path d="M110,334 q-8,-20 0,-36 M110,334 q8,-16 2,-30" fill="none" stroke="#6f9a52" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><path d="M240,334 q-8,-20 0,-36 M240,334 q8,-16 2,-30" fill="none" stroke="#6f9a52" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><g transform="translate(300,302) "><ellipse cx="0" cy="0" rx="16" ry="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><path d="M14,0 L26,-8 L26,8 Z" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/></g><rect x="372" y="254" width="18" height="72" rx="4" fill="#fff" stroke="#1e2a44" stroke-width="2"/><rect x="372" y="254" width="18" height="72" rx="4" fill="#2e6b62"/><text x="381" y="342" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">O₂</text><circle cx="440" cy="290" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="440" y="297.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="480" y="282" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Algae grow fast</text><text x="480" y="312" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">They cover the water surface.</text><rect x="30" y="358" width="840" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="50" y="392" width="300" height="66" fill="#b5d3cf"/><line x1="50" y1="392" x2="350" y2="392" stroke="#2e6b62" stroke-width="2.5"/><rect x="50" y="386" width="300" height="12" fill="#6f9a52"/><path d="M110,458 q-8,-20 0,-36 M110,458 q8,-16 2,-30" fill="none" stroke="#8a6d4a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><path d="M240,458 q-8,-20 0,-36 M240,458 q8,-16 2,-30" fill="none" stroke="#8a6d4a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><g transform="translate(300,426) "><ellipse cx="0" cy="0" rx="16" ry="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><path d="M14,0 L26,-8 L26,8 Z" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/></g><rect x="372" y="378" width="18" height="72" rx="4" fill="#fff" stroke="#1e2a44" stroke-width="2"/><rect x="372" y="385.2" width="18" height="64.8" rx="4" fill="#2e6b62"/><text x="381" y="466" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">O₂</text><circle cx="440" cy="414" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="440" y="421.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="480" y="406" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Water plants die</text><text x="480" y="436" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Light cannot reach them.</text><rect x="30" y="482" width="840" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="50" y="516" width="300" height="66" fill="#b5d3cf"/><line x1="50" y1="516" x2="350" y2="516" stroke="#2e6b62" stroke-width="2.5"/><rect x="50" y="510" width="300" height="12" fill="#6f9a52"/><path d="M110,582 q-8,-20 0,-36 M110,582 q8,-16 2,-30" fill="none" stroke="#8a6d4a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><path d="M240,582 q-8,-20 0,-36 M240,582 q8,-16 2,-30" fill="none" stroke="#8a6d4a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><circle cx="150" cy="552" r="4" fill="#b5602e"/><circle cx="175" cy="562" r="4" fill="#b5602e"/><circle cx="200" cy="548" r="4" fill="#b5602e"/><circle cx="290" cy="556" r="4" fill="#b5602e"/><circle cx="310" cy="564" r="4" fill="#b5602e"/><g transform="translate(300,550) "><ellipse cx="0" cy="0" rx="16" ry="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><path d="M14,0 L26,-8 L26,8 Z" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/></g><rect x="372" y="502" width="18" height="72" rx="4" fill="#fff" stroke="#1e2a44" stroke-width="2"/><rect x="372" y="541.6" width="18" height="32.4" rx="4" fill="#2e6b62"/><text x="381" y="590" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">O₂</text><circle cx="440" cy="538" r="22" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="440" y="545.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="480" y="530" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Decomposers use up oxygen</text><text x="480" y="560" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">They respire as they break down dead matter.</text><rect x="30" y="606" width="840" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="50" y="640" width="300" height="66" fill="#b5d3cf"/><line x1="50" y1="640" x2="350" y2="640" stroke="#2e6b62" stroke-width="2.5"/><rect x="50" y="634" width="300" height="12" fill="#6f9a52"/><path d="M110,706 q-8,-20 0,-36 M110,706 q8,-16 2,-30" fill="none" stroke="#8a6d4a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><path d="M240,706 q-8,-20 0,-36 M240,706 q8,-16 2,-30" fill="none" stroke="#8a6d4a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><g transform="translate(300,654) scale(1,-1)"><ellipse cx="0" cy="0" rx="16" ry="8" fill="#c9c9c9" stroke="#1e2a44" stroke-width="2"/><path d="M14,0 L26,-8 L26,8 Z" fill="#c9c9c9" stroke="#1e2a44" stroke-width="2"/></g><rect x="372" y="626" width="18" height="72" rx="4" fill="#fff" stroke="#1e2a44" stroke-width="2"/><rect x="372" y="689.36" width="18" height="8.64" rx="4" fill="#2e6b62"/><text x="381" y="714" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">O₂</text><circle cx="440" cy="662" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="440" y="669.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="480" y="654" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Fish and other animals die</text><text x="480" y="684" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">There is too little dissolved oxygen.</text>
