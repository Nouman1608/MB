<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 750" width="900" height="750" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="750" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The rock cycle</text>

<rect x="335" y="123" width="230" height="84" rx="12" fill="#efdfa8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="162" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Sediments</text><text x="450" y="185" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">broken rock fragments</text><rect x="625" y="318" width="230" height="84" rx="12" fill="#efe2c4" stroke="#8a6d0d" stroke-width="2.5"/><text x="740" y="357" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Sedimentary rock</text><text x="740" y="380" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">sandstone, limestone, shale</text><rect x="625" y="568" width="230" height="84" rx="12" fill="#d9d4e6" stroke="#1e2a44" stroke-width="2.5"/><text x="740" y="607" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Metamorphic rock</text><text x="740" y="630" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">marble, slate</text><rect x="45" y="568" width="230" height="84" rx="12" fill="#f3c2a3" stroke="#b5602e" stroke-width="2.5"/><text x="160" y="607" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Magma</text><text x="160" y="630" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">molten rock</text><rect x="45" y="318" width="230" height="84" rx="12" fill="#d6d6d6" stroke="#1e2a44" stroke-width="2.5"/><text x="160" y="357" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Igneous rock</text><text x="160" y="380" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">granite, basalt</text><line x1="215" y1="315" x2="335" y2="205" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="40" y="225" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">weathering,</text><text x="40" y="246" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">erosion and</text><text x="40" y="267" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">transport</text><text x="40" y="290" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Sun and gravity</text><line x1="565" y1="205" x2="685" y2="315" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="660" y="215" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">deposition,</text><text x="660" y="236" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">compaction and</text><text x="660" y="257" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">cementation</text><line x1="740" y1="405" x2="740" y2="565" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="728" y="470" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">heat and pressure</text><text x="728" y="492" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">without melting</text><line x1="622" y1="610" x2="278" y2="610" stroke="#b5602e" stroke-width="3.5" marker-end="url(#ahR)"/><text x="450" y="596" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">melting</text><text x="450" y="636" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Earth’s internal heat</text><line x1="160" y1="565" x2="160" y2="405" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="172" y="470" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">cooling and</text><text x="172" y="492" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">crystallising</text><rect x="305" y="270" width="255" height="230" rx="14" fill="#fff" stroke="#c9d6d4" stroke-width="2.5"/><text x="432" y="302" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Igneous crystals</text><text x="322" y="332" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Intrusive (granite): slow</text><text x="322" y="352" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">cooling underground,</text><text x="322" y="372" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">large crystals.</text><text x="322" y="392" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Extrusive (basalt): fast</text><text x="322" y="412" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">cooling at the surface,</text><text x="322" y="432" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">small crystals.</text><text x="450" y="700" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Uplift brings buried rock back to the surface to be weathered.</text><text x="450" y="726" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Limestone → marble and shale → slate are metamorphic changes.</text>
</svg>