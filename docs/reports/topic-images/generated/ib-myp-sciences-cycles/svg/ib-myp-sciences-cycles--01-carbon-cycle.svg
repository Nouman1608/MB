<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 835" width="900" height="835" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="835" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The carbon cycle</text>

<rect x="30" y="110" width="840" height="70" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="153" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Atmosphere: carbon dioxide</text><rect x="30" y="400" width="148" height="90" rx="12" fill="#d6e6f2" stroke="#2b5a9a" stroke-width="2.5"/><text x="104" y="442" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Oceans</text><text x="104" y="465" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">dissolved CO₂</text><rect x="203" y="400" width="148" height="90" rx="12" fill="#dfe9d3" stroke="#6f9a52" stroke-width="2.5"/><text x="277" y="442" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Plants</text><text x="277" y="465" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">and algae</text><rect x="376" y="400" width="148" height="90" rx="12" fill="#fff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="442" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Animals</text><text x="450" y="465" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">carbon compounds</text><rect x="549" y="400" width="148" height="90" rx="12" fill="#efdfa8" stroke="#8a6d0d" stroke-width="2.5"/><text x="623" y="442" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Dead matter</text><text x="623" y="465" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">in soil, waste</text><rect x="722" y="400" width="148" height="90" rx="12" fill="#d9d4c7" stroke="#1e2a44" stroke-width="2.5"/><text x="796" y="442" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Fossil fuels</text><text x="796" y="465" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">coal, oil, gas</text><line x1="104" y1="186" x2="104" y2="394" stroke="#2b5a9a" stroke-width="3.2" marker-start="url(#ah)" marker-end="url(#ah)"/><rect x="49" y="272" width="110" height="26" rx="6" fill="#f4f6f6"/><text x="104" y="290" font-size="16" font-weight="700" fill="#2b5a9a" text-anchor="middle">dissolving</text><line x1="222" y1="186" x2="222" y2="394" stroke="#2e6b62" stroke-width="3.2" marker-end="url(#ahT)"/><rect x="147.8" y="227" width="148.4" height="26" rx="6" fill="#f4f6f6"/><text x="222" y="245" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">photosynthesis</text><line x1="332" y1="396" x2="332" y2="188" stroke="#b5602e" stroke-width="3.2" marker-end="url(#ahR)"/><rect x="272.2" y="322" width="119.6" height="26" rx="6" fill="#f4f6f6"/><text x="332" y="340" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">respiration</text><line x1="450" y1="396" x2="450" y2="188" stroke="#b5602e" stroke-width="3.2" marker-end="url(#ahR)"/><rect x="398.2" y="252" width="119.6" height="26" rx="6" fill="#f4f6f6"/><text x="458" y="270" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">respiration</text><line x1="623" y1="396" x2="623" y2="188" stroke="#b5602e" stroke-width="3.2" marker-end="url(#ahR)"/><rect x="553.6" y="282" width="138.8" height="26" rx="6" fill="#f4f6f6"/><text x="623" y="300" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">decomposition</text><rect x="530.5" y="313" width="185" height="25" rx="6" fill="#f4f6f6"/><text x="623" y="330" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">decomposers respire</text><line x1="796" y1="396" x2="796" y2="188" stroke="#b5602e" stroke-width="3.2" marker-end="url(#ahR)"/><rect x="741" y="232" width="110" height="26" rx="6" fill="#f4f6f6"/><text x="796" y="250" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">combustion</text><path d="M297,494 Q363.5,560 430,498" fill="none" stroke="#1e2a44" stroke-width="3.2" marker-end="url(#ah)"/><text x="363.5" y="546" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">feeding</text><path d="M257,494 Q450,720 593,498" fill="none" stroke="#1e2a44" stroke-width="3.2" marker-end="url(#ah)"/><path d="M470,494 Q536.5,560 618,498" fill="none" stroke="#1e2a44" stroke-width="3.2" marker-end="url(#ah)"/><text x="460" y="632" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">death and waste</text><path d="M643,494 Q709.5,560 776,498" fill="none" stroke="#1e2a44" stroke-width="3.2" marker-end="url(#ah)"/><text x="709.5" y="562" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">fossilisation</text><text x="709.5" y="582" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">millions of years</text><rect x="30" y="665" width="840" height="140" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="55" y="705" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Photosynthesis</text><text x="220" y="705" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">carbon dioxide + water → glucose + oxygen</text><text x="845" y="705" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">light, chlorophyll</text><text x="55" y="745" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">Respiration</text><text x="220" y="745" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">glucose + oxygen → carbon dioxide + water</text><text x="845" y="745" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">energy released</text><text x="55" y="783" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Also a store: sedimentary rocks such as limestone (calcium carbonate).</text>
</svg>