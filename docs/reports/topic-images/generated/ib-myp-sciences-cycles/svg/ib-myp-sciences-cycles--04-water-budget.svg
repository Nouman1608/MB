<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="540" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A catchment water budget</text>

<rect x="30" y="110" width="840" height="400" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="155" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Precipitation in: 1,100 mm per year</text><rect x="60" y="200" width="770" height="60" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="445" y="237" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">precipitation 1,100</text><rect x="60" y="330" width="454.99999999999994" height="60" fill="#f0c7ad" stroke="#1e2a44" stroke-width="2.5"/><text x="287.5" y="367" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">evapotranspiration 650</text><rect x="515" y="330" width="210" height="60" fill="#c9d3e6" stroke="#1e2a44" stroke-width="2.5"/><text x="620" y="367" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">runoff 300</text><rect x="725" y="330" width="105" height="60" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="777.5" y="367" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">150</text><text x="777.5" y="416" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">recharge</text><text x="60" y="305" font-size="18" font-weight="600" fill="#4a5568" text-anchor="start">Outputs (mm), no change in soil water storage</text><line x1="445" y1="264" x2="445" y2="285" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="60" y="445" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Recharge = 1,100 − 650 − 300 = 150 mm</text><text x="60" y="478" font-size="18" font-weight="400" fill="#4a5568" text-anchor="start">Evapotranspiration share = 650 ÷ 1,100 × 100 = 59.1%</text>
</svg>