<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" width="900" height="720" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="720" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The water cycle</text>

<rect x="30" y="110" width="840" height="560" rx="14" fill="#e6f0f4"/><circle cx="110" cy="175" r="38" fill="#d4b02e" stroke="#8a6d0d" stroke-width="3"/><path d="M330,470 L420,452 Q540,438 620,390 L760,250 L870,300 L870,670 L330,670 Z" fill="#d8e3c6" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><path d="M330,560 Q600,540 870,520 L870,640 Q600,650 330,640 Z" fill="#cbbf9f" opacity="0.9"/><text x="860" y="630" font-size="15" font-weight="600" fill="#8a6d0d" text-anchor="end">permeable rock</text><rect x="30" y="470" width="320" height="200" fill="#b5d3cf"/><text x="120" y="640" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">sea</text><rect x="451" y="416" width="8" height="30" fill="#7a5a3a"/><circle cx="455" cy="404" r="22" fill="#6f9a52" stroke="#1e2a44" stroke-width="2"/><rect x="496" y="410" width="8" height="30" fill="#7a5a3a"/><circle cx="500" cy="398" r="22" fill="#6f9a52" stroke="#1e2a44" stroke-width="2"/><rect x="541" y="398" width="8" height="30" fill="#7a5a3a"/><circle cx="545" cy="386" r="22" fill="#6f9a52" stroke="#1e2a44" stroke-width="2"/><path d="M560,205 q-10,-40 35,-42 q15,-35 60,-20 q35,-20 60,10 q40,0 35,40 Z" fill="#fff" stroke="#1e2a44" stroke-width="2.5"/><line x1="610" y1="220" x2="600" y2="262" stroke="#2b5a9a" stroke-width="2.5"/><line x1="632" y1="220" x2="622" y2="262" stroke="#2b5a9a" stroke-width="2.5"/><line x1="654" y1="220" x2="644" y2="262" stroke="#2b5a9a" stroke-width="2.5"/><line x1="676" y1="220" x2="666" y2="262" stroke="#2b5a9a" stroke-width="2.5"/><line x1="698" y1="220" x2="688" y2="262" stroke="#2b5a9a" stroke-width="2.5"/><line x1="720" y1="220" x2="710" y2="262" stroke="#2b5a9a" stroke-width="2.5"/><line x1="200" y1="455" x2="240" y2="290" stroke="#b5602e" stroke-width="3.5" marker-end="url(#ahR)"/><rect x="40.400000000000006" y="362" width="119.6" height="26" rx="6" fill="#e6f0f4"/><text x="154" y="380" font-size="16" font-weight="700" fill="#b5602e" text-anchor="end">evaporation</text><text x="150" y="402" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">Sun supplies energy</text><line x1="500" y1="380" x2="520" y2="245" stroke="#6f9a52" stroke-width="3.5" marker-end="url(#ahT)"/><rect x="301.2" y="282" width="138.8" height="26" rx="6" fill="#e6f0f4"/><text x="434" y="300" font-size="16" font-weight="700" fill="#3d5f2a" text-anchor="end">transpiration</text><text x="434" y="322" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">from leaves</text><path d="M250,270 Q380,170 545,185" fill="none" stroke="#1e2a44" stroke-width="3.2" marker-end="url(#ah)"/><rect x="198.2" y="150" width="263.6" height="26" rx="6" fill="#e6f0f4"/><text x="330" y="168" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">condensation: vapour cools</text><text x="330" y="190" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">into cloud droplets</text><line x1="700" y1="268" x2="700" y2="330" stroke="#2b5a9a" stroke-width="3.5" marker-end="url(#ah)"/><rect x="720.6" y="192" width="138.8" height="26" rx="6" fill="#e6f0f4"/><text x="790" y="210" font-size="16" font-weight="700" fill="#2b5a9a" text-anchor="middle">precipitation</text><path d="M640,395 Q560,445 400,462" fill="none" stroke="#2b5a9a" stroke-width="3.2" marker-end="url(#ah)"/><rect x="485.8" y="462" width="148.4" height="26" rx="6" fill="#d8e3c6"/><text x="560" y="480" font-size="16" font-weight="700" fill="#2b5a9a" text-anchor="middle">surface runoff</text><line x1="610" y1="430" x2="610" y2="520" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><rect x="640" y="487" width="129.2" height="26" rx="6" fill="#d8e3c6"/><text x="646" y="505" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">infiltration</text><path d="M720,600 Q550,615 360,600" fill="none" stroke="#2e6b62" stroke-width="3.2" marker-end="url(#ahT)" stroke-dasharray="10 7"/><rect x="442.6" y="607" width="234.79999999999998" height="26" rx="6" fill="#cbbf9f"/><text x="560" y="625" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">groundwater flow (slow)</text><text x="450" y="700" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">The Sun drives evaporation; gravity pulls precipitation down and drives runoff and river flow.</text>
</svg>