<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" width="900" height="720" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="720" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The nitrogen cycle</text>

<rect x="30" y="110" width="840" height="70" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="153" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Nitrogen gas, N₂, in the air (about 78%)</text><rect x="30" y="420" width="140" height="80" rx="12" fill="#efdfa8" stroke="#8a6d0d" stroke-width="2.5"/><text x="100" y="457" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Ammonium</text><text x="100" y="480" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">in soil</text><rect x="263.3333333333333" y="420" width="140" height="80" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="333.3333333333333" y="457" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Nitrate</text><text x="333.3333333333333" y="480" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">in soil</text><rect x="496.66666666666663" y="420" width="140" height="80" rx="12" fill="#dfe9d3" stroke="#6f9a52" stroke-width="2.5"/><text x="566.6666666666666" y="457" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Plants</text><text x="566.6666666666666" y="480" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">proteins, DNA</text><rect x="730" y="420" width="140" height="80" rx="12" fill="#fff" stroke="#1e2a44" stroke-width="2.5"/><text x="800" y="457" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Animals</text><text x="800" y="480" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">proteins</text><rect x="263.3333333333333" y="600" width="606.6666666666667" height="70" rx="12" fill="#efe6d6" stroke="#8a6d0d" stroke-width="2.5"/><text x="566.6666666666667" y="641.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Dead matter and waste (urea)</text><line x1="100" y1="186" x2="100" y2="414" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><text x="114" y="228" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">nitrogen fixation</text><text x="114" y="252" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">bacteria in root</text><text x="114" y="271" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">nodules and soil;</text><text x="114" y="290" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Haber process</text><line x1="303.3333333333333" y1="416" x2="303.3333333333333" y2="188" stroke="#b5602e" stroke-width="3.5" marker-end="url(#ahR)"/><text x="291.3333333333333" y="350" font-size="17" font-weight="700" fill="#b5602e" text-anchor="end">denitrification</text><text x="291.3333333333333" y="372" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">oxygen-poor soil</text><line x1="373.3333333333333" y1="186" x2="373.3333333333333" y2="414" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)" stroke-dasharray="9 6"/><text x="385.3333333333333" y="228" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">lightning</text><text x="385.3333333333333" y="250" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">nitrogen oxides</text><text x="385.3333333333333" y="269" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">→ nitrate</text><line x1="174" y1="460" x2="257.3333333333333" y2="460" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="216.66666666666666" y="408" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">nitrification</text><text x="216.66666666666666" y="492" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">via nitrite;</text><text x="216.66666666666666" y="512" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">needs oxygen</text><line x1="407.3333333333333" y1="460" x2="490.66666666666663" y2="460" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="450" y="448" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">uptake</text><text x="450" y="486" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">by roots</text><line x1="640.6666666666666" y1="460" x2="724" y2="460" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="683.3333333333333" y="448" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">feeding</text><line x1="566.6666666666666" y1="504" x2="566.6666666666666" y2="594" stroke="#1e2a44" stroke-width="3.2" marker-end="url(#ah)"/><line x1="800" y1="504" x2="800" y2="594" stroke="#1e2a44" stroke-width="3.2" marker-end="url(#ah)"/><path d="M259.3333333333333,635 L100,635 L100,508" fill="none" stroke="#8a6d0d" stroke-width="3.2" marker-end="url(#ahO)"/><text x="40" y="690" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="start">decomposition (ammonification): bacteria and fungi</text>
</svg>