<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="900" height="650" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="650" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Is the forest a carbon sink?</text>

<rect x="30" y="110" width="840" height="400" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="170" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Carbon in</text><text x="60" y="192" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">t per hectare</text><rect x="230" y="150" width="600" height="50" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="530" y="182" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">photosynthesis 12.0</text><text x="60" y="260" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Carbon out</text><text x="60" y="282" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">t per hectare</text><rect x="230" y="240" width="300" height="50" fill="#f0c7ad" stroke="#1e2a44" stroke-width="2.5"/><text x="380" y="272" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">plant respiration 6.0</text><rect x="530" y="240" width="250" height="50" fill="#efdfa8" stroke="#1e2a44" stroke-width="2.5"/><text x="655" y="272" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">decomposers 5.0</text><rect x="780" y="240" width="50" height="50" fill="none" stroke="#2e6b62" stroke-width="3" stroke-dasharray="6 5"/><line x1="780" y1="140" x2="780" y2="310" stroke="#4a5568" stroke-width="1.8" stroke-dasharray="4 5"/><line x1="805" y1="340" x2="805" y2="296" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><text x="805" y="362" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">gap = +1.0 t</text><rect x="60" y="400" width="780" height="80" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="80" y="432" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">12.0 − (6.0 + 5.0) = +1.0 t of carbon per hectare per year</text><text x="80" y="462" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">More carbon enters than leaves, so the forest is a carbon sink this year.</text><rect x="30" y="530" width="840" height="90" rx="14" fill="#fbeee6" stroke="#b5602e" stroke-width="2.5"/><text x="60" y="566" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">If the forest burned:</text><text x="60" y="594" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">combustion releases stored carbon fast and photosynthesis falls, so the sink becomes a source.</text>
</svg>