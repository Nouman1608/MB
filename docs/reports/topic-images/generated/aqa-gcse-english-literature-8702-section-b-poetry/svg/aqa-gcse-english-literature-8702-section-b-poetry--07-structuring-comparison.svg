<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Two ways to structure a comparison</text>

<rect x="30" y="110" width="411" height="330" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="54" y="148" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="start">Integrated</text><text x="54" y="172" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">suits most candidates</text><rect x="54" y="200" width="363" height="46" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><rect x="62" y="208" width="60" height="30" rx="6" fill="#f2e7b8" stroke="#1e2a44" stroke-width="1.5"/><text x="92" y="228" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">A</text><rect x="128" y="208" width="60" height="30" rx="6" fill="#b5d3cf" stroke="#1e2a44" stroke-width="1.5"/><text x="158" y="228" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">B</text><text x="204" y="229" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">ideas</text><rect x="54" y="260" width="363" height="46" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><rect x="62" y="268" width="60" height="30" rx="6" fill="#f2e7b8" stroke="#1e2a44" stroke-width="1.5"/><text x="92" y="288" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">A</text><rect x="128" y="268" width="60" height="30" rx="6" fill="#b5d3cf" stroke="#1e2a44" stroke-width="1.5"/><text x="158" y="288" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">B</text><text x="204" y="289" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">form and structure</text><rect x="54" y="320" width="363" height="46" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><rect x="62" y="328" width="60" height="30" rx="6" fill="#f2e7b8" stroke="#1e2a44" stroke-width="1.5"/><text x="92" y="348" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">A</text><rect x="128" y="328" width="60" height="30" rx="6" fill="#b5d3cf" stroke="#1e2a44" stroke-width="1.5"/><text x="158" y="348" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">B</text><text x="204" y="349" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">language</text><text x="54" y="400" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Each paragraph compares both poems on one</text><text x="54" y="421" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">point.</text><rect x="459" y="110" width="411" height="330" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="483" y="148" font-size="21" font-weight="700" fill="#8a6d0d" text-anchor="start">Linked halves</text><text x="483" y="172" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">can work, with care</text><rect x="483" y="200" width="301" height="76" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="633.5" y="244" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Named poem</text><rect x="483" y="294" width="301" height="76" rx="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="633.5" y="338" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Second poem</text><path d="M784,332 C840,332 840,238 790,238" fill="none" stroke="#8a6d0d" stroke-width="3" marker-end="url(#ahO)"/><text x="483" y="400" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The second half must keep referring back,</text><text x="483" y="421" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">not just describe.</text><text x="450" y="480" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">A simple integrated plan</text><rect x="30" y="498" width="249.33333333333334" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="154.66666666666669" y="526.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Opening</text><text x="154.66666666666669" y="554.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">key similarity and</text><text x="154.66666666666669" y="575.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">difference</text><line x1="285.33333333333337" y1="546" x2="319.33333333333337" y2="546" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="325.33333333333337" y="498" width="249.33333333333334" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450.00000000000006" y="526.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">3 paragraphs</text><text x="450.00000000000006" y="554.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">ideas · form and structure</text><text x="450.00000000000006" y="575.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">· language</text><line x1="580.6666666666667" y1="546" x2="614.6666666666667" y2="546" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="620.6666666666667" y="498" width="249.33333333333334" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="745.3333333333334" y="536.9" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Conclusion</text><text x="745.3333333333334" y="565.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">weigh the poets’ attitudes</text>
