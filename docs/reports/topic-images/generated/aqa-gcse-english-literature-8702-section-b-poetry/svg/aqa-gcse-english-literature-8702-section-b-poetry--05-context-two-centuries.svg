<line x1="50" y1="136" x2="850" y2="136" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><text x="50" y="120" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">1789</text><text x="850" y="120" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">present day</text><circle cx="127.5" cy="136" r="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><line x1="127.5" y1="146" x2="127.5" y2="170" stroke="#1e2a44" stroke-width="2.5"/><circle cx="342.5" cy="136" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><line x1="342.5" y1="146" x2="342.5" y2="170" stroke="#1e2a44" stroke-width="2.5"/><circle cx="557.5" cy="136" r="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><line x1="557.5" y1="146" x2="557.5" y2="170" stroke="#1e2a44" stroke-width="2.5"/><circle cx="772.5" cy="136" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><line x1="772.5" y1="146" x2="772.5" y2="170" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="170" width="195" height="120" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="127.5" y="220.9" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Romantic</text><text x="127.5" y="249.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">nature and feeling</text><rect x="245" y="170" width="195" height="120" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="342.5" y="220.9" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Victorian</text><text x="342.5" y="249.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">duty and empire</text><rect x="460" y="170" width="195" height="120" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="557.5" y="198.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">20th-century</text><text x="557.5" y="222.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">wars</text><text x="557.5" y=