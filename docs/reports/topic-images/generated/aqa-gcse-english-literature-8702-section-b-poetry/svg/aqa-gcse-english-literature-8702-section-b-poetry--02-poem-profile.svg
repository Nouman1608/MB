<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 574" width="900" height="574" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="574" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A profile for every poem</text>

<rect x="30" y="110" width="411" height="104" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="66" cy="162" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="66" y="169.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="100" y="156" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">What it is about</text><text x="100" y="182" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">and who is speaking</text><rect x="459" y="110" width="411" height="104" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="495" cy="162" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="495" y="169.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="529" y="156" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Central idea or attitude</text><text x="529" y="182" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">and whether it shifts</text><rect x="30" y="228" width="411" height="104" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="66" cy="280" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="66" y="287.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="100" y="263" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Its form</text><text x="100" y="289" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">sonnet, dramatic monologue, free</text><text x="100" y="310" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">verse, ballad, lyric…</text><rect x="459" y="228" width="411" height="104" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="495" cy="280" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="495" y="287.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="529" y="263" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">2–3 structural features</text><text x="529" y="289" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">stanza pattern, rhyme, a turning</text><text x="529" y="310" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">point, the ending</text><rect x="30" y="346" width="411" height="104" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="66" cy="398" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="66" y="405.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="100" y="392" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">3–4 short quotations</text><text x="100" y="418" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">with a method attached to each</text><rect x="459" y="346" width="411" height="104" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="495" cy="398" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="495" y="405.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">6</text><text x="529" y="392" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">One context point</text><text x="529" y="418" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">that genuinely explains something</text><rect x="30" y="470" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="503.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Any of the fifteen can be named, so be able to say each of these in a sentence or two for</text><text x="50" y="525.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">every poem.</text>
</svg>