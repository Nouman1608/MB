<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 664" width="900" height="664" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="664" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Poetic methods worth analysing</text>

<rect x="30" y="110" width="220" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="42" y="140" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Area</text><rect x="250" y="110" width="620" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="262" y="140" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">What to look for</text><rect x="30" y="156" width="220" height="66" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="182.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Voice</text><rect x="250" y="156" width="620" height="66" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="262" y="182.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">First person, a persona, an addressee (“you”), a shift in who</text><text x="262" y="204.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">speaks.</text><rect x="30" y="222" width="220" height="66" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="248.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Form</text><rect x="250" y="222" width="620" height="66" fill="#fbf8ea" stroke="#1e2a44" stroke-width="2"/><text x="262" y="248.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Sonnet (a turn or volta), dramatic monologue (revealing more than</text><text x="262" y="270.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">intended), free verse, ballad.</text><rect x="30" y="288" width="220" height="44" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="314.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Metre and rhythm</text><rect x="250" y="288" width="620" height="44" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="262" y="314.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Regular: control or ritual. Disrupted: tension or breakdown.</text><rect x="30" y="332" width="220" height="66" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="358.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Rhyme</text><rect x="250" y="332" width="620" height="66" fill="#fbf8ea" stroke="#1e2a44" stroke-width="2"/><text x="262" y="358.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Full: harmony or closure. Half: unease. None: naturalness or loss of</text><text x="262" y="380.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">order.</text><rect x="30" y="398" width="220" height="66" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="424.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Line and stanza</text><rect x="250" y="398" width="620" height="66" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="262" y="424.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Enjambment: flow or overflow. Caesura: interruption. Breaks: pauses</text><text x="262" y="446.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">or shifts in time.</text><rect x="30" y="464" width="220" height="66" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="490.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Imagery</text><rect x="250" y="464" width="620" height="66" fill="#fbf8ea" stroke="#1e2a44" stroke-width="2"/><text x="262" y="490.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Metaphor, simile, personification, symbolism, especially when they</text><text x="262" y="512.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">recur or develop.</text><rect x="30" y="530" width="220" height="66" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="556.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Sound</text><rect x="250" y="530" width="620" height="66" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="262" y="556.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Alliteration, sibilance, assonance, onomatopoeia, used to create</text><text x="262" y="578.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">mood.</text><rect x="30" y="596" width="220" height="44" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="622.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Endings</text><rect x="250" y="596" width="620" height="44" fill="#fbf8ea" stroke="#1e2a44" stroke-width="2"/><text x="262" y="622.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Resolution, a twist, an open question, a return to the opening.</text>
</svg>