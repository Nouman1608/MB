<text x="648" y="441.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">gold marks are poems you</text><text x="648" y="462.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">could compare it with.</text><text x="450" y="670" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">A good second poem offers…</text><rect x="30" y="684" width="269.3333333333333" height="99" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="164.66666666666666" y="724.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">A clear link</text><text x="164.66666666666666" y="752.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">to the question’s idea</text><rect x="315.3333333333333" y="684" width="269.3333333333333" height="99" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="712.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">A similarity and a</text><text x="450" y="736.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">difference</text><text x="450" y="764.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">in method or attitude</text><rect x="600.6666666666666" y="684" width="269.3333333333333" height="99" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="735.3333333333333" y="724.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Quotations</text><text x="735.3333333333333" y="752.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">you can recall accurately</text>
