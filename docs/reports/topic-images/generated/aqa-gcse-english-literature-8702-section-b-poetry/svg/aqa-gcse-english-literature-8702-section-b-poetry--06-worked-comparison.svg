<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 625" width="900" height="625" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="625" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Comparing two poems on memory</text>

<rect x="30" y="110" width="330" height="56" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="195" y="145" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">A: “The Allotment”</text><rect x="540" y="110" width="330" height="56" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="705" y="145" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">B: “Inventory”</text><text x="450" y="145" font-size="18" font-weight="700" fill="#4a5568" text-anchor="middle">memory</text><rect x="30" y="180" width="330" height="68" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="206" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Objects left behind: a spade, a shed</text><rect x="540" y="180" width="330" height="68" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="556" y="206" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Objects left behind: a watch,</text><text x="556" y="227" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">glasses, cards</text><line x1="362" y1="214" x2="538" y2="214" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="206" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">Ideas</text><rect x="418.5" y="216" width="63" height="32" rx="16" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="237.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Both</text><rect x="30" y="258" width="330" height="89" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="284" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Regular rhyme and steady iambic</text><text x="46" y="305" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">rhythm: memory kept alive through</text><text x="46" y="326" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">ritual</text><rect x="540" y="258" width="330" height="89" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="556" y="284" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Short, unrhymed lines: a list, as if</text><text x="556" y="305" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">sorting possessions</text><line x1="362" y1="302.5" x2="538" y2="302.5" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="294.5" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">Form</text><rect x="386.5" y="304.5" width="127" height="32" rx="16" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="326.26" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">By contrast</text><rect x="30" y="357" width="330" height="68" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="383" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“the way he taught me”: habits</text><text x="46" y="404" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">continue in the son’s body</text><rect x="540" y="357" width="330" height="68" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="556" y="383" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The stopped watch: memory has frozen</text><line x1="362" y1="391" x2="538" y2="391" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="383" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">Meaning</text><rect x="30" y="435" width="330" height="68" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="461" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Half rhyme “weight” / “wait” hints</text><text x="46" y="482" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">at absence</text><rect x="540" y="435" width="330" height="68" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="556" y="461" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“addressed to someone else”: he</text><text x="556" y="482" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">never fully knew the dead person</text><line x1="362" y1="469" x2="538" y2="469" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="461" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">Endings</text><rect x="414" y="471" width="72" height="32" rx="16" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="492.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">while</text><rect x="30" y="521" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="554.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The comparison starts in the first sentence, every point covers method as well as meaning,</text><text x="50" y="576.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">and connectives such as “both”, “by contrast” and “while” keep the poems together.</text>
</svg>