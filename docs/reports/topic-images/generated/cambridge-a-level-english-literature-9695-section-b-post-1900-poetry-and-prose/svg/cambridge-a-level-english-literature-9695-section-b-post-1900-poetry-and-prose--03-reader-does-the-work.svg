<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Modern texts make the reader work</text>

<text x="30" y="124" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">What older texts supplied, and modern texts often withhold</text><rect x="30" y="142" width="198" height="70" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" stroke-dasharray="8 6"/><text x="129" y="184" font-size="17" font-weight="700" fill="#4a5568" text-anchor="middle">a reliable narrator</text><rect x="244" y="142" width="198" height="70" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" stroke-dasharray="8 6"/><text x="343" y="184" font-size="17" font-weight="700" fill="#4a5568" text-anchor="middle">chronological order</text><rect x="458" y="142" width="198" height="70" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" stroke-dasharray="8 6"/><text x="557" y="184" font-size="17" font-weight="700" fill="#4a5568" text-anchor="middle">a settled meaning</text><rect x="672" y="142" width="198" height="70" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" stroke-dasharray="8 6"/><text x="771" y="184" font-size="17" font-weight="700" fill="#4a5568" text-anchor="middle">a single voice</text><g transform="translate(150,318) rotate(-12)"><path d="M-30,-30 L-6,-30 a8,8 0 1 1 12,0 L30,-30 L30,-6 a8,8 0 1 1 0,12 L30,30 L-30,30 Z" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/></g><g transform="translate(240,288) rotate(10)"><path d="M-30,-30 L-6,-30 a8,8 0 1 1 12,0 L30,-30 L30,-6 a8,8 0 1 1 0,12 L30,30 L-30,30 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/></g><g transform="translate(200,378) rotate(4)"><path d="M-30,-30 L-6,-30 a8,8 0 1 1 12,0 L30,-30 L30,-6 a8,8 0 1 1 0,12 L30,30 L-30,30 Z" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/></g><line x1="300" y1="333" x2="380" y2="333" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><g transform="translate(430,303) rotate(0)"><path d="M-30,-30 L-6,-30 a8,8 0 1 1 12,0 L30,-30 L30,-6 a8,8 0 1 1 0,12 L30,30 L-30,30 Z" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/></g><g transform="translate(490,303) rotate(0)"><path d="M-30,-30 L-6,-30 a8,8 0 1 1 12,0 L30,-30 L30,-6 a8,8 0 1 1 0,12 L30,30 L-30,30 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/></g><g transform="translate(430,363) rotate(0)"><path d="M-30,-30 L-6,-30 a8,8 0 1 1 12,0 L30,-30 L30,-6 a8,8 0 1 1 0,12 L30,30 L-30,30 Z" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/></g><g transform="translate(490,363) rotate(0)"><path d="M-30,-30 L-6,-30 a8,8 0 1 1 12,0 L30,-30 L30,-6 a8,8 0 1 1 0,12 L30,30 L-30,30 Z" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/></g><text x="440" y="424" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">the reader assembles the meaning</text><rect x="600" y="258" width="270" height="182" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="620" y="294" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Strong answers</text><text x="620" y="320" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">describe</text><text x="620" y="349.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">how a text makes the</text><text x="620" y="371.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">reader do this work, and</text><text x="620" y="393.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">why that matters to its</text><text x="620" y="415.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">meaning.</text><rect x="30" y="472" width="410" height="105" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="48" y="505.2" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">Filling the gaps</text><text x="48" y="533.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Inventing explanations the text deliberately</text><text x="48" y="554.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">withholds.</text><rect x="460" y="472" width="410" height="105" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="478" y="505.2" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Analysing the withholding</text><text x="478" y="533.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Asking why information is delayed or missing,</text><text x="478" y="554.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">and what that does.</text><circle cx="410" cy="480" r="14" fill="#b5602e"/><path d="M404.4,474.4 l11.200000000000001,11.200000000000001 m0,-11.200000000000001 l-11.200000000000001,11.200000000000001" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="862" cy="480" r="14" fill="#2e6b62"/><path d="M855.7,480.28 l4.48,4.760000000000001 l8.4,-9.24" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" />
</svg>