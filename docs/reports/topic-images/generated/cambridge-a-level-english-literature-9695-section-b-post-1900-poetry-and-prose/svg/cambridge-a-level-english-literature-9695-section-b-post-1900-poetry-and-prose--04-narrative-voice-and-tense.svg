<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 690" width="900" height="690" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="690" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Post-1900 prose: who tells, and when</text>

<rect x="30" y="116" width="840" height="174" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="42" y="128" width="250" height="150" rx="10" fill="#f2e7b8"/><line x1="67" y1="213" x2="167" y2="213" stroke="#4a5568" stroke-width="3" stroke-dasharray="6 6" opacity="0.6"/><line x1="167" y1="213" x2="267" y2="213" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><circle cx="167" cy="213" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="167" y="193" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">now</text><text x="115" y="243" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">no hindsight</text><text x="221" y="243" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">events unfold</text><text x="316" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">Coetzee</text><text x="316" y="184" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">First-person present tense</text><text x="316" y="214" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">The Magistrate narrates largely in the present, without the</text><text x="316" y="236" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">hindsight of retrospective narration, so his understanding</text><text x="316" y="258" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">grows, and fails, alongside ours.</text><rect x="30" y="302" width="840" height="178" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="42" y="314" width="250" height="154" rx="10" fill="#dce9e7"/><circle cx="151" cy="391" r="34" fill="#d4b02e" fill-opacity="0.85" stroke="#1e2a44" stroke-width="2.5"/><circle cx="183" cy="391" r="34" fill="#b5d3cf" fill-opacity="0.75" stroke="#1e2a44" stroke-width="2.5"/><text x="97" y="443" font-size="14" font-weight="400" fill="#4a5568" text-anchor="middle">narrator</text><text x="237" y="443" font-size="14" font-weight="400" fill="#4a5568" text-anchor="middle">character</text><text x="316" y="342" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">Mansfield</text><text x="316" y="370" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Interior focalisation and free indirect</text><text x="316" y="396" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">discourse</text><text x="316" y="426" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">The stories follow a character’s shifting perceptions</text><text x="316" y="448" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">closely, often within a single day or event.</text><rect x="30" y="492" width="840" height="174" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="42" y="504" width="250" height="150" rx="10" fill="#f6e3d6"/><path d="M93,545 L121,545 Q133,545 133,557 L133,561 Q133,573 121,573 L115,573 L97,589 L101,573 L93,573 Q81,573 81,561 L81,557 Q81,545 93,545 Z" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><path d="M133,567 L161,567 Q173,567 173,579 L173,583 Q173,595 161,595 L155,595 L137,611 L141,595 L133,595 Q121,595 121,583 L121,579 Q121,567 133,567 Z" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><path d="M173,545 L201,545 Q213,545 213,557 L213,561 Q213,573 201,573 L195,573 L177,589 L181,573 L173,573 Q161,573 161,561 L161,557 Q161,545 173,545 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><path d="M213,567 L241,567 Q253,567 253,579 L253,583 Q253,595 241,595 L235,595 L217,611 L221,595 L213,595 Q201,595 201,583 L201,579 Q201,567 213,567 Z" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><text x="316" y="532" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">Morrison</text><text x="316" y="560" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Multiple voices</text><text x="316" y="590" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Beloved moves between characters’ perspectives and includes</text><text x="316" y="612" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">passages in which voices merge, so no single account is</text><text x="316" y="634" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">complete.</text>
</svg>