<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Post-1900 texts by form</text>

<rect x="30" y="136" width="400" height="318" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="172" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="start">Post-1900 prose</text><text x="50" y="214" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Coetzee</text><text x="50" y="237" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">Waiting for the Barbarians</text><text x="50" y="278" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Mansfield</text><text x="50" y="301" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">Selected Stories</text><text x="50" y="342" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Morrison</text><text x="50" y="365" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">Beloved</text><rect x="50" y="392" width="360" height="48" rx="10" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5" stroke-dasharray="7 5"/><text x="230" y="423" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">pair with pre-1900 poetry</text><rect x="470" y="136" width="400" height="318" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="490" y="172" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Post-1900 poetry</text><text x="490" y="214" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Glück</text><text x="490" y="237" font-size="17" fill="#1e2a44">selected poems from <tspan font-style="italic">The Wild Iris</tspan></text><text x="490" y="278" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Okara</text><text x="490" y="301" font-size="17" fill="#1e2a44">selected poems from <tspan font-style="italic">Collected Poems (2016)</tspan></text><text x="490" y="342" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Trethewey</text><text x="490" y="365" font-size="17" fill="#1e2a44"><tspan font-style="italic">Native Guard</tspan></text><rect x="490" y="392" width="360" height="48" rx="10" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5" stroke-dasharray="7 5"/><text x="670" y="423" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">pair with pre-1900 prose</text><text x="450" y="124" font-size="17" font-weight="700" fill="#4a5568" text-anchor="middle">2026 Section B texts</text><rect x="30" y="474" width="840" height="114" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="50" y="507" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">THE FORM RULE</text><text x="50" y="534" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Across Paper 4: one essay on poetry and one on prose</text><text x="50" y="563.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Section B is whichever form you did not choose in Section A.</text><rect x="30" y="604" width="840" height="102" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="637.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">For 2027, Elizabeth Bishop’s poems, Richard Powers’s The Overstory and Ocean Vuong’s Night</text><text x="50" y="659.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Sky with Exit Wounds replace Glück, Beloved and Native Guard. Check the list for your</text><text x="50" y="681.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">examination year.</text>
