<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 655" width="900" height="655" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="655" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Post-1900 poetry methods</text>

<text x="30" y="122" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Sequences and voices: poems answer one another</text><rect x="30" y="138" width="412" height="190" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="172" font-size="18" font-weight="700" fill="#1e2a44" font-style="italic">The Wild Iris</text><path d="M70,198 L150,198 Q162,198 162,210 L162,226 Q162,238 150,238 L92,238 L74,254 L78,238 L70,238 Q58,238 58,226 L58,210 Q58,198 70,198 Z" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><text x="110" y="224" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">flowers</text><path d="M196,198 L276,198 Q288,198 288,210 L288,226 Q288,238 276,238 L218,238 L200,254 L204,238 L196,238 Q184,238 184,226 L184,210 Q184,198 196,198 Z" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><text x="236" y="224" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">gardener</text><path d="M322,198 L402,198 Q414,198 414,210 L414,226 Q414,238 402,238 L344,238 L326,254 L330,238 L322,238 Q310,238 310,226 L310,210 Q310,198 322,198 Z" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><text x="362" y="224" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">a god</text><path d="M116,262 Q173,294 226,262" fill="none" stroke="#2e6b62" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-start="url(#ahT)" marker-end="url(#ahT)"/><path d="M246,262 Q299,294 356,262" fill="none" stroke="#2e6b62" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-start="url(#ahT)" marker-end="url(#ahT)"/><text x="236" y="316" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">voices answer across the book</text><rect x="458" y="138" width="412" height="190" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="478" y="172" font-size="18" font-weight="700" fill="#1e2a44" font-style="italic">Native Guard</text><rect x="478" y="190" width="372" height="31" rx="15.5" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="664" y="210.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">personal elegy for the poet’s mother</text><rect x="478" y="230" width="372" height="31" rx="15.5" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="664" y="250.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">history of a regiment of Black Union soldiers</text><rect x="478" y="270" width="372" height="31" rx="15.5" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="664" y="290.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">linked sonnets in a soldier’s voice</text><text x="30" y="358" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">In a (b) answer, place the poem in its sequence; in an (a) answer, use the sequence’s structure as evidence.</text><rect x="30" y="378" width="270.6666666666667" height="253" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="407" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">RECEIVED FORMS, NEW USES</text><text x="46" y="432.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Sonnet, villanelle,</text><text x="46" y="456.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">ghazal, pantoum</text><text x="46" y="484.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A form associated with order</text><text x="46" y="505.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">or celebration, used for</text><text x="46" y="526.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">loss or violence, creates</text><text x="46" y="547.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">tension. Trethewey’s strict</text><text x="46" y="568.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">repeating forms in poems</text><text x="46" y="589.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">about memory make the form</text><text x="46" y="610.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">enact return.</text><rect x="314.6666666666667" y="378" width="270.6666666666667" height="253" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="330.6666666666667" y="407" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FREE VERSE</text><text x="330.6666666666667" y="432.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The line break does the</text><text x="330.6666666666667" y="456.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">shaping</text><text x="330.6666666666667" y="484.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Where do lines end, what</text><text x="330.6666666666667" y="505.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">word is held at the edge,</text><text x="330.6666666666667" y="526.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">and how does white space</text><text x="330.6666666666667" y="547.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">create pause or isolation?</text><rect x="599.3333333333334" y="378" width="270.6666666666667" height="253" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="615.3333333333334" y="407" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">BETWEEN TRADITIONS</text><text x="615.3333333333334" y="432.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Okara</text><text x="615.3333333333334" y="460.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Often read as working</text><text x="615.3333333333334" y="481.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">between African and European</text><text x="615.3333333333334" y="502.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">traditions. Show how</text><text x="615.3333333333334" y="523.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">imagery, rhythm or syntax</text><text x="615.3333333333334" y="544.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">carries that tension.</text>
</svg>