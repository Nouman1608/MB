<rect width="900" height="638" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Withheld order, withheld names</text>

<rect x="30" y="118" width="410" height="300" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="154" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Fragmented, non-linear</text><text x="50" y="178" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start" font-style="italic">Beloved</text><path d="M331,290 L324.9875176342154,319.82090994640794 L310.0761629379698,345.8974933115199 L287.993246713095,365.6933009110122 L261.14842711843437,377.37104645837735 L232.37204299288402,379.9616242737355 L204.61711097780025,373.44051806325683 L180.65632278768925,358.7060750373952 L162.80512965584637,337.46430970730376 L152.69856258369254,312.0343685911266 L151.14323883324073,285.09657195208325 L158.0577517975066,259.4102886325173 L172.5052338333336,237.53130264840104 L192.81231905548935,221.5576185647798 L216.76000709798095,212.92897652856624 L241.8249207082768,212.29916051080443 L265.44484164627886,219.4921875454003 L285.2806170169538,233.5445347871934 L299.4476655587526,252.82664389610244 L306.69418699633746,275.22896242865136 L306.5093141505899,298.39154274923555 L299.15215039073973,319.9523221177242 L285.60106223844355,337.7879953580516 L267.4308528009618,350.22291745342756 L246.632671821177,356.1855040496089 L225.3969977686315,355.2976442771432 L205.88323415300164,347.89001594930744 L190.00012562040735,334.94409088880184 L179.2193226719531,317.9691980010925 L174.44027657455646,298.829490281652 L175.91872865235237,279.5403931266212 L183.26404310600847,262.05665080447494 L195.503288727871,248.07423466785517 L211.20308392769107,238.86618745441052 L228.634492563138,235.16825449549088 L245.96226264621262,237.12440262582888 L261.4378035998978,244.29570544452926 L273.5756345175528,255.72930666636307 L281.29549890744596,270.0779825090261 L284.0166009314284,285.7558471835839 L281.6959631534769,301.11247160487386 L274.80910388071186,314.60640664978723 L264.27740074247413,324.9598885262035 L251.35198821354572,331.27920156039914 L237.46826693802916,333.1294291444094 L224.08767103902227,330.55762661506964 L212.5440275241203,324.06419381348303 L203.91064107592052,314.5277753106506 L198.90134445066676,303.09377972667147 L197.81454321728896,291.04009800554087 L200.52425870835816,279.63548060005763 L206.51691197069167,270.00615854032367 L214.96767803777436,263.02471359184983 L224.8462002128544,259.232153960952 L235.03870063406734,258.80002400223805 L244.4723126475773,261.53466506245627 L252.2278692777468,266.92099395231963 L257.6293044492478,274.1989057295625 L260.3009882289227,282.4620961375249 L260.1883226938516,290.76707227195385 L257.5412883207249,298.2395582916775 L252.86484474390957,304.16641529378575 L246.84368057980362,308.0634224421504 L240.25138728198698,309.7125069845158 L233.85544214483707,309.1658547243838 " fill="none" stroke="#2e6b62" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahT)"/><circle cx="235" cy="290" r="16" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="235" y="402" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">circling back to a central event</text><rect x="460" y="118" width="410" height="300" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="480" y="151" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">WHY DELAY?</text><text x="480" y="178" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">The past returns rather than</text><text x="480" y="204" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">being told</text><text x="480" y="232.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="495.2" y="232.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The central event is revealed gradually,</text><text x="495.2" y="253.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">through memory.</text><text x="480" y="279.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="495.2" y="279.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Ask why the writer delays or fragments</text><text x="495.2" y="300.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">information, and what the reader feels at</text><text x="495.2" y="321.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the moment of revelation.</text><text x="30" y="456" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Allegory and an unnamed setting</text><text x="370" y="456" font-size="17" font-weight="700" fill="#2e6b62" font-style="italic">Waiting for the Barbarians</text><rect x="30" y="472" width="252" height="142" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="512.9" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">No names</text><text x="46" y="541.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">An unnamed Empire, a</text><text x="46" y="562.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">frontier town, no</text><text x="46" y="583.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">specified date.</text><line x1="288" y1="543" x2="318" y2="543" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="324" y="472" width="252" height="142" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="340" y="502.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Allegory</text><text x="340" y="530.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Power, torture and the</text><text x="340" y="551.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">construction of an “enemy”</text><text x="340" y="572.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">are not tied to one</text><text x="340" y="593.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">regime.</text><line x1="582" y1="543" x2="612" y2="543" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="618" y="472" width="252" height="142" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="634" y="502.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Weigh it in AO5</text><text x="634" y="530.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Does allegory</text><text x="634" y="551.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">universalise, or does it</text><text x="634" y="572.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">risk abstracting real</text><text x="634" y="593.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">suffering?</text>
</svg>