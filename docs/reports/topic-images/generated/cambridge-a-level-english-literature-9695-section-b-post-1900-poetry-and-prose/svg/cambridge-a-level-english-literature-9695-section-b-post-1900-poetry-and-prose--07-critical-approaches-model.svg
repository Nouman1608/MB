<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 835" width="900" height="835" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="835" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Critical approaches give AO5 a framework</text>

<rect x="30" y="118" width="201" height="114" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="146.4" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Postcolonial</text><text x="44" y="174" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Power, empire, the</text><text x="44" y="194" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">construction of the</text><text x="44" y="214" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">“other”.</text><rect x="243" y="118" width="201" height="114" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="257" y="146.4" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Feminist</text><text x="257" y="174" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Voice, the body,</text><text x="257" y="194" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">domestic life, who is</text><text x="257" y="214" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">silenced.</text><rect x="456" y="118" width="201" height="114" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="470" y="156.4" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Psychoanalytic</text><text x="470" y="184" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Trauma, memory,</text><text x="470" y="204" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">repression.</text><rect x="669" y="118" width="201" height="114" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="683" y="156.4" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Ecocritical</text><text x="683" y="184" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">People and the natural</text><text x="683" y="204" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">world.</text><text x="30" y="268" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Model paragraph: Coetzee’s Magistrate</text><rect x="30" y="284" width="840" height="88" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="317" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">METHOD (AO2)</text><text x="50" y="347.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Present-tense narration: the reader shares his partial understanding as events unfold.</text><rect x="30" y="402" width="410" height="154" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="445.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SYMPATHETIC READING</text><text x="50" y="471.7" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The novel’s conscience</text><text x="50" y="500.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The official who refuses the Empire’s</text><text x="50" y="521.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">cruelty and suffers for it.</text><rect x="460" y="402" width="410" height="154" rx="14" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="480" y="435" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">SCEPTICAL POSTCOLONIAL READING</text><text x="480" y="461.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">A gentler repetition</text><text x="480" y="489.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">His interest in the barbarian girl repeats</text><text x="480" y="510.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the Empire’s desire to read and possess</text><text x="480" y="531.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">others’ bodies.</text><rect x="30" y="586" width="840" height="110" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="50" y="619" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">TESTED (AO5)</text><text x="50" y="649.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The present tense supports the second reading: it denies him the hindsight to judge</text><text x="50" y="671.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">himself, so we watch him fail to see his own complicity.</text><rect x="30" y="726" width="840" height="85" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="759" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">JUDGEMENT (AO3)</text><text x="50" y="785.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">A liberal conscience that cannot escape the system it opposes</text><line x1="450" y1="376" x2="450" y2="398" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="450" y1="560" x2="450" y2="582" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="450" y1="700" x2="450" y2="722" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/>
</svg>