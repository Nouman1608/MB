<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 812" width="900" height="812" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="812" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Ethical issues in machine learning</text>

<text x="220" y="130" font-size="17" font-weight="700" fill="#4a5568" text-anchor="middle">Cause</text><text x="500" y="130" font-size="17" font-weight="700" fill="#4a5568" text-anchor="middle">Effect</text><text x="760" y="130" font-size="17" font-weight="700" fill="#4a5568" text-anchor="middle">Response / question</text><text x="30" y="168" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">Bias in training data</text><rect x="30" y="182" width="340" height="132" rx="10" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="48" y="212" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Data under-represents some groups,</text><text x="48" y="232" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">or reflects past unfair decisions.</text><line x1="374" y1="248" x2="392" y2="248" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="396" y="182" width="250" height="132" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="412" y="212" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">The model learns and</text><text x="412" y="232" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">repeats the unfairness: a</text><text x="412" y="252" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">recruitment model could</text><text x="412" y="272" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">favour the kinds of</text><text x="412" y="292" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">applicants hired before.</text><line x1="650" y1="248" x2="668" y2="248" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="672" y="182" width="198" height="132" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="688" y="212" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">check data for</text><text x="688" y="232" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">balance · test</text><text x="688" y="252" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">results for different</text><text x="688" y="272" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">groups · human review</text><text x="30" y="354" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">Transparency of automated decisions</text><rect x="30" y="368" width="340" height="132" rx="10" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="48" y="398" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Some models are difficult to</text><text x="48" y="418" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">explain, even for their designers.</text><line x1="374" y1="434" x2="392" y2="434" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="396" y="368" width="250" height="132" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="412" y="398" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">People affected by a loan,</text><text x="412" y="418" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">medical or job decision may</text><text x="412" y="438" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">not find out why or</text><text x="412" y="458" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">challenge it.</text><line x1="650" y1="434" x2="668" y2="434" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="672" y="368" width="198" height="132" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="688" y="398" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">raises</text><text x="688" y="418" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">accountability: who</text><text x="688" y="438" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">is responsible when a</text><text x="688" y="458" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">model is wrong?</text><text x="30" y="540" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">Environmental cost</text><rect x="30" y="554" width="340" height="132" rx="10" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="48" y="584" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Training large models uses a great</text><text x="48" y="604" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">deal of computing power.</text><line x1="374" y1="620" x2="392" y2="620" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="396" y="554" width="250" height="132" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="412" y="584" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Energy, hardware and</text><text x="412" y="604" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">cooling are needed.</text><line x1="650" y1="620" x2="668" y2="620" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="672" y="554" width="198" height="132" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="688" y="584" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">weigh the benefit of</text><text x="688" y="604" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">a larger model</text><text x="688" y="624" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">against the cost</text><rect x="30" y="704" width="840" height="84" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="52" y="738" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">In an evaluation: weigh benefits (speed, accuracy at scale, patterns humans miss)</text><text x="52" y="766" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">against these risks, and reach a judgement about the application in the scenario.</text>
</svg>