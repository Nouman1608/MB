<rect width="900" height="906" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Supervised and unsupervised learning</text>

<rect x="30" y="110" width="840" height="330" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="52" y="144" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Supervised learning: labelled data</text><rect x="52" y="160" width="390" height="266" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="70" y="188" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Classification: predicts a category</text><line x1="90" y1="372" x2="410" y2="372" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><line x1="90" y1="372" x2="90" y2="202" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><text x="250" y="398" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">feature 1</text><text x="76" y="287" font-size="15" fill="#4a5568" text-anchor="middle" transform="rotate(-90 76 287)">feature 2</text><circle cx="130" cy="330" r="9" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><circle cx="150" cy="300" r="9" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><circle cx="180" cy="340" r="9" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><circle cx="120" cy="290" r="9" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><circle cx="170" cy="310" r="9" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><rect x="292" y="222" width="16" height="16" rx="2" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><rect x="322" y="252" width="16" height="16" rx="2" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><rect x="352" y="232" width="16" height="16" rx="2" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><rect x="312" y="212" width="16" height="16" rx="2" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><rect x="362" y="272" width="16" height="16" rx="2" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><line x1="200" y1="210" x2="290" y2="370" stroke="#2e6b62" stroke-width="3" stroke-dasharray="8 6"/><circle cx="262" cy="236" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="250" y="214" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="end">new ?</text><text x="110" y="412" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">e.g. spam or not, cat or not</text><rect x="458" y="160" width="390" height="266" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="476" y="188" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Regression: predicts a number</text><line x1="500" y1="372" x2="820" y2="372" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><line x1="500" y1="372" x2="500" y2="202" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><text x="660" y="398" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">size</text><text x="486" y="287" font-size="15" fill="#4a5568" text-anchor="middle" transform="rotate(-90 486 287)">price</text><circle cx="530" cy="352" r="9" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><circle cx="560" cy="334" r="9" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><circle cx="600" cy="330" r="9" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><circle cx="630" cy="300" r="9" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><circle cx="670" cy="286" r="9" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><circle cx="700" cy="262" r="9" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><circle cx="740" cy="250" r="9" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><circle cx="770" cy="222" r="9" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><line x1="515" y1="362" x2="800" y2="214" stroke="#2e6b62" stroke-width="3"/><text x="520" y="412" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">e.g. a house price from its size</text><rect x="30" y="456" width="840" height="330" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="52" y="490" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="start">Unsupervised learning: unlabelled data</text><rect x="52" y="506" width="390" height="236" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="70" y="534" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Before: no labels</text><circle cx="110" cy="600" r="8" fill="#f4f6f6" stroke="#1e2a44" stroke-width="2"/><circle cx="130" cy="630" r="8" fill="#f4f6f6" stroke="#1e2a44" stroke-width="2"/><circle cx="150" cy="590" r="8" fill="#f4f6f6" stroke="#1e2a44" stroke-width="2"/><circle cx="125" cy="660" r="8" fill="#f4f6f6" stroke="#1e2a44" stroke-width="2"/><circle cx="260" cy="570" r="8" fill="#f4f6f6" stroke="#1e2a44" stroke-width="2"/><circle cx="285" cy="600" r="8" fill="#f4f6f6" stroke="#1e2a44" stroke-width="2"/><circle cx="300" cy="565" r="8" fill="#f4f6f6" stroke="#1e2a44" stroke-width="2"/><circle cx="270" cy="625" r="8" fill="#f4f6f6" stroke="#1e2a44" stroke-width="2"/><circle cx="360" cy="680" r="8" fill="#f4f6f6" stroke="#1e2a44" stroke-width="2"/><circle cx="390" cy="700" r="8" fill="#f4f6f6" stroke="#1e2a44" stroke-width="2"/><circle cx="370" cy="650" r="8" fill="#f4f6f6" stroke="#1e2a44" stroke-width="2"/><circle cx="400" cy="670" r="8" fill="#f4f6f6" stroke="#1e2a44" stroke-width="2"/><line x1="444" y1="624" x2="474" y2="624" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="476" y="506" width="372" height="236" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="494" y="534" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">After: clusters found</text><circle cx="490" cy="600" r="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><circle cx="510" cy="630" r="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><circle cx="530" cy="590" r="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><circle cx="505" cy="660" r="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><circle cx="640" cy="570" r="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="665" cy="600" r="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="680" cy="565" r="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="650" cy="625" r="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="740" cy="680" r="8" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><circle cx="770" cy="700" r="8" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><circle cx="750" cy="650" r="8" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><circle cx="780" cy="670" r="8" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><ellipse cx="510" cy="625" rx="42" ry="57" fill="none" stroke="#8a6d0d" stroke-width="2.5" stroke-dasharray="6 5"/><ellipse cx="660" cy="595" rx="42" ry="52" fill="none" stroke="#8a6d0d" stroke-width="2.5" stroke-dasharray="6 5"/><ellipse cx="760" cy="675" rx="42" ry="47" fill="none" stroke="#8a6d0d" stroke-width="2.5" stroke-dasharray="6 5"/><text x="450" y="768" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">e.g. a shop finding groups of customers with similar buying habits</text><rect x="30" y="802" width="840" height="80" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="52" y="834" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">In a question: does the training data include the correct outcome for each example?</text><text x="52" y="862" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Yes → supervised.   No, the system must find groupings itself → unsupervised.</text>
</svg>