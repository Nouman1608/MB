 fill="#f4f6f6" stroke="#c9d6d4" stroke-width="1.5"/><text x="742" y="363" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">spam</text><rect x="52" y="376" width="90" height="38" fill="#f4f6f6" stroke="#c9d6d4" stroke-width="1.5"/><text x="97" y="401" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">F</text><rect x="142" y="376" width="130" height="38" fill="#f4f6f6" stroke="#c9d6d4" stroke-width="1.5"/><text x="207" y="401" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">0</text><rect x="272" y="376" width="220" height="38" fill="#f4f6f6" stroke="#c9d6d4" stroke-width="1.5"/><text x="382" y="401" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">known</text><rect x="492" y="376" width="170" height="38" fill="#f4f6f6" stroke="#c9d6d4" stroke-width="1.5"/><text x="577" y="401" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">no</text><rect x="662" y="376" width="160" height="38" fill="#f4f6f6" stroke="#c9d6d4" stroke-width="1.5"/><text x="742" y="401" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">not spam</text><path d="M60,424 L60,432 L652,432 L652,424" fill="none" stroke="#2e6b62" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><text x="356" y="456" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">features: measurable properties the model uses</text><path d="M662,424 L662,432 L822,432 L822,424" fill="none" stroke="#8a6d0d" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><text x="742" y="456" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">labels: the correct answers</text><path d="M832,190 L842,190 L842,334 L832,334" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><text x="850" y="266" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">train</text><path d="M832,340 L842,340 L842,410 L832,410" fill="none" stroke="#b5602e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><text x="850" y="380" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">test</text><rect x="30" y="482" width="270" height="140" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="514" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Training data</text><text x="48" y="542" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">the examples a model learns</text><text x="48" y="562" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">from: large enough, accurate</text><text x="48" y="582" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">and representative</text><rect x="315" y="482" width="270" height="140" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="333" y="514" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="start">Labels (supervised)</text><text x="333" y="542" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">the correct answer attached</text><text x="333" y="562" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">to each training example</text><rect x="600" y="482" width="270" height="140" rx="12" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="618" y="514" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">Testing</text><text x="618" y="542" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">check on data not seen in</text><text x="618" y="562" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">training: does it work on new</text><text x="618" y="582" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">cases, or has it memorised?</text>
</svg>