<text x="52" y="130" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">Each row is one example email (values illustrative)</text><rect x="52" y="146" width="90" height="40" fill="#1e2a44" stroke="#ffffff" stroke-width="1.5"/><text x="97" y="172" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">email</text><rect x="142" y="146" width="130" height="40" fill="#2e6b62" stroke="#ffffff" stroke-width="1.5"/><text x="207" y="172" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">links</text><rect x="272" y="146" width="220" height="40" fill="#2e6b62" stroke="#ffffff" stroke-width="1.5"/><text x="382" y="172" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">sender’s domain</text><rect x="492" y="146" width="170" height="40" fill="#2e6b62" stroke="#ffffff" stroke-width="1.5"/><text x="577" y="172" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">certain words</text><rect x="662" y="146" width="160" height="40" fill="#8a6d0d" stroke="#ffffff" stroke-width="1.5"/><text x="742" y="172" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">label</text><rect x="52" y="186" width="90" height="38" fill="#f4f6f6" stroke="#c9d6d4" stroke-width="1.5"/><text x="97" y="211" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">A</text><rect x="142" y="186" width="130" height="38" fill="#dce9e7" stroke="#c9d6d4" stroke-width="1.5"/><text x="207" y="211" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">4</text><rect x="272" y="186" width="220" height="38" fill="#dce9e7" stroke="#c9d6d4" stroke-width="1.5"/><text x="382" y="211" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">unknown</text><rect x="492" y="186" width="170" height="38" fill="#dce9e7" stroke="#c9d6d4" stroke-width="1.5"/><text x="577" y="211" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">yes</text><rect x="662" y="186" width="160" height="38" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="1.5"/><text x="742" y="211" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">spam</text><rect x="52" y="224" width="90" height="38" fill="#f4f6f6" stroke="#c9d6d4" stroke-width="1.5"/><text x="97" y="249" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">B</text><rect x="142" y="224" width="130" height="38" fill="#dce9e7" stroke="#c9d6d4" stroke-width="1.5"/><text x="207" y="249" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">0</text><rect x="272" y="224" width="220" height="38" fill="#dce9e7" stroke="#c9d6d4" stroke-width="1.5"/><text x="382" y="249" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">school</text><rect x="492" y="224" width="170" height="38" fill="#dce9e7" stroke="#c9d6d4" stroke-width="1.5"/><text x="577" y="249" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">no</text><rect x="662" y="224" width="160" height="38" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="1.5"/><text x="742" y="249" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">not spam</text><rect x="52" y="262" width="90" height="38" fill="#f4f6f6" stroke="#c9d6d4" stroke-width="1.5"/><text x="97" y="287" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">C</text><rect x="142" y="262" width="130" height="38" fill="#dce9e7" stroke="#c9d6d4" stroke-width="1.5"/><text x="207" y="287" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">6</text><rect x="272" y="262" width="220" height="38" fill="#dce9e7" stroke="#c9d6d4" stroke-width="1.5"/><text x="382" y="287" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">unknown</text><rect x="492" y="262" width="170" height="38" fill="#dce9e7" stroke="#c9d6d4" stroke-width="1.5"/><text x="577" y="287" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">yes</text><rect x="662" y="262" width="160