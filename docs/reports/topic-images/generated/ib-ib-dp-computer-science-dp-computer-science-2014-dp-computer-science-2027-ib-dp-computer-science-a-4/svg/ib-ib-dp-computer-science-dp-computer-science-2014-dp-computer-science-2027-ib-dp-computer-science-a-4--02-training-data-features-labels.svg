<text x="52" y="130" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Training data from the worked example: eight labelled emails</text><rect x="52" y="146" width="116" height="44" fill="#1e2a44"/><text x="110" y="174" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">email</text><rect x="52" y="190" width="116" height="48" fill="#2e6b62"/><text x="110" y="212" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">feature:</text><text x="110" y="230" font-size="15" font-weight="400" fill="#ffffff" text-anchor="middle">susp. words</text><rect x="52" y="238" width="116" height="44" fill="#8a6d0d"/><text x="110" y="266" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">label</text><rect x="168" y="146" width="85" height="44" fill="#f4f6f6" stroke="#c9d6d4" stroke-width="1.5"/><text x="210" y="174" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">0</text><rect x="168" y="190" width="85" height="48" fill="#dce9e7" stroke="#c9d6d4" stroke-width="1.5"/><text x="210" y="221" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">9</text><rect x="168" y="238" width="85" height="44" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="1.5"/><text x="210" y="266" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">spam</text><rect x="253" y="146" width="85" height="44" fill="#f4f6f6" stroke="#c9d6d4" stroke-width="1.5"/><text x="295" y="174" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">1</text><rect x="253" y="190" width="85" height="48" fill="#dce9e7" stroke="#c9d6d4" stroke-width="1.5"/><text x="295" y="221" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="253" y="238" width="85" height="44" fill="#ffffff" stroke="#c9d6d4" stroke-width="1.5"/><text x="295" y="266" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">not</text><rect x="338" y="146" width="85" height="44" fill="#f4f6f6" stroke="#c9d6d4" stroke-width="1.5"/><text x="380" y="174" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">2</text><rect x="338" y="190" width="85" height="48" fill="#dce9e7" stroke="#c9d6d4" stroke-width="1.5"/><text x="380" y="221" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">7</text><rect x="338" y="238" width="85" height="44" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="1.5"/><text x="380" y="266" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">spam</text><rect x="423" y="146" width="85" height="44" fill="#f4f6f6" stroke="#c9d6d4" stroke-width="1.5"/><text x="465" y="174" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">3</text><rect x="423" y="190" width="85" height="48" fill="#dce9e7" stroke="#c9d6d4" stroke-width="1.5"/><text x="465" y="221" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="423" y="238" width="85" height="44" fill="#ffffff" stroke="#c9d6d4" stroke-width="1.5"/><text x="465" y="266" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">not</text><rect x="508" y="146" width="85" height="44" fill="#f4f6f6" stroke="#c9d6d4" stroke-width="1.5"/><text x="550" y="174" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">4</text><rect x="508" y="190" width="85" height="48" fill="#dce9e7" stroke="#c9d6d4" stroke-width="1.5"/><text x="550" y="221" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">8</text><rect x="508" y="238" width="85" height="44" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="1.5"/><text x="550" y="266" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">spam</text><rect x="593" y="146" width="85" height="44" fill="#f4f6f6" stroke="#c9d6d4" stroke-width="1.5"/><text x="635" y="174" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">5</text><rect x="593" y="190" width="85" height="48" fill="#dce9e7" stroke="#c9d6d4" stroke-width="1.5"/><text x="635" y="221" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">0</text><rect x="593" y="238" width="85" height="44" fill="#ffffff" stroke="#c9d6d4" stroke-width="1.5"/><text x="635" y="266" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">not</text><rect x="678" y="146" width="85" height="44" fill="#f4f6f6" stroke="#c9d6d4" stroke-width="1.5"/><text x="720" y="174" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">6</text><rect x="678" y="190" width="85" height="48" fill="#dce9e7" stroke="#c9d6d4" stroke-width="1.5"/><text x="720" y="221" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">6</text><rect x="678" y="238" width="85" height="44" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="1.5"/><text x="720" y="266" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">spam</text><rect x="763" y="146" width="85" height="44" fill="#f4f6f6" stroke="#c9d6d4" stroke-width="1.5"/><text x="805" y="174" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">7</text><rect x="763" y="190" width="85" height="48" fill="#dce9e7" stroke="#c9d6d4" stroke-width="1.5"/><text x="805" y="221" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="763" y="238" width="85" height="44" fill="#ffffff" stroke="#c9d6d4" stroke-width="1.5"/><text x="805" y="266" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">not</text><text x="52" y="312" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">Other features an email model might use: number of links, sender’s domain, certain words.</text><rect x="52" y="336" width="230" height="70" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="167" y="366" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">features + labels</text><text x="167" y="390" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="middle">train</text><line x1="286" y1="371" x2="330" y2="371" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="336" y="336" width="200" height="70" rx="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="436" y="366" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">model</text><text x="436" y="390" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">threshold 4.5</text><line x1="540" y1="371" x2="584" y2="371" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="590" y="336" width="280" height="70" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="730" y="366" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">new email, 5 words → spam</text><text x="730" y="390" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">new email, 4 words → not</text><rect x="30" y="428" width="270" height="140" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="460" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Training data</text><text x="48" y="488" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">the examples a model learns</text><text x="48" y="508" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">from: large enough, accurate</text><text x="48" y="528" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">and representative</text><rect x="315" y="428" width="270" height="140" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="333" y="460" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="start">Features and labels</text><text x="333" y="488" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">features are measurable</text><text x="333" y="508" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">properties; labels are the</text><text x="333" y="528" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">correct answers (supervised)</text><rect x="600" y="428" width="270" height="140" rx="12" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="618" y="460" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">Testing</text><text x="618" y="488" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">check on data not seen in</text><text x="618" y="508" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">training: does it work on new</text><text x="618" y="528" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">cases, or has it memorised?</text>
</svg>