2" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">number of suspicious words</text><rect x="440" y="150" width="408" height="140" fill="#f2e7b8" opacity="0.7"/><rect x="80" y="150" width="360" height="140" fill="#dce9e7" opacity="0.7"/><text x="260" y="176" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">not spam</text><text x="640" y="176" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">spam</text><circle cx="160" cy="272" r="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><circle cx="240" cy="272" r="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><circle cx="80" cy="272" r="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><circle cx="320" cy="272" r="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><rect x="791" y="263" width="18" height="18" rx="2" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><rect x="631" y="263" width="18" height="18" rx="2" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><rect x="711" y="263" width="18" height="18" rx="2" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><rect x="551" y="263" width="18" height="18" rx="2" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><line x1="440" y1="140" x2="440" y2="306" stroke="#1e2a44" stroke-width="3.5" stroke-dasharray="8 5"/><text x="440" y="132" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">threshold 4.5</text><line x1="200" y1="236" x2="200" y2="256" stroke="#2e6b62" stroke-width="3"/><text x="200" y="228" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="middle">avg 1.5</text><line x1="680" y1="236" x2="680" y2="256" stroke="#8a6d0d" stroke-width="3"/><text x="680" y="228" font-size="15" font-weight="600" fill="#8a6d0d" text-anchor="middle">avg 7.5</text><circle cx="400" cy="404" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="400" y="432" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start"></text><path d="M400,392 L400,312" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><path d="M480,392 L480,312" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><circle cx="480" cy="404" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="382" y="410" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="end">new email, 4 words → not spam</text><text x="498" y="410" font-size="15" font-weight="600" fill="#8a6d0d" text-anchor="start">new email, 5 words → spam</text><rect x="30" y="460" width="840" height="92" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="52" y="494" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">No programmer chose 4.5: it came from the labelled data,</text><text x="52" y="524" font-size="17" font-weight="400" fill="#2e6b62" text-anchor="start">and it would change if the system were retrained on different emails.</text>
