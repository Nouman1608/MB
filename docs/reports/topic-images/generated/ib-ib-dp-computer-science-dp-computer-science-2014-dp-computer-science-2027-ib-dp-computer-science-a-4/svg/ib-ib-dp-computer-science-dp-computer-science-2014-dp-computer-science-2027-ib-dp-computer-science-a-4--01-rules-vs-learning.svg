<rect width="900" height="778" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Rule-based programming or machine learning?</text>

<rect x="30" y="110" width="840" height="170" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="52" y="144" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="start">Rule-based programming</text><rect x="52" y="166" width="170" height="50" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="137" y="197" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">rules (by a person)</text><rect x="52" y="222" width="170" height="44" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="137" y="250" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">data</text><line x1="226" y1="191" x2="300" y2="210" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="226" y1="244" x2="300" y2="224" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="306" y="186" width="230" height="60" rx="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="421" y="222" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">program</text><line x1="540" y1="216" x2="590" y2="216" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="596" y="186" width="252" height="60" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="722" y="222" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">answers</text><text x="848" y="144" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">does exactly what it is told</text><rect x="30" y="296" width="840" height="170" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="52" y="330" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Machine learning</text><rect x="52" y="352" width="170" height="50" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="137" y="383" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">examples (data)</text><rect x="52" y="408" width="170" height="44" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="137" y="436" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">learning method</text><line x1="226" y1="377" x2="300" y2="396" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="226" y1="430" x2="300" y2="410" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="306" y="372" width="230" height="60" rx="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="421" y="408" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">learning system</text><line x1="540" y1="402" x2="590" y2="402" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="596" y="372" width="252" height="60" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="722" y="408" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">a model → predictions</text><text x="848" y="330" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">finds the patterns itself</text><rect x="30" y="484" width="840" height="40" rx="0" fill="#1e2a44" stroke="#1e2a44" stroke-width="2.5"/><text x="250" y="510" font-size="16" font-weight="700" fill="#f2e7b8" text-anchor="middle">Rule-based</text><text x="650" y="510" font-size="16" font-weight="700" fill="#b5d3cf" text-anchor="middle">Machine learning</text><rect x="30" y="524" width="840" height="46" fill="#ffffff" stroke="#c9d6d4" stroke-width="1.5"/><text x="44" y="553" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Rules come from</text><text x="250" y="553" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">the programmer</text><text x="650" y="553" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">patterns found in data</text><rect x="30" y="570" width="840" height="46" fill="#f4f6f6" stroke="#c9d6d4" stroke-width="1.5"/><text x="44" y="599" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Needs</text><text x="250" y="599" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">expert knowledge of the rules</text><text x="650" y="599" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">large, representative data sets</text><rect x="30" y="616" width="840" height="46" fill="#ffffff" stroke="#c9d6d4" stroke-width="1.5"/><text x="44" y="645" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Explaining a decision</text><text x="250" y="645" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">usually straightforward</text><text x="650" y="645" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">can be difficult</text><rect x="30" y="662" width="840" height="46" fill="#f4f6f6" stroke="#c9d6d4" stroke-width="1.5"/><text x="44" y="691" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Adapting to change</text><text x="250" y="691" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">rewrite the rules</text><text x="650" y="691" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">retrain on new data</text><rect x="30" y="708" width="840" height="46" fill="#ffffff" stroke="#c9d6d4" stroke-width="1.5"/><text x="44" y="737" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Suits</text><text x="250" y="737" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">clear, stable rules (tax calculation)</text><text x="650" y="737" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">complex patterns (image recognition)</text><line x1="450" y1="484" x2="450" y2="754" stroke="#c9d6d4" stroke-width="1.5"/>
</svg>