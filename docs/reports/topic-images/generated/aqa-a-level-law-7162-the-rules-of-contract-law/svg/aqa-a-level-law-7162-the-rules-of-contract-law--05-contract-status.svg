<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 503" width="900" height="503" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="503" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Valid, void, voidable and unenforceable</text>

<rect x="30" y="100" width="412" height="149" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="130" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">VALID</text><text x="48" y="156.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Binding and enforceable</text><text x="48" y="184.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A normal contract. Breach gives damages and</text><text x="48" y="205.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">sometimes termination.</text><rect x="458" y="100" width="412" height="149" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="476" y="130" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">VOIDABLE</text><text x="476" y="156.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Valid until the innocent party sets it aside</text><text x="476" y="184.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Misrepresentation; economic duress. Can be</text><text x="476" y="205.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">rescinded</tspan>, but the right can be lost by</text><text x="476" y="226.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">affirmation, delay or third-party rights.</text><rect x="30" y="263" width="412" height="128" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="293" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">UNENFORCEABLE</text><text x="48" y="319.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Valid but cannot be enforced in court</text><text x="48" y="347.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A guarantee not evidenced in writing (Statute of</text><text x="48" y="368.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Frauds 1677, s4)</text><rect x="458" y="263" width="412" height="128" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="476" y="293" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">VOID</text><text x="476" y="319.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">No contract at all in law</text><text x="476" y="347.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">No acceptance; agreement not intended to be</text><text x="476" y="368.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">legally binding</text><rect x="30" y="413" width="840" height="58" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="446.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle"><tspan font-weight="700" fill="#1e2a44">Common</tspan> <tspan font-weight="700" fill="#1e2a44">mistake:</tspan> saying a misrepresentation makes a contract “void”: it is <tspan font-weight="700" fill="#1e2a44">voidable</tspan>.</text>
</svg>