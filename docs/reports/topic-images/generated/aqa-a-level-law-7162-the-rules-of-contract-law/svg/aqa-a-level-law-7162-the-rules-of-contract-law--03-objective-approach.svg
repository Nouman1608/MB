<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 571" width="900" height="571" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="571" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The objective approach</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Smith v Hughes (1871): the oats case</text>
<rect x="30" y="124" width="840" height="270" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="170" cy="254" r="13" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><path d="M170,267 L170,302 M153,280 L187,280 M170,302 L156,326 M170,302 L184,326" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><text x="170" y="356" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Seller</text><text x="170" y="376" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">said nothing about age</text><circle cx="450" cy="254" r="13" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><path d="M450,267 L450,302 M433,280 L467,280 M450,302 L436,326 M450,302 L464,326" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><text x="450" y="356" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Buyer</text><ellipse cx="510" cy="196" rx="96" ry="34" fill="#ffffff" stroke="#1e2a44" stroke-width="2" stroke-dasharray="6 5"/><text x="510" y="192" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">private belief:</text><text x="510" y="212" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">“old oats”</text><line x1="200" y1="284" x2="420" y2="284" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="310" y="274" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">sells oats (new)</text><rect x="640" y="214" width="200" height="120" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="740" y="244" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Reasonable person:</text><text x="740" y="265" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">what was the seller</text><text x="740" y="286" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">promising?</text><line x1="636" y1="274" x2="482" y2="274" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><text x="740" y="364" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Binding contract</text><text x="450" y="434" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">THE SAME APPROACH EXPLAINS</text><rect x="30" y="448" width="270.6666666666667" height="91" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="165.33333333333334" y="476.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">An offer is judged by how it</text><text x="165.33333333333334" y="497.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">appears to a reasonable</text><text x="165.33333333333334" y="518.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">offeree</text><rect x="314.6666666666667" y="448" width="270.6666666666667" height="91" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="476.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Acceptance must be</text><text x="450" y="497.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">communicated so the offeror</text><text x="450" y="518.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">can see it</text><rect x="599.3333333333334" y="448" width="270.6666666666667" height="91" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="734.6666666666667" y="487.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Intention is presumed from</text><text x="734.6666666666667" y="508.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">context, not inner thoughts</text>
</svg>