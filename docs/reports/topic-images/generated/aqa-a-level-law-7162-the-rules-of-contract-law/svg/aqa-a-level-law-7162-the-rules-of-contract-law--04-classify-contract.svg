<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 568" width="900" height="568" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="568" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Classify the contract first</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Which statute applies depends on who the parties are</text>
<rect x="30" y="124" width="270.6666666666667" height="129" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="165.33333333333334" y="154" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">TRADER + CONSUMER</text><text x="165.33333333333334" y="180.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Consumer contract</text><text x="165.33333333333334" y="209.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Consumer Rights Act 2015</text><rect x="314.6666666666667" y="124" width="270.6666666666667" height="129" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="154" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">TWO BUSINESSES</text><text x="450" y="180.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Business-to-business</text><text x="450" y="209.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Unfair Contract Terms Act</text><text x="450" y="230.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">1977; common law</text><rect x="599.3333333333334" y="124" width="270.6666666666667" height="129" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="734.6666666666667" y="154" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">TWO PRIVATE INDIVIDUALS</text><text x="734.6666666666667" y="180.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Private sale</text><text x="734.6666666666667" y="209.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Common law; limited statutory</text><text x="734.6666666666667" y="230.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">protection</text><rect x="30" y="275" width="840" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="305" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DEFINITIONS: s2 CONSUMER RIGHTS ACT 2015</text><text x="48" y="336.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="336.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Trader:</tspan> acting for purposes relating to their trade, business, craft or profession</text><text x="48" y="361.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="361.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Consumer:</tspan> an individual acting for purposes wholly or mainly outside their trade, business, craft or</text><text x="63.2" y="382.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">profession</text><rect x="30" y="427" width="840" height="109" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="461.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Getting this wrong is costly</text><text x="450" y="490.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Applying s9 CRA 2015 to a sale between two friends, or UCTA’s reasonableness test to a consumer</text><text x="450" y="511.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">contract, misstates the law.</text>
</svg>