<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 542" width="900" height="542" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="542" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The life of a contract</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">The specification’s five areas, in order</text>
<path d="M30,124 L178,124 L192,164 L178,204 L30,204 L44,164 Z" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><text x="111" y="171" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Formation</text><text x="111" y="236" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Is there a</text><text x="111" y="256" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">contract?</text><path d="M203,124 L351,124 L365,164 L351,204 L203,204 L217,164 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><text x="284" y="171" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Terms</text><text x="284" y="236" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">What was</text><text x="284" y="256" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">promised?</text><path d="M376,124 L524,124 L538,164 L524,204 L376,204 L390,164 Z" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><text x="457" y="160" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Vitiating</text><text x="457" y="180" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">factors</text><text x="457" y="236" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Is the agreement</text><text x="457" y="256" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">flawed?</text><path d="M549,124 L697,124 L711,164 L697,204 L549,204 L563,164 Z" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><text x="630" y="171" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Discharge</text><text x="630" y="236" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">How did the</text><text x="630" y="256" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">contract end?</text><path d="M722,124 L870,124 L884,164 L870,204 L722,204 L736,164 Z" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><text x="803" y="171" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Remedies</text><text x="803" y="236" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">What can the</text><text x="803" y="256" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">innocent party</text><text x="803" y="276" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">get?</text><rect x="30" y="296" width="840" height="134" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="326" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">A METHOD FOR PROBLEM QUESTIONS</text><text x="48" y="357.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="357.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Work through the stages <tspan font-weight="700" fill="#1e2a44">in</tspan> <tspan font-weight="700" fill="#1e2a44">order</tspan>, but only those the facts raise</text><text x="48" y="382.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="382.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Add an exclusion-clause check after breach, and conclude for each party</text><text x="48" y="407.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="407.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Headings such as “Formation”, “Terms” and “Remedies” help the examiner follow</text><rect x="30" y="452" width="840" height="58" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="485.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle"><tspan font-weight="700" fill="#1e2a44">Common</tspan> <tspan font-weight="700" fill="#1e2a44">mistake:</tspan> starting with remedies before showing there is a contract and a breach.</text>
</svg>