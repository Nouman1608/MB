<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 712" width="900" height="712" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="712" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: Asha’s faulty laptop</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Bought from TechWorld’s website; terms say “No refunds on electronics”</text>
<line x1="60" y1="144" x2="60" y2="660" stroke="#c9d6d4" stroke-width="4"/><rect x="104" y="124" width="766" height="120" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="118" y="150" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FORMATION</text><text x="118" y="176.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Contract formed</text><text x="118" y="204.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Listing = invitation to treat; Asha’s order = offer; confirmation email = acceptance (by analogy</text><text x="118" y="225.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">with shop-display cases)</text><circle cx="60" cy="184" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="192.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="104" y="254" width="766" height="99" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="118" y="280" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">TYPE</text><text x="118" y="306.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Consumer contract: CRA 2015</text><text x="118" y="334.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Asha: individual outside a trade. TechWorld: trader.</text><circle cx="60" cy="303.5" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="312.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="104" y="363" width="766" height="99" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="118" y="389" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">TERMS</text><text x="118" y="415.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">s9: satisfactory quality</text><text x="118" y="443.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A faulty keyboard on a new laptop breaches it</text><circle cx="60" cy="412.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="421.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="104" y="472" width="766" height="99" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="118" y="498" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EXCLUSION</text><text x="118" y="524.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">“No refunds” is ineffective</text><text x="118" y="552.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Cannot restrict Asha’s statutory rights (s31 CRA)</text><circle cx="60" cy="521.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="530.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="104" y="581" width="766" height="99" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="118" y="607" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">REMEDY</text><text x="118" y="633.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Short-term right to reject (s20) within 30 days (s22)</text><text x="118" y="661.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Or repair or replacement (s23)</text><circle cx="60" cy="630.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="639.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text>
</svg>