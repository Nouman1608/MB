<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 574" width="900" height="574" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="574" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Where contract rules come from</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Mainly common law, with statute and equity added</text>
<rect x="30" y="124" width="342.5625" height="296" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="152" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">COMMON LAW</text><text x="46" y="178.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Judge-made rules</text><text x="46" y="206.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="61.2" y="206.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Offer and acceptance: <tspan font-style="italic">Carlill</tspan> (1893);</text><text x="61.2" y="227.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Adams</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Lindsell</tspan> (1818)</text><text x="46" y="253.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="61.2" y="253.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Consideration: <tspan font-style="italic">Currie</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Misa</tspan> (1875);</text><text x="61.2" y="274.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Williams</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Roffey</tspan> (1991)</text><text x="46" y="300.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="61.2" y="300.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Intention: <tspan font-style="italic">Balfour</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Balfour</tspan> (1919)</text><text x="46" y="326.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="61.2" y="326.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Implied terms: <tspan font-style="italic">The</tspan> <tspan font-style="italic">Moorcock</tspan> (1889)</text><text x="46" y="352.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="61.2" y="352.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Economic duress: <tspan font-style="italic">Atlas</tspan> <tspan font-style="italic">Express</tspan> <tspan font-style="italic">v</tspan></text><text x="61.2" y="373.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Kafco</tspan> (1989)</text><text x="46" y="399.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="61.2" y="399.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Damages: <tspan font-style="italic">Hadley</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Baxendale</tspan> (1854)</text><rect x="386.5625" y="124" width="279.125" height="296" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="402.5625" y="152" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STATUTE</text><text x="402.5625" y="178.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Protects weaker parties,</text><text x="402.5625" y="201.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">fixes gaps</text><text x="402.5625" y="229.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="417.7625" y="229.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Contracts (Rights of Third</text><text x="417.7625" y="250.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Parties) Act 1999</text><text x="402.5625" y="276.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="417.7625" y="276.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Consumer Rights Act 2015</text><text x="402.5625" y="302.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="417.7625" y="302.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Unfair Contract Terms Act</text><text x="417.7625" y="323.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">1977</text><text x="402.5625" y="349.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="417.7625" y="349.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Misrepresentation Act 1967</text><text x="402.5625" y="375.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="417.7625" y="375.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Law Reform (Frustrated</text><text x="417.7625" y="396.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Contracts) Act 1943</text><rect x="679.6875" y="124" width="190.3125" height="296" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="695.6875" y="152" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EQUITY</text><text x="695.6875" y="178.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Discretionary</text><text x="695.6875" y="201.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">remedies</text><text x="695.6875" y="229.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="710.8875" y="229.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Specific</text><text x="710.8875" y="250.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">performance</text><text x="695.6875" y="276.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="710.8875" y="276.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Rescission</text><rect x="30" y="442" width="412" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="472.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Case-based</text><text x="46" y="500.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A definition without an authority is weak</text><rect x="458" y="442" width="412" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="474" y="472.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Statute overrides</text><text x="474" y="500.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">s31 CRA 2015: a trader cannot exclude the</text><text x="474" y="521.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">statutory implied terms</text>
</svg>