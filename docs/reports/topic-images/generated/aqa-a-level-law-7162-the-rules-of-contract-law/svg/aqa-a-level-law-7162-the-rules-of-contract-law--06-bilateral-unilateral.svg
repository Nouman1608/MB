<rect width="900" height="489" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Bilateral and unilateral contracts</text>

<rect x="30" y="100" width="410" height="230" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="460" y="100" width="410" height="230" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="235" y="138" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Bilateral</text><text x="235" y="162" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">a promise for a promise</text><circle cx="100" cy="200" r="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><path d="M100,212 L100,244 M85,224 L115,224 M100,244 L88,266 M100,244 L112,266" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="370" cy="200" r="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><path d="M370,212 L370,244 M355,224 L385,224 M370,244 L358,266 M370,244 L382,266" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><line x1="130" y1="216" x2="340" y2="216" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><line x1="340" y1="250" x2="130" y2="250" stroke="#8a6d0d" stroke-width="3" marker-end="url(#ahO)"/><text x="235" y="208" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="middle">promise</text><text x="235" y="272" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="middle">promise</text><text x="665" y="138" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Unilateral</text><text x="665" y="162" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">a promise for an act</text><rect x="478" y="192" width="134" height="64" rx="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="545" y="220" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Company</text><text x="545" y="240" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">promises £100</text><circle cx="800" cy="200" r="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><path d="M800,212 L800,244 M785,224 L815,224 M800,244 L788,266 M800,244 L812,266" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><line x1="616" y1="216" x2="770" y2="216" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><path d="M780,272 Q700,305 616,260" fill="none" stroke="#8a6d0d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 6" marker-end="url(#ahO)"/><text x="690" y="315" font-size="15" font-weight="600" fill="#8a6d0d" text-anchor="middle">uses the smoke ball as directed</text><rect x="30" y="352" width="412" height="105" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="382" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CARLILL v CARBOLIC SMOKE BALL CO (1893)</text><text x="48" y="413.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">£100 promised to anyone who used the smoke</text><text x="48" y="434.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">ball as directed and still caught influenza.</text><rect x="458" y="352" width="412" height="105" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="476" y="382" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">WHY IT MATTERS</text><text x="476" y="413.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">When acceptance happens, and whether an offer</text><text x="476" y="434.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">can be withdrawn.</text>
</svg>