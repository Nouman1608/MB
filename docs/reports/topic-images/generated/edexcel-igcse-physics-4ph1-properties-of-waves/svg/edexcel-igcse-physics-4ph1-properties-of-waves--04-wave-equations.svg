<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 890" width="900" height="890" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="890" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The wave equations</text>

<rect x="30" y="110" width="840" height="270" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="60" y="140" width="360" height="90" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="240" y="178" font-size="30" font-weight="700" fill="#1e2a44" text-anchor="middle">v = f × λ</text><text x="240" y="210" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">m/s = Hz × m</text><rect x="480" y="140" width="360" height="90" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="660" y="178" font-size="30" font-weight="700" fill="#1e2a44" text-anchor="middle">f = 1 / T</text><text x="660" y="210" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Hz = 1 / s</text><text x="450" y="270" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">In one period T the wave moves forward one wavelength λ:</text><text x="450" y="304" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">speed = distance ÷ time = λ ÷ T = f × λ</text><text x="450" y="350" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">sound in air ≈ 340 m/s   ·   EM waves in free space 3.0 × 10⁸ m/s   ·   ripples: cm/s</text><rect x="30" y="400" width="840" height="470" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="436" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Worked example 1: a ripple tank</text><rect x="60" y="456" width="520" height="170" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><rect x="66" y="480" width="22" height="120" rx="4" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2"/><text x="77" y="640" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">dipper</text><line x1="120" y1="462" x2="120" y2="620" stroke="#2b5a9a" stroke-width="4"/><line x1="195" y1="462" x2="195" y2="620" stroke="#2b5a9a" stroke-width="4"/><line x1="270" y1="462" x2="270" y2="620" stroke="#2b5a9a" stroke-width="4"/><line x1="345" y1="462" x2="345" y2="620" stroke="#2b5a9a" stroke-width="4"/><line x1="420" y1="462" x2="420" y2="620" stroke="#2b5a9a" stroke-width="4"/><line x1="495" y1="462" x2="495" y2="620" stroke="#2b5a9a" stroke-width="4"/><line x1="570" y1="462" x2="570" y2="620" stroke="#2b5a9a" stroke-width="4"/><line x1="120" y1="690" x2="495" y2="690" stroke="#2e6b62" stroke-width="3" marker-start="url(#ahT)" marker-end="url(#ahT)"/><line x1="120" y1="640" x2="120" y2="700" stroke="#2e6b62" stroke-width="1.5" stroke-dasharray="4 4"/><line x1="495" y1="640" x2="495" y2="700" stroke="#2e6b62" stroke-width="1.5" stroke-dasharray="4 4"/><text x="307.5" y="680" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">5 wavelengths = 7.5 cm</text><text x="320" y="730" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">12 waves made in 4.0 s</text><rect x="600" y="456" width="250" height="300" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="618" y="492" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">f = 12 / 4.0 = 3.0 Hz</text><text x="618" y="524" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">λ = 7.5 / 5 = 1.5 cm</text><text x="618" y="556" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">   = 0.015 m</text><text x="618" y="588" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">v = 3.0 × 0.015</text><text x="618" y="620" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">   = 0.045 m/s</text><text x="618" y="652" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">T = 1 / 3.0 = 0.33 s</text><text x="618" y="700" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Measure across several</text><text x="618" y="720" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">wavelengths, then divide.</text><rect x="60" y="770" width="790" height="80" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="85" y="803" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Worked example 2: tuning fork, 256 Hz, sound at 340 m/s</text><text x="85" y="833" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">λ = v / f = 340 / 256 = 1.33 m ≈ 1.3 m</text>
</svg>