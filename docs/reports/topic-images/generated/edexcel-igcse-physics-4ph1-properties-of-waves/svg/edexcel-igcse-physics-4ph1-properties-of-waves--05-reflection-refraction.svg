" stroke="#2b5a9a" stroke-width="3.5"/><line x1="1183.1879536588092" y1="224.16105020995292" x2="279.6580638910371" y2="652.6861233343125" stroke="#2b5a9a" stroke-width="3.5"/><line x1="1200.3289565837836" y1="260.30224580066374" x2="296.7990668160115" y2="688.8273189250233" stroke="#2b5a9a" stroke-width="3.5"/><line x1="1217.469959508758" y1="296.4434413913747" x2="313.94006974098596" y2="724.9685145157342" stroke="#2b5a9a" stroke-width="3.5"/><line x1="1234.6109624337323" y1="332.5846369820856" x2="331.08107266596033" y2="761.1097101064452" stroke="#2b5a9a" stroke-width="3.5"/><line x1="1251.7519653587067" y1="368.72583257279643" x2="348.2220755909347" y2="797.250905697156" stroke="#2b5a9a" stroke-width="3.5"/></g><line x1="509.2933629344807" y1="240.73511125691243" x2="580" y2="325" stroke="#b5602e" stroke-width="4" marker-end="url(#ahR)"/><line x1="580" y1="335" x2="627.1377580436796" y2="434.38828787445493" stroke="#b5602e" stroke-width="4" marker-end="url(#ahR)"/><line x1="580" y1="210" x2="580" y2="460" stroke="#1e2a44" stroke-width="2" stroke-dasharray="6 5"/><rect x="730" y="178" width="112" height="26" rx="6" fill="#ffffff" stroke="#1e2a44" stroke-width="1.5"/><text x="786" y="197" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">deep: faster</text><rect x="710" y="476" width="132" height="26" rx="6" fill="#ffffff" stroke="#1e2a44" stroke-width="1.5"/><text x="776" y="495" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">shallow: slower</text><text x="665" y="565" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Waves change speed and direction</text><rect x="30" y="600" width="840" height="175" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="60" y="638" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Worked example 3: frequency stays 5.0 Hz in both</text><text x="60" y="676" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">deep:     v = 0.30 m/s</text><text x="60" y="706" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">λ = 0.30 / 5.0 = 0.060 m</text><text x="470" y="676" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">shallow:  v = 0.20 m/s</text><text x="470" y="706" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">λ = 0.20 / 5.0 = 0.040 m</text><text x="450" y="752" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">Slower, so shorter wavelength (v = f × λ). The frequency does not change.</text>
