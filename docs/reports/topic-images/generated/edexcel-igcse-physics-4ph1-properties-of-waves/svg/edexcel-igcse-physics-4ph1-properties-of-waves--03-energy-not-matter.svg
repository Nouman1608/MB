ains kinetic energy</text><text x="60" y="693" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">information: speech, music, radio</text><text x="60" y="716" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and TV signals, data in optical fibres</text><rect x="460" y="600" width="410" height="150" rx="14" fill="#fbeee6" stroke="#b5602e" stroke-width="2.5"/><text x="490" y="638" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">What does not travel</text><text x="490" y="670" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">matter: water particles and air</text><text x="490" y="693" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">molecules oscillate about fixed</text><text x="490" y="716" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">positions and stay where they are</text>
