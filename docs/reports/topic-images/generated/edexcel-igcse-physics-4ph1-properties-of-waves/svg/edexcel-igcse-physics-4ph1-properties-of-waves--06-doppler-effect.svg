<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 790" width="900" height="790" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="790" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The Doppler effect</text>

<rect x="30" y="110" width="840" height="500" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="498" cy="330" r="38" fill="none" stroke="#2b5a9a" stroke-width="3"/><circle cx="476" cy="330" r="76" fill="none" stroke="#2b5a9a" stroke-width="3"/><circle cx="454" cy="330" r="114" fill="none" stroke="#2b5a9a" stroke-width="3"/><circle cx="432" cy="330" r="152" fill="none" stroke="#2b5a9a" stroke-width="3"/><circle cx="410" cy="330" r="190" fill="none" stroke="#2b5a9a" stroke-width="3"/><circle cx="498" cy="330" r="3.5" fill="#4a5568" stroke="none" stroke-width="0"/><circle cx="476" cy="330" r="3.5" fill="#4a5568" stroke="none" stroke-width="0"/><circle cx="454" cy="330" r="3.5" fill="#4a5568" stroke="none" stroke-width="0"/><circle cx="432" cy="330" r="3.5" fill="#4a5568" stroke="none" stroke-width="0"/><circle cx="410" cy="330" r="3.5" fill="#4a5568" stroke="none" stroke-width="0"/><circle cx="520" cy="330" r="16" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><line x1="538" y1="330" x2="590" y2="330" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><circle cx="780" cy="330" r="15" fill="#dce9e7" stroke="#2e6b62" stroke-width="3"/><text x="780" y="336" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">A</text><circle cx="120" cy="330" r="15" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="3"/><text x="120" y="336" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">B</text><text x="845" y="480" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="end">Observer A (ahead)</text><text x="845" y="501" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="end">wavefronts squashed:</text><text x="845" y="522" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="end">shorter wavelength</text><text x="845" y="543" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="end">higher frequency</text><text x="55" y="480" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="start">Observer B (behind)</text><text x="55" y="501" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="start">wavefronts spread out:</text><text x="55" y="522" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="start">longer wavelength</text><text x="55" y="543" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="start">lower frequency</text><text x="450" y="592" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Source (gold) moving right. Each circle was emitted from where it was then (grey dots).</text><rect x="30" y="630" width="840" height="140" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="60" y="668" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The source emits the same frequency throughout. Only the observed</text><text x="60" y="696" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">frequency and wavelength change, and only while there is relative motion.</text><text x="60" y="724" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Examples: a passing siren’s pitch falls; light from receding galaxies is red-shifted.</text>
</svg>