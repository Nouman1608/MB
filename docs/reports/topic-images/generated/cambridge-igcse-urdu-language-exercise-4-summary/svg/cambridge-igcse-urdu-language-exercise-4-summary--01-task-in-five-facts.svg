<rect width="900" height="730" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The summary in five facts</text>

<rect x="30" y="110" width="268" height="116" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="164" y="154" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">10 marks</text><text x="164" y="184" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">one summary task</text><rect x="316" y="110" width="268" height="116" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="154" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">≤ 100 words</text><text x="450" y="184" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">a ceiling, not a target</text><rect x="602" y="110" width="268" height="116" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="736" y="154" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">One paragraph</text><text x="736" y="184" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">not a list or several</text><text x="736" y="205" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">paragraphs</text><rect x="30" y="240" width="410" height="116" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="235" y="284" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">Named aspect(s)</text><text x="235" y="314" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">of the Exercise 3 text only</text><rect x="460" y="240" width="410" height="116" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="665" y="284" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">Own words</text><text x="665" y="314" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">as far as possible</text><text x="450" y="406" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Marked as reading and as writing</text><rect x="30" y="428" width="110" height="130" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="85" y="464" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">R2</text><text x="85" y="494" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">ideas,</text><text x="85" y="513" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">opinions,</text><text x="85" y="532" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">attitudes</text><rect x="152" y="428" width="110" height="130" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="207" y="464" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">R3</text><text x="207" y="494" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">connections</text><text x="207" y="513" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">between them</text><rect x="274" y="428" width="110" height="130" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="329" y="464" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">W1</text><text x="329" y="494" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">clear and</text><text x="329" y="513" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">accurate</text><rect x="396" y="428" width="110" height="130" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="451" y="464" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">W2</text><text x="451" y="494" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">organised,</text><text x="451" y="513" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">linked</text><rect x="518" y="428" width="110" height="130" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="573" y="464" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">W3</text><text x="573" y="494" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">range of</text><text x="573" y="513" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">structures,</text><text x="573" y="532" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">vocabulary</text><rect x="640" y="428" width="110" height="130" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="695" y="464" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">W4</text><text x="695" y="494" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">punctuation,</text><text x="695" y="513" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">spelling</text><rect x="762" y="428" width="110" height="130" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="817" y="464" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">W5</text><text x="817" y="494" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">register and</text><text x="817" y="513" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">style</text><text x="146" y="584" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">reading</text><text x="570" y="584" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">writing: all five objectives</text><rect x="30" y="606" width="840" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="642" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Working convention on this site: up to 5 content + up to 5 language</text><text x="54" y="672" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The syllabus does not publish how the 10 marks divide; this split is a practice convention.</text>
</svg>