<rect width="900" height="564" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Collecting the points</text>

<rect x="30" y="110" width="410" height="124" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="147" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Merge</text><text x="50" y="176.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">The text may state one idea twice in</text><text x="50" y="199.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">different words: write it once.</text><rect x="460" y="110" width="410" height="124" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="480" y="147" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Drop</text><text x="480" y="176.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Introduction, background, examples,</text><text x="480" y="199.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">illustrative statistics and quotations.</text><text x="480" y="222.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Keep a quotation's point if relevant.</text><rect x="30" y="254" width="840" height="170" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="54" y="290" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Generalise lists and examples</text><text x="850" y="354" font-size="28" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;پودینہ، دھنیا اور ٹماٹر&#x200F;</text><text x="850" y="394" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">mint, coriander and tomatoes</text><line x1="530" y1="349" x2="440" y2="349" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><text x="420" y="354" font-size="28" fill="#2e6b62" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;جلدی اگنے والی سبزیاں&#x200F;</text><text x="420" y="394" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="end" font-style="italic">fast-growing vegetables</text><rect x="30" y="444" width="840" height="92" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="54" y="480" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Count</text><text x="54" y="510" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">For a 100-word summary on two aspects, six to eight points is typical.</text>
</svg>