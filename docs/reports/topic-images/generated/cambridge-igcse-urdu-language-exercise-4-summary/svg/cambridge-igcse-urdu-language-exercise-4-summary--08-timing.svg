<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 465" width="900" height="465" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="465" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">About 15 minutes for the summary</text>

<rect x="60" y="120" width="208" height="96" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><text x="164" y="160" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">4 min</text><text x="164" y="190" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Collect points</text><rect x="268" y="120" width="416" height="96" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="476" y="160" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">8 min</text><text x="476" y="190" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Write</text><rect x="684" y="120" width="156" height="96" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="762" y="160" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">3 min</text><text x="762" y="190" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Count and check</text><text x="60" y="244" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">0</text><text x="840" y="244" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">about 15 minutes</text><rect x="30" y="270" width="410" height="165" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="307" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Draft in your head</text><text x="50" y="335.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Or in brief notes. A full rough copy plus a</text><text x="50" y="357.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">fair copy rarely fits in the time.</text><rect x="460" y="270" width="410" height="165" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="480" y="307" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Check twice</text><text x="480" y="335.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Once for meaning: does every point answer</text><text x="480" y="357.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the aspect?</text><text x="480" y="385.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Once for accuracy: agreement, the ergative,</text><text x="480" y="407.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">spelling.</text>
</svg>