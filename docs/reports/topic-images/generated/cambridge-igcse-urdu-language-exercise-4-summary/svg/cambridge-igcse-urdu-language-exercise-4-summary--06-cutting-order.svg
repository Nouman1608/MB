<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 672" width="900" height="672" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="672" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Over 100 words? Cut in this order</text>

<rect x="50" y="110" width="800" height="78" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><circle cx="90" cy="149" r="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="90" y="156.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="450" y="156" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Repeated ideas</text><text x="830" y="156" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">cut first</text><rect x="90" y="202" width="720" height="78" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="130" cy="241" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="130" y="248.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="450" y="248" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Introductory phrases</text><rect x="130" y="294" width="640" height="78" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="170" cy="333" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="170" y="340.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="450" y="340" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Examples</text><rect x="170" y="386" width="560" height="78" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="210" cy="425" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="210" y="432.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="450" y="432" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">The least important point</text><text x="710" y="432" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">cut last</text><rect x="30" y="494" width="840" height="150" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="54" y="530" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Why Urdu counts climb fast</text><text x="54" y="560" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Postpositions and helper verbs each add words:</text><text x="850" y="562" font-size="26" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;کے لیے، ہو گیا ہے&#x200F;</text><text x="54" y="592" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Compound verbs and noun phrases keep the count down.</text><text x="54" y="622" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="start">Quick count: count one handwritten line and multiply.</text>
</svg>