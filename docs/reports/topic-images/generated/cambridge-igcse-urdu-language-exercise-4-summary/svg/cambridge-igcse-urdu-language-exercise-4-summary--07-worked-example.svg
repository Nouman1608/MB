<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: the new bus service</text>

<text x="240" y="118" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">Advantages</text><text x="660" y="118" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="middle">Problems</text><rect x="30" y="134" width="400" height="48" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="50" y="164" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">1. cheap (half the rickshaw fare)</text><rect x="30" y="192" width="400" height="48" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="50" y="222" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">2. frequent (every ten minutes)</text><rect x="30" y="250" width="400" height="48" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="50" y="280" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">3. air-conditioned: comfortable in summer</text><rect x="30" y="308" width="400" height="48" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="50" y="338" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">4. reserved seats for women</text><rect x="470" y="134" width="400" height="80" rx="10" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2"/><text x="490" y="165" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">5. main roads only: a rickshaw is still needed</text><text x="490" y="187" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">    to reach the stop</text><rect x="470" y="226" width="400" height="80" rx="10" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2"/><text x="490" y="257" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">6. overcrowded at rush hour</text><rect x="470" y="324" width="400" height="48" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="490" y="354" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">hinge between the halves:</text><text x="850" y="358" font-size="26" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;تاہم&#x200F;</text><text x="450" y="410" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">How the model summary rewords the text</text><text x="650" y="452" font-size="16" font-weight="700" fill="#4a5568" text-anchor="middle">In the source text</text><text x="230" y="452" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">In the summary</text><rect x="470" y="466" width="400" height="82" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="850" y="522" font-size="25" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;کرایہ رکشے سے آدھا ہے&#x200F;</text><line x1="462" y1="507" x2="440" y2="507" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="466" width="400" height="82" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="410" y="522" font-size="25" fill="#2e6b62" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;سستی&#x200F;</text><rect x="470" y="558" width="400" height="82" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="850" y="614" font-size="25" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;ہر دس منٹ بعد&#x200F;</text><line x1="462" y1="599" x2="440" y2="599" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="558" width="400" height="82" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="410" y="614" font-size="25" fill="#2e6b62" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;تھوڑے تھوڑے وقفے سے&#x200F;</text><rect x="470" y="650" width="400" height="82" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="850" y="706" font-size="25" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;بڑی سڑکوں&#x200F;</text><line x1="462" y1="691" x2="440" y2="691" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="650" width="400" height="82" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="410" y="706" font-size="25" fill="#2e6b62" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;مرکزی شاہراہوں&#x200F;</text><rect x="470" y="742" width="400" height="82" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="850" y="798" font-size="25" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;رش کے وقت… جگہ نہیں ملتی&#x200F;</text><line x1="462" y1="783" x2="440" y2="783" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="742" width="400" height="82" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="410" y="798" font-size="25" fill="#2e6b62" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;کھچا کھچ بھری&#x200F;</text><rect x="30" y="840" width="840" height="70" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="54" y="883" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Model summary: 66 words, one paragraph. The source's general opening claim is left out.</text>
</svg>