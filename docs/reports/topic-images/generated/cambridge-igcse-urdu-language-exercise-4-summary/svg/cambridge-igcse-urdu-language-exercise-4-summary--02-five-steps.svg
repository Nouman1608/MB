<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="900" height="650" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="650" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Five steps to a summary</text>

<rect x="30" y="110" width="840" height="110" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="165" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="173.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="122" y="148" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Read the aspect, not the text</text><text x="122" y="176" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Write the named aspect(s) in two or three words each. Often there are two, and</text><text x="122" y="199" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">both must appear.</text><rect x="30" y="230" width="840" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="275" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="283.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="122" y="268" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Collect the points</text><text x="122" y="296" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Mark every sentence that answers the aspect; merge, generalise, drop quotations.</text><rect x="30" y="330" width="840" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="375" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="383.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="122" y="368" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Put them in your own words</text><text x="122" y="396" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Synonyms, word-class changes, generalising, active/passive, combining.</text><rect x="30" y="430" width="840" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="475" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="483.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="122" y="468" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Link into one paragraph</text><text x="122" y="496" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Connectives, neutral third-person register, no opinion.</text><rect x="30" y="530" width="840" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="575" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="583.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="122" y="568" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Check the count</text><text x="122" y="596" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">No more than 100 words; cut if you are over.</text>
</svg>