<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 874" width="900" height="874" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="874" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Connectives that link the points</text>

<rect x="30" y="110" width="840" height="558" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,160 L31.25,124 Q31.25,111.25 44,111.25 L856,111.25 Q868.75,111.25 868.75,124 L868.75,160 Z" fill="#b5d3cf"/><text x="46" y="142" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Function</text><text x="854" y="142" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Connectives</text><line x1="230" y1="110" x2="230" y2="668" stroke="#c9d6d4" stroke-width="2"/><line x1="30" y1="160" x2="870" y2="160" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="215.45000000000002" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Addition</text><text x="854" y="214.1" font-size="26" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;اس کے علاوہ، نیز، مزید یہ کہ&#x200F;</text><text x="854" y="247.60000000000002" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">besides, also, moreover</text><rect x="32" y="261.6" width="836" height="101.60000000000001" fill="#f2e7b8"/><line x1="30" y1="261.6" x2="870" y2="261.6" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="317.05" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Contrast</text><text x="854" y="315.70000000000005" font-size="26" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;تاہم، لیکن، اس کے باوجود&#x200F;</text><text x="854" y="349.20000000000005" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">however, but, despite this</text><line x1="30" y1="363.20000000000005" x2="870" y2="363.20000000000005" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="418.65000000000003" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Cause</text><text x="854" y="417.30000000000007" font-size="26" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;کیونکہ، کی وجہ سے، کے باعث&#x200F;</text><text x="854" y="450.80000000000007" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">because, because of, owing to</text><line x1="30" y1="464.80000000000007" x2="870" y2="464.80000000000007" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="520.2500000000001" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Result</text><text x="854" y="518.9000000000001" font-size="26" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;اس لیے، لہٰذا، چنانچہ&#x200F;</text><text x="854" y="552.4000000000001" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">so, therefore, consequently</text><line x1="30" y1="566.4000000000001" x2="870" y2="566.4000000000001" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="621.85" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Sequence</text><text x="854" y="620.5000000000001" font-size="26" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;پہلے، پھر، آخر میں&#x200F;</text><text x="854" y="654.0000000000001" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">first, then, finally</text><rect x="30" y="690" width="840" height="156" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="54" y="728" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Register</text><text x="54" y="758" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Neutral, impersonal, third person. No opinion, no addressing the reader, and no opening like:</text><text x="850" y="812" font-size="26" fill="#b5602e" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;اس مضمون میں بتایا گیا ہے کہ&#x200F;</text><text x="520" y="808" font-size="26" font-weight="700" fill="#b5602e" text-anchor="middle">✗</text><text x="54" y="808" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">spends words on nothing</text>
</svg>