<rect width="900" height="752" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Five ways to use your own words</text>

<rect x="30" y="110" width="840" height="522" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,160 L31.25,124 Q31.25,111.25 44,111.25 L856,111.25 Q868.75,111.25 868.75,124 L868.75,160 Z" fill="#b5d3cf"/><text x="46" y="142" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Technique</text><text x="564" y="142" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Text</text><line x1="250" y1="110" x2="250" y2="632" stroke="#c9d6d4" stroke-width="2"/><text x="854" y="142" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Your version</text><line x1="580" y1="110" x2="580" y2="632" stroke="#c9d6d4" stroke-width="2"/><line x1="30" y1="160" x2="870" y2="160" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="201.85" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Synonym</text><text x="564" y="210.4" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;پانی کی کمی ہے&#x200F;</text><text x="854" y="210.4" font-size="24" fill="#2e6b62" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;پانی کی قلت ہے&#x200F;</text><line x1="30" y1="234.4" x2="870" y2="234.4" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="289.75" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Change the word</text><text x="46" y="312.75" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">class</text><text x="564" y="309.79999999999995" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;بچے پہلے سے کم کھیلتے ہیں&#x200F;</text><text x="854" y="284.8" font-size="24" fill="#2e6b62" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;بچوں کے کھیل میں&#x200F;</text><text x="854" y="334.8" font-size="24" fill="#2e6b62" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;کمی آ گئی ہے&#x200F;</text><line x1="30" y1="358.8" x2="870" y2="358.8" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="400.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Generalise</text><text x="564" y="409.20000000000005" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;سیب، آم اور کیلے&#x200F;</text><text x="854" y="409.20000000000005" font-size="24" fill="#2e6b62" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;پھل&#x200F;</text><line x1="30" y1="433.20000000000005" x2="870" y2="433.20000000000005" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="463.55" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Active to passive</text><text x="46" y="486.55" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">(or back)</text><text x="564" y="483.6" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;انتظامیہ نے سڑکیں بند کیں&#x200F;</text><text x="854" y="483.6" font-size="24" fill="#2e6b62" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;سڑکیں بند کی گئیں&#x200F;</text><line x1="30" y1="507.6" x2="870" y2="507.6" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="562.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Combine with a</text><text x="46" y="585.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">connective</text><text x="564" y="558" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;بارش بہت ہوئی۔&#x200F;</text><text x="564" y="608" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;اسکول بند ہو گئے۔&#x200F;</text><text x="854" y="558" font-size="24" fill="#2e6b62" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;شدید بارش کے باعث&#x200F;</text><text x="854" y="608" font-size="24" fill="#2e6b62" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;اسکول بند ہو گئے۔&#x200F;</text><rect x="30" y="654" width="840" height="70" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="54" y="697" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Combining saves words and shows W2 linking at the same time. Names and terms may stay.</text>
</svg>