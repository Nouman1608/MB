<!-- place after: ## Two words, two jobs -->
<figure class="topic-figure">
  <img src="https://img.marlbridge.com/ap-english-language-5-2-unity-coherence-study-guide--01-unity-and-coherence.webp" width="900" height="677" alt="On the left, unity: sentences link to one controlling claim while an off-topic sentence floats free. On the right, coherence: sentences S1 to S4 are chained so each leads to the next. A table gives the three levels of coherence: sentence, paragraph and text." loading="lazy">

<!-- place after: ## How ideas link -->
<figure class="topic-figure">
  <img src="https://img.marlbridge.com/ap-english-language-5-2-unity-coherence-study-guide--02-known-then-new.webp" width="900" height="542" alt="Three sentences about the bypass, each split into a known part and a new part, with arrows showing that the new part of one sentence becomes the known start of the next: the town built a bypass; the bypass diverted traffic; without the traffic, the shops attracted walkers." loading="lazy">
  <figcaption>Begin with something already mentioned; end with something new.</figcaption>
</figure>

<!-- place after: ## What breaks unity and coherence -->
<figure class="topic-figure">
  <img src="https://img.marlbridge.com/ap-english-language-5-2-unity-coherence-study-guide--03-what-breaks-coherence.webp" width="900" height="572" alt="Six problems with their repairs: cut or move an off-topic sentence; add the missing idea or a transition for a jump; reorder when a conclusion precedes its evidence; keep one key term instead of shifting vocabulary; name the noun for a vague pronoun; split a paragraph with two main ideas." loading="lazy">
  <figcaption>Most failures of unity and coherence are fixed by cutting, reordering, naming or splitting.</figcaption>
</figure>

<!-- place after: ## Weak and strong versions side by side -->
<figure class="topic-figure">
  <img src="https://img.marlbridge.com/ap-english-language-5-2-unity-coherence-study-guide--04-cycle-lane-paragraph.webp" width="900" height="555" alt="The weak paragraph is five separate chips about bicycles, the bypass, weekend cycling, cost and helmets. The strong paragraph is four linked sentences: a controlling claim that a cycle lane would cheaply reduce traffic, then cost, then the effect on journeys, then the effect on traffic and the bypass." loading="lazy">
  <figcaption>A controlling claim and known-then-new links turn related facts into an argument.</figcaption>
</figure>
