<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 730" width="900" height="730" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="730" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Specialisation at three levels</text>

<text x="400" y="128" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">Advantages</text><text x="730" y="128" font-size="19" font-weight="700" fill="#b5602e" text-anchor="middle">Disadvantages</text><rect x="30" y="145" width="140" height="145" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="100" y="224.15" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Individual</text><rect x="185" y="145" width="335" height="145" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="215" cy="181.4" r="12" fill="#2e6b62"/><path d="M209.6,181.64000000000001 L213.8,185.96 L221,177.20000000000002" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="235" y="187" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Skilled and quick at one task</text><circle cx="215" cy="216.4" r="12" fill="#2e6b62"/><path d="M209.6,216.64000000000001 L213.8,220.96 L221,212.20000000000002" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="235" y="222" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">May earn more as an expert</text><rect x="535" y="145" width="335" height="145" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="565" cy="181.4" r="12" fill="#b5602e"/><path d="M560.44,176.84 L569.56,185.96 M569.56,176.84 L560.44,185.96" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="585" y="187" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Repetitive and boring work</text><circle cx="565" cy="216.4" r="12" fill="#b5602e"/><path d="M560.44,211.84 L569.56,220.96 M569.56,211.84 L560.44,220.96" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="585" y="222" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Skills may become outdated or</text><text x="585" y="243" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">automated</text><rect x="30" y="305" width="140" height="145" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="100" y="384.15" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Factory</text><rect x="185" y="305" width="335" height="145" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="215" cy="341.4" r="12" fill="#2e6b62"/><path d="M209.6,341.64 L213.8,345.96 L221,337.2" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="235" y="347" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Higher output, lower cost per</text><text x="235" y="368" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">unit</text><circle cx="215" cy="397.4" r="12" fill="#2e6b62"/><path d="M209.6,397.64 L213.8,401.96 L221,393.2" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="235" y="403" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Specialist machinery; consistent</text><text x="235" y="424" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">quality</text><rect x="535" y="305" width="335" height="145" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="565" cy="341.4" r="12" fill="#b5602e"/><path d="M560.44,336.84 L569.56,345.96 M569.56,336.84 L560.44,345.96" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="585" y="347" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Depends on one product</text><circle cx="565" cy="376.4" r="12" fill="#b5602e"/><path d="M560.44,371.84 L569.56,380.96 M569.56,371.84 L560.44,380.96" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="585" y="382" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">One breakdown can stop the whole</text><text x="585" y="403" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">line</text><rect x="30" y="465" width="140" height="145" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="100" y="544.15" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Country</text><rect x="185" y="465" width="335" height="145" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="215" cy="501.4" r="12" fill="#2e6b62"/><path d="M209.6,501.64 L213.8,505.96 L221,497.2" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="235" y="507" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Makes what it is best placed to</text><text x="235" y="528" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">make</text><circle cx="215" cy="557.4" r="12" fill="#2e6b62"/><path d="M209.6,557.64 L213.8,561.9599999999999 L221,553.1999999999999" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="235" y="563" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Earns export income</text><rect x="535" y="465" width="335" height="145" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="565" cy="501.4" r="12" fill="#b5602e"/><path d="M560.44,496.84 L569.56,505.96 M569.56,496.84 L560.44,505.96" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="585" y="507" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Depends on imports for other</text><text x="585" y="528" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">goods</text><circle cx="565" cy="557.4" r="12" fill="#b5602e"/><path d="M560.44,552.84 L569.56,561.9599999999999 M569.56,552.84 L560.44,561.9599999999999" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="585" y="563" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Exposed if world demand or price</text><text x="585" y="584" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">falls</text><rect x="30" y="635" width="840" height="70" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="677" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="middle">Specialisation only works because of trade: specialists exchange for everything else.</text>
</svg>