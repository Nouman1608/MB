<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 725" width="900" height="725" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="725" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Automation and EDI</text>

<rect x="30" y="110" width="840" height="175" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="146" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">How EDI works</text><rect x="54" y="170" width="220" height="90" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="164" y="209.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Buyer’s system</text><text x="164" y="231.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">stock runs low</text><rect x="626" y="170" width="220" height="90" rx="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="736" y="220.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Supplier’s system</text><line x1="282" y1="196" x2="618" y2="196" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><text x="450" y="186" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="middle">order sent automatically</text><line x1="618" y1="238" x2="282" y2="238" stroke="#8a6d0d" stroke-width="4" marker-end="url(#ahO)"/><text x="450" y="264" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="middle">invoice back, standard format, no paper</text><rect x="30" y="305" width="410" height="395" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="343" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Automation (robotics)</text><circle cx="64" cy="377.4" r="12" fill="#2e6b62"/><path d="M58.6,377.64 L62.8,381.96 L70,373.2" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="84" y="383" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Faster, continuous output</text><circle cx="64" cy="408.4" r="12" fill="#2e6b62"/><path d="M58.6,408.64 L62.8,412.96 L70,404.2" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="84" y="414" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Consistent quality</text><circle cx="64" cy="439.4" r="12" fill="#2e6b62"/><path d="M58.6,439.64 L62.8,443.96 L70,435.2" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="84" y="445" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Lower labour cost per unit in the long</text><text x="84" y="466" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">run</text><circle cx="64" cy="491.4" r="12" fill="#2e6b62"/><path d="M58.6,491.64 L62.8,495.96 L70,487.2" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="84" y="497" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Robots do dangerous or repetitive work</text><circle cx="64" cy="546.4" r="12" fill="#b5602e"/><path d="M59.44,541.84 L68.56,550.9599999999999 M68.56,541.84 L59.44,550.9599999999999" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="84" y="552" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">High cost to buy and install</text><circle cx="64" cy="577.4" r="12" fill="#b5602e"/><path d="M59.44,572.84 L68.56,581.9599999999999 M68.56,572.84 L59.44,581.9599999999999" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="84" y="583" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Job losses or retraining</text><circle cx="64" cy="608.4" r="12" fill="#b5602e"/><path d="M59.44,603.84 L68.56,612.9599999999999 M68.56,603.84 L59.44,612.9599999999999" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="84" y="614" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Breakdowns can halt production</text><circle cx="64" cy="639.4" r="12" fill="#b5602e"/><path d="M59.44,634.84 L68.56,643.9599999999999 M68.56,634.84 L59.44,643.9599999999999" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="84" y="645" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Less flexible for small, customised</text><text x="84" y="666" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">orders</text><rect x="460" y="305" width="410" height="395" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="482" y="343" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">EDI with suppliers</text><circle cx="494" cy="377.4" r="12" fill="#2e6b62"/><path d="M488.6,377.64 L492.8,381.96 L500,373.2" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="514" y="383" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Orders placed instantly when stock is</text><text x="514" y="404" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">low</text><circle cx="494" cy="429.4" r="12" fill="#2e6b62"/><path d="M488.6,429.64 L492.8,433.96 L500,425.2" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="514" y="435" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Fewer retyping errors</text><circle cx="494" cy="460.4" r="12" fill="#2e6b62"/><path d="M488.6,460.64 L492.8,464.96 L500,456.2" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="514" y="466" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Lower paperwork costs</text><circle cx="494" cy="491.4" r="12" fill="#2e6b62"/><path d="M488.6,491.64 L492.8,495.96 L500,487.2" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="514" y="497" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Can hold less stock</text><circle cx="494" cy="546.4" r="12" fill="#b5602e"/><path d="M489.44,541.84 L498.56,550.9599999999999 M498.56,541.84 L489.44,550.9599999999999" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="514" y="552" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Set-up cost; compatible systems needed</text><circle cx="494" cy="577.4" r="12" fill="#b5602e"/><path d="M489.44,572.84 L498.56,581.9599999999999 M498.56,572.84 L489.44,581.9599999999999" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="514" y="583" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Dependence on networks</text><circle cx="494" cy="608.4" r="12" fill="#b5602e"/><path d="M489.44,603.84 L498.56,612.9599999999999 M498.56,603.84 L489.44,612.9599999999999" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="514" y="614" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Cyber attack; errors spread</text><text x="514" y="635" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">automatically</text>
</svg>