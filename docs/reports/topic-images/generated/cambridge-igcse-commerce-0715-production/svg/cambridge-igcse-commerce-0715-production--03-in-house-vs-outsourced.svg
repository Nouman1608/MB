<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 605" width="900" height="605" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="605" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">In-house or outsourced production?</text>

<rect x="30" y="110" width="410" height="330" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="235" y="148" font-size="23" font-weight="700" fill="#8a6d0d" text-anchor="middle">In-house</text><text x="235" y="174" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">own staff and equipment</text><circle cx="66" cy="212.05" r="12" fill="#2e6b62"/><path d="M60.6,212.29000000000002 L64.8,216.61 L72,207.85000000000002" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="86" y="218" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Control on quality</text><circle cx="66" cy="250.05" r="12" fill="#2e6b62"/><path d="M60.6,250.29000000000002 L64.8,254.61 L72,245.85000000000002" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="86" y="256" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Control of information: designs stay</text><text x="86" y="278" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">secret</text><circle cx="66" cy="310.05" r="12" fill="#2e6b62"/><path d="M60.6,310.29 L64.8,314.61 L72,305.85" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="86" y="316" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Easier to change product or schedule</text><circle cx="66" cy="348.05" r="12" fill="#2e6b62"/><path d="M60.6,348.29 L64.8,352.61 L72,343.85" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="86" y="354" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Not dependent on another firm</text><rect x="460" y="110" width="410" height="330" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="665" y="148" font-size="23" font-weight="700" fill="#2e6b62" text-anchor="middle">Outsourced</text><text x="665" y="174" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">pay another business to do it</text><circle cx="496" cy="212.05" r="12" fill="#2e6b62"/><path d="M490.6,212.29000000000002 L494.8,216.61 L502,207.85000000000002" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="516" y="218" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Access to expertise</text><circle cx="496" cy="250.05" r="12" fill="#2e6b62"/><path d="M490.6,250.29000000000002 L494.8,254.61 L502,245.85000000000002" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="516" y="256" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Cost savings: scale or lower wages</text><circle cx="496" cy="288.05" r="12" fill="#2e6b62"/><path d="M490.6,288.29 L494.8,292.61 L502,283.85" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="516" y="294" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">No machinery to buy, no staff to</text><text x="516" y="316" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">train</text><circle cx="496" cy="348.05" r="12" fill="#2e6b62"/><path d="M490.6,348.29 L494.8,352.61 L502,343.85" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="516" y="354" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Managers focus on core activities</text><rect x="30" y="460" width="410" height="120" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="494" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="start">Points to in-house</text><text x="54" y="522" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A secret formula, or a brand that depends</text><text x="54" y="543" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">on quality</text><rect x="460" y="460" width="410" height="120" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="484" y="494" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Points to outsourcing</text><text x="484" y="522" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A small firm launching a new product with</text><text x="484" y="543" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">little capital</text>
</svg>