<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 690" width="900" height="690" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="690" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Intermediaries in a supply chain</text>

<rect x="30" y="110" width="840" height="200" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="146" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Home trade</text><rect x="54" y="170" width="170" height="56" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="139" y="204.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Producer</text><line x1="228" y1="198" x2="256" y2="198" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="262" y="170" width="170" height="56" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="347" y="204.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Wholesaler</text><line x1="436" y1="198" x2="464" y2="198" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="470" y="170" width="170" height="56" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="555" y="204.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Retailer</text><line x1="644" y1="198" x2="672" y2="198" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="678" y="170" width="170" height="56" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="763" y="204.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Consumer</text><text x="347" y="254" font-size="15" font-weight="600" fill="#8a6d0d" text-anchor="middle">buys in bulk, stores,</text><text x="347" y="274" font-size="15" font-weight="600" fill="#8a6d0d" text-anchor="middle">breaks bulk</text><text x="555" y="254" font-size="15" font-weight="600" fill="#8a6d0d" text-anchor="middle">sells in the amounts,</text><text x="555" y="274" font-size="15" font-weight="600" fill="#8a6d0d" text-anchor="middle">places and times that</text><text x="555" y="294" font-size="15" font-weight="600" fill="#8a6d0d" text-anchor="middle">suit</text><text x="450" y="345" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">International trade adds two</text><rect x="30" y="365" width="410" height="300" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="50" y="382" width="150" height="46" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="125" y="411.65" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Agent</text><text x="52" y="470" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Owns the goods?</text><text x="52" y="494" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">No</text><text x="52" y="528" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Holds the goods?</text><text x="52" y="552" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">No: arranges sales or purchases</text><text x="52" y="586" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Paid by</text><text x="52" y="610" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Commission</text><text x="235" y="640" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="middle" font-style="italic">Brings knowledge of local market, language, laws</text><rect x="460" y="365" width="410" height="300" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="480" y="382" width="150" height="46" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="555" y="411.65" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Factor</text><text x="482" y="470" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Owns the goods?</text><text x="482" y="494" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">No</text><text x="482" y="528" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Holds the goods?</text><text x="482" y="552" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Yes: has possession, sells in own name</text><text x="482" y="586" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Paid by</text><text x="482" y="610" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Commission</text><text x="665" y="640" font-size="15" font-weight="400" fill="#8a6d0d" text-anchor="middle" font-style="italic">Can deliver quickly to local buyers</text>
</svg>