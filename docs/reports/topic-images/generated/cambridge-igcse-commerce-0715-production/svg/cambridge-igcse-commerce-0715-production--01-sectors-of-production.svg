<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 705" width="900" height="705" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="705" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four sectors of production</text>

<text x="160" y="128" font-size="16" font-weight="700" fill="#4a5568" text-anchor="middle">Sector</text><text x="300" y="128" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">Features and examples</text><text x="760" y="128" font-size="16" font-weight="700" fill="#4a5568" text-anchor="middle">It sells…</text><rect x="30" y="142" width="250" height="116" rx="14" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="155" y="192" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Primary</text><text x="155" y="220" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">Extractive industries</text><rect x="290" y="142" width="370" height="116" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="306" y="174" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Takes natural resources from land or sea</text><text x="306" y="203" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">e.g. Farming, fishing, mining, forestry,</text><text x="306" y="224" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">oil drilling</text><line x1="666" y1="200" x2="690" y2="200" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="700" y="170" width="170" height="60" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="785" y="205.6" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">a raw material</text><rect x="30" y="272" width="250" height="116" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="155" y="322" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Secondary</text><text x="155" y="350" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">Manufacturing and</text><text x="155" y="370" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">construction</text><rect x="290" y="272" width="370" height="116" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="306" y="304" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Turns raw materials into goods, or</text><text x="306" y="325" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">builds structures</text><text x="306" y="354" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">e.g. Textile mill, car assembly, house</text><text x="306" y="375" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">building</text><line x1="666" y1="330" x2="690" y2="330" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="700" y="300" width="170" height="60" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="785" y="325.1" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">a product or</text><text x="785" y="346.1" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">building</text><rect x="30" y="402" width="250" height="116" rx="14" fill="#e6b79a" stroke="#1e2a44" stroke-width="2.5"/><text x="155" y="452" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Tertiary</text><text x="155" y="480" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">Commercial and direct</text><text x="155" y="500" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">services</text><rect x="290" y="402" width="370" height="116" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="306" y="434" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Commercial services help trade; direct</text><text x="306" y="455" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">services are given to people personally</text><text x="306" y="484" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">e.g. Bank, courier, school, salon</text><line x1="666" y1="460" x2="690" y2="460" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="700" y="430" width="170" height="60" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="785" y="465.6" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">a service</text><rect x="30" y="532" width="250" height="116" rx="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="155" y="582" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Quaternary</text><text x="155" y="610" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">Digital technology</text><rect x="290" y="532" width="370" height="116" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="306" y="564" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Knowledge-based: creates, processes and</text><text x="306" y="585" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">shares information</text><text x="306" y="614" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">e.g. Software and apps, data analysis,</text><text x="306" y="635" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">cloud services</text><line x1="666" y1="590" x2="690" y2="590" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="700" y="560" width="170" height="60" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="785" y="574.6" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">digital or</text><text x="785" y="595.6" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">information</text><text x="785" y="616.6" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">products</text><text x="450" y="680" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">Construction is secondary, not primary.</text>
</svg>