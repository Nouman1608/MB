<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Isotopes: same protons, different neutrons</text>

<rect x="30" y="110" width="840" height="420" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="160" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">three isotopes of hydrogen</text><circle cx="180" cy="290" r="90" fill="none" stroke="#c9d6d4" stroke-width="2" stroke-dasharray="6 5"/><circle cx="180" cy="290" r="11" fill="#b5602e" stroke="#1e2a44" stroke-width="1.8"/><text x="180" y="295" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">+</text><circle cx="254.28020534187107" cy="239.18217739444682" r="9" fill="#2e6b62" stroke="#1e2a44" stroke-width="1.5"/><text x="254.28020534187107" y="244.18217739444682" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">−</text><text x="170" y="422.32" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1</text><text x="170" y="444.08" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1</text><text x="174" y="440" font-size="34" font-weight="700" fill="#1e2a44" text-anchor="start">H</text><text x="180" y="480" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">no neutrons</text><text x="180" y="504" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">1 proton, 1 electron</text><circle cx="450" cy="290" r="90" fill="none" stroke="#c9d6d4" stroke-width="2" stroke-dasharray="6 5"/><circle cx="442" cy="290" r="11" fill="#b5602e" stroke="#1e2a44" stroke-width="1.8"/><text x="442" y="295" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">+</text><circle cx="460" cy="278" r="11" fill="#c9ced4" stroke="#1e2a44" stroke-width="1.8"/><circle cx="524.280205341871" cy="239.18217739444682" r="9" fill="#2e6b62" stroke="#1e2a44" stroke-width="1.5"/><text x="524.280205341871" y="244.18217739444682" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">−</text><text x="440" y="422.32" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">2</text><text x="440" y="444.08" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1</text><text x="444" y="440" font-size="34" font-weight="700" fill="#1e2a44" text-anchor="start">H</text><text x="450" y="480" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">one neutron</text><text x="450" y="504" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">1 proton, 1 electron</text><circle cx="720" cy="290" r="90" fill="none" stroke="#c9d6d4" stroke-width="2" stroke-dasharray="6 5"/><circle cx="712" cy="290" r="11" fill="#b5602e" stroke="#1e2a44" stroke-width="1.8"/><text x="712" y="295" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">+</text><circle cx="730" cy="278" r="11" fill="#c9ced4" stroke="#1e2a44" stroke-width="1.8"/><circle cx="734" cy="306" r="11" fill="#c9ced4" stroke="#1e2a44" stroke-width="1.8"/><circle cx="794.280205341871" cy="239.18217739444682" r="9" fill="#2e6b62" stroke="#1e2a44" stroke-width="1.5"/><text x="794.280205341871" y="244.18217739444682" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">−</text><text x="710" y="422.32" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">3</text><text x="710" y="444.08" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1</text><text x="714" y="440" font-size="34" font-weight="700" fill="#1e2a44" text-anchor="start">H</text><text x="720" y="480" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">two neutrons</text><text x="720" y="504" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">1 proton, 1 electron</text><rect x="30" y="540" width="840" height="44" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="567.95" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Different Z means a different element, never an isotope.</text>
