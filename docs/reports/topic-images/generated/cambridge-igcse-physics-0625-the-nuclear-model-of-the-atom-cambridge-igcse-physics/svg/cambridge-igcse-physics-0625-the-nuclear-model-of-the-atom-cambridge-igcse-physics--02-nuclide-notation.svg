<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="600" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Reading nuclide notation</text>

<rect x="30" y="110" width="840" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="376" y="262.8" font-size="55" font-weight="700" fill="#1e2a44" text-anchor="end">23</text><text x="376" y="333.2" font-size="55" font-weight="700" fill="#1e2a44" text-anchor="end">11</text><text x="380" y="320" font-size="110" font-weight="700" fill="#1e2a44" text-anchor="start">Na</text><line x1="260" y1="205" x2="330" y2="240" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><text x="70" y="190" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">A = nucleon number:</text><text x="70" y="216" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">protons + neutrons</text><line x1="260" y1="350" x2="330" y2="340" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><text x="70" y="340" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Z = proton number:</text><text x="70" y="366" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">fixes the element</text><line x1="580" y1="250" x2="520" y2="270" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="590" y="245" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">X = chemical</text><text x="590" y="271" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">symbol</text><rect x="560" y="330" width="290" height="70" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="705" y="357.65" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">neutrons = A − Z</text><text x="705" y="385.65" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">= 23 − 11 = 12</text><rect x="30" y="455" width="148.8" height="30" rx="15" fill="#8a6d0d"/><text x="42" y="476" font-size="16" font-weight="700" fill="#ffffff" text-anchor="start">Extended only</text><rect x="30" y="495" width="840" height="85" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="106" y="529.28" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">56</text><text x="106" y="552.32" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">26</text><text x="110" y="548" font-size="36" font-weight="700" fill="#1e2a44" text-anchor="start">Fe</text><text x="190" y="535" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start">relative charge of the nucleus = Z = +26</text><text x="190" y="563" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start">relative mass of the nucleus = A = 56</text>
</svg>