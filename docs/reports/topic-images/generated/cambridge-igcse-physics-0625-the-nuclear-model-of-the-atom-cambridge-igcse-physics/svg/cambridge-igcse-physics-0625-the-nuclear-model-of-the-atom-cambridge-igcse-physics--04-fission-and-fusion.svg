<rect x="30" y="72" width="148.8" height="30" rx="15" fill="#8a6d0d"/><text x="42" y="93" font-size="16" font-weight="700" fill="#ffffff" text-anchor="start">Extended only</text><rect x="30" y="110" width="410" height="210" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="235" y="145" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Fission</text><g transform="translate(-30,0)"><circle cx="80" cy="230" r="10" fill="#c9ced4" stroke="#1e2a44" stroke-width="2.5"/><line x1="95" y1="230" x2="135" y2="230" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><circle cx="190" cy="230" r="46" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="190" y="236" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">U-235</text><line x1="245" y1="230" x2="300" y2="230" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><circle cx="360" cy="195" r="38" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="360" y="201" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">Xe-140</text><circle cx="360" cy="285" r="32" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="360" y="291" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">Sr-94</text><circle cx="430" cy="225" r="10" fill="#c9ced4" stroke="#1e2a44" stroke-width="2.5"/><circle cx="430" cy="255" r="10" fill="#c9ced4" stroke="#1e2a44" stroke-width="2.5"/><line x1="443" y1="222" x2="465" y2="212" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><line x1="443" y1="258" x2="465" y2="268" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/></g><text x="50" y="260" font-size="14" font-weight="400" fill="#4a5568" text-anchor="middle">neutron</text><rect x="460" y="110" width="410" height="210" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="665" y="145" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Fusion</text><circle cx="560" cy="205" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="560" y="210" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">²H</text><circle cx="560" cy="265" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="560" y="270" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">³H</text><line x1="595" y1="235" x2="660" y2="235" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><circle cx="720" cy="235" r="30" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="720" y="240" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">⁴He</text><circle cx="790" cy="235" r="10" fill="#c9ced4" stroke="#1e2a44" stroke-width="2.5"/><line x1="803" y1="235" x2="835" y2="235" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="30" y="340" width="410" height="148" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="376" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Fission: splitting</text><text x="50" y="410" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">²³⁵U + ¹n → ¹⁴⁰Xe + ⁹⁴Sr + 2 ¹n</text><text x="50" y="440" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">top: 235 + 1 = 236 = 140 + 94 + 2</text><text x="50" y="470" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">bottom: 92 + 0 = 92 = 54 + 38 + 0</text><rect x="460" y="340" width="410" height="148" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="480" y="376" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Fusion: joining</text><text x="480" y="410" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">²H + ³H → ⁴He + ¹n</text><text x="480" y="440" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">top: 2 + 3 = 5 = 4 + 1</text><text x="480" y="470" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">bottom: 1 + 1 = 2 = 2 + 0</text><rect x="30" y="504" width="840" height="64" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="529.45" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">In both, the products have slightly less mass: the lost mass is released as energy,</text><text x="450" y="554.45" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">mostly kinetic energy of the products.</text>
