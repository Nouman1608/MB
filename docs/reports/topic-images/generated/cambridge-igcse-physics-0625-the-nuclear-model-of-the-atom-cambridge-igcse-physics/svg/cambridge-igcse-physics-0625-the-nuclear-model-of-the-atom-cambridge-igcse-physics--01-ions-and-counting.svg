<rect width="900" height="638" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Atoms, ions and counting particles</text>

<rect x="30" y="110" width="840" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="165" cy="260" r="80" fill="none" stroke="#c9d6d4" stroke-width="2" stroke-dasharray="6 5"/><circle cx="157" cy="254" r="11" fill="#b5602e" stroke="#1e2a44" stroke-width="1.8"/><text x="157" y="259" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">+</text><circle cx="174" cy="264" r="11" fill="#b5602e" stroke="#1e2a44" stroke-width="1.8"/><text x="174" y="269" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">+</text><circle cx="171" cy="248" r="11" fill="#c9ced4" stroke="#1e2a44" stroke-width="1.8"/><circle cx="156" cy="270" r="11" fill="#c9ced4" stroke="#1e2a44" stroke-width="1.8"/><circle cx="165" cy="180" r="9" fill="#2e6b62" stroke="#1e2a44" stroke-width="1.5"/><text x="165" y="185" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">−</text><circle cx="165" cy="340" r="9" fill="#2e6b62" stroke="#1e2a44" stroke-width="1.5"/><text x="165" y="345" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">−</text><text x="165" y="380" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">neutral atom</text><text x="165" y="404" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">2 protons, 2 electrons</text><circle cx="450" cy="260" r="80" fill="none" stroke="#c9d6d4" stroke-width="2" stroke-dasharray="6 5"/><circle cx="442" cy="254" r="11" fill="#b5602e" stroke="#1e2a44" stroke-width="1.8"/><text x="442" y="259" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">+</text><circle cx="459" cy="264" r="11" fill="#b5602e" stroke="#1e2a44" stroke-width="1.8"/><text x="459" y="269" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">+</text><circle cx="456" cy="248" r="11" fill="#c9ced4" stroke="#1e2a44" stroke-width="1.8"/><circle cx="441" cy="270" r="11" fill="#c9ced4" stroke="#1e2a44" stroke-width="1.8"/><text x="450" y="380" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">positive ion, +2</text><text x="450" y="404" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">lost 2 electrons</text><circle cx="735" cy="260" r="80" fill="none" stroke="#c9d6d4" stroke-width="2" stroke-dasharray="6 5"/><circle cx="727" cy="254" r="11" fill="#b5602e" stroke="#1e2a44" stroke-width="1.8"/><text x="727" y="259" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">+</text><circle cx="744" cy="264" r="11" fill="#b5602e" stroke="#1e2a44" stroke-width="1.8"/><text x="744" y="269" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">+</text><circle cx="741" cy="248" r="11" fill="#c9ced4" stroke="#1e2a44" stroke-width="1.8"/><circle cx="726" cy="270" r="11" fill="#c9ced4" stroke="#1e2a44" stroke-width="1.8"/><circle cx="735" cy="180" r="9" fill="#2e6b62" stroke="#1e2a44" stroke-width="1.5"/><text x="735" y="185" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">−</text><circle cx="815" cy="260" r="9" fill="#2e6b62" stroke="#1e2a44" stroke-width="1.5"/><text x="815" y="265" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">−</text><circle cx="735" cy="340" r="9" fill="#2e6b62" stroke="#1e2a44" stroke-width="1.5"/><text x="735" y="345" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">−</text><circle cx="655" cy="260" r="9" fill="#2e6b62" stroke="#1e2a44" stroke-width="1.5"/><text x="655" y="265" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">−</text><text x="735" y="380" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">negative ion, −2</text><text x="735" y="404" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">gained 2 electrons</text><text x="450" y="150" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">the nucleus never changes when an ion forms</text><rect x="30" y="460" width="410" height="148" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="496" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Strontium-90 atom</text><text x="50" y="530" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">protons = Z = 38</text><text x="50" y="560" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">neutrons = A − Z = 90 − 38 = 52</text><text x="50" y="590" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">electrons = 38 (neutral)</text><rect x="460" y="460" width="410" height="148" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="480" y="496" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Sulfur-32 ion, charge −2</text><text x="480" y="530" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">protons = 16</text><text x="480" y="560" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">neutrons = 32 − 16 = 16</text><text x="480" y="590" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">electrons = 16 + 2 = 18</text>
</svg>