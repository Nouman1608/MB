<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 662" width="900" height="662" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="662" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Identifying a passage's theme</text>

<rect x="30" y="112" width="840" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="158" r="22" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><text x="76" y="165.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="116" y="152" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Read the whole passage</text><text x="116" y="182" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Do not judge the theme from the first line alone.</text><rect x="30" y="218" width="840" height="188" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><circle cx="76" cy="264" r="22" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="76" y="271.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="116" y="258" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Ask what it establishes about God</text><rect x="116" y="298" width="232" height="90" rx="12" fill="#ffffff" stroke="#d4b02e" stroke-width="2"/><text x="232" y="330" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">God in Himself</text><text x="232" y="368.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">His nature</text><rect x="366" y="298" width="232" height="90" rx="12" fill="#ffffff" stroke="#d4b02e" stroke-width="2"/><text x="482" y="330" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">God and creation</text><text x="482" y="358.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">His relationship with</text><text x="482" y="378.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">creation</text><rect x="616" y="298" width="232" height="90" rx="12" fill="#ffffff" stroke="#d4b02e" stroke-width="2"/><text x="732" y="330" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">God's Messengers</text><text x="732" y="368.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">The role of a messenger</text><rect x="30" y="420" width="840" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="466" r="22" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><text x="76" y="473.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="116" y="460" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Note any secondary themes</text><text x="116" y="490" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Many passages touch more than one category: name the primary one, acknowledge the</text><text x="116" y="512" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">others.</text><rect x="30" y="546" width="840" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="592" r="22" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><text x="76" y="599.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="116" y="586" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Support it with the text</text><text x="116" y="616" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Name a specific phrase or idea from the passage.</text>
</svg>