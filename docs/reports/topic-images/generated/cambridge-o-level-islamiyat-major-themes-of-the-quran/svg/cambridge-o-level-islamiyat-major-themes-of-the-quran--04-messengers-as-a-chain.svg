<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 532" width="900" height="532" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="532" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">God's Messengers as a theme</text>

<circle cx="110" cy="170" r="38" fill="#dce9e7" stroke="#2e6b62" stroke-width="3"/><text x="110" y="177" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">prophet</text><line x1="150" y1="170" x2="228" y2="170" stroke="#1e2a44" stroke-width="4" stroke-dasharray="2 8" stroke-linecap="round"/><circle cx="270" cy="170" r="38" fill="#dce9e7" stroke="#2e6b62" stroke-width="3"/><text x="270" y="177" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">prophet</text><line x1="310" y1="170" x2="388" y2="170" stroke="#1e2a44" stroke-width="4" stroke-dasharray="2 8" stroke-linecap="round"/><circle cx="430" cy="170" r="38" fill="#dce9e7" stroke="#2e6b62" stroke-width="3"/><text x="430" y="177" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">prophet</text><line x1="470" y1="170" x2="548" y2="170" stroke="#1e2a44" stroke-width="4" stroke-dasharray="2 8" stroke-linecap="round"/><circle cx="590" cy="170" r="38" fill="#dce9e7" stroke="#2e6b62" stroke-width="3"/><text x="590" y="177" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">prophet</text><line x1="630" y1="170" x2="708" y2="170" stroke="#1e2a44" stroke-width="4" stroke-dasharray="2 8" stroke-linecap="round"/><circle cx="750" cy="170" r="38" fill="#f2e7b8" stroke="#d4b02e" stroke-width="3"/><text x="750" y="177" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">...</text><text x="450" y="240" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">A connected chain with one consistent core message across times and communities</text><rect x="30" y="268" width="272" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="166" y="322" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Deliver guidance</text><rect x="314" y="268" width="272" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="304" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Warn communities</text><text x="450" y="331.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">of the consequences of</text><text x="450" y="351.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">rejecting it</text><rect x="598" y="268" width="272" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="734" y="304" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Model righteous conduct</text><text x="734" y="341.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">for others to follow</text><text x="450" y="404" font-size="18" font-weight="700" fill="#4a5568" text-anchor="middle">An answer on a prophet passage needs both:</text><rect x="70" y="424" width="340" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="240" y="461.07" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">The account of the prophet's</text><text x="240" y="482.83" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">mission</text><text x="450" y="476" font-size="30" font-weight="700" fill="#1e2a44" text-anchor="middle">+</text><rect x="490" y="424" width="340" height="84" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="3"/><text x="660" y="450.95" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">The wider lesson: faith,</text><text x="660" y="471.95" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">patience or the people's</text><text x="660" y="492.95" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">response</text>
</svg>