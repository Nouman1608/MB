<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Question 1 at a glance</text>

<rect x="90" y="120" width="220" height="110" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="3.5"/><text x="200" y="166" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Passage A</text><text x="200" y="198" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="middle">chosen</text><rect x="340" y="120" width="220" height="110" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="3.5"/><text x="450" y="166" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Passage B</text><text x="450" y="198" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="middle">chosen</text><rect x="590" y="120" width="220" height="110" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="700" y="166" font-size="21" font-weight="700" fill="#4a5568" text-anchor="middle">Passage C</text><text x="700" y="198" font-size="16" font-weight="600" fill="#4a5568" text-anchor="middle">not chosen</text><text x="450" y="266" font-size="18" font-weight="700" fill="#4a5568" text-anchor="middle">Three passages set in Arabic and English: choose any two</text><rect x="30" y="290" width="410" height="130" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="56" y="330" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Its themes</text><text x="414" y="330" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="end">4 marks</text><text x="56" y="364" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Name the category and support it with a</text><text x="56" y="386" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">phrase from the passage.</text><rect x="460" y="290" width="410" height="130" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="486" y="330" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Its importance today</text><text x="844" y="330" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="end">4 marks</text><text x="486" y="364" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Explain why it matters for Muslims today.</text><rect x="30" y="444" width="840" height="92" rx="14" fill="#f3dccd" stroke="#b5602e" stroke-width="2.5"/><text x="56" y="480" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Compulsory, so prepare all three categories</text><text x="56" y="510" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Revising only one category risks finding none of the three passages accessible.</text>
