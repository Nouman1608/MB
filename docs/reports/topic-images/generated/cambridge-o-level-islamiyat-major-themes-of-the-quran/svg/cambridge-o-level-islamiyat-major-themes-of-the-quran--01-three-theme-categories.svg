<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 530" width="900" height="530" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="530" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three categories of Qur'anic themes</text>

<rect x="30" y="110" width="272" height="304" rx="14" fill="#ffffff" stroke="#d4b02e" stroke-width="2.5"/><rect x="30" y="110" width="272" height="104" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><circle cx="62" cy="156" r="18" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="62" y="162.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="90" y="150" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">God in Himself</text><text x="90" y="175" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">His nature and attributes</text><circle cx="52" cy="242" r="5" fill="#d4b02e"/><text x="66" y="248" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Oneness (tawhid)</text><circle cx="52" cy="278" r="5" fill="#d4b02e"/><text x="66" y="284" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Power</text><circle cx="52" cy="314" r="5" fill="#d4b02e"/><text x="66" y="320" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Knowledge</text><circle cx="52" cy="350" r="5" fill="#d4b02e"/><text x="66" y="356" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Mercy</text><rect x="314" y="110" width="272" height="304" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><rect x="314" y="110" width="272" height="104" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><circle cx="346" cy="156" r="18" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="346" y="162.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="374" y="150" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">God and the</text><text x="374" y="173" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">created world</text><text x="374" y="198" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">how He relates to creation</text><circle cx="336" cy="242" r="5" fill="#2e6b62"/><text x="350" y="248" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Humanity's purpose and</text><text x="350" y="270" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">responsibility</text><circle cx="336" cy="300" r="5" fill="#2e6b62"/><text x="350" y="306" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Guidance for individual</text><text x="350" y="328" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">and communal life</text><circle cx="336" cy="358" r="5" fill="#2e6b62"/><text x="350" y="364" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Accountability in the</text><text x="350" y="386" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">afterlife (akhirah)</text><rect x="598" y="110" width="272" height="304" rx="14" fill="#ffffff" stroke="#d4b02e" stroke-width="2.5"/><rect x="598" y="110" width="272" height="104" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><circle cx="630" cy="156" r="18" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="630" y="162.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="658" y="150" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">God's Messengers</text><text x="658" y="175" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">why prophets are sent</text><circle cx="620" cy="242" r="5" fill="#d4b02e"/><text x="634" y="248" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Their role and</text><text x="634" y="270" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">significance</text><circle cx="620" cy="300" r="5" fill="#d4b02e"/><text x="634" y="306" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The guidance and</text><text x="634" y="328" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">revelation they brought</text><circle cx="620" cy="358" r="5" fill="#d4b02e"/><text x="634" y="364" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Their relationship with</text><text x="634" y="386" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">their communities</text><rect x="30" y="430" width="840" height="76" rx="14" fill="#1e2a44" stroke="#1e2a44" stroke-width="0"/><text x="450" y="464" font-size="21" font-weight="700" fill="#ffffff" text-anchor="middle">Tawhid: the oneness of God</text><text x="450" y="490" font-size="16" font-weight="400" fill="#f2e7b8" text-anchor="middle">the foundation that frames how every other theme is understood</text>
</svg>