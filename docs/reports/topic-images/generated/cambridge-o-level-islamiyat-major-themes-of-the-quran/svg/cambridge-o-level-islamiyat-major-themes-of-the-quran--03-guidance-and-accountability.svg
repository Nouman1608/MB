iddle" font-style="italic">gives meaning</text><line x1="450" y1="324" x2="450" y2="358" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="150" y="364" width="600" height="90" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="400" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Your answer explains what it teaches</text><text x="450" y="430" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">and why it matters</text>
