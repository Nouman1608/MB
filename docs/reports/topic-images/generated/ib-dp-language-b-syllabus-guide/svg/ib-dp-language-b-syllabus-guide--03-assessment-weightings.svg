<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Assessment at a glance</text>

<text x="46" y="140" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Share of the final grade (SL and HL)</text><text x="50" y="190" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start"></text><rect x="50" y="158" width="200" height="60" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="150" y="194" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Paper 1 writing 25%</text><rect x="250" y="158" width="200" height="60" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="350" y="194" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">listening 25%</text><rect x="450" y="158" width="200" height="60" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="550" y="194" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">reading 25%</text><rect x="650" y="158" width="200" height="60" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="750" y="194" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">oral 25%</text><path d="M250,226 l0,10 l400,0 l0,-10" fill="none" stroke="#2e6b62" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><text x="450" y="260" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="middle">Paper 2, receptive skills: 50%, as much as writing and the oral combined</text><rect x="26" y="290" width="848" height="204" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="324" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Paper 2 by raw marks</text><text x="282" y="324" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">equal weighting, unequal marks</text><text x="50" y="376" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start"></text><rect x="50" y="344" width="307.69230769230774" height="60" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="203.84615384615387" y="380" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">listening: 25 raw marks</text><rect x="357.69230769230774" y="344" width="492.3076923076923" height="60" fill="#2e6b62" stroke="#1e2a44" stroke-width="2"/><text x="603.8461538461539" y="380" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">reading: 40 raw marks</text><text x="450" y="440" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Reading is nearly two-thirds of Paper 2’s raw marks.</text><text x="450" y="468" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">A plan built only on the even 25%/25% split under-prepares reading.</text>
