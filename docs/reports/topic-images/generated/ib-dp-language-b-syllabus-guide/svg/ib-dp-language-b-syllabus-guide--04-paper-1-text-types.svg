<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 604" width="900" height="604" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="604" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Paper 1: text types and criteria</text>

<text x="450" y="128" font-size="18" font-weight="600" fill="#4a5568" text-anchor="middle">One writing task, chosen from three options</text><rect x="30" y="148" width="266" height="196" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="163" y="184" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Personal texts</text><text x="163" y="208" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">for example</text><text x="163" y="240" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">blog post</text><text x="163" y="264" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">diary entry</text><text x="163" y="288" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">email or letter</text><text x="163" y="312" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">to a friend</text><rect x="317" y="148" width="266" height="196" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="184" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Professional texts</text><text x="450" y="208" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">for example</text><text x="450" y="240" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">formal letter</text><text x="450" y="264" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">report</text><text x="450" y="288" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">essay</text><rect x="604" y="148" width="266" height="196" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="737" y="184" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Mass media texts</text><text x="737" y="208" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">for example</text><text x="737" y="240" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">article</text><text x="737" y="264" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">interview</text><text x="737" y="288" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">speech</text><text x="450" y="372" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Examples are neither prescriptive nor exhaustive: each session’s instructions set the text types.</text><text x="450" y="414" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Marked against three criteria</text><rect x="40" y="434" width="240" height="50" rx="9" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="160" y="465.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Language</text><rect x="300" y="434" width="240" height="50" rx="9" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="420" y="465.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Message</text><rect x="560" y="434" width="300" height="50" rx="9" fill="#d4b02e" stroke="#8a6d0d" stroke-width="2"/><text x="710" y="465.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Conceptual understanding</text><rect x="30" y="506" width="840" height="70" rx="14" fill="#fbeee6" stroke="#b5602e" stroke-width="2.5"/><text x="450" y="536" font-size="17" font-weight="600" fill="#b5602e" text-anchor="middle">Conceptual understanding penalises ignoring the expected text type,</text><text x="450" y="560" font-size="17" font-weight="600" fill="#b5602e" text-anchor="middle">register or audience, even when the language is accurate.</text>
</svg>