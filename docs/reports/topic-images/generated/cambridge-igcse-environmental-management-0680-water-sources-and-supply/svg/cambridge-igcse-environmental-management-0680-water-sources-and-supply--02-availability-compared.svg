<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 670" width="900" height="670" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="670" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Who has potable water?</text>

<rect x="30" y="110" width="395" height="128" rx="14" fill="#eef5f4" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="144.15" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Water-rich region</text><text x="48" y="168.95000000000002" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">high rainfall through the year; large</text><text x="48" y="190.07000000000002" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">rivers or lakes; plentiful aquifers</text><rect x="475" y="110" width="395" height="128" rx="14" fill="#fbf1ea" stroke="#b5602e" stroke-width="2.5"/><text x="493" y="144.15" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">Water-poor region</text><text x="493" y="168.95000000000002" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">low or unreliable rainfall; high</text><text x="493" y="190.07000000000002" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">evaporation in hot climates; few permanent</text><text x="493" y="211.19000000000003" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">rivers</text><circle cx="450" cy="174" r="22" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="180" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">vs</text><rect x="30" y="254" width="395" height="128" rx="14" fill="#eef5f4" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="288.15" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Urban</text><text x="48" y="312.95" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">treatment works and piped supplies: many</text><text x="48" y="334.07" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">people in a small area make infrastructure</text><text x="48" y="355.19" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">worth building</text><rect x="475" y="254" width="395" height="128" rx="14" fill="#fbf1ea" stroke="#b5602e" stroke-width="2.5"/><text x="493" y="288.15" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">Rural</text><text x="493" y="312.95" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">wells, rivers or rainwater, maybe</text><text x="493" y="334.07" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">untreated; people may walk long distances</text><text x="493" y="355.19" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">to collect water</text><circle cx="450" cy="318" r="22" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="324" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">vs</text><rect x="30" y="398" width="395" height="128" rx="14" fill="#eef5f4" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="432.15" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Wealthier countries</text><text x="48" y="456.95" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">afford reservoirs, treatment works, pipes</text><text x="48" y="478.07" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and sewage treatment; wastewater cleaned</text><text x="48" y="499.19" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">before release</text><rect x="475" y="398" width="395" height="128" rx="14" fill="#fbf1ea" stroke="#b5602e" stroke-width="2.5"/><text x="493" y="432.15" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">Many lower-income countries</text><text x="493" y="456.95" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">fewer people with piped potable water;</text><text x="493" y="478.07" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">untreated sewage may enter rivers used for</text><text x="493" y="499.19" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">drinking</text><circle cx="450" cy="462" r="22" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="468" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">vs</text><rect x="30" y="548" width="840" height="100" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="60" y="584" font-size="17.5" font-weight="700" fill="#1e2a44" text-anchor="start">Availability also depends on how many people share the water.</text><text x="60" y="614" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Fast-growing cities can outstrip infrastructure, leaving informal settlements without safe water.</text><text x="60" y="636" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Compare with “whereas” and give a reason for each difference.</text>
</svg>