<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: how long will the reservoir last?</text>

<rect x="30" y="110" width="560" height="520" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><line x1="120" y1="530" x2="532.5" y2="530" stroke="#1e2a44" stroke-width="3"/><line x1="120" y1="530" x2="120" y2="140" stroke="#1e2a44" stroke-width="3"/><line x1="112" y1="530" x2="120" y2="530" stroke="#1e2a44" stroke-width="2.5"/><text x="106" y="536" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="end">0</text><line x1="112" y1="470" x2="120" y2="470" stroke="#1e2a44" stroke-width="2.5"/><text x="106" y="476" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="end">2</text><line x1="122" y1="470" x2="532.5" y2="470" stroke="#e3e9e8" stroke-width="1.5"/><line x1="112" y1="410" x2="120" y2="410" stroke="#1e2a44" stroke-width="2.5"/><text x="106" y="416" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="end">4</text><line x1="122" y1="410" x2="532.5" y2="410" stroke="#e3e9e8" stroke-width="1.5"/><line x1="112" y1="350" x2="120" y2="350" stroke="#1e2a44" stroke-width="2.5"/><text x="106" y="356" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="end">6</text><line x1="122" y1="350" x2="532.5" y2="350" stroke="#e3e9e8" stroke-width="1.5"/><line x1="112" y1="290" x2="120" y2="290" stroke="#1e2a44" stroke-width="2.5"/><text x="106" y="296" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="end">8</text><line x1="122" y1="290" x2="532.5" y2="290" stroke="#e3e9e8" stroke-width="1.5"/><line x1="112" y1="230" x2="120" y2="230" stroke="#1e2a44" stroke-width="2.5"/><text x="106" y="236" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="end">10</text><line x1="122" y1="230" x2="532.5" y2="230" stroke="#e3e9e8" stroke-width="1.5"/><line x1="112" y1="170" x2="120" y2="170" stroke="#1e2a44" stroke-width="2.5"/><text x="106" y="176" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="end">12</text><line x1="122" y1="170" x2="532.5" y2="170" stroke="#e3e9e8" stroke-width="1.5"/><line x1="120" y1="530" x2="120" y2="538" stroke="#1e2a44" stroke-width="2.5"/><text x="120" y="558" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="middle">0</text><line x1="195" y1="530" x2="195" y2="538" stroke="#1e2a44" stroke-width="2.5"/><text x="195" y="558" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="middle">60</text><line x1="270" y1="530" x2="270" y2="538" stroke="#1e2a44" stroke-width="2.5"/><text x="270" y="558" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="middle">120</text><line x1="345" y1="530" x2="345" y2="538" stroke="#1e2a44" stroke-width="2.5"/><text x="345" y="558" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="middle">180</text><line x1="420" y1="530" x2="420" y2="538" stroke="#1e2a44" stroke-width="2.5"/><text x="420" y="558" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="middle">240</text><line x1="495" y1="530" x2="495" y2="538" stroke="#1e2a44" stroke-width="2.5"/><text x="495" y="558" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="middle">300</text><text x="326.25" y="586" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">days with no rainfall</text><text x="58" y="350" font-size="16" fill="#4a5568" text-anchor="middle" transform="rotate(-90 58 350)">water stored (million m³)</text><path d="M120,170 L495,530" fill="none" stroke="#2e6b62" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M120,170 L420,530" fill="none" stroke="#b5602e" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="495" cy="530" r="7" fill="#2e6b62" stroke="#1e2a44" stroke-width="2.5"/><circle cx="420" cy="530" r="7" fill="#b5602e" stroke="#1e2a44" stroke-width="2.5"/><text x="320" y="314" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">40,000 m³ a day</text><text x="142" y="470" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">50,000 m³ a day</text><text x="580" y="140" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">invented figures</text><rect x="610" y="110" width="260" height="520" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="632" y="148" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Now</text><text x="632" y="174" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">12,000,000 ÷ 40,000</text><text x="632" y="196" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">= 300 days</text><text x="632" y="248" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">Population +25%</text><text x="632" y="274" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">40,000 × 1.25 = 50,000</text><text x="632" y="296" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">12,000,000 ÷ 50,000</text><text x="632" y="318" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">= 240 days</text><rect x="628" y="360" width="224" height="70" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="740" y="402" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">60 days shorter</text><text x="632" y="470" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Growing cities seek new</text><text x="632" y="491" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">sources, such as</text><text x="632" y="512" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">desalination or extra</text><text x="632" y="533" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">reservoirs, or reduce</text><text x="632" y="554" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">demand.</text>
</svg>