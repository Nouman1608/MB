<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 725" width="900" height="725" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="725" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A multipurpose dam: weighing it up</text>

<rect x="30" y="110" width="840" height="300" rx="14" fill="#eef1f8"/><rect x="30" y="200" width="300" height="210" fill="#b5d3cf"/><line x1="30" y1="200" x2="330" y2="200" stroke="#2e6b62" stroke-width="2.5"/><path d="M30,410 L30,330 Q200,376 330,384 L330,410 Z" fill="#efdfa8" stroke="#1e2a44" stroke-width="2"/><path d="M330,180 L370,180 L400,410 L330,410 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.5"/><rect x="400" y="384" width="470" height="26" fill="#d8e3c6"/><text x="180" y="240" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">reservoir</text><ellipse cx="110" cy="372" rx="16" ry="6" fill="#8a6d0d" opacity="0.7"/><ellipse cx="152" cy="374" rx="16" ry="6" fill="#8a6d0d" opacity="0.7"/><ellipse cx="194" cy="376" rx="16" ry="6" fill="#8a6d0d" opacity="0.7"/><ellipse cx="236" cy="378" rx="16" ry="6" fill="#8a6d0d" opacity="0.7"/><ellipse cx="278" cy="380" rx="16" ry="6" fill="#8a6d0d" opacity="0.7"/><text x="200" y="350" font-size="15.5" font-weight="700" fill="#8a6d0d" text-anchor="middle">silt trapped</text><path d="M400,394 L870,394" fill="none" stroke="#2b5a9a" stroke-width="10" stroke-linejoin="round" stroke-linecap="round" /><text x="560" y="330" font-size="15.5" font-weight="600" fill="#2b5a9a" text-anchor="middle">river downstream:</text><text x="560" y="354" font-size="15.5" font-weight="600" fill="#2b5a9a" text-anchor="middle">steadier flow, less silt</text><rect x="700" y="358" width="33" height="26.400000000000002" fill="#ffffff" stroke="#1e2a44" stroke-width="2.2"/><path d="M696.7,358 L716.5,343.7 L736.3,358 Z" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><rect x="750" y="360" width="30" height="24" fill="#ffffff" stroke="#1e2a44" stroke-width="2.2"/><path d="M747,360 L765,347 L783,360 Z" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><rect x="800" y="358" width="33" height="26.400000000000002" fill="#ffffff" stroke="#1e2a44" stroke-width="2.2"/><path d="M796.7,358 L816.5,343.7 L836.3,358 Z" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><text x="760" y="330" font-size="15.5" font-weight="600" fill="#1e2a44" text-anchor="middle">towns protected from floods</text><text x="860" y="132" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">schematic, not to scale</text><rect x="30" y="430" width="410" height="270" rx="14" fill="#eef5f4" stroke="#2e6b62" stroke-width="2.5"/><text x="54" y="468" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Benefits</text><text x="54" y="500" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="70" y="500" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">water supply, energy and flood control in</text><text x="70" y="521" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">one project</text><text x="54" y="548" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="70" y="548" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">renewable electricity, no emissions in</text><text x="70" y="569" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">use</text><text x="54" y="596" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="70" y="596" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">reliable irrigation raises crop yields</text><text x="54" y="623" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="70" y="623" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">jobs in construction, tourism, fishing</text><text x="54" y="650" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="70" y="650" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">towns downstream protected from floods</text><rect x="460" y="430" width="410" height="270" rx="14" fill="#fbf1ea" stroke="#b5602e" stroke-width="2.5"/><text x="484" y="468" font-size="20" font-weight="700" fill="#b5602e" text-anchor="start">Limitations</text><text x="484" y="500" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="500" y="500" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">very high cost; may need foreign loans</text><text x="484" y="527" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="500" y="527" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">flooded land displaces people; farmland</text><text x="500" y="548" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and habitats lost</text><text x="484" y="575" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="500" y="575" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">silt trapped: reservoir fills; downstream</text><text x="500" y="596" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">farms lose fertile deposits</text><text x="484" y="623" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="500" y="623" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">blocks fish migration; changes ecosystems</text><text x="500" y="644" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">downstream</text><text x="484" y="671" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="500" y="671" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">evaporation losses; disputes with</text><text x="500" y="692" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">countries downstream</text>
</svg>