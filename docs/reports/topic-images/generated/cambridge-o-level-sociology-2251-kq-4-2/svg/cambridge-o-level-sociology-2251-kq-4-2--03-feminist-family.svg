<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" width="900" height="720" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="720" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Feminist views: who does the work, who holds power?</text>

<text x="40" y="150" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="start">Dual burden</text><rect x="230" y="120" width="300" height="48" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="380" y="150" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Paid work</text><rect x="530" y="120" width="300" height="48" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="680" y="150" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Domestic labour</text><text x="40" y="220" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="start">Triple shift</text><text x="40" y="242" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Duncombe and Marsden</text><rect x="230" y="190" width="200" height="48" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="330" y="220" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Paid work</text><rect x="430" y="190" width="200" height="48" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="530" y="220" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Domestic labour</text><rect x="630" y="190" width="200" height="48" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="730" y="220" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Emotion work</text><text x="730" y="260" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">managing feelings and relationships</text><text x="450" y="304" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Bott (1957): conjugal roles</text><rect x="30" y="316" width="411" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="351.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Segregated roles</text><text x="50" y="379.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Separate tasks and leisure for husband and</text><text x="50" y="400.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">wife</text><rect x="459" y="316" width="411" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="479" y="351.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Joint roles</text><text x="479" y="379.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Tasks and leisure shared; feminists say these</text><text x="479" y="400.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">often hide unequal responsibility</text><rect x="30" y="441" width="270.6666666666667" height="153" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="475.4" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">Oakley (1974)</text><text x="50" y="503.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Women did most housework</text><text x="50" y="524.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and childcare even when</text><text x="50" y="545.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">husbands “helped”</text><rect x="314.6666666666667" y="441" width="270.6666666666667" height="153" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="334.6666666666667" y="475.4" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">Edgell (1980)</text><text x="334.6666666666667" y="503.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Men took the important</text><text x="334.6666666666667" y="524.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">decisions; women decided</text><text x="334.6666666666667" y="545.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">routine matters</text><rect x="599.3333333333334" y="441" width="270.6666666666667" height="153" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="619.3333333333334" y="475.4" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">Dobash and Dobash</text><text x="619.3333333333334" y="499.4" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">(1979)</text><text x="619.3333333333334" y="527.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Violence against wives when</text><text x="619.3333333333334" y="548.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">husbands felt their</text><text x="619.3333333333334" y="569.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">authority challenged</text><rect x="30" y="610" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="643.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Gendered socialisation: Oakley’s manipulation and canalisation prepare girls for domestic</text><text x="50" y="665.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">roles.</text>
</svg>