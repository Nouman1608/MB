<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 435" width="900" height="435" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="435" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Weighing the three views</text>

<rect x="30" y="104" width="170" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="42" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">View</text><rect x="200" y="104" width="320" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="212" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Strengths</text><rect x="520" y="104" width="350" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="532" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Limitations</text><rect x="30" y="150" width="170" height="85" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="175.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Functionalist</text><rect x="200" y="150" width="320" height="85" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="212" y="175.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Explains why the family exists in</text><text x="212" y="196.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">most societies; links it to other</text><text x="212" y="217.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">institutions</text><rect x="520" y="150" width="350" height="85" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="532" y="175.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Idealised, based on middle-class</text><text x="532" y="196.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">nuclear families; ignores conflict,</text><text x="532" y="217.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">abuse and inequality</text><rect x="30" y="235" width="170" height="85" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="260.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Marxist</text><rect x="200" y="235" width="320" height="85" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="212" y="260.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Explains inheritance of wealth and</text><text x="212" y="281.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">commercial pressure on families</text><rect x="520" y="235" width="350" height="85" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="532" y="260.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Ignores benefits to members and gender</text><text x="532" y="281.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">inequality; does not explain</text><text x="532" y="302.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">non-capitalist societies</text><rect x="30" y="320" width="170" height="85" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="345.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Feminist</text><rect x="200" y="320" width="320" height="85" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="212" y="345.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Exposes unequal work, power and</text><text x="212" y="366.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">violence other views ignore</text><rect x="520" y="320" width="350" height="85" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="532" y="345.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">May understate change towards joint</text><text x="532" y="366.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">roles; may treat all women alike</text><text x="532" y="387.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">regardless of class or ethnicity</text>
</svg>