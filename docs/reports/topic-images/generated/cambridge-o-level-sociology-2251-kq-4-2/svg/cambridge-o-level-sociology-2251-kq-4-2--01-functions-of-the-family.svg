<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 556" width="900" height="556" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="556" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What does the family do that society needs?</text>

<text x="450" y="124" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">Murdock (1949): four functions of the nuclear family</text><rect x="30" y="150" width="199.5" height="130" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="129.75" y="185.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Sexual</text><text x="129.75" y="213.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">A stable outlet</text><text x="129.75" y="234.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">that limits</text><text x="129.75" y="255.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">conflict</text><rect x="243.5" y="150" width="199.5" height="130" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="343.25" y="185.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Reproductive</text><text x="343.25" y="213.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Producing the next</text><text x="343.25" y="234.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">generation</text><rect x="457" y="150" width="199.5" height="130" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="556.75" y="185.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Economic</text><text x="556.75" y="213.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Food and shelter</text><text x="556.75" y="234.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">through shared</text><text x="556.75" y="255.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">resources</text><rect x="670.5" y="150" width="199.5" height="130" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="770.25" y="185.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Educational</text><text x="770.25" y="213.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Socialising</text><text x="770.25" y="234.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">children into norms</text><text x="770.25" y="255.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">and values</text><text x="450" y="318" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="middle">Parsons (1955): two “basic and irreducible” functions</text><rect x="30" y="344" width="408" height="86" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="234" y="391.7" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Primary socialisation of children</text><rect x="462" y="344" width="408" height="86" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="666" y="379.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Stabilisation of adult</text><text x="666" y="404.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">personalities: the “warm bath”</text><rect x="30" y="448" width="249.33333333333334" height="78" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="154.66666666666669" y="480.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">A working husband comes</text><text x="154.66666666666669" y="501.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">home stressed from work</text><line x1="285.33333333333337" y1="487" x2="319.33333333333337" y2="487" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="325.33333333333337" y="448" width="249.33333333333334" height="78" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450.00000000000006" y="480.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">The family lets him relax</text><text x="450.00000000000006" y="501.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">and recover</text><line x1="580.6666666666667" y1="487" x2="614.6666666666667" y2="487" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="620.6666666666667" y="448" width="249.33333333333334" height="78" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="745.3333333333334" y="480.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">He stays productive and</text><text x="745.3333333333334" y="501.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">society stays stable</text>
</svg>