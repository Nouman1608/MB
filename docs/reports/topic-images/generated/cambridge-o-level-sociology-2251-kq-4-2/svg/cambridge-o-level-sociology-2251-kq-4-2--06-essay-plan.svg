<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 604" width="900" height="604" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="604" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Plan: does the family mainly benefit its members?</text>

<rect x="30" y="104" width="190" height="72" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="125" y="147" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Introduction</text><rect x="234" y="104" width="636" height="72" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="250" y="133.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Functionalists support the view; Marxists and feminists say it</text><text x="250" y="155.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">mainly benefits capitalism or men.</text><rect x="30" y="188" width="190" height="72" rx="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="125" y="231" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">For</text><rect x="234" y="188" width="636" height="72" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="250" y="217.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Parsons: primary socialisation and warm bath; Murdock’s economic and</text><text x="250" y="239.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">educational functions; Fletcher on health and education.</text><rect x="30" y="272" width="190" height="72" rx="14" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="125" y="315" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Against: Marxist</text><rect x="234" y="272" width="636" height="72" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="250" y="301.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Unpaid labour and consumption benefit employers and owners;</text><text x="250" y="323.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">inheritance reproduces class.</text><rect x="30" y="356" width="190" height="72" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="125" y="399" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Against: feminist</text><rect x="234" y="356" width="636" height="72" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="250" y="385.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Oakley on housework, Edgell on decisions, Dobash and Dobash on</text><text x="250" y="407.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">violence.</text><rect x="30" y="440" width="190" height="72" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="125" y="483" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Evaluation</text><rect x="234" y="440" width="636" height="72" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="250" y="469.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Functionalists generalise from one family type; Marxists and</text><text x="250" y="491.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">feminists may ignore genuine support and change.</text><rect x="30" y="524" width="190" height="50" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="125" y="556" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Conclusion</text><rect x="234" y="524" width="636" height="50" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="250" y="553.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Families benefit many members, but not equally: ask “which members?”</text>
</svg>