<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 432" width="900" height="432" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="432" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four ways the family serves capitalism</text>

<line x1="330" y1="175" x2="365" y2="225.7" stroke="#1e2a44" stroke-width="2.5"/><line x1="330" y1="331" x2="365" y2="280.3" stroke="#1e2a44" stroke-width="2.5"/><line x1="570" y1="175" x2="535" y2="225.7" stroke="#1e2a44" stroke-width="2.5"/><line x1="570" y1="331" x2="535" y2="280.3" stroke="#1e2a44" stroke-width="2.5"/><circle cx="450" cy="253" r="100" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="236.25" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">The family</text><text x="450" y="260" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">serves</text><text x="450" y="283.75" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">capitalism</text><g transform="translate(0,0)"><rect x="30" y="104" width="300" height="142" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="134.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Reproduces class</text><text x="46" y="162.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Engels (1884): monogamy lets men</text><text x="46" y="183.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">pass private property to known</text><text x="46" y="204.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">heirs; wealth stays in the same</text><text x="46" y="225.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">families</text><rect x="30" y="260" width="300" height="142" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="290.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Exploits members</text><text x="46" y="318.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Benston (1969): women’s unpaid</text><text x="46" y="339.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">work cares for today’s and</text><text x="46" y="360.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">tomorrow’s workers at no cost to</text><text x="46" y="381.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">employers</text></g><g transform="translate(0,0)"><rect x="570" y="104" width="300" height="142" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="586" y="134.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Unit of consumption</text><text x="586" y="162.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Families buy goods and services;</text><text x="586" y="183.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">advertising targets parents and</text><text x="586" y="204.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">children. Zaretsky (1976): an</text><text x="586" y="225.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">illusion of private life</text><rect x="570" y="260" width="300" height="142" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="586" y="290.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Ideological control</text><text x="586" y="318.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Children learn to accept</text><text x="586" y="339.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">hierarchy and authority.</text><text x="586" y="360.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Althusser: the family spreads</text><text x="586" y="381.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">ruling-class ideas</text></g>
</svg>