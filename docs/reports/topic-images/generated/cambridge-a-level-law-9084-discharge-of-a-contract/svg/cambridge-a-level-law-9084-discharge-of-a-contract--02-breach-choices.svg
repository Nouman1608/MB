<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 734" width="900" height="734" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="734" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Breach: the innocent party’s choices</text>

<rect x="30" y="100" width="410" height="116" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="235" y="137" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">ACTUAL BREACH</text><text x="235" y="163.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Fails to perform on time, performs</text><text x="235" y="186.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">defectively or not at all</text><rect x="460" y="100" width="410" height="147" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="665" y="128" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">ANTICIPATORY BREACH</text><text x="665" y="154.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Indicates, before performance is due, that</text><text x="665" y="177.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">they will not perform</text><text x="665" y="205.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle"><tspan font-style="italic">Hochster</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">De</tspan> <tspan font-style="italic">la</tspan> <tspan font-style="italic">Tour</tspan> (1853); <tspan font-style="italic">Frost</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Knight</tspan></text><text x="665" y="226.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">(1872)</text><line x1="235" y1="253" x2="235" y2="287" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="293" width="410" height="100" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="235" y="323.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Repudiatory breach?</text><text x="235" y="351.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Breach of a condition, a serious breach of an</text><text x="235" y="372.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">innominate term, or a refusal to perform</text><line x1="665" y1="253" x2="665" y2="287" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="460" y="293" width="410" height="100" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="665" y="333.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Accept or affirm?</text><text x="665" y="362.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">The innocent party chooses</text><line x1="140.7" y1="399" x2="129" y2="433" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="329.3" y1="399" x2="341" y2="433" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="439" width="198" height="163" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="129" y="511.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Terminate</text><text x="129" y="539.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">and claim damages</text><rect x="242" y="439" width="198" height="163" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="341" y="511.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Affirm</text><text x="341" y="539.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">and continue</text><rect x="460" y="439" width="198" height="163" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="559" y="479.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Accept</text><text x="559" y="508.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">End the contract and</text><text x="559" y="529.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">sue at once:</text><text x="559" y="550.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">certainty, early</text><text x="559" y="571.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">mitigation</text><rect x="672" y="439" width="198" height="163" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="771" y="469.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Affirm and wait</text><text x="771" y="497.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Risky: in <tspan font-style="italic">Avery</tspan> <tspan font-style="italic">v</tspan></text><text x="771" y="518.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle"><tspan font-style="italic">Bowden</tspan> (1855) war</text><text x="771" y="539.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">frustrated the</text><text x="771" y="560.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">contract and the right</text><text x="771" y="581.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">to sue was lost</text><line x1="570.7" y1="399" x2="559" y2="433" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="759.3" y1="399" x2="771" y2="433" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="460" y="618" width="410" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="474" y="644" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">White</tspan> <tspan font-style="italic">and</tspan> <tspan font-style="italic">Carter</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">McGregor</tspan> (1962): affirmed,</text><text x="474" y="664" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">performed and recovered the full price; later cases</text><text x="474" y="684" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">require a legitimate interest in performing.</text>
</svg>