<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="900" height="550" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="550" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: Lena’s marquee</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Festival banned on 15 July; contract price £8,000</text>
<text x="30" y="140" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">BEFORE THE EVENT: what was paid and what was payable</text><rect x="30" y="152" width="210" height="78" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="135" y="187" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">£2,000</text><text x="135" y="211" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">deposit paid</text><rect x="240" y="152" width="630" height="78" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="555" y="187" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">£6,000 balance</text><text x="555" y="211" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">s1(2): ceases to be payable</text><line x1="30" y1="230" x2="30" y2="294" stroke="#1e2a44" stroke-width="2" stroke-dasharray="6 5"/><line x1="240" y1="230" x2="660" y2="294" stroke="#1e2a44" stroke-width="2" stroke-dasharray="6 5"/><rect x="30" y="294" width="220.5" height="78" fill="#b5602e" stroke="#1e2a44" stroke-width="2.5"/><text x="140.25" y="329" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">up to £700</text><text x="140.25" y="353" font-size="16" font-weight="400" fill="#ffffff" text-anchor="middle">expenses</text><rect x="250.5" y="294" width="409.5" height="78" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="455.25" y="329" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">£1,300</text><text x="455.25" y="353" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">back to Lena</text><text x="680" y="270" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-weight="700">The</tspan> <tspan font-weight="700">deposit</tspan> <tspan font-weight="700">under</tspan> <tspan font-weight="700">s1(2)</tspan></text><text x="680" y="290" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">(enlarged): recoverable,</text><text x="680" y="310" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">less any expenses the</text><text x="680" y="330" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">court allows, up to the</text><text x="680" y="350" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">sum paid or payable</text><text x="680" y="370" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">before the event.</text><rect x="30" y="396" width="270.6666666666667" height="122" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="424" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FRUSTRATED?</text><text x="46" y="455.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The ban makes the festival</text><text x="46" y="476.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">illegal and pointless; neither</text><text x="46" y="497.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">party caused it.</text><rect x="314.6666666666667" y="396" width="270.6666666666667" height="122" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="330.6666666666667" y="424" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">COMMON LAW</text><text x="330.6666666666667" y="455.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The contract ends on 15 July;</text><text x="330.6666666666667" y="476.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">no further performance is</text><text x="330.6666666666667" y="497.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">owed.</text><rect x="599.3333333333334" y="396" width="270.6666666666667" height="122" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="615.3333333333334" y="424" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CONCLUSION</text><text x="615.3333333333334" y="455.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Lena recovers between £1,300</text><text x="615.3333333333334" y="476.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and £2,000, depending on</text><text x="615.3333333333334" y="497.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">what the court thinks just.</text>
</svg>