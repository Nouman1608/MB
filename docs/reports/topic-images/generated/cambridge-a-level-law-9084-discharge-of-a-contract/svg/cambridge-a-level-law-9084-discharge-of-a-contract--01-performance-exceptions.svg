<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 790" width="900" height="790" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="790" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Performance: the strict rule and its exceptions</text>

<rect x="30" y="100" width="840" height="134" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">THE STRICT RULE</text><text x="50" y="159.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Discharged only by performing exactly what the contract requires</text><text x="50" y="188.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Cutter</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Powell</tspan> (1795): seaman died before the end of the voyage; widow recovered nothing. <tspan font-style="italic">Re</tspan> <tspan font-style="italic">Moore</tspan></text><text x="50" y="209.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">and</tspan> <tspan font-style="italic">Co</tspan> <tspan font-style="italic">and</tspan> <tspan font-style="italic">Landauer</tspan> (1921): cases of 24 tins, not 30; the whole consignment could be rejected.</text><text x="450" y="264" font-size="16" font-weight="700" fill="#4a5568" text-anchor="middle">EXCEPTIONS</text><rect x="30" y="282" width="412" height="119" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="312.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Substantial performance</text><text x="46" y="338.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Price less the cost of putting defects right: <tspan font-style="italic">Hoenig</tspan></text><text x="46" y="359.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">v</tspan> <tspan font-style="italic">Isaacs</tspan>, <tspan font-style="italic">Dakin</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Lee</tspan>. Not met in <tspan font-style="italic">Bolton</tspan> <tspan font-style="italic">v</tspan></text><text x="46" y="380.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Mahadeva</tspan>: nothing payable.</text><rect x="458" y="282" width="412" height="119" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="474" y="312.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Voluntary acceptance</text><text x="474" y="338.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A genuine choice to accept part performance:</text><text x="474" y="359.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">pay a reasonable sum. No real choice in <tspan font-style="italic">Sumpter</tspan></text><text x="474" y="380.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">v</tspan> <tspan font-style="italic">Hedges</tspan>.</text><rect x="30" y="415" width="412" height="98" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="445.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Divisible contracts</text><text x="46" y="471.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Each completed part can be paid for: <tspan font-style="italic">Ritchie</tspan> <tspan font-style="italic">v</tspan></text><text x="46" y="492.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Atkinson</tspan>, freight per ton delivered.</text><rect x="458" y="415" width="412" height="98" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="474" y="445.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Prevention</text><text x="474" y="471.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Stopped from completing: quantum meruit for</text><text x="474" y="492.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">work done. <tspan font-style="italic">Planché</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Colburn</tspan>.</text><rect x="30" y="527" width="412" height="119" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="557.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Tender of performance</text><text x="46" y="583.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A refused attempt to perform can count: <tspan font-style="italic">Startup</tspan> <tspan font-style="italic">v</tspan></text><text x="46" y="604.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Macdonald</tspan>, oil late on Saturday but in time.</text><rect x="458" y="527" width="412" height="119" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="474" y="557.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Time of performance</text><text x="474" y="583.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Of the essence by the contract, its nature, or</text><text x="474" y="604.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">reasonable notice: <tspan font-style="italic">Charles</tspan> <tspan font-style="italic">Rickards</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Oppenhaim</tspan></text><text x="474" y="625.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and <tspan font-style="italic">Union</tspan> <tspan font-style="italic">Eagle</tspan> (ten minutes late).</text><rect x="30" y="660" width="840" height="98" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="690.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Vicarious performance</text><text x="46" y="716.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A substitute may perform unless the contract is personal: <tspan font-style="italic">British</tspan> <tspan font-style="italic">Waggon</tspan> <tspan font-style="italic">Co</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Lea</tspan>; contrast <tspan font-style="italic">Robson</tspan> <tspan font-style="italic">and</tspan></text><text x="46" y="737.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Sharpe</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Drummond</tspan>.</text>
</svg>