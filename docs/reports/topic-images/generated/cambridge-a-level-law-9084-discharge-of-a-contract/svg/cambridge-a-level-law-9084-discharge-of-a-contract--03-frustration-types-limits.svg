<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 467" width="900" height="467" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="467" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Frustration: what counts and what does not</text>

<rect x="30" y="100" width="412" height="335" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="130" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">TYPES OF FRUSTRATING EVENT</text><text x="48" y="161.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="161.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Impossibility:</tspan> subject matter destroyed (<tspan font-style="italic">Taylor</tspan></text><text x="63.2" y="182.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">v</tspan> <tspan font-style="italic">Caldwell</tspan>, 1863); illness or death in a personal</text><text x="63.2" y="203.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">contract (<tspan font-style="italic">Robinson</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Davison</tspan>; <tspan font-style="italic">Condor</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Baron</tspan></text><text x="63.2" y="224.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Knights</tspan>); long unavailability (<tspan font-style="italic">Jackson</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Union</tspan></text><text x="63.2" y="245.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Marine</tspan> <tspan font-style="italic">Insurance</tspan>)</text><text x="48" y="276.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="276.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Supervening</tspan> <tspan font-weight="700" fill="#1e2a44">illegality:</tspan> <tspan font-style="italic">Fibrosa</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Fairbairn</tspan></text><text x="63.2" y="297.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(1943), machinery for Poland after Germany</text><text x="63.2" y="318.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">occupied it in 1939</text><text x="48" y="349.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="349.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Performance</tspan> <tspan font-weight="700" fill="#1e2a44">pointless:</tspan> <tspan font-style="italic">Krell</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Henry</tspan> (1903),</text><text x="63.2" y="370.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">sole purpose was the coronation procession;</text><text x="63.2" y="391.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">contrast <tspan font-style="italic">Herne</tspan> <tspan font-style="italic">Bay</tspan> <tspan font-style="italic">Steam</tspan> <tspan font-style="italic">Boat</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Hutton</tspan>, only</text><text x="63.2" y="412.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">part of the purpose</text><rect x="458" y="100" width="412" height="335" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="476" y="130" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">LIMITATIONS: NOT FRUSTRATED</text><text x="476" y="161.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="491.2" y="161.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Contractual</tspan> <tspan font-weight="700" fill="#1e2a44">provision:</tspan> a force majeure clause</text><text x="491.2" y="182.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">deals with the event</text><text x="476" y="213.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="491.2" y="213.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Inconvenience</tspan> <tspan font-weight="700" fill="#1e2a44">or</tspan> <tspan font-weight="700" fill="#1e2a44">extra</tspan> <tspan font-weight="700" fill="#1e2a44">expense:</tspan> <tspan font-style="italic">Davis</tspan></text><text x="491.2" y="234.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Contractors</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Fareham</tspan> <tspan font-style="italic">UDC</tspan> (1956), labour</text><text x="491.2" y="255.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">shortage; <tspan font-style="italic">Tsakiroglou</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Noblee</tspan> <tspan font-style="italic">Thorl</tspan> (1962),</text><text x="491.2" y="276.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Suez Canal closed</text><text x="476" y="307.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="491.2" y="307.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Foreseen</tspan> <tspan font-weight="700" fill="#1e2a44">or</tspan> <tspan font-weight="700" fill="#1e2a44">foreseeable:</tspan> the risk was</text><text x="491.2" y="328.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">allocated in the bargain</text><text x="476" y="359.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="491.2" y="359.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Self-induced:</tspan> <tspan font-style="italic">Maritime</tspan> <tspan font-style="italic">National</tspan> <tspan font-style="italic">Fish</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Ocean</tspan></text><text x="491.2" y="380.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Trawlers</tspan> (1935); <tspan font-style="italic">The</tspan> <tspan font-style="italic">Super</tspan> <tspan font-style="italic">Servant</tspan> <tspan font-style="italic">Two</tspan> (1990)</text>
</svg>