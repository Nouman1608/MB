<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 691" width="900" height="691" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="691" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Who keeps the money after frustration?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">The contract ends automatically at the moment of the event</text>
<line x1="60" y1="144" x2="60" y2="639" stroke="#c9d6d4" stroke-width="4"/><rect x="104" y="124" width="766" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="154" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">COMMON LAW</text><text x="122" y="181.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Chandler v Webster (1904)</text><text x="122" y="210.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The loss lay where it fell: money paid before the event could not be recovered.</text><circle cx="60" cy="178.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="187.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="104" y="245" width="766" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="275" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">COMMON LAW</text><text x="122" y="302.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Fibrosa (1943)</text><text x="122" y="331.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Recovery only on a total failure of consideration, so partial failures were left unremedied.</text><circle cx="60" cy="299.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="308.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="104" y="366" width="766" height="151" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="122" y="396" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">LAW REFORM (FRUSTRATED CONTRACTS) ACT 1943, s1(2)</text><text x="122" y="423.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Money paid is recoverable; money payable ceases to be payable</text><text x="122" y="452.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The court may let the payee keep or recover a sum for expenses, up to the amount paid or</text><text x="122" y="473.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">payable before the event. <tspan font-style="italic">Gamerco</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">ICM/Fair</tspan> <tspan font-style="italic">Warning</tspan> (1995): whole advance recovered,</text><text x="122" y="494.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">nothing retained.</text><circle cx="60" cy="441.5" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="450.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="104" y="529" width="766" height="130" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="122" y="559" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">LAW REFORM (FRUSTRATED CONTRACTS) ACT 1943, s1(3)</text><text x="122" y="586.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">A valuable benefit other than money</text><text x="122" y="615.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The court may order a just sum, not exceeding the value of the benefit. <tspan font-style="italic">BP</tspan> <tspan font-style="italic">Exploration</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Hunt</tspan></text><text x="122" y="636.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">(No</tspan> <tspan font-style="italic">2)</tspan> (1979).</text><circle cx="60" cy="594" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="602.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text>
</svg>