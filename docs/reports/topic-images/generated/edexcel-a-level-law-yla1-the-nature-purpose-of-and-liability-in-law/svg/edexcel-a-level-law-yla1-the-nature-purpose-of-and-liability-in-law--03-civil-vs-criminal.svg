<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 827" width="900" height="827" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="827" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Civil and criminal liability compared</text>

<clipPath id="tc100"><rect x="30" y="100" width="840" height="367" rx="14"/></clipPath><g clip-path="url(#tc100)"><rect x="30" y="100" width="204.32432432432435" height="48" fill="#b5d3cf"/><rect x="234.32432432432435" y="100" width="317.83783783783787" height="48" fill="#b5d3cf"/><text x="248.32432432432435" y="127.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Civil law</text><rect x="552.1621621621622" y="100" width="317.83783783783787" height="48" fill="#f2e7b8"/><text x="566.1621621621622" y="127.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Criminal law</text><rect x="30" y="148" width="204.32432432432435" height="68" fill="#dce9e7"/><text x="44" y="174.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Purpose</text><rect x="234.32432432432435" y="148" width="317.83783783783787" height="68" fill="#ffffff"/><text x="248.32432432432435" y="174.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Settle disputes between individuals or</text><text x="248.32432432432435" y="195.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">organisations</text><rect x="552.1621621621622" y="148" width="317.83783783783787" height="68" fill="#ffffff"/><text x="566.1621621621622" y="174.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Punish wrongs against society</text><line x1="30" y1="216" x2="870" y2="216" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="216" width="204.32432432432435" height="68" fill="#dce9e7"/><text x="44" y="242.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Who brings it</text><rect x="234.32432432432435" y="216" width="317.83783783783787" height="68" fill="#f8faf9"/><text x="248.32432432432435" y="242.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The <tspan font-weight="700">claimant</tspan> sues the <tspan font-weight="700">defendant</tspan></text><rect x="552.1621621621622" y="216" width="317.83783783783787" height="68" fill="#f8faf9"/><text x="566.1621621621622" y="242.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The state <tspan font-weight="700">prosecutes</tspan> the <tspan font-weight="700">defendant</tspan>,</text><text x="566.1621621621622" y="263.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">usually through the CPS</text><line x1="30" y1="284" x2="870" y2="284" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="284" width="204.32432432432435" height="68" fill="#dce9e7"/><text x="44" y="310.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Proof</text><rect x="234.32432432432435" y="284" width="317.83783783783787" height="68" fill="#ffffff"/><text x="248.32432432432435" y="310.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Claimant, on the <tspan font-weight="700">balance</tspan> <tspan font-weight="700">of</tspan></text><text x="248.32432432432435" y="331.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">probabilities</tspan></text><rect x="552.1621621621622" y="284" width="317.83783783783787" height="68" fill="#ffffff"/><text x="566.1621621621622" y="310.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Prosecution, <tspan font-weight="700">beyond</tspan> <tspan font-weight="700">reasonable</tspan></text><text x="566.1621621621622" y="331.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">doubt</tspan> (<tspan font-style="italic">Woolmington</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">DPP</tspan> [1935])</text><line x1="30" y1="352" x2="870" y2="352" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="352" width="204.32432432432435" height="47" fill="#dce9e7"/><text x="44" y="378.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Outcome</text><rect x="234.32432432432435" y="352" width="317.83783783783787" height="47" fill="#f8faf9"/><text x="248.32432432432435" y="378.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Liable</tspan> or not liable</text><rect x="552.1621621621622" y="352" width="317.83783783783787" height="47" fill="#f8faf9"/><text x="566.1621621621622" y="378.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Guilty</tspan> or not guilty</text><line x1="30" y1="399" x2="870" y2="399" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="399" width="204.32432432432435" height="68" fill="#dce9e7"/><text x="44" y="425.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Response</text><rect x="234.32432432432435" y="399" width="317.83783783783787" height="68" fill="#ffffff"/><text x="248.32432432432435" y="425.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Remedies: damages, injunction,</text><text x="248.32432432432435" y="446.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">specific performance</text><rect x="552.1621621621622" y="399" width="317.83783783783787" height="68" fill="#ffffff"/><text x="566.1621621621622" y="425.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Sanctions: custody, community order,</text><text x="566.1621621621622" y="446.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">fine, discharge</text></g><line x1="234.32432432432435" y1="100" x2="234.32432432432435" y2="467" stroke="#c9d6d4" stroke-width="1.5"/><line x1="552.1621621621622" y1="100" x2="552.1621621621622" y2="467" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="100" width="840" height="367" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/><rect x="300" y="489" width="300" height="82" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="523.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">A customer punches a</text><text x="450" y="546.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">shopkeeper</text><line x1="400" y1="575" x2="210" y2="615" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="500" y1="575" x2="690" y2="615" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="621" width="340" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="200" y="663" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">CRIMINAL</text><text x="200" y="689.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Prosecuted for assault</text><text x="200" y="717" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">looks back at the wrong; serves society</text><rect x="530" y="621" width="340" height="130" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="700" y="653" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">CIVIL</text><text x="700" y="679.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Sued for damages in tort</text><text x="700" y="707" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">looks at the loss; puts the claimant back</text><text x="700" y="727" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">where they were</text><text x="450" y="786.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Because the standards of proof differ, an acquittal does not stop a civil claim succeeding.</text>
</svg>