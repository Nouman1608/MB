<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 526" width="900" height="526" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="526" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three legal theories and their theorists</text>

<rect x="30" y="100" width="272" height="263" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">POSITIVISM</text><text x="50" y="157.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">What law is and what it</text><text x="50" y="178.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">ought to be are separate</text><text x="50" y="205" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Austin</tspan>: the command of a</text><text x="50" y="225" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">sovereign backed by a sanction</text><text x="50" y="252" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Hart</tspan>: primary and secondary</text><text x="50" y="272" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">rules, identified by a rule of</text><text x="50" y="292" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">recognition</text><text x="50" y="319" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">+ certainty · − a wicked law</text><text x="50" y="339" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">made correctly is still law</text><rect x="314" y="100" width="272" height="263" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="334" y="132" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">NATURAL LAW</text><text x="334" y="157.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Human laws are measured</text><text x="334" y="178.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">against a higher moral law</text><text x="334" y="205" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Aquinas</tspan>: an unjust law is not</text><text x="334" y="225" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">truly law</text><text x="334" y="252" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Fuller</tspan>: law's "inner morality":</text><text x="334" y="272" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">public, clear, not retrospective</text><rect x="598" y="100" width="272" height="263" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="618" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">UTILITARIANISM</text><text x="618" y="157.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Judge a law by its</text><text x="618" y="178.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">consequences</text><text x="618" y="205" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Bentham</tspan>, <tspan font-weight="700" fill="#1e2a44">Mill</tspan>: the greatest</text><text x="618" y="225" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">happiness of the greatest</text><text x="618" y="245" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">number</text><text x="618" y="272" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Mill's</tspan> <tspan font-weight="700" fill="#1e2a44">harm</tspan> <tspan font-weight="700" fill="#1e2a44">principle</tspan>: the state</text><text x="618" y="292" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">may only prevent harm to others</text><rect x="30" y="385" width="840" height="109" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="419.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The 1958 Hart–Fuller debate</text><text x="50" y="448.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The classic clash between positivism and natural law, partly about how post-war German courts should</text><text x="50" y="469.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">treat informers who had relied on Nazi laws.</text>
</svg>