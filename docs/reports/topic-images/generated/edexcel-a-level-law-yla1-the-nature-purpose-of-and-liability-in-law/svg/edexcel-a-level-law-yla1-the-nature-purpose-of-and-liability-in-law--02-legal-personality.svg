<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 583" width="900" height="583" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="583" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Rights, duties and legal personality</text>

<rect x="30" y="100" width="202.5" height="135" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="126" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">RIGHTS</text><text x="44" y="157" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">to own property, to be</text><text x="44" y="177" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">paid under a contract</text><rect x="242.5" y="100" width="202.5" height="135" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="256.5" y="126" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DUTIES</text><text x="256.5" y="157" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">to take reasonable care,</text><text x="256.5" y="177" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">not to steal</text><rect x="455" y="100" width="202.5" height="135" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="469" y="126" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PRIVILEGES</text><text x="469" y="157" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">what is said in</text><text x="469" y="177" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Parliament or in court</text><text x="469" y="197" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">cannot found a</text><text x="469" y="217" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">defamation claim</text><rect x="667.5" y="100" width="202.5" height="135" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="681.5" y="126" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">LIABILITIES</text><text x="681.5" y="157" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">exposure to a sanction</text><text x="681.5" y="177" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">or remedy when a duty</text><text x="681.5" y="197" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">is broken</text><rect x="30" y="257" width="411" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="235.5" y="303" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">NATURAL PERSON</text><text x="235.5" y="329.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">A human being</text><rect x="459" y="257" width="411" height="112" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="664.5" y="289" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">LEGAL (ARTIFICIAL) PERSON</text><text x="664.5" y="315.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">A registered company</text><text x="664.5" y="344.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">separate from its shareholders</text><rect x="30" y="391" width="840" height="160" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="419" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SALOMON v A SALOMON &amp; CO LTD [1897]</text><rect x="60" y="441" width="230" height="64" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="175" y="480" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Mr Salomon</text><rect x="335" y="441" width="230" height="64" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="480" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">The company</text><rect x="610" y="441" width="230" height="64" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="725" y="480" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Debts</text><line x1="605" y1="473" x2="571" y2="473" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><line x1="296" y1="451" x2="296" y2="495" stroke="#b5602e" stroke-width="3" stroke-dasharray="6 5"/><text x="450" y="537" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">The company's debts were its own, not Mr Salomon's</text>
</svg>