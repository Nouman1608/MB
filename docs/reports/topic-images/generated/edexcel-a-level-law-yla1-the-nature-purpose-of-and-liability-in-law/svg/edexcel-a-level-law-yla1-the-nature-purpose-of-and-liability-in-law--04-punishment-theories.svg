<rect width="900" height="769" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Seven theories of punishment</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">And the sentences each points to</text>
<clipPath id="tc124"><rect x="30" y="124" width="840" height="482" rx="14"/></clipPath><g clip-path="url(#tc124)"><rect x="30" y="124" width="197.6470588235294" height="48" fill="#b5d3cf"/><text x="44" y="151.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Theory</text><rect x="227.6470588235294" y="124" width="271.7647058823529" height="48" fill="#b5d3cf"/><text x="241.6470588235294" y="151.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Looks at</text><rect x="499.4117647058823" y="124" width="370.5882352941176" height="48" fill="#f2e7b8"/><text x="513.4117647058823" y="151.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Typical sentence link</text><rect x="30" y="172" width="197.6470588235294" height="68" fill="#dce9e7"/><text x="44" y="198.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Revenge</text><rect x="227.6470588235294" y="172" width="271.7647058823529" height="68" fill="#ffffff"/><text x="241.6470588235294" y="198.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Society's wish to hit back</text><rect x="499.4117647058823" y="172" width="370.5882352941176" height="68" fill="#ffffff"/><text x="513.4117647058823" y="198.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Long custody for shocking crimes; rarely</text><text x="513.4117647058823" y="219.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">openly endorsed</text><line x1="30" y1="240" x2="870" y2="240" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="240" width="197.6470588235294" height="68" fill="#dce9e7"/><text x="44" y="266.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Retribution</text><rect x="227.6470588235294" y="240" width="271.7647058823529" height="68" fill="#f8faf9"/><text x="241.6470588235294" y="266.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Just deserts, proportionate</text><rect x="499.4117647058823" y="240" width="370.5882352941176" height="68" fill="#f8faf9"/><text x="513.4117647058823" y="266.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Sentences graded by seriousness;</text><text x="513.4117647058823" y="287.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">mandatory life for murder</text><line x1="30" y1="308" x2="870" y2="308" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="308" width="197.6470588235294" height="68" fill="#dce9e7"/><text x="44" y="334.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Denunciation</text><rect x="227.6470588235294" y="308" width="271.7647058823529" height="68" fill="#ffffff"/><text x="241.6470588235294" y="334.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Public condemnation</text><rect x="499.4117647058823" y="308" width="370.5882352941176" height="68" fill="#ffffff"/><text x="513.4117647058823" y="334.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Exemplary sentences for crimes causing</text><text x="513.4117647058823" y="355.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">public outrage</text><line x1="30" y1="376" x2="870" y2="376" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="376" width="197.6470588235294" height="47" fill="#dce9e7"/><text x="44" y="402.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Deterrence</text><rect x="227.6470588235294" y="376" width="271.7647058823529" height="47" fill="#f8faf9"/><text x="241.6470588235294" y="402.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Individual and general</text><rect x="499.4117647058823" y="376" width="370.5882352941176" height="47" fill="#f8faf9"/><text x="513.4117647058823" y="402.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Custody; suspended sentences</text><line x1="30" y1="423" x2="870" y2="423" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="423" width="197.6470588235294" height="68" fill="#dce9e7"/><text x="44" y="449.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Rehabilitation</text><rect x="227.6470588235294" y="423" width="271.7647058823529" height="68" fill="#ffffff"/><text x="241.6470588235294" y="449.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Reforming the offender</text><rect x="499.4117647058823" y="423" width="370.5882352941176" height="68" fill="#ffffff"/><text x="513.4117647058823" y="449.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Community orders with drug rehabilitation or</text><text x="513.4117647058823" y="470.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">supervision</text><line x1="30" y1="491" x2="870" y2="491" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="491" width="197.6470588235294" height="47" fill="#dce9e7"/><text x="44" y="517.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Reparation</text><rect x="227.6470588235294" y="491" width="271.7647058823529" height="47" fill="#f8faf9"/><text x="241.6470588235294" y="517.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Making amends</text><rect x="499.4117647058823" y="491" width="370.5882352941176" height="47" fill="#f8faf9"/><text x="513.4117647058823" y="517.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Compensation orders; unpaid work</text><line x1="30" y1="538" x2="870" y2="538" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="538" width="197.6470588235294" height="68" fill="#dce9e7"/><text x="44" y="564.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Restoration</text><rect x="227.6470588235294" y="538" width="271.7647058823529" height="68" fill="#ffffff"/><text x="241.6470588235294" y="564.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Repairing the offender–victim</text><text x="241.6470588235294" y="585.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">relationship</text><rect x="499.4117647058823" y="538" width="370.5882352941176" height="68" fill="#ffffff"/><text x="513.4117647058823" y="564.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Restorative justice meetings</text></g><line x1="227.6470588235294" y1="124" x2="227.6470588235294" y2="606" stroke="#c9d6d4" stroke-width="1.5"/><line x1="499.4117647058823" y1="124" x2="499.4117647058823" y2="606" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="124" width="840" height="482" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="628" width="840" height="109" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="662.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Criminal Justice Act 2003, s 142: purposes the court must consider for an adult</text><text x="50" y="691.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Punishment · reduction of crime (including deterrence) · reform and rehabilitation · protection of the</text><text x="50" y="712.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">public · reparation. The Act does not rank them.</text>
</svg>