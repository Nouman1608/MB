<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="600" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Should the law enforce morality?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Triggered by the Wolfenden Report (1957)</text>
<rect x="30" y="124" width="411" height="106" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">LORD DEVLIN</text><text x="50" y="182.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Yes: a shared morality holds society</text><text x="50" y="205.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">together</text><rect x="459" y="124" width="411" height="106" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="479" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PROFESSOR HART (FOLLOWING MILL)</text><text x="479" y="182.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Only harm to others justifies legal</text><text x="479" y="205.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">intervention</text><rect x="30" y="252" width="413" height="152" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="284" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">ENFORCING MORALITY</text><text x="50" y="315" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64.25" y="315" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Shaw</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">DPP</tspan> [1962]: conspiracy to corrupt public</text><text x="64.25" y="335" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">morals</text><text x="50" y="360" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64.25" y="360" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">R</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Brown</tspan> [1993]: consent no defence to ABH in</text><text x="64.25" y="380" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">private sadomasochistic activity</text><rect x="457" y="252" width="413" height="152" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="477" y="284" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">RESPECTING PRIVATE CHOICE</text><text x="477" y="315" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="491.25" y="315" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">R</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Wilson</tspan> [1996]: branding at his wife's request</text><text x="491.25" y="335" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">was not guilty, distinguishing <tspan font-style="italic">Brown</tspan></text><rect x="30" y="416" width="413" height="152" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="448" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CHANGING WITH SOCIAL ATTITUDES</text><text x="50" y="479" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64.25" y="479" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">R</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">R</tspan> [1991]: marital rape</text><text x="50" y="504" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64.25" y="504" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Gillick</tspan> [1985]: contraceptive advice to a</text><text x="64.25" y="524" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">competent under-16</text><rect x="457" y="416" width="413" height="152" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="448" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">LIFE AND DEATH</text><text x="477" y="479" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="491.25" y="479" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Airedale</tspan> <tspan font-style="italic">NHS</tspan> <tspan font-style="italic">Trust</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Bland</tspan> [1993]: withdrawing</text><text x="491.25" y="499" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">treatment</text><text x="477" y="524" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="491.25" y="524" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Re</tspan> <tspan font-style="italic">A</tspan> <tspan font-style="italic">(Conjoined</tspan> <tspan font-style="italic">Twins)</tspan> [2000]: separation</text><text x="491.25" y="544" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">causing one twin's death</text>
</svg>