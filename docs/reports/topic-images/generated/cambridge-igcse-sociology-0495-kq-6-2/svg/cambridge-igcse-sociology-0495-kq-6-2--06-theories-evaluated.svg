<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="900" height="550" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="550" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Five theories: strength and limitation</text>

<rect x="30" y="104" width="160" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="42" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Theory</text><rect x="190" y="104" width="250" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="202" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Key idea</text><rect x="440" y="104" width="210" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="452" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Strength</text><rect x="650" y="104" width="220" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="662" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Limitation</text><rect x="30" y="150" width="160" height="82" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="174.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Functionalism</text><rect x="190" y="150" width="250" height="82" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="202" y="174.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Anomie; strain; subcultures</text><text x="202" y="194.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">(Cohen; Cloward and Ohlin);</text><text x="202" y="214.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">New Right underclass</text><rect x="440" y="150" width="210" height="82" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="452" y="174.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Explains utilitarian and</text><text x="452" y="194.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">group delinquency</text><rect x="650" y="150" width="220" height="82" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="662" y="174.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Ignores crimes of the</text><text x="662" y="194.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">powerful; New Right</text><text x="662" y="214.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">blames individuals</text><rect x="30" y="232" width="160" height="82" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="256.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Interactionism</text><rect x="190" y="232" width="250" height="82" fill="#fbf8ea" stroke="#1e2a44" stroke-width="2"/><text x="202" y="256.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Labelling, master status,</text><text x="202" y="276.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">moral panics</text><rect x="440" y="232" width="210" height="82" fill="#fbf8ea" stroke="#1e2a44" stroke-width="2"/><text x="452" y="256.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Shows agencies help</text><text x="452" y="276.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">create patterns</text><rect x="650" y="232" width="220" height="82" fill="#fbf8ea" stroke="#1e2a44" stroke-width="2"/><text x="662" y="256.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Does not explain the</text><text x="662" y="276.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">first act; neglects</text><text x="662" y="296.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">victims</text><rect x="30" y="314" width="160" height="82" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="338.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Marxism</text><rect x="190" y="314" width="250" height="82" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="202" y="338.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Laws and selective</text><text x="202" y="358.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">enforcement serve the ruling</text><text x="202" y="378.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">class</text><rect x="440" y="314" width="210" height="82" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="452" y="338.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Explains white-collar</text><text x="452" y="358.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">crime going unpunished</text><rect x="650" y="314" width="220" height="82" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="662" y="338.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Ignores intra-class</text><text x="662" y="358.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">victims and gender</text><rect x="30" y="396" width="160" height="62" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="420.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Feminism</text><rect x="190" y="396" width="250" height="62" fill="#fbf8ea" stroke="#1e2a44" stroke-width="2"/><text x="202" y="420.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Patriarchal control; class</text><text x="202" y="440.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">and gender deals</text><rect x="440" y="396" width="210" height="62" fill="#fbf8ea" stroke="#1e2a44" stroke-width="2"/><text x="452" y="420.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Explains the gender gap</text><rect x="650" y="396" width="220" height="62" fill="#fbf8ea" stroke="#1e2a44" stroke-width="2"/><text x="662" y="420.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">May treat all women as</text><text x="662" y="440.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">the same</text><rect x="30" y="458" width="160" height="62" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="482.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Postmodernism</text><rect x="190" y="458" width="250" height="62" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="202" y="482.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">No single theory; consumer</text><text x="202" y="502.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">culture; new crimes</text><rect x="440" y="458" width="210" height="62" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="452" y="482.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Fits new and diverse</text><text x="452" y="502.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">crimes</text><rect x="650" y="458" width="220" height="62" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="662" y="482.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Little explanation of</text><text x="662" y="502.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">persistent class patterns</text>
</svg>