8.66442431225812" y="597.4878040718663" width="230" height="74" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="273.6644243122581" y="625.8878040718663" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Tougher control</text><text x="273.6644243122581" y="653.4878040718663" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">more policing</text><rect x="49.68304511145391" y="413.0121959281337" width="230" height="74" rx="14" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="164.6830451114539" y="441.41219592813366" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">More deviance</text><text x="164.6830451114539" y="469.0121959281337" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">which the media report</text></g><rect x="30" y="676.4878040718663" width="840" height="102" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="710.0878040718663" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Hall and colleagues (1978): a moral panic about “mugging” diverted attention from a crisis</text><text x="50" y="732.0878040718663" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">of capitalism. Limitation of labelling: it does not explain the first deviant act and</text><text x="50" y="754.0878040718663" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">neglects victims.</text>
