<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 555" width="900" height="555" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="555" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Patterns of crime and victimisation</text>

<rect x="30" y="104" width="160" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="42" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Group</text><rect x="190" y="104" width="340" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="202" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Offending (recorded)</text><rect x="530" y="104" width="340" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="542" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Victimisation</text><rect x="30" y="150" width="160" height="64" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="175.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Age</text><rect x="190" y="150" width="340" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="202" y="175.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Peaks in the late teens and early</text><text x="202" y="196.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">twenties, then falls</text><rect x="530" y="150" width="340" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="542" y="175.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Young people more likely to be victims</text><text x="542" y="196.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">of violent and street crime</text><rect x="30" y="214" width="160" height="64" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="239.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Social class</text><rect x="190" y="214" width="340" height="64" fill="#fbf8ea" stroke="#1e2a44" stroke-width="2"/><text x="202" y="239.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Working class over-represented among</text><text x="202" y="260.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">those convicted and imprisoned</text><rect x="530" y="214" width="340" height="64" fill="#fbf8ea" stroke="#1e2a44" stroke-width="2"/><text x="542" y="239.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Concentrated in poorer areas</text><rect x="30" y="278" width="160" height="64" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="303.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Gender</text><rect x="190" y="278" width="340" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="202" y="303.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Men commit most recorded crime,</text><text x="202" y="324.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">especially violent crime</text><rect x="530" y="278" width="340" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="542" y="303.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Men: violence in public. Women:</text><text x="542" y="324.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">domestic abuse and sexual violence</text><rect x="30" y="342" width="160" height="85" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="367.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Ethnicity</text><rect x="190" y="342" width="340" height="85" fill="#fbf8ea" stroke="#1e2a44" stroke-width="2"/><text x="202" y="367.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Some minority groups over-represented</text><text x="202" y="388.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">in stop and search, arrest and prison</text><text x="202" y="409.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">figures</text><rect x="530" y="342" width="340" height="85" fill="#fbf8ea" stroke="#1e2a44" stroke-width="2"/><text x="542" y="367.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Higher risks for some minority groups,</text><text x="542" y="388.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">including hate crime</text><rect x="30" y="445" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="478.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Describe patterns in words; do not invent figures. Remember victimisation as well as</text><text x="50" y="500.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">offending.</text>
</svg>