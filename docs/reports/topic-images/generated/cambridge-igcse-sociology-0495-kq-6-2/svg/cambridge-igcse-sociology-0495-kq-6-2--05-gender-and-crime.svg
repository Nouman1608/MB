<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 663" width="900" height="663" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="663" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Explaining the gender gap in crime</text>

<text x="450" y="130" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="middle">Carlen (1988): why most women conform</text><rect x="30" y="150" width="400" height="110" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="230" y="196.3" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Class deal</text><text x="230" y="226.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">rewards of paid work</text><rect x="470" y="150" width="400" height="110" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="670" y="196.3" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Gender deal</text><text x="670" y="226.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">rewards of family life</text><line x1="230" y1="264" x2="380" y2="310" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><line x1="670" y1="264" x2="520" y2="310" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><rect x="250" y="316" width="400" height="70" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="355.7" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Gain from them: conform</text><rect x="250" y="410" width="400" height="70" rx="14" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="450" y="437.4" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">Gain from neither: more likely to</text><text x="450" y="461.4" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">offend</text><rect x="30" y="506" width="272" height="129" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="540.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Heidensohn (1985)</text><text x="50" y="568.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Women controlled more</text><text x="50" y="589.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">tightly at home, in public</text><text x="50" y="610.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">and at work</text><rect x="314" y="506" width="272" height="129" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="334" y="540.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Pollak (1950)</text><text x="334" y="568.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Chivalry thesis: lenient</text><text x="334" y="589.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">treatment under-records</text><text x="334" y="610.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">women’s crime</text><rect x="598" y="506" width="272" height="129" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="618" y="540.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Messerschmidt (1993)</text><text x="618" y="568.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Some men use crime to</text><text x="618" y="589.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">“accomplish” masculinity</text>
</svg>