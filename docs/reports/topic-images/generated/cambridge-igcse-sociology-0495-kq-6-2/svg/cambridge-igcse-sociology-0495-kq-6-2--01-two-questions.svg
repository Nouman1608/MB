<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 611" width="900" height="611" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="611" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The two questions behind every pattern</text>

<rect x="30" y="104" width="840" height="62" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="140" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">A group is over-represented in official crime statistics</text><line x1="300" y1="186" x2="230" y2="224" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><line x1="600" y1="186" x2="670" y2="224" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="30" y="242" width="410" height="241" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="275" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">QUESTION 1</text><text x="50" y="302" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Do they commit more crime?</text><text x="50" y="330.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="330.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Strain and blocked opportunity</text><text x="50" y="357.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="357.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Status frustration and subcultures</text><text x="50" y="384.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="384.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Relative deprivation</text><text x="50" y="411.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="411.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Culture of masculinity</text><rect x="460" y="242" width="410" height="241" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="480" y="275" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">QUESTION 2</text><text x="480" y="302" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Are they more likely to be</text><text x="480" y="328" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">caught, recorded and punished?</text><text x="480" y="356.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="495.2" y="356.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Police targeting and stop and search</text><text x="480" y="383.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="495.2" y="383.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Stereotyping and labelling</text><text x="480" y="410.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="495.2" y="410.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Institutional racism</text><text x="480" y="437.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="495.2" y="437.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Chivalry thesis; white-collar crime handled</text><text x="495.2" y="458.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">outside courts</text><rect x="30" y="501" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="534.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Almost every evaluation in 6.2 comes back to this distinction. Do not treat official</text><text x="50" y="556.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">statistics as proof of who commits crime.</text>
</svg>