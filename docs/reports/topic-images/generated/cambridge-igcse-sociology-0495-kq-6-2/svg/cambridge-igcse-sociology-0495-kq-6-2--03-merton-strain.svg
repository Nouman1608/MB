<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 574" width="900" height="574" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="574" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Merton’s strain theory (1938)</text>

<rect x="30" y="110" width="260" height="100" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="160" y="151.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Society values goals</text><text x="160" y="179.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">such as wealth</text><rect x="320" y="110" width="260" height="100" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="138.7" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Legitimate means</text><text x="450" y="163.7" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">blocked</text><text x="450" y="192.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">for some people</text><rect x="610" y="110" width="260" height="100" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="740" y="151.3" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Strain</text><text x="740" y="181.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">people adapt in five ways</text><line x1="294" y1="160" x2="316" y2="160" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="584" y1="160" x2="606" y2="160" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="740" y1="214" x2="740" y2="246" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="252" width="156" height="70" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="108" y="291.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Conformity</text><rect x="201" y="252" width="156" height="70" rx="14" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="279" y="291.4" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">Innovation</text><rect x="372" y="252" width="156" height="70" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="291.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Ritualism</text><rect x="543" y="252" width="156" height="70" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="621" y="291.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Retreatism</text><rect x="714" y="252" width="156" height="70" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="792" y="291.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Rebellion</text><line x1="185" y1="246" x2="792" y2="246" stroke="#1e2a44" stroke-width="2.5"/><line x1="108" y1="246" x2="108" y2="252" stroke="#1e2a44" stroke-width="2.5"/><line x1="279" y1="246" x2="279" y2="252" stroke="#1e2a44" stroke-width="2.5"/><line x1="450" y1="246" x2="450" y2="252" stroke="#1e2a44" stroke-width="2.5"/><line x1="621" y1="246" x2="621" y2="252" stroke="#1e2a44" stroke-width="2.5"/><line x1="108" y1="246" x2="740" y2="246" stroke="#1e2a44" stroke-width="2.5"/><rect x="161" y="342" width="340" height="109" rx="14" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="331" y="377.2" font-size="19" font-weight="700" fill="#b5602e" text-anchor="middle">Innovation = crime</text><text x="331" y="405.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Accept the goal, but use crime to</text><text x="331" y="426.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">reach it</text><line x1="279" y1="324" x2="279" y2="340" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><rect x="30" y="466" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="499.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Strength: explains utilitarian working-class crime. Limitation: ignores non-utilitarian</text><text x="50" y="521.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">crime and crimes of the powerful.</text>
</svg>