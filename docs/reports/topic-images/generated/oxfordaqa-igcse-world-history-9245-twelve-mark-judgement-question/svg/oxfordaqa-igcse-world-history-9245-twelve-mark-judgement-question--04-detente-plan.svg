<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 516" width="900" height="516" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="516" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked plan: why détente collapsed</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">"The Soviet invasion of Afghanistan was the main reason détente collapsed."</text>
<rect x="30" y="124" width="257.3333333333333" height="231" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="150" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">BEFORE 1979 · WHY</text><text x="44" y="176.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Détente already fragile</text><text x="44" y="204" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="58.25" y="204" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Helsinki (1975): human-rights</text><text x="58.25" y="224" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">promises ignored</text><text x="44" y="249" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="58.25" y="249" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">SALT II opposed in Congress</text><text x="44" y="274" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="58.25" y="274" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Rivalry in Africa and</text><text x="58.25" y="294" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">elsewhere</text><line x1="293.3333333333333" y1="239.5" x2="315.3333333333333" y2="239.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="321.3333333333333" y="124" width="257.3333333333333" height="231" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="335.3333333333333" y="150" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">DEC 1979 · WHEN</text><text x="335.3333333333333" y="176.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Afghanistan (given</text><text x="335.3333333333333" y="199.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">factor)</text><text x="335.3333333333333" y="227" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="349.5833333333333" y="227" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Seen as expansion towards</text><text x="349.5833333333333" y="247" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Gulf oil</text><text x="335.3333333333333" y="272" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="349.5833333333333" y="272" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Carter withdraws SALT II;</text><text x="349.5833333333333" y="292" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">grain embargo</text><text x="335.3333333333333" y="317" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="349.5833333333333" y="317" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">1980 Moscow Olympics</text><text x="349.5833333333333" y="337" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">boycott</text><line x1="584.6666666666666" y1="239.5" x2="606.6666666666666" y2="239.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="612.6666666666666" y="124" width="257.3333333333333" height="231" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="626.6666666666666" y="150" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FROM 1980 · HOW LONG</text><text x="626.6666666666666" y="176.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Reagan</text><text x="626.6666666666666" y="204" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="640.9166666666666" y="204" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">"Evil empire"; more defence</text><text x="640.9166666666666" y="224" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">spending</text><text x="626.6666666666666" y="249" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="640.9166666666666" y="249" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">SDI (1983); new missiles in</text><text x="640.9166666666666" y="269" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Europe</text><text x="626.6666666666666" y="294" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="640.9166666666666" y="294" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">USSR boycotts 1984 Olympics</text><rect x="30" y="373" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="407.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Judgement: agree to a large extent</text><text x="50" y="437.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Afghanistan turned a weakening relationship into open hostility within weeks, but it worked on</text><text x="50" y="459.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">existing weaknesses, and Reagan made the collapse deeper.</text>
</svg>