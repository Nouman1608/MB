<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 637" width="900" height="637" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="637" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Five tests for comparing factors</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">X and Y are two factors; ! is the outcome. Y stands on X: it needs X</text>
<rect x="30" y="124" width="225" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="68" y="142" width="44" height="26" rx="6" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="90" y="161" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Y</text><rect x="48" y="170" width="84" height="22" rx="6" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="90" y="187" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">X</text><line x1="138" y1="166" x2="198" y2="166" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="204" y="148" width="44" height="36" rx="7" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="226" y="173" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">!</text><rect x="270" y="124" width="600" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="284" y="156.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Necessary condition</text><text x="284" y="185.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">"Without X, Y would not have mattered, because..."</text><rect x="30" y="220" width="225" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="48" y="266" width="150" height="16" rx="5" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="56" y="260" font-size="15" font-weight="600" fill="#8a6d0d" text-anchor="start">Y (long-term)</text><path d="M198,248 l10,16 l-10,16 l-10,-16 z" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><text x="220" y="269" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">X</text><rect x="270" y="220" width="600" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="284" y="252.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Trigger versus underlying cause</text><text x="284" y="281.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">"X explains when it happened; Y explains why it happened at all."</text><rect x="30" y="316" width="225" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="48" y="340" width="44" height="36" rx="7" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="70" y="365" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">X</text><line x1="96" y1="358" x2="122" y2="358" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="126" y="340" width="44" height="36" rx="7" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="148" y="365" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Y</text><line x1="174" y1="358" x2="200" y2="358" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="204" y="340" width="44" height="36" rx="7" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="226" y="365" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">!</text><rect x="270" y="316" width="600" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="284" y="348.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Chain</text><text x="284" y="377.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">"X led to Y, so X is the more fundamental cause."</text><rect x="30" y="412" width="225" height="97" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="48" y="442.5" width="44" height="36" rx="7" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="70" y="467.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">X</text><path d="M50,444.5 L90,476.5 M90,444.5 L50,476.5" fill="none" stroke="#b5602e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><rect x="126" y="442.5" width="44" height="36" rx="7" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="148" y="467.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Y</text><line x1="174" y1="460.5" x2="200" y2="460.5" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="204" y="442.5" width="44" height="36" rx="7" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="226" y="467.5" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">!</text><rect x="270" y="412" width="600" height="97" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="284" y="440.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Counterfactual</text><text x="284" y="469.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">"Even if X had not happened, Y would probably still have produced the</text><text x="284" y="490.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">outcome because..."</text><rect x="30" y="521" width="225" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="88" cy="563" r="16" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="88" y="569" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">X</text><circle cx="188" cy="563" r="30" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="188" y="569" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Y</text><rect x="270" y="521" width="600" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="284" y="553.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Scope</text><text x="284" y="582.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">"X affected only..., whereas Y affected..."</text>
</svg>