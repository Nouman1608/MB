<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 862" width="900" height="862" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="862" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked plan: Hitler's steps, 1935-38</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Was the Rhineland the most important step in increasing tension?</text>
<rect x="30" y="124" width="840" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">1935</text><text x="50" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Rearmament and conscription</text><text x="50" y="211.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Openly broke Versailles; the Anglo-German Naval Agreement split the Stresa Front.</text><line x1="450" y1="240" x2="450" y2="284" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="470" y="268" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">made it possible</text><rect x="30" y="288" width="840" height="133" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="320" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">MARCH 1936 · GIVEN FACTOR</text><text x="50" y="346.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Remilitarisation of the Rhineland</text><text x="50" y="375.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Broke Versailles and Locarno; Britain and France did not respond; showed bluff worked; let Hitler fortify</text><text x="50" y="396.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the west.</text><line x1="450" y1="425" x2="450" y2="469" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="470" y="453" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">made it safe</text><rect x="30" y="473" width="840" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="505" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">MARCH 1938</text><text x="50" y="531.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The Anschluss</text><text x="50" y="560.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Czechoslovakia now surrounded on three sides.</text><line x1="450" y1="589" x2="450" y2="633" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="470" y="617" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">direct cause of</text><rect x="30" y="637" width="840" height="60" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="450" y="671.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">The Sudeten crisis</text><rect x="30" y="719" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="753.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Judgement (example)</text><text x="50" y="783.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The Rhineland was most important: the moment Britain and France could most easily have stopped</text><text x="50" y="805.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Hitler and chose not to, making each later step less risky.</text>
</svg>