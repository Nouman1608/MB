<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 719" width="900" height="719" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="719" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What each level rewards</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Point-Evidence-Explain, then comparison</text>
<rect x="30" y="334" width="205" height="220" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="64" cy="368" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="64" y="375.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="94" y="375" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Basic</text><text x="46" y="418" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Relevant knowledge</text><text x="46" y="439" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">identified; explanation</text><text x="46" y="460" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">asserted or general.</text><rect x="241" y="264" width="205" height="290" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><circle cx="275" cy="298" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="275" y="305.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="305" y="305" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Simple</text><text x="257" y="348" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A point supported by</text><text x="257" y="369" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">evidence; link to the</text><text x="257" y="390" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">question left implicit.</text><rect x="452" y="194" width="205" height="360" rx="12" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><circle cx="486" cy="228" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="486" y="235.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="516" y="235" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Developed</text><text x="468" y="278" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Point and evidence</text><text x="468" y="299" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">tied to the question by</text><text x="468" y="320" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">explicit explanation.</text><rect x="663" y="124" width="205" height="430" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="697" cy="158" r="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="697" y="165.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="727" y="165" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Complex</text><text x="679" y="208" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Factors linked</text><text x="679" y="229" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">together to evaluate</text><text x="679" y="250" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">their relative</text><text x="679" y="271" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">importance.</text><rect x="30" y="576" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="610.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The ceiling</text><text x="50" y="640.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Two well-explained factors that are never compared stay at Level 3. Level 4 needs the factors to</text><text x="50" y="662.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">"talk to each other".</text>
</svg>