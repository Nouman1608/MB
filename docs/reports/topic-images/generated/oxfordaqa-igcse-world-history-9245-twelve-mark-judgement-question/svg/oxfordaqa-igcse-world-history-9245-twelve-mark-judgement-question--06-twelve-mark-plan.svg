<rect width="900" height="601" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Planning the 12-mark answer</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">About 18 minutes of a 1 hour 45 minute, 60-mark paper</text>
<rect x="30" y="124" width="140" height="76" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="100" y="158" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Plan</text><text x="100" y="182" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">3 min</text><rect x="170" y="124" width="700" height="76" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="520" y="158" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Write</text><text x="520" y="182" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">about 15 minutes</text><text x="450" y="226" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Bar widths to scale</text><text x="30" y="256" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">JOT DOWN BEFORE YOU WRITE</text><rect x="30" y="272" width="196.5" height="185" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="44" y="320" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">1 · FIRST</text><text x="44" y="346.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Your judgement</text><text x="44" y="374.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Write it first; make</text><text x="44" y="395.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">every paragraph lead</text><text x="44" y="416.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">to it.</text><rect x="244.5" y="272" width="196.5" height="185" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="258.5" y="341" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">2</text><text x="258.5" y="367.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The given factor</text><text x="258.5" y="395.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">From the statement.</text><rect x="459" y="272" width="196.5" height="185" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="473" y="330.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">3</text><text x="473" y="356.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Two other factors</text><text x="473" y="385.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">With precise dates,</text><text x="473" y="406.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">names and events.</text><rect x="673.5" y="272" width="196.5" height="185" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="687.5" y="298" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">4</text><text x="687.5" y="324.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Your comparison</text><text x="687.5" y="347.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">test</text><text x="687.5" y="375.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Necessary condition,</text><text x="687.5" y="396.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">trigger, chain,</text><text x="687.5" y="417.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">counterfactual or</text><text x="687.5" y="438.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">scope.</text><text x="30" y="485" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">COMMON MISTAKES TO AVOID</text><rect x="30" y="501" width="175.2" height="29" rx="14.5" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><text x="117.6" y="520.9" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">only the given factor</text><rect x="215.2" y="501" width="90.48" height="29" rx="14.5" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><text x="260.44" y="520.9" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">narrative</text><rect x="315.68" y="501" width="144.195" height="29" rx="14.5" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><text x="387.77750000000003" y="520.9" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">separate essays</text><rect x="469.875" y="501" width="119.37" height="29" rx="14.5" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><text x="529.56" y="520.9" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">fence-sitting</text><rect x="599.245" y="501" width="219.075" height="29" rx="14.5" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><text x="708.7825" y="520.9" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">conclusion out of nowhere</text><rect x="30" y="540" width="140.535" height="29" rx="14.5" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><text x="100.2675" y="559.9" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">vague evidence</text>
</svg>