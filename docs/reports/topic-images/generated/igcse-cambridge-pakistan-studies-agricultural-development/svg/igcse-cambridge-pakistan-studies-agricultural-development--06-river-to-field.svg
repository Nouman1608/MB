<rect x="30" y="112" width="840" height="114" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="50" y="124" width="200" height="90" rx="10" fill="#e6eef0"/><rect x="50" y="154" width="110" height="60" fill="#b5d3cf"/><path d="M160,142 L182,142 L196,214 L160,214 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3"/><rect x="196" y="198" width="54" height="16" fill="#b5d3cf"/><circle cx="300" cy="169" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="300" y="177.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="345" y="156" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Dam</text><text x="345" y="186" font-size="18" font-weight="400" fill="#4a5568" text-anchor="start">Stores water.</text><rect x="30" y="240" width="840" height="114" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="50" y="252" width="200" height="90" rx="10" fill="#e6eef0"/><rect x="50" y="282" width="200" height="34" fill="#b5d3cf"/><rect x="140" y="274" width="14" height="50" fill="#1e2a44"/><rect x="140" y="274" width="14" height="50" fill="#1e2a44"/><rect x="140" y="274" width="14" height="50" fill="#1e2a44"/><rect x="140" y="274" width="14" height="50" fill="#1e2a44"/><path d="M120,316 L120,342" fill="none" stroke="#2b5a9a" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" /><line x1="140" y1="299" x2="154" y2="299" stroke="#d4b02e" stroke-width="4"/><circle cx="300" cy="297" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="300" y="305.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="345" y="284" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Barrage</text><text x="345" y="314" font-size="18" font-weight="400" fill="#4a5568" text-anchor="start">Raises the river level and diverts water into canals.</text><rect x="30" y="368" width="840" height="114" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="50" y="380" width="200" height="90" rx="10" fill="#e6eef0"/><path d="M90,380 L90,470" fill="none" stroke="#2b5a9a" stroke-width="12" stroke-linejoin="round" stroke-linecap="round" /><path d="M210,380 L210,470" fill="none" stroke="#2b5a9a" stroke-width="12" stroke-linejoin="round" stroke-linecap="round" /><path d="M96,420 L204,435" fill="none" stroke="#2b5a9a" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="12 6"/><circle cx="300" cy="425" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="300" y="433.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="345" y="412" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Link canal</text><text x="345" y="442" font-size="18" font-weight="400" fill="#4a5568" text-anchor="start">Moves water between rivers.</text><rect x="30" y="496" width="840" height="114" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="50" y="508" width="200" height="90" rx="10" fill="#e6eef0"/><path d="M60,553 L240,553" fill="none" stroke="#2b5a9a" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" /><path d="M100,553 L100,523 M100,553 L100,588" fill="none" stroke="#2b5a9a" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M150,553 L150,523 M150,553 L150,588" fill="none" stroke="#2b5a9a" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M200,553 L200,523 M200,553 L200,588" fill="none" stroke="#2b5a9a" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="300" cy="553" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="300" y="561.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="345" y="540" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Distribution canals and field channels</text><text x="345" y="570" font-size="18" font-weight="400" fill="#4a5568" text-anchor="start">Carry water to the farms.</text><rect x="30" y="624" width="840" height="114" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="50" y="636" width="200" height="90" rx="10" fill="#e6eef0"/><rect x="80" y="654" width="140" height="56" fill="#b5d3cf" stroke="#6f9a52" stroke-width="9"/><path d="M110,692 l-5,-14 m5,14 l5,-14" fill="none" stroke="#6f9a52" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M150,692 l-5,-14 m5,14 l5,-14" fill="none" stroke="#6f9a52" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M190,692 l-5,-14 m5,14 l5,-14" fill="none" stroke="#6f9a52" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="300" cy="681" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="300" y="689.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="345" y="668" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Bunds</text><text x="345" y="698" font-size="18" font-weight="400" fill="#4a5568" text-anchor="start">Hold water on the fields.</text><line x1="300" y1="195" x2="300" y2="269" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="300" y1="323" x2="300" y2="397" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="300" y1="451" x2="300" y2="525" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="300" y1="579" x2="300" y2="653" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/>
