<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Karez: gravity-fed water for an oasis</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Balochistan · not to scale</text>
<rect x="30" y="112" width="840" height="430" rx="14" fill="#e6eef0"/><path d="M30,180 Q160,170 300,300 Q420,420 560,470 L870,470 L870,542 L30,542 Z" fill="#efdfa8" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><path d="M30,300 Q140,320 250,400 Q300,440 340,542 L30,542 Z" fill="#b5d3cf" opacity="0.9"/><path d="M30,300 Q140,320 250,400" fill="none" stroke="#2b5a9a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><path d="M250,400 L560,466" fill="none" stroke="#1e2a44" stroke-width="16" stroke-linejoin="round" stroke-linecap="round" /><path d="M250,400 L560,466" fill="none" stroke="#9fc3e6" stroke-width="10" stroke-linejoin="round" stroke-linecap="round" /><path d="M560,466 L700,466" fill="none" stroke="#2b5a9a" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" /><path d="M640,470 L640,390" fill="none" stroke="#9c8f6e" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" /><path d="M640,390 Q623,377 606,406" fill="none" stroke="#6f9a52" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" /><path d="M640,390 Q657,377 674,406" fill="none" stroke="#6f9a52" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" /><path d="M640,390 Q628,363 616,378" fill="none" stroke="#6f9a52" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" /><path d="M640,390 Q652,363 664,378" fill="none" stroke="#6f9a52" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" /><path d="M640,390 Q640,359 640,370" fill="none" stroke="#6f9a52" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" /><path d="M730,470 L730,390" fill="none" stroke="#9c8f6e" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" /><path d="M730,390 Q713,377 696,406" fill="none" stroke="#6f9a52" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" /><path d="M730,390 Q747,377 764,406" fill="none" stroke="#6f9a52" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" /><path d="M730,390 Q718,363 706,378" fill="none" stroke="#6f9a52" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" /><path d="M730,390 Q742,363 754,378" fill="none" stroke="#6f9a52" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" /><path d="M730,390 Q730,359 730,370" fill="none" stroke="#6f9a52" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" /><ellipse cx="600" cy="462" rx="14" ry="9" fill="#6f9a52" stroke="#1e2a44" stroke-width="2"/><ellipse cx="680" cy="462" rx="14" ry="9" fill="#6f9a52" stroke="#1e2a44" stroke-width="2"/><ellipse cx="770" cy="462" rx="14" ry="9" fill="#6f9a52" stroke="#1e2a44" stroke-width="2"/><ellipse cx="810" cy="462" rx="14" ry="9" fill="#6f9a52" stroke="#1e2a44" stroke-width="2"/><text x="110" y="230" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="start">HILLS</text><text x="70" y="470" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">groundwater at the</text><text x="70" y="492" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">foot of the hills</text><line x1="420" y1="270" x2="400" y2="425" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="360" y="220" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">underground channel:</text><text x="360" y="244" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">water flows by gravity</text><text x="720" y="330" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">OASIS</text><text x="720" y="354" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">dates and vegetables</text><text x="450" y="520" font-size="17" font-weight="600" fill="#2b5a9a" text-anchor="middle">little water lost to evaporation underground</text><rect x="30" y="562" width="410" height="107" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="595" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Advantage</text><text x="48" y="624.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Water travels underground, so little is lost to</text><text x="48" y="646.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">evaporation in the desert heat.</text><rect x="460" y="562" width="410" height="107" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="478" y="595" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Problems</text><text x="478" y="624.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Channels need constant cleaning. Tubewells</text><text x="478" y="646.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">are replacing karez in places and lower the</text><text x="478" y="668.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">water table.</text>
