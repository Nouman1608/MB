<rect width="900" height="589" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Livestock: on the farm and on the move</text>

<rect x="30" y="112" width="840" height="320" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M60,400 L300,390 Q480,340 600,180 Q650,150 700,175 Q780,250 840,400 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><path d="M580,196 Q650,140 720,190" fill="none" stroke="#6f9a52" stroke-width="10" stroke-linejoin="round" stroke-linecap="round" /><path d="M70,396 L280,388" fill="none" stroke="#6f9a52" stroke-width="10" stroke-linejoin="round" stroke-linecap="round" /><path d="M260,350 Q420,260 560,170" fill="none" stroke="#2e6b62" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahT)"/><path d="M650,250 Q560,330 330,360" fill="none" stroke="#b5602e" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahR)"/><text x="650" y="140" font-size="18" font-weight="700" fill="#6f9a52" text-anchor="middle">high summer pastures</text><text x="320" y="210" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="end">SUMMER: move up</text><text x="560" y="340" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">WINTER: move down</text><text x="560" y="362" font-size="17" font-weight="400" fill="#b5602e" text-anchor="start">to the valleys</text><text x="80" y="422" font-size="17" font-weight="700" fill="#6f9a52" text-anchor="start">valleys</text><text x="60" y="150" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Transhumance</text><text x="60" y="174" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">sheep and goats in the mountains and Balochistan</text><rect x="30" y="452" width="410" height="107" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="485" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Small farms</text><text x="48" y="514.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Buffalo and cattle provide milk, draught power</text><text x="48" y="536.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">and dung.</text><rect x="460" y="452" width="410" height="107" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="478" y="485" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Nomadic or semi-nomadic herding</text><text x="478" y="514.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Sheep and goats are herded by nomads, or</text><text x="478" y="536.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">moved with the seasons by transhumance.</text>
</svg>