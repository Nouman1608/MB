<rect width="900" height="734" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How waterlogging leads to salinity</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">not to scale</text>
<rect x="30" y="112" width="840" height="390" rx="14" fill="#e6eef0"/><rect x="30" y="260" width="840" height="242" fill="#efdfa8"/><line x1="30" y1="260" x2="870" y2="260" stroke="#1e2a44" stroke-width="3"/><path d="M70,260 L90,320 L190,320 L210,260 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="140" y="246" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">unlined canal</text><rect x="30" y="300" width="840" height="202" fill="#b5d3cf" opacity="0.75"/><path d="M30,300 L870,300" fill="none" stroke="#2b5a9a" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><path d="M30,450 L870,450" fill="none" stroke="#2b5a9a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="10 8"/><text x="860" y="442" font-size="16" font-weight="600" fill="#2b5a9a" text-anchor="end">water table before</text><text x="240" y="326" font-size="17" font-weight="700" fill="#2b5a9a" text-anchor="start">water table rises near the surface</text><line x1="110" y1="330" x2="110" y2="390" stroke="#2b5a9a" stroke-width="3" marker-end="url(#ah)"/><line x1="140" y1="330" x2="140" y2="390" stroke="#2b5a9a" stroke-width="3" marker-end="url(#ah)"/><line x1="170" y1="330" x2="170" y2="390" stroke="#2b5a9a" stroke-width="3" marker-end="url(#ah)"/><text x="140" y="420" font-size="17" font-weight="700" fill="#2b5a9a" text-anchor="middle">seepage</text><line x1="330" y1="170" x2="330" y2="254" stroke="#2b5a9a" stroke-width="3" marker-end="url(#ah)"/><line x1="360" y1="170" x2="360" y2="254" stroke="#2b5a9a" stroke-width="3" marker-end="url(#ah)"/><text x="345" y="160" font-size="17" font-weight="700" fill="#2b5a9a" text-anchor="middle">over-watering</text><path d="M470,260 L470,200 M470,230 l-14,-14 M470,218 l14,-14" fill="none" stroke="#6f9a52" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><path d="M470,260 l-10,30 M470,260 l0,34 M470,260 l10,30" fill="none" stroke="#9c8f6e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M520,260 L520,200 M520,230 l-14,-14 M520,218 l14,-14" fill="none" stroke="#6f9a52" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><path d="M520,260 l-10,30 M520,260 l0,34 M520,260 l10,30" fill="none" stroke="#9c8f6e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M570,260 L570,200 M570,230 l-14,-14 M570,218 l14,-14" fill="none" stroke="#6f9a52" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><path d="M570,260 l-10,30 M570,260 l0,34 M570,260 l10,30" fill="none" stroke="#9c8f6e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><text x="520" y="372" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">waterlogged: roots cannot breathe</text><line x1="690" y1="252" x2="690" y2="196" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><line x1="740" y1="252" x2="740" y2="196" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><line x1="790" y1="252" x2="790" y2="196" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><text x="735" y="180" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">evaporation in the hot climate</text><rect x="650" y="253" width="210" height="9" fill="#ffffff" stroke="#4a5568" stroke-width="1.5"/><text x="860" y="326" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">salt crust left on the</text><text x="860" y="348" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">surface = salinity</text><rect x="30" y="522" width="410" height="182" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="555" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Restoring damaged land</text><text x="48" y="584.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="584.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Tubewells pump groundwater out to lower</text><text x="64" y="606.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">the water table</text><text x="48" y="631.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="631.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Drainage channels carry salty water away</text><text x="48" y="656.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="656.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Land is flushed with water</text><text x="48" y="681.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="681.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Salt-tolerant crops are planted</text><rect x="460" y="522" width="410" height="182" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="478" y="555" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Prevention</text><text x="478" y="584.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="494" y="584.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Lining canals</text><text x="478" y="609.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="494" y="609.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">More careful water use</text><text x="478" y="634.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="494" y="634.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Better drainage</text>
</svg>