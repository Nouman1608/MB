<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 662" width="900" height="662" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="662" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A farm as a system</text>

<rect x="30" y="112" width="250" height="303" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="145" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">INPUTS</text><text x="48" y="175.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="175.3" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">land</text><text x="48" y="202.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="202.3" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">water</text><text x="48" y="229.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="229.3" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">seeds</text><text x="48" y="256.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="256.3" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">fertiliser</text><text x="48" y="283.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="283.3" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">labour</text><text x="48" y="310.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="310.3" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">machinery</text><text x="48" y="337.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="337.3" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">capital</text><text x="48" y="364.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="364.3" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">animals</text><rect x="325" y="112" width="250" height="303" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="343" y="145" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">PROCESSES</text><text x="343" y="175.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="359" y="175.3" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">ploughing</text><text x="343" y="202.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="359" y="202.3" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">sowing</text><text x="343" y="229.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="359" y="229.3" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">transplanting</text><text x="343" y="256.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="359" y="256.3" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">irrigating</text><text x="343" y="283.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="359" y="283.3" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">weeding</text><text x="343" y="310.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="359" y="310.3" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">spraying</text><text x="343" y="337.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="359" y="337.3" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">harvesting</text><text x="343" y="364.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="359" y="364.3" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">threshing</text><text x="343" y="391.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="359" y="391.3" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">milking</text><rect x="620" y="112" width="250" height="303" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="638" y="145" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">OUTPUTS</text><text x="638" y="175.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="654" y="175.3" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">crops</text><text x="638" y="202.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="654" y="202.3" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">milk, meat, wool, eggs</text><text x="638" y="229.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="654" y="229.3" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">income</text><text x="638" y="256.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="654" y="256.3" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">waste such as crop</text><text x="654" y="280.3" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">residue</text><line x1="286" y1="263.5" x2="317" y2="263.5" stroke="#1e2a44" stroke-width="5" marker-end="url(#ah)"/><line x1="581" y1="263.5" x2="612" y2="263.5" stroke="#1e2a44" stroke-width="5" marker-end="url(#ah)"/><path d="M745,419 L745,463 L155,463 L155,425" fill="none" stroke="#8a6d0d" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahO)"/><text x="450" y="495" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="middle">On a cash crop farm, income from sales becomes an input for next season</text><rect x="30" y="525" width="270" height="107" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="558" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Subsistence</text><text x="48" y="587.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Most outputs feed the family.</text><rect x="315" y="525" width="270" height="107" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="333" y="558" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Cash crop</text><text x="333" y="587.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Outputs are sold, e.g. cotton</text><text x="333" y="609.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">or sugar cane.</text><rect x="600" y="525" width="270" height="107" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="618" y="558" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Livestock</text><text x="618" y="587.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Adds fodder and veterinary</text><text x="618" y="609.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">care as inputs.</text>
</svg>