<rect width="900" height="552" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The four main crops: where and why</text>

<rect x="30" y="112" width="840" height="410" rx="12" fill="#ffffff"/><path d="M30,156 L30,124 Q30,112 42,112 L858,112 Q870,112 870,124 L870,156 Z" fill="#b5d3cf"/><rect x="30" y="156" width="840" height="86" fill="#ffffff"/><text x="42" y="182.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Cotton</text><text x="192" y="182.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Kharif</text><text x="302" y="182.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Southern Punjab and central</text><text x="302" y="204.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Sindh</text><text x="582" y="182.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Long, hot, sunny summers; canal</text><text x="582" y="204.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">water; a frost-free growing</text><text x="582" y="226.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">season; dry weather at picking</text><line x1="30" y1="156" x2="870" y2="156" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="242" width="840" height="108" fill="#dce9e7"/><text x="42" y="268.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Rice</text><text x="192" y="268.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Kharif</text><text x="302" y="268.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The “rice belt” of northern</text><text x="302" y="290.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Punjab around Gujranwala and</text><text x="302" y="312.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Sialkot (basmati); parts of</text><text x="302" y="334.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">northern Sindh</text><text x="582" y="268.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">High temperatures, standing water</text><text x="582" y="290.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">and clay soils that hold water</text><line x1="30" y1="242" x2="870" y2="242" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="350" width="840" height="64" fill="#ffffff"/><text x="42" y="376.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Sugar cane</text><text x="192" y="376.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Kharif</text><text x="302" y="376.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Central Punjab, central Sindh</text><text x="302" y="398.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">and the Peshawar valley</text><text x="582" y="376.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Heat, a long growing season and a</text><text x="582" y="398.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">great deal of water</text><line x1="30" y1="350" x2="870" y2="350" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="414" width="840" height="108" fill="#dce9e7"/><text x="42" y="440.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Wheat</text><text x="192" y="440.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Rabi</text><text x="302" y="440.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Irrigated plains of Punjab and</text><text x="302" y="462.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Sindh; barani (rain-fed) land in</text><text x="302" y="484.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">the Potwar Plateau</text><text x="582" y="440.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The staple food crop. Grows in the</text><text x="582" y="462.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">cooler, drier winter; on barani land</text><text x="582" y="484.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">the harvest depends on winter</text><text x="582" y="506.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">rainfall</text><line x1="30" y1="414" x2="870" y2="414" stroke="#c9d6d4" stroke-width="1.5"/><line x1="180" y1="112" x2="180" y2="522" stroke="#c9d6d4" stroke-width="1.5"/><line x1="290" y1="112" x2="290" y2="522" stroke="#c9d6d4" stroke-width="1.5"/><line x1="570" y1="112" x2="570" y2="522" stroke="#c9d6d4" stroke-width="1.5"/><text x="42" y="141.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Crop</text><text x="192" y="141.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Season</text><text x="302" y="141.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Main areas</text><text x="582" y="141.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Why there: what the crop needs</text><rect x="30" y="112" width="840" height="410" rx="12" fill="none" stroke="#1e2a44" stroke-width="2.5"/>
</svg>