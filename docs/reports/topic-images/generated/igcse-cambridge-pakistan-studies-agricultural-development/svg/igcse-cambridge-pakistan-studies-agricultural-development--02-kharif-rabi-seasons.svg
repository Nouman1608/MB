<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="620" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Two growing seasons: kharif and rabi</text>

<path d="M265,370 L158.93398282201787,263.93398282201787 A150,150 0 0 1 371.06601717798213,263.93398282201787 Z" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><path d="M265,370 L371.06601717798213,263.93398282201787 A150,150 0 0 1 371.06601717798213,476.06601717798213 Z" fill="#efdfa8" stroke="#1e2a44" stroke-width="2.5"/><path d="M265,370 L371.06601717798213,476.06601717798213 A150,150 0 0 1 158.93398282201787,476.06601717798213 Z" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><path d="M265,370 L158.93398282201787,476.06601717798213 A150,150 0 0 1 158.93398282201787,263.93398282201787 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="265" y="287" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Summer</text><text x="355" y="377" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Autumn</text><text x="265" y="467" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Winter</text><text x="175" y="377" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Spring</text><circle cx="265" cy="370" r="8" fill="#1e2a44"/><path d="M249.66058927641214,194.6697331358528 A176,176 0 0 1 439.2871800985164,345.5055342310285" fill="none" stroke="#8a6d0d" stroke-width="9" stroke-linecap="round" marker-end="url(#ahO)"/><path d="M280.33941072358783,545.3302668641472 A176,176 0 0 1 90.71281990148364,394.49446576897157" fill="none" stroke="#2e6b62" stroke-width="9" stroke-linecap="round" marker-end="url(#ahT)"/><circle cx="249.66058927641214" cy="194.6697331358528" r="9" fill="#8a6d0d"/><circle cx="280.33941072358783" cy="545.3302668641472" r="9" fill="#2e6b62"/><text x="249" y="174" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="end">KHARIF: sow</text><text x="459" y="420" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">harvest</text><text x="281" y="578" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">RABI: sow</text><text x="71" y="330" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">harvest</text><rect x="510" y="130" width="360" height="174" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="528" y="163" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Kharif crops</text><text x="528" y="186.75" font-size="15" font-weight="600" fill="#8a6d0d" text-anchor="start">sown in summer, at or before the</text><text x="528" y="206.75" font-size="15" font-weight="600" fill="#8a6d0d" text-anchor="start">monsoon; harvested in autumn</text><text x="528" y="234.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="544" y="234.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Cotton, rice, sugar cane, maize, millet</text><text x="528" y="259.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="544" y="259.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Need high temperatures and plenty of</text><text x="544" y="281.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">water</text><rect x="510" y="324" width="360" height="243" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="528" y="357" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Rabi crops</text><text x="528" y="380.75" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start">sown in winter, after the monsoon;</text><text x="528" y="400.75" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start">harvested in spring</text><text x="528" y="428.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="544" y="428.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Wheat, pulses (such as gram),</text><text x="544" y="450.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">oilseeds</text><text x="528" y="475.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="544" y="475.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Grow in the cooler, drier winter</text><text x="528" y="500.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="544" y="500.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Rely on irrigation, winter rain from</text><text x="544" y="522.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">western depressions and moisture</text><text x="544" y="544.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">stored in the soil</text>
</svg>