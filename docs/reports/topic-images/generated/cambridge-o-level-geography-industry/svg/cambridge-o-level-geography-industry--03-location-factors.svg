<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 730" width="900" height="730" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="730" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What decides where a factory goes?</text>

<circle cx="450" cy="400" r="78" fill="#1e2a44" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="396" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">FACTORY</text><text x="450" y="420" font-size="15" font-weight="400" fill="#ffffff" text-anchor="middle">or zone</text><line x1="387.36137870522435" y1="347.0811647682068" x2="232.56913442687423" y2="195.01180224842903" stroke="#4a5568" stroke-width="2.5"/><rect x="30" y="97" width="260" height="116" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="130.725" font-size="18.5" font-weight="700" fill="#1e2a44" text-anchor="start">Land</text><text x="48" y="153.975" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">flat, cheap, room to expand;</text><text x="48" y="173.775" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">greenfield or brownfield</text><line x1="450" y1="318" x2="450" y2="207" stroke="#4a5568" stroke-width="2.5"/><rect x="320" y="87" width="260" height="116" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="338" y="120.725" font-size="18.5" font-weight="700" fill="#1e2a44" text-anchor="start">Labour</text><text x="338" y="143.975" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">many low-cost workers, or</text><text x="338" y="163.775" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">highly skilled ones</text><line x1="512.6386212947757" y1="347.0811647682068" x2="667.4308655731257" y2="195.01180224842903" stroke="#4a5568" stroke-width="2.5"/><rect x="610" y="97" width="260" height="116" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="628" y="130.725" font-size="18.5" font-weight="700" fill="#1e2a44" text-anchor="start">Raw materials</text><text x="628" y="153.975" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">heavy, weight-losing inputs:</text><text x="628" y="173.775" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">locate at the source</text><line x1="532" y1="400" x2="665" y2="400" stroke="#4a5568" stroke-width="2.5"/><rect x="630" y="342" width="260" height="116" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="648" y="375.725" font-size="18.5" font-weight="700" fill="#1e2a44" text-anchor="start">Fuel and power</text><text x="648" y="398.975" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">national grid makes most</text><text x="648" y="418.77500000000003" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">industry footloose; smelters</text><text x="648" y="438.57500000000005" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">seek cheap HEP</text><line x1="513.1723343322245" y1="452.28055255080653" x2="666.8125394931544" y2="600.470801729878" stroke="#4a5568" stroke-width="2.5"/><rect x="610" y="582" width="260" height="116" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="628" y="615.725" font-size="18.5" font-weight="700" fill="#1e2a44" text-anchor="start">Transport</text><text x="628" y="638.975" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">ports (break of bulk),</text><text x="628" y="658.775" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">motorways, rail, airports</text><line x1="450" y1="482" x2="450" y2="593" stroke="#4a5568" stroke-width="2.5"/><rect x="320" y="597" width="260" height="116" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="338" y="630.725" font-size="18.5" font-weight="700" fill="#1e2a44" text-anchor="start">Markets</text><text x="338" y="653.975" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">bulky, fragile or perishable</text><text x="338" y="673.775" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">goods: near customers</text><line x1="386.8276656677754" y1="452.28055255080653" x2="233.18746050684553" y2="600.470801729878" stroke="#4a5568" stroke-width="2.5"/><rect x="30" y="582" width="260" height="116" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="615.725" font-size="18.5" font-weight="700" fill="#1e2a44" text-anchor="start">Political</text><text x="48" y="638.975" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">grants, tax breaks, export</text><text x="48" y="658.775" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">processing zones; trade</text><text x="48" y="678.575" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">barriers</text><rect x="30" y="342" width="260" height="116" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="375.725" font-size="18.5" font-weight="700" fill="#1e2a44" text-anchor="start">Agglomeration</text><text x="48" y="398.975" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">firms cluster where</text><text x="48" y="418.77500000000003" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">suppliers and skilled</text><text x="48" y="438.57500000000005" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">workers already are; the</text><text x="48" y="458.375" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">cluster attracts more</text><line x1="292" y1="400" x2="370" y2="400" stroke="#8a6d0d" stroke-width="2.5" stroke-dasharray="6 5"/>
</svg>