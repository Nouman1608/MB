<rect width="900" height="690" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Case study: Silicon Valley, California</text>

<rect x="30" y="110" width="480" height="560" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="45" y="125" width="450" height="530" rx="10" fill="#d8e3c6"/><path d="M150,125 L250,125 Q300,250 330,330 Q360,400 400,430 Q370,445 340,420 Q290,370 250,300 Q200,220 150,125 Z" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><rect x="167.5" y="200.75" width="165" height="20.25" rx="5" fill="#b5d3cf" opacity="1"/><text x="250" y="215" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">San Francisco Bay</text><circle cx="120" cy="160" r="7" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><rect x="126" y="141.275" width="132.89999999999998" height="20.925" rx="5" fill="#ffffff" opacity="0.92"/><text x="132" y="156" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="start">San Francisco</text><rect x="126" y="161.7" width="65.9" height="18.900000000000002" rx="5" fill="#ffffff" opacity="0.92"/><text x="132" y="175" font-size="14" font-weight="400" fill="#4a5568" text-anchor="start">airport</text><circle cx="210" cy="360" r="7" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><rect x="216" y="341.275" width="95.7" height="20.925" rx="5" fill="#ffffff" opacity="0.92"/><text x="222" y="356" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="start">Palo Alto</text><rect x="216" y="361.7" width="142.9" height="18.900000000000002" rx="5" fill="#ffffff" opacity="0.92"/><text x="222" y="375" font-size="14" font-weight="400" fill="#4a5568" text-anchor="start">Stanford; HP 1939</text><circle cx="270" cy="440" r="7" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><rect x="276" y="421.275" width="132.89999999999998" height="20.925" rx="5" fill="#ffffff" opacity="0.92"/><text x="282" y="436" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="start">Mountain View</text><rect x="276" y="441.7" width="58.2" height="18.900000000000002" rx="5" fill="#ffffff" opacity="0.92"/><text x="282" y="455" font-size="14" font-weight="400" fill="#4a5568" text-anchor="start">Google</text><circle cx="170" cy="520" r="7" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><rect x="176" y="501.275" width="95.7" height="20.925" rx="5" fill="#ffffff" opacity="0.92"/><text x="182" y="516" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="start">Cupertino</text><rect x="176" y="521.7" width="50.5" height="18.900000000000002" rx="5" fill="#ffffff" opacity="0.92"/><text x="182" y="535" font-size="14" font-weight="400" fill="#4a5568" text-anchor="start">Apple</text><circle cx="330" cy="520" r="7" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><rect x="336" y="501.275" width="114.3" height="20.925" rx="5" fill="#ffffff" opacity="0.92"/><text x="342" y="516" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="start">Santa Clara</text><rect x="336" y="521.7" width="50.5" height="18.900000000000002" rx="5" fill="#ffffff" opacity="0.92"/><text x="342" y="535" font-size="14" font-weight="400" fill="#4a5568" text-anchor="start">Intel</text><circle cx="420" cy="470" r="7" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><rect x="426" y="451.275" width="86.39999999999999" height="20.925" rx="5" fill="#ffffff" opacity="0.92"/><text x="432" y="466" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="start">San Jose</text><rect x="426" y="471.7" width="65.9" height="18.900000000000002" rx="5" fill="#ffffff" opacity="0.92"/><text x="432" y="485" font-size="14" font-weight="400" fill="#4a5568" text-anchor="start">airport</text><text x="270" y="640" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Schematic, not to scale</text><text x="530" y="140" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Why here?</text><rect x="530" y="156" width="340" height="68" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="546" y="183" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="start">Labour and research</text><text x="546" y="207" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="start">Stanford graduates; skilled workers from around the world</text><rect x="530" y="234" width="340" height="68" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="546" y="261" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="start">Capital</text><text x="546" y="285" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="start">venture-capital firms fund start-ups</text><rect x="530" y="312" width="340" height="68" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="546" y="339" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="start">Agglomeration</text><text x="546" y="363" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="start">ideas and staff move easily between firms</text><rect x="530" y="390" width="340" height="68" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="546" y="417" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="start">Transport</text><text x="546" y="441" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="start">two international airports, motorways; light, high-value goods</text><rect x="530" y="468" width="340" height="68" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="546" y="495" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="start">Environment</text><text x="546" y="519" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="start">pleasant climate attracts workers</text><rect x="530" y="556" width="340" height="114" rx="12" fill="#f6e6dc" stroke="#b5602e" stroke-width="2.5"/><text x="546" y="584" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">Problems</text><text x="546" y="608" font-size="14.5" font-weight="400" fill="#1e2a44" text-anchor="start">Some of the highest housing costs in the USA;</text><text x="546" y="627" font-size="14.5" font-weight="400" fill="#1e2a44" text-anchor="start">traffic congestion; inequality between tech</text><text x="546" y="646" font-size="14.5" font-weight="400" fill="#1e2a44" text-anchor="start">and lower-paid service workers</text>
</svg>