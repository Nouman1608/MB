<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="640" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four types of industry</text>

<rect x="30" y="115" width="840" height="470" rx="16" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="55" y="152" font-size="23" font-weight="700" fill="#2e6b62" text-anchor="start">Manufacturing</text><text x="55" y="178" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the broad category: making goods from materials, e.g. steel products, textiles, furniture</text><rect x="50" y="200" width="255" height="365" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="50" y="200" width="255" height="12" rx="6" fill="#d4b02e"/><text x="68" y="242" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Processing</text><text x="68" y="268" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">raw material → more useful</text><text x="68" y="288" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">product</text><text x="68" y="330" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="84" y="330" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Refining crude oil</text><text x="68" y="361" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="84" y="361" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Smelting metal ore</text><text x="68" y="392" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="84" y="392" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Milling grain</text><text x="68" y="423" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="84" y="423" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Refining sugar cane</text><rect x="320" y="200" width="255" height="365" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="320" y="200" width="255" height="12" rx="6" fill="#b5d3cf"/><text x="338" y="242" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Assembly</text><text x="338" y="268" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">puts together parts made</text><text x="338" y="288" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">elsewhere</text><text x="338" y="330" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="354" y="330" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Cars, televisions</text><text x="338" y="361" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="354" y="361" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Mobile phones</text><text x="338" y="392" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="354" y="392" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Needs reliable supply</text><text x="354" y="413" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">chains and good</text><text x="354" y="434" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">transport</text><rect x="590" y="200" width="255" height="365" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="590" y="200" width="255" height="12" rx="6" fill="#b5602e"/><text x="608" y="242" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">High technology</text><text x="608" y="268" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">based on advanced research</text><text x="608" y="330" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="624" y="330" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Microchips, computers,</text><text x="624" y="351" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">software</text><text x="608" y="382" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="624" y="382" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Pharmaceuticals,</text><text x="624" y="403" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">aerospace</text><text x="608" y="434" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="624" y="434" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Needs skilled workers</text><text x="624" y="455" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and universities</text><text x="450" y="615" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Processing, assembly and high technology are kinds of manufacturing.</text>
</svg>