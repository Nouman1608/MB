y="213" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="361" y="213" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">Cutting, mixing</text><text x="345" y="244" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="361" y="244" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">Assembling</text><text x="345" y="275" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="361" y="275" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">Testing</text><text x="345" y="306" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="361" y="306" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">Packaging</text><path d="M400,432 L400,390 L428,373.2 L428,390 L456,373.2 L456,390 L484,373.2 L484,432 Z" fill="#ffffff" stroke="#1e2a44" stroke-width="2.2" stroke-linejoin="round"/><rect x="463" y="339.6" width="12.6" height="42" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><rect x="620" y="115" width="250" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="640" y="152" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Outputs</text><rect x="638" y="172" width="214" height="46" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="745" y="202" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="middle">Finished products</text><rect x="638" y="228" width="214" height="46" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="745" y="258" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="middle">By-products</text><rect x="638" y="284" width="214" height="46" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="745" y="314" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="middle">Profit</text><rect x="638" y="340" width="214" height="88" rx="10" fill="#f6e6dc" stroke="#b5602e" stroke-width="2.5"/><text x="745" y="368" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">Waste</text><text x="745" y="392" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">heat, gases, waste</text><text x="745" y="412" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">water, scrap</text><line x1="284" y1="280" x2="321" y2="280" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><line x1="579" y1="280" x2="616" y2="280" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><path d="M745,232 L745,232" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><path d="M638,307 Q600,307 600,470 L155,470 L155,449" fill="none" stroke="#2e6b62" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="10 7" marker-end="url(#ahT)"/><rect x="90.35000000000002" y="461.275" width="579.3" height="20.925" rx="5" fill="#f4f6f6" opacity="1"/><text x="380" y="476" font-size="15.5" font-weight="700" fill="#2e6b62" text-anchor="middle">feedback: profit reinvested in machinery, training, expansion</text><line x1="745" y1="432" x2="745" y2="520" stroke="#b5602e" stroke-width="4" marker-end="url(#ahR)"/><rect x="460" y="525" width="410" height="92" rx="14" fill="#f6e6dc" stroke="#b5602e" stroke-width="2.5"/><text x="485" y="560" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">Links to 3.7 environmental risks:</text><text x="485" y="588" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">untreated waste water, air emissions, solid waste</text><text x="55" y="560" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Waste is part of the system, not an</text><text x="55" y="584" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">afterthought.</text>
