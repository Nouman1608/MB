join="round" stroke-linecap="round" /><rect x="59.2" y="239.8" width="117.6" height="21.6" rx="5" fill="#d8e3c6" opacity="1"/><text x="118" y="255" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">cane fields</text><rect x="455" y="360" width="60" height="30" rx="4" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="485" y="410" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">port</text><rect x="135" y="520" width="30" height="24" fill="#ffffff" stroke="#1e2a44" stroke-width="2.2"/><path d="M132,520 L150,507 L168,520 Z" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><rect x="175" y="535" width="30" height="24" fill="#ffffff" stroke="#1e2a44" stroke-width="2.2"/><path d="M172,535 L190,522 L208,535 Z" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><rect x="110" y="548" width="27" height="21.6" fill="#ffffff" stroke="#1e2a44" stroke-width="2.2"/><path d="M107.3,548 L123.5,536.3 L139.7,548 Z" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><text x="150" y="590" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">inland city</text><line x1="230" y1="200" x2="470" y2="370" stroke="#1e2a44" stroke-width="2" stroke-dasharray="7 6"/><line x1="320" y1="360" x2="470" y2="380" stroke="#1e2a44" stroke-width="2" stroke-dasharray="7 6"/><line x1="260" y1="520" x2="460" y2="390" stroke="#1e2a44" stroke-width="2" stroke-dasharray="7 6"/><circle cx="230" cy="200" r="22" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="230" y="207" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">A</text><circle cx="320" cy="360" r="22" fill="#2e6b62" stroke="#1e2a44" stroke-width="3"/><text x="320" y="367" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">B</text><circle cx="260" cy="520" r="22" fill="#b5602e" stroke="#1e2a44" stroke-width="3"/><text x="260" y="527" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">C</text><rect x="294" y="240.75" width="138" height="20.25" rx="5" fill="#d8e3c6" opacity="1"/><text x="300" y="255" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">120 km to port</text><rect x="254" y="191.75" width="183" height="20.25" rx="5" fill="#d8e3c6" opacity="1"/><text x="260" y="206" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">A: 5 km from fields</text><rect x="219.5" y="390.75" width="201" height="20.25" rx="5" fill="#d8e3c6" opacity="1"/><text x="320" y="405" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">B: 90 km from fields,</text><rect x="255.5" y="409.75" width="129" height="20.25" rx="5" fill="#d8e3c6" opacity="1"/><text x="320" y="424" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">10 km to port</text><rect x="286" y="512.75" width="192" height="20.25" rx="5" fill="#d8e3c6" opacity="1"/><text x="292" y="527" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">C: 150 km from both;</text><rect x="286" y="531.75" width="138" height="20.25" rx="5" fill="#d8e3c6" opacity="1"/><text x="292" y="546" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">land expensive</text><text x="310" y="650" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Schematic, not to scale</text><rect x="610" y="110" width="260" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="628" y="143.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">1  Key factor</text><text x="628" y="167.32500000000002" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">Cane is bulky, heavy,</text><text x="628" y="187.78500000000003" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">perishable and loses most</text><text x="628" y="208.245" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">of its weight when refined.</text><rect x="610" y="275" width="260" height="180" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="628" y="308.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">2  Apply to data</text><text x="628" y="332.325" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">Site A is 5 km from the</text><text x="628" y="352.78499999999997" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">fields; only the lighter</text><text x="628" y="373.245" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">refined sugar travels 120</text><text x="628" y="393.705" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">km to the port. Land is</text><text x="628" y="414.16499999999996" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">cheapest.</text><rect x="610" y="470" width="260" height="160" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="628" y="503.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">3  Reject the rest</text><text x="628" y="527.325" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">C is far from fields and</text><text x="628" y="547.7850000000001" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">port, with expensive land.</text><text x="628" y="568.245" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">B is far from the cane.</text>
