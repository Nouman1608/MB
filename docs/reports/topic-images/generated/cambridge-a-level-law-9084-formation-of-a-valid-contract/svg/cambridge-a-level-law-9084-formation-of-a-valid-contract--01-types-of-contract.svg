<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 456" width="900" height="456" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="456" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three kinds of contract</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">A contract is an agreement the law will enforce</text>
<rect x="30" y="124" width="230" height="300" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="275" y="124" width="250" height="300" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="540" y="124" width="330" height="300" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="145" y="160" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Bilateral</text><text x="145" y="184" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">promise for a promise</text><rect x="75" y="204" width="140" height="50" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="145" y="236" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Seller</text><rect x="75" y="324" width="140" height="50" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="145" y="356" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Buyer</text><line x1="115" y1="260" x2="115" y2="318" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><line x1="175" y1="318" x2="175" y2="260" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><text x="105" y="296" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="end">promise</text><text x="185" y="296" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start">promise</text><text x="145" y="406" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Most sales</text><text x="400" y="160" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Unilateral</text><text x="400" y="184" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">promise for an act</text><rect x="330" y="204" width="140" height="50" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="400" y="236" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Promisor</text><rect x="330" y="324" width="140" height="50" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="400" y="356" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Anyone</text><line x1="370" y1="260" x2="370" y2="318" stroke="#8a6d0d" stroke-width="3.5" marker-end="url(#ahO)"/><line x1="430" y1="318" x2="430" y2="260" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)" stroke-dasharray="8 6"/><text x="360" y="296" font-size="15" font-weight="600" fill="#8a6d0d" text-anchor="end">promise</text><text x="440" y="288" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start">does</text><text x="440" y="306" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start">the act</text><text x="400" y="390" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Only the promisor is bound:</text><text x="400" y="410" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle"><tspan font-style="italic">Carlill</tspan> (1893)</text><text x="705" y="160" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Collateral</text><text x="705" y="184" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">a separate contract alongside</text><rect x="554" y="212" width="112" height="50" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="610" y="234" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Paint</text><text x="610" y="252" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">maker</text><rect x="744" y="212" width="112" height="50" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="800" y="234" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Pier</text><text x="800" y="252" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">owners</text><rect x="640" y="320" width="130" height="50" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="705" y="351" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Contractors</text><line x1="668" y1="237" x2="740" y2="237" stroke="#8a6d0d" stroke-width="3" marker-end="url(#ahO)"/><text x="705" y="282" font-size="15" font-weight="600" fill="#8a6d0d" text-anchor="middle">promise: lasts</text><text x="705" y="300" font-size="15" font-weight="600" fill="#8a6d0d" text-anchor="middle">7 years</text><line x1="810" y1="264" x2="755" y2="316" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="856" y="336" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="end">told to</text><text x="856" y="354" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="end">buy it</text><line x1="655" y1="318" x2="600" y2="266" stroke="#4a5568" stroke-width="2.5" marker-end="url(#ah)" stroke-dasharray="6 5"/><text x="554" y="336" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">buy</text><text x="554" y="354" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">paint</text><text x="705" y="404" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Shanklin Pier v Detel (1951)</text>
</svg>