<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 594" width="900" height="594" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="594" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Intention to create legal relations</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Two presumptions, each rebuttable</text>
<rect x="30" y="124" width="410" height="133" rx="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="235" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">SOCIAL AND DOMESTIC</text><text x="235" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Presumed NOT binding</text><text x="235" y="211.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle"><tspan font-style="italic">Balfour</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Balfour</tspan> (1919): a husband’s promised</text><text x="235" y="232.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">allowance</text><line x1="235" y1="263" x2="235" y2="301" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="247" y="289" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">rebutted by</text><rect x="30" y="307" width="410" height="45" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="333.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Spouses have separated: <tspan font-style="italic">Merritt</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Merritt</tspan> (1970)</text><rect x="30" y="362" width="410" height="66" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="388.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Something substantial given up in reliance: <tspan font-style="italic">Parker</tspan></text><text x="44" y="409.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">v</tspan> <tspan font-style="italic">Clark</tspan> (1960)</text><rect x="30" y="438" width="410" height="66" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="464.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A clear financial basis: <tspan font-style="italic">Simpkins</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Pays</tspan> (1955),</text><text x="44" y="485.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">shared competition entry</text><rect x="30" y="518" width="410" height="44" rx="14" fill="#f4f6f6" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="544" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Not rebutted in <tspan font-style="italic">Jones</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Padavatton</tspan> (1969)</text><rect x="460" y="124" width="410" height="112" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="665" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">COMMERCIAL</text><text x="665" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Presumed binding</text><text x="665" y="211.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle"><tspan font-style="italic">Edwards</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Skyways</tspan> (1964)</text><line x1="665" y1="242" x2="665" y2="280" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="677" y="268" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">rebutted by</text><rect x="460" y="286" width="410" height="66" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="474" y="312.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Clear words such as an “honour clause”: <tspan font-style="italic">Rose</tspan></text><text x="474" y="333.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">and</tspan> <tspan font-style="italic">Frank</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Crompton</tspan> (1925)</text><rect x="460" y="362" width="410" height="87" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="474" y="388.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A letter of comfort may be only a statement of</text><text x="474" y="409.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">present policy: <tspan font-style="italic">Kleinwort</tspan> <tspan font-style="italic">Benson</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Malaysia</tspan></text><text x="474" y="430.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Mining</tspan> (1989)</text>
</svg>