<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 699" width="900" height="699" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="699" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Offer and acceptance in practice</text>

<text x="30" y="116" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">BATTLE OF THE FORMS: Butler Machine Tool v Ex-Cell-O (1979)</text><rect x="30" y="128" width="253.33333333333334" height="94" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="156.66666666666669" y="165.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Seller’s terms</text><text x="156.66666666666669" y="193.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">printed terms</text><line x1="289.33333333333337" y1="175" x2="317.33333333333337" y2="175" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="323.33333333333337" y="128" width="253.33333333333334" height="94" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450.00000000000006" y="165.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Buyer’s order form</text><text x="450.00000000000006" y="193.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">own terms = counter offer</text><line x1="582.6666666666667" y1="175" x2="610.6666666666667" y2="175" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="616.6666666666667" y="128" width="253.33333333333334" height="94" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="743.3333333333334" y="155.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Tear-off slip returned</text><text x="743.3333333333334" y="182.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">acceptance of the buyer’s</text><text x="743.3333333333334" y="203.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">terms</text><text x="30" y="246" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Usually won by the last set of terms sent before performance.</text><text x="30" y="301" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">AUCTION SALES</text><rect x="30" y="313" width="253.33333333333334" height="115" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="156.66666666666669" y="361.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Request for bids</text><text x="156.66666666666669" y="388.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">invitation to treat</text><line x1="289.33333333333337" y1="370.5" x2="317.33333333333337" y2="370.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="323.33333333333337" y="313" width="253.33333333333334" height="115" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450.00000000000006" y="340.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Each bid</text><text x="450.00000000000006" y="367.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">an offer; can be withdrawn</text><text x="450.00000000000006" y="388.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">until the hammer falls (<tspan font-style="italic">Payne</tspan></text><text x="450.00000000000006" y="409.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle"><tspan font-style="italic">v</tspan> <tspan font-style="italic">Cave</tspan>)</text><line x1="582.6666666666667" y1="370.5" x2="610.6666666666667" y2="370.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="616.6666666666667" y="313" width="253.33333333333334" height="115" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="743.3333333333334" y="350.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Fall of the hammer</text><text x="743.3333333333334" y="378.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">acceptance (Sale of Goods</text><text x="743.3333333333334" y="399.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Act 1979 s57)</text><text x="30" y="452" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">“Without reserve”: a collateral contract to sell to the highest genuine bidder (<tspan font-style="italic">Barry</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Davies</tspan>, 2000).</text><text x="30" y="507" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">CONTRACTS BY TENDER</text><rect x="30" y="519" width="253.33333333333334" height="73" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="156.66666666666669" y="546.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Invitation to tender</text><text x="156.66666666666669" y="573.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">normally an invitation to treat</text><line x1="289.33333333333337" y1="555.5" x2="317.33333333333337" y2="555.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="323.33333333333337" y="519" width="253.33333333333334" height="73" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450.00000000000006" y="546.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Each tender</text><text x="450.00000000000006" y="573.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">an offer (<tspan font-style="italic">Spencer</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Harding</tspan>)</text><line x1="582.6666666666667" y1="555.5" x2="610.6666666666667" y2="555.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="616.6666666666667" y="519" width="253.33333333333334" height="73" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="743.3333333333334" y="546.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Acceptance</text><text x="743.3333333333334" y="573.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">of a chosen tender</text><text x="30" y="616" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">But the invitation can bind: promise to accept the highest bid (<tspan font-style="italic">Harvela</tspan>); duty to consider a tender on time</text><text x="30" y="637" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">(<tspan font-style="italic">Blackpool</tspan> <tspan font-style="italic">and</tspan> <tspan font-style="italic">Fylde</tspan> <tspan font-style="italic">Aero</tspan> <tspan font-style="italic">Club</tspan>). A standing offer is accepted with each order (<tspan font-style="italic">Great</tspan> <tspan font-style="italic">Northern</tspan> <tspan font-style="italic">Railway</tspan> <tspan font-style="italic">v</tspan></text><text x="30" y="658" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Witham</tspan>).</text>
</svg>