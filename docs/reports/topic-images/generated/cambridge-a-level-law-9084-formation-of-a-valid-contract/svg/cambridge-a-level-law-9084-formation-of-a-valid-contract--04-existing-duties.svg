<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="900" height="650" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="650" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Is performing an existing duty consideration?</text>

<clipPath id="tc100"><rect x="30" y="100" width="840" height="273" rx="14"/></clipPath><g clip-path="url(#tc100)"><rect x="30" y="100" width="221.66666666666669" height="48" fill="#b5d3cf"/><text x="44" y="127.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Duty already owed</text><rect x="251.66666666666669" y="100" width="268.3333333333333" height="48" fill="#b5d3cf"/><text x="265.6666666666667" y="127.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">General rule</text><rect x="520" y="100" width="350.00000000000006" height="48" fill="#d4b02e"/><text x="534" y="127.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Unless…</text><rect x="30" y="148" width="221.66666666666669" height="68" fill="#dce9e7"/><text x="44" y="174.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Public duty</text><rect x="251.66666666666669" y="148" width="268.3333333333333" height="68" fill="#ffffff"/><text x="265.6666666666667" y="174.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">No consideration: <tspan font-style="italic">Collins</tspan> <tspan font-style="italic">v</tspan></text><text x="265.6666666666667" y="195.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Godefroy</tspan> (1831)</text><rect x="520" y="148" width="350.00000000000006" height="68" fill="#ffffff"/><text x="534" y="174.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The claimant goes beyond it: <tspan font-style="italic">Glasbrook</tspan></text><text x="534" y="195.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Brothers</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Glamorgan</tspan> <tspan font-style="italic">CC</tspan> (1925)</text><line x1="30" y1="216" x2="870" y2="216" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="216" width="221.66666666666669" height="89" fill="#dce9e7"/><text x="44" y="242.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Contractual duty to the</text><text x="44" y="263.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">promisor</text><rect x="251.66666666666669" y="216" width="268.3333333333333" height="89" fill="#f8faf9"/><text x="265.6666666666667" y="242.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">No consideration: <tspan font-style="italic">Stilk</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Myrick</tspan></text><text x="265.6666666666667" y="263.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(1809)</text><rect x="520" y="216" width="350.00000000000006" height="89" fill="#f8faf9"/><text x="534" y="242.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Extra is done: <tspan font-style="italic">Hartley</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Ponsonby</tspan> (1857);</text><text x="534" y="263.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">or a <tspan font-weight="700">practical</tspan> <tspan font-weight="700">benefit</tspan> without duress:</text><text x="534" y="284.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Williams</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Roffey</tspan> (1990)</text><line x1="30" y1="305" x2="870" y2="305" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="305" width="221.66666666666669" height="68" fill="#dce9e7"/><text x="44" y="331.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Contractual duty to a</text><text x="44" y="352.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">third party</text><rect x="251.66666666666669" y="305" width="268.3333333333333" height="68" fill="#ffffff"/><text x="265.6666666666667" y="331.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Good consideration: <tspan font-style="italic">Scotson</tspan> <tspan font-style="italic">v</tspan></text><text x="265.6666666666667" y="352.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Pegg</tspan> (1861)</text><rect x="520" y="305" width="350.00000000000006" height="68" fill="#ffffff"/></g><line x1="251.66666666666669" y1="100" x2="251.66666666666669" y2="373" stroke="#c9d6d4" stroke-width="1.5"/><line x1="520" y1="100" x2="520" y2="373" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="100" width="840" height="273" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="395" width="413" height="143" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="423" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SUFFICIENT, NOT ADEQUATE</text><text x="46" y="454.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Some legal value is enough: £1 a year rent</text><text x="46" y="475.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(<tspan font-style="italic">Thomas</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Thomas</tspan>); chocolate wrappers</text><text x="46" y="496.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(<tspan font-style="italic">Chappell</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Nestlé</tspan>). Ceasing to complain was not</text><text x="46" y="517.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(<tspan font-style="italic">White</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Bluett</tspan>).</text><rect x="457" y="395" width="413" height="143" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="473" y="423" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PAST CONSIDERATION</text><text x="473" y="454.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Not good (<tspan font-style="italic">Re</tspan> <tspan font-style="italic">McArdle</tspan>), unless done at the</text><text x="473" y="475.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">promisor’s request with payment understood</text><text x="473" y="496.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(<tspan font-style="italic">Lampleigh</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Brathwait</tspan>; <tspan font-style="italic">Pao</tspan> <tspan font-style="italic">On</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Lau</tspan> <tspan font-style="italic">Yiu</tspan> <tspan font-style="italic">Long</tspan>).</text><rect x="30" y="560" width="840" height="58" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="593.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle"><tspan font-weight="700" fill="#1e2a44">Common</tspan> <tspan font-weight="700" fill="#1e2a44">mistake:</tspan> <tspan font-style="italic">Williams</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Roffey</tspan> did not overrule <tspan font-style="italic">Stilk</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Myrick</tspan> or <tspan font-style="italic">Foakes</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Beer</tspan>.</text>
</svg>