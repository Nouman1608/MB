<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Part payment and promissory estoppel</text>

<rect x="30" y="100" width="840" height="134" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">THE RULE</text><text x="50" y="159.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Paying less does not discharge the full debt</text><text x="50" y="188.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Pinnel’s</tspan> <tspan font-style="italic">Case</tspan> (1602); <tspan font-style="italic">Foakes</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Beer</tspan> (1884). <tspan font-style="italic">Re</tspan> <tspan font-style="italic">Selectmove</tspan> (1995) refused to extend the <tspan font-style="italic">Williams</tspan> <tspan font-style="italic">v</tspan></text><text x="50" y="209.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Roffey</tspan> practical benefit idea to part payment.</text><rect x="30" y="256" width="358.26086956521743" height="155" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="312.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EXCEPTION 1: SOMETHING NEW</text><text x="50" y="338.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Earlier, at a different place, or with</text><text x="50" y="361.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">an item</text><rect x="404.26086956521743" y="256" width="465.7391304347827" height="155" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="424.26086956521743" y="288" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EXCEPTION 2: PROMISSORY ESTOPPEL</text><text x="424.26086956521743" y="314.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Creditor promised to accept less; debtor relied</text><text x="424.26086956521743" y="337.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">on it</text><text x="424.26086956521743" y="365.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">High</tspan> <tspan font-style="italic">Trees</tspan> (1947), developing <tspan font-style="italic">Hughes</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Metropolitan</tspan></text><text x="424.26086956521743" y="386.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Railway</tspan> (1877)</text><text x="450" y="443" font-size="16" font-weight="700" fill="#4a5568" text-anchor="middle">LIMITS ON PROMISSORY ESTOPPEL</text><rect x="30" y="465" width="270.6666666666667" height="98" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="165.33333333333334" y="504.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">A shield, not a sword</text><text x="165.33333333333334" y="532.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle"><tspan font-style="italic">Combe</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Combe</tspan> (1951)</text><rect x="314.6666666666667" y="465" width="270.6666666666667" height="98" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="494.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Not if the debtor acted</text><text x="450" y="515.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">inequitably</text><text x="450" y="542.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle"><tspan font-style="italic">D</tspan> <tspan font-style="italic">&amp;</tspan> <tspan font-style="italic">C</tspan> <tspan font-style="italic">Builders</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Rees</tspan> (1966)</text><rect x="599.3333333333334" y="465" width="270.6666666666667" height="98" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="734.6666666666667" y="494.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Often only suspends rights</text><text x="734.6666666666667" y="521.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle"><tspan font-style="italic">Tool</tspan> <tspan font-style="italic">Metal</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Tungsten</tspan> <tspan font-style="italic">Electric</tspan></text><text x="734.6666666666667" y="542.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">(1955)</text>
