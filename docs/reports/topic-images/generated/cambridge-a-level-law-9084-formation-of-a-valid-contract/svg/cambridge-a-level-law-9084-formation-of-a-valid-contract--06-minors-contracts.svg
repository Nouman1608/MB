<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 687" width="900" height="687" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="687" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Minors’ contracts: three categories</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">A minor is a person under 18</text>
<rect x="30" y="124" width="270.6666666666667" height="239" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="152" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">NECESSARIES</text><text x="46" y="178.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Binding; a reasonable</text><text x="46" y="201.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">price</text><text x="46" y="229.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Sale of Goods Act 1979 s3.</text><text x="46" y="250.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Must suit the minor’s condition</text><text x="46" y="271.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">in life and actual needs.</text><text x="46" y="300.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Nash</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Inman</tspan> (1908): eleven</text><text x="46" y="321.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">waistcoats not necessaries</text><rect x="314.6666666666667" y="124" width="270.6666666666667" height="239" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="330.6666666666667" y="152" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">BENEFICIAL SERVICE</text><text x="330.6666666666667" y="178.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Binding if, as a whole, for</text><text x="330.6666666666667" y="201.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">the minor’s benefit</text><text x="330.6666666666667" y="229.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Education, training,</text><text x="330.6666666666667" y="250.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">employment.</text><text x="330.6666666666667" y="279.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Doyle</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">White</tspan> <tspan font-style="italic">City</tspan> <tspan font-style="italic">Stadium</tspan></text><text x="330.6666666666667" y="300.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(1935); oppressive terms not</text><text x="330.6666666666667" y="321.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">binding: <tspan font-style="italic">De</tspan> <tspan font-style="italic">Francesco</tspan> <tspan font-style="italic">v</tspan></text><text x="330.6666666666667" y="342.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Barnum</tspan> (1890)</text><rect x="599.3333333333334" y="124" width="270.6666666666667" height="239" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="615.3333333333334" y="152" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">VOIDABLE</text><text x="615.3333333333334" y="178.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Binding unless repudiated</text><text x="615.3333333333334" y="206.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Leases, shares, partnership:</text><text x="615.3333333333334" y="227.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">before 18 or a reasonable time</text><text x="615.3333333333334" y="248.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">after.</text><text x="615.3333333333334" y="277.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Steinberg</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Scala</tspan> (1923):</text><text x="615.3333333333334" y="298.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">money for shares not</text><text x="615.3333333333334" y="319.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">recoverable</text><rect x="30" y="385" width="840" height="78" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="417.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Proform</tspan> <tspan font-style="italic">Sports</tspan> <tspan font-style="italic">Management</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Proactive</tspan> <tspan font-style="italic">Sports</tspan> <tspan font-style="italic">Management</tspan> (2006): a football agency contract was</text><text x="50" y="438.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">neither service nor necessaries, so not binding on the teenage player.</text><rect x="30" y="485" width="413" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="513" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">MINORS’ CONTRACTS ACT 1987</text><text x="46" y="544.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">s2:</tspan> a guarantee of a minor’s debt is enforceable</text><text x="46" y="565.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">against the adult guarantor</text><text x="46" y="592.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">s3:</tspan> court may order return of property acquired,</text><text x="46" y="613.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">or property representing it, where just and</text><text x="46" y="634.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">equitable</text><rect x="457" y="485" width="413" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="473" y="513" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EQUITY</text><text x="473" y="544.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Restitution where goods were obtained by fraud,</text><text x="473" y="565.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">but money cannot be recovered as such (<tspan font-style="italic">Leslie</tspan> <tspan font-style="italic">v</tspan></text><text x="473" y="586.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Sheill</tspan>, 1914)</text><text x="473" y="613.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Limit:</tspan> no remedy if the goods or money are spent</text><text x="473" y="634.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and nothing represents them</text>
</svg>