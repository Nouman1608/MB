<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Rising together is not proof of cause</text>

<rect x="30" y="120" width="400" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="230" y="158" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Youth unemployment</text><line x1="90" y1="380" x2="390" y2="380" stroke="#1e2a44" stroke-width="2.5"/><line x1="140" y1="267.5" x2="320" y2="211.25" stroke="#b5602e" stroke-width="6"/><circle cx="140" cy="267.5" r="10" fill="#ffffff" stroke="#b5602e" stroke-width="4"/><circle cx="320" cy="211.25" r="10" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><text x="140" y="249.5" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">9.0%</text><text x="320" y="193.25" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">13.5%</text><text x="140" y="408" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">earlier</text><text x="320" y="408" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">later</text><rect x="470" y="120" width="400" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="670" y="158" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Informal share of jobs</text><line x1="530" y1="380" x2="830" y2="380" stroke="#1e2a44" stroke-width="2.5"/><line x1="580" y1="246.66666666666669" x2="760" y2="215.55555555555557" stroke="#2e6b62" stroke-width="6"/><circle cx="580" cy="246.66666666666669" r="10" fill="#ffffff" stroke="#2e6b62" stroke-width="4"/><circle cx="760" cy="215.55555555555557" r="10" fill="#2e6b62" stroke="#1e2a44" stroke-width="2"/><text x="580" y="228.66666666666669" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">30%</text><text x="760" y="197.55555555555557" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">37%</text><text x="580" y="408" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">earlier</text><text x="760" y="408" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">later</text><rect x="30" y="470" width="840" height="135" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="503" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">FICTIONAL TOWN OF BRENNOCK</text><text x="50" y="529.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Both rose over the same period: a correlation</text><text x="50" y="558.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">It suggests some young people without contracts take unregistered work, but it does not</text><text x="50" y="580.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">prove one caused the other.</text>
