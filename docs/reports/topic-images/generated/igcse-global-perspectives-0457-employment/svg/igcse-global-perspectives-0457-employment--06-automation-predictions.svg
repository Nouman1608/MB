<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 662" width="900" height="662" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="662" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why two automation forecasts disagree</text>

<line x1="60" y1="420" x2="840" y2="420" stroke="#1e2a44" stroke-width="3"/><rect x="150" y="175.60000000000002" width="220" height="244.39999999999998" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="260" y="161.60000000000002" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">about 47%</text><text x="260" y="450" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Frey and Osborne, Oxford (2013)</text><text x="260" y="474" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">US jobs at high risk of computerisation</text><rect x="134.60000000000002" y="490" width="250.79999999999998" height="40" rx="20" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="260" y="516" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">Judged whole occupations</text><rect x="530" y="347.2" width="220" height="72.80000000000001" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="640" y="333.2" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">about 14%</text><text x="640" y="450" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Nedelkoska and Quintini, OECD (2018)</text><text x="640" y="474" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">jobs across OECD countries highly automatable</text><rect x="473.20000000000005" y="490" width="333.59999999999997" height="40" rx="20" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="640" y="516" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">Judged separate tasks within jobs</text><rect x="30" y="552" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="585.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Both are predictions, not facts. The gap comes mainly from method, so check how each figure</text><text x="50" y="607.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">was produced before deciding which to trust.</text>
</svg>