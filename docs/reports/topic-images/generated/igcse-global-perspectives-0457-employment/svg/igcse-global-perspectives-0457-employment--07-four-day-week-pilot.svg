0" r="11" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><circle cx="90" cy="230" r="11" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><circle cx="120" cy="230" r="11" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><circle cx="150" cy="230" r="11" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><circle cx="180" cy="230" r="11" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><circle cx="210" cy="230" r="11" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><circle cx="240" cy="230" r="11" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><circle cx="270" cy="230" r="11" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><circle cx="300" cy="230" r="11" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><circle cx="330" cy="230" r="11" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><circle cx="360" cy="230" r="11" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><circle cx="390" cy="230" r="11" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><circle cx="420" cy="230" r="11" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><rect x="560" y="114" width="310" height="154" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="580" y="147" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">UK PILOT, JUNE TO DECEMBER 2022</text><text x="580" y="172.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">56 of 61 companies said</text><text x="580" y="196.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">they would continue</text><text x="580" y="224" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">About 2,900 staff; four days, no</text><text x="580" y="244" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">loss of pay.</text><rect x="30" y="288" width="408" height="232" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="321" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STRENGTHS</text><text x="50" y="347.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Worth taking seriously</text><text x="50" y="375.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="375.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A real trial</text><text x="50" y="401.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="401.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A clear time period</text><text x="50" y="427.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="427.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Academic researchers involved (Cambridge,</text><text x="65.2" y="448.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Boston College)</text><rect x="462" y="288" width="408" height="232" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="482" y="321" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">LIMITATIONS</text><text x="482" y="347.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Limits on what it shows</text><text x="482" y="375.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="497.2" y="375.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Companies volunteered</text><text x="482" y="401.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="497.2" y="401.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Some organisers campaign for a four-day</text><text x="497.2" y="422.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">week</text><text x="482" y="448.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="497.2" y="448.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Six months may be too short</text><text x="482" y="474.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="497.2" y="474.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Mostly small firms: may not generalise to</text><text x="497.2" y="495.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">factories or hospitals</text>
