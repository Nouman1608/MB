ght="28" rx="5" fill="#ffffff" stroke="#1e2a44" stroke-width="1.8"/><rect x="288" y="426" width="28" height="28" rx="5" fill="#ffffff" stroke="#1e2a44" stroke-width="1.8"/><rect x="322" y="426" width="28" height="28" rx="5" fill="#ffffff" stroke="#1e2a44" stroke-width="1.8"/><rect x="356" y="426" width="28" height="28" rx="5" fill="#ffffff" stroke="#1e2a44" stroke-width="1.8"/><text x="215" y="485" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Each square = 1% of the world’s</text><text x="215" y="504" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">employed population</text><rect x="430" y="120" width="440" height="166" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="153" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">ILO, 2018</text><text x="450" y="180.8" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">More than 60% work in the</text><text x="450" y="208.8" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">informal economy</text><text x="450" y="239.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">About two billion people, with no legal</text><text x="450" y="261.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">contract, social protection or regulation.</text><rect x="430" y="300" width="440" height="200" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="450" y="333" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">EVALUATION</text><text x="450" y="358.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">A careful estimate, not an exact count</text><text x="450" y="386.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="465.2" y="386.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Credible: a UN agency with data from many</text><text x="465.2" y="407.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">countries.</text><text x="450" y="433.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="465.2" y="433.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">But informal work is unrecorded by definition,</text><text x="465.2" y="454.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">and surveys and definitions differ between</text><text x="465.2" y="475.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">countries.</text><rect x="30" y="530" width="840" height="113" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="563" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SDG 8 (2015)</text><text x="50" y="589.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">“Full and productive employment and decent work for all”</text><text x="50" y="618.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Decent work (ILO): productive, fairly paid, safe and secure.</text>
