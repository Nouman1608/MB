<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 609" width="900" height="609" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="609" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Weighing actions on employment</text>

<rect x="30" y="104" width="300" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="42" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Action</text><rect x="330" y="104" width="270" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="342" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Possible benefit</text><rect x="600" y="104" width="270" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="612" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Possible drawback</text><rect x="30" y="150" width="300" height="64" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="175.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Apprenticeships and retraining</text><rect x="330" y="150" width="270" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="342" y="175.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Tackles the skills cause</text><rect x="600" y="150" width="270" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="612" y="175.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Slow; needs employers to take</text><text x="612" y="196.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">part</text><rect x="30" y="214" width="300" height="64" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="239.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Wage subsidies for hiring</text><text x="42" y="260.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">young people</text><rect x="330" y="214" width="270" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="342" y="239.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Quick increase in hiring</text><rect x="600" y="214" width="270" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="612" y="239.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Costly; firms may replace</text><text x="612" y="260.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">older staff</text><rect x="30" y="278" width="300" height="64" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="303.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Minimum wage rise</text><rect x="330" y="278" width="270" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="342" y="303.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Raises pay for the lowest</text><text x="342" y="324.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">paid</text><rect x="600" y="278" width="270" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="612" y="303.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Debated effect on hiring</text><rect x="30" y="342" width="300" height="64" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="367.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Rights for gig workers</text><rect x="330" y="342" width="270" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="342" y="367.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Security and sick pay</text><rect x="600" y="342" width="270" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="612" y="367.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Higher costs; less</text><text x="612" y="388.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">flexibility</text><rect x="30" y="406" width="300" height="43" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="431.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Shorter working week</text><rect x="330" y="406" width="270" height="43" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="342" y="431.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Wellbeing; may share out work</text><rect x="600" y="406" width="270" height="43" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="612" y="431.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Not suitable for every sector</text><rect x="30" y="467" width="840" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="503" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">A worked judgement</text><text x="50" y="532.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Retraining tackles a cause, not a symptom, and is more sustainable if local employers help</text><text x="50" y="554.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">pay. It is slow, so combine it with short-term support for people unemployed now.</text>
</svg>