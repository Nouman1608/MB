<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 712" width="900" height="712" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="712" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Uber v Aslam: flexibility versus security</text>

<rect x="30" y="104" width="397" height="156" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="137" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FEBRUARY 2021</text><text x="50" y="162.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">UK Supreme Court: Uber drivers are</text><text x="50" y="186.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">“workers”, not self-employed</text><text x="50" y="214.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Rights such as the minimum wage and holiday</text><text x="50" y="235.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">pay.</text><line x1="433" y1="182" x2="467" y2="182" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="473" y="104" width="397" height="156" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="493" y="137" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">MARCH 2021</text><text x="493" y="162.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Uber: UK drivers get minimum wage,</text><text x="493" y="186.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">holiday pay and pensions</text><line x1="70" y1="414" x2="830" y2="414" stroke="#1e2a44" stroke-width="4" marker-start="url(#ah)" marker-end="url(#ah)"/><text x="60" y="456" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Flexibility</text><text x="840" y="456" font-size="18" font-weight="700" fill="#b5602e" text-anchor="end">Security</text><circle cx="135" cy="414" r="11" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><line x1="135" y1="403" x2="135" y2="390" stroke="#1e2a44" stroke-width="2.5"/><g transform="translate(0,302)"><rect x="30" y="0" width="240" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="150" y="25.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Uber’s argument</text><text x="150" y="52" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Drivers value choosing when</text><text x="150" y="72" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">to work.</text></g><circle cx="450" cy="414" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><line x1="450" y1="425" x2="450" y2="484" stroke="#1e2a44" stroke-width="2.5"/><g transform="translate(0,484)"><rect x="330" y="0" width="240" height="68" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="25.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">A driver</text><text x="450" y="52" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Can want both at once.</text></g><circle cx="765" cy="414" r="11" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><line x1="765" y1="403" x2="765" y2="390" stroke="#1e2a44" stroke-width="2.5"/><g transform="translate(0,280)"><rect x="630" y="0" width="240" height="110" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="750" y="25.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Drivers who brought</text><text x="750" y="47.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">the case</text><text x="750" y="74" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Wanted security and fair</text><text x="750" y="94" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">pay.</text></g><rect x="30" y="570" width="840" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="606" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">A remaining dispute</text><text x="50" y="635.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Critics said the minimum wage would apply only once a trip was accepted, not while drivers</text><text x="50" y="657.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">waited logged in.</text>
</svg>