<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 504" width="900" height="504" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="504" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Who cares about what in employment, and why</text>

<line x1="310" y1="154" x2="369.25" y2="241.75" stroke="#1e2a44" stroke-width="2.5"/><line x1="310" y1="278.5" x2="369.25" y2="285.325" stroke="#1e2a44" stroke-width="2.5"/><line x1="310" y1="413.5" x2="369.25" y2="332.575" stroke="#1e2a44" stroke-width="2.5"/><line x1="590" y1="175" x2="530.75" y2="249.1" stroke="#1e2a44" stroke-width="2.5"/><line x1="590" y1="289" x2="530.75" y2="289" stroke="#1e2a44" stroke-width="2.5"/><line x1="590" y1="403" x2="530.75" y2="328.9" stroke="#1e2a44" stroke-width="2.5"/><circle cx="450" cy="289" r="95" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="283.5" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">An employment</text><text x="450" y="308.5" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">issue</text><g transform="translate(0,0)"><rect x="30" y="104" width="280" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="134.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Workers</text><text x="46" y="162.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Pay, security, safety, hours:</text><text x="46" y="183.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">their income depends on it.</text><rect x="30" y="218" width="280" height="121" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="248.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Employers</text><text x="46" y="276.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Costs, productivity,</text><text x="46" y="297.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">flexibility: profit and</text><text x="46" y="318.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">survival.</text><rect x="30" y="353" width="280" height="121" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="383.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Trade unions</text><text x="46" y="411.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Members’ pay and protection:</text><text x="46" y="432.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">their role is to represent</text><text x="46" y="453.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">members.</text></g><g transform="translate(0,21)"><rect x="590" y="104" width="280" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="606" y="134.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Governments</text><text x="606" y="162.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Jobs, tax, growth, votes: they</text><text x="606" y="183.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">answer to voters.</text><rect x="590" y="218" width="280" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="606" y="248.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Consumers</text><text x="606" y="276.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Low prices, fast service: they</text><text x="606" y="297.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">gain from cheap goods.</text><rect x="590" y="332" width="280" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="606" y="362.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">International bodies</text><text x="606" y="390.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Standards across countries:</text><text x="606" y="411.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">they set or monitor rules.</text></g>
</svg>