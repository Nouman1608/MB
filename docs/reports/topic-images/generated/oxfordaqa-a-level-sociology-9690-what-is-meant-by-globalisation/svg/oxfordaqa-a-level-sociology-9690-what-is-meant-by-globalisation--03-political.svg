<rect width="900" height="599" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Political globalisation: rights and norms</text>

<line x1="150" y1="120" x2="150" y2="434" stroke="#1e2a44" stroke-width="4"/><rect x="172" y="110" width="698" height="56" rx="12" fill="#b5d3cf" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="150" cy="138" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="128" y="144" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="end">1948</text><text x="190" y="144.64" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Universal Declaration of Human Rights</text><rect x="172" y="176" width="698" height="56" rx="12" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="150" cy="204" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="128" y="210" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="end">1979</text><text x="190" y="210.64" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">CEDAW: UN convention against discrimination against women</text><rect x="172" y="242" width="698" height="70" rx="12" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="150" cy="277" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="128" y="283" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="end">1989</text><text x="190" y="272.64" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Fukuyama, "The End of History?": liberal democracy has no serious</text><text x="190" y="294.64" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">ideological rival</text><rect x="172" y="322" width="698" height="56" rx="12" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="150" cy="350" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="128" y="356" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="end">1995</text><text x="190" y="356.64" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Beijing Platform for Action on gender equality</text><rect x="172" y="388" width="698" height="56" rx="12" fill="#b5d3cf" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="150" cy="416" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="128" y="422" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="end">1998 /</text><text x="128" y="446" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="end">2002</text><text x="190" y="422.64" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Rome Statute; International Criminal Court operates from 2002</text><rect x="30" y="462" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="498" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Norms spread more easily than they are enforced</text><text x="56" y="527" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">States sign treaties and then interpret them selectively; authoritarian government has</text><text x="56" y="549" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">persisted and revived.</text>
</svg>