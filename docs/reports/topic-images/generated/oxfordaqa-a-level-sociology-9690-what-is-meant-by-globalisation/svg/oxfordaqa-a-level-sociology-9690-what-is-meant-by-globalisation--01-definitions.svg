<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 495" width="900" height="495" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="495" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Defining globalisation precisely</text>

<rect x="30" y="110" width="412" height="211" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,182 L31.25,124.25 Q31.25,111.25 44.25,111.25 L427.75,111.25 Q440.75,111.25 440.75,124.25 L440.75,182 Z" fill="#b5d3cf"/><line x1="31.25" y1="182" x2="440.75" y2="182" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="151.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Giddens (1990)</text><text x="44" y="213.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">"The <tspan font-weight="700">intensification</tspan> of worldwide social</text><text x="44" y="234.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">relations which link distant localities in</text><text x="44" y="255.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">such a way that local happenings are shaped</text><text x="44" y="276.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">by events occurring many miles away and <tspan font-weight="700">vice</tspan></text><text x="44" y="297.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">versa</tspan>."</text><rect x="458" y="110" width="412" height="211" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,182 L459.25,124.25 Q459.25,111.25 472.25,111.25 L855.75,111.25 Q868.75,111.25 868.75,124.25 L868.75,182 Z" fill="#f2e7b8"/><line x1="459.25" y1="182" x2="868.75" y2="182" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="139.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Harvey (1989): time-space</text><text x="664" y="164.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">compression</text><text x="472" y="213.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Faster transport, communication and capital</text><text x="472" y="234.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">flows make distance and time matter less. A</text><text x="472" y="255.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">factory order on one continent can be met by</text><text x="472" y="276.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">a supplier on another within days.</text><text x="30" y="345" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Organise any answer by separating:</text><rect x="30" y="361" width="390" height="108" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="225" y="404.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Flows</text><text x="225" y="434.3" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">people, goods, money, images, ideas</text><rect x="480" y="361" width="390" height="108" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="675" y="393.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Structures</text><text x="675" y="423.3" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">institutions that manage them: states,</text><text x="675" y="445.3" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">corporations, international bodies</text>
</svg>