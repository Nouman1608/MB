<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 575" width="900" height="575" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="575" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How far has globalisation gone?</text>

<rect x="30" y="104" width="269.3333333333333" height="262" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,154 L31.25,118.25 Q31.25,105.25 44.25,105.25 L285.0833333333333,105.25 Q298.0833333333333,105.25 298.0833333333333,118.25 L298.0833333333333,154 Z" fill="#b5d3cf"/><line x1="31.25" y1="154" x2="298.0833333333333" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="164.66666666666666" y="134.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Hyperglobalist</text><text x="46" y="187.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">close to neo-liberal</text><text x="46" y="216.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A single global market</text><text x="46" y="237.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">exists; the nation state is</text><text x="46" y="258.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">losing power.</text><rect x="315.3333333333333" y="104" width="269.3333333333333" height="262" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M316.5833333333333,154 L316.5833333333333,118.25 Q316.5833333333333,105.25 329.5833333333333,105.25 L570.4166666666666,105.25 Q583.4166666666666,105.25 583.4166666666666,118.25 L583.4166666666666,154 Z" fill="#f2e7b8"/><line x1="316.5833333333333" y1="154" x2="583.4166666666666" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="134.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Sceptical</text><text x="331.3333333333333" y="187.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Hirst and Thompson (1996)</text><text x="331.3333333333333" y="216.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Trade and investment</text><text x="331.3333333333333" y="237.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">concentrated in Europe,</text><text x="331.3333333333333" y="258.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">North America and Japan;</text><text x="331.3333333333333" y="279.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">pre-1914 economy as open in</text><text x="331.3333333333333" y="300.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">some respects.</text><text x="331.3333333333333" y="321.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Internationalisation, not</text><text x="331.3333333333333" y="342.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">globalisation.</text><rect x="600.6666666666666" y="104" width="269.3333333333333" height="262" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.9166666666666,154 L601.9166666666666,118.25 Q601.9166666666666,105.25 614.9166666666666,105.25 L855.75,105.25 Q868.75,105.25 868.75,118.25 L868.75,154 Z" fill="#dce9e7"/><line x1="601.9166666666666" y1="154" x2="868.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="735.3333333333333" y="134.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Transformationalist</text><text x="616.6666666666666" y="187.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Real but uneven; reshapes</text><text x="616.6666666666666" y="208.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">states rather than</text><text x="616.6666666666666" y="229.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">abolishing them.</text><rect x="30" y="382" width="840" height="179" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="418" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Judge each type separately</text><circle cx="61" cy="441.39" r="4.5" fill="#8a6d0d"/><text x="74" y="447" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Capital:</tspan> highly globalised</text><circle cx="61" cy="471.39" r="4.5" fill="#8a6d0d"/><text x="74" y="477" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Labour:</tspan> restricted by borders, passports and visas</text><circle cx="61" cy="501.39" r="4.5" fill="#8a6d0d"/><text x="74" y="507" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Culture:</tspan> wide but often hybrid</text><circle cx="61" cy="531.39" r="4.5" fill="#8a6d0d"/><text x="74" y="537" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Political norms:</tspan> widely signed, unevenly practised</text>
</svg>