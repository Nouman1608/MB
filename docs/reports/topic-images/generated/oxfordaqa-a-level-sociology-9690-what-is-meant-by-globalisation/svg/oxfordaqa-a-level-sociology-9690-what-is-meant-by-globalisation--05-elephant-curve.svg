<rect width="900" height="671" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Milanovic’s “elephant curve”</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">income gains 1988–2008, schematic shape only (no data plotted)</text>
<rect x="30" y="104" width="840" height="390" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><line x1="110" y1="440" x2="840" y2="440" stroke="#1e2a44" stroke-width="2.5"/><line x1="110" y1="440" x2="110" y2="140" stroke="#1e2a44" stroke-width="2.5"/><path d="M124.2,349 C154.96666666666667,349 185.73333333333335,297 216.5,297 C263.8333333333333,297 311.16666666666663,219 358.5,219 C394,219 429.5,206 465,206 C493.40000000000003,206 521.8,258 550.2,258 C580.9666666666667,258 611.7333333333333,375 642.5,375 C659.0666666666666,375 675.6333333333332,419.2 692.1999999999999,419.2 C711.1333333333333,419.2 730.0666666666667,362 749,362 C763.1999999999999,362 777.4,245 791.6,245 C798.7,245 805.8,193 812.9,193" fill="none" stroke="#2e6b62" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="429.5" cy="206" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="429.5" y="160" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Global middle, mostly in</text><text x="429.5" y="180" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Asia: largest gains</text><circle cx="692.1999999999999" cy="419.2" r="9" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><text x="500.50000000000006" y="362" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">Lower-middle classes of</text><text x="500.50000000000006" y="382" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">rich countries:</text><text x="500.50000000000006" y="402" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">smallest gains</text><line x1="604.5" y1="382.8" x2="680.1999999999999" y2="419.2" stroke="#b5602e" stroke-width="2"/><circle cx="812.9" cy="193" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="796.9" y="195" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="end">Richest 1%: large</text><text x="796.9" y="215" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="end">gains</text><text x="475" y="470" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">position in the global income distribution: poorest → richest</text><text x="86" y="290" font-size="15" fill="#4a5568" text-anchor="middle" transform="rotate(-90 86 290)">income gain</text><rect x="30" y="512" width="840" height="133" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="548" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Why it matters</text><text x="56" y="577" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Explains why globalisation is popular in some places and resented in others, and why</text><text x="56" y="599" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">both neo-liberal and negative globalist views find evidence. Losers also include the</text><text x="56" y="621" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">very poorest and workers facing sudden competition.</text>
</svg>