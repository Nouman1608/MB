<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 638" width="900" height="638" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="638" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How the local survives</text>

<rect x="30" y="104" width="412" height="199" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,154 L31.25,118.25 Q31.25,105.25 44.25,105.25 L427.75,105.25 Q440.75,105.25 440.75,118.25 L440.75,154 Z" fill="#b5d3cf"/><line x1="31.25" y1="154" x2="440.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="135" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Glocalisation</text><text x="46" y="187.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Robertson</text><text x="46" y="216.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Global brands adapt to local tastes, e.g. a</text><text x="46" y="237.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">halal menu in a Muslim-majority country.</text><rect x="458" y="104" width="412" height="199" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,154 L459.25,118.25 Q459.25,105.25 472.25,105.25 L855.75,105.25 Q868.75,105.25 868.75,118.25 L868.75,154 Z" fill="#f2e7b8"/><line x1="459.25" y1="154" x2="868.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="135" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Grobalisation</text><text x="474" y="187.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Ritzer (2004)</text><text x="474" y="216.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Corporations and states impose standardised</text><text x="474" y="237.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">"nothing" (identical chain stores) on local</text><text x="474" y="258.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">"something". Operates alongside</text><text x="474" y="279.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">glocalisation.</text><rect x="30" y="319" width="412" height="178" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,369 L31.25,333.25 Q31.25,320.25 44.25,320.25 L427.75,320.25 Q440.75,320.25 440.75,333.25 L440.75,369 Z" fill="#dce9e7"/><line x1="31.25" y1="369" x2="440.75" y2="369" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="350" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Hybridisation</text><text x="46" y="402.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Nederveen Pieterse (2004)</text><text x="46" y="431.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Mixing is the normal result of contact; there</text><text x="46" y="452.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">is no "pure" local culture to lose.</text><rect x="458" y="319" width="412" height="178" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,369 L459.25,333.25 Q459.25,320.25 472.25,320.25 L855.75,320.25 Q868.75,320.25 868.75,333.25 L868.75,369 Z" fill="#dce9e7"/><line x1="459.25" y1="369" x2="868.75" y2="369" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="350" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Resistance and revival</text><text x="474" y="402.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Barber (1995), Jihad vs. McWorld</text><text x="474" y="431.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Local, religious or ethnic identities</text><text x="474" y="452.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">reasserted; languages, foods and festivals</text><text x="474" y="473.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">revived as markers of identity.</text><rect x="30" y="513" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="549" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">4-mark tip</text><text x="56" y="578" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Two separate mechanisms (adaptation and reaction), each with an example. Two examples of</text><text x="56" y="600" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">glocalisation count as one way.</text>
</svg>