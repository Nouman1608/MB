<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 699" width="900" height="699" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="699" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Appadurai (1996): five “scapes”</text>

<rect x="198" y="104" width="332" height="44" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="364" y="131.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">What flows</text><rect x="538" y="104" width="332" height="44" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="704" y="131.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Example of a disjuncture</text><rect x="30" y="156" width="160" height="72" rx="10" fill="#b5d3cf" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="197.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Ethnoscapes</text><rect x="198" y="156" width="332" height="72" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="212" y="186.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">People: migrants, tourists,</text><text x="212" y="207.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">refugees, students</text><rect x="538" y="156" width="332" height="72" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="552" y="186.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A diaspora keeps a homeland’s music</text><text x="552" y="207.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">alive abroad</text><rect x="30" y="236" width="160" height="72" rx="10" fill="#b5d3cf" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="277.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Mediascapes</text><rect x="198" y="236" width="332" height="72" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="212" y="266.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Images and stories carried by media</text><rect x="538" y="236" width="332" height="72" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="552" y="266.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Audiences imagine life in another</text><text x="552" y="287.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">country through film</text><rect x="30" y="316" width="160" height="72" rx="10" fill="#b5d3cf" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="357.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Technoscapes</text><rect x="198" y="316" width="332" height="72" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="212" y="346.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Technology and technical skills</text><rect x="538" y="316" width="332" height="72" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="552" y="346.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Mobile banking faster in parts of</text><text x="552" y="367.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Africa than parts of Europe</text><rect x="30" y="396" width="160" height="72" rx="10" fill="#b5d3cf" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="437.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Financescapes</text><rect x="198" y="396" width="332" height="72" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="212" y="426.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Capital and currency</text><rect x="538" y="396" width="332" height="72" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="552" y="426.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Money moves across borders far</text><text x="552" y="447.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">faster than workers</text><rect x="30" y="476" width="160" height="72" rx="10" fill="#b5d3cf" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="517.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Ideoscapes</text><rect x="198" y="476" width="332" height="72" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="212" y="506.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Political ideas such as democracy or</text><text x="212" y="527.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">rights</text><rect x="538" y="476" width="332" height="72" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="552" y="506.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">"Freedom" meaning different things</text><text x="552" y="527.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">in different places</text><rect x="30" y="564" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="600" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The point</text><text x="56" y="629" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The flows move at different speeds and in different directions, so the outcome is not</text><text x="56" y="651" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">simple Westernisation (contrast Schiller’s cultural imperialism, 1969).</text>
</svg>