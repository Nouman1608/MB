<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 695" width="900" height="695" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="695" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Answer plan: the Treaty of Hudaybiyya</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Describe the events of the Treaty of Hudaybiyya [10]</text>
<line x1="60" y1="144" x2="60" y2="563" stroke="#c9d6d4" stroke-width="4"/><rect x="104" y="124" width="766" height="71" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="116" y="150.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">628: set out for umra</text><text x="116" y="178.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">About 1,400 Companions, unarmed except for travellers' swords</text><circle cx="60" cy="159.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="168.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="104" y="203" width="766" height="43" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="116" y="229.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Blocked by the Quraysh; camped at Hudaybiyya</text><circle cx="60" cy="224.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="233.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="104" y="254" width="766" height="71" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="116" y="280.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Uthman sent to negotiate</text><text x="116" y="308.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Rumour of his death led to the Pledge of Ridwan under the tree (Sura 48.18)</text><circle cx="60" cy="289.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="298.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="104" y="333" width="766" height="71" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="116" y="359.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Suhayl ibn Amr negotiates</text><text x="116" y="387.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">"Messenger of God" replaced by the Prophet's own name</text><circle cx="60" cy="368.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="377.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="104" y="412" width="766" height="71" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="116" y="438.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The terms</text><text x="116" y="466.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Return next year; ten-year truce; Makkans joining without permission returned; tribes free to ally</text><circle cx="60" cy="447.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="456.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><rect x="104" y="491" width="766" height="92" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="116" y="517.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The reaction</text><text x="116" y="545.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Companions dismayed; on Umm Salama's advice he sacrificed and shaved first, and they</text><text x="116" y="566.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">followed. Sura 48: a clear victory</text><circle cx="60" cy="537" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="545.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">6</text><rect x="30" y="605" width="840" height="58" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="638.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Events in order, names and the Qur'an used, and the <tspan font-weight="700" fill="#1e2a44">reaction</tspan> <tspan font-weight="700" fill="#1e2a44">explained</tspan>, not just the terms listed.</text>
</svg>