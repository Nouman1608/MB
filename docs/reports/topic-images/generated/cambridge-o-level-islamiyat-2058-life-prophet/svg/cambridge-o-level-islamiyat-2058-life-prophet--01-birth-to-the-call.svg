<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 593" width="900" height="593" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="593" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">From birth to the call, 570–610</text>

<text x="30" y="116" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">PARENTS LOST, THEN CARERS</text><rect x="30" y="128" width="184.5" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122.25" y="154.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Abdullah</text><text x="122.25" y="182" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">father: died before his</text><text x="122.25" y="202" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">birth</text><line x1="220.5" y1="173" x2="242.5" y2="173" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="248.5" y="128" width="184.5" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="340.75" y="154.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Amina</text><text x="340.75" y="182" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">mother: died when he</text><text x="340.75" y="202" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">was about six</text><line x1="439" y1="173" x2="461" y2="173" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="467" y="128" width="184.5" height="90" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="559.25" y="164.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Abd al-Muttalib</text><text x="559.25" y="192" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">grandfather</text><line x1="657.5" y1="173" x2="679.5" y2="173" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="685.5" y="128" width="184.5" height="90" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="777.75" y="164.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Abu Talib</text><text x="777.75" y="192" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">uncle</text><rect x="30" y="240" width="270.6666666666667" height="142" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="268" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CHILDHOOD</text><text x="46" y="294.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Halima al-Sa'diyya</text><text x="46" y="322" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Wet-nurse among the Banu Sa'd;</text><text x="46" y="342" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">her family reported blessings in</text><text x="46" y="362" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">their flocks</text><rect x="314.6666666666667" y="240" width="270.6666666666667" height="142" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="330.6666666666667" y="268" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">YOUTH</text><text x="330.6666666666667" y="294.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Caravan to Syria</text><text x="330.6666666666667" y="322" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">With Abu Talib; the monk Bahira</text><text x="330.6666666666667" y="342" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">is reported to have recognised</text><text x="330.6666666666667" y="362" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">signs of prophethood</text><rect x="599.3333333333334" y="240" width="270.6666666666667" height="142" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="615.3333333333334" y="268" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">YOUTH</text><text x="615.3333333333334" y="294.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Hilf al-Fudul</text><text x="615.3333333333334" y="322" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">A pact to protect the oppressed,</text><text x="615.3333333333334" y="342" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">which he said he would join again</text><rect x="30" y="396" width="270.6666666666667" height="165" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="46" y="424" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">AL-AMIN, "THE TRUSTWORTHY"</text><text x="46" y="450.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Marriage to Khadija</text><text x="46" y="478" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">She employed him, was</text><text x="46" y="498" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">impressed by his honesty and</text><text x="46" y="518" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">proposed; he was twenty-five</text><rect x="314.6666666666667" y="396" width="270.6666666666667" height="165" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="330.6666666666667" y="424" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">REBUILDING THE KA'BA</text><text x="330.6666666666667" y="450.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The dispute over the Black</text><text x="330.6666666666667" y="473.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Stone</text><text x="330.6666666666667" y="501" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">A cloak lifted by a leader of each</text><text x="330.6666666666667" y="521" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">clan; he set it in place himself,</text><text x="330.6666666666667" y="541" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">avoiding bloodshed</text><rect x="599.3333333333334" y="396" width="270.6666666666667" height="165" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="615.3333333333334" y="424" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">610</text><text x="615.3333333333334" y="450.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Reflection in the Cave of</text><text x="615.3333333333334" y="473.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Hira</text><text x="615.3333333333334" y="501" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Troubled by idol worship; the</text><text x="615.3333333333334" y="521" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">first revelation came here</text>
</svg>