<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 545" width="900" height="545" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="545" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Building a community in Madinah</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">After the Hijra of 622</text>
<line x1="330" y1="206" x2="407" y2="238.9" stroke="#1e2a44" stroke-width="2.5"/><line x1="330" y1="310.5" x2="407" y2="270.25" stroke="#1e2a44" stroke-width="2.5"/><line x1="570" y1="195.5" x2="493" y2="235.75" stroke="#1e2a44" stroke-width="2.5"/><line x1="570" y1="331.5" x2="493" y2="276.55" stroke="#1e2a44" stroke-width="2.5"/><circle cx="450" cy="253" r="86" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="247.54" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Hijra</text><text x="450" y="273.16" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">622</text><rect x="30" y="155.5" width="300" height="101" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="186.32" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Mosques</text><text x="46" y="215.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">At Quba, then the Prophet's</text><text x="46" y="236.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Mosque in Madinah</text><rect x="30" y="270.5" width="300" height="80" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="301.32" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Brotherhood</text><text x="46" y="330.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Emigrants paired with the Helpers</text><rect x="570" y="124" width="300" height="143" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="586" y="154.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Constitution of Madinah</text><text x="586" y="183.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Muslims, Jews and other groups</text><text x="586" y="204.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">as one community with shared</text><text x="586" y="225.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">defence; the Prophet (pbuh) as</text><text x="586" y="246.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">arbiter</text><rect x="570" y="281" width="300" height="101" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="586" y="311.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Change of qibla</text><text x="586" y="340.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">From Jerusalem to the Ka'ba (Sura</text><text x="586" y="361.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">2.144)</text><rect x="30" y="404" width="840" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="438.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The journey</text><text x="50" y="467.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The Quraysh plotted to kill him. Ali slept in his bed; he left with Abu Bakr and hid in the cave of Thawr for</text><text x="50" y="488.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">three days (Sura 9.40).</text>
</svg>