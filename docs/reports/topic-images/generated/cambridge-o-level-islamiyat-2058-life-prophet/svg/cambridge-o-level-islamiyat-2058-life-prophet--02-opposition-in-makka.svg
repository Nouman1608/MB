<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 755" width="900" height="755" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="755" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why and how the Quraysh opposed him</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Makka, 613–622</text>
<text x="30" y="140" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">WHY</text><rect x="30" y="152" width="270.6666666666667" height="130" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="186.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Trade</text><text x="50" y="215.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Rejected the idols on which</text><text x="50" y="236.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Makka's pilgrimage trade</text><text x="50" y="257.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">depended</text><rect x="314.6666666666667" y="152" width="270.6666666666667" height="130" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="334.6666666666667" y="186.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Equality</text><text x="334.6666666666667" y="215.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Declared all people equal</text><text x="334.6666666666667" y="236.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">before God</text><rect x="599.3333333333334" y="152" width="270.6666666666667" height="130" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="619.3333333333334" y="186.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Authority</text><text x="619.3333333333334" y="215.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Challenged the authority of</text><text x="619.3333333333334" y="236.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">clan leaders</text><line x1="450" y1="290" x2="450" y2="322" stroke="#b5602e" stroke-width="4" marker-end="url(#ahR)"/><text x="30" y="352" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">HOW</text><rect x="30" y="364" width="270.6666666666667" height="151" rx="14" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="398.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Persecution</text><text x="50" y="427.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Bilal tortured, repeating "One,</text><text x="50" y="448.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">One"; Sumayya the first</text><text x="50" y="469.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">martyr; rubbish thrown on the</text><text x="50" y="490.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Prophet (pbuh)</text><rect x="314.6666666666667" y="364" width="270.6666666666667" height="151" rx="14" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5"/><text x="334.6666666666667" y="398.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Offers</text><text x="334.6666666666667" y="427.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Utba ibn Rabi'a offered</text><text x="334.6666666666667" y="448.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">wealth, leadership or</text><text x="334.6666666666667" y="469.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">kingship. Reply: not even for</text><text x="334.6666666666667" y="490.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the sun and the moon</text><rect x="599.3333333333334" y="364" width="270.6666666666667" height="151" rx="14" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5"/><text x="619.3333333333334" y="398.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Boycott</text><text x="619.3333333333334" y="427.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The clan of Hashim confined</text><text x="619.3333333333334" y="448.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">to Shi'b Abi Talib for about</text><text x="619.3333333333334" y="469.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">three years</text><text x="30" y="553" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">RESPONSES AND TURNING POINTS</text><rect x="30" y="565" width="201" height="158" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="44" y="591" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">615</text><text x="44" y="617.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Abyssinia</text><text x="44" y="645" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Ja'far recites Sura</text><text x="44" y="665" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Maryam; the Negus</text><text x="44" y="685" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">refuses to hand them</text><text x="44" y="705" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">over</text><rect x="243" y="565" width="201" height="158" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="257" y="591" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">619</text><text x="257" y="617.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Year of Sorrow</text><text x="257" y="645" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Khadija and Abu Talib</text><text x="257" y="665" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">die</text><rect x="456" y="565" width="201" height="158" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="470" y="591" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start"> </text><text x="470" y="617.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Ta'if</text><text x="470" y="645" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Mocked and stoned; he</text><text x="470" y="665" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">prays for their</text><text x="470" y="685" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">descendants</text><rect x="669" y="565" width="201" height="158" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="683" y="591" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start"> </text><text x="683" y="617.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Pledges of Aqaba</text><text x="683" y="645" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Men from Yathrib;</text><text x="683" y="665" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Mus'ab ibn Umayr sent</text><text x="683" y="685" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">to teach</text>
</svg>