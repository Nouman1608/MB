<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 634" width="900" height="634" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="634" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">From Hudaybiyya to the conquest of Makka</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">628–632</text>
<line x1="60" y1="144" x2="60" y2="582" stroke="#c9d6d4" stroke-width="4"/><rect x="104" y="124" width="766" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="118" y="152.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">628: Treaty of Hudaybiyya</text><text x="118" y="180.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Return next year; ten years of peace; tribes could ally with either side. Called "a manifest victory"</text><text x="118" y="201.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">(Sura 48.1)</text><circle cx="60" cy="172" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="180.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="104" y="230" width="766" height="75" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="118" y="258.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Letters to rulers</text><text x="118" y="286.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Inviting rulers, including the Byzantine emperor and the Negus, to Islam</text><circle cx="60" cy="267.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="276.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="104" y="315" width="766" height="75" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="118" y="343.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The truce broken</text><text x="118" y="371.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Allies of the Quraysh attacked the Muslims' allies</text><circle cx="60" cy="352.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="361.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="104" y="400" width="766" height="96" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="118" y="428.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">630: Conquest of Makka</text><text x="118" y="456.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Taken almost without fighting; a general pardon, even for old enemies; the Ka'ba cleared of idols</text><text x="118" y="477.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">(Sura 17.81)</text><circle cx="60" cy="448" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="456.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="104" y="506" width="766" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="118" y="534.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">632: Farewell Pilgrimage and death</text><text x="118" y="562.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Sermon at Arafat: equality, sanctity of life and property, rights of women, end of usury and blood</text><text x="118" y="583.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">feuds</text><circle cx="60" cy="554" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="562.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text>
</svg>