<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 489" width="900" height="489" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="489" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Badr, Uhud and the Trench</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Learn the dates 624, 625 and 627</text>
<rect x="30" y="124" width="270.6666666666667" height="256" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">624</text><text x="50" y="184.38" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Badr</text><text x="50" y="213.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="213.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">About 313 Muslims defeated</text><text x="65.2" y="234.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">a much larger Makkan army</text><text x="50" y="263.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="263.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Abu Jahl killed</text><text x="50" y="292.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="292.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Prisoners could win</text><text x="65.2" y="313.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">freedom by teaching</text><text x="65.2" y="334.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Muslims to read</text><rect x="314.6666666666667" y="124" width="270.6666666666667" height="256" rx="14" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5"/><text x="334.6666666666667" y="156" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">625</text><text x="334.6666666666667" y="184.38" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Uhud</text><text x="334.6666666666667" y="213.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="349.8666666666667" y="213.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Archers left their posts on</text><text x="349.8666666666667" y="234.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the hill to collect booty</text><text x="334.6666666666667" y="263.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="349.8666666666667" y="263.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Khalid ibn al-Walid's cavalry</text><text x="349.8666666666667" y="284.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">attacked from behind</text><text x="334.6666666666667" y="313.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="349.8666666666667" y="313.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The Prophet (pbuh)</text><text x="349.8666666666667" y="334.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">wounded; Hamza martyred</text><rect x="599.3333333333334" y="124" width="270.6666666666667" height="256" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="619.3333333333334" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">627</text><text x="619.3333333333334" y="184.38" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">The Trench</text><text x="619.3333333333334" y="213.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="634.5333333333334" y="213.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A trench dug on Salman</text><text x="634.5333333333334" y="234.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">al-Farsi's advice</text><text x="619.3333333333334" y="263.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="634.5333333333334" y="263.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The besieging allied army</text><text x="634.5333333333334" y="284.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">withdrew</text><text x="619.3333333333334" y="313.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="634.5333333333334" y="313.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The Banu Qurayza, who had</text><text x="634.5333333333334" y="334.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">broken their treaty, then</text><text x="634.5333333333334" y="355.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">dealt with</text><text x="450" y="406" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">OUTCOME</text><rect x="30" y="414" width="270.6666666666667" height="43" rx="14" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="165.33333333333334" y="440.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Victory</text><rect x="314.6666666666667" y="414" width="270.6666666666667" height="43" rx="14" fill="#f6e3d8" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="440.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Setback</text><rect x="599.3333333333334" y="414" width="270.6666666666667" height="43" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="734.6666666666667" y="440.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Siege withdrawn</text>
</svg>