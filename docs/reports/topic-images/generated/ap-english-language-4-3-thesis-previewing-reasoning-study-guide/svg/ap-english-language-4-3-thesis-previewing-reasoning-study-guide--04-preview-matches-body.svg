<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 552" width="900" height="552" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="552" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A promise the body keeps</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Worked example 2: annuals and native perennials</text>
<rect x="30" y="122" width="840" height="107.28" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="3" /><text x="48" y="156" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Thesis</text><text x="48" y="184.85" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“The switch is worth making because perennials <tspan font-weight="700" fill="#2e6b62">cost</tspan> <tspan font-weight="700" fill="#2e6b62">less</tspan> <tspan font-weight="700" fill="#2e6b62">over</tspan> <tspan font-weight="700" fill="#2e6b62">five</tspan> <tspan font-weight="700" fill="#2e6b62">years</tspan>, <tspan font-weight="700" fill="#8a6d0d">support</tspan> <tspan font-weight="700" fill="#8a6d0d">local</tspan></text><text x="48" y="207.29" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700" fill="#8a6d0d">insects</tspan> <tspan font-weight="700" fill="#8a6d0d">that</tspan> <tspan font-weight="700" fill="#8a6d0d">annuals</tspan> <tspan font-weight="700" fill="#8a6d0d">ignore</tspan>, and <tspan font-weight="700" fill="#b5602e">ask</tspan> <tspan font-weight="700" fill="#b5602e">the</tspan> <tspan font-weight="700" fill="#b5602e">town</tspan> <tspan font-weight="700" fill="#b5602e">for</tspan> <tspan font-weight="700" fill="#b5602e">less</tspan> <tspan font-weight="700" fill="#b5602e">water</tspan> once they are established.”</text><line x1="135" y1="226" x2="165" y2="298" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><rect x="30" y="302" width="270" height="140" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="48" y="344.82" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start" xml:space="preserve">¶2</text><text x="48" y="370.93" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“The first argument is financial:</text><text x="48" y="390.73" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">an annual is bought again every</text><text x="48" y="410.53000000000003" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">year...”</text><line x1="450" y1="226" x2="450" y2="298" stroke="#8a6d0d" stroke-width="3" marker-end="url(#ahO)"/><rect x="315" y="302" width="270" height="140" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="333" y="344.82" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="start" xml:space="preserve">¶3</text><text x="333" y="370.93" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“Perennials also feed and</text><text x="333" y="390.73" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">shelter insects that the town’s</text><text x="333" y="410.53000000000003" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">annual beds cannot.”</text><line x1="757" y1="226" x2="735" y2="298" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><rect x="600" y="302" width="270" height="140" rx="14" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5" /><text x="618" y="344.82" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start" xml:space="preserve">¶4</text><text x="618" y="370.93" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“Finally, a perennial that is</text><text x="618" y="390.73" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">established needs less</text><text x="618" y="410.53000000000003" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">watering...”</text><rect x="30" y="462" width="840" height="74.24000000000001" rx="14" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5" /><text x="450" y="493.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Three reasons in a fixed order; topic sentences follow the order, marked by “first” and “finally”. The</text><text x="450" y="514.72" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">preview does <tspan font-weight="700">not</tspan> list evidence: no cost figures, no insect names.</text>
</svg>