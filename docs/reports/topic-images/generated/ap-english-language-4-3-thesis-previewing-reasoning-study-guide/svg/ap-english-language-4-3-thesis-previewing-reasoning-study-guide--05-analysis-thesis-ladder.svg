<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 421" width="900" height="421" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="421" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Weak, better, strong</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Analysing a captain’s speech to a rowing team before a race</text>
<rect x="30" y="122" width="120" height="66.24000000000001" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" /><text x="90" y="162.12" font-size="19" font-weight="700" fill="#b5602e" text-anchor="middle" xml:space="preserve">Weak</text><rect x="170" y="122" width="700" height="66.24000000000001" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="6 5"/><text x="184" y="149.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“The captain uses ethos, pathos and logos.”</text><text x="184" y="170.72" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-style="italic">a</tspan> <tspan font-style="italic">list</tspan> <tspan font-style="italic">of</tspan> <tspan font-style="italic">labels;</tspan> <tspan font-style="italic">no</tspan> <tspan font-style="italic">claim</tspan> <tspan font-style="italic">about</tspan> <tspan font-style="italic">effect</tspan> <tspan font-style="italic">or</tspan> <tspan font-style="italic">purpose</tspan></text><rect x="30" y="202.24" width="120" height="66.24000000000001" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="90" y="242.36" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="middle" xml:space="preserve">Better</text><rect x="170" y="202.24" width="700" height="66.24000000000001" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="184" y="229.84" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“The captain motivates the team by appealing to their emotions.”</text><text x="184" y="250.96" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-style="italic">a</tspan> <tspan font-style="italic">claim,</tspan> <tspan font-style="italic">but</tspan> <tspan font-style="italic">not</tspan> <tspan font-style="italic">how</tspan> <tspan font-style="italic">or</tspan> <tspan font-style="italic">why</tspan></text><rect x="30" y="282.48" width="120" height="108.48000000000002" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="90" y="343.72" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">Strong</text><rect x="170" y="282.48" width="700" height="108.48000000000002" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="184" y="310.08000000000004" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“By starting from what the team has already endured and then turning to what is still to</text><text x="184" y="331.20000000000005" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">be earned, the captain converts weariness into pride and makes the final push feel</text><text x="184" y="352.32000000000005" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">like a debt to themselves.”</text><text x="184" y="373.44000000000005" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-style="italic">a</tspan> <tspan font-style="italic">claim</tspan> <tspan font-style="italic">with</tspan> <tspan font-style="italic">a</tspan> <tspan font-style="italic">preview</tspan> <tspan font-style="italic">of</tspan> <tspan font-style="italic">the</tspan> <tspan font-style="italic">speech’s</tspan> <tspan font-style="italic">movement</tspan> <tspan font-style="italic">and</tspan> <tspan font-style="italic">its</tspan> <tspan font-style="italic">effect</tspan></text><line x1="14" y1="126" x2="14" y2="390.96000000000004" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/>
</svg>