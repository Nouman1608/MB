<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 646" width="900" height="646" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="646" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three levels of thesis</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Free public transport: each level adds to the reader’s map</text>
<circle cx="52" cy="144" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="52" y="150.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="84" y="144" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Claim only</text><text x="196.23754" y="144" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" xml:space="preserve">· states a position</text><rect x="84" y="162" width="355.49160000000006" height="35" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2" /><text x="261.74580000000003" y="185.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Cities should make public transport free.</text><circle cx="52" cy="249" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="52" y="255.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="84" y="249" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Claim + governing reason</text><text x="341.46650999999997" y="249" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" xml:space="preserve">· the idea that holds the argument together</text><rect x="84" y="267" width="350.44872000000004" height="35" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2" /><text x="259.22436000000005" y="290.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Cities should make public transport free</text><rect x="84" y="310" width="476.52072" height="35" rx="8" fill="#dce9e7" stroke="#1e2a44" stroke-width="2" /><text x="322.26036" y="333.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">because fares work against the purpose of the service.</text><circle cx="52" cy="397" r="18" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="52" y="403.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="84" y="397" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Claim + preview</text><text x="250.19203" y="397" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" xml:space="preserve">· signals the reasons or shape</text><rect x="84" y="415" width="355.49160000000006" height="35" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2" /><text x="261.74580000000003" y="438.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Cities should make public transport free,</text><rect x="84" y="458" width="525.46117" height="35" rx="8" fill="#dce9e7" stroke="#1e2a44" stroke-width="2" /><text x="346.730585" y="481.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">because fares exclude the riders who need the service most,</text><rect x="84" y="501" width="305.13284" height="35" rx="8" fill="#dce9e7" stroke="#1e2a44" stroke-width="2" /><text x="236.56642" y="524.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">consume much of what they raise,</text><rect x="395.13284" y="501" width="266.06803" height="35" rx="8" fill="#dce9e7" stroke="#1e2a44" stroke-width="2" /><text x="528.1668549999999" y="524.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">and keep drivers in their cars.</text><rect x="30" y="560" width="840" height="74.24000000000001" rx="14" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5" /><text x="450" y="591.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">All three are acceptable. A short essay may need only a governing reason; a long argument with</text><text x="450" y="612.72" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">several moves benefits from a preview.</text>
</svg>