<!-- place after: ## Preview, announcement and list -->
<figure class="topic-figure">
  <img src="https://img.marlbridge.com/ap-english-language-4-3-thesis-previewing-reasoning-study-guide--02-announcement-list-preview.webp" width="900" height="532" alt="Three thesis versions checked against three tests. The announcement (“This essay will look at fares...”) and the bare list fail to take a position, say what the effect is, or offer something to argue with. The preview (“Free transport would repair three failures...”) passes all three." loading="lazy">
  <figcaption>A preview makes a claim and signals reasons; an announcement and a list do neither.</figcaption>
</figure>

<!-- place after: ## How a preview signals structure -->
<figure class="topic-figure">
  <img src="https://img.marlbridge.com/ap-english-language-4-3-thesis-previewing-reasoning-study-guide--03-preview-signal-shapes.webp" width="900" height="672" alt="Four small diagrams of how a thesis signals structure: parallel reasons (a claim branching to A, B and C), a progression (rising steps), a contrast or concession (X acknowledged, then Y), and a sequence of effects (first, then, finally). Below, an analysis thesis that previews two stages of a speech." loading="lazy">
  <figcaption>Reasons, progression, concession or sequence: the thesis tells the reader what shape to expect.</figcaption>
</figure>
