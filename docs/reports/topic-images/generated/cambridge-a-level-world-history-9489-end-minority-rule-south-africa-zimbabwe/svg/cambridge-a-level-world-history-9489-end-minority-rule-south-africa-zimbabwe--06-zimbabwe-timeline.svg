or="middle">18 Apr 1980</text><text x="809.752" y="205" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Independence</text><path d="M108.75,264 L108.75,280 L108.75,312" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="42.086" y="314" width="133.328" height="64" fill="#f4f6f6"/><text x="108.75" y="329" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">1966</text><text x="108.75" y="349" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">UN mandatory</text><text x="108.75" y="369" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">sanctions; Tiger</text><path d="M401.25,264 L401.25,280 L401.25,312" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="348.746" y="314" width="105.008" height="64" fill="#f4f6f6"/><text x="401.25" y="329" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">1972</text><text x="401.25" y="349" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Pearce</text><text x="401.25" y="369" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Commission</text><path d="M596.25,264 L596.25,280 L596.25,312" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="536.546" y="314" width="119.408" height="64" fill="#f4f6f6"/><text x="596.25" y="329" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">1976</text><text x="596.25" y="349" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Smith accepts</text><text x="596.25" y="369" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">majority rule</text><path d="M742.5,264 L742.5,280 L742.506,312" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="663.954" y="314" width="157.104" height="64" fill="#f4f6f6"/><text x="742.506" y="32