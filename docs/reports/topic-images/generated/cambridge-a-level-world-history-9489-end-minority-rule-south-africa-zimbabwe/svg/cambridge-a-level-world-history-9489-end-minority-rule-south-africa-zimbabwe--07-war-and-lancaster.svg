<rect width="900" height="758" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Two armies, one settlement</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">The guerrilla war and the road to Lancaster House</text>
<rect x="30" y="124" width="270.6666666666667" height="151" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="163.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ZAPU and ZIPRA</text><text x="46" y="189.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Joshua Nkomo</text><text x="46" y="218.3" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="61.2" y="218.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Backed by the USSR</text><text x="46" y="243.3" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="61.2" y="243.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Based in Zambia</text><rect x="314.6666666666667" y="124" width="270.6666666666667" height="151" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="330.6666666666667" y="152" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ZANU and ZANLA</text><text x="330.6666666666667" y="178.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Later led by Robert</text><text x="330.6666666666667" y="201.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Mugabe</text><text x="330.6666666666667" y="229.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="345.8666666666667" y="229.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Backed by China</text><text x="330.6666666666667" y="254.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="345.8666666666667" y="254.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Operated from Mozambique</text><rect x="599.3333333333334" y="124" width="270.6666666666667" height="151" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="615.3333333333334" y="153" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">RHODESIAN FORCES</text><text x="615.3333333333334" y="179.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Smith's government</text><text x="615.3333333333334" y="207.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="630.5333333333334" y="207.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Conscription; "protected</text><text x="630.5333333333334" y="228.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">villages"</text><text x="615.3333333333334" y="253.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="630.5333333333334" y="253.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Selous Scouts; raids abroad</text><rect x="30" y="295" width="269.3333333333333" height="121" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="335.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Military</text><text x="46" y="364.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">War weariness; front-line</text><text x="46" y="385.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">states press the guerrillas</text><rect x="315.3333333333333" y="295" width="269.3333333333333" height="121" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="331.3333333333333" y="335.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Economic</text><text x="331.3333333333333" y="364.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The cost of the war; white</text><text x="331.3333333333333" y="385.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">emigration</text><rect x="600.6666666666666" y="295" width="269.3333333333333" height="121" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="616.6666666666666" y="325.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Diplomatic</text><text x="616.6666666666666" y="353.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Commonwealth and British</text><text x="616.6666666666666" y="374.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">diplomacy under Lord</text><text x="616.6666666666666" y="395.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Carrington</text><rect x="150" y="480" width="600" height="137" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="512" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">LANCASTER HOUSE, 1979</text><text x="450" y="540.38" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Ceasefire and a new constitution</text><text x="450" y="570.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">20 of 100 seats reserved for whites for seven years;</text><text x="450" y="592.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">British-supervised elections</text><line x1="164.66666666666666" y1="422" x2="300" y2="474" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="450" y1="422" x2="450" y2="474" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="735.3333333333333" y1="422" x2="600" y2="474" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="637" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="671.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">February 1980</text><text x="450" y="701.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Mugabe's ZANU-PF wins 57 of the 80 common-roll seats.</text>
</svg>