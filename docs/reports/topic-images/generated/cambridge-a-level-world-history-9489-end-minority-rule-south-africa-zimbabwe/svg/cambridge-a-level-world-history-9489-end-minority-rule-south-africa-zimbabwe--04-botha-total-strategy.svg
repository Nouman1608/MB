<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 597" width="900" height="597" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="597" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Botha's Total Strategy, 1978-89</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Reform and repression at the same time</text>
<rect x="30" y="124" width="410" height="187" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">REFORM</text><text x="50" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Concessions</text><text x="50" y="211.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="211.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Legal Black trade unions (1979)</text><text x="50" y="238.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="238.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Tricameral Parliament (1984): whites,</text><text x="65.2" y="259.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Coloureds and Indians, not Africans</text><text x="50" y="286.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="286.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Pass laws repealed (1986)</text><rect x="460" y="124" width="410" height="187" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="480" y="156" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">REPRESSION</text><text x="480" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Force</text><text x="480" y="211.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="495.2" y="211.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">States of emergency (1985, 1986)</text><text x="480" y="238.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="495.2" y="238.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Detentions</text><text x="480" y="265.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="495.2" y="265.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Raids into neighbouring countries</text><rect x="30" y="333" width="840" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="365" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PRESSURES ON BOTHA</text><text x="50" y="396.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Township unrest; the United Democratic Front (1983); economic decline; sanctions; hostile neighbouring</text><text x="50" y="417.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">states</text><rect x="30" y="464" width="253.33333333333334" height="101" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="45" y="491" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">AUGUST 1985</text><text x="45" y="517.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">"Rubicon" speech</text><text x="45" y="545.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Disappoints hopes of reform</text><line x1="289.33333333333337" y1="514.5" x2="317.33333333333337" y2="514.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="323.33333333333337" y="464" width="253.33333333333334" height="101" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="338.33333333333337" y="493.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Banks refuse to roll over</text><text x="338.33333333333337" y="516.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">loans</text><text x="338.33333333333337" y="545.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Debt crisis</text><line x1="582.6666666666667" y1="514.5" x2="610.6666666666667" y2="514.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="616.6666666666667" y="464" width="253.33333333333334" height="101" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="631.6666666666667" y="493.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">1986</text><text x="631.6666666666667" y="519.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">US Comprehensive</text><text x="631.6666666666667" y="542.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Anti-Apartheid Act</text>
</svg>