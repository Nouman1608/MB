<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 678" width="900" height="678" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="678" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why the National Party won in 1948</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Four causes, one narrow result</text>
<rect x="30" y="124" width="412" height="121" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="154.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The Second World War</text><text x="46" y="182.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Many Afrikaners opposed fighting with Britain;</text><text x="46" y="203.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">urbanisation and the 1946 mineworkers' strike fed</text><text x="46" y="224.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">white fears</text><rect x="458" y="124" width="412" height="121" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="474" y="164.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Afrikaner nationalism</text><text x="474" y="193.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">"Apartheid" as an answer to the swart gevaar;</text><text x="474" y="214.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">protection for Afrikaner farmers and workers</text><rect x="30" y="261" width="412" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="291.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Smuts's campaign</text><text x="46" y="319.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Ageing, distracted by international affairs, vague</text><text x="46" y="340.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">on urbanisation</text><rect x="458" y="261" width="412" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="474" y="291.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The electoral system</text><text x="474" y="319.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Rural, mostly Afrikaner seats could hold fewer</text><text x="474" y="340.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">voters than urban ones</text><rect x="150" y="425" width="600" height="91" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="461.38" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">National Party and Afrikaner Party win</text><text x="450" y="491.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">More seats, despite winning fewer votes</text><line x1="236" y1="367" x2="300" y2="419" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="664" y1="367" x2="600" y2="419" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="30" y="552" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Seats won, 1948</text><rect x="30" y="576" width="442.4" height="70" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="251.2" y="607" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Malan: National Party + Afrikaner Party</text><text x="251.2" y="631" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">79 seats</text><rect x="472.4" y="576" width="397.6" height="70" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="671.2" y="607" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Smuts: United Party + Labour</text><text x="671.2" y="631" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">71 seats</text>
</svg>