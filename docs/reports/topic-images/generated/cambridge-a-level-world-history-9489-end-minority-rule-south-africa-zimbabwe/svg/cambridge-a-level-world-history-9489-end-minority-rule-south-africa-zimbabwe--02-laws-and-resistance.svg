<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Apartheid laws and the response, 1948-59</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Drawn to scale: laws on the left, opposition on the right</text>
<line x1="96" y1="168" x2="870" y2="168" stroke="#c9d6d4" stroke-width="1.2"/><text x="30" y="174" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">1948</text><line x1="96" y1="234" x2="870" y2="234" stroke="#c9d6d4" stroke-width="1.2"/><text x="30" y="240" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">1949</text><line x1="96" y1="300" x2="870" y2="300" stroke="#c9d6d4" stroke-width="1.2"/><text x="30" y="306" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">1950</text><line x1="96" y1="366" x2="870" y2="366" stroke="#c9d6d4" stroke-width="1.2"/><text x="30" y="372" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">1951</text><line x1="96" y1="432" x2="870" y2="432" stroke="#c9d6d4" stroke-width="1.2"/><text x="30" y="438" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">1952</text><line x1="96" y1="498" x2="870" y2="498" stroke="#c9d6d4" stroke-width="1.2"/><text x="30" y="504" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">1953</text><line x1="96" y1="564" x2="870" y2="564" stroke="#c9d6d4" stroke-width="1.2"/><text x="30" y="570" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">1954</text><line x1="96" y1="630" x2="870" y2="630" stroke="#c9d6d4" stroke-width="1.2"/><text x="30" y="636" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">1955</text><line x1="96" y1="696" x2="870" y2="696" stroke="#c9d6d4" stroke-width="1.2"/><text x="30" y="702" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">1956</text><line x1="96" y1="762" x2="870" y2="762" stroke="#c9d6d4" stroke-width="1.2"/><text x="30" y="768" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">1957</text><line x1="96" y1="828" x2="870" y2="828" stroke="#c9d6d4" stroke-width="1.2"/><text x="30" y="834" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">1958</text><line x1="96" y1="894" x2="870" y2="894" stroke="#c9d6d4" stroke-width="1.2"/><text x="30" y="900" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">1959</text><line x1="96" y1="960" x2="870" y2="960" stroke="#c9d6d4" stroke-width="1.2"/><text x="30" y="966" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">1960</text><line x1="470" y1="168" x2="470" y2="960" stroke="#1e2a44" stroke-width="4" stroke-linecap="round"/><text x="430" y="138" font-size="15" font-weight="700" fill="#b5602e" text-anchor="end">APARTHEID LAWS</text><text x="510" y="138" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">OPPOSITION AND TRIALS</text><path d="M470,168 L454,168 L436,168" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="279.624" y="153.4" width="155.376" height="46" fill="#f4f6f6"/><text x="430" y="172.20000000000002" font-size="16" font-weight="700" fill="#b5602e" text-anchor="end">1948</text><text x="430" y="193.20000000000002" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">National Party wins</text><path d="M470,234 L454,234 L436,234" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="163" y="219.4" width="272" height="46" fill="#f4f6f6"/><text x="430" y="238.20000000000002" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">1949</text><text x="430" y="259.20000000000005" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">Prohibition of Mixed Marriages Act</text><path d="M470,300 L454,300 L436,300" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="140.36" y="285.4" width="294.64" height="67" fill="#f4f6f6"/><text x="430" y="304.2" font-size="16" font-weight="700" fill="#b5602e" text-anchor="end">1950</text><text x="430" y="325.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">Population Registration, Group Areas</text><text x="430" y="346.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">and Suppression of Communism Acts</text><path d="M470,366 L454,366 L436,373" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="265.448" y="358.4" width="169.55200000000005" height="46" fill="#f4f6f6"/><text x="430" y="377.2" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">1951</text><text x="430" y="398.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">Bantu Authorities Act</text><path d="M470,432 L454,432 L436,432" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="132.856" y="417.4" width="302.144" height="67" fill="#f4f6f6"/><text x="430" y="436.2" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">1952</text><text x="430" y="457.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">All African men must carry a reference</text><text x="430" y="478.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">book</text><path d="M470,432 L486,432 L504,432" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="505" y="417.4" width="361.85599999999994" height="67" fill="#f4f6f6"/><text x="510" y="436.2" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">1952</text><text x="510" y="457.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">ANC Defiance Campaign: thousands break the</text><text x="510" y="478.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">laws</text><path d="M470,498 L454,498 L436,505" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="182.83999999999995" y="490.4" width="252.16000000000005" height="67" fill="#f4f6f6"/><text x="430" y="509.2" font-size="16" font-weight="700" fill="#b5602e" text-anchor="end">1953</text><text x="430" y="530.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">Bantu Education; Reservation of</text><text x="430" y="551.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">Separate Amenities Act</text><path d="M470,630 L454,630 L436,630" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="195.72" y="615.4" width="239.28" height="67" fill="#f4f6f6"/><text x="430" y="634.1999999999999" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">from 1955</text><text x="430" y="655.1999999999999" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">Sophiatown destroyed: forced</text><text x="430" y="676.1999999999999" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">removals</text><path d="M470,630 L486,630 L504,630" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="505" y="615.4" width="205.76" height="46" fill="#f4f6f6"/><text x="510" y="634.1999999999999" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">1955</text><text x="510" y="655.1999999999999" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Freedom Charter adopted</text><path d="M470,696 L486,696 L504,696" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="505" y="681.4" width="241.584" height="46" fill="#f4f6f6"/><text x="510" y="700.1999999999999" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">1956-61</text><text x="510" y="721.1999999999999" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Treason Trial: all 156 acquitted</text><path d="M470,735.599999999994 L486,735.599999999994 L504,748" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="505" y="733.4" width="309.568" height="46" fill="#f4f6f6"/><text x="510" y="752.1999999999999" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">9 August 1956</text><text x="510" y="773.1999999999999" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">About 20,000 women march to Pretoria</text><path d="M470,894 L486,894 L504,894" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="505" y="879.4" width="364.288" height="46" fill="#f4f6f6"/><text x="510" y="898.1999999999999" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">1959</text><text x="510" y="919.1999999999999" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Sobukwe leads Africanists out to form the PAC</text><circle cx="470" cy="168" r="7" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="470" cy="234" r="7" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="470" cy="300" r="7" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="470" cy="366" r="7" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="470" cy="432" r="7" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="470" cy="432" r="7" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="470" cy="498" r="7" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="470" cy="630" r="7" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="470" cy="630" r="7" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="470" cy="696" r="7" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="470" cy="735.599999999994" r="7" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="470" cy="894" r="7" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="988" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="1022.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Not wholly new</text><text x="50" y="1052.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Apartheid systematised segregation that already existed: land laws, migrant labour, pass controls</text><text x="50" y="1074.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">and job colour bars.</text>
