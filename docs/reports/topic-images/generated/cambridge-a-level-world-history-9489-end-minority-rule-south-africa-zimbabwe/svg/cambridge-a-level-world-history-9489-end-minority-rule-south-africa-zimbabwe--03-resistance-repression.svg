<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 664" width="900" height="664" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="664" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Resistance and the state's response</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">1960-77: each wave of resistance met harder repression</text>
<text x="210" y="140" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">RESISTANCE</text><text x="690" y="140" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">STATE AND WORLD RESPONSE</text><line x1="450" y1="154" x2="450" y2="632" stroke="#1e2a44" stroke-width="3"/><rect x="30" y="154" width="360" height="90" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="43" y="180.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Sharpeville and Langa</text><text x="43" y="207" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">PAC anti-pass campaign; police kill 69 at</text><text x="43" y="227" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Sharpeville</text><line x1="390" y1="199" x2="396" y2="199" stroke="#1e2a44" stroke-width="2"/><rect x="510" y="154" width="360" height="90" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="523" y="190.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">State of emergency</text><text x="523" y="217" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">ANC and PAC banned</text><line x1="504" y1="199" x2="510" y2="199" stroke="#1e2a44" stroke-width="2"/><rect x="396" y="182" width="108" height="34" rx="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="205" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Mar 1960</text><rect x="30" y="256" width="360" height="90" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="43" y="282.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Umkhonto we Sizwe</text><text x="43" y="309" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Mandela and others begin sabotage; Poqo</text><text x="43" y="329" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">more violent</text><line x1="390" y1="301" x2="396" y2="301" stroke="#1e2a44" stroke-width="2"/><rect x="510" y="256" width="360" height="90" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="523" y="282.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Rivonia raid (1963)</text><text x="523" y="309" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Life sentences (1964); internal movement</text><text x="523" y="329" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">crushed for a decade</text><line x1="504" y1="301" x2="510" y2="301" stroke="#1e2a44" stroke-width="2"/><rect x="396" y="284" width="108" height="34" rx="17" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="307" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Dec 1961</text><rect x="30" y="358" width="360" height="90" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="43" y="384.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Black Consciousness</text><text x="43" y="411" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Biko and SASO: psychological, then political,</text><text x="43" y="431" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">freedom</text><line x1="390" y1="403" x2="396" y2="403" stroke="#1e2a44" stroke-width="2"/><rect x="510" y="358" width="360" height="90" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="523" y="384.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">A stronger security state</text><text x="523" y="411" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Terrorism Act (1967); Bureau of State Security</text><text x="523" y="431" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">(1969)</text><line x1="504" y1="403" x2="510" y2="403" stroke="#1e2a44" stroke-width="2"/><rect x="396" y="386" width="108" height="34" rx="17" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="409" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">1969</text><rect x="30" y="460" width="360" height="90" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="43" y="486.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Soweto</text><text x="43" y="513" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Students protest against Afrikaans; uprising,</text><text x="43" y="533" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">hundreds die</text><line x1="390" y1="505" x2="396" y2="505" stroke="#1e2a44" stroke-width="2"/><rect x="510" y="460" width="360" height="90" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="523" y="496.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Force, arrests, bannings</text><text x="523" y="523" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Vorster's answer</text><line x1="504" y1="505" x2="510" y2="505" stroke="#1e2a44" stroke-width="2"/><rect x="396" y="488" width="108" height="34" rx="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="511" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">16 Jun 1976</text><rect x="30" y="562" width="360" height="70" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="43" y="601.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Biko dies in custody</text><line x1="390" y1="597" x2="396" y2="597" stroke="#1e2a44" stroke-width="2"/><rect x="510" y="562" width="360" height="70" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="523" y="588.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Black Consciousness groups banned</text><text x="523" y="615" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">UN arms embargo becomes mandatory</text><line x1="504" y1="597" x2="510" y2="597" stroke="#1e2a44" stroke-width="2"/><rect x="396" y="580" width="108" height="34" rx="17" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="603" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Sep 1977</text>
</svg>