<rect width="900" height="555" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Internal resistance or international pressure?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Test the alternative against chronology</text>
<polygon points="450,164 416,234 484,234" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><line x1="210" y1="130" x2="690" y2="198" stroke="#1e2a44" stroke-width="7" stroke-linecap="round"/><circle cx="450" cy="164" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><line x1="210" y1="130" x2="210" y2="170" stroke="#1e2a44" stroke-width="3"/><rect x="30" y="170" width="360" height="151" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="200.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">International pressure</text><text x="46" y="229.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="61.2" y="229.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Sanctions and boycotts</text><text x="46" y="254.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="61.2" y="254.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">1985 debt crisis raised the cost</text><text x="46" y="279.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="61.2" y="279.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">But weaker forms existed since the</text><text x="61.2" y="300.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">1960s without ending apartheid</text><line x1="690" y1="198" x2="690" y2="238" stroke="#1e2a44" stroke-width="3"/><rect x="510" y="238" width="360" height="172" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="526" y="268.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Internal resistance</text><text x="526" y="297.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="541.2" y="297.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">New in the 1980s: UDF, unions, township</text><text x="541.2" y="318.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">revolt</text><text x="526" y="343.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="541.2" y="343.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Made the country ungovernable</text><text x="526" y="368.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="541.2" y="368.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Convinced business and de Klerk that</text><text x="541.2" y="389.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">reform was unavoidable</text><rect x="30" y="432" width="840" height="91" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="466.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Judgement</text><text x="450" y="497.4" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">The two worked together, but internal resistance was decisive in <tspan font-weight="700" fill="#1e2a44">timing</tspan>.</text>
</svg>