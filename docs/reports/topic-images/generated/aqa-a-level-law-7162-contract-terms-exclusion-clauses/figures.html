<!-- place after: ## The nature of exclusion and limitation clauses -->
<figure class="topic-figure">
  <img src="https://img.marlbridge.com/aqa-a-level-law-7162-contract-terms-exclusion-clauses--01-exclusion-vs-limitation.webp" width="900" height="448" alt="Two clause types. An exclusion clause removes liability altogether; a limitation clause caps it at a figure or measure and is treated a little less strictly because it allocates risk. Both can be terms or notices. Below: they are legitimate in business for deciding who insures, but open to abuse by a stronger party against a weaker one who cannot negotiate." loading="lazy">

<!-- place after: ## Stage 1: incorporation -->
<figure class="topic-figure">
  <img src="https://img.marlbridge.com/aqa-a-level-law-7162-contract-terms-exclusion-clauses--02-incorporation-routes.webp" width="900" height="442" alt="Three routes to incorporation. Signature: L’Estrange v Graucob, unless the effect was misrepresented (Curtis v Chemical Cleaning). Reasonable notice before or at the time of contracting: Olley and Thornton on timing, Chapelton v Barry UDC on contractual documents, Parker v South Eastern Railway on reasonable steps. Course of dealing: must be consistent and regular (McCutcheon; Hollier v Rambler Motors)." loading="lazy">
  <figcaption>Signature, reasonable notice in time, or a consistent course of dealing.</figcaption>
</figure>

<!-- place after: ## Stage 1: incorporation -->
<figure class="topic-figure">
  <img src="https://img.marlbridge.com/aqa-a-level-law-7162-contract-terms-exclusion-clauses--03-notice-timing.webp" width="900" height="689" alt="Two timelines. In Olley the contract was made at the hotel reception, so the notice in the bedroom came too late. In Thornton the contract was made at the automatic car park barrier, so the terms on the ticket came too late. Below: the more unusual the clause, the greater the notice needed (Spurling v Bradshaw’s red hand; Interfoto)." loading="lazy">
  <figcaption>Find the moment the contract was made: notice after that point is too late.</figcaption>

<!-- place after: ## Stage 2: construction (brief) -->
<figure class="topic-figure">
  <img src="https://img.marlbridge.com/aqa-a-level-law-7162-contract-terms-exclusion-clauses--04-construction-rules.webp" width="900" height="437" alt="Three construction rules. Contra proferentem: ambiguity is read against the party relying on the clause (Houghton v Trafalgar Insurance), stated in the CRA 2015 for consumers. Negligence needs clear words (Canada Steamship Lines v The King). Whether a clause covers a serious breach depends on the whole contract (Photo Production v Securicor)." loading="lazy">
  <figcaption>Ambiguity goes against the party relying on the clause; negligence needs clear words.</figcaption>
</figure>

<!-- place after: ## Stage 3: statutory control -->
<figure class="topic-figure">
  <img src="https://img.marlbridge.com/aqa-a-level-law-7162-contract-terms-exclusion-clauses--05-ucta-or-cra.webp" width="900" height="482" alt="Two columns. Business to business contracts fall under UCTA 1977: s2(1) bans excluding liability for death or personal injury from negligence, s2(2) requires reasonableness for other negligence, s3 covers written standard terms, and s11 sets the reasonableness test. Trader to consumer contracts fall under the CRA 2015: s31 protects the goods terms, s57 protects s49 and the price paid, s65 bans excluding negligent death or injury, and unfair terms are not binding." loading="lazy">
  <figcaption>UCTA for business contracts, CRA 2015 for consumer contracts.</figcaption>
</figure>

<!-- place after: ## Stage 3: statutory control -->
<figure class="topic-figure">
  <img src="https://img.marlbridge.com/aqa-a-level-law-7162-contract-terms-exclusion-clauses--06-reasonableness-cases.webp" width="900" height="487" alt="Factors for reasonableness: bargaining strength, whether an alternative was offered, knowledge of the term, resources and insurance. Three cases: George Mitchell v Finney Lock Seeds and Smith v Eric S Bush found clauses unreasonable; Watford Electronics v Sanderson found a clause negotiated between experienced commercial parties reasonable." loading="lazy">
  <figcaption>Unequal parties and insurable losses point to unreasonable; equal, experienced parties to reasonable.</figcaption>
</figure>
