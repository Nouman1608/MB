<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 482" width="900" height="482" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="482" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Stage 3: which Act applies?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Choosing the right Act is the first marking point</text>
<rect x="30" y="124" width="405" height="326" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">BUSINESS TO BUSINESS</text><text x="50" y="183.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Unfair Contract Terms Act 1977</text><text x="50" y="212.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="212.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">s2(1)</tspan> Death or personal injury from</text><text x="65.2" y="233.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">negligence: <tspan font-weight="700" fill="#1e2a44">cannot</tspan> be excluded or restricted</text><text x="50" y="262.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="262.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">s2(2)</tspan> Other loss from negligence: only if</text><text x="65.2" y="283.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">reasonable</tspan></text><text x="50" y="312.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="312.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">s3</tspan> Written standard terms: no exclusion for</text><text x="65.2" y="333.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">breach, or substantially different</text><text x="65.2" y="354.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">performance, unless <tspan font-weight="700" fill="#1e2a44">reasonable</tspan></text><text x="50" y="383.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="383.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">s11</tspan> Reasonableness: judged when the</text><text x="65.2" y="404.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">contract was made; the party relying on it</text><text x="65.2" y="425.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">must prove it</text><rect x="465" y="124" width="405" height="326" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="485" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">TRADER TO CONSUMER</text><text x="485" y="183.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Consumer Rights Act 2015</text><text x="485" y="212.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="500.2" y="212.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">s31</tspan> Not binding to the extent it excludes or</text><text x="500.2" y="233.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">restricts liability under the goods terms,</text><text x="500.2" y="254.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">including <tspan font-weight="700" fill="#1e2a44">ss9,</tspan> <tspan font-weight="700" fill="#1e2a44">10</tspan> <tspan font-weight="700" fill="#1e2a44">and</tspan> <tspan font-weight="700" fill="#1e2a44">11</tspan></text><text x="485" y="283.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="500.2" y="283.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">s57</tspan> Cannot exclude <tspan font-weight="700" fill="#1e2a44">s49</tspan> (reasonable care</text><text x="500.2" y="304.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and skill); restriction not binding if it stops</text><text x="500.2" y="325.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">recovery of the <tspan font-weight="700" fill="#1e2a44">price</tspan> <tspan font-weight="700" fill="#1e2a44">paid</tspan></text><text x="485" y="354.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="500.2" y="354.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">s65</tspan> No exclusion of <tspan font-weight="700" fill="#1e2a44">death</tspan> <tspan font-weight="700" fill="#1e2a44">or</tspan> <tspan font-weight="700" fill="#1e2a44">personal</tspan> <tspan font-weight="700" fill="#1e2a44">injury</tspan></text><text x="500.2" y="375.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">from negligence, by term or consumer notice</text><text x="485" y="404.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="500.2" y="404.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Fairness</tspan> <tspan font-weight="700" fill="#1e2a44">test</tspan>: an unfair term is not binding on</text><text x="500.2" y="425.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the consumer</text>
</svg>