<rect width="900" height="487" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Is the clause reasonable? (UCTA s11)</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">The party relying on the clause must prove it</text>
<rect x="147.38400000000001" y="124" width="241.376" height="30" rx="15" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="268.072" y="144.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">relative bargaining strength</text><rect x="398.76" y="124" width="179.088" height="30" rx="15" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="488.304" y="144.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">alternative offered?</text><rect x="587.848" y="124" width="164.768" height="30" rx="15" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="670.232" y="144.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">knew of the term?</text><rect x="245.45600000000002" y="164" width="255.472" height="30" rx="15" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="373.192" y="184.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">resources to meet the liability</text><rect x="510.928" y="164" width="143.61599999999999" height="30" rx="15" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="582.736" y="184.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">could it insure?</text><rect x="30" y="216" width="270.6666666666667" height="239" rx="14" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="248" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">UNREASONABLE</text><text x="50" y="274.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">George Mitchell v Finney</text><text x="50" y="297.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Lock Seeds (1983)</text><text x="50" y="325.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Liability limited to the price of</text><text x="50" y="346.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">defective cabbage seed:</text><text x="50" y="367.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">sellers could have insured,</text><text x="50" y="388.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the farmers’ loss was far</text><text x="50" y="409.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">greater, and such claims had</text><text x="50" y="430.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">been settled before</text><rect x="314.6666666666667" y="216" width="270.6666666666667" height="239" rx="14" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="334.6666666666667" y="248" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">UNREASONABLE</text><text x="334.6666666666667" y="274.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Smith v Eric S Bush (1990)</text><text x="334.6666666666667" y="302.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Surveyor’s disclaimer to a</text><text x="334.6666666666667" y="323.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">house buyer of modest means</text><rect x="599.3333333333334" y="216" width="270.6666666666667" height="239" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="619.3333333333334" y="248" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">REASONABLE</text><text x="619.3333333333334" y="274.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Watford Electronics v</text><text x="619.3333333333334" y="297.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Sanderson (2001)</text><text x="619.3333333333334" y="325.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Limitation negotiated between</text><text x="619.3333333333334" y="346.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">experienced commercial</text><text x="619.3333333333334" y="367.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">parties of similar bargaining</text><text x="619.3333333333334" y="388.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">power: courts slow to</text><text x="619.3333333333334" y="409.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">interfere</text>
</svg>