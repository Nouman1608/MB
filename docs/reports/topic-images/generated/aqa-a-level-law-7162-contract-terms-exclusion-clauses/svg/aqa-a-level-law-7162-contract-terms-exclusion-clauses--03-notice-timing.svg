<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 689" width="900" height="689" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="689" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Notice must come before or at the time of contract</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">A term seen only afterwards comes too late</text>
<rect x="30" y="124" width="840" height="190" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="159.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Olley v Marlborough Court Hotel (1949)</text><line x1="70" y1="234" x2="830" y2="234" stroke="#1e2a44" stroke-width="3"/><circle cx="190" cy="234" r="12" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="190" y="272" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Arrives at reception</text><circle cx="450" cy="234" r="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="272" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Contract made at the</text><text x="450" y="293" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">reception desk</text><circle cx="710" cy="234" r="12" fill="#f2e7b8" stroke="#b5602e" stroke-width="3"/><text x="710" y="272" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">Sees notice in the bedroom</text><text x="450" y="210" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">CONTRACT MADE</text><text x="850" y="158" font-size="16" font-weight="700" fill="#b5602e" text-anchor="end">too late</text><rect x="30" y="336" width="840" height="190" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="371.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Thornton v Shoe Lane Parking (1971)</text><line x1="70" y1="446" x2="830" y2="446" stroke="#1e2a44" stroke-width="3"/><circle cx="190" cy="446" r="12" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="190" y="484" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Drives up to the automatic</text><text x="190" y="505" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">barrier</text><circle cx="450" cy="446" r="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="484" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Contract made at the barrier</text><circle cx="710" cy="446" r="12" fill="#f2e7b8" stroke="#b5602e" stroke-width="3"/><text x="710" y="484" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">Terms on the ticket from the</text><text x="710" y="505" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">machine</text><text x="450" y="422" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">CONTRACT MADE</text><text x="850" y="370" font-size="16" font-weight="700" fill="#b5602e" text-anchor="end">too late</text><rect x="30" y="548" width="840" height="109" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="582.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The more unusual the clause, the greater the notice</text><text x="50" y="611.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Spurling</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Bradshaw</tspan> (1956): some clauses need to be “printed in red ink on the face of the document</text><text x="50" y="632.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">with a red hand pointing to it”. <tspan font-style="italic">Interfoto</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Stiletto</tspan> (1989): an onerous term not fairly brought to attention.</text>
</svg>