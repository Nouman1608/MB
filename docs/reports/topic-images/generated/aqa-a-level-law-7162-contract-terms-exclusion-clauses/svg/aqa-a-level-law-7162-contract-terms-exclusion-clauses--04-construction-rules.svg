<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Stage 2: does the clause cover what happened?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Construction: the true meaning of the clause</text>
<rect x="30" y="124" width="270.6666666666667" height="281" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CONTRA PROFERENTEM</text><text x="50" y="182.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Ambiguity is read against</text><text x="50" y="205.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">the party relying on it</text><text x="50" y="233.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Houghton</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Trafalgar</tspan></text><text x="50" y="254.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Insurance</tspan> (1954): a “load”</text><text x="50" y="275.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">over capacity did not cover</text><text x="50" y="296.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">too many passengers. For</text><text x="50" y="317.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">consumers the CRA 2015</text><text x="50" y="338.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">states it: the meaning most</text><text x="50" y="359.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">favourable to the consumer</text><text x="50" y="380.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">prevails</text><rect x="314.6666666666667" y="124" width="270.6666666666667" height="281" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="334.6666666666667" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">NEGLIGENCE</text><text x="334.6666666666667" y="182.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Clear words are needed</text><text x="334.6666666666667" y="205.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">to exclude liability for</text><text x="334.6666666666667" y="228.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">negligence</text><text x="334.6666666666667" y="256.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Canada</tspan> <tspan font-style="italic">Steamship</tspan> <tspan font-style="italic">Lines</tspan> <tspan font-style="italic">v</tspan></text><text x="334.6666666666667" y="277.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">The</tspan> <tspan font-style="italic">King</tspan> (1952)</text><rect x="599.3333333333334" y="124" width="270.6666666666667" height="281" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="619.3333333333334" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SERIOUS BREACHES</text><text x="619.3333333333334" y="182.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Construe the whole</text><text x="619.3333333333334" y="205.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">contract</text><text x="619.3333333333334" y="233.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Photo</tspan> <tspan font-style="italic">Production</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Securicor</tspan></text><text x="619.3333333333334" y="254.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">(1980): a clear clause</text><text x="619.3333333333334" y="275.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">between businesses of equal</text><text x="619.3333333333334" y="296.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">bargaining power protected a</text><text x="619.3333333333334" y="317.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">security firm whose employee</text><text x="619.3333333333334" y="338.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">started a fire that destroyed</text><text x="619.3333333333334" y="359.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the factory</text>
