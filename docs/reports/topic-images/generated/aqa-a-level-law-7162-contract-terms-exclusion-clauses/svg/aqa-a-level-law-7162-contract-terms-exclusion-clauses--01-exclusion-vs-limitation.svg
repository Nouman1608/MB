<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 448" width="900" height="448" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="448" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Exclusion clauses and limitation clauses</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Both can be a term of the contract or a notice, such as a car park sign</text>
<rect x="30" y="124" width="412" height="158" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EXCLUSION CLAUSE</text><text x="50" y="183.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Removes liability altogether</text><text x="50" y="213.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">“The company accepts no liability for loss or</text><text x="50" y="235.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">damage”</text><rect x="458" y="124" width="412" height="158" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="478" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">LIMITATION CLAUSE</text><text x="478" y="183.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Caps liability at a figure or measure</text><text x="478" y="213.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">“Our liability shall not exceed the price paid”.</text><text x="478" y="235.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Treated a little less strictly: it allocates risk</text><text x="478" y="257.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">rather than removing it</text><rect x="30" y="304" width="412" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="336" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">LEGITIMATE</text><text x="50" y="362.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">In business</text><text x="50" y="391.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Parties decide who insures against a risk</text><rect x="458" y="304" width="412" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="478" y="336" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">OPEN TO ABUSE</text><text x="478" y="362.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Stronger v weaker party</text><text x="478" y="391.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The weaker party has no chance to negotiate</text>
</svg>