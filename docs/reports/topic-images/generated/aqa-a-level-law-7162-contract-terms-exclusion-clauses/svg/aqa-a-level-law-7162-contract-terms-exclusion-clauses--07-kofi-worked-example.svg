<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 831" width="900" height="831" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="831" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: Kofi’s bicycle</text>

<rect x="30" y="100" width="840" height="133" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FACTS</text><text x="50" y="164.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Kofi, a private individual, signs Fastfix’s form: “no liability for any loss or damage to customers’</text><text x="50" y="186.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">property, however caused”. A mechanic negligently leaves the bicycle outside and it is stolen. A</text><text x="50" y="208.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">counter sign excludes liability for personal injury; a loose spoke cuts his hand.</text><line x1="60" y1="275" x2="60" y2="779" stroke="#c9d6d4" stroke-width="4"/><rect x="104" y="255" width="766" height="108" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="288.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Incorporation</text><text x="122" y="318.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Signed form: incorporated (<tspan font-style="italic">L’Estrange</tspan>), unless its effect was misrepresented (<tspan font-style="italic">Curtis</tspan>). The</text><text x="122" y="340.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">sign may be too late (<tspan font-style="italic">Olley</tspan>; <tspan font-style="italic">Thornton</tspan>).</text><circle cx="60" cy="309" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="317.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="104" y="375" width="766" height="86" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="408.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Construction</text><text x="122" y="438.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">“However caused” is wide enough to cover negligence (<tspan font-style="italic">Canada</tspan> <tspan font-style="italic">Steamship</tspan>).</text><circle cx="60" cy="418" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="426.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="104" y="473" width="766" height="108" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="506.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Statute: the bicycle</text><text x="122" y="536.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Consumer and trader: CRA 2015. Theft through careless storage breaches s49; s57 stops</text><text x="122" y="558.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">the clause excluding it.</text><circle cx="60" cy="527" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="535.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="104" y="593" width="766" height="86" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="626.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Statute: the injury</text><text x="122" y="656.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">s65: negligent injury cannot be excluded by a term or a consumer notice.</text><circle cx="60" cy="636" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="644.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="104" y="691" width="766" height="108" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="122" y="724.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Conclusion</text><text x="122" y="754.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Fastfix is liable for the bicycle and the injury. (For a business user, UCTA: s2(1) for injury;</text><text x="122" y="776.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">s11 for property.)</text><circle cx="60" cy="745" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="753.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text>
</svg>