<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 442" width="900" height="442" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="442" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three ways a clause becomes part of the contract</text>

<rect x="30" y="100" width="270.6666666666667" height="310" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SIGNATURE</text><text x="50" y="158.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Bound whether or not you</text><text x="50" y="181.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">read it</text><text x="50" y="209.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="209.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">L’Estrange</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Graucob</tspan></text><text x="65.2" y="230.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(1934): café owner bound</text><text x="65.2" y="251.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">by small print on a vending</text><text x="65.2" y="272.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">machine order form</text><text x="50" y="301.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="301.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Exception:</tspan> effect</text><text x="65.2" y="322.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">misrepresented. <tspan font-style="italic">Curtis</tspan> <tspan font-style="italic">v</tspan></text><text x="65.2" y="343.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Chemical</tspan> <tspan font-style="italic">Cleaning</tspan> (1951):</text><text x="65.2" y="364.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">told it covered only beads</text><text x="65.2" y="385.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and sequins</text><rect x="314.6666666666667" y="100" width="270.6666666666667" height="310" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="334.6666666666667" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">REASONABLE NOTICE</text><text x="334.6666666666667" y="158.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Given before or at the</text><text x="334.6666666666667" y="181.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">time of contracting</text><text x="334.6666666666667" y="209.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="349.8666666666667" y="209.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Timing: <tspan font-style="italic">Olley</tspan>; <tspan font-style="italic">Thornton</tspan></text><text x="334.6666666666667" y="238.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="349.8666666666667" y="238.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A contractual document, not</text><text x="349.8666666666667" y="259.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">a receipt: <tspan font-style="italic">Chapelton</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Barry</tspan></text><text x="349.8666666666667" y="280.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">UDC</tspan> (1940)</text><text x="334.6666666666667" y="309.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="349.8666666666667" y="309.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Reasonably sufficient steps:</text><text x="349.8666666666667" y="330.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Parker</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">South</tspan> <tspan font-style="italic">Eastern</tspan></text><text x="349.8666666666667" y="351.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Railway</tspan> (1877)</text><rect x="599.3333333333334" y="100" width="270.6666666666667" height="310" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="619.3333333333334" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">COURSE OF DEALING</text><text x="619.3333333333334" y="158.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Consistent and regular</text><text x="619.3333333333334" y="186.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="634.5333333333334" y="186.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">McCutcheon</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">David</tspan></text><text x="634.5333333333334" y="207.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">MacBrayne</tspan> (1964):</text><text x="634.5333333333334" y="228.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">inconsistent dealings not</text><text x="634.5333333333334" y="249.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">enough</text><text x="619.3333333333334" y="278.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="634.5333333333334" y="278.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Hollier</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Rambler</tspan> <tspan font-style="italic">Motors</tspan></text><text x="634.5333333333334" y="299.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(1972): three or four</text><text x="634.5333333333334" y="320.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">transactions in five years</text><text x="634.5333333333334" y="341.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">not enough for a private</text><text x="634.5333333333334" y="362.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">customer</text>
</svg>