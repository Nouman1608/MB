<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 765" width="900" height="765" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="765" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The pattern of each rak’ah</text>

<line x1="62" y1="124" x2="62" y2="510" stroke="#c9d6d4" stroke-width="4"/><rect x="108" y="104" width="762" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="139.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Standing (qiyam)</text><text x="128" y="167.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Surah al-Fatiha, required in every prayer; another passage in the first two rak’ahs</text><circle cx="62" cy="148" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="156.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="108" y="202" width="762" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="237.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Bowing (ruku)</text><text x="128" y="265.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Subhana Rabbiyal Azeem</text><circle cx="62" cy="246" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="254.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="108" y="300" width="762" height="61" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="335.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Standing again</text><circle cx="62" cy="330.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="339.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="108" y="371" width="762" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="406.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Two prostrations (sujood)</text><text x="128" y="434.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Subhana Rabbiyal A’la</text><circle cx="62" cy="415" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="423.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="108" y="469" width="762" height="61" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="504.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Sitting</text><circle cx="62" cy="499.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="508.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><rect x="30" y="548" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="583.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Ending the prayer</text><text x="50" y="612.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Tashahhud, blessings on the Prophet (pbuh), then the salam to right and left.</text><rect x="30" y="655" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="688.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Recitation is in Arabic, the language of revelation, which unites Muslims of every</text><text x="50" y="710.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">nationality.</text>
</svg>