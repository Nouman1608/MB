<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 576" width="900" height="576" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="576" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Wudu in order</text>

<rect x="90" y="104" width="316" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="104" y="143.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Intention and Bismillah</text><circle cx="56" cy="139" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="56" y="146.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="90" y="188" width="316" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="104" y="227.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Hands to the wrists</text><circle cx="56" cy="223" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="56" y="230.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="440" y="230" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="end">×3</text><rect x="90" y="272" width="316" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="104" y="311.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Rinse the mouth</text><circle cx="56" cy="307" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="56" y="314.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="440" y="314" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="end">×3</text><rect x="90" y="356" width="316" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="104" y="395.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Rinse the nose</text><circle cx="56" cy="391" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="56" y="398.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="440" y="398" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="end">×3</text><rect x="520" y="104" width="316" height="72" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="534" y="132.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Face: hairline to chin, ear</text><text x="534" y="156.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">to ear</text><circle cx="486" cy="139" r="22" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="486" y="146.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="870" y="146" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="end">×3</text><rect x="520" y="188" width="316" height="72" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="534" y="216.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Each arm to the elbow,</text><text x="534" y="240.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">right first</text><circle cx="486" cy="223" r="22" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="486" y="230.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">6</text><text x="870" y="230" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="end">×3</text><rect x="520" y="272" width="316" height="72" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="534" y="300.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Wipe over the head (many</text><text x="534" y="324.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">also the ears)</text><circle cx="486" cy="307" r="22" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="486" y="314.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">7</text><text x="870" y="314" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="end">×1</text><rect x="520" y="356" width="316" height="72" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="534" y="384.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Each foot to the ankle,</text><text x="534" y="408.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">right first</text><circle cx="486" cy="391" r="22" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="486" y="398.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">8</text><text x="870" y="398" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="end">×3</text><rect x="30" y="444" width="840" height="102" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="477.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Highlighted steps are the obligatory parts in Qur’an 5:6: “wash your faces and your</text><text x="50" y="499.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">forearms to the elbows and wipe over your heads and wash your feet to the ankles.” The</text><text x="50" y="521.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Prophet (pbuh) added the others.</text>
</svg>