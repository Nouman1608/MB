<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 466" width="900" height="466" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="466" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three kinds of purification</text>

<rect x="30" y="104" width="269.3333333333333" height="202" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="140.8" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Wudu</text><text x="50" y="170.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="170.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Washing set parts of the</text><text x="65.2" y="191.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">body before prayer</text><text x="50" y="218.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="218.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Broken by: using the</text><text x="65.2" y="239.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">toilet, passing wind,</text><text x="65.2" y="260.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">deep sleep, losing</text><text x="65.2" y="281.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">consciousness</text><rect x="315.3333333333333" y="104" width="269.3333333333333" height="202" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="335.3333333333333" y="140.8" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Ghusl</text><text x="335.3333333333333" y="170.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="350.5333333333333" y="170.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A full ritual bath</text><text x="335.3333333333333" y="197.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="350.5333333333333" y="197.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Needed after sexual</text><text x="350.5333333333333" y="218.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">relations and at the end</text><text x="350.5333333333333" y="239.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">of menstruation or</text><text x="350.5333333333333" y="260.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">bleeding after childbirth</text><rect x="600.6666666666666" y="104" width="269.3333333333333" height="202" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="620.6666666666666" y="140.8" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Tayammum</text><text x="620.6666666666666" y="170.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="635.8666666666667" y="170.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Dry ablution with clean</text><text x="635.8666666666667" y="191.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">earth or dust</text><text x="620.6666666666666" y="218.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="635.8666666666667" y="218.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Replaces both when there</text><text x="635.8666666666667" y="239.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">is no water or water</text><text x="635.8666666666667" y="260.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">would harm (5:6)</text><rect x="30" y="324" width="840" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="360" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Where schools differ</text><text x="50" y="389.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Hanafis: flowing blood breaks Wudu. Shafi’is: skin contact with a non-mahram of the</text><text x="50" y="411.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">opposite sex does. Shi’a practice wipes rather than washes the feet.</text>
</svg>