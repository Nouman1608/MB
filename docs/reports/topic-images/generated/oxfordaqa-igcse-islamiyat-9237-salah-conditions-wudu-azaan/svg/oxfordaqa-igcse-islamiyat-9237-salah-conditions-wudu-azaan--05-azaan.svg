<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 764" width="900" height="764" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="764" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The Azaan, line by line</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Bilal (RA) was the first muezzin</text>
<rect x="30" y="110" width="840" height="58" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="136" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" font-style="italic">Allahu Akbar</text><text x="52" y="158" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Allah is the Greatest</text><circle cx="830" cy="139" r="20" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><text x="830" y="146.2" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">×4</text><rect x="30" y="176" width="840" height="58" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="52" y="202" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" font-style="italic">Ashhadu an la ilaha illallah</text><text x="52" y="224" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">I bear witness there is no god but Allah</text><circle cx="830" cy="205" r="20" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><text x="830" y="212.2" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">×2</text><rect x="30" y="242" width="840" height="58" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="52" y="268" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" font-style="italic">Ashhadu anna Muhammadan rasulullah</text><text x="52" y="290" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">I bear witness Muhammad is the Messenger of Allah</text><circle cx="830" cy="271" r="20" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><text x="830" y="278.2" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">×2</text><rect x="30" y="308" width="840" height="58" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="334" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" font-style="italic">Hayya ’alas-salah</text><text x="52" y="356" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Come to prayer</text><circle cx="830" cy="337" r="20" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><text x="830" y="344.2" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">×2</text><rect x="30" y="374" width="840" height="58" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="400" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" font-style="italic">Hayya ’alal-falah</text><text x="52" y="422" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Come to success</text><circle cx="830" cy="403" r="20" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><text x="830" y="410.2" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">×2</text><rect x="30" y="440" width="840" height="58" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="466" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" font-style="italic">Allahu Akbar</text><text x="52" y="488" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Allah is the Greatest</text><circle cx="830" cy="469" r="20" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><text x="830" y="476.2" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">×2</text><rect x="30" y="506" width="840" height="58" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="532" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" font-style="italic">La ilaha illallah</text><text x="52" y="554" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">There is no god but Allah</text><circle cx="830" cy="535" r="20" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><text x="830" y="542.2" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">×1</text><text x="450" y="590" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="middle">Sunni wording. Highlighted lines are the Shahadah: Tawhid announced five times a day.</text><rect x="30" y="608" width="270.6666666666667" height="126" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="642.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Before Fajr</text><text x="50" y="670" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Add “as-salatu khayrun min</text><text x="50" y="690" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">an-nawm”: prayer is better</text><text x="50" y="710" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">than sleep</text><rect x="314.6666666666667" y="608" width="270.6666666666667" height="126" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="334.6666666666667" y="642.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Shi’a addition</text><text x="334.6666666666667" y="670" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">“Hayya ’ala khayr al-’amal”:</text><text x="334.6666666666667" y="690" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">come to the best of deeds</text><rect x="599.3333333333334" y="608" width="270.6666666666667" height="126" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="619.3333333333334" y="642.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Iqamah</text><text x="619.3333333333334" y="670" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">A shorter call just before</text><text x="619.3333333333334" y="690" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">the congregation stands</text>
</svg>