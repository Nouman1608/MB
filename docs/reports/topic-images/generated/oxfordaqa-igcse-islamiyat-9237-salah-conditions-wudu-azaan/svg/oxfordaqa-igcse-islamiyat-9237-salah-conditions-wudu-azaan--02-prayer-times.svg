<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The five prayer times</text>

<rect x="40" y="290" width="820" height="54" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><path d="M187.6,286 Q409,100 630.4,286" fill="none" stroke="#d4b02e" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 7"/><circle cx="409" cy="193" r="22" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="177.6" y="276" font-size="15" font-weight="600" fill="#8a6d0d" text-anchor="end">sunrise</text><text x="640.4" y="276" font-size="15" font-weight="600" fill="#8a6d0d" text-anchor="start">sunset</text><rect x="56.4" y="296" width="127.19999999999999" height="42" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="120" y="323" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Fajr</text><rect x="335.2" y="296" width="151.80000000000007" height="42" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="411.1" y="323" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Zuhr</text><rect x="491.00000000000006" y="296" width="135.39999999999992" height="42" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="558.7" y="323" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Asr</text><rect x="630.4" y="296" width="110.80000000000007" height="42" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="685.8" y="323" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Maghrib</text><rect x="745.2" y="296" width="110.79999999999995" height="42" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="800.6" y="323" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Isha</text><rect x="30" y="370" width="160" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="42" y="400" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Prayer</text><rect x="190" y="370" width="520" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="202" y="400" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Begins → ends</text><rect x="710" y="370" width="160" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="722" y="400" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Fard rak’ahs</text><rect x="30" y="416" width="160" height="43" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="441.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Fajr</text><rect x="190" y="416" width="520" height="43" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="202" y="441.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">true dawn → sunrise</text><rect x="710" y="416" width="160" height="43" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="722" y="441.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">2</text><rect x="30" y="459" width="160" height="43" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="484.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Zuhr</text><rect x="190" y="459" width="520" height="43" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="202" y="484.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">after the sun’s highest point → Asr</text><rect x="710" y="459" width="160" height="43" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="722" y="484.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">4</text><rect x="30" y="502" width="160" height="43" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="527.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Asr</text><rect x="190" y="502" width="520" height="43" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="202" y="527.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">mid-afternoon → sunset</text><rect x="710" y="502" width="160" height="43" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="722" y="527.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">4</text><rect x="30" y="545" width="160" height="43" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="570.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Maghrib</text><rect x="190" y="545" width="520" height="43" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="202" y="570.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">after sunset → red twilight gone</text><rect x="710" y="545" width="160" height="43" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="722" y="570.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">3</text><rect x="30" y="588" width="160" height="43" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="613.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Isha</text><rect x="190" y="588" width="520" height="43" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="202" y="613.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">nightfall → before dawn</text><rect x="710" y="588" width="160" height="43" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="722" y="613.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">4</text><rect x="30" y="647" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="680.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A schematic day, not to scale: times change through the year with the sun, so mosques</text><text x="50" y="702.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">publish timetables. Fard counts: 2, 4, 4, 3, 4.</text>
</svg>