<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 607" width="900" height="607" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="607" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Seven conditions of Salah, each with a reason</text>

<rect x="30" y="104" width="230" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="42" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Condition</text><rect x="260" y="104" width="330" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="272" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">What it means</text><rect x="590" y="104" width="280" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="602" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Reason</text><rect x="30" y="150" width="230" height="64" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="175.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Muslim, sane, mature</text><rect x="260" y="150" width="330" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="272" y="175.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Obligatory from puberty, of sound</text><text x="272" y="196.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">mind</text><rect x="590" y="150" width="280" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="602" y="175.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Responsibility begins with</text><text x="602" y="196.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">understanding</text><rect x="30" y="214" width="230" height="64" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="239.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Purity of the body</text><rect x="260" y="214" width="330" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="272" y="239.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Wudu, or ghusl where required</text><rect x="590" y="214" width="280" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="602" y="239.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Prayer is meeting Allah, so</text><text x="602" y="260.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">prepare</text><rect x="30" y="278" width="230" height="64" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="303.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Clean clothes and</text><text x="42" y="324.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">place</text><rect x="260" y="278" width="330" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="272" y="303.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Free of impurity (najasah)</text><rect x="590" y="278" width="280" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="602" y="303.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Respect for worship</text><rect x="30" y="342" width="230" height="64" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="367.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Covering the body</text><text x="42" y="388.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">(awrah)</text><rect x="260" y="342" width="330" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="272" y="367.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Men: at least navel to knee; women:</text><text x="272" y="388.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">all but face and hands</text><rect x="590" y="342" width="280" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="602" y="367.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Modesty before Allah</text><rect x="30" y="406" width="230" height="43" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="431.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Facing the Qiblah</text><rect x="260" y="406" width="330" height="43" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="272" y="431.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Towards the Ka’aba in Makkah</text><rect x="590" y="406" width="280" height="43" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="602" y="431.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Unity in one direction</text><rect x="30" y="449" width="230" height="64" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="474.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">The correct time</text><rect x="260" y="449" width="330" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="272" y="474.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Each prayer has a set period</text><rect x="590" y="449" width="280" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="602" y="474.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">“A decree of specified times”</text><text x="602" y="495.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">(4:103)</text><rect x="30" y="513" width="230" height="64" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="538.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Intention (niyyah)</text><rect x="260" y="513" width="330" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="272" y="538.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Deciding in the heart which prayer</text><rect x="590" y="513" width="280" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="602" y="538.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Worship must be deliberate and</text><text x="602" y="559.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">sincere</text>
</svg>