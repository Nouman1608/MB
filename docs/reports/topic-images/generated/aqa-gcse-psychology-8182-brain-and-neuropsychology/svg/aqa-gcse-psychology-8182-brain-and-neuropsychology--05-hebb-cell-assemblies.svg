<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 468" width="900" height="468" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="468" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Hebb: neurons that fire together, wire together</text>

<rect x="30" y="100" width="380" height="180" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><line x1="118" y1="170" x2="322" y2="170" stroke="#c9d6d4" stroke-width="3" stroke-linecap="round"/><circle cx="90" cy="170" r="26" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><circle cx="350" cy="170" r="26" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><text x="220" y="230" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Rarely active together</text><text x="220" y="258" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">a weak connection</text><rect x="490" y="100" width="380" height="180" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><line x1="578" y1="170" x2="782" y2="170" stroke="#2e6b62" stroke-width="14" stroke-linecap="round"/><circle cx="550" cy="170" r="26" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><circle cx="810" cy="170" r="26" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><text x="680" y="230" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Repeatedly active together</text><text x="680" y="258" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">a stronger connection</text><line x1="418" y1="170" x2="482" y2="170" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><text x="450" y="154" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">practice</text><rect x="30" y="302" width="411" height="134" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="335" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CELL ASSEMBLIES</text><text x="50" y="361.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Strengthened connections form groups</text><text x="50" y="389.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Learning a skill or a fact physically changes the</text><text x="50" y="410.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">brain.</text><rect x="459" y="302" width="411" height="134" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="479" y="334" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">WHY PRACTICE WORKS</text><text x="479" y="360.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Frequently used pathways become more</text><text x="479" y="383.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">efficient</text><text x="479" y="411.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The foundation for the idea of brain plasticity.</text>
</svg>