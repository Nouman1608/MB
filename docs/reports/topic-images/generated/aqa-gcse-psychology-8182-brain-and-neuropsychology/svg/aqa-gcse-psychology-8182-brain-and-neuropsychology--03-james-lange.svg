<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 574" width="900" height="574" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="574" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The James-Lange theory of emotion</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Which comes first: the feeling or the body's reaction?</text>
<text x="30" y="138" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">COMMON SENSE</text><rect x="30" y="148" width="246.66666666666666" height="60" rx="14" fill="#eef1f0" stroke="#c9d6d4" stroke-width="2.5"/><text x="153.33333333333331" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">See a bear</text><line x1="282.66666666666663" y1="178" x2="320.66666666666663" y2="178" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="326.66666666666663" y="148" width="246.66666666666666" height="60" rx="14" fill="#eef1f0" stroke="#c9d6d4" stroke-width="2.5"/><text x="449.99999999999994" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Feel afraid</text><line x1="579.3333333333333" y1="178" x2="617.3333333333333" y2="178" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="623.3333333333333" y="148" width="246.66666666666666" height="60" rx="14" fill="#eef1f0" stroke="#c9d6d4" stroke-width="2.5"/><text x="746.6666666666666" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Heart races</text><text x="30" y="244" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="start">JAMES-LANGE: bodily change comes first</text><rect x="30" y="254" width="246.66666666666666" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="153.33333333333331" y="302.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">See a bear</text><line x1="282.66666666666663" y1="298" x2="320.66666666666663" y2="298" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="326.66666666666663" y="254" width="246.66666666666666" height="88" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="449.99999999999994" y="288.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Body reacts</text><text x="449.99999999999994" y="317.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">heart races</text><line x1="579.3333333333333" y1="298" x2="617.3333333333333" y2="298" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="623.3333333333333" y="254" width="246.66666666666666" height="88" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="746.6666666666666" y="290.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Interpret the change</text><text x="746.6666666666666" y="314.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">as fear</text><text x="450" y="378.4" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">The emotion <tspan font-weight="700">is</tspan> the perception of the physical change: no physical change, no emotion.</text><rect x="30" y="410" width="270.6666666666667" height="132" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="442" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SUPPORTS</text><text x="50" y="468.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">A jolt of panic</text><text x="50" y="496.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">felt a moment after a near</text><text x="50" y="517.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">miss while driving</text><rect x="314.6666666666667" y="410" width="270.6666666666667" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="334.6666666666667" y="442" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">CHALLENGES</text><text x="334.6666666666667" y="468.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Similar bodily changes</text><text x="334.6666666666667" y="496.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">a racing heart comes with</text><text x="334.6666666666667" y="517.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">fear, excitement or anger</text><rect x="599.3333333333334" y="410" width="270.6666666666667" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="619.3333333333334" y="442" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">CHALLENGES</text><text x="619.3333333333334" y="468.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Spinal cord injuries</text><text x="619.3333333333334" y="496.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">reduced bodily feedback, yet</text><text x="619.3333333333334" y="517.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">people still report emotions</text>
</svg>