<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 605" width="900" height="605" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="605" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The fight-or-flight response</text>

<rect x="30" y="100" width="250.66666666666666" height="157" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="155.33333333333331" y="144" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">1</text><text x="155.33333333333331" y="170.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Threat perceived</text><text x="155.33333333333331" y="199.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">A bear, or a modern</text><text x="155.33333333333331" y="220.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">stressor such as an exam</text><line x1="286.66666666666663" y1="178.5" x2="318.66666666666663" y2="178.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="324.66666666666663" y="100" width="250.66666666666666" height="157" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="449.99999999999994" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">2</text><text x="449.99999999999994" y="158.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Sympathetic branch</text><text x="449.99999999999994" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">activated</text><text x="449.99999999999994" y="211.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Part of the autonomic</text><text x="449.99999999999994" y="232.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">nervous system</text><line x1="581.3333333333333" y1="178.5" x2="613.3333333333333" y2="178.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="619.3333333333333" y="100" width="250.66666666666666" height="157" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="744.6666666666666" y="156.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">3</text><text x="744.6666666666666" y="183.32" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Adrenal glands</text><text x="744.6666666666666" y="207.32" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">release adrenaline</text><line x1="740" y1="263" x2="740" y2="285" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="291" width="840" height="91" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="450" y="323" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">BODY READY TO FIGHT OR RUN</text><text x="450" y="356.4" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">Heart rate ↑ · Breathing rate ↑ · Pupils dilate · Blood diverted to muscles · Digestion slows</text><path d="M450,386 L450,412" fill="none" stroke="#2e6b62" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahT)"/><rect x="30" y="418" width="411" height="155" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="461.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">THREAT PASSES</text><text x="50" y="487.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Parasympathetic branch</text><text x="50" y="516.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Returns the body to its resting state: "rest and</text><text x="50" y="537.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">digest"</text><rect x="459" y="418" width="411" height="155" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="479" y="450" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">EVALUATION</text><text x="479" y="476.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Useful for ancestors facing physical</text><text x="479" y="499.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">danger</text><text x="479" y="527.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Unhelpful for modern stressors such as exams,</text><text x="479" y="548.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">where fighting or running does not help</text>
</svg>