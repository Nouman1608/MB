<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 837" width="900" height="837" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="837" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Scanning the brain: structure or activity?</text>

<clipPath id="tc100"><rect x="30" y="100" width="840" height="252" rx="14"/></clipPath><g clip-path="url(#tc100)"><rect x="30" y="100" width="114.54545454545453" height="48" fill="#b5d3cf"/><text x="44" y="127.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Scan</text><rect x="144.54545454545453" y="100" width="267.27272727272725" height="48" fill="#b5d3cf"/><text x="158.54545454545453" y="127.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">How it works</text><rect x="411.81818181818176" y="100" width="152.72727272727272" height="48" fill="#f2e7b8"/><text x="425.81818181818176" y="127.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Shows</text><rect x="564.5454545454545" y="100" width="305.45454545454544" height="48" fill="#b5d3cf"/><text x="578.5454545454545" y="127.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Points to note</text><rect x="30" y="148" width="114.54545454545453" height="68" fill="#dce9e7"/><text x="44" y="174.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">CT</text><rect x="144.54545454545453" y="148" width="267.27272727272725" height="68" fill="#ffffff"/><text x="158.54545454545453" y="174.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Many X-ray images combined</text><rect x="411.81818181818176" y="148" width="152.72727272727272" height="68" fill="#dce9e7"/><text x="425.81818181818176" y="174.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Structure</text><rect x="564.5454545454545" y="148" width="305.45454545454544" height="68" fill="#ffffff"/><text x="578.5454545454545" y="174.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Quick; detects damage such as</text><text x="578.5454545454545" y="195.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">tumours or bleeding; uses radiation</text><line x1="30" y1="216" x2="870" y2="216" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="216" width="114.54545454545453" height="68" fill="#dce9e7"/><text x="44" y="242.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">PET</text><rect x="144.54545454545453" y="216" width="267.27272727272725" height="68" fill="#f8faf9"/><text x="158.54545454545453" y="242.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A radioactive tracer is injected;</text><text x="158.54545454545453" y="263.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">active areas use more of it</text><rect x="411.81818181818176" y="216" width="152.72727272727272" height="68" fill="#f2e7b8"/><text x="425.81818181818176" y="242.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Activity</text><rect x="564.5454545454545" y="216" width="305.45454545454544" height="68" fill="#f8faf9"/><text x="578.5454545454545" y="242.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Shows function; involves</text><text x="578.5454545454545" y="263.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">radioactivity</text><line x1="30" y1="284" x2="870" y2="284" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="284" width="114.54545454545453" height="68" fill="#dce9e7"/><text x="44" y="310.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">fMRI</text><rect x="144.54545454545453" y="284" width="267.27272727272725" height="68" fill="#ffffff"/><text x="158.54545454545453" y="310.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Detects changes in blood</text><text x="158.54545454545453" y="331.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">oxygen</text><rect x="411.81818181818176" y="284" width="152.72727272727272" height="68" fill="#f2e7b8"/><text x="425.81818181818176" y="310.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Activity</text><rect x="564.5454545454545" y="284" width="305.45454545454544" height="68" fill="#ffffff"/><text x="578.5454545454545" y="310.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">No radiation; detailed images; lie still</text><text x="578.5454545454545" y="331.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">in a noisy scanner</text></g><line x1="144.54545454545453" y1="100" x2="144.54545454545453" y2="352" stroke="#c9d6d4" stroke-width="1.5"/><line x1="411.81818181818176" y1="100" x2="411.81818181818176" y2="352" stroke="#c9d6d4" stroke-width="1.5"/><line x1="564.5454545454545" y1="100" x2="564.5454545454545" y2="352" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="100" width="840" height="252" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/><text x="30" y="392" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">TULVING'S 'GOLD' MEMORY STUDY (1989)</text><clipPath id="bc40414"><ellipse cx="201.2" cy="516.3" rx="155" ry="102.3"/></clipPath><g clip-path="url(#bc40414)"><polygon points="40,414 219.8,414 202.44,531.8 83.4,551.64 40,551.64" fill="#d4b02e"/><polygon points="219.8,414 312.8,414 299.16,525.6 202.44,531.8" fill="#ffffff"/><polygon points="312.8,414 362.4,414 362.4,624.8 288,624.8 299.16,525.6" fill="#b5d3cf"/><polygon points="40,551.64 83.4,551.64 202.44,531.8 299.16,525.6 288,624.8 40,624.8" fill="#ffffff"/><polyline points="219.8,414 202.44,531.8" fill="none" stroke="#1e2a44" stroke-width="2.5"/><polyline points="312.8,414 299.16,525.6 288,624.8" fill="none" stroke="#1e2a44" stroke-width="2.5"/><polyline points="40,551.64 83.4,551.64 202.44,531.8 299.16,525.6" fill="none" stroke="#1e2a44" stroke-width="2.5"/></g><ellipse cx="201.2" cy="516.3" rx="155" ry="102.3" fill="none" stroke="#1e2a44" stroke-width="3"/><rect x="66.61250000000001" y="636" width="131.055" height="29" rx="14.5" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="132.14000000000001" y="655.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">episodic: front</text><rect x="207.66750000000002" y="636" width="135.72" height="29" rx="14.5" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="275.52750000000003" y="655.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">semantic: back</text><rect x="380" y="404" width="490" height="149" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="396" y="432.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Episodic</tspan> memories (personal experiences): more blood flow</text><text x="396" y="453.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">in the <tspan font-weight="700" fill="#1e2a44">frontal</tspan> cortex.</text><text x="396" y="482.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Semantic</tspan> memories (facts): more in the <tspan font-weight="700" fill="#1e2a44">back</tspan> of the cortex.</text><text x="396" y="511.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Different types of long-term memory are localised in</text><text x="396" y="532.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">different areas.</text><rect x="30" y="696" width="840" height="109" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="730.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Evaluation</text><text x="50" y="759.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Biological evidence that episodic and semantic memory differ. But the sample was tiny and included</text><text x="50" y="780.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Tulving, who knew what was being tested; results were not consistent for every participant.</text>
</svg>