or="middle">Temporal</text><text x="481" y="466.3" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Cerebellum</text><path d="M344.5,166 C517.25,166 550,144 602,144" fill="none" stroke="#1e2a44" stroke-width="1.6"/><circle cx="344.5" cy="166" r="4" fill="#1e2a44"/><text x="610" y="148" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="start">Somatosensory area</text><text x="610" y="170" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">touch, temperature, pain (parietal</text><text x="610" y="188" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">lobe)</text><path d="M318.25,187 C504.125,187 550,228 602,228" fill="none" stroke="#1e2a44" stroke-width="1.6"/><circle cx="318.25" cy="187" r="4" fill="#1e2a44"/><text x="610" y="232" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Motor area</text><text x="610" y="254" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">voluntary movement (frontal lobe)</text><path d="M541.9000000000001,281.5 C615.95,281.5 550,312 602,312" fill="none" stroke="#1e2a44" stroke-width="1.6"/><circle cx="541.9000000000001" cy="281.5" r="4" fill="#1e2a44"/><text x="610" y="316" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Visual area</text><text x="610" y="338" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">(occipital lobe)</text><path d="M402.25,349.75 C546.125,349.75 550,396 602,396" fill="none" stroke="#1e2a44" stroke-width="1.6"/><circle cx="402.25" cy="349.75" r="4" fill="#1e2a44"/><text x="610" y="400" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="start">Wernicke's area</text><text x="610" y="422" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">understanding language (temporal,</text><text x="610" y="440" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">usually left)</text><path d="M223.75,326.65 C223.75,504 80,484 80,522" fill="none" stroke="#1e2a44" stroke-width="1.6"/><circle cx="223.75" cy="326.65" r="4" fill="#1e2a44"/><text x="40" y="540" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="start">Broca's area</text><text x="40" y="562" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">speech production (frontal, usually left)</text><path d="M323.5,357.1 C323.5,504 440,484 440,522" fill="none" stroke="#1e2a44" stroke-width="1.6"/><circle cx="323.5" cy="357.1" r="4" fill="#1e2a44"/><text x="400" y="540" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Auditory area</text><text x="400" y="562" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">(temporal lobe)</text><rect x="30" y="590" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="624.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Each side controls the opposite side</text><text x="50" y="654.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The motor and somatosensory areas in one hemisphere control and receive sensation from the</text><text x="50" y="676.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">opposite side of the body. The cerebellum co-ordinates balance and movement.</text>
